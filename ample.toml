# ample.toml — this app's infrastructure contract (generated by `ample plan --write`).
# Secrets never belong here: declare them `KEY = { secret = true }` and pass values with --env/--env-file.
version = 1
project = "academy"

[services.academy]
path = "."
public = true
build = "pnpm run build"
start = "pnpm start"
health_path = "/api/health"

[services.academy.env]
DATABASE_URL = { database = "main" }
ACADEMY_PASSWORD = { secret = true }

[databases.main]
engine = "postgres"
