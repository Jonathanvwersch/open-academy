concept: supervised-learning
version: 3
sources: [{ id: fixture-notes, section: "Chapter 1" }]
objective: |
  **Goal:** identify the inputs, targets, model, loss and training data in any supervised problem, and explain why training means making the average loss small.
where_this_fits: |
  Many useful tasks start with examples whose correct answers are already known: past house sales, labelled photos, or recorded delivery times. Writing a separate rule for every new case does not scale, and memorizing the examples will not handle new ones. Supervised learning uses those input-answer pairs to fit a model, then measures its mistakes with a loss. Training adjusts the model so that its average loss on examples becomes small and predictions work on unseen cases.
knowledge_points:
  - id: sl-inputs-targets
    title: Inputs, targets and the model
    explain: |
      Supervised learning means learning to predict an answer from examples where the answer is already known. Say you want to guess what a house will sell for. You don't write the rule yourself. You collect past sales, each with the house's details and the price it actually sold for, and let the computer find a rule that fits them.

      Every supervised problem has the same five ingredients:

      1. **Inputs** $x$: what you know when you make the prediction (the house's size and number of bedrooms).
      2. **Target** $y$: the answer you want to predict (the sale price).
      3. **Model** $f_\theta$: a rule that turns inputs into a prediction. It has adjustable settings called **parameters**, written $\theta$ ("theta").
      4. **Loss** $L$: a number that says how wrong a prediction is.
      5. **Dataset**: the past examples, each one an $(x, y)$ pair.

      The rest of this lesson goes through them in order, using house prices.

      **Why this is useful.** Naming the pieces shows what training can change and what it learns from.
    worked: |
      This example shows that a model is a rule with adjustable settings, and different settings give different predictions.

      A simple model for house prices (in thousands) is a line:

      $$\hat y = w_1 \cdot \text{size} + w_2 \cdot \text{bedrooms} + b$$

      The hat on $\hat y$ means "predicted price", to tell it apart from the true price $y$. The numbers $w_1$, $w_2$ and $b$ are the parameters $\theta$. Changing them changes every prediction:

      - **Setting A:** $w_1 = 3,\ w_2 = 10,\ b = 50$. A 100 m², 2-bedroom house gets $3\cdot100 + 10\cdot2 + 50 = 370$.
      - **Setting B:** $w_1 = 2,\ w_2 = 20,\ b = 100$. The same house gets $2\cdot100 + 20\cdot2 + 100 = 340$.

      Training means choosing the setting. To choose, we need a way to say which one is better.
    problems:
      [sl-inputs-targets-basics, slp-predict, slp-predict-variant, slp-input-target, slp-parameters]
  - id: sl-measuring-error
    title: "Measuring how wrong: squared error"
    explain: |
      **Why not just average the errors?** Errors that are too high and too low can cancel each other out, making a model look perfect even when it gets every house wrong.

      **Square each error instead.** Squares are never negative, so nothing cancels, and big misses count more than small ones. This is the **squared-error loss**: $(\hat y - y)^2$.

      **Why this is useful.** A nonnegative error lets us compare how well settings price the same houses.
    worked: |
      This example shows why signed errors can cancel and how squaring prevents it.

      Three past sales:

      | house | size (m²) | bedrooms | sold for $y$ | Setting A predicts | error |
      |---|---|---|---|---|---|
      | 1 | 100 | 2 | 360 | 370 | +10 |
      | 2 | 80 | 1 | 290 | 300 | +10 |
      | 3 | 150 | 4 | 560 | 540 | −20 |

      The errors add up to $10 + 10 - 20 = 0$, even though every prediction is wrong.

      Squaring gives $10^2 = 100$, $10^2 = 100$, and $(-20)^2 = 400$. The squared errors are all positive, so they do not cancel.
    problems: [sl-measuring-error-basics, slp-squared-error, slp-error-sum, slp-why-square]
  - id: sl-training-loss
    title: Training chooses the smallest average loss
    explain: |
      **Average over the houses.** One house can be lucky or unlucky, so we judge a setting by its average loss over all the sales. The average squared error is called **mean squared error (MSE)**.

      The worked example is exactly what the standard formula says. Here it is, one piece at a time.

      **The loss on one house.** House number $i$ has inputs $x_i$ and true price $y_i$. The subscript $i$ identifies which house we mean. The model predicts $f_\theta(x_i)$, and the loss $L\big(f_\theta(x_i), y_i\big)$ says how wrong that is. With squared error it is $\big(f_\theta(x_i) - y_i\big)^2$.

      Add up the loss for all $n$ houses and divide by $n$:

      $$\frac{1}{n}\sum_{i=1}^{n} L\big(f_\theta(x_i), y_i\big)$$

      The symbol $\sum_{i=1}^{n}$ means "add this up for $i = 1, 2, \dots, n$". In the worked example $n = 3$.

      Training searches for the $\theta$ with the smallest average loss:

      $$\theta^\star = \arg\min_\theta \frac{1}{n}\sum_{i=1}^{n} L\big(f_\theta(x_i), y_i\big)$$

      Read $\arg\min_\theta$ as "the $\theta$ that makes what follows as small as possible", and $\theta^\star$ ("theta star") as "the best parameters". The gradient descent lesson shows how training searches through all of them automatically.

      **Why this is useful.** The average gives training one score for comparing parameter settings across all sales.
    worked: |
      This example shows a comparison of two settings by their average squared error.

      | house | Setting A: squared error | Setting B predicts | Setting B: squared error |
      |---|---|---|---|
      | 1 | $10^2 = 100$ | 340 | $(-20)^2 = 400$ |
      | 2 | $10^2 = 100$ | 280 | $(-10)^2 = 100$ |
      | 3 | $(-20)^2 = 400$ | 480 | $(-80)^2 = 6400$ |
      | **average** | **200** | | **2300** |

      Setting A averages 200 and Setting B averages 2300, so Setting A fits these sales much better.
    problems: [sl-training-loss-basics, slp-average-mse, slp-argmin, slp-best-setting]
  - id: sl-new-data-targets
    title: New houses and two kinds of target
    explain: |
      **The real goal is new houses.** A low average loss on past sales is only a means to an end. What you actually want is good prices for houses the model has never seen. A model can fit its training sales well and still price new houses badly, so we always test it on sales it didn't train on. The train/validation/test lesson covers how.

      **Two kinds of target.** When the target $y$ is a number, like a price, the problem is called **regression**. When $y$ is a category, like "spam" or "not spam", it is called **classification**. The five ingredients are the same either way. What changes is the loss, because "how wrong" means something different for a category than for a number.

      Robots use the same setup. In learning from demonstrations, the input is what the robot's camera sees and the target is the action a human took.

      **Why this is useful.** Testing on unseen houses checks whether the learned rule generalizes beyond its training sales.
    worked: |
      This example shows how target types determine whether a problem is regression or classification.

      A house's sale price is a number, so predicting it is regression.

      A parcel's delivery status—today or tomorrow—is a category, so predicting it is classification.

      A robot's action—"grasp" or "release"—is also a category, so predicting it is classification.
    problems:
      - sl-new-data-targets-basics
      - slp-new-houses
      - slp-regression-classification
      - slp-target-type-travel
      - slp-target-type-parcel
      - slp-low-training-loss
final: sl-explain-setup
summary: |
  - Five ingredients: inputs $x$, target $y$, a model $f_\theta$ with parameters $\theta$, a loss $L$, and a dataset of $(x, y)$ pairs.
  - The loss turns "how wrong" into a number. Squaring stops errors that are too high and too low from cancelling out.
  - Training picks the parameters with the smallest average loss on the training data, but what matters is performance on new data.

  **Next:** supervised learning frames prediction tasks across classification and regression.
