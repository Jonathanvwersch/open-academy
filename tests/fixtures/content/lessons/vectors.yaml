concept: vectors
version: 2
objective: Compute vector magnitudes and explain dot products.
where_this_fits: |
  A robot, image, or model may need to track several measurements together, such as position, color, or features. Treating each number separately hides their relationships and makes calculations repetitive. A vector stores the coordinates as one object, so its length and operations can summarize the quantity or compare it with another. This makes vectors a practical language for data with many components and prepares you to understand matrix operations and model inputs.
knowledge_points:
  - id: vectors-fixture-1
    title: Vector magnitude
    explain: |
      A vector is an ordered list of coordinates, and its magnitude is its length.

      **Why this is useful.** A single length helps compare the size of different measurement lists.
