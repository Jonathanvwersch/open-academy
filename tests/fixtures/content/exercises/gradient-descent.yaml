concept: gradient-descent
exercises:
  - id: gradient-descent-fixture-1-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: Which statement best describes the main idea in this step?
    hints: []
    solution: The main idea of this step is Update a parameter.
    options:
      - id: a
        text: The main idea of this step is Update a parameter.
        correct: true
        feedback: This states the main idea of the knowledge point.
      - id: b
        text: It is a rule for splitting examples into training and test sets.
        correct: false
        feedback: That describes a data-splitting step instead.
      - id: c
        text: It is a parameter update that subtracts a scaled loss gradient.
        correct: false
        feedback: That describes gradient descent instead.
      - id: d
        text: It is an output score that measures prediction error.
        correct: false
        feedback: That describes a loss value instead.
  - id: gradient-descent-fixture-2-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: Which statement best describes the main idea in this step?
    hints: []
    solution: The main idea of this step is Use the learning rate.
    options:
      - id: a
        text: The main idea of this step is Use the learning rate.
        correct: true
        feedback: This states the main idea of the knowledge point.
      - id: b
        text: It is a rule for splitting examples into training and test sets.
        correct: false
        feedback: That describes a data-splitting step instead.
      - id: c
        text: It is a parameter update that subtracts a scaled loss gradient.
        correct: false
        feedback: That describes gradient descent instead.
      - id: d
        text: It is an output score that measures prediction error.
        correct: false
        feedback: That describes a loss value instead.
  - id: dx-gradient-descent
    dimension: implementation
    type: debug
    role: diagnostic
    difficulty: 3
    est_minutes: 4
    prompt: "Find the incorrect update line and choose the fix."
    code: "w = 1.0\\neta = 0.1\\ngradient = 2.0\\nw = w + eta * gradient"
    hints: []
    solution: "Line 4 should subtract the gradient."
    buggy_line: 4
    fix_options:
      - { id: subtract-gradient, text: "w = w - eta * gradient", correct: true }
      - { id: multiply-by-gradient, text: "w = w * eta * gradient", correct: false }
  - id: gradient-descent-step
    dimension: math
    type: expression
    role: core
    difficulty: 3
    est_minutes: 4
    prompt: "Write the updated weight after one gradient step."
    hints: ["Move opposite the gradient."]
    solution: "The update is $w-\\eta g$."
    answer: "w-eta*g"
    variables: { w: [-3, 3], eta: [0.01, 1], g: [-3, 3] }
  - id: gradient-descent-transfer
    dimension: transfer
    type: code_complete
    role: transfer
    difficulty: 4
    est_minutes: 4
    prompt: "Complete a gradient update."
    code: "weight = weight ____ learning_rate * gradient"
    hints: []
    solution: "Subtract the gradient-scaled learning rate."
    accept: ["-"]
  - id: gradient-descent-fixture-review
    dimension: implementation
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "In `w = w - eta * grad_w`, what does `grad_w` represent?"
    options:
      - { id: a, text: "The loss gradient with respect to w", correct: true }
      - {
          id: b,
          text: "The current learning rate",
          correct: false,
          feedback: "The learning rate is eta.",
        }
      - {
          id: c,
          text: "The current value of w",
          correct: false,
          feedback: "The current parameter value is w.",
        }
      - {
          id: d,
          text: "The target value for w",
          correct: false,
          feedback: "The gradient comes from the loss, not a target parameter.",
        }
    solution: "The gradient measures how the loss changes as w changes. The update subtracts a scaled gradient to reduce the loss."
