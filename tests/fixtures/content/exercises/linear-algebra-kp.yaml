  - id: linear-algebra-fixture-final
    dimension: conceptual
    type: explain
    role: core
    difficulty: 1
    est_minutes: 2
    prompt: Explain a matrix-vector product.
    hints: []
    rubric:
      - { id: rows, criterion: Relates output entries to matrix rows, weight: 1, required: true }
    exemplar: Matrix-vector multiplication combines each matrix row with the vector.
    solution: Each output entry is the dot product of one matrix row with the vector.
