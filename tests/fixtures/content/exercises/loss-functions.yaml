concept: loss-functions
exercises:
  - id: loss-functions-fixture-1-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: Which statement best describes the main idea in this step?
    hints: []
    solution: The main idea of this step is Calculate a loss.
    options:
      - id: a
        text: The main idea of this step is Calculate a loss.
        correct: true
        feedback: This states the main idea of the knowledge point.
      - id: b
        text: It is a rule for splitting examples into training and test sets.
        correct: false
        feedback: That describes a data-splitting step instead.
      - id: c
        text: It is a parameter update that subtracts a scaled loss gradient.
        correct: false
        feedback: That describes gradient descent instead.
      - id: d
        text: It is an output score that measures prediction error.
        correct: false
        feedback: That describes a loss value instead.
  - id: loss-functions-fixture-2-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: Which statement best describes the main idea in this step?
    hints: []
    solution: The main idea of this step is Average losses.
    options:
      - id: a
        text: The main idea of this step is Average losses.
        correct: true
        feedback: This states the main idea of the knowledge point.
      - id: b
        text: It is a rule for splitting examples into training and test sets.
        correct: false
        feedback: That describes a data-splitting step instead.
      - id: c
        text: It is a parameter update that subtracts a scaled loss gradient.
        correct: false
        feedback: That describes gradient descent instead.
      - id: d
        text: It is an output score that measures prediction error.
        correct: false
        feedback: That describes a loss value instead.
  - id: dx-loss-functions
    dimension: math
    type: expression
    role: diagnostic
    difficulty: 2
    est_minutes: 3
    prompt: "For one prediction, write squared error when the target is y."
    hints: []
    solution: "Squared error is $(p-y)^2$."
    answer: "(p-y)^2"
    variables: { p: [-3, 3], y: [-3, 3] }
  - id: loss-functions-mse
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "For errors $1$ and $3$, what is the mean squared error?"
    hints: ["Square each error, then average."]
    solution: "The mean is $(1+9)/2=5$."
    answer: 5
    tolerance: { abs: 0.000001 }
  - id: loss-functions-text
    dimension: conceptual
    type: text
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "What does a loss function quantify?"
    hints: []
    solution: "It quantifies how poorly model predictions match targets."
    accept: ["prediction error", "how wrong predictions are"]
