concept: gradients
exercises:
  - id: gradients-fixture-1-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: Which statement best describes the main idea of this concept?
    hints: []
    solution: The main idea of this step is Read a gradient.
    options:
      - id: a
        text: The main idea of this step is Read a gradient.
        correct: true
        feedback: This states the main idea of the knowledge point.
      - id: b
        text: It is a rule for splitting examples into training and test sets.
        correct: false
        feedback: That describes a data-splitting step instead.
      - id: c
        text: It is a parameter update that subtracts a scaled loss gradient.
        correct: false
        feedback: That describes gradient descent instead.
      - id: d
        text: It is an output score that measures prediction error.
        correct: false
        feedback: That describes a loss value instead.
  - id: gradients-fixture-2-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: Which statement best describes the main idea of this concept?
    hints: []
    solution: The main idea of this step is Use the gradient.
    options:
      - id: a
        text: The main idea of this step is Use the gradient.
        correct: true
        feedback: This states the main idea of the knowledge point.
      - id: b
        text: It is a rule for splitting examples into training and test sets.
        correct: false
        feedback: That describes a data-splitting step instead.
      - id: c
        text: It is a parameter update that subtracts a scaled loss gradient.
        correct: false
        feedback: That describes gradient descent instead.
      - id: d
        text: It is an output score that measures prediction error.
        correct: false
