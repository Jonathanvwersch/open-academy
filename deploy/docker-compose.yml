services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: academy
    volumes:
      - academy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://academy:academy@db:5432/academy
      PORT: "3001"
      # Pass secrets from the invoking environment; production validates the password.
      ACADEMY_PASSWORD:
      OPENAI_API_KEY:
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-6.1-terra}"
      TUTOR_DAILY_CALL_CAP: "${TUTOR_DAILY_CALL_CAP:-200}"
      ACADEMY_DEMO: "${ACADEMY_DEMO:-0}"
      ACADEMY_DEMO_TTL_HOURS: "${ACADEMY_DEMO_TTL_HOURS:-24}"
      # Uncomment with the volume below to use a mounted pack.
      # CONTENT_DIR: /pack
    ports:
      - "3000:3001"
    # volumes:
    #   - ../my-pack:/pack:ro

volumes:
  academy-postgres-data:
