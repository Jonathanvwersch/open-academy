metrics:
  - { id: mean_error, label: "Fitted mean error (cm)", threshold: 0.5, direction: below }
  - {
      id: sigma_error,
      label: "Fitted standard deviation error (cm)",
      threshold: 0.3,
      direction: below,
    }
  - {
      id: held_out_log_likelihood,
      label: "Held-out average log-likelihood",
      threshold: -2.25,
      direction: above,
    }
reflection: [lab-gauss-front-factor, lab-gauss-held-out-gap, lab-gauss-forecast-gap]
follow_up:
  - "Replace one training reading with a misfire of 150 cm and refit. Watch how far the mean and the standard deviation move."
  - "Fit with only 5, 20 and 100 training readings and compare how close each fit gets to 100 cm and 2 cm."
  - "Compute the KL divergence of each bell's forecast from the held-out bins and check that it ranks the bells the same way as cross-entropy."
