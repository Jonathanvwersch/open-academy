schedule: { mon: 60, tue: 60, wed: 60, thu: 60, fri: 60, sat: 300, sun: 60 }
subjects:
  - { id: mathematics, title: Mathematics }
  - { id: ai, title: AI }
  - { id: robotics, title: Robotics }
domains:
  - {
      id: math,
      title: Mathematics for ML,
      description: "Linear algebra, calculus and probability that ML actually uses.",
    }
  - {
      id: classical-ml,
      title: Classical machine learning,
      description: "Supervised learning, losses, optimisation and evaluation.",
    }
  - {
      id: deep-learning,
      title: Deep learning,
      description: "Neural networks, backpropagation and training practice.",
    }
  - {
      id: transformers,
      title: Transformers and LLMs,
      description: "Tokens, attention, transformer blocks and language-model training.",
    }
  - {
      id: inference,
      title: Inference,
      description: "A trained model is only useful if it runs fast enough. You'll learn what makes inference slow, from memory bandwidth to the KV cache, and the techniques serving systems use to speed it up: caching, quantisation, speculative decoding and batching, and how ML compilers turn a model into fast GPU kernels.",
    }
  - {
      id: vision,
      title: Computer vision,
      description: "Images, convolutions, vision encoders and vision-language models.",
    }
  - {
      id: robotics,
      title: Robotics foundations,
      description: "Frames, transforms, kinematics, control and perception.",
    }
  - {
      id: rl,
      title: Reinforcement learning,
      description: "MDPs, value functions, Q-learning and policy gradients.",
    }
  - {
      id: llm-post-training,
      title: Post-training LLMs,
      description: "Supervised fine-tuning, preference learning, RLHF, DPO and reinforcement learning with verifiable rewards.",
    }
  - {
      id: imitation,
      title: Imitation learning,
      description: "Demonstrations, behavioral cloning, distribution shift and evaluation.",
    }
  - {
      id: robot-learning,
      title: Modern robot learning,
      description: "Action chunking, diffusion policies, VLAs and robot data.",
    }
  - {
      id: research,
      title: Research and methodology,
      description: "Experimental design, statistics and reading papers.",
    }
courses:
  - ml-foundations
  - deep-learning
  - transformers-llms
  - llm-inference
  - reinforcement-learning
  - robotics
  - robot-learning
  - maths-for-ml
default_course: ml-foundations
subject:
  title: machine learning, AI and robotics
  tutor_context: The learner is a strong software engineer working towards understanding and building modern robot-learning systems.
goals:
  - {
      id: g-training,
      text: "Explain how modern ML models are trained",
      concepts:
        [supervised-learning, loss-functions, gradient-descent, sgd-minibatch, pytorch-basics],
    }
  - {
      id: g-optimization,
      text: "Understand loss functions, gradient descent, backpropagation and optimisation",
      concepts: [loss-functions, gradient-descent, backpropagation, momentum-adam],
    }
  - {
      id: g-architectures,
      text: "Explain major deep learning architectures",
      concepts: [mlp-forward-pass, convolutions, transformer-block],
    }
  - {
      id: g-transformer,
      text: "Understand transformers and implement a small one",
      concepts:
        [attention, multi-head-attention, transformer-block, causal-masking, autoregressive-lm],
    }
  - {
      id: g-llm-pipeline,
      text: "Understand the components of an LLM training pipeline",
      concepts: [tokenization, pretraining, sft],
    }
  - {
      id: g-paradigms,
      text: "Understand supervised, imitation and reinforcement learning",
      concepts: [supervised-learning, behavioral-cloning, mdp, bc-vs-rl],
    }
  - {
      id: g-robotics-core,
      text: "Explain coordinate frames, kinematics, dynamics, control, observations and actions",
      concepts:
        [
          coordinate-frames,
          forward-kinematics,
          inverse-kinematics,
          dynamics-basics,
          pid-control,
          robot-state-observation-action,
        ],
    }
  - {
      id: g-vla,
      text: "Understand modern vision-language-action models",
      concepts: [vision-language-models, vla-models, robot-foundation-models],
    }
  - {
      id: g-robot-policies,
      text: "Understand behavioral cloning, action chunking, diffusion policies and demonstrations",
      concepts:
        [
          demonstrations,
          behavioral-cloning,
          action-chunking,
          diffusion-policies,
          distribution-shift,
        ],
    }
  - {
      id: g-build-eval,
      text: "Build and evaluate simple ML models",
      concepts:
        [linear-regression, train-test-split, evaluation-metrics, debugging-training, overfitting],
    }
  - {
      id: g-sim-policy,
      text: "Train a basic simulated robot policy",
      concepts: [simulation-for-rl, ppo, behavioral-cloning, policy-evaluation],
    }
  - {
      id: g-papers,
      text: "Read a modern paper, identify its contributions and limitations",
      concepts: [critical-evaluation, experimental-design],
    }
  - {
      id: g-conversations,
      text: "Hold technically informed conversations with ML and robotics researchers",
      concepts: [embodiment-gap, data-pipelines-robotics, failure-analysis, system-design-ml],
    }
