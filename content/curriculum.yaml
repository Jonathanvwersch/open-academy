schedule: { mon: 60, tue: 60, wed: 60, thu: 60, fri: 60, sat: 300, sun: 60 }
domains:
  - {
      id: math,
      title: Mathematics for ML,
      description: "Linear algebra, calculus and probability that ML actually uses.",
    }
  - {
      id: classical-ml,
      title: Classical machine learning,
      description: "Supervised learning, losses, optimisation and evaluation.",
    }
  - {
      id: deep-learning,
      title: Deep learning,
      description: "Neural networks, backpropagation and training practice.",
    }
  - {
      id: transformers,
      title: Transformers and LLMs,
      description: "Tokens, attention, transformer blocks and language-model training.",
    }
  - {
      id: inference,
      title: Inference,
      description: "A trained model is only useful if it runs fast enough. You'll learn what makes inference slow, from memory bandwidth to the KV cache, and the techniques serving systems use to speed it up: caching, quantisation, speculative decoding and batching.",
    }
  - {
      id: vision,
      title: Computer vision,
      description: "Images, convolutions, vision encoders and vision-language models.",
    }
  - {
      id: robotics,
      title: Robotics foundations,
      description: "Frames, transforms, kinematics, control and perception.",
    }
  - {
      id: rl,
      title: Reinforcement learning,
      description: "MDPs, value functions, Q-learning and policy gradients.",
    }
  - {
      id: llm-post-training,
      title: Post-training LLMs,
      description: "Supervised fine-tuning, preference learning, RLHF, DPO and reinforcement learning with verifiable rewards.",
    }
  - {
      id: imitation,
      title: Imitation learning,
      description: "Demonstrations, behavioral cloning, distribution shift and evaluation.",
    }
  - {
      id: robot-learning,
      title: Modern robot learning,
      description: "Action chunking, diffusion policies, VLAs and robot data.",
    }
  - {
      id: research,
      title: Research and methodology,
      description: "Experimental design, statistics and reading papers.",
    }
weeks:
  - {
      week: 1,
      title: ML fundamentals,
      project: linreg-numpy,
      intro: "You'll build the simplest model that learns: predicting a house's price from its measurements, trained on past sales. The maths topics are the tools this model needs, taught in the order it needs them.",
      concepts:
        [
          what-is-ml,
          supervised-learning,
          vectors,
          dot-product,
          matrices,
          linear-regression,
          derivatives,
          loss-functions,
          partial-derivatives,
          chain-rule,
          gradients,
          gradient-descent,
          train-test-split,
          reading-papers,
        ],
    }
  - {
      week: 2,
      title: Probability and classification,
      project: classifier-numpy,
      intro: "Probability as the language of uncertainty, and using it to classify: the Gaussian, maximum likelihood, logistic regression, cross-entropy and softmax, and how to measure a classifier.",
      concepts:
        [
          probability-basics,
          gaussian-distribution,
          maximum-likelihood,
          logistic-regression,
          information-theory,
          classification-softmax,
          evaluation-metrics,
          descriptive-statistics,
        ],
    }
  - {
      week: 3,
      title: Neural networks,
      project: nn-from-scratch,
      intro: "A straight-line model can't capture every pattern. You'll build a neural network from neurons and layers, and learn backpropagation, the method that trains every modern network.",
      concepts:
        [
          perceptron,
          activation-functions,
          mlp-forward-pass,
          computational-graphs,
          backpropagation,
          autodiff,
          pytorch-basics,
        ],
    }
  - {
      week: 4,
      title: Deep learning practice,
      project: image-classifier,
      intro: "Training deep networks that work: minibatches and Adam, initialisation and normalisation, overfitting and regularisation, debugging and fair experiments, then convolutional networks and autoencoders for images.",
      concepts:
        [
          sgd-minibatch,
          momentum-adam,
          weight-init-normalization,
          overfitting,
          regularization,
          generalization,
          debugging-training,
          experimental-design,
          images-as-tensors,
          convolutions,
          autoencoders,
        ],
    }
  - {
      week: 5,
      title: Transformers and LLMs,
      project: char-transformer,
      intro: "The model design behind ChatGPT and many robot models: tokens, embeddings and attention, built up into a small language model.",
      concepts:
        [
          tokenization,
          embeddings,
          attention,
          multi-head-attention,
          positional-encoding,
          transformer-block,
          causal-masking,
          autoregressive-lm,
          mixture-of-experts,
          pretraining,
        ],
    }
  - {
      week: 6,
      title: Inference,
      project: inference-engine,
      intro: "A trained model is only useful if it runs fast enough. You'll learn what makes inference slow, from memory bandwidth to the KV cache, and the techniques serving systems use to speed it up: caching, quantisation, speculative decoding and batching.",
      concepts:
        [
          inference-metrics,
          prefill-decode,
          arithmetic-intensity,
          gpu-inference-basics,
          kv-cache,
          fast-attention,
          quantization,
          speculative-decoding,
          llm-serving,
        ],
    }
  - {
      week: 7,
      title: Reinforcement learning,
      project: rl-sim,
      intro: "Learning by trial and error from rewards: decision problems, value functions, Q-learning, policy gradients and PPO, the algorithm behind RLHF.",
      concepts:
        [
          mdp,
          policies-returns,
          value-functions,
          q-learning,
          exploration,
          deep-q-learning,
          policy-gradients,
          ppo,
          reward-design,
          simulation-for-rl,
        ],
    }
  - {
      week: 8,
      title: Post-training LLMs,
      project: llm-post-training,
      intro: "Turning a pretrained language model into a useful assistant: supervised fine-tuning, learning rewards from human preferences, RLHF and DPO, and reinforcement learning on problems with checkable answers, the recipe behind reasoning models.",
      concepts:
        [
          sft,
          eigen-svd,
          lora,
          reward-models,
          rlhf,
          dpo,
          rl-verifiable-rewards,
          reward-hacking,
          llm-evaluation,
        ],
    }
  - {
      week: 9,
      title: Multimodal and generative models,
      project: generative-toy,
      intro: "Models that see and generate: vision transformers, CLIP, vision-language models and self-supervised JEPA, then diffusion and flow matching, which later generate robot actions and video.",
      concepts:
        [
          vision-encoders,
          image-text-alignment,
          jepa,
          vision-language-models,
          diffusion-models,
          flow-matching,
        ],
    }
  - {
      week: 10,
      title: Robotics foundations,
      project: planar-arm,
      intro: "How robots describe where things are: coordinate frames, rotations and transforms, then working out where an arm's hand is from its joint angles, and back.",
      concepts:
        [
          coordinate-frames,
          rotation-matrices,
          rigid-transforms,
          homogeneous-transforms,
          robot-joints,
          forward-kinematics,
          inverse-kinematics,
          motion-planning-basics,
        ],
    }
  - {
      week: 11,
      title: Robotics control and perception,
      project: control-sim,
      intro: "How a robot senses the world and acts on it: sensors, cameras, feedback control and basic dynamics.",
      concepts:
        [
          robot-state-observation-action,
          sensors,
          camera-geometry,
          pid-control,
          dynamics-basics,
          perception-pipelines,
        ],
    }
  - {
      week: 12,
      title: Imitation learning,
      project: bc-policy,
      intro: "Teaching a robot by showing it: action representations, learning a policy from demonstrations by state or by camera, why it breaks when the robot drifts off course, how to fix that, and how to measure success honestly.",
      concepts:
        [
          demonstrations,
          obs-action-datasets,
          action-representations,
          behavioral-cloning,
          distribution-shift,
          dagger,
          vision-conditioned-policies,
          policy-evaluation,
          statistical-evaluation,
          bc-vs-rl,
        ],
    }
  - {
      week: 13,
      title: Robot policies,
      project: chunking-policy,
      intro: "The policy designs behind today's robot learning: action chunking, diffusion and transformer policies, getting a policy trained in simulation to work on a real robot, and running it fast enough.",
      concepts:
        [
          action-chunking,
          diffusion-policies,
          transformer-policies,
          sim-to-real,
          robot-inference-latency,
        ],
    }
  - {
      week: 14,
      title: Robot foundation models and world models,
      project: robot-policy-finetune,
      intro: "Large pretrained robot models: vision-language-action models, their action heads and training data across many robots, and world models that predict what happens next, from model-based RL to video world models.",
      concepts:
        [
          vla-models,
          vla-action-heads,
          robot-foundation-models,
          embodiment-gap,
          world-models,
          video-world-models,
          world-action-models,
          landmark-robot-learning-papers,
        ],
    }
  - {
      week: 15,
      title: End-to-end robot learning and capstone,
      project: capstone,
      intro: "Running a robot-learning project properly from data to deployed policy: data pipelines, failure analysis, system design and judging results critically, in a full capstone.",
      concepts:
        [
          data-pipelines-robotics,
          failure-analysis,
          system-design-ml,
          critical-evaluation,
        ],
    }
goals:
  - {
      id: g-training,
      text: "Explain how modern ML models are trained",
      concepts:
        [supervised-learning, loss-functions, gradient-descent, sgd-minibatch, pytorch-basics],
    }
  - {
      id: g-optimization,
      text: "Understand loss functions, gradient descent, backpropagation and optimisation",
      concepts: [loss-functions, gradient-descent, backpropagation, momentum-adam],
    }
  - {
      id: g-architectures,
      text: "Explain major deep learning architectures",
      concepts: [mlp-forward-pass, convolutions, transformer-block],
    }
  - {
      id: g-transformer,
      text: "Understand transformers and implement a small one",
      concepts:
        [attention, multi-head-attention, transformer-block, causal-masking, autoregressive-lm],
    }
  - {
      id: g-llm-pipeline,
      text: "Understand the components of an LLM training pipeline",
      concepts: [tokenization, pretraining, sft],
    }
  - {
      id: g-paradigms,
      text: "Understand supervised, imitation and reinforcement learning",
      concepts: [supervised-learning, behavioral-cloning, mdp, bc-vs-rl],
    }
  - {
      id: g-robotics-core,
      text: "Explain coordinate frames, kinematics, dynamics, control, observations and actions",
      concepts:
        [
          coordinate-frames,
          forward-kinematics,
          inverse-kinematics,
          dynamics-basics,
          pid-control,
          robot-state-observation-action,
        ],
    }
  - {
      id: g-vla,
      text: "Understand modern vision-language-action models",
      concepts: [vision-language-models, vla-models, robot-foundation-models],
    }
  - {
      id: g-robot-policies,
      text: "Understand behavioral cloning, action chunking, diffusion policies and demonstrations",
      concepts:
        [
          demonstrations,
          behavioral-cloning,
          action-chunking,
          diffusion-policies,
          distribution-shift,
        ],
    }
  - {
      id: g-build-eval,
      text: "Build and evaluate simple ML models",
      concepts:
        [linear-regression, train-test-split, evaluation-metrics, debugging-training, overfitting],
    }
  - {
      id: g-sim-policy,
      text: "Train a basic simulated robot policy",
      concepts: [simulation-for-rl, ppo, behavioral-cloning, policy-evaluation],
    }
  - {
      id: g-papers,
      text: "Read a modern paper, identify its contributions and limitations",
      concepts: [reading-papers, critical-evaluation, experimental-design],
    }
  - {
      id: g-conversations,
      text: "Hold technically informed conversations with ML and robotics researchers",
      concepts: [embodiment-gap, data-pipelines-robotics, failure-analysis, system-design-ml],
    }
