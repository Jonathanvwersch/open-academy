schedule: { mon: 60, tue: 60, wed: 60, thu: 60, fri: 60, sat: 300, sun: 60 }
domains:
  - {
      id: math,
      title: Mathematics for ML,
      description: "Linear algebra, calculus and probability that ML actually uses.",
    }
  - {
      id: classical-ml,
      title: Classical machine learning,
      description: "Supervised learning, losses, optimisation and evaluation.",
    }
  - {
      id: deep-learning,
      title: Deep learning,
      description: "Neural networks, backpropagation and training practice.",
    }
  - {
      id: transformers,
      title: Transformers and LLMs,
      description: "Tokens, attention, transformer blocks and language-model training.",
    }
  - {
      id: vision,
      title: Computer vision,
      description: "Images, convolutions, vision encoders and vision-language models.",
    }
  - {
      id: robotics,
      title: Robotics foundations,
      description: "Frames, transforms, kinematics, control and perception.",
    }
  - {
      id: rl,
      title: Reinforcement learning,
      description: "MDPs, value functions, Q-learning and policy gradients.",
    }
  - {
      id: imitation,
      title: Imitation learning,
      description: "Demonstrations, behavioral cloning, distribution shift and evaluation.",
    }
  - {
      id: robot-learning,
      title: Modern robot learning,
      description: "Action chunking, diffusion policies, VLAs and robot data.",
    }
  - {
      id: research,
      title: Research and methodology,
      description: "Experimental design, statistics and reading papers.",
    }
weeks:
  - {
      week: 1,
      title: ML fundamentals,
      project: linreg-numpy,
      intro: "You'll build the simplest model that learns: predicting a house's price from its measurements, trained on past sales. The maths topics are the tools this model needs, taught in the order it needs them.",
      concepts:
        [
          what-is-ml,
          supervised-learning,
          vectors,
          dot-product,
          matrices,
          linear-regression,
          derivatives,
          loss-functions,
          partial-derivatives,
          gradients,
          gradient-descent,
          train-test-split,
          probability-basics,
        ],
    }
  - {
      week: 2,
      title: Neural networks,
      project: nn-from-scratch,
      intro: "A straight-line model can't capture every pattern. You'll build a neural network from neurons and layers, and learn backpropagation, the method that trains every modern network.",
      concepts:
        [
          perceptron,
          activation-functions,
          mlp-forward-pass,
          chain-rule,
          computational-graphs,
          backpropagation,
          autodiff,
          pytorch-basics,
          logistic-regression,
        ],
    }
  - {
      week: 3,
      title: Deep learning practice,
      project: image-classifier,
      intro: "Training real networks well: faster optimisers, avoiding overfitting, measuring results honestly, and recognising images with convolutional networks.",
      concepts:
        [
          sgd-minibatch,
          momentum-adam,
          overfitting,
          regularization,
          generalization,
          evaluation-metrics,
          descriptive-statistics,
          information-theory,
          classification-softmax,
          weight-init-normalization,
          debugging-training,
          images-as-tensors,
          convolutions,
          autoencoders,
          gaussian-distribution,
          maximum-likelihood,
        ],
    }
  - {
      week: 4,
      title: Transformers and LLMs,
      project: char-transformer,
      intro: "The model design behind ChatGPT and many robot models: tokens, embeddings and attention, built up into a small language model.",
      concepts:
        [
          tokenization,
          embeddings,
          attention,
          multi-head-attention,
          positional-encoding,
          transformer-block,
          causal-masking,
          autoregressive-lm,
          pretraining,
        ],
    }
  - {
      week: 5,
      title: Robotics foundations,
      project: planar-arm,
      intro: "How robots describe where things are: coordinate frames, rotations and transforms, then working out where an arm's hand is from its joint angles, and back.",
      concepts:
        [
          coordinate-frames,
          rotation-matrices,
          eigen-svd,
          rigid-transforms,
          homogeneous-transforms,
          robot-joints,
          forward-kinematics,
          inverse-kinematics,
          motion-planning-basics,
        ],
    }
  - {
      week: 6,
      title: Robotics control and perception,
      project: control-sim,
      intro: "How a robot senses the world and acts on it: sensors, cameras, feedback control and basic dynamics.",
      concepts:
        [
          robot-state-observation-action,
          sensors,
          camera-geometry,
          pid-control,
          dynamics-basics,
          perception-pipelines,
        ],
    }
  - {
      week: 7,
      title: Imitation learning,
      project: bc-policy,
      intro: "Teaching a robot by showing it: learning a policy from human demonstrations, why it breaks when the robot drifts off course, and how to fix that.",
      concepts:
        [
          demonstrations,
          obs-action-datasets,
          behavioral-cloning,
          distribution-shift,
          dagger,
          policy-evaluation,
        ],
    }
  - {
      week: 8,
      title: Reinforcement learning,
      project: rl-sim,
      intro: "Learning by trial and error from rewards instead of demonstrations: decision problems, value functions, Q-learning and policy gradients.",
      concepts:
        [
          mdp,
          policies-returns,
          value-functions,
          q-learning,
          exploration,
          policy-gradients,
          ppo,
          world-models,
          simulation-for-rl,
          reward-design,
          bc-vs-rl,
        ],
    }
  - {
      week: 9,
      title: Modern multimodal AI,
      project: vision-policy,
      intro: "Models that connect images and text, and how they let a robot act on what its camera sees.",
      concepts:
        [
          vision-encoders,
          image-text-alignment,
          jepa,
          vision-language-models,
          action-representations,
          vision-conditioned-policies,
          post-training,
        ],
    }
  - {
      week: 10,
      title: Advanced robot learning,
      project: chunking-policy,
      intro: "The methods behind current robot foundation models: action chunking, diffusion policies, transformer policies and vision-language-action models.",
      concepts:
        [
          action-chunking,
          diffusion-policies,
          flow-matching,
          transformer-policies,
          gpu-inference-basics,
          vla-models,
          vla-action-heads,
          robot-foundation-models,
          video-world-models,
          world-action-models,
          embodiment-gap,
          landmark-robot-learning-papers,
        ],
    }
  - {
      week: 11,
      title: End-to-end robot learning,
      project: capstone,
      intro: "Running a robot-learning project properly: data pipelines, evaluation, failure analysis and statistics.",
      concepts:
        [data-pipelines-robotics, failure-analysis, experimental-design, statistical-evaluation],
    }
  - {
      week: 12,
      title: Capstone and final assessment,
      project: capstone,
      intro: "Designing a complete ML system, reading research papers and judging models critically.",
      concepts: [system-design-ml, reading-papers, critical-evaluation],
    }
goals:
  - {
      id: g-training,
      text: "Explain how modern ML models are trained",
      concepts:
        [supervised-learning, loss-functions, gradient-descent, sgd-minibatch, pytorch-basics],
    }
  - {
      id: g-optimization,
      text: "Understand loss functions, gradient descent, backpropagation and optimisation",
      concepts: [loss-functions, gradient-descent, backpropagation, momentum-adam],
    }
  - {
      id: g-architectures,
      text: "Explain major deep learning architectures",
      concepts: [mlp-forward-pass, convolutions, transformer-block],
    }
  - {
      id: g-transformer,
      text: "Understand transformers and implement a small one",
      concepts:
        [attention, multi-head-attention, transformer-block, causal-masking, autoregressive-lm],
    }
  - {
      id: g-llm-pipeline,
      text: "Understand the components of an LLM training pipeline",
      concepts: [tokenization, pretraining, post-training],
    }
  - {
      id: g-paradigms,
      text: "Understand supervised, imitation and reinforcement learning",
      concepts: [supervised-learning, behavioral-cloning, mdp, bc-vs-rl],
    }
  - {
      id: g-robotics-core,
      text: "Explain coordinate frames, kinematics, dynamics, control, observations and actions",
      concepts:
        [
          coordinate-frames,
          forward-kinematics,
          inverse-kinematics,
          dynamics-basics,
          pid-control,
          robot-state-observation-action,
        ],
    }
  - {
      id: g-vla,
      text: "Understand modern vision-language-action models",
      concepts: [vision-language-models, vla-models, robot-foundation-models],
    }
  - {
      id: g-robot-policies,
      text: "Understand behavioral cloning, action chunking, diffusion policies and demonstrations",
      concepts:
        [
          demonstrations,
          behavioral-cloning,
          action-chunking,
          diffusion-policies,
          distribution-shift,
        ],
    }
  - {
      id: g-build-eval,
      text: "Build and evaluate simple ML models",
      concepts:
        [linear-regression, train-test-split, evaluation-metrics, debugging-training, overfitting],
    }
  - {
      id: g-sim-policy,
      text: "Train a basic simulated robot policy",
      concepts: [simulation-for-rl, ppo, behavioral-cloning, policy-evaluation],
    }
  - {
      id: g-papers,
      text: "Read a modern paper, identify its contributions and limitations",
      concepts: [reading-papers, critical-evaluation, experimental-design],
    }
  - {
      id: g-conversations,
      text: "Hold technically informed conversations with ML and robotics researchers",
      concepts: [embodiment-gap, data-pipelines-robotics, failure-analysis, system-design-ml],
    }
