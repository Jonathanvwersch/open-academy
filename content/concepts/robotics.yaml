domain: robotics
concepts:
  - {
      id: coordinate-frames,
      title: Coordinate frames,
      description: "World, base, end-effector and camera frames; expressing points in frames.",
      difficulty: 2,
      est_minutes: 25,
      week: 5,
      goal_weight: 3,
      dimensions: [conceptual, math],
      prereqs: [{ id: vectors }],
      objectives: [{ text: "Express a point in a different frame", dimension: math }],
      status: stub,
    }
  - {
      id: rigid-transforms,
      title: Rigid transformations,
      description: "Rotation plus translation; SE(2) and SE(3).",
      difficulty: 2,
      est_minutes: 30,
      week: 5,
      goal_weight: 3,
      dimensions: [conceptual, math],
      prereqs: [{ id: coordinate-frames }, { id: rotation-matrices }],
      objectives: [{ text: "Compose rigid transforms", dimension: math }],
      status: stub,
    }
  - {
      id: homogeneous-transforms,
      title: Homogeneous transforms,
      description: "4x4 matrices for composing rigid transforms.",
      difficulty: 3,
      est_minutes: 30,
      week: 5,
      goal_weight: 2,
      dimensions: [math, implementation],
      prereqs: [{ id: rigid-transforms }],
      objectives: [{ text: "Build and invert a homogeneous transform", dimension: math }],
      status: stub,
    }
  - {
      id: robot-joints,
      title: Robot joints and kinematic chains,
      description: "Revolute/prismatic joints, links, degrees of freedom.",
      difficulty: 2,
      est_minutes: 20,
      week: 5,
      goal_weight: 2,
      dimensions: [conceptual],
      prereqs: [{ id: coordinate-frames }],
      objectives: [{ text: "Count DoF and describe a kinematic chain", dimension: conceptual }],
      status: stub,
    }
  - {
      id: forward-kinematics,
      title: Forward kinematics,
      description: "Joint angles to end-effector pose.",
      difficulty: 3,
      est_minutes: 35,
      week: 5,
      goal_weight: 3,
      dimensions: [math, implementation],
      prereqs: [{ id: robot-joints }, { id: homogeneous-transforms }],
      objectives: [{ text: "Compute FK of a planar 2-link arm", dimension: math }],
      projects: [planar-arm],
      status: stub,
    }
  - {
      id: inverse-kinematics,
      title: Inverse kinematics,
      description: "Pose to joint angles; analytic and Jacobian-based IK.",
      difficulty: 4,
      est_minutes: 40,
      week: 5,
      goal_weight: 2,
      dimensions: [math, implementation],
      prereqs: [{ id: forward-kinematics }, { id: gradients }],
      objectives: [{ text: "Solve IK for a planar arm", dimension: math }],
      projects: [planar-arm],
      status: stub,
    }
  - {
      id: motion-planning-basics,
      title: Basic motion planning,
      description: "Configuration space, collision checking, interpolation and sampling-based planners.",
      difficulty: 3,
      est_minutes: 30,
      week: 5,
      goal_weight: 1,
      dimensions: [conceptual],
      prereqs: [{ id: forward-kinematics }],
      objectives: [{ text: "Explain configuration space", dimension: conceptual }],
      status: stub,
    }
  - {
      id: robot-state-observation-action,
      title: "States, observations and actions",
      description: "What a robot policy sees and outputs; proprioception vs exteroception; action spaces.",
      difficulty: 2,
      est_minutes: 25,
      week: 6,
      goal_weight: 3,
      dimensions: [conceptual, transfer],
      prereqs: [{ id: robot-joints }],
      objectives:
        [{ text: "Specify observation and action spaces for a task", dimension: transfer }],
      status: stub,
    }
  - {
      id: sensors,
      title: Robot sensors,
      description: "Encoders, IMUs, cameras, depth, force-torque; noise and latency.",
      difficulty: 2,
      est_minutes: 20,
      week: 6,
      goal_weight: 1,
      dimensions: [conceptual],
      prereqs: [{ id: robot-state-observation-action }],
      objectives: [{ text: "Match sensors to the quantities they measure", dimension: conceptual }],
      status: stub,
    }
  - {
      id: pid-control,
      title: PID control,
      description: "Feedback control with proportional, integral and derivative terms.",
      difficulty: 3,
      est_minutes: 35,
      week: 6,
      goal_weight: 2,
      dimensions: [conceptual, math, implementation],
      prereqs: [{ id: derivatives }, { id: robot-state-observation-action }],
      objectives:
        [{ text: "Tune a PID controller and explain each term", dimension: implementation }],
      projects: [control-sim],
      status: stub,
    }
  - {
      id: dynamics-basics,
      title: Dynamics fundamentals,
      description: "Forces, torques, inertia; kinematics vs dynamics.",
      difficulty: 3,
      est_minutes: 30,
      week: 6,
      goal_weight: 1,
      dimensions: [conceptual, math],
      prereqs: [{ id: forward-kinematics }],
      objectives: [{ text: "Distinguish kinematic and dynamic models", dimension: conceptual }],
      status: stub,
    }
  - {
      id: perception-pipelines,
      title: Perception pipelines,
      description: "From raw sensors to state estimates: detection, pose estimation, filtering.",
      difficulty: 3,
      est_minutes: 25,
      week: 6,
      goal_weight: 2,
      dimensions: [conceptual],
      prereqs: [{ id: camera-geometry }, { id: sensors }],
      objectives: [{ text: "Sketch a perception pipeline for a pick task", dimension: conceptual }],
      status: stub,
    }
