domain: robot-learning
concepts:
  - {
      id: action-representations,
      title: Representations of robot actions,
      description: "Joint vs end-effector, absolute vs delta, discretised tokens vs continuous.",
      difficulty: 3,
      est_minutes: 25,
      week: 10,
      goal_weight: 3,
      dimensions: [conceptual, transfer],
      prereqs: [{ id: robot-state-observation-action }],
      objectives: [{ text: "Compare action representations", dimension: conceptual }],
      status: stub,
    }
  - {
      id: vision-conditioned-policies,
      title: Vision-conditioned policies,
      description: "Policies that map images (and state) to actions.",
      difficulty: 3,
      est_minutes: 30,
      week: 10,
      goal_weight: 3,
      dimensions: [conceptual, implementation],
      prereqs: [{ id: behavioral-cloning }, { id: convolutions }],
      objectives: [{ text: "Build a small image-to-action policy", dimension: implementation }],
      projects: [vision-policy],
      status: stub,
    }
  - {
      id: action-chunking,
      title: Action chunking,
      description: "Predicting a short sequence of future actions at once (ACT, Zhao et al. 2023, trained on the ALOHA arms); temporal ensembling.",
      difficulty: 3,
      est_minutes: 30,
      week: 11,
      goal_weight: 3,
      dimensions: [conceptual, implementation],
      prereqs: [{ id: behavioral-cloning }, { id: action-representations }],
      objectives:
        [{ text: "Explain how chunking reduces compounding error", dimension: conceptual }],
      projects: [chunking-policy],
      status: stub,
    }
  - {
      id: diffusion-policies,
      title: Diffusion policies,
      description: "Denoising diffusion over action sequences; multimodal action distributions (Diffusion Policy, Chi et al. 2023).",
      difficulty: 4,
      est_minutes: 40,
      week: 11,
      goal_weight: 3,
      dimensions: [conceptual, math],
      prereqs: [{ id: action-chunking }, { id: gaussian-distribution }],
      objectives:
        [
          {
            text: "Explain why diffusion handles multimodal demonstrations",
            dimension: conceptual,
          },
        ],
      status: stub,
    }
  - {
      id: flow-matching,
      title: Flow matching,
      description: "Learning a velocity field that carries noise to data along near-straight paths; fewer sampling steps than diffusion for continuous actions (Lipman et al. 2023).",
      difficulty: 4,
      est_minutes: 35,
      week: 11,
      goal_weight: 2,
      dimensions: [conceptual, math],
      prereqs: [{ id: diffusion-policies }],
      objectives:
        [
          {
            text: "Explain how a velocity field transports noise to data along a near-straight path",
            dimension: conceptual,
          },
          { text: "Interpret a velocity vector along a flow-matching path", dimension: math },
        ],
      status: stub,
    }
  - {
      id: transformer-policies,
      title: Transformer policies,
      description: "Sequence models over observations and actions.",
      difficulty: 3,
      est_minutes: 25,
      week: 11,
      goal_weight: 2,
      dimensions: [conceptual],
      prereqs: [{ id: transformer-block }, { id: behavioral-cloning }],
      objectives: [{ text: "Describe tokenising observations and actions", dimension: conceptual }],
      status: stub,
    }
  - {
      id: vla-models,
      title: "VLA architecture: vision-language models that output actions",
      description: "Turning a pretrained vision-language model into a robot policy by writing actions as tokens (RT-2, 2023; OpenVLA, 2024).",
      difficulty: 4,
      est_minutes: 35,
      week: 11,
      goal_weight: 3,
      dimensions: [conceptual],
      prereqs:
        [
          { id: vision-language-models },
          { id: action-representations },
          { id: post-training, strength: soft },
        ],
      objectives: [{ text: "Explain the architecture of a VLA", dimension: conceptual }],
      status: stub,
    }
  - {
      id: vla-action-heads,
      title: "VLA action heads and training mixtures",
      description: "Continuous actions from a flow-matching action expert (π0, 2024; π0.5, 2025) and co-training on robot, web and human data.",
      difficulty: 4,
      est_minutes: 35,
      week: 11,
      goal_weight: 3,
      dimensions: [conceptual, transfer],
      prereqs: [{ id: vla-models }, { id: flow-matching }],
      objectives:
        [
          {
            text: "Explain how a flow-matching action expert produces continuous robot actions",
            dimension: conceptual,
          },
          {
            text: "Describe how robot, web and human data can be mixed during co-training",
            dimension: transfer,
          },
        ],
      status: stub,
    }
  - {
      id: robot-foundation-models,
      title: Robot foundation models,
      description: "Cross-embodiment pretraining, scaling robot data and generalist policies (RT-1, 2022; Open X-Embodiment and RT-X, 2023; Octo, 2024; DROID, 2024; GR00T N1, 2025).",
      difficulty: 4,
      est_minutes: 25,
      week: 11,
      goal_weight: 2,
      dimensions: [conceptual],
      prereqs: [{ id: vla-models }, { id: vla-action-heads, strength: soft }],
      objectives: [{ text: "Discuss cross-embodiment training", dimension: conceptual }],
      status: stub,
    }
  - {
      id: video-world-models,
      title: "Video world models for robotics",
      description: "Models trained on video that predict what happens next given an action, either as future camera frames (Genie, 2024; NVIDIA Cosmos, 2025) or as future embeddings (V-JEPA 2-AC, 2025), used as learned simulators, for planning and to evaluate policies.",
      difficulty: 4,
      est_minutes: 35,
      week: 11,
      goal_weight: 2,
      dimensions: [conceptual, transfer],
      prereqs: [{ id: world-models }, { id: diffusion-policies }, { id: jepa }],
      objectives:
        [
          {
            text: "Explain how predicted future camera frames can support planning as a learned simulator",
            dimension: conceptual,
          },
          {
            text: "Describe how video world models can be used to evaluate policies",
            dimension: transfer,
          },
        ],
      status: stub,
    }
  - {
      id: world-action-models,
      title: "World action models",
      description: "One model that predicts both the robot's future camera video and its actions, built on a pretrained video-generation model, so the policy learns how the world moves from video (UVA, 2025; Genie Envisioner, 2025; DreamZero, 2026).",
      difficulty: 4,
      est_minutes: 35,
      week: 11,
      goal_weight: 3,
      dimensions: [conceptual, transfer],
      prereqs: [{ id: video-world-models }, { id: vla-action-heads, strength: soft }],
      objectives:
        [
          {
            text: "Explain how jointly predicting future video and actions differs from a VLA that predicts actions only",
            dimension: conceptual,
          },
          {
            text: "Describe how a world action model can learn from videos that have no action labels, such as videos of humans",
            dimension: transfer,
          },
        ],
      status: stub,
    }
  - {
      id: embodiment-gap,
      title: Embodiment and human-vs-robot data,
      description: "Kinematic differences, retargeting, learning from human video (Mobile ALOHA, 2024; UMI, 2024).",
      difficulty: 3,
      est_minutes: 25,
      week: 11,
      goal_weight: 3,
      dimensions: [conceptual, transfer],
      prereqs: [{ id: demonstrations }, { id: forward-kinematics, strength: soft }],
      objectives:
        [
          {
            text: "Explain the challenges of learning from human demonstrations",
            dimension: conceptual,
          },
        ],
      status: stub,
    }
  - {
      id: landmark-robot-learning-papers,
      title: "Landmark robot learning papers, 2022–2026",
      description: "A timeline of the papers behind modern robot learning: what each solved, its key idea and what built on it (RT-1, SayCan, Diffusion Policy, ACT, RT-2, Open X-Embodiment, Octo, OpenVLA, DROID, π0, Genie, V-JEPA 2, GR00T N1, Gemini Robotics, UVA, Genie Envisioner, DreamZero).",
      difficulty: 4,
      est_minutes: 45,
      week: 11,
      goal_weight: 3,
      dimensions: [conceptual],
      prereqs:
        [
          { id: robot-foundation-models },
          { id: action-chunking },
          { id: video-world-models, strength: soft },
          { id: world-action-models, strength: soft },
          { id: embodiment-gap, strength: soft },
        ],
      objectives:
        [
          {
            text: "Explain what problem each landmark paper solved and what built on it",
            dimension: conceptual,
          },
        ],
      status: stub,
    }
  - {
      id: robot-inference-latency,
      title: "Inference on a robot",
      description: "Control-loop latency budgets, on-robot vs remote inference, and how inference speed limits policy size and motivates action chunking.",
      difficulty: 3,
      est_minutes: 20,
      week: 11,
      goal_weight: 2,
      dimensions: [conceptual, transfer],
      prereqs: [{ id: gpu-inference-basics }],
      objectives:
        [
          { text: "Explain why control-loop latency limits policy size", dimension: conceptual },
          {
            text: "Budget the latency of a policy running at a given control rate",
            dimension: transfer,
          },
        ],
      status: stub,
    }
  - {
      id: data-pipelines-robotics,
      title: Robot data pipelines and QA,
      description: "Collection, cleaning, synchronisation, quality assurance, data efficiency.",
      difficulty: 3,
      est_minutes: 30,
      week: 12,
      goal_weight: 3,
      dimensions: [conceptual, implementation, transfer],
      prereqs: [{ id: obs-action-datasets }],
      objectives: [{ text: "Design QA checks for a demonstration dataset", dimension: transfer }],
      status: stub,
    }
  - {
      id: failure-analysis,
      title: Failure analysis for policies,
      description: "Categorising rollout failures and tracing them to data or model causes.",
      difficulty: 3,
      est_minutes: 25,
      week: 12,
      goal_weight: 3,
      dimensions: [transfer],
      prereqs: [{ id: policy-evaluation }, { id: distribution-shift }],
      objectives: [{ text: "Trace a failure mode to its likely cause", dimension: transfer }],
      projects: [capstone],
      status: stub,
    }
