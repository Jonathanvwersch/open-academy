domain: llm-post-training
concepts:
  - {
      id: sft,
      title: Supervised fine-tuning,
      description: "Turning a pretrained model into an assistant by training on prompt–response pairs; chat templates and masking the loss to the response.",
      difficulty: 3,
      est_minutes: 25,
      goal_weight: 3,
      dimensions: [conceptual, implementation],
      prereqs: [{ id: pretraining }],
      encompassings:
        [
          { id: pretraining, weight: 0.01 },
          { id: autoregressive-lm, weight: 0.12 },
          { id: supervised-learning, weight: 0.21 },
        ],
      objectives:
        [
          {
            text: "Explain what supervised fine-tuning changes about a pretrained model's behaviour",
            dimension: conceptual,
          },
          { text: "Mask the loss so only response tokens are trained", dimension: implementation },
        ],
      status: authored,
    }
  - {
      id: lora,
      title: LoRA and parameter-efficient fine-tuning,
      description: "Freezing the pretrained weights and training a small low-rank update instead; why it cuts memory and how adapters are merged.",
      difficulty: 3,
      est_minutes: 25,
      goal_weight: 2,
      dimensions: [conceptual, math],
      prereqs: [{ id: sft }, { id: eigen-svd }],
      encompassings:
        [
          { id: sft, weight: 0 },
          { id: eigen-svd, weight: 0.06 },
          { id: backpropagation, weight: 0.01 },
          { id: gradient-descent, weight: 0.02 },
          { id: matrices, weight: 0.39 },
          { id: rank-span, weight: 0.12 },
        ],
      objectives:
        [
          {
            text: "Count the trainable parameters of a rank-r LoRA update to a d×k weight matrix",
            dimension: math,
          },
          { text: "Explain why a low-rank update can adapt a large model", dimension: conceptual },
        ],
      status: authored,
    }
  - {
      id: reward-models,
      title: Reward models from preferences,
      description: "Learning a scalar score from pairs of responses a person compared, with the Bradley–Terry preference loss.",
      difficulty: 3,
      est_minutes: 30,
      goal_weight: 3,
      dimensions: [conceptual, math],
      prereqs: [{ id: sft }, { id: logistic-regression }],
      encompassings:
        [
          { id: sft, weight: 0 },
          { id: logistic-regression, weight: 0.2 },
          { id: chain-rule, weight: 0.04 },
          { id: gradient-descent, weight: 0.02 },
          { id: probability-basics, weight: 0.02 },
        ],
      objectives:
        [
          {
            text: "Compute the Bradley–Terry probability and loss for a preference pair",
            dimension: math,
          },
          {
            text: "Explain why preferences are collected as comparisons rather than scores",
            dimension: conceptual,
          },
        ],
      status: authored,
    }
  - {
      id: rlhf,
      title: RLHF,
      description: "Optimising a language model against a reward model with PPO, with a KL penalty that keeps it close to the starting model.",
      difficulty: 4,
      est_minutes: 35,
      goal_weight: 3,
      dimensions: [conceptual, math],
      prereqs: [{ id: reward-models }, { id: ppo }, { id: information-theory }],
      encompassings:
        [
          { id: reward-models, weight: 0.05 },
          { id: ppo, weight: 0.02 },
          { id: information-theory, weight: 0.06 },
          { id: autoregressive-lm, weight: 0.05 },
          { id: mdp, weight: 0.05 },
          { id: policies-returns, weight: 0.04 },
          { id: probability-basics, weight: 0.04 },
          { id: sft, weight: 0.03 },
        ],
      confused_with: [dpo],
      objectives:
        [
          {
            text: "Map RLHF onto RL terms: state, action, policy and reward for a language model",
            dimension: conceptual,
          },
          { text: "Compute the KL-penalised reward for a generated response", dimension: math },
        ],
      status: authored,
    }
  - {
      id: dpo,
      title: Direct preference optimisation,
      description: "Training directly on preference pairs with a classification-style loss, with no separate reward model or RL loop.",
      difficulty: 4,
      est_minutes: 30,
      goal_weight: 3,
      dimensions: [conceptual, math],
      prereqs: [{ id: rlhf }],
      encompassings:
        [
          { id: rlhf, weight: 0.08 },
          { id: chain-rule, weight: 0.02 },
          { id: gradient-descent, weight: 0.03 },
          { id: information-theory, weight: 0.09 },
          { id: probability-basics, weight: 0.06 },
          { id: reward-models, weight: 0.3 },
        ],
      objectives:
        [
          {
            text: "Compute the DPO loss for one preference pair from policy and reference log-probabilities",
            dimension: math,
          },
          {
            text: "Contrast DPO with RLHF: what each needs and what each can go wrong on",
            dimension: conceptual,
          },
        ],
      status: authored,
    }
  - {
      id: rl-verifiable-rewards,
      title: RL with verifiable rewards,
      description: "Reinforcement learning on problems whose answers can be checked automatically, such as maths and code; GRPO's group-relative advantages and how reasoning models are trained.",
      difficulty: 4,
      est_minutes: 35,
      goal_weight: 3,
      dimensions: [conceptual, math, implementation],
      prereqs: [{ id: sft }, { id: policy-gradients }, { id: rlhf }],
      encompassings:
        [
          { id: sft, weight: 0.02 },
          { id: policy-gradients, weight: 0.09 },
          { id: rlhf, weight: 0.04 },
          { id: descriptive-statistics, weight: 0.09 },
          { id: ppo, weight: 0.05 },
        ],
      objectives:
        [
          {
            text: "Compute group-relative advantages for a group of sampled answers",
            dimension: math,
          },
          {
            text: "Write a reward function that checks a model's final answer",
            dimension: implementation,
          },
          {
            text: "Explain why verifiable rewards avoid needing a learned reward model",
            dimension: conceptual,
          },
        ],
      status: authored,
    }
  - {
      id: reward-hacking,
      title: Reward hacking and over-optimisation,
      description: "How a policy exploits flaws in a learned or hand-written reward, why reward-model scores rise while true quality falls, and how to detect it.",
      difficulty: 3,
      est_minutes: 20,
      goal_weight: 2,
      dimensions: [conceptual, transfer],
      prereqs: [{ id: rlhf }, { id: reward-design }],
      encompassings:
        [
          { id: rlhf, weight: 0.08 },
          { id: reward-design, weight: 0.18 },
          { id: probability-basics, weight: 0.04 },
          { id: reward-models, weight: 0.02 },
          { id: supervised-learning, weight: 0.09 },
        ],
      objectives:
        [
          {
            text: "Explain why optimising a proxy reward too hard lowers true quality",
            dimension: conceptual,
          },
          {
            text: "Spot signs of reward hacking in training curves and sample outputs",
            dimension: transfer,
          },
        ],
      status: authored,
    }
  - {
      id: llm-evaluation,
      title: Evaluating LLMs,
      description: "Benchmarks and contamination, pairwise win rates, and using an LLM as a judge, with its biases.",
      difficulty: 3,
      est_minutes: 25,
      goal_weight: 2,
      dimensions: [conceptual, transfer],
      prereqs: [{ id: sft }, { id: evaluation-metrics }],
      encompassings:
        [
          { id: sft, weight: 0.02 },
          { id: evaluation-metrics, weight: 0.01 },
          { id: train-test-split, weight: 0.15 },
        ],
      objectives:
        [
          { text: "Explain how benchmark contamination inflates scores", dimension: conceptual },
          {
            text: "Design a pairwise evaluation that controls for position bias in an LLM judge",
            dimension: transfer,
          },
        ],
      status: authored,
    }
