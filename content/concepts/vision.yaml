domain: vision
concepts:
  - {
      id: images-as-tensors,
      title: Images as tensors,
      description: "Pixels, channels, HWC vs CHW, normalization.",
      difficulty: 1,
      est_minutes: 15,
      week: 4,
      goal_weight: 2,
      dimensions: [conceptual, implementation],
      prereqs: [{ id: matrices }],
      objectives: [{ text: "Convert between image layouts and shapes", dimension: implementation }],
      status: authored,
    }
  - {
      id: convolutions,
      title: Convolutional networks,
      description: "Convolutions, receptive fields, pooling, weight sharing.",
      difficulty: 3,
      est_minutes: 35,
      week: 4,
      goal_weight: 2,
      dimensions: [conceptual, math, implementation],
      prereqs: [{ id: images-as-tensors }, { id: mlp-forward-pass }],
      objectives: [{ text: "Compute output shapes of conv layers", dimension: math }],
      projects: [image-classifier],
      status: authored,
    }
  - {
      id: camera-geometry,
      title: Camera geometry,
      description: "Pinhole model, intrinsics and extrinsics, projection.",
      difficulty: 3,
      est_minutes: 35,
      week: 11,
      goal_weight: 2,
      dimensions: [conceptual, math],
      prereqs: [{ id: homogeneous-transforms }],
      objectives: [{ text: "Project a 3D point into pixel coordinates", dimension: math }],
      status: stub,
    }
  - {
      id: vision-encoders,
      title: Vision encoders,
      description: "CNN and ViT encoders producing image features.",
      difficulty: 3,
      est_minutes: 25,
      week: 9,
      goal_weight: 2,
      dimensions: [conceptual],
      prereqs: [{ id: convolutions }, { id: transformer-block }],
      objectives: [{ text: "Explain how a ViT patchifies an image", dimension: conceptual }],
      status: stub,
    }
  - {
      id: image-text-alignment,
      title: Image-text alignment,
      description: "Contrastive learning (CLIP) and shared embedding spaces.",
      difficulty: 3,
      est_minutes: 30,
      week: 9,
      goal_weight: 2,
      dimensions: [conceptual, math],
      prereqs: [{ id: vision-encoders }, { id: embeddings }],
      objectives: [{ text: "Explain the contrastive objective", dimension: conceptual }],
      status: stub,
    }
  - {
      id: jepa,
      title: "Self-supervised learning and JEPA",
      description: "Learning from unlabelled images and video by hiding part of the input and predicting the hidden part's embedding rather than its pixels (I-JEPA, 2023; V-JEPA, 2024; V-JEPA 2, 2025).",
      difficulty: 4,
      est_minutes: 30,
      week: 9,
      goal_weight: 2,
      dimensions: [conceptual, transfer],
      prereqs: [{ id: autoencoders }, { id: image-text-alignment }],
      objectives:
        [
          {
            text: "Explain how a JEPA differs from an autoencoder, which reconstructs pixels, and from contrastive learning, which needs negative pairs",
            dimension: conceptual,
          },
          {
            text: "Explain why predicting in embedding space suits world models used for robot planning",
            dimension: transfer,
          },
        ],
      status: stub,
    }
  - {
      id: vision-language-models,
      title: Vision-language models,
      description: "Feeding image tokens into a language model.",
      difficulty: 3,
      est_minutes: 25,
      week: 9,
      goal_weight: 3,
      dimensions: [conceptual],
      prereqs: [{ id: image-text-alignment }, { id: autoregressive-lm }],
      objectives: [{ text: "Describe a VLM architecture", dimension: conceptual }],
      status: stub,
    }
  - {
      id: diffusion-models,
      title: Diffusion models,
      description: "Generating data by learning to reverse a process that gradually adds Gaussian noise: the noise schedule, training a network to predict the added noise, and sampling step by step (DDPM, 2020).",
      difficulty: 4,
      est_minutes: 35,
      week: 9,
      goal_weight: 3,
      dimensions: [conceptual, math, implementation],
      prereqs: [{ id: gaussian-distribution }, { id: autoencoders }, { id: pytorch-basics }],
      objectives:
        [
          {
            text: "Compute a noised sample at step t from a clean sample for a given noise schedule",
            dimension: math,
          },
          {
            text: "Explain why the network is trained to predict the added noise",
            dimension: conceptual,
          },
          {
            text: "Write the training loss for a noise-prediction network",
            dimension: implementation,
          },
        ],
      projects: [generative-toy],
      status: stub,
    }
