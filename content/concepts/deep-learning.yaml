domain: deep-learning
concepts:
  - id: perceptron
    title: Neurons and perceptrons
    description: A neuron as a weighted sum plus bias passed through a nonlinearity; linear decision boundaries.
    difficulty: 1
    est_minutes: 20
    goal_weight: 2
    dimensions: [conceptual, math]
    prereqs: [{ id: dot-product }, { id: linear-regression, strength: soft }]
    encompassings: [{ id: dot-product, weight: 0.12 }, { id: vectors, weight: 0.21 }]
    objectives:
      - { text: "Compute a neuron's output for given weights and inputs", dimension: math }
      - {
          text: "Explain why a single linear unit can only draw a linear boundary",
          dimension: conceptual,
        }
    status: authored
  - id: activation-functions
    title: Activation functions
    description: ReLU, sigmoid, tanh; why nonlinearity matters; their derivatives.
    difficulty: 2
    est_minutes: 25
    goal_weight: 3
    dimensions: [conceptual, math, transfer]
    prereqs: [{ id: perceptron }, { id: derivatives }]
    encompassings: [{ id: perceptron, weight: 0.03 }, { id: derivatives, weight: 0.1 }]
    objectives:
      - { text: "Evaluate and differentiate ReLU and sigmoid", dimension: math }
      - {
          text: "Explain why stacking linear layers without activations stays linear",
          dimension: conceptual,
        }
    status: authored
  - id: mlp-forward-pass
    title: Layers and the forward pass
    description: Stacking layers as matrix multiplies plus activations; shapes through a multilayer perceptron.
    difficulty: 2
    est_minutes: 30
    goal_weight: 3
    dimensions: [conceptual, math, implementation]
    prereqs: [{ id: activation-functions }, { id: matrices }]
    encompassings:
      [
        { id: activation-functions, weight: 0.12 },
        { id: matrices, weight: 0.32 },
        { id: perceptron, weight: 0.14 },
      ]
    objectives:
      - { text: "Compute a 2-layer forward pass by hand", dimension: math }
      - { text: "Track tensor shapes through each layer", dimension: implementation }
    status: authored
  - id: computational-graphs
    title: Computational graphs
    description: Representing a computation as a DAG of primitive operations.
    difficulty: 2
    est_minutes: 20
    goal_weight: 3
    dimensions: [conceptual, math]
    prereqs: [{ id: chain-rule }]
    encompassings:
      [
        { id: chain-rule, weight: 0.21 },
        { id: derivatives, weight: 0.15 },
        { id: partial-derivatives, weight: 0.33 },
      ]
    objectives:
      - { text: "Draw the computational graph of an expression", dimension: conceptual }
      - { text: "Compute local derivatives at each node", dimension: math }
    status: authored
  - id: backpropagation
    title: Backpropagation
    description: Reverse-mode application of the chain rule over a computational graph to get all parameter gradients.
    difficulty: 3
    est_minutes: 45
    goal_weight: 3
    dimensions: [conceptual, math, implementation, transfer]
    prereqs:
      [
        { id: computational-graphs },
        { id: mlp-forward-pass },
        { id: loss-functions },
        { id: partial-derivatives },
      ]
    encompassings:
      [
        { id: computational-graphs, weight: 0.52 },
        { id: mlp-forward-pass, weight: 0.12 },
        { id: loss-functions, weight: 0.09 },
        { id: partial-derivatives, weight: 0.31 },
        { id: activation-functions, weight: 0.15 },
        { id: derivatives, weight: 0.11 },
        { id: matrices, weight: 0.03 },
      ]
    confused_with: [autodiff]
    objectives:
      - {
          text: "Explain why gradients are needed and why backward reuses forward values",
          dimension: conceptual,
        }
      - { text: "Calculate gradients through a small network by hand", dimension: math }
      - { text: "Implement a backward pass", dimension: implementation }
      - { text: "Diagnose common gradient errors", dimension: transfer }
    status: authored
  - id: autodiff
    title: Automatic differentiation
    description: How frameworks record operations and compute gradients; forward vs reverse mode.
    difficulty: 3
    est_minutes: 25
    goal_weight: 2
    dimensions: [conceptual, implementation]
    prereqs: [{ id: backpropagation }]
    encompassings:
      [
        { id: backpropagation, weight: 0.16 },
        { id: computational-graphs, weight: 0.28 },
        { id: partial-derivatives, weight: 0.18 },
      ]
    objectives:
      - { text: "Explain what loss.backward() does", dimension: conceptual }
    status: authored
  - id: pytorch-basics
    title: PyTorch fundamentals
    description: Tensors, modules, optimizers, the standard training loop.
    difficulty: 2
    est_minutes: 40
    goal_weight: 3
    dimensions: [implementation]
    prereqs: [{ id: autodiff }, { id: gradient-descent }]
    encompassings:
      [
        { id: autodiff, weight: 0.09 },
        { id: gradient-descent, weight: 0.12 },
        { id: linear-regression, weight: 0.12 },
        { id: loss-functions, weight: 0.06 },
        { id: matrices, weight: 0.1 },
      ]
    objectives:
      - { text: "Write a PyTorch training loop from memory", dimension: implementation }
    status: authored
  - id: sgd-minibatch
    title: Stochastic and minibatch gradient descent
    description: Estimating gradients from batches; noise, epochs, batch size.
    difficulty: 2
    est_minutes: 25
    goal_weight: 3
    dimensions: [conceptual, math]
    prereqs: [{ id: gradient-descent }]
    encompassings:
      [
        { id: gradient-descent, weight: 0.29 },
        { id: gradients, weight: 0.05 },
        { id: loss-functions, weight: 0.07 },
      ]
    confused_with: [momentum-adam]
    objectives:
      - { text: "Explain the tradeoffs of batch size", dimension: conceptual }
    status: authored
  - id: momentum-adam
    title: Momentum and Adam
    description: Momentum, adaptive learning rates and the Adam update.
    difficulty: 3
    est_minutes: 30
    goal_weight: 2
    dimensions: [conceptual, math]
    prereqs: [{ id: sgd-minibatch }]
    encompassings: [{ id: sgd-minibatch, weight: 0.01 }, { id: gradient-descent, weight: 0.08 }]
    objectives:
      - { text: "Write the Adam update rule", dimension: math }
    status: authored
  - id: weight-init-normalization
    title: Initialization and normalization
    description: Why init scale matters; batch norm and layer norm.
    difficulty: 3
    est_minutes: 30
    goal_weight: 2
    dimensions: [conceptual]
    prereqs: [{ id: backpropagation }, { id: gradient-descent }]
    encompassings:
      [
        { id: backpropagation, weight: 0.04 },
        { id: gradient-descent, weight: 0.02 },
        { id: activation-functions, weight: 0.07 },
        { id: dot-product, weight: 0.01 },
        { id: mlp-forward-pass, weight: 0.17 },
      ]
    objectives:
      - {
          text: "Explain vanishing/exploding activations and what LayerNorm does",
          dimension: conceptual,
        }
    status: authored
  - id: debugging-training
    title: Debugging training runs
    description: Reading loss curves, overfitting a single batch, gradient checks, common bugs.
    difficulty: 3
    est_minutes: 30
    goal_weight: 3
    dimensions: [transfer, implementation]
    prereqs:
      [{ id: sgd-minibatch }, { id: overfitting }, { id: pytorch-basics }, { id: regularization }]
    encompassings:
      [
        { id: sgd-minibatch, weight: 0.02 },
        { id: overfitting, weight: 0.02 },
        { id: pytorch-basics, weight: 0.03 },
        { id: regularization, weight: 0.02 },
        { id: gradient-descent, weight: 0.23 },
        { id: loss-functions, weight: 0.13 },
        { id: partial-derivatives, weight: 0.16 },
      ]
    objectives:
      - { text: "Diagnose a failing training run from its symptoms", dimension: transfer }
    status: authored
  - id: classification-softmax
    title: Softmax and multiclass cross-entropy
    description: Turning logits into probabilities; categorical cross-entropy.
    difficulty: 2
    est_minutes: 25
    goal_weight: 3
    dimensions: [conceptual, math]
    prereqs: [{ id: logistic-regression }, { id: information-theory }]
    encompassings:
      [
        { id: logistic-regression, weight: 0.15 },
        { id: information-theory, weight: 0.14 },
        { id: derivatives, weight: 0.13 },
        { id: gradient-descent, weight: 0.03 },
        { id: probability-basics, weight: 0.09 },
      ]
    objectives:
      - { text: "Compute softmax and cross-entropy for a logit vector", dimension: math }
    status: authored
  - {
      id: autoencoders,
      title: "Autoencoders and latent representations",
      description: "Compressing an input into a short latent vector and reconstructing it; the latent space that world models and policies predict in.",
      difficulty: 3,
      est_minutes: 30,
      goal_weight: 2,
      dimensions: [conceptual, math],
      prereqs: [{ id: mlp-forward-pass }, { id: images-as-tensors }],
      encompassings:
        [
          { id: mlp-forward-pass, weight: 0.15 },
          { id: images-as-tensors, weight: 0.13 },
          { id: dot-product, weight: 0.06 },
          { id: vectors, weight: 0.11 },
        ],
      objectives:
        [
          {
            text: "Explain how an encoder compresses an input into a latent representation and a decoder reconstructs it",
            dimension: conceptual,
          },
          {
            text: "Compare input and latent-vector dimensions in a simple autoencoder",
            dimension: math,
          },
        ],
      status: authored,
    }
