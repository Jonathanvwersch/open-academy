domain: math
concepts:
  - id: vectors
    title: Vectors and vector operations
    description: Vectors as lists of numbers and as arrows; addition, scaling, norms.
    difficulty: 1
    est_minutes: 20
    goal_weight: 2
    dimensions: [conceptual, math]
    prereqs: []
    objectives:
      - { text: "Add, scale and compute the L2 norm of vectors", dimension: math }
      - { text: "Interpret a feature vector as a point in space", dimension: conceptual }
    status: authored
  - id: dot-product
    title: Dot product and cosine similarity
    description: Dot product as weighted sum and as projection; cosine similarity.
    difficulty: 1
    est_minutes: 20
    goal_weight: 3
    dimensions: [conceptual, math, transfer]
    prereqs: [{ id: vectors }]
    objectives:
      - { text: "Compute a dot product and cosine similarity", dimension: math }
      - { text: "Explain a dot product as a similarity score", dimension: conceptual }
      - { text: "Recognise dot products inside linear models and attention", dimension: transfer }
    status: authored
  - id: matrices
    title: Matrices and matrix-vector multiplication
    description: Matrices as linear maps; shapes; matrix-vector and matrix-matrix products.
    difficulty: 2
    est_minutes: 30
    goal_weight: 3
    dimensions: [conceptual, math, implementation]
    prereqs: [{ id: dot-product }]
    objectives:
      - { text: "Multiply matrices and predict result shapes", dimension: math }
      - { text: "Explain a matrix as a linear transformation", dimension: conceptual }
      - { text: "Write batched matrix products in NumPy", dimension: implementation }
    status: authored
  - id: determinants
    title: Determinants
    description: Signed area scaling, orientation and the 2×2 determinant; zero area and lost information.
    difficulty: 2
    est_minutes: 30
    goal_weight: 2
    dimensions: [conceptual, math, transfer]
    prereqs: [{ id: matrices }]
    related: [eigen-svd]
    objectives:
      - { text: "Interpret a determinant as signed area scaling", dimension: conceptual }
      - { text: "Calculate the determinant of a 2×2 matrix", dimension: math }
      - { text: "Decide whether a square coordinate map loses information", dimension: transfer }
    sources:
      - {
          title: "3Blue1Brown: The determinant",
          url: "https://www.3blue1brown.com/lessons/determinant/",
        }
    status: authored
  - id: inverses-linear-systems
    title: Inverses, transposes and linear systems
    description: "The identity matrix, undoing a matrix with its inverse, the 2×2 inverse formula, transpose rules and symmetric matrices, and solving Ax = b by elimination."
    difficulty: 2
    est_minutes: 30
    goal_weight: 2
    dimensions: [conceptual, math, implementation]
    prereqs: [{ id: determinants }]
    objectives:
      - {
          text: "Find the inverse of a 2×2 matrix and check it gives the identity",
          dimension: math,
        }
      - { text: "Solve a small linear system Ax = b by elimination", dimension: math }
      - {
          text: "Apply the transpose rules, including (AB)ᵀ = BᵀAᵀ, and recognise symmetric matrices",
          dimension: math,
        }
      - { text: "Solve linear systems in NumPy with np.linalg.solve", dimension: implementation }
    sources:
      - {
          title: "3Blue1Brown: Inverse matrices, column space and null space",
          url: "https://www.3blue1brown.com/lessons/inverse-matrices",
        }
    status: authored
  - id: rank-span
    title: Linear independence, span and rank
    description: "Linear combinations and span, testing whether vectors are independent, rank as the number of independent columns, and when Ax = b has one, no or infinitely many solutions."
    difficulty: 3
    est_minutes: 30
    goal_weight: 2
    dimensions: [conceptual, math, transfer]
    prereqs: [{ id: inverses-linear-systems }]
    objectives:
      - { text: "Decide whether a vector is in the span of others", dimension: math }
      - { text: "Test a set of vectors for linear independence", dimension: math }
      - { text: "Find the rank of a small matrix by elimination", dimension: math }
      - {
          text: "Predict whether a linear system has one, no or infinitely many solutions",
          dimension: conceptual,
        }
      - {
          text: "Explain why a product of a tall and a wide matrix has low rank",
          dimension: transfer,
        }
    sources:
      - {
          title: "3Blue1Brown: Linear combinations, span, and basis vectors",
          url: "https://www.3blue1brown.com/lessons/span",
        }
    status: authored
  - id: orthogonality-projections
    title: Orthogonality and projections
    description: "Projecting a vector onto a line, orthonormal vectors and orthogonal matrices (QᵀQ = I), and least squares as projecting onto a matrix's columns."
    difficulty: 3
    est_minutes: 35
    goal_weight: 2
    dimensions: [conceptual, math, implementation]
    prereqs: [{ id: rank-span }]
    objectives:
      - {
          text: "Project a vector onto a line and find the leftover perpendicular part",
          dimension: math,
        }
      - {
          text: "Check whether a matrix is orthogonal and invert it with its transpose",
          dimension: math,
        }
      - { text: "Fit a least-squares line with the normal equations AᵀAx = Aᵀb", dimension: math }
      - { text: "Compute projections and least-squares fits in NumPy", dimension: implementation }
    sources:
      - {
          title: "MIT 18.06 (Strang), Lecture 15: Projections onto subspaces",
          url: "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/",
        }
    status: authored
  - id: derivatives
    title: Derivatives
    description: Derivative as local slope / rate of change; basic rules.
    difficulty: 1
    est_minutes: 20
    goal_weight: 2
    dimensions: [conceptual, math]
    prereqs: []
    objectives:
      - { text: "Differentiate polynomials, exp and log", dimension: math }
      - { text: "Interpret a derivative as sensitivity of output to input", dimension: conceptual }
    status: authored
  - id: partial-derivatives
    title: Partial derivatives
    description: Derivatives of multivariable functions with respect to one variable.
    difficulty: 2
    est_minutes: 20
    goal_weight: 2
    dimensions: [conceptual, math]
    prereqs: [{ id: derivatives }]
    objectives:
      - { text: "Compute partial derivatives of multivariable functions", dimension: math }
    status: authored
  - id: gradients
    title: Gradient vectors
    description: The gradient as the vector of partials pointing in the direction of steepest ascent.
    difficulty: 2
    est_minutes: 25
    goal_weight: 3
    dimensions: [conceptual, math, transfer]
    prereqs: [{ id: partial-derivatives }, { id: vectors }, { id: dot-product }]
    objectives:
      - { text: "Compute the gradient of a scalar function", dimension: math }
      - {
          text: "Explain why the negative gradient is the steepest-descent direction",
          dimension: conceptual,
        }
    status: authored
  - id: chain-rule
    title: Chain rule
    description: Derivative of composed functions, single and multivariable.
    difficulty: 2
    est_minutes: 25
    goal_weight: 3
    dimensions: [conceptual, math]
    prereqs: [{ id: derivatives }, { id: partial-derivatives }]
    objectives:
      - { text: "Differentiate compositions with the chain rule", dimension: math }
      - { text: "Explain the chain rule as multiplying local sensitivities", dimension: conceptual }
    status: authored
  - id: probability-basics
    title: Probability basics
    description: Random variables, distributions, expectation, conditional probability.
    difficulty: 2
    est_minutes: 30
    goal_weight: 2
    dimensions: [conceptual, math]
    prereqs: []
    objectives:
      - { text: "Compute expectations and conditional probabilities", dimension: math }
    projects: [gaussian-mle]
    status: authored
  - id: gaussian-distribution
    title: Gaussian distribution
    description: Mean, variance, the normal density and why it is everywhere.
    difficulty: 2
    est_minutes: 20
    goal_weight: 1
    dimensions: [conceptual, math]
    prereqs: [{ id: probability-basics }]
    objectives:
      - { text: "Relate mean and variance to the normal density", dimension: math }
    projects: [gaussian-mle]
    status: authored
  - id: maximum-likelihood
    title: Maximum likelihood
    description: Choosing parameters that make observed data most probable; link to MSE and cross-entropy.
    difficulty: 3
    est_minutes: 30
    goal_weight: 2
    dimensions: [conceptual, math]
    prereqs:
      [
        { id: probability-basics },
        { id: gaussian-distribution, strength: soft },
        { id: derivatives },
      ]
    objectives:
      - { text: "Derive MSE as Gaussian maximum likelihood", dimension: math }
    projects: [gaussian-mle]
    status: authored
  - id: information-theory
    title: Entropy, cross-entropy and KL divergence
    description: Surprise and entropy, cross-entropy as the classification loss, KL divergence as the gap between two distributions.
    difficulty: 2
    est_minutes: 30
    goal_weight: 2
    dimensions: [conceptual, math]
    prereqs: [{ id: probability-basics }]
    objectives:
      - { text: "Compute entropy and cross-entropy for a small distribution", dimension: math }
      - { text: "Explain why cross-entropy is the loss for classification", dimension: conceptual }
    projects: [gaussian-mle]
    status: authored
  - id: descriptive-statistics
    title: Mean, variance and confidence intervals
    description: Mean, variance, standard deviation, standard error and confidence intervals for averages and success rates.
    difficulty: 2
    est_minutes: 30
    goal_weight: 2
    dimensions: [conceptual, math]
    prereqs: [{ id: probability-basics }]
    objectives:
      - { text: "Compute the standard error of a mean or a success rate", dimension: math }
      - {
          text: "Judge whether two small-sample success rates really differ",
          dimension: conceptual,
        }
    projects: [gaussian-mle]
    status: authored
  - id: rotation-matrices
    title: Rotation matrices
    description: 2D/3D rotations as orthonormal matrices; composition.
    difficulty: 2
    est_minutes: 30
    goal_weight: 2
    dimensions: [conceptual, math, implementation]
    prereqs: [{ id: matrices }]
    objectives:
      - { text: "Build and compose 2D rotation matrices", dimension: math }
    status: stub
  - id: eigen-svd
    title: Eigenvalues, eigenvectors and SVD
    description: "Directions a matrix only stretches, SVD as rotate–stretch–rotate, and low-rank approximation, the idea behind LoRA."
    difficulty: 3
    est_minutes: 35
    goal_weight: 2
    dimensions: [conceptual, math]
    prereqs:
      [
        { id: matrices },
        { id: rank-span, strength: soft },
        { id: orthogonality-projections, strength: soft },
      ]
    objectives:
      - { text: "Find the eigenvalues of a 2×2 matrix", dimension: math }
      - { text: "Explain SVD as rotate, stretch, rotate", dimension: conceptual }
    status: authored
