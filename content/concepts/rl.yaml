domain: rl
concepts:
  - {
      id: mdp,
      title: Markov decision processes,
      description: "States, actions, transitions, rewards, discount.",
      difficulty: 2,
      est_minutes: 30,
      goal_weight: 3,
      dimensions: [conceptual, math],
      prereqs: [{ id: probability-basics }],
      objectives: [{ text: "Formalise a task as an MDP", dimension: conceptual }],
      status: authored,
    }
  - {
      id: policies-returns,
      title: Policies and returns,
      description: "Deterministic and stochastic policies; discounted return.",
      difficulty: 2,
      est_minutes: 20,
      goal_weight: 3,
      dimensions: [conceptual, math],
      prereqs: [{ id: mdp }],
      objectives: [{ text: "Compute a discounted return", dimension: math }],
      status: authored,
    }
  - {
      id: value-functions,
      title: Value functions and Bellman equations,
      description: "V and Q functions; Bellman expectation and optimality.",
      difficulty: 3,
      est_minutes: 35,
      goal_weight: 3,
      dimensions: [conceptual, math],
      prereqs: [{ id: policies-returns }],
      confused_with: [q-learning],
      objectives: [{ text: "Apply one Bellman backup", dimension: math }],
      status: authored,
    }
  - {
      id: q-learning,
      title: Q-learning,
      description: "Off-policy TD control; epsilon-greedy.",
      difficulty: 3,
      est_minutes: 35,
      goal_weight: 2,
      dimensions: [math, implementation],
      prereqs: [{ id: value-functions }],
      objectives: [{ text: "Perform a Q-learning update", dimension: math }],
      status: authored,
    }
  - {
      id: exploration,
      title: Exploration vs exploitation,
      description: "Why agents must explore; epsilon-greedy, entropy bonuses.",
      difficulty: 2,
      est_minutes: 20,
      goal_weight: 2,
      dimensions: [conceptual],
      prereqs: [{ id: policies-returns }],
      objectives: [{ text: "Explain the exploration problem", dimension: conceptual }],
      status: authored,
    }
  - {
      id: deep-q-learning,
      title: Deep Q-learning,
      description: "Replacing the Q-table with a neural network: experience replay, target networks and why naive function approximation diverges (DQN, 2015).",
      difficulty: 4,
      est_minutes: 30,
      goal_weight: 2,
      dimensions: [conceptual, implementation],
      prereqs: [{ id: q-learning }, { id: exploration }, { id: pytorch-basics }],
      objectives:
        [
          {
            text: "Explain why experience replay and a target network stabilise deep Q-learning",
            dimension: conceptual,
          },
          {
            text: "Compute TD targets for a minibatch using a target network",
            dimension: implementation,
          },
        ],
      status: authored,
    }
  - {
      id: policy-gradients,
      title: Policy gradients,
      description: "REINFORCE and the log-derivative trick; baselines.",
      difficulty: 4,
      est_minutes: 40,
      goal_weight: 3,
      dimensions: [conceptual, math],
      prereqs: [{ id: policies-returns }, { id: gradient-descent }],
      objectives: [{ text: "Derive the REINFORCE estimator", dimension: math }],
      status: authored,
    }
  - {
      id: ppo,
      title: PPO,
      description: "Clipped surrogate objective, advantages, GAE.",
      difficulty: 4,
      est_minutes: 35,
      goal_weight: 2,
      dimensions: [conceptual],
      prereqs: [{ id: policy-gradients }, { id: value-functions }],
      objectives: [{ text: "Explain what PPO's clipping prevents", dimension: conceptual }],
      projects: [rl-sim],
      status: authored,
    }
  - {
      id: simulation-for-rl,
      title: Simulation environments,
      description: "Gym-style environments, resets, episodes, vectorised envs, sim-to-real gap.",
      difficulty: 2,
      est_minutes: 20,
      goal_weight: 2,
      dimensions: [conceptual, implementation],
      prereqs: [{ id: mdp }],
      objectives: [{ text: "Write an environment interaction loop", dimension: implementation }],
      status: authored,
    }
  - {
      id: reward-design,
      title: Reward design,
      description: "Sparse vs shaped rewards, reward hacking.",
      difficulty: 3,
      est_minutes: 20,
      goal_weight: 2,
      dimensions: [conceptual, transfer],
      prereqs: [{ id: mdp }],
      objectives: [{ text: "Identify reward hacking risks", dimension: transfer }],
      status: authored,
    }
