      difficulty: 2,
      est_minutes: 20,
      goal_weight: 3,
      dimensions: [conceptual, math],
      prereqs: [{ id: mdp }],
      encompassings: [{ id: mdp, weight: 0.22 }, { id: probability-basics, weight: 0.04 }],
      objectives: [{ text: "Compute a discounted return", dimension: math }],
      status: authored,
    }
  - {
      id: value-functions,
      title: Value functions and Bellman equations,
