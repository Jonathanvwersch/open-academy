# Symbols and terms that must be taught before a lesson or exercise uses them.
# A concept may use a term only if it is one of `introduced_by`, or one of them is a
# hard prerequisite ancestor. `match` entries are JavaScript regexes (case-insensitive)
# applied to lesson Markdown and to all exercise text.
avoid:
  - pattern: '\b[Ll][Rr]\b'
    use: 'write "learning rate" or $\eta$'
terms:
  - { id: real-space, label: "ℝⁿ notation", match: ['\\mathbb\s*\{?R'], introduced_by: [vectors] }
  - {
      id: sum,
      label: "Σ summation",
      match: ['\\sum'],
      introduced_by: [vectors, supervised-learning],
    }
  - {
      id: transpose,
      label: "transpose ⊤ / .T",
      match: ['\\top', '\.T\b'],
      introduced_by: [matrices],
    }
  - {
      id: matrix,
      label: "matrix notation",
      match: ['\\begin\{[pb]matrix\}'],
      introduced_by: [matrices],
    }
  - {
      id: numpy-matmul,
      label: "NumPy @ / broadcasting",
      match: ['\s@\s', "broadcast"],
      introduced_by: [matrices],
    }
  - {
      id: ones-vector,
      label: "ones vector 𝟏",
      match: ['\\mathbf\s*\{?1(?!\s*\}?\s*\[)'],
      introduced_by: [linear-regression],
    }
  - { id: limit, label: "limit notation", match: ['\\lim'], introduced_by: [derivatives] }
  - {
      id: exp,
      label: "e powers",
      match: ['\be\^'],
      introduced_by: [derivatives, gaussian-distribution],
    }
  - { id: ln, label: "ln", match: ['\\ln\b'], introduced_by: [derivatives] }
  - {
      id: partial,
      label: "∂ partial derivative",
      match: ['\\partial'],
      introduced_by: [partial-derivatives],
    }
  - { id: nabla, label: "∇ gradient", match: ['\\nabla'], introduced_by: [gradients] }
  - {
      id: composition,
      label: "∘ composition",
      match: ['(?<!\^)(?<!\^\{)\\circ'],
      introduced_by: [chain-rule],
    }
  - { id: argmin, label: "argmin", match: ['\\arg\s*\\?min'], introduced_by: [supervised-learning] }
  - {
      id: mse,
      label: "MSE",
      match: ['\bMSE\b', "mean squared error"],
      introduced_by: [supervised-learning, loss-functions, maximum-likelihood],
    }
  - {
      id: mae,
      label: "MAE",
      match: ['\bMAE\b', "mean absolute error"],
      introduced_by: [loss-functions],
    }
  - {
      id: learning-rate,
      label: "learning rate η",
      match: ["learning rate", '\\eta'],
      introduced_by: [gradient-descent],
    }
  - { id: phi, label: "φ activation", match: ['\\phi', '\\varphi'], introduced_by: [perceptron] }
  - { id: hyperplane, label: "hyperplane", match: ["hyperplane"], introduced_by: [perceptron] }
  - {
      id: sigmoid,
      label: "sigmoid σ",
      match: ["sigmoid"],
      introduced_by: [activation-functions, logistic-regression],
    }
  - { id: relu, label: "ReLU", match: ["ReLU"], introduced_by: [activation-functions] }
  - {
      id: sigma,
      label: "σ (sigmoid or standard deviation)",
      match: ['\\sigma'],
      introduced_by:
        [activation-functions, logistic-regression, gaussian-distribution, maximum-likelihood],
    }
  - {
      id: hadamard,
      label: "⊙ elementwise product",
      match: ['\\odot'],
      introduced_by: [backpropagation],
    }
  - {
      id: indicator,
      label: "𝟙[·] indicator",
      match: ['\\mathbf\s*\{?1\s*\}?\s*\['],
      introduced_by: [backpropagation],
    }
  - {
      id: hyperparameter,
      label: "hyperparameter",
      match: ["hyperparameter"],
      introduced_by: [train-test-split],
    }
  - { id: overfitting, label: "overfitting", match: ["overfit"], introduced_by: [overfitting] }
  - {
      id: regularization,
      label: "regularisation",
      match: ["regulari[sz]"],
      introduced_by: [regularization],
    }
  - { id: softmax, label: "softmax", match: ["softmax"], introduced_by: [classification-softmax] }
  - {
      id: cross-entropy,
      label: "cross-entropy",
      match: ["cross-entropy"],
      introduced_by: [logistic-regression, information-theory],
    }
  - {
      id: cnn,
      label: "CNN / convolution",
      match: ['\bCNN\b', "convolution"],
      introduced_by: [convolutions],
    }
  - {
      id: event-probability,
      label: "P(A) event-probability notation",
      match: ['\bP\((?:A|B)'],
      introduced_by: [probability-basics],
    }
  - {
      id: one-hot-token-vector,
      label: "one-hot vector $u_i$",
      match: ["one-hot vector", '\bu_i\s*E\b'],
      introduced_by: [embeddings],
    }
  - {
      id: one-hot-token-matrix,
      label: "one-hot token matrix $U$",
      match: ['\bUE\b'],
      introduced_by: [embeddings],
    }
  - {
      id: cosine-similarity,
      label: "cosine similarity",
      match: ["cosine similarity"],
      introduced_by: [dot-product],
    }
  - {
      id: permutation-equivariance,
      label: "permutation equivariance",
      match: ['\bpermutation[- ]equivari(?:ance|ant)\b'],
      introduced_by: [positional-encoding],
    }
  - {
      id: positional-encoding,
      label: "positional representations / encoding",
      match: ['\bpositional representations?\b', '\bpositional encodings?\b'],
      introduced_by: [positional-encoding],
    }
  - {
      id: causal-mask,
      label: "causal mask",
      match: ['\bcausal mask\b'],
      introduced_by: [causal-masking],
    }
  - {
      id: causal-mask-value,
      label: "causal mask value $m_{tj}$",
      match: ['m_\{tj\}'],
      introduced_by: [causal-masking],
    }
  - {
      id: expert-router,
      label: "expert router",
      match: ['\brouter\b'],
      introduced_by: [mixture-of-experts],
    }
  - {
      id: top-k-routing,
      label: "top-k routing",
      match: ["top[- ]k routing"],
      introduced_by: [mixture-of-experts],
    }
  - {
      id: load-balancing-loss,
      label: "load-balancing loss",
      match: ["load-balancing loss"],
      introduced_by: [mixture-of-experts],
    }
  - {
      id: supervised-fine-tuning,
      label: "supervised fine-tuning (SFT)",
      match: ['\bSFT\b'],
      introduced_by: [sft],
    }
  - { id: chat-template, label: "chat template", match: ["chat template"], introduced_by: [sft] }
  - {
      id: response-only-loss-masking,
      label: "response-only loss masking",
      match: ["response-only loss masking"],
      introduced_by: [sft],
    }
  - {
      id: lora-rank,
      label: "LoRA rank $r$",
      match: ["LoRA rank", 'rank\s*\$?r\$?'],
      introduced_by: [lora],
    }
  - {
      id: lora-weight-update,
      label: "LoRA weight change $\\Delta W=BA$",
      match: ['\\Delta\s*W', "ΔW"],
      introduced_by: [lora],
    }
  - { id: lora-adapter, label: "LoRA adapter", match: ["LoRA adapter"], introduced_by: [lora] }
