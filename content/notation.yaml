# Lists symbols, terms and ideas (rules, formulas, named methods, code calls) to teach before use.
# Example idea: { id: chain-rule, label: "the chain rule", match: ['chain rule'], introduced_by: [chain-rule] }
# `match` entries are case-insensitive JavaScript regexes applied to lessons and all exercise text.
avoid:
  - pattern: '\b[Ll][Rr]\b'
    use: 'write "learning rate" or $\eta$'
terms:
  - { id: real-space, label: "ℝⁿ notation", match: ['\\mathbb\s*\{?R'], introduced_by: [vectors] }
  - {
      id: sum,
      label: "Σ summation",
      match: ['\\sum'],
      introduced_by: [vectors, supervised-learning],
    }
  - {
      id: transpose,
      label: "transpose ⊤ / .T",
      match: ['\\top', '\.T\b'],
      introduced_by: [matrices],
    }
  - {
      id: matrix,
      label: "matrix notation",
      match: ['\\begin\{[pb]matrix\}'],
      introduced_by: [matrices],
    }
  - {
      id: numpy-matmul,
      label: "NumPy @ / broadcasting",
      match: ['\s@\s', "broadcast"],
      introduced_by: [matrices],
    }
  - {
      id: ones-vector,
      label: "ones vector 𝟏",
      match: ['\\mathbf\s*\{?1(?!\s*\}?\s*\[)'],
      introduced_by: [linear-regression],
    }
  - {
      id: determinant,
      label: "determinant notation",
      match: ['\\det\b'],
      introduced_by: [determinants],
    }
  - { id: limit, label: "limit notation", match: ['\\lim'], introduced_by: [derivatives] }
  - {
      id: exp,
      label: "e powers",
      match: ['\be\^'],
      introduced_by: [derivatives, gaussian-distribution],
    }
  - { id: ln, label: "ln", match: ['\\ln\b'], introduced_by: [derivatives] }
  - {
      id: partial,
      label: "∂ partial derivative",
      match: ['\\partial'],
      introduced_by: [partial-derivatives],
    }
  - { id: nabla, label: "∇ gradient", match: ['\\nabla'], introduced_by: [gradients] }
  - {
      id: composition,
      label: "∘ composition",
      match: ['(?<!\^)(?<!\^\{)\\circ'],
      introduced_by: [chain-rule],
    }
  - { id: argmin, label: "argmin", match: ['\\arg\s*\\?min'], introduced_by: [supervised-learning] }
  - {
      id: mse,
      label: "MSE",
      match: ['\bMSE\b', "mean squared error"],
      introduced_by: [supervised-learning, loss-functions, maximum-likelihood],
    }
  - {
      id: mae,
      label: "MAE",
      match: ['\bMAE\b', "mean absolute error"],
      introduced_by: [loss-functions],
    }
  - {
      id: learning-rate,
      label: "learning rate η",
      match: ["learning rate", '\\eta'],
      introduced_by: [gradient-descent, q-learning],
    }
  - { id: phi, label: "φ activation", match: ['\\phi', '\\varphi'], introduced_by: [perceptron] }
  - { id: hyperplane, label: "hyperplane", match: ["hyperplane"], introduced_by: [perceptron] }
  - {
      id: sigmoid,
      label: "sigmoid σ",
      match: ["sigmoid"],
      introduced_by: [activation-functions, logistic-regression],
    }
  - { id: relu, label: "ReLU", match: ["ReLU"], introduced_by: [activation-functions] }
  - {
      id: sigma,
      label: "σ (sigmoid or standard deviation)",
      match: ['\\sigma'],
      introduced_by:
        [activation-functions, logistic-regression, gaussian-distribution, maximum-likelihood],
    }
  - {
      id: hadamard,
      label: "⊙ elementwise product",
      match: ['\\odot'],
      introduced_by: [backpropagation],
    }
  - {
      id: indicator,
      label: "𝟙[·] indicator",
      match: ['\\mathbf\s*\{?1\s*\}?\s*\['],
      introduced_by: [backpropagation],
    }
  - {
      id: hyperparameter,
      label: "hyperparameter",
      match: ["hyperparameter"],
      introduced_by: [train-test-split],
    }
  - { id: overfitting, label: "overfitting", match: ["overfit"], introduced_by: [overfitting] }
  - {
      id: regularization,
      label: "regularisation",
      match: ["regulari[sz]"],
      introduced_by: [regularization],
    }
  - { id: softmax, label: "softmax", match: ["softmax"], introduced_by: [classification-softmax] }
  - {
      id: cross-entropy,
      label: "cross-entropy",
      match: ["cross-entropy"],
      introduced_by: [logistic-regression, information-theory],
    }
  - {
      id: cnn,
      label: "CNN / convolution",
      match: ['\bCNN\b', "convolution"],
      introduced_by: [convolutions],
    }
  - {
      id: event-probability,
      label: "P(A) event-probability notation",
      match: ['\bP\((?:A|B)'],
      introduced_by: [probability-basics],
    }
  - {
      id: one-hot-token-vector,
      label: "one-hot vector $u_i$",
      match: ["one-hot vector", '\bu_i\s*E\b'],
      introduced_by: [embeddings],
    }
  - {
      id: one-hot-token-matrix,
      label: "one-hot token matrix $U$",
      match: ['\bUE\b'],
      introduced_by: [embeddings],
    }
  - {
      id: cosine-similarity,
      label: "cosine similarity",
      match: ["cosine similarity"],
      introduced_by: [dot-product],
    }
  - {
      id: permutation-equivariance,
      label: "permutation equivariance",
      match: ['\bpermutation[- ]equivari(?:ance|ant)\b'],
      introduced_by: [positional-encoding],
    }
  - {
      id: positional-encoding,
      label: "positional representations / encoding",
      match: ['\bpositional representations?\b(?!\s+lesson\b)', '\bpositional encodings?\b'],
      introduced_by: [positional-encoding],
    }
  - {
      id: causal-mask,
      label: "causal mask",
      match: ['\bcausal mask\b'],
      introduced_by: [causal-masking],
    }
  - {
      id: causal-mask-value,
      label: "causal mask value $m_{tj}$",
      match: ['m_\{tj\}'],
      introduced_by: [causal-masking],
    }
  - {
      id: expert-router,
      label: "expert router",
      match: ['\brouter\b'],
      introduced_by: [mixture-of-experts],
    }
  - {
      id: top-k-routing,
      label: "top-k routing",
      match: ["top[- ]k routing"],
      introduced_by: [mixture-of-experts],
    }
  - {
      id: load-balancing-loss,
      label: "load-balancing loss",
      match: ["load-balancing loss"],
      introduced_by: [mixture-of-experts],
    }
  - {
      id: supervised-fine-tuning,
      label: "supervised fine-tuning (SFT)",
      match: ['\bSFT\b'],
      introduced_by: [sft],
    }
  - { id: chat-template, label: "chat template", match: ["chat template"], introduced_by: [sft] }
  - {
      id: response-only-loss-masking,
      label: "response-only loss masking",
      match: ["response-only loss masking"],
      introduced_by: [sft],
    }
  - { id: lora-rank, label: "LoRA rank $r$", match: ["LoRA rank"], introduced_by: [lora] }
  - {
      id: lora-weight-update,
      label: "LoRA weight change $\\Delta W=BA$",
      match: ['\\Delta\s*W\s*=\s*BA'],
      introduced_by: [lora],
    }
  - { id: lora-adapter, label: "LoRA adapter", match: ["LoRA adapter"], introduced_by: [lora] }
  - {
      id: markov-property,
      label: "Markov property",
      match: ["Markov property"],
      introduced_by: [mdp],
    }
  - {
      id: experience-replay,
      label: "experience replay / replay buffer",
      match: ["experience replay", "replay buffer"],
      introduced_by: [deep-q-learning],
    }
  - {
      id: target-network,
      label: "target network θ⁻",
      match: ["target network", '\\theta\s*\^\s*-'],
      introduced_by: [deep-q-learning],
    }
  - {
      id: sim-to-real-gap,
      label: "sim-to-real gap",
      match: ["sim-to-real gap"],
      introduced_by: [simulation-for-rl],
    }
  - {
      id: domain-randomisation,
      label: "domain randomisation",
      match: ['\*\*domain randomi[sz]ation\*\*'],
      introduced_by: [simulation-for-rl],
    }
  - {
      id: ppo-clip-objective,
      label: "PPO clipped objective $L^{\\text{CLIP}}$",
      match: ['L\^\s*\{?\\text\{CLIP\}\}?'],
      introduced_by: [ppo],
    }
  - { id: ppo-clip-range, label: "PPO clip range", match: ['\bclip range\b'], introduced_by: [ppo] }
  - {
      id: estimated-advantage,
      label: "estimated advantage $\\hat A$",
      match: ['\\hat\s*A'],
      introduced_by: [ppo],
    }
  - {
      id: policy-probability,
      label: "policy probability $\\pi(a\\mid s)$",
      match: ['\\pi\s*\(\s*a\\mid\s*s\s*\)'],
      introduced_by: [policies-returns],
    }
  - {
      id: return-to-go,
      label: "return $G_t$",
      match: ['\bG_t\s*=\s*r_\{t\+1\}'],
      introduced_by: [policies-returns],
    }
  - {
      id: log-product-rule,
      label: "Log product, quotient and reciprocal rules",
      match:
        [
          '\\ln\s*\(?\s*[a-z]\s*\\?(cdot)?\s*[a-z]\s*\)?\s*=\s*\\ln',
          '\\ln\s*\\frac',
          '\\ln\s*\(ab\)\s*=\s*\\ln\s*a\s*\+\s*\\ln\s*b',
          "(?:logs?|logarithms?) turns? products into sums",
          '\b(?:natural[- ]log reciprocal rule|reciprocal rule for logs?)\b',
          '\b(?:natural[- ]log quotient rule|quotient rule for logs?)\b',
        ],
      introduced_by: [derivatives],
    }
  - {
      id: log-change-of-base,
      label: "Change of log base",
      match:
        [
          '\\ln\s*2\s*\)?\s*(\\cdot)?\s*\\log_2',
          "change (of )?(the )?base",
          '\\ln\s*2\s*(?:\\cdot|\\times)\s*\\log_2\b',
        ],
      introduced_by: [derivatives],
    }
  - {
      id: leibniz-derivative,
      label: "df/dx notation",
      match: ['\\frac\{d[a-z]*\}\{d[a-z]\}', '\bd[fy]/d[xt]\b'],
      introduced_by: [derivatives],
    }
  - {
      id: stationary-point,
      label: "Solve f'(x)=0 for a top or bottom",
      match: ["f'\\(x\\)\\s*=\\s*0", "set(ting)? the (derivative|slope) to (zero|0)"],
      introduced_by: [derivatives],
    }
  - {
      id: zero-gradient-extremum,
      label: "Zero gradient at a minimum or maximum",
      match: ["gradient is (the )?zero( vector)?", '\\nabla\s*f\s*=\s*(\\mathbf\{0\}|0)'],
      introduced_by: [gradients],
    }
  - {
      id: independent-product-rule,
      label: "P(A and B)=P(A)P(B)",
      match:
        [
          'P\s*\(\s*A\s*(?:\\text\{\s*and\s*\}|and)\s*B\s*\)\s*=\s*P\s*\(\s*A\s*\)\s*P\s*\(\s*B\s*\)',
          "multiply (the )?independent (chances|probabilities)",
        ],
      introduced_by: [probability-basics],
    }
  - {
      id: det-pivot-rule,
      label: "Determinant from pivots and row swaps",
      match: ['\(-1\)\^\{?\\?(text\{)?swaps', "product of (the )?pivots"],
      introduced_by: [determinants],
    }
  - {
      id: row-operations,
      label: "Row operations (row addition, row swap)",
      match: ['\brow (swap|addition|operation)s?\b', 'R_\d\s*\\(leftarrow|leftrightarrow)'],
      introduced_by: [determinants, inverses-linear-systems],
    }
  - { id: pivot, label: "Pivot", match: ['\bpivots?\b'], introduced_by: [determinants, rank-span] }
  - {
      id: matrix-distributes,
      label: "A(x+y)=Ax+Ay",
      match: ['A\(x\s*\+\s*y\)\s*=\s*Ax\s*\+\s*Ay'],
      introduced_by: [rank-span],
    }
  - {
      id: matrix-shape-notation,
      label: "Matrix shape notation R^{m×n}",
      match: ['\\mathbb\{R\}\^\{\s*\w+\s*\\times'],
      introduced_by: [matrices],
    }
  - {
      id: numpy-array-sum,
      label: "a.sum() / np.sum",
      match: ['\.sum\(\s*\)', '\bnp\.sum\s*\('],
      introduced_by: [matrices],
    }
  - {
      id: ln-exp-inverse,
      label: "Natural log and exponential inverses",
      match: ['\be\^\{\s*\\ln[^{}]+\}\s*=', '\\ln\s*e\^(?:\{[^{}]+\}|\w)\s*='],
      introduced_by: [derivatives],
    }
  - {
      id: mse-batch-gradient,
      label: "Batch MSE weight gradient",
      match:
        [
          '\\frac\{2\s*X\^\{?\\top\}?\s*r\}\{n\}',
          '\b2\s*\*\s*X\.T\s*@\s*r\s*/\s*(?:len\(\s*y\s*\)|n\b)',
        ],
      introduced_by: [gradient-descent],
    }
  - {
      id: prediction-residual-vector,
      label: "Prediction residual vector",
      match: ['\bresidual vector\b', '\br\s*=\s*Xw\s*-\s*y\b'],
      introduced_by: [gradient-descent],
    }
  - {
      id: shifted-square-slope,
      label: "Slope of a shifted square",
      match:
        [
          '\b(?:shifted[- ]square slope|slope of a shifted square)\b',
          'L\(w\)\s*=\s*\(w\s*-\s*\d+\)\s*\^\s*2',
        ],
      introduced_by: [gradient-descent],
    }
  - {
      id: multiclass-recall,
      label: "Per-class recall",
      match: ['\b(?:multiclass|per[- ]class) recall\b', '\bclass[''’]s recall\b'],
      introduced_by: [evaluation-metrics],
    }
  - {
      id: column-mean-axis-zero,
      label: "Column averages with .mean(axis=0)",
      match: ['\.mean\s*\(\s*axis\s*=\s*0\s*\)', '\.sum\(axis=0\)` adds down each column'],
      introduced_by: [backpropagation],
    }
  - {
      id: flat-activation-no-update,
      label: "Flat activation gives no weight update",
      match:
        [
          '\bflat activation\b[^.!?\n]{0,100}\b(?:weight|update|loss)\b',
          '\bactivation''s slope\b[^.!?\n]{0,100}\b(?:loss|update)\b',
          '\bactivation is flat\b[^.\n]{0,100}\bweight\b',
        ],
      introduced_by: [activation-functions],
    }
  - {
      id: finite-difference-rounding,
      label: "Rounding error with tiny finite-difference nudges",
      match: ['\b(?:tiny|very small) nudges?\b[^.!?\n]{0,100}\brounding\b'],
      introduced_by: [backpropagation],
    }
  - {
      id: independent-weight-draws,
      label: "Independent weight draws",
      match:
        [
          '\bindependent\s+(?:random\s+)?weights?\b',
          '\bweights?\s+(?:are|were)\s+(?:chosen|drawn|sampled)\s+\*{0,2}independently\*{0,2}\b',
        ],
      introduced_by: [weight-init-normalization],
    }
  - {
      id: cross-term-cancellation-in-average,
      label: "Cross terms cancel on average",
      match:
        [
          '\bcross[- ]terms?\s+(?:cancels?\s+on\s+average|averages?\s+to\s+\$?(?:0|zero)\b|cancellation\b)',
        ],
      introduced_by: [weight-init-normalization],
    }
  - {
      id: gradient-descent-weight-update,
      label: "Subtract learning rate times slope",
      match:
        [
          '\bsubtract(?:s|ing)?\s+(?:the\s+)?learning\s+rate\s+times\s+the\s+(?:loss[''’]s\s+)?(?:slope|gradient)\b',
          'w_\{\\text\{new\}\}&=w-\\eta',
        ],
      introduced_by: [gradient-descent],
    }
  - {
      id: probability-weighted-average,
      label: "Average weighted by outcome probability",
      match: ['\b(?:multiply|weight)\s+each\s+(?:outcome|value)\s+by\s+its\s+probability\b'],
      introduced_by: [probability-basics, regularization],
    }
  - {
      id: neural-network-unit,
      label: "Neural-network unit",
      match:
        [
          '\b(?:neural[- ]network|hidden[- ]layer)\s+units?\b',
          '\blayers?\s+of\s+(?:simple\s+)?(?:units|neurons)\b',
          '\bartificial neurons?\b',
          '\bartificial \*\*neuron\*\*',
          '\bgroup of neurons\b',
          '\*\*unit\*\* computes one number from its inputs\b',
        ],
      introduced_by: [perceptron, mlp-forward-pass, regularization],
    }
  - {
      id: dropout-output-rescaling,
      label: "Rescale the kept output during dropout",
      match:
        [
          '\binverted\s+dropout\b',
          '\bdropout\s+scales?\s+(?:up\s+)?the\s+(?:kept|retained)\s+outputs?\b',
        ],
      introduced_by: [regularization],
    }
  - {
      id: model-checkpoint,
      label: "Saved training checkpoint",
      match:
        [
          '\b(?:model|training|validation)\s+checkpoints?\b',
          '\bcheckpoint\s+selection\b',
          '\bwhich\s+checkpoint\s+would\s+you\s+keep\b',
          '\b(model|training) checkpoints?\b',
          '\bsaved copy is called a \*\*checkpoint\*\*',
          '\bsaves \*\*checkpoints\*\*',
        ],
      introduced_by: [overfitting, pretraining],
    }
  - {
      id: pytorch-optimizer-calls,
      label: "PyTorch optimizer reset and update",
      match: ['\boptimizer\.(?:zero_grad|step)\(\s*\)'],
      introduced_by: [pytorch-basics],
    }
  - {
      id: pytorch-backward-call,
      label: "PyTorch loss.backward()",
      match: ['\bloss\.backward\(\s*\)'],
      introduced_by: [autodiff, pytorch-basics],
    }
  - {
      id: pytorch-model-mode,
      label: "PyTorch training and evaluation mode",
      match: ['\bmodel\.(?:train|eval)\(\s*\)'],
      introduced_by: [pytorch-basics],
    }
  - {
      id: pytorch-no-grad,
      label: "PyTorch torch.no_grad()",
      match: ['\btorch\.no_grad\(\s*\)'],
      introduced_by: [pytorch-basics],
    }
  - {
      id: training-label,
      label: "Training label",
      match:
        [
          '\b(?:training|class)\s+labels?\b',
          '\bunlabell?ed\s+(?:photos?|images?|examples?)\b',
          '\blabel from a fixed list\b',
        ],
      introduced_by: [supervised-learning, autoencoders],
    }
  - {
      id: bpe-overlapping-pairs,
      label: "BPE replacements that share a token",
      match:
        [
          '\b(?:BPE|tokenizer)\b[^\n.!?]{0,70}\b(?:non[- ]overlapping|overlapping) (?:token )?pairs?\b',
          '\b(?:apply the merge|replay the merges)\b[^\n.!?]{0,80}\bleft to right\b',
        ],
      introduced_by: [tokenization],
    }
  - {
      id: reshape-versus-transpose,
      label: "Reshaping and transposing array axes",
      match:
        [
          '\breshape\b[^\n!?]{0,90}\btranspose\b|\btranspose\b[^\n!?]{0,90}\breshape\b',
          '\.reshape\([^)\n]*\)\.transpose\(',
        ],
      introduced_by: [images-as-tensors, multi-head-attention],
    }
  - {
      id: backprop-local-slope,
      label: "Multiply an arriving loss slope by the local derivative",
      match:
        ['\b(?:arriving|incoming) (?:loss )?slope\b[^.\n]{0,85}\blocal (?:slope|derivative)\b'],
      introduced_by: [backpropagation],
    }
  - {
      id: layernorm-gain-shift,
      label: "Learned gain and shift in LayerNorm",
      match: ['\bLayerNorm\b[^.!?\n]{0,135}\bgains?\b[^.!?\n]{0,60}\bshifts?\b'],
      introduced_by: [weight-init-normalization],
    }
  - {
      id: softmax-subtract-max,
      label: "Subtract the row maximum before softmax",
      match:
        [
          '\bsubtract(?:s|ed|ing)? (?:the )?row max(?:imum)?\b',
          '\bsoftmax\b[^\n!?]{0,100}\bsubtract(?:s|ed|ing)? (?:the )?(?:max(?:imum)?|largest score)\b',
          '\bnp\.exp\(\s*\w+\s*-\s*\w+\.max\(\s*axis\s*=',
        ],
      introduced_by: [transformer-block],
    }
  - {
      id: tied-embedding-weights,
      label: "Weight tying between embeddings and output scores",
      match: ['\bweight[- ]tying\b|\btied (?:input and output )?embeddings\b'],
      introduced_by: [transformer-block],
    }
  - {
      id: shifted-next-token-targets,
      label: "Shifted targets for next-token prediction",
      match:
        [
          '\bshifted next[- ](?:token|word) targets?\b|\bnext[- ](?:token|word) targets? (?:is|are) shifted\b',
          '\btargets?\b[^\n.!?]{0,65}\bshifted (?:left|right) by one\b',
          '\$?T\$?\s+inputs give \$?T\$?\s+scored guesses with a following token\b',
        ],
      introduced_by: [causal-masking],
    }
  - {
      id: numpy-where,
      label: "Elementwise selection with NumPy where",
      match: ['\bnp\.where\s*\('],
      introduced_by: [backpropagation, causal-masking],
    }
  - {
      id: uniform-token-sampling,
      label: "Uniform draws over next-token probability intervals",
      match:
        [
          '\buniform draw\b[^.\n]{0,100}\b(?:sampling|intervals?|next[- ]token)\b',
          '\brandom\.random\s*\(\s*\)[^.\n]{0,100}\buniform(?:ly)?\b',
        ],
      introduced_by: [autoregressive-lm],
    }
  - {
      id: greedy-lowest-id-tie-break,
      label: "Greedy decoding ties go to the lowest vocabulary ID",
      match: ['\blowest vocabulary id\b|\bgreedy (?:decoding )?tie[- ]break(?:er|ing)?\b'],
      introduced_by: [autoregressive-lm],
    }
  - {
      id: held-out-test-text,
      label: "Held-out test text",
      match: ['\bheld[- ]out test text\b', '\btest text is held out\b'],
      introduced_by: [pretraining],
    }
  - {
      id: success-rate-se,
      label: "Standard error of a success rate",
      match:
        [
          '\\sqrt\{?\s*\\frac\{\\hat p\(1-\\hat p\)\}',
          '\\sqrt\{\\hat p\(1-\\hat p\)/n\}',
          '\bstandard errors?\b',
        ],
      introduced_by: [descriptive-statistics],
    }
  - {
      id: gpu-thread-group,
      label: "GPU threads and thread groups",
      match: ['\bgroups? of threads\b', '\bthread blocks?\b'],
      introduced_by: [fast-attention],
    }
  - {
      id: endless-geometric-series,
      label: "Endless geometric series sum",
      match:
        [
          "endless geometric series",
          '1\s*/\s*\(\s*1\s*-\s*\\gamma\s*\)',
          '\\frac\s*\{1\}\s*\{1-\\gamma\}',
        ],
      introduced_by: [policies-returns],
    }
  - {
      id: policy-log-derivative-trick,
      label: "Policy log-derivative trick",
