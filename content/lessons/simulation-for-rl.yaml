summary: |
  - A simulation environment is an MDP written as code. reset starts an episode and returns the start state, and step applies one action and returns the next state, the reward and whether the episode has ended.
  - The interaction loop calls reset once, then repeats "the policy picks an action, step applies it, add up the reward" until step says terminated (a terminal state was reached) or truncated (the time limit cut the episode short).
  - A vectorised environment steps $N$ copies at once, so each call gives $N$ transitions, and it resets each finished copy by itself while the others carry on.
  - A policy trained in simulation can do worse on the real robot, which is the sim-to-real gap. Domain randomisation, matching the simulator to measurements and brief practice on the real robot help close it.

  **Next:** The sim-to-real transfer lesson goes deeper into these fixes and how they're used on real robots.
