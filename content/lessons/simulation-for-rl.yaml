      In the simulator, jumping then stepping right earns $-1+10=9$, beating walking's $8$. An agent that learns to jump there falls half the time on the real floor. Be careful: the best simulated score doesn't prove the robot is ready.

      ### Closing the gap

      A common fix is **domain randomisation**. At every reset, the simulator draws uncertain settings from a range, such as the jump's chance of working. The policy learns to do well across the range. If it includes the real conditions, the real world is one more variation. In 2018, OpenAI trained a robot hand this way in simulation to turn a cube, then ran the policy on the real hand.

      Other fixes are measuring the real robot to set the simulator, and practising briefly on the real robot at the end. Choose a range that covers plausible real-world conditions. In conditions outside the training range, the policy might work poorly on the real robot. A policy that copes with everything can be more cautious than it needs to be in any one setting, like our robot walking even on a floor where the jump would work.
    worked: |
      Let's compare the two policies, jumping and walking, using the expected value. That's the average total reward over many episodes. Each outcome is weighted by its probability, so an outcome that happens half the time counts for half.

      1. **In the simulator.** The jump always works, so jumping then stepping right earns more than walking, which takes three steps.
         $$\begin{aligned}\text{jump: }&-1+10=9\\\text{walk: }&-1-1+10=8\end{aligned}$$

      2. **Jumping on the real floor.** Half the time the jump works and the episode earns 9. Half the time the robot falls and earns $-10$.
         $$0.5\times9+0.5\times(-10)=-0.5$$

      3. **Walking on the real floor.** Moves left and right work on the real floor exactly as in the simulator.
         $$-1-1+10=8$$

      4. **Jumping under each randomised setting.** With domain randomisation, each reset draws the jump's chance of working from $0.5$, $0.75$ and $1$, each equally likely, and the agent isn't told which was drawn, so it can't jump only when the jump is safe. A jump that works earns 9 and a fall earns $-10$.
         $$
         \begin{aligned}
         0.5\times9+0.5\times(-10)&=-0.5 &&\text{success chance one half}\\
         0.75\times9+0.25\times(-10)&=4.25 &&\text{success chance three quarters}\\
         1\times9&=9 &&\text{certain success}
         \end{aligned}
         $$

      5. **Average over the settings.** Two chances are at work. The reset picks a floor, then on that floor the jump works or fails. Each row above already covers the second chance, so we only need to average over the floors. Each comes up a third of the time, so jumping's expected total is the average of the three.
         $$\frac{-0.5+4.25+9}{3}=4.25$$

         This matches the middle row because jumping's total rises evenly with the chance, and the three chances average to $0.75$.

      In the randomised simulator jumping is worth $4.25$ on average and walking is worth $8$, so the agent learns to walk, which is also the right choice on the real floor.
