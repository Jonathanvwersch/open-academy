summary: |
  - A residual connection adds a sublayer's output to its input, $y=x+f(x)$, so every sublayer returns width $d$ and a slope can pass back through the shortcut with a factor near $1$.
  - A transformer block has two sublayers, each with its own shortcut. Attention lets each token read every token, giving $u_t=x_t+\text{Attn}(x_1,\dots,x_T)_t$. Then an MLP with the same weights at every position processes each token's vector on its own, giving $y_t=u_t+\text{MLP}(u_t)$.
  - In a pre-norm block, LayerNorm rescales only the copy that goes into each sublayer, so $u_t=x_t+\text{Attn}(\text{LN}(x_1),\dots,\text{LN}(x_T))_t$ and $y_t=u_t+\text{MLP}(\text{LN}(u_t))$. The shortcuts carry only additions, so the model adds one final LayerNorm after its last block.
  - Each block maps $T\times d$ to $T\times d$, so blocks stack, and one block has $12d^2+13d$ parameters: $4d^2$ in attention's weights and $8d^2$ in the MLP's.

  **Next:** The causal masking lesson stops each token's attention from reading the tokens after it, so a stack of these blocks can learn to predict the next token.
