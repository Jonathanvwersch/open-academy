      - tbp-sublayers-mlp-value
      - tbp-sublayers-which-mixes
      - tbp-sublayers-hidden-width
      - tbp-sublayers-robot
  - id: tb-pre-norm
    title: "Rescale each sublayer's input"
    explain: |
      ### Keeping the inputs a steady size

      A block has two **sublayers**, attention and an MLP. Each has a **shortcut** adding its input to its output, so token vectors can grow as they pass through many blocks. The sublayers' weights are tuned to inputs of a steady size, so the block normalizes each sublayer's input. In the initialization lesson, LayerNorm rescaled one example's outputs to mean $0$ and standard deviation $1$. Here it rescales one token's vector at a time.

      To watch LayerNorm work on more than two numbers, we give one token four, $x=(-6,0,2,8)$, so here $d=4$. LayerNorm turns them into four numbers with mean $0$ and standard deviation $1$, and the worked example finds them.

      ### Where the LayerNorm goes

      On the left, the green LayerNorm boxes sit before each sublayer. Each reads a normalized copy, and its output is added to the original vector. This is **pre-norm**. Writing $\text{LN}$ for LayerNorm and $\text{Attn}(\dots)_t$ for attention's output at token position $t$, the block computes

      $$u_t=x_t+\text{Attn}\big(\text{LN}(x_1),\dots,\text{LN}(x_T)\big)_t$$

      $$y_t=u_t+\text{MLP}\big(\text{LN}(u_t)\big).$$

      On the right is **post-norm**, the layout of the original 2017 transformer, where LayerNorm comes after each addition, as in $u_t=\text{LN}\big(x_t+\text{Attn}(x_1,\dots,x_T)_t\big)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" aria-label="Two block layouts side by side, each read from top to bottom. Left, pre-norm: x goes into a green LayerNorm box, then the blue attention box, and the result is added to x carried by a grey shortcut; that sum goes into a second LayerNorm, then the orange MLP, and is added to the sum by a second shortcut, giving y. Nothing sits on the shortcuts. Right, post-norm: x goes into attention, is added to x by a shortcut, and only then goes through LayerNorm; the same happens with the MLP, so a LayerNorm sits on the shortcut path after each addition">
      <defs><marker id="tb3-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="tb3-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#171717"/></marker></defs>
