  - id: tb-stack
    title: "Stack blocks and count their weights"
    explain: |
      ### Same shape in, same shape out

      A single block takes $T$ vectors of width $d$ and returns $T$ vectors of width $d$. So the output of one block can be the input of the next, and a model is just many blocks in a row, each with its own weights.

      The picture shows a whole model. The tokens "the cat sat on" become $T=4$ vectors of width $d$, from the embedding table plus position information. They pass through blocks keeping shape $T\times d$. A final LayerNorm rescales each token's vector before an output layer turns it into one score per vocabulary token, $N$ scores, to predict the next token.

