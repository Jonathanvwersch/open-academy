      ### Counting a block's weights

      How big is one block? Counting its parameters (weights, biases, gains and shifts) tells us how much memory a model needs and which part holds most of them. Attention has four $d\times d$ weight matrices, each with a bias vector of length $d$. $W_Q$, $W_K$ and $W_V$ make the queries, keys and values for all $h$ heads together, since $h$ heads of width $d/h$ fill $d$ columns. A fourth matrix, $W_O$, mixes the joined heads' outputs back into width $d$. The MLP has $W_1$, of shape $4d\times d$, and $W_2$, of shape $d\times4d$. So the weight matrices hold

      $$4d^2+8d^2=12d^2$$

      numbers. The biases add $4d$ for attention and $4d+d$ for the MLP. In the **pre-norm** layout, one LayerNorm rescales the input to attention and another rescales the input to the MLP. Each has a gain and shift, adding $4d$ more. A block with $4d$ hidden neurons therefore has $12d^2+13d$ parameters.

      The $d^2$ term dominates at real sizes. GPT-2 small has $d=768$ and $12$ blocks, so each block has $7{,}087{,}872$ parameters and the blocks hold about $85$ million. The whole model has about $124$ million, and most of the rest is the embedding table, with one row of width $768$ for each of the $50{,}257$ tokens in its vocabulary. GPT-2 reuses that table as its output layer.

      Be careful not to count a head's weights once per head at full width. Each head's $W_Q$ is only $d\times d/h$, so the $h$ heads together fill $d\times d$.
    worked: |
      Let's count the parameters of one block with width $d=4$, the size the code below uses.

      1. **Count attention's weights and biases.** There are four $4\times4$ matrices and four bias vectors of length $4$.
         $$4\times16+4\times4=80$$

      2. **Count the MLP's weights and biases.** The hidden layer has $4d=16$ neurons, so $W_1$ is $16\times4$ with $16$ biases, and $W_2$ is $4\times16$ with $4$ biases.
         $$64+16+64+4=148$$

      3. **Count the two LayerNorms.** Each has a gain and a shift for every one of the $4$ entries.
         $$2\times(4+4)=16$$

      4. **Add them up.** This matches the formula $12d^2+13d$.
         $$80+148+16=244=12\times16+13\times4$$

      Here is a pre-norm block in Python with NumPy, using one attention head. Four random token vectors stand in for "the cat sat on", and `rng.normal(0, 0.5, shape)` fills each weight array with random numbers of spread $0.5$. `x @ W` is a matrix product, `.T` transposes, `axis=-1` works along each row (one token), and `keepdims=True` keeps the result as a column so it lines up with each row. `x.var` is the variance, the square of the standard deviation, and the tiny `1e-5` stops a division by zero. `np.maximum(z, 0)` is ReLU. `make_block` returns a dictionary of named arrays, `p["Wq"]` looks one up, and `w.size` counts the numbers in an array.

      ```python
      import numpy as np

      rng = np.random.default_rng(0)
      T, d = 4, 4  # 4 tokens, width 4

      def layer_norm(x, gain, shift):
          mu = x.mean(axis=-1, keepdims=True)
          var = x.var(axis=-1, keepdims=True)
          s = np.sqrt(var + 1e-5)
          return gain * (x - mu) / s + shift

      def softmax(z):
          e = np.exp(z - z.max(axis=-1, keepdims=True))
          return e / e.sum(axis=-1, keepdims=True)

      def make_block():
          shapes = {
              "Wq": (d, d), "bq": (d,),
              "Wk": (d, d), "bk": (d,),
              "Wv": (d, d), "bv": (d,),
              "Wo": (d, d), "bo": (d,),
              "W1": (d, 4 * d), "b1": (4 * d,),
              "W2": (4 * d, d), "b2": (d,),
          }
          p = {}
          for name, shape in shapes.items():
              p[name] = rng.normal(0, 0.5, shape)
          p["g1"], p["g2"] = np.ones(d), np.ones(d)
          p["c1"], p["c2"] = np.zeros(d), np.zeros(d)
          return p

      def block(x, p):
          n = layer_norm(x, p["g1"], p["c1"])
          q = n @ p["Wq"] + p["bq"]
          k = n @ p["Wk"] + p["bk"]
          v = n @ p["Wv"] + p["bv"]
          a = softmax(q @ k.T / np.sqrt(d))
          u = x + (a @ v) @ p["Wo"] + p["bo"]
          n = layer_norm(u, p["g2"], p["c2"])
          hid = np.maximum(n @ p["W1"] + p["b1"], 0)
          return u + hid @ p["W2"] + p["b2"]

      x = rng.normal(0, 1, (T, d))
      blocks = [make_block() for _ in range(3)]
      for p in blocks:
          x = block(x, p)
      print(x.shape)
      print(sum(w.size for w in blocks[0].values()))
      # prints (4, 4), then 244
      ```

      The MLP's matrices are stored here as `W1` of shape $d\times4d$ and `W2` of shape $4d\times d$, transposed from $W_1$ and $W_2$ in the count, because each token is a row of `x`. The shape stays $(4,4)$ through all three blocks, and each block has the $244$ parameters we counted.
