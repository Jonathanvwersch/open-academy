      ### Why pre-norm is used

      In pre-norm, follow the route from $x$ to $y$ along the grey shortcuts and the main line through the plus signs. It passes through only additions. So a slope can travel from the last block to the first along the shortcuts, as in step 1. In post-norm, every LayerNorm sits on that route. Xiong and colleagues showed in 2020 that in post-norm the slopes for the layers near the output are large at the start of training, so big early steps can throw training off, and it needs a learning rate that starts small and rises, while pre-norm doesn't need that. GPT-2, an OpenAI language model from 2019, used pre-norm, and most language models since have too.

      Because nothing normalizes the shortcut path, a pre-norm model adds one final LayerNorm after its last block, so the output layer also reads normalized vectors.

      Be careful not to add the sublayer's output to the normalized copy. The normalized copy only feeds the sublayer, and the sum uses the original $x$.
    worked: |
      Let's run the attention half of a pre-norm block for the token $x=(-6,0,2,8)$. Attention reads $\text{LN}(x)$ along with the other tokens' normalized vectors, and we'll skip that part and say its output for this token is $(1,1,-1,-1)$.

      1. **Find the mean.** We add the four numbers and divide by $4$.
         $$\mu=\frac{-6+0+2+8}{4}=1$$

      2. **Find the standard deviation.** The differences from the mean are $-7,-1,1,7$, and we average their squares.
         $$s=\sqrt{\frac{49+1+1+49}{4}}=\sqrt{25}=5$$

      3. **Normalize the copy for attention.** With gain $1$ and shift $0$, we subtract the mean and divide by $s$.
         $$\text{LN}(x)=\left(\tfrac{-7}{5},\tfrac{-1}{5},\tfrac{1}{5},\tfrac{7}{5}\right)=(-1.4,-0.2,0.2,1.4)$$

      4. **Add attention's output to the original vector.** The shortcut carries $x$ itself.
         $$u=(-6,0,2,8)+(1,1,-1,-1)=(-5,1,1,7)$$

      The result $u$ still has the large entries of $x$, and that's fine, because what LayerNorm keeps steady is the input each sublayer reads. Only attention's input was rescaled, and the MLP half does the same with $\text{LN}(u)$.
