  - id: tb-two-sublayers
    title: "Run attention, then an MLP"
    explain: |
      ### Two sublayers with different jobs

      A transformer block has two parts called **sublayers**. First comes attention, which lets tokens share information, then an MLP, which works on each token's vector by itself. Each has a **shortcut** that adds its input to its output. For now we leave normalization out, and step 3 adds it.

      Let's take the first two words of the sentence "the cat sat on the mat", with one token per word and width $d=2$. "the" has the vector $x_1=(2,0)$ and "cat" has $x_2=(1,-2)$. We use a single attention head and leave out the output matrix $W_O$. We also skip the queries and keys and simply give the attention weights and the value vectors, $v_1=(4,0)$ and $v_2=(0,4)$. Attention gives "cat" weights $0.25$ on "the" and $0.75$ on itself, so its output is $(1,3)$, and the shortcut turns it into $u_2=(2,1)$. "the" gets weights $0.5$ and $0.5$, so its output is $(2,2)$ and $u_1=(4,2)$. Then each token goes through the MLP separately.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" aria-label="Two tokens, the and cat, pass through one block from top to bottom. The blue attention box spans both tokens: it gives cat 0.25 of the value vector of the and 0.75 of its own, (1, 3). After the shortcut is added, the tokens hold u1 = (4, 2) and u2 = (2, 1). Each then goes through its own orange MLP box, and both boxes use the same weights, giving y1 = (6, 0) and y2 = (3, 0)">
      <defs><marker id="tb2-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#171717"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="170" y="30" text-anchor="middle">the: x₁ = (2, 0)</text>
      <text x="470" y="30" text-anchor="middle">cat: x₂ = (1, −2)</text>
      <path d="M170 40 V68" stroke="#171717" stroke-width="2" marker-end="url(#tb2-dark)"/><path d="M470 40 V68" stroke="#171717" stroke-width="2" marker-end="url(#tb2-dark)"/>
      <rect x="60" y="70" width="520" height="60" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
      <text x="320" y="95" text-anchor="middle" fill="#3b82f6">attention: each token reads every token</text>
      <text x="320" y="118" text-anchor="middle">cat’s output: 0.25 × v₁ + 0.75 × v₂ = (1, 3)</text>
      <path d="M170 130 V148" stroke="#171717" stroke-width="2" marker-end="url(#tb2-dark)"/><path d="M470 130 V148" stroke="#171717" stroke-width="2" marker-end="url(#tb2-dark)"/>
      <text x="170" y="168" text-anchor="middle">u₁ = x₁ + (2, 2) = (4, 2)</text>
      <text x="470" y="168" text-anchor="middle">u₂ = x₂ + (1, 3) = (2, 1)</text>
      <path d="M170 176 V194" stroke="#171717" stroke-width="2" marker-end="url(#tb2-dark)"/><path d="M470 176 V194" stroke="#171717" stroke-width="2" marker-end="url(#tb2-dark)"/>
      <rect x="100" y="196" width="140" height="44" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      <text x="170" y="223" text-anchor="middle" fill="#f59e0b">MLP</text>
      <rect x="400" y="196" width="140" height="44" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      <text x="470" y="223" text-anchor="middle" fill="#f59e0b">MLP</text>
      <path d="M248 218 H392" stroke="#d4d4d4" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="320" y="210" text-anchor="middle" fill="#737373">same weights</text>
      <path d="M170 240 V268" stroke="#171717" stroke-width="2" marker-end="url(#tb2-dark)"/><path d="M470 240 V268" stroke="#171717" stroke-width="2" marker-end="url(#tb2-dark)"/>
      <text x="170" y="290" text-anchor="middle">y₁ = u₁ + MLP(u₁) = (6, 0)</text>
      <text x="470" y="290" text-anchor="middle">y₂ = u₂ + MLP(u₂) = (3, 0)</text>
      </g>
      </svg>
      ```

      ### The block's two sums

      For a sequence of $T$ tokens with vectors $x_1,\dots,x_T$, the block computes, at each position $t$,

      $$u_t=x_t+\text{Attn}(x_1,\dots,x_T)_t$$

      $$y_t=u_t+\text{MLP}(u_t).$$

      $\text{Attn}(\dots)_t$ is attention's output at position $t$, and it depends on every token. The MLP is a two-layer network with a nonlinearity such as ReLU, and it reads only $u_t$. GPT-2 uses GELU, a smooth version of ReLU. Our examples use $\text{MLP}(u)=W_2\,\text{ReLU}(W_1u+b_1)+b_2$. The hidden layer is usually $4d$ wide; our example uses $4$ neurons, fewer than $4d=8$, and zero biases.

      The MLP uses the same weights at every position, just as an MLP uses the same weights for every example in a batch. Stacked together, the $T$ token vectors form a $T\times d$ matrix, and the MLP treats each row as one example.

      An average can only blend value vectors the tokens already have. The MLP's nonlinearity lets each token compute new features from what it gathered.

      Be careful not to expect the MLP to move information between tokens. If we changed "the", the MLP's output for "cat" would only change through $u_2$, which attention computed. Attention is the only place where tokens read each other.
    worked: |
      Let's run "cat" through the block, from $x_2=(1,-2)$, using the attention weights $0.25$ and $0.75$ and the value vectors $v_1=(4,0)$ and $v_2=(0,4)$.

      1. **Mix the value vectors.** Attention's output is the weighted sum of the values.
         $$0.25\times(4,0)+0.75\times(0,4)=(1,3)$$

      2. **Add the first shortcut.** We add attention's output to the token's own vector.
         $$u_2=(1,-2)+(1,3)=(2,1)$$

      3. **Run the MLP's hidden layer.** We make up small weights, $W_1=\begin{pmatrix}1&0\\0&1\\1&-1\\-1&1\end{pmatrix}$, so the scores are $(2,1,2-1,-2+1)$, and ReLU turns the negative one into $0$.
         $$\text{ReLU}\big((2,1,1,-1)\big)=(2,1,1,0)$$

      4. **Run the MLP's output layer.** The weights are $W_2=\begin{pmatrix}1&0&-1&0\\0&-1&0&1\end{pmatrix}$.
         $$\text{MLP}(u_2)=(2-1,\ -1+0)=(1,-1)$$

      5. **Add the second shortcut.** We add the MLP's output to $u_2$.
         $$y_2=(2,1)+(1,-1)=(3,0)$$

      For "the", the same $W_1$ and $W_2$ turn $u_1=(4,2)$ into $\text{MLP}(u_1)=(2,-2)$, so $y_1=(6,0)$.
