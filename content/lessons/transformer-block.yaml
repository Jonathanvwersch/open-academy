concept: transformer-block
version: 1
objective: |
  **Goal:** draw a pre-norm transformer block and explain what each part does: LayerNorm before each sublayer, attention that mixes the tokens, an MLP that processes each token on its own, and the residual connections that add each sublayer's output back to its input.
recap:
  - concept: multi-head-attention
    text: "Attention uses $h$ heads of width $d_k=d/h$. Each token makes $q_t$, $k_t$ and $v_t$ using $W_Q$, $W_K$ and $W_V$. Scores $q_t\\cdot k_j/\\sqrt{d_k}$ become softmax weights mixing values; joined heads are mixed by $W_O$."
  - concept: positional-encoding
    text: "The original design adds a position vector to each token's embedding before the first block; rotary encodings instead apply position information inside attention by rotating queries and keys."
  - concept: weight-init-normalization
    text: "LayerNorm subtracts an example's mean $\\mu$, divides by its standard deviation $s$, then applies a learned gain $\\gamma$ and shift $\\beta$. A slope passing back through many layers is multiplied at each one, so it can vanish."
  - concept: mlp-forward-pass
    text: "A layer computes $h=\\phi(Wx+b)$: one weighted sum per neuron, then an activation such as ReLU on each score. An MLP runs layers like this in order, using the same weights for every example in a batch."
where_this_fits: |
  ### What is a transformer block?

  A transformer block updates each token's width-$d$ vector using attention, an MLP, shortcuts and normalization. Repeating blocks builds a model.

  The MLP applies a nonlinearity such as ReLU to process each token separately.
knowledge_points:
  - id: tb-residual
    title: "Add a layer's output to its input"
    explain: |
      ### A shortcut around each part

      A transformer block has two parts, attention and an MLP, and a language model stacks dozens of blocks. A slope passing back through many layers is multiplied at each one, so it can shrink to almost nothing. The block keeps it alive by adding each part's output to that part's input.

      Take one token whose vector is $x=(1,-2)$, so the width is $d=2$. Some part of the block, which we'll call $f$, reads $x$, and we'll say it outputs $f(x)=(1,3)$. In the picture, $x$ travels two ways, up through $f$ along the blue path and straight along the grey shortcut. At the plus sign the two are added, giving $(2,1)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" aria-label="A residual connection for one token. The input x = (1, -2) goes two ways: up through the sublayer f, which outputs f(x) = (1, 3), and straight along a grey shortcut around it. At the plus sign the two are added, giving y = (2, 1)">
      <defs><marker id="tb1-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="tb1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="20" y="130" width="120" height="44" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
      <text x="80" y="157" text-anchor="middle">x = (1, −2)</text>
      <path d="M140 152 H452" stroke="#737373" stroke-width="2.5" fill="#ffffff" fill-opacity="0" marker-end="url(#tb1-grey)"/>
      <text x="297" y="176" text-anchor="middle" fill="#737373">shortcut: x itself</text>
      <path d="M150 152 V70 H228" stroke="#3b82f6" stroke-width="2.5" fill="#ffffff" fill-opacity="0" marker-end="url(#tb1-blue)"/>
      <rect x="230" y="48" width="160" height="44" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
      <text x="310" y="75" text-anchor="middle">sublayer f</text>
      <path d="M390 70 H470 V134" stroke="#3b82f6" stroke-width="2.5" fill="#ffffff" fill-opacity="0" marker-end="url(#tb1-blue)"/>
      <text x="480" y="108" fill="#3b82f6">f(x) = (1, 3)</text>
      <circle cx="470" cy="152" r="16" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
      <text x="470" y="158" text-anchor="middle" font-size="18">+</text>
      <path d="M486 152 H518.2" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#tb1-grey)"/>
      <rect x="520" y="130" width="110" height="44" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.5"/>
      <text x="575" y="157" text-anchor="middle">y = (2, 1)</text>
      </g>
      </svg>
      ```

      ### The residual connection

      A **residual connection** adds a layer's output to the layer's own input:

      $$y=x+f(x).$$

      Here $x$ is the input vector, $f$ is the layer and $y$ is the result. A layer inside a block is often called a **sublayer**. Because $x$ already reaches the output along the shortcut, the sublayer only has to learn how to change $x$, and the sum only works when $f(x)$ has the same width $d$ as $x$. So every sublayer in a transformer block returns vectors of width $d$.

      ### Why the shortcut keeps slopes alive

      Let's go back to one number per layer, as in the initialization lesson. Call the number going into a layer $z$, and say each sublayer is $f(z)=0.1z$, with a local slope of $0.1$. A slope passing through such a sublayer is multiplied by $0.1$. With a shortcut, the layer computes $z+0.1z$, whose local slope is $1+0.1=1.1$. The $1$ comes from the shortcut, and it's there whatever the sublayer's weights are. Over four layers:

      - with no shortcuts, the slope is multiplied by $0.1^4=0.0001$;
      - with shortcuts, it's multiplied by $1.1^4\approx1.46$;
      - with shortcuts and a sublayer whose slope is $0$, it's multiplied by exactly $1$.

      So when each sublayer's slope is small, every factor is close to $1$, and the slope reaching the first layers stays usable.

      Be careful not to read "shortcut" as "the sublayer is skipped". Both paths run on every forward pass, and their results are added.
    worked: |
      Let's add the shortcut for the token $x=(1,-2)$, and then follow a slope back through four layers that each compute $z+0.1z$.

      1. **Add the sublayer's output to its input.** The sublayer gave $f(x)=(1,3)$, and we add it entry by entry.
         $$y=x+f(x)=(1+1,\ -2+3)=(2,1)$$

      2. **Find one layer's local slope.** Each layer outputs $z+0.1z$, so nudging $z$ moves the output by $1$ from the shortcut plus $0.1$ from the sublayer.
         $$\frac{d}{dz}(z+0.1z)=1+0.1=1.1$$

      3. **Pass a slope of $1$ back through four layers.** It's multiplied by $1.1$ at each one.
         $$1\times1.1\times1.1\times1.1\times1.1=1.4641$$

      4. **Compare with no shortcuts.** Each layer would then be $0.1z$, with local slope $0.1$.
         $$0.1^4=0.0001$$

      With shortcuts, the slope that reaches the first layer is about $1.46$. Without them it's $0.0001$, more than ten thousand times smaller, so the first layers would barely learn.
