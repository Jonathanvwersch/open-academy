concept: sft
version: 1
objective: "**Goal:** Explain how supervised fine-tuning teaches a pretrained model to answer prompts, and implement a loss that scores only response tokens while keeping the prompt as context."
recap:
  - concept: pretraining
    text: "Pretraining is an initial stage of language-model training; later stages adapt the pretrained model for a particular use."
where_this_fits: |
  ### What is supervised fine-tuning?

  Supervised fine-tuning (SFT) continues training a pretrained language model on examples of the responses we want it to give. It helps turn that model into an assistant, a model used to answer requests, by changing its weights to make the example responses more likely.

  SFT pairs requests with example answers called demonstrations. These show the content, style and format we want the assistant to produce.
knowledge_points:
  - id: sft-example-responses
    title: Learn from example responses
    explain: |
      ### From continuing text to answering

      A pretrained language model predicts the next token, a piece of text such as a word or word piece, from the tokens before it. We now give it examples of answering requests. Each example pairs a **prompt**, the request it sees, with a **response**, the answer we want.

      Let's use the sentence “the cat sat on the mat”. One demonstration pairs “Continue: the cat sat on the” with “mat”. Another pairs “Read ‘the cat sat on the mat’. Which animal sat?” with “The cat.” These teach sentence completion and question answering using our sentence.

      Training adjusts the model's weights to increase the probability of these example answers. Follow that process through the arrows in the picture.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 216" aria-label="A pretrained model enters training with a prompt and desired response. Training updates its weights to make responses like the demonstration more likely.">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717" text-anchor="middle">
          <rect x="30" y="8" width="300" height="44" rx="5" fill="#d4d4d4"/>
          <text x="180" y="35">Pretrained model</text>
          <path d="M180 54 V76 M175 70 L180 76 L185 70" fill="#737373" stroke="#737373"/>
          <rect x="30" y="80" width="300" height="56" rx="5" fill="#d4d4d4"/>
          <text x="180" y="103">Train on prompt + desired response</text>
          <text x="180" y="124">Update the model's weights</text>
          <path d="M180 138 V160 M175 154 L180 160 L185 154" fill="#737373" stroke="#737373"/>
          <rect x="30" y="164" width="300" height="44" rx="5" fill="#d4d4d4"/>
          <text x="180" y="191">Example responses become likelier</text>
        </g>
      </svg>
      ```

      **Supervised fine-tuning** is further training on prompt–response demonstrations, starting from already learned weights. The desired response supplies the **targets**, the correct next tokens training asks the model to predict.

      ### Marking who is speaking

      How can the model tell where a request ends and an answer starts? A **chat template** arranges messages into a single list of tokens with markers for their roles, meaning who is speaking. The user supplies the request, and the assistant supplies the answer.

      Real models have specific chat templates; use the markers and ordering that model was trained with. Our invented toy markers are `<user>` for the request, `<assistant>` for the answer and `<end>` to teach when to stop answering. The worked example joins the marked request and answer into one training sequence.

      Be careful not to confuse formatting with training. Adding role markers arranges the text; training changes the weights.

      ### Limitations

      Demonstrations can teach mistakes. If “Continue: the cat sat on the” is paired with “dog” when we want the original sentence, training encourages that wrong continuation. Check the demonstrations and test on unseen prompts to see whether the model answers new requests well.
    worked: |
      Let's add chat markers to a demonstration from “the cat sat on the mat”, then use the same markers to ask the trained model a new request.

      1. **Choose a prompt and response.** We want to teach sentence completion, so we supply the unfinished sentence and its desired continuation.
         - Prompt: “Continue: the cat sat on the”.
         - Desired response: “mat”.

      2. **Format the demonstration.** We mark where the model should start and stop answering. Read the sequence as `<user>`, then the request text, then `<assistant>`, the answer `mat` and finally `<end>`. Training uses this complete sequence:
         `<user>Continue: the cat sat on the<assistant>mat<end>`

      3. **Ask a new request.** To test another prefix after training, we use “the cat sat on” and ask the model to complete it. We supply the marked request below; we want the model to generate “the mat”.
         `<user>Continue: the cat sat on<assistant>`

      The input ends immediately after `<assistant>`. The model predicts the answer tokens and then the ending token, one token at a time. Checking those predictions tells us whether it handled the new request.
