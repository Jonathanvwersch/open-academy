final: sft-explain-training
summary: |
  - Supervised fine-tuning continues from pretrained weights and makes demonstrated responses to prompts more likely; the demonstrations can also teach errors.
  - A chat template marks message roles and response endings, and the model should receive its expected format both during training and when asked to answer.
  - Response-only loss averages $-\ln p(x_{t+1}\mid x_1,\dots,x_t)$ over response targets, including the first response token, while keeping prompt tokens available as context.
  - Each mask entry selects the loss for predicting its corresponding token, and a training example with no selected targets must be rejected before taking the mean.

  **Next:** LoRA adapts a pretrained model by training a small added set of weights, reducing how many weights need to change.
