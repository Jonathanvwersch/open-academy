        <line x1="252" y1="58" x2="264" y2="58" stroke="#737373" stroke-width="2"/>
        <polygon points="264,53 272,58 264,63" fill="#737373"/>
        <rect x="272" y="32" width="112" height="52" rx="6" fill="#d4d4d4" stroke="#737373"/>
