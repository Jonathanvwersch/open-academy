concept: autodiff
version: 2
objective: |
  **Goal:** explain what `loss.backward()` does: how software records a calculation and runs the chain rule backward for you, and why it goes backward.
where_this_fits: |
  Training a model needs the loss slope for every weight. You can now calculate those slopes with backpropagation, but writing a new backward calculation whenever you change the model is slow and easy to get wrong. Software can do that work for you while you write only the forward calculation. This lesson explains how, in three steps:

  1. Record the operations as the forward calculation runs.
  2. Follow that record backward to find and store the loss slopes.
  3. See why going backward suits a model with many weights and one loss.

  You'll connect the chain rule you know to the single call that requests those slopes.
knowledge_points:
  - id: ad-recording
    title: Record the calculation as it runs
    explain: |
      **The question.** You already know how to calculate derivatives through a graph. How can software build that graph when you have only written the forward calculation?

      **Picture it.** Start with a number $w=2$, multiply by a fixed input $x=3$, subtract a fixed target $y=4$, then square the difference. The arrows below mean “used by”: each operation extends the record as it runs, keeping the intermediate values $z$ and $e$ and the final result $L$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 165" aria-label="Forward record: w equals 2, multiply by 3 to get z equals 6, subtract 4 to get e equals 2, square to get L equals 4"><defs><marker id="ad1-forward" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717"><path d="M90 85 H190" stroke="#737373" stroke-width="2" marker-end="url(#ad1-forward)"/><path d="M250 85 H350" stroke="#737373" stroke-width="2" marker-end="url(#ad1-forward)"/><path d="M410 85 H510" stroke="#737373" stroke-width="2" marker-end="url(#ad1-forward)"/><g stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><text x="25" y="90" fill="#171717">w = 2</text><text x="200" y="90" fill="#171717">z = 6</text><text x="360" y="90" fill="#171717">e = 2</text><text x="520" y="90" fill="#171717">L = 4</text><text x="105" y="52" fill="#737373">× x (= 3)</text><text x="265" y="52" fill="#737373">− y (= 4)</text><text x="425" y="52" fill="#737373">square</text><text x="25" y="135" fill="#737373">forward values: left to right</text></g></g></svg>
      ```

      **The idea.** Keep a record of small operations, rather than derive one big formula. A recorded **computation graph** links operations to their inputs and outputs. A **tape** lists those operations in the order they ran; each **local derivative rule** gives one operation's slope with respect to its own input, as in the computational-graphs lesson.

      PyTorch is software for these calculations. It stores numbers in objects called **tensors**; a tensor can hold one number or an array. Marking an input tensor with `requires_grad=True` asks PyTorch to track every value calculated from it, directly or through other values, so its derivatives can be found later.

      **Common confusion.** “It rewrites my code into a textbook derivative formula.” No: PyTorch records the operations actually executed on this run. If your code takes one branch of an `if`, the record follows that branch, not the unused alternative.
    worked: |
      Record the forward calculation for $w=2$, with fixed $x=3$ and $y=4$.

      1. **Multiply the input.** Save the product and its connection to $w$.
         $$z=wx=2\cdot3=6.$$

      2. **Find the difference.** Save the subtraction and its connection to $z$.
         $$e=z-y=6-4=2.$$

      3. **Square the difference.** Save the square and its input $e$; its derivative rule will need that value.
         $$L=e^2=2^2=4.$$

      **Compare cases.** Only $w$ is marked `requires_grad=True`.

      | Value | Tracked for derivatives? | Why? |
      | --- | --- | --- |
      | $w$ | Yes | You requested its derivative |
      | $x,y$ | No | They are fixed inputs here |
      | $z,e,L$ | Yes | Their calculations depend on $w$ |

      PyTorch saves whatever an operation's derivative rule needs, whether or not that value is tracked. Here the multiply needs the fixed value $x=3$ to find the slope with respect to $w$.

      **Where it shows up.** A model's prediction and squared loss use the same multiply, subtract and square operations. Recording them means changing the forward model doesn't require you to write its backward calculation again.
