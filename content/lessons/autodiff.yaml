      [
        ad-recording-basics,
        ad-record-why-save,
        ad-record-value,
        ad-record-constants,
        ad-record-branch,
        ad-record-robot,
      ]
  - id: ad-reverse
    title: Run the chain rule backward
    explain: |
      **The question.** The forward record gives a final value, but training needs loss slopes. What happens when you ask PyTorch to follow the record backward?

      **Picture it.** Use the same calculation. The blue arrows run from the loss back to $w$; their labels are derivatives of the final loss, not forward values. Start at $1$, the loss's slope with respect to itself, $dL/dL=1$, then multiply by each local slope: $4$ for the square, $1$ for subtraction and $3$ for multiplication.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 165" aria-label="Reverse derivatives: start at L with 1, then e has slope 4, z has slope 4 and w has slope 12"><defs><marker id="ad2-reverse" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717"><path d="M190 85 H90" stroke="#3b82f6" stroke-width="2" marker-end="url(#ad2-reverse)"/><path d="M350 85 H250" stroke="#3b82f6" stroke-width="2" marker-end="url(#ad2-reverse)"/><path d="M510 85 H410" stroke="#3b82f6" stroke-width="2" marker-end="url(#ad2-reverse)"/><g stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><text x="25" y="90" fill="#171717">w = 2</text><text x="200" y="90" fill="#171717">z = 6</text><text x="360" y="90" fill="#171717">e = 2</text><text x="520" y="90" fill="#171717">L = 4</text><text x="105" y="52" fill="#3b82f6">× 3</text><text x="265" y="52" fill="#3b82f6">× 1</text><text x="425" y="52" fill="#3b82f6">× 4</text><text x="25" y="135" fill="#3b82f6">slope: 12</text><text x="200" y="135" fill="#3b82f6">slope: 4</text><text x="360" y="135" fill="#3b82f6">slope: 4</text><text x="520" y="135" fill="#3b82f6">start: 1</text></g></g></svg>
      ```

      **The idea.** Send the final result's sensitivity back through the recorded operations. **Reverse-mode automatic differentiation** computes derivatives of a chosen output with respect to its inputs by visiting operations in reverse order, multiplying local derivatives along paths and adding contributions where paths meet.

      If $w$ is used twice, as in $L=w\cdot w$, each use sends back its own contribution: $w+w=2w$.

      Calling `loss.backward()` does this for a tensor holding a single number, named `loss`. For a **leaf**, a tensor you made yourself rather than one calculated from other tensors, its resulting derivative is stored in `.grad` if it requires gradients. Here `w.grad` holds $dL/dw$, the loss slope with respect to $w$.

      **Common confusion.** “Calling `loss.backward()` changes my weights.” No: it calculates gradients, not weight updates. It also **adds** to any gradients already stored so gradients from several calculations, such as several examples, can be combined; clear them before calculating a fresh gradient that shouldn't include earlier calls.
    worked: |
      Find the loss slope for $L=(wx-y)^2$, with $w=2$, $x=3$ and $y=4$.

      1. **Start at the loss.** The loss has slope one with respect to itself.
         $$\frac{dL}{dL}=1.$$

      2. **Reverse the square.** Use the saved difference $e=2$.
         $$\frac{dL}{de}=1\cdot2e=4.$$

      3. **Reverse the subtraction.** Subtracting a fixed target has local slope one.
         $$\frac{dL}{dz}=4\cdot1=4.$$

      4. **Reverse the multiply.** Use the fixed input $x=3$.
         $$\frac{dL}{dw}=4\cdot3=12.$$

      **Compare cases.** These PyTorch lines use the same leaf `w`. After backward, PyTorch throws the record away to save memory. A second backward therefore needs a new forward calculation, as shown here by recomputing `loss`.

      ```python
      import torch
      w = torch.tensor(2.0, requires_grad=True)
      loss = (w * 3 - 4) ** 2
      loss.backward()
      # w.grad now holds 12
      loss = (w * 3 - 4) ** 2
      loss.backward()
      # w.grad now holds 24
      w.grad.zero_()
      # w.grad now holds 0
      ```

      | State | Stored gradient | Weight |
      | --- | --- | --- |
      | After first backward call | $12$ | $2$ |
      | After second, without clearing | $24$ | $2$ |
      | After `w.grad.zero_()` | $0$ | $2$ |

      **Where it shows up.** Backpropagation in a neural network is this reverse calculation through many operations. A separate gradient-descent step uses the stored slopes to change the weights.
    problems:
      [
        ad-reverse-basics,
        ad-reverse-why-multiply,
        ad-reverse-gradient,
        ad-reverse-update,
        ad-reverse-accumulate,
        ad-reverse-robot,
      ]
  - id: ad-modes
    title: Choose the direction that shares the work
    explain: |
      **The question.** The chain rule can be applied in either direction. Why does software usually go backward when training a model?

      **Picture it.** A small calculation multiplies two adjustable inputs, $u=2$ and $v=3$, to give one output $s=6$. A forward derivative pass follows one chosen input towards the output; two passes give both input slopes. A reverse derivative pass starts at the one output and reaches both inputs together.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" aria-label="Two inputs u equals 2 and v equals 3 multiply to s equals 6. Two forward derivative passes or one reverse derivative pass give slopes 3 and 2"><defs><marker id="ad3-forward" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="ad3-reverse" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717"><path d="M95 60 L220 100" stroke="#737373" stroke-width="2" marker-end="url(#ad3-forward)"/><path d="M95 150 L220 110" stroke="#737373" stroke-width="2" marker-end="url(#ad3-forward)"/><path d="M535 100 L410 60" stroke="#3b82f6" stroke-width="2" marker-end="url(#ad3-reverse)"/><path d="M535 110 L410 150" stroke="#3b82f6" stroke-width="2" marker-end="url(#ad3-reverse)"/><g stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><text x="20" y="25" fill="#171717">Forward: 2 passes</text><text x="350" y="25" fill="#171717">Reverse: 1 backward pass</text><text x="25" y="60" fill="#171717">u = 2</text><text x="25" y="155" fill="#171717">v = 3</text><text x="225" y="110" fill="#171717">s = uv = 6</text><text x="350" y="60" fill="#171717">u = 2</text><text x="350" y="155" fill="#171717">v = 3</text><text x="540" y="110" fill="#171717">s = 6</text><text x="110" y="65" fill="#171717">choose u</text><text x="110" y="155" fill="#171717">choose v</text><text x="440" y="65" fill="#3b82f6">slope 3</text><text x="440" y="155" fill="#3b82f6">slope 2</text><text x="20" y="195" fill="#171717">Same derivatives; different sharing of work.</text></g></g></svg>
      ```

      **The idea.** Choose the direction that reuses work for the derivatives you need. **Forward-mode automatic differentiation** carries each value's derivative with respect to one chosen input alongside its forward value. Reverse mode instead carries a chosen output's derivatives back to all inputs.

      Choosing $u$ for $s=uv$, $u$ carries (value $2$, derivative $1$), $v$ carries ($3$, $0$), and the multiply outputs ($6$, $1\cdot3+2\cdot0=3$).

      To obtain every input-output derivative using ordinary one-direction passes, forward mode needs one pass per input. Reverse mode needs one forward recording pass plus one backward pass per output. With many weights and one loss, one reverse pass gives all weight slopes.

      **Common confusion.** “Forward and reverse give different gradients.” No: both apply the same chain rule at the same values. They organise the work differently.
    worked: |
      Compare both methods for $s=uv$ at $u=2$, $v=3$. Each forward pass chooses one input to vary and holds the other fixed.

      1. **Follow $u$ forward.** Start its derivative at one and the fixed input's at zero; the product rule gives:
         $$\frac{\partial s}{\partial u}=1\cdot v+u\cdot0=3.$$

      2. **Follow $v$ forward.** Exchange which input varies.
         $$\frac{\partial s}{\partial v}=0\cdot v+u\cdot1=2.$$

      3. **Follow $s$ backward.** Start at one at $s$ and send a contribution to each input in the same pass.
         $$\frac{\partial s}{\partial u}=1\cdot v=3.$$
         $$\frac{\partial s}{\partial v}=1\cdot u=2.$$

      **Compare cases.** To find every input-output derivative, forward mode chooses one input per pass. The reverse column counts one forward recording pass plus one backward pass per output.

      | Inputs | Outputs | Forward passes | Reverse: record + backward |
      | --- | --- | --- | --- |
      | $2$ | $1$ | $2$ | $1+1=2$ |
      | $1{,}000{,}000$ | $1$ | $1{,}000{,}000$ | $1+1=2$ |
      | $1$ | $3$ | $1$ | $1+3=4$ |

      **Where it shows up.** Neural-network training has many parameters but one loss, which favours reverse mode. A robot calculation from one joint angle to the hand's $x$, $y$ and $z$ position has one input and three outputs, so forward mode gets all three slopes in one pass.
    problems:
      [
        ad-modes-basics,
        ad-modes-why-two,
        ad-modes-forward-count,
        ad-modes-same-slopes,
        ad-modes-reverse-count,
        ad-modes-robot,
      ]
final: ad-explain
summary: |
  - I can write the forward calculation and let software record its operations, dependencies and needed values.
  - `loss.backward()` applies the chain rule in reverse and adds the resulting slopes to stored leaf gradients; it doesn't update the weights.
  - Forward mode shares work from one input; reverse mode shares work from one output, making it a good fit for many weights and one loss.

  **Next:** PyTorch fundamentals puts tensors and gradients into a training loop.
