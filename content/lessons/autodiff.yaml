  - id: ad-reverse
    title: Reverse mode applies the chain rule automatically
    explain: |
      **What reverse-mode automatic differentiation is.** It evaluates a function, then propagates derivatives from its output back through recorded operations. It automates the chain-rule calculation called backpropagation.

      **How it works.** In PyTorch, `loss.backward()` starts at the scalar loss and applies local derivative rules in reverse order. The resulting parameter derivatives are stored in each tracked leaf tensor's `.grad`. For the house network, the forward values are $z=1.2$ and $\hat y=324.5$. The backward trace is:

      $$dL/d\hat y = 2(324.5 - 330) = -11$$

      $$dL/dh = (-11) \times 15 = -165$$

      $$dL/dw = (-165) \times 1 \times 12 = -1980$$

      The ReLU derivative is 1 here because $z$ is positive. At a point used by two later operations, reverse mode adds the derivative contributions from both paths. A `.grad` value is added to rather than replaced by each backward call, so clear it with `w.grad.zero_()` before a separate calculation.

      ```python
      import torch

      w = torch.tensor(2.0, requires_grad=True)
      loss = (3 * w - 1) ** 2
      loss.backward()
      print(w.grad.item())
      loss = (3 * w - 1) ** 2
      loss.backward()
      print(w.grad.item())
      w.grad.zero_()
      print(w.grad.item())
      ```

      **Why this is useful.** One reverse pass gives the house model's slope for every tracked weight, while `.grad.zero_()` keeps one training calculation from leaking into the next.
    worked: |
      This example shows one gradient, its accumulation, and how to clear it.

      Set $w=2$ in $L=(3w-1)^2$:

      $$L = (3 \times 2 - 1)^2 = 25$$

      The derivative for this calculation is:

      $$dL/dw = 2(3w-1)\times3 = 30$$

      After one backward call, `.grad` contains 30. Recompute the loss and call backward again without clearing it:

      $$\texttt{w.grad} = 30 + 30 = 60$$

      Clear the accumulated value before the next independent calculation:

      $$\texttt{w.grad} = 0$$

      Recomputing the loss creates a fresh forward graph; each backward call then adds that graph's derivative to `.grad`.
    problems:
      [
        ad-reverse-basics,
        ad-backward-complete,
        ad-zero-complete,
        ad-reverse-why,
        ad-grad-accumulation,
        ad-backward-read,
        ad-backward-shared,
      ]
  - id: ad-modes
    title: Forward and reverse mode suit different shapes
    explain: |
      **What forward-mode automatic differentiation is.** It carries a derivative alongside each intermediate value as calculations run from input to output. One pass follows one chosen input direction; reverse mode instead sends derivatives from an output back to its inputs.

      **How to choose a mode.** Roughly, forward mode needs one pass for each input direction to build all derivatives, while reverse mode needs one pass for each output. The house network has many trainable parameters but one scalar loss. Forward mode would repeat work for each parameter direction; reverse mode can return all parameter gradients from one traversal of that loss. The exact cost also depends on the operations and hardware, but the input-versus-output count explains the main choice.

      Forward mode can be preferable when there are few inputs and many outputs, because its pass count then stays small.

      **Why this is useful.** Training adjusts many house-model weights to reduce one loss, so reverse mode computes the needed collection of slopes with fewer passes.
    worked: |
      This example shows how the number of inputs and outputs guides the choice.

      Suppose one model has 64 parameters and produces one scalar loss:

      $$\text{forward-mode passes} \approx 64$$

      $$\text{reverse-mode passes} \approx 1$$

      Forward mode follows each parameter direction separately. Reverse mode starts from the one loss and sends its derivative back to all 64 parameters.
    problems:
      [
        ad-modes-basics,
        ad-forward-mode-fixed,
        ad-reverse-mode-fixed,
        ad-mode-template,
        ad-modes-why,
        ad-mode-robot-arm,
      ]
final: ad-explain
summary: |
  - PyTorch records operations that depend on tensors marked with `requires_grad=True`.
  - `loss.backward()` applies the chain rule in reverse and accumulates derivatives in `.grad`.
  - Reverse mode is efficient when a model has many parameters and one scalar loss.

  **Next:** PyTorch fundamentals uses these gradients in a complete training loop.
