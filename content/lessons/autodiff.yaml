concept: autodiff
version: 3
objective: |
  **Goal:** explain what `loss.backward()` does: software records the forward calculation as it runs, then applies the chain rule backward through that record to find every weight's loss slope, and going backward is what makes this cheap for many weights and one loss.
recap:
  - concept: backpropagation
    text: "We find every weight's loss slope by starting at the loss and working backward through the calculation, multiplying by each operation's local slope. Where a value feeds two operations, their slopes add."
where_this_fits: |
  ### What is automatic differentiation?

  Automatic differentiation is a way for software to work out derivatives for you. You write only the ordinary calculation, from inputs to loss, and the software records each operation as it runs. Then it uses that record to find every slope.

  Why do we need it? In the backpropagation lesson, we found loss slopes by hand, writing out a backward step for every operation. That works for a small network, but real models have millions of weights, and they change every time we try a new idea. Rewriting the backward steps each time would be slow and full of mistakes. In PyTorch, a Python library for machine learning, one line, `loss.backward()`, does all of that work, and this lesson explains what happens inside it.
knowledge_points:
  - id: ad-recording
    title: "Record each step of a calculation"
    tldr: |
      - Software can record each operation while a calculation runs.
      - It saves the values that the operation's slope rule will need later.
      - This record lets it find loss slopes without asking us to write the backward steps.
    explain: |
      ### One calculation, three small operations

      In the backpropagation lesson, we worked out slopes from a picture of the calculation that we drew ourselves. Software can't see our pictures, so it has to build its own while the calculation runs.

      We have one adjustable weight $w=2$, a fixed input $x=3$ and a fixed target $y=4$. The calculation has three operations:

      $$
      \begin{aligned}
      z&=wx &&\text{multiply to predict}\\
      e&=z-y &&\text{subtract the target}\\
      L&=e^2 &&\text{square the error}
      \end{aligned}
      $$

      ### What gets written down

      Read the diagram from left to right. Each box is a value, and each grey arrow is one operation, labelled with what it does. As each operation runs, the software adds an entry to its record saying which operation it was, which value went in, which came out, and any number it will need later to find that operation's slope.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" aria-label="The forward record. w equals 2 is multiplied by the input x equals 3 to give z equals 6, the target 4 is subtracted to give e equals 2, and squaring gives the loss L equals 4. The multiply saves x equals 3 and the square saves e equals 2"><defs><marker id="ad1f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717"><path d="M116.0 70.0 L190.0 70.0" stroke="#737373" stroke-width="2" marker-end="url(#ad1f)"/><text x="153" y="40" fill="#737373" text-anchor="middle">× 3</text><path d="M282.0 70.0 L356.0 70.0" stroke="#737373" stroke-width="2" marker-end="url(#ad1f)"/><text x="319" y="40" fill="#737373" text-anchor="middle">− 4</text><path d="M448.0 70.0 L522.0 70.0" stroke="#737373" stroke-width="2" marker-end="url(#ad1f)"/><text x="485" y="40" fill="#737373" text-anchor="middle">square</text><rect x="28" y="50" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="70" y="75" text-anchor="middle">w = 2</text><rect x="194" y="50" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="236" y="75" text-anchor="middle">z = 6</text><rect x="360" y="50" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="402" y="75" text-anchor="middle">e = 2</text><rect x="526" y="50" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="568" y="75" text-anchor="middle">L = 4</text><text x="153" y="120" fill="#737373" text-anchor="middle">saves x = 3</text><text x="485" y="120" fill="#737373" text-anchor="middle">saves e = 2</text><text x="20" y="175" fill="#737373" text-anchor="start">forward: each operation runs left to right and is added to the record</text></g></svg>
      ```

      This record is called a **computation graph**: the values a calculation produced, joined by the operations that produced them. Each operation knows its **local slope**, the slope of its output with respect to its input. The multiply saves $x=3$, because the slope of $wx$ with respect to $w$ is $x$. The square saves $e=2$, because the slope of $e^2$ is $2e$. PyTorch, a machine learning library, comes with the local slope rule for every operation it offers, such as multiplying or squaring, so it knows which numbers each rule will need.

      ### Telling PyTorch what to track

      PyTorch stores numbers in objects called **tensors**, and a tensor can hold one number or a whole array. When we create $w$ with `requires_grad=True`, we're asking for its slope later. So PyTorch records every operation whose result depends on $w$, which here means $z$, $e$ and $L$. The fixed numbers $x$ and $y$ don't need slopes of their own, but the multiply still saves the value of $x$, because its local slope needs it.

      Be careful not to think that PyTorch reads your code and writes out a derivative formula. It records only the operations that ran. If code chooses between two calculations, for example with an `if` that checks a value, the record holds only the one that ran.
    worked: |
      Let's follow the record as PyTorch builds it for $w=2$, $x=3$ and $y=4$, with only $w$ marked `requires_grad=True`.

      1. **Multiply by the input.** The result depends on $w$, so the multiply is recorded, and it saves $x=3$ for its slope later.
         $$z=wx=2\times3=6$$

      2. **Subtract the target.** This result depends on $w$ through $z$, so it's recorded too.
         $$e=z-y=6-4=2$$

      3. **Square the error.** The square's local slope is $2e$, so the record saves $e=2$.
         $$L=e^2=2^2=4$$

      The record now holds three operations joining $w$ to the loss $L=4$, plus the two saved numbers $x=3$ and $e=2$. That's everything the backward pass will need.
    problems:
      [
        ad-recording-basics,
        ad-record-why-save,
        ad-record-value,
        ad-record-constants,
        ad-record-branch,
        ad-record-robot,
      ]
  - id: ad-reverse
    title: "Work out slopes from the end backwards"
    tldr: |
      - The backward pass starts at the loss and visits recorded operations in reverse order.
      - It multiplies local slopes along each path and adds contributions where paths meet.
      - PyTorch stores the resulting weight slopes and leaves the weights unchanged.
    explain: |
      ### Walking the record backward

      Once the forward calculation has finished, the record holds everything we need to find $dL/dw$, the slope of the loss with respect to the weight. So how does the software use it?

      It visits operations from last to first, as we did by hand. In the diagram, blue arrows run right to left; each blue number is the loss slope for that value. Multiply by each operation's local slope:

      $$
      \begin{aligned}
      \frac{dL}{dL}&=1 &&\text{start at the loss}\\
      \frac{dL}{de}&=1\times(2\times2)=4 &&\text{square's local slope is }2e\\
      \frac{dL}{dz}&=4\times1=4 &&\text{subtraction passes it through}\\
      \frac{dL}{dw}&=4\times3=12 &&\text{multiply by saved input }x
      \end{aligned}
      $$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 215" aria-label="The same record walked backward. The slope of L with respect to itself is 1. Times 4 for the square gives 4 at e, times 1 for the subtraction gives 4 at z, and times 3 for the multiply gives 12 at w"><defs><marker id="ad2f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="ad2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717"><path d="M116.0 70.0 L190.0 70.0" stroke="#737373" stroke-width="1.5" marker-end="url(#ad2f)"/><text x="153" y="40" fill="#737373" text-anchor="middle">× 3</text><path d="M282.0 70.0 L356.0 70.0" stroke="#737373" stroke-width="1.5" marker-end="url(#ad2f)"/><text x="319" y="40" fill="#737373" text-anchor="middle">− 4</text><path d="M448.0 70.0 L522.0 70.0" stroke="#737373" stroke-width="1.5" marker-end="url(#ad2f)"/><text x="485" y="40" fill="#737373" text-anchor="middle">square</text><rect x="28" y="50" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="70" y="75" text-anchor="middle">w = 2</text><rect x="194" y="50" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="236" y="75" text-anchor="middle">z = 6</text><rect x="360" y="50" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="402" y="75" text-anchor="middle">e = 2</text><rect x="526" y="50" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="568" y="75" text-anchor="middle">L = 4</text><path d="M204 135 L102 135" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ad2b)"/><text x="153" y="159" fill="#3b82f6" text-anchor="middle">× 3</text><path d="M370 135 L268 135" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ad2b)"/><text x="319" y="159" fill="#3b82f6" text-anchor="middle">× 1</text><path d="M536 135 L434 135" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ad2b)"/><text x="485" y="159" fill="#3b82f6" text-anchor="middle">× 4</text><text x="70" y="140" fill="#3b82f6" text-anchor="middle">12</text><text x="236" y="140" fill="#3b82f6" text-anchor="middle">4</text><text x="402" y="140" fill="#3b82f6" text-anchor="middle">4</text><text x="568" y="140" fill="#3b82f6" text-anchor="middle">1</text><text x="20" y="200" fill="#3b82f6" text-anchor="start">backward: slope of L, from right to left, times each local slope</text></g></svg>
      ```

      If one value feeds two operations, its contributions add. For $L=w\cdot w$:

      $$
      \begin{aligned}
      \frac{dL}{dw}&=w+w &&\text{each use returns the other factor}\\
      &=2w &&\text{add both contributions}
      \end{aligned}
      $$

      This agrees with the power rule.

      ### What loss.backward() does

      This method is called **reverse-mode automatic differentiation**. It finds the slopes of one output, such as the loss, with respect to everything that output depends on, by visiting the recorded operations in reverse order, multiplying local slopes along each path and adding where paths meet.

      In PyTorch, `loss.backward()` runs it, where `loss` is a tensor holding one number. A tensor you created yourself, rather than one calculated from other tensors, is called a **leaf**, and each leaf with `requires_grad=True` gets its slope stored in `.grad`. In code, `w.grad` means the `.grad` slot attached to the tensor $w$. The name is short for gradient, the usual word for a set of loss slopes. After the call, `w.grad` holds $12$.

      Be careful not to think `loss.backward()` changes the weights. It only works out slopes, so $w$ is still $2$ afterwards. Using the slopes to change the weights is a separate step, which the next lesson adds. Also, each call adds its slope to what's already in `.grad` rather than replacing it. That's handy for adding up slopes from several examples, but it means you must clear `.grad` before working out a fresh slope.
    worked: |
      Let's find $dL/dw$ for $L=(wx-y)^2$ at $w=2$, $x=3$ and $y=4$ by walking the record backward, and then check it in PyTorch.

      1. **Start at the loss.** Any value has slope $1$ with respect to itself.
         $$\frac{dL}{dL}=1$$

      2. **Go back through the square.** Its local slope is $2e$, and the record saved $e=2$.
         $$\frac{dL}{de}=1\times2e=1\times4=4$$

      3. **Go back through the subtraction.** Subtracting a fixed target passes any change straight through, so its local slope is $1$.
         $$\frac{dL}{dz}=4\times1=4$$

      4. **Go back through the multiply.** The local slope of $wx$ with respect to $w$ is the saved input $x=3$.
         $$\frac{dL}{dw}=4\times3=12$$

      Here are the same numbers in PyTorch. The line `torch.tensor(2.0, requires_grad=True)` makes a tensor holding $2$ and asks for its slope. In Python, `**` means "to the power of". At the end, `.item()` turns a one-number tensor into an ordinary Python number. We calculate `loss` again before the second backward call, because PyTorch throws the record away after each backward pass to save memory. The slope survives in the weight's `.grad` slot.

      ```python
      import torch
      w = torch.tensor(2.0, requires_grad=True)
      loss = (w * 3 - 4) ** 2
      loss.backward()
      print(w.grad.item())            # first call
      loss = (w * 3 - 4) ** 2
      loss.backward()
      print(w.grad.item())            # second call, not cleared
      w.grad.zero_()
      print(w.grad.item(), w.item())  # after clearing
      # prints 12.0, then 24.0, then 0.0 2.0
      ```

      The first call stores $12$, which matches the hand calculation. The second adds another $12$ to make $24$, because we didn't clear `.grad`, and `w.grad.zero_()` resets it to $0$. The weight stays at $2$ the whole time.
    problems:
      [
        ad-reverse-basics,
        ad-reverse-why-multiply,
        ad-reverse-gradient,
        ad-reverse-update,
        ad-reverse-accumulate,
        ad-reverse-robot,
      ]
  - id: ad-modes
    title: "Forward or backward: which is faster"
    tldr: |
      - The chain rule can carry slopes forward from the inputs or backward from the output.
      - Going forward needs one pass per input, and going backward needs one pass per output.
      - Training has millions of weights and one loss, so going backward needs far fewer passes.
    explain: |
      ### Two directions for one chain rule

      The chain rule multiplies local slopes along a path. We could start from either end. Why go backward?

      Take the two-input calculation $s=uv$ at $u=2$ and $v=3$, so $s=6$. We want both of its slopes: $\partial s/\partial u$, the slope of $s$ when only $u$ changes, and $\partial s/\partial v$, the slope when only $v$ changes.

      ### Going forward, one input at a time

      **Forward-mode automatic differentiation** picks one input and carries each value's slope for that input forward alongside its value. To follow $u$, hold $v$ fixed and use the product rule:

      $$
      \begin{aligned}
      \frac{\partial u}{\partial u}&=1 &&\text{follow }u\\
      \frac{\partial v}{\partial u}&=0 &&\text{hold }v\text{ fixed}\\
      \frac{\partial s}{\partial u}&=\frac{\partial u}{\partial u}v+u\frac{\partial v}{\partial u} &&\text{product rule}\\
      &=1\times3+2\times0=3 &&\text{insert values and slopes}
      \end{aligned}
      $$

      That one pass gives only $\partial s/\partial u$. To get $\partial s/\partial v$, we need a second pass that follows $v$ instead. The left of the diagram shows these two green passes, and the right shows reverse mode sending the slope of $s$ back to both inputs in one backward pass.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" aria-label="The product s equals u times v at u equals 2 and v equals 3. On the left, forward mode needs two green passes, one following u to get slope 3 and one following v to get slope 2. On the right, reverse mode needs one blue backward pass from s, which gives both slopes, 3 and 2"><defs><marker id="ad3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker><marker id="ad3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717"><text x="20" y="30" fill="#171717" text-anchor="start">Forward mode: 2 passes</text><path d="M105.9 106.5 L194.1 128.5" stroke="#10b981" stroke-width="2" marker-end="url(#ad3g)"/><path d="M105.9 173.5 L194.1 151.5" stroke="#10b981" stroke-width="2" marker-end="url(#ad3g)"/><rect x="18" y="75" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="60" y="100" text-anchor="middle">u = 2</text><rect x="18" y="165" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="60" y="190" text-anchor="middle">v = 3</text><rect x="198" y="120" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="240" y="145" text-anchor="middle">s = 6</text><text x="20" y="240" fill="#10b981" text-anchor="start">pass 1 follows u: slope 3</text><text x="20" y="262" fill="#10b981" text-anchor="start">pass 2 follows v: slope 2</text><path d="M330 20 V270" stroke="#d4d4d4" stroke-width="1"/><text x="350" y="30" fill="#171717" text-anchor="start">Reverse mode: 1 backward pass</text><path d="M445.9 128.5 L534.1 106.5" stroke="#3b82f6" stroke-width="2" marker-end="url(#ad3b)"/><path d="M445.9 151.5 L534.1 173.5" stroke="#3b82f6" stroke-width="2" marker-end="url(#ad3b)"/><rect x="358" y="120" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="400" y="145" text-anchor="middle">s = 6</text><rect x="538" y="75" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="580" y="100" text-anchor="middle">u = 2</text><rect x="538" y="165" width="84" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="580" y="190" text-anchor="middle">v = 3</text><text x="490" y="102" fill="#3b82f6" text-anchor="middle">slope 3</text><text x="490" y="190" fill="#3b82f6" text-anchor="middle">slope 2</text><text x="350" y="240" fill="#3b82f6" text-anchor="start">one pass from s reaches both inputs</text></g></svg>
      ```

      ### Counting the passes

      A forward-mode pass works out each value and its slope together, so it needs one pass per input and no recording. Reverse mode needs the values before it can start at the output, so it makes one recording pass, then one backward pass per output, all from that one record.

      | Inputs | Outputs | Forward mode | Reverse mode |
      | --- | --- | --- | --- |
      | $2$ | $1$ | $2$ | $1+1=2$ |
      | $1{,}000{,}000$ | $1$ | $1{,}000{,}000$ | $1+1=2$ |
      | $1$ | $3$ | $1$ | $1+3=4$ |

      Training, with many weights and one loss, is the middle row, so `loss.backward()` goes backward. The last row fits a robot arm with one joint, whose angle sets the hand's three position coordinates. To see how the hand moves as the joint turns, we need three slopes, and one forward pass gives them all.

      Be careful not to think the directions give different slopes. Both apply the same chain rule at the same values. They differ in pass counts and the memory reverse mode uses for its record.
    worked: |
      Let's find both slopes of $s=uv$ at $u=2$ and $v=3$, first with two forward passes and then with one backward pass.

      1. **Follow $u$ forward.** We give $u$ slope $1$ and $v$ slope $0$, and the product rule combines them at the multiply.
         $$\frac{\partial s}{\partial u}=1\times v+u\times0=3$$

      2. **Follow $v$ forward.** A second pass swaps the starting slopes, so now $u$ has $0$ and $v$ has $1$.
         $$\frac{\partial s}{\partial v}=0\times v+u\times1=2$$

      3. **Go backward from $s$.** We start with slope $1$ at $s$, and the multiply's local slopes are $v$ towards $u$ and $u$ towards $v$, so one pass reaches both inputs.
         $$\frac{\partial s}{\partial u}=1\times v=3,\qquad\frac{\partial s}{\partial v}=1\times u=2$$

      Both ways give the slopes $3$ and $2$. Forward mode took two passes, one per input, and reverse mode took one recording pass plus one backward pass. With two inputs that's a tie, but every extra input adds a forward pass and adds no passes to reverse mode.
    problems:
      [
        ad-modes-basics,
        ad-modes-why-two,
        ad-modes-forward-count,
        ad-modes-same-slopes,
        ad-modes-reverse-count,
        ad-modes-robot,
      ]
final: ad-explain
summary: |
  - Automatic differentiation lets you write only the forward calculation. For `loss.backward()`, which uses reverse mode, the software records each operation, the values it joins and any number its local slope will need, following only the code that actually ran.
  - `loss.backward()` walks that record in reverse, starting from slope $1$ at the loss, multiplying local slopes and adding where a value was used twice. For $L=(wx-y)^2$ at $w=2$, $x=3$ and $y=4$, it gives $dL/dw=12$.
  - Each leaf's slope is added to its `.grad`, so clear `.grad` before a fresh calculation. The call never changes the weights.
  - Forward mode needs one pass per input, and reverse mode needs one recording pass plus one backward pass per output, so with many weights and one loss, reverse mode is far cheaper.

  **Next:** The PyTorch fundamentals lesson uses `loss.backward()` in code that trains a model, finding the slopes and then using them to change the weights, over and over.
