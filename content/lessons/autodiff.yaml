concept: autodiff
version: 1
objective: |
  **Goal:** explain what `loss.backward()` does.
where_this_fits: |
  Backpropagation showed how the chain rule sends a loss derivative through the house-price network. Doing every local calculation by hand becomes tedious as a graph grows. Automatic differentiation fills that gap: a framework records the forward operations and applies their derivative rules in reverse, so you can obtain parameter gradients without writing a separate backward calculation.
knowledge_points:
  - id: ad-recording
    title: Operations are recorded during the forward pass
    explain: |
      **What an operation graph is.** An operation graph is a record of calculations: each operation is linked to the values it used and has a local derivative rule.

      **How it works.** PyTorch builds this record as a forward pass runs. Mark a parameter tensor with `requires_grad=True`, and PyTorch tracks operations that depend on it. In the house network, the weight affects the loss through multiplication, ReLU and the output calculation:

      ```python
      import torch

      w = torch.tensor(0.1, requires_grad=True)
      area = torch.tensor(12.0)
      z = w * area
      h = torch.relu(z)
      price = 15.0 * h + 306.5
      loss = (price - 330.0) ** 2
      print(round(z.item(), 1), round(price.item(), 1), round(loss.item(), 2))
      ```

      The graph links each result to its inputs, so a later calculation can follow the actual path from loss back to the weight. Constant inputs such as `area` can take part without asking PyTorch to compute their gradients.

      The graph stores the route taken in this forward pass, including which side of a piecewise operation was used.

      **Why this is useful.** The house model's recorded operations let PyTorch reuse the current forward values instead of making you write a separate graph or derivative formula for every parameter.
    worked: |
      This example shows the operations recorded for one house prediction.

      The weight is $w=0.1$ and the house area is $a=12$:

      $$z = wa = 0.1 \times 12 = 1.2$$

      ReLU leaves this positive value unchanged:

      $$h = \operatorname{ReLU}(z) = 1.2$$

      The output calculation gives:

      $$\hat y = 15h + 306.5 = 324.5$$

      The squared loss against the sale price of 330 is:

      $$L = (\hat y - 330)^2 = (324.5 - 330)^2 = 30.25$$

      The graph connects the weight through each operation to the loss:

      ```svg
