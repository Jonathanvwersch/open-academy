      <text x="386" y="219.0" fill="#737373">4 allowed</text>
      <rect x="130" y="259" width="16" height="16" fill="#10b981"/><text x="154" y="272">allowed: j ≤ t</text>
      <rect x="280" y="259" width="16" height="16" fill="#d4d4d4"/><text x="304" y="272">blocked: j &gt; t</text>
      <text x="130" y="300" fill="#737373">10 allowed, 6 blocked</text>
      </g></svg>
      ```

      A **causal mask** is a grid that lets position $t$ attend to position $j$ only when $j\le t$, that is, to itself and to earlier positions. It's called causal because each word can only be affected by itself and what came before it, the way a cause comes before its effect.

      Row $t$ has $t$ allowed cells, so the first word has only itself to look at, while the last word sees the whole sentence. Adding up the rows gives $1+2+\dots+T=T(T+1)/2$ allowed cells out of $T^2$, a quick check on any mask you build.

      Be careful not to block the diagonal. A word may attend to itself, because it's already known. The word it has to guess is the next one. If we blocked it, "the" would have nothing to attend to.
    worked: |
      Let's build the causal mask for "the cat sat on", one word per token, and check that no position can see the word it must guess.

      1. **List what each position may see.** Position $t$ may attend to positions $1$ to $t$. The braces hold the words each position may see.
         $$\begin{aligned}\text{the}&\to\{\text{the}\}\\ \text{cat}&\to\{\text{the},\text{cat}\}\\ \text{sat}&\to\{\text{the},\text{cat},\text{sat}\}\\ \text{on}&\to\{\text{the},\text{cat},\text{sat},\text{on}\}\end{aligned}$$

      2. **Check each guess is hidden.** Position $t$ must guess token $x_{t+1}$, which sits in column $t+1$. That column is after $t$, so it's always blocked in row $t$. The answer for "on" is word 5, which is outside our four-word grid, so here are the other three guesses. Each shows the answer's column, then the guessing word's row.
         $$\text{the}\to\text{cat}:\ 2>1,\qquad \text{cat}\to\text{sat}:\ 3>2,\qquad \text{sat}\to\text{on}:\ 4>3$$

      3. **Count the cells.** Row $t$ has $t$ allowed cells, and the rest of the $4\times4=16$ cells are blocked.
         $$1+2+3+4=10\ \text{allowed},\qquad 16-10=6\ \text{blocked}$$

      Every position can use all the words before it and itself, and none can see the word it's trying to guess.
