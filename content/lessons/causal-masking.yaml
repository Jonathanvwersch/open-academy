concept: causal-masking
version: 1
objective: |
  **Goal:** build a causal mask for a sentence, add it to the attention scores before the softmax so that each position gives zero weight to every later position, and explain why this lets a language model learn to predict each next word from the words before it.
recap:
  - concept: attention
    text: "Attention scores each word a position can read. Softmax turns those scores into weights that add up to 1. The output is a weighted sum of the words’ value vectors."
where_this_fits: |
  ### What is causal masking?

  Causal masking is a rule added to attention that stops each word in a sentence from looking at the words after it. Each position may attend only to itself and earlier positions.

  We need it to train a language model, which learns to guess each next word from the earlier words. In training, a stretch of text goes in all at once, so with plain attention a word could look ahead and copy the answer. The mask hides later words from each position.

knowledge_points:
  - id: cm-hide-future
    key_prereqs: [attention]
    title: "Hide the words that come later"
    tldr: |
      - Predicting the next token should use only the tokens already known.
      - During training, later tokens are present and could give away the answer.
      - A causal mask lets each position read itself and earlier positions, keeping later tokens hidden.
    explain: |
      ### Guessing the next word

      A language model writes text one token at a time. A token is a piece of text, such as a word or part of one. We'll use whole words here. At position $t$, the model reads words $x_1$ to $x_t$ and gives each possible next word a probability.

      Let's feed in "the cat sat on", the first four words of the sentence "the cat sat on the mat". We write $T$ for the number of input tokens, so here $T=4$. "The" should guess "cat", "cat" should guess "sat", "sat" should guess "on", and "on" should guess the word after it, the second "the" in the full sentence. Attention works on every input position at once, so the model makes all four guesses in one run over the input, which is called a pass.

      ### The problem with looking ahead

      Plain attention lets every position attend to every position. So "cat" can give weight to "sat", the very word it must guess. A model trained this way learns to copy the next word from its input. When it later writes new text, there's no next word to copy, so its guesses fall apart.

      ### Which positions each word may see

      Give each position one row for the word making a guess and one column for the word it might read. In the picture, green cells are allowed and grey cells are blocked.

      ```svg
