  - id: cm-mask-scores
    title: "Give later words zero weight"
    explain: |
      ### Why we can't just set the score to 0

      Causal masking blocks attention to later positions. We use a grid whose rows are looking positions and columns are positions they might read, allowing only cells on or below the diagonal. A first try sets blocked scores to $0$. Recall how softmax turns position $t$'s scores into weights,

      $$a_{tj}=\frac{e^{s_{tj}}}{\sum_{i=1}^{T}e^{s_{ti}}},$$

      where $j$ is the word whose weight we want, and on the bottom $i$ runs over every position from $1$ to $T$, adding up all the $e^{s_{ti}}$. A blocked word needs a weight of exactly $0$. Setting its score to $0$ doesn't do that, because $e^0=1$, so it still gets a share. Very negative scores get close, for example $e^{-10}\approx0.00005$. The lower the score, the closer $e^s$ gets to $0$, so we use a score of minus infinity, $-\infty$, and take $e^{-\infty}$ as exactly $0$.

      ### Adding the mask to the scores

      Let's look at position 2, "cat", in "the cat sat on". Suppose its scores for the, cat, sat and on are $0$, $1$, $2$ and $0$. Without a mask, "sat" gets $e^2/(e^0+e^1+e^2+e^0)\approx7.39/12.11\approx0.61$ of the weight, and "sat" is the very word "cat" must guess.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" aria-label="Attention weights of position 2, cat, in the cat sat on, with scores 0, 1, 2 and 0. Left, without the mask, the weights are 0.08, 0.22, 0.61 and 0.08, so most of the weight lands on sat, the word cat must predict. Right, with the mask, the weights are 0.27, 0.73, 0 and 0">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="117" y="30" text-anchor="middle">without the mask</text>
      <path d="M15 260 H219" stroke="#737373"/>
      <rect x="23" y="243.48" width="36" height="16.52" fill="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="41" y="235.48" text-anchor="middle">0.08</text>
      <text x="41" y="280" text-anchor="middle" fill="#737373">the</text>
      <rect x="73" y="215.1" width="36" height="44.9" fill="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="91" y="207.1" text-anchor="middle">0.22</text>
      <text x="91" y="280" text-anchor="middle" fill="#737373">cat</text>
      <rect x="123" y="137.94" width="36" height="122.06" fill="#ef4444"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="141" y="129.94" text-anchor="middle">0.61</text>
      <text x="141" y="280" text-anchor="middle" fill="#737373">sat</text>
      <rect x="173" y="243.48" width="36" height="16.52" fill="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="191" y="235.48" text-anchor="middle">0.08</text>
      <text x="191" y="280" text-anchor="middle" fill="#737373">on</text>
      <text x="352" y="30" text-anchor="middle">with the causal mask</text>
      <path d="M250 260 H454" stroke="#737373"/>
      <rect x="258" y="206.21" width="36" height="53.79" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="276" y="198.21" text-anchor="middle">0.27</text>
      <text x="276" y="280" text-anchor="middle" fill="#737373">the</text>
      <rect x="308" y="113.79" width="36" height="146.21" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="326" y="105.79" text-anchor="middle">0.73</text>
      <text x="326" y="280" text-anchor="middle" fill="#737373">cat</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="376" y="252.0" text-anchor="middle">0</text>
      <text x="376" y="280" text-anchor="middle" fill="#737373">sat</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="426" y="252.0" text-anchor="middle">0</text>
      <text x="426" y="280" text-anchor="middle" fill="#737373">on</text>
      <text x="117" y="310" text-anchor="middle" fill="#ef4444">0.61 on sat, the answer</text>
      <text x="352" y="310" text-anchor="middle" fill="#737373">later words blocked</text>
      </g></svg>
      ```

      We turn the grid into **mask values** added before softmax: $m_{tj}=0$ for an allowed cell ($j\le t$) and $m_{tj}=-\infty$ for a blocked one ($j>t$).

      $$a_{tj}=\frac{e^{s_{tj}+m_{tj}}}{\sum_{i=1}^{T}e^{s_{ti}+m_{ti}}}$$

      Each blocked term becomes $e^{-\infty}=0$, so it drops out of the top and the bottom. The allowed weights are the softmax of the allowed scores alone, and they still add up to 1. For "cat" they are $0.27$ and $0.73$, rounded to 2 decimals.

      Since every weight after column $t$ is $0$, the output sum stops at $t$, $o_t=\sum_{j=1}^{t}a_{tj}v_j$.

      ### How the mask changes each row

      - Position 1, "the", may see only itself, so its weight on itself is $1$.
      - Position 2, "cat", splits the share that went to "sat" and "on" between "the" and "cat". So "the" goes from $0.08$ to $0.27$, and "cat" goes from $0.22$ to $0.73$.
      - Position 3, "sat", has only "on" blocked.
      - Position 4, "on", is last, so the mask changes nothing.
    worked: |
      Let's work out the output of position 2, "cat", in "the cat sat on" with the causal mask. Its scores for the four words are $0$, $1$, $2$ and $0$. The value vectors hold the information each word passes on when it's attended to. Here we make up small ones with 2 numbers each, $v_1=(1,0)$, $v_2=(0,1)$, $v_3=(1,1)$ and $v_4=(2,0)$.

      1. **Add the mask.** Row 2 allows columns 1 and 2, so the mask adds $0$ there and $-\infty$ to columns 3 and 4.
         $$(0,1,2,0)+(0,0,-\infty,-\infty)=(0,1,-\infty,-\infty)$$

      2. **Raise $e$ to each score.** The blocked terms $e^{-\infty}$ become exactly $0$.
         $$(e^0,e^1,e^{-\infty},e^{-\infty})\approx(1,\ 2.72,\ 0,\ 0)$$

      3. **Divide by the total.** The total is $1+2.72=3.72$, and dividing makes the weights add up to 1. We round to 2 decimals at the end.
         $$(a_{21},a_{22},a_{23},a_{24})\approx(0.27,\ 0.73,\ 0,\ 0)$$

      4. **Mix the value vectors.** Only $v_1$ and $v_2$ get any weight.
         $$o_2=0.27\,(1,0)+0.73\,(0,1)=(0.27,\ 0.73)$$

      The output of "cat" is built only from "the" and "cat". Nothing from "sat", the word it has to guess, gets in.
