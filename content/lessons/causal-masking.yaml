concept: causal-masking
version: 1
objective: |
  **Goal:** build a causal mask for a sentence, add it to the attention scores before the softmax so that each position gives zero weight to every later position, and explain why this lets a language model learn to predict each next word from the words before it.
recap:
  - concept: attention
    text: "Attention lets each position gather information from others. Position $t$ scores $j$ with $q_t\\cdot k_j/\\sqrt{d_k}$; softmax makes weights $a_{tj}$ summing to 1, which mix values $v_j$."
where_this_fits: |
  ### What is causal masking?

  Causal masking is a rule added to attention that stops each word in a sentence from looking at the words after it. Each position may attend only to itself and earlier positions.

  We need it to train a language model, which learns to guess each next word from the earlier words. In training, the whole sentence goes in at once, so with plain attention every word could look ahead and copy the answer. The mask hides later words.

knowledge_points:
  - id: cm-hide-future
    title: "Hide the words that come later"
    explain: |
      ### Guessing the next word

      A language model writes text one token at a time. At each position $t$ it looks at the tokens so far, $x_1$ to $x_t$, and gives a probability to every possible next token $x_{t+1}$. In this lesson each word is one token.

      Let's train on "the cat sat on", the first four words of the sentence "the cat sat on the mat". We write $T$ for the number of tokens, so here $T=4$. "The" should guess "cat", "cat" should guess "sat", "sat" should guess "on", and "on" should guess the word after it, the second "the" in the full sentence. Attention works on every position at once, so the model makes all four guesses in one run over the sentence, which is called a pass.

      ### The problem with looking ahead

      Plain attention lets every position attend to every position. So "cat" can give weight to "sat", the very word it must guess. A model trained this way learns to copy the next word from its input. When it later writes new text, there's no next word to copy, so its guesses fall apart.

      ### Which positions each word may see

      The grid has a row for each word that is looking and a column for each word it might look at. A cell is green when that word may look, and grey when it's blocked.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 330" aria-label="A 4 by 4 grid for the cat sat on. Each row is the word doing the attending and each column is a word it might attend to. Green cells on and below the diagonal are allowed, grey cells above it are blocked. Row 1, the, sees only the. Row 2, cat, sees the and cat. Row 3, sat, sees the, cat and sat. Row 4, on, sees all four words. 10 cells are allowed and 6 are blocked">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="250" y="18" text-anchor="middle" fill="#737373">attended to: position j</text>
      <text x="34" y="148" text-anchor="middle" transform="rotate(-90 34 148)" fill="#737373">attending: position t</text>
