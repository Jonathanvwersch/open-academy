  - id: cm-mask-code
    title: "Build the mask in code"
    explain: |
      ### All the rows at once

      To block attention to later tokens, code handles all rows at once. A sentence of $T$ tokens has $T$ rows. We put the scores in a $T\times T$ grid $S$, with $s_{tj}$ in row $t$ and column $j$. The mask is a grid $M$ of the same size, with $0$ on and below the diagonal and $-\infty$ above it. For "the cat sat on",

      $$M=\begin{bmatrix}0&-\infty&-\infty&-\infty\\0&0&-\infty&-\infty\\0&0&0&-\infty\\0&0&0&0\end{bmatrix}$$

      We add $S+M$ and take the softmax of each row. In the grid of weights that comes out, every cell above the diagonal is $0$. The mask is the same for every sentence of length $T$, so we build it once and reuse it.

      ### What the mask guarantees

      An attention layer is one stage of a model that mixes information between positions using attention. Row $t$ of the weights is $0$ after column $t$, so the output $o_t$ mixes only $v_1$ to $v_t$, with weights worked out from $q_t$ and $k_1$ to $k_t$. In the first attention layer, each of those vectors is made from its own token, so $o_t$ depends only on the first $t$ tokens. If we change the last word of "the cat sat on" to "by", the outputs of the first three positions stay exactly the same.

      That's the effect we wanted. Every position's guess of the next word is made from its own word and the words before it, so one pass over a sentence trains all $T$ guesses without any position seeing its answer. It also matches how the model is used, because when it writes new text, the later words don't exist yet.

      A real language model repeats attention many times, one layer after another, and every attention layer uses this mask. The layers in between work on each position by itself, without mixing positions. So each position only ever holds information from its own token and earlier ones, and nothing from a later word can reach it anywhere in the model.

      Be careful not to think the mask removes later words from the input. Every word is still there, with its own vectors and its own guess. The mask only stops earlier positions from reading them.
    worked: |
      Let's mask every row of a score grid for "the cat sat on" at once. Suppose attention has worked out these scores. Row 2 holds the scores of "cat" for the, cat, sat and on.

      $$S=\begin{bmatrix}1&0&2&1\\0&1&2&0\\1&0&0&2\\0&1&1&0\end{bmatrix}$$

      1. **Mark the blocked cells.** These are the cells with $j>t$, the six above the diagonal, written as (row, column).
         $$(1,2),(1,3),(1,4),(2,3),(2,4),(3,4)$$

      2. **Add the mask.** Each blocked cell becomes $-\infty$, and the others keep their scores.
         $$S+M=\begin{bmatrix}1&-\infty&-\infty&-\infty\\0&1&-\infty&-\infty\\1&0&0&-\infty\\0&1&1&0\end{bmatrix}$$

      3. **Take the softmax of each row.** Row 3, for example, has $e^1+e^0+e^0\approx4.72$ on the bottom, so its weights are about $0.58$, $0.21$ and $0.21$, with $0$ for "on".
         $$(a_{31},a_{32},a_{33},a_{34})\approx(0.58,\ 0.21,\ 0.21,\ 0)$$

      Here is the same calculation in NumPy, the Python library for grids of numbers, loaded under the short name `np`. We write the scores with `np.array`. `S.shape` gives the grid's size as (rows, columns), and Python counts from 0, so `S.shape[0]` is the number of rows, $T$. To build the mask, we start from a $T\times T$ grid full of $-\infty$ with `np.full((T, T), -np.inf)`. Then `np.triu(..., k=1)` keeps only the part above the diagonal and sets everything else to $0$. The name "triu" stands for the upper triangle. The `k=1` makes the triangle start one place above the diagonal, so the diagonal stays allowed. After that we add `S + M`, raise $e$ to each number with `np.exp`, and divide each row by its total. `A.sum(axis=1, keepdims=True)` adds along each row and keeps the totals as a column, one per row, so each row is divided by its own total. The loop at the end prints each row rounded to 2 decimals.

      ```python
      import numpy as np
      S = np.array([[1, 0, 2, 1],
                    [0, 1, 2, 0],
                    [1, 0, 0, 2],
                    [0, 1, 1, 0]])
      T = S.shape[0]
      M = np.triu(np.full((T, T), -np.inf), k=1)
      A = np.exp(S + M)
      A = A / A.sum(axis=1, keepdims=True)
      for row in A.round(2):
          print(row.tolist())
      # prints:
      # [1.0, 0.0, 0.0, 0.0]
      # [0.27, 0.73, 0.0, 0.0]
      # [0.58, 0.21, 0.21, 0.0]
      # [0.13, 0.37, 0.37, 0.13]
      ```

      Every number above the diagonal is $0$, and each row adds up to 1. The last row, for "on", has nothing blocked, so its weights are the softmax of all four of its scores.
