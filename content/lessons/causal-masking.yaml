final: cm-explain
summary: |
  - A causal mask lets position $t$ attend only to positions $j\le t$, itself and the words before it, so a sentence of $T$ tokens has $T(T+1)/2$ allowed pairs.
  - Masking adds $0$ to allowed scores and $-\infty$ to blocked ones before the softmax, $a_{tj}=e^{s_{tj}+m_{tj}}/\sum_i e^{s_{ti}+m_{ti}}$. Blocked weights become exactly $0$ and the allowed weights still add up to 1.
  - In code the mask is a $T\times T$ grid with $-\infty$ above the diagonal, built once with `np.triu(..., k=1)` and added to the whole score grid.
  - With the mask, each output $o_t$ depends only on the first $t$ tokens, so one pass over a sentence trains every next-word guess without letting any position see its answer.

  **Next:** The next lesson builds a full language model that writes text one token at a time, each from the ones before, and shows how one masked pass over a sentence gives it many training examples.
