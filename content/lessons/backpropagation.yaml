  - id: bp-checking
    title: Checking gradients and fixing common bugs
    explain: |
      A wrong backward pass may run and even lower the loss, so watching training alone can miss bugs. **How do you know your gradients are right?**

      Compare them with nudging, for a few parameters. Nudge one parameter $\theta$ up and down by a small amount $\epsilon$ ("epsilon", such as 0.01) and measure how the loss changes:

      $$\frac{\partial L}{\partial \theta} \approx \frac{L(\theta + \epsilon) - L(\theta - \epsilon)}{2\epsilon}$$

      This **gradient check** works because nearby losses independently estimate the slope backprop computes. Why nudge both ways? A centred window cancels one-sided error on smooth curves. Agreement supports that derivative, not the whole program. Check a few parameters: all would be too slow.

      When the check fails, the pattern often points at the bug:

      - **Off by exactly the batch size, only for a bias:** you used a mean over rows where you need a sum.
      - **The right size but the wrong sign everywhere:** the loss derivative uses $y - \hat y$ instead of $\hat y - y$.
      - **Non-zero gradients for units whose input was negative:** the ReLU gate `(z1 > 0)` is missing.
      - **A shape error, or a result with the wrong shape:** a transpose is missing or in the wrong place. Use the shape rule.
      - **Too small for a value used twice:** one of its paths wasn't added.
    worked: |
      This example shows a gradient check on $w_2$ in the tiny network ($x = 1$, $w_1 = 2$, $y = 4$).

      With $w_1$ and $x$ fixed, $h = 2$, so $L = (2w_2 - 4)^2$. Take $\epsilon = 0.01$:

      1. $L(3.01) = (6.02 - 4)^2 = 2.02^2 = 4.0804$
      2. $L(2.99) = (5.98 - 4)^2 = 1.98^2 = 3.9204$
      3. Estimate: $(4.0804 - 3.9204) \div 0.02 = 0.16 \div 0.02 = 8$

      Backprop gave $\partial L/\partial w_2 = 8$, so they agree. If your backward pass had given 4, half the check's value, you'd look for a step that dropped the factor 2 from the squared error.
    problems:
      - bpp-why-check-nudges
      - bpp-check-template
      - bpp-sign-bug
      - bpp-gate-bug
      - bpp-batch-bug
      - bpp-check-w1
final: bp-explain
summary: |
  - Training needs the loss's derivative for every parameter. Backprop gets them all from one forward pass, which keeps every value, and one backward pass.
  - Backward: start at $\partial L/\partial L = 1$, then at each node multiply the upstream gradient by the local derivative, adding where branches meet. ReLU gates with $\mathbf{1}[z > 0]$.
  - With arrays, a gradient has the same shape as its parameter, ReLU multiplies entries with $\odot$, and biases add up over rows. Check a few gradients with finite differences.

  **Where you'll use this:** automatic differentiation, PyTorch fundamentals, and debugging training runs automate these derivatives and help you diagnose incorrect training code.
