concept: backpropagation
version: 3
objective: |
  **Goal:** explain and compute how backpropagation finds loss gradients for all parameters in a house-price network.
where_this_fits: |
  Computational graphs represented the house network as operations with local derivatives. Applying the chain rule separately to every weight repeats much of the same work. Backpropagation reuses each forward value and passes derivatives backward through the graph to compute all parameter gradients efficiently.
knowledge_points:
  - id: bp-why-backprop
    title: Training needs one gradient for every parameter
    explain: |
      **What backpropagation is.** It is a backward calculation that applies the chain rule through a network to find the loss derivative for each weight and bias.

      **How it works.** A forward pass computes the house price and stores intermediate scores and activations. Starting from the loss, the backward pass propagates its derivative through each operation. Shared values are computed once, rather than rebuilding a separate derivative expression for every weight. Stored forward values supply the inputs to local derivatives, including the ReLU slope.

      **Why this is useful.** Backpropagation supplies all slopes needed to train the same house-price network without repeating the full calculation for each parameter.
    worked: |
      This example shows the calculation.
      The forward pass stores:

      $$
      \begin{aligned}
      z &= 1.2,\\
      h &= 1.2,\\
      \hat y &= 324.5,\\
      L &= 30.25.
      \end{aligned}
      $$

      The backward pass starts with:

      $$dL/d\hat y=2(324.5-330)=-11.$$

      It uses the stored values to continue toward earlier weights.
    problems:
      [bp-why-backprop-basics, bpp-why-every, bpp-nudge-time, bpp-keep-values, bpp-cost, bpp-exact]
  - id: bp-by-hand
    title: Compute one weight gradient backward
    explain: |
      **What a backward pass is.** It propagates a derivative from the loss toward earlier operations, multiplying by each local derivative.

      **How it works.** Use the following equations for area $a=12$:

      $$
      \begin{aligned}
      z &= wa,\\
      h &= \operatorname{ReLU}(z),\\
      \hat y &= 15h+306.5,\\
      L &= (\hat y-330)^2.
      \end{aligned}
      $$

      At $w=0.1$, the forward values are:

      $$
      z=h=1.2,\qquad \hat y=324.5.
      $$

      Then the backward pass gives:

      $$
      \begin{aligned}
      dL/d\hat y &= -11,\\
      dL/dh &= -11(15)=-165,\\
      dL/dw &= -165(1)(12)=-1980.
      \end{aligned}
      $$

      Multiplying local derivatives in reverse order passes the loss sensitivity to each operation's immediate input.

      **Why this is useful.** The resulting weight slope tells gradient descent how this house's error changes when the network weight changes.
    worked: |
      This example shows the calculation.
      $$\frac{\partial L}{\partial w}=\frac{\partial L}{\partial\hat y}\frac{\partial\hat y}{\partial h}\frac{\partial h}{\partial z}\frac{\partial z}{\partial w}=(-11)(15)(1)(12)=-1980.$$
    problems:
      [
        bp-by-hand-basics,
        bpp-upstream-rule,
        bpp-w2-template,
        bpp-gate-closed,
        bpp-reverse-order,
        bpp-w1-template,
        bpp-branch-sum,
      ]
  - id: bp-arrays
    title: Backpropagate a batch with matrix operations
    explain: |
      **What a batch gradient is.** It is the loss gradient for several training examples at once: the per-example gradients added together, computed with a few matrix operations instead of one example at a time. Here each example is one training house.

      **How it works.** A batch contains $B$ houses. Let $d_{\rm in}$ be the number of input features and $d_{\rm out}$ the number of outputs. Define matrix $X$ with one input row per house, and matrix $G$ with one output-error row per house. Their shapes are $B\times d_{\rm in}$ and $B\times d_{\rm out}$.

      The weight-gradient matrix $dW$ is $X^\top G$, where $X^\top$ means $X$ with its rows and columns swapped. Its shape changes from $B\times d_{\rm in}$ to $d_{\rm in}\times B$. The inner dimensions then match in $(d_{\rm in}\times B)(B\times d_{\rm out})$, so $dW$ has shape $d_{\rm in}\times d_{\rm out}$, matching the weights. Summing each column of $G$ gives the bias gradients because the same bias is used for every house.

      Let $z$ be a unit's score before ReLU. ReLU has slope 1 where $z>0$ and 0 elsewhere. The indicator $\mathbf{1}[z>0]$ records those slopes for all units, and $\odot$ multiplies matching entries to apply the mask entry by entry.

      **Why this is useful.** Matrix backpropagation computes house-network gradients for many sales without a separate manual calculation for each row.
    worked: |
      This example shows the calculation.
      With $B=2$, $d_{\rm in}=3$ house features and $d_{\rm out}=2$ hidden units:

      $$X^\top\text{ has shape }3\times2.$$

      $$G\text{ has shape }2\times2.$$

      Thus:

      $$dW=X^\top G\text{ has shape }3\times2,$$

      matching $W$.
    problems:
      [
        bp-arrays-basics,
        bpp-grad-shape,
        bpp-hadamard-template,
        bpp-bias-code,
        bpp-weight-code,
        bpp-pass-back,
        bpp-why-bias-sum,
      ]
  - id: bp-checking
    title: Check gradients against small parameter nudges
    explain: |
      **What a gradient check is.** It compares a calculated derivative with a finite-difference estimate from nearby parameter values.

      **How it works.** For one house-model weight $w$, estimate $\partial L/\partial w$ with $[L(w+h)-L(w-h)]/(2h)$ for a small $h$. Compare that value with backpropagation's result. Use the same inputs, loss and parameters in both calculations. A central difference samples both sides of the parameter and is usually more accurate than a one-sided nudge.

      **Why this is useful.** A gradient check catches implementation mistakes before they affect training on house sales.
    worked: |
      This example shows the calculation.
      For a smooth loss, reduce $h$ and compare the finite-difference estimate with the backward derivative. Agreement to a small tolerance supports the implementation; a sign or shape mismatch points to a bug.
    problems:
      [
        bp-checking-basics,
        bpp-why-check-nudges,
        bpp-check-template,
        bpp-sign-bug,
        bpp-gate-bug,
        bpp-batch-bug,
        bpp-check-w1,
      ]
final: bp-explain
summary: |
  - Backpropagation reuses forward values and applies the chain rule from loss to every parameter.
  - Matrix operations compute gradients for whole batches of houses.
  - Finite differences can check that a backward implementation gives the right slopes.

  **Next:** Automatic differentiation lets software compute these same derivatives for larger models.
