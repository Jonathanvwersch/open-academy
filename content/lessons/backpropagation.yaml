final: bp-explain
summary: |
  - Backpropagation finds every parameter's loss slope in one backward sweep, multiplying arriving slopes by local derivatives and reusing shared ones.
  - The forward pass saves values the backward steps need. For example, ReLU passes a slope back only where its saved score was positive.
  - A shared parameter adds up its contributions, so the weight slopes are $X^\top G$ and the bias slopes are the column sums of $G$.
  - A gradient check compares a few slopes with the central difference $\frac{L(w+\varepsilon)-L(w-\varepsilon)}{2\varepsilon}$.

  **Next:** Automatic differentiation shows how software runs this backward sweep for you.
