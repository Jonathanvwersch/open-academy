concept: backpropagation
version: 5
objective: |
  **Goal:** find every parameter's loss slope in one backward sweep by reusing saved forward values and shared slopes, add the contributions from a batch, and check a slope by nudging a weight.
recap:
  - concept: computational-graphs
    text: "A computational graph splits a calculation into small operations, and a local derivative is one operation's slope for one of its inputs. To get the output's slope, we multiply local derivatives along each path and add the paths."
  - concept: mlp-forward-pass
    text: "A layer weights its inputs, adds a bias and applies an activation. ReLU keeps a positive score and turns a negative one into $0$. In a batch, each example is one row of $X$."
  - concept: loss-functions
    text: "For squared error $(\\hat y-y)^2$, the slope for the prediction $\\hat y$ is twice the error, $2(\\hat y-y)$. The mean squared error (MSE) averages the squared errors over the examples."
  - concept: partial-derivatives
    text: "A partial derivative such as $\\partial L/\\partial w$ is the slope of $L$ when only $w$ changes and everything else stays fixed."
where_this_fits: |
  ### What is backpropagation?

  Backpropagation is a way of finding how the loss changes with every weight and bias of a model, in one sweep that runs backwards from the loss towards the inputs.

  We need it because training lowers the loss by changing every parameter, and to know which way to change each one, it needs that parameter's slope. In the computational graphs lesson, we found one slope by multiplying local derivatives along paths. But different parameters' paths share their last stretch, the part nearest the loss. Handling one parameter at a time redoes that stretch for each of a network's millions of parameters. Backpropagation works out each shared piece once.
knowledge_points:
  - id: bp-why-backprop
    title: "Work backwards from the loss"
    tldr: |
      - Several parameters can affect the loss through the same prediction.
      - Backpropagation starts at the loss and passes slopes backwards through each operation.
      - Reusing shared slopes gives every parameter's loss slope in one backward sweep.
    explain: |
      ### A model with two parameters

      Let's start with the smallest model, which predicts $\hat y=wx+b$ from one input $x$. It has two parameters, a weight $w$ and a bias $b$, and we want the loss's partial derivative for each. We'll take one example with input $x=2$ and target $y=0$, and start from $w=1$ and $b=1$.

      The forward pass follows the grey arrows:

      $$
      \begin{aligned}
      \hat y&=1\times2+1=3 &&\text{compute the prediction}\\
      L&=(3-0)^2=9 &&\text{square the error}
      \end{aligned}
      $$

      We keep these values for the way back, where, for example, the weight's local derivative is the input $x$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" aria-label="Computational graph for the prediction 2w plus b. Grey arrows run forward from w equals 1 and b equals 1 to the prediction 3, then to the loss 9. Blue arrows run back. The loss hands the slope 6 to the prediction once, and the prediction hands 6 times 2, which is 12, to w and 6 times 1, which is 6, to b">
      <defs><marker id="bp1-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="bp1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="20" y="30" width="110" height="40" fill="#ffffff" stroke="#737373" rx="8"/><text x="75" y="55" text-anchor="middle">w = 1</text>
      <rect x="20" y="160" width="110" height="40" fill="#ffffff" stroke="#737373" rx="8"/><text x="75" y="185" text-anchor="middle">b = 1</text>
      <rect x="255" y="100" width="130" height="40" fill="#ffffff" stroke="#737373" rx="8"/><text x="320" y="125" text-anchor="middle">ŷ = 2w + b = 3</text>
      <rect x="500" y="100" width="120" height="40" fill="#ffffff" stroke="#737373" rx="8"/><text x="560" y="125" text-anchor="middle">L = ŷ² = 9</text>
      <path d="M130 58 L253 108" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp1-grey)"/>
      <path d="M130 172 L253 132" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp1-grey)"/>
      <path d="M385 112 L498 112" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp1-grey)"/>
      <path d="M498 130 L387 130" stroke="#3b82f6" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp1-blue)"/>
      <path d="M255 100 L132 42" stroke="#3b82f6" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp1-blue)"/>
      <path d="M255 140 L132 188" stroke="#3b82f6" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp1-blue)"/>
      <text x="442" y="100" text-anchor="middle" fill="#737373">square</text>
      <text x="442" y="160" text-anchor="middle" fill="#3b82f6">6, found once</text>
      <text x="200" y="40" text-anchor="middle" fill="#3b82f6">6 × 2 = 12</text>
      <text x="200" y="210" text-anchor="middle" fill="#3b82f6">6 × 1 = 6</text>
      </g>
      </svg>
      ```

      ### What backpropagation does

      **Backpropagation** finds the loss's partial derivative for every parameter by moving back from the loss through the graph one operation at a time. At each one, it multiplies the arriving slope by the local derivative and passes the result on to the operations before it. Here $w$ and $b$ affect the loss only through $\hat y$, so in the picture the blue arrows give the prediction its slope $6$ once, and then $w$ and $b$ each multiply that $6$ by their own local derivative. The list of all the slopes is called the **gradient** of the loss.

      Be careful not to think of going backwards as undoing the prediction. It doesn't recover the inputs or change $w$ and $b$; it only passes slopes back.
    worked: |
      Let's find both slopes with $x=2$, $y=0$, $w=1$ and $b=1$.

      1. **Run the forward pass.** We keep the values for later.

         $$
         \begin{aligned}
         \hat y&=1\times2+1=3 &&\text{compute the prediction}\\
         L&=(3-0)^2=9 &&\text{square the error}
         \end{aligned}
         $$

      2. **Find the shared slope at the prediction.** It's twice the error, and both parameters pass through it.
         $$\frac{\partial L}{\partial\hat y}=2(\hat y-y)=2(3-0)=6$$
      3. **Multiply by the weight's local derivative.** Raising $w$ by one raises $\hat y$ by $x=2$.
         $$\frac{\partial L}{\partial w}=6\times2=12$$
      4. **Reuse the same $6$ for the bias.** Raising $b$ by one raises $\hat y$ by one.
         $$\frac{\partial L}{\partial b}=6\times1=6$$

      The weight's slope is twice the bias's because the input $2$ doubles every change in $w$.
    problems:
      [
        bp-why-backprop-basics,
        bp-reuse-reason,
        bp-reuse-local,
        bp-reuse-template,
        bp-reuse-branch,
        bp-reuse-robot,
      ]
  - id: bp-by-hand
    title: "Work backwards through a small network"
    tldr: |
      - Each backward step multiplies an arriving loss slope by a local derivative.
      - ReLU passes the slope through for positive saved scores and blocks it otherwise.
      - Following these steps through the network gives both weights' loss slopes.
    explain: |
      ### A network with a ReLU

      Let's go backwards through two layers of one neuron, with ReLU between them. First compute the forward values using $x=2$, $w_1=1$, $w_2=3$ and target $y=5$:

      $$
      \begin{aligned}
      z&=w_1x=1\times2=2 &&\text{first layer score}\\
      h&=\max(0,2)=2 &&\text{apply ReLU}\\
      \hat y&=w_2h=3\times2=6 &&\text{output layer prediction}\\
      L&=(6-5)^2=1 &&\text{square the error}
      \end{aligned}
      $$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" aria-label="A chain of five boxes. Grey arrows run forward from x equals 2, times w1 equals 1, to z equals 2, through ReLU to h equals 2, times w2 equals 3, to the prediction 6, and on to the loss 1 with target 5. Underneath, blue arrows run back with the slopes 2 for the prediction, 6 for h and 6 for z. The weight w2 gets 4 and the weight w1 gets 12">
      <defs><marker id="bp2-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="bp2-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="10" y="50" width="90" height="36" fill="#ffffff" stroke="#737373" rx="8"/><text x="55" y="73" text-anchor="middle">x = 2</text>
      <rect x="140" y="50" width="90" height="36" fill="#ffffff" stroke="#737373" rx="8"/><text x="185" y="73" text-anchor="middle">z = 2</text>
      <rect x="270" y="50" width="90" height="36" fill="#ffffff" stroke="#737373" rx="8"/><text x="315" y="73" text-anchor="middle">h = 2</text>
      <rect x="400" y="50" width="90" height="36" fill="#ffffff" stroke="#737373" rx="8"/><text x="445" y="73" text-anchor="middle">ŷ = 6</text>
      <rect x="530" y="50" width="90" height="36" fill="#ffffff" stroke="#737373" rx="8"/><text x="575" y="73" text-anchor="middle">L = 1</text>
      <path d="M100 68 L138 68 M230 68 L268 68 M360 68 L398 68 M490 68 L528 68" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0"/>
      <path d="M130 68 L138 68" stroke="#737373" stroke-width="2" marker-end="url(#bp2-grey)"/>
      <path d="M260 68 L268 68" stroke="#737373" stroke-width="2" marker-end="url(#bp2-grey)"/>
      <path d="M390 68 L398 68" stroke="#737373" stroke-width="2" marker-end="url(#bp2-grey)"/>
      <path d="M520 68 L528 68" stroke="#737373" stroke-width="2" marker-end="url(#bp2-grey)"/>
      <text x="120" y="40" text-anchor="middle" fill="#737373">× w₁ = 1</text>
      <text x="250" y="40" text-anchor="middle" fill="#737373">ReLU</text>
      <text x="380" y="40" text-anchor="middle" fill="#737373">× w₂ = 3</text>
      <text x="510" y="40" text-anchor="middle" fill="#737373">target 5</text>
      <path d="M565 120 L462 120" stroke="#3b82f6" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp2-blue)"/>
      <path d="M428 120 L332 120" stroke="#3b82f6" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp2-blue)"/>
      <path d="M298 120 L202 120" stroke="#3b82f6" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp2-blue)"/>
      <text x="445" y="125" text-anchor="middle" fill="#3b82f6">2</text>
      <text x="315" y="125" text-anchor="middle" fill="#3b82f6">6</text>
      <text x="185" y="125" text-anchor="middle" fill="#3b82f6">6</text>
      <text x="10" y="125" fill="#737373">slopes</text>
      <text x="120" y="170" text-anchor="middle" fill="#3b82f6">w₁ gets 12</text>
      <text x="380" y="170" text-anchor="middle" fill="#3b82f6">w₂ gets 4</text>
      </g>
      </svg>
      ```

      ### One backward step at a time

      At each operation, a **backward step** multiplies the slope arriving for its output by a local derivative, which gives a slope for each of its inputs. So if we read the blue numbers from right to left, as the backward pass does, each one is the number to its right times a local derivative. The output layer $\hat y=w_2h$ has two inputs, so it sends one slope to $h$ and one to $w_2$.

      ### The ReLU step

      ReLU keeps a positive score and turns a negative one into $0$, so its local derivative is $1$ where the saved score is positive, and $0$ where it's negative, because there the output stays at $0$. At exactly $0$, we use $0$ by convention. Here's what happens to an arriving slope of $6$:

      | Saved score $z$ | Local derivative | Slope for $z$ |
      | --- | --- | --- |
      | $2$ | $1$ | $6$ |
      | $-2$ | $0$ | $0$ |

      That's why the forward pass saves $z$; the backward step needs its sign.

      Be careful not to use ReLU's output as its slope. Here the output is $2$, but the local derivative is $1$.

      ### When one value feeds two operations

      If a value feeds two later operations, it moves the loss along both routes, so, as in the computational graphs lesson, we add the two slopes that arrive at it.
    worked: |
      Let's run the backward pass for $x=2$, $w_1=1$, $w_2=3$ and $y=5$, with the saved values $z=2$, $h=2$ and $\hat y=6$.

      1. **Start at the loss.** The slope for the prediction is twice the error.
         $$\frac{\partial L}{\partial\hat y}=2(6-5)=2$$
      2. **Find the output weight's slope.** Raising $w_2$ by one raises $\hat y=w_2h$ by $h=2$.
         $$\frac{\partial L}{\partial w_2}=2\times2=4$$
      3. **Pass the slope back to the hidden value.** Raising $h$ by one raises $\hat y$ by $w_2=3$.
         $$\frac{\partial L}{\partial h}=2\times3=6$$
      4. **Pass through ReLU.** The saved score $z=2$ is positive, so the local derivative is $1$.
         $$\frac{\partial L}{\partial z}=6\times1=6$$
      5. **Pass through the first weight.** Raising $w_1$ by one raises $z=w_1x$ by $x=2$.
         $$\frac{\partial L}{\partial w_1}=6\times2=12$$

      One sweep gave both weights' slopes, $4$ and $12$, and each slope on the way was worked out once.
    problems:
      [
        bp-by-hand-basics,
        bp-hand-reason,
        bp-hand-partial,
        bp-hand-template,
        bp-hand-split,
        bp-hand-robot,
      ]
  - id: bp-arrays
    title: "Find the slopes for a whole batch"
    tldr: |
      - Every example in a batch uses the same weights and biases.
      - Each example contributes to their loss slopes, and those contributions add.
      - A matrix product adds the weight contributions, while column sums give the bias slopes.
    explain: |
      ### One weight, many examples

      Every example shares the same weights and bias. Use $\hat y=wx+b$ with $w=2$, $b=1$, inputs $1$ and $2$, and target $1$ for both:

      $$
      \begin{aligned}
      \hat y_1&=2\times1+1=3 &&\text{first prediction}\\
      \hat y_2&=2\times2+1=5 &&\text{second prediction}\\
      e_1&=3-1=2 &&\text{first error}\\
      e_2&=5-1=4 &&\text{second error}\\
      L&=(2^2+4^2)/2=10 &&\text{mean squared error}\\
      \frac{\partial L}{\partial\hat y_i}&=2e_i/2=e_i &&\text{differentiate the mean}
      \end{aligned}
      $$

      The subscript $i$ identifies the example. Each prediction's slope equals its error because the MSE divides by two.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" aria-label="One weight w equals 2 feeds two predictions with grey arrows, 3 for the input 1 and 5 for the input 2, and both feed the mean squared error 10. The predictions get the slopes 2 and 4. In blue, the weight collects 2 times 1, which is 2, from the first example and 4 times 2, which is 8, from the second, and adds them to get 10">
      <defs><marker id="bp3-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="20" y="90" width="100" height="40" fill="#ffffff" stroke="#737373" rx="8"/><text x="70" y="115" text-anchor="middle">w = 2</text>
      <rect x="250" y="30" width="150" height="40" fill="#ffffff" stroke="#737373" rx="8"/><text x="325" y="55" text-anchor="middle">ŷ₁ = 3 (x = 1)</text>
      <rect x="250" y="150" width="150" height="40" fill="#ffffff" stroke="#737373" rx="8"/><text x="325" y="175" text-anchor="middle">ŷ₂ = 5 (x = 2)</text>
      <rect x="500" y="90" width="120" height="40" fill="#ffffff" stroke="#737373" rx="8"/><text x="560" y="115" text-anchor="middle">L = 10</text>
      <path d="M120 100 L248 55" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp3-grey)"/>
      <path d="M120 120 L248 165" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp3-grey)"/>
      <path d="M400 55 L498 102" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp3-grey)"/>
      <path d="M400 165 L498 118" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0" marker-end="url(#bp3-grey)"/>
      <text x="460" y="50" text-anchor="middle" fill="#3b82f6">slope 2</text>
      <text x="460" y="185" text-anchor="middle" fill="#3b82f6">slope 4</text>
      <text x="170" y="62" text-anchor="middle" fill="#3b82f6">2 × 1 = 2</text>
      <text x="170" y="170" text-anchor="middle" fill="#3b82f6">4 × 2 = 8</text>
      <text x="70" y="158" text-anchor="middle" fill="#3b82f6">2 + 8 = 10</text>
      </g>
      </svg>
      ```

      ### Adding up the examples

      The weight is used once in each example, so, like a value that feeds two operations, it adds up one contribution per example. Each is the prediction's slope times that example's input, as the blue numbers show. The bias's local derivative is $1$ in every example, so its slope is just the sum of the prediction slopes.

      For a big batch, we don't want to write that sum out. If we put the inputs in the rows of a matrix $X$ and the prediction slopes in a column $G$, the sum is a matrix product:

      $$\frac{\partial L}{\partial w}=X^\top G$$

      Each entry of $X^\top G$ is the dot product of one column of inputs with $G$. The same holds for a layer: for scores $Z=XW$, with one column of $W$ per neuron and $G$ holding the slopes of $Z$, the weight slopes $X^\top G$ form a matrix the same shape as $W$. The bias slopes are the column sums of $G$.

      ### ReLU on a whole array

      In a ReLU layer, each saved score has its own local derivative, and we need two new symbols to write that down. We write the **indicator** $\mathbf 1[z>0]$ for "$1$ if $z$ is positive, otherwise $0$", and $\odot$ for multiplying arrays entry by entry. The slopes passed back are the arriving slopes $\odot\,\mathbf 1[Z>0]$.

      Be careful not to divide by the batch size again at the end. The MSE has already divided by it inside $G$, so averaging again would make every slope too small.
    worked: |
      Let's compute the slopes for $w=2$, $b=1$ and the examples $(x,y)=(1,1)$ and $(2,1)$.

      1. **Find each prediction's slope.** It's twice the error divided by the $2$ examples, which is just the error.
         $$G=\begin{pmatrix}2\\4\end{pmatrix}$$
      2. **Multiply by the inputs and add.** Transposing the column $X$ makes it a row, and a row times a column multiplies matching entries and adds them.
         $$\frac{\partial L}{\partial w}=X^\top G=1\times2+2\times4=10$$
      3. **Add the slopes for the bias.** The bias moves every prediction by the same amount.
         $$\frac{\partial L}{\partial b}=2+4=6$$

      In NumPy, `X.T` is the transpose, `@` multiplies matrices and `G.sum(axis=0)` adds down each column, while `Z > 0` gives `True` or `False`, which count as $1$ or $0$.

      ```python
      import numpy as np
      X = np.array([[1.], [2.]])    # one example per row
      G = np.array([[2.], [4.]])    # prediction slopes
      print(X.T @ G, G.sum(axis=0))
      Z = np.array([[2.], [-2.]])   # saved ReLU scores
      print(6 * (Z > 0))
      ```

      It prints `[[10.]] [6.]`, then `[[6] [0]]`: only the positive score lets the $6$ through.
    problems:
      [
        bp-arrays-basics,
        bp-array-reason,
        bp-array-bias,
        bp-array-template,
        bp-array-shape,
        bp-array-robot,
      ]
  - id: bp-checking
    title: "Check a slope by nudging a weight"
    tldr: |
      - We can check a loss slope by changing one weight and measuring the loss again.
      - Measuring equally far above and below the weight gives a slope estimate.
      - Agreement with backpropagation checks that slope at the tested point.
    explain: |
      ### Measuring a slope directly

      Backward code with a mistake still gives a number, so we also measure the slope another way, by nudging one parameter and watching the loss.

      Let's go back to the first model, $\hat y=wx+b$ with $x=2$ and $y=0$, and hold $b=1$ fixed, so the loss is $L(w)=(2w+1)^2$. At $w=1$, backpropagation gave $12$. The grey curve is the loss as $w$ changes. We measure it at $w=0.9$ and $w=1.1$, and the slope of the orange line joining them is our measurement.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" aria-label="The grey curve shows the loss (2w plus 1) squared for w from 0.6 to 1.4. It passes through 7.84 at w equals 0.9, 9 at w equals 1 and 10.24 at w equals 1.1. An orange line joins the two outer points, and its slope, 2.4 divided by 0.2, is 12">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M50 225 H600 M50 225 V25" stroke="#d4d4d4"/>
      <path d="M255 225 v6 M320 225 v6 M385 225 v6" stroke="#737373"/>
      <text x="255" y="248" text-anchor="middle" fill="#737373">0.9</text>
      <text x="320" y="248" text-anchor="middle" fill="#737373">1</text>
      <text x="385" y="248" text-anchor="middle" fill="#737373">1.1</text>
      <text x="608" y="230" fill="#737373">w</text>
      <text x="58" y="30" fill="#737373">loss</text>
      <path d="M60.0 210.5 73.0 207.4 86.0 204.3 99.0 201.1 112.0 197.9 125.0 194.6 138.0 191.3 151.0 187.9 164.0 184.4 177.0 180.9 190.0 177.3 203.0 173.7 216.0 170.0 229.0 166.3 242.0 162.5 255.0 158.7 268.0 154.8 281.0 150.8 294.0 146.8 307.0 142.8 320.0 138.6 333.0 134.5 346.0 130.2 359.0 126.0 372.0 121.6 385.0 117.2 398.0 112.8 411.0 108.3 424.0 103.7 437.0 99.1 450.0 94.4 463.0 89.7 476.0 84.9 489.0 80.1 502.0 75.2 515.0 70.2 528.0 65.2 541.0 60.2 554.0 55.1 567.0 49.9 580.0 44.7" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0"/>
      <path d="M255 158.7 L385 117.2" stroke="#f59e0b" stroke-width="3" fill="#ffffff" fill-opacity="0"/>
      <circle cx="255" cy="158.7" r="5" fill="#f59e0b"/>
      <circle cx="385" cy="117.2" r="5" fill="#f59e0b"/>
      <circle cx="320" cy="138.6" r="5" fill="#171717"/>
      <text x="245" y="180" text-anchor="end">7.84</text>
      <text x="395" y="140">10.24</text>
      <text x="330" y="165">9</text>
      <text x="420" y="60" fill="#f59e0b">slope of orange line: 12</text>
      </g>
      </svg>
      ```

      ### Measuring from both sides

      A **finite-difference estimate** divides a change in the loss by a small change in one parameter, with everything else fixed. The **central difference** measures the loss a nudge $\varepsilon$ (epsilon) below and above the parameter, and divides by the distance between them, $2\varepsilon$:

      $$\frac{L(w+\varepsilon)-L(w-\varepsilon)}{2\varepsilon}$$

      Comparing it with backpropagation's answer is a **gradient check**. Here are two mistakes it catches at $w=1$:

      - Nudging only upwards is off because the curve bends:

        $$
        \begin{aligned}
        10.24-9&=1.24 &&\text{loss change for an upward nudge}\\
        1.24/0.1&=12.4 &&\text{divide by the nudge}
        \end{aligned}
        $$

        We nudge both ways to reduce this error.
      - Code that forgot to multiply by $x$ returns $6$, only half of the measured $12$.

      ### What a check can't do

      Each estimate costs two extra forward passes for one parameter, far too slow for every weight, so we only check a few. Very tiny nudges lose accuracy in computer arithmetic, so nudges of about $0.01$ usually work better. We avoid nudging a ReLU score across $0$, where its slope jumps. And a passing check only covers the points we tested.
    worked: |
      Let's check the slope $12$ for $L(w)=(2w+1)^2$ at $w=1$, with the nudge $\varepsilon=0.1$.

      1. **Measure the loss just above.** We raise $w$ by the nudge and keep $b$ fixed.
         $$L(1.1)=(2\times1.1+1)^2=3.2^2=10.24$$
      2. **Measure the loss just below.** We lower $w$ by the same nudge.
         $$L(0.9)=(2\times0.9+1)^2=2.8^2=7.84$$
      3. **Divide by the distance between the two weights.** They are two nudges, $0.2$, apart.
         $$\frac{10.24-7.84}{0.2}=\frac{2.4}{0.2}=12$$

      The estimate matches backpropagation's $12$, so we can trust it at $w=1$.
