concept: backpropagation
version: 4
objective: |
  **Goal:** reuse saved calculations to find every parameter's loss slope, combine slopes across examples, and check them with small nudges.
where_this_fits: |
  Training a model means changing its weights and biases to reduce its loss. You can already follow a chain of operations to find one weight's loss slope. But a network has many parameters, and tracing each one separately repeats the same calculations near the loss. This lesson organises that work so you can get all the slopes without starting again for each weight:

  1. Save the forward values and reuse slopes on the way back.
  2. Calculate the backward steps through a small network.
  3. Combine contributions from several examples using arrays.
  4. Check the calculated slopes against small parameter nudges.
knowledge_points:
  - id: bp-why-backprop
    title: Save once, reuse on the way back
    explain: |
      **The question.** You can multiply local derivatives along a graph to find one parameter's loss slope. Must you start from the loss again for every other parameter?

      **Picture it.** Imagine a machine with two adjustable dials, $w$ and $b$. It doubles the first dial, adds the second, then squares the total. Call the total $z$ and the final score $L$. At $w=1$ and $b=1$, the total is 3 and the score is 9. Grey lines show forward dependencies; the blue arrow carries the shared loss slope back.
      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" aria-label="Two dials feed a shared total z equals 3 and loss L equals 9; shared slope 6 supplies both dial derivatives">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
      <text x="15" y="35">w = 1</text><text x="15" y="125">b = 1</text><text x="240" y="80">z = 3</text><text x="485" y="80">L = 9</text>
      <path d="M80 30 L230 72 M80 120 L230 80 M310 75 H475" stroke="#737373" fill="#171717" fill-opacity="0"/>
      <text x="115" y="30">× 2</text><text x="365" y="55">square</text>
      <path d="M470 95 H320 l10 -5 m-10 5 l10 5" stroke="#3b82f6" fill="#171717" fill-opacity="0"/>
      <text x="345" y="125" fill="#3b82f6">shared loss slope 6</text>
      </g>
      </svg>
      ```

      **The idea.** Work back once and reuse the loss slope wherever earlier routes meet. **Backpropagation** is the reverse application of the chain rule through a computational graph to find the loss derivative for every parameter. The forward pass saves intermediate values; the backward pass uses them to evaluate local derivatives. Here the same derivative of the square serves both dial routes. In $\partial L/\partial z$, the symbol $\partial$ denotes a partial derivative: the loss slope when only $z$ changes.

      **Common confusion.** “Going backwards means undoing the prediction.” No: you pass rates of change backwards, not original inputs. You keep the forward values until their local derivatives have been calculated; the backward pass itself does not change the dials.
    worked: |
      **Worked example.** This example shows one shared slope supplying both dial derivatives.

      1. Save the total and score.

      $$z=2(1)+1=3$$

      $$L=z^2=9$$

      2. Differentiate the shared square once.

      $$\frac{\partial L}{\partial z}=2z=6$$

      3. Continue to each dial using its local multiplier.

      $$\frac{\partial L}{\partial w}=6\cdot2=12$$

      $$\frac{\partial L}{\partial b}=6\cdot1=6$$

      **Compare cases.** Keep the other dial fixed in each row.

      | Dial you change | Local slope of total | Loss slope |
      | --- | --- | --- |
      | $w$ | 2 | 12 |
      | $b$ | 1 | 6 |

      **Where it shows up.** A network's weights share many later operations. Reusing their loss slopes avoids recalculating the same part of the chain for each weight.
    problems:
      [
        bp-why-backprop-basics,
        bp-reuse-reason,
        bp-reuse-local,
        bp-reuse-template,
        bp-reuse-branch,
        bp-reuse-robot,
      ]
  - id: bp-by-hand
    title: Compute one weight gradient backward
    explain: |
      **The question.** How do you continue the backward calculation when the machine includes an activation that can block a change?

      **Picture it.** ReLU acts like a gate: it passes positive scores unchanged and replaces negative scores with zero. First multiply fixed input $x=2$ by adjustable weight $w=1$, giving score $z=wx=2$. Then apply ReLU, giving its output $h=2$. Multiply that by 3 to get prediction $p=6$, and compare it with target $t=5$ using squared loss $L=(p-t)^2$. The diagram shows saved values, not slopes.
      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" aria-label="Forward values through multiply, ReLU, multiply and squared error">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
      <text x="10" y="65">x = 2</text><text x="140" y="65">z = 2</text><text x="270" y="65">h = 2</text><text x="400" y="65">p = 6</text><text x="525" y="65">L = 1</text>
      <path d="M70 60 H130 l-8 -4 m8 4 l-8 4 M200 60 H260 l-8 -4 m8 4 l-8 4 M330 60 H390 l-8 -4 m8 4 l-8 4 M460 60 H515 l-8 -4 m8 4 l-8 4" stroke="#737373" fill="#171717" fill-opacity="0"/>
      <text x="75" y="35">× w</text><text x="205" y="35">ReLU</text><text x="335" y="35">× 3</text><text x="465" y="35">(p − 5)²</text>
      <text x="130" y="115" fill="#3b82f6">Backward: pass loss slopes towards earlier values</text>
      </g>
      </svg>
      ```

      **The idea.** At each operation, multiply the arriving loss slope by that operation's local slope. A **backward step** converts the loss derivative with respect to an operation's output into the derivative with respect to an input. If a value feeds two later operations, changing it affects the loss through both routes: add their loss-slope contributions before continuing. For ReLU the local slope is 1 at positive scores and 0 at negative scores. At exactly zero the ordinary derivative is undefined; here we use the common implementation choice of 0.

      **Common confusion.** “The ReLU slope is its saved output.” No: at score 2 the output is 2, but the slope is 1. The saved score tells you which side of the gate you are on, not what number to multiply by directly.
    worked: |
      **Worked example.** This example shows how the saved positive score leads back to the weight.

      1. Start at the squared error.

      $$\frac{\partial L}{\partial p}=2(p-t)=2(6-5)=2$$

      2. Cross the output multiplication.

      $$\frac{\partial L}{\partial h}=2\cdot3=6$$

      3. Pass through ReLU: the positive score selects local slope 1.

      $$\frac{\partial L}{\partial z}=6\cdot1=6$$

      4. Cross the input multiplication, keeping $x$ fixed.

      $$\frac{\partial L}{\partial w}=6\cdot2=12$$

      **Compare cases.** For an arriving loss slope of 6:

      | Saved score | ReLU local slope | Loss slope passed back |
      | --- | --- | --- |
      | 2 | 1 | 6 |
      | -2 | 0 | 0 |
      | 0 | 0 by our convention | 0 |

      **Where it shows up.** A neural network repeats these same local steps through its layers. Each weight receives a loss slope, rather than a new prediction.
    problems:
      [
        bp-by-hand-basics,
        bp-hand-reason,
        bp-hand-partial,
        bp-hand-template,
        bp-hand-split,
        bp-hand-robot,
      ]
  - id: bp-arrays
    title: Combine example contributions with arrays
    explain: |
      **The question.** If several examples use the same weight and bias, how do their backward contributions become one slope per parameter?

      **Picture it.** Use $p=wx+b$ on two inputs, 1 and 2. Put them in column $X$, one example per row. The backward calculation has already found how loss changes with each prediction: slopes 2 and 4. Put these in column $G$. For a mean loss, this earlier calculation includes division by the number of examples; do not divide again.
      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" aria-label="Two example contributions to a shared weight add: 1 times 2 plus 2 times 4 equals 10">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
      <text x="20" y="30">input</text><text x="160" y="30">output slope</text><text x="350" y="30">weight contribution</text>
      <text x="35" y="65">1</text><text x="200" y="65" fill="#3b82f6">2</text><text x="380" y="65" fill="#3b82f6">1 × 2 = 2</text>
      <text x="35" y="100">2</text><text x="200" y="100" fill="#3b82f6">4</text><text x="380" y="100" fill="#3b82f6">2 × 4 = 8</text>
      <path d="M80 60 H145 M260 60 H340 M80 95 H145 M260 95 H340" stroke="#737373"/>
      <text x="350" y="140" fill="#3b82f6">add: weight slope 10</text>
      </g>
      </svg>
      ```

      **The idea.** Add contributions wherever a parameter is shared. A **batch gradient** collects parameter loss derivatives from a group of examples. Here the weight contributions are input times output slope: $1(2)$ and $2(4)$. Transposing $X$, written $X^\top$, turns its column into a row. Multiplying that row by column $G$ adds those matching products. For several inputs and outputs, the same operation gives the weight-gradient array $dW=X^\top G$. These entries are slopes for the weights, not changes to make to them.

      A bias adds equally to every prediction: its local multiplier is 1. Its contributions are therefore $1(2)$ and $1(4)$; add each output column of $G$ to get that output's bias slope.

      ReLU instead uses a separate local slope for each saved score. Write those slopes as $\mathbf{1}[z>0]$: 1 for a positive score $z$, otherwise 0. This is an **indicator** array. The symbol $\odot$ means multiply entries in matching positions; it does not sum them.

      **Common confusion.** “A batch always means averaging the gradients at the end.” No: averaging again divides twice if $G$ already includes the mean loss's scaling.
    worked: |
      **Worked example.** This example combines two rows without dividing their already-scaled slopes again.

      1. Arrange inputs and output slopes by row.

      $$X=\begin{pmatrix}1\\2\end{pmatrix}$$

      $$G=\begin{pmatrix}2\\4\end{pmatrix}$$

      2. Turn the input column into a row so multiplication pairs each input with its own output slope.

      $$X^\top=\begin{pmatrix}1&2\end{pmatrix}$$

      $$dW=X^\top G=1(2)+2(4)$$

      $$dW=2+8=10$$

      3. Add bias contributions: changing the bias changes each prediction by the same amount.

      $$\frac{\partial L}{\partial b}=1(2)+1(4)=6$$

      4. Apply ReLU slopes separately if passing through a ReLU layer. For saved scores $(2,-2)$ the local slopes are $(1,0)$, so arriving loss slopes $(6,6)$ become:

      $$(6,6)\odot(1,0)=(6\cdot1,6\cdot0)$$

      $$=(6,0)$$

      **Compare cases.** These shapes use one example per row.

      | Inputs $X$ | Output slopes $G$ | Weight slopes $X^\top G$ |
      | --- | --- | --- |
      | $2\times1$ | $2\times1$ | $1\times1$ |
      | $2\times3$ | $2\times1$ | $3\times1$ |
      | $2\times3$ | $2\times2$ | $3\times2$ |

      **Where it shows up.** Array operations calculate a network's batch gradients without a separate loop for every weight. The result has the same shape as the weights it describes.
    problems:
      [
        bp-arrays-basics,
        bp-array-reason,
        bp-array-bias,
        bp-array-template,
        bp-array-shape,
        bp-array-robot,
      ]
  - id: bp-checking
    title: Check slopes with small parameter nudges
    explain: |
      **The question.** A backward calculation returns a number, but how can you tell whether a sign, multiplier or batch scaling is wrong?

      **Picture it.** Return to the two-dial machine with $L=(2w+b)^2$ and fix $b=1$. Near $w=1$, compare the loss just to the left and just to the right. The graph uses horizontal position for the weight and vertical position for loss; the blue line joins the two nearby measurements. Its slope estimates the loss slope at the middle.
      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 245" aria-label="Loss (2w plus 1) squared near w equals 1 with two-sided measurements 7.84 and 10.24">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M50 200 H420 M50 200 V20" stroke="#737373" fill="#171717" fill-opacity="0"/>
      <path d="M50 160 Q230 112 410 40" stroke="#737373" stroke-width="2" fill="#171717" fill-opacity="0"/>
      <path d="M170 125.333333 L290 85.333333" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="170" cy="125.333333" r="4" fill="#3b82f6"/><circle cx="290" cy="85.333333" r="4" fill="#3b82f6"/><circle cx="230" cy="106" r="4" fill="#171717"/>
      <text x="75" y="112">7.84</text><text x="300" y="78">10.24</text><text x="235" y="140">L = 9</text>
      <text x="155" y="220">0.9</text><text x="225" y="220">1</text><text x="280" y="220">1.1</text><text x="400" y="235">w</text><text x="15" y="25">loss</text>
      </g>
      </svg>
      ```

      **The idea.** Compare the calculated slope with a slope measured from nearby losses. Dividing a change in loss by a small change in a parameter gives a **finite-difference estimate** of its derivative. A **gradient check** compares this estimate with backpropagation's derivative, keeping inputs, targets and other parameters fixed. A **central difference** measures the loss at equal distances below and above the current parameter, then divides their loss difference by the full distance between them. For weight $w$ and positive nudge size $\varepsilon$ (epsilon), it is:

      $$\frac{L(w+\varepsilon)-L(w-\varepsilon)}{2\varepsilon}$$

      **Common confusion.** “A smaller nudge always gives a better check.” No: extremely small differences can lose accuracy in computer arithmetic. Try several modestly small sizes on a smooth part of the calculation; avoid a ReLU corner. Agreement supports the implementation at the tested points, not a proof that every case is correct.
    worked: |
      **Worked example.** This example checks the backward weight slope 12 with both dials initially at 1.

      1. Choose a nudge and recompute the two losses with $b=1$ fixed.

      $$\varepsilon=0.1$$

      $$L(1.1)=(2(1.1)+1)^2=10.24$$

      $$L(0.9)=(2(0.9)+1)^2=7.84$$

      2. Divide the loss difference by the full distance between weights.

      $$\frac{10.24-7.84}{0.2}=12$$

      3. Compare with the backward result.

      $$\frac{\partial L}{\partial w}=2(2w+b)\cdot2=12$$

      **Compare cases.** Both nudge sizes give the expected slope here.

      | Nudge size | Central estimate | Backward result |
      | --- | --- | --- |
      | 0.1 | 12 | 12 |
      | 0.01 | 12 | 12 |

      **Where it shows up.** Check a few network parameters before trusting a new backward implementation. A batch-size factor mismatch often points to averaging twice or not averaging at all.
    problems:
      [
        bp-checking-basics,
        bp-check-reason,
        bp-check-gap,
        bp-check-template,
        bp-check-scaling,
        bp-check-robot,
      ]
final: bp-explain
summary: |
  - Backpropagation saves forward values and reuses shared loss slopes to reach every parameter.
  - Each backward step multiplies by a local slope, and shared routes contribute a sum.
  - Batch gradients add example contributions with array operations, including loss averaging only once.
  - Small two-sided parameter nudges check whether calculated loss slopes agree with measured ones.

  **Next:** You will see how software records the operations and calculates their derivatives for you.
