concept: reward-hacking
version: 1
objective: |
  **Goal:** explain why optimising a proxy reward too hard can lower true quality, and spot the signs of reward hacking in training curves and sample replies.
recap:
  - concept: rlhf
    text: 'PPO trains the policy $\pi_\theta$ on $r_\phi(x,y)-\beta\ln\frac{\pi_\theta(y\mid x)}{\pi_{\text{ref}}(y\mid x)}$ for prompt $x$ and reply $y$, where $r_\phi$ is the reward model and $\pi_{\text{ref}}$ a frozen copy of the SFT model. A larger $\beta$ keeps the policy closer to that copy.'
  - concept: reward-design
    text: "Reward hacking is an agent earning high reward in a way the designer didn't intend. A corridor robot paid $+3$ for every move right, with nothing taken back for moving left, learned to loop forever."
where_this_fits: |
  ### What is reward hacking?

  Reward hacking is a model earning a high reward in a way we didn't intend, by finding behaviour the reward scores higher than it deserves. If we keep pushing that score up, further gains can come at the expense of the quality we actually care about. That's reward over-optimisation.

  The reward model in RLHF gives a score to any reply, but it learned from a limited set of people's comparisons, so it makes mistakes. RLHF trades off higher scores against staying close to the starting policy. The push for higher scores can still find those mistakes.
knowledge_points:
  - id: rh-proxy
    title: "A reward stands in for the goal"
    tldr: |
      - What we really want, such as replies people find helpful, can't be measured for every reply.
      - So we train on a reward we can compute, which is close to what we want but has errors.
      - Choosing the highest score can favour a reply the reward rates too highly.
    explain: |
      ### A number we can compute

      In the reward design lesson, a $+3$ bonus per move right was meant to reward progress along a corridor, but a robot could earn it by going back and forth.

      The reward model in RLHF plays the same part for what we really want. We want replies that people find helpful and correct, but we can't ask people about every reply written during training. So we use the reward model's score instead.

      A **proxy reward** is a reward we can compute that stands in for a goal we can't measure directly. We call how good a reply really is its **true quality**. We can estimate it, for example by asking careful people to rate the reply out of 10. A proxy can be hand-written, like the corridor bonus, or learned, like the reward model $r_\phi$.

      ### Keeping the highest score

      The simplest way to optimise a reward is to have the policy write several replies and keep the top-scoring one. This is a real method, called best-of-$n$ sampling, where $n$ is the number of replies. The policy doesn't change, but choosing keeps the highest of the $n$ scores.

      Suppose the policy writes four replies to "Explain why the sky is blue." Imagine the reward model's scores are on the same scale as true quality, so that we can subtract one from the other. Then each score is true quality plus an error. The error is the amount the reward model is off by. Say the reward model is close on three replies but overrates a long, padded one by $3$ points. Then keeping the top score can keep the padded reply over better ones.

      A reply can score high by being good or by having a large positive error. If we draw more replies independently from the same policy, we're more likely to see at least one badly overrated reply. Whether it wins depends on what else we drew: a genuinely better reply could score higher.

      A reward model is usually tested on comparisons it wasn't trained on. Agreement with people there is useful evidence for replies like those in the test. Choosing among many replies can surface ones the reward model was never tested on.
    worked: |
      Let's compare keeping the reply the reward model scores highest with keeping the reply that is really best, for four replies to "Explain why the sky is blue." These numbers are invented. A and B are both correct, but B explains more clearly. C is long and repeats itself, and D is off topic. The reward model overrates C, perhaps because longer replies often won the comparisons it learned from.

      | reply | true quality | score |
      | --- | --- | --- |
      | A, terse | $3$ | $3$ |
      | B, clear | $4$ | $4.5$ |
      | C, padded | $2$ | $5$ |
      | D, off topic | $1$ | $0.5$ |

      1. **Keep the highest score.** The scores are $3$, $4.5$, $5$ and $0.5$, so the reward model's choice is reply C.
         $$\max(3,\,4.5,\,5,\,0.5)=5.$$

      2. **Find the best true quality.** The true qualities are $3$, $4$, $2$ and $1$, so the best reply is B.
         $$\max(3,\,4,\,2,\,1)=4.$$

      3. **Find the true quality we lost.** We kept C, whose true quality is $2$.
         $$4-2=2.$$

      4. **Find each reply's error.** The error is the score minus the true quality, here for A, B, C and D in turn.
         $$0,\qquad0.5,\qquad3,\qquad-0.5.$$

      Following the reward model cost us $2$ points of true quality, and the reply it chose is the one it was most wrong about.
    problems:
      - rh-proxy-basics
      - rh1-worked-self-explain
      - rh1-lost-quality-template
      - rh1-more-replies
      - rh1-held-out-agreement
      - rh1-corridor-proxy
      - rh1-bradley-terry
      - rh1-summary-overlap
  - id: rh-overopt
    title: "Why reward rises while replies get worse"
    tldr: |
      - The policy starts by writing replies like the ones used to train the reward model.
      - As the policy changes, it can start writing replies the reward model rarely saw.
      - If the reward model overrates those replies, its score can rise while true quality falls.
    explain: |
      ### Drifting away from the reward model's data

      Best-of-$n$ chooses among replies from a fixed policy. Reinforcement learning can change the policy across updates. PPO favours actions with positive estimated advantage under the KL-penalised reward. The reward model stays fixed during this stage, so the policy can learn to favour replies it overrates.

      The reward model learned from comparisons between replies written by the SFT model. It has more examples to learn from for replies like those than for unfamiliar ones. The policy starts as a copy of the SFT model. As PPO changes it, the policy can drift away from that starting point and write replies the reward model rarely saw.

      Early gains can reflect real improvements. Later, if the policy writes more of the replies the reward model misjudges, the score can rise even as replies get worse. PPO doesn't seek out unfamiliar replies on purpose, and the raw reward model score needn't rise at every checkpoint.

      ### Two curves from one run

      Here is an invented RL run. Every 100 training steps, the policy answers a fixed set of held-out prompts, used to train neither the policy nor the reward model. We record the average rating out of 10 that people gave the replies, and the average reward model score. A reward model's scores only mean something as differences, so we show the score minus the SFT model's average, which starts at $0$. The two charts use different scales.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" aria-label="Two line charts of the same RL run against training steps from 0 to 500. On the left, the reward model score in blue rises at every checkpoint: 0, 1.0, 1.8, 2.4, 2.9 and 3.3. On the right, people's rating in green rises from 5.0 to a peak of 6.8 at step 300, then falls to 6.4 and 5.6">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="165" y="22" text-anchor="middle">reward model score</text>
      <text x="485" y="22" text-anchor="middle">people's rating (out of 10)</text>
      <path d="M50 40 V200 H280" stroke="#d4d4d4" stroke-width="1.5" fill="#d4d4d4" fill-opacity="0"/>
      <path d="M370 40 V200 H600" stroke="#d4d4d4" stroke-width="1.5" fill="#d4d4d4" fill-opacity="0"/>
      <text x="42" y="205" text-anchor="end" fill="#737373">0</text>
      <text x="42" y="65" text-anchor="end" fill="#737373">3.5</text>
      <text x="362" y="205" text-anchor="end" fill="#737373">5</text>
      <text x="362" y="65" text-anchor="end" fill="#737373">7</text>
      <text x="50" y="222" text-anchor="middle" fill="#737373">0</text>
      <text x="270" y="222" text-anchor="middle" fill="#737373">500</text>
      <text x="370" y="222" text-anchor="middle" fill="#737373">0</text>
      <text x="590" y="222" text-anchor="middle" fill="#737373">500</text>
      <text x="165" y="248" text-anchor="middle" fill="#737373">training steps</text>
      <text x="485" y="248" text-anchor="middle" fill="#737373">training steps</text>
      <polyline points="50,200 94,160 138,128 182,104 226,84 270,68" stroke="#3b82f6" stroke-width="2.5" fill="#3b82f6" fill-opacity="0"/>
      <polyline points="370,200 414,130 458,88 502,74 546,102 590,158" stroke="#10b981" stroke-width="2.5" fill="#10b981" fill-opacity="0"/>
      <circle cx="502" cy="74" r="4" fill="#10b981"/>
      <text x="502" y="62" text-anchor="middle" fill="#10b981">peak 6.8 at step 300</text>
      </g>
      </svg>
      ```

      In this run the score rose at every checkpoint, but people's rating peaked at step 300 and then fell. **Reward over-optimisation** means pushing a proxy until further proxy gains come at the expense of true quality. Quality can also fall from the start.

      People often sum this up with Goodhart's law, which says that when a measure becomes a goal to push up, it stops being a good measure.

      A rising reward model score alone can't tell us whether the gains are real or come from errors.
    worked: |
      Let's read the run above and find what training past the best checkpoint cost. Here are its numbers, with the KL at each checkpoint too, in nats, the unit KL has when we use natural logs. The score is the reward model's, and the rating is people's.

      | step | KL (nats) | score | rating |
      | --- | --- | --- | --- |
      | $0$ | $0$ | $0$ | $5.0$ |
      | $100$ | $2$ | $1.0$ | $6.0$ |
      | $200$ | $4$ | $1.8$ | $6.6$ |
      | $300$ | $6$ | $2.4$ | $6.8$ |
      | $400$ | $8$ | $2.9$ | $6.4$ |
      | $500$ | $10$ | $3.3$ | $5.6$ |

      1. **Find the best checkpoint.** People's ratings are $5.0$, $6.0$, $6.6$, $6.8$, $6.4$ and $5.6$, so the best is $6.8$, at step 300.

      2. **Find how much the score rose after it.** From step 300 to step 500, the reward model score went from $2.4$ to $3.3$.
         $$3.3-2.4=0.9.$$

      3. **Find how much the rating fell after it.** Over the same steps, people's rating went from $6.8$ to $5.6$.
         $$6.8-5.6=1.2.$$

      4. **Compare the last checkpoint with the start.** The SFT model, at step 0, was rated $5.0$, so this checks whether training helped at all.
         $$5.6-5.0=0.6.$$

      Over those same 200 steps, the KL grew from $6$ to $10$ nats, so the policy moved further from the SFT model as its rating fell. The final policy still rated higher than the SFT model, but the step 300 policy was rated $1.2$ points higher than the final one. If we choose among the checkpoints we've seen, we'd go back to step 300.

      Gao, Schulman and Hilton measured a similar pattern in a [2022 study](https://arxiv.org/abs/2210.10760). A large reward model stood in for human judgments. A smaller one, trained on the large one's choices between replies, was the proxy. In their experiments, as the KL grew, the proxy score kept rising while the large model's score could peak and fall.
    problems:
      - rh-overopt-basics
      - rh2-worked-self-explain
      - rh2-accurate-early
      - rh2-rating-drop-template
      - rh2-which-curves
      - rh2-kl-drift-template
      - rh2-robot-tidy
  - id: rh-signs
    title: "Spot reward hacking in curves and replies"
    tldr: |
      - The reward model's score can't show hacking alone, so we also track ratings the policy isn't trained on.
      - The clearest sign is the score rising while ratings fall, from people or a stronger language model acting as judge.
      - Reading replies can uncover padding, repetition, flattery or code that only handles specific test cases correctly.
    explain: |
      ### A rating the policy isn't trained on

      A higher reward model score can hide worse replies. To check, we can have each saved checkpoint answer held-out prompts, then ask people to rate its replies. A **stronger judge** is a separate evaluator that's more reliable on the task than the training reward model, for example a capable language model. It can be cheaper than asking people. Its ratings aren't supplied as training reward, but the same bias, such as a preference for long replies, can mislead both models.

      A rising proxy score paired with falling held-out ratings is a warning sign. Those ratings estimate quality and can be noisy or biased. KL growing faster than before is another reason to look at replies: the policy is moving further from its starting point, though that alone doesn't show hacking.

      ### What to look for in the replies

      The curves tell us where to look. Reading replies can uncover failures even without a separate rating. Here are some patterns to look for.

      - **Longer replies.** If the average length grows, check whether the extra words add anything useful.
      - **Repetition.** The same phrase or list comes back again and again.
      - **Sycophancy.** The reply agrees with the user or flatters them instead of being correct, such as agreeing that the Sun goes round the Earth because the user said so. People often rate agreeable replies highly, so a reward model can learn to like this.
      - **Code that special-cases its tests.** Hand-written rewards get hacked too, and the same checks apply. Some models are trained to write programs. Each test runs the program on one input and checks its answer, and the reward is how many tests pass. The policy can learn to spot the test inputs and return the expected answers.

      Here is code like that. It passes the tests for `add(2, 3)` and `add(10, -4)`. It returns 0 for every other input, getting cases like `add(1, 1)` wrong.

      ```python
      def add(a, b):
          if (a, b) == (2, 3):
              return 5
          if (a, b) == (10, -4):
              return 6
          return 0

      print(add(2, 3), add(10, -4))
      print(add(1, 1))
      # 5 6
      # 0
      ```

      A hard question can need a long answer. Growing length is a warning when ratings stop improving, but even a flat or rising average can hide failures on individual replies.
    worked: |
      Let's check a run for reward hacking. This time a stronger judge does the rating. We recorded the reward model's average score, the average reply length, and a stronger judge's rating out of 10 for each checkpoint's replies to held-out prompts.

      | step | score | length (words) | rating |
      | --- | --- | --- | --- |
      | $0$ | $0$ | $120$ | $6.0$ |
      | $200$ | $1.5$ | $150$ | $7.0$ |
      | $400$ | $2.5$ | $300$ | $6.5$ |
      | $600$ | $3.2$ | $450$ | $5.5$ |

      1. **Check the score.** It rises at every checkpoint, from $0$ to $3.2$. That shows gains on the proxy.

      2. **Check the judge's rating.** It rises to $7.0$ at step 200, then falls to $5.5$ by step 600, a drop of $1.5$.
         $$7.0-5.5=1.5.$$

      3. **Check the length.** Up to step 200, length grew a little while the rating rose. From step 200 to step 600, replies get three times as long while the rating falls.
         $$450\div150=3.$$

      4. **Read a reply.** A step 600 reply to "What is 15% of 40?" reads: "Great question! To find 15% of 40, we find 15% of 40. Finding 15% of 40 means finding 15% of 40, which is 6. So 15% of 40 is 6." The answer is right, but the repeated sentences add nothing.

      The diverging curves and the repetition are consistent with reward hacking. Step 200 has the best held-out rating of these four. To test whether the reward model favours repetition, we could score several such replies with and without the repeated text.
    problems:
      - rh-signs-basics
      - rh3-worked-self-explain
      - rh3-kl-estimate-template
      - rh3-sycophancy
      - rh3-which-run
      - rh3-special-case-code
      - rh3-summaries
  - id: rh-defences
    title: "Keep reward hacking in check"
    tldr: |
      - The KL penalty makes it costly for the policy to move far from the SFT model.
      - We can stop when held-out ratings stop improving and restore the best checkpoint we saw.
      - We improve the reward model with new comparisons or average several reward models, and we keep reading replies.
    explain: |
      ### The KL penalty

      The KL-penalised reward subtracts $\beta$ times each reply's log ratio. Think of a reply that repeats a phrase twenty times. If the policy makes it much more likely than the reference does, the log ratio is large and positive, so the subtraction is large. A reply equally unlikely under both has a log ratio of zero. The mean log ratio over replies drawn from the policy is its KL from the reference on that prompt.

      A larger $\beta$ makes drift more costly and can limit useful changes as well as harmful ones. The penalty reduces the risk of hacking. A reply that the reward model overrates by enough can still come out on top.

      ### When to stop and which checkpoint to keep

      We save checkpoints and rate each on held-out prompts. With **early stopping**, we can stop once the rating hasn't improved for a chosen number of checks, then restore the best checkpoint observed. With two checks without improvement in the example, we'd stop at step 500 and restore step 300. The rating estimates quality, and those prompts now serve to select the checkpoint. For a final test, use a fresh set.

      ### Fixing the reward model

      We can also make the proxy better. One way is to have people compare the policy's current replies, including the ones that look hacked, and retrain the reward model on them. Then we carry on training the policy against the new reward model.

      Another way is a **reward model ensemble**. We train several reward models, for example from different random starting weights, and use the average of their scores. If they make different errors, one model's mistake can count for less in the average. If they all share a preference for padding, adding more models that share it won't remove it.

      None of these replace reading replies. A few minutes reading samples from each checkpoint can catch padding, flattery or special-cased tests that a single number hides.
    worked: |
      Let's see two defences at work on replies B and C to "Explain why the sky is blue." B is clear and C is long and repetitive. Three reward models score them, and we'll also use the KL penalty with $\beta=0.1$. Each log ratio is the reply's log-probability under the current policy minus its log-probability under the reference model.

      |  | reply B | reply C |
      | --- | --- | --- |
      | model 1's score | $4.5$ | $5$ |
      | model 2's score | $4$ | $2$ |
      | model 3's score | $3.5$ | $2$ |
      | log ratio | $2$ | $12$ |

      1. **Use model 1 alone.** It gives C the higher score, so it prefers C.
         $$5>4.5.$$

      2. **Average the three models.** Only model 1 overrates C, so averaging brings C's score down.
         $$\begin{aligned}\text{B}&:\tfrac{4.5+4+3.5}{3}=4,\\\text{C}&:\tfrac{5+2+2}{3}=3.\end{aligned}$$

      3. **Apply the KL penalty to model 1's scores.** We use model 1 alone to see what the penalty does by itself. Subtract $\beta$ times each log ratio.
         $$\begin{aligned}\text{B}&:4.5-0.1\times2=4.3,\\\text{C}&:5-0.1\times12=3.8.\end{aligned}$$

      Both the ensemble and the penalty now prefer B. The ensemble works because only one model overrates C, and the penalty works because the policy makes C much more likely relative to the reference.
    problems:
      - rh-defences-basics
      - rh4-worked-self-explain
      - rh4-penalty-template
      - rh4-which-checkpoint
      - rh4-huge-beta
      - rh4-shared-error
      - rh4-code-tests
final: rh-explain-hacking
summary: |
  - A proxy reward stands in for a goal we can't measure directly. Choosing the highest score can favour a reply the proxy overrates.
  - Reward over-optimisation means pushing a proxy until further proxy gains come at the expense of true quality.
  - A rising score and falling held-out ratings are a warning sign. Read replies for padding, repetition, sycophancy or code that special-cases its tests.
  - The KL penalty makes drift costly. Early stopping limits training and restores the best checkpoint observed. A better reward model or ensemble can help, and reading samples can catch failures the scores miss.

  **Next:** Evaluating LLMs looks at how to measure a model's quality, from fixed sets of test tasks to using a language model as a judge and checking its biases.
