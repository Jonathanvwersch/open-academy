final: mha-explain-layer
summary: |
  - Multi-head attention runs $h$ attention heads side by side. Each head has its own $d\times d_k$ query, key and value matrices, with $d_k=d/h$, so each token gets its own set of weights from every head.
  - Each head scores with $s^{(i)}_{tj}=q^{(i)}_t\cdot k^{(i)}_j/\sqrt{d_k}$, turns the scores into weights with a softmax and averages its values, giving every token an output of width $d_k$.
  - The head outputs are concatenated back to width $d$ and multiplied by a $d\times d$ output matrix: $o_t=\operatorname{concat}(o^{(1)}_t,\dots,o^{(h)}_t)\,W_O$, so each output entry can use every head.
  - For $T$ tokens the shapes run $X:T\times d$, then $T\times d_k$ queries, keys and values and $T\times T$ weights in each head, then $T\times d$ out. The layer learns $4d^2$ numbers whatever $h$ is.

  **Next:** The positional representations lesson shows why attention can't tell the order of the tokens on its own, and how models add position to the embeddings.
