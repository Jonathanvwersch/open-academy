concept: multi-head-attention
version: 1
objective: |
  **Goal:** compute multi-head attention for a short sentence and track the shape of every matrix in it, from the $T\times d$ embeddings through each head's $T\times d_k$ queries, keys and values and $T\times T$ weights, back to a $T\times d$ output.
recap:
  - concept: attention
    text: "Learned matrices $W_Q$, $W_K$ and $W_V$ turn each embedding $e_t$ into a query $q_t$, key $k_t$ and value $v_t$. Scores $q_t\\cdot k_j/\\sqrt{d_k}$ become softmax weights that mix the values."
  - concept: embeddings
    text: "Each token starts as a learned embedding $e_t$ of width $d$."
where_this_fits: |
  ### What is multi-head attention?

  Multi-head attention runs several attention calculations, called **heads**, side by side on the same tokens and joins their results into one output per token.

  In "the cat sat", "sat" needs both "cat" and its own meaning. One head splitting its attention weights between them blurs both values. Two heads can each favour one.
knowledge_points:
  - id: mha-heads
    title: "Run attention heads side by side"
    explain: |
      ### Two heads reading "the cat sat"

      Each of several **heads** does ordinary attention with its own query, key and value matrices. We write a superscript $(i)$ on everything that belongs to head $i$.

      Take the sentence "the cat sat", with whole words as tokens, and number the tokens 1, 2 and 3. Each embedding $e_t$ has width $d=4$, and we use $h=2$ heads. Each head's three matrices are $4\times2$, so they turn a 4-entry embedding into a query, key and value with $d_k=2$ entries each.

      We skip the matrices and give only their results, chosen as small whole numbers. For "sat", head 1's query matrix gives $q^{(1)}_3=(1,1)$, head 2's gives $q^{(2)}_3=(2,0)$, and the key and value matrices give:

      | token | head 1 key | head 1 value |
      | --- | --- | --- |
      | the | $(1,-1)$ | $(1,0)$ |
      | cat | $(1,1)$ | $(0,2)$ |
      | sat | $(-1,1)$ | $(1,0)$ |

      | token | head 2 key | head 2 value |
      | --- | --- | --- |
      | the | $(0,1)$ | $(0,1)$ |
      | cat | $(0,2)$ | $(1,0)$ |
      | sat | $(1,0)$ | $(3,1)$ |

      Head 1's query for "sat" matches the key of "cat" best, and head 2's matches "sat" itself. Head 1 puts $0.67$ of its weight on "cat" (blue), and head 2 puts $0.67$ on "sat" (orange). The bars show weights rounded to 2 decimals, which is why they add up to $0.99$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" aria-label="Two bar charts of the attention weights that the token sat gives to the, cat and sat. In head 1, in blue, the weights are 0.16, 0.67 and 0.16, so most weight goes to cat. In head 2, in orange, they are 0.16, 0.16 and 0.67, so most weight goes to sat itself">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="160" y="28" text-anchor="middle">head 1: weights from “sat”</text>
      <path d="M30 210 H290" stroke="#d4d4d4"/>
      <rect x="55" y="177.28" width="50" height="32.72" fill="#3b82f6" fill-opacity="0.8"/>
      <text x="80" y="169.28" text-anchor="middle">0.16</text>
      <text x="80" y="232" text-anchor="middle" fill="#737373">the</text>
      <rect x="135" y="75.43" width="50" height="134.57" fill="#3b82f6" fill-opacity="0.8"/>
      <text x="160" y="67.43" text-anchor="middle">0.67</text>
      <text x="160" y="232" text-anchor="middle" fill="#737373">cat</text>
      <rect x="215" y="177.28" width="50" height="32.72" fill="#3b82f6" fill-opacity="0.8"/>
      <text x="240" y="169.28" text-anchor="middle">0.16</text>
      <text x="240" y="232" text-anchor="middle" fill="#737373">sat</text>
      <text x="480" y="28" text-anchor="middle">head 2: weights from “sat”</text>
      <path d="M350 210 H610" stroke="#d4d4d4"/>
      <rect x="375" y="177.28" width="50" height="32.72" fill="#f59e0b" fill-opacity="0.8"/>
      <text x="400" y="169.28" text-anchor="middle">0.16</text>
      <text x="400" y="232" text-anchor="middle" fill="#737373">the</text>
      <rect x="455" y="177.28" width="50" height="32.72" fill="#f59e0b" fill-opacity="0.8"/>
      <text x="480" y="169.28" text-anchor="middle">0.16</text>
      <text x="480" y="232" text-anchor="middle" fill="#737373">cat</text>
      <rect x="535" y="75.43" width="50" height="134.57" fill="#f59e0b" fill-opacity="0.8"/>
      <text x="560" y="67.43" text-anchor="middle">0.67</text>
      <text x="560" y="232" text-anchor="middle" fill="#737373">sat</text>
      </g>
      </svg>
      ```

      ### What each head computes

      With $h$ heads, head $i$ has its own matrices $W_Q^{(i)}$, $W_K^{(i)}$ and $W_V^{(i)}$, each of shape $d\times d_k$ with $d_k=d/h$, so that the heads together come back to width $d$. Token $t$ scores its query against the key of every token $j$:

      $$s^{(i)}_{tj}=\frac{q^{(i)}_t\cdot k^{(i)}_j}{\sqrt{d_k}}$$

      A softmax over $j$ turns the scores into weights, and the weights average the values. Here $e\approx2.718$. In the bottom sum, $m$ runs over all the tokens, like $j$.

      $$o^{(i)}_t=\sum_j a^{(i)}_{tj}\,v^{(i)}_j,\qquad a^{(i)}_{tj}=\frac{e^{s^{(i)}_{tj}}}{\sum_m e^{s^{(i)}_{tm}}}$$

      Since $d_k<d$, it is tempting to picture each head reading only $d_k$ entries of the embedding. In fact every head's matrices multiply all $d$ entries of $e_t$. Only the query, key and value that come out have $d_k$ entries.
    worked: |
      Let's work out what each head gives "sat", using the queries, keys and values above. We keep every digit while calculating and show 3 decimals along the way, then round the outputs to 2 decimals at the end.

      1. **Score head 1's query against every key.** Dotting $q^{(1)}_3=(1,1)$ with the keys $(1,-1)$, $(1,1)$ and $(-1,1)$ of "the", "cat" and "sat" gives $0$, $2$ and $0$. We divide each by $\sqrt{d_k}=\sqrt2\approx1.414$. Here $s^{(1)}_{3j}$ is head 1's score of token 3's query against token $j$'s key.
         $$s^{(1)}_{31}=0,\qquad s^{(1)}_{32}=\frac{2}{\sqrt2}=1.414,\qquad s^{(1)}_{33}=0$$

      2. **Turn head 1's scores into weights.** Softmax raises the number $e\approx2.718$ to each score, giving $e^0=1$, $e^{1.414}=4.113$ and $e^0=1$, and divides each by their total, $6.113$.
         $$a^{(1)}_{31}=a^{(1)}_{33}=\frac{1}{6.113}=0.164,\qquad a^{(1)}_{32}=\frac{4.113}{6.113}=0.673$$

      3. **Average head 1's values.** Each value is scaled by its weight and the results are added.
         $$o^{(1)}_3=0.164\,(1,0)+0.673\,(0,2)+0.164\,(1,0)=(0.33,\,1.35)$$

      4. **Do the same in head 2.** Its query $(2,0)$ dotted with the keys $(0,1)$, $(0,2)$ and $(1,0)$ gives $0$, $0$ and $2$. Dividing by $\sqrt2$ gives the scores $0$, $0$ and $1.414$, so the softmax gives $0.164$, $0.164$ and $0.673$, with the large weight now on "sat".
         $$o^{(2)}_3=0.164\,(0,1)+0.164\,(1,0)+0.673\,(3,1)=(2.18,\,0.84)$$

      So "sat" now has two outputs of width 2. Head 1's $(0.33,1.35)$ is pulled toward the value of "cat", $(0,2)$, and head 2's $(2.18,0.84)$ is pulled toward the value of "sat" itself, $(3,1)$. Head 1 mixed the value of "cat", the word that did the sitting, into the output for "sat", and head 2 kept mostly the value of "sat" itself.
    problems:
      - mha-heads-basics
      - mhap-heads-self-explain
      - mhap-head-width-template
      - mhap-query-entry
      - mhap-head-score-template
      - mhap-whole-embedding
      - mhap-two-key-output
      - mhap-robot-heads
  - id: mha-combine
    title: "Join the heads into one output"
    explain: |
      ### Two outputs for one token

      Each head has now given every token an output of width $d_k$. In the sentence "the cat sat", with embeddings of width $d=4$ and two heads of width $d_k=2$, the token "sat" got $(0.33,1.35)$ from head 1 and $(2.18,0.84)$ from head 2.

      A model stacks several attention layers, one after another, and each layer takes in one vector of width $d$ per token, the way the first one takes in the embeddings. So the last part of multi-head attention, the layer built from these heads, joins the heads' outputs into one vector of width $d$, ready for the next layer.

      ### Write the outputs side by side, then mix them

      First we **concatenate** the head outputs, which means writing them one after another in a single vector. Two outputs of width 2 make $(0.33,1.35,2.18,0.84)$, of width 4. Since each head has width $d_k=d/h$, putting $h$ of them side by side always gives back width $d$.

      In that vector, the first two entries come only from head 1 and the last two only from head 2. So we then multiply it by an **output matrix** $W_O$ of shape $d\times d$, learned along with the heads' matrices. Each entry of the result is the dot product of the whole concatenated vector with one column of $W_O$, so every entry can combine what all the heads found.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="Joining the two head outputs for sat. Head 1 output (0.33, 1.35) in blue and head 2 output (2.18, 0.84) in orange are written side by side as (0.33, 1.35, 2.18, 0.84). Multiplying by W O gives the green output (2.51, 1.35, 3.53, 0.84), whose first and third entries use numbers from both heads">
      <defs><marker id="mha2-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="132" y="26" text-anchor="middle" fill="#3b82f6">head 1 output</text>
      <rect x="76" y="36" width="56" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="104.0" y="58" text-anchor="middle">0.33</text>
      <rect x="132" y="36" width="56" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="160.0" y="58" text-anchor="middle">1.35</text>
      <text x="508" y="26" text-anchor="middle" fill="#f59e0b">head 2 output</text>
      <rect x="452" y="36" width="56" height="34" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="480.0" y="58" text-anchor="middle">2.18</text>
