      <text x="332" y="198">multiply by W<tspan font-size="13" dy="4">O</tspan></text>
      <rect x="208" y="224" width="56" height="34" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <text x="236.0" y="246" text-anchor="middle">2.51</text>
      <rect x="264" y="224" width="56" height="34" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <text x="292.0" y="246" text-anchor="middle">1.35</text>
      <rect x="320" y="224" width="56" height="34" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <text x="348.0" y="246" text-anchor="middle">3.53</text>
      <rect x="376" y="224" width="56" height="34" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
      <text x="404.0" y="246" text-anchor="middle">0.84</text>
      <text x="200" y="246" text-anchor="end" fill="#737373">output for sat</text>
      <text x="320" y="286" text-anchor="middle" fill="#10b981">entries 1 and 3 mix both heads</text>
      </g>
      </svg>
      ```

      ### The whole layer

      Putting the steps together, **multi-head attention** gives token $t$ the output

      $$o_t=\operatorname{concat}\big(o^{(1)}_t,\,o^{(2)}_t,\,\dots,\,o^{(h)}_t\big)\,W_O$$

      Here $o^{(i)}_t$ is head $i$'s output for token $t$, and $\operatorname{concat}$ writes its inputs side by side. We treat the concatenated vector as a row, a $1\times d$ matrix. Multiplying it by the $d\times d$ matrix $W_O$ gives $o_t$ of width $d$.

      Be careful not to add or average the head outputs instead. Averaging $(0.33,1.35)$ and $(2.18,0.84)$ gives width 2, which is too narrow, and it mixes every entry the same way. $W_O$ is learned, so each entry gets its own mix of the heads.
    worked: |
      Let's finish the output for "sat" in "the cat sat", starting from its two head outputs, $(0.33,1.35)$ from head 1 and $(2.18,0.84)$ from head 2, both rounded to 2 decimals. The output matrix is

      $$W_O=\begin{bmatrix}1&0&0&0\\0&1&1&0\\1&0&1&0\\0&0&0&1\end{bmatrix}$$

      1. **Concatenate the head outputs.** Head 1's output goes first, then head 2's. The order is always the same, so entries 1 and 2 of $c$, from head 1, always multiply rows 1 and 2 of $W_O$.
         $$c=(0.33,\,1.35,\,2.18,\,0.84)$$

      2. **Dot $c$ with column 1 of $W_O$.** Column 1 is $(1,0,1,0)$, so the entries times 0 drop out, and it adds entry 1, from head 1, to entry 3, from head 2.
         $$0.33\times1+2.18\times1=2.51$$

      3. **Dot $c$ with columns 2, 3 and 4.** Column 2 is $(0,1,0,0)$, so it keeps entry 2, $1.35$. Column 3 is $(0,1,1,0)$, so it adds entries 2 and 3. Column 4 is $(0,0,0,1)$, so it keeps entry 4, $0.84$.
         $$1.35+2.18=3.53$$

      4. **Write the four results in order.** They are the entries of the output for "sat".
         $$o_3=(2.51,\,1.35,\,3.53,\,0.84)$$

      The output has width 4, the same as the embedding $e_3$, and its first and third entries each mix one number from head 1 with one from head 2. We chose 0s and 1s in $W_O$ to keep the arithmetic easy. In a real model $W_O$ is learned along with the heads' matrices, so its entries are whatever numbers make the model's predictions best.
    problems:
      - mha-combine-basics
      - mhap-combine-self-explain
      - mhap-concat-width-template
      - mhap-output-entry-template
      - mhap-average-heads
      - mhap-output-matrix-size
      - mhap-joint-readings
  - id: mha-shapes
    title: "Follow the shapes for a whole sentence"
    explain: |
      ### All tokens at once

      In code, a model works out every token's output at once with matrix products, and tracking each matrix's shape is the quickest way to check such code.

      We stack the $T$ embeddings as the rows of a $T\times d$ matrix $X$. For head $i$, the queries are $Q^{(i)}=XW_Q^{(i)}$, a $(T\times d)(d\times d_k)=T\times d_k$ matrix whose row $t$ is $q^{(i)}_t$. The keys $K^{(i)}$ and values $V^{(i)}$ are made the same way.

      The scores are $Q^{(i)}K^{(i)\top}/\sqrt{d_k}$. Here $K^{(i)\top}$ is $K^{(i)}$ transposed, with its rows turned into columns, so it is $d_k\times T$. The product $(T\times d_k)(d_k\times T)$ is $T\times T$, and row $t$ holds token $t$'s scores against every token. A softmax along each row gives the $T\times T$ weights, and multiplying them by $V^{(i)}$, which is $T\times d_k$, gives head $i$'s $T\times d_k$ output. The $h$ outputs side by side make $T\times d$, and $W_O$ keeps it $T\times d$. The picture uses $T=3$, $d=4$ and $h=2$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" aria-label="Shapes through multi-head attention for 3 tokens, width 4 and 2 heads. The embeddings X are 3 by 4. Each head, head 1 in blue and head 2 in orange, makes queries, keys and values of shape 3 by 2, then weights of shape 3 by 3, then a head output of shape 3 by 2. The two head outputs are concatenated into 3 by 4, and multiplying by W O, which is 4 by 4, gives the green output of shape 3 by 4">
      <defs><marker id="mha3-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
