      <text x="536.0" y="58" text-anchor="middle">0.84</text>
      <path d="M132 72 L262 124" stroke="#737373" stroke-width="1.5" marker-end="url(#mha2-m)"/>
      <path d="M508 72 L378 124" stroke="#737373" stroke-width="1.5" marker-end="url(#mha2-m)"/>
      <rect x="208" y="130" width="56" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
