      ### One big matrix for all the heads

      Putting the $h$ query matrices side by side gives one $d\times d$ matrix, also named $W_Q$ as with one head. Then $XW_Q$ is $T\times d$, and its first $d_k$ columns are head 1's queries, the next $d_k$ are head 2's, and so on. Each column still uses all $d$ entries of the embedding. Code computes this one product, cuts it into heads, and does the same for $W_K$ and $W_V$.

      The layer learns four $d\times d$ matrices, $W_Q$, $W_K$, $W_V$ and $W_O$, which is $4d^2$ numbers whatever $h$ is, so more heads add no learned numbers. With $d=4$, one head of width 4, two of width 2 and four of width 1 all learn $4\times4^2=64$ numbers. The base model in "Attention Is All You Need" (2017), the paper that introduced multi-head attention, used $d=512$ and $h=8$, so each head had $d_k=64$.

      ### What more heads cost

      More heads give more sets of attention weights, but each head is narrower. A head of width 1 turns each token into a single number, so its scores can compare tokens on only that one number. Each head also has its own $T\times T$ attention weights, so there are $h\times T\times T$ to compute and store, which grows quickly for long inputs.
    worked: |
      Let's track the shapes for "the cat sat", with $T=3$ tokens, embeddings of width $d=4$ and $h=2$ heads of width $d_k=2$, and then check them in code.

      1. **Stack the embeddings.** One row per token, one column per embedding entry.
         $$X:\ 3\times4$$

      2. **Make all the queries in one product.** $W_Q$ is head 1's and head 2's $4\times2$ query matrices side by side, so it is $4\times4$.
         $$XW_Q:\ (3\times4)(4\times4)=3\times4$$

      3. **Cut it into heads.** Columns 1–2 are head 1's queries and columns 3–4 are head 2's. Keys and values are cut the same way.
         $$Q^{(1)},\,Q^{(2)}:\ 3\times2\ \text{each}$$

      4. **Score every pair of tokens in each head.** A $3\times2$ matrix times a $2\times3$ one is $3\times3$, one row per token. Dividing by $\sqrt{d_k}$ and the softmax keep this shape.
         $$Q^{(i)}K^{(i)\top}:\ (3\times2)(2\times3)=3\times3$$

      5. **Average the values in each head.** The $3\times3$ weights $A^{(i)}$ times the $3\times2$ values $V^{(i)}$ give $3\times2$.
         $$A^{(i)}V^{(i)}:\ (3\times3)(3\times2)=3\times2$$

      6. **Join and mix the heads.** Two $3\times2$ outputs side by side make $3\times4$, and $W_O$ keeps it that way.
         $$(3\times4)(4\times4)=3\times4$$

      Here is the same layer in NumPy, with random matrices because only the shapes matter. NumPy arrays can have more than two axes, numbered from 0, and an array of shape `(2, 3, 2)` is a stack of two $3\times2$ matrices, one per head.

      ```python
      import numpy as np
      T, d, h = 3, 4, 2
      dk = d // h
      rng = np.random.default_rng(0)
      X = rng.normal(size=(T, d))
      W_Q, W_K, W_V, W_O = rng.normal(size=(4, d, d))
      Q = (X @ W_Q).reshape(T, h, dk).transpose(1, 0, 2)
      K = (X @ W_K).reshape(T, h, dk).transpose(1, 0, 2)
      V = (X @ W_V).reshape(T, h, dk).transpose(1, 0, 2)
      S = Q @ K.transpose(0, 2, 1) / np.sqrt(dk)
      A = np.exp(S) / np.exp(S).sum(axis=-1, keepdims=True)
      heads = A @ V
      out = heads.transpose(1, 0, 2).reshape(T, d) @ W_O
      print(Q.shape, A.shape, heads.shape, out.shape)
      # prints (2, 3, 2) (2, 3, 3) (2, 3, 2) (3, 4)
      ```

      - `default_rng(0)` makes a random number generator, and the 0 makes every run give the same numbers. `rng.normal(size=(4, d, d))` makes four random $d\times d$ matrices, unpacked into `W_Q`, `W_K`, `W_V` and `W_O`.
      - `reshape(T, h, dk)` cuts each row of width 4 into 2 pieces of width 2, giving shape `(3, 2, 2)`. `transpose(1, 0, 2)` moves axis 1, the head, to the front, giving `(2, 3, 2)`.
      - On stacks like these, `@` multiplies the matrices of each head separately. `K.transpose(0, 2, 1)` keeps axis 0, the head, and swaps axes 1 and 2, so it transposes each head's keys.
      - `axis=-1` means the last axis, so each sum runs along a row. `keepdims=True` keeps the sums in shape `(2, 3, 1)`, so each row of `np.exp(S)` is divided by its own sum.
      - The line before `print` joins the heads. `transpose(1, 0, 2)` turns `(2, 3, 2)` back into `(3, 2, 2)`, `reshape(T, d)` writes each token's two head outputs side by side as a row of width 4, and `@ W_O` mixes them.

      Each head's queries are $3\times2$, its weights $3\times3$ and its output $3\times2$, and the layer's output is $3\times4$, the same shape as $X$.
