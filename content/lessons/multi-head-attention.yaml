      <rect x="220.0" y="410" width="200" height="46" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.5"/>
      <text x="320" y="429" text-anchor="middle">output</text>
      <text x="320" y="447" text-anchor="middle" fill="#737373">3 × 4</text>
