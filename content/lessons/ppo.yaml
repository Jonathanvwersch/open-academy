concept: ppo
version: 1
objective: |
  **Goal:** explain what PPO's clipping prevents, by estimating advantages with a critic, comparing new and old action probabilities with a ratio, and seeing how the clipped objective caps how far one batch can move the policy.
recap:
  - concept: policy-gradients
    text: "A policy-gradient update adjusts policy parameters using return $G_t$ minus baseline $b$, scaled by learning rate $\\eta$ and the policy's log-probability gradient. This makes actions with above-baseline returns more likely."
  - concept: value-functions
    text: "State value $V^\\pi(s)$ is the expected return from $s$ while following policy $\\pi$. Action value $Q^\\pi(s,a)$ is the expected return after first taking $a$ and then following $\\pi$."
where_this_fits: |
  ### What is PPO?

  PPO (proximal policy optimization) trains a policy. It makes actions that did better than usual more likely, and limits how far one batch of experience can move the policy. Proximal means near. Experience is slow to collect, so we want several updates per batch, and the limit stops them wrecking the policy. PPO is standard in robotics and in RLHF for language models.

knowledge_points:
  - id: ppo-advantage
    title: "Score each action by how much better it did than usual"
    explain: |
      ### A corridor robot

      Our robot lives in a corridor of 4 cells, numbered 1 to 4 from the left. It starts in cell 1 and moves left or right. If it moves into a wall, it stays where it is. Reaching cell 4 ends the episode with reward $+10$, and every other step gives $-1$. We use $\gamma=0.9$.

      PPO also trains a second model, the **critic**, to predict returns. We write its estimates as $V(s)$, without the $\pi$. Say they are $V(1)=5$, $V(2)=7$ and $V(3)=9$. The critic is still learning, so these are rough guesses. Nothing happens after cell 4, so its value is $0$.

      ### Better or worse than usual

      The **advantage** of an action says how much more return we expect from taking it than from acting as usual:

      $$A(s,a)=Q(s,a)-V(s).$$

      After one step, we can estimate $Q$ as the reward plus the discounted value of where we landed. The hat in $\hat A_t$ marks an estimate. This advantage estimate is also called the TD (temporal-difference) error $\delta_t$, because it compares value estimates one step apart. The reward for the action at step $t$ arrives one step later, so it's written $r_{t+1}$.

      $$\hat A_t=\delta_t=r_{t+1}+\gamma V(s_{t+1})-V(s_t).$$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" aria-label="Four cells in a row, numbered 1 to 4, with the critic's values 5, 7, 9 and 0 written above them. Cell 4 is the goal with reward plus 10. From cell 2, a green arrow to the right, into cell 3, is labelled delta equals 0.1. A red arrow to the left, into cell 1, is labelled delta equals minus 3.5">
      <defs>
      <marker id="ppo1-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker>
      <marker id="ppo1-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker>
      </defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" text-anchor="middle" fill="#171717">
      <text x="110" y="62">V = 5</text>
      <text x="250" y="62">V = 7</text>
      <text x="390" y="62">V = 9</text>
      <text x="530" y="62">V = 0</text>
      <rect x="40" y="80" width="140" height="70" fill="#ffffff" stroke="#737373" stroke-width="2"/>
      <rect x="180" y="80" width="140" height="70" fill="#ffffff" stroke="#737373" stroke-width="2"/>
      <rect x="320" y="80" width="140" height="70" fill="#ffffff" stroke="#737373" stroke-width="2"/>
      <rect x="460" y="80" width="140" height="70" fill="#f59e0b" fill-opacity="0.15" stroke="#737373" stroke-width="2"/>
      <text x="110" y="121">cell 1</text>
      <text x="250" y="121">cell 2</text>
      <text x="390" y="121">cell 3</text>
      <text x="530" y="113">cell 4</text>
      <text x="530" y="135" font-size="14">goal, +10</text>
      <circle cx="250" cy="180" r="5" fill="#171717"/>
      <line x1="256" y1="180" x2="378" y2="180" stroke="#10b981" stroke-width="3" marker-end="url(#ppo1-green)"/>
      <text x="320" y="210" fill="#10b981">right: δ = 0.1</text>
      <line x1="244" y1="180" x2="122" y2="180" stroke="#ef4444" stroke-width="3" marker-end="url(#ppo1-red)"/>
      <text x="180" y="210" fill="#ef4444">left: δ = −3.5</text>
      </g>
      </svg>
      ```

      PPO uses $\hat A_t$ in place of $G_t-b$. In the picture, right from cell 2 scores $0.1$ and left scores $-3.5$.

      Be careful: a positive advantage doesn't need a positive reward. Moving right from cell 2 earns $-1$, yet it's better than usual.
    worked: |
      Let's score both moves from cell 2 with the critic's values $V(1)=5$, $V(2)=7$, $V(3)=9$ and $\gamma=0.9$.

      1. **Move right.** The robot gets $-1$ and lands in cell 3.
         $$\delta=-1+0.9\times9-7=0.1.$$

      2. **Move left.** The robot gets $-1$ and lands in cell 1.
         $$\delta=-1+0.9\times5-7=-3.5.$$

      3. **Read the signs.** Moving right did slightly better than the critic expected from cell 2, so its advantage is positive. Moving left did much worse, so its advantage is negative.

      With only two actions, both scores push the policy towards moving right in cell 2, because lowering the chance of left raises the chance of right. If both moves are equally likely, the push from the left move is much stronger, because its score is much larger in size. Both moves earned the same reward of $-1$.
