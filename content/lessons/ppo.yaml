final: ppo-explain-clipping
summary: |
  - The advantage scores an action against the usual, $A(s,a)=Q(s,a)-V(s)$. A critic gives the one-step estimate $\hat A_t=\delta_t=r_{t+1}+\gamma V(s_{t+1})-V(s_t)$.
  - GAE adds up the one-step errors, weighting the error $k$ steps later by $(\gamma\lambda)^k$. $\lambda=0$ gives $\delta_t$, $\lambda=1$ gives $G_t-V(s_t)$, and values in between trade bias for variance.
  - The ratio $\rho_t(\theta)$ compares the new and old probability of each action, so one batch can be reused for several gradient steps on $\rho_t\hat A_t$.
  - PPO clips the ratio to $1\pm c$ and takes the minimum, so no sample gains from moving its action's probability far from the old policy. This stops a noisy batch from pushing the policy too far.
  - One round of PPO runs the policy to collect a batch, computes advantages with GAE and the critic, takes several passes of gradient ascent on $L^\text{CLIP}$ while training the critic on the returns, and then makes the new policy the old one.

  **Next:** The reward design lesson looks at choosing the rewards that PPO and other methods learn from.
