  - id: pg-log-trick
    title: "Estimate the slope by trying actions"
    explain: |
      ### One choice, then stop

      How can we get the slope from played episodes? Let's leave the corridor for a moment and take the simplest case, where the agent makes one choice and the episode ends. A slot machine has two arms. Arm A always pays $1$ and arm B always pays $3$, but the agent isn't told this. Its policy pulls B with probability $p=\pi_\theta(B)=e^\theta/(e^\theta+1)$ and A otherwise. The expected payout is each payout times its chance,

      $$J(\theta)=3\,\pi_\theta(B)+1\,\pi_\theta(A),$$

      so its slope is each payout times the slope of its probability:

      $$\nabla_\theta J=3\,\nabla_\theta\pi_\theta(B)+1\,\nabla_\theta\pi_\theta(A).$$

      We can't estimate this by pulling arms. Averaging what we see over many pulls estimates a sum whose terms are weighted by how often each arm is pulled. Here each term is weighted by the slope of a probability.

      ### The log-derivative trick

      The natural log $\ln x$ has slope $1/x$. So if a small change in $\theta$ moves $\pi$ by some amount, $\ln\pi$ moves by about that amount divided by $\pi$. That gives the **log-derivative trick**:

      $$\nabla_\theta\pi_\theta(a)=\pi_\theta(a)\,\nabla_\theta\ln\pi_\theta(a).$$

      Putting this into the slope gives

      $$\nabla_\theta J=3\,\pi_\theta(B)\,\nabla_\theta\ln\pi_\theta(B)+1\,\pi_\theta(A)\,\nabla_\theta\ln\pi_\theta(A).$$

      Now each term is weighted by its own probability, so this is an expected value:

      $$\nabla_\theta J=E\big[G\,\nabla_\theta\ln\pi_\theta(a)\big],$$

      where $a$ is the arm we pull and $G$ is its payout, the whole return of this one-step episode. One pull gives the estimate $G\,\nabla_\theta\ln\pi_\theta(a)$, and over many pulls these estimates average out to the true slope.

      ### Two pulls at θ = 0

      For our policy, $\nabla_\theta\ln\pi_\theta(B)=1-p$ and $\nabla_\theta\ln\pi_\theta(A)=-p$, as the worked example shows. At $\theta=0$, $p=0.5$, so:

      - pulling B gives the estimate $3\times0.5=1.5$;
      - pulling A gives $1\times(-0.5)=-0.5$.

      Each happens half the time, so the estimates average $0.5$. That's the slope we'd find from the payouts directly, since $J=3p+(1-p)=1+2p$, and $p$ has slope $p(1-p)$, so $J$ has slope $2\times0.5\times0.5=0.5$.

      Be careful not to trust a single pull. Pulling A gives $-0.5$, which says to lower $\theta$, even though raising it helps. Only the average of many estimates points the right way.
    worked: |
      Let's find $\nabla_\theta\ln\pi_\theta$ for both arms, with $p=e^\theta/(e^\theta+1)$, and then the two estimates at $\theta=0$.

      1. **Find the slope of $p$.** We use the quotient rule for the slope of a fraction, with $e^\theta$ on top and $e^\theta+1$ below.
         $$\nabla_\theta p=\frac{e^\theta(e^\theta+1)-e^\theta\,e^\theta}{(e^\theta+1)^2}=\frac{e^\theta}{(e^\theta+1)^2}.$$

      2. **Write it with $p$.** Splitting the fraction gives $p$ times $1/(e^\theta+1)$, which is $p$ times $1-p$, because the two fractions $e^\theta/(e^\theta+1)$ and $1/(e^\theta+1)$ add up to $1$.
         $$\nabla_\theta p=p\,(1-p).$$

      3. **Divide by the probability for arm B.** The trick, divided by $\pi$, says $\nabla_\theta\ln\pi=\nabla_\theta\pi/\pi$, and $\pi_\theta(B)=p$.
         $$\nabla_\theta\ln\pi_\theta(B)=\frac{p(1-p)}{p}=1-p.$$

      4. **Do the same for arm A.** Its probability $1-p$ has slope $-p(1-p)$, so we divide that by $1-p$.
         $$\nabla_\theta\ln\pi_\theta(A)=\frac{-p(1-p)}{1-p}=-p.$$

      5. **Average the two estimates at $\theta=0$.** Each arm is pulled with probability $0.5$, and each estimate is the payout times that arm's $\nabla_\theta\ln\pi_\theta$.
         $$0.5\times(3\times0.5)+0.5\times(1\times(-0.5))=0.5.$$

      The average of the estimates is $0.5$, the true slope, even though the agent never needed to know the payouts in advance.
