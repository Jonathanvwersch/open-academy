  - id: pg-baseline
    title: "Compare each return with a typical one"
    explain: |
      ### Noisy estimates

      REINFORCE's estimate is right on average, but one episode's estimate can be far off, so learning takes many episodes. It gets worse when every return is positive, as this example shows. Suppose the slot machine's arm A pays $11$ and arm B pays $13$, with the same policy as before, which pulls B with probability $p$. At $\theta=0$, pulling B gives $13\times0.5=6.5$ and pulling A gives $11\times(-0.5)=-5.5$. They still average $0.5$, but each estimate is more than ten times that, and they disagree about which way to move. We call this spread between estimates noise.

      ### Subtracting a baseline

      The fix is to compare each return with a typical return. A **baseline** $b$ is a number that doesn't depend on the action taken, and we subtract it from the return:

      $$\theta_{\text{new}}=\theta+\eta\,(G-b)\,\nabla_\theta\ln\pi_\theta(a).$$

      For whole episodes, $G_0-b$ multiplies the sum of slopes. With $b=12$, the average payout at $\theta=0$, pulling B gives $(13-12)\times0.5=0.5$ and pulling A gives $(11-12)\times(-0.5)=0.5$, so every pull now gives the true slope. Here the baseline removes the noise completely; usually it only shrinks it.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" aria-label="Bars of the one-pull slope estimates at theta 0 for arms paying 11 and 13. With no baseline, pulling B gives 6.5 and pulling A gives minus 5.5. With baseline 12, both give 0.5. A green dashed line marks the true slope 0.5">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M40 210 H620" stroke="#737373"/>
      <rect x="90" y="80" width="60" height="130" fill="#3b82f6"/><text x="120" y="70" text-anchor="middle">6.5</text>
      <rect x="190" y="210" width="60" height="110" fill="#3b82f6"/><text x="220" y="338" text-anchor="middle">−5.5</text>
      <rect x="390" y="200" width="60" height="10" fill="#3b82f6"/><text x="420" y="190" text-anchor="middle">0.5</text>
      <rect x="490" y="200" width="60" height="10" fill="#3b82f6"/><text x="520" y="190" text-anchor="middle">0.5</text>
      <path d="M40 200 H620" stroke="#10b981" stroke-width="2" stroke-dasharray="6 5"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="620" y="160" text-anchor="end" fill="#10b981">true slope 0.5</text>
      <text x="120" y="368" text-anchor="middle">pull B</text>
      <text x="220" y="368" text-anchor="middle">pull A</text>
      <text x="420" y="368" text-anchor="middle">pull B</text><text x="520" y="368" text-anchor="middle">pull A</text>
      <text x="170" y="30" text-anchor="middle">no baseline</text><text x="470" y="30" text-anchor="middle">baseline b = 12</text>
      </g>
      </svg>
      ```

      ### Why the average stays the same

      The part we subtracted averages to zero. Using the trick backwards, $\pi\,\nabla\ln\pi=\nabla\pi$, so

      $$E\big[b\,\nabla_\theta\ln\pi_\theta(a)\big]=b\sum_a\pi_\theta(a)\,\nabla_\theta\ln\pi_\theta(a)=b\sum_a\nabla_\theta\pi_\theta(a)=0.$$

      The last sum is $0$ because the probabilities always add up to $1$, so their changes cancel. Any number that doesn't depend on the action keeps the average right. A baseline near the typical return, kept up to date as the policy learns, usually cuts the noise, and $G-b$ then says whether things went better or worse than usual. A badly chosen baseline can add noise.

      ### Limitations

      Even with a baseline, REINFORCE needs many episodes. Its average is over the episodes the current policy plays. So it only holds for episodes played with the current $\theta$, and after every update the old episodes are thrown away. And one step that's too big can wreck a good policy, for example by making the robot almost never move right.
    worked: |
      Let's compare a good baseline and a bad one on the slot machine, where arm A pays $11$, arm B pays $13$ and $\theta=0$, so the policy pulls B with probability $p=0.5$.

      1. **Find each arm's slope.** For arm B, $\nabla_\theta\ln\pi_\theta(B)=1-p$, and for arm A it is $-p$.
         $$\nabla_\theta\ln\pi_\theta(B)=0.5,\qquad\nabla_\theta\ln\pi_\theta(A)=-0.5.$$

      2. **Use the baseline $b=10$.** This is close to the typical payout of $12$, and each estimate is $(G-b)$ times the arm's slope.
         $$\text{B: }(13-10)\times0.5=1.5,\qquad\text{A: }(11-10)\times(-0.5)=-0.5.$$

      3. **Use the baseline $b=30$.** This is far above both payouts.
         $$\text{B: }(13-30)\times0.5=-8.5,\qquad\text{A: }(11-30)\times(-0.5)=9.5.$$

      4. **Check the averages.** Each arm is pulled half the time, so we average each pair of estimates.
         $$0.5\times1.5+0.5\times(-0.5)=0.5,\qquad0.5\times(-8.5)+0.5\times9.5=0.5.$$

      Both baselines keep the average at the true slope $0.5$. Without a baseline the two estimates are $6.5$ and $-5.5$, which are $12$ apart. With $b=10$ they are only $2$ apart, so the noise shrinks a lot. With $b=30$ they are $18$ apart, so this badly chosen baseline adds noise.
