  - id: pg-reinforce
    title: "Learn from whole episodes"
    explain: |
      ### From one choice to an episode

      In the corridor, the robot makes several choices before the episode ends. We'll use the same trick on whole episodes. We write an episode as $\tau$ (tau), the list of states and actions it went through, $s_0,a_0,s_1,a_1,\dots$. The episode's probability multiplies the policy's chance of each action by the world's chance of each move:

      $$P(\tau)=\pi_\theta(a_0\mid s_0)\,p(s_1\mid s_0,a_0)\,\pi_\theta(a_1\mid s_1)\,p(s_2\mid s_1,a_1)\cdots$$

      Here $p(s'\mid s,a)$ is the probability that action $a$ in state $s$ leads to state $s'$. This $p$ belongs to the world and is a different thing from the policy's chance $p$ of moving right. In our corridor it is always $1$ or $0$, because moves always succeed.

      ### The world drops out

      Taking $\ln$ turns this product into a sum, since $\ln(xy)=\ln x+\ln y$. The world's terms don't depend on $\theta$, so their slopes are $0$, and only the policy's terms are left:

      $$\nabla_\theta\ln P(\tau)=\sum_{t=0}^{T-1}\nabla_\theta\ln\pi_\theta(a_t\mid s_t).$$

      The episode ends at step $T$, so the last action is $a_{T-1}$. Now we repeat the slot-machine argument with episodes in place of arms. $J$ adds up each episode's $G_0$ times $P(\tau)$. The trick gives $\nabla_\theta P(\tau)=P(\tau)\,\nabla_\theta\ln P(\tau)$, so each term is again weighted by its probability, and

      $$\nabla_\theta J=E\Big[G_0\sum_{t=0}^{T-1}\nabla_\theta\ln\pi_\theta(a_t\mid s_t)\Big].$$

      So the robot never needs to know the world's rules. **REINFORCE**, published by Ronald Williams in 1992, plays one episode with $\pi_\theta$ and takes one gradient-ascent step with this estimate:

      $$\theta_{\text{new}}=\theta+\eta\,G_0\sum_{t=0}^{T-1}\nabla_\theta\ln\pi_\theta(a_t\mid s_t).$$

      ### What the update does

      Each action the robot took becomes more likely when $G_0$ is positive, and less likely when it's negative, by an amount scaled by the return. Every action in the episode is weighted by the same $G_0$, even though an action can't change the rewards that came before it. Over many episodes, those extra pushes cancel on average. The picture shows the episode right, right, right at $\theta=0$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" aria-label="The corridor of cells 1 to 4. The robot starts in cell 1 and moves right three times, with rewards minus 1, minus 1 and plus 10. Under each move, its log-probability slope is 0.5. The return is 6.2 and the sum of the slopes is 1.5">
      <defs><marker id="pg3-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="60" y="80" width="120" height="60" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="200" y="80" width="120" height="60" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="340" y="80" width="120" height="60" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="480" y="80" width="120" height="60" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <text x="120" y="115" text-anchor="middle">1, start</text><text x="260" y="115" text-anchor="middle">2</text><text x="400" y="115" text-anchor="middle">3</text><text x="540" y="115" text-anchor="middle" fill="#10b981">4, goal</text>
      <path d="M130 60 L250 60" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#pg3-amber)"/>
      <path d="M270 60 L390 60" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#pg3-amber)"/>
      <path d="M410 60 L530 60" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#pg3-amber)"/>
      <text x="190" y="45" text-anchor="middle">right, −1</text><text x="330" y="45" text-anchor="middle">right, −1</text><text x="470" y="45" text-anchor="middle">right, +10</text>
      <text x="190" y="170" text-anchor="middle" fill="#3b82f6">0.5</text><text x="330" y="170" text-anchor="middle" fill="#3b82f6">0.5</text><text x="470" y="170" text-anchor="middle" fill="#3b82f6">0.5</text>
      <text x="60" y="195" fill="#3b82f6">blue: slope of ln π for each move</text>
      <text x="60" y="220">return G₀ = 6.2, sum of slopes = 1.5</text>
      </g>
      </svg>
      ```

      Be careful with the sign. We want $J$ to rise, so the update adds the step. Subtracting it, as gradient descent does, would make good episodes less likely.
    worked: |
      Let's take one REINFORCE step from $\theta=0$ after the episode right, right, right, with a learning rate of $\eta=0.1$.

      1. **Find each action's slope.** At $\theta=0$ the policy moves right with probability $p=0.5$, and for a right move $\nabla_\theta\ln\pi_\theta=1-p$.
         $$\nabla_\theta\ln\pi_\theta(\text{right}\mid s)=1-0.5=0.5.$$

      2. **Add them up.** The episode has three right moves, so there are three equal terms.
         $$\sum_{t=0}^{2}\nabla_\theta\ln\pi_\theta(a_t\mid s_t)=0.5+0.5+0.5=1.5.$$

      3. **Find the return.** The rewards are $-1$, $-1$ and $+10$, discounted by $0.9$ per step.
         $$G_0=-1+0.9\times(-1)+0.81\times10=6.2.$$

      4. **Take the step.** We add $\eta$ times the return times the sum.
         $$\theta_{\text{new}}=0+0.1\times6.2\times1.5=0.93.$$

      5. **Check the new policy.** We put $\theta=0.93$ into the policy's formula and round to two decimal places.
         $$\pi_{0.93}(\text{right}\mid s)=\frac{e^{0.93}}{e^{0.93}+1}\approx0.72.$$

      After one good episode, the chance of moving right rose from $0.5$ to about $0.72$ in every cell.
