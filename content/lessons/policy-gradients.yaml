final: pg-explain-reinforce
summary: |
  - A policy gradient method gives the policy parameters $\theta$ and climbs its expected return $J(\theta)=E[G_0]$ by gradient ascent, $\theta_{\text{new}}=\theta+\eta\,\nabla_\theta J(\theta)$.
  - The log-derivative trick, $\nabla_\theta\pi_\theta(a)=\pi_\theta(a)\,\nabla_\theta\ln\pi_\theta(a)$, turns the slope into an average, $\nabla_\theta J=E[G\,\nabla_\theta\ln\pi_\theta(a)]$, which we can estimate from played episodes.
  - REINFORCE plays an episode and steps $\theta_{\text{new}}=\theta+\eta\,G_0\sum_t\nabla_\theta\ln\pi_\theta(a_t\mid s_t)$. The world's transition probabilities drop out, so the agent never needs to know them.
  - Subtracting a baseline $b$ from the return leaves the average estimate unchanged, because $E[\nabla_\theta\ln\pi_\theta(a)]=0$, and a baseline near the typical return usually makes each estimate less noisy.

  **Next:** The PPO lesson builds on these estimates and limits how far each update can move the policy, so one big step can't wreck it.
