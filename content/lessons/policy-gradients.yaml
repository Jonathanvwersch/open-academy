concept: policy-gradients
version: 1
objective: |
  **Goal:** derive the REINFORCE estimator, by using the log-derivative trick to turn the slope of a policy's expected return into an average over episodes, and use it with a baseline to improve a policy.
recap:
  - concept: gradient-descent
    text: "Gradient descent lowers a loss by stepping the parameters against its gradient again and again, $w_{\\text{new}}=w-\\eta\\,\\nabla L$, where $w$ holds the parameters. The learning rate $\\eta$ is a small positive number that sets the size of each step."
  - concept: policies-returns
    text: "A policy $\\pi(a\\mid s)$ gives the chance of action $a$ in state $s$. Return $G_t$ adds rewards from $r_{t+1}$ onward, weighting later rewards by discount factor $\\gamma$."
where_this_fits: |
  ### What is a policy gradient method?

  A policy gradient method improves a policy a little after each episode. The policy has adjustable numbers, its parameters $\theta$, and we nudge them so that actions that led to high returns become more likely.

  Why is this useful? Gradient descent needs a formula to take the slope of, but a policy's average return depends on a world whose rules the agent doesn't know. This lesson estimates that slope from played episodes. The method, REINFORCE, leads on to PPO, a method used to fine-tune chat models.
knowledge_points:
  - id: pg-score
    title: "Score a policy by its average return"
    explain: |
      ### A robot that picks a direction

      Let's set up the example we'll use. A robot sits in a corridor of 4 cells, numbered 1 to 4 from left to right, and starts in cell 1. Each step it moves left or right, and moving into a wall leaves it where it is. Every step gives reward $-1$, except the step that reaches cell 4, which gives $+10$ and ends the episode. We use $\gamma=0.9$.

      Our policy has one parameter, $\theta$. The policy ignores which cell the robot is in, and in every cell it moves right with probability

      $$p=\pi_\theta(\text{right}\mid s)=\frac{e^\theta}{e^\theta+1},$$

      and left otherwise. This is a common way to turn any number into a probability. At $\theta=0$ this is $0.5$, at $\theta=2$ it's about $0.88$, and at $\theta=-2$ it's about $0.12$. So raising $\theta$ makes right more likely, and the formula always gives a probability between $0$ and $1$.

      ### The score of a policy

      The policy's actions are random, so each episode can turn out differently. We score the policy by its **expected return** from the start,

      $$J(\theta)=E[G_0],$$

      where $E$ stands for expected value. This is the average of $G_0$ over many episodes played with $\pi_\theta$. The picture shows $J$ for every $\theta$. On the left the robot almost never goes right, so its discounted $-1$ rewards add up to nearly $-1/(1-0.9)=-10$. On the right, it rises towards $6.2$, the return of going straight right.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" aria-label="The score J of theta, the expected return, plotted for theta from minus 4 to 4. The curve rises from about minus 10 on the left towards 6.2 on the right, shown as a dashed line. At theta equals 0 the score is about minus 1.42, and an orange arrow climbs the curve to the right, because raising theta raises J">
      <defs><marker id="pg1-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M70 340 H600 M70 340 V30" stroke="#d4d4d4"/>
      <path d="M70 168 H600" stroke="#d4d4d4" stroke-dasharray="3 4"/>
      <path d="M70 68.8 H600" stroke="#737373" stroke-dasharray="6 5"/>
      <path d="M70.0 328.0 96.0 328.0 122.0 327.8 148.0 327.5 174.0 326.5 200.0 323.8 213.0 321.1 226.0 316.8 239.0 310.4 252.0 301.2 265.0 288.7 278.0 272.9 291.0 254.1 304.0 233.3 317.0 211.7 330.0 190.8 343.0 171.4 356.0 154.1 369.0 139.2 382.0 126.6 395.0 116.1 408.0 107.5 421.0 100.4 434.0 94.6 447.0 89.8 460.0 86.0 473.0 82.8 486.0 80.2 499.0 78.1 512.0 76.4 525.0 75.0 538.0 73.9 551.0 73.0 564.0 72.2 577.0 71.6 590.0 71.1" fill="#ffffff" fill-opacity="0" stroke="#10b981" stroke-width="2.5"/>
      <path d="M330 190.8 L366 133.6" stroke="#f59e0b" stroke-width="3" marker-end="url(#pg1-amber)"/>
      <circle cx="330" cy="190.8" r="4.5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="342" y="206">θ = 0, J ≈ −1.42</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="380" y="148" fill="#f59e0b">raising θ raises J</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="80" y="60" fill="#737373">6.2, always moving right</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="62" y="173" text-anchor="end" fill="#737373">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="62" y="333" text-anchor="end" fill="#737373">−10</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="62" y="74" text-anchor="end" fill="#737373">6.2</text>
      <text x="70" y="360" text-anchor="middle" fill="#737373">−4</text><text x="200" y="360" text-anchor="middle" fill="#737373">−2</text><text x="330" y="360" text-anchor="middle" fill="#737373">0</text><text x="460" y="360" text-anchor="middle" fill="#737373">2</text><text x="590" y="360" text-anchor="middle" fill="#737373">4</text>
      <text x="610" y="345" fill="#737373">θ</text>
      <text x="80" y="24">expected return J(θ)</text>
      </g>
      </svg>
      ```

      ### Climbing the score

      We want $J$ as large as possible, so we turn gradient descent around and step along the gradient. This is **gradient ascent**:

      $$\theta_{\text{new}}=\theta+\eta\,\nabla_\theta J(\theta).$$

      Here $\eta$ is the learning rate, which reinforcement-learning books often write as $\alpha$. Our $\theta$ is one number, so $\nabla_\theta J$ is just the slope of $J$.

      But $J$ depends on which episodes happen, and that depends on the world's rules. We know the corridor's rules, which lets us check our answers, but a real robot in a real building isn't told them, so it can't write $J$ as a formula and differentiate it. All it can do is play episodes. The next step shows how to get the slope from them.

    worked: |
      Let's work out how likely two episodes are at $\theta=0$, and what each one returns.

      1. **Find the policy's probabilities.** We put $\theta=0$ into the formula, using $e^0=1$.
         $$\pi_0(\text{right}\mid s)=\frac{1}{1+1}=0.5,\qquad\pi_0(\text{left}\mid s)=0.5.$$

      2. **Find how likely right, right, right is.** The policy picks each action on its own and the moves always succeed, so we multiply the three chances.
         $$0.5\times0.5\times0.5=0.125.$$

      3. **Find its return.** The first two moves give $-1$ each and the third reaches cell 4, so the rewards are $-1$, $-1$ and $+10$.
         $$G_0=-1+0.9\times(-1)+0.9^2\times10=6.2.$$

      4. **Find how likely left, right, right, right is.** This is the only episode with four moves. Its first move bumps into the wall and leaves the robot in cell 1, then three rights reach cell 4.
         $$0.5^4=0.0625.$$

      5. **Find its return.** Now there are three rewards of $-1$ before the $+10$.
         $$G_0=-1-0.9-0.81+0.729\times10=4.58.$$

      The score $J(0)$ adds up every possible episode's probability times its return. These two episodes give its first terms, $0.125\times6.2+0.0625\times4.58\approx1.06$, and the many longer episodes that wander left pull the total down to about $-1.42$.
