      That's no coincidence. The number $e$ is chosen so that the slope of $e^x$ at $x=0$ is exactly $1$. Because adding powers multiplies, $e^{x+h}=e^x\cdot e^h$. So the curve near any $x$ is the piece near $0$ stretched upwards by $e^x$, and its slope there is $e^x\times1$:

      $$(e^x)'=e^x$$

      So $e^x$ is its own slope, and the higher it gets, the faster it climbs.

      ### Logarithms undo exponentials

      A **logarithm** goes the other way, and asks which power gives a number. For example, $\log_2 8$, the power of $2$ that gives $8$, is $3$ because $2^3=8$. The **natural logarithm** $\ln x$ asks which power of $e$ gives $x$, so $\ln 1=0$ because $e^0=1$. It only exists for positive $x$, because no power of $e$ is zero or negative.

      On the right, $\ln x$ has slope $1$ at $x=1$, $\tfrac12$ at $x=2$ and $\tfrac14$ at $x=4$. Because $\ln x$ undoes $e^x$, its graph swaps the axes. Rise and run swap, so each slope flips to one over itself. For example, $e^x$ has height and slope $2.72$ at $x=1$, so $\ln x$ has slope $1/2.72$ at $x=2.72$. At every input $x$, its slope is $1/x$:

      $$(\ln x)'=\frac1x$$

      A number multiplying a function multiplies its slope; a sum's slope is the sum of the slopes; a constant's slope is zero. For example, $(5e^x)'=5e^x$.

      Be careful not to use the power rule on $e^x$, which would give $xe^{x-1}$. In $e^x$ the power is the input, not a fixed number.
    worked: |
      Let's find the slope of $f(x)=x^2+6\ln x$ at $x=2$.

      1. **Differentiate each term.** We use the power rule on $x^2$ and the $\ln x$ rule on $6\ln x$.
         $$(x^2)'=2x,\qquad(6\ln x)'=6\cdot\frac1x=\frac6x$$

      2. **Add the terms back up.** The sum rule adds them.
         $$f'(x)=2x+\frac6x$$

      3. **Put in $x=2$.**
         $$f'(2)=2\times2+\frac62=7$$

      So at $x=2$ the curve rises about $7$ for each unit of input.
