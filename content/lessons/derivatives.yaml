  - id: der-exp-log
    title: "Exponentials and logarithms"
    explain: |
      **The question.** The power rule needs a fixed power, as in $x^3$. In $2^x$ the input is the power itself. A **logarithm** goes the other way: it asks which power gives a number, so $\log_2 8=3$ because $2^3=8$. What are the slopes of these two kinds of function?

      **Picture it.** Left: $e^x$, where $e\approx2.718$ (a calculator gives $e^x$ for any $x$). At $x=0$ the height is $1$ and the tangent slope is $1$; at $x=1$ both are about $2.72$. Right: $\ln x$, the power you raise $e$ to to get $x$. Its slope is $1$ at $x=1$, $\tfrac12$ at $x=2$ and $\tfrac14$ at $x=4$, always $1/x$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" aria-label="Left, the curve e to the x with blue tangents at x equals 0 (height 1, slope 1) and x equals 1 (height and slope 2.72). Right, the curve ln x with blue tangents at x equals 1, 2 and 4 with slopes 1, one half and one quarter">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text x="40" y="40">y = eˣ</text>
          <path d="M40 390 H320 M194 405 V60" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
          <path d="M50 381.6 L57.2 380.7 L64.4 379.8 L71.6 378.7 L78.8 377.5 L86 376.2 L93.2 374.7 L100.4 373.1 L107.6 371.3 L114.8 369.4 L122 367.2 L129.2 364.8 L136.4 362.1 L143.6 359.2 L150.8 356 L158 352.4 L165.2 348.4 L172.4 344.1 L179.6 339.2 L186.8 333.9 L194 328 L201.2 321.5 L208.4 314.3 L215.6 306.3 L222.8 297.5 L230 287.8 L237.2 277 L244.4 265.1 L251.6 252 L258.8 237.5 L266 221.5 L273.2 203.7 L280.4 184.2 L287.6 162.5 L294.8 138.6 L302 112.1 L309.2 82.9" stroke="#171717" stroke-width="2.5" fill="#ffffff" fill-opacity="0"/>
          <path d="M158 359 L230 297 M230 305.7 L302 137.2" stroke="#3b82f6" stroke-width="3"/>
          <circle cx="194" cy="328" r="4.5" fill="#171717"/>
          <circle cx="266" cy="221.5" r="4.5" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="60" y="315" fill="#3b82f6">x = 0: slope 1</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="215" fill="#3b82f6">x = 1: slope 2.72</text>
          <text x="355" y="40">y = ln x</text>
          <path d="M345 270 H625 M355 405 V60" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
          <path d="M365.4 385.9 L370.6 356.7 L375.8 336 L381 319.9 L386.2 306.8 L391.4 295.7 L396.6 286.1 L401.8 277.6 L407 270 L412.2 263.1 L417.4 256.9 L422.6 251.1 L427.8 245.8 L433 240.8 L438.2 236.2 L443.4 231.8 L448.6 227.7 L453.8 223.8 L459 220.1 L464.2 216.6 L469.4 213.2 L474.6 210 L479.8 207 L485 204 L490.2 201.2 L495.4 198.5 L500.6 195.9 L505.8 193.3 L511 190.9 L516.2 188.5 L521.4 186.3 L526.6 184 L531.8 181.9 L537 179.8 L542.2 177.8 L547.4 175.8 L552.6 173.9 L557.8 172 L563 170.2 L568.2 168.4 L573.4 166.7 L578.6 165 L583.8 163.3 L589 161.7 L594.2 160.1 L599.4 158.6 L604.6 157.1 L609.8 155.6 L615 154.1" stroke="#171717" stroke-width="2.5" fill="#ffffff" fill-opacity="0"/>
          <path d="M375.8 313.2 L438.2 226.8 M427.8 241.7 L490.2 198.5 M531.8 181 L594.2 159.4" stroke="#3b82f6" stroke-width="3"/>
          <circle cx="407" cy="270" r="4.5" fill="#171717"/>
          <circle cx="459" cy="220.1" r="4.5" fill="#171717"/>
          <circle cx="563" cy="170.2" r="4.5" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="415" y="296" fill="#3b82f6">x = 1: slope 1</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="470" y="248" fill="#3b82f6">x = 2: slope ½</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="520" y="140" fill="#3b82f6">x = 4: slope ¼</text>
        </g>
      </svg>
      ```

      **The idea.** $e^x$ is its own slope, and $\ln x$ has slope $1/x$. The number $e\approx2.718$ is the base chosen so that the slope of $e^x$ at $x=0$ is exactly $1$. Because $e^{x+h}=e^x\cdot e^h$, the rise from $x$ to $x+h$ is $e^x$ times the rise from $0$ to $h$, so the slope at $x$ is $e^x\cdot1$:

      $$(e^x)'=e^x$$

      The **natural logarithm** $\ln x$, defined for $x>0$, is the power you raise $e$ to to get $x$: $\ln1=0$ because $e^0=1$. It undoes $e^x$, so swapping the axes turns the $e^x$ curve into the $\ln x$ curve. Where $e^x$ has height $c$, its slope is also $c$; swapping axes swaps rise and run, so $\ln x$ at input $c$ has slope $1/c$:

      $$(\ln x)'=\frac1x$$

      The constant-multiple, sum and constant rules still apply, so $(5e^x)'=5e^x$.

      **Common confusion.** "Use the power rule: $(e^x)'=xe^{x-1}$." The power rule only works when the power is a fixed number. In $e^x$ the power is the input, so it needs its own rule.
    worked: |
      Find the slope of $f(x)=x^2+6\ln x$ at $x=2$.

      1. **Differentiate each term.**
         $$(x^2)'=2x$$
         $$(6\ln x)'=6\cdot\frac1x=\frac6x$$

      2. **Add the terms.**
         $$f'(x)=2x+\frac6x$$

      3. **Put in the input.**
         $$f'(2)=2(2)+\frac62=4+3=7$$

      **Compare cases.**

      | $x$ | Slope of $e^x$ (equals its height) | Slope of $\ln x$, $1/x$ |
      | --- | --- | --- |
      | $\tfrac12$ | $1.65$ | $2$ |
      | $1$ | $2.72$ | $1$ |
      | $2$ | $7.39$ | $\tfrac12$ |
      | $4$ | $54.6$ | $\tfrac14$ |

      **Where it shows up.** Later in the course, models that output probabilities use $e^x$ and $\ln x$ in their loss, and training them needs exactly these two slopes.
