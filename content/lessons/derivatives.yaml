summary: |
  - The derivative $f'(a)$ is the slope of $f$ at one point: the limit of average slopes over smaller and smaller steps.
  - Powers follow $(x^n)'=nx^{n-1}$; numbers multiply slopes, sums go term by term, and constants have slope $0$.
  - $e^x$ is its own derivative, and $\ln x$ has derivative $1/x$.
  - Products use $u'v+uv'$ and quotients use $(u'v-uv')/v^2$, never the product of the slopes.

  **Next:** Loss functions turn a model's mistakes into one score, and these slopes show how that score responds as a weight changes.
