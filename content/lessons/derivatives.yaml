summary: |
  - The derivative $f'(a)$ is the slope of $f$ at one input, the value that average slopes $\frac{f(a+h)-f(a)}{h}$ approach as the step $h$ shrinks to $0$. A small nudge changes the output by about $f'(a)$ times the nudge.
  - Powers follow $(x^n)'=nx^{n-1}$. A number in front multiplies the slope, a sum is differentiated term by term, and a constant on its own has slope $0$.
  - $e^x$ is its own derivative, $(e^x)'=e^x$, and the natural logarithm has derivative $(\ln x)'=\frac1x$.
  - A product uses $(uv)'=u'v+uv'$ and a quotient uses $\left(\frac uv\right)'=\frac{u'v-uv'}{v^2}$, never the product of the two slopes.

  **Next:** Loss functions give the score a model tries to make small, and these slopes show how that score responds as the model's numbers change.
