concept: derivatives
version: 5
objective: |
  **Goal:** find how fast a function's output changes at one input, using the derivative and its rules for powers, $e^x$, $\ln x$, products and quotients.
where_this_fits: |
  ### What is a derivative?

  A derivative is a function's slope at one input. It measures how fast the output is changing there.

  Comparing two outputs gives an average rate of change, like a car's average speed over a trip. A speedometer gives speed now; a derivative gives the slope at one input. In machine learning, it tells whether a small nudge to a model's numbers makes its error larger or smaller, and by how much.
final: der-explain
knowledge_points:
  - id: der-speed-at-instant
    key_prereqs: []
    title: "Find the slope at one point"
    tldr: |
      - Comparing two positions tells us the average speed between them.
      - Shortening the time between them brings that average closer to the speed right now.
      - The derivative gives that instant's speed, which is the slope at one point on the graph.
    explain: |
      ### Average speed over one second

      A car starts from rest, and its distance after $t$ seconds is $d(t)=t^2$ metres. To find its average speed between $t=3$ and $t=4$, divide the distance travelled by the time taken:
      $$
      \begin{aligned}
      d(4)-d(3)&=16-9=7 &&\text{metres travelled}\\
      \frac{7}{4-3}&=7 &&\text{average speed in m/s}
      \end{aligned}
      $$

      On the graph, that's the slope of the orange line joining the two points, its rise of $7$ metres over its run of $1$ second. But the car keeps speeding up, so $7$ isn't what its speedometer shows at exactly $t=3$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" aria-label="The curve d equals t squared, the distance in metres a car has driven after t seconds. An orange straight line joins the points at t equals 3 and t equals 4 with slope 7, the average speed over that second. A blue line just touches the curve at t equals 3 with slope 6, the speed at that instant">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
        <path d="M70 380 H600 M70 380 V30" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
