  - id: der-product-quotient
    title: "Slopes of products and fractions"
    explain: |
      **The question.** How do you differentiate two changing functions multiplied together, like $x^2e^x$, or one divided by the other?

      **Picture it.** Think of a product $u\cdot v$ as the area of a rectangle, $u$ wide and $v$ tall. If the width grows by a little ($\Delta u$, "change in $u$") and the height by $\Delta v$, the area gains three pieces: an amber strip $\Delta u\cdot v$, a blue strip $u\cdot\Delta v$, and a red corner $\Delta u\cdot\Delta v$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" aria-label="A rectangle u wide and v tall grows by an amber strip delta u times v on the right, a blue strip u times delta v on top and a small red corner delta u times delta v">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <rect x="80" y="130" width="240" height="180" fill="#d4d4d4" fill-opacity="0.35" stroke="#737373" stroke-width="2"/>
          <rect x="320" y="130" width="36" height="180" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="2"/>
          <rect x="80" y="94" width="240" height="36" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
          <rect x="320" y="94" width="36" height="36" fill="#ef4444" fill-opacity="0.35" stroke="#ef4444" stroke-width="2"/>
          <text x="160" y="225">area u · v</text>
          <text x="190" y="335">width u</text>
          <text x="20" y="225">height v</text>
          <text x="328" y="335">Δu</text>
          <text x="52" y="117">Δv</text>
          <text x="372" y="225" fill="#171717">Δu · v</text>
          <text x="160" y="80" fill="#171717">u · Δv</text>
          <text x="372" y="100" fill="#171717">Δu · Δv (tiny)</text>
        </g>
      </svg>
      ```

      **The idea.** A product changes because of each factor in turn. Let $x$ move by a small step $h$, so $\Delta u\approx u'h$ and $\Delta v\approx v'h$. Divide the gained area by $h$: the strips give $u'v$ and $uv'$, while the corner gives about $u'v'h$, which shrinks to $0$ with $h$. In general, for two functions $u$ and $v$ of $x$, the **product rule** and **quotient rule** are

      $$(uv)'=u'v+uv'$$

      $$\left(\frac uv\right)'=\frac{u'v-uv'}{v^2}\quad(v\neq0)$$

      In the quotient rule, mind the minus sign and the order: $u'v$ comes first. For example:

      $$\left(\frac{x}{x+1}\right)'=\frac{1\cdot(x+1)-x\cdot1}{(x+1)^2}=\frac{1}{(x+1)^2}$$

      **Common confusion.** "The slope of a product is the product of the slopes." Test it on $x\cdot x=x^2$: multiplying slopes gives $1\cdot1=1$, but the true slope is $2x$. The product rule gives $1\cdot x+x\cdot1=2x$.
    worked: |
      Find the slope of $f(x)=(x^2+1)(3x-2)$ at $x=1$, then check by expanding.

      1. **Name the factors and their slopes.**
         $$u=x^2+1,\quad u'=2x$$
         $$v=3x-2,\quad v'=3$$

      2. **Apply the product rule.**
         $$f'(x)=2x(3x-2)+3(x^2+1)=9x^2-4x+3$$

      3. **Put in the input.**
         $$f'(1)=u'v+uv'=2(1)+2(3)=8$$

      4. **Check by expanding first.**
         $$f(x)=3x^3-2x^2+3x-2,\quad f'(x)=9x^2-4x+3$$

      **Compare cases.** Multiplying the slopes, $u'v'$, would give $6x$, which is wrong at every point here:

      | $x$ | $u'v$ | $uv'$ | $f'(x)$ | $u'v'$ (wrong) |
      | --- | --- | --- | --- | --- |
      | $0$ | $0$ | $3$ | $3$ | $0$ |
      | $1$ | $2$ | $6$ | $8$ | $6$ |
      | $2$ | $16$ | $15$ | $31$ | $12$ |

      **Where it shows up.** A squared error is the error times itself: $L(w)=(w-3)(w-3)$. The product rule gives $L'(w)=(w-3)+(w-3)=2w-6$, the same slope as expanding.
