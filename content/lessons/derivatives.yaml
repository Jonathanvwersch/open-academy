  - id: der-product-quotient
    key_prereqs: []
    title: "Find slopes of products and fractions"
    tldr: |
      - When two changing quantities are multiplied, either one's change affects the result.
      - The product rule adds those two effects to find the slope.
      - Rearranging that rule gives a similar rule for the slope of a fraction.
    explain: |
      ### Two changing parts

      So far every function has been a sum of pieces. But what about two functions multiplied together, like $x^2e^x$, or one divided by the other? Let's call the two functions $u$ and $v$, where both depend on $x$.

      ### A growing rectangle

      Think of the product $u\cdot v$ as the area of a rectangle that is $u$ wide and $v$ tall. When $x$ moves a little, the width grows by a small amount $\Delta u$ (read "change in $u$") and the height grows by $\Delta v$. The area gains three pieces: a green strip $\Delta u\cdot v$ down the right side, a red strip $u\cdot\Delta v$ along the top, and a tiny grey corner $\Delta u\cdot\Delta v$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" aria-label="A rectangle u wide and v tall grows a little. It gains a green strip delta u times v down the right side, a red strip u times delta v along the top, and a tiny grey corner delta u times delta v">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
        <rect x="100" y="130" width="240" height="180" fill="#d4d4d4" fill-opacity="0.35" stroke="#737373" stroke-width="2"/>
        <rect x="340" y="130" width="36" height="180" fill="#10b981" fill-opacity="0.35" stroke="#10b981" stroke-width="2"/>
        <rect x="100" y="94" width="240" height="36" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-width="2"/>
        <rect x="340" y="94" width="36" height="36" fill="#737373" fill-opacity="0.35" stroke="#737373" stroke-width="2"/>
        <text x="220" y="225" text-anchor="middle">area u · v</text>
        <text x="220" y="335" text-anchor="middle">width u</text>
        <text x="90" y="225" text-anchor="end">height v</text>
        <text x="358" y="335" text-anchor="middle">Δu</text>
        <text x="90" y="117" text-anchor="end">Δv</text>
        <text x="390" y="225" fill="#10b981">green strip: Δu · v</text>
        <text x="220" y="80" text-anchor="middle" fill="#ef4444">red strip: u · Δv</text>
        <text x="390" y="117" fill="#737373">grey corner: Δu · Δv (tiny)</text>
      </g>
      </svg>
      ```

      A small input nudge $h$ changes each side by about its slope times $h$. Divide the added area by $h$ to find the average slope:
      $$\begin{aligned}\Delta u&\approx u'h &&\text{width change}\\\Delta v&\approx v'h &&\text{height change}\\\frac{\Delta(uv)}h&=\frac{\Delta u\,v+u\,\Delta v+\Delta u\,\Delta v}h &&\text{add strips and corner}\\&\approx u'v+uv'+u'v'h &&\text{substitute the changes}\end{aligned}$$
      The corner's contribution disappears as $h$ shrinks.

      ### The product and quotient rules

      So the **product rule** says that for two functions $u$ and $v$ of $x$,

      $$(uv)'=u'v+uv'$$

      For one function divided by another, the **quotient rule** is

      $$\left(\frac uv\right)'=\frac{u'v-uv'}{v^2}$$

      To derive it where $v\ne0$, name the fraction $q=u/v$:
      $$\begin{aligned}u&=qv &&\text{multiply by }v\\u'&=q'v+qv' &&\text{use the product rule}\\u'-qv'&=q'v &&\text{subtract }qv'\\q'&=\frac{u'-qv'}v &&\text{divide by }v\\&=\frac{u'-(u/v)v'}v &&\text{substitute }q=u/v\\&=\frac{(u'v-uv')/v}v &&\text{combine the numerator's fractions}\\&=\frac{u'v-uv'}{v^2} &&\text{divide by }v\end{aligned}$$
      Watch the minus sign. With $u=x$ and $v=x+1$, both slopes are $1$:
      $$\begin{aligned}\left(\frac{x}{x+1}\right)'&=\frac{1\cdot(x+1)-x\cdot1}{(x+1)^2} &&\text{substitute the parts}\\&=\frac{1}{(x+1)^2} &&\text{cancel }x\text{ in the numerator}\end{aligned}$$

      Be careful not to multiply the slopes. For $x\cdot x=x^2$, that would give $1$. The product rule gives the correct $2x$:
      $$\begin{aligned}(x\cdot x)'&=1\cdot x+x\cdot1 &&\text{count both changing factors}\\&=2x &&\text{add their contributions}\end{aligned}$$
    worked: |
      Let's find the slope of $f(x)=(x^2+1)(3x-2)$ at $x=1$, then check it by multiplying out the brackets.

      1. **Name the two parts and their slopes.** The first bracket is $u$ and the second is $v$, and the power rule gives their slopes.
         $$u=x^2+1,\quad u'=2x,\qquad v=3x-2,\quad v'=3$$

      2. **Find the values at $x=1$.** The product rule needs each part's value as well as its slope.
         $$u=2,\quad u'=2,\qquad v=1,\quad v'=3$$

      3. **Apply the product rule.** Each part's slope is multiplied by the other part's value.
         $$\begin{aligned}f'(1)&=u'v+uv' &&\text{product rule}\\&=2\times1+2\times3 &&\text{substitute the values}\\&=2+6=8 &&\text{multiply and add}\end{aligned}$$

      4. **Check by multiplying out.** Expanding gives a polynomial, which the power rule handles directly.
         $$\begin{aligned}f(x)&=3x^3-2x^2+3x-2 &&\text{expand the brackets}\\f'(x)&=9x^2-4x+3 &&\text{differentiate each term}\\f'(1)&=9-4+3=8 &&\text{substitute }x=1\end{aligned}$$

      Both ways give $8$, while multiplying the two slopes would give $u'v'=6$.
