  - id: der-exp-log
    title: "Find slopes of exponentials and logarithms"
    explain: |
      ### When the input is the power

      The **power rule** finds slopes of fixed powers: bring the power down in front and reduce it by one, as for the $3$ in $x^3$. In an **exponential** such as $2^x$, the input is the power, so the rule doesn't apply. The exponential $e^x$ uses $e\approx2.718$ as its base; $\approx$ means "about". A prime mark means a function's slope at each input.

      ### The slope of e to the x

      At the picture's left, $e^x$ has height $1$ at $x=0$. Its tangent, a line touching the curve with its slope there, has slope $1$. At $x=1$, height and slope are about $2.72$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" aria-label="Left, the curve e to the x with blue tangents at x equals 0, where the height and slope are both 1, and at x equals 1, where both are about 2.72. Right, the curve ln x with blue tangents at x equals 1, 2 and 4, whose slopes are 1, one half and one quarter">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
        <text x="40" y="34">y = eˣ</text>
        <path d="M30 380 H310 M175 395 V50" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
        <path d="M47 367.5 L51 366.8 L55 366.2 L59 365.5 L63 364.7 L67 363.9 L71 363.1 L75 362.2 L79 361.3 L83 360.4 L87 359.4 L91 358.3 L95 357.2 L99 356 L103 354.8 L107 353.5 L111 352.1 L115 350.7 L119 349.2 L123 347.6 L127 346 L131 344.2 L135 342.4 L139 340.5 L143 338.4 L147 336.3 L151 334.1 L155 331.7 L159 329.2 L163 326.6 L167 323.9 L171 321 L175 318 L179 314.8 L183 311.5 L187 308 L191 304.3 L195 300.4 L199 296.3 L203 292 L207 287.5 L211 282.8 L215 277.8 L219 272.5 L223 267 L227 261.2 L231 255.1 L235 248.7 L239 242 L243 234.9 L247 227.5 L251 219.7 L255 211.5 L259 202.8 L263 193.7 L267 184.2 L271 174.2 L275 163.6 L279 152.5 L283 140.8 L287 128.6 L291 115.7 L295 102.1 L299 87.9 L303 72.9" stroke="#171717" stroke-width="2.5" fill="#ffffff" fill-opacity="0"/>
        <path d="M119 361.4 L215 287 M235 253.6 L287 144.1" stroke="#3b82f6" stroke-width="3"/>
        <circle cx="175" cy="318" r="4.5" fill="#171717"/>
        <circle cx="255" cy="211.5" r="4.5" fill="#171717"/>
        <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="187" y="340" fill="#3b82f6">x = 0: height 1, slope 1</text>
        <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="241" y="205.5" fill="#3b82f6" text-anchor="end">x = 1: height and slope 2.72</text>
        <text x="300" y="398" text-anchor="end">x</text>
        <text x="372" y="34">y = ln x</text>
        <path d="M350 230 H630 M360 395 V50" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
        <path d="M367.3 377.5 L369.4 358.6 L371.4 343.6 L373.5 331 L375.6 320.3 L377.7 310.9 L379.8 302.6 L381.8 295.1 L383.9 288.2 L386 282 L388.1 276.2 L390.2 270.9 L392.2 265.9 L394.3 261.2 L396.4 256.8 L398.5 252.6 L400.6 248.6 L402.6 244.9 L404.7 241.3 L406.8 237.9 L408.9 234.6 L411 231.5 L412 230 L417.2 222.9 L422.4 216.3 L427.6 210.3 L432.8 204.8 L438 199.6 L443.2 194.7 L448.4 190.2 L453.6 185.9 L458.8 181.9 L464 178 L469.2 174.4 L474.4 170.9 L479.6 167.5 L484.8 164.3 L490 161.3 L495.2 158.3 L500.4 155.5 L505.6 152.8 L510.8 150.1 L516 147.6 L521.2 145.1 L526.4 142.8 L531.6 140.5 L536.8 138.2 L542 136 L547.2 133.9 L552.4 131.9 L557.6 129.9 L562.8 127.9 L568 126 L573.2 124.2 L578.4 122.4 L583.6 120.6 L588.8 118.9 L594 117.2 L599.2 115.5 L604.4 113.9 L609.6 112.4 L614.8 110.8 L620 109.3" stroke="#171717" stroke-width="2.5" fill="#ffffff" fill-opacity="0"/>
        <path d="M391.2 260 L432.8 200 M438 196.8 L490 159.3 M526.4 141 L609.6 111" stroke="#3b82f6" stroke-width="3"/>
        <circle cx="412" cy="230" r="4.5" fill="#171717"/>
        <circle cx="464" cy="178" r="4.5" fill="#171717"/>
        <circle cx="568" cy="126" r="4.5" fill="#171717"/>
        <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="422" y="254" fill="#3b82f6">x = 1: slope 1</text>
        <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="474" y="204" fill="#3b82f6">x = 2: slope ½</text>
        <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="560" y="110" fill="#3b82f6" text-anchor="middle">x = 4: slope ¼</text>
