concept: derivatives
version: 4
objective: |
  **Goal:** find how fast a function's output changes at one input, using the derivative and its rules for powers, $e^x$, $\ln x$, products and quotients.
where_this_fits: |
  A model learns by nudging its adjustable numbers, its **weights**, so that its error score, the **loss**, gets smaller. For that it needs to know, for one weight: if I nudge it a little, does the loss go up or down, and by how much? A car's speedometer answers the same kind of question about distance: how fast it is changing right now. Comparing two values of a function only gives an average over a stretch, not the rate at one point. This lesson builds that rate, the **derivative**, in four steps:

  1. Define the derivative as the slope at one point.
  2. Get the slope of any power or polynomial with a rule.
  3. Do the same for $e^x$ and $\ln x$.
  4. Handle products and quotients of functions.
final: der-explain
knowledge_points:
  - id: der-speed-at-instant
    title: "The slope at a single point"
    explain: |
      **The question.** A car has driven $d(t)=t^2$ metres after $t$ seconds. You can measure how far it goes during any stretch of time, which gives its average speed. How fast is it going at exactly $t=3$, the number a speedometer would show?

      **Picture it.** The curve is the distance at each time. Average speed over a stretch is the slope of the straight line joining its two ends: from $t=3$ to $t=4$ the car goes $16-9=7$ m in 1 s, so the amber line has slope $7$. Shrink the stretch and that line turns until it just touches the curve at $t=3$. The blue line, with slope $6$ (worked out below), is that touching line, the **tangent**.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" aria-label="The curve d equals t squared with the point at t equals 3, an amber line to t equals 4 with average slope 7, and a blue tangent line at t equals 3 with slope 6">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M70 390 H600 M70 390 V40" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
          <path d="M70 390 L81 389.8 L92 389.4 L103 388.6 L114 387.4 L125 386 L136 384.2 L147 382.2 L158 379.8 L169 377 L180 374 L191 370.6 L202 367 L213 363 L224 358.6 L235 354 L246 349 L257 343.8 L268 338.2 L279 332.2 L290 326 L301 319.4 L312 312.6 L323 305.4 L334 297.8 L345 290 L356 281.8 L367 273.4 L378 264.6 L389 255.4 L400 246 L411 236.2 L422 226.2 L433 215.8 L444 205 L455 194 L466 182.6 L477 171 L488 159 L499 146.6 L510 134 L521 121 L532 107.8 L543 94.2 L554 80.2 L565 66" stroke="#171717" stroke-width="2.5" fill="#ffffff" fill-opacity="0"/>
          <path d="M334 313.2 L554 89.2" stroke="#f59e0b" stroke-width="2.5"/>
          <path d="M290 342 L554 111.6" stroke="#3b82f6" stroke-width="3"/>
          <path d="M400 390 V246 M510 390 V134" stroke="#d4d4d4" stroke-dasharray="4 4"/>
          <circle cx="400" cy="246" r="5" fill="#171717"/>
          <circle cx="510" cy="134" r="4.5" fill="#f59e0b"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="412" y="262">t = 3, d = 9</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="110" y="90" fill="#f59e0b">amber: average slope 7 (t = 3 to 4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="520" y="160" fill="#3b82f6">tangent slope 6</text>
          <text x="66" y="410">0</text>
          <text x="176" y="410">1</text>
          <text x="286" y="410">2</text>
          <text x="396" y="410">3</text>
          <text x="506" y="410">4</text>
          <text x="530" y="430">time t (s)</text>
          <text x="80" y="40">distance d (m)</text>
        </g>
      </svg>
      ```

      **The idea.** The derivative is the slope of a function at one point. In general, the **derivative** of a function $f$ at an input $a$, written $f'(a)$ ("f prime of a"), is the value the average slope over a small step $h$ gets closer to as the step shrinks to $0$:

      $$f'(a)=\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$$

      Here $\lim_{h\to0}$, the **limit**, reads "the value this approaches as $h$ shrinks to $0$". The top is the change in output, the bottom the change in input. So for a small step $h$, the output changes by about $f'(a)\,h$.

      **Common confusion.** "Why not just put $h=0$?" Then the top is $f(a)-f(a)=0$ and the bottom is $0$, and $0/0$ has no value. The limit instead watches what the slope approaches as $h$ gets small but never $0$.
    worked: |
      Find the car's speed at $t=3$, where $d(t)=t^2$.

      1. **Average speed over shrinking steps.**
         $$h=1:\quad\frac{d(4)-d(3)}{1}=\frac{16-9}{1}=7$$
         $$h=0.1:\quad\frac{d(3.1)-d(3)}{0.1}=\frac{9.61-9}{0.1}=6.1$$
         $$h=0.01:\quad\frac{d(3.01)-d(3)}{0.01}=\frac{9.0601-9}{0.01}=6.01$$

      2. **Do it for any step $h$.**
         $$\frac{(3+h)^2-9}{h}=\frac{6h+h^2}{h}=6+h$$

      3. **Let the step shrink to 0.**
         $$d'(3)=\lim_{h\to0}(6+h)=6$$

      The speed at $t=3$ is $6$ m/s.

      **Compare cases.** At any time $a$ the same steps give $\frac{(a+h)^2-a^2}{h}=\frac{2ah+h^2}{h}=2a+h$, so $d'(a)=2a$:

      | Time $t$ | Distance $d(t)$ | Speed $d'(t)$ |
      | --- | --- | --- |
      | $0$ | $0$ | $0$ |
      | $1$ | $1$ | $2$ |
      | $3$ | $9$ | $6$ |
      | $5$ | $25$ | $10$ |

      **Where it shows up.** If a model's loss for one weight is $L(w)$, then $L'(w)$ says how much the loss changes per unit nudge of the weight. A negative $L'(w)$ means raising the weight a little lowers the loss.
