concept: derivatives
version: 5
objective: |
  **Goal:** find how fast a function's output changes at one input, using the derivative and its rules for powers, $e^x$, $\ln x$, products and quotients.
where_this_fits: |
  ### What is a derivative?

  A derivative measures how fast a function's output is changing at one particular input. On a graph, it's how steep the curve is at a single point, which we call the slope there.

  Why do we need a new idea for that? Comparing two outputs only gives the average rate of change between two inputs, the way distance divided by time gives a car's average speed over a trip. A speedometer shows something different, the speed right now, and the derivative is how we work that out. Machine learning needs the same thing. A model improves by nudging its adjustable numbers, and the derivative tells it whether a small nudge makes its error bigger or smaller, and by how much.
final: der-explain
knowledge_points:
  - id: der-speed-at-instant
    title: "Find the slope at one point"
    explain: |
      ### Average speed over one second

      A car starts from rest, and its distance after $t$ seconds is $d(t)=t^2$ metres. Between $t=3$ and $t=4$ it goes from $9$ metres to $16$, so its average speed is $7$ m/s.

      On the graph, that's the slope of the orange line joining the two points, its rise of $7$ metres over its run of $1$ second. But the car keeps speeding up, so $7$ isn't what its speedometer shows at exactly $t=3$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" aria-label="The curve d equals t squared, the distance in metres a car has driven after t seconds. An orange straight line joins the points at t equals 3 and t equals 4 with slope 7, the average speed over that second. A blue line just touches the curve at t equals 3 with slope 6, the speed at that instant">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
        <path d="M70 380 H600 M70 380 V30" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
        <path d="M70 380 L75.9 380 L81.8 379.8 L87.7 379.6 L93.6 379.3 L99.5 378.9 L105.4 378.4 L111.3 377.9 L117.2 377.2 L123.1 376.5 L129 375.6 L134.9 374.7 L140.8 373.7 L146.7 372.6 L152.6 371.4 L158.5 370.2 L164.4 368.8 L170.3 367.4 L176.2 365.8 L182.1 364.2 L188 362.5 L193.9 360.7 L199.8 358.8 L205.7 356.9 L211.6 354.8 L217.5 352.7 L223.4 350.4 L229.3 348.1 L235.2 345.7 L241.1 343.2 L247 340.6 L252.9 338 L258.8 335.2 L264.7 332.4 L270.6 329.4 L276.5 326.4 L282.4 323.3 L288.3 320.1 L294.2 316.8 L300.1 313.5 L306 310 L311.9 306.5 L317.8 302.8 L323.7 299.1 L329.6 295.3 L335.5 291.4 L341.4 287.4 L347.3 283.4 L353.2 279.2 L359.1 275 L365 270.6 L370.9 266.2 L376.8 261.7 L382.7 257.1 L388.6 252.4 L394.5 247.7 L400.4 242.8 L406.3 237.9 L412.2 232.8 L418.1 227.7 L424 222.5 L429.9 217.2 L435.8 211.8 L441.7 206.4 L447.6 200.8 L453.5 195.2 L459.4 189.4 L465.3 183.6 L471.2 177.7 L477.1 171.7 L483 165.6 L488.9 159.5 L494.8 153.2 L500.7 146.9 L506.6 140.4 L512.5 133.9 L518.4 127.3 L524.3 120.6 L530.2 113.8 L536.1 107 L542 100 L547.9 93 L553.8 85.8 L559.7 78.6 L565.6 71.3 L571.5 63.9 L577.4 56.4 L583.3 48.9 L589.2 41.2" stroke="#171717" stroke-width="2.5" fill="#ffffff" fill-opacity="0"/>
