      ### Shrinking the stretch

      What about shorter stretches from $t=3$?

      - Over $1$ second, it's $7$ m/s.
      - Over $0.1$ seconds, it goes from $9$ to $3.1^2=9.61$ metres, so it's $6.1$ m/s.
      - Over $0.01$ seconds, it goes to $3.01^2=9.0601$ metres, so it's $6.01$ m/s.

      The averages close in on $6$. Drawn over shorter stretches, the orange line would turn until it just touches the curve at $t=3$. This touching line, drawn in blue, is the **tangent**, and its slope, $6$, is the speed at that instant.

      ### The definition

      The **derivative** of a function $f$ at an input $a$, written $f'(a)$ and read "f prime of a", is the slope of its graph at that input. Over a small step $h$ the output goes from $f(a)$ to $f(a+h)$, and we see where the average slope heads as $h$ shrinks to $0$:

      $$f'(a)=\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$$

      The fraction divides the change in output by the change in input, so it's an average slope. The **limit**, $\lim_{h\to0}$, means "the value this gets closer to as $h$ shrinks to $0$". For the car, $d'(3)=6$.

      Be careful not to just put $h=0$ into the fraction, because that gives $0/0$, which has no value. So we watch where the average heads instead.

      ### Estimating with the slope

      The derivative also says how far the output moves for a small nudge, which is about $f'(a)$ times the nudge. From $t=3$, a $0.1$-second nudge should move the car about $6\times0.1=0.6$ metres, and it really moves $9.61-9=0.61$.

      This only works for small nudges, because the curve bends away from its tangent. A $2$-second nudge from $t=3$ predicts $9+6\times2=21$ metres at $t=5$, but the true distance is $25$.
    worked: |
      Let's work out the car's speed at exactly $t=3$, when its distance is $d(t)=t^2$.

      1. **Write the average for any step $h$.** Letting $h$ stand for the step shows every average at once. We expand $(3+h)^2=9+6h+h^2$, cancel the $9$s, and divide by $h$, which we can do because $h$ isn't $0$.
         $$\frac{(3+h)^2-9}{h}=\frac{6h+h^2}{h}=6+h$$

      2. **Let the step shrink to $0$.** As $h$ gets smaller, $6+h$ gets closer to $6$.
         $$d'(3)=\lim_{h\to0}(6+h)=6$$

      3. **Repeat at any time $a$.** The same algebra works at every time, not just $t=3$.
         $$\frac{(a+h)^2-a^2}{h}=\frac{2ah+h^2}{h}=2a+h,\quad\text{so}\quad d'(a)=2a$$

      So the car is doing $6$ m/s at $t=3$. In general its speed is $d'(t)=2t$.
