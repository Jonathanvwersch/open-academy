      The number $e$ is chosen so the slope at $0$ is $1$. Split $e^{x+h}$ into a product, then take the fixed factor $e^x$ outside the average-slope fraction:
      $$\begin{aligned}e^{x+h}&=e^x e^h &&\text{split the power}\\\frac{e^{x+h}-e^x}{h}&=e^x\frac{e^h-1}{h} &&\text{factor out }e^x\\(e^x)'&=e^x\times1=e^x &&\text{let }h\text{ shrink to zero}\end{aligned}$$

      So $e^x$ is its own slope, and the higher it gets, the faster it climbs.

      ### Logarithms undo exponentials

      A **logarithm** goes the other way, and asks which power gives a number. For example, $\log_2 8$, the power of $2$ that gives $8$, is $3$ because $2^3=8$. The **natural logarithm** $\ln x$ asks which power of $e$ gives $x$, so $\ln 1=0$ because $e^0=1$. It only exists for positive $x$, because no power of $e$ is zero or negative.

      On the right, $\ln x$ has slope $1$ at $x=1$, $\tfrac12$ at $x=2$ and $\tfrac14$ at $x=4$. Its graph swaps the exponential's axes, so rise and run swap too. For example, the exponential's height and slope are about $2.72$ at input $1$, giving the logarithm slope about $1/2.72$ at input $2.72$. At a general exponential input $a$:
      $$\begin{aligned}x&=e^a &&\text{height becomes logarithm input}\\(\ln x)'&=1/e^a &&\text{swap rise and run}\\&=1/x &&\text{use that input's name}\end{aligned}$$

      The rules for numbers in front, sums and constants still apply here. For example, $(5e^x)'=5e^x$.

      Be careful not to use the power rule on $e^x$, which would give $xe^{x-1}$. The input sits in the power here, so we use the exponential rule.
    worked: |
      Let's find the slope of $f(x)=x^2+6\ln x$ at $x=2$.

      1. **Differentiate each term.** We use the power rule on $x^2$ and the $\ln x$ rule on $6\ln x$.
         $$\begin{aligned}(x^2)'&=2x &&\text{apply the power rule}\\(6\ln x)'&=6\cdot\frac1x &&\text{keep the constant multiplier}\\&=\frac6x &&\text{combine into one fraction}\end{aligned}$$

      2. **Add the terms back up.** The sum rule adds them.
         $$f'(x)=2x+\frac6x$$

      3. **Put in $x=2$.**
         $$f'(2)=2\times2+\frac62=7$$

      So at $x=2$ the curve rises about $7$ for each unit of input.

      ### Logarithm rules and changing base

      For positive $a,b,x$, logarithms turn multiplication into addition and division into subtraction. Each rule below includes a number check:

      | Rule | Check |
      | --- | --- |
      | $\ln(ab)=\ln a+\ln b$ | $\ln(e\cdot e^2)=3=1+2$ |
      | $\ln(a^k)=k\ln a$ | $\ln(e^2)=2=2\ln e$ |
      | $\ln(a/b)=\ln a-\ln b$ | $\ln(e^3/e)=2=3-1$ |
      | $\ln(1/a)=-\ln a$ | $\ln(1/e^2)=-2$ |
      | $e^{\ln x}=x$ | $e^{\ln 3}=3$ |
      | $\ln(e^a)=a$ | $\ln(e^2)=2$ |

      A power $a^k$ is $k$ copies of $a$ multiplied together, so its logarithm is a sum of $k$ copies of $\ln a$.

      The last rule holds for every real $a$. To change from base two to natural logarithms, start from the definition of $\log_2 x$:
      $$\begin{aligned}x&=2^{\log_2 x} &&\text{definition}\\\ln x&=(\ln2)\log_2 x &&\text{take natural logs}\end{aligned}$$
      For $x=4$, this gives $\ln4=2\ln2\approx1.39$ on both sides.
