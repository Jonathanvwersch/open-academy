      ### Shrinking the stretch

      What about shorter stretches from $t=3$?

      - Over $1$ second, it's $7$ m/s.
      - Over $0.1$ seconds, calculate the new distance, then the speed:
        $$\begin{aligned}d(3.1)&=3.1^2=9.61 &&\text{new distance}\\(9.61-9)/0.1&=6.1 &&\text{average speed}\end{aligned}$$
      - Over $0.01$ seconds, repeat with a smaller step:
        $$\begin{aligned}d(3.01)&=3.01^2=9.0601 &&\text{new distance}\\(9.0601-9)/0.01&=6.01 &&\text{average speed}\end{aligned}$$

      The averages close in on $6$. Drawn over shorter stretches, the orange line would turn until it just touches the curve at $t=3$. This touching line, drawn in blue, is the **tangent**, and its slope, $6$, is the speed at that instant.

      ### The definition

      The **derivative** of $f$ at input $a$, written $f'(a)$ and read "f prime of a", is its slope there. Over a step $h$, the output changes from $f(a)$ to $f(a+h)$. We watch the average slope as $h$ shrinks:

      $$f'(a)=\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$$

      The fraction divides the change in output by the change in input, so it's an average slope. The **limit**, $\lim_{h\to0}$, means "the value this gets closer to as $h$ shrinks to $0$". For the car, $d'(3)=6$.

      Be careful not to just put $h=0$ into the fraction, because that gives $0/0$, which has no value. So we watch where the average heads instead.

      ### Estimating with the slope

      For a small nudge, the output moves about $f'(a)$ times the nudge. From $t=3$, compare that estimate with the actual change:
      $$\begin{aligned}6\times0.1&=0.6 &&\text{estimated metres travelled}\\9.61-9&=0.61 &&\text{actual metres travelled}\end{aligned}$$

      The curve bends away from its tangent, so larger nudges give worse estimates. For a $2$-second nudge:
      $$\begin{aligned}9+6\times2&=21 &&\text{estimated distance at }t=5\\d(5)&=25 &&\text{true distance}\end{aligned}$$
    worked: |
      Let's work out the car's speed at exactly $t=3$, when its distance is $d(t)=t^2$.

      1. **Write the average for any step $h$.** Letting $h$ stand for the step shows every average at once. We can divide by $h$ because it isn't $0$.
         $$\begin{aligned}\frac{(3+h)^2-9}{h}&=\frac{9+6h+h^2-9}{h} &&\text{expand the square}\\&=\frac{6h+h^2}{h} &&\text{cancel the constants}\\&=6+h &&\text{divide each term by }h\end{aligned}$$

      2. **Let the step shrink to $0$.** As $h$ gets smaller, $6+h$ gets closer to $6$.
         $$d'(3)=\lim_{h\to0}(6+h)=6$$

      3. **Repeat at any time $a$.** The same algebra gives a formula for every time.
         $$\begin{aligned}\frac{(a+h)^2-a^2}{h}&=\frac{a^2+2ah+h^2-a^2}{h} &&\text{expand the square}\\&=\frac{2ah+h^2}{h} &&\text{cancel the constants}\\&=2a+h &&\text{divide by }h\\d'(a)&=2a &&\text{let }h\text{ shrink to zero}\end{aligned}$$

      So the car is doing $6$ m/s at $t=3$. In general its speed is $d'(t)=2t$.
