  - id: der-power-rule
    key_prereqs: []
    title: "Find slopes of powers and sums"
    tldr: |
      - To find the slope of a power of x, bring the power down in front and lower the power by one.
      - A number multiplying a term stays, while a number added on its own contributes no slope.
      - These rules let us find a sum's slope one term at a time.
      - Smooth interior tops and bottoms have zero slope.
    explain: |
      ### A pattern in the slopes

      Working out a limit every time is slow, so let's look for a shortcut. In the last step we found that the car's distance $t^2$ has slope $2t$. If we call the input $x$ instead, the curve $f(x)=x^2$ has slope $2x$. In the picture, the blue tangents at $x=-1$, $0$, $1$ and $2$ have slopes $-2$, $0$, $2$ and $4$, twice the input each time. A negative slope means the curve is going down, and a slope of $0$ means it's flat there.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" aria-label="The curve y equals x squared with blue tangent lines at x equals minus 1, 0, 1 and 2. Their slopes are minus 2, 0, 2 and 4, twice the input each time">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
        <path d="M70 345 H575 M320 375 V30" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
        <path d="M80 45.5 L85 57.8 L90 69.9 L95 81.8 L100 93.3 L105 104.6 L110 115.7 L115 126.5 L120 137 L125 147.3 L130 157.3 L135 167 L140 176.5 L145 185.8 L150 194.7 L155 203.4 L160 211.9 L165 220.1 L170 228 L175 235.7 L180 243.1 L185 250.2 L190 257.1 L195 263.8 L200 270.1 L205 276.2 L210 282.1 L215 287.7 L220 293 L225 298.1 L230 302.9 L235 307.4 L240 311.7 L245 315.8 L250 319.5 L255 323 L260 326.3 L265 329.3 L270 332 L275 334.5 L280 336.7 L285 338.6 L290 340.3 L295 341.8 L300 342.9 L305 343.8 L310 344.5 L315 344.9 L320 345 L325 344.9 L330 344.5 L335 343.8 L340 342.9 L345 341.8 L350 340.3 L355 338.6 L360 336.7 L365 334.5 L370 332 L375 329.3 L380 326.3 L385 323 L390 319.5 L395 315.8 L400 311.7 L405 307.4 L410 302.9 L415 298.1 L420 293 L425 287.7 L430 282.1 L435 276.2 L440 270.1 L445 263.8 L450 257.1 L455 250.2 L460 243.1 L465 235.7 L470 228 L475 220.1 L480 211.9 L485 203.4 L490 194.7 L495 185.8 L500 176.5 L505 167 L510 157.3 L515 147.3 L520 137 L525 126.5 L530 115.7 L535 104.6 L540 93.3 L545 81.8 L550 69.9 L555 57.8 L560 45.5" stroke="#171717" stroke-width="2.5" fill="#ffffff" fill-opacity="0"/>
        <path d="M165 235.8 L275 350.2 M270 345 L370 345 M365 350.2 L475 235.8 M480 220.2 L560 53.8" stroke="#3b82f6" stroke-width="3"/>
        <circle cx="220" cy="293" r="4.5" fill="#171717"/>
        <circle cx="320" cy="345" r="4.5" fill="#171717"/>
        <circle cx="420" cy="293" r="4.5" fill="#171717"/>
        <circle cx="520" cy="137" r="4.5" fill="#171717"/>
        <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="208" y="299" fill="#3b82f6" text-anchor="end">x = −1: slope −2</text>
        <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="328" y="371" fill="#3b82f6">x = 0: slope 0</text>
        <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="434" y="309" fill="#3b82f6">x = 1: slope 2</text>
        <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="534" y="145" fill="#3b82f6">x = 2: slope 4</text>
        <text x="585" y="350">x</text>
        <text x="330" y="40">y = x²</text>
      </g>
      </svg>
      ```

      The same limit calculation for $x^3$ gives $3x^2$, and for $x^4$ it gives $4x^3$. Each time, the power comes down in front and the power itself drops by one.

      ### The power rule

      When we write $f'$ without an input, we mean the derivative at every input, such as $f'(x)=2x$. To **differentiate** a function means to find its derivative. The **power rule** says that for any fixed number $n$,

      $$(x^n)'=nx^{n-1}$$

      It works for negative and fractional powers too. For example, $x^{-1}$ means $1/x$:
      $$\begin{aligned}(x^{-1})'&=-x^{-2} &&\text{apply the power rule}\\&=-1/x^2 &&\text{rewrite the negative power}\end{aligned}$$

      ### Numbers in front, sums and constants

      Three more rules let us differentiate any **polynomial**, a sum of powers of $x$ each multiplied by a number, such as $3x^2-4x+5$.

      First, a fixed number $c$ multiplying a function multiplies its slope, because every rise gets $c$ times bigger. This is the **constant-multiple rule**, where $cf$ means $c$ times $f$:

      $$(cf)'=c\,f'$$

      Second, the **sum rule** says we can differentiate a sum one term at a time:

      $$(f+g)'=f'+g'$$

      Third, a number on its own, a constant, has slope $0$, because it never changes.

      | Function | Derivative | Why |
      | --- | --- | --- |
      | $x^3$ | $3x^2$ | power rule |
      | $3x^2$ | $6x$ | power rule, times $3$ |
      | $4x$ | $4$ | power rule with $n=1$, times $4$ |
      | $x^2+10$ | $2x$ | the added $10$ has slope $0$ |

      Be careful not to drop a number that multiplies a power of $x$. Adding $10$ lifts the curve without making it steeper, but multiplying by $3$ makes every rise three times as big.
    worked: |
      Let's find the slope of $f(x)=3x^2-4x+5$ at $x=2$.

      1. **Differentiate each term.** We take the three terms one at a time, using the power rule and the constant-multiple rule.
         $$\begin{aligned}(3x^2)'&=3\cdot2x &&\text{apply the power rule}\\&=6x &&\text{multiply the constants}\\(-4x)'&=-4 &&\text{differentiate the linear term}\\(5)'&=0 &&\text{differentiate the constant}\end{aligned}$$

      2. **Add the terms back up.** The sum rule adds them.
         $$f'(x)=6x-4$$

      3. **Put in $x=2$.**
         $$f'(2)=6\times2-4=8$$

      So at $x=2$ the curve rises about $8$ for each unit of input.

      ### Finding a top or bottom

      We also write $df/dx$ for $f'(x)$, the derivative of $f$ with respect to $x$. At a smooth top or bottom inside the input range, the tangent is horizontal, so the slope is zero. Solve $f'(x)=0$ to find possible tops and bottoms, then check the slopes on either side. A change from negative to positive gives a bottom; positive to negative gives a top. A zero slope alone can also occur where the curve keeps rising, as with $x^3$ at zero.

      We can find the bottom of this curve.

      1. **Set the slope to zero.** A smooth bottom has a horizontal tangent.
         $$6x-4=0$$

      2. **Solve for the input.** Add four and divide by six.
         $$x=\frac46=\frac23$$

      3. **Check the slopes on either side.** They change from negative to positive.
         $$f'(0)=-4,\qquad f'(1)=2$$

      The curve falls before $2/3$ and rises after it, so this input gives a bottom.
