  - id: der-power-rule
    title: Rules for powers, constants and sums
    explain: |
      **The question.** Working out a limit for every function is slow. The car example gave $d'(t)=2t$ for $d(t)=t^2$. Is there a shortcut that gives the slope of $x^3$, or of $3x^2-4x+5$, straight away?

      **Picture it.** The curve is $f(x)=x^2$. At four points the blue tangent lines have slopes $-2$, $0$, $2$ and $4$: each slope is exactly $2x$, double the input, as the car example found.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" aria-label="The parabola y equals x squared with blue tangent lines at x equals minus 1, 0, 1 and 2 whose slopes are minus 2, 0, 2 and 4">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M80 340 H580 M320 380 V30" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
          <path d="M100 73.8 L110 97.4 L120 120 L130 141.4 L140 161.8 L150 181 L160 199.2 L170 216.2 L180 232.2 L190 247 L200 260.8 L210 273.4 L220 285 L230 295.4 L240 304.8 L250 313.1 L260 320.2 L270 326.2 L280 331.2 L290 335.1 L300 337.8 L310 339.4 L320 340 L330 339.4 L340 337.8 L350 335.1 L360 331.2 L370 326.2 L380 320.2 L390 313.1 L400 304.8 L410 295.4 L420 285 L430 273.4 L440 260.8 L450 247.1 L460 232.2 L470 216.2 L480 199.2 L490 181 L500 161.8 L510 141.4 L520 120 L530 97.4 L540 73.8" stroke="#171717" stroke-width="2.5" fill="#ffffff" fill-opacity="0"/>
          <path d="M175 235.5 L265 334.5 M275 340 L365 340 M375 334.5 L465 235.5 M485 197 L555 43" stroke="#3b82f6" stroke-width="3"/>
          <circle cx="220" cy="285" r="4.5" fill="#171717"/>
          <circle cx="320" cy="340" r="4.5" fill="#171717"/>
          <circle cx="420" cy="285" r="4.5" fill="#171717"/>
          <circle cx="520" cy="120" r="4.5" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="92" y="300" fill="#3b82f6">x = −1: slope −2</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="282" y="364" fill="#3b82f6">x = 0: slope 0</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="432" y="300" fill="#3b82f6">x = 1: slope 2</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="532" y="128" fill="#3b82f6">x = 2: slope 4</text>
          <text x="588" y="345">x</text>
          <text x="328" y="36">y = x²</text>
        </g>
      </svg>
      ```

      **The idea.** Powers follow one pattern: bring the power down in front and lower it by one. In general, for a fixed number $n$ (negatives and fractions included) the **power rule** says

      $$(x^n)'=nx^{n-1}$$

      so $(x^2)'=2x$ and $(x^3)'=3x^2$. Three more rules let you handle any polynomial, a sum of powers times numbers. Writing $f'$ alone means the derivative at every input, like $d'(t)=2t$. The **constant-multiple rule**: a fixed number $c$ multiplying a function multiplies its slope, $(cf)'=cf'$. To **differentiate** means to find the derivative, and the **sum rule** differentiates a sum term by term: $(f+g)'=f'+g'$. A constant on its own has slope $0$, because it never changes.

      **Common confusion.** "Constants disappear, so the 3 in $3x^2$ goes too." Only an added constant disappears. Adding 5 lifts the whole curve without making it steeper. Multiplying by 3 makes every rise three times as big, so the slope triples: $(3x^2)'=6x$.
    worked: |
      Find the slope of $f(x)=3x^2-4x+5$ at $x=2$.

      1. **Differentiate each term.**
         $$(3x^2)'=3\cdot2x=6x$$
         $$(-4x)'=-4\cdot1=-4$$
         $$(5)'=0$$

      2. **Add the terms.**
         $$f'(x)=6x-4$$

      3. **Put in the input.**
         $$f'(2)=6(2)-4=8$$

      **Compare cases.**

      | Function | Derivative | Rule used |
      | --- | --- | --- |
      | $x^3$ | $3x^2$ | power |
      | $3x^2$ | $6x$ | power, times a number |
      | $x^2+10$ | $2x$ | added constant gives $0$ |
      | $4x$ | $4$ | $x=x^1$, so $1\cdot x^0=1$ |
      | $7$ | $0$ | constant |

      **Where it shows up.** If the best weight is $3$, the squared error $L(w)=(w-3)^2=w^2-6w+9$ has $L'(w)=2w-6$. At $w=1$ the slope is $-4$, so raising the weight lowers the loss.
