concept: derivatives
version: 3
objective: |
  **Goal:** find derivatives of common functions and use them to tell how a small input nudge changes an output, including a model's loss when its weight changes.
where_this_fits: |
  Linear regression gave us a house-price model whose weights and bias we must choose. We can calculate its prediction, but still need to know which way a small change to one weight moves the loss, and how fast. A derivative gives that local rate of change. The next lesson uses these slopes to compare squared and absolute loss for house-price mistakes.
knowledge_points:
  - id: der-speed-at-instant
    title: The derivative is a local rate of change
    explain: |
      **What a derivative is.** A derivative is the rate at which a function's output changes per unit of its input at one point. It is the slope of the tangent line, the line that touches the curve there with the same local slope. A car's speed is another rate of change: distance per unit time.

      **How it works.** Use the one-weight house model with area 12 and sale price 330 thousand pounds. Its squared loss is $L(w)=(12w-330)^2$. At $w=25$, prediction is 300 and loss is 900. Increasing $w$ by $h$ changes the loss; divide that change by $h$. A prime, as in $L'(w)$, denotes the derivative with respect to $w$. As $h$ shrinks toward zero, the average rate approaches the derivative:

      $$L'(w)=\lim_{h\to0}\frac{L(w+h)-L(w)}{h}.$$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 270" role="img" aria-label="Parabola of squared house-price loss from weight 22 to 33, marked at weight 25 with slope minus 720 and minimum at 27.5">
        <path d="M55 45 Q237.5 355 420 45" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
        <line x1="55" y1="200" x2="420" y2="200" stroke="#64748b" stroke-width="2"/>
        <line x1="55" y1="45" x2="55" y2="200" stroke="#64748b" stroke-width="2"/>
        <line x1="55" y1="91.116" x2="196.023" y2="200" stroke="#dc2626" stroke-width="3"/>
        <circle cx="154.545" cy="167.975" r="6" fill="#dc2626"/>
        <circle cx="237.5" cy="200" r="4" fill="#16a34a"/>
        <line x1="55" y1="200" x2="55" y2="205" stroke="#64748b" stroke-width="2"/>
        <line x1="420" y1="200" x2="420" y2="205" stroke="#64748b" stroke-width="2"/>
        <text x="165" y="145" font-size="12" fill="#334155">w = 25, slope −720</text>
        <text x="200" y="222" font-size="12" fill="#334155">w = 27.5, loss 0</text>
        <text x="49" y="220" font-size="12" fill="#334155">22</text>
        <text x="412" y="220" font-size="12" fill="#334155">33</text>
        <text x="198" y="250" font-size="13" fill="#334155">weight w</text>
        <text transform="rotate(-90 18 125)" x="18" y="125" font-size="13" fill="#334155">loss</text>
      </svg>
      ```

      With $h=0.01$, $L(25.01)=(300.12-330)^2=29.88^2=892.8144$, so the average rate is $(892.8144-900)/0.01=-718.56$. A smaller $h$ brings that rate closer to $-720$. A negative slope means a small increase in the weight lowers this house's loss.

      **Why this is useful.** The derivative tells us whether to raise or lower a house model's weight to reduce its loss.
    worked: |
      This example shows average loss changes approaching the derivative at $w=25$.

      The loss is $L(w)=(12w-330)^2$, and $L(25)=900$.

      | nudge $h$ | average rate |
      |---|---|
      | 1 | $(L(26)-900)/1=(324-900)=-576$ |
      | 0.1 | $(L(25.1)-900)/0.1=(829.44-900)/0.1=-705.6$ |
      | 0.01 | $(L(25.01)-900)/0.01=(892.8144-900)/0.01=-718.56$ |

      These rates approach $L'(25)=-720$.
    problems:
      [
        der-speed-at-instant-basics,
        derp-meaning,
        derp-average-speed,
        derp-tangent,
        derp-estimate,
        derp-why-not-zero,
        derp-robot-battery,
      ]
  - id: der-power-rule
    title: Rules for powers, constants and sums
    explain: |
      **What the power rule is.** For a fixed power $n$, the derivative of $x^n$ is $nx^{n-1}$. A polynomial is a sum of powers multiplied by constants.

      **How it works.** Expand the house loss: $L(w)=(12w-330)^2=144w^2-7920w+108900$. Differentiate each term: bring the power down, lower it by one, keep a constant multiplier, and add the results:

      $$L'(w)=288w-7920.$$

      At $w=25$, this is $7200-7920=-720$, matching the local-rate calculation. The rule follows by expanding $(w+h)^n$: after division by $h$, every term with a higher power of $h$ vanishes as $h$ approaches zero. A constant contributes zero because its value does not change when $w$ changes.

      **Why this is useful.** The rule gives a quick exact slope for the house model's squared loss instead of testing many nearby weights.
    worked: |
      This example shows the power, constant-multiple and sum rules on the house loss.

      1. Write $L(w)=144w^2-7920w+108900$.
      2. Differentiate $144w^2$ to get $288w$.
      3. Differentiate $-7920w$ to get $-7920$; the constant contributes 0.
      4. Thus $L'(w)=288w-7920$, and $L'(25)=-720$.

      The negative slope says increasing $w$ slightly reduces the loss at this point.
    problems:
      [
        der-power-rule-basics,
        derp-power-poly,
        derp-power-value,
        derp-power-cube,
        derp-constant-term,
        derp-drone-climb,
        derp-power-fraction,
      ]
  - id: der-exp-log
    title: Exponentials and the natural logarithm
    explain: |
      **What exponential and logarithm functions are.** The exponential $e^x$ has base $e\approx2.718$. The natural logarithm $\ln x$ asks which power of $e$ equals $x$; it is defined for positive $x$.

      **How it works.** Their derivatives are $(e^x)'=e^x$ and $(\ln x)'=1/x$. The first function's rate equals its value. The logarithm undoes the exponential, so its rate gets smaller as $x$ grows. For example, $\ln 1=0$ because $e^0=1$. For positive $w$, $1/w$ decreases as $w$ grows, so the derivative of $\ln w$ gets smaller too.

      Sine and cosine are functions of an angle. Their derivatives are $(\sin x)'=\cos x$ and $(\cos x)'=-\sin x$. These rules can be used term by term in sums.

      **Why this is useful.** A later network can use an exponential formula to turn a score into a probability; its derivative is needed to train that output.
    worked: |
      This example shows the exponential and logarithm rules on functions of a model weight.

      1. For $f(w)=e^w$, $f'(w)=e^w$, so at $w=0$ the slope is 1.
      2. For $g(w)=\ln w$, $g'(w)=1/w$, so at $w=2$ the slope is $1/2$.
      3. For $q(w)=e^w+\ln w$, add the two derivatives: $q'(w)=e^w+1/w$. At $w=1$, the slope is $e+1$.

      Each term uses its own rule; the sum rule combines them.
    problems:
      [
        der-exp-log-basics,
        derp-exp-log-mix,
        derp-ln-slope,
        derp-exp-slope,
        derp-ln-meaning,
        derp-sin-cos,
        derp-tank-level,
      ]
  - id: der-product-quotient
    title: Products and quotients
    explain: |
      **What the product and quotient rules are.** The product rule differentiates two changing factors: $(uv)'=u'v+uv'$. The quotient rule differentiates a ratio: $(u/v)'=(u'v-uv')/v^2$.

      **How it works.** The house loss is the product of two equal errors, $L(w)=r(w)r(w)$, where $r(w)=12w-330$. Its derivative is $r'r+rr'=12r+12r=24r$. At $w=25$, this gives $24(-30)=-720$. Both factors change, so both contributions count.

      The quotient rule matters when a prediction error is divided by a changing quantity. It keeps the change in both numerator and denominator; multiplying their derivatives would be wrong.

      **Why this is useful.** The product rule gives the slope of squared house-price error by accounting for both copies of the price miss.
    worked: |
      This example shows the product rule on squared house-price error.

      For $L(w)=(12w-330)(12w-330)$, name both factors $u=v=12w-330$. Then $u'=v'=12$.

      $$L'(w)=u'v+uv'=12(12w-330)+(12w-330)12=24(12w-330).$$

      At $w=25$, this is $24(-30)=-720$. The product rule agrees with differentiating the expanded polynomial.
    problems:
      [
        der-product-quotient-basics,
        derp-product-expr,
        derp-product-value,
        derp-why-not-multiply,
        derp-quotient-expr,
        derp-which-rule,
        derp-rectangle-rate,
      ]
final: der-explain
summary: |
  - A derivative is a local rate of change, found as the limit of average rates over smaller input nudges.
  - Power, exponential, logarithm, product and quotient rules give exact derivatives for common functions.
  - For the house loss $L(w)=(12w-330)^2$, the slope at $w=25$ is $-720$.

  **Next:** Loss functions compare how squared and absolute price errors respond to different house-price mistakes.
