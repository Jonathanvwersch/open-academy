concept: experimental-design
version: 1
objective: |
  **Goal:** test whether a change to a model really helps, by comparing it with a baseline, changing one thing at a time, designing an ablation that removes one part at a time, and checking any gap against the spread across random seeds.
recap:
  - concept: train-test-split
    text: "We split the data before training. The training set fits the weights, the validation set chooses between models and their hyperparameters, such as the learning rate, and the test set scores the final model once."
where_this_fits: |
  ### What is experimental design?

  Experimental design is how we plan the training runs that test a change to a model, so that their results tell us whether the change really helped. It decides what we compare against, what we keep fixed, which parts we take out to test them, and how many times we repeat each run.

  It's useful because a single score can mislead. Suppose a new price model gets a validation error of 400. That might be a big step forward, or worse than a model we already had. Longer training or trying more learning rates can improve the score. Random choices can also favour one attempt. Careful experiments help us separate these effects.
knowledge_points:
  - id: ed-baseline
    title: "Compare with reference models"

    tldr: |
      - A score on its own doesn't say whether a model is any good.
      - So we compare it with a baseline, a reference model scored in the same way.
      - We usually use two: the simplest sensible model and the previous best.
      - A new model is an improvement only if it beats the previous best.
    explain: |
      ### A score needs something to compare with

      In the training and evaluation splits lesson, we scored house-price models by their validation error, the average squared error on the validation sales. Throughout this lesson we'll use one invented example. We have 1,000 past sales, split into 700 training, 150 validation and 150 test sales, with prices in thousands of pounds.

      We build a new model, which we'll call **model N**. It's a linear regression model that uses four inputs: a house's size, its number of bedrooms, its age and its distance to the station. Its validation error is 400. Is that good?

      We can't tell yet. If a model that ignores the houses altogether also scores about 400, N has no clear advantage over it on these sales. We need something to compare N with.

      ### Two baselines

      A **baseline** is a reference model fitted on the same training data and scored on the same validation data as the new model. It gives the new score a comparison. We usually use two kinds.

      - **The simplest sensible model.** In the loss functions lesson, we saw that the best constant prediction under squared error is the mean. This baseline predicts the mean training price for every house. Fitting it takes one mean calculation.
      - **The previous best.** This is the best model that we, or others, already have for the task. Here it's a line model that uses only a house's size.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" aria-label="Validation errors of three house-price models on the same validation sales. The mean baseline, which predicts the mean training price for every house, scores 2500. The size-only line scores 500. Model N scores 400, so its bar is the shortest.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="10" y="50">mean baseline</text>
      <rect x="130" y="30" width="200" height="30" fill="#737373" fill-opacity="0.25" stroke="#737373" stroke-width="2"/>
      <text x="338" y="50">2500</text>
      <text x="10" y="100">size-only line</text>
      <rect x="130" y="80" width="40" height="30" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
      <text x="178" y="100">500</text>
      <text x="10" y="150">model N</text>
      <rect x="130" y="130" width="32" height="30" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/>
      <text x="170" y="150">400</text>
      <path d="M130 22 V172" stroke="#d4d4d4" stroke-width="1.5"/>
      <text x="130" y="190" fill="#737373" font-size="13">validation error</text>
      </g>
      </svg>
      ```

      N beats both references on these validation sales. Its gap from the previous best is 100. The next steps check whether unequal training or random choices could explain a gap.

      Be careful not to compare a new model only with a weak baseline. A model can beat the mean predictor by a wide margin and still be worse than the model we already had.
    worked: |
      First we'll use separate toy sales to show how a mean baseline gets an error score. These are separate from the 1,000 sales above. Then we'll return to the earlier scores on the full validation set.

      1. **Find the mean training price.** The toy baseline predicts one price for every house. Say three training sales sold for 100, 200 and 300.
         $$\frac{100+200+300}{3}=200$$

      2. **Score the baseline on the toy validation sales.** Say two validation sales sold for 170 and 230. Predicting 200 gives errors of 30 and -30. Their average squared error is:
         $$\frac{30^2+(-30)^2}{2}=900$$

      3. **Compare N with the previous best.** Return to the full set of 150 validation sales. N's earlier score was 400 and the size-only line's was 500. We reuse those scores here.
         $$500-400=100$$

      4. **Give the improvement as a share of the previous best's error.** This tells us what fraction of that reference error was removed.
         $$\frac{100}{500}=0.2=20\%$$

      On the full validation set, N lowers the previous best's error by 100, or 20%.
    problems:
      - ed-baseline-basics
      - edp-baseline-self-explain
      - edp-which-baseline
      - edp-mean-baseline-template
      - edp-improvement-template
      - edp-percent
      - edp-weak-baseline
      - edp-robot-baseline
  - id: ed-one-change
    title: "Change one thing at a time"

    tldr: |
      - When two runs differ in several ways, we can't tell which difference changed the score.
      - So a fair comparison changes only the thing we're testing.
      - The data split, the training length and the tuning stay the same.
      - We tune on the validation set and use the test set once, at the end.
    explain: |
      ### Several changes at once

      We found a gap of 100 between N and our size-only line. A colleague compared N with an earlier version of that line and reported 150. Their comparison changed more than the inputs.

      Each row reports a model's best validation error after trying learning rates. "Steps" is the training length for each try. A row with 5 rates means five separate training runs, followed by choosing the rate with the lowest validation error.

      | Run | Steps | Rates tried | Error |
      | --- | --- | --- | --- |
      | colleague's size-only line | 200 | 1 | 550 |
      | model N | 2,000 | 5 | 400 |
      | our size-only line | 2,000 | 5 | 500 |

      The colleague gave the line 200 steps and kept the first rate tried. Each of N's five tries got 2,000 steps. The gap mixes new inputs, longer training and more tuning.

      ### Keep everything else the same

      A **controlled experiment** changes one thing while keeping other choices fixed. This helps us separate its effect. The choices held fixed are **controlled variables**. Here they include:

      - the same training, validation and test sales;
      - the same number of training steps;
      - the same five learning-rate values tried for each model.

      Each model picks its own best rate by validation error. Our rerun of the size-only line scored 500 with these settings. This is the reference for comparing inputs. We check random variation in step 4.

      ### Tune on validation, test once

      As in the training and evaluation splits lesson, validation error chooses hyperparameters. Trying more settings gives more chances to fit quirks of these validation sales. That is useful for choosing settings, but the chosen score can be too optimistic about new sales. Save the test set for one final score after all choices.

      Be careful not to give the new model more tuning. A lower best validation score could come from the extra tries.
    worked: |
      Let's separate the colleague's gap of 150 using the three rows in the table.

      1. **List what differs between the colleague's two runs.** The inputs differ, and so do the training steps, 200 against 2,000, and the learning rates tried, 1 against 5.

      2. **Rerun the size-only line with N's training settings.** Train it for 2,000 steps at each of the same five rates. Choose its best rate by validation error. It scores 500.

      3. **Find the gap with matched training settings.**
         $$500-400=100$$

      4. **Find the change from matching training and tuning.**
         $$550-500=50$$

      Matching training and tuning reduces the gap by 50. These rows do not separate the effects of training length and tuning. The remaining gap of 100 is evidence for the new inputs, which we still need to check across repeated runs.
    problems:
      - ed-one-change-basics
      - edp-one-change-self-explain
      - edp-fair-run
      - edp-fair-gain-template
      - edp-two-changes
      - edp-tune-which-set
      - edp-extra-tuning
      - edp-robot-control
  - id: ed-ablation
    title: "Remove an input and compare"

    tldr: |
      - Model N adds three inputs to the size-only line.
      - To see what one of them adds, we remove it, retrain and keep everything else the same.
      - This experiment is called an ablation.
      - The rise in validation error when a part is removed shows how much that part helps.
    explain: |
      ### Which part helps?

      Model N adds three inputs to the size-only line: bedrooms, age and distance to the station. Together they lower the validation error from 500 to 400. Does each input help? An input that adds nothing still has to be collected, so we'd like to know which ones we could drop. The **full model** is N with all four inputs, including size.

      ### Remove one part at a time

      An **ablation** removes or switches off one part of a method and measures the change in its score. A part can be an input or a training stage, such as a second round of training on extra data. We train again with that part removed. The remaining weights are fitted again and can change.

      To design an ablation:

      1. List the parts of the method. For N, these are its three added inputs.
      2. Remove one added input. Keep size and the other two inputs. Keep the split and training length fixed. If the removed part is a training stage, training gets shorter, so keep the other stages unchanged.
      3. Try the same five rates for each model. Let each choose its own best rate on validation data, then compare errors.

      For an error, a worse result is a higher one, so we measure the rise:
      $$\text{rise}=\text{error without the part}-\text{error of the full model}$$

      A big rise suggests the part helps. A rise near zero suggests little benefit. A negative rise means removing it lowered the error.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" aria-label="Ablation of model N, whose full validation error is 400. Removing bedrooms gives 435, a rise of 35. Removing age gives 405, a rise of 5. Removing distance to the station gives 420, a rise of 20. The bedrooms bar is the longest.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="10" y="22" fill="#f59e0b">full model N: validation error 400</text>
      <text x="10" y="60">without bedrooms</text>
      <rect x="150" y="40" width="175" height="28" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
      <text x="333" y="60">+35</text>
      <text x="10" y="105">without age</text>
      <rect x="150" y="85" width="25" height="28" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
      <text x="183" y="105">+5</text>
      <text x="10" y="150">without distance</text>
      <rect x="150" y="130" width="100" height="28" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
      <text x="258" y="150">+20</text>
      <path d="M150 34 V172" stroke="#d4d4d4" stroke-width="1.5"/>
      <text x="150" y="192" fill="#737373" font-size="13">rise in validation error</text>
      </g>
      </svg>
      ```

      Removing the bedrooms input gives the biggest rise, 35. Removing age gives 5. These are effects with the other inputs present. They need not add to 100 because inputs can help with some of the same predictions. The next step checks random variation.

      Be careful to remove only one part in each run. If we removed bedrooms and age together, the rise would mix both effects, which is the same problem as the colleague's comparison.
    worked: |
      Let's design the ablation of model N and read its results.

      1. **List the parts.** N adds bedrooms, age and distance to the station to the size-only line.

      2. **Plan three comparisons.** Each smaller model keeps size and two of the three added inputs. Use the same split and train for 2,000 steps at each of the same five rates. Each model chooses its own best rate on validation data.

      3. **Find each rise.** Subtract the full model's 400 from each error.

         | Removed input | Error | Rise |
         | --- | --- | --- |
         | bedrooms | 435 | 35 |
         | age | 405 | 5 |
         | distance | 420 | 20 |

      4. **Rank the parts.** The bigger the rise, the more that input helps.
         Bedrooms has a rise of 35, distance 20 and age 5.

      The bedrooms input helps most in this comparison, with the other inputs present. We have only one selected result per model. Could random choices produce a gap of 5? The next step checks that.
    problems:
      - ed-ablation-basics
      - edp-ablation-self-explain
      - edp-rise-template
      - edp-most-important
      - edp-design-ablation
      - edp-ablation-from-errors
      - edp-rise-near-zero
      - edp-switch-off-step
  - id: ed-seeds
    title: "Repeat with different random choices"

    tldr: |
      - Training makes some random choices, so the same run can score a little differently each time.
      - A random seed is a number that fixes those choices.
      - We run each model with several seeds and look at how much its scores spread.
      - A gap larger than both models' spreads, with consistent wins, is stronger evidence.
    explain: |
      ### The same run, a different score

      Some choices in training are random. The held-out sales were picked at random in the training and evaluation splits lesson. Starting weights can also be chosen at random. A **random seed** is a starting number that fixes these choices. Repeating the same model and settings with the same seed repeats those choices. Different seeds give different choices and scores.

      Keep the 150 test sales aside. Each seed splits the other 850 sales into training and validation sets and chooses starting weights. Within a seed, every model uses the same split and tuning effort. Across seeds, both the split and starting weights change.

      ### Compare averages and variation

      We repeat N and two ablations with three matching seeds. Three keeps the example short. We focus on age and bedrooms to compare a small gap with a larger one. Each table row matches results from one seed.

      | Seed | N | No age | No bedrooms |
      | --- | --- | --- | --- |
      | 1 | 400 | 405 | 435 |
      | 2 | 390 | 385 | 420 |
      | 3 | 410 | 425 | 450 |

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" aria-label="Validation errors over three seeds. Each model lists seeds 1, 2 and 3 in that order. Full model N: 400, 390 and 410, mean 400. Without age: 405, 385 and 425, mean 405. Without bedrooms: 435, 420 and 450, mean 435. Dot positions show validation error. Use the accompanying seed table to match results. The full model and the model without age overlap a lot. The model without bedrooms sits to the right of every full-model result.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="10" y="65">full model N</text>
      <path d="M172.5 60 H237.5" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="205.0" cy="60" r="6" fill="#f59e0b"/>
      <circle cx="172.5" cy="60" r="6" fill="#f59e0b"/>
      <circle cx="237.5" cy="60" r="6" fill="#f59e0b"/>
      <path d="M205 46 V74" stroke="#171717" stroke-width="2"/>
      <text x="205" y="40" text-anchor="middle" font-size="13">mean 400</text>
      <text x="10" y="125">without age</text>
      <path d="M156.25 120 H286.25" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="221.25" cy="120" r="6" fill="#3b82f6"/>
      <circle cx="156.25" cy="120" r="6" fill="#3b82f6"/>
      <circle cx="286.25" cy="120" r="6" fill="#3b82f6"/>
      <path d="M221.25 106 V134" stroke="#171717" stroke-width="2"/>
      <text x="221.25" y="100" text-anchor="middle" font-size="13">mean 405</text>
      <text x="10" y="185">without bedrooms</text>
      <path d="M270.0 180 H367.5" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="318.75" cy="180" r="6" fill="#3b82f6"/>
      <circle cx="270.0" cy="180" r="6" fill="#3b82f6"/>
      <circle cx="367.5" cy="180" r="6" fill="#3b82f6"/>
      <path d="M318.75 166 V194" stroke="#171717" stroke-width="2"/>
      <text x="318.75" y="160" text-anchor="middle" font-size="13">mean 435</text>
      <path d="M140 235 H400" stroke="#d4d4d4" stroke-width="1.5"/>
      <path d="M140.0 235 V241" stroke="#d4d4d4" stroke-width="1.5"/><text x="140.0" y="258" text-anchor="middle" fill="#737373" font-size="13">380</text>
      <path d="M205.0 235 V241" stroke="#d4d4d4" stroke-width="1.5"/><text x="205.0" y="258" text-anchor="middle" fill="#737373" font-size="13">400</text>
      <path d="M270.0 235 V241" stroke="#d4d4d4" stroke-width="1.5"/><text x="270.0" y="258" text-anchor="middle" fill="#737373" font-size="13">420</text>
      <path d="M335.0 235 V241" stroke="#d4d4d4" stroke-width="1.5"/><text x="335.0" y="258" text-anchor="middle" fill="#737373" font-size="13">440</text>
      <path d="M400.0 235 V241" stroke="#d4d4d4" stroke-width="1.5"/><text x="400.0" y="258" text-anchor="middle" fill="#737373" font-size="13">460</text>
      <text x="210" y="282" text-anchor="middle" fill="#737373" font-size="13">validation error (dot = one seed, black mark = mean)</text>
      </g>
      </svg>
      ```

      The dots show scores. Use the table to match seeds. A model's **spread** is its largest score minus its smallest. For N it is $410-390=20$.

      Removing age raises the mean by 5, below both models' spreads, and improves the score on seed 2. Removing bedrooms raises the mean by 35, above both models' spreads, and worsens every seed.

      For a rough, cautious check, calculate each model's spread separately. Call a gap clear under this check only when it exceeds both spreads and one model wins on all or nearly all seeds. This can miss small, consistent gains. If unclear, try more seeds or report no clear difference.

      Be careful not to report the best seed. The luckiest of several runs makes a model look better than a typical run of it would be.
    worked: |
      Let's check both ablations using the seed table.

      1. **Average N over its seeds.**
         $$\frac{400+390+410}{3}=400$$

      2. **Average the model without age.**
         $$\frac{405+385+425}{3}=405$$

      3. **Average the model without bedrooms.**
         $$\frac{435+420+450}{3}=435$$

      4. **Find each spread.** Subtract the smallest score from the largest.

         | Model | Calculation | Spread |
         | --- | --- | --- |
         | N | 410 - 390 | 20 |
         | No age | 425 - 385 | 40 |
         | No bedrooms | 450 - 420 | 30 |

      5. **Compare each mean with N's mean.** The age gap is 405 - 400 = 5. The bedrooms gap is 435 - 400 = 35. Compare 5 with spreads 20 and 40, and 35 with spreads 20 and 30.

      6. **Check matching seeds.** Subtract N's score in each row.

         | Seed | No age minus N | No bedrooms minus N |
         | --- | --- | --- |
         | 1 | 5 | 35 |
         | 2 | -5 | 30 |
         | 3 | 15 | 40 |

      Keeping bedrooms wins on all three seeds. Removing age wins on one and loses on two, so its effect is unclear. We still need repeated comparisons with the size-only baseline and the distance ablation before choosing the final model. After choosing, score it once on the 150 test sales.
    problems:
      - ed-seeds-basics
      - edp-seeds-self-explain
      - edp-spread-template
      - edp-gap-template
      - edp-believe-gap
      - edp-best-seed
      - edp-final-test
      - edp-robot-seeds
final: ed-explain
summary: |
  - A baseline is a reference model fitted on the same training data and scored on the same validation data as a new model. Compare with the simplest sensible model and the previous best. Count a win over the previous best as an improvement to check further.
  - A controlled experiment changes only the thing being tested. Keep the data split, the training length and the tuning effort the same, choose hyperparameters on the validation set and score the final model once on the test set.
  - An ablation removes one part of a method at a time, keeps everything else the same and measures the rise in error: $\text{rise}=\text{error without the part}-\text{error of the full model}$.
  - A random seed fixes a run's random choices. Compare models on matching seeds. Calculate each model's spread separately. A mean gap larger than both spreads, with consistent wins, is stronger evidence of an improvement.

  **Next:** Images as tensors shows how a picture becomes a grid of numbers. This gives us new inputs whose effects we can test with these comparisons.
