concept: experimental-design
version: 1
objective: |
  **Goal:** test whether a change to a model really helps, by comparing it with a baseline, changing one thing at a time, designing an ablation that removes one part at a time, and checking any gap against the spread across random seeds.
recap:
  - concept: train-test-split
    text: "We split the data before training. The training set fits the weights, the validation set chooses between models and their hyperparameters, such as the learning rate, and the test set scores the final model once."
where_this_fits: |
  ### What is experimental design?

  Experimental design is how we plan the training runs that test a change to a model, so that their results tell us whether the change really helped. It decides what we compare against, what we keep fixed, which parts we take out to test them, and how many times we repeat each run.

  It's useful because a single score can mislead. Suppose a new price model gets a validation error of 400. That might be a big step forward, or worse than a model we already had. Longer training, extra tuning or a lucky run can also make a change look better than it is. Careful experiments tell us which parts of a model help, and by how much.
knowledge_points:
  - id: ed-baseline
    title: "Compare with a simple baseline"

    tldr: |
      - A score on its own doesn't say whether a model is any good.
      - So we compare it with a baseline, a reference model scored in the same way.
      - We usually use two: the simplest sensible model and the previous best.
      - A new model is an improvement only if it beats the previous best.
    explain: |
      ### A score needs something to compare with

      In the training and evaluation splits lesson, we scored house-price models by their validation error, the average squared error on sales kept out of training. Throughout this lesson we'll use one invented example. We have 1,000 past sales, split into 700 training, 150 validation and 150 test sales, with prices in thousands of pounds.

      We build a new model, which we'll call **model N**. It's a line model that uses four inputs: a house's size, its number of bedrooms, its age and its distance to the station. Its validation error is 400. Is that good?

      We can't tell yet. If a model that ignores the houses altogether also scores about 400, then N has learned almost nothing. So before we believe any result, we need something to compare it with.

      ### Two baselines

      A **baseline** is a reference model that we train and score in the same way as the new one, so that the gap between their scores shows what the new model adds. We usually use two kinds.

      - **The simplest sensible model.** In the loss functions lesson, we saw that the simplest model predicts the same number every time, and that under squared error the best such number is the mean. So this baseline predicts the mean training price for every house.
      - **The previous best.** This is the best model that we, or others, already have for the task. Here it's a line model that uses only a house's size.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" aria-label="Validation errors of three house-price models on the same validation sales. The mean baseline, which predicts the mean training price for every house, scores 2500. The size-only line scores 500. Model N scores 400, so its bar is the shortest.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="10" y="50">mean baseline</text>
      <rect x="130" y="30" width="200" height="30" fill="#737373" fill-opacity="0.25" stroke="#737373" stroke-width="2"/>
      <text x="338" y="50">2500</text>
      <text x="10" y="100">size-only line</text>
      <rect x="130" y="80" width="40" height="30" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
      <text x="178" y="100">500</text>
      <text x="10" y="150">model N</text>
      <rect x="130" y="130" width="32" height="30" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/>
      <text x="170" y="150">400</text>
      <path d="M130 22 V172" stroke="#d4d4d4" stroke-width="1.5"/>
      <text x="130" y="190" fill="#737373" font-size="13">validation error</text>
      </g>
      </svg>
      ```

      The mean baseline scores 2500, the size-only line scores 500 and N scores 400. Beating the mean baseline shows that N has learned something from its inputs. But the size-only line had already done that, so the real question is whether N beats 500. It does, by 100.

      Be careful not to compare a new model only with a weak baseline. A model can beat the mean predictor by a wide margin and still be worse than the model we already had.
    worked: |
      Let's see where a mean baseline's error comes from, using a tiny made-up set of sales, and then measure how much model N improves on the previous best.

      1. **Find the mean training price.** The mean baseline predicts this one number for every house. Say three training sales sold for 300, 400 and 500.
         $$\frac{300+400+500}{3}=400$$

      2. **Score the baseline on the validation sales.** Say two validation sales sold for 350 and 450. Each error is the prediction minus the price, so the errors are $400-350=50$ and $400-450=-50$.
         $$\frac{50^2+(-50)^2}{2}=\frac{2500+2500}{2}=2500$$

      3. **Compare N with the previous best.** On the same validation sales, N scores 400 and the size-only line scores 500.
         $$500-400=100$$

      4. **Give the improvement as a share of the previous best's error.** This makes it easier to compare with results on other tasks.
         $$\frac{100}{500}=0.2=20\%$$

      So N lowers the previous best's validation error by 100, or 20%. It is 2100 lower than the mean baseline, but that bigger number says less, because beating the mean predictor is the least we expect from a model that uses the inputs.
    problems:
      - ed-baseline-basics
      - edp-baseline-self-explain
      - edp-which-baseline
      - edp-mean-baseline-template
      - edp-improvement-template
      - edp-percent
      - edp-weak-baseline
      - edp-robot-baseline
  - id: ed-one-change
    title: "Change one thing at a time"

    tldr: |
      - When two runs differ in several ways, we can't tell which difference changed the score.
      - So a fair comparison changes only the thing we're testing.
      - The data split, the training length and the tuning stay the same.
      - We tune on the validation set and use the test set once, at the end.
    explain: |
      ### Several changes at once

      In the last step, we found that model N beats the size-only line by 100. A colleague had first reported a gap of 150. When we looked at their runs, the two models differed in more than their inputs. Here "steps" counts gradient descent steps, "rates tried" counts the learning rates tried, and "error" is validation error.

      | Run | Steps | Rates tried | Error |
      | --- | --- | --- | --- |
      | colleague's size-only line | 200 | 1 | 550 |
      | model N | 2,000 | 5 | 400 |
      | our size-only line | 2,000 | 5 | 500 |

      The colleague stopped their size-only line after 200 steps and kept the first learning rate they tried. Model N trained for 2,000 steps and used the best of 5 learning rates. So their gap of 150 mixes three changes, and we can't tell how much of it came from the new inputs.

      ### Keep everything else the same

      A **controlled experiment** changes only the thing being tested and keeps every other choice the same, so any change in the result comes from that one difference. The choices we hold fixed are called **controlled variables**. When we compare models, they include:

      - the same training, validation and test sales;
      - the same number of training steps, or the same rule for when to stop;
      - the same tuning effort, such as the same number of learning rates tried.

      Our size-only line got the same 2,000 steps and 5 learning rates as N, and it scored 500. So the fair previous best is 500.

      ### Tune on validation, test once

      As in the training and evaluation splits lesson, each model's hyperparameters are chosen by validation error, here with the same number of tries for every model. The test set is used once, on the final model, after every comparison is finished. If we used it to choose between versions, its score would come out too good, just like a validation score.

      Be careful not to give the new model more tuning than the baseline. More tries at the learning rate can lower any model's error, which makes the new idea look better than it is.
    worked: |
      Let's work out how much of the colleague's gap of 150 came from N's new inputs, using the three runs in the table.

      1. **List what differs between the colleague's two runs.** The inputs differ, and so do the training steps, 200 against 2,000, and the learning rates tried, 1 against 5.

      2. **Rerun the size-only line with N's training settings.** It now trains for 2,000 steps with the best of 5 learning rates, so the inputs are the only difference. It scores 500.

      3. **Find the gap that comes from the new inputs.**
         $$500-400=100$$

      4. **Find the part that came from the unequal training.**
         $$550-500=50$$

      So 100 of the reported 150 comes from N's new inputs, and the other 50 came from training the old model for less time with less tuning.
    problems:
      - ed-one-change-basics
      - edp-one-change-self-explain
      - edp-fair-run
      - edp-fair-gain-template
      - edp-two-changes
      - edp-tune-which-set
      - edp-extra-tuning
      - edp-robot-control
  - id: ed-ablation
    title: "Remove one part to test it"

    tldr: |
      - Model N adds three inputs to the size-only line.
      - To see what one of them adds, we remove it, retrain and keep everything else the same.
      - This experiment is called an ablation.
      - The rise in validation error when a part is removed shows how much that part helps.
    explain: |
      ### Which part helps?

      Model N adds three inputs to the size-only line: bedrooms, age and distance to the station. Together they lower the validation error from 500 to 400. But does each input help, or does one of them do all the work? An input that adds nothing still has to be collected for every house, so we'd like to know which ones we could drop.

      ### Remove one part at a time

      An **ablation** is an experiment that removes or switches off one part of a method, keeps everything else the same and measures how much worse the result gets. A part can be an input, like bedrooms, or a step in how we prepare the data or train, such as filling in missing house sizes. Switching off a step means training without it.

      To design an ablation:

      1. List the parts of the method. For N, these are its three added inputs.
      2. Plan one run for each part, with only that part removed. Everything else stays as in the full model, including the split, the training steps and the tuning.
      3. Score each run on the validation set and compare it with the full model.

      For an error, a worse result is a higher one, so we measure the rise:
      $$\text{rise}=\text{error without the part}-\text{error of the full model}$$

      A big rise means the model relies heavily on that part. A rise near zero means the part may not help at all.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" aria-label="Ablation of model N, whose full validation error is 400. Removing bedrooms gives 435, a rise of 35. Removing age gives 405, a rise of 5. Removing distance to the station gives 420, a rise of 20. The bedrooms bar is the longest.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="10" y="22" fill="#f59e0b">full model N: validation error 400</text>
      <text x="10" y="60">without bedrooms</text>
      <rect x="150" y="40" width="175" height="28" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
      <text x="333" y="60">+35</text>
      <text x="10" y="105">without age</text>
      <rect x="150" y="85" width="25" height="28" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
      <text x="183" y="105">+5</text>
      <text x="10" y="150">without distance</text>
      <rect x="150" y="130" width="100" height="28" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
      <text x="258" y="150">+20</text>
      <path d="M150 34 V172" stroke="#d4d4d4" stroke-width="1.5"/>
      <text x="150" y="192" fill="#737373" font-size="13">rise in validation error</text>
      </g>
      </svg>
      ```

      Removing bedrooms raises the error the most, by 35, so bedrooms helps the most. Removing age raises it by only 5.

      Be careful to remove only one part in each run. If we removed bedrooms and age together, the rise would mix both effects, which is the same problem as the colleague's comparison.
    worked: |
      Let's design the ablation of model N and read its results.

      1. **List the parts.** N adds bedrooms, age and distance to the station to the size-only line.

      2. **Plan three runs.** Each run removes one of those inputs and keeps the other two. All three use the same split, 2,000 steps and the best of 5 learning rates, just like the full model.

      3. **Find each rise.** The full model's validation error is 400, and the runs without bedrooms, age and distance score 435, 405 and 420.
         $$435-400=35,\qquad 405-400=5,\qquad 420-400=20$$

      4. **Rank the parts.** The bigger the rise, the more that input helps.
         $$\text{bedrooms }(35)>\text{distance }(20)>\text{age }(5)$$

      So bedrooms helps the most and age the least. But a rise of 5 is small, and we've only trained each model once. Could one lucky or unlucky run produce a gap that size? The next step answers that.
    problems:
      - ed-ablation-basics
      - edp-ablation-self-explain
      - edp-rise-template
      - edp-most-important
      - edp-design-ablation
      - edp-ablation-from-errors
      - edp-rise-near-zero
      - edp-switch-off-step
  - id: ed-seeds
    title: "Repeat each run several times"

    tldr: |
      - Training makes some random choices, so the same run can score a little differently each time.
      - A random seed is a number that fixes those choices.
      - We run each model with several seeds and look at how much its scores spread.
      - We believe a gap between two models only when it is clearly bigger than that spread.
    explain: |
      ### The same run, a different score

      Some choices in training are random. In the training and evaluation splits lesson, the held-out sales were picked at random, and gradient descent often starts from randomly chosen weights. A computer makes these choices from a starting number called a **random seed**. The same seed gives the same choices every time, so a run can be repeated exactly. A different seed gives different choices, and so a slightly different score.

      In our example, the 150 test sales stay fixed and set aside. The seed decides which of the other 850 sales go into training and which into validation, and the weights gradient descent starts from.

      ### Gap against spread

      We trained the full model N and two of its ablations with three seeds each, using the same three seeds for every model.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" aria-label="Validation errors over three seeds. Full model N: 400, 390 and 410, mean 400. Without age: 405, 385 and 425, mean 405. Without bedrooms: 435, 420 and 450, mean 435. The full model and the model without age overlap a lot. The model without bedrooms sits to the right of every full-model result.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="10" y="65">full model N</text>
      <path d="M172.5 60 H237.5" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="205.0" cy="60" r="6" fill="#f59e0b"/>
      <circle cx="172.5" cy="60" r="6" fill="#f59e0b"/>
      <circle cx="237.5" cy="60" r="6" fill="#f59e0b"/>
      <path d="M205 46 V74" stroke="#171717" stroke-width="2"/>
      <text x="205" y="40" text-anchor="middle" font-size="13">mean 400</text>
      <text x="10" y="125">without age</text>
      <path d="M156.25 120 H286.25" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="221.25" cy="120" r="6" fill="#3b82f6"/>
      <circle cx="156.25" cy="120" r="6" fill="#3b82f6"/>
      <circle cx="286.25" cy="120" r="6" fill="#3b82f6"/>
      <path d="M221.25 106 V134" stroke="#171717" stroke-width="2"/>
      <text x="221.25" y="100" text-anchor="middle" font-size="13">mean 405</text>
      <text x="10" y="185">without bedrooms</text>
      <path d="M270.0 180 H367.5" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="318.75" cy="180" r="6" fill="#3b82f6"/>
      <circle cx="270.0" cy="180" r="6" fill="#3b82f6"/>
      <circle cx="367.5" cy="180" r="6" fill="#3b82f6"/>
      <path d="M318.75 166 V194" stroke="#171717" stroke-width="2"/>
      <text x="318.75" y="160" text-anchor="middle" font-size="13">mean 435</text>
      <path d="M140 235 H400" stroke="#d4d4d4" stroke-width="1.5"/>
      <path d="M140.0 235 V241" stroke="#d4d4d4" stroke-width="1.5"/><text x="140.0" y="258" text-anchor="middle" fill="#737373" font-size="13">380</text>
      <path d="M205.0 235 V241" stroke="#d4d4d4" stroke-width="1.5"/><text x="205.0" y="258" text-anchor="middle" fill="#737373" font-size="13">400</text>
      <path d="M270.0 235 V241" stroke="#d4d4d4" stroke-width="1.5"/><text x="270.0" y="258" text-anchor="middle" fill="#737373" font-size="13">420</text>
      <path d="M335.0 235 V241" stroke="#d4d4d4" stroke-width="1.5"/><text x="335.0" y="258" text-anchor="middle" fill="#737373" font-size="13">440</text>
      <path d="M400.0 235 V241" stroke="#d4d4d4" stroke-width="1.5"/><text x="400.0" y="258" text-anchor="middle" fill="#737373" font-size="13">460</text>
      <text x="210" y="282" text-anchor="middle" fill="#737373" font-size="13">validation error (dot = one seed, black mark = mean)</text>
      </g>
      </svg>
      ```

      The **spread** of a model's results is its largest result minus its smallest. For the full model it's $410-390=20$. Removing age raises the mean error by only 5, which is much smaller than that spread, and on the second seed the model without age even does better. So the rise of 5 could easily be luck. Removing bedrooms raises the mean by 35, which is more than the spread of either model, and that model is worse on every seed. That gap we can believe.

      This gives a rough rule. Run each model with several seeds, the same seeds for each. Believe a gap between their mean results only when it is clearly larger than the spread of either model's results, and when one model wins on all or nearly all of the seeds. Otherwise, run more seeds or report that there is no clear difference.

      Be careful not to report the best seed. The luckiest of several runs makes a model look better than a typical run of it would be.
    worked: |
      Let's check both ablation gaps against the spread, using the three seeds from the picture.

      1. **Average each model over its seeds.** The full model, the model without age and the model without bedrooms have these means.
         $$\frac{400+390+410}{3}=400,\qquad\frac{405+385+425}{3}=405,\qquad\frac{435+420+450}{3}=435$$

      2. **Find each model's spread.** Take the largest result minus the smallest.
         $$410-390=20,\qquad 425-385=40,\qquad 450-420=30$$

      3. **Find each gap from the full model.** We subtract the full model's mean.
         $$405-400=5,\qquad 435-400=35$$

      4. **Compare each gap with the spreads, and check seed by seed.** The gap of 5 is smaller than both spreads involved, 20 and 40, and seed by seed the model without age is worse by 5, better by 5 and worse by 15. The gap of 35 is bigger than both spreads involved, 20 and 30, and the model without bedrooms is worse on every seed, by 35, 30 and 40.

      So bedrooms clearly helps, while with three seeds we can't tell the effect of age apart from luck. When we've finished all of these comparisons on the validation set, we choose the final model and score it once on the 150 test sales.
    problems:
      - ed-seeds-basics
      - edp-seeds-self-explain
      - edp-spread-template
      - edp-gap-template
      - edp-believe-gap
      - edp-best-seed
      - edp-final-test
      - edp-robot-seeds
final: ed-explain
summary: |
  - A baseline is a reference model trained and scored in the same way as a new model. Compare with both the simplest sensible model, such as predicting the mean, and the previous best, and count only a win over the previous best as an improvement.
  - A controlled experiment changes only the thing being tested. Keep the data split, the training length and the tuning effort the same, choose hyperparameters on the validation set and score the final model once on the test set.
  - An ablation removes one part of a method at a time, keeps everything else the same and measures the rise in error: $\text{rise}=\text{error without the part}-\text{error of the full model}$.
  - A random seed fixes a run's random choices. Run each model with the same several seeds, and believe a gap between mean results only when it is clearly bigger than the spread across seeds and one model wins on nearly every seed.

  **Next:** Images as tensors shows how a picture becomes a grid of numbers that a network can read.
