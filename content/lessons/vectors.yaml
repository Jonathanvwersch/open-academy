      - vecp-subtract
      - vecp-find-scalar
  - id: vec-length-distance
    key_prereqs: []
    title: "Measure length and distance"
    tldr: |
      - A vector's length is its straight-line distance from start to end.
      - Square each component and add the squares.
      - The square root, the number whose square is that sum, gives the length.
      - Between two points, subtract their coordinates first, then measure that vector.
    explain: |
      ### How far is the robot from the dock?

      Along the grid, $(3,4)$ is $3+4=7$ metres away. But how far is it from the dock in a straight line?

      On the left of the picture, the orange arrow $(3,4)$ is the longest side of a triangle whose other two sides, 3 east and 4 north, meet at a square corner, called a right angle. **Pythagoras' rule** says the squares of the two shorter sides add up to the square of the longest. Here $3^2$, read "3 squared", means $3\times3$. So:
      $$
      \begin{aligned}
      \text{length}^2&=3^2+4^2 &&\text{apply Pythagoras' rule}\\
      &=9+16 &&\text{square each side}\\
      &=25 &&\text{add the squares}
      \end{aligned}
      $$
      The **square root** of 25, written $\sqrt{25}$, is the positive number whose square is 25. Taking it gives the length:
      $$
      \begin{aligned}
      \text{length}&=\sqrt{25} &&\text{take the square root}\\
      &=5\text{ metres} &&\text{work out the root}
      \end{aligned}
      $$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" aria-label="Left: the orange arrow (3,4) from the origin is the longest side of a right-angled triangle with shorter sides 3 and 4, so its length is 5. Right: the points p = (1,1) and q = (4,5) are joined by the orange arrow q minus p = (3,4), so the distance between them is 5">
        <defs>
          <marker id="v3-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
          <marker id="v3-amber2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="20" y="28">length of an arrow</text>
          <path d="M40 300 H260 M40 300 V70" stroke="#737373" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <path d="M40 300 L190 300" stroke="#737373" stroke-width="2" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
          <path d="M190 300 L190 100" stroke="#737373" stroke-width="2" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
          <path d="M178 300 V288 H190" stroke="#737373" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <path d="M40 300 L190 100" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#v3-amber)"/>
          <circle cx="40" cy="300" r="4" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="111" y="322" fill="#737373">3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="200" y="205" fill="#737373">4</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="112" y="232" fill="#f59e0b">length 5</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="198" y="94">(3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="380" y="28">distance between points</text>
          <path d="M360 320 H612 M360 320 V59" stroke="#737373" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <path d="M405 275 L540 275" stroke="#737373" stroke-width="2" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
          <path d="M540 275 L540 95" stroke="#737373" stroke-width="2" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
          <path d="M405 275 L540 95" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#v3-amber2)"/>
          <circle cx="405" cy="275" r="4" fill="#171717"/>
          <circle cx="540" cy="95" r="4" fill="#171717"/>
          <circle cx="360" cy="320" r="3" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="399" y="299">p = (1,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="456" y="91">q = (4,5)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="468.5" y="266" fill="#737373">3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="550" y="190" fill="#737373">4</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="462" y="160" fill="#f59e0b" text-anchor="end">q − p = (3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="462" y="180" fill="#f59e0b" text-anchor="end">distance 5</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="350" y="344">(0,0)</text>
        </g>
      </svg>
      ```

      ### The length of any vector

      For any vector, we square each component, add the squares and take the square root. Beyond two components, we take this recipe as the definition of length. This length is the **L2 norm**, written $\|x\|_2$. The double bars mean "the length of", and the 2 is for the squaring.

      $$\|x\|_2=\sqrt{x_1^2+x_2^2+\cdots+x_n^2}=\sqrt{\sum_{i=1}^{n}x_i^2}.$$

      The symbol $\sum_{i=1}^{n}$, read "the sum from $i=1$ to $n$", means we add up the term after it for every $i$ from 1 to $n$. The square root undoes the squaring, so for the robot the answer is in metres.

      Be careful not to add the components instead. For $(3,4)$, that gives the 7-metre route along the grid.

      ### The distance between two points

      On the right, the robot is at $p=(1,1)$ and a parcel at $q=(4,5)$. Subtract to find the move, then measure it:
      $$
      \begin{aligned}
      q-p&=(4-1,\;5-1) &&\text{subtract the coordinates}\\
      &=(3,4) &&\text{find the move}\\
      \|q-p\|_2&=5\text{ metres} &&\text{use the length above}
      \end{aligned}
      $$
      In general, the **Euclidean distance** between two points is the length of the move that joins them, $\|q-p\|_2$.

      ### Limitations

      Suppose two houses differ by 50 square metres and 2 bedrooms. Their contributions to the squared distance are:
      $$
      \begin{aligned}
      \text{area contribution}&=50^2 &&\text{square the area difference}\\
      &=2500 &&\text{work out the square}\\
      \text{bedroom contribution}&=2^2 &&\text{square the bedroom difference}\\
      &=4 &&\text{work out the square}
      \end{aligned}
      $$
      Area dominates, even though 2 bedrooms is a big difference. People usually first divide each measurement by a typical size, such as 100 square metres for area, so none swamps the others.
    worked: |
      Let's find how far the robot at $(3,4)$ is from the dock, and then the distance between the robot at $p=(1,1)$ and the parcel at $q=(4,5)$.

      1. **Square each component.** Pythagoras' rule works with the squares of the two sides.
         $$3^2=9,\qquad 4^2=16$$

      2. **Add the squares.** Their sum is the square of the straight-line length.
         $$9+16=25$$

      3. **Take the square root.** This undoes the squaring and gives a length in metres.
         $$\|(3,4)\|_2=\sqrt{25}=5$$

      4. **Find the move between the two points.** The distance between points is the length of the move that joins them, so we subtract first.
         $$q-p=(4-1,\;5-1)=(3,4)$$

      5. **Measure that move.** It's the same move as before, so it has the same length.
         $$\|q-p\|_2=\sqrt{3^2+4^2}=5$$

      So the robot is 5 metres from the dock, and the parcel is 5 metres from $p$.
