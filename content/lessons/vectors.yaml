          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="150" y="80" fill="#10b981">b = (2,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="188" y="220" fill="#f59e0b">a + b = (3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="272" y="75">end (3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="416" y="315">east</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="66" y="26">north</text>
