concept: vectors
version: 5
objective: |
  **Goal:** write points, moves and measurements as vectors, add and scale them, and find a vector's length and the distance between two points.
where_this_fits: |
  ### What is a vector?

  A vector is an ordered list of numbers, where each position in the list has its own meaning. We often draw one as an arrow.

  Why do we need it? Lots of things can't be described by one number. A delivery robot's position needs a distance east and a distance north, and a house needs its area, its number of bedrooms and its age. A vector keeps those numbers together and in order, so we always know which is which. A machine-learning model is a program that learns to make predictions from examples, and it reads each example as a vector. So in this lesson, we'll learn to write vectors, add them, stretch them and measure how long they are.
knowledge_points:
  - id: vec-points-moves
    key_prereqs: []
    title: "Write a move as numbers"
    tldr: |
      - A vector is an ordered list of numbers, such as distances east and north.
      - Add matching entries to combine two moves.
      - The resulting vector tells you where the two moves end.
    explain: |
      ### A robot's two moves

      A delivery robot leaves its dock, drives 1 metre east and 3 north, then 2 east and 1 north.

      On the map, the dock is at $(0,0)$, with east to the right and north up. The first move is $a=(1,3)$, the blue arrow. The second, $b=(2,1)$, is the green arrow, starting where the blue one ends. Each arrow joins the start and end of a move. The orange arrow joins the dock to the end.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" aria-label="A grid seen from above with the dock at (0,0), east to the right and north up. The blue arrow a = (1,3) goes 1 east and 3 north. The green arrow b = (2,1) starts at the tip of a. The orange arrow a + b = (3,4) goes straight from the dock to where the robot ends">
        <defs>
          <marker id="v1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
          <marker id="v1-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
          <marker id="v1-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M80 310 V70 M140 310 V70 M200 310 V70 M260 310 V70 M320 310 V70 M380 310 V70 M80 310 H380 M80 250 H380 M80 190 H380 M80 130 H380 M80 70 H380" stroke="#d4d4d4" stroke-width="1" fill="#171717" fill-opacity="0"/>
