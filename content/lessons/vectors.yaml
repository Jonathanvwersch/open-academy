concept: vectors
version: 2
objective: |
  **Goal:** read a feature vector as a point in space, add and scale vectors, and compute L2 lengths and distances.
why: |
  A delivery robot needs to combine floor moves and judge how far it is from a target. A house-price model needs to handle area, bedrooms and age together. You could write a separate rule for every coordinate or measurement, but those rules become unwieldy for images with thousands of pixel values, and mixing up their order changes their meaning. Vectors keep related numbers in a fixed order, so the same addition, scaling and distance rules work for robot positions and model inputs. The floor arrows here give you a picture of those operations before you apply them to data. You'll need them for dot product, matrices, linear regression, gradients, and coordinate frames.
knowledge_points:
  - id: vec-points-moves
    title: Points and moves as ordered numbers
    explain: |
      **Where do two floor moves take you?** Adding all their numbers into one total loses which way you moved. Use metres, with right positive and up positive: $(3,4)$ means three right and four up from the origin, the starting point $(0,0)$.

      An ordered list is a **vector**; each entry is a **component**. Picture a point, or an arrow from the origin to it. For a move, the arrow gives each direction's travel. Negative entries mean left or down.

      To combine moves, add matching components: **vector addition**. This works because horizontal travel accumulates independently of vertical travel: put the second arrow's tail at the first arrow's tip. Why this way? Matching entries preserves each direction's total; mixing them does not. Both vectors need the same number of entries, with matching meanings and units.

      A **feature vector** $(120,3,15)$ records a house's area in square metres, bedrooms and age in years: a point with three coordinates, not a floor position.

      Write $x \in \mathbb{R}^n$ to say vector $x$ has $n$ real-number entries; $\in$ means “belongs to”, and $n$ counts the entries. The notation $x_i$ means entry number $i$ of $x$.
    worked: |
      This example shows how two moves become one arrow.

      Call the moves $a=(1,2)$ and $b=(3,-1)$, both in metres.

      1. Add horizontal entries: $1+3=4$.
      2. Add vertical entries: $2+(-1)=1$.
      3. Keep the original order: $a+b=(4,1)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" aria-label="Tip-to-tail addition of (1,2) and (3,-1) gives (4,1)">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M50 180 H470 M50 180 V20" stroke="#d4d4d4" fill="#d4d4d4" fill-opacity="0"/>
      <path d="M50 180 L140 60" stroke="#10b981" stroke-width="3"/><path d="M140 60 L126 68 L138 75 Z" fill="#10b981"/>
      <path d="M140 60 L410 120" stroke="#f59e0b" stroke-width="3"/><path d="M410 120 L396 110 L394 123 Z" fill="#f59e0b"/>
      <path d="M50 180 L410 120" stroke="#3b82f6" stroke-width="3"/><path d="M410 120 L395 116 L397 129 Z" fill="#3b82f6"/>
      <text x="20" y="202">(0,0)</text><text x="55" y="85">a = (1,2)</text><text x="250" y="50">b = (3,-1)</text><text x="235" y="168">a + b = (4,1)</text><text x="440" y="202">right</text><text x="15" y="18">up</text>
      </g>
      </svg>
      ```

      The combined move ends four metres right and one metre up from where you started.
    problems: [vecp-add, vecp-add-template, vecp-feature, vecp-order, vecp-new-moves, vecp-entry]
  - id: vec-change-move
    title: Making a move longer or reversing it
    explain: |
      **How can you make $(1,2)$ twice as long without turning it?** Doubling only the first entry turns the arrow. Instead, multiply every entry by two to get $(2,4)$.

      Multiplying every component by one number is **scaling**; that number is a **scalar**. In $c x$, scalar $c$ multiplies every entry of vector $x$. This works because equal scaling preserves the proportions of horizontal and vertical travel. Why this way? Adding two to each entry need not preserve those proportions.

      A positive scalar keeps direction: two doubles length; one half halves it. Zero makes the zero vector: all entries zero, with no direction.

      A negative scalar reverses the arrow. Multiplying by $-1$ gives the move back along the same route.

      **Vector subtraction** adds a reversed arrow: subtract matching entries. For scaling followed by subtraction, scale first, then subtract component by component.
    worked: |
      This example shows how scaling and subtraction change a move.

      Use the same moves $a=(1,2)$ and $b=(3,-1)$.

      1. Double each entry: $2a=(2\cdot1,2\cdot2)=(2,4)$.
      2. Reverse each entry: $-a=(-1,-2)$.
      3. For $3a-b$, first calculate $3a=(3,6)$.
      4. Subtract matching entries: $(3,6)-(3,-1)=(3-3,6-(-1))=(0,7)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" aria-label="Scaling a to twice its length and reversing a">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M20 150 H470 M170 210 V10" stroke="#d4d4d4" fill="#d4d4d4" fill-opacity="0"/><path d="M170 150 L270 20" stroke="#3b82f6" stroke-width="3"/><path d="M270 20 L256 27 L268 35 Z" fill="#3b82f6"/><path d="M170 150 L220 85" stroke="#10b981" stroke-width="5"/><path d="M220 85 L206 92 L218 100 Z" fill="#10b981"/><path d="M170 150 L120 215" stroke="#ef4444" stroke-width="3"/><path d="M120 215 L134 208 L122 200 Z" fill="#ef4444"/>
      <text x="278" y="35">2a = (2,4)</text><text x="230" y="100">a = (1,2)</text><text x="15" y="195">-a = (-1,-2)</text><text x="178" y="172">(0,0)</text>
      </g>
      </svg>
      ```

      Scaling changes every component, and subtracting a negative component adds its positive value.
    problems:
      [vecp-why-scale-all, vecp-scale-template, vecp-negative, vecp-zero, vecp-subtract, vecp-half]
  - id: vec-length-distance
    title: Length and distance from squared steps
    explain: |
      **How far away is a floor position?** Adding three metres right and four up gives the route, not the shortcut. Pythagoras gives straight length: square both steps, add, then take the square root.

      This length is the **L2 norm**, written $\|x\|_2$ for vector $x$. For any number of entries:

      $$\|x\|_2=\sqrt{\sum_{i=1}^{n}x_i^2}.$$

      The square-root sign $\sqrt{\phantom{a}}$ undoes squaring. The symbol $\sum_{i=1}^{n}$ means “add for entry numbers $i$ from one to $n$”; $x_i^2$ means square entry $i$.

      This works because the arrow is a right triangle's diagonal. Why this way? Absolute steps measure the right-then-up route; squares give its shortcut, and the root restores length units. Squaring prevents signs cancelling. The zero vector has length zero.

      To measure the **Euclidean distance** between points $p$ and $q$, subtract their coordinates, then take the length: $\text{dist}(p,q)=\|p-q\|_2$. The symbol $\text{dist}$ means distance; reversing the subtraction gives the same length.

      The robot's distance rule lets an ML model compare house vectors. But an area gap of 50 square metres contributes $50^2=2500$, while two bedrooms contribute $2^2=4$: numerical ranges can dominate.

      Changing units changes contributions without changing houses. Rescale features to comparable ranges; mixed-unit distance is calculable, but not a length in metres.
    worked: |
      This example shows length and distance using the same square-add-root steps.

      For the move $b=(3,-1)$:

      1. Square each entry: $3^2=9$ and $(-1)^2=1$.
      2. Add: $9+1=10$.
      3. Take the square root: $\|b\|_2=\sqrt{10}\approx3.16$ metres, where $\approx$ means “approximately”.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" aria-label="Pythagoras gives an arrow length of 5 metres from sides 3 and 4">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M60 175 H330 V35" stroke="#d4d4d4" stroke-width="2" fill="#d4d4d4" fill-opacity="0"/><path d="M315 175 V160 H330" stroke="#737373" fill="#d4d4d4" fill-opacity="0"/><path d="M60 175 L330 35" stroke="#3b82f6" stroke-width="3"/><path d="M330 35 L314 37 L320 49 Z" fill="#3b82f6"/>
      <text x="175" y="200">3 m right</text><text x="345" y="110">4 m up</text><text x="95" y="70">length = √(9 + 16) = 5 m</text>
      </g>
      </svg>
      ```

      For houses $p=(2,5,1)$ and $q=(4,1,1)$, with entries (rooms, kilometres to centre, floors):

      1. Subtract: $p-q=(2-4,5-1,1-1)=(-2,4,0)$.
      2. Square and add: $(-2)^2+4^2+0^2=4+16+0=20$.
      3. Take the square root: $\text{dist}(p,q)=\sqrt{20}\approx4.47$.

      Length and distance use the same calculation, but feature units determine what the comparison means.
    problems:
      [vecp-norm, vecp-norm-template, vecp-distance, vecp-why-root, vecp-units, vecp-zero-length]
final: vec-explain
summary: |
  - A vector is an ordered list: a point or arrow for coordinates, or a point with one coordinate per feature for data; add matching entries.
  - Scale every entry by the same scalar; a negative scalar reverses the arrow, and subtraction adds a reversed arrow.
  - The L2 norm squares, adds and takes a square root; distance is the norm of a difference, and feature units can dominate it.

  **Where you'll use this:** dot product, matrices, linear regression, gradients, and coordinate frames build on these operations for model inputs, weight changes and robot positions.
