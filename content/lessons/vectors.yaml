  - id: vec-change-move
    title: "Stretch, shrink and reverse moves"
    explain: |
      ### Longer, shorter and backwards

      A **vector** is an ordered list of numbers, called **components**. For a robot's move, $b=(2,1)$ means 2 metres east and 1 north. What if it needs to move twice as far, or back the way it came? Draw arrows from the **origin**, the fixed start $(0,0)$.

      The green arrow is $b$. The orange arrow, $(4,2)$, has both components doubled, so it lies along the same dashed line and is twice as long. The red arrow, $(-2,-1)$, has both signs flipped, so it's the same length as $b$ but points the opposite way. The grey dot, $(3,2)$, is what we get by adding 1 to each component instead, and it sits off the line.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" aria-label="Arrows from the origin. The green arrow b = (2,1). The orange arrow 2b = (4,2) lies on the same dashed line and is twice as long. The red arrow minus b = (−2,−1) is the same length and points the opposite way. The grey dot (3,2), made by adding 1 to each component of b, lies off the line">
        <defs>
          <marker id="v2-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
          <marker id="v2-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
          <marker id="v2-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M60 320 V80 M120 320 V80 M180 320 V80 M240 320 V80 M300 320 V80 M360 320 V80 M420 320 V80 M480 320 V80 M540 320 V80 M60 320 H540 M60 260 H540 M60 200 H540 M60 140 H540 M60 80 H540" stroke="#d4d4d4" stroke-width="1" fill="#171717" fill-opacity="0"/>
          <path d="M30 200 H576 M300 344 V44" stroke="#737373" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <path d="M24 338 L576 62" stroke="#737373" stroke-width="1.5" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
          <path d="M300 200 L540 80" stroke="#f59e0b" stroke-width="3" marker-end="url(#v2-amber)"/>
          <path d="M300 200 L420 140" stroke="#10b981" stroke-width="4.5" marker-end="url(#v2-green)"/>
          <path d="M300 200 L180 260" stroke="#ef4444" stroke-width="3.5" marker-end="url(#v2-red)"/>
          <circle cx="300" cy="200" r="4" fill="#171717"/>
          <circle cx="480" cy="80" r="5" fill="#737373"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="426" y="164" fill="#10b981">b = (2,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="546" y="108" fill="#f59e0b">2b = (4,2)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="160" y="288" fill="#ef4444">−b = (−2,−1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="450" y="66" fill="#737373" text-anchor="middle">b + (1,1) = (3,2), off the line</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="308" y="220">(0,0)</text>
        </g>
      </svg>
      ```

      ### Scaling a vector

      Multiplying a vector by a number is **scaling**, and the number is a **scalar**. Write a vector with $n$ components as $x=(x_1,\ldots,x_n)$, where $x_i$ is component number $i$. For scalar $c$, $cx$ multiplies every component by $c$.

      $$cx=(cx_1,\;cx_2,\;\ldots,\;cx_n).$$

      Every component changes by the same factor, so the arrow stays on its line.

      - With $c=2$, the arrow $2b=(4,2)$ is twice as long, and with $c=0.5$, $(1,0.5)$ is half as long. Both point the same way as $b$.
      - With $c=-1$, $-b=(-2,-1)$ is the same length but reversed.
      - With $c=0$, we get $(0,0)$, the **zero vector**, which is no move at all and has no direction.

      Be careful: adding the same number to each component can change direction. $b=(2,1)$ goes 2 metres east for every 1 north; $(3,2)$ goes 3 east for every 2 north, pointing a different way. Positive scaling keeps the 2-to-1 balance and direction. Negative scaling keeps the line and reverses direction.

      ### Subtracting vectors

      Subtracting a vector means adding its reverse, $x-y=x+(-y)$, so we subtract matching components. Suppose the robot is at the tip of $b$, the point $(2,1)$, and needs to get to the tip of $a=(1,3)$. The move it needs is $a-b=(-1,2)$, 1 metre west and 2 north, which is the orange arrow below.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" aria-label="Two arrows from the origin, the blue a = (1,3) and the green b = (2,1). The orange arrow a minus b = (−1,2) runs from the tip of b to the tip of a">
        <defs>
          <marker id="v4-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
          <marker id="v4-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
          <marker id="v4-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M80 290 V50 M140 290 V50 M200 290 V50 M260 290 V50 M320 290 V50 M80 290 H320 M80 230 H320 M80 170 H320 M80 110 H320 M80 50 H320" stroke="#d4d4d4" stroke-width="1" fill="#171717" fill-opacity="0"/>
          <path d="M80 290 H350 M80 290 V20" stroke="#737373" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <path d="M80 290 L140 110" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#v4-blue)"/>
          <path d="M80 290 L200 230" stroke="#10b981" stroke-width="3.5" marker-end="url(#v4-green)"/>
          <path d="M200 230 L140 110" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#v4-amber)"/>
          <circle cx="80" cy="290" r="4" fill="#171717"/>
          <circle cx="140" cy="110" r="4" fill="#171717"/>
          <circle cx="200" cy="230" r="4" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="72" y="314">(0,0)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="150" y="104" fill="#3b82f6">a = (1,3)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="212" y="246" fill="#10b981">b = (2,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="178" y="168" fill="#f59e0b">a − b = (−1,2)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="380" y="120">a − b runs from the tip</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="380" y="140">of b to the tip of a</text>
        </g>
      </svg>
      ```

      With both arrows drawn from the origin, $x-y$ always runs from the tip of $y$ to the tip of $x$.
    worked: |
      Let's scale, reverse and subtract the robot's moves $a=(1,3)$ and $b=(2,1)$, then check what the subtraction gave us.

      1. **Double $b$.** Scaling by 2 multiplies each component by 2.
         $$2b=(2\times2,\;2\times1)=(4,2)$$

      2. **Reverse $b$.** Reversing is scaling by $-1$, which flips both signs.
         $$-b=(-1\times2,\;-1\times1)=(-2,-1)$$

      3. **Subtract $b$ from $a$.** We take each component of $b$ from the matching component of $a$.
         $$a-b=(1-2,\;3-1)=(-1,2)$$

      4. **Check where the move $a-b$ leads.** Starting at the tip of $b$, the point $(2,1)$, we add the move and see where we land.
         $$b+(a-b)=(2-1,\;1+2)=(1,3)=a$$

      We land on the tip of $a$, so $a-b$ really is the move from the point $(2,1)$ to the point $(1,3)$.
