          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="316" y="330" fill="#737373">4</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="376" y="330" fill="#737373">5</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="62" y="255" fill="#737373">1</text>
