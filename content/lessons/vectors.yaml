concept: vectors
version: 3
objective: |
  **Goal:** describe points and arrows with ordered numbers, add and scale vectors, and calculate lengths and distances. Use the same kind of list to describe a house for a model.
where_this_fits: |
  Supervised learning named a house's measurements as inputs. Now we need to keep area, bedrooms and age together in a fixed order without mixing their meanings. This lesson introduces vectors as ordered lists and shows how to add, scale and measure them. The next lesson uses a vector of weights with the house vector to calculate a price.
knowledge_points:
  - id: vec-points-moves
    title: Describing points and adding arrows
    explain: |
      **What a vector is.** A vector is an ordered list of numbers. A **feature vector** is a vector of input measurements. For the running house example, $x=(12,3,20)$ records area in tens of square metres, bedroom count and age in years, in that fixed order.

      **How it works.** Each entry is a **component**; its position and label give it meaning. On a two-dimensional diagram, the **origin** is $(0,0)$, and the arrow to $(1,2)$ means 1 unit right and 2 up. Follow it with $(3,-1)$ to reach $(1+3,2+(-1))=(4,1)$.

      The numbers locating a point are its **coordinates**. Negative entries mean left or down in this diagram. A vector can describe the endpoint or the arrow from the origin to it.

      Place the second arrow's start at the first arrow's end. The arrow from the original start to the final endpoint is their sum. **Vector addition** adds matching components because moving up does not change the rightward coordinate. Why keep the entries in order? Mixing them would mix directions or house measurements with different meanings.

      Write $x\in\mathbb{R}^n$ for a vector of $n$ real numbers, including fractions and negative numbers. The symbol $\in$ means “belongs to”; $x_i$ means entry number $i$.

      **Why this is useful.** Every model in this course takes its inputs as a vector. Writing the house as $x=(12,3,20)$ means the model always knows the first number is area, the second bedrooms and the third age, so the next lesson can pair each one with its own weight.
    worked: |
      This example shows the house's measurements as an ordered vector, then pictures the same ordering rule with arrows.

      The house has 120 square metres, 3 bedrooms and is 20 years old, so its feature vector is $x=(12,3,20)$ in the lesson's fixed order.
      Call the arrows $a=(1,2)$ and $b=(3,-1)$, with right first and up second.

      1. The combined rightward distance is $1+3=4$ units.
      2. The combined upward distance is $2+(-1)=1$ unit.
      3. The arrow from the origin to the endpoint is $a+b=(4,1)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" aria-label="Following arrow (1,2) then (3,-1) reaches (4,1); coordinates measure right and up">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M50 180 H470 M50 180 V20" stroke="#d4d4d4" fill="#d4d4d4" fill-opacity="0"/>
      <path d="M50 180 L140 60" stroke="#10b981" stroke-width="3"/><path d="M140 60 L126 68 L138 75 Z" fill="#10b981"/>
      <path d="M140 60 L410 120" stroke="#f59e0b" stroke-width="3"/><path d="M410 120 L396 110 L394 123 Z" fill="#f59e0b"/>
      <path d="M50 180 L410 120" stroke="#3b82f6" stroke-width="3"/><path d="M410 120 L395 116 L397 129 Z" fill="#3b82f6"/>
      <text x="20" y="202">(0,0)</text><text x="55" y="85">a = (1,2)</text><text x="250" y="50">b = (3,-1)</text><text x="235" y="168">a + b = (4,1)</text><text x="440" y="202">right</text><text x="15" y="18">up</text>
      </g>
      </svg>
      ```

      For a robot using metres east and north, this same sum means 4 metres east and 1 north of its start.
    problems: [vecp-add, vecp-add-template, vecp-feature, vecp-order, vecp-new-moves, vecp-entry]
  - id: vec-change-move
    title: Changing length without changing direction
    explain: |
      **What scaling is.** Scaling multiplies every component of a vector by the same number, called a **scalar**.

      **How it works.** Multiplying every coordinate by the same positive number lengthens the arrow without changing its direction. Its endpoint stays on the same line through the origin. For $(1,2)$, doubling both entries gives $(2,4)$. In $cx$, scalar $c$ multiplies every entry of vector $x$.

      Picture two copies of $(1,2)$ placed end to end. Their sum reaches $(2,4)$ along the original line. This works because the upward distance is still twice the rightward distance. Why this way? Adding two to both entries gives $(3,4)$, which changes that proportion and therefore the direction.

      A positive scalar preserves direction and multiplies length by that amount. One half gives $(0.5,1)$, half as long. Zero gives the **zero vector**, whose entries are all zero. It has no direction.

      A negative scalar also reverses direction. For example, $-1$ times $(1,2)$ is $(-1,-2)$, an equally long arrow pointing back. **Vector subtraction** adds this opposite arrow: subtract matching entries. For $3a-b$, triple $a$ first, then add the opposite of $b$.

      **Why this is useful.** Training changes a model's weights by adding a scaled vector: gradient descent, later in this week, replaces $w$ with $w-0.1\,g$, where $g$ is a vector that says which way to change each weight. That one step uses both scaling and subtraction.
    worked: |
      This example shows how scaling and subtraction change arrows.

      Use $a=(1,2)$ and $b=(3,-1)$, with right first and up second.

      1. Double each entry: $2a=(2\cdot1,2\cdot2)=(2,4)$.
      2. Reverse each entry: $-a=(-1,-2)$.
      3. For $3a-b$, first calculate $3a=(3,6)$.
      4. Subtract matching entries: $(3,6)-(3,-1)=(3-3,6-(-1))=(0,7)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" aria-label="Arrows a=(1,2), twice a=(2,4), and opposite a=(-1,-2) lie on the same line through the origin">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M20 150 H470 M170 210 V10" stroke="#d4d4d4" fill="#d4d4d4" fill-opacity="0"/><path d="M170 150 L270 20" stroke="#3b82f6" stroke-width="3"/><path d="M270 20 L256 27 L268 35 Z" fill="#3b82f6"/><path d="M170 150 L220 85" stroke="#10b981" stroke-width="5"/><path d="M220 85 L206 92 L218 100 Z" fill="#10b981"/><path d="M170 150 L120 215" stroke="#ef4444" stroke-width="3"/><path d="M120 215 L134 208 L122 200 Z" fill="#ef4444"/>
      <text x="278" y="35">2a = (2,4)</text><text x="230" y="100">a = (1,2)</text><text x="15" y="195">-a = (-1,-2)</text><text x="178" y="172">(0,0)</text><text x="440" y="170">right</text><text x="180" y="15">up</text>
      </g>
      </svg>
      ```

      The result $(0,7)$ points straight up. Subtracting a negative entry adds its positive value.
    problems:
      [vecp-why-scale-all, vecp-scale-template, vecp-negative, vecp-zero, vecp-subtract, vecp-half]
  - id: vec-length-distance
    title: Measuring an arrow's length and the distance between points
    explain: |
      **What the L2 norm is.** The **L2 norm** of a vector is its straight-line length, written $\|x\|_2$.

      **How it works.** For an arrow from $(0,0)$ to $(3,4)$, the two coordinate directions form a right angle. Pythagoras' rule says the squared diagonal equals the sum of the squared sides, so its length is $\sqrt{3^2+4^2}=5$, not $3+4=7$. The square-root sign $\sqrt{\phantom{a}}$ undoes squaring.

      Picture the arrow as the diagonal across that triangle. This is why the squared coordinates add to its squared length. Why this way? Adding absolute distances gives the two-sided route. The root recovers the straight-line length; for metre coordinates, it turns square metres back into metres. Squaring also stops opposite signs cancelling.

      For $n$ entries, $x_i^2$ squares entry $i$, and $\sum_{i=1}^{n}$ adds from entry one to $n$:

      $$\|x\|_2=\sqrt{\sum_{i=1}^{n}x_i^2}.$$

      The **Euclidean distance** between points $p$ and $q$ is $\text{dist}(p,q)=\|p-q\|_2$. Here $\text{dist}$ means distance. Subtract coordinates to find the arrow joining them, then measure its length. Reversing the subtraction gives the same distance.

      **Why this is useful.** Length tells you how big a vector is. During training, a short gradient vector means the weights have almost stopped changing, so the length is how you tell that training has nearly finished.

      A model can compare house vectors, but area, bedrooms and age have different units and ranges. Rescale them before treating this mixed-unit norm as a meaningful similarity; it is not a physical length in metres.

    worked: |
      This example shows how to measure an arrow and then compare two houses using the same calculation.

      Start with the arrow $b=(3,-1)$.

      1. Square each entry: $3^2=9$ and $(-1)^2=1$.
      2. Add: $9+1=10$.
      3. Take the square root: $\|b\|_2=\sqrt{10}\approx3.16$ units, where $\approx$ means “approximately”.

      The diagram below uses $(3,4)$ instead, so you can see a triangle with the exact length 5.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" aria-label="An arrow 3 units right and 4 units up is a right triangle's diagonal, with length 5">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M60 175 H330 V35" stroke="#d4d4d4" stroke-width="2" fill="#d4d4d4" fill-opacity="0"/><path d="M315 175 V160 H330" stroke="#737373" fill="#d4d4d4" fill-opacity="0"/><path d="M60 175 L330 35" stroke="#3b82f6" stroke-width="3"/><path d="M330 35 L314 37 L320 49 Z" fill="#3b82f6"/>
      <text x="175" y="200">3 right</text><text x="345" y="110">4 up</text><text x="95" y="70">length = √(9 + 16) = 5</text>
      </g>
      </svg>
      ```

      Now compare houses $p=(12,3,20)$ and $q=(8,2,5)$, with area in tens of square metres, bedrooms, and age in years.

      1. Subtract: $p-q=(12-8,3-2,20-5)=(4,1,15)$.
      2. Square and add: $4^2+1^2+15^2=16+1+225=242$.
      3. Take the square root: $\text{dist}(p,q)=\sqrt{242}\approx15.56$.

      This numerical house distance is not measured in metres. Changing the units of a feature changes how strongly it affects the comparison.
    problems:
      [vecp-norm, vecp-norm-template, vecp-distance, vecp-why-root, vecp-units, vecp-zero-length]
final: vec-explain
summary: |
  - A vector is an ordered list of numbers. It can record a robot's position or measurements about a house. Add entries with matching meanings and units.
  - Scaling multiplies every entry by the same number. A negative number reverses the arrow. Subtracting a vector means adding its opposite.
  - The L2 norm is the square root of the sum of squared entries. To find distance, subtract coordinates first. For house measurements, choose comparable ranges so that large numbers do not overwhelm the comparison.

  **Next:** The dot-product lesson pairs the house vector with weights to turn its measurements into a predicted price.
