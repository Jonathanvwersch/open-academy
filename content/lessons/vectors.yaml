final: vec-explain
summary: |
  - A vector is an ordered list of numbers, called components, whose positions give them their meaning. It can stand for a point, a move or a list of measurements, and we add two vectors by adding matching components.
  - Scaling a vector by a number $c$ multiplies every component by $c$, which stretches, shrinks or reverses the vector along its line. Subtracting adds the reversed vector, so $x-y$ runs from the tip of $y$ to the tip of $x$.
  - A vector's length is $\|x\|_2=\sqrt{\sum_{i=1}^{n}x_i^2}$, and the distance between two points $p$ and $q$ is $\|q-p\|_2$. Measurements on very different scales should be rescaled before comparing distances.

  **Next:** The dot-product lesson multiplies the matching components of two vectors and adds them up. If one vector holds a house's measurements and the other holds a price for each unit of each measurement, the result is a predicted price.
