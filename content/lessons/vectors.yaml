concept: vectors
version: 4
objective: |
  **Goal:** write points, moves and measurements as vectors, add and scale them, and find a vector's length and the distance between two points.
where_this_fits: |
  A delivery robot needs to record where it is and how it has moved. A house-price **model** (a program that estimates prices) must read a house's area, bedrooms and age as one input. Both need several numbers kept together, each with its own fixed meaning. One number can't hold that; a loose pile of numbers forgets which is which. This lesson builds the tool that does, the **vector**, in three steps:

  1. Write a point, a move or a list of measurements as an ordered list of numbers, and combine two moves.
  2. Stretch, shrink or reverse a move by multiplying it by one number.
  3. Measure how long a move is and how far apart two points are.

  Later lessons store a model's inputs and learned numbers as vectors.
knowledge_points:
  - id: vec-points-moves
    title: Lists of numbers that describe points and moves
    explain: |
      **The question.** A delivery robot leaves its dock and drives 1 metre east and 3 metres north, then 2 east and 1 north. How do you write each move as numbers a computer can follow, and where does the robot end up?

      **Picture it.** The map below is a grid seen from above, with the dock at $(0,0)$, east to the right and north up. The blue arrow is the first move, written $a=(1,3)$: first number east, second north. The green arrow $b=(2,1)$ starts where $a$ ends. The amber arrow goes straight from the dock to where the robot finishes, $(3,4)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" aria-label="A grid with the dock at the origin. A blue arrow a = (1,3) goes 1 east and 3 north; a green arrow b = (2,1) starts at the tip of a; an amber arrow a + b = (3,4) goes from the dock to the final point">
        <defs>
          <marker id="v1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
          <marker id="v1-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
          <marker id="v1-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M80 310 V70 M140 310 V70 M200 310 V70 M260 310 V70 M320 310 V70 M380 310 V70 M80 310 H380 M80 250 H380 M80 190 H380 M80 130 H380 M80 70 H380" stroke="#d4d4d4" stroke-width="1" fill="#171717" fill-opacity="0"/>
          <path d="M80 310 H410 M80 310 V34" stroke="#737373" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <path d="M80 310 L140 130" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#v1-blue)"/>
          <path d="M80 310 L260 70" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#v1-amber)"/>
          <path d="M140 130 L260 70" stroke="#10b981" stroke-width="3.5" marker-end="url(#v1-green)"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="136" y="330" fill="#737373">1</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="196" y="330" fill="#737373">2</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="256" y="330" fill="#737373">3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="316" y="330" fill="#737373">4</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="376" y="330" fill="#737373">5</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="62" y="255" fill="#737373">1</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="62" y="195" fill="#737373">2</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="62" y="135" fill="#737373">3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="62" y="75" fill="#737373">4</text>
          <circle cx="80" cy="310" r="4" fill="#171717"/>
          <circle cx="140" cy="130" r="3.5" fill="#171717"/>
          <circle cx="260" cy="70" r="4" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="72" y="348">dock (0,0)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="66" y="224" fill="#3b82f6" text-anchor="end">a = (1,3)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="150" y="80" fill="#10b981">b = (2,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="188" y="220" fill="#f59e0b">a + b = (3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="272" y="75">end (3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="416" y="315">east</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="66" y="26">north</text>
        </g>
      </svg>
      ```

      **The idea.** A **vector** is an ordered list of numbers. Each number is a **component**, and its position says what it means. A vector can mark a point (its **coordinates**, measured from the **origin** $(0,0)$) or a move (an arrow, which can start anywhere). Negative components mean west or south.

      To **add vectors**, add matching components: on the map, put the second arrow at the tip of the first.

      Components need not be distances. A list of measurements of one thing, such as a house's area, bedrooms and age, is a **feature vector**. We write $x=(x_1,\ldots,x_n)$: $x_i$ is component number $i$ and $n$ counts them. For the house $x=(120,3,15)$, $x_1=120$ and $n=3$. $x\in\mathbb{R}^n$ (“$x$ is in R-n”) says $x$ lists $n$ real numbers: $\in$ means “is in”, $\mathbb{R}$ is every number on the number line, and $n$ is a count, not a power.

      **Common confusion.** “$(2,5)$ and $(5,2)$ are the same vector: they have the same numbers.” No. Position is meaning: $(2,5)$ is 2 east and 5 north, $(5,2)$ is 5 east and 2 north, a different place.
    worked: |
      The robot moves $a=(1,3)$, then $b=(2,1)$, in metres east and north. Where does it end up?

      1. **Add the east components.**
         $$1+2=3$$

      2. **Add the north components.**
         $$3+1=4$$

      3. **Collect them in the same order.**
         $$a+b=(1+2,\;3+1)=(3,4)$$

      The robot ends 3 metres east and 4 metres north of the dock.

      **Compare cases.**

      | First move | Second move | Sum |
      | --- | --- | --- |
      | $(1,3)$ | $(2,1)$ | $(3,4)$ |
      | $(2,1)$ | $(1,3)$ | $(3,4)$, same end point |
      | $(1,3)$ | $(2,-3)$ | $(3,0)$, back on the east line |
      | $(1,3)$ | $(-1,-3)$ | $(0,0)$, back at the dock |

      **Where it shows up.** A model takes each example as a feature vector, such as $(120,3,15)$ for a house with 120 square metres, 3 bedrooms and 15 years of age, always in that order. If the house gains 10 square metres and a bedroom and gets 1 year older, adding $(10,1,1)$ gives its new feature vector $(130,4,16)$.
    problems:
      - vec-points-moves-basics
      - vecp-add-self-explain
      - vecp-add-template
      - vecp-feature
      - vecp-entry
      - vecp-order
      - vecp-add
      - vecp-new-moves
      - vecp-missing-move
  - id: vec-change-move
    title: Stretching, shrinking and reversing a move
    explain: |
      **The question.** The robot's move $b=(2,1)$ goes 2 metres east and 1 north. How do you write “the same move, twice as far”, or “the same move, backwards”? And what move takes the robot from one point to another?

      **Picture it.** All the arrows below start at the origin. Green is $b=(2,1)$. Amber is $(4,2)$: it lies on the same dashed line through the origin and is twice as long. Red is $(-2,-1)$: the same length as $b$, pointing the opposite way. The grey point $(3,2)$ comes from adding 1 to each component of $b$, and it lies off the line, so an arrow to it points another way.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" aria-label="Arrows from the origin: green b = (2,1), amber 2b = (4,2) twice as long on the same dashed line, red minus b = (-2,-1) pointing the opposite way; the grey point (3,2), made by adding 1 to each entry of b, lies off the line">
        <defs>
          <marker id="v2-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
          <marker id="v2-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
          <marker id="v2-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M60 320 V80 M120 320 V80 M180 320 V80 M240 320 V80 M300 320 V80 M360 320 V80 M420 320 V80 M480 320 V80 M540 320 V80 M60 320 H540 M60 260 H540 M60 200 H540 M60 140 H540 M60 80 H540" stroke="#d4d4d4" stroke-width="1" fill="#171717" fill-opacity="0"/>
          <path d="M30 200 H576 M300 344 V44" stroke="#737373" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <path d="M24 338 L576 62" stroke="#737373" stroke-width="1.5" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
          <path d="M300 200 L540 80" stroke="#f59e0b" stroke-width="3" marker-end="url(#v2-amber)"/>
          <path d="M300 200 L420 140" stroke="#10b981" stroke-width="4.5" marker-end="url(#v2-green)"/>
          <path d="M300 200 L180 260" stroke="#ef4444" stroke-width="3.5" marker-end="url(#v2-red)"/>
          <circle cx="300" cy="200" r="4" fill="#171717"/>
          <circle cx="480" cy="80" r="5" fill="#737373"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="426" y="164" fill="#10b981">b = (2,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="546" y="108" fill="#f59e0b">2b = (4,2)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="160" y="288" fill="#ef4444">−b = (−2,−1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="450" y="66" fill="#737373" text-anchor="middle">b + (1,1) = (3,2), off the line</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="308" y="220">(0,0)</text>
        </g>
      </svg>
      ```

      **The idea.** Multiplying every component by the same number changes an arrow's length but keeps it on its line. That number is a **scalar**, and the operation is **scaling**: for a scalar $c$ and vector $x$, $cx$ multiplies each component of $x$ by $c$.

      - $c$ greater than 1 stretches the arrow; $c$ between 0 and 1 shrinks it.
      - A negative $c$ also reverses it, so $-x$ is $x$ pointing backwards.
      - $c=0$ gives the **zero vector** $(0,0)$: no move, and no direction.

      **Vector subtraction** is adding the reversed vector: $x-y=x+(-y)$, so you subtract matching components. With both arrows drawn from the origin, $x-y$ is what you add to $y$ to reach $x$, so it runs from the tip of $y$ to the tip of $x$.

      **Common confusion.** “Adding the same number to each component also makes the arrow longer.” Usually it turns the arrow too (unless the components are equal). $b=(2,1)$ goes twice as far east as north. $(3,2)$ doesn't, so it points another way. Multiplying by a nonzero number, as in $(4,2)$, always keeps that ratio.
    worked: |
      Use $b=(2,1)$ and, from the first part, $a=(1,3)$.

      1. **Double $b$: multiply each component by 2.**
         $$2b=(2\cdot2,\;2\cdot1)=(4,2)$$

      2. **Reverse $b$: multiply each component by $-1$.**
         $$-b=(-2,-1)$$

      3. **Subtract: take $b$'s components from $a$'s.**
         $$a-b=(1-2,\;3-1)=(-1,2)$$

      4. **Check what $a-b$ means: start at the point $(2,1)$, the tip of $b$ drawn from the origin, and make that move.**
         $$b+(a-b)=(2-1,\;1+2)=(1,3)=a$$

      So $a-b$ is the move from the point $(2,1)$ to the point $(1,3)$.

      **Compare cases.**

      | Scalar $c$ | $c\,b$ | What happens |
      | --- | --- | --- |
      | $2$ | $(4,2)$ | twice as long, same direction |
      | $0.5$ | $(1,0.5)$ | half as long, same direction |
      | $0$ | $(0,0)$ | no move at all |
      | $-1$ | $(-2,-1)$ | same length, reversed |
      | $-2$ | $(-4,-2)$ | twice as long, reversed |

      **Where it shows up.** A model learns by repeatedly adjusting its vector of learned numbers: it shrinks a vector of suggested changes with a small scalar such as $0.1$ and subtracts the result (the gradient-descent lesson shows where the changes come from and why they are subtracted). That one step uses both scaling and subtraction.
    problems:
      - vec-change-move-basics
      - vecp-scale-self-explain
      - vecp-scale-template
      - vecp-half
      - vecp-zero
      - vecp-why-scale-all
      - vecp-negative
      - vecp-subtract
      - vecp-find-scalar
  - id: vec-length-distance
    title: How long a move is, and how far apart two points are
    explain: |
      **The question.** After its two moves, the robot is at $(3,4)$. How far is it from the dock in a straight line? More generally, how far apart are two points?

      **Picture it.** On the left, the move $(3,4)$ is the long side of a right-angled triangle whose other sides are 3 (east) and 4 (north). Pythagoras' theorem says that in such a triangle, the squares of the two short sides add up to the square of the long side: $3^2+4^2=9+16=25$, so the long side is $\sqrt{25}=5$. On the right, the arrow from $p=(1,1)$ to $q=(4,5)$ is the move $q-p=(3,4)$, so those points are also 5 apart.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" aria-label="Left: the arrow (3,4) from the origin is the long side of a right-angled triangle with sides 3 and 4, so its length is 5. Right: points p = (1,1) and q = (4,5); the arrow q minus p = (3,4) joins them, so the distance between them is 5">
        <defs>
          <marker id="v3-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
          <marker id="v3-amber2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="20" y="28">length of an arrow</text>
          <path d="M40 300 H260 M40 300 V70" stroke="#737373" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <path d="M40 300 L190 300" stroke="#737373" stroke-width="2" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
          <path d="M190 300 L190 100" stroke="#737373" stroke-width="2" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
          <path d="M178 300 V288 H190" stroke="#737373" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <path d="M40 300 L190 100" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#v3-amber)"/>
          <circle cx="40" cy="300" r="4" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="111" y="322" fill="#737373">3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="200" y="205" fill="#737373">4</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="112" y="232" fill="#f59e0b">length 5</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="198" y="94">(3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="380" y="28">distance between points</text>
          <path d="M360 320 H612 M360 320 V59" stroke="#737373" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <path d="M405 275 L540 275" stroke="#737373" stroke-width="2" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
          <path d="M540 275 L540 95" stroke="#737373" stroke-width="2" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
          <path d="M405 275 L540 95" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#v3-amber2)"/>
          <circle cx="405" cy="275" r="4" fill="#171717"/>
          <circle cx="540" cy="95" r="4" fill="#171717"/>
          <circle cx="360" cy="320" r="3" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="399" y="299">p = (1,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="456" y="91">q = (4,5)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="468.5" y="266" fill="#737373">3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="550" y="190" fill="#737373">4</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="462" y="160" fill="#f59e0b" text-anchor="end">q − p = (3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="462" y="180" fill="#f59e0b" text-anchor="end">distance 5</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="350" y="344">(0,0)</text>
        </g>
      </svg>
      ```

      **The idea.** A vector's length is the square root of the sum of its squared components. This is the **L2 norm**, written $\|x\|_2$: the double bars mean “length of”, and the 2 refers to the squaring. In 3D, Pythagoras on the floor gives $x_1^2+x_2^2$, and again with the height adds $x_3^2$. Each new component adds one more square:

      $$\|x\|_2=\sqrt{x_1^2+x_2^2+\cdots+x_n^2}=\sqrt{\sum_{i=1}^{n}x_i^2}$$

      Here $\sum_{i=1}^{n}$, read “sum from $i=1$ to $n$”, means add the term that follows for every $i$ from 1 to $n$. The square root $\sqrt{\phantom{x}}$ undoes the squaring, so the robot's answer is in metres, not square metres.

      The **Euclidean distance** between points $p$ and $q$ is the length of the move that joins them, $\|q-p\|_2$. Swapping the points reverses the arrow but keeps its length.

      **Common confusion.** “The length of $(3,4)$ is $3+4=7$.” No: 7 is the route along the grid, east and then north. The straight line cuts the corner, so it is shorter: 5. Squaring also means signs don't matter: $(3,-4)$ has length 5 too.
    worked: |
      Find the straight-line distance from the dock to the robot at $(3,4)$, then the distance between $p=(1,1)$ and $q=(4,5)$.

      1. **Square each component.**
         $$3^2=9,\qquad 4^2=16$$

      2. **Add the squares.**
         $$9+16=25$$

      3. **Take the square root.**
         $$\|(3,4)\|_2=\sqrt{25}=5$$

      4. **For two points, first find the move between them.**
         $$q-p=(4-1,\;5-1)=(3,4)$$

      5. **Measure that move.**
         $$\|q-p\|_2=\sqrt{3^2+4^2}=5$$

      **Compare cases.**

      | Vector | Sum of squares | Length |
      | --- | --- | --- |
      | $(3,4)$ | $25$ | $5$ |
      | $(3,-4)$ | $25$ | $5$, sign doesn't matter |
      | $(6,8)$ | $100$ | $10$, doubling doubles length |
      | $(0,0)$ | $0$ | $0$ |
      | $(1,2,2)$ | $9$ | $3$, three components |

      **Where it shows up.** A model can judge how similar two houses are by the distance between their feature vectors: a small distance means their measurements are close. But a 50 square-metre gap in area adds $50^2=2500$ to the sum while a 2-bedroom gap adds only $2^2=4$, so each measurement is usually rescaled first (for example, divided by its typical size) so that no single one dominates.
    problems:
      - vec-length-distance-basics
      - vecp-distance-self-explain
      - vecp-norm-meaning
      - vecp-norm
      - vecp-norm-template
      - vecp-why-root
      - vecp-distance
      - vecp-units
      - vecp-zero-length
final: vec-explain
summary: |
  - A vector is an ordered list of numbers whose positions give them meaning; to add vectors, add matching components.
  - Multiplying a vector by a scalar stretches, shrinks or reverses it along the same line, and subtracting means adding the reversed vector.
  - A vector's length is the square root of its sum of squared components, and the distance between two points is the length of the move between them.

  **Next:** The dot-product lesson combines two vectors into one number by multiplying matching components and adding; a model uses it with a vector of weights to turn a house's feature vector into a predicted price.
