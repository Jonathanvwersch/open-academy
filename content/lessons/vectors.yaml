      ### Vectors and their components

      A **vector** is an ordered list of numbers. Each number is a **component**, and its position says what it means. Here the first is east and the second north, so negative means west or south.

      A vector can be a move, which only says how far to go each way, so its arrow can start anywhere. It can also be a point. We write a point as the move that reaches it from a fixed start, the **origin**, and call its components **coordinates**.

      Order matters: $(2,5)$ means 2 metres east and 5 north, a different place from $(5,2)$.

      ### Adding two moves

      To make one move after another, we add the east distances and the north distances. This is **vector addition**. Writing $a_1$ for $a$'s first component and $a_2$ for its second,

      $$a+b=(a_1+b_1,\;a_2+b_2).$$

      Draw the second arrow from the first one's tip.

      ### Lists of measurements

      Components don't have to be distances. $(120,3,15)$ can describe a house with 120 square metres, 3 bedrooms and an age of 15 years. A list of measurements of one thing is a **feature vector**. A **model**, a program that learns predictions from examples, receives each example this way. Just as $(3,4)$ is a point on a map with east and north directions, the house is a point in a space with one direction per measurement. Similar houses sit close together.

      We write a vector with $n$ components as $x=(x_1,x_2,\ldots,x_n)$, where $x_i$ is component number $i$. For the house, $n=3$ and $x_2=3$. Later lessons write $x\in\mathbb{R}^n$, read "x is in R n", to say $x$ is a list of $n$ numbers. Here $\mathbb{R}$ means all the numbers on the number line, and the $n$ above it counts the components.
    worked: |
      Let's work out where the robot ends up after the move $a=(1,3)$ and then the move $b=(2,1)$, in metres east and north of the dock.

      1. **Add the east components.** The first components are both distances east, so they belong together.
         $$1+2=3$$

      2. **Add the north components.** The second components are both distances north.
         $$3+1=4$$

      3. **Write the totals in the same order.** East comes first and north second, just as in $a$ and $b$.
         $$a+b=(1+2,\;3+1)=(3,4)$$

      So the robot ends up 3 metres east and 4 metres north of the dock, at the tip of the orange arrow.
