          <circle cx="140" cy="130" r="3.5" fill="#171717"/>
          <circle cx="260" cy="70" r="4" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="72" y="348">dock (0,0)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="104" y="224" fill="#3b82f6" text-anchor="end">a = (1,3)</text>
