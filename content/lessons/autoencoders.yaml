      ### Close points, similar images

      The decoder only multiplies by weights and adds a bias, so nearby points rebuild into similar images. The other way round holds too. Our decoder copies each latent number into pixels, so similar copies need nearby points, and a trained autoencoder's copies look like its inputs. So images that look alike get points close together, and the distance between latent vectors is a quick way to compare images.

      ### How robots use latent vectors

      A **world model** predicts what a robot will see after it acts. Given the latent vector of the current frame and the action, as a few numbers such as how far to turn, it outputs the next frame's latent vector: $256$ numbers instead of $12{,}288$. A **policy**, the network that picks actions, can read the same vector.

      ### What the latent vector doesn't tell us

      Don't read fixed meanings into the latent numbers. Our weights made $z_1$ the top row's brightness. For row brightnesses $a$ and $b$, adding and subtracting works too:
      $$
      \begin{aligned}
      z_1&=a+b &&\text{encode their sum}\\
      z_2&=a-b &&\text{encode their difference}\\
      \text{top pixel}&=0.5z_1+0.5z_2 &&\text{add the latent values}\\
      &=0.5(a+b)+0.5(a-b) &&\text{substitute the sum and difference}\\
      &=0.5a+0.5b+0.5a-0.5b &&\text{distribute both halves}\\
      &=a &&\text{cancel the }b\text{ terms}\\
      \text{bottom pixel}&=0.5z_1-0.5z_2 &&\text{subtract the latent values}\\
      &=0.5(a+b)-0.5(a-b) &&\text{substitute the sum and difference}\\
      &=0.5a+0.5b-0.5a+0.5b &&\text{distribute both halves}\\
      &=b &&\text{cancel the }a\text{ terms}
      \end{aligned}
      $$
      Training rewards good copies, so it may find either representation, or many others.

      The latent vector also keeps only what helps the copy. Say a camera frame shows a small screw. It covers few pixels, so dropping it from the copy barely raises $E$. The network may spend no latent numbers on it, so frames with and without it get almost the same point, even if the robot needed it.
