concept: autoencoders
version: 1
objective: |
  **Goal:** explain how an autoencoder squeezes an input into a short latent vector and rebuilds it, and compare the sizes of the input and the latent vector.
recap:
  - concept: mlp-forward-pass
    text: "A layer turns $d_\\text{in}$ inputs into $d_\\text{out}$ outputs with one row of weights and one bias per neuron, $h=\\phi(Wx+b)$, so it has $d_\\text{out}d_\\text{in}+d_\\text{out}$ parameters."
  - concept: images-as-tensors
    text: "A grayscale image is a grid of pixel brightnesses from 0 to 255, with shape $(H,W)$, so it holds $H\\times W$ numbers. Before a model reads it, we divide every value by 255 so it lies between 0 and 1."
where_this_fits: |
  ### What is an autoencoder?

  An autoencoder is a neural network that learns to squeeze its input into a short list of numbers and then rebuild the input from that list. The short list is called the **latent vector**, or the input's latent representation. "Latent" means hidden. The latent vector sits inside the network, between the input and its rebuilt copy.

  Why would we want a network that only copies? Because the copy must pass through the short list. A camera image holds thousands of pixel values, but most follow patterns, so to rebuild it the network must find a few numbers that capture them. The summary is easier to store and compare than the raw pixels, which is why networks that steer robots read latent vectors instead of images.
knowledge_points:
  - id: ae-encode-decode
    title: "Shrink an image, then rebuild it"
    tldr: |
      - We flatten an image by laying its rows end to end into one vector.
      - An encoder squeezes that vector into a much shorter one, called the latent vector.
      - A decoder rebuilds the image from it, and the pair is called an autoencoder.
      - When images share a pattern, such as stripes, the short vector can be enough to rebuild them.
    explain: |
      ### A tiny image as one vector

      In the images-as-tensors lesson, we saw that a grayscale image is a grid of brightnesses, which we divide by 255 so they lie between 0 and 1. Our layer reads a vector, so first we **flatten** the image: we lay its rows end to end. NumPy's `img.reshape(H * W)` does exactly this.

      Take a $2\times2$ image with 204 and 204 in its top row and 51 and 51 below:
      $$
      \begin{aligned}
      \text{scaled image}&=\begin{pmatrix}204/255&204/255\\51/255&51/255\end{pmatrix} &&\text{divide each pixel by }255\\
      &=\begin{pmatrix}0.8&0.8\\0.2&0.2\end{pmatrix} &&\text{evaluate the divisions}\\
      x&=(0.8,0.8,0.2,0.2) &&\text{lay the rows end to end}
      \end{aligned}
      $$

      ### Through a narrow middle

      Suppose all our images are horizontal stripes like this one, with both pixels in a row equally bright. Then two numbers, one per row, would be enough to rebuild it.

      The picture shows a network built on that idea, read from left to right. The four input numbers go into the **encoder**, a layer with two neurons, so it outputs two numbers, $z=(0.8,0.2)$. This short vector in the narrow middle is the **latent vector**. Like the forward-pass lesson's hidden values, it comes out of a layer, just a much narrower one. The **decoder** is a layer with four neurons. It reads $z$ and outputs four numbers, the **reconstruction** $\hat x$ (read "x hat"). With the worked example's weights, it matches the input exactly.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" aria-label="Autoencoder for one 2 by 2 image, read left to right. The flattened image x = (0.8, 0.8, 0.2, 0.2) enters the encoder, which narrows to a latent vector z of 2 numbers, (0.8, 0.2), shown in green. The decoder widens again to 4 numbers, the reconstruction x hat = (0.8, 0.8, 0.2, 0.2), shown in orange, matching the input">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M128 50 L272 102 L272 198 L128 250 Z" fill="#d4d4d4" fill-opacity="0.4" stroke="#d4d4d4"/>
      <path d="M368 102 L512 50 L512 250 L368 198 Z" fill="#d4d4d4" fill-opacity="0.4" stroke="#d4d4d4"/>
      <rect x="40" y="50" width="80" height="44" rx="6" fill="#171717" fill-opacity="0" stroke="#737373" stroke-width="2"/><text x="80" y="77" text-anchor="middle">0.8</text>
      <rect x="520" y="50" width="80" height="44" rx="6" fill="#171717" fill-opacity="0" stroke="#f59e0b" stroke-width="2"/><text x="560" y="77" text-anchor="middle">0.8</text>
      <rect x="40" y="102" width="80" height="44" rx="6" fill="#171717" fill-opacity="0" stroke="#737373" stroke-width="2"/><text x="80" y="129" text-anchor="middle">0.8</text>
      <rect x="520" y="102" width="80" height="44" rx="6" fill="#171717" fill-opacity="0" stroke="#f59e0b" stroke-width="2"/><text x="560" y="129" text-anchor="middle">0.8</text>
      <rect x="40" y="154" width="80" height="44" rx="6" fill="#171717" fill-opacity="0" stroke="#737373" stroke-width="2"/><text x="80" y="181" text-anchor="middle">0.2</text>
      <rect x="520" y="154" width="80" height="44" rx="6" fill="#171717" fill-opacity="0" stroke="#f59e0b" stroke-width="2"/><text x="560" y="181" text-anchor="middle">0.2</text>
      <rect x="40" y="206" width="80" height="44" rx="6" fill="#171717" fill-opacity="0" stroke="#737373" stroke-width="2"/><text x="80" y="233" text-anchor="middle">0.2</text>
      <rect x="520" y="206" width="80" height="44" rx="6" fill="#171717" fill-opacity="0" stroke="#f59e0b" stroke-width="2"/><text x="560" y="233" text-anchor="middle">0.2</text>
      <rect x="280" y="102" width="80" height="44" rx="6" fill="#171717" fill-opacity="0" stroke="#10b981" stroke-width="2"/><text x="320" y="129" text-anchor="middle">0.8</text>
      <rect x="280" y="154" width="80" height="44" rx="6" fill="#171717" fill-opacity="0" stroke="#10b981" stroke-width="2"/><text x="320" y="181" text-anchor="middle">0.2</text>
      <text x="200" y="155" text-anchor="middle">encoder</text><text x="440" y="155" text-anchor="middle">decoder</text>
      <text x="80" y="32" text-anchor="middle">input x: 4 numbers</text><text x="320" y="84" text-anchor="middle" fill="#10b981">latent z: 2 numbers</text><text x="560" y="32" text-anchor="middle" fill="#f59e0b">rebuilt x̂: 4 numbers</text>
      <text x="320" y="280" text-anchor="middle" fill="#737373">wide, then narrow, then wide again</text>
      </g>
      </svg>
      ```

      ### The two halves as formulas

      An **autoencoder** is a network made of an encoder, which turns an input of $n$ numbers into a latent vector of $k$ numbers, with $k<n$, and a decoder, which turns it back into $n$ numbers. Let's give each half one layer with no activation $\phi$, so each outputs its weighted sums plus biases directly, which keeps the arithmetic simple:

      $$z=W_ex+b_e$$

      $$\hat x=W_dz+b_d.$$

      The subscript $e$ marks the encoder's weights and bias, and $d$ marks the decoder's. $W_e$ has one row for each of the $k$ latent numbers and one column for each input, so it's $k\times n$. $W_d$ goes the other way, one row per rebuilt number and one column per latent number, so it's $n\times k$. Real autoencoders use several layers per half, with activations such as ReLU, but their layer widths still go from wide to narrow and back.
    worked: |
      Let's run our stripe image $x=(0.8,0.8,0.2,0.2)$ through the network in the picture. We've chosen these weights by hand, with both biases $0$, so we can see how they work. The next step shows how a network measures its copy when it has to find its own weights.

      1. **Write down the encoder's weights.** Each row of $W_e$ makes one latent number by averaging the two pixels of one image row.
         $$W_e=\begin{pmatrix}0.5&0.5&0&0\\0&0&0.5&0.5\end{pmatrix}$$

      2. **Encode.** Each latent number is the dot product of one row of $W_e$ with $x$.
         $$z=\begin{pmatrix}0.5\cdot0.8+0.5\cdot0.8\\0.5\cdot0.2+0.5\cdot0.2\end{pmatrix}=\begin{pmatrix}0.8\\0.2\end{pmatrix}$$

      3. **Write down the decoder's weights.** Each row says which latent number one pixel copies. The top two pixels copy the first, and the bottom two copy the second.
         $$W_d=\begin{pmatrix}1&0\\1&0\\0&1\\0&1\end{pmatrix}$$

      4. **Decode.** Each output pixel is one row of $W_d$ dotted with $z$.
         $$\hat x=\begin{pmatrix}1\cdot0.8+0\cdot0.2\\1\cdot0.8+0\cdot0.2\\0\cdot0.8+1\cdot0.2\\0\cdot0.8+1\cdot0.2\end{pmatrix}=\begin{pmatrix}0.8\\0.8\\0.2\\0.2\end{pmatrix}$$

      The reconstruction equals the input, even though the middle held only two numbers. The same weights work for every stripe image:

      | Stripe image $x$ | Latent vector $z$ | Reconstruction $\hat x$ |
      | --- | --- | --- |
      | $(0.8,0.8,0.2,0.2)$ | $(0.8,0.2)$ | $(0.8,0.8,0.2,0.2)$ |
      | $(0.1,0.1,0.9,0.9)$ | $(0.1,0.9)$ | $(0.1,0.1,0.9,0.9)$ |
      | $(0.3,0.3,0.6,0.6)$ | $(0.3,0.6)$ | $(0.3,0.3,0.6,0.6)$ |
    problems:
      - ae-encode-decode-basics
      - aep-encode-self-explain
      - aep-flatten-order
      - aep-encode-template
      - aep-decode-value
      - aep-decoder-shape
      - aep-column-stripes
  - id: ae-reconstruction
    title: "Measure how good the copy is"
    tldr: |
      - An autoencoder needs no labels, because the right answer for each image is the image itself.
      - We score a copy by squaring each pixel's miss and adding them up, so misses can't cancel out.
      - Training makes that error small, and a narrow middle stops the network just passing pixels through, so it has to find patterns.
    explain: |
      ### The input is its own answer

      In the last step we chose the weights by hand. A real network finds its own by **training**: it changes its weights and biases in small steps, over and over, so that one error number gets smaller. This lesson only needs that number.

      For an autoencoder, it measures how far the reconstruction $\hat x$ is from the input $x$. Many networks learn from examples a person has labelled with the right answer, such as "cat". An autoencoder's right answer is the input itself, so a pile of unlabelled photos is enough.

      ### Measuring a bad copy

      Our network copies stripes perfectly, but what about $x=(0.8,0.4,0.2,0.2)$, whose top pixels differ?
      $$
      \begin{aligned}
      z_1&=(0.8+0.4)/2=0.6 &&\text{average the top row}\\
      z_2&=(0.2+0.2)/2=0.2 &&\text{average the bottom row}\\
      \hat x&=(0.6,0.6,0.2,0.2) &&\text{copy each average twice}
      \end{aligned}
      $$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" aria-label="Three 2 by 2 grids. The input image has top row 0.8 and 0.4 and bottom row 0.2 and 0.2. The autoencoder rebuilds it as top row 0.6 and 0.6 and bottom row 0.2 and 0.2. The differences, rebuilt minus input, are minus 0.2 and 0.2 on the top row, shown in red, and 0 and 0 on the bottom row. The differences add to 0, but their squares add to 0.08">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="40" y="60" width="60" height="60" fill="#171717" fill-opacity="0.2" stroke="#737373"/><text x="70" y="95" text-anchor="middle" fill="#171717">0.8</text>
      <rect x="100" y="60" width="60" height="60" fill="#171717" fill-opacity="0.6" stroke="#737373"/><text x="130" y="95" text-anchor="middle" fill="#d4d4d4">0.4</text>
      <rect x="40" y="120" width="60" height="60" fill="#171717" fill-opacity="0.8" stroke="#737373"/><text x="70" y="155" text-anchor="middle" fill="#d4d4d4">0.2</text>
      <rect x="100" y="120" width="60" height="60" fill="#171717" fill-opacity="0.8" stroke="#737373"/><text x="130" y="155" text-anchor="middle" fill="#d4d4d4">0.2</text>
      <rect x="260" y="60" width="60" height="60" fill="#171717" fill-opacity="0.4" stroke="#737373"/><text x="290" y="95" text-anchor="middle" fill="#171717">0.6</text>
      <rect x="320" y="60" width="60" height="60" fill="#171717" fill-opacity="0.4" stroke="#737373"/><text x="350" y="95" text-anchor="middle" fill="#171717">0.6</text>
      <rect x="260" y="120" width="60" height="60" fill="#171717" fill-opacity="0.8" stroke="#737373"/><text x="290" y="155" text-anchor="middle" fill="#d4d4d4">0.2</text>
      <rect x="320" y="120" width="60" height="60" fill="#171717" fill-opacity="0.8" stroke="#737373"/><text x="350" y="155" text-anchor="middle" fill="#d4d4d4">0.2</text>
      <rect x="480" y="60" width="60" height="60" fill="#171717" fill-opacity="0" stroke="#737373"/><text x="510" y="95" text-anchor="middle" fill="#ef4444">−0.2</text>
      <rect x="540" y="60" width="60" height="60" fill="#171717" fill-opacity="0" stroke="#737373"/><text x="570" y="95" text-anchor="middle" fill="#ef4444">0.2</text>
      <rect x="480" y="120" width="60" height="60" fill="#171717" fill-opacity="0" stroke="#737373"/><text x="510" y="155" text-anchor="middle" fill="#171717">0</text>
      <rect x="540" y="120" width="60" height="60" fill="#171717" fill-opacity="0" stroke="#737373"/><text x="570" y="155" text-anchor="middle" fill="#171717">0</text>
      <text x="100" y="45" text-anchor="middle">input x</text><text x="320" y="45" text-anchor="middle" fill="#f59e0b">rebuilt x̂</text><text x="540" y="45" text-anchor="middle" fill="#ef4444">x̂ − x</text>
      <defs><marker id="ae2-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <path d="M172 120 L250 120" stroke="#737373" stroke-width="2" marker-end="url(#ae2-m)"/>
      <text x="320" y="225" text-anchor="middle">differences add to 0, but their squares add to 0.08</text>
      </g>
      </svg>
      ```

      Simply adding differences would hide these mistakes:
      $$
      \begin{aligned}
      \hat x-x&=(-0.2,0.2,0,0) &&\text{subtract the input pixels}\\
      \text{sum}&=-0.2+0.2+0+0=0 &&\text{opposite misses cancel}
      \end{aligned}
      $$
      Squaring each difference first makes every miss positive. The **reconstruction error** is

      $$E=\sum_{i=1}^{n}(\hat x_i-x_i)^2,$$

      where $x_i$ is the $i$-th input number and $\hat x_i$ is its reconstruction. The worked example below adds up $E$ for this image. Training makes the average of $E$ over the training images as small as it can.

      ### Why the middle must be narrow

      What stops the network from simply passing every pixel straight through? Only the narrow middle stops it. Here is what three latent sizes can do for the stripe image $(0.8,0.8,0.2,0.2)$:

      - **1 number:** it can't hold both row brightnesses. If it keeps only their average:

        1. **Average all pixels.** This is the one latent number.
           $$(0.8+0.8+0.2+0.2)/4=0.5.$$
        2. **Rebuild every pixel as grey.** Each differs from its input by $0.3$ in size.
           $$\hat x=(0.5,0.5,0.5,0.5).$$
        3. **Square and add the misses.** All four contribute equally.
           $$E=4\times0.3^2=0.36.$$
      - **2 numbers:** one per row is enough, so every stripe image comes back exactly, with $E=0$.
      - **4 numbers:** as many as the input, so nothing is narrowed, and $E=0$ for any image at all, because each pixel can pass straight through. Nothing forces the network to find the stripe pattern, and its latent vector is as long as the image.

      So the latent size should be small enough to force the network to find patterns, and big enough to rebuild the image well.
    worked: |
      Let's work out the reconstruction error of the uneven image $x=(0.8,0.4,0.2,0.2)$, using the weights from step 1.

      1. **Encode.** The first latent number averages the top row, and the second averages the bottom row.
         $$z=(0.5\cdot0.8+0.5\cdot0.4,\ 0.5\cdot0.2+0.5\cdot0.2)=(0.6,0.2)$$

      2. **Decode.** The top pixels copy the first latent number, and the bottom pixels copy the second.
         $$\hat x=(0.6,0.6,0.2,0.2)$$

      3. **Subtract.** We take each rebuilt pixel minus its input pixel.
         $$\hat x-x=(0.6-0.8,\ 0.6-0.4,\ 0,\ 0)=(-0.2,\ 0.2,\ 0,\ 0)$$

      4. **Square and add.** Squaring stops the two misses cancelling.
         $$E=(-0.2)^2+0.2^2+0^2+0^2=0.08$$

      The stripe image had $E=0$, so this larger error says the uneven image doesn't fit the pattern our weights capture. A robot can use the same signal to notice that a camera frame looks unusual, for example to slow down when something unexpected is in view.
    problems:
      - ae-reconstruction-basics
      - aep-recon-self-explain
      - aep-no-labels
      - aep-error-template
      - aep-flat-grey-error
      - aep-wide-latent
      - aep-vertical-stripes
      - aep-robot-unusual
  - id: ae-sizes
    title: "Compare the image with its latent vector"
    tldr: |
      - The compression factor says how many input numbers there are for each latent number.
      - The network itself stores many weights and biases, often far more numbers than one image has.
      - But those are stored once and shared by every image, while each image shrinks to its own short latent vector.
    explain: |
      ### From our tiny image to a real one

      Our stripe network turned $4$ numbers into $2$, but real images are much bigger. A classic beginner's dataset, MNIST, holds $70{,}000$ handwritten digits, each a $28\times28$ grayscale image that flattens to $28\times28=784$ numbers. A common latent size for them is $32$, picked by trying sizes until one copies well. The picture draws input, latent vector and copy to scale.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="Bars drawn to scale for the digit autoencoder. The input bar, 784 numbers, is 200 pixels tall. The green latent bar, 32 numbers, is only about 8 pixels tall. The orange reconstruction bar, 784 numbers, is 200 pixels tall again. Grey bands narrow from the input to the latent and widen to the reconstruction">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M140 40 L280 135.92 L280 144.08 L140 240 Z" fill="#d4d4d4" fill-opacity="0.4"/>
      <path d="M360 135.92 L500 40 L500 240 L360 144.08 Z" fill="#d4d4d4" fill-opacity="0.4"/>
      <rect x="60" y="40" width="80" height="200" fill="#737373"/>
      <rect x="280" y="135.92" width="80" height="8.16" fill="#10b981"/>
      <rect x="500" y="40" width="80" height="200" fill="#f59e0b"/>
      <text x="100" y="265" text-anchor="middle">784 pixels</text><text x="320" y="265" text-anchor="middle" fill="#10b981">32 numbers</text><text x="540" y="265" text-anchor="middle" fill="#f59e0b">784 pixels</text>
      <text x="100" y="28" text-anchor="middle">input</text><text x="320" y="28" text-anchor="middle" fill="#10b981">latent</text><text x="540" y="28" text-anchor="middle" fill="#f59e0b">rebuilt</text>
      <text x="320" y="290" text-anchor="middle" fill="#737373">bar heights to scale: 784 ÷ 32 = 24.5</text>
      </g>
      </svg>
      ```

      To compare the input with the latent vector, we divide the input size $n$ by the latent size $k$. The **compression factor** is

      $$\frac{n}{k},$$

      which says how many input numbers there are for each latent number. For our stripe images it's $4/2=2$, and the worked example finds it for the digits.

      A colour image has red, green and blue channels. For a robot's $64\times64$ frame, try a latent size of $256$:
      $$
      \begin{aligned}
      n&=64\times64\times3=12{,}288 &&\text{count all channel values}\\
      n/k&=12{,}288/256=48 &&\text{divide by the latent size}
      \end{aligned}
      $$

      ### Counting the parameters

      How much does the network itself store? In the forward-pass lesson, we counted a layer's parameters as $d_\text{out}d_\text{in}+d_\text{out}$: one weight per input per neuron, plus one bias per neuron. The encoder has $k$ neurons reading $n$ inputs, and the decoder has $n$ neurons reading $k$ inputs, so

      $$\text{encoder: }kn+k,\qquad\text{decoder: }nk+n.$$

      Both halves have $nk$ weights, but the decoder has more biases, one per rebuilt pixel. For our stripe network:
      $$
      \begin{aligned}
      \text{encoder}&=2\times4+2=10 &&\text{use }k=2,\ n=4\\
      \text{decoder}&=4\times2+4=12 &&\text{reverse the layer widths}\\
      \text{total}&=10+12=22 &&\text{add both halves}
      \end{aligned}
      $$

      The digit network has about fifty thousand parameters, far more than $784$, so it can look as if nothing was saved. But they're stored once and shared by every image, and what shrinks is each image, now $32$ numbers instead of $784$.

      ### A batch of images

      As in the forward-pass lesson, put one image per row in a matrix $X$. A layer computes $XW^\top+b$, applying $Wx+b$ to every row. For $B$ digit images:

      1. **Flatten each image.** The input shape is $B\times784$.
      2. **Encode each row.** $XW_e^\top+b_e$ has shape $B\times32$.
      3. **Decode each row.** The reconstruction returns to shape $B\times784$.
    worked: |
      Let's size up the digit autoencoder, with $28\times28$ grayscale inputs and a latent vector of $32$ numbers.

      1. **Flatten the input.** Laying the rows end to end gives the input length.
         $$n=28\times28=784$$

      2. **Find the compression factor.** We divide the input length by the latent length.
         $$\frac{n}{k}=\frac{784}{32}=24.5$$

      3. **Count the encoder's parameters.** It has $32$ neurons, each with $784$ weights and one bias.
         $$kn+k=32\times784+32=25{,}120$$

      4. **Count the decoder's parameters.** It has $784$ neurons, each with $32$ weights and one bias.
         $$nk+n=784\times32+784=25{,}872$$

      5. **Add the two halves.**
         $$25{,}120+25{,}872=50{,}992$$

      Each digit is summarised by $32$ numbers instead of $784$, a compression factor of $24.5$. The roughly $51$ thousand parameters that do this are shared by every digit.
    problems:
      - ae-sizes-basics
      - aep-sizes-self-explain
      - aep-flat-length-template
      - aep-ratio-template
      - aep-encoder-params-template
      - aep-batch-latent-shape
      - aep-params-vs-pixels
      - aep-robot-camera-ratio
  - id: ae-latent-space
    title: "Find images that look alike"
    tldr: |
      - Each latent vector is a point, with one axis per latent number.
      - Images that look alike get points close together, so the distance between points compares images.
      - The latent numbers have no fixed meaning, and small details the copy doesn't need can be missing.
    explain: |
      ### Every image becomes a point

      The vectors lesson treated a list of numbers as a point, one axis per number. The distance between two points was the square root of the summed squared differences. So each latent vector is a point in the **latent space**, one axis per latent number.

      In our stripe network, the horizontal axis is $z_1$, the top row's brightness, and the vertical axis is $z_2$, the bottom row's brightness. Image A, $(0.8,0.8,0.2,0.2)$, lands at $(0.8,0.2)$. Image B, $(0.8,0.8,0.3,0.3)$, lands next to it, at $(0.8,0.3)$. Image C, $(0.5,0.5,0.6,0.6)$, lands further away, at $(0.5,0.6)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" aria-label="Latent space of the stripe autoencoder: across is z1, the top row brightness, and up is z2, the bottom row brightness, both from 0 to 1. Image A, light on top and dark below, is the point (0.8, 0.2). Image B, with a slightly lighter bottom row, is the point (0.8, 0.3), at distance 0.1 from A. Image C, almost even grey, is the point (0.5, 0.6), at distance 0.5 from A">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M70 300 H330 M70 300 V40" stroke="#737373" stroke-width="1.5"/>
      <text x="70" y="320" text-anchor="middle" fill="#737373">0</text>
      <text x="200" y="320" text-anchor="middle" fill="#737373">0.5</text>
