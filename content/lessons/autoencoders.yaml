summary: |
  - An autoencoder has an encoder that squeezes an input of $n$ numbers into a latent vector of $k$ numbers, with $k<n$, $z=W_ex+b_e$, and a decoder that rebuilds it, $\hat x=W_dz+b_d$.
  - It is trained to copy its own input, so it needs no labels. Training makes the reconstruction error $E=\sum_i(\hat x_i-x_i)^2$ small, and the narrow middle forces the latent vector to keep the patterns that matter.
  - The compression factor $n/k$ compares the input and latent lengths, such as $784/32=24.5$ for a digit. The parameters, $kn+k$ for the encoder and $nk+n$ for the decoder, are shared by every image.
  - Each latent vector is a point in latent space, where similar images land close together, so world models and policies often work with latent vectors. The latent numbers have no fixed meaning, and small details can be lost.

  **Next:** The world models lesson trains a network to predict what happens next in latent space, and then trains a policy inside those predictions.
