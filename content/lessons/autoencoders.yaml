      Let's measure how far apart the three images in the picture are in latent space.

      1. **Read off the latent vectors.** Each one is the image's two row brightnesses.
         $$z_A=(0.8,0.2),\quad z_B=(0.8,0.3),\quad z_C=(0.5,0.6)$$

      2. **Find the distance from A to B.** We subtract the matching numbers, square, add and take the square root.
         $$\sqrt{(0.8-0.8)^2+(0.3-0.2)^2}=\sqrt{0.01}=0.1$$

      3. **Find the distance from A to C.** We do the same with C's numbers.
         $$\sqrt{(0.5-0.8)^2+(0.6-0.2)^2}=\sqrt{0.09+0.16}=0.5$$

      The A to C distance is five times the A to B distance, which matches how they look: A and B are both light on top and dark below, while C is almost an even grey.
