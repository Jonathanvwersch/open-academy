concept: pretraining
version: 1
objective: |
  **Goal:** describe the stages of an LLM training pipeline, from collecting and cleaning text through pretraining to post-training, and estimate what a pretraining run costs and how its loss improves with scale.
recap:
  - concept: autoregressive-lm
    text: "A language model predicts each token from the ones before it, $p(x_{t+1}\\mid x_1,\\dots,x_t)$, and adds the cross-entropy loss $-\\ln p$ of the true next token at every position."
  - concept: tokenization
    text: "A token is a short piece of text, such as a word or part of one, and a tokenizer splits text into tokens."
where_this_fits: |
  ### What is pretraining?

  Pretraining is the first and biggest stage of training a large language model, or LLM. We train the model to predict the next token across an enormous amount of text.

  Text needs no labels, because each next token is its own answer, and predicting it well teaches the model grammar, facts and patterns of reasoning. This lesson follows a model from raw text to an assistant and estimates what pretraining costs.
knowledge_points:
  - id: pt-training-data
    title: "Prepare text for training"
    explain: |
      ### Where the text comes from

      To pretrain a model we need far more text than anyone could write for the job. So most of it is gathered from the public web by programs called crawlers, which download pages and follow their links. The Common Crawl archive, a free collection of crawled pages, is a usual starting point, and it's mixed with books, Wikipedia, scientific papers and, in many recent models, computer code. We count dataset sizes in tokens. OpenAI's GPT-3, a large language model from 2020, was trained on 300 billion tokens, and Meta's Llama 3 model on over 15 trillion in 2024.

      ### Cleaning, tokenizing and packing

      Raw web pages are messy, so the text goes through the four stages along the top of the picture. First we **filter** out pages that aren't useful writing, such as spam, menus of links and gibberish. Then we **deduplicate**, which means removing repeated copies. Next the tokenizer turns the text into tokens. Finally we pack the tokens into windows of the same length $T$, so that the computer can process many windows side by side as one block of numbers.

      The picture uses whole words as tokens. Two documents survive cleaning, "the cat sat on the mat" and "a dog ran". We join them into one long stream, with an end-of-text token, written [end], after each document so the model can tell where one stops and the next begins. Then we cut the stream into windows of $T=4$ tokens. A window can hold the end of one document and the start of the next, as window 2 does, and the [end] token between them shows that a new text has begun.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="Top: the data stages as four boxes joined by arrows, filter, deduplicate, tokenize and pack into windows. Bottom: two documents, the cat sat on the mat and a dog ran, joined into one stream of 11 tokens, including an end token after each document. The stream is cut into windows of 4 tokens: window 1 is the cat sat on, window 2 is the mat end a, and the last 3 tokens, dog ran end, are left out of this small example">
      <defs><marker id="pt1-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="10.0" y="20" width="130" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="75.0" y="47" text-anchor="middle">1. Filter</text>
      <path d="M143.0 42 H170.3" stroke="#737373" stroke-width="2" marker-end="url(#pt1-muted)"/>
      <rect x="173.3" y="20" width="130" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="238.3" y="47" text-anchor="middle">2. Deduplicate</text>
      <path d="M306.3 42 H333.7" stroke="#737373" stroke-width="2" marker-end="url(#pt1-muted)"/>
      <rect x="336.7" y="20" width="130" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="401.7" y="47" text-anchor="middle">3. Tokenize</text>
      <path d="M469.7 42 H497.0" stroke="#737373" stroke-width="2" marker-end="url(#pt1-muted)"/>
      <rect x="500.0" y="20" width="130" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="565.0" y="47" text-anchor="middle">4. Pack windows</text>
      <text x="23.0" y="136" fill="#737373">one stream of tokens</text>
      <rect x="25.0" y="150" width="50" height="40" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><text x="50.0" y="175" text-anchor="middle">the</text>
      <rect x="79.0" y="150" width="50" height="40" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><text x="104.0" y="175" text-anchor="middle">cat</text>
      <rect x="133.0" y="150" width="50" height="40" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><text x="158.0" y="175" text-anchor="middle">sat</text>
      <rect x="187.0" y="150" width="50" height="40" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><text x="212.0" y="175" text-anchor="middle">on</text>
      <rect x="241.0" y="150" width="50" height="40" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/><text x="266.0" y="175" text-anchor="middle">the</text>
      <rect x="295.0" y="150" width="50" height="40" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/><text x="320.0" y="175" text-anchor="middle">mat</text>
      <rect x="349.0" y="150" width="50" height="40" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/><text x="374.0" y="175" text-anchor="middle">[end]</text>
      <rect x="403.0" y="150" width="50" height="40" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/><text x="428.0" y="175" text-anchor="middle">a</text>
      <rect x="457.0" y="150" width="50" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="482.0" y="175" text-anchor="middle">dog</text>
      <rect x="511.0" y="150" width="50" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="536.0" y="175" text-anchor="middle">ran</text>
      <rect x="565.0" y="150" width="50" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="590.0" y="175" text-anchor="middle">[end]</text>
      <path d="M27.0 202 V210 H235.0 V202" stroke="#3b82f6" stroke-width="2" fill="#ffffff" fill-opacity="0"/><text x="131.0" y="230" text-anchor="middle" fill="#3b82f6">window 1</text>
      <path d="M243.0 202 V210 H451.0 V202" stroke="#10b981" stroke-width="2" fill="#ffffff" fill-opacity="0"/><text x="347.0" y="230" text-anchor="middle" fill="#10b981">window 2</text>
      <path d="M459.0 202 V210 H613.0 V202" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0"/><text x="536.0" y="230" text-anchor="middle" fill="#737373">left over</text>
      <text x="320" y="265" text-anchor="middle" fill="#737373">each window of T = 4 tokens gives 3 next-token predictions</text>
      </g>
      </svg>
      ```

      **Pretraining data** is this long stream of cleaned, deduplicated tokens, cut into windows of a fixed length $T$. Each window is trained on its own, like one sequence of tokens in the opening, so its first token has nothing before it to be predicted from. Every later token is predicted from the ones before it, so a window gives $T-1$ predictions.

      Be careful not to think of duplicates as harmless extra data. A model that sees the same passage many times tends to memorise it word for word, and every repeat costs training time without teaching anything new.
    worked: |
      Let's count how many predictions a tiny collection gives the model to learn from. It has three documents, "the cat sat on the mat", the same sentence again, and "a dog ran". As in the picture, each word is one token, and we pack the tokens into windows of $T=4$.

      1. **Remove the duplicate.** The second document is an exact copy of the first, so deduplication drops it, leaving two documents.

      2. **Count the tokens.** Each document gives its words plus one [end] token.
         $$(6+1)+(3+1)=11\text{ tokens}.$$

      3. **Cut the stream into windows.** Each window takes $4$ tokens, so $11$ tokens fill $2$ windows with $3$ tokens left over, too few for a third window, so this small example leaves them out.
         $$11=2\times4+3.$$

      4. **Count the predictions.** Each window predicts every token after its first one, which is $T-1=3$ tokens.
         $$2\times3=6\text{ predictions}.$$

      Without deduplication the stream would have $18=4\times4+2$ tokens and give $4\times3=12$ predictions, but the repeated cat sentence adds no new text while still costing training time.
