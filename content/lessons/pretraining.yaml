  - id: pt-training-compute
    title: "Estimate the cost of a training run"
    explain: |
      ### Counting operations

      Once we have the data, how much computing does training take? We measure it in **floating-point operations**, or FLOPs. Floating-point numbers are numbers with a decimal point, the kind the weights are stored as, and one FLOP is a single addition or multiplication of two of them.

      Almost every parameter is a weight in some matrix, and in the matrices lesson we saw that multiplying a matrix by a vector multiplies each weight by one number and adds the product to a running total. That's two FLOPs per weight, so the forward pass costs about $2$ FLOPs per parameter for each token.

      Training also needs the slope of the loss for every weight. The model finds them working backwards, one layer at a time. At each weight it does two multiply-and-add steps. One gives that weight's slope, and the other passes a slope back so the layer before can find its own. That's about $4$ more FLOPs, for $6$ in all.

      ### The compute formula

      So the **training compute** of a run, the total number of FLOPs it takes, is approximately

      $$C\approx6PD,$$

      where $P$ is the number of parameters, $D$ is the number of training tokens, and $6$ is the FLOPs per parameter per token. The formula leaves out the work attention does comparing tokens with each other, which grows with the window length and is small next to the weight multiplications unless windows are very long.

      The numbers get big, so we write them with powers of ten. $10^6$ is a $1$ followed by six zeros, a million, and the raised $6$ is called the exponent. A small model with $P=10^6$ parameters trained on $D=2\times10^7$ tokens needs $1.2\times10^{14}$ FLOPs. GPT-3, with $175$ billion parameters trained on $300$ billion tokens, needs about $3.15\times10^{23}$ FLOPs.

      ### What that means in time

      Training runs on GPUs, the chips built to do many multiplications at once. Suppose one GPU can do $10^{14}$ FLOPs every second. The small model then trains in about a second, but GPT-3 would take about $100$ years, which is why large runs share the work across thousands of GPUs.

      Be careful not to read compute as model size. If we double the training tokens, the compute doubles, even though the model stays the same size.
    worked: |
      Let's work out the compute and training time of the two runs in the explanation, using $C\approx6PD$ and a GPU that can do $10^{14}$ FLOPs per second.

      1. **Find the cost of one token for the small model.** Each of its $P=10^6$ parameters costs $6$ FLOPs per token, $2$ for the forward pass and $4$ for the slopes.
         $$6P=6\times10^6\text{ FLOPs per token}.$$

      2. **Multiply by the number of tokens.** It trains on $D=2\times10^7$ tokens. We multiply the plain numbers, $6\times2=12$, and add the exponents, $6+7=13$. Moving the decimal point one place left and adding $1$ to the exponent writes the answer in the usual form.
         $$C=6\times10^6\times2\times10^7=12\times10^{13}=1.2\times10^{14}.$$

      3. **Turn FLOPs into seconds.** Dividing by the GPU's speed gives the time.
         $$\frac{1.2\times10^{14}}{10^{14}}=1.2\text{ seconds}.$$

      4. **Do the same for GPT-3.** Now $P=1.75\times10^{11}$ and $D=3\times10^{11}$.
         $$C=6\times1.75\times10^{11}\times3\times10^{11}=31.5\times10^{22}=3.15\times10^{23}.$$

      5. **Turn that into years.** It takes $3.15\times10^{23}/10^{14}=3.15\times10^9$ seconds, and a year has about $3.15\times10^7$ seconds.
         $$\frac{3.15\times10^{9}}{3.15\times10^{7}}=100\text{ years}.$$

      The same formula covers both runs. Only $P$ and $D$ change, and together they decide whether training takes a second or a century on one GPU.
    problems:
      - pt-training-compute-basics
      - ptp-compute-self-explain
      - ptp-double-tokens
      - ptp-compute-template
      - ptp-forward-only
      - ptp-gpu-days-template
      - ptp-compare-runs
