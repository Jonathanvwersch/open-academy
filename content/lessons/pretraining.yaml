  - id: pt-scaling-laws
    title: "Predict the loss of a bigger training run"
    explain: |
      ### Loss against compute

      What does more compute buy, and can we know before paying for it?

      In 2020, Kaplan and colleagues at OpenAI found a simple pattern across many language models. As long as neither the model's size nor its data holds it back, the loss on test text the model never trained on falls smoothly as compute grows. Every tenfold increase in compute multiplies the loss by about the same factor. The picture starts from a run with a loss of $4$, measures compute in multiples of that run, and uses a factor of $0.9$, close to what they measured. So three tenfold steps take it to $3.6$, then $3.24$, then $2.916$, about $2.92$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" aria-label="Loss against training compute on logarithmic axes, with each compute tick ten times the one before. Four green points, at compute 1, 10, 100 and 1000 times the first run, have losses 4, 3.6, 3.24 and 2.92. They lie on one straight line, because each tenfold step multiplies the loss by 0.9">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M90 20 V260 H620" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
      <path d="M110.00 65.27 L590.00 228.98" stroke="#10b981" stroke-width="2" stroke-dasharray="6 5"/>
      <circle cx="110.00" cy="65.27" r="5" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="110.00" y="51.27" text-anchor="middle">4</text>
      <path d="M110.00 260 v6" stroke="#737373"/><text x="110.00" y="284" text-anchor="middle" fill="#737373">1</text>
      <circle cx="270.00" cy="119.84" r="5" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="270.00" y="105.84" text-anchor="middle">3.6</text>
      <path d="M270.00 260 v6" stroke="#737373"/><text x="270.00" y="284" text-anchor="middle" fill="#737373">10</text>
      <circle cx="430.00" cy="174.41" r="5" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="430.00" y="160.41" text-anchor="middle">3.24</text>
      <path d="M430.00 260 v6" stroke="#737373"/><text x="430.00" y="284" text-anchor="middle" fill="#737373">100</text>
      <circle cx="590.00" cy="228.98" r="5" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="590.00" y="214.98" text-anchor="middle">2.92</text>
      <path d="M590.00 260 v6" stroke="#737373"/><text x="590.00" y="284" text-anchor="middle" fill="#737373">1000</text>
      <text x="350" y="310" text-anchor="middle" fill="#737373">training compute (each tick ten times the last)</text>
      <text x="90" y="12" fill="#737373">loss</text>
      </g>
      </svg>
      ```

      On these axes, each tenfold step in compute moves the same distance right. The loss axis is spaced so that each multiplication by $0.9$ moves the same distance down, so the points lie on a straight line. The actual drops shrink, $0.4$, then $0.36$, then about $0.32$, so improvements keep getting more expensive.

      ### Scaling laws

      A **scaling law** is a formula that predicts a model's loss from the compute, parameters or data used to train it. The one in the picture is

      $$L=L_0\times0.9^{k},$$

      where $L_0$ is the loss of a starting run and $k$ is how many tenfold steps of compute we add. Scaling laws are useful for planning. A lab can train a few small models, draw a line through their points, and extend it to predict the loss of a far bigger run.

      ### Splitting the budget

      For a fixed budget $C\approx6PD$, should we build a bigger model or train it on more tokens? In 2022, Hoffmann and colleagues at DeepMind found that at any budget the lowest loss comes at about $20$ training tokens per parameter. Their Chinchilla model had $70$ billion parameters and $1.4$ trillion tokens. It beat their earlier $280$-billion-parameter Gopher model on most tests, using about the same compute.

      Scaling laws predict only the loss, though. Which skills a model will have at a given loss is much harder to forecast. Many recent models are trained far past $20$ tokens per parameter, because a smaller model needs fewer FLOPs every time it answers a user.
    worked: |
      Let's plan a run with a budget of $C=1.2\times10^{16}$ FLOPs, splitting it at $20$ tokens per parameter.

      1. **Write the tokens in terms of the parameters.** Twenty tokens per parameter means
         $$D=20P.$$

      2. **Put that into the compute formula.** The budget becomes a formula in $P$ alone.
         $$C=6P\times20P=120P^2.$$

      3. **Solve for the parameters.** We divide the budget by $120$. Since $1.2/120=10^{-2}$, this gives $10^{-2}\times10^{16}=10^{14}$. The square root halves the exponent, because $10^7\times10^7=10^{14}$.
         $$P^2=\frac{1.2\times10^{16}}{120}=10^{14},\qquad P=10^7.$$

      4. **Find the tokens.** Each parameter gets $20$ tokens.
         $$D=20\times10^7=2\times10^8.$$

      5. **Predict the loss.** Suppose the team first trained a few small runs and measured the same factor $0.9$ as the picture. The smallest used $1.2\times10^{14}$ FLOPs, like the small model in the compute step, and reached a loss of $4$. Our budget is $100$ times bigger, two tenfold steps, so
         $$L=4\times0.9^2=3.24.$$

      So the budget buys a model with ten million parameters trained on two hundred million tokens, and the scaling law tells us roughly what loss to expect before we start.
    problems:
      - pt-scaling-laws-basics
      - ptp-scaling-self-explain
      - ptp-smaller-drops
      - ptp-scaling-template
      - ptp-tokens-per-param-template
      - ptp-straight-line
      - ptp-budget-split-template
