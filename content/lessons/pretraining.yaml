      - ptp-scaling-limits
  - id: pt-training-pipeline
    title: "Follow a model from raw text to assistant"
    explain: |
      ### From raw text to an assistant

      So far we've looked at pretraining itself. It is one stage of a longer pipeline that ends with an assistant, so let's follow a model through the whole pipeline, from left to right in the picture.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" aria-label="The LLM training pipeline from left to right: text data, then a tokenizer, then pretraining, which gives a base model that continues text, then post-training, which gives an assistant. A bar underneath pretraining and post-training, labelled evaluate on unseen tests, shows the model being tested throughout both">
      <defs><marker id="pt3-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="10.0" y="30" width="120" height="54" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="70.0" y="62" text-anchor="middle">Text data</text>
      <path d="M133.0 57 H173.7" stroke="#737373" stroke-width="2" marker-end="url(#pt3-muted)"/>
      <rect x="176.7" y="30" width="120" height="54" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="236.7" y="62" text-anchor="middle">Tokenizer</text>
      <path d="M299.7 57 H340.3" stroke="#737373" stroke-width="2" marker-end="url(#pt3-muted)"/>
      <rect x="343.3" y="30" width="120" height="54" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/><text x="403.3" y="54" text-anchor="middle">Pretraining</text>
      <text x="403.3" y="73" text-anchor="middle" font-size="13" fill="#737373">most compute</text>
      <path d="M466.3 57 H507.0" stroke="#737373" stroke-width="2" marker-end="url(#pt3-muted)"/>
      <rect x="510.0" y="30" width="120" height="54" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/><text x="570.0" y="48" text-anchor="middle">Post-training</text>
      <text x="570.0" y="64" text-anchor="middle" font-size="13" fill="#737373"><tspan x="570.0">usually far less </tspan><tspan x="570.0" y="78">compute</tspan></text>
      <text x="403.3" y="110" text-anchor="middle">gives a base model</text><text x="403.3" y="128" text-anchor="middle" fill="#737373">that continues text</text>
      <text x="570.0" y="110" text-anchor="middle">gives an assistant</text><text x="570.0" y="128" text-anchor="middle" fill="#737373">that answers</text>
      <rect x="343.3" y="160" width="286.7" height="36" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/><text x="486.7" y="183" text-anchor="middle" fill="#171717">evaluate on unseen tests</text>
      </g>
      </svg>
      ```

      First comes the text data, filtered and deduplicated as we saw earlier. Next the tokenizer turns the text into tokens, which are packed into windows as in the first step. It gets its own box because the same tokenizer is used whenever the finished model reads or writes text. Then the pretraining run trains the model on those tokens, often for weeks. During the run, the team training it watches the loss fall and regularly saves **checkpoints**, copies of all the weights, so that if one of thousands of GPUs fails, training can resume from the last checkpoint.

      ### What pretraining produces

      The result is a **base model**, a model that has learned to continue text. Be careful not to expect a base model to answer questions. Given "What is the capital of France?", it may well continue with another quiz question, because on the web a question like that is often followed by more questions.

      ### Post-training

      Turning a base model into a helpful assistant is the job of **post-training**. It usually starts with supervised fine-tuning, training on examples of the answers we want. The model is trained in the same way, on next-token prediction, but on a much smaller set of example conversations that show good answers. It often goes on to methods that learn from people's preferences between two answers, or from problems whose answers can be checked. Later lessons cover each of these.

      Post-training sees far less text than pretraining, so most of what the model knows comes from pretraining. Post-training mostly changes how the model responds. Throughout pretraining and post-training, the team **evaluates** the model on tests it never trained on, to pick the best checkpoint and catch problems early.

      So the **LLM training pipeline** is the sequence of data, tokenizer, pretraining and post-training, with evaluation running alongside.
    worked: |
      Let's compare the compute of pretraining and supervised fine-tuning for one model with $P=10^9$ parameters, using $C\approx6PD$.

      1. **Pick the pretraining tokens.** Aiming for the lowest loss, we use the Chinchilla ratio of $20$ tokens per parameter, so pretraining uses
         $$D_{\text{pre}}=20\times10^9=2\times10^{10}\text{ tokens}.$$

      2. **Count the fine-tuning tokens.** Suppose we fine-tune on $10^4$ example conversations of $500$ tokens each.
         $$D_{\text{fine}}=10^4\times500=5\times10^6\text{ tokens}.$$

      3. **Find each stage's compute.** Both stages train the same model, so each costs $6P$ FLOPs per token. Fine-tuning costs $C_{\text{fine}}=6\times10^9\times5\times10^6=3\times10^{16}$ FLOPs, and pretraining costs
         $$C_{\text{pre}}=6\times10^9\times2\times10^{10}=1.2\times10^{20}.$$

      4. **Compare them.** Dividing one by the other, the $6P$ cancels, so the ratio is just the ratio of tokens.
         $$\frac{C_{\text{pre}}}{C_{\text{fine}}}=\frac{2\times10^{10}}{5\times10^6}=4000.$$

      With these numbers, pretraining sees $4000$ times as much text as fine-tuning, and costs $4000$ times as much compute, which is why almost all the compute of training an LLM goes into pretraining.
    problems:
      - pt-training-pipeline-basics
      - ptp-pipeline-self-explain
      - ptp-base-model
      - ptp-checkpoints
      - ptp-fine-tune-ratio-template
      - ptp-which-stage
      - ptp-test-leak
      - ptp-robot-pipeline
final: pt-explain-pipeline
summary: |
  - Pretraining trains a language model to predict the next token over a huge stream of web text, books and code that has been filtered, deduplicated, tokenized and cut into windows of $T$ tokens, each giving $T-1$ predictions.
  - Training a model with $P$ parameters on $D$ tokens takes about $C\approx6PD$ FLOPs, $2$ per parameter per token for the forward pass and about $4$ more for the slopes.
  - Scaling laws find that the loss falls smoothly with compute, by about the same factor for every tenfold increase, and a fixed budget gives the lowest loss at roughly $20$ tokens per parameter.
  - The LLM training pipeline runs data, tokenizer, pretraining and post-training, with evaluation alongside. Pretraining gives a base model that continues text, and post-training turns it into an assistant.

  **Next:** The supervised fine-tuning lesson takes a pretrained base model and trains it on example conversations so that it answers questions and follows instructions.
