  - id: pd-top-p
    title: Choose how much probability to keep
    explain: |
      ### Letting the number kept change

      The assistant's probabilities change at each prefill or decode prediction. We want the number of choices to adapt to those probabilities. **Top-p sampling**, also called nucleus sampling, adds the most likely tokens one by one until their total probability reaches at least a chosen threshold $p$, with $0<p\le1$. Here $p$ is a cutoff for the total. Then we renormalise and draw from the retained set.

      To find the set, sort tokens from most to least probable. Add their probabilities until the running total first reaches or exceeds $p$, then stop. Keep all tokens added so far, including the one that crosses the threshold.

      For the toy choices Yes, Maybe, No and full stop, use probabilities $0.4$, $0.3$, $0.2$, $0.1$ again. Yes takes four tenths of the bar's width, Maybe three tenths, and so on. With $p=0.8$, the first two reach only $0.7$, so we must keep No as well, reaching $0.9$. The orange line marks the threshold inside No's segment.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" aria-label="Sorted probabilities Yes 0.4, Maybe 0.3, No 0.2, full stop 0.1 form a bar from 0 to 1. The top-p threshold 0.8 lies inside No's segment, so the first three whole tokens are retained, reaching cumulative probability 0.9.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
      <text x="20" y="22">Sorted probability, p = 0.8</text>
      <text x="84" y="56" text-anchor="middle">Yes</text><text x="196" y="56" text-anchor="middle">Maybe</text><text x="276" y="56" text-anchor="middle">No</text><text x="324" y="56" text-anchor="middle">.</text>
      <rect x="20" y="66" width="128" height="32" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6"/>
      <rect x="148" y="66" width="96" height="32" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6"/>
      <rect x="244" y="66" width="64" height="32" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6"/>
      <rect x="308" y="66" width="32" height="32" fill="#d4d4d4" fill-opacity="0" stroke="#d4d4d4"/>
      <text x="20" y="125" text-anchor="middle">0</text><text x="148" y="125" text-anchor="middle">0.4</text><text x="244" y="125" text-anchor="middle">0.7</text><text x="308" y="125" text-anchor="middle">0.9</text><text x="340" y="125" text-anchor="middle">1</text>
      <path d="M276 62 V102" stroke="#f59e0b" stroke-width="3"/><text x="276" y="158" text-anchor="middle">threshold 0.8</text>
      </g></svg>
      ```

      ### Different distributions, different counts

      With the same threshold $p=0.8$, probabilities $0.85$, $0.05$, $0.05$, $0.05$ keep just one token. Probabilities $0.25$, $0.25$, $0.25$, $0.25$ keep all four. This adapts the count to how concentrated the probabilities are.

      Be careful with the boundary. If the running total equals $p$, stop there. If it falls short, include the next token with its full probability. Divide by the actual retained total, which can exceed $p$. For example, our retained total is $0.9$, so dividing by $0.8$ would leave probabilities summing to more than 1.

      ### Choosing a token during generation

      A generation program can apply temperature to logits, compute softmax, then filter and sample. Our filter examples start from probabilities after that softmax step. We demonstrate top-k and top-p separately. The same procedure works after prefill and after each later decode pass. Either filter can remove a useful continuation. Check generated answers for incorrect or irrelevant text when changing $k$ or $p$.
    worked: |
      Let's apply $p=0.8$ to Yes, Maybe, No and full stop with probabilities $0.4$, $0.3$, $0.2$, $0.1$, then draw with $u=0.85$.

      1. **Find the cutoff.** The third token is needed to reach the threshold.
         $$\begin{aligned}0.4&<0.8,\\0.4+0.3&=0.7<0.8,\\0.7+0.2&=0.9\ge0.8.\end{aligned}$$

      2. **Renormalise the three survivors.** Divide each original probability by their actual total, $0.9$.
         $$\begin{aligned}p'_{\mathrm{Yes}}&=4/9,\\p'_{\mathrm{Maybe}}&=3/9,\\p'_{\mathrm{No}}&=2/9.\end{aligned}$$

      3. **Locate the draw.** Yes and Maybe together end at seven ninths, about $0.78$, so $u=0.85$ chooses No.
         $$7/9\le0.85<1\quad\Rightarrow\quad\text{No}.$$

      This complete Python example takes a nonempty list of positive probabilities summing to 1. As in top-k, tied probabilities keep their input order. We use `append` to add an index to `keep` before checking the threshold. Once the total reaches $p$, `break` exits the loop, leaving the crossing token included. The final loop repeats the worked draw $u=0.85$.

      Floating-point sums can land just under $p$, so `math.fsum` adds the retained probabilities more accurately at the boundary.

      ```python
      import math

      def top_p(probs, p):
          if not 0 < p <= 1:
              raise ValueError("p must be in (0, 1]")
          order = sorted(
              range(len(probs)),
              key=lambda i: probs[i], reverse=True
          )
          keep = []
          total = 0.0
          for i in order:
              keep.append(i)
              total = math.fsum(probs[j] for j in keep)
              if total >= p:
                  break
          result = [0.0] * len(probs)
          for i in keep:
              result[i] = probs[i] / total
          return result

      tokens = ["Yes", "Maybe", "No", "."]
      filtered = top_p([0.4, 0.3, 0.2, 0.1], 0.8)
      print([round(prob, 2) for prob in filtered])
      cumulative = 0.0
      for token, prob in zip(tokens, filtered):
          cumulative += prob
          if 0.85 < cumulative:
              print(token)
              break
      # prints:
      # [0.44, 0.33, 0.22, 0.0]
      # No
      ```
