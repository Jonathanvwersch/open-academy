  - id: pd-top-k
    title: Keep a fixed count of likely tokens
    explain: |
      ### Removing unlikely choices

      Temperature changes the assistant's next-token probabilities. The assistant can still choose an unlikely token. To remove the least likely choices, we can filter them out. Let the toy vocabulary be Yes, Maybe, No and a full stop. Suppose their probabilities, after temperature and softmax, are $0.4$, $0.3$, $0.2$ and $0.1$.

      **Top-k sampling** keeps the $k$ most probable tokens and removes the rest. Choose a whole number $k$ from 1 to the vocabulary size. Then divide the retained probabilities by their total so they add up to 1 again. This is called **renormalising**.

      The picture shows $k=2$. Blue boxes remain available and grey boxes are removed. We sort from most to least probable before choosing which boxes stay.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" aria-label="Read sorted choices across each row. Top-k with k equals 2 keeps Yes at 0.4 and Maybe at 0.3 in blue, and removes No at 0.2 and full stop at 0.1 in grey. Divide the retained probabilities by their total, 0.7, before sampling.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
      <text x="20" y="25">Sorted choices, k = 2</text>
      <rect x="20" y="45" width="145" height="65" fill="#d4d4d4" fill-opacity="0" stroke="#3b82f6" stroke-width="2"/><text x="92.5" y="70" text-anchor="middle">Yes</text><text x="92.5" y="97" text-anchor="middle">0.4</text>
      <rect x="195" y="45" width="145" height="65" fill="#d4d4d4" fill-opacity="0" stroke="#3b82f6" stroke-width="2"/><text x="267.5" y="70" text-anchor="middle">Maybe</text><text x="267.5" y="97" text-anchor="middle">0.3</text>
      <rect x="20" y="125" width="145" height="65" fill="#d4d4d4" fill-opacity="0" stroke="#d4d4d4"/><text x="92.5" y="150" text-anchor="middle" fill="#737373">No</text><text x="92.5" y="177" text-anchor="middle" fill="#737373">0.2</text>
      <rect x="195" y="125" width="145" height="65" fill="#d4d4d4" fill-opacity="0" stroke="#d4d4d4"/><text x="267.5" y="150" text-anchor="middle" fill="#737373">full stop</text><text x="267.5" y="177" text-anchor="middle" fill="#737373">0.1</text>
      <text x="20" y="220">Keep 0.7 total → divide by 0.7</text>
      <text x="20" y="245">Then sample from the survivors</text>
      </g></svg>
      ```

      ### Drawing after the cut

      If token $i$ survives, its new probability is

      $$p'_i=\frac{p_i}{\text{sum of retained probabilities}}.$$

      Here $p_i$ is its probability before filtering and $p'_i$ is its probability after filtering. Removed tokens have probability zero. A draw uses these new probabilities, so a retained second-place token can still win.

      For our four-token vocabulary, $k=1$ keeps only Yes and makes its probability 1. With $k=2$, Yes and Maybe share the draws. With $k=4$, every token stays and the probabilities are unchanged.

      ### The cost of a fixed count

      Suppose the probabilities become $0.97$, $0.01$, $0.01$, $0.01$. Keeping two includes a token with probability only $0.01$. If instead all four have probability $0.25$, keeping two discards half the equally likely choices. Top-p, in the next step, lets the number kept adapt to the probabilities.
    worked: |
      Let's sample from Yes, Maybe, No and full stop with probabilities $0.4$, $0.3$, $0.2$, $0.1$, using $k=2$ and $u=0.60$.

      1. **Keep the two leaders.** Their total probability is the amount the two survivors will share.
         $$0.4+0.3=0.7.$$

      2. **Renormalise.** Divide both surviving probabilities by that total.
         $$\begin{aligned}p'_{\mathrm{Yes}}&=0.4/0.7=4/7,\\p'_{\mathrm{Maybe}}&=3/7.\end{aligned}$$

      3. **Draw a token.** Yes ends at four sevenths, about $0.57$, so $u=0.60$ falls in Maybe's interval.
         $$4/7\le0.60<1\quad\Rightarrow\quad\text{Maybe}.$$

      This Python function takes a nonempty list of positive probabilities summing to 1. `type(k) is int` checks that $k$ is a Python integer. The rest of the check ensures it is in range. To sort the entries, `range` supplies indices and `lambda i: probs[i]` supplies each index's probability. With `reverse=True`, `sorted` puts the largest probabilities first. Ties keep their input order, making the cutoff repeatable. `[:k]` selects the first $k$ indices. The final loop repeats our draw $u=0.60$ by accumulating the filtered probabilities.

      ```python
      def top_k(probs, k):
          if type(k) is not int or not 1 <= k <= len(probs):
              raise ValueError("invalid k")
          order = sorted(
              range(len(probs)),
              key=lambda i: probs[i], reverse=True
          )
          keep = order[:k]
          total = sum(probs[i] for i in keep)
          result = [0.0] * len(probs)
          for i in keep:
              result[i] = probs[i] / total
          return result

      tokens = ["Yes", "Maybe", "No", "."]
      filtered = top_k([0.4, 0.3, 0.2, 0.1], 2)
      print([round(p, 2) for p in filtered])
      cumulative = 0.0
      for token, prob in zip(tokens, filtered):
          cumulative += prob
          if 0.60 < cumulative:
              print(token)
              break
      # prints:
      # [0.57, 0.43, 0.0, 0.0]
      # Maybe
      ```
