  - id: pd-temperature
    title: Make token choices more or less random
    explain: |
      ### Choosing from the scores

      Prefill and each later decode pass supply scores for choosing a token. Sampling lets the assistant vary its wording across requests. Let's use a toy vocabulary, Yes and No, with scores $\ln4$ and $0$. These give clean softmax weights: the natural logarithm $\ln4$ is the number whose exponential is $4$. Scores before softmax are called **logits**. Softmax exponentiates them to $4$ and $1$, then divides by their total, giving probabilities $0.8$ and $0.2$.

      **Temperature** is a positive number that divides the logits before softmax. A lower temperature concentrates probability on higher scores; a higher one spreads it more evenly. For example, No is drawn more often at higher temperatures. The blue bars show Yes's probability, rounded to two decimals.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" aria-label="For Yes and No logits ln 4 and 0, the probability of Yes is about 0.94 at temperature 0.5, 0.80 at temperature 1, and 0.67 at temperature 2. Bar heights use the unrounded probabilities.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
      <text x="20" y="24">Probability of Yes</text><path d="M40 50 V180 H340" fill="#d4d4d4" fill-opacity="0" stroke="#d4d4d4"/>
      <text x="30" y="58" text-anchor="end">1</text><text x="30" y="185" text-anchor="end">0</text>
      <rect x="80" y="57.6471" width="45" height="122.3529" fill="#3b82f6"/><text x="102.5" y="49" text-anchor="middle">0.94</text><text x="102.5" y="210" text-anchor="middle">τ = 0.5</text>
      <rect x="180" y="76" width="45" height="104" fill="#3b82f6"/><text x="202.5" y="68" text-anchor="middle">0.80</text><text x="202.5" y="210" text-anchor="middle">τ = 1</text>
      <rect x="280" y="93.3333" width="45" height="86.6667" fill="#3b82f6"/><text x="302.5" y="85" text-anchor="middle">0.67</text><text x="302.5" y="210" text-anchor="middle">τ = 2</text>
      </g></svg>
      ```

      ### Scaling before softmax

      Write temperature as $\tau$ (tau). Many papers and APIs call it $T$ or "temperature". For token $i$, with logit $z_i$, the adjusted probability is

      $$p_i=\frac{e^{z_i/\tau}}{\sum_j e^{z_j/\tau}},\qquad \tau>0.$$

      The sum runs over all vocabulary tokens $j$. At $\tau=1$, this is ordinary softmax. At $\tau=0.5$, Yes has probability about $0.94$; at $\tau=2$, about $0.67$. Positive temperature preserves the score order. Raising it makes the distribution more even: the leader loses probability and the lowest-ranked tokens gain. An individual token between them can gain or lose probability.

      ### Random draws and greedy choices

      **Sampling** draws a token according to its probability. Lay the probabilities along a strip from 0 to 1. Pick a random point $u$ on it, with $0\le u<1$, and choose the token covering that point. In code, add probabilities until the total first exceeds $u$. Below, at $\tau=2$, Yes covers two thirds and No covers the rest. The orange line marks $u=0.70$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 165" aria-label="At temperature 2, Yes covers 0 to 2/3 and No covers 2/3 to 1. A draw u equals 0.70 lies in No's interval.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
      <text x="130" y="35" text-anchor="middle">Yes: 2/3</text><text x="280" y="35" text-anchor="middle">No: 1/3</text>
      <rect x="30" y="50" width="200" height="40" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6"/>
      <rect x="230" y="50" width="100" height="40" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6"/>
      <text x="30" y="115" text-anchor="middle">0</text><text x="230" y="115" text-anchor="middle">2/3</text><text x="330" y="115" text-anchor="middle">1</text>
      <path d="M240 43 V95" stroke="#f59e0b" stroke-width="3"/><text x="240" y="148" text-anchor="middle">u = 0.70</text>
      </g></svg>
      ```

      **Greedy decoding** chooses a token with the highest score, breaking ties consistently. A serving program can handle zero temperature by using greedy decoding. Zero is outside the formula because division by zero is undefined. Positive temperature can still draw a lower-scoring token, including one that makes the answer incorrect.
    worked: |
      Let's adjust Yes and No's logits, $\ln4$ and $0$, using $\tau=2$, then draw with $u=0.70$.

      1. **Scale and exponentiate.** Divide both scores by 2, then raise $e$ to each result.
         $$e^{\ln4/2}=2,\qquad e^{0/2}=1.$$

      2. **Normalise the weights.** Divide each weight by their total to make probabilities.
         $$p_{\mathrm{Yes}}=2/3,\qquad p_{\mathrm{No}}=1/3.$$

      3. **Locate the draw.** Yes covers $0\le u<2/3$. Our draw lies in No's remaining interval.
         $$2/3\le0.70<1\quad\Rightarrow\quad\text{No}.$$

      The lower-scoring token can be selected even though Yes remains more probable.

      Here is the same calculation in Python. Start with at least one token and one finite logit per token. Use a positive temperature and a draw $0\le u<1$. `math.exp` computes a power of $e$. The expression in square brackets computes one weight for each logit.

      Computers cannot store arbitrarily large exponentials. Subtracting the largest logit before exponentiating avoids this problem. At $\tau=2$, this changes our weights from $(2,1)$ to $(1,0.5)$. Both pairs normalise to $(2/3,1/3)$ because their relative weights are unchanged.

      `zip` pairs tokens with weights so the loop can accumulate their probabilities. Computer rounding can leave the final total just below 1. If no interval catches `u`, we return the last token with positive weight. Very small weights can round to zero, so we skip those in the fallback. For a fresh draw, import Python's `random` module and pass `random.random()` as `u`.

      ```python
      import math

      def temperature_sample(tokens, logits, tau, u):
          if tau <= 0:
              raise ValueError("tau must be positive")
          largest = max(logits)
          weights = [math.exp((z - largest) / tau) for z in logits]
          total = sum(weights)
          cumulative = 0.0
          fallback = tokens[0]
          for token, weight in zip(tokens, weights):
              if weight > 0:
                  fallback = token
              cumulative += weight / total
              if u < cumulative:
                  return token
          return fallback

      tokens = ["Yes", "No"]
      logits = [math.log(4), 0]
      print(temperature_sample(tokens, logits, 2, 0.70))
      # prints: No
      ```
