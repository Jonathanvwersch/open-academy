concept: prefill-decode
version: 1
objective: |
  **Goal:** explain how prefill and decode shape response time, and implement temperature, top-k and top-p sampling to choose each next token.
recap:
  - concept: autoregressive-lm
    text: "A language model gives a score to each possible next token. Softmax turns scores into probabilities adding to 1. A causal mask preserves allowed dependencies. Generation chooses, appends and repeats. Greedy decoding chooses the highest score."
where_this_fits: |
  ### What are prefill and decode?

  Prefill processes a language model's prompt together, and decode extends the answer one token at a time. This split explains the initial wait and later streaming rate. Both phases must choose an output token. We'll also control these choices through sampling, which randomly selects a token according to its probability, and filters that remove unlikely choices.

  We'll follow a chat assistant using the Llama 3 8B language model on one NVIDIA H100 SXM GPU, the processor running the model. Our examples use invented timings and token probabilities.

  Time to first token (TTFT) is the wait from sending a request to its first output token. Inter-token latency (ITL) is the gap between consecutive output tokens. A steady ITL of 0.02 seconds gives 50 tokens/s.
knowledge_points:
  - id: pd-request-phases
    title: Process the prompt, then generate
    explain: |
      ### Reading the known prompt

      Our chat assistant must read a prompt before it can answer. Suppose its prompt is the three tokens "the cat sat", treating each word as one token. All three are already known. Within each model layer, a stage of calculation, their positions can be processed in parallel. The causal mask still stops a position from using later tokens. A **pass** means one forward calculation through the model on its current input.

      **Prefill** is this processing of the known prompt. The causal mask lets the last prompt position use all prompt tokens to predict what follows them. It supplies probabilities for the first output token. We choose that token and send it to the user.

      ### Extending the answer

      **Decode** predicts and chooses later output tokens one at a time, using the tokens chosen so far.

      Suppose the answer is "on the mat", again treating each word as a token. After choosing "on", we feed it back to predict "the". We must choose "the" before predicting "mat". This dependence makes ordinary decoding sequential within one request.

      The picture shows this order. The three prompt boxes share one prefill pass. Each output choice supplies the input needed for the next decode pass. Box widths do not represent time.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" aria-label="Prefill processes the known prompt the cat sat and supplies the first output choice, on. Feeding on into decode produces the; feeding the into another decode pass produces mat. Boxes show the order of steps.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
      <text x="20" y="25">Prefill: known prompt</text>
      <rect x="20" y="42" width="65" height="36" fill="#d4d4d4" fill-opacity="0" stroke="#3b82f6"/><text x="52.5" y="66" text-anchor="middle">the</text>
      <rect x="95" y="42" width="65" height="36" fill="#d4d4d4" fill-opacity="0" stroke="#3b82f6"/><text x="127.5" y="66" text-anchor="middle">cat</text>
      <rect x="170" y="42" width="65" height="36" fill="#d4d4d4" fill-opacity="0" stroke="#3b82f6"/><text x="202.5" y="66" text-anchor="middle">sat</text>
      <path d="M125 86 V108 L119 100 M125 108 L131 100" fill="#d4d4d4" fill-opacity="0" stroke="#737373" stroke-width="2"/>
      <text x="20" y="134">Choose output 1: on</text>
      <path d="M125 145 V169 L119 161 M125 169 L131 161" fill="#d4d4d4" fill-opacity="0" stroke="#737373" stroke-width="2"/>
      <text x="20" y="195">Decode: feed on → choose the</text>
      <path d="M125 206 V230 L119 222 M125 230 L131 222" fill="#d4d4d4" fill-opacity="0" stroke="#737373" stroke-width="2"/>
      <text x="20" y="256">Decode: feed the → choose mat</text>
      </g></svg>
      ```

      ### Where the waiting comes from

      Prefill contributes to **TTFT**. Longer prompts require more calculation, even though positions can share a pass. If everything else takes the same time, this usually delays the first token. Queueing, network time and choosing the token also contribute to TTFT.

      Decode largely sets the gaps between later tokens. Choosing and delivering each token also contributes to its gap. Divide one second by the steady gap to find the streaming rate, with ITL in seconds.

      $$\text{tokens/s}=\frac{1}{\mathrm{ITL}}.$$

      Be careful when counting passes. Prefill already supplies the first output's probabilities. Producing three output tokens needs two later decode passes. Faster prefill shortens the initial wait; faster decode shortens the later gaps.
    worked: |
      Let's time the assistant's three-token answer. In this invented request, prefill takes 115 ms. Choosing and sending the first token takes another 5 ms. Each later decode pass takes 20 ms, including token choice and delivery. There is no queue or extra network delay.

      1. **Find the first arrival.** The first token follows prefill and its choice.
         $$\mathrm{TTFT}=115+5=120\text{ ms}.$$

      2. **Find the total request time.** End-to-end latency is the time from sending a request until its last token arrives. Here it includes the first wait and the two later gaps.
         $$120+2\times20=160\text{ ms}.$$

      3. **Find the streaming rate.** Convert the 20 ms gap to 0.02 seconds before taking its reciprocal.
         $$\text{tokens/s}=1/0.02=50.$$

      The user sees tokens at 120, 140 and 160 ms. The 50 tokens/s describes the steady stream after the first token; the whole request also includes the initial wait.
