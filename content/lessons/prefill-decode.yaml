final: pd-final
summary: |
  - Prefill processes known prompt positions together and supplies the first output's probabilities. It contributes to TTFT. Later decode passes produce tokens one at a time and largely set ITL and the steady rate $1/\mathrm{ITL}$.
  - Temperature $\tau>0$ divides logits before softmax. Lower values concentrate probability on high scores. Greedy decoding directly selects a highest-scoring token.
  - Top-k keeps $k$ most probable tokens, then renormalises their probabilities and draws from them.
  - Top-p keeps the smallest set of most likely tokens reaching total probability at least $p$, including the crossing token, then renormalises by the retained total and draws.

  **Next:** We'll compare how much calculation prefill and decode do with how much data they move. That helps explain what limits their speed.
