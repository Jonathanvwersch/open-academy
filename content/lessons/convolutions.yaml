      ### Add weighted pixels and a bias

      In “Layers and the forward pass”, a neuron's **score** is its weighted sum plus bias. **Convolution** repeats that calculation across patches. The resulting grid is a **feature map**.

      For a grayscale image and square filter of side $k$, we write

      $$y_{i,j}=\sum_{u=0}^{k-1}\sum_{v=0}^{k-1}w_{u,v}x_{i+u,j+v}+b.$$

      We write $x$ for the image called img in the recap, $w$ for weights and $b$ for one shared bias. Output cell $(i,j)$ comes from the patch whose top-left pixel is at $(i,j)$. Within that patch, $u,v$ select a row and column, so $x_{i+u,j+v}$ selects that pixel. All indices start at zero.

      The inner sum adds weighted pixels across one row, and the outer sum adds those row totals. We can apply ReLU afterwards to keep positive scores and replace negative ones with zero.

      ### Count the output rows and columns

      Move one pixel at a time, keeping patches inside an image of height $H$ and width $W$:
      $$
      \begin{aligned}
      \text{last row start}&=H-k &&\text{leave room for the patch}\\
      \text{row count}&=H-k+1 &&\text{include the start at zero}\\
      \text{column count}&=W-k+1 &&\text{count columns the same way}
      \end{aligned}
      $$
      The output shape is $(H-k+1,\ W-k+1)$.
    worked: |
      Let's compute the diagram's $3\times3$ feature map with bias $b=0$.

      1. **Read the first patch.** At $(0,0)$, each patch row is $(0,0,1)$. All three rows give the same total, so we multiply one row's contribution by three.
         $$y_{0,0}=3\big((-1)\cdot0+0\cdot0+1\cdot1\big)+0=3.$$
      2. **Move one column right.** At $(0,1)$, each row is $(0,1,1)$. The middle pixel has weight zero, so the score is still three.
         $$y_{0,1}=3\big((-1)\cdot0+0\cdot1+1\cdot1\big)+0=3.$$
      3. **Reach an all-bright patch.** At $(0,2)$, equal brightness on the left and right cancels.
         $$y_{0,2}=3\big((-1)\cdot1+0\cdot1+1\cdot1\big)+0=0.$$

      Every image row is the same, so every output row is $(3,3,0)$. The first two cells score 3 because their patches contain the dark-to-bright boundary, while the all-bright patch scores 0. The 3s mark the patches containing the edge, not a single exact edge column.
