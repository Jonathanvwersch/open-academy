      Each filter produces one feature map, which we call an **output channel**. With $C_{\text{in}}$ input channels, a square filter has shape $(C_{\text{in}},k,k)$. Using $C_{\text{out}}$ filters gives CHW output shape

      $$(C_{\text{out}},H_{\text{out}},W_{\text{out}}).$$

      Each output row corresponds to one allowed starting row, and each output column corresponds to one allowed starting column. Adding filters adds channels without changing those spatial counts.

      ### Count the shared parameters

      **Weight sharing** means reusing a filter's weights and bias at every position. An edge can move across the image, and the same weights can still respond when a patch covers it.

      Each filter has $C_{\text{in}}k^2$ weights and one bias. The layer has

      $$C_{\text{out}}(C_{\text{in}}k^2+1)$$

      parameters. For a $32\times32$ RGB image, choose 16 filters for patterns such as edges at different angles, with $k=3,p=1,s=1$:
      $$
      \begin{aligned}
      H_{\text{out}}=W_{\text{out}}&=(32+2-3)+1=32 &&\text{count patch starts}\\
      \text{output shape}&=(16,32,32) &&\text{one channel per filter}\\
      \text{parameters per filter}&=3\cdot3^2+1=28 &&\text{count weights and one bias}\\
      \text{layer parameters}&=16\cdot28=448 &&\text{count all filters}
      \end{aligned}
      $$

    worked: |
      Let's compare 16 convolutional filters with a fully connected layer producing the same number of outputs from the $32\times32$ colour image.

      1. **Find the output shape.** Padding one preserves each spatial side when $k=3,s=1$.
         $$H_{\text{out}}=W_{\text{out}}=(32+2-3)+1=32.$$
      2. **Count shared parameters.** Each filter reads three channels and has one bias.
         $$16(3\cdot3\cdot3+1)=16\cdot28=448.$$
      3. **Count inputs.** Multiply the input CHW sizes.
         $$\text{inputs}=3\cdot32\cdot32=3072.$$
      4. **Count outputs.** Multiply the output CHW sizes.
         $$\text{outputs}=16\cdot32\cdot32=16384.$$
      5. **Count fully connected parameters.** Each output has a separate weight for every input and its own bias.
         $$16384\cdot3072+16384=50{,}348{,}032.$$

      That's about 50 million parameters, compared with 448 for convolution. The convolution produces the same number of values with far fewer parameters because it uses small patches and shared weights.
    problems:
      [
        conv-channels-basics,
        conv-channels-why-small,
        conv-params-template,
        conv-shape-template,
        conv-channels-trap,
        conv-channels-robot,
        conv-shape-fixed,
      ]
  - id: conv-pool
    key_prereqs: [images-as-tensors, mlp-forward-pass]
    title: Stack layers and shrink their maps
    tldr: |
      - Stacking layers lets each output depend on a larger region of the original image.
      - Max pooling shrinks a map by keeping the largest value in each small patch.
      - This cuts the work for later layers and widens what each cell sees, but loses exactly where the pattern was.
    explain: |
      ### Stack one layer after another

      Like fully connected layers, convolutional layers can run in sequence. A second convolution reads the first one's feature map, not the original image. Let's trace which image pixels reach its output.

      A **receptive field** is the input region that can affect one output cell. To recognise a whole object, an output must see all of it. We'll run two $3\times3$ convolutions on a $5\times5$ image, both with stride 1 and no padding.

