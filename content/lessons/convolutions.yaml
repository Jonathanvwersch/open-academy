      ```

      Across a row, the overlapping patches start at columns 0 and 1 and cover columns 0 through 3. The same holds down a column, giving this pooled cell a $4\times4$ image region.

      ### Limitations

      Pooling discards the maximum's position within its patch. If we need to know exactly which column an edge is in, we can skip pooling.
    worked: |
      Let's shrink a $4\times4$ feature map using $2\times2$ max pooling with stride 2 and no padding. The row and column labels are indices.

      | Row / column | 0 | 1 | 2 | 3 |
      | --- | --- | --- | --- | --- |
      | 0 | 1 | 3 | 2 | 0 |
      | 1 | 4 | 2 | 1 | 5 |
      | 2 | 0 | 1 | 6 | 2 |
      | 3 | 2 | 3 | 1 | 4 |

      1. **Take the first maximum.** The top-left block is $\begin{pmatrix}1&3\\4&2\end{pmatrix}$, so we keep its largest value.
         $$\max(1,3,4,2)=4.$$
      2. **Read the top-right block.** Its values are $\begin{pmatrix}2&0\\1&5\end{pmatrix}$.
         $$\max(2,0,1,5)=5.$$
      3. **Read the bottom-left block.** Its values are $\begin{pmatrix}0&1\\2&3\end{pmatrix}$.
         $$\max(0,1,2,3)=3.$$
      4. **Read the bottom-right block.** Its values are $\begin{pmatrix}6&2\\1&4\end{pmatrix}$.
         $$\max(6,2,1,4)=6.$$
      5. **Arrange the four results.** Keep each maximum in its patch's position.
         $$\text{pooled map}=\begin{pmatrix}4&5\\3&6\end{pmatrix}.$$
      6. **Check the size.** The patch-counting formula gives two starts on each side.
         $$\lfloor(4-2)/2\rfloor+1=2.$$

      We have reduced sixteen map cells to four by keeping one maximum from each block.
