      The final cell reads a $3\times3$ patch of the first map. Across a row, those map cells read image patches starting at columns 0, 1 and 2. Together they cover columns 0 through 4; the same holds down a column.

      Each further stride-1 layer combines $k$ neighbouring cells, adding $k-1$ pixels to the region's side:
      $$
      \begin{aligned}
      \text{initial side}&=1 &&\text{each pixel depends on itself}\\
      \text{side after }L\text{ layers}&=1+L(k-1) &&\text{add }k-1\text{ per layer}\\
      \text{side in the picture}&=1+2(3-1)=5 &&\text{use two layers of side three}
      \end{aligned}
      $$
      This assumes stride 1 without pooling, which shrinks a map by keeping the largest nearby values.

      ### Keep the strongest nearby response

      We can shrink maps to reduce work for the next layer. **Max pooling** takes the largest value in each patch, separately in each channel, with no weights or biases.

      The pooling patch's side plays the role of $k$ in the size formula. With input map height $H$ and $k=2,s=2,p=0$, we get

      $$H_{\text{out}}=\lfloor(H-2)/2\rfloor+1.$$

      This halves even-sized sides without changing channels, while odd sides lose the last incomplete patch.

      Pooling combines neighbouring map cells, so its output covers more of the image, helping it see larger objects. Let's trace a $2\times2$ pooling patch after one stride-1 $3\times3$ convolution.

