concept: convolutions
version: 1
objective: "**Goal:** compute convolutional layer output shapes and explain shared filters, pooling and receptive fields."
recap:
  - concept: images-as-tensors
    text: "A grayscale image is an $H\\times W$ grid of brightnesses indexed `img[r, c]` from zero. A colour image in CHW layout has shape $(3, H, W)$, with separate grids for red, green and blue."
  - concept: mlp-forward-pass
    text: "A fully connected neuron takes a weighted sum of every input plus a bias, then applies ReLU. A layer with $d_\\text{in}$ inputs and $d_\\text{out}$ neurons has $d_\\text{out}d_\\text{in}+d_\\text{out}$ parameters."
where_this_fits: |
  ### What is a convolution?

  A convolution slides a small grid of weights across an image and takes a weighted sum at each position. This can locate a pattern such as an edge, where dark pixels meet bright ones.

  A 224 by 224 RGB photo contains 3 times 224 times 224 numbers, or 150,528. One fully connected neuron needs that many weights, so many neurons need millions. Its weights can respond to an edge at one place but give no response when it moves. It needs separate weights for every position, while convolution reuses one grid.

  We'll calculate output shapes, handle colour channels and count parameters. Then we'll shrink grids by keeping the largest nearby values, called pooling, and trace how much of the image each output depends on.
knowledge_points:
  - id: conv-slide
    key_prereqs: [dot-product, images-as-tensors, activation-functions]
    title: Slide a small grid of weights
    tldr: |
      - A filter is a small grid of weights that responds to a pattern, such as an edge.
      - We slide it across the image, multiplying it with each small square of pixels and adding up.
      - The results form a smaller grid, called a feature map, showing where the pattern appears.
    explain: |
      ### Find a dark-to-bright edge

      A fully connected neuron reads every input. Instead, we'll read a small square of pixels, called a **patch** or window. A **filter**, also called a **kernel**, is a small grid of weights that we reuse across patches.

      Let's use a five-by-five image where every row is $(0,0,1,1,1)$. The boundary between dark and bright columns is a vertical edge.

      Every filter row is $(-1,0,1)$. The left column subtracts brightness, the middle ignores it, and the right adds it. This gives a positive sum where brightness rises left-to-right, compared with zero for a flat patch. Real networks find weights during training, which we won't cover here. We choose them by hand to see what they do.

