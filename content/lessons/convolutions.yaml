  - id: conv-size
    key_prereqs: [images-as-tensors]
    title: Work out the output size
    tldr: |
      - The output has one cell for each place the filter fits inside the image.
      - Padding adds a border of zeros, so the filter fits in more places and the output shrinks less.
      - Stride is how far the filter jumps between places, so a bigger stride gives a smaller output.
      - Counting the places that fit gives the output's height and width.
    explain: |
      ### Add zeros around the image

      Our five-by-five image produces only a three-by-three map. Border pixels appear in fewer patches, so there are fewer chances to detect an edge near the border. We can add a border to keep more positions in the output.

      **Padding** adds a border so patches can extend past the original image without shrinking the output as much. We use zeros because they add no pixel contribution to the weighted sum. Padding $p$ adds $p$ rows above and below and $p$ columns on each side.

      ### Move more than one pixel

      **Stride** $s$ is the distance between neighbouring patch starts. If nearby patches give similar responses, a larger stride can keep a coarser view with fewer cells to calculate, though it may miss details.

      Padding and stride are separate settings. Below, we add zeros to the edge image and separately move two columns between patches on an unpadded row.

