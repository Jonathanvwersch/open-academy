final: conv-explain
summary: |
  - A convolutional layer's feature maps form CHW output $(C_{\text{out}},H_{\text{out}},W_{\text{out}})$, with $H_{\text{out}}=\lfloor(H+2p-k)/s\rfloor+1$ for image height $H$ and $W_{\text{out}}=\lfloor(W+2p-k)/s\rfloor+1$ for image width $W$.
  - Weight sharing reuses each filter's weights and bias across positions, so the layer needs $C_{\text{out}}(C_{\text{in}}k^2+1)$ parameters.
  - Max pooling keeps the largest value in each patch without weights or biases.
  - Stacking $L$ stride-1 convolutions of side $k$, without pooling, gives receptive-field side $1+L(k-1)$.

  **Next:** In the image-classifier project, you'll build a network that labels whole images by putting these layers together.
