      ### Count the starts that fit

      With stride 1, the padded $7\times7$ image gives side $7-3+1=5$. Its $5\times5$ output has the same size as the original image.

      Rows and columns work the same way. To count patch starts:
      $$
      \begin{aligned}
      \text{padded height}&=H+2p &&\text{add both borders}\\
      \text{last possible start}&=H+2p-k &&\text{leave room for the patch}\\
      \text{full moves}&=\left\lfloor\frac{H+2p-k}{s}\right\rfloor &&\text{divide by stride and round down}\\
      H_{\text{out}}&=\left\lfloor\frac{H+2p-k}{s}\right\rfloor+1 &&\text{include the start at zero}
      \end{aligned}
      $$

      The brackets $\lfloor\ \rfloor$ mean “round down”. For output width, replace image height $H$ with image width $W$. We use the same square filter, padding and stride in both directions.

      For our $5\times5$ image and $k=3$:

      - With $p=0,s=1$, the side is $(5-3)/1+1=3$.
      - With $p=1,s=1$, it is $(5+2-3)/1+1=5$, so padding preserves the side.
      - With $p=0,s=2$, it is $\lfloor(5-3)/2\rfloor+1=2$, so stride reduces the work.

      Be careful not to round up. With height 6, $k=3,p=0,s=2$, the side is $\lfloor3/2\rfloor+1=2$, not 3. Starts 0 and 2 fit, but start 4 would extend beyond the image.
    worked: |
      Let's use a larger image of $32\times32$ grayscale pixels. We choose $k=5$ to read a larger area and $p=2$ to include patches centred on border pixels. With stride 1, the side would stay at 32:
      $$
      \begin{aligned}
      \text{padded side}&=32+2\cdot2=36 &&\text{add both borders}\\
      \text{last start}&=36-5=31 &&\text{leave room for the patch}\\
      \text{output side}&=31+1=32 &&\text{include the start at zero}
      \end{aligned}
      $$
      We'll use $s=2$ instead to reduce the number of calculations.

      1. **Include both borders.** Padding adds two pixels at each end.
         $$32+2\cdot2=36.$$
      2. **Find the last possible start.** A five-pixel patch must fit inside the padded side.
         $$36-5=31.$$
      3. **Count reachable starts.** Stride two reaches the even starts from 0 to 30, but not 31.
         $$H_{\text{out}}=\lfloor31/2\rfloor+1=\lfloor15.5\rfloor+1=16.$$
      4. **Count columns the same way.** The width uses identical settings.
         $$(H_{\text{out}},W_{\text{out}})=(16,16).$$

      Rounding up would invent a seventeenth start at 32, where the patch would not fit.
    problems:
      [
        conv-size-basics,
        conv-size-why-floor,
        conv-size-template,
        conv-size-fixed,
        conv-padding-trap,
        conv-stride-robot,
        conv-width-template,
      ]
  - id: conv-channels
    key_prereqs: [images-as-tensors, mlp-forward-pass]
    title: Use filters on a colour image
    tldr: |
      - On a colour image, a filter has weights for every colour channel and adds them all into one score.
      - Sliding it gives one output map, and using more filters gives more maps.
      - Each filter reuses the same weights at every position, so it needs far fewer weights than a fully connected layer.
    explain: |
      ### Read all the colour channels

      Each colour grid is called a **channel**. Let's start with a five-by-five RGB image. Every row is $(0,0,1,1,1)$ in red, $(0,0,2,2,2)$ in green and $(0,0,3,3,3)$ in blue.

      We'll return to $k=3$ so each patch is the same size as in step 1. One filter has a separate weight grid for each input channel. We multiply each patch pixel by its matching weight, add the products across all channels and add one bias.

      This time, choose every weight as 1 to make each channel's contribution easy to add, rather than detect an edge. Bias 1 makes it easy to see that one bias joins all three contributions in a single score. The top-left patch contributes 3 from red, 6 from green and 9 from blue.

