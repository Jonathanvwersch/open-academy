    worked: |
      Let's compare the two rising runs after halving their rates. Let $k$ count updates so far, and let $m$ be the multiplier applied to the signed gap $w-4$ each update.

      1. **Write loss using the gap.** Each update multiplies the signed gap by $m$:
         $$
         \begin{aligned}
         \text{starting gap}&=-4 &&\text{subtract the best prediction from zero}\\
         \text{gap after }k\text{ updates}&=-4m^k &&\text{multiply by }m\text{ repeatedly}\\
         \text{squared gap}&=16m^{2k} &&\text{square the whole gap}\\
         L_k&=5+16m^{2k} &&\text{add the lowest possible loss}
         \end{aligned}
         $$
      2. **Check correct subtraction.** At the halved rate $0.625$, the gap multiplier is:
         $$m=1-2(0.625)=-0.25.$$
      3. **Measure its first loss.** Square the multiplier once for the first update.
         $$L_1=5+16(0.0625)=6.$$
      4. **Measure its second loss.** Square the multiplier again. The gap keeps shrinking.
         $$L_2=5+16(0.00390625)=5.0625.$$
      5. **Check flipped addition.** Adding the slope gives multiplier $1+2\eta$. At the halved rate $0.125$:
         $$m=1+2(0.125)=1.25.$$
      6. **Measure its first loss.** This multiplier grows the gap.
         $$L_1=5+16(1.5625)=30.$$
      7. **Measure its second loss.** Squaring the multiplier again grows the loss further.
         $$L_2=5+16(2.44140625)=44.0625.$$

      The original identical losses did not identify the cause, but reducing the rates separated these possibilities. A still-rising curve is a reason to inspect the update sign, not proof by itself.
