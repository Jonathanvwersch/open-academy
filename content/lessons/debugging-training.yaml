final: dbt-explain-diagnosis
summary: |-
  - Read loss curves as clues, and judge noisy minibatch training by whole-dataset loss after each epoch.
  - Repeatedly fitting a tiny batch with a known answer can reveal broken updates, but passing does not guarantee good predictions on new examples.
  - A gradient check compares a code slope with a numerical slope from two nudged loss values, keeping everything else fixed.
  - Use these checks to distinguish bugs from settings before tuning, and use validation loss to recognise overfitting.

  **Next:** We start working with images, turning each picture into an array of numbers a model can train on. These debugging checks apply there too.
