    explain: |
      ### Pieces and their numbers

      To turn text into numbers, we cut it into pieces, then replace each piece with its position in a fixed list.

      Here we cut "the cat sat on the mat" at the spaces, so each word is one piece. The sentence has five different words, so the list on the right, called the vocabulary, has five entries, numbered from 0.

