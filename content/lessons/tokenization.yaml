      ### Tokens, the vocabulary and token ids

      A **language model** is a program that writes text. A **token** is one piece of text it treats as a single unit. The **vocabulary** is the fixed list of every token the model knows, and a token's **token id** is its position in that list. We write $N$ for the vocabulary size and $T$ for the number of tokens in a text, and $x_1,\dots,x_T$ for the text's token ids in order, so $x_1$ is the first. Here $N=5$ and $T=6$, and the sentence becomes $(0,1,2,3,0,4)$. Turning text into ids is called **encoding**, and turning ids back into text is **decoding**. The whole process of cutting text into tokens and giving them ids is **tokenization**, and the program that does it is a **tokenizer**.

      Be careful not to read meaning into the ids. Id $4$ isn't "more" than id $2$. Ids are labels, like locker numbers. The model learns their meaning during training on text.

      ### Words or letters?

      Cutting at the spaces has a problem. This vocabulary has no entry for "mats". A real word tokenizer gives such a word a single unknown-word id, so the model never sees which word it was. The other extreme makes every character a token, the space included. For our sentence:

      | One token per | $N$ | $T$ |
      | --- | --- | --- |
      | word | $5$ | $6$ |
      | character | $10$ | $22$ |

      Characters can spell any word made from them, including "mats". But the $10$ characters, the $9$ letters and the space, give a list of $22$ tokens, $17$ letters and $5$ spaces. The model does work for every token, so a longer list is slower. So we'd like tokens that are shorter than words when a word is rare, and whole words when a word is common.
    worked: |
      Let's encode a new sentence, "the mat sat on the cat", with the word vocabulary from the picture, and then decode a list of ids back into text. In it, the is $0$, cat is $1$, sat is $2$, on is $3$ and mat is $4$.

      1. **Cut the text into tokens.** We cut at the spaces, so each word is one token, giving the six tokens the, mat, sat, on, the, cat.

      2. **Look up each token's id.** Each token is replaced by its position in the vocabulary, and both copies of "the" get the same id.
         $$(x_1,\dots,x_6)=(0,4,2,3,0,1)$$

      3. **Count the tokens.** There are six ids, one for each word.
         $$T=6$$

      4. **Decode a list of ids.** Decoding goes the other way, looking up the token at each position. The ids $(4,3,0,1)$ give "mat", "on", "the" and "cat", so the text is "mat on the cat".

      The same five ids can be reused in any order, so this vocabulary can encode any sentence made only from its five words.
    problems:
      - tok-ids-basics
      - tok-ids-self-explain
      - tok-ids-encode
      - tok-ids-decode
      - tok-ids-char-template
      - tok-ids-locker
      - tok-ids-unknown
      - tok-ids-robot
  - id: tok-bpe-merges
    title: "Build a vocabulary by merging pairs"
    explain: |
      ### Start from letters, then join the commonest pairs

      A **token** is a piece of text treated as one unit, and a **vocabulary** lists all available tokens. **Byte-pair encoding**, or BPE, builds this list from single characters using example text called the training text. It repeatedly joins the most frequent pair of neighbouring tokens into a new token. Common words become one token; rare words remain smaller pieces.

      ### Three merges on our sentence

      Let's use "the cat sat on the mat" as our training text. We split at spaces and join tokens only inside words, so no token contains a space. Real **tokenizers** (programs that cut text into tokens and give them ids) keep the spaces, usually as part of the next word's token, so **decoding** (turning ids back into text) gives back the exact text. We drop spaces to keep this example small, leaving $17$ letters. The starting vocabulary has $9$ letters, a, c, e, h, m, n, o, s and t.

      Now we count every pair of neighbouring tokens. "a" followed by "t" appears $3$ times, in cat, sat and mat, which is more than any other pair. So the first merge joins them, "at" becomes a token, and the text shrinks from $17$ tokens to $14$. Two more rounds of counting give th and then the. Each orange box is the token made in that row.

