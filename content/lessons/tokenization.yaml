concept: tokenization
version: 1
objective: |
  **Goal:** explain how byte-pair encoding builds a vocabulary of tokens by repeatedly merging the most frequent pair of neighbouring tokens, use its merges to split new text into token ids, and weigh what a bigger or smaller vocabulary costs.
where_this_fits: |
  ### What is tokenization?

  A language model is a program that writes text, and tokenization is the first thing it does with text. It cuts the text into small pieces called tokens and gives each piece a whole number, its position in a fixed list. Everything the model does after that, it does with these numbers.

  Why does it matter how we cut? A model can only do arithmetic on numbers, so the text must become numbers somehow. Giving every whole word its own number loses any word that wasn't in the list, and giving every letter a number makes the text very long. This lesson builds the method most language models use, byte-pair encoding, which learns pieces bigger than letters and smaller than rare words from example text.
