summary: |
  - Tokenization cuts text into tokens and replaces each with its token id, its position in a fixed vocabulary of $N$ tokens, so a text becomes the list of ids $x_1,\dots,x_T$.
  - Word tokens give short lists but turn every word outside the vocabulary into one unknown-word id; character tokens can spell anything but make the lists long.
  - Byte-pair encoding starts from single characters and repeatedly adds the most frequent pair of neighbouring tokens in the training text as a new token, so $N$ is the number of starting characters plus the number of merges.
  - To split new text, a tokenizer applies the learned merges in order; more merges give shorter texts but a bigger vocabulary with rarer tokens.

  **Next:** The embeddings lesson gives each token id its own list of learned numbers, which is what the model actually computes with.
