      ### The rule

      Each merge adds one token to the vocabulary, whose size we write as $N$, so

      $$N=\text{starting characters}+\text{merges}.$$

      For us that's $9+3=12$. We stop when $N$ reaches our chosen vocabulary size. The tokenizer also keeps the list of merges in the order it learned them, which the next step needs.

      Be careful not to just pick the commonest letter. "t" is the commonest letter here, but BPE counts pairs of neighbours, because a new token has to be a piece that actually occurs together in the text.

      GPT-2, an OpenAI language model, has a BPE tokenizer that starts from the $256$ possible bytes, the numbers computers store text as, so it can encode anything. It then learns $50{,}000$ merges. With one extra token that marks where a text ends, its vocabulary has $50{,}257$ tokens.
    worked: |
      Let's carry out merges 2 and 3 on "the cat sat on the mat", counting the pairs each time. After merge 1, the words are t h e, c at, s at, o n, t h e and m at, which is $14$ tokens.

      1. **Count the pairs after merge 1.** We list every pair of neighbouring tokens inside a word and count it. The pairs t h and h e each appear twice, once in each "the". The pairs c at, s at, o n and m at appear once each.

      2. **Choose merge 2.** Two pairs tie with a count of $2$. A tokenizer needs a fixed rule for ties, and ours is to take the pair that comes first in the text, which is t h. Both copies of "the" become th e, so the text loses $2$ tokens.
         $$14-2=12$$

      3. **Count again.** The h in each "the" is now part of th, so the pair h e has gone. Instead, th e appears twice, and every other pair still appears once.

      4. **Choose merge 3.** th e is the most frequent pair, so it becomes the token "the", and the text loses $2$ more tokens.
         $$12-2=10$$

      5. **Count the vocabulary.** We started with $9$ letters and made $3$ merges.
         $$N=9+3=12$$

      The sentence now takes $10$ tokens instead of $17$, and the commonest word, "the", is a single token.
