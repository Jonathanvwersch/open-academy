      So "that" becomes th and at, and "cats" becomes c, at and s. A word the tokenizer never saw still gets tokens, built from pieces it did see.

      ### How big should the vocabulary be?

      Each merge increases vocabulary size $N$ by one and reduces the number of tokens $T$ in the training text. For "the cat sat on the mat":

      | Merges | $N$ | $T$ |
      | --- | --- | --- |
      | $0$ | $9$ | $17$ |
      | $1$ | $10$ | $14$ |
      | $3$ | $12$ | $10$ |

      A language model is a program that writes text. Fewer tokens mean less work for it, but a bigger vocabulary means more pieces to learn about, with rare pieces appearing only a few times in its training text. Real models settle on tens of thousands to a few hundred thousand tokens. A rule of thumb for English is that a token is about $4$ characters.

      Be careful not to think a token is a word. A common word is often one token, but a rarer word can be several, and one token can be part of many words, like "at".

      ### Limitations

      Cutting text into multi-letter tokens causes three known problems. The model sees only token ids, and an id hides its letters, so a question like "how many r's are in strawberry?" is harder than it looks. Numbers get cut into uneven chunks, which gets in the way of digit-by-digit arithmetic. And a language that was rare in the training text gets split into smaller pieces, so its sentences take more tokens.
    worked: |
      Let's encode "the cats sat" with our three merges and turn it into token ids. We number the vocabulary with the $9$ letters in alphabetical order, a $0$, c $1$, e $2$, h $3$, m $4$, n $5$, o $6$, s $7$ and t $8$, followed by the merged tokens in the order they were made, at $9$, th $10$ and the $11$.

      1. **Split at the spaces and into letters.** Merges never cross a space, so each word is handled on its own, giving t h e, c a t s and s a t.

      2. **Apply merge 1, a + t.** Wherever a is followed by t, the two join, giving t h e, c at s and s at.

      3. **Apply merge 2, t + h.** Only "the" has a t followed by an h, giving th e, c at s and s at.

      4. **Apply merge 3, th + e.** This joins th e into the, giving the, c at s and s at.

      5. **Look up the ids.** Each token is replaced by its position in the vocabulary.
         $$(x_1,\dots,x_6)=(11,1,9,7,7,9)$$

      The three words became $T=6$ tokens. "cats" took three, because no merge joined c with at, so how a word is split depends on which merges were learned and the order they were learned in.
