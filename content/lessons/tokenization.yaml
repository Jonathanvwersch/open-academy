  - id: tok-bpe-encode
    title: "Split new text with the learned merges"
    explain: |
      ### Using the merges on new text

      A tokenizer cuts text into pieces called tokens and gives each an id from a fixed list, its vocabulary. During **training**, it learns **merges**, rules joining frequent neighbouring token pairs. The vocabulary and merge order then stay fixed. For new text, we start from characters and apply each merge wherever its pair appears, in learned order. Be careful not to count pairs again: splitting replays the learned merges.

      Our three merges were a + t, then t + h, then th + e. The picture applies them to two words that weren't in the training text.

