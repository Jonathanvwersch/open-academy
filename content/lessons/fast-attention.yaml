  - id: fa-running-max
    title: "Stop the exponentials from getting too big"
    explain: |
      ### Big scores break the exponential

      Online softmax adds up $e^{s_j}$, and exponentials grow very fast. A number too big for its format turns into infinity, which is called **overflow**. In FP16, a common 16-bit format, the largest number is $65{,}504$. $e^{11}\approx59{,}874$ fits, but $e^{12}\approx162{,}755$ doesn't, so a score of $12$ would ruin the output.

      If we subtract the same number $c$ from every score, each exponential is multiplied by $e^{-c}$, because $e^{s_j-c}=e^{s_j}e^{-c}$. That factor appears on the top and the bottom of every weight, so it cancels. So in practice softmax first subtracts the largest score $m$ from every score, making every exponential at most $e^0=1$.

      ### A running largest score

      But a kernel working in blocks only knows the largest score after the last block. So it keeps $m$, the largest score so far, and subtracts it from each score, adding $e^{s_j-m}$ to $\ell$ and $e^{s_j-m}v_j$ to $u$. When a new block raises the largest score to $m_{\text{new}}$, each old term $e^{s_j-m}$ should now be $e^{s_j-m_{\text{new}}}$, which is $e^{m-m_{\text{new}}}$ times as big. So the kernel multiplies both totals by $e^{m-m_{\text{new}}}$ before adding the new block's terms:

      $$\ell_{\text{new}}=e^{m-m_{\text{new}}}\,\ell+\sum_{j\in\text{block}}e^{s_j-m_{\text{new}}},$$

      $$u_{\text{new}}=e^{m-m_{\text{new}}}\,u+\sum_{j\in\text{block}}e^{s_j-m_{\text{new}}}v_j.$$

      The sums run over the keys in the new block. Rescaling shrinks both old totals by the same factor, so it doesn't change their ratio. FlashAttention does this for each query row.

      ### Limitations of fast attention kernels

      A fused kernel must move at least $4Td_h$ numbers. A real kernel reads every block of $K$ and $V$ again for each block of queries, so it reads more. The FlashAttention paper shows that the extra traffic of a blocked kernel shrinks as the on-chip memory grows, because bigger blocks mean fewer passes over the data. But the $T\times T$ tables still never go to HBM. So the earlier $1.024$ MB and intensity of $500$ are best cases.

      Fusion doesn't cut any FLOPs either. The matrix multiplies still cost $4T^2d_h$ FLOPs, and the extra softmax work is small, so doubling a long prompt still makes attention about four times slower. PyTorch's `scaled_dot_product_attention`, in `torch.nn.functional`, picks a kernel itself. On GPUs that support it, that can be a FlashAttention kernel.
    worked: |
      Let's run the four keys again, with scores $0$, $0$, $1$ and $1$ and values $1$, $3$, $2$ and $4$, this time keeping a running largest score $m$.

      1. **Start with block 1.** Its largest score is $0$, so $m=0$, and each exponential is $e^{0-0}=1$.
         $$m=0,\qquad\ell=2$$
         $$u=1\times1+1\times3=4$$

      2. **Rescale for block 2.** Block 2's largest score is $1$, so the old terms are multiplied by $e^{0-1}\approx0.368$.
         $$\ell=2e^{-1}\approx0.736$$
         $$u=4e^{-1}\approx1.472$$

      3. **Add block 2's terms.** Measured from $m=1$, each of its exponentials is $e^{1-1}=1$.
         $$\ell\approx0.736+2=2.736$$
         $$u\approx1.472+2+4=7.472$$

      4. **Divide once at the end.** We divide the two totals, just as before.
         $$o\approx\frac{7.472}{2.736}\approx2.73.$$

      This matches the $2.73$ we got without subtracting, and the biggest exponential we ever computed was $1$. With scores of $12$ or more, the version without subtracting would overflow in FP16, but this one would still compute no exponential bigger than $1$.
