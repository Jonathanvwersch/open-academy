      - fa-std-self-explain
      - fa-std-table-size
      - fa-std-total
      - fa-std-intensity
      - fa-std-limit
      - fa-std-transfer
  - id: fa-fused-kernel
    title: "Do all of attention in one kernel"
    explain: |
      ### One kernel for the whole calculation

      In standard attention, the score and weight tables were most of the bytes, and they only went to HBM to pass between kernels. **Kernel fusion** joins several kernels into one, so the results in between stay on chip. A fused attention kernel only reads $Q$, $K$ and $V$ and writes $O$. So the least it can move is

      $$4Td_h \text{ numbers}.$$

      Dividing standard attention's $4Td_h+4T^2$ by this gives $1+T/d_h$, so the saving grows with the prompt. The FLOPs stay $4T^2d_h$, so a kernel moving only this much has an arithmetic intensity of $T/b$. At 16-bit that's $T/2$, which passes the H100's $300$ once the prompt is longer than $600$ tokens.

      ### Working in blocks

      But on-chip memory is small. An H100 SXM has 132 compute units, called streaming multiprocessors or SMs. Each has $233{,}472$ bytes of its own on-chip shared memory, and each group of threads a kernel runs there can use at most $232{,}448$ bytes of it. Our head's $K$ alone is $256{,}000$ bytes, so it doesn't fit.

      So the kernel works in blocks of, say, 128 rows. It gives each block of queries to an SM, which loads that block once. Then the SM brings in $K$ and $V$ one block at a time, computes the scores between its queries and that key block, uses the scores to update a running output, then throws the scores away. The next step shows how that update works. After the last key block, it writes its rows of $O$. One block of 128 rows of $Q$ is $128\times128\times2=32{,}768$ bytes. The key and value blocks, the running output and the $128\times128$ table of scores for the current blocks are each about that size, so roughly $5\times32{,}768\approx164{,}000$ bytes in all, which fits. With $T=1{,}000$ there are 8 query blocks, the last with only 104 rows, and the picture draws four. Other SMs work on the other blocks and heads at once.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" aria-label="Left, HBM holds Q, K, V and O for one head, each split into four blocks of rows. Right, the on-chip memory of one SM holds query block 1, loaded once, key block 2 and value block 2, brought in one block at a time, the scores for this pair of blocks, and the running output, which is written once to block 1 of O">
      <defs><marker id="fa2-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
