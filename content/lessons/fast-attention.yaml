summary: |
  - Standard attention runs as three kernels that pass the $T\times T$ score and weight tables through HBM, so it moves $4Td_h+4T^2$ numbers and its arithmetic intensity stays below $d_h/b$, which is $64$ FLOPs per byte at 16-bit with $d_h=128$.
  - A fused kernel keeps the scores on chip and needs to move as few as $4Td_h$ numbers, which is $1+T/d_h$ times fewer, so its intensity can reach $T/b$.
  - It works on blocks of queries and keys, keeping a running sum $\ell$ of exponentials and a running sum $u$ of exponential-weighted values, and outputs $u/\ell$ after the last block, which is exactly softmax attention.
  - To stop exponentials overflowing, it subtracts a running largest score $m$ and multiplies $\ell$ and $u$ by $e^{m-m_{\text{new}}}$ whenever that score grows.

  **Next:** The quantisation lesson stores numbers in fewer bytes each, which cuts memory traffic for the model's learned parameters as well.
