      Splitting the queries is easy, because one query's output row needs that query and all the keys and values, but no other query. Splitting the keys is harder, because softmax divides by a total over every key in the row, and the next step shows how the kernel handles that.
    worked: |
      Let's count what a fused kernel saves for our Llama 3 8B head, with $T=1{,}000$ tokens, $d_h=128$, $b=2$, and standard attention's $9{,}024{,}000$ bytes and $512{,}000{,}000$ FLOPs.

      1. **Count the least traffic.** The kernel reads $Q$, $K$ and $V$ and writes $O$, each $Td_h$ numbers.
         $$4\times1{,}000\times128\times2=1{,}024{,}000.$$
         That's $1{,}024{,}000$ bytes, about $1.0$ MB.

      2. **Compare with standard attention.** Dividing the two byte counts matches $1+T/d_h$.
         $$\frac{9{,}024{,}000}{1{,}024{,}000}=8.8125=1+\frac{1{,}000}{128}.$$

      3. **Find the arithmetic intensity.** The FLOPs haven't changed, so we divide them by the new byte count.
         $$I=\frac{5.12\times10^{8}}{1.024\times10^{6}}=500.$$
         That's $500$ FLOPs per byte.

      4. **Compare the two times.** The maths still takes $0.512$ microseconds at $1{,}000$ TFLOP/s, and the bytes now take about $0.31$ microseconds at $3.35$ TB/s.
         $$\frac{1.024\times10^{6}}{3.35\times10^{12}}\approx0.31\times10^{-6}\text{ s}.$$

      If the kernel moved only this minimum, the traffic would fall about $8.8$ times, and with an intensity of $500$, above $300$, the maths would set the time. The last step shows that a real kernel moves somewhat more.
