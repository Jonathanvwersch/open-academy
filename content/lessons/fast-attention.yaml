concept: fast-attention
version: 1
objective: |
  **Goal:** count the bytes standard attention and a fused attention kernel move to and from GPU memory, and explain how FlashAttention's block-by-block softmax gives exactly the same output.
recap:
  - concept: attention
    text: "Attention scores query $t$ against key $j$ with $s_{tj}=q_t\\cdot k_j/\\sqrt{d_k}$, where $d_k$ is the key width, turns each query's scores into softmax weights $a_{tj}$, and outputs the weighted sum of the values, $o_t=\\sum_j a_{tj}v_j$."
where_this_fits: |
  ### What is a fast attention kernel?

  A fast attention kernel is a GPU program that computes all of attention in one go. It keeps the scores it's working on in the GPU's small on-chip memory, so the full table of scores never goes to main memory. FlashAttention (Dao et al., 2022) is the best-known one.

  As GPUs for inference showed, a GPU keeps its data in a large main memory, HBM, which is slower to reach than its small on-chip memory. And as Memory-bound vs compute-bound showed, an operation doing fewer FLOPs per byte moved than the GPU's ops:byte ratio spends its time waiting on memory. Attention on a long prompt makes a score for every pair of tokens, and moving those scores through HBM makes it slow.
knowledge_points:
  - id: fa-standard-traffic
    title: "Count the bytes attention moves"
    explain: |
      ### Attention as three kernels

      A chat assistant runs Llama 3 8B on one NVIDIA H100 SXM GPU, and a user sends a prompt of $T=1{,}000$ tokens. Each layer splits attention into 32 query heads that run in parallel, and each head's queries, keys and values have width $d_h=128$, the recap's $d_k$. Follow one head. Its queries form a matrix $Q$ with $T$ rows, one per token, and $d_h$ columns. Its keys $K$ and values $V$ have the same shape.

      A **kernel** is one program that the GPU runs on many compute units at once, each working on part of the data. A kernel's on-chip memory is cleared when it finishes, so its result is written to HBM, and the next kernel reads it back from there. The usual way, which the FlashAttention paper calls standard attention, uses three kernels. The first finds the score table $S$, with $s_{tj}$ in row $t$, column $j$. The second applies softmax to each row of $S$ to give the weight table $P$, which holds the weights $a_{tj}$. The third multiplies $P$ by $V$ to give the outputs $O$, one row per token.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" aria-label="Standard attention for one head with 1,000 tokens and head size 128 at 16-bit. Kernel 1 reads Q and K, 0.512 MB, and writes S, 2 MB. Kernel 2 reads S, 2 MB, and writes P, 2 MB. Kernel 3 reads P, 2 MB, and V, 0.256 MB, and writes O, 0.256 MB. The total is 9.024 MB, of which 8 MB is S and P. Sizes are in MB, where 1 MB is 1,000,000 bytes">
      <defs><marker id="fa1-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="225" y="30" text-anchor="end" fill="#737373">read from HBM</text>
      <text x="320" y="30" text-anchor="middle" fill="#737373">kernel</text>
      <text x="418" y="30" fill="#737373">write to HBM</text>
      <rect x="250" y="60" width="140" height="40" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="320" y="85" text-anchor="middle">1. scores</text>
      <rect x="250" y="125" width="140" height="40" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="320" y="150" text-anchor="middle">2. softmax</text>
      <rect x="250" y="190" width="140" height="40" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="320" y="215" text-anchor="middle">3. weighted sum</text>
      <path d="M230 80 H246" stroke="#737373" stroke-width="2" marker-end="url(#fa1-muted)"/>
      <path d="M392 80 H412" stroke="#737373" stroke-width="2" marker-end="url(#fa1-muted)"/>
      <path d="M230 145 H246" stroke="#737373" stroke-width="2" marker-end="url(#fa1-muted)"/>
      <path d="M392 145 H412" stroke="#737373" stroke-width="2" marker-end="url(#fa1-muted)"/>
      <path d="M230 210 H246" stroke="#737373" stroke-width="2" marker-end="url(#fa1-muted)"/>
      <path d="M392 210 H412" stroke="#737373" stroke-width="2" marker-end="url(#fa1-muted)"/>
      <text x="225" y="85" text-anchor="end"><tspan fill="#3b82f6">Q</tspan> and <tspan fill="#10b981">K</tspan>, 0.512 MB</text>
      <text x="418" y="85" fill="#ef4444">S, 2 MB</text>
      <text x="225" y="150" text-anchor="end" fill="#ef4444">S, 2 MB</text>
      <text x="418" y="150" fill="#ef4444">P, 2 MB</text>
      <text x="225" y="215" text-anchor="end"><tspan fill="#ef4444">P, 2 MB,</tspan><tspan> and </tspan><tspan fill="#10b981">V</tspan><tspan>, 0.256 MB</tspan></text>
      <text x="418" y="215"><tspan fill="#f59e0b">O</tspan>, 0.256 MB</text>
      <text x="320" y="252" text-anchor="middle" fill="#737373">total 9.024 MB, of which 8 MB is S and P</text>
      <text x="320" y="274" text-anchor="middle" fill="#737373">1 MB = 1,000,000 bytes</text>
      </g>
      </svg>
      ```

      ### Counting the numbers moved

      $Q$, $K$, $V$ and $O$ each hold $Td_h$ numbers. $S$ and $P$ hold one number for every query and key pair, so $T^2$ each. Both tables are written once and read once. So standard attention moves

      $$4Td_h+4T^2 \text{ numbers},$$

      each taking $b$ bytes, which is 2 at 16-bit. For our head, $T^2$ is about eight times $Td_h$, so $S$ and $P$, red in the picture, are most of the traffic.

      ### Longer prompts stay memory-bound

      Finding $S$ multiplies $Q$ by $K$ turned on its side, a $(T\times d_h)$ matrix times a $(d_h\times T)$ one, which costs $2T^2d_h$ FLOPs, and $PV$ costs the same. So the total is $4T^2d_h$. We leave out softmax's few FLOPs. When $T$ is much bigger than $d_h$, the bytes are almost all $4T^2b$, so the arithmetic intensity gets close to $d_h/b=64$ FLOPs per byte.

      Be careful not to expect longer prompts to be compute-bound. The FLOPs and the bytes both grow like $T^2$, so their ratio levels off near $64$, far below the H100's ratio of about $300$.
    worked: |
      Let's count the traffic of standard attention for our head, with $T=1{,}000$ tokens, $d_h=128$ and $b=2$ bytes per number. We'll use the H100's figures rounded to $1{,}000$ TFLOP/s and $3.35$ TB/s.

      1. **Find the bytes in one input.** $Q$ has $T$ rows of $d_h$ numbers, and $K$, $V$ and $O$ are the same size.
         $$1{,}000\times128\times2=256{,}000 \text{ bytes}.$$

      2. **Find the bytes in one table.** $S$ has one score for each of the $T\times T$ pairs, and $P$ is the same size.
         $$1{,}000\times1{,}000\times2=2{,}000{,}000.$$

      3. **Add up the traffic.** Each of the four inputs and outputs moves once, and each table moves twice.
         $$4\times256{,}000=1{,}024{,}000$$
         $$4\times2{,}000{,}000=8{,}000{,}000$$
         That's $9{,}024{,}000$ bytes, about $9.0$ MB.

      4. **Count the FLOPs.** Both matrix multiplies cost $2T^2d_h$.
         $$4\times1{,}000^2\times128=5.12\times10^{8}.$$

      5. **Find the arithmetic intensity.** We divide the FLOPs by the bytes.
         $$I=\frac{5.12\times10^{8}}{9.024\times10^{6}}\approx56.7.$$
         That's about $56.7$ FLOPs per byte. It's below $64$ because at this $T$ the $4Td_h$ inputs and outputs still add about 11% of the bytes.

      6. **Compare the two times.** To keep it simple, we time this head as if it had the whole GPU to itself. Llama 3 8B lets groups of four query heads share one set of keys and values (grouped-query attention, 8 key-value heads), but we count each query head with its own copy of $K$ and $V$. Then the other heads do the same work, so the ratio of the two times holds for the whole layer. Sharing $K$ and $V$ would change it only a little, because they are a small share of the bytes. Moving the bytes at $3.35$ TB/s takes about $2.69$ microseconds, while the maths at $1{,}000$ TFLOP/s takes $0.512$ microseconds.
         $$\frac{9.024\times10^{6}}{3.35\times10^{12}}\approx2.69\times10^{-6}\text{ s}.$$

      So moving the data takes about five times as long as the maths, which is what an intensity of $56.7$, well below $300$, predicts.
