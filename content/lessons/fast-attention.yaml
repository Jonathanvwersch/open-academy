  - id: fa-online-softmax
    title: "Compute softmax one block of keys at a time"
    explain: |
      ### The total that comes last

      Let's follow one query, so we can drop the subscript $t$ and write its scores as $s_j$ and the keys' values as $v_j$. Softmax gives key $j$ the weight $e^{s_j}/\ell$, where $\ell$ is the total of the exponentials of all $T$ scores. But an SM working through key blocks has only seen some of the keys. How can it weigh their values before it knows the total?

      ### Divide once at the end

      Every weight for this query divides by the same total $\ell$, so we can add up the values, each multiplied by $e^{s_j}$, and divide once at the end:

      $$o=\frac{\sum_{j=1}^{T}e^{s_j}v_j}{\sum_{j=1}^{T}e^{s_j}}.$$

      The top and the bottom are both plain sums, and a sum can be added up a few terms at a time. So the kernel keeps two running totals for each query. One is $\ell$, the sum of $e^{s_j}$ over the keys seen so far. The other is $u$, the sum of $e^{s_j}v_j$. Like a value, $u$ is a vector of $d_h$ numbers, and dividing it by $\ell$ divides each of them. Each new block adds its own terms to both. After the last block, the output is $u/\ell$. This way of computing softmax is called **online softmax**, because it updates its totals as each block arrives. The kernel never stores the weights $P$; it builds the output directly.

      It's exact: the maths is the same as softmax on the whole row, with the additions done in a different order. Computers round each sum slightly, so only the last digits can differ. FlashAttention computes exact attention this way.

      ### Four keys in two blocks

      To see it work, take one query with four keys, split into two blocks of two. The scores are $0$, $0$, $1$ and $1$. To keep the arithmetic short, each value has one component, so the values are just the numbers $1$, $3$, $2$ and $4$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" aria-label="Four keys in two blocks. Block 1 has scores 0 and 0 with values 1 and 3. After it, l is 2 and u is 4, so u over l is 2 so far. Block 2 has scores 1 and 1 with values 2 and 4. After it, l is about 7.44 and u is about 20.31, so the output u over l is about 2.73">
      <defs><marker id="fa3-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717" text-anchor="middle">
      <text x="145" y="30" fill="#737373">block 1</text><text x="495" y="30" fill="#737373">block 2</text>
      <rect x="30" y="45" width="110" height="50" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/><text x="85" y="66">score 0</text><text x="85" y="86">value 1</text>
      <rect x="150" y="45" width="110" height="50" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/><text x="205" y="66">score 0</text><text x="205" y="86">value 3</text>
      <rect x="380" y="45" width="110" height="50" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/><text x="435" y="66">score 1</text><text x="435" y="86">value 2</text>
      <rect x="500" y="45" width="110" height="50" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/><text x="555" y="66">score 1</text><text x="555" y="86">value 4</text>
      <text x="145" y="135" fill="#737373">after block 1</text><text x="145" y="160">ℓ = 2, u = 4</text>
      <text x="495" y="135" fill="#737373">after block 2</text><text x="495" y="160">ℓ ≈ 7.44, u ≈ 20.31</text>
      <path d="M260 152 H366" stroke="#737373" stroke-width="2" marker-end="url(#fa3-muted)"/>
      <text x="145" y="210" fill="#737373">u / ℓ = 2 so far</text>
      <text x="495" y="210" fill="#f59e0b">output u / ℓ ≈ 2.73</text>
      </g>
      </svg>
      ```

      Be careful not to give each block its own softmax and then average the block outputs. Block 1 alone gives $2$ and block 2 alone gives $3$, and their average, $2.5$, is wrong, because the second block's larger exponentials should give it more say.
    worked: |
      Let's run online softmax on the four keys, with scores $0$, $0$, $1$ and $1$ and values $1$, $3$, $2$ and $4$, in blocks of two. We'll keep $e$ in the totals and round only when we show a number.

      1. **Add block 1 to the totals.** Both scores are $0$ and $e^0=1$, so each exponential is $1$.
         $$\ell=1+1=2$$
         $$u=1\times1+1\times3=4$$

      2. **Add block 2 to the totals.** Both scores are $1$, so each exponential is $e$, and we add the new terms to what we had.
         $$\ell=2+2e\approx7.44$$
         $$u=4+2e+4e=4+6e\approx20.31$$

      3. **Divide once at the end.** Now that every key has been seen, $\ell$ is the full softmax total.
         $$o=\frac{4+6e}{2+2e}\approx2.73.$$

      4. **Check against softmax on the whole row.** The weights are $1$, $1$, $e$ and $e$ over $2+2e$, about $0.134$, $0.134$, $0.366$ and $0.366$.
         $$0.134\times(1+3)=0.536$$
         $$0.366\times(2+4)=2.196$$
         Adding these gives $o\approx2.73$.

      Both ways give $2.73$, so working in blocks changed nothing about the answer.
