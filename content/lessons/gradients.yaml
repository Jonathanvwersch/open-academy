      - gradp-small-step
  - id: grad-steepest-descent
    title: The negative gradient is steepest descent
    explain: |
      You want to reach the valley floor. **Which direction drops your height most?** Going south helps, but ignores the westward slope. Compare steps of equal length so a longer stride cannot win just by going farther.

      A step $\delta$ changes height by about $\nabla h \cdot \delta$. Using the angle $\theta$ between them, with $\|\cdot\|$ for length:

      $$\nabla h \cdot \delta = \|\nabla h\|\,\|\delta\|\cos\theta$$

      This works because only the angle changes: $\cos\theta$ is smallest, $-1$, at $180^\circ$. Pointing opposite the uphill arrow gives the biggest drop. The **steepest-descent direction** is $-\nabla h$, the negative gradient.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="Unit-length steps from one point, with the gradient (3, 4) in blue. The step opposite the gradient, in green, changes the height by minus 5. A step south changes it by minus 4, a step east by plus 3, and a step at right angles to the gradient by 0.">
        <circle cx="200" cy="150" r="100" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="2"/>
        <line x1="200" y1="150" x2="256" y2="75" stroke="#3b82f6" stroke-width="3"/>
        <polygon points="260,70 247,74 257,82" fill="#3b82f6"/>
        <line x1="200" y1="150" x2="144" y2="225" stroke="#10b981" stroke-width="3"/>
        <polygon points="140,230 143,217 153,225" fill="#10b981"/>
        <line x1="200" y1="150" x2="294" y2="150" stroke="#f59e0b" stroke-width="2.5"/>
        <polygon points="300,150 288,144 288,156" fill="#f59e0b"/>
        <line x1="200" y1="150" x2="200" y2="244" stroke="#f59e0b" stroke-width="2.5"/>
        <polygon points="200,250 194,238 206,238" fill="#f59e0b"/>
        <line x1="200" y1="150" x2="276" y2="207" stroke="#737373" stroke-width="2.5"/>
        <polygon points="280,210 267,208 274,199" fill="#737373"/>
        <circle cx="200" cy="150" r="5" fill="#171717"/>
        <text x="266" y="66" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#3b82f6">∇h = (3, 4)</text>
        <text x="306" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f59e0b">+3</text>
        <text x="288" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">0</text>
        <text x="200" y="270" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f59e0b">−4</text>
        <text x="132" y="248" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#10b981">−5</text>
        <text x="380" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">Height change for a step of length 1:</text>
        <text x="380" y="110" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f59e0b">east (1, 0): +3</text>
        <text x="380" y="135" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#737373">along the contour (0.8, −0.6): 0</text>
        <text x="380" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f59e0b">south (0, −1): −4</text>
        <text x="380" y="185" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#10b981">opposite ∇h (−0.6, −0.8): −5</text>
      </svg>
      ```

      To get a step of length 1, divide by the gradient's length: $-\frac{\nabla h}{\|\nabla h\|}$. Along it, height falls at rate $\|\nabla h\|$. In ML, weights replace position and error replaces height. This is a local guide, not a shortcut to the floor: the slope changes as you move.
    worked: |
      This example shows the steepest-descent step and its rate at $(1.5, 1)$, where $\nabla h = (3, 4)$.

      1. Length of the gradient: $\|\nabla h\| = \sqrt{3^2 + 4^2} = \sqrt{25} = 5$.
      2. Unit steepest-descent step: $-\frac{(3, 4)}{5} = (-0.6, -0.8)$.
      3. Its rate: $\nabla h \cdot (-0.6, -0.8) = -1.8 - 3.2 = -5$, so the height falls 5 m per unit step.
      4. Compare stepping due south, $(0, -1)$: $\nabla h \cdot (0, -1) = -4$. That's downhill too, but less steeply.

      For a small step of length 0.1 along $(-0.6, -0.8)$, the height drops by about $0.1 \times 5 = 0.5$ m.

      Of all steps of the same small length, the one opposite the gradient lowers the output the most, at rate $\|\nabla h\|$.
    problems:
      - gradp-descent-unit
      - gradp-steepest-rate
      - gradp-direction-rate
      - gradp-why-180
      - gradp-not-at-minimum
      - gradp-descent-step
final: grad-explain
summary: |
  - The gradient $\nabla f$ is the vector of all partial derivatives of $f$, one component per input.
  - For a small step $\delta$, $f(p + \delta) \approx f(p) + \nabla f \cdot \delta$, so $\nabla f$ points uphill and steps at right angles to it leave $f$ unchanged.
  - Because $\nabla f \cdot \delta = \|\nabla f\|\,\|\delta\|\cos\theta$, the negative gradient $-\nabla f$ is the steepest-descent direction, with $f$ falling at rate $\|\nabla f\|$ for small steps.

  **Where you'll use this:** gradient descent chooses downhill weight changes; backpropagation computes gradients through a model; momentum and Adam build on gradient-based steps.
