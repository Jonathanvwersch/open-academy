concept: gradients
version: 5
objective: |
  **Goal:** explain what the gradient tells you, find the slope in any chosen direction, and show why its negative gives the steepest local decrease.
recap:
  - concept: partial-derivatives
    text: A partial derivative measures the slope when one input changes and the others stay fixed. For $f(x,y)$, $\partial f/\partial x$ is the slope along the $x$ direction.
  - concept: vectors
    text: A vector keeps its components in order. Its length is the square root of the sum of squared components. Dividing a nonzero vector by its length gives a unit vector, a vector of length $1$.
  - concept: dot-product
    text: The dot product multiplies matching components and adds them. It also equals the product of the vectors' lengths and the cosine of their angle, so it measures how much they point the same way.
where_this_fits: |-
  ### What is a gradient?

  A gradient is a vector that collects a function's slopes, one for each input. It lets us compare small moves that change several inputs together.

  A house-price model is a prediction rule that adds a base price to a price per square metre times the area. Those two adjustable numbers are its parameters. If it predicts £190,000 for a £200,000 sale, training means adjusting the parameters to shrink that error. A loss function measures the error with one number. Its inputs are the parameters, and its partial derivatives describe changing one at a time. The gradient helps us change both together. We'll practise on a simple landscape, treating its height as the number we want to reduce.
knowledge_points:
  - id: grad-vector-of-partials
    title: Collect one slope per input
    tldr: |
      - Each input has its own slope when the others stay fixed.
      - Keeping those slopes in input order makes a vector called the gradient.
      - The gradient describes how the output responds to changes in each input at that point.
    explain: |-
      ### Two slopes at one spot

      We know how to measure a slope when just one input changes. Now let's keep those slopes together. Imagine the output of $f(x,y)=x^2+2y^2$ as the height of the ground above each point $(x,y)$.

      Both squared terms are nonnegative, so the lowest height is zero at $(0,0)$. Moving away from there raises at least one squared term, making a bowl. A **contour map** shows this ground from above, with each ring joining points at the same height. The rings are stretched circles because the squared terms grow at different rates. Moving between points on one ring keeps the height the same.

      At $P=(1.5,1)$, the height is $4.25$. We'll find each slope and substitute $P$ in the worked example below. The results are $3$ along $x$ and $4$ along $y$.

      In the vectors lesson, we pictured a vector as an arrow. We can picture a vector of slopes the same way. Here the grey arrow $(3,0)$ records the $x$ slope and $(0,4)$ records the $y$ slope. Adding them gives the blue arrow $(3,4)$. Their lengths represent the slope values.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" aria-label="The ring joins points where x squared plus 2y squared equals 4.25, including P at (1.5,1). The grey arrows represent the slopes 3 along x and 4 along y. Adding these arrows gives the blue gradient (3,4). Their lengths show the slope numbers rather than distances to walk."><defs><marker id="gr1b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="gr1m" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717"><path d="M60 255 H590 M220 330 V25" stroke="#737373"/><ellipse cx="220" cy="255" rx="134" ry="94.75" fill="#171717" fill-opacity="0" stroke="#d4d4d4"/><path d="M317.5 190 L395.5 190" stroke="#737373" stroke-width="2.5" marker-end="url(#gr1m)"/><path d="M317.5 190 L317.5 86" stroke="#737373" stroke-width="2.5" marker-end="url(#gr1m)"/><path d="M317.5 190 L395.5 86" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#gr1b)"/><circle cx="317.5" cy="190" r="4" fill="#171717"/><text x="325" y="215" fill="#737373">P = (1.5,1)</text><text x="405" y="195" fill="#737373">x slope: 3</text><text x="245" y="115" fill="#737373">y slope: 4</text><text x="405" y="75" fill="#3b82f6">gradient (3,4)</text><text x="85" y="290" fill="#737373">ring: height 4.25</text><text x="65" y="315" fill="#737373">arrow lengths represent slopes</text><text x="595" y="260">x</text><text x="225" y="22">y</text></g></svg>
      ```

      ### Writing the gradient for more inputs

      The **gradient** is the vector of partial derivatives, one per input in input order. We write $\nabla f$, read “gradient of f”, with $\nabla$ called nabla. The same idea works for more than two inputs. If there are $n$ inputs, we name them $x_1,\ldots,x_n$, where the small number tells us which input we mean, and the dots stand for the inputs in between. The gradient keeps one slope for each of these inputs:

      $$\nabla f=\left(\frac{\partial f}{\partial x_1},\ldots,\frac{\partial f}{\partial x_n}\right).$$

      Writing $\nabla f(P)$ means evaluating those slopes at $P$. On our bowl:

      - At $(0,0)$, the gradient is $(0,0)$.
      - At $(1.5,0)$, it is $(3,0)$.
      - At $P$, it is $(3,4)$.

      Be careful not to add $3$ and $4$ and call $7$ the gradient. That sum loses which slope belongs to which input.
    worked: |-
      Let's find the gradient of our bowl $f(x,y)=x^2+2y^2$ at $P=(1.5,1)$.

      1. **Find the x slope.** Hold $y$ fixed, so its term is constant and disappears when differentiating.
         $$\begin{aligned}\frac{\partial f}{\partial x}&=2x &&\text{differentiate in }x\\\frac{\partial f}{\partial x}(P)&=2(1.5)=3 &&\text{substitute }P\end{aligned}$$

      2. **Find the y slope.** Hold $x$ fixed and differentiate the squared $y$ term.
         $$\begin{aligned}\frac{\partial f}{\partial y}&=4y &&\text{differentiate in }y\\\frac{\partial f}{\partial y}(P)&=4(1)=4 &&\text{substitute }P\end{aligned}$$

      3. **Keep the slopes in order.** The inputs are listed as $x$, then $y$, so their slopes go in that order too.
         $$\nabla f(P)=(3,4).$$

      The height is one number, $4.25$, but the gradient is a vector describing two different ways the height can change.
