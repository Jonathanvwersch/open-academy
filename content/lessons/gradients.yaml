final: grad-explain
summary: |-
  - At a point $P$, the gradient $\nabla f(P)$ collects one partial derivative per input, in input order.
  - The slope in a unit direction $\mathbf u$ is $\nabla f(P)\cdot\mathbf u$. For a small input change $\delta$ from $P$, the output change is approximately $\nabla f(P)\cdot\delta$.
  - The gradient points steepest uphill, and its negative points steepest downhill. The steepest slope has magnitude equal to the gradient's length.
  - These directions describe the slopes at $P$, so the route to the minimum can change direction along the way.

  **Next:** Gradient descent uses the same downhill steps to train a model. We treat the model's loss as the height and its parameters as the inputs to adjust.
