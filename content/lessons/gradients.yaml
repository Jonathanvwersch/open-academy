concept: gradients
version: 3
objective: |
  **Goal:** compute the gradient $\nabla f$ of a function of several inputs, use it to estimate how the output changes for a small step, and explain why the negative gradient is the direction of steepest descent.
where_this_fits: |
  The partial-derivatives lesson gave us one loss slope for each house-model weight, with the other weights held fixed. Looking at those numbers separately does not show the combined direction in which the loss rises fastest. The gradient puts the partial derivatives in one vector, so its opposite points toward the steepest local decrease. The next lesson uses that direction to update the weights repeatedly.
knowledge_points:
  - id: grad-vector-of-partials
    title: The gradient collects every partial derivative
    explain: |
      **What a gradient is.** The gradient is a vector containing one partial derivative for each input, in the same order as those inputs.

      **How it works.** For one house with area 12 and sale price 330, use the simplified model $\hat y=12w+b$ and loss $L(w,b)=(12w+b-330)^2$. At $w=25,b=0$, the prediction is 300 and the error is −30. Thus

      $$\nabla L=(2(-30)\cdot12,\ 2(-30))=(-720,-60).$$

      The first component is the slope for $w$; the second is the slope for $b$. Keeping this order prevents us from applying a rate to the wrong parameter.

      **Why this is useful.** Training can use one vector to track how every adjustable part of a house-price model affects its loss.
    worked: |
      This example shows the gradient for the house's area weight and bias.

      At $(w,b)=(25,0)$, $L=(12\cdot25-330)^2=900$.

      1. $\partial L/\partial w=2(12w+b-330)\cdot12=-720$.
      2. $\partial L/\partial b=2(12w+b-330)=-60$.
      3. Put them in input order: $\nabla L=(-720,-60)$.
    problems:
      [
        gradp-compute,
        gradp-component,
        gradp-why-vector,
        gradp-three-inputs,
        gradp-order,
        gradp-exp-component,
      ]
  - id: grad-points-uphill
    title: The gradient predicts a small loss change
    explain: |
      **What a directional change is.** It is the approximate output change caused by moving several inputs a small amount together.

      **How it works.** At $(w,b)=(25,0)$, the house loss has gradient $(-720,-60)$. A small parameter step $\delta=(0.01,0.1)$ changes the loss by approximately the dot product:

      $$L((w,b)+\delta)\approx L(w,b)+\nabla L\cdot\delta.$$

      The estimated change is $-720(0.01)-60(0.1)=-13.2$. This is a first-order approximation: it uses the slopes at the starting point. It works because a smooth loss changes almost linearly in a small region around that point.

      Why does a dot product estimate the change? Each partial derivative gives one parameter's rate; multiplying it by that parameter's small step and adding counts all parameter changes.

      **Why this is useful.** The estimate lets us check whether a proposed small update to house-model weights should lower the loss.
    worked: |
      This example shows the gradient's estimate against the actual loss after a small step.

      Initially $L(25,0)=900$. For $\delta=(0.01,0.1)$ the estimate is $-13.2$, giving 886.8.

      At $(25.01,0.1)$, the prediction is $12(25.01)+0.1=300.22$, so the actual loss is $(-29.78)^2=886.8484$. The estimate is close because the step is small.
    problems:
      [
        gradp-uphill,
        gradp-approx,
        gradp-contour,
        gradp-length,
        gradp-predict-height,
        gradp-small-step,
      ]
  - id: grad-steepest-descent
    title: The negative gradient is steepest descent
    explain: |
      **What steepest descent means.** It is the direction that lowers a function fastest per unit distance for a small step.

      **How it works.** The gradient points toward the greatest increase. For the house loss at $(25,0)$ it is $(-720,-60)$, so the opposite direction is $(720,60)$. Divide by its length to compare unit steps. For any unit direction $u$, the estimated change is $\nabla L\cdot u$; the dot product is smallest when $u$ points opposite the gradient.

      Here $\theta$ is the angle between the gradient and the unit step. This follows from $\nabla L\cdot u=\|\nabla L\|\|u\|\cos\theta$: with both lengths fixed, the smallest cosine is −1. A large step may not keep reducing loss because the slopes change as the weights move.

      **Why this is useful.** Gradient descent uses the negative gradient to update house-model weights toward a lower price loss.
    worked: |
      This example shows the steepest local decrease for the one-house model.

      The gradient is $(-720,-60)$. Its length is $\sqrt{720^2+60^2}=60\sqrt{145}$.

      The unit direction opposite it is $(12/\sqrt{145},1/\sqrt{145})$. The predicted loss change per unit step is $-60\sqrt{145}$, about −722.5. A unit increase in $w$ alone gives −720, slightly less decrease.
    problems:
      [
        gradp-descent-unit,
        gradp-steepest-rate,
        gradp-direction-rate,
        gradp-why-180,
        gradp-not-at-minimum,
        gradp-descent-step,
      ]
final: grad-explain
summary: |
  - The gradient is the vector of all partial derivatives, one component per model parameter.
  - Its dot product with a small parameter step estimates the resulting house-loss change.
  - For equal small steps, the negative gradient gives the steepest local decrease.

  **Next:** Gradient descent uses the negative gradient to step house-model weights toward lower loss.
