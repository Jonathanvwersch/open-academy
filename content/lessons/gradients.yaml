concept: gradients
version: 2
objective: |
  **Goal:** compute the gradient $\nabla f$ of a function of several inputs, use it to estimate how the output changes for a small step, and explain why the negative gradient is the direction of steepest descent.
why: |
  A robot's prediction model has several weights, and you want to adjust them so its predictions get closer to recorded measurements. You could try changing one weight at a time, but that misses combinations that improve the prediction more for the same-sized change. Partial derivatives tell you each weight's separate effect; a gradient brings those effects together to choose a direction for all the weights at once. Picture the weights as your position in a valley and prediction error as height: you need a downhill direction, not just an east-west slope. Gradients make that choice possible using local information. You'll use them in gradient descent, backpropagation, and momentum and Adam.
knowledge_points:
  - id: grad-vector-of-partials
    title: The gradient collects every partial derivative
    explain: |
      You're standing in a valley at $(x, y)$: $x$ hundred metres east and $y$ hundred metres north of the floor. Your height in metres is

      $$h(x, y) = x^2 + 2y^2$$

      At $(1.5, 1)$ you're $2.25 + 2 = 4.25$ m up. **Which way is uphill?** Checking only the eastward partial misses any northward climb. So keep both partials as components of a vector, rather than choosing just one.

      The **gradient** of $h$, written $\nabla h$ and read "grad h", collects those partials:

      $$\nabla h = \left(\frac{\partial h}{\partial x},\ \frac{\partial h}{\partial y}\right)$$

      This works because each partial measures a slope along one axis. Keeping them side by side preserves both compass directions instead of mixing them into one number.

      The symbol $\nabla$ is called "nabla". For $n$ inputs the gradient has $n$ components in input order. Unlike the single-number height, it has direction and length.
    worked: |
      This example shows the gradient computed one partial at a time, then evaluated at a point.

      **Valley: $h(x, y) = x^2 + 2y^2$ at $(1.5, 1)$.**

      1. $\frac{\partial h}{\partial x} = 2x$ (treat $y$ as a constant).
      2. $\frac{\partial h}{\partial y} = 4y$ (treat $x$ as a constant).
      3. So $\nabla h = (2x, 4y)$, and at $(1.5, 1)$ it is $(3, 4)$.

      **Another function: $f(w_1, w_2) = w_1^2 w_2 + \sin w_2$ at $(1, 0)$**, with inputs $w_1$ and $w_2$.

      1. $\frac{\partial f}{\partial w_1} = 2w_1 w_2$, which is 0 at $(1, 0)$.
      2. $\frac{\partial f}{\partial w_2} = w_1^2 + \cos w_2$, which is $1 + 1 = 2$ at $(1, 0)$.
      3. So $\nabla f(1, 0) = (0, 2)$.

      The gradient is just every partial derivative, written in order as one vector.
    problems:
      - gradp-compute
      - gradp-component
      - gradp-why-vector
      - gradp-three-inputs
      - gradp-order
      - gradp-exp-component
  - id: grad-points-uphill
    title: The gradient points uphill
    explain: |
      You know $\nabla h(1.5, 1) = (3, 4)$. **What happens if you step northeast?** Using only the northward slope ignores the eastward rise. Write the step as $\delta = (\delta_x, \delta_y)$, where $\delta$ ("delta") gives the eastward and northward moves.

      Add both contributions, $3\delta_x + 4\delta_y$, using the gradient's dot product with the step:

      $$h(p + \delta) \approx h(p) + \nabla h \cdot \delta$$

      Here $p$ is your position, and this is a **first-order approximation**.

      This works because a small patch of hillside is nearly flat, with each slope contributing its share of the rise.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="Contour lines of the valley h equals x squared plus 2 y squared, drawn as ellipses of equal height. At the point (1.5, 1) a blue gradient arrow points straight across the contours, away from the valley floor. A green arrow points the opposite way, downhill. A dashed grey line runs along the contour, where the height doesn't change.">
        <ellipse cx="220" cy="150" rx="60" ry="42" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="2"/>
        <ellipse cx="220" cy="150" rx="124" ry="87.5" fill="#171717" fill-opacity="0" stroke="#737373" stroke-width="2"/>
        <ellipse cx="220" cy="150" rx="180" ry="127" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="2"/>
        <circle cx="220" cy="150" r="4" fill="#737373"/>
        <text x="220" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">floor</text>
        <line x1="270" y1="60" x2="350" y2="120" stroke="#737373" stroke-width="2" stroke-dasharray="6 5"/>
        <line x1="310" y1="90" x2="346" y2="42" stroke="#3b82f6" stroke-width="3"/>
        <polygon points="352,34 338,40 349,48" fill="#3b82f6"/>
        <line x1="310" y1="90" x2="274" y2="138" stroke="#10b981" stroke-width="3"/>
        <polygon points="268,146 271,131 282,139" fill="#10b981"/>
        <circle cx="310" cy="90" r="5" fill="#171717"/>
        <text x="430" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#3b82f6">∇h = (3, 4): uphill</text>
        <text x="430" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#10b981">−∇h: downhill</text>
        <text x="430" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#737373">along the contour:</text>
        <text x="430" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#737373">no change in height</text>
        <text x="430" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">Each ellipse joins points</text>
        <text x="430" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">of equal height h.</text>
      </svg>
      ```

      The dot product is positive along the gradient, so it points uphill. It's zero at right angles, tangent to a **contour**, a line of equal height. A longer gradient means steeper ground; $(0, 0)$ means no first-order rise.
    worked: |
      This example shows the approximation predicting the height change for three small steps from $(1.5, 1)$, where $h = 4.25$ and $\nabla h = (3, 4)$.

      | step $\delta$ | $\nabla h \cdot \delta$ | predicted height |
      |---|---|---|
      | $(0.1, 0)$, east | $3 \times 0.1 + 4 \times 0 = 0.3$ | $4.55$ m |
      | $(0.06, 0.08)$, along $\nabla h$ | $0.18 + 0.32 = 0.5$ | $4.75$ m |
      | $(0.08, -0.06)$, along the contour | $0.24 - 0.24 = 0$ | $4.25$ m |

      Check the first one exactly: $h(1.6, 1) = 2.56 + 2 = 4.56$ m, very close to the predicted $4.55$ m.

      All three steps have length 0.1, but the one along the gradient climbs the most, and the one at right angles doesn't climb at all.

      The dot product of the gradient with a small step predicts the change in output.
    problems:
      - gradp-uphill
      - gradp-approx
      - gradp-contour
