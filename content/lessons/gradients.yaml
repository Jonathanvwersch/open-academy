concept: gradients
version: 3
objective: |
  **Goal:** compute the gradient $\nabla f$ of a function of several inputs, use it to estimate how the output changes for a small step, and explain why the negative gradient is the direction of steepest descent.
where_this_fits: |
  The partial-derivatives lesson gave us one loss slope for each house-model weight, with the other weights held fixed. Looking at those numbers separately does not show the combined direction in which the loss rises fastest. The gradient puts the partial derivatives in one vector, so its opposite points toward the steepest local decrease. The next lesson uses that direction to update the weights repeatedly.
knowledge_points:
  - id: grad-vector-of-partials
    title: The gradient collects every partial derivative
    explain: |
      **What a gradient is.** The gradient is an ordered vector of partial derivatives, one for each adjustable model parameter.

      **How it works.** For $x=(12,3,20)$, sale price $y=330$, weights $w=(25,10,-1)$ and bias $b=0$, the prediction is 310 and the error is $e=-20$. The loss is $L=(w\cdot x+b-y)^2$. The previous lesson found each partial; put them in parameter order:

      $$\nabla L=\left(\frac{\partial L}{\partial w_1},\frac{\partial L}{\partial w_2},\frac{\partial L}{\partial w_3},\frac{\partial L}{\partial b}\right)=2e(12,3,20,1)=(-480,-120,-800,-40).$$

      Each component is the loss slope for its matching weight or bias. The order must match the order of the parameters.

      **Why this is useful.** Training can use one vector to track how every adjustable part of a house-price model affects its loss.
    worked: |
      This example shows the four partials for the same house.

      The prediction is $12\cdot25+3\cdot10+20(-1)+0=310$, so $e=-20$.

      1. Area weight: $2e\cdot12=-480$.
      2. Bedroom weight: $2e\cdot3=-120$.
      3. Age weight: $2e\cdot20=-800$.
      4. Bias: $2e=-40$.

      Thus $\nabla L=(-480,-120,-800,-40)$.
    problems:
      [
        grad-vector-of-partials-basics,
        gradp-compute,
        gradp-component,
        gradp-why-vector,
        gradp-three-inputs,
        gradp-order,
        gradp-exp-component,
      ]
  - id: grad-points-uphill
    title: The gradient predicts a small loss change
    explain: |
      **What a directional change is.** It is the approximate output change caused by moving several inputs a small amount together.

      **How it works.** At the same house and weights, $\nabla L=(-480,-120,-800,-40)$. For the small step $\delta=(0.01,0.01,0.01,0.01)$, the dot product estimates the change:

      $$\Delta L\approx\nabla L\cdot\delta=-4.8-1.2-8-0.4=-14.4.$$

      This first-order approximation uses the slopes at the starting point. It works because a smooth loss changes almost linearly in a small region around that point. The dot product adds each parameter's slope multiplied by its own small step.

      **Why this is useful.** The estimate lets us check whether a proposed small update to house-model weights should lower the loss.
    worked: |
      This example shows the calculation.
      This example compares the estimate with the actual loss after the four-parameter step.

      Initially the prediction is 310 and $L=400$. The estimated change is $-14.4$, so the estimated loss is 385.6.

      After the step, $w=(25.01,10.01,-0.99)$ and $b=0.01$. The prediction is $310.36$, so the actual loss is $(-19.64)^2=385.7296$. Its change, $-14.2704$, is close to the estimate.
    problems:
      [
        grad-points-uphill-basics,
        gradp-uphill,
        gradp-approx,
        gradp-contour,
        gradp-length,
        gradp-predict-height,
        gradp-small-step,
      ]
  - id: grad-steepest-descent
    title: The negative gradient is steepest descent
    explain: |
      **What steepest descent means.** It is the direction that lowers a function fastest per unit distance for a small step.

      **How it works.** For the house loss, the gradient is $(-480,-120,-800,-40)$, so the opposite direction is $(480,120,800,40)$. Divide by its length to compare unit steps. Let $\theta$ be the angle between the gradient and a unit step $u$. The dot product formula is

      $$\nabla L\cdot u=\|\nabla L\|\|u\|\cos\theta.$$

      With both lengths fixed, the smallest cosine is −1, so the negative gradient gives the steepest local decrease. The gradient length is $\sqrt{480^2+120^2+800^2+40^2}=40\sqrt{554}$.

      **Why this is useful.** Gradient descent uses the negative gradient to update house-model weights toward a lower price loss.
    worked: |
      This example shows the steepest local decrease for the same house loss.

      The gradient is $(-480,-120,-800,-40)$ and its length is $40\sqrt{554}$.

      Its opposite unit direction is $(12,3,20,1)/\sqrt{554}$. The predicted loss change per unit step is $-40\sqrt{554}$.
    problems:
      [
        grad-steepest-descent-basics,
        gradp-descent-unit,
        gradp-steepest-rate,
        gradp-direction-rate,
        gradp-why-180,
        gradp-not-at-minimum,
        gradp-descent-step,
      ]
final: grad-explain
summary: |
  - The gradient is the vector of all partial derivatives, one component per model parameter.
  - Its dot product with a small parameter step estimates the resulting house-loss change.
  - For equal small steps, the negative gradient gives the steepest local decrease.

  **Next:** Gradient descent uses the negative gradient to step house-model weights toward lower loss.
