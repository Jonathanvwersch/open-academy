  - id: grad-points-uphill
    title: The slope in any direction
    explain: |
      **The question.** You are standing at $P$ on the bowl and choose a direction to walk. How quickly does its height rise or fall along that route, rather than just along the $x$- or $y$-axis?

      **Picture it.** The blue arrow is $\nabla f(P)=(3,4)$; the amber unit direction $\mathbf u=(1,0)$ is one step along $+x$. Its dashed projection points along $\mathbf u$ and has length $3$, so the slope is $+3$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" aria-label="At P, the gradient arrow (3,4) projects onto unit direction u=(1,0) with projected length 3 and separated labels">
        <defs>
          <marker id="g2-blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
          <marker id="g2-amber-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <ellipse cx="150" cy="360" rx="40" ry="28.284271" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <ellipse cx="150" cy="360" rx="60" ry="42.426407" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <ellipse cx="150" cy="360" rx="82.462113" ry="58.309519" fill="#171717" fill-opacity="0" stroke="#a3a3a3" stroke-width="2.25"/>
          <ellipse cx="150" cy="360" rx="113.137085" ry="80" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <path d="M150 360 H610 M150 360 V40" stroke="#737373" fill="#171717" fill-opacity="0"/>
          <path d="M210 320 L282 224" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#g2-blue-arrow)"/>
          <path d="M210 320 H282" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#g2-blue-arrow)"/>
          <path d="M210 320 H266" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#g2-amber-arrow)"/>
          <circle cx="210" cy="320" r="4" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="155" y="347">P = (1.5,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="246" y="347" fill="#f59e0b">u = (1,0)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="294" y="218">∇f(P) = (3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="294" y="305" fill="#3b82f6">projection = 3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="615" y="355">x</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="156" y="36">y</text>
        </g>
      </svg>
      ```

      **The idea.** The dot product is a projection: it measures how much the gradient points along your chosen direction. For a unit vector $\mathbf u$, the **directional derivative** $D_{\mathbf u}f(P)$ is the slope of $f$ at $P$ in direction $\mathbf u$:

      $$D_{\mathbf u}f(P)=\nabla f(P)\cdot\mathbf u.$$

      A unit vector has length $1$, so the dot product gives slope per unit distance. For a tiny step, the surface is nearly straight, so change is about distance times slope: $\Delta f\approx hD_{\mathbf u}f(P)$.

      **Common confusion.** “Isn't the directional derivative just the gradient?” Not quite. The gradient is one vector for the point. The directional derivative is one number for each direction you might walk, and you get every one of them from the gradient with a dot product. The partial derivatives are just two of them: $\mathbf u=(1,0)$ gives $3$ and $\mathbf u=(0,1)$ gives $4$.
    worked: |
      At $P=(1.5,1)$, use $\nabla f(P)=(3,4)$. Choose $\mathbf u=(0.6,0.8)$ to make both coordinates contribute; it is easy to check that this direction has unit length.

      1. **Check that the direction is a unit vector.**
         $$\|\mathbf u\|=\sqrt{0.6^2+0.8^2}=1.$$

      2. **Find the slope in that direction.**
         $$D_{\mathbf u}f(P)=\nabla f(P)\cdot\mathbf u=3(0.6)+4(0.8)=5.$$

      3. **Switch to a separate $+x$ walk and check a small step of length $h=0.01$.**
         $$\Delta f\approx hD_{(1,0)}f(P)=0.01(3)=0.03.$$

      4. **Compare with the actual change.**
         $$f(1.51,1)-f(1.5,1)=4.2801-4.25=0.0301.$$

      **Compare cases.**

      | Direction $\mathbf u$ | Slope $\nabla f(P)\cdot\mathbf u$ |
      | --- | --- |
      | $(1,0)$ | $3$ |
      | $(0,1)$ | $4$ |
      | $(0.6,0.8)$ | $5$ |
      | $(0.8,-0.6)$ | $0$ |
      | $(-1,0)$ | $-3$ |
      | $(-0.6,-0.8)$ | $-5$ |

      **Where it shows up.** In machine learning, $L$ is the training loss, a score of model errors. An update is a small change to the model's parameters; call its vector of changes $\delta$. The dot product $\nabla L\cdot\delta$ predicts how that update changes the loss.
    problems:
      - grad-points-uphill-basics
      - gradp-approx
      - gradp-direction-rate
      - gradp-contour
      - gradp-predict-height
      - gradp-small-step
      - gradp-target-drop
      - gradp-robot-direction
  - id: grad-steepest-descent
    title: Steepest uphill and steepest downhill
    explain: |
      **The question.** Of all unit directions from $P$, which one climbs fastest, and which one lowers $f$ fastest?

      **Picture it.** Like a topographic map, a contour joins positions of equal height. The grey ellipse passes through $P$ where $f(P)=4.25$, its height there. The blue gradient arrow points uphill fastest; amber unit arrows show parallel, opposite and tangent walks, with slopes $5$, $-5$ and $0$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" aria-label="At P on the f equals 4.25 contour, the gradient slope is 5, the opposite slope is minus 5, the tangent slope is zero, and a dashed red arrow points to the minimum">
        <defs>
          <marker id="g3-blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
          <marker id="g3-amber-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
          <marker id="g3-red-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <ellipse cx="160" cy="380" rx="60" ry="42.426407" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <ellipse cx="160" cy="380" rx="90" ry="63.639610" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <ellipse cx="160" cy="380" rx="123.693169" ry="87.464278" fill="#171717" fill-opacity="0" stroke="#a3a3a3" stroke-width="2.25"/>
          <path d="M160 380 H605 M160 380 V35" stroke="#737373" fill="#171717" fill-opacity="0"/>
          <path d="M250 320 L160 380" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#g3-red-arrow)"/>
          <path d="M250 320 L286 272" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#g3-blue-arrow)"/>
          <path d="M250 320 L214 368" stroke="#f59e0b" stroke-width="3" marker-end="url(#g3-amber-arrow)"/>
          <path d="M250 320 L290 350" stroke="#f59e0b" stroke-width="3" marker-end="url(#g3-amber-arrow)"/>
          <circle cx="160" cy="380" r="3.5" fill="#171717"/>
          <circle cx="250" cy="320" r="4" fill="#171717"/>
          <path d="M14 270 H27" stroke="#a3a3a3" stroke-width="2.25"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="34" y="275">f = 4.25</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="299" y="265" fill="#3b82f6">∇f(P) = (3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="299" y="294" fill="#3b82f6">slope 5</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="326">P = (1.5,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="302" y="367" fill="#f59e0b">slope 0</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="190" y="444" fill="#f59e0b">slope −5 (−∇f)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="10" y="404" fill="#ef4444">to the minimum</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="614" y="375">x</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="168" y="29">y</text>
        </g>
      </svg>
      ```

      **The idea.** Let $\theta$ be the angle between the gradient and a chosen unit direction $\mathbf u$. The dot product is gradient length times direction length times the cosine of that angle. Since $\|\mathbf u\|=1$:

      $$D_{\mathbf u}f(P)=\nabla f(P)\cdot\mathbf u=\|\nabla f(P)\|\|\mathbf u\|\cos\theta=\|\nabla f(P)\|\cos\theta.$$

      At $0^\circ$, $\cos\theta=1$, so the formula gives slope $\|\nabla f(P)\|$, the largest possible. At $180^\circ$, the slope is $-\|\nabla f(P)\|$, so $-\nabla f$ points steepest downhill. A contour joins equal-height points; moving along its tangent keeps the height unchanged nearby, so at $90^\circ$ the slope is $0$.

      **Common confusion.** “The negative gradient points straight at the minimum.” It gives steepest local decrease, not the destination: from $P$, the vector to $(0,0)$ is $(0,0)-(1.5,1)=(-1.5,-1)$, not parallel to $-\nabla f(P)=(-3,-4)$.

    worked: |
      At $P=(1.5,1)$, $\nabla f(P)=(3,4)$.

      1. **Find the gradient length.**
         $$\|\nabla f(P)\|=\sqrt{3^2+4^2}=5.$$

      2. **Find the unit steepest-uphill direction.**
         $$\frac{\nabla f(P)}{\|\nabla f(P)\|}=\left(\frac35,\frac45\right)=(0.6,0.8).$$

      3. **Reverse it for the steepest-downhill direction.**
         $$\mathbf u=-\frac{\nabla f(P)}{\|\nabla f(P)\|}=(-0.6,-0.8).$$

      4. **Check that a perpendicular unit direction has zero slope.**
         $$\mathbf u=(0.8,-0.6),\qquad \nabla f(P)\cdot\mathbf u=3(0.8)+4(-0.6)=0.$$

      **Compare cases.**

      | Angle $\theta$ | $\cos\theta$ | Slope $5\cos\theta$ |
      | --- | --- | --- |
      | $0^\circ$ | $1$ | $5$ |
      | $60^\circ$ | $0.5$ | $2.5$ |
      | $90^\circ$ | $0$ | $0$ |
      | $120^\circ$ | $-0.5$ | $-2.5$ |
      | $180^\circ$ | $-1$ | $-5$ |

      **Where it shows up.** Gradient descent takes small steps along $-\nabla L$ because this is the direction of steepest local loss decrease.
