concept: gradients
version: 4
objective: |
  **Goal:** explain what the gradient tells you, find the slope in any chosen direction, and show why its negative gives the steepest local decrease.
where_this_fits: |
  Partial derivatives give the slope when one input changes and the others stay fixed; vectors and the dot product let us collect slopes and measure how much two directions agree. This lesson combines those ideas to find slopes in any direction and choose the steepest uphill or downhill direction.
knowledge_points:
  - id: grad-vector-of-partials
    title: The gradient collects the slopes
    explain: |
      **The question.** For $f(x,y)=x^2+2y^2$ at $P=(1.5,1)$, the partial derivatives tell you how $f$ changes when only $x$ moves or only $y$ moves. How can you describe both slopes at $P$ in one object?

      **Picture it.** The grey ellipses mark equal values of $f$ around its lowest point, $(0,0)$. At $P=(1.5,1)$, the $x$-slope is $3$ and the $y$-slope is $4$. The horizontal grey arrow is labelled $3$ for $x$; the vertical one is labelled $4$ for $y$. The blue arrow combines them as $(3,4)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" aria-label="Contours of x squared plus 2y squared including the f equals 4.25 contour through P, with slope arrows 3 and 4 and combined gradient arrow (3,4)">
        <defs>
          <marker id="g1-muted-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
          <marker id="g1-blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <ellipse cx="160" cy="350" rx="48" ry="33.941125" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <ellipse cx="160" cy="350" rx="72" ry="50.911688" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <ellipse cx="160" cy="350" rx="98.954535" ry="69.971423" fill="#171717" fill-opacity="0" stroke="#a3a3a3" stroke-width="2.25"/>
          <ellipse cx="160" cy="350" rx="135.764502" ry="96" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <path d="M160 350 H610 M160 350 V40" stroke="#737373" fill="#171717" fill-opacity="0"/>
          <path d="M232 302 H292" stroke="#737373" stroke-width="2.5" marker-end="url(#g1-muted-arrow)"/>
          <path d="M232 302 V222" stroke="#737373" stroke-width="2.5" marker-end="url(#g1-muted-arrow)"/>
          <path d="M232 302 L292 222" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#g1-blue-arrow)"/>
          <path d="M18 239 H30" stroke="#a3a3a3" stroke-width="2.25"/>
          <circle cx="232" cy="302" r="4" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="36" y="244">f = 4.25</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="133" y="370">origin</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="615" y="345">x</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="166" y="34">y</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="237" y="335">P = (1.5,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="298" y="293">3 along x</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="164" y="208">4 along y</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="302" y="216">(3,4) combined</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="482" y="458">Contours: equal f</text>
        </g>
      </svg>
      ```

      **The idea.** At each point, collect one partial derivative per input into a vector: the **gradient**. Write it as $\nabla f$, read “gradient of $f$”; $\nabla$ is called nabla. For $n$ inputs $x_1,\ldots,x_n$, $\nabla f=(\partial f/\partial x_1,\ldots,\partial f/\partial x_n)$, one component per input in the same order. At $P$, $\nabla f(P)$ means the gradient evaluated there: $(3,4)$.

      **Common confusion.** “The gradient is just one number telling me how steep the hill is.” No: it is a vector, so its components record how each input contributes. Its length is one number; the third part connects it to the steepest slope.

    worked: |
      Find the gradient of $f(x,y)=x^2+2y^2$ at $P=(1.5,1)$.

      1. **Find the slope along $x$.**
         $$\frac{\partial f}{\partial x}=2x=2(1.5)=3.$$

      2. **Find the slope along $y$.**
         $$\frac{\partial f}{\partial y}=4y=4(1)=4.$$

      3. **Collect the two slopes in input order.**
         $$\nabla f(P)=(3,4).$$

      **Compare cases.**

      | Point | Gradient |
      | --- | --- |
      | $(0,0)$ | $(0,0)$ |
      | $(1.5,0)$ | $(3,0)$ |
      | $(0,1)$ | $(0,4)$ |
      | $(1.5,1)$ | $(3,4)$ |

      **Where it shows up.** The partial-derivatives lesson computed the house-price loss slopes as $(-480,-120,-800,-40)$. That model has three weights and a bias, so its gradient keeps one of those four partial derivatives for each parameter.
