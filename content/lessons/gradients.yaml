  - id: grad-points-uphill
    title: Find the slope in a chosen direction
    tldr: |
      - A chosen direction can change several inputs together.
      - The dot product of the gradient and a unit direction adds up those inputs' effects.
      - That gives the slope in that direction, which estimates the output change for a small move.
    explain: |-
      ### Walk along x first

      Our gradient $(3,4)$ describes both slopes at $P$. Let's walk along $x$ first. The orange arrow shows the unit direction $\mathbf u=(1,0)$. Multiplying it by a distance tells us how far each input changes.

      The gradient's horizontal component is $3$, so a small distance along $x$ raises the height by about three times that distance. It's an estimate because the slope changes as we leave $P$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" aria-label="At P=(1.5,1), the blue arrow represents the gradient (3,4). The orange arrow points along the unit direction u=(1,0). The dashed blue arrow shows the horizontal component 3, so the slope along x is 3."><defs><marker id="gr2b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="gr2a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717"><path d="M60 255 H590 M220 330 V25" stroke="#737373"/><ellipse cx="220" cy="255" rx="134" ry="94.75" fill="#171717" fill-opacity="0" stroke="#d4d4d4"/><path d="M317.5 190 L395.5 86" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#gr2b)"/><path d="M317.5 190 L395.5 190" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#gr2b)"/><path d="M317.5 190 L343.5 190" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#gr2a)"/><circle cx="317.5" cy="190" r="4" fill="#171717"/><text x="325" y="215" fill="#737373">P</text><text x="405" y="85" fill="#3b82f6">gradient (3,4)</text><text x="410" y="185" fill="#3b82f6">component along x: 3</text><text x="320" y="242" fill="#f59e0b">u = (1,0)</text><text x="75" y="290" fill="#737373">ring: height 4.25</text><text x="595" y="260">x</text><text x="225" y="22">y</text></g></svg>
      ```

      ### How each input changes the height

      The **directional derivative** is the slope at a point in a chosen unit direction. Write $D_{\mathbf u}f(P)$, read “the slope of f at P in direction u”. Write $\Delta$ for a change and $\approx$ for "approximately". For $\mathbf u=(u_x,u_y)$, a distance $h$ in the input plane gives:
      $$\begin{aligned}\Delta x&=hu_x &&\text{horizontal change}\\\Delta y&=hu_y &&\text{vertical change}\\\Delta f&=3hu_x+4hu_y+h^2(u_x^2+2u_y^2) &&\text{expand the bowl's height change}\\&\approx3hu_x+4hu_y &&\text{drop the squared-nudge terms}\\\frac{\Delta f}{h}&\approx3u_x+4u_y &&\text{divide by distance}\end{aligned}$$
      As $h$ shrinks, this gives the dot product:

      $$D_{\mathbf u}f(P)=\nabla f(P)\cdot\mathbf u.$$

      Use a unit direction so the result measures change per unit distance.

      Compare a direction along the gradient with one perpendicular to it:
      $$\begin{aligned}(3,4)/5&=(0.6,0.8) &&\text{divide by length for a unit vector}\\\mathbf v&=(0.8,-0.6) &&\text{swap entries and flip one sign}\\(3,4)\cdot\mathbf v&=3(0.8)+4(-0.6)=0 &&\text{check perpendicularity}\end{aligned}$$

      | Unit direction | Slope |
      | --- | --- |
      | $(1,0)$ | $3$ |
      | $(0.6,0.8)$ | $5$ |
      | $(0.8,-0.6)$ | $0$ |

      ### Estimate a small change

      Here $\Delta f$ is new height minus old height. Distance times slope estimates that change:

      $$\Delta f\approx hD_{\mathbf u}f(P).$$

      Call the vector of input changes $\delta$. Multiplying direction by distance gives $\delta=h\mathbf u$. Because a dot product multiplies and adds components, we can multiply either the result or the direction by $h$:

      $$\begin{aligned}
      hD_{\mathbf u}f(P)&=h(\nabla f(P)\cdot\mathbf u) &&\text{use the directional slope}\\
      &=\nabla f(P)\cdot(h\mathbf u) &&\text{scale the direction instead}\\
      &=\nabla f(P)\cdot\delta &&\text{substitute the change vector}
      \end{aligned}$$

      Each expression is distance times slope, so it estimates the height change.

      Be careful not to read zero slope as constant height throughout a straight walk. The ground can bend as we move, so these estimates describe only small moves from $P$.
    worked: |-
      Let's estimate the height after walking distance $h=0.1$ from $P=(1.5,1)$ in direction $\mathbf u=(0.6,0.8)$, using the gradient $(3,4)$.

      1. **Check the direction length.** It must be one so the dot product gives slope per unit distance.
         $$\|\mathbf u\|=\sqrt{0.6^2+0.8^2}=1.$$

      2. **Find the slope along this direction.** Each input contributes its slope times its component of the direction.
         $$D_{\mathbf u}f(P)=3(0.6)+4(0.8)=5.$$

      3. **Find both input changes.** Multiplying the direction by the distance gives the change vector for this same walk.
         $$\delta=0.1(0.6,0.8)=(0.06,0.08).$$

      4. **Estimate the new height.** The endpoint $P+\delta$ means adding the changes to the starting coordinates. Add the estimated rise to height $4.25$.
         $$f(P+\delta)\approx4.25+0.1(5)=4.75.$$

      We predict a rise of $0.5$. The height estimate is approximate because the slopes can change during the walk.
    problems:
      - grad-points-uphill-basics
      - gradp-approx
      - gradp-direction-rate
      - gradp-contour
      - gradp-predict-height
      - gradp-small-step
      - gradp-target-drop
      - gradp-robot-direction
  - id: grad-steepest-descent
    title: Choose the steepest way downhill
    tldr: |
      - We compare directions using moves of equal length.
      - The slope is largest along the gradient and smallest in the opposite direction.
      - The negative gradient gives the steepest local decrease, which can differ from the direct route to the bottom.
    explain: |-
      ### Compare walks of equal length

      We can now calculate a slope in any unit direction. Which direction gives the greatest decrease? To compare fairly, we use the same distance of travel.

      At $P$, our gradient $(3,4)$ has length $5$. To compare unit directions, we divide the gradient by $5$. The blue arrow shows this shorter, length-one vector pointing along the gradient. One orange arrow points opposite the gradient, and the other points perpendicular to it. The perpendicular arrow has zero slope because its dot product with the gradient is zero.

      The dashed red arrow points straight to the bottom. We'll compare it with the downhill orange arrow to see whether the steepest way down heads straight for the minimum.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" aria-label="The ring joins points at height 4.25 and passes through P=(1.5,1). Three arrows of length one point along the gradient, opposite it and perpendicular to it. The blue uphill direction has slope 5, and the orange downhill and perpendicular directions have slopes minus 5 and zero. The dashed red arrow points directly to the bottom at (0,0), allowing comparison with the orange downhill arrow."><defs><marker id="gr3b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="gr3a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker><marker id="gr3r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker></defs><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717"><path d="M60 255 H590 M220 330 V25" stroke="#737373"/><ellipse cx="220" cy="255" rx="134" ry="94.75" fill="#171717" fill-opacity="0" stroke="#d4d4d4"/><path d="M317.5 190 L356.5 138" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#gr3b)"/><path d="M317.5 190 L278.5 242" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#gr3a)"/><path d="M317.5 190 L369.5 229" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#gr3a)"/><path d="M317.5 190 L220 255" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#gr3r)"/><circle cx="317.5" cy="190" r="4" fill="#171717"/><text x="370" y="125" fill="#3b82f6">uphill: slope 5</text><text x="370" y="255" fill="#f59e0b">perpendicular: slope 0</text><text x="240" y="285" fill="#f59e0b">downhill: slope -5</text><text x="80" y="320" fill="#ef4444">red: to bottom (0,0)</text><text x="325" y="185" fill="#737373">P</text><text x="75" y="85" fill="#737373">ring: height 4.25</text><text x="595" y="260">x</text><text x="225" y="22">y</text></g></svg>
      ```

      ### The angle between our direction and the gradient

      The **steepest-descent direction** is the direction of fastest decrease per unit distance at a point. Let $\theta$ be the angle between the gradient and unit direction $\mathbf u$. The angle form of the dot product multiplies their lengths and the cosine of that angle. Because $\mathbf u$ has length one, the slope is:

      $$\begin{aligned}D_{\mathbf u}f(P)&=\|\nabla f(P)\|\|\mathbf u\|\cos\theta &&\text{use the angle form}\\&=\|\nabla f(P)\|\cos\theta &&\text{the direction has length one}\end{aligned}$$

      Here $\|\nabla f(P)\|$ means the gradient's length. The cosine cannot exceed $1$, so no slope can exceed that length. The largest slope occurs along the gradient, where the cosine is $1$. At our point:

      | Direction | Angle | Slope |
      | --- | --- | --- |
      | Along the gradient | $0^\circ$ | $5$ |
      | Perpendicular | $90^\circ$ | $0$ |
      | Opposite the gradient | $180^\circ$ | $-5$ |

      So the gradient points steepest uphill, and the negative gradient points steepest downhill, where the cosine reaches its smallest value, $-1$. For a nonzero gradient, divide the negative gradient by its length to get a downhill unit direction.

      ### Downhill is not always toward the bottom

      Compare the downhill unit vector with the vector to the bottom:
      $$\begin{aligned}-\nabla f(P)&=(-3,-4) &&\text{reverse the gradient}\\-\nabla f(P)/5&=(-0.6,-0.8) &&\text{divide by its length}\\(0,0)-P&=(-1.5,-1) &&\text{subtract to find the red direction}\end{aligned}$$
      Those directions differ.

      The steepest direction describes the slopes at our starting point. After a small downhill step, we can calculate the slopes again and choose a new direction.
    worked: |-
      Let's find the steepest downhill unit direction at $P$, where the gradient is $(3,4)$, and compare the three directions in the picture.

      1. **Find the gradient's length.** The cosine cannot exceed one, so the angle formula makes this length the largest possible uphill slope.
         $$\|\nabla f(P)\|=\sqrt{3^2+4^2}=5.$$

      2. **Make an uphill unit vector.** Dividing by length preserves direction while making the length one.
         $$\frac{\nabla f(P)}{\|\nabla f(P)\|}=(0.6,0.8).$$

      3. **Reverse it for downhill.** The opposite direction gives the smallest dot product.
         $$\mathbf u=-\frac{\nabla f(P)}{\|\nabla f(P)\|}=(-0.6,-0.8).$$

      4. **Compare the slopes.** The cosine is $1$ along the gradient, $-1$ opposite and $0$ perpendicular.
         $$\begin{aligned}5\cos0^\circ&=5 &&\text{along the gradient}\\5\cos180^\circ&=-5 &&\text{opposite the gradient}\\5\cos90^\circ&=0 &&\text{perpendicular to it}\end{aligned}$$

      These slopes describe small moves from $P$, compared per unit distance. The negative gradient gives the fastest decrease nearby; reaching the bottom can take many moves.
    problems:
      - grad-steepest-descent-basics
      - gradp-steepest-self-explain
