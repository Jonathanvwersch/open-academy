concept: gradients
version: 4
objective: |
  **Goal:** explain what the gradient tells you, find the slope in any chosen direction, and show why its negative gives the steepest local decrease.
where_this_fits: |
  A model learns by nudging its weights so that its loss gets smaller. With one weight, the derivative tells you which way to nudge. The partial-derivatives lesson gave you one slope per weight, but a real model moves all its weights at once, and the separate slopes don't directly tell you the best combined move. This lesson builds the tool that does, the **gradient**, in three steps:

  1. Collect all the slopes at a point into one vector.
  2. Use that vector to get the slope in any direction you choose.
  3. Find the direction that goes downhill fastest.

  That direction is what the next lesson, gradient descent, follows.
knowledge_points:
  - id: grad-vector-of-partials
    title: "One slope per input, in one list"
    explain: |
      **The question.** Picture the loss of a model with just two weights, $x$ and $y$, as a landscape: above each point $(x,y)$ on a map, the height of the ground is the loss. Training means walking downhill. Standing at one spot, you can measure the slope going in the $x$ direction (only $x$ changes) and in the $y$ direction (only $y$ changes): those are the two partial derivatives. How do you describe the slope at that spot as one thing?

      **Picture it.** We'll use the simplest such landscape, $f(x,y)=x^2+2y^2$: a bowl whose lowest point is $(0,0)$. The left picture shows the bowl from the side. The right one shows it from above as a **contour map**, like a hiking map: each ring joins points at the same height, and rings further out are higher. We stand at $P=(1.5,1)$, where the height is $f(P)=4.25$. There the slope in the $x$ direction is $3$ and in the $y$ direction is $4$ (worked out below). The blue arrow combines them as $(3,4)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" aria-label="An oblique 3D side view of the bowl x squared plus 2y squared with lifted level ellipses and cross-section parabolas, beside a contour map from above with the point P and slope arrows">
        <defs>
          <marker id="g1-muted-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
          <marker id="g1-blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="16" y="35">from the side</text>
          <ellipse cx="0" cy="0" rx="1" ry="1" transform="matrix(18 10 9.899495 -7.071068 145 324)" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
          <ellipse cx="0" cy="0" rx="1" ry="1" transform="matrix(27 15 14.849242 -10.606602 145 304)" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
          <ellipse cx="0" cy="0" rx="1" ry="1" transform="matrix(37.107951 20.615528 20.408332 -14.577380 145 272)" fill="#171717" fill-opacity="0" stroke="#737373" stroke-width="2.25" vector-effect="non-scaling-stroke"/>
          <ellipse cx="0" cy="0" rx="1" ry="1" transform="matrix(50.911688 28.284271 28 -20 145 212)" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
          <path d="M94.088 183.716 Q145 468 195.912 240.284 M117 232 Q145 468 173 192" fill="#171717" fill-opacity="0" stroke="#737373" stroke-width="2"/>
          <circle cx="145" cy="340" r="4" fill="#171717"/>
          <circle cx="186" cy="277" r="4.5" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="200" y="280">P, height 4.25</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="12" y="373">lowest point (0,0)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="374" y="35">from above</text>
          <ellipse cx="438" cy="315" rx="25" ry="17.677670" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <ellipse cx="438" cy="315" rx="37.5" ry="26.516504" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <ellipse cx="438" cy="315" rx="51.538820" ry="36.443449" fill="#171717" fill-opacity="0" stroke="#737373" stroke-width="2.25"/>
          <ellipse cx="438" cy="315" rx="70.710678" ry="50" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <path d="M438 315 H616 M438 315 V90" stroke="#737373" fill="#171717" fill-opacity="0"/>
          <path d="M475.5 290 H505.5" stroke="#737373" stroke-width="2.5" marker-end="url(#g1-muted-arrow)"/>
          <path d="M475.5 290 V250" stroke="#737373" stroke-width="2.5" marker-end="url(#g1-muted-arrow)"/>
          <path d="M475.5 290 L505.5 250" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#g1-blue-arrow)"/>
          <circle cx="475.5" cy="290" r="4" fill="#171717"/>
          <path d="M540 112 H551" stroke="#737373" stroke-width="2.25"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="557" y="117">f = 4.25</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="518" y="344">P</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="512" y="285">3 along x</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="381" y="244">4 along y</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="516" y="234">(3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="621" y="310">x</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="444" y="87">y</text>
        </g>
      </svg>
      ```

      **The idea.** At each point, collect one partial derivative per input into a vector: the **gradient**. Write it as $\nabla f$, read “gradient of $f$”; $\nabla$ is called nabla. For $n$ inputs $x_1,\ldots,x_n$, $\nabla f=(\partial f/\partial x_1,\ldots,\partial f/\partial x_n)$, one component per input in the same order. At $P$, $\nabla f(P)$ means the gradient evaluated there: $(3,4)$.

      **Common confusion.** “The gradient is just one number telling me how steep the hill is.” No: it is a vector, so its components record how each input contributes. Its length is one number; the third part connects it to the steepest slope.

    worked: |
      Find the gradient of $f(x,y)=x^2+2y^2$ at $P=(1.5,1)$.

      1. **Find the slope along $x$.**
         $$\frac{\partial f}{\partial x}=2x=2(1.5)=3.$$

      2. **Find the slope along $y$.**
         $$\frac{\partial f}{\partial y}=4y=4(1)=4.$$

      3. **Collect the two slopes in input order.**
         $$\nabla f(P)=(3,4).$$

      **Compare cases.**

      | Point | Gradient |
      | --- | --- |
      | $(0,0)$ | $(0,0)$ |
      | $(1.5,0)$ | $(3,0)$ |
      | $(0,1)$ | $(0,4)$ |
      | $(1.5,1)$ | $(3,4)$ |

      **Where it shows up.** The partial-derivatives lesson used a house-price model with three weights and a bias, an extra adjustable number. Its loss slopes were $(-480,-120,-800,-40)$, one for each parameter; collected together, they form that model's gradient.
