concept: gradients
version: 2
objective: |
  **Goal:** compute the gradient $\nabla f$ of a function of several inputs, use it to estimate how the output changes for a small step, and explain why the negative gradient is the direction of steepest descent.
why: |
  A robot predicts that an object is 2 metres away, but a measurement puts it at 1.8 metres. To improve the prediction, you adjust the model's weights, the numbers that control its calculation. Trying one weight at a time can help, but a coordinated change may reduce the error more for the same total amount of adjustment. A gradient collects the rate of change for every weight and uses them together to find that direction. Think of prediction error as height in a valley and the weights as your position: you want the quickest way downhill from where you stand. This idea is used in gradient descent, backpropagation, and momentum and Adam.
knowledge_points:
  - id: grad-vector-of-partials
    title: The gradient collects every partial derivative
    explain: |
      **How can we describe all the slopes of a function at one point?** One partial derivative describes only one input. A useful answer must keep every input's rate of change and preserve which rate belongs to which input. Adding the rates would lose that information.

      Take the height of a valley, in metres:

      $$h(x, y) = x^2 + 2y^2$$

      Position $(x, y)$ is measured in hundreds of metres east and north of the lowest point. At $(1.5, 1)$ the height is 4.25 m. The eastward slope is $2x = 3$ and the northward slope is $4y = 4$.

      Collect these rates in a vector, an ordered list of numbers. This is the **gradient**, written $\nabla h$ and read "grad h":

      $$\nabla h = \left(\frac{\partial h}{\partial x},\ \frac{\partial h}{\partial y}\right)$$

      Here $\nabla h = (3, 4)$. This works because each number is the slope of a slice through the surface: one slice runs east–west, the other north–south. Together they describe the hillside around this point.

      The symbol $\nabla$ is called "nabla". For $n$ inputs there are $n$ components, meaning numbers in the vector, in input order. For a model, these numbers describe how prediction error changes with each weight.
    worked: |
      This example shows the gradient computed one partial at a time, then evaluated at a point.

      **First find the slopes for our walk, using $h(x, y) = x^2 + 2y^2$ at $(1.5, 1)$.**

      1. $\frac{\partial h}{\partial x} = 2x$ (treat $y$ as a constant).
      2. $\frac{\partial h}{\partial y} = 4y$ (treat $x$ as a constant).
      3. So $\nabla h = (2x, 4y)$, and at $(1.5, 1)$ it is $(3, 4)$.

      **Another function: $f(w_1, w_2) = w_1^2 w_2 + \sin w_2$ at $(1, 0)$**, with inputs $w_1$ and $w_2$.

      1. $\frac{\partial f}{\partial w_1} = 2w_1 w_2$, which is 0 at $(1, 0)$.
      2. $\frac{\partial f}{\partial w_2} = w_1^2 + \cos w_2$, which is $1 + 1 = 2$ at $(1, 0)$.
      3. So $\nabla f(1, 0) = (0, 2)$.

      For $h$, the two numbers describe eastward and northward changes. For $f$, they describe changes in $w_1$ and $w_2$ instead.
    problems:
      - gradp-compute
      - gradp-component
      - gradp-why-vector
      - gradp-three-inputs
      - gradp-order
      - gradp-exp-component
  - id: grad-points-uphill
    title: The gradient points uphill
    explain: |
      **How do the separate slopes combine when several inputs change together?** An estimate must include each input's contribution and give the usual slope-times-distance answer when only one input changes.

      At $p = (1.5, 1)$, the valley has $\nabla h = (3, 4)$. Write a displacement as $\delta = (\delta_x, \delta_y)$, read "delta", recording the eastward and northward changes. For $\delta = (0.06, 0.08)$, the estimated height change is $3(0.06) + 4(0.08) = 0.5$ m. This sum is a dot product:

      $$h(p + \delta) \approx h(p) + \nabla h \cdot \delta$$

      This is a **first-order approximation**: an estimate using the slopes at the starting point $p$.

      This works because a smooth surface is nearly flat close to one point. That flat approximation is its **tangent plane**. On this plane, the eastward and northward height changes add exactly; on the curved hillside, small displacements give close estimates.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="Contour lines of the valley h equals x squared plus 2 y squared, drawn as ellipses of equal height. At the point (1.5, 1) a blue gradient arrow points straight across the contours, away from the valley floor. A green arrow points the opposite way, downhill. A dashed grey line runs along the contour, where the height doesn't change.">
        <ellipse cx="220" cy="150" rx="60" ry="42" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="2"/>
        <ellipse cx="220" cy="150" rx="124" ry="87.5" fill="#171717" fill-opacity="0" stroke="#737373" stroke-width="2"/>
        <ellipse cx="220" cy="150" rx="180" ry="127" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="2"/>
        <circle cx="220" cy="150" r="4" fill="#737373"/>
        <text x="220" y="172" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">floor</text>
        <line x1="270" y1="60" x2="350" y2="120" stroke="#737373" stroke-width="2" stroke-dasharray="6 5"/>
        <line x1="310" y1="90" x2="346" y2="42" stroke="#3b82f6" stroke-width="3"/>
        <polygon points="352,34 338,40 349,48" fill="#3b82f6"/>
        <line x1="310" y1="90" x2="274" y2="138" stroke="#10b981" stroke-width="3"/>
        <polygon points="268,146 271,131 282,139" fill="#10b981"/>
        <circle cx="310" cy="90" r="5" fill="#171717"/>
        <text x="430" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#3b82f6">∇h = (3, 4): uphill</text>
        <text x="430" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#10b981">−∇h: downhill</text>
        <text x="430" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#737373">along the contour:</text>
        <text x="430" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#737373">no change in height</text>
        <text x="430" y="180" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">Each ellipse joins points</text>
        <text x="430" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">of equal height h.</text>
      </svg>
      ```

      In the picture, each **contour line** joins points of equal height. The gradient crosses these lines uphill. A displacement at right angles to it gives zero dot product and no predicted height change. In ML, the same estimate predicts how a small change in several weights affects error.
    worked: |
      This example shows the approximation predicting the height change for three small steps from $(1.5, 1)$, where $h = 4.25$ and $\nabla h = (3, 4)$.

      | step $\delta$ | $\nabla h \cdot \delta$ | predicted height |
      |---|---|---|
      | $(0.1, 0)$, east | $3 \times 0.1 + 4 \times 0 = 0.3$ | $4.55$ m |
      | $(0.06, 0.08)$, along $\nabla h$ | $0.18 + 0.32 = 0.5$ | $4.75$ m |
      | $(0.08, -0.06)$, along the contour | $0.24 - 0.24 = 0$ | $4.25$ m |

      Check the first one exactly: $h(1.6, 1) = 2.56 + 2 = 4.56$ m, very close to the predicted $4.55$ m.

      All three displacements have length 0.1. The one along the gradient gives the largest predicted climb, while the one at right angles has no predicted climb. The actual ground curves, so the estimate is not exact.

      The dot product of the gradient with a small step predicts the change in output.
    problems:
      - gradp-uphill
