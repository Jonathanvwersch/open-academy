final: grad-explain
summary: |
  - The gradient collects one partial derivative per input, in input order.
  - The slope in any unit direction is the dot product of the gradient and that direction.
  - The gradient gives the steepest uphill direction; its negative gives the steepest local downhill direction.
  **Next:** The next lesson uses this direction in gradient descent.
