final: lsv-explain
summary: |
  - Decode steps read all the weights whatever the batch size, so batching sequences raises throughput almost for free. Continuous batching refills a slot as soon as its sequence finishes, so no slot sits idle waiting for the longest reply.
  - The KV cache limits how many sequences fit. PagedAttention stores it in blocks of $S$ tokens, so a sequence of $T$ tokens needs $\lceil T/S\rceil$ blocks. Only the last block is partly empty, so many more requests fit than with fixed reservations.
  - Replicas raise throughput, tensor parallelism splits each weight matrix so each decode step reads about $1/N$ of the weights, and expert parallelism puts the experts of a mixture-of-experts model on different GPUs.
  - A long prompt's prefill can stall every decoding user. Chunked prefill spreads it over several steps, and disaggregated serving moves prefill to separate GPUs and copies the KV cache across.

  **Next:** ML compilers looks at how the model's own operations are turned into fast GPU code.
