  - id: lsv-paging
    title: "Store the KV cache in small blocks"
    explain: |
      ### Memory limits the batch

      **Continuous batching** replaces finished requests after each decode step. Big batches help, but each **sequence**, a prompt plus its reply so far, needs KV-cache memory. The KV cache stores earlier tokens' keys and values for reuse. For Llama 3 8B at 16-bit precision, that's 131,072 bytes per token:

      $$2\times L\times n_{kv}\times d_h\times b=2\times32\times8\times128\times2.$$

      Here $L=32$ layers, $n_{kv}=8$ key-value heads (each shared by 4 of the 32 query heads), $d_h=128$ numbers per head and $b=2$ bytes per number, and the first 2 counts keys and values. The H100 has 80 GB of memory and the weights take 16 GB, which leaves about 64 GB for KV caches, ignoring some smaller working memory.

      A server can't know reply lengths in advance. Reserving one unbroken memory stretch per request for its longest allowed sequence leaves much of it empty.

      ### Blocks and a block table

      The picture shows a toy memory split into 8 equal pieces, called blocks, each holding 4 tokens. Request A has 10 tokens so far and request B has 5. In the top row, each request reserves 4 blocks, room for a 16-token sequence. In the bottom row, A's blocks sit at places 0, 3 and 5, because in a real server blocks free up all over memory as other requests finish.

