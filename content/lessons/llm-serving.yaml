      - lsv-parallel-basics
      - lsv-parallel-self-explain
      - lsv-parallel-row-split
      - lsv-parallel-step-time-template
      - lsv-parallel-replicas
      - lsv-parallel-expert-gpus
      - lsv-parallel-big-model
  - id: lsv-prefill
    title: "Stop long prompts from stalling replies"
    explain: |
      ### A long prompt joins the batch

      Prefill handles the whole prompt at once and is limited by maths speed, while decode is limited by reading memory. A step takes as long as the slower of these. **Continuous batching** replaces finished requests after each decode step. A new request's prefill can join everyone else's decoding. What happens to those users?

      Leaving out the attention scores, prefill costs about 2 FLOPs per parameter per prompt token, because each parameter is used in one multiply and one add. A 2,000-token prompt to Llama 3 8B costs about $2\times8\times10^9\times2{,}000=3.2\times10^{13}$ FLOPs. The H100 does about 990 TFLOP/s, which we round to 1,000 TFLOP/s, so that takes about 32 ms. This is far longer than the 5 ms weight read, so the step that carries this prompt takes about 32 ms, and every user mid-reply waits 32 ms for their next token instead of 5 ms.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 216" aria-label="Two rows of decode steps drawn to scale, one box per step. Top row, whole prompt: steps of 5, 5, 32, 5 and 5 ms, where the orange 32 ms step carries a whole 2,000-token prompt. Bottom row, 500-token chunks: steps of 5 and 5 ms, then four orange steps of 8 ms each carrying one chunk, then 5 ms. Blue boxes are decode-only steps">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="10" y="24" text-anchor="start" fill="#171717">Gaps between tokens for users who are mid-reply</text>
      <text x="140" y="68" text-anchor="end" fill="#171717">whole prompt</text>
      <rect x="150" y="44" width="40" height="36" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="170.0" y="67" text-anchor="middle" fill="#171717">5 ms</text>
      <rect x="190" y="44" width="40" height="36" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="210.0" y="67" text-anchor="middle" fill="#171717">5 ms</text>
      <rect x="230" y="44" width="256" height="36" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="358.0" y="67" text-anchor="middle" fill="#171717">32 ms: whole prompt</text>
      <rect x="486" y="44" width="40" height="36" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="506.0" y="67" text-anchor="middle" fill="#171717">5 ms</text>
      <rect x="526" y="44" width="40" height="36" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="546.0" y="67" text-anchor="middle" fill="#171717">5 ms</text>
      <text x="140" y="148" text-anchor="end" fill="#171717">500-token chunks</text>
      <rect x="150" y="124" width="40" height="36" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="170.0" y="147" text-anchor="middle" fill="#171717">5 ms</text>
      <rect x="190" y="124" width="40" height="36" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="210.0" y="147" text-anchor="middle" fill="#171717">5 ms</text>
      <rect x="230" y="124" width="64" height="36" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="262.0" y="147" text-anchor="middle" fill="#171717">8 ms</text>
      <rect x="294" y="124" width="64" height="36" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="326.0" y="147" text-anchor="middle" fill="#171717">8 ms</text>
      <rect x="358" y="124" width="64" height="36" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="390.0" y="147" text-anchor="middle" fill="#171717">8 ms</text>
      <rect x="422" y="124" width="64" height="36" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="454.0" y="147" text-anchor="middle" fill="#171717">8 ms</text>
      <rect x="486" y="124" width="40" height="36" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="506.0" y="147" text-anchor="middle" fill="#171717">5 ms</text>
      <rect x="150" y="190" width="16" height="14" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6"/>
      <text x="174" y="202" text-anchor="start" fill="#171717">decode only</text>
      <rect x="290" y="190" width="16" height="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b"/>
      <text x="314" y="202" text-anchor="start" fill="#171717">step also carries prompt work</text>
      </g>
      </svg>
      ```

      ### Two ways to stop the stall

      **Chunked prefill** splits a long prompt into pieces and processes one piece per step alongside decoding. A 500-token piece takes about 8 ms of maths, so the picture spreads the prompt over 4 steps with no gap longer than about 8 ms. The new user's first token arrives at about the same time: the total maths is unchanged.

      **Disaggregated serving** runs prefill on one set of GPUs and decoding on another. When a prompt's prefill finishes, its KV cache is copied to a decode GPU. Decode GPUs never stall for prompts. The cost is copying the cache, about 0.26 GB for a 2,000-token prompt to Llama 3 8B ($2{,}000\times131{,}072$ bytes). Decoding can't start until the copy arrives.

      ### Choosing a setup for the whole server

      Try these setups:

      - **Throughput too low, ITL and TTFT fine:** bigger batches with continuous batching and paging, which stores KV caches in fixed-size memory blocks, or more replicas, full model copies serving separate requests.
      - **ITL too long at every step:** tensor parallelism, splitting each weight matrix across GPUs.
      - **ITL jumps when long prompts arrive:** chunked prefill, or separate prefill GPUs.
      - **Model too big for one GPU:** tensor parallelism, or expert parallelism, placing different experts on different GPUs, for a mixture of experts.
    worked: |
      Suppose the chat assistant promises every user an ITL of at most 10 ms, and prompts of 2,000 tokens arrive often while 32 users are decoding. Let's find a chunk size for chunked prefill that keeps that promise on one H100.

      1. **Time the whole prompt in one step.** At 2 FLOPs per parameter per token and about 1,000 TFLOP/s, the prompt alone takes
         $$\frac{2\times(8\times10^{9})\times2{,}000}{10^{15}\text{ FLOP/s}}=0.032\text{ s}=32\text{ ms},$$
         which breaks the 10 ms promise.

      2. **Find the largest chunk whose maths fits in 10 ms.** Each prompt token costs $1.6\times10^{10}$ FLOPs, so in 10 ms the GPU can process
         $$\frac{10^{15}\times0.010}{1.6\times10^{10}}=625\text{ tokens}.$$

      3. **Leave room for the decoding users.** Each decoding token also costs about $1.6\times10^{10}$ FLOPs, so the 32 decoding tokens add $32\times1.6\times10^{10}$ FLOPs, about 0.5 ms of maths, so a 625-token chunk would go over 10 ms. Chunks of 500 tokens take about 8 ms each, and the prompt needs
         $$\frac{2{,}000}{500}=4\text{ chunks}.$$

      Each of these steps takes about 8.5 ms, which keeps the 10 ms promise. If long prompts arrived so often that most steps carried a chunk, separate prefill GPUs would be the next thing to try.
