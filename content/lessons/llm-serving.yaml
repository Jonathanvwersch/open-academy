concept: llm-serving
version: 1
objective: |
  **Goal:** explain how continuous batching and a paged KV cache let one GPU serve many chat users at once, and choose a batching and parallelism setup (replicas, tensor or expert parallelism, chunked or separate prefill) that meets a given latency target.
recap:
  - concept: mixture-of-experts
    text: "A mixture-of-experts layer holds several expert MLPs and a router that sends each token to only its top-k experts. Every expert must be stored, but each token runs through only the few it was sent to."
  - concept: kv-cache
    text: "A KV cache keeps earlier tokens' attention keys and values so each decode step does not recompute the growing prompt."
  - concept: inference-metrics
    text: "Throughput is total generated tokens per second across users; inter-token latency is the gap between successive tokens for one user."
where_this_fits: |
  ### What is LLM serving?

  Serving an LLM means running it for many users at the same time. The server takes in their requests, decides which ones the GPU works on at each moment, and streams each reply back token by token. The program that does this is called an inference engine.

  A GPU that answers one user at a time leaves most of its power unused, because making one token for one user takes about as long as making one token each for dozens of users. Our example is a chat assistant serving Llama 3 8B on one NVIDIA H100 SXM GPU. We'll see how engines keep that GPU busy, how to spread the work over several GPUs, and how to stop long prompts slowing replies.
knowledge_points:
  - id: lsv-batching
    title: "Make many replies at once"
    explain: |
      ### One decode step serves the whole batch

      Inter-token latency (ITL), from the measuring inference lesson, is the gap between successive reply tokens. We also met **throughput**, the server's total tokens per second across all users.

      As the prefill and decode lesson showed, after processing the prompt, each decode step makes one reply token and reads all the model's weights from GPU memory. For Llama 3 8B the weights take about 16 GB. The H100 reads its memory at about 3.35 TB/s, its memory bandwidth, so one step takes about 4.8 ms, which we'll round to 5 ms. The maths for one token takes far less time than that.

      Each request's prompt plus its reply so far is called a **sequence**. If we put several sequences into a **batch** and decode them together, the weights are read once for all of them. Ignoring KV-cache reads, the step still takes about 5 ms, so each user's ITL stays about 5 ms. A batch of 32 sequences makes 32 tokens per step.

      ### Two ways to fill the batch

      But replies have different lengths. Let's take a toy server with 2 slots, which means room for 2 sequences at a time, and 4 requests that arrive together, needing replies of 6, 2, 2 and 2 tokens. To keep things simple we skip their prompts here and come back to prompts in the last step.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" aria-label="Two timelines for a server with 2 slots and 4 requests needing 6, 2, 2 and 2 tokens, at 5 ms per decode step. With static batching, slot 1 runs request 1 for 6 steps then request 3 for 2 steps, while slot 2 runs request 2 for 2 steps, sits idle for 4 steps, then runs request 4 for 2 steps: 8 steps, 40 ms. With continuous batching, slot 1 runs request 1 for 6 steps while slot 2 runs requests 2, 3 and 4 back to back, 2 steps each: 6 steps, 30 ms">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="10" y="24" text-anchor="start" fill="#171717">Static batching: 8 steps</text>
