      <text x="370.0" y="262" text-anchor="middle" fill="#171717">request 4</text>
      <path d="M120 290 v6" stroke="#737373"/>
      <text x="120" y="308" text-anchor="middle" fill="#737373">0</text>
      <path d="M170 290 v6" stroke="#737373"/>
      <text x="170" y="308" text-anchor="middle" fill="#737373">5</text>
      <path d="M220 290 v6" stroke="#737373"/>
      <text x="220" y="308" text-anchor="middle" fill="#737373">10</text>
      <path d="M270 290 v6" stroke="#737373"/>
      <text x="270" y="308" text-anchor="middle" fill="#737373">15</text>
      <path d="M320 290 v6" stroke="#737373"/>
      <text x="320" y="308" text-anchor="middle" fill="#737373">20</text>
      <path d="M370 290 v6" stroke="#737373"/>
      <text x="370" y="308" text-anchor="middle" fill="#737373">25</text>
      <path d="M420 290 v6" stroke="#737373"/>
      <text x="420" y="308" text-anchor="middle" fill="#737373">30</text>
      <text x="434" y="308" text-anchor="start" fill="#737373">ms</text>
      </g>
      </svg>
      ```

      **Static batching** fills the batch, runs it until every sequence has finished, and only then starts the next batch. In the top chart, request 2 finishes after 2 steps, but its slot sits idle for 4 steps while request 1 carries on.

      **Continuous batching** checks after every decode step which sequences have finished, takes them out and puts waiting requests in their place. The idea comes from a research system called Orca (Yu et al., 2022). In the bottom chart, requests 3 and 4 use slot 2 as soon as it frees up.

      ### Measuring the gain

      Throughput is the number of tokens made divided by the time taken:

      $$\text{throughput}=\frac{\text{tokens made}}{\text{steps}\times\text{time per step}}.$$

      Both schedules make 12 tokens, so fewer steps means higher throughput.

      Be careful not to expect continuous batching to make each step faster. Each step still takes about 5 ms. The gain comes from filling idle slots.
    worked: |
      Let's work out the throughput of both schedules for the toy server, with 2 slots, replies of 6, 2, 2 and 2 tokens, and 5 ms per decode step.

      1. **Count the steps for static batching.** The first batch, requests 1 and 2, runs until request 1's 6th token. The second batch, requests 3 and 4, then needs 2 more steps.
         $$6+2=8\text{ steps}=40\text{ ms}.$$

      2. **Find its throughput.** The four replies add up to 12 tokens, made in 40 ms.
         $$\frac{12\text{ tokens}}{0.040\text{ s}}=300\text{ tokens/s}.$$

      3. **Count the steps for continuous batching.** Slot 1 runs request 1 for 6 steps. In the same 6 steps, slot 2 runs requests 2, 3 and 4 one after another, 2 steps each. The slot that takes longer sets the total.
         $$\max(6,\ 2+2+2)=6\text{ steps}=30\text{ ms}.$$

      4. **Find its throughput.** The same 12 tokens now take 30 ms.
         $$\frac{12\text{ tokens}}{0.030\text{ s}}=400\text{ tokens/s}.$$

      Continuous batching raised throughput by a third, and users notice it too. Request 3 now finishes after 20 ms instead of 40 ms, and request 4 after 30 ms instead of 40 ms, because neither waits for request 1.
