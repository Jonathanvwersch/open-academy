  - id: lsv-parallel
    title: "Spread the work over several GPUs"
    explain: |
      ### When one GPU isn't enough

      So far one H100 has run the whole model. Three things push us onto more GPUs. Users may exceed one GPU's capacity, the model may exceed its memory, or users may need a shorter ITL, since each decode step reads all the weights.

      The simplest answer to more users is a **replica**, a full copy of the model on each GPU, with incoming requests shared between them. Two replicas give twice the throughput, but each user's ITL stays the same, because each GPU still reads all 16 GB of weights per step.

      ### Splitting each matrix

      **Tensor parallelism** splits each weight matrix across the GPUs, so each GPU stores and reads only its share of the weights. Let's split a tiny multiply $y=Wx$ by rows across 2 GPUs.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" aria-label="Tensor parallelism on the multiply y = W x with W = [[1, 2], [3, 4]] and x = (1, 1). The vector x is sent to both GPUs. GPU 1 holds row 1 of W, (1, 2), and computes the first entry of y, 1 times 1 plus 2 times 1 equals 3. GPU 2 holds row 2, (3, 4), and computes the second entry, 3 plus 4 equals 7. Orange arrows show the GPUs swapping results so both have y = (3, 7)">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <defs><marker id="lsv-t-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="lsv-t-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <text x="320" y="24" text-anchor="middle" fill="#171717">W = [[1, 2], [3, 4]] and x = (1, 1); x is sent to both GPUs</text>
      <path d="M280 34 L172 62" stroke="#737373" stroke-width="1.5" marker-end="url(#lsv-t-grey)"/>
      <path d="M360 34 L468 62" stroke="#737373" stroke-width="1.5" marker-end="url(#lsv-t-grey)"/>
      <rect x="40" y="64" width="260" height="76" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="170" y="86" text-anchor="middle" fill="#171717">GPU 1 holds row 1 of W: (1, 2)</text>
      <text x="170" y="110" text-anchor="middle" fill="#737373">first entry of y:</text>
      <text x="170" y="130" text-anchor="middle" fill="#171717">1×1 + 2×1 = 3</text>
      <rect x="340" y="64" width="260" height="76" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="470" y="86" text-anchor="middle" fill="#171717">GPU 2 holds row 2 of W: (3, 4)</text>
      <text x="470" y="110" text-anchor="middle" fill="#737373">second entry of y:</text>
      <text x="470" y="130" text-anchor="middle" fill="#171717">3×1 + 4×1 = 7</text>
      <path d="M170 140 L262 176" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#lsv-t-amber)"/>
      <path d="M470 140 L378 176" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#lsv-t-amber)"/>
      <rect x="150" y="178" width="340" height="40" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="320" y="203" text-anchor="middle" fill="#171717">swap results: both GPUs now have y = (3, 7)</text>
      </g>
      </svg>
      ```

      GPU 1 holds the first row of $W$, so it works out the first entry of $y$. GPU 2 holds the second row and works out the second entry. Then they swap results so both have all of $y$ for the next layer.

      With $N$ GPUs, each reads about $1/N$ of the weights per step, so a decode step takes about

      $$\frac{\text{weight bytes}}{N\times\text{memory bandwidth}}.$$

      The price is the swap. The GPUs exchange results in every layer over the links between them, and that time is added to every step.

      ### Splitting the experts

      In the mixture-of-experts lesson, we saw that every expert must be stored but each token uses only its top-k. **Expert parallelism** puts different experts on different GPUs. It helps when a mixture-of-experts model is too big for one GPU. Llama 3 8B has no experts, so picture a made-up mixture-of-experts model.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" aria-label="Expert parallelism: 8 experts spread over 4 GPUs, two on each. GPU 1 has experts 1 and 2, GPU 2 has experts 3 and 4, GPU 3 has experts 5 and 6, GPU 4 has experts 7 and 8. A token whose router picks experts 3 and 6 is sent along orange arrows to GPU 2 and GPU 3, and their outputs come back to be combined">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <defs><marker id="lsv-e-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <text x="320" y="24" text-anchor="middle" fill="#171717">one token: the router picks experts 3 and 6</text>
      <rect x="10" y="90" width="140" height="60" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="1.5"/>
      <text x="80" y="114" text-anchor="middle" fill="#171717">GPU 1</text>
      <text x="80" y="138" text-anchor="middle" fill="#737373">experts 1 and 2</text>
      <rect x="162" y="90" width="140" height="60" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="232" y="114" text-anchor="middle" fill="#171717">GPU 2</text>
      <text x="232" y="138" text-anchor="middle" fill="#171717">experts 3 and 4</text>
      <rect x="314" y="90" width="140" height="60" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="384" y="114" text-anchor="middle" fill="#171717">GPU 3</text>
      <text x="384" y="138" text-anchor="middle" fill="#171717">experts 5 and 6</text>
      <rect x="466" y="90" width="140" height="60" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="1.5"/>
      <text x="536" y="114" text-anchor="middle" fill="#171717">GPU 4</text>
      <text x="536" y="138" text-anchor="middle" fill="#737373">experts 7 and 8</text>
      <path d="M300 34 L240 86" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#lsv-e-amber)"/>
      <path d="M340 34 L376 86" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#lsv-e-amber)"/>
      <text x="320" y="180" text-anchor="middle" fill="#737373">experts 3 and 6 run on GPUs 2 and 3; their outputs return and are combined</text>
      </g>
      </svg>
      ```

      Here a layer has 8 experts spread over 4 GPUs, two on each. A token whose router picks experts 3 and 6 is sent to GPU 2 and GPU 3. Those two experts run there, and their outputs are sent back and combined before the next layer. Each GPU stores only a quarter of the expert weights. The cost is moving tokens between GPUs in every expert layer. Also, a GPU whose experts are picked more often gets more work than the others and slows the step for everyone, because the next layer waits until all the chosen experts have finished.
    worked: |
      Let's compare one GPU, two replicas and tensor parallelism over two GPUs for Llama 3 8B, whose weights take 16 GB, on H100s that read memory at about 3.35 TB/s.

      1. **Time one decode step on one GPU.** The step has to read all the weights.
         $$\frac{16\text{ GB}}{3.35\text{ TB/s}}\approx4.8\text{ ms}.$$

      2. **Compare two replicas.** Each GPU still reads 16 GB per step, so each step still takes about 4.8 ms. But there are two batches running side by side, so throughput doubles.
         $$2\times\text{(one GPU's throughput)}.$$

      3. **Time tensor parallelism over two GPUs.** Each GPU now reads half the weights, 8 GB, every step, plus the time for the swaps.
         $$\frac{8\text{ GB}}{3.35\text{ TB/s}}\approx2.4\text{ ms}.$$

      So replicas are the way to serve more users, and tensor parallelism is the way to give each user a shorter ITL, about 2.4 ms plus the swap time. Tensor parallelism also leaves each GPU 72 GB for KV caches instead of 64 GB, because each one holds only 8 GB of weights. In attention, each GPU works on its own share of the heads, so it keeps only those heads' keys and values. Each request's cache is split between the two GPUs, and together they have 144 GB for KV caches, against 128 GB for two replicas.
