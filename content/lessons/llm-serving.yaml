      **PagedAttention** (Kwon et al., 2023) stores each sequence's KV cache in fixed-size **blocks** of a few tokens each. Each sequence has a **block table**, a list of which blocks hold its tokens, in order. A sequence gets a new block only when its last one is full, and its blocks can sit anywhere. The attention step reads the block table to find each block. vLLM, an open-source inference engine from the same paper, is built around PagedAttention and uses continuous batching.

      If each block holds $S$ tokens, a sequence of $T$ tokens needs

      $$\text{blocks}=\left\lceil \frac{T}{S}\right\rceil,$$

      where $\lceil\ \rceil$ means round up to a whole number. Only the last block can be partly empty, so each sequence wastes less than one block.

      Storing the cache in blocks like this is called paging. Be careful not to think paging makes each token's cache smaller. Every token still takes 131,072 bytes. Paging only stops memory being held for tokens that don't exist yet.
    worked: |
      Let's count how many requests fit in the H100's 64 GB of spare memory, first with fixed reservations and then with paging. Suppose the server allows sequences of up to 2,048 tokens, and each request actually holds 500 tokens. Here GB means $10^9$ bytes.

      1. **Count the tokens that fit.** Each token's KV cache takes 131,072 bytes, so we divide the spare memory by that and round down.
         $$\frac{64\times10^9}{131{,}072}\approx488{,}281\text{ tokens}.$$

      2. **Reserve 2,048 tokens for every request.** If the server keeps room for sequences up to 2,048 tokens long, each request takes 2,048 token slots whatever its real length. The brackets $\lfloor\ \rfloor$ mean round down.
         $$\left\lfloor\frac{488{,}281}{2{,}048}\right\rfloor=238\text{ requests}.$$

      3. **Use 16-token blocks instead.** With blocks of 16 tokens, each 500-token request needs 32 blocks, which is 512 token slots.
         $$\left\lceil\frac{500}{16}\right\rceil=32\text{ blocks}=512\text{ slots}.$$

      4. **Count the requests that fit with paging.** Now each request takes only 512 slots.
         $$\left\lfloor\frac{488{,}281}{512}\right\rfloor=953\text{ requests}.$$

      Paging lets about four times as many requests share the GPU, so continuous batching has a much bigger batch to work with. As sequences grow they need more blocks. If blocks run out, vLLM pauses some requests and frees their blocks. When there is room again, it rebuilds or reloads their cache and carries on.
