concept: dot-product
version: 2
objective: |
  **Goal:** compute dot products and cosine similarity, explain when they measure similarity, and recognise weighted scores in linear models and attention.
why: |
  A house-price model must turn area and bedroom count into one score, while letting each feature matter differently. Simply adding the features treats an extra area unit like an extra bedroom; keeping separate weighted contributions still leaves no single score to compare. A dot product multiplies each feature by its weight and totals the contributions. The same operation measures how floor arrows align, giving a picture of how a buyer's preferences align with a house's features. When only direction matters, cosine similarity removes the reward for longer vectors. These ideas underpin matrices, linear-regression, perceptron, and attention.
knowledge_points:
  - id: dot-weighted-total
    title: Turning matching entries into one score
    explain: |
      You have recorded a house's area and bedroom count. **How can you turn them into one score with different importance for each feature?** Simply adding them treats one extra area unit like one extra bedroom. Instead, multiply each feature by its chosen weight, then add the contributions.

      This **weighted sum** is the **dot product** of the feature and weight vectors. This works because each weight controls its feature's contribution before the contributions accumulate. Why this way? Multiplying matching entries without adding leaves a list, not one score.

      For vectors $a$ and $b$ with $n$ entries each:

      $$a\cdot b=\sum_{i=1}^{n}a_i b_i.$$

      The dot between vectors names the operation; between numbers it means multiplication. Here $i$ selects an entry and $\sum$ adds products from entry one to $n$. Keep feature and weight orders matched.

      A **linear model** uses $w\cdot x$ as a score, where $w$ lists weights and $x$ lists features. With other features fixed, raising $x_i$ by one changes the score by $w_i$. Negative weights lower the score as their features increase; zero weights ignore them.
    worked: |
      This example shows how a house-price score adds feature contributions.

      Use features $x=(4,1)$: floor area in units of 25 square metres, then bedrooms. Choose weights $w=(0.5,2)$; this is a toy score, not a price in pounds.

      1. Area contributes $0.5\cdot4=2$.
      2. Bedrooms contribute $2\cdot1=2$.
      3. Add the contributions: $w\cdot x=2+2=4$.
      4. One extra bedroom gives $x=(4,2)$ and score $0.5\cdot4+2\cdot2=2+4=6$, a rise of $6-4=2$.
      5. One extra area unit instead gives $x=(5,1)$ and score $0.5\cdot5+2\cdot1=2.5+2=4.5$, a rise of $4.5-4=0.5$.

      Each weight tells you how much one extra unit of its feature changes the score.
    problems:
      [
        dotp-total,
        dotp-total-template,
        dotp-model,
        dotp-order,
        dotp-negative-weight,
        dotp-why-total,
      ]
  - id: dot-arrow-alignment
    title: Reading the score as arrow alignment
    explain: |
      You have two floor moves. **Do they head in similar directions?** Comparing lengths cannot tell: equal-length arrows can point opposite ways. The dot product combines matching entries, and its sign tells you whether the arrows broadly agree.

      Place both tails at the origin. The **angle** measures the turn between them, from zero to 180 degrees. **Cosine**, written $\cos$, gives one at zero degrees, zero at 90 degrees and minus one at 180 degrees.

      For non-zero vectors $a$ and $b$:

      $$a\cdot b=\|a\|_2\|b\|_2\cos\theta.$$

      Here $\theta$ (“theta”) is their angle, and the norms are their lengths. Angles below 90 degrees give positive scores; right angles give zero; angles above 90 degrees give negative scores. Right-angle vectors are **perpendicular**, also called **orthogonal**.

      This works because the dot product multiplies one arrow's signed shadow on the other's line by the other's length. That shadow is its **projection**: forward is positive and backward negative.

      Why this way? Unlike comparing lengths alone, the signed projection distinguishes agreement from opposition. Longer arrows can still make the score's magnitude larger.
    worked: |
      This example shows how a projection explains a dot product.

      Use floor moves $a=(3,4)$ and $b=(2,0)$, both in metres.

      1. Multiply and add: $a\cdot b=3\cdot2+4\cdot0=6+0=6$.
      2. Find the lengths: $\|a\|_2=\sqrt{9+16}=5$ and $\|b\|_2=\sqrt{4+0}=2$.
      3. The projection of $a$ onto the horizontal direction of $b$ is three metres.
      4. Multiply that signed projection by $b$'s length: $3\cdot2=6$, the same score.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" aria-label="Arrow a at an angle theta to horizontal arrow b, with a three-metre horizontal projection">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M60 205 H420 M180 45 V205" stroke="#d4d4d4" stroke-width="2" fill="#d4d4d4" fill-opacity="0" stroke-dasharray="5 5"/>
          <path d="M60 205 L180 45" stroke="#10b981" stroke-width="3"/>
          <path d="M180 45 L167 52 L178 60 Z" fill="#10b981"/>
          <path d="M60 205 H140" stroke="#3b82f6" stroke-width="4"/>
          <path d="M140 205 L126 198 V212 Z" fill="#3b82f6"/>
          <path d="M60 225 H180" stroke="#f59e0b" stroke-width="3"/>
          <path d="M100 205 A40 40 0 0 0 84 173" stroke="#737373" fill="#737373" fill-opacity="0"/>
          <path d="M165 205 V190 H180" stroke="#737373" fill="#737373" fill-opacity="0"/>
          <text x="185" y="40">a = (3,4)</text><text x="85" y="164">b = (2,0)</text>
          <text x="105" y="187">θ</text><text x="65" y="248">projection = 3 m</text>
          <text x="220" y="140">shadow falls</text><text x="220" y="159">on the horizontal line</text>
        </g>
      </svg>
      ```

      Reversing $b$ gives $(-2,0)$ and score $3\cdot(-2)+4\cdot0=-6$.

      The sign records agreement or opposition, while the size also depends on arrow length.
    problems:
      [
        dotp-sign,
        dotp-alignment-template,
        dotp-right-angle,
        dotp-projection,
        dotp-reverse,
        dotp-why-not-lengths,
      ]
  - id: dot-direction-only
    title: Comparing directions without rewarding length
    explain: |
      You are comparing two floor moves. **How can you compare direction without rewarding length?** A raw dot product doubles when you double one move without turning it. Divide out both lengths to remove that effect.

      This direction-only score is **cosine similarity**:

      $$\cos\theta=\frac{a\cdot b}{\|a\|_2\|b\|_2}.$$

      The numerator is the dot product; the denominator multiplies the lengths. This works because lengthening either arrow multiplies the numerator and denominator by the same factor, which cancels. The score ranges from minus one to one: one means the same direction, zero means perpendicular, and minus one means opposite directions. A zero vector makes the denominator zero, so cosine similarity is undefined there.

      A positive scalar therefore leaves cosine similarity unchanged. A negative scalar reverses direction and flips its sign. Why this way? Choose cosine when length should not influence similarity; keep the raw dot product when the size of feature contributions matters. Matching directions do not mean matching positions.

      The floor arrows picture this choice in ML: a buyer's preference vector scores a house's features, but its dot product reflects fit and length. Cosine removes length, not the need to choose meaningful features and units; a high score cannot guarantee real-world similarity.
    worked: |
      This example shows how dividing out lengths isolates direction.

      Start with floor moves $a=(1,1)$ and $b=(1,0)$.

      1. Dot product: $a\cdot b=1\cdot1+1\cdot0=1$.
      2. Lengths: $\|a\|_2=\sqrt{1+1}=\sqrt2$ and $\|b\|_2=\sqrt{1+0}=1$.
      3. Divide: $\cos\theta=1/(\sqrt2\cdot1)\approx0.707$. This is the cosine of $45^\circ$, where the degree sign marks an angle in degrees.
      4. Double $b$ to $(2,0)$. The dot product becomes $1\cdot2+1\cdot0=2$, and its length becomes $\sqrt{4+0}=2$.
      5. Divide again: $2/(\sqrt2\cdot2)=1/\sqrt2\approx0.707$.

      For $a=(3,4)$ and $b=(4,3)$, the dot product is $3\cdot4+4\cdot3=12+12=24$. Both lengths are $\sqrt{9+16}=5$, so cosine similarity is $24/(5\cdot5)=24/25=0.96$.

      Cosine similarity stays unchanged when you lengthen an arrow without turning it.
    problems:
      [dotp-cosine, dotp-cosine-template, dotp-scaling, dotp-zero, dotp-attention, dotp-position]
final: dot-explain
summary: |
  - A dot product multiplies matching entries and adds them; a linear score weights each feature this way.
  - The dot product is positive for broadly agreeing arrows, zero for perpendicular arrows and negative for opposing arrows; its size also depends on length.
  - Cosine similarity divides by both non-zero lengths to compare direction only, avoiding the length reward in raw similarity scores.

  **Where you'll use this:** matrices combine weighted scores; linear-regression and perceptron score features; attention compares vector alignment.
