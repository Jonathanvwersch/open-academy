      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="370" y="276" fill="#737373" text-anchor="middle" font-size="18">+</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="484" y="276" fill="#737373" text-anchor="middle" font-size="18">=</text>
      <rect x="508" y="250" width="112" height="40" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="564" y="276" fill="#171717" text-anchor="middle" font-size="16" font-weight="600">score 16</text>
      </g>
      </svg>
      ```

      ### The general rule

      The **dot product** of two vectors with the same number of components multiplies each pair of matching components and adds up the products. For vectors $a$ and $b$ with $n$ components each, we write it $a\cdot b$:

      $$a\cdot b=a_1b_1+a_2b_2+\dots+a_nb_n=\sum_{i=1}^{n}a_ib_i.$$

      Here $a_1$ is $a$'s first component, $a_1b_1$ means $a_1$ times $b_1$, and the $\sum$ adds one such product for each position $i$, from 1 to $n$.

      The two vectors must list their components in the same order, or we'd multiply a count by the wrong points.

      Be careful not to add up each list first and then multiply the totals. The counts add up to 10 and the points to 2, and $10\times2=20$, not 16. That's because $(6+2+2)\times(3+0-1)$ multiplies every count by every points value, not just its own.

      ### Weights

      When one vector holds an amount per unit, like the points per answer, the dot product is called a **weighted sum**, and those amounts are the **weights**. A positive weight adds to the total, a weight of 0 ignores its component, and a negative weight takes away.

      This is how a model turns a house into a price. Say a house has an area of 120 square metres, 3 bedrooms and an age of 20 years. The model counts area in tens of square metres, so $x=(12,3,20)$. The model's weights are $w=(25,10,-1)$, in thousands of pounds, so it adds £25,000 for every ten square metres and £10,000 for every bedroom, and takes away £1,000 for every year of age. It predicts

      $$w\cdot x=25\times12+10\times3+(-1)\times20=310,$$

      which is £310,000.
    worked: |
      Let's work out the quiz score $c\cdot p$ for the counts $c=(6,2,2)$ and the points $p=(3,0,-1)$.

      1. **Multiply the correct answers by their points.** The first components belong together, because both are about correct answers.
         $$6\times3=18$$

      2. **Multiply the skips by their points.** The second components are both about skipped questions.
         $$2\times0=0$$

      3. **Multiply the wrong answers by their points.** The weight is negative, so this contribution takes points away.
         $$2\times(-1)=-2$$

      4. **Add the three contributions.** Each one is already in points, so they add up to one score.
         $$c\cdot p=18+0+(-2)=16$$

      The student scores 16, and we can trace every point of it to one kind of answer.
