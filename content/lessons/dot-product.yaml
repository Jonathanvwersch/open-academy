  - id: dot-arrow-alignment
    title: "What the dot product means for arrows"
    explain: |
      ### An arrow that points right

      The dot product multiplies matching vector components and adds the results. What does that number tell us when we draw vectors as arrows? Let's start with $b=(1,0)$, which has length 1 and points right. For any arrow $a=(a_1,a_2)$,

      $$a\cdot b=a_1\times1+a_2\times0=a_1.$$

      So with this $b$, the dot product is just how far $a$ goes to the right, and the upward part doesn't count. The picture shows three cases, which score 3, 0 and $-3$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" aria-label="Three panels, each with the blue arrow b = (1,0) pointing right. The green arrow a = (3,4) goes 3 to the right, so a·b = 3. The green arrow a = (0,4) goes straight up, so a·b = 0. The green arrow a = (−3,4) goes 3 to the left, so a·b = −3. An orange bar under each shows how far a goes along b">
      <defs><marker id="p-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker><marker id="p-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
      <path d="M10 200 L210 200" stroke="#d4d4d4" stroke-width="1.5"/>
      <path d="M200 80 L200 200" stroke="#737373" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="M110 210 L200 210" stroke="#f59e0b" stroke-width="6"/>
      <path d="M110 200 L200 80" stroke="#10b981" stroke-width="3" marker-end="url(#p-g)"/>
      <path d="M110 200 L140 200" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#p-b)"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="200" y="68" fill="#10b981" text-anchor="middle">a = (3,4)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="110" y="242" fill="#f59e0b" text-anchor="middle" font-weight="600">a·b = 3</text>
      <path d="M220 200 L420 200" stroke="#d4d4d4" stroke-width="1.5"/>
      <circle cx="320" cy="210" r="5" fill="#f59e0b"/>
      <path d="M320 200 L320 80" stroke="#10b981" stroke-width="3" marker-end="url(#p-g)"/>
      <path d="M320 200 L350 200" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#p-b)"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="68" fill="#10b981" text-anchor="middle">a = (0,4)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="242" fill="#f59e0b" text-anchor="middle" font-weight="600">a·b = 0</text>
      <path d="M430 200 L630 200" stroke="#d4d4d4" stroke-width="1.5"/>
      <path d="M440 80 L440 200" stroke="#737373" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="M530 210 L440 210" stroke="#f59e0b" stroke-width="6"/>
      <path d="M530 200 L440 80" stroke="#10b981" stroke-width="3" marker-end="url(#p-g)"/>
      <path d="M530 200 L560 200" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#p-b)"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="440" y="68" fill="#10b981" text-anchor="middle">a = (−3,4)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="530" y="242" fill="#f59e0b" text-anchor="middle" font-weight="600">a·b = −3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="144" y="272" fill="#3b82f6" text-anchor="start">b = (1,0) in every panel</text>
      </g>
      </svg>
      ```

      ### The shadow of one arrow on another

      The orange bar under each arrow is the **projection** of $a$ onto $b$. Think of it as the shadow $a$ casts on $b$'s line, the line through $b$ extended in both directions, when light falls at right angles to that line. To find it, we draw a line, called the drop, from $a$'s tip that meets $b$'s line at a right angle, and measure from the origin to where it lands. The projection is negative when the shadow points the opposite way to $b$, and for $(0,4)$ it shrinks to a dot. For any two arrows,

      $$a\cdot b=(\text{projection of }a\text{ onto }b)\times\|b\|.$$

      Why times $b$'s length? If we stretch $b$ by some number, every product $a_ib_i$ gets multiplied by that number, and so does the dot product. The shadow doesn't move, because $b$'s line is the same.

      The picture below shows a tilted pair, which the worked example checks.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" aria-label="The blue arrow b = (6,8), of length 10, and the green arrow a = (7,1), both from the origin. A dashed drop (4,−3) from the point (3,4) on b reaches the tip of a and meets b at a right angle. The orange shadow of a along b runs from the origin to (3,4), a length of 5">
      <defs><marker id="w-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="w-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
      <path d="M240 180 L360 270" stroke="#737373" stroke-width="2" stroke-dasharray="6 5"/>
      <path d="M249.6 187.2 L242.4 196.8 L232.8 189.6" stroke="#737373" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
      <path d="M150 300 L330 60" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#w-b)"/>
      <path d="M150 300 L360 270" stroke="#10b981" stroke-width="3" marker-end="url(#w-g)"/>
      <path d="M143.6 295.2 L233.6 175.2" stroke="#f59e0b" stroke-width="6"/>
      <circle cx="150" cy="300" r="4" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="140" y="304" fill="#737373" text-anchor="end">origin</text>
      <circle cx="240" cy="180" r="4" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="262" y="182" fill="#171717" text-anchor="start">(3,4)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="342" y="66" fill="#3b82f6" text-anchor="start">b = (6,8), length 10</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="372" y="276" fill="#10b981" text-anchor="start">a = (7,1)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="312" y="217" fill="#737373" text-anchor="start">drop (4,−3)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="176.6" y="235.2" fill="#f59e0b" text-anchor="end" font-weight="600">shadow 5</text>
      </g>
      </svg>
      ```

      ### What the sign tells us

      The **angle** between two arrows is how far we'd turn one to line it up with the other. It's $0^\circ$ when they point the same way and $180^\circ$ when they point opposite ways. While the angle is less than a right angle, the shadow points along $b$. At a right angle it shrinks to nothing, and beyond that it points backwards, like the shadow of $(-3,4)$ in the first picture.

      So the dot product is positive below a right angle, zero when the arrows are **perpendicular**, meaning at a right angle, and negative beyond it.

      Be careful not to read a bigger dot product as arrows that agree more. $(3,4)\cdot(1,0)=3$ is bigger than $(1,0)\cdot(1,0)=1$, even though $(3,4)$ points mostly up. That's because length counts too, which the next step deals with.
    worked: |
      Let's check the rule on the tilted arrows $a=(7,1)$ and $b=(6,8)$. Here we can't read the shadow off an axis. So we'll use the rule to predict where the shadow ends, then check that a line from there to $a$'s tip really meets $b$ at a right angle.

      1. **Multiply matching components and add.** This is the dot product from the first step.
         $$a\cdot b=7\times6+1\times8=50$$

      2. **Find $b$'s length.** We need it to turn the dot product into a projection.
         $$\|b\|=\sqrt{6^2+8^2}=\sqrt{100}=10$$

      3. **Divide to get the projection.** The dot product is the projection times $\|b\|$, so dividing by $\|b\|$ undoes that.
         $$\text{projection}=\frac{50}{10}=5$$

      4. **Find where the shadow should end.** A projection of 5 is half of $b$'s length, so the shadow should end halfway along $b$.
         $$\tfrac{1}{2}\times(6,8)=(3,4)$$

      5. **Check that the drop meets $b$ at a right angle.** The drop is the move from $(3,4)$ to $a$'s tip, $(7,1)-(3,4)=(4,-3)$. Together with $(3,4)$ and $a$ itself, it makes a triangle. Pythagoras' rule also works backwards, so if the squares of the lengths of $(3,4)$ and the drop add up to the square of $a$'s length, the corner at $(3,4)$ is a right angle.
         $$\|(3,4)\|^2+\|(4,-3)\|^2=25+25=50=\|(7,1)\|^2$$

      So the right-angle drop from $a$'s tip lands at $(3,4)$, exactly where the rule said the shadow ends.
