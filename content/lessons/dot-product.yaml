  - id: dot-direction-only
    title: "Compare directions, ignoring length"
    explain: |
      ### Dot products grow with length

      The dot product, the sum of matching vector components multiplied together, depends on both arrows' directions and lengths. How can we score direction alone?

      The picture shows the same two directions twice, with the right-hand arrows twice as long. The angle between the arrows, written $\theta$ ("theta"), is the same in both, but the dot product grows from 12 to 48. Dividing each dot product by the two lengths multiplied together gives 0.6 in both panels.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" aria-label="Two panels with the same angle θ between the arrows. Left: a = (3,4) and b = (4,0), dot product 12, lengths 5 and 4, so the score is 12 ÷ 20 = 0.6. Right: a = (6,8) and b = (8,0), twice as long, dot product 48, lengths 10 and 8, so the score is 48 ÷ 80 = 0.6">
      <defs><marker id="c-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker><marker id="c-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
      <path d="M60 250 L320 250" stroke="#d4d4d4" stroke-width="1.5"/>
      <path d="M104 250 A34 34 0 0 0 90.4 222.8" stroke="#737373" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="110" y="238" fill="#737373" text-anchor="start">θ</text>
      <path d="M70 250 L145 150" stroke="#10b981" stroke-width="3" marker-end="url(#c-g)"/>
      <path d="M70 250 L170 250" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#c-b)"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="155" y="154" fill="#10b981" text-anchor="start">a = (3,4)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="166" y="272" fill="#3b82f6" text-anchor="end">b = (4,0)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="298" fill="#171717" text-anchor="start">a·b = 12, lengths 5 and 4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="322" fill="#171717" text-anchor="start" font-weight="600">score 12 ÷ 20 = 0.6</text>
      <path d="M340 250 L600 250" stroke="#d4d4d4" stroke-width="1.5"/>
      <path d="M384 250 A34 34 0 0 0 370.4 222.8" stroke="#737373" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="390" y="238" fill="#737373" text-anchor="start">θ</text>
      <path d="M350 250 L500 50" stroke="#10b981" stroke-width="3" marker-end="url(#c-g)"/>
      <path d="M350 250 L550 250" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#c-b)"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="510" y="54" fill="#10b981" text-anchor="start">a = (6,8)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="546" y="272" fill="#3b82f6" text-anchor="end">b = (8,0)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="350" y="298" fill="#171717" text-anchor="start">a·b = 48, lengths 10 and 8</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="350" y="322" fill="#171717" text-anchor="start" font-weight="600">score 48 ÷ 80 = 0.6</text>
      </g>
      </svg>
      ```

      ### Cosine similarity

      **Cosine similarity** compares the directions of two non-zero vectors by dividing their dot product by both their lengths:

      $$\text{cosine similarity}=\frac{a\cdot b}{\|a\|\,\|b\|}.$$

      ### Shrinking arrows to length 1

      An arrow of length 1 is called a **unit vector**. We shrink a non-zero arrow to one, without turning it, by dividing each component by its length. In the left panel, $(3,4)$ becomes $(0.6,0.8)$, which divides every product $a_ib_i$ by 5, and $(4,0)$ becomes $(1,0)$, which divides every product by 4. So the dot product falls from 12 to 0.6, just as dividing by both lengths does.

      Drop a perpendicular from one unit vector's tip onto the other's line. The signed length from the origin to that landing point is its **projection**, or shadow. For unit vectors, the dot product equals this shadow. Its length depends only on the angle, so it's called the **cosine** of $\theta$, written $\cos\theta$. It's 1 when the arrows point the same way, 0 at a right angle and $-1$ when they point opposite ways. So

      $$\frac{a\cdot b}{\|a\|\,\|b\|}=\cos\theta,$$

      and multiplying both sides by $\|a\|\,\|b\|$ gives a form worth remembering:

      $$a\cdot b=\|a\|\,\|b\|\cos\theta.$$

      A robot can use this to check its heading. If the arrow of its movement and the arrow from where it is to its goal score near 1, it's heading towards the goal.

      ### Limitations

      Cosine similarity ignores length, but sometimes length matters. A robot that moves $(1,1)$ metres east and north and one that moves $(10,10)$ both score 1, even though the second goes ten times as far. So be careful not to read a score of 1 as the same move. It only means the same direction.

      It also fails for the zero vector, which has length 0 and no direction, so the fraction would divide by zero.
    worked: |
      Let's find the cosine similarity of $a=(3,4)$ and $b=(4,3)$, then double $a$ and see whether the score changes.

      1. **Multiply matching components and add.** The dot product goes on top of the fraction.
         $$a\cdot b=3\times4+4\times3=24$$

      2. **Find the length of $a$.** The bottom of the fraction needs both lengths.
         $$\|a\|=\sqrt{3^2+4^2}=5$$

      3. **Find the length of $b$.** Its components are $a$'s swapped round, so its length is also 5.
         $$\|b\|=\sqrt{4^2+3^2}=5$$

      4. **Divide by the two lengths multiplied together.** This takes length out of the score.
         $$\frac{24}{5\times5}=0.96$$

      5. **Double $a$ to $(6,8)$ and repeat.** If the score really ignores length, it shouldn't change.
         $$\frac{6\times4+8\times3}{10\times5}=\frac{48}{50}=0.96$$

      A score of 0.96 is close to 1, so the arrows point nearly the same way. Doubling $a$ doubled the dot product, but it doubled $a$'s length too, so the score stayed the same.
