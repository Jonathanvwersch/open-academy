  - id: dot-arrow-alignment
    title: For arrows, the dot product measures how far one goes along the other
    explain: |
      **The question.** A robot often needs to know whether two arrows agree, such as its heading and the way to its goal. Can their dot product tell you whether they point roughly the same way, at right angles, or in opposite directions?

      **Picture it.** Start with the easiest second arrow, $b=(1,0)$: length 1, pointing right. For any arrow $a=(a_1,a_2)$,

      $$a\cdot b=a_1\cdot1+a_2\cdot0=a_1.$$

      So here the dot product is how far $a$ goes right, in $b$'s direction; the up part never counts. Below, that gives $3$, $0$ and $-3$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" aria-label="Reference arrow b = (1,0) points right. Arrow (3,4) goes 3 right, so a·b = 3; arrow (0,4) goes straight up, so a·b = 0; arrow (−3,4) goes 3 left, so a·b = −3. The coloured bars under the axis show how far each goes along b.">
        <defs>
          <marker id="a-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
          <marker id="a-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
          <marker id="a-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker>
          <marker id="a-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M120 220 H520" stroke="#d4d4d4" stroke-width="2"/>
          <path d="M440 60 V220" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 5"/>
          <path d="M200 60 V220" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 5"/>
          <path d="M320 220 L440 60" stroke="#10b981" stroke-width="3" marker-end="url(#a-g)"/>
          <path d="M320 220 L320 60" stroke="#737373" stroke-width="3" marker-end="url(#a-k)"/>
          <path d="M320 220 L200 60" stroke="#ef4444" stroke-width="3" marker-end="url(#a-r)"/>
          <path d="M320 220 H360" stroke="#3b82f6" stroke-width="4" marker-end="url(#a-b)"/>
          <path d="M320 245 H440" stroke="#10b981" stroke-width="4"/>
          <path d="M200 245 H320" stroke="#ef4444" stroke-width="4"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="448" y="64" fill="#10b981">(3,4): a·b = 3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="46" fill="#737373" text-anchor="middle">(0,4): a·b = 0</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="192" y="64" fill="#ef4444" text-anchor="end">(−3,4): a·b = −3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="368" y="210" fill="#3b82f6">b = (1,0)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="380" y="270" fill="#10b981" text-anchor="middle">3 right</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="260" y="270" fill="#ef4444" text-anchor="middle">3 left</text>
        </g>
      </svg>
      ```

      **The idea.** The **angle** between two arrows is how far you turn one to line it up with the other: $0^\circ$ if they point the same way, up to $180^\circ$ if opposite. Drop a line from $a$'s tip to meet the line through $b$ at a right angle (the dashed lines above): the stretch from the origin to where it lands is $a$'s shadow on $b$, the **projection** of $a$ onto $b$, negative if it points backwards. For any two arrows,

      $$a\cdot b=(\text{projection of }a\text{ onto }b)\times\|b\|$$

      where $\|b\|$ is $b$'s length (the L2 norm $\|b\|_2$, written without the 2 from here on). Why the length? Stretch $b$ to $(2,0)$ and the dot products double, while the shadows stay the same. It holds for a tilted $b$ too, as the worked example checks. So the sign answers the question: positive when the angle is less than a right angle, zero when the arrows are **perpendicular** (at a right angle), negative when it is more.

      **Common confusion.** "A bigger dot product means the arrows point more nearly the same way." Only if the lengths stay fixed: $(1,0)\cdot(1,0)=1$ for arrows pointing the same way, but $(3,4)\cdot(1,0)=3$ although $(3,4)$ points mostly up. The next step removes length.
    worked: |
      This example checks the second idea for a tilted arrow. Take $a=(7,1)$ and $b=(6,8)$, find the projection from the rule, then check it against the picture.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" aria-label="Arrow a = (7,1) and arrow b = (6,8) from the origin. A dashed step (4,−3) from the point (3,4) on b reaches the tip of a and meets b at a right angle, so the shadow of a along b runs from the origin to (3,4) and has length 5.">
        <defs>
          <marker id="w-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
          <marker id="w-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M150 310 H430 M150 310 V20" stroke="#d4d4d4" stroke-width="1.5"/>
          <path d="M252 174 L388 276" stroke="#737373" stroke-width="2" stroke-dasharray="6 5"/>
          <path d="M244.8 183.6 L254.4 190.8 L261.6 181.2" stroke="#737373" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
          <path d="M150 310 L354 38" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#w-b)"/>
          <path d="M150 310 L388 276" stroke="#10b981" stroke-width="3" marker-end="url(#w-g)"/>
          <path d="M140.4 302.8 L242.4 166.8" stroke="#10b981" stroke-width="5"/>
          <circle cx="252" cy="174" r="4" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="362" y="44" fill="#3b82f6">b = (6,8), length 10</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="396" y="282" fill="#10b981">a = (7,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="276" y="178">(3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="358" y="236" fill="#737373">step (4,−3)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="176" y="226" fill="#10b981" text-anchor="end">shadow: 5 along b</text>
        </g>
      </svg>
      ```

      1. **Multiply matching entries and add.**
         $$a\cdot b=7\cdot6+1\cdot8=50$$

      2. **Find $b$'s length.**
         $$\|b\|=\sqrt{6^2+8^2}=\sqrt{100}=10$$

      3. **Use the rule to get the projection.**
         $$\text{projection}=\frac{a\cdot b}{\|b\|}=\frac{50}{10}=5$$

      4. **Find where the shadow should end.** The projection 5 is half of $b$'s length 10, so the shadow should end halfway along $b$:
         $$\tfrac{1}{2}(6,8)=(3,4)$$

      5. **Find the step from there to $a$'s tip.**
         $$(7,1)-(3,4)=(4,-3)$$

      6. **Check that the step meets $b$'s line at a right angle.** Pythagoras' rule also works backwards: if the squares of the two shorter sides add up to the square of the longest side, the corner between the shorter sides is a right angle. Use the triangle with corners at the origin, $(3,4)$ and $a$'s tip:
         $$\|(3,4)\|^2+\|(4,-3)\|^2=25+25=50=\|(7,1)\|^2$$
         So the right-angle drop from $a$'s tip lands at $(3,4)$, exactly where the rule said the shadow ends.

      **Compare cases.** Keep $b=(6,8)$ and change $a$:

      | $a$ | How $a$ sits against $b$ | Projection | $a\cdot b$ |
      | --- | --- | --- | --- |
      | $(6,8)$ | same direction | $10$ | $100$ |
      | $(7,1)$ | partly along | $5$ | $50$ |
      | $(4,-3)$ | right angle | $0$ | $0$ |
      | $(-7,-1)$ | partly against | $-5$ | $-50$ |
      | $(-6,-8)$ | opposite | $-10$ | $-100$ |

      **Where it shows up.** A robot in a corridor takes the dot product of its movement with a length-1 arrow along the corridor to find how far it has travelled along it. A negative answer means it has gone backwards.
    problems:
      - dot-arrow-alignment-basics
      - dotp-why-shadow
      - dotp-sign
      - dotp-right-angle
      - dotp-projection
      - dotp-alignment-template
      - dotp-why-not-lengths
      - dotp-reverse
      - dotp-corridor
  - id: dot-direction-only
    title: Cosine similarity compares directions alone
    explain: |
      **The question.** The dot product mixes two things: how closely the arrows' directions agree and how long the arrows are. How can you score direction alone, so length can't win?

      **Picture it.** On the left, $a=(3,4)$ and $b=(4,0)$. On the right are the same two directions with arrows twice as long, $a=(6,8)$ and $b=(8,0)$. The angle between the arrows, written $\theta$ ("theta"), is the same in both, but the dot product grows from 12 to 48. Divide each dot product by the two lengths multiplied together and both give $0.6$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" aria-label="Two panels with the same angle θ between the arrows. Left: a = (3,4) and b = (4,0), dot product 12, lengths 5 and 4, score 0.6. Right: a = (6,8) and b = (8,0), dot product 48, lengths 10 and 8, score 0.6.">
        <defs>
          <marker id="c-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
          <marker id="c-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M70 250 H310" stroke="#d4d4d4" stroke-width="1.5"/>
          <path d="M114 250 A34 34 0 0 0 100.4 222.8" stroke="#737373" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="120" y="238" fill="#737373">θ</text>
          <path d="M80 250 L155 150" stroke="#10b981" stroke-width="3" marker-end="url(#c-g)"/>
          <path d="M80 250 H180" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#c-b)"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="163" y="154" fill="#10b981">a = (3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="186" y="270" fill="#3b82f6">b = (4,0)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="80" y="298">a·b = 12, lengths 5 × 4</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="80" y="320" font-weight="600">score 12 / 20 = 0.6</text>
          <path d="M350 250 H590" stroke="#d4d4d4" stroke-width="1.5"/>
          <path d="M394 250 A34 34 0 0 0 380.4 222.8" stroke="#737373" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="400" y="238" fill="#737373">θ</text>
          <path d="M360 250 L510 50" stroke="#10b981" stroke-width="3" marker-end="url(#c-g)"/>
          <path d="M360 250 H560" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#c-b)"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="518" y="54" fill="#10b981">a = (6,8)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="566" y="270" fill="#3b82f6">b = (8,0)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="360" y="298">a·b = 48, lengths 10 × 8</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="360" y="320" font-weight="600">score 48 / 80 = 0.6</text>
        </g>
      </svg>
      ```

      **The idea.** To compare directions only, divide the dot product by both lengths. This is **cosine similarity**, defined for two non-zero vectors:

      $$\frac{a\cdot b}{\|a\|\,\|b\|}$$

      Dividing by both lengths is the same as first shrinking each arrow to length 1, a **unit vector**, by dividing its entries by its length: $(3,4)$ becomes $(0.6,0.8)$. Dividing every entry of $a$ by $\|a\|$ divides every product $a_ib_i$, and so the whole sum, by $\|a\|$; likewise for $b$. For two length-1 arrows, the dot product is the shadow of one on the other times 1, which depends only on the angle. That shadow is called the **cosine** of $\theta$, written $\cos\theta$: 1 when the arrows agree, 0 at a right angle, $-1$ when opposite. In the picture, $(3,4)$ and $b$ shrink to $(0.6,0.8)$ and $(1,0)$, and $(0.6,0.8)\cdot(1,0)=0.6$, both panels' score. Multiplying back by the lengths splits any dot product into lengths times $\cos\theta$:

      $$a\cdot b=\|a\|\,\|b\|\cos\theta$$

      A zero vector has no direction, so it has no cosine similarity.

      **Common confusion.** "A cosine similarity of 1 means the two vectors are equal." No, it means they point the same way. $(1,1)$ and $(10,10)$ score 1, but one is ten times as long as the other.
    worked: |
      This example shows the third idea: dividing by both lengths leaves a score that ignores length. Find the cosine similarity of $a=(3,4)$ and $b=(4,3)$, then double $a$.

      1. **Multiply matching entries and add.**
         $$a\cdot b=3\cdot4+4\cdot3=24$$

      2. **Find the length of $a$.**
         $$\|a\|=\sqrt{3^2+4^2}=5$$

      3. **Find the length of $b$.**
         $$\|b\|=\sqrt{4^2+3^2}=5$$

      4. **Divide by the two lengths multiplied together.**
         $$\frac{24}{5\cdot5}=0.96$$
         This is close to 1, so the arrows point nearly the same way; the arrows in the picture scored only 0.6.

      5. **Double $a$ to $(6,8)$ and repeat.**
         $$\frac{6\cdot4+8\cdot3}{10\cdot5}=\frac{48}{50}=0.96$$
         The dot product doubled, but so did $a$'s length, so the score did not change.

      **Compare cases.** Keep $a=(3,4)$ and change $b$:

      | $b$ | $a\cdot b$ | Lengths multiplied | Cosine similarity |
      | --- | --- | --- | --- |
      | $(6,8)$ | $50$ | $50$ | $1$ |
      | $(4,3)$ | $24$ | $25$ | $0.96$ |
      | $(40,30)$ | $240$ | $250$ | $0.96$ |
      | $(4,-3)$ | $0$ | $25$ | $0$ |
      | $(-3,-4)$ | $-25$ | $25$ | $-1$ |

      **Where it shows up.** A recommendation system can describe each film by a vector of scores, such as (action, comedy, romance). Two films with the same mix of scores point the same way, so cosine similarity calls them alike even if one film's scores are all larger.
