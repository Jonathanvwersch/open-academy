final: dot-explain
summary: |
  - The dot product multiplies matching entries of two vectors and adds the products into one number.
  - For arrows, it is the projection of one onto the other times the other's length: positive when they point roughly together, zero at a right angle, negative when they point apart.
  - Cosine similarity divides the dot product by both lengths, leaving $\cos\theta$, which compares directions whatever the lengths.
  **Next:** Matrices do many dot products at once, for example predicting prices for a whole list of houses.
