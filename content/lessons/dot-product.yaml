concept: dot-product
version: 2
objective: |
  **Goal:** turn two vectors into one number, see how that number measures agreement between arrows, and compare directions without rewarding length.
why: |
  A film app needs to recommend something you will enjoy. It records your taste for action, comedy and romance as (3, 0, 1), and a film's scores for those categories as (2, 1, 0). Adding the film's scores alone would ignore your tastes. A dot product pairs each film score with how much you care about that category, then adds the results to give one number for ranking films. Cosine similarity lets you compare the balance of categories without rewarding larger numbers alone. The same calculations appear in matrices, linear regression, the perceptron, and attention, where a model compares numerical descriptions to decide what matters.
knowledge_points:
  - id: dot-weighted-total
    title: Combining two lists into one number
    explain: |
      **How can two lists of numbers give one total, with each entry allowed to matter differently?** A useful calculation should pair entries with the same meaning. Doubling an entry in either list should double that pair's contribution. Adding a list's entries alone would ignore the other list.

      Multiply matching entries, then add. For $a=(3,0,1)$ and $b=(2,1,0)$, this gives $3\cdot2+0\cdot1+1\cdot0=6$. This is the **dot product**, written $a\cdot b$. The dot between numbers means multiplication; between vectors it names the whole calculation.

      For vectors with $n$ entries, $i$ selects an entry and $\sum$ adds from entry one to $n$:

      $$a\cdot b=\sum_{i=1}^{n}a_i b_i.$$

      Picture one contribution from each matching pair. The contributions are 6, 0 and 0 here. Multiplication sets their sizes, and addition combines them into one number. Why this way? Multiplying without adding leaves a list, not the requested total. Both vectors must keep the same entry order.

      When one list controls how much each measurement matters, its entries are **weights** and the total is a **weighted sum**. A zero weight ignores a measurement; a negative weight reverses its contribution. A **linear model** uses this calculation to score input measurements, called **features**. For a film app, weights $(3,0,1)$ can describe interest in action, comedy and romance, while $(2,1,0)$ describes a film.
    worked: |
      This example shows why a film's action score matters more to this viewer than its comedy score.

      Use taste weights $w=(3,0,1)$ and film scores $x=(2,1,0)$, always in the order (action, comedy, romance).

      1. Action adds $3\cdot2=6$ to the score.
      2. Comedy adds $0\cdot1=0$, and romance adds $1\cdot0=0$.
      3. The total is $w\cdot x=6+0+0=6$.
      4. Increasing the film's action score to 3 gives $3\cdot3+0\cdot1+1\cdot0=9$.
      5. Increasing only its comedy score instead leaves the total at 6, because the comedy weight is zero.

      The app can rank films by this number. That ranking is only as useful as the category scores and taste weights it uses.
    problems:
      [
        dotp-total,
        dotp-total-template,
        dotp-model,
        dotp-order,
        dotp-negative-weight,
        dotp-why-total,
      ]
  - id: dot-arrow-alignment
    title: Measuring how much two arrows point the same way
    explain: |
      **How much do two arrows point the same way?** We want a positive number when they point roughly together, zero when they meet at a right angle, and a negative number when they point against each other. Comparing lengths alone cannot tell these cases apart.

      Try $a=(3,4)$ and $b=(2,0)$, both drawn from $(0,0)$. Their dot product is $3\cdot2+4\cdot0=6$. Reversing $b$ gives $-6$. Replacing it by $(4,-3)$ gives $12-12=0$.

      Why does this work? Drop a perpendicular line from $a$'s tip onto the line along $b$. **Perpendicular** means meeting at a right angle; **orthogonal** means the same thing. The resulting shadow is the **projection** of $a$ onto that line. Its signed length is positive along $b$ and negative against it. Here the shadow reaches 3 units right. Multiplying by $b$'s length, 2, gives 6.

      The **angle** $\theta$ (“theta”) measures the turn between the arrows, from zero to 180 degrees. **Cosine**, written $\cos$, is the projection's signed length divided by $a$'s length. Thus:

      $$a\cdot b=\|a\|_2\|b\|_2\cos\theta.$$

      Cosine is one at zero degrees, zero at 90, and minus one at 180. Why this way? The shadow records direction, while multiplying by the other length makes both arrows' sizes count. In a model, this lets a score measure agreement as well as size.
    worked: |
      This example shows why multiplying a projection by the other arrow's length gives the dot product.

      Draw $a=(3,4)$ and $b=(2,0)$ from the origin. The first coordinate measures distance right and the second measures distance up.

      1. Multiply and add: $a\cdot b=3\cdot2+4\cdot0=6+0=6$.
      2. Find the lengths: $\|a\|_2=\sqrt{9+16}=5$ and $\|b\|_2=\sqrt{4+0}=2$.
      3. The projection of $a$ onto the horizontal line along $b$ has signed length 3.
      4. Multiplying that projection by $b$'s length gives $3\cdot2=6$, the same score.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" aria-label="Arrows a=(3,4) and b=(2,0) from the origin; a's projection onto the line along b has signed length 3">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M60 205 H420 M180 45 V205" stroke="#d4d4d4" stroke-width="2" fill="#d4d4d4" fill-opacity="0" stroke-dasharray="5 5"/>
          <path d="M60 205 L180 45" stroke="#10b981" stroke-width="3"/>
          <path d="M180 45 L167 52 L178 60 Z" fill="#10b981"/>
          <path d="M60 205 H140" stroke="#3b82f6" stroke-width="4"/>
          <path d="M140 205 L126 198 V212 Z" fill="#3b82f6"/>
          <path d="M60 225 H180" stroke="#f59e0b" stroke-width="3"/>
          <path d="M100 205 A40 40 0 0 0 84 173" stroke="#737373" fill="#737373" fill-opacity="0"/>
          <path d="M165 205 V190 H180" stroke="#737373" fill="#737373" fill-opacity="0"/>
          <text x="185" y="40">a = (3,4)</text><text x="145" y="180">b = (2,0)</text>
          <text x="105" y="187">θ</text><text x="65" y="248">projection along b = 3</text>
          <text x="220" y="140">first coordinate: right</text><text x="220" y="159">second coordinate: up</text>
        </g>
      </svg>
      ```

      Reverse $b$ to $(-2,0)$. The projection now points against $b$, so its signed length is $-3$. The dot product is $(-3)\cdot2=-6$.
    problems:
      [
        dotp-sign,
        dotp-alignment-template,
        dotp-right-angle,
        dotp-projection,
        dotp-reverse,
        dotp-why-not-lengths,
      ]
  - id: dot-direction-only
    title: Comparing directions without rewarding length
    explain: |
      **How can we compare directions without rewarding longer arrows?** The answer should stay the same when either arrow doubles without turning. The dot product alone fails this test: $(1,1)\cdot(1,0)=1$, but $(1,1)\cdot(2,0)=2$.

      Divide the dot product by both lengths. The result is **cosine similarity**:

      $$\cos\theta=\frac{a\cdot b}{\|a\|_2\|b\|_2}.$$

      For $a=(1,1)$ and $b=(1,0)$, the lengths are $\sqrt2$ and 1, so the result is $1/\sqrt2\approx0.707$. Doubling $b$ gives $2/(\sqrt2\cdot2)$, the same number.

      Picture shortening or lengthening both arrows until each has length one. Their directions stay fixed, and their dot product is now just the signed projection. This explains why dividing by the original lengths removes size. A vector of length one is a **unit vector**.

      The score ranges from minus one to one: one means the same direction, zero means perpendicular, and minus one means opposite. A zero vector has no direction, and its zero length makes the division undefined. Multiplying by a negative number reverses an arrow and flips the score's sign.

      Why this way? Use cosine similarity when direction matters but size should not. In a film model, $(1,1)$ and $(10,10)$ give action and comedy the same relative importance. Cosine treats those tastes as identical in direction, not identical in ratings. Use the unadjusted dot product if rating strength should count too.
    worked: |
      This example shows how dividing out lengths isolates direction.

      Start with arrows $a=(1,1)$ and $b=(1,0)$.

      1. Dot product: $a\cdot b=1\cdot1+1\cdot0=1$.
      2. Lengths: $\|a\|_2=\sqrt{1+1}=\sqrt2$ and $\|b\|_2=\sqrt{1+0}=1$.
      3. Divide: $\cos\theta=1/(\sqrt2\cdot1)\approx0.707$. This is the cosine of $45^\circ$, where the degree sign marks an angle in degrees.
      4. Double $b$ to $(2,0)$. The dot product becomes $1\cdot2+1\cdot0=2$, and its length becomes $\sqrt{4+0}=2$.
      5. Divide again: $2/(\sqrt2\cdot2)=1/\sqrt2\approx0.707$.

      For $a=(3,4)$ and $b=(4,3)$, the dot product is $3\cdot4+4\cdot3=12+12=24$. Both lengths are $\sqrt{9+16}=5$, so cosine similarity is $24/(5\cdot5)=24/25=0.96$.

      Multiplying either arrow by a positive number leaves its direction, and therefore its cosine similarity, unchanged. For taste vectors this compares the balance of interests, not how large the ratings are.
    problems:
      [dotp-cosine, dotp-cosine-template, dotp-scaling, dotp-zero, dotp-attention, dotp-position]
final: dot-explain
summary: |
  - A dot product multiplies matching entries and adds the results. When one vector contains weights, it gives a weighted total of the other vector's measurements.
  - For arrows, the dot product is a signed projection multiplied by the other arrow's length. It is positive below a right angle, zero at a right angle, and negative above a right angle.
  - Cosine similarity divides by both non-zero lengths. It compares directions without rewarding longer arrows. A model can use it to compare the balance of interests without rewarding larger ratings alone.

  **Where you'll use this:** matrices, linear regression, the perceptron, and attention reuse these ways of calculating and comparing scores from lists of numbers.
