concept: dot-product
version: 2
objective: |
  **Goal:** calculate how well a film matches someone's tastes, then use dot products and cosine similarity to explain what that score measures.
why: |
  A film app needs to recommend something you will enjoy. It records your taste for action, comedy and romance as (3, 0, 1), and a film's scores for those categories as (2, 1, 0). Adding the film's scores alone would ignore your tastes. A dot product pairs each film score with how much you care about that category, then adds the results to give one number for ranking films. Cosine similarity lets you compare the balance of categories without rewarding larger numbers alone. The same calculations appear in matrices, linear regression, the perceptron, and attention, where a model compares numerical descriptions to decide what matters.
knowledge_points:
  - id: dot-weighted-total
    title: Giving a film one recommendation score
    explain: |
      A film app records your taste for action, comedy and romance as $w=(3,0,1)$. A film has category scores $x=(2,1,0)$. **Does this film suit you?** Adding its scores would treat every category equally, even though you do not care about comedy.

      Multiply each film score by your number for that category, then add: $3\cdot2+0\cdot1+1\cdot0=6$. Your taste numbers are **weights**: they control how much each category matters. This calculation is a **weighted sum**, also called the **dot product** of the two vectors.

      This works because multiplication makes a category count more when both numbers are large. A zero weight ignores that category, and a negative weight penalises it. Why this way? Stopping after multiplication would leave three separate numbers. Adding gives the single score the app needs to compare films.

      For vectors $a$ and $b$ with $n$ entries each:

      $$a\cdot b=\sum_{i=1}^{n}a_i b_i.$$

      The dot between vectors names this operation; between numbers it means multiplication. Here $i$ selects an entry and $\sum$ adds the products from entry one to $n$. Both vectors must list categories in the same order.

      A **linear model** calculates a score this way from input measurements, called **features**. With other features fixed, raising $x_i$ by one changes the score by $w_i$.
    worked: |
      This example shows why a film's action score matters more to this viewer than its comedy score.

      Use taste weights $w=(3,0,1)$ and film scores $x=(2,1,0)$, always in the order (action, comedy, romance).

      1. Action adds $3\cdot2=6$ to the score.
      2. Comedy adds $0\cdot1=0$, and romance adds $1\cdot0=0$.
      3. The total is $w\cdot x=6+0+0=6$.
      4. Increasing the film's action score to 3 gives $3\cdot3+0\cdot1+1\cdot0=9$.
      5. Increasing only its comedy score instead leaves the total at 6, because the comedy weight is zero.

      The app can rank films by this number. That ranking is only as useful as the category scores and taste weights it uses.
    problems:
      [
        dotp-total,
        dotp-total-template,
        dotp-model,
        dotp-order,
        dotp-negative-weight,
        dotp-why-total,
      ]
  - id: dot-arrow-alignment
    title: Seeing agreement between two tastes
    explain: |
      Two viewers rate action and comedy as $a=(3,4)$ and $b=(2,0)$. Positive numbers mean liking a category; negative numbers mean disliking it. **Do their tastes agree?** Comparing only how large their numbers are misses whether they like or dislike the same things.

      Draw each vector as an arrow from $(0,0)$, with action along the horizontal axis and comedy along the vertical axis. The **angle** between them measures the turn from one arrow to the other, from zero to 180 degrees. **Cosine**, written $\cos$, gives one at zero degrees, zero at 90 degrees and minus one at 180 degrees.

      For non-zero vectors $a$ and $b$:

      $$a\cdot b=\|a\|_2\|b\|_2\cos\theta.$$

      Here $\theta$ (“theta”) is the angle, and the norms are the arrow lengths. Below 90 degrees the dot product is positive, showing overall agreement. Above 90 degrees it is negative, showing opposition. At 90 degrees it is zero: the preferences do not favour either direction overall. These right-angle arrows are **perpendicular**, or **orthogonal**.

      This works because the dot product measures how much of one arrow points along the other. Picture its shadow on the other's line. The shadow's signed length is a **projection**: forward counts positively and backward negatively. Multiply it by the other arrow's length to get the dot product.

      Why this way? Lengths alone cannot distinguish liking action from disliking it. The dot product can, although longer arrows also make its size larger.
    worked: |
      This example shows how shared interest in action gives two viewers a positive score.

      Viewer $a=(3,4)$ likes action and comedy. Viewer $b=(2,0)$ likes action but is neutral about comedy.

      1. Multiply and add: $a\cdot b=3\cdot2+4\cdot0=6+0=6$.
      2. Find the lengths: $\|a\|_2=\sqrt{9+16}=5$ and $\|b\|_2=\sqrt{4+0}=2$.
      3. The projection of $a$ onto the action axis, along $b$, is 3.
      4. Multiplying that projection by $b$'s length gives $3\cdot2=6$, the same score.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" aria-label="Taste vectors for action and comedy: a is (3,4), b is (2,0), and the projection along the action axis is 3">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M60 205 H420 M180 45 V205" stroke="#d4d4d4" stroke-width="2" fill="#d4d4d4" fill-opacity="0" stroke-dasharray="5 5"/>
          <path d="M60 205 L180 45" stroke="#10b981" stroke-width="3"/>
          <path d="M180 45 L167 52 L178 60 Z" fill="#10b981"/>
          <path d="M60 205 H140" stroke="#3b82f6" stroke-width="4"/>
          <path d="M140 205 L126 198 V212 Z" fill="#3b82f6"/>
          <path d="M60 225 H180" stroke="#f59e0b" stroke-width="3"/>
          <path d="M100 205 A40 40 0 0 0 84 173" stroke="#737373" fill="#737373" fill-opacity="0"/>
          <path d="M165 205 V190 H180" stroke="#737373" fill="#737373" fill-opacity="0"/>
          <text x="185" y="40">a = (3,4)</text><text x="85" y="164">b = (2,0)</text>
          <text x="105" y="187">θ</text><text x="65" y="248">projection onto action = 3</text>
          <text x="220" y="140">horizontal: action</text><text x="220" y="159">vertical: comedy</text>
        </g>
      </svg>
      ```

      If viewer $b$ dislikes action instead, their vector is $(-2,0)$. The score becomes $3\cdot(-2)+4\cdot0=-6$.

      The sign records overall agreement or opposition in these categories. It cannot tell whether two people will enjoy every film together.
    problems:
      [
        dotp-sign,
        dotp-alignment-template,
        dotp-right-angle,
        dotp-projection,
        dotp-reverse,
        dotp-why-not-lengths,
      ]
  - id: dot-direction-only
    title: Comparing directions without rewarding length
    explain: |
      Two viewers have taste vectors $(1,1)$ and $(1,0)$ for action and comedy. **How can the app compare their balance of tastes without rewarding bigger ratings?** Doubling the second viewer's ratings doubles the dot product, even though their balance of interests has not changed.

      This direction-only score is **cosine similarity**:

      $$\cos\theta=\frac{a\cdot b}{\|a\|_2\|b\|_2}.$$

      The top of the fraction is the dot product; the bottom multiplies the two arrow lengths. This works because doubling either vector doubles both parts of the fraction. Cancelling that factor leaves a score based only on direction.

      The score ranges from minus one to one. One means the same direction, zero means perpendicular directions, and minus one means opposite directions. If either vector is zero, division by its zero length is undefined. The app needs another way to handle a viewer who has supplied no preferences.

      Multiplying a vector by a positive scalar leaves cosine similarity unchanged. A negative scalar reverses its arrow and flips the score's sign. Why this way? Use cosine when the balance of interests matters more than rating size. Use the unadjusted dot product when rating strength should count too.

      In a machine-learning recommender, these are choices about what “similar” should mean. Neither score can recover interests missing from the chosen categories. Equal cosine similarity also does not mean equal ratings: $(1,1)$ and $(10,10)$ point the same way but contain different numbers.
    worked: |
      This example shows how dividing out lengths isolates direction.

      Start with taste vectors $a=(1,1)$ and $b=(1,0)$, in the order (action, comedy).

      1. Dot product: $a\cdot b=1\cdot1+1\cdot0=1$.
      2. Lengths: $\|a\|_2=\sqrt{1+1}=\sqrt2$ and $\|b\|_2=\sqrt{1+0}=1$.
      3. Divide: $\cos\theta=1/(\sqrt2\cdot1)\approx0.707$. This is the cosine of $45^\circ$, where the degree sign marks an angle in degrees.
      4. Double $b$ to $(2,0)$. The dot product becomes $1\cdot2+1\cdot0=2$, and its length becomes $\sqrt{4+0}=2$.
      5. Divide again: $2/(\sqrt2\cdot2)=1/\sqrt2\approx0.707$.

      For $a=(3,4)$ and $b=(4,3)$, the dot product is $3\cdot4+4\cdot3=12+12=24$. Both lengths are $\sqrt{9+16}=5$, so cosine similarity is $24/(5\cdot5)=24/25=0.96$.

      Raising all of one viewer's ratings by the same positive factor leaves their balance of tastes, and their cosine similarity, unchanged.
    problems:
      [dotp-cosine, dotp-cosine-template, dotp-scaling, dotp-zero, dotp-attention, dotp-position]
final: dot-explain
summary: |
  - A dot product multiplies matching category scores and adds the results. Each taste weight controls how much its category counts.
  - A positive dot product shows overall agreement between the represented tastes. A negative value shows opposition, and zero shows no overall agreement. The size also depends on the arrow lengths.
  - Cosine similarity divides by both non-zero lengths. It compares the balance of interests without rewarding larger ratings alone.

  **Where you'll use this:** matrices, linear regression, the perceptron, and attention reuse these ways of calculating and comparing scores from lists of numbers.
