summary: |
  - The dot product multiplies the matching components of two vectors and adds up the products, $a\cdot b=\sum_{i=1}^{n}a_ib_i$. When one vector holds weights, it's a weighted sum, which is how a model combines its inputs.
  - For arrows, $a\cdot b$ is the projection of $a$ onto $b$ times $b$'s length. It's positive when the angle between them is less than a right angle, zero when they're perpendicular, and negative when the angle is more.
  - Cosine similarity, $\frac{a\cdot b}{\|a\|\,\|b\|}=\cos\theta$, compares the directions of two non-zero vectors whatever their lengths, from 1 for the same way to $-1$ for opposite ways.

  **Next:** The matrices lesson does many dot products at once, for example predicting prices for a whole list of houses.
