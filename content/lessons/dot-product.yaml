concept: dot-product
version: 4
objective: |
  **Goal:** combine two vectors into one number, read that number as how far one arrow goes along another, and divide out the lengths to compare directions alone.
where_this_fits: |
  A model often has to turn several numbers into one: a house's area, bedrooms and age into one predicted price, each measurement counting for its own amount. It also needs to tell whether two vectors point the same way. The vectors lesson let you add, scale and measure vectors, but none of those combines two vectors into one number. This lesson builds the tool that does, the **dot product**, in three steps:

  1. Multiply matching entries and add them into one total.
  2. Read that total for arrows: how far one arrow goes along the other.
  3. Divide out the lengths to compare directions alone.

  The last step, cosine similarity, is how search systems decide that two things are alike.
knowledge_points:
  - id: dot-weighted-total
    title: The dot product multiplies matching entries and adds
    explain: |
      **The question.** You often have a list of amounts and a matching list of rates, and you want one total: items bought and their prices, or a house's measurements and what each is worth. How do you combine two lists like that into a single number?

      **Picture it.** Take a quiz score. A student answers 6 questions correctly, skips 2 and gets 2 wrong, so the counts are $c=(6,2,2)$. The quiz gives 3 points for a correct answer, 0 for a skip and takes 1 away for a wrong answer, so the points are $p=(3,0,-1)$, in the same order. Each count times its points is that kind of answer's contribution, and the contributions add up to the score.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" aria-label="Quiz counts c = (6, 2, 2) for correct, skipped and wrong answers paired with points p = (3, 0, −1). Each pair multiplies to a contribution, 18, 0 and −2, and the contributions add to the score 16.">
        <defs>
          <marker id="q-muted-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="190" y="52" fill="#737373" text-anchor="middle">correct</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="52" fill="#737373" text-anchor="middle">skipped</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="450" y="52" fill="#737373" text-anchor="middle">wrong</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="16" y="105">count, c</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="16" y="175">points each, p</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="16" y="255">contribution</text>
          <rect x="152" y="80" width="76" height="40" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="190" y="106" text-anchor="middle" font-size="16">6</text>
          <rect x="152" y="150" width="76" height="40" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="190" y="176" text-anchor="middle" font-size="16">3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="190" y="141" fill="#737373" text-anchor="middle" font-size="16">×</text>
          <path d="M190 192 V226" stroke="#737373" stroke-width="2" marker-end="url(#q-muted-arrow)"/>
          <rect x="152" y="230" width="76" height="40" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="190" y="256" fill="#10b981" text-anchor="middle" font-size="16" font-weight="600">18</text>
          <rect x="282" y="80" width="76" height="40" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="106" text-anchor="middle" font-size="16">2</text>
          <rect x="282" y="150" width="76" height="40" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="176" text-anchor="middle" font-size="16">0</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="141" fill="#737373" text-anchor="middle" font-size="16">×</text>
          <path d="M320 192 V226" stroke="#737373" stroke-width="2" marker-end="url(#q-muted-arrow)"/>
          <rect x="282" y="230" width="76" height="40" rx="6" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="256" fill="#737373" text-anchor="middle" font-size="16" font-weight="600">0</text>
          <rect x="412" y="80" width="76" height="40" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="450" y="106" text-anchor="middle" font-size="16">2</text>
          <rect x="412" y="150" width="76" height="40" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="450" y="176" text-anchor="middle" font-size="16">−1</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="450" y="141" fill="#737373" text-anchor="middle" font-size="16">×</text>
          <path d="M450 192 V226" stroke="#737373" stroke-width="2" marker-end="url(#q-muted-arrow)"/>
          <rect x="412" y="230" width="76" height="40" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="450" y="256" fill="#ef4444" text-anchor="middle" font-size="16" font-weight="600">−2</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="255" y="256" fill="#737373" text-anchor="middle" font-size="16">+</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="385" y="256" fill="#737373" text-anchor="middle" font-size="16">+</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="510" y="256" fill="#737373" text-anchor="middle" font-size="16">=</text>
          <rect x="537" y="230" width="76" height="40" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="575" y="256" text-anchor="middle" font-size="16" font-weight="600">16</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="575" y="292" fill="#737373" text-anchor="middle">score</text>
        </g>
      </svg>
      ```

      **The idea.** Pair up the entries, multiply each pair, and add the results: two vectors become one number. This is the **dot product**, written $a\cdot b$. For two vectors with the same number of entries, $n$,

      $$a\cdot b=a_1b_1+a_2b_2+\dots+a_nb_n=\sum_{i=1}^{n}a_ib_i.$$

      Between two plain numbers a raised dot just means multiply; between two vectors it means this whole pair-multiply-add calculation. Both vectors must list the same things in the same order, or you multiply a count by the wrong rate. When one vector holds rates like the points, the dot product is called a **weighted sum** and the rates are the **weights**: a positive weight adds to the total, a zero weight ignores that entry, and a negative weight takes away.

      **Common confusion.** "Can't I add up each list first and then multiply the two totals?" No. That gives $(6+2+2)\cdot(3+0-1)=10\cdot2=20$, not the real score of 16, because it charges every answer at every rate: correct answers would pick up the wrong-answer penalty too. The dot product only multiplies entries that belong together.
    worked: |
      This example shows the first idea: multiply matching entries, then add. Find the quiz score $c\cdot p$ for counts $c=(6,2,2)$ and points $p=(3,0,-1)$.

      1. **Multiply the correct answers by their points.**
         $$6\cdot3=18$$

      2. **Multiply the skips by their points.**
         $$2\cdot0=0$$

      3. **Multiply the wrong answers by their points.**
         $$2\cdot(-1)=-2$$

      4. **Add the three contributions.**
         $$c\cdot p=18+0+(-2)=16$$

      **Compare cases.** Keep the counts and change only the points for a wrong answer:

      | Points $p$ | Wrong answers' contribution | Score $c\cdot p$ |
      | --- | --- | --- |
      | $(3,0,0)$ | $0$ | $18$ |
      | $(3,0,-1)$ | $-2$ | $16$ |
      | $(3,0,-3)$ | $-6$ | $12$ |

      **Where it shows up.** A house-price model gives each measurement a weight in thousand pounds per unit: for measurements $x=(12,3,20)$ (area in tens of square metres, bedrooms, age in years) and weights $w=(25,10,-1)$, the predicted price is $w\cdot x=300+30-20=310$ thousand pounds.
