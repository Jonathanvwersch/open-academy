concept: dot-product
version: 5
objective: |
  **Goal:** compute the dot product of two vectors, see what it tells us about two arrows, and use cosine similarity to compare their directions whatever their lengths.
recap:
  - concept: vectors
    text: "A vector is an ordered list of numbers called components, drawn as an arrow. By Pythagoras' rule, a vector $x$ has length $\\|x\\|$, the square root of the sum of its squared components, so $\\|(3,4)\\|=5$."
where_this_fits: |
  ### What is the dot product?

  The dot product is a way of multiplying two vectors that gives a single number. You multiply the matching components and add the results up.

  It's useful because so much of machine learning is adding up weighted inputs. A model that predicts a house's price multiplies each measurement by its own weight and adds the results, and that total is a dot product. The same number also tells us how closely two arrows point the same way, which is how a robot can check that it's heading towards its goal. In the vectors lesson, we added, scaled and measured vectors, but none of those turns two vectors into one number. That's what this lesson builds.
knowledge_points:
  - id: dot-weighted-total
    title: "Multiply matching numbers and add"
    explain: |
      ### Scoring a quiz

      Let's see how two vectors become one number, using a quiz score. The quiz gives 3 points for a correct answer, 0 for a skipped question, and takes 1 point away for a wrong answer. A student gets 6 correct, skips 2 and gets 2 wrong.

      We can write both lists as vectors, keeping the same order in each: correct, skipped, wrong. So the counts are $c=(6,2,2)$ and the points are $p=(3,0,-1)$. In the picture, each count sits above its points. A count times its points is what that kind of answer adds to the score, and adding those three amounts gives the score.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" aria-label="Quiz counts c = (6, 2, 2) for correct, skipped and wrong answers sit above the points p = (3, 0, −1) for each kind. Each pair multiplies to a contribution, 18, 0 and −2, and the contributions add up to a score of 16">
      <defs><marker id="q-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
