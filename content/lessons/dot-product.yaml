  - id: dot-arrow-alignment
    title: For arrows, the dot product measures how far one goes along the other
    explain: |
      **The question.** Vectors can also be drawn as arrows. For two arrows, what does their dot product tell you? Ideally one number would say whether they point roughly the same way, at right angles, or in opposite directions.

      **Picture it.** Start with the easiest second arrow, $b=(1,0)$: length 1, pointing right. For any arrow $a=(a_1,a_2)$,

      $$a\cdot b=a_1\cdot1+a_2\cdot0=a_1.$$

      So here the dot product is how far $a$ goes to the right, which is how far it goes in $b$'s direction; the up part never counts. Below, $(3,4)$ goes 3 right, $(0,4)$ goes straight up and $(-3,4)$ goes 3 left, so their dot products with $b$ are $3$, $0$ and $-3$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" aria-label="Reference arrow b = (1,0) points right. Arrow (3,4) goes 3 right, so a·b = 3; arrow (0,4) goes straight up, so a·b = 0; arrow (−3,4) goes 3 left, so a·b = −3. The coloured bars under the axis show how far each goes along b.">
        <defs>
          <marker id="a-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
          <marker id="a-k" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
          <marker id="a-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker>
          <marker id="a-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M120 220 H520" stroke="#d4d4d4" stroke-width="2"/>
          <path d="M440 60 V220" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 5"/>
          <path d="M200 60 V220" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 5"/>
          <path d="M320 220 L440 60" stroke="#10b981" stroke-width="3" marker-end="url(#a-g)"/>
          <path d="M320 220 L320 60" stroke="#737373" stroke-width="3" marker-end="url(#a-k)"/>
          <path d="M320 220 L200 60" stroke="#ef4444" stroke-width="3" marker-end="url(#a-r)"/>
          <path d="M320 220 H360" stroke="#3b82f6" stroke-width="4" marker-end="url(#a-b)"/>
          <path d="M320 245 H440" stroke="#10b981" stroke-width="4"/>
          <path d="M200 245 H320" stroke="#ef4444" stroke-width="4"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="448" y="64" fill="#10b981">(3,4): a·b = 3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="46" fill="#737373" text-anchor="middle">(0,4): a·b = 0</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="192" y="64" fill="#ef4444" text-anchor="end">(−3,4): a·b = −3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="368" y="210" fill="#3b82f6">b = (1,0)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="380" y="270" fill="#10b981" text-anchor="middle">3 right</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="260" y="270" fill="#ef4444" text-anchor="middle">3 left</text>
        </g>
      </svg>
      ```

      **The idea.** The distance $a$ goes in $b$'s direction is called the **projection** of $a$ onto $b$. Picture it as $a$'s shadow on the line through $b$, counted as negative when the shadow points backwards. For any two arrows,

      $$a\cdot b=(\text{projection of }a\text{ onto }b)\times\|b\|,$$

      where $\|b\|$ is $b$'s length, the L2 norm $\|b\|_2$ from the vectors lesson; from here on the 2 is dropped. Stretch $b$ to $(2,0)$ and the three scores double to $6$, $0$ and $-6$. The sign answers the question: positive when the arrows are less than a right angle apart, zero when they are **perpendicular** (exactly a right angle apart), negative when they are more than a right angle apart. This holds whichever way $b$ points; the worked example checks it for a tilted $b$.

      **Common confusion.** "A bigger dot product means the arrows point more nearly the same way." Only if the lengths stay fixed. Two arrows pointing exactly the same way can score $(1,0)\cdot(1,0)=1$, while $(3,4)\cdot(1,0)=3$ scores more even though $(3,4)$ points well away from $(1,0)$. Length counts too; the next step removes it.
    worked: |
      This example checks the second idea for a tilted arrow: the dot product equals the projection times $b$'s length. Take $a=(7,1)$ and $b=(6,8)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" aria-label="Arrow a = (7,1) and arrow b = (6,8) from the origin. A dashed step (4,−3) from the point (3,4) on b reaches the tip of a and meets b at a right angle, so the shadow of a along b runs from the origin to (3,4) and has length 5.">
        <defs>
          <marker id="w-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
          <marker id="w-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M150 310 H430 M150 310 V20" stroke="#d4d4d4" stroke-width="1.5"/>
          <path d="M252 174 L388 276" stroke="#737373" stroke-width="2" stroke-dasharray="6 5"/>
          <path d="M244.8 183.6 L254.4 190.8 L261.6 181.2" stroke="#737373" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
          <path d="M150 310 L354 38" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#w-b)"/>
          <path d="M150 310 L388 276" stroke="#10b981" stroke-width="3" marker-end="url(#w-g)"/>
          <path d="M140.4 302.8 L242.4 166.8" stroke="#10b981" stroke-width="5"/>
          <circle cx="252" cy="174" r="4" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="362" y="44" fill="#3b82f6">b = (6,8), length 10</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="396" y="282" fill="#10b981">a = (7,1)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="276" y="178">(3,4)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="358" y="236" fill="#737373">step (4,−3)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="176" y="226" fill="#10b981" text-anchor="end">shadow: 5 along b</text>
        </g>
      </svg>
      ```

      1. **Multiply matching entries and add.**
         $$a\cdot b=7\cdot6+1\cdot8=50$$

      2. **Find $b$'s length.**
         $$\|b\|=\sqrt{6^2+8^2}=\sqrt{100}=10$$

      3. **Find where $a$'s shadow ends.** The point $(3,4)$ is halfway along $b$, so it lies on $b$'s line. The step from there to $a$'s tip is
         $$(7,1)-(3,4)=(4,-3)$$

      4. **Check that the step meets $b$'s line at a right angle.** The three side lengths fit Pythagoras' rule, which only happens when the corner at $(3,4)$ is a right angle:
         $$\|(3,4)\|^2+\|(4,-3)\|^2=25+25=50=\|a\|^2$$
         So the shadow runs from the origin to $(3,4)$, and the projection is $\|(3,4)\|=5$.

      5. **Multiply the projection by $b$'s length.**
         $$5\times10=50$$
         This matches step 1.

      **Compare cases.** Keep $b=(6,8)$ and change $a$:

      | $a$ | How $a$ sits against $b$ | Projection | $a\cdot b$ |
      | --- | --- | --- | --- |
      | $(6,8)$ | same direction | $10$ | $100$ |
      | $(7,1)$ | partly along | $5$ | $50$ |
      | $(4,-3)$ | right angle | $0$ | $0$ |
      | $(-7,-1)$ | partly against | $-5$ | $-50$ |
      | $(-6,-8)$ | opposite | $-10$ | $-100$ |

      **Where it shows up.** A robot's movement dotted with $(1,0)$ gives how far it went east, and dotted with $(0,1)$ how far it went north. Dotted with any length-1 direction, it gives how far the robot went that way.
