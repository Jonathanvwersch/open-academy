concept: dot-product
version: 3
objective: |
  **Goal:** turn two vectors into one number, see how that number measures agreement between arrows, and compare directions without rewarding length.
where_this_fits: |
  The vectors lesson kept a house's area, bedrooms and age together as $x=(12,3,20)$. Now we need one prediction from those three measurements. This lesson pairs each feature with a weight, multiplies matching entries and adds the contributions to estimate the sale price.
knowledge_points:
  - id: dot-weighted-total
    title: Combining two lists into one number
    explain: |
      **What the dot product is.** The dot product multiplies matching entries of two vectors and adds the products to make one number.

      **How it works.** A **feature** is an input measurement. Its weight is the adjustable multiplier that sets its contribution to the prediction.

      For this house, $x=(12,3,20)$ lists area in tens of square metres, bedrooms and age in years, in that order. Use weights $w=(25,10,-1)$ in thousand pounds per feature unit: 25 per ten square metres, 10 per bedroom and minus one per year.

      Multiply matching entries, then add: $25\cdot12+10\cdot3+(-1)\cdot20=300+30-20=310$ thousand pounds. This **weighted sum** is the **dot product**, written $w\cdot x$. A dot between numbers means multiplication; between vectors it names the whole calculation.

      For vectors with $n$ entries, $i$ selects an entry and $\sum$ adds from entry one to $n$:

      $$a\cdot b=\sum_{i=1}^{n}a_i b_i.$$

      Picture the contributions on a number line: 300 forward, 30 forward, then 20 back. This works because each weight first converts its measurement into the same output units. The negative age weight lowers the price. Why this way? Multiplying without adding leaves separate contributions, not one prediction. Keep both vectors in the same feature order.

      A **linear model** predicts a value using these weighted contributions. With other features fixed, one extra bedroom adds 10 thousand pounds in this model. These example weights illustrate the calculation, not a reliable valuation.

      **Why this is useful.** A house-price model needs one prediction from several measurements; the dot product combines their separately weighted contributions without mixing their units.
    worked: |
      This example shows how differently weighted house measurements become one price prediction.

      A house has 120 square metres, 3 bedrooms and an age of 20 years. Record $x=(12,3,20)$ and use $w=(25,10,-1)$, in the same feature order. Each weight is in thousand pounds per unit of its feature.

      1. Area contributes $25\cdot12=300$ thousand pounds.
      2. Bedrooms contribute $10\cdot3=30$ thousand pounds.
      3. Age contributes $(-1)\cdot20=-20$ thousand pounds.
      4. Add the contributions: $w\cdot x=300+30-20=310$ thousand pounds.
      5. With area and bedrooms unchanged, increasing age to 21 gives $300+30-21=309$ thousand pounds.

      A negative weight makes a larger feature value lower the prediction. A zero weight would ignore that feature entirely.
    problems:
      [
        dotp-total,
        dotp-total-template,
        dotp-model,
        dotp-order,
        dotp-negative-weight,
        dotp-why-total,
      ]
  - id: dot-arrow-alignment
    title: Measuring how much two arrows point the same way
    explain: |
      **How can one number say whether two arrows point the same way?** We want it positive when they point together, zero when they are perpendicular, and negative when they point opposite ways. Lengths do not show alignment.

      Start with the easiest case: $b=(1,0)$, an arrow of length 1 pointing right. For any arrow $a=(a_1,a_2)$,

      $$a\cdot b=a_1\cdot1+a_2\cdot0=a_1.$$

      So the dot product is just how far $a$ goes to the right, which is how far it goes in $b$'s direction. The up part never counts, because $b$ has no up part to pair with it.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" aria-label="b=(1,0) points right. (3,4) goes 3 right, so a·b=3. (0,4) goes straight up, so a·b=0. (-3,4) goes 3 left, so a·b=-3.">
        <defs>
          <marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
          <marker id="hk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
          <marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker>
          <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M100 230 H470" stroke="#d4d4d4" stroke-width="2"/>
          <path d="M400 70 V230 M160 70 V230" stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="5 5"/>
          <path d="M280 230 L400 70" stroke="#10b981" stroke-width="3" marker-end="url(#hg)"/>
          <path d="M280 230 V70" stroke="#737373" stroke-width="3" marker-end="url(#hk)"/>
          <path d="M280 230 L160 70" stroke="#ef4444" stroke-width="3" marker-end="url(#hr)"/>
          <path d="M280 230 H320" stroke="#3b82f6" stroke-width="5" marker-end="url(#hb)"/>
          <path d="M280 250 H400" stroke="#10b981" stroke-width="4"/>
          <path d="M160 250 H280" stroke="#ef4444" stroke-width="4"/>
          <text x="408" y="66">(3,4): a·b = 3</text>
          <text x="288" y="56">(0,4): a·b = 0</text>
          <text x="152" y="66" text-anchor="end">(−3,4): a·b = −3</text>
          <text x="326" y="222" fill="#3b82f6">b = (1,0)</text>
          <text x="340" y="272" text-anchor="middle" fill="#10b981">3 right</text>
          <text x="220" y="272" text-anchor="middle" fill="#ef4444">3 left</text>
        </g>
      </svg>
      ```

      The scores are 3, 0 and $-3$: right, perpendicular and left relative to $b$.

      Now lengthen $b$ to $(2,0)$. Each score doubles, to 6, 0 and $-6$. So the dot product is the distance $a$ goes in $b$'s direction, times $b$'s length. That distance is called the **projection** of $a$ onto $b$. Its sign answers the direction question, and the lengths set the size.

      Nothing here needs $b$ to point right. Turning both arrows together changes their coordinates but not their dot product (the rotation matrices lesson shows why), so you can always picture $b$ pointing right. For example, $(3,4)\cdot(4,-3)=12-12=0$, so those two arrows are perpendicular.

      **Why this is useful.** The sign of a dot product tells you whether two vectors agree, and its size says how strongly. The next step turns this into a score that compares directions alone.

    worked: |
      This example shows the dot product as "distance along $b$ times $b$'s length" for an arrow that doesn't point right.

      Take $a=(3,4)$ and $b=(6,8)$. Both go 3 right for every 4 up, so they point the same way.

      1. Multiply and add: $a\cdot b=3\cdot6+4\cdot8=18+32=50$.
      2. Find the lengths: $\|a\|_2=\sqrt{9+16}=5$ and $\|b\|_2=\sqrt{36+64}=10$.
      3. $a$ points exactly along $b$, so the distance it goes in $b$'s direction is its whole length, 5.
      4. Multiply that distance by $b$'s length: $5\cdot10=50$, the same answer.

      Now reverse $b$ to $(-6,-8)$. $a$ goes 5 against $b$'s direction, so the distance is $-5$ and the dot product is $-5\cdot10=-50$. Check: $3\cdot(-6)+4\cdot(-8)=-18-32=-50$.

    problems:
      [
        dotp-sign,
        dotp-alignment-template,
        dotp-right-angle,
        dotp-projection,
        dotp-reverse,
        dotp-why-not-lengths,
      ]
  - id: dot-direction-only
    title: Comparing directions without rewarding length
    explain: |
      **What cosine similarity is.** Cosine similarity is a number that compares two non-zero vectors' directions without rewarding their lengths.

      **How it works.** Divide the dot product by both lengths:

      $$\cos\theta=\frac{a\cdot b}{\|a\|_2\|b\|_2}.$$

      Here $\theta$ ("theta") is the angle between the arrows. The **cosine**, written $\cos$, is a trigonometry function that turns an angle into a number: 1 at $0^\circ$, 0 at $90^\circ$ and $-1$ at $180^\circ$. Rearranged, $a\cdot b=\|a\|_2\|b\|_2\cos\theta$.

      For $a=(1,1)$ and $b=(1,0)$, the lengths are $\sqrt2$ and 1, so the result is $1/\sqrt2\approx0.707$. Doubling $b$ gives $2/(\sqrt2\cdot2)$, the same number.

      Picture shortening or lengthening both arrows until each has length one. Their directions stay fixed, and their dot product is now just the projection: the distance one goes along the other. This explains why dividing by the original lengths removes size. A vector of length one is a **unit vector**.

      The score ranges from minus one to one: one means the same direction, zero means perpendicular, and minus one means opposite. A zero vector has no direction, and its zero length makes the division undefined.

      **Why this is useful.** Search engines and recommendation systems use cosine similarity to find items that are alike regardless of size. In Week 4, transformers compare words the same way.
    worked: |
      This example shows how dividing out lengths isolates direction.

      Start with arrows $a=(1,1)$ and $b=(1,0)$.

      1. Dot product: $a\cdot b=1\cdot1+1\cdot0=1$.
      2. Lengths: $\|a\|_2=\sqrt{1+1}=\sqrt2$ and $\|b\|_2=\sqrt{1+0}=1$.
      3. Divide: $\cos\theta=1/(\sqrt2\cdot1)\approx0.707$. This is the cosine of $45^\circ$, where the degree sign marks an angle in degrees.
      4. Double $b$ to $(2,0)$. The dot product becomes $1\cdot2+1\cdot0=2$, and its length becomes $\sqrt{4+0}=2$.
      5. Divide again: $2/(\sqrt2\cdot2)=1/\sqrt2\approx0.707$.

      For $a=(3,4)$ and $b=(4,3)$, the dot product is $3\cdot4+4\cdot3=12+12=24$. Both lengths are $\sqrt{9+16}=5$, so cosine similarity is $24/(5\cdot5)=24/25=0.96$.

      Multiplying either arrow by a positive number leaves its direction, and therefore its cosine similarity, unchanged. For a robot this compares headings rather than distances travelled.
    problems:
      [dotp-cosine, dotp-cosine-template, dotp-scaling, dotp-zero, dotp-attention, dotp-position]
final: dot-explain
summary: |
  - A dot product multiplies matching entries and adds the results. When one vector contains weights, it gives a weighted total of the other vector's measurements.
  - For arrows, the dot product is a signed projection multiplied by the other arrow's length. It is positive below a right angle, zero at a right angle, and negative above a right angle.
  - Cosine similarity divides by both non-zero lengths. It compares directions without rewarding longer arrows. For house vectors, first put the features on comparable scales so the units do not dominate the comparison.

  **Next:** Matrices apply the same dot products to every house at once and can calculate both price and rent predictions.
