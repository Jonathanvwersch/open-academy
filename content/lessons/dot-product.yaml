concept: dot-product
version: 1
fast_path: [objective, summary]
blocks:
  - kind: objective
    md: |
      **Goal:** compute dot products and cosine similarity, and read a dot product both as a weighted sum and as a measure of alignment.
  - kind: intuition
    md: |
      The dot product multiplies matching entries and adds the results. Two useful ways to read it are:

      - **Weighted total.** Pair each entry with a weight and add the products to get one score.
      - **Alignment.** $a \cdot b$ is large and positive when the vectors point the same way, zero when they are perpendicular, and negative when they point in opposite directions.

      For an angle $\theta$, $\cos 0^\circ=1$, $\cos 90^\circ=0$, and $\cos 180^\circ=-1$. So cosine records whether two directions agree, are at a right angle, or oppose each other.
  - kind: example
    md: |
      This example uses a dot product to calculate a weighted score and each input's contribution.

      Weights $w = (0.5, 2)$, features $x = (4, 1)$:
      $$w \cdot x = 0.5 \cdot 4 + 2 \cdot 1 = 4.$$
      Increasing $x_2$ by 1 raises the score by $w_2 = 2$; increasing $x_1$ by 1 raises it by only $0.5$.
  - kind: math
    md: |
      $$a \cdot b = \sum_{i=1}^n a_i b_i = \|a\|\,\|b\|\cos\theta$$
      where $\theta$ is the angle between the vectors. Dividing out the lengths gives **cosine similarity**:
      $$\cos\theta = \frac{a \cdot b}{\|a\|\,\|b\|} \in [-1, 1].$$
      Cosine similarity ignores magnitude and compares direction only. The raw dot product mixes direction *and* length.
  - kind: worked
    md: |
      This worked example compares vector directions using cosine similarity.

      **Cosine similarity of $a = (1, 1)$ and $b = (1, 0)$.**

      1. $a \cdot b = 1 \cdot 1 + 1 \cdot 0 = 1$.
      2. $\|a\| = \sqrt 2$ and $\|b\| = 1$.
      3. $\cos\theta = 1/\sqrt2 \approx 0.707$, so $\theta = 45^\circ$.
  - kind: faded
    md: |
      **Your turn, partly done.** $a = (3, 4)$, $b = (4, 3)$.

      1. $a \cdot b = 3\cdot4 + 4\cdot3 = \;?$
      2. $\|a\| = \|b\| = 5$.
      3. $\cos\theta = \;?$
    exercise: dot-faded-cos
  - kind: check
    exercise: dot-check-1
  - kind: summary
    md: |
      - $a\cdot b = \sum_i a_i b_i = \|a\|\|b\|\cos\theta$.
      - A weighted score is a dot product of weights and features.
      - Cosine similarity compares direction only. The raw dot product also grows with length.
