concept: pytorch-basics
version: 2
objective: |
  **Goal:** write and explain a working PyTorch loop that learns a linear model's weights and bias.
where_this_fits: |
  Training a model means turning examples and correct answers into better predictions. You can already calculate predictions, loss and gradient-descent updates, but doing those calculations by hand does not give you a reusable program. You need code that keeps the data in the right shape, keeps track of the weights and bias to adjust, and applies updates in the right order.

  This lesson connects those pieces in PyTorch:

  1. Store inputs, targets and adjustable parameters in arrays that can hold fractions.
  2. Put a linear prediction rule and its adjustable numbers together.
  3. Measure errors and connect gradients to parameter updates.
  4. Repeat the complete calculation with fresh predictions and gradients.
knowledge_points:
  - id: ptb-tensors
    title: Give the numbers a shape
    explain: |
      **The question.** You want to apply the same calculation to several examples at once. How do you tell PyTorch which numbers belong to each example?

      **Picture it.** Imagine two counters showing 1 and 2. Put their readings in separate rows of a table, with one column for the reading; doubling each row produces another two-row table.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" aria-label="Two rows with readings 1 and 2 become readings 2 and 4 after multiplication by 2">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
          <text x="30" y="25">inputs: shape (2, 1)</text>
          <rect x="60" y="40" width="80" height="80" fill="#d4d4d4"/>
          <path d="M60 80 H140" stroke="#737373"/>
          <text x="100" y="66" text-anchor="middle">1</text><text x="100" y="106" text-anchor="middle">2</text>
          <path d="M160 80 H350 L340 74 M350 80 L340 86" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="2"/>
          <text x="240" y="65">× 2</text>
          <text x="365" y="25">outputs: shape (2, 1)</text>
          <rect x="400" y="40" width="80" height="80" fill="#d4d4d4"/>
          <path d="M400 80 H480" stroke="#737373"/>
          <text x="440" y="66" text-anchor="middle">2</text><text x="440" y="106" text-anchor="middle">4</text>
        </g>
      </svg>
      ```

      **The idea.** Keep the arrangement alongside the values. A **tensor** is an array of numbers; its **shape** lists the size of each dimension. A tensor can be a single number, a vector, a matrix or an array with more dimensions.

      A **data type** specifies which kind of numbers an array stores: integers hold whole numbers, while floating-point numbers can also hold fractions, approximately. Use `dtype=torch.float32`, PyTorch's 32-bit floating-point type, for inputs, targets and parameters throughout this lesson. Parameters need floating-point storage because training nudges them by fractions, which integer storage cannot hold.

      For a table, shape `(2, 1)` means two rows and one column. In Python, `[[1.0], [2.0]]` preserves those rows; `[1.0, 2.0]` instead makes a vector of shape `(2,)`. For matrix multiplication with `@`, the left matrix's column count must equal the right matrix's row count; each left-hand row produces one result row.

      In `(2,)`, the comma marks Python's one-dimension shape notation; it does not add another dimension. Without the comma, `(2)` is just the number 2, not a shape.

      **Common confusion.** “Two numbers always have shape `(2,)`.” No: nesting decides the arrangement, not just the number of entries. A two-row table and a vector hold the same number of values but are not interchangeable shapes.
    worked: |
      **Worked example.** Double the two counter readings using a one-entry weight matrix.

      1. **Arrange the readings.** `x` has two rows and one column; `weight` has one row and one column.

         The `32` in `float32` means each stored number uses 32 bits, or binary digits, of memory. It specifies storage precision; you do not need to manipulate those bits to use the tensor.

         ```python
         import torch

         x = torch.tensor([[1.0], [2.0]], dtype=torch.float32)
         weight = torch.tensor([[2.0]], dtype=torch.float32)
         result = x @ weight
         print(tuple(x.shape), x.dtype)
         print(result.tolist())
         ```

         The output is `(2, 1) torch.float32`, then `[[2.0], [4.0]]`. You can print a tensor directly, but its display includes a `tensor(...)` wrapper; `.tolist()` gives plain Python lists and numbers that make these small results easier to read.

      2. **Check each row.** Each reading meets the same multiplier.

         $$1\times2=2.$$

         $$2\times2=4.$$

      **Compare cases.**

      | Python values | Tensor shape | Arrangement |
      | --- | --- | --- |
      | `2.0` | `()` | One number |
      | `[1.0, 2.0]` | `(2,)` | A vector |
      | `[[1.0], [2.0]]` | `(2, 1)` | Two rows, one column |
      | `[[1.0, 2.0]]` | `(1, 2)` | One row, two columns |

      **Where it shows up.** For house data, rows represent houses and columns represent features. Keeping that arrangement explicit prevents a calculation from mixing up houses and measurements.
    problems: [ptb-tensors-basics, ptb-tensors-why, ptb-tensor-complete, ptb-tensor-template, ptb-tensor-nesting, ptb-tensor-read, ptb-tensor-transfer]
  - id: ptb-linear
    title: Put the rule and its parameters together
    explain: |
      **The question.** Training must remember and change the weights used in a prediction. How do you keep the prediction rule and its adjustable numbers together?

      **Picture it.** A counter reading enters a box that doubles it and adds 1. The same box takes reading 1 to output 3 and reading 2 to output 5; it does not need a separate rule for each row.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" aria-label="Inputs 1 and 2 pass through the same rule, multiply by 2 then add 1, giving outputs 3 and 5">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
          <text x="25" y="45">input</text><text x="25" y="80">1</text><text x="25" y="115">2</text>
          <rect x="180" y="55" width="200" height="70" fill="#d4d4d4"/>
          <text x="280" y="85" text-anchor="middle">weight = 2</text><text x="280" y="110" text-anchor="middle">bias = 1</text>
          <path d="M65 90 H170 L160 84 M170 90 L160 96 M390 90 H480 L470 84 M480 90 L470 96" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="2"/>
          <text x="490" y="45">output</text><text x="490" y="80">3</text><text x="490" y="115">5</text>
        </g>
      </svg>
      ```

      **The idea.** Package a calculation with the parameters it uses. A **module** is a PyTorch object that computes outputs and keeps a record of its trainable tensors, called **registered parameters**. A linear module records its `weight` and `bias` tensors; `model.parameters()` supplies them to the optimiser, the tool that will update them.

      PyTorch's `torch.nn` sub-library, imported as `nn`, contains ready-made modules. `nn.Linear(1, 1)` takes one input feature and produces one output per row, using a weighted sum plus a bias. More generally, `nn.Linear(d, k)` takes `d` input features and produces `k` outputs; these are sizes, not parameter values.

      A module is called like a function: `model(x)` calculates outputs for input `x`. With `nn.Linear(1, 1)`, an input table of shape `(n, 1)` produces shape `(n, 1)`, where `n` counts rows. The weight shape is `(1, 1)`; the bias is a vector with one entry per output, so its shape is `(1,)`, not a row-and-column table.

      That single bias is added to every row's weighted sum, not assigned separately to each example. Outputs have a row dimension for examples; the shared bias does not.

      **Common confusion.** “`nn.Linear(1, 1)` sets the weight and bias to 1.” No: those arguments specify sizes. PyTorch supplies random starting values when you have not chosen any; they are starting guesses for training, not fitted answers.
    worked: |
      **Worked example.** Set up the doubling-and-offset rule, then call it on both readings.

      1. **Set known parameters.** Randomness is not required for this single linear rule; assigning known values lets you check its calculation exactly. Without these assignments, the starting values may differ between runs.

         `fill_` writes a value into every entry of an existing tensor; the trailing underscore means it changes that tensor in place rather than making a new one. Changing a tracked parameter during a recorded calculation could invalidate values needed for derivatives, so PyTorch blocks these in-place assignments while recording is enabled. `torch.no_grad()` disables recording for this setup block, keeping the assignments out of the calculation graph; later model calls can still record operations.

         ```python
         import torch
         from torch import nn

         model = nn.Linear(1, 1)
         with torch.no_grad():
             model.weight.fill_(2.0)
             model.bias.fill_(1.0)
         x = torch.tensor([[1.0], [2.0]])
         print(model(x).tolist())
         print(tuple(model.weight.shape), tuple(model.bias.shape))
         ```

         The output is `[[3.0], [5.0]]`, then `(1, 1) (1,)`.

      2. **Check the shared rule.** Apply the same weight and bias to each row.

         $$2(1)+1=3.$$

         $$2(2)+1=5.$$

      **Compare cases.**

      | Call | Input shape | Output shape |
      | --- | --- | --- |
      | `nn.Linear(1, 1)` | `(2, 1)` | `(2, 1)` |
      | `nn.Linear(2, 1)` | `(2, 2)` | `(2, 1)` |
      | `nn.Linear(1, 2)` | `(2, 1)` | `(2, 2)` |

      **Where it shows up.** `nn.Linear(3, 1)` can hold the house model's three feature weights and one bias. The prediction rule is unchanged; the module makes its parameters available for training.
    problems: [ptb-linear-basics, ptb-linear-why, ptb-linear-complete, ptb-linear-template, ptb-linear-sizes, ptb-linear-read, ptb-linear-transfer]
  - id: ptb-loss-optimizer
    title: Connect the loss gradient to an update
    explain: |
      **The question.** A recorded calculation can give you a gradient, but the number you are adjusting has not moved yet. What connects that gradient to an actual update?

      **Picture it.** You can adjust a dial currently reading 2 and want it to read 4. Its squared error is 4, its slope is -4, and subtracting one quarter of that slope moves the dial to 3.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" aria-label="A dial moves from 2 to 3 towards target 4, using slope minus 4 and learning rate one quarter">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
          <path d="M60 100 H500 M100 95 V105 M280 95 V105 M460 95 V105" stroke="#737373" fill="#171717" fill-opacity="0"/>
          <circle cx="100" cy="100" r="5" fill="#171717"/><circle cx="280" cy="100" r="5" fill="#10b981"/><circle cx="460" cy="100" r="5" fill="#171717"/>
          <path d="M100 70 H280 L270 64 M280 70 L270 76" fill="#171717" fill-opacity="0" stroke="#10b981" stroke-width="2"/>
          <text x="125" y="45">update: +1</text><text x="85" y="130">2</text><text x="265" y="130">3</text><text x="415" y="130">target: 4</text>
        </g>
      </svg>
      ```

      **The idea.** Separate measuring error, calculating slopes and moving parameters. A **loss function** maps predictions and targets to an error score; an **optimiser** applies a parameter-update rule using stored gradients. In PyTorch, `nn.MSELoss()` averages squared differences over all output entries, while `torch.optim.SGD` implements the gradient-descent update used here.

      Give SGD the tensors to adjust and a learning rate using `lr`, short for learning rate. `loss.backward()` puts each tracked parameter's derivative into storage attached to that tensor, accessed as `.grad`; for the dial tensor `w`, that is `w.grad`. `optimizer.step()` reads those gradients to change parameters.

      Backward adds contributions into `.grad`, allowing gradients from several calculation paths to combine. Before each independent update, `optimizer.zero_grad()` clears those stored contributions so old slopes do not enter the new update; on the first update there may be nothing to clear.

      **Common confusion.** “Calling `backward()` trains the model.” That is only half right: backward calculates and stores gradients, but leaves parameter values alone. The optimiser step is the separate operation that changes them.
    worked: |
      **Worked example.** Adjust the dial once towards 4 using learning rate 0.25.

      1. **Measure the error.** A one-entry mean squared error is just its squared difference.

         $$L=(2-4)^2=4.$$

         With several output entries, both the loss and its gradient follow the average, not the sum. Averaging divides both the total error and its slopes by the number of entries.

      2. **Find the slope.** Differentiate with respect to the dial value, called $w$.

         $$\frac{dL}{dw}=2(2-4)=-4.$$

      3. **Apply the update.** Subtract the scaled gradient.

         $$w_{\text{new}}=2-0.25(-4)=3.$$

         `w` is a tensor you create yourself, so enable tracking with `requires_grad=True`; module parameters already have it enabled. SGD accepts a collection because it can update many tensors: `[w]` supplies just the dial, while `model.parameters()` supplies all of a module's parameters.

         `.item()` turns a one-number tensor into a plain Python number, no longer connected to the graph. Use it to display results, but keep `loss` as a tensor for backward.

         If you replaced `loss` with `loss.item()`, `loss.backward()` would fail because a Python number has no backward method.

         For example, add two errors that both depend on `w`: each error supplies its slope contribution to `w.grad`. Those contributions belong together in one calculation. An old iteration's gradient belongs to a different calculation, so clear it before starting the next update.

         ```python
         import torch
         from torch import nn

         w = torch.tensor([2.0], requires_grad=True)
         target = torch.tensor([4.0])
         loss_fn = nn.MSELoss()
         optimizer = torch.optim.SGD([w], lr=0.25)
         optimizer.zero_grad()
         loss = loss_fn(w, target)
         loss.backward()
         print(loss.item(), w.grad.item(), w.item())
         optimizer.step()
         print(w.item())
         ```

         The first printed line, `4.0 -4.0 2.0`, shows loss, stored gradient and unchanged dial value, in that order. Only after `optimizer.step()` does the second print show the updated dial value, `3.0`.

      **Compare cases.** Starting from the same dial value 2 and gradient -4:

      | Learning rate | New dial value | New squared error |
      | --- | --- | --- |
      | `0.125` | 2.5 | 2.25 |
      | `0.25` | 3 | 1 |
      | `0.5` | 4 | 0 |

      **Where it shows up.** For a house model, pass `model.parameters()` to SGD instead of `[w]`. The loss measures prediction errors, backward calculates the weight and bias slopes, and SGD updates those parameters.
    problems: [ptb-loss-basics, ptb-loss-why, ptb-loss-complete, ptb-loss-template, ptb-loss-backward, ptb-loss-read, ptb-loss-transfer]
  - id: ptb-training-loop
    title: Repeat with fresh values
    explain: |
      **The question.** One update changes the model, so the next prediction and gradient will differ. How do you repeat training without accidentally using old information?

      **Picture it.** Start a one-input rule with weight 1 and bias 0. For input 1 and target 3, one update gives prediction 2; the next gives 2.5, closer to the target.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 155" aria-label="Fresh predictions move from 1 to 2 to 2.5 towards target 3 over two training updates">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
          <path d="M40 100 H520" stroke="#737373"/>
          <circle cx="80" cy="100" r="5" fill="#171717"/><circle cx="280" cy="100" r="5" fill="#10b981"/><circle cx="380" cy="100" r="5" fill="#10b981"/>
          <path d="M80 65 H280 L270 59 M280 65 L270 71 M280 65 H380 L370 59 M380 65 L370 71" fill="#171717" fill-opacity="0" stroke="#10b981" stroke-width="2"/>
          <path d="M480 90 V110" stroke="#171717"/>
          <text x="65" y="130">1</text><text x="265" y="130">2</text><text x="365" y="130">2.5</text><text x="435" y="130">target: 3</text>
          <text x="115" y="40">first update</text><text x="300" y="40">second</text>
        </g>
      </svg>
      ```

      **The idea.** Each update must use the current model's errors and slopes. A **training loop** repeatedly calculates predictions, measures loss, calculates gradients and updates parameters. In PyTorch, clear stored gradients before each backward calculation with `optimizer.zero_grad()`; otherwise backward adds new slopes to old ones.

      Use this order: clear gradients, call the model, calculate loss, call backward, then step. Each prediction call, `model(x)`, builds a new graph using the current parameters. By default, backward releases that graph's saved intermediate values after using them, so calculate a new prediction and loss rather than calling backward again on the old loss.

      For one output per row, predictions and targets should both have shape `(n, 1)`, where `n` counts examples: each predicted entry then compares with its corresponding target.

      **Common confusion.** “After `step()`, the old `loss` tells me the new model's error.” No: it still contains the result calculated before that update. Call the model again and calculate another loss to measure the changed parameters; `torch.no_grad()` prevents that inspection call from recording operations involving the tracked parameters.
    worked: |
      **Worked example.** Train the one-input rule twice using learning rate 0.125. Both weight and bias are adjustable.

      1. **Calculate the first gradients.** $e$ denotes prediction minus target. The weight slope includes a factor of the input while the bias slope does not; because this input is 1, the two slopes are equal.

         $$\hat y=1(1)+0=1.$$

         $$e=1-3=-2.$$

         $$\frac{\partial L}{\partial w}=2(-2)(1)=-4.$$

         $$\frac{\partial L}{\partial b}=2(-2)=-4.$$

      2. **Update both parameters.**

         $$w_{\text{new}}=1-0.125(-4)=1.5.$$

         $$b_{\text{new}}=0-0.125(-4)=0.5.$$

      3. **Repeat from fresh predictions.** Print `loss` before the step, then calculate and print `new_loss` afterwards using the changed model. The labels show when each measurement was taken.

         `zero_()` fills the existing bias tensor with zeros; like `fill_`, its underscore means it changes the tensor in place. This sets the starting bias, whereas `optimizer.zero_grad()` clears gradient storage without changing the bias value.

         Saved intermediate values are results of forward operations that backward needs, such as the prediction used to find a squared-error slope. Backward releases them to save memory; the next prediction call builds the next calculation's graph and values. Inspection needs no backward pass, so `no_grad` avoids saving those unused values.

         ```python
         import torch
         from torch import nn

         x = torch.tensor([[1.0]])
         target = torch.tensor([[3.0]])
         model = nn.Linear(1, 1)
         with torch.no_grad():
             model.weight.fill_(1.0)
             model.bias.zero_()
         loss_fn = nn.MSELoss()
         optimizer = torch.optim.SGD(model.parameters(), lr=0.125)
         for _ in range(2):
             optimizer.zero_grad()
             prediction = model(x)
             loss = loss_fn(prediction, target)
             loss.backward()
             print("before:", loss.item())
             optimizer.step()
             with torch.no_grad():
                 new_loss = loss_fn(model(x), target)
             print("after:", new_loss.item())
         ```

         The first iteration prints `before: 4.0`, then `after: 1.0` on the next line. The second prints `before: 1.0`, then `after: 0.25`, because it starts from the parameters left by the first update.

      **Compare cases.** These are fresh measurements after each number of updates.

      | Updates | Weight | Bias | Prediction | Loss |
      | --- | --- | --- | --- | --- |
      | 0 | 1 | 0 | 1 | 4 |
      | 1 | 1.5 | 0.5 | 2 | 1 |
      | 2 | 1.75 | 0.75 | 2.5 | 0.25 |

      **Where it shows up.** For house-price training, replace the small input and target tables with house measurements and sale prices. The same five operations connect data, model, loss, gradients and parameter updates.
    problems: [ptb-loop-basics, ptb-loop-why, ptb-loop-complete, ptb-loop-template, ptb-loop-stale, ptb-loop-read, ptb-loop-transfer]
final: ptb-explain-loop
summary: |
  - A tensor keeps numbers in an explicit shape and data type, so rows and features stay distinct.
  - A linear module applies shared weights and biases to each row and registers its trainable parameters.
  - The loss scores errors, backward stores gradients, and the optimiser changes parameters.
  - Each loop clears old gradients and calculates fresh predictions, loss and gradients before updating again.

  **Next:** Use this loop to fit a linear model from examples rather than assigning its final weights yourself.
