        ptb-linear-complete,
        ptb-linear-template,
        ptb-linear-sizes,
        ptb-linear-read,
        ptb-linear-transfer,
      ]
  - id: ptb-loss-optimizer
    title: "Measure the loss and update once"
    tldr: |
      - A loss function scores how far predictions are from their targets.
      - The backward call stores each parameter's loss slope.
      - The optimiser uses those slopes to update the weights and bias.
    explain: |
      ### Starting from a wrong guess

      Now let's train, starting at weight $1$ and bias $0$, so the model predicts $1$ and $2$ instead of $3$ and $5$. An update measures the loss, finds each slope and moves each parameter against it, and PyTorch splits that between a loss function, `loss.backward()` and an optimiser, as the picture shows.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" aria-label="One update in three stages. First the loss is 6.5 with weight 1 and bias 0. A blue arrow labelled loss.backward() leads to the second stage, where the slopes -8 and -5 are stored in .grad and the weight and bias are unchanged. An orange arrow labelled optimizer.step() leads to the third stage, weight 1.8 and bias 0.5">
      <defs><marker id="ptb3-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="ptb3-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
      <rect x="20" y="10" width="260" height="62" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <text x="150" y="36" text-anchor="middle">loss = 6.5</text>
      <text x="150" y="59" text-anchor="middle" fill="#737373">weight 1, bias 0</text>
      <path d="M150 74 V112" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#ptb3-blue)"/>
      <text x="170" y="98" fill="#3b82f6">loss.backward() stores the slopes</text>
      <rect x="20" y="118" width="260" height="62" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <text x="150" y="144" text-anchor="middle" fill="#3b82f6">.grad: weight −8, bias −5</text>
      <text x="150" y="167" text-anchor="middle" fill="#737373">weight 1, bias 0 (unchanged)</text>
      <path d="M150 182 V220" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ptb3-amber)"/>
      <text x="170" y="206" fill="#f59e0b">optimizer.step() moves the parameters</text>
      <rect x="20" y="226" width="260" height="62" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <text x="150" y="252" text-anchor="middle">weight 1.8, bias 0.5</text>
      <text x="150" y="275" text-anchor="middle" fill="#737373">new loss 0.65</text>
      </g>
      </svg>
      ```

      ### The loss function and the optimiser

      A **loss function** scores how wrong predictions are. `nn.MSELoss()` gives mean squared error: square each error and average the squares.

      $$
      \begin{aligned}
      e_1&=1-3=-2 &&\text{first prediction minus target}\\
      e_2&=2-5=-3 &&\text{second prediction minus target}\\
      L&=\frac{(-2)^2+(-3)^2}{2}=6.5 &&\text{average squared errors}
      \end{aligned}
      $$

      Calling `loss.backward()` then works out the loss's slope for every parameter and stores it in that parameter's `.grad`. Here the weight's slope is $-8$ and the bias's is $-5$; the worked example below finds them by hand.

      An **optimiser** is the object that updates the parameters from their stored slopes. `torch.optim.SGD` makes the gradient-descent update, $w_{\text{new}}=w-\eta\,\partial L/\partial w$; its name means "stochastic gradient descent", which with the whole dataset each pass, as here, is plain gradient descent. We give it `model.parameters()` and the learning rate as `lr`, and each call to `optimizer.step()` moves every parameter once.

      ### Who changes what

      Be careful not to think that `loss.backward()` trains the model. It only stores slopes; the weight stays at $1$ until `optimizer.step()` moves it. And since backward adds to `.grad`, each update starts with `optimizer.zero_grad()` to clear slopes left by an earlier update.
    worked: |
      Let's work out the update by hand, from $w=1$ and $b=0$ with learning rate $\eta=0.1$.

      1. **Find the slopes.** The errors are $-2$ and $-3$. The gradient-descent lesson gave one example's weight slope as twice the error times the input, and its bias slope as twice the error. Here we average them over the two examples.
         $$\frac{\partial L}{\partial w}=\frac{2(-2)(1)+2(-3)(2)}{2}=-8,\qquad\frac{\partial L}{\partial b}=\frac{2(-2)+2(-3)}{2}=-5.$$

      2. **Update both.** Each parameter moves by $\eta$ times its slope, against the slope.
         $$w=1-0.1(-8)=1.8,\qquad b=0-0.1(-5)=0.5.$$

      Check the updated model to see how the loss changes:

      $$
      \begin{aligned}
      \hat y_1&=1.8(1)+0.5=2.3 &&\text{first prediction}\\
      \hat y_2&=1.8(2)+0.5=4.1 &&\text{second prediction}\\
      e_1&=2.3-3=-0.7 &&\text{first error}\\
      e_2&=4.1-5=-0.9 &&\text{second error}\\
      L&=\frac{(-0.7)^2+(-0.9)^2}{2}=0.65 &&\text{average squared errors}
      \end{aligned}
      $$

      Here is the same update in PyTorch. `.item()` turns a one-number tensor into a Python number, and `round` hides tiny rounding errors.

      ```python
      import torch
      from torch import nn

      x = torch.tensor([[1.0], [2.0]])
      y = torch.tensor([[3.0], [5.0]])
      model = nn.Linear(1, 1)
      with torch.no_grad():
          model.weight.fill_(1.0)
          model.bias.fill_(0.0)
      loss_fn = nn.MSELoss()
      optimizer = torch.optim.SGD(model.parameters(), lr=0.1)

      optimizer.zero_grad()
      loss = loss_fn(model(x), y)
      loss.backward()
      print(loss.item(), model.weight.grad.item(), model.bias.grad.item())
      optimizer.step()
      print(round(model.weight.item(), 2), round(model.bias.item(), 2))
      # 6.5 -8.0 -5.0
      # 1.8 0.5
      ```
    problems:
      [
        ptb-loss-basics,
        ptb-loss-why,
        ptb-loss-complete,
        ptb-loss-template,
        ptb-loss-backward,
        ptb-loss-read,
        ptb-loss-transfer,
      ]
  - id: ptb-training-loop
    title: "Repeat the update in a loop"
    tldr: |
      - Each update changes the parameters, so the next pass needs fresh predictions and slopes.
      - A training loop clears old slopes, predicts, measures loss, finds slopes and updates parameters.
      - Repeating this sequence lets the model learn the rule from the data.
    explain: |
      ### Doing it again and again

      One update took the loss to $0.65$, but $1.8$ and $0.5$ aren't yet $2$ and $1$. So we repeat it, each pass starting from fresh predictions, because the slopes depend on the current weight and bias.

      A **training loop** in PyTorch is a `for` loop whose body is the update from step 3, always in this order:

      1. `optimizer.zero_grad()` clears old slopes.
      2. `model(x)` predicts.
      3. `loss_fn` measures the loss.
      4. `loss.backward()` stores the new slopes.
      5. `optimizer.step()` updates the parameters.

      ### Watching the loss fall

      With learning rate $0.1$:

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" aria-label="Green bars of the loss at the start of passes 1, 2 and 3: 6.5, 0.65 and 0.07. After 1000 passes the weight is 2.00, the bias is 1.00 and the loss is 0.00">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
      <path d="M40 40 V250 H330" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
      <rect x="70" y="50" width="50" height="200" fill="#10b981"/>
      <rect x="160" y="230" width="50" height="20" fill="#10b981"/>
      <rect x="250" y="247.85" width="50" height="2.15" fill="#10b981"/>
      <text x="95" y="42" text-anchor="middle">6.5</text>
      <text x="185" y="222" text-anchor="middle">0.65</text>
      <text x="275" y="240" text-anchor="middle">0.07</text>
      <text x="95" y="270" text-anchor="middle" fill="#737373">1</text>
      <text x="185" y="270" text-anchor="middle" fill="#737373">2</text>
      <text x="275" y="270" text-anchor="middle" fill="#737373">3</text>
      <text x="185" y="288" text-anchor="middle" fill="#737373">pass</text>
      <text x="40" y="25">loss at the start of each pass</text>
      <text x="360" y="150">after 1000 passes:</text>
      <text x="360" y="175" fill="#737373">weight 2.00, bias 1.00</text>
      <text x="360" y="200" fill="#737373">loss 0.00</text>
      </g>
      </svg>
      ```

      The weight goes $1$, $1.8$, $2.05$, overshooting $2$, then settles. After 1000 passes the loop has found $y=2x+1$ from the data alone.

      ### Two easy mistakes

      Be careful not to leave out `optimizer.zero_grad()`. The second pass would then store $-8+(-2.5)=-10.5$ for the weight instead of its slope, $-2.5$ (worked out below), and step far too far.

      Be careful, too, with the `loss` you print: it was measured before `optimizer.step()`, so it describes the old parameters. To judge the updated model, compute a new loss. Inside `torch.no_grad()` the answer is the same, but PyTorch skips recording work we'll never call backward on.
    worked: |
      Let's run pass 2 by hand, from $w=1.8$, $b=0.5$ and $\eta=0.1$.

      1. **Predict.** Step 3 found predictions $2.3$ and $4.1$, so errors $-0.7$ and $-0.9$.

      2. **Find fresh slopes.** Use the new errors to replace the earlier slopes $-8$ and $-5$.
         $$\frac{\partial L}{\partial w}=\frac{2(-0.7)(1)+2(-0.9)(2)}{2}=-2.5,\qquad\frac{\partial L}{\partial b}=\frac{2(-0.7)+2(-0.9)}{2}=-1.6.$$

      3. **Update.** Each parameter moves against its new slope.
         $$w=1.8-0.1(-2.5)=2.05,\qquad b=0.5-0.1(-1.6)=0.66.$$

      Here is the loop in PyTorch. It runs after step 3's lines from `import torch` through `optimizer = ...`, so it starts at weight $1$ and bias $0$. `range(1000)` runs it 1000 times, counting `i` from $0$, and the `if` prints the first three passes.

      ```python
      for i in range(1000):
          optimizer.zero_grad()
          loss = loss_fn(model(x), y)
          loss.backward()
          optimizer.step()
          if i < 3:
              print(i + 1, round(loss.item(), 2))

      with torch.no_grad():
          new_loss = loss_fn(model(x), y)
      print(round(new_loss.item(), 4), round(model.weight.item(), 2), round(model.bias.item(), 2))
      # 1 6.5
      # 2 0.65
      # 3 0.07
      # 0.0 2.0 1.0
      ```

      ### Training mode and evaluation mode

      Before we leave the loop, one setting matters for the larger models in later lessons.

      A **mode** is a setting stored in the model. A PyTorch model starts in **training mode**, the setting used while it learns. `model.train()` selects training mode and `model.eval()` selects **evaluation mode**.

      Some larger models use **dropout**, which zeroes a random share of the numbers flowing through the model on each call in training mode. Even with the same `x` and the same weights, predictions can change from call to call, so the loss can change too. Our `nn.Linear` model has no dropout, so the code above is still correct.

      When checking the model, we want dropout off and don't need to record calculations for slopes. `torch.no_grad()` alone leaves dropout on in training mode, so we also call `model.eval()`.

      ```python
      model.eval()
      with torch.no_grad():
          loss = loss_fn(model(x), y)
      model.train()
      ```

      `model.eval()` turns dropout off for the loss measurement, and `model.train()` switches back to training mode before the next training steps. The `torch.no_grad()` block stops recording the calculations needed to find slopes.

      As a quick check, run this code twice with the same `x`, `y` and weights and check that the losses agree.
    problems:
      [
        ptb-loop-basics,
        ptb-loop-why,
        ptb-loop-complete,
        ptb-loop-template,
        ptb-loop-stale,
        ptb-loop-read,
        ptb-loop-transfer,
        ptb-loop-dropout-mode,
      ]
final: ptb-explain-loop
summary: |
  - A tensor is an array of numbers with a shape and a data type; a dataset is one row per example.
  - `nn.Linear(inputs, outputs)` computes $\hat y=wx+b$ for every row and holds $w$ and $b$ as parameters.
  - `nn.MSELoss()` measures the loss, `loss.backward()` stores slopes, and only `optimizer.step()` updates.
  - A training loop repeats `zero_grad`, predict, loss, `backward` and `step`, so each pass uses fresh slopes.
    Check models with dropout using `model.eval()` and `torch.no_grad()` together.

  **Next:** Logistic regression predicts yes or no, and trains with this same loop.
