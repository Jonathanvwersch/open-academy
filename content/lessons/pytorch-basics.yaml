concept: pytorch-basics
version: 3
objective: |
  **Goal:** write a PyTorch training loop from memory that fits a linear model's weight and bias, and say what each line of it does.
recap:
  - concept: autodiff
    text: "PyTorch stores numbers in tensors. For each tensor that needs gradients, `loss.backward()` adds the loss's slope to its `.grad`, without changing the tensor."
  - concept: gradient-descent
    text: "Gradient descent moves each parameter against its slope, $w_{\\text{new}}=w-\\eta\\,\\partial L/\\partial w$, where the learning rate $\\eta$ sets the step. A training loop repeats this, finding fresh slopes each pass."
where_this_fits: |
  ### What is PyTorch?

  PyTorch is a Python library for building and training machine-learning models. It stores data in tensors, and it gives us ready-made models, loss functions that score predictions, and optimisers that apply the gradient-descent update.

  Why do we need it? Autodiff finds the slopes, but a training program must also hold the data and track and update every weight and bias. With thousands of parameters, PyTorch's ready-made pieces do that bookkeeping for us.
knowledge_points:
  - id: ptb-tensors
    title: "Store data in tensors"
    tldr: |
      - PyTorch stores numbers in arrays called tensors.
      - A tensor's shape tells us how its numbers are arranged.
      - Putting one example in each row keeps the inputs and targets matched for training.
    explain: |
      ### A tiny dataset

      Let's use tensors to hold a dataset of two examples, inputs $x$ of $1$ and $2$ with targets $y$ of $3$ and $5$. They follow $y=2x+1$, but we'll pretend we don't know that and see whether training finds weight $2$ and bias $1$ by itself.

      ### One row per example

      We store the inputs as a table with one row per example and one column per input, and the targets the same way.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" aria-label="Two tables with one row per example. The inputs x have shape (2, 1), with rows 1 and 2. The targets y have shape (2, 1), with rows 3 and 5">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
      <text x="200" y="30" text-anchor="middle">inputs x</text>
      <text x="200" y="50" text-anchor="middle" fill="#737373">shape (2, 1)</text>
      <text x="360" y="30" text-anchor="middle">targets y</text>
      <text x="360" y="50" text-anchor="middle" fill="#737373">shape (2, 1)</text>
      <rect x="160" y="65" width="80" height="100" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <path d="M160 115 H240" stroke="#737373" stroke-width="1.5"/>
      <rect x="320" y="65" width="80" height="100" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <path d="M320 115 H400" stroke="#737373" stroke-width="1.5"/>
      <text x="200" y="96" text-anchor="middle">1</text>
      <text x="200" y="146" text-anchor="middle">2</text>
      <text x="360" y="96" text-anchor="middle">3</text>
      <text x="360" y="146" text-anchor="middle">5</text>
      <text x="30" y="96" fill="#737373">example 1</text>
      <text x="30" y="146" fill="#737373">example 2</text>
      </g>
      </svg>
      ```

      A **tensor** is an array of numbers with any number of dimensions: a single number, a list, a table or more. Its **shape** lists how long each dimension is, so our input table has shape `(2, 1)`, two rows and one column. In Python we write it as a list of rows, `[[1.0], [2.0]]`, where each inner list is one row.

      ### The brackets decide the shape

      The same two numbers can make different shapes:

      - `[[1.0], [2.0]]` has shape `(2, 1)`: two examples with one input each.
      - `[[1.0, 2.0]]` has shape `(1, 2)`: one example with two inputs.
      - `[1.0, 2.0]` has shape `(2,)`: a plain list with no rows. The comma is just how Python writes a shape with one dimension.

      Be careful not to treat these as the same because they hold the same numbers. PyTorch lines the list up against every row, so adding the plain list `[1.0, 2.0]` to our `(2, 1)` table gives a `(2, 2)` table, `[[2.0, 3.0], [3.0, 4.0]]`.

      Each tensor also has a **data type**, the kind of number it stores. Training nudges weights by small amounts such as $0.1$, so we store decimals, and `torch.float32` is PyTorch's standard decimal type.
    worked: |
      Let's put our dataset into tensors and check that the rule $y=2x+1$ really gives the targets.

      1. **Build the tables.** Each is a list of rows, so both get shape `(2, 1)`. We name `dtype=torch.float32` on `x` to show it, but `y` and `w` get it too, since `3.0` has a decimal point.

      2. **Apply the rule to every row.** `x @ w` is matrix multiplication: it multiplies each input in a row by its own weight and adds the products, one answer per row. Both sides must be tables, so our weight is the `(1, 1)` table `[[2.0]]`. Adding one number, `+ 1`, safely adds it to every entry.
         $$2\times1+1=3,\qquad 2\times2+1=5.$$

      3. **Run it.** `.tolist()` turns a tensor into plain Python lists for printing.

      ```python
      import torch

      x = torch.tensor([[1.0], [2.0]], dtype=torch.float32)
      y = torch.tensor([[3.0], [5.0]])
      w = torch.tensor([[2.0]])
      print(x.shape, x.dtype)
      print((x @ w + 1).tolist())
      # torch.Size([2, 1]) torch.float32
      # [[3.0], [5.0]]
      ```

      Both rows match their targets, so weight $2$ and bias $1$ are what we want training to find.
    problems:
      [
        ptb-tensors-basics,
        ptb-tensors-why,
        ptb-tensor-complete,
        ptb-tensor-template,
        ptb-tensor-nesting,
        ptb-tensor-read,
        ptb-tensor-transfer,
      ]
  - id: ptb-linear
    title: "Build a linear model"
    tldr: |
      - Training needs a way to find the weights and biases it should change.
      - A PyTorch module keeps these parameters together with their calculation.
      - A linear module applies the same weights and bias to every example row.
    explain: |
      ### From a formula to a module

      In the first step we typed the weight and bias into `x @ w + 1` by hand. Training has to change those numbers, so PyTorch must know which tensors they are and find their slopes.

      A **module** is a PyTorch object that does a calculation and keeps track of the numbers training will adjust, called its **parameters**. Each parameter is a tensor that needs gradients. Ready-made modules live in `torch.nn`, which we import as `nn`. The one we need is `nn.Linear`, which computes the linear model $\hat y=wx+b$ for every row of its input, where $\hat y$ is the prediction, $w$ the weight and $b$ the bias. It's our `x @ w + 1`, with its own weight and bias.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" aria-label="Inputs 1 and 2 go into one linear module with weight 2 and bias 1, which gives outputs 3 and 5, the same rule used on both rows">
      <defs><marker id="ptb2-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
      <text x="45" y="35" text-anchor="middle">input</text><text x="45" y="80" text-anchor="middle">1</text><text x="45" y="120" text-anchor="middle">2</text>
      <rect x="170" y="50" width="220" height="90" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <text x="280" y="80" text-anchor="middle">nn.Linear(1, 1)</text>
      <text x="280" y="105" text-anchor="middle" fill="#737373">weight 2, bias 1</text>
      <text x="280" y="127" text-anchor="middle" fill="#737373">2 × input + 1</text>
      <path d="M75 95 H162" stroke="#737373" stroke-width="2" marker-end="url(#ptb2-arrow)"/>
      <path d="M398 95 H485" stroke="#737373" stroke-width="2" marker-end="url(#ptb2-arrow)"/>
      <text x="515" y="35" text-anchor="middle">output</text><text x="515" y="80" text-anchor="middle">3</text><text x="515" y="120" text-anchor="middle">5</text>
      </g>
      </svg>
      ```

      We call a module like a function: `model(x)` gives a prediction for every row of `x`, and `model.parameters()` hands `model.weight` and `model.bias` to the optimiser, the object that will update them, which step 3 introduces.

      ### What the two sizes mean

      We create our module with `nn.Linear(1, 1)`. The first number is how many inputs each example has, and the second is how many outputs we want per example. So `nn.Linear(2, 1)` turns a `(3, 2)` table, three examples with two inputs each, into a `(3, 1)` table of predictions.

      The number of examples never appears in `nn.Linear`: however many rows come in, the module uses the same weights and bias on each, giving one output row per input row.

      Be careful not to read `nn.Linear(1, 1)` as "weight 1 and bias 1". Those numbers are sizes; PyTorch starts the weight and bias at small random values.
    worked: |
      Let's build `nn.Linear(1, 1)`, set weight $2$ and bias $1$ by hand, and check it gives the first step's predictions.

      1. **Set the weight and bias.** `fill_(2.0)` writes $2$ into every entry; the trailing underscore means it changes the tensor itself. As we saw in the autodiff lesson, PyTorch records every calculation on a tensor that needs gradients, and it refuses to overwrite one while recording. So we edit inside `with torch.no_grad():`, which pauses recording for the indented lines.

      2. **Predict.** The same weight and bias apply to each row, giving $3$ and $5$.

      ```python
      import torch
      from torch import nn

      x = torch.tensor([[1.0], [2.0]])
      model = nn.Linear(1, 1)
      with torch.no_grad():
          model.weight.fill_(2.0)
          model.bias.fill_(1.0)
      print(model(x).tolist())
      # [[3.0], [5.0]]
      ```

      The weight and bias now belong to the module, ready to be trained.
    problems:
      [
        ptb-linear-basics,
