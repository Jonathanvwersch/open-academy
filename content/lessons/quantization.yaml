  - id: qz-quality
    title: "Check whether the quantised model got worse"
    explain: |
      ### Why we have to measure

      Quantising adds a small rounding error to billions of numbers. The errors add up through the model's 32 layers, and we can't tell from them alone whether the answers changed. So we run the original 16-bit model and the quantised model on the same tests and compare.

      ### Loss on held-out text

      The first test is the language-modelling loss. For each token of some text, the model gives a probability $p$ to the token that really came next, and the cross-entropy loss for that token is $-\ln p$, using the natural log. We average it over every token. A worse model gives the true tokens lower probabilities, so its loss is higher.

      The text must be held out, meaning it wasn't used to train the model or choose the scales. Otherwise the test is too easy.

      Many papers report perplexity in place of the loss. Perplexity is $e$ raised to the average loss:

      $$\text{perplexity}=e^{\text{loss}}.$$

      You can read it as the number of tokens the model is choosing between. A model that gave every true token probability $1/8$ would have loss $\ln8$ and perplexity $8$, as if it picked evenly among 8 tokens. Lower is better for both.

      ### Tests on real tasks

      The loss is an average over ordinary text. It can barely move while a skill that few tokens depend on gets much worse, such as arithmetic, code, long prompts or a language that is rare in the text. So we also run the two models on tasks the assistant's users care about, and compare their scores. Both get the same prompts and the same settings, for example always picking the most likely next token. Use enough examples that a difference isn't just luck. With a few hundred problems, a drop of one or two percentage points, say from 80% to 79%, can easily be luck.

      If both checks show only a small drop that is acceptable for the product, we ship the quantised model. If a task gets clearly worse, we can try a finer scale, such as one per row or per group, or keep some layers at 16 bits. To find which layers to keep, quantise one layer at a time and see which hurts the score most.
    worked: |
      We quantise the assistant's Llama 3 8B to INT4 and test both models. On the same held-out text, the 16-bit model's average loss is $2.00$ and the INT4 model's is $2.08$. On 500 maths word problems, the 16-bit model solves 400 and the INT4 model solves 360. These numbers are made up for practice.

      1. **Turn each loss into perplexity.** We raise $e$ to each loss.
         $$e^{2.00}\approx7.39,\qquad e^{2.08}\approx8.00$$

      2. **Compare the perplexities.** The INT4 model's perplexity is about $8.00/7.39\approx1.08$ times as large, about 8% higher. It's as if it chose among 8 tokens where the 16-bit model chose among about 7.4.

      3. **Turn the task counts into accuracy.** We divide each count by 500.
         $$400/500=80\%,\qquad360/500=72\%$$

      4. **Compare the accuracies.** The score fell from 80% to 72%. We call that a drop of 8 percentage points, because we subtract the two percentages. With 500 problems, luck alone usually moves a score by about 2 percentage points, so a drop of 8 is real.

      The loss rose by only $0.08$, but the maths score fell clearly. If the assistant's users ask maths questions, this INT4 model isn't good enough as it is.
