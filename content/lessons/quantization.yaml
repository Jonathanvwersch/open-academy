      <rect x="226" y="196" width="22" height="28" fill="#f59e0b"/>
      <rect x="250" y="196" width="22" height="28" fill="#f59e0b"/>
      <rect x="274" y="196" width="22" height="28" fill="#f59e0b"/>
      <rect x="298" y="196" width="22" height="28" fill="#f59e0b"/>
      <text x="330" y="215">-128 to 127</text>
      <text x="120" y="267" text-anchor="end">INT4</text>
      <rect x="130" y="248" width="22" height="28" fill="#f59e0b"/>
      <rect x="154" y="248" width="22" height="28" fill="#f59e0b"/>
      <rect x="178" y="248" width="22" height="28" fill="#f59e0b"/>
      <rect x="202" y="248" width="22" height="28" fill="#f59e0b"/>
      <text x="234" y="267">-8 to 7</text>
      <rect x="130" y="310" width="14" height="14" fill="#737373"/><text x="150" y="322">sign</text>
      <rect x="210" y="310" width="14" height="14" fill="#3b82f6"/><text x="230" y="322">exponent</text>
      <rect x="320" y="310" width="14" height="14" fill="#10b981"/><text x="340" y="322">mantissa</text>
      <rect x="430" y="310" width="14" height="14" fill="#f59e0b"/><text x="450" y="322">integer</text>
      </g>
      </svg>
      ```

      FP32 has 8 exponent and 23 mantissa bits. FP16 and BF16 (brain floating point) use 2 bytes. BF16 keeps FP32's 8 exponent bits, so it covers the same huge range with coarser steps. FP16 has only 5 exponent bits, so a value above 65,504 overflows and becomes infinity. FP8 uses 1 byte. Its names count the bits: E4M3 has 4 exponent (E) and 3 mantissa (M) bits.

      Floating point copes with very different sizes inside a group, so FP8 still uses a scale but tolerates a rough one. That suits activations, which change with every prompt. Integers need a careful scale per group, which is easiest for fixed weights.

      ### What we quantise

      In **weight-only** quantisation we store the weights in INT8 or INT4 and keep the activations at 16 bits. The GPU reads the small weights, turns them back into 16-bit numbers in on-chip memory right before use, and does 16-bit maths. Decode gets faster because less is read. Prefill doesn't get faster, because its maths is unchanged.

      In **weight-and-activation** quantisation, both inputs of each matrix multiply are 8-bit, for example FP8 or INT8, and the GPU does 8-bit maths. On the H100, FP8 maths runs at about twice the 16-bit rate. So prefill can speed up too. So can decode with a large batch, because each weight read is used for every request, giving more maths per byte.

      Activation scales are either measured as the model runs, or chosen in advance from calibration data, a small sample of text passed through the model to record typical values. A value bigger than any seen in calibration gets clamped. Activations have more outliers, so this mode is harder.
    worked: |
      The assistant gets a prompt of 1,000 tokens and then writes a reply one token at a time, with one request at a time. Let's compare two common choices on this GPU: INT4 weight-only, which gives the smallest weights, and FP8 weight-and-activation, which gives faster maths. We round the H100 to 1,000 TFLOP/s of 16-bit maths and 2,000 TFLOP/s of FP8 maths.

      1. **Count the prefill maths.** Each of the 1,000 tokens meets each weight in one multiply-add, which is 2 FLOPs. We count only these, because they are most of the work.
         $$2\times8\times10^9\times1000=1.6\times10^{13}\text{ FLOPs}$$

      2. **Time the prefill for INT4 weight-only.** The maths is still 16-bit. We leave out the small cost of turning INT4 weights back into 16 bits.
         $$\frac{1.6\times10^{13}}{1000\times10^{12}}=0.016\text{ s}=16\text{ ms}$$

      3. **Time the prefill for FP8.** The maths runs at twice the rate.
         $$\frac{1.6\times10^{13}}{2000\times10^{12}}=0.008\text{ s}=8\text{ ms}$$

      4. **Time one decode step for each.** Each decode step reads all the weights once. That's 4 GB for INT4 and 8 GB for FP8. For INT4 we again leave out the cost of turning the weights back into 16 bits.
         $$\frac{4\times10^9}{3.35\times10^{12}}\approx1.2\text{ ms},\qquad\frac{8\times10^9}{3.35\times10^{12}}\approx2.4\text{ ms}$$

      FP8 saves 8 ms once per prompt, and INT4 saves about 1.2 ms on every reply token. So INT4 is faster overall once the reply is longer than about $8/1.2\approx7$ tokens, which almost every chat reply is. FP8 would win for long prompts with very short replies, such as sorting documents into a few labels. This compares speed only. The next step checks whether quality survives.
    problems:
