summary: |
  - Quantisation stores numbers with fewer bits. Llama 3 8B's weights take 16 GB at 16 bits, 8 GB at INT8 and 4 GB at INT4, and decode gets faster in proportion because it reads every weight for each token.
  - INT8 quantisation uses one scale $s=\max|x|/127$ per group, stores $q=\text{round}(x/s)$ clamped to $[-127,127]$, and dequantises to $q\cdot s$, with an error of at most $s/2$ that grows when an outlier makes $s$ large.
  - Weight-only quantisation speeds up decode by reading fewer bytes, and weight-and-activation quantisation with FP8 or INT8 also uses faster 8-bit maths, which helps prefill.
  - We check quality by comparing the quantised and 16-bit models on held-out loss or perplexity, $e^{\text{loss}}$, and on the real tasks users care about.

  **Next:** speculative decoding, which makes decode faster by drafting several tokens cheaply and checking them all in one pass of the big model.
