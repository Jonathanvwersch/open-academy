      In an 8-bit image, each brightness is a whole number from 0 to 255. Eight bits make one byte. Each bit has two possible values, so a byte can store $2^8=256$ brightnesses. We call this format **uint8**, short for unsigned 8-bit integer. Unsigned means that none of the numbers are negative.

      ### Height comes first

      An **array** is a grid of numbers. An **axis** is one way to count positions in that grid. A matrix has two axes: one counts rows from top to bottom, and the other counts columns from left to right. Write height $H$ for the row count and width $W$ for the column count.

      $$\text{shape}=(H,W),\qquad\text{pixels}=H\times W.$$

      The shape lists rows first. We label a pixel by its row and column, counting from zero, so the top-left pixel is at $(0,0)$ and the row labels in the picture run from 0 to 3.

      Be careful with the way image sizes are usually written. A "640×480" photo means 640 pixels wide and 480 pixels tall, so the width comes first. But the array puts the height first, so its shape is `(480, 640)`. If we mix the two up, we cut the same numbers into rows of the wrong length, and the picture comes out scrambled.
    worked: |
      Let's read the grayscale image above.

      1. **Read the shape.** There are four rows and five columns, with height first.
         $$\text{shape}=(4,5).$$
      2. **Count the pixels.** Every row has five pixels.
         $$4\times5=20\text{ pixels}.$$
      3. **Read one entry.** Row 1 is the second row and column 3 is the fourth column.
         $$\text{brightness at }(1,3)=153.$$

      So this small image is 20 brightness values in a $4\times5$ grid, and the pixel at $(1,3)$ is a light grey.
    problems:
