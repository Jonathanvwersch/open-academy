concept: images-as-tensors
version: 1
objective: |
  **Goal:** read an image's shape, convert it between the height-width-channels and channels-height-width layouts, and scale its pixel values the way a model expects.
recap:
  - concept: matrices
    text: "A matrix is a grid with shape (rows, columns). Its transpose swaps rows and columns."
where_this_fits: |
  ### What is an image tensor?

  To a computer, an image is a grid of numbers, one for each tiny square of colour, called a pixel. A grayscale image needs one grid, which is just a matrix. An RGB colour image needs three same-sized grids stacked on top of each other, one for red, one for green and one for blue, and a stack of grids like that is called a tensor.

  A model can only read numbers, so every photo has to become a tensor before the model sees it. But different tools stack the grids in different orders, and models expect pixel values on a particular scale. If we get the order wrong, the code often runs without any error, and the model just sees scrambled pixels.
knowledge_points:
  - id: iat-pixels-grid
    key_prereqs: [matrices]
    title: Turn a picture into numbers
    tldr: |
      - A grayscale image is a grid of numbers, one per pixel, from 0 for black to 255 for white.
      - The grid's shape gives its size as rows then columns, so height comes before width.
      - Photo sizes are usually written width first, so mixing the two up scrambles the picture.
    explain: |
      ### Brightness in a grid

      In the matrices lesson, each row of a matrix held one house's measurements. A grayscale (black-and-white) image is also a matrix, but each entry is the brightness of one pixel, one tiny square of the image. In the picture below, each square is a pixel, and the number in it says how bright it is. A value of 0 is black, 255 is white, and the values in between are shades of grey.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" role="img" aria-label="Four rows and five columns of grayscale pixels, indexed from zero. Row 1 column 3 has value 153." font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
      <text x="300" y="22" text-anchor="middle" fill="#171717">Grayscale: 4 rows × 5 columns; shape (4, 5)</text>
      <text x="325" y="48" text-anchor="middle" fill="#171717">column index</text>
      <text x="185" y="70" text-anchor="middle" fill="#171717">0</text>
      <text x="255" y="70" text-anchor="middle" fill="#171717">1</text>
