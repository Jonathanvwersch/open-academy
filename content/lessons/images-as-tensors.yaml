        iat-robot-scale,
      ]
final: iat-explain-pipeline
summary: |
  - An 8-bit grayscale image is a matrix of brightnesses from 0 to 255, with shape (height, width), height first, and `img[r, c]` reads the pixel in row `r` and column `c`, counting from zero.
  - An RGB colour image is a tensor with three channels, red, green and blue. HWC stores it as `(H, W, 3)`, CHW as `(3, H, W)`, and a batch of $N$ images adds an axis at the front.
  - `np.transpose(img, (2, 0, 1))` turns HWC into CHW. Reshape can give the right shape but scramble the pixels, because it only cuts the default index-order sequence into new pieces.
  - For a model expecting this preparation, we divide uint8 values by 255 and then standardise each channel with $x'=(x-m_c)/s_c$, using the model's own means and positive standard deviations, with shape `(3, 1, 1)` for a CHW image. Don't rescale values already in the expected range.

  **Next:** The next vision lesson slides a small grid of weights across these channels to find patterns such as edges.
