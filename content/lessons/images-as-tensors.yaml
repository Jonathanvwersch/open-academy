      <rect x="150" y="224" width="70" height="48" fill="#171717" fill-opacity="1.000" stroke="#737373"/>
      <text x="185" y="251" text-anchor="middle" fill="#d4d4d4">0</text>
      <rect x="220" y="224" width="70" height="48" fill="#171717" fill-opacity="1.000" stroke="#737373"/>
      <text x="255" y="251" text-anchor="middle" fill="#d4d4d4">0</text>
      <rect x="290" y="224" width="70" height="48" fill="#171717" fill-opacity="0.800" stroke="#737373"/>
      <text x="325" y="251" text-anchor="middle" fill="#d4d4d4">51</text>
      <rect x="360" y="224" width="70" height="48" fill="#171717" fill-opacity="0.600" stroke="#737373"/>
      <text x="395" y="251" text-anchor="middle" fill="#171717">102</text>
      <rect x="430" y="224" width="70" height="48" fill="#171717" fill-opacity="0.400" stroke="#737373"/>
      <text x="465" y="251" text-anchor="middle" fill="#171717">153</text>
      </svg>
      ```

      We use 8-bit images here, whose decoded brightnesses are whole numbers from 0 to 255. The **bit depth** counts the bits used for each brightness. Other images use more bits or floats, numbers that can hold decimals. NumPy calls this one-byte representation **uint8**, short for "unsigned 8-bit integer". Unsigned means it has no negative values, and 8 bits make one byte, which can hold exactly 256 different values.

      ### Height comes first

      NumPy stores a grid of numbers like this as an **array**, its general name for a grid with any number of directions. An **axis** is one direction along which we count an array's entries. A matrix has two. The first axis counts rows from top to bottom, so its size is the image's height. The second counts columns from left to right, so its size is the width. So for an image with height $H$ and width $W$,

      $$\text{shape}=(H,W),\qquad\text{pixels}=H\times W.$$

      NumPy's `.shape` gives these two sizes, height first, because an array lists its rows first, just like a matrix. To read one pixel, we write `img[r, c]`, where `r` is the pixel's row and `c` is its column. NumPy counts from zero, so the top-left pixel is `img[0, 0]` and the row labels in the picture run from 0 to 3.

      Be careful with the way image sizes are usually written. A "640×480" photo means 640 pixels wide and 480 pixels tall, so the width comes first. But the array puts the height first, so its shape is `(480, 640)`. If we mix the two up, NumPy cuts the same numbers into rows of the wrong length, and the picture comes out scrambled.
    worked: |
      Let's read the grayscale image above.

      1. **Read the shape.** There are four rows and five columns, with height first.
         $$\text{shape}=(4,5).$$
      2. **Count the pixels.** Every row has five pixels.
         $$4\times5=20\text{ pixels}.$$
      3. **Read one entry.** Row 1 is the second row and column 3 is the fourth column.
         $$\texttt{img[1, 3]}=153.$$

      So this small image is 20 brightness values in a $4\times5$ grid, and the pixel at `img[1, 3]` is a light grey.
