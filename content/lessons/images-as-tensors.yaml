      <rect x="360" y="224" width="70" height="48" fill="#171717" fill-opacity="0.600" stroke="#737373"/>
      <text x="395" y="251" text-anchor="middle" fill="#171717">102</text>
      <rect x="430" y="224" width="70" height="48" fill="#171717" fill-opacity="0.400" stroke="#737373"/>
      <text x="465" y="251" text-anchor="middle" fill="#171717">153</text>
      </svg>
