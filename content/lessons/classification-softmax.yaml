  - id: sm-gradient
    title: Adjust the scores to lower the loss
    explain: |
      ### Which way should each score move?

      Now that we can measure how wrong the probabilities are, training can lower that loss with gradient descent, which subtracts each slope times a small learning rate $\eta$. In logistic regression, the slope of the loss against the score was $p-y$, the probability minus the label. With softmax, each class's slope is just as simple.

      To use it, we write the label as one number per class: $y_k=1$ for the true class and $y_k=0$ for every other class. For a ball, the label is $(0,1,0)$ for cup, ball and box. This way of writing a label is called **one-hot**, because exactly one entry is 1.

      The slope of the loss against each class's score is that class's probability minus its label:

      $$\frac{\partial L}{\partial z_k}=p_k-y_k$$

      The curly $\partial$ reads "the slope of $L$ against $z_k$, with the other scores held still".

      Working out this slope takes calculus, which we'll skip here, but the result holds for every class, true or not.

      ### Every score moves

      For the ball, the slopes are $0.67$ for cup, $0.24-1=-0.76$ for ball and $0.09$ for box. Subtracting these slopes has three effects.

      - the ball's score has a negative slope, so it goes up;
      - the cup's score goes down the most, because the cup took the most probability;
      - the box's score goes down a little.

      Be careful not to think training touches only the true class. Every wrong class is pushed down in proportion to the probability it took, and the slopes always add up to 0, because the probabilities add up to 1 and so does the label.

      ### From scores to weights

      Each score comes from its own weights and bias, $z_k=w_kx+b_k$. So, just as in logistic regression, the slope for the bias $b_k$ is $p_k-y_k$, and the slope for the weight $w_k$ is $(p_k-y_k)\,x$, because a change in $w_k$ moves $z_k$ by $x$ times as much.
    worked: |
      Let's take one gradient descent step for the ball, with scores 2, 1 and 0 and a learning rate of $\eta=1$, chosen so the change is easy to see. Real training changes the weights too, but to keep the arithmetic short, we'll change only the three biases. Each score still moves in the same direction as in full training. A bias adds straight onto its score, so each score changes by exactly as much as its bias.

      1. **Find the slopes.** Each slope is the class's probability minus its label, with label $(0,1,0)$.
         $$0.67-0=0.67,\qquad0.24-1=-0.76,\qquad0.09-0=0.09$$

      2. **Update the biases.** Each bias moves by minus its slope, so the ball's goes up and the other two go down. Each score moves by the same amount.
         $$z_{\text{cup}}=2-0.67=1.33,\qquad z_{\text{ball}}=1+0.76=1.76,\qquad z_{\text{box}}=0-0.09=-0.09$$

      3. **Recompute the ball's probability.** We raise $e$ to each new score and divide by the new total.
         $$p_{\text{ball}}=\frac{e^{1.76}}{e^{1.33}+e^{1.76}+e^{-0.09}}\approx\frac{5.81}{3.78+5.81+0.91}\approx0.55$$

      4. **Find the new loss.** Minus the natural log of the new probability.
         $$L=-\ln0.55\approx0.60$$

      In one step the loss fell from $1.41$ to $0.60$, and the ball's $5.81$ now beats the cup's $3.78$, so the model would predict ball.
    problems:
      [
        sm-grad-basics,
        sm-grad-reason,
        sm-grad-faded,
        sm-grad-template,
        sm-grad-confusion,
        sm-grad-sum,
        sm-grad-transfer,
      ]
final: sm-explain-softmax
summary: |
  - Softmax turns one score per class into probabilities that are positive and add up to 1, $p_k=e^{z_k}/(e^{z_1}+e^{z_2}+\dots+e^{z_K})$. Only the differences between the scores matter.
  - Multiclass cross-entropy is minus the natural log of the probability given to the true class, $L=-\ln p_{\text{true}}$, so a confident mistake costs the most.
  - The slope of the loss against each score is $p_k-y_k$, where the one-hot label $y_k$ is 1 for the true class and 0 for the others. Training raises the true class's score and lowers every other score.
  - With two classes, softmax is the sigmoid and this loss is binary cross-entropy.

  **Next:** Later lessons use softmax wherever a model picks one option from many, such as a text model choosing the next word from all the words it knows.
