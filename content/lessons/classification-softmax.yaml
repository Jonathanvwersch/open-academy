        sm-softmax-reason,
        sm-softmax-faded,
        sm-softmax-template,
        sm-softmax-confusion,
        sm-softmax-shift,
        sm-softmax-transfer,
      ]
  - id: sm-cross-entropy
    title: Measure how wrong the probabilities are
    explain: |
      ### The loss looks at the true class

      Now that the model gives probabilities, we need to score them against what the object really was. In the information theory lesson, a labelled example's loss was the surprise of the class that actually happened, which we wrote as $\log_2(1/q_{\text{actual}})$. We'll use the same idea with the natural log, $\ln$, as logistic regression did. That only changes the unit. One bit equals $\ln2\approx0.69$ natural-log units, so every loss is about $0.69$ times its value in bits. Flipping a fraction flips the sign of its log, $\ln(1/p)=-\ln p$, so we write the loss with a minus sign, using $p$ for the probability.

      **Multiclass cross-entropy**, often called categorical cross-entropy, is the loss we get by taking the natural log of the probability the model gave to the true class and putting a minus sign in front:

      $$L=-\ln p_{\text{true}}$$

      Here $p_{\text{true}}$ is the softmax probability of the class the object really is. Averaging $L$ over many labelled examples gives the cross-entropy from the information theory lesson, measured with $\ln$. With two classes, it's the binary cross-entropy from logistic regression.

      ### Three possible answers for the same scores

      The red curve shows the loss against the probability given to the true class. With our scores 2, 1 and 0, the loss depends on what the object really was:

      - a cup, with probability $0.665$, gives a loss of $0.41$;
      - a ball, with probability $0.245$, gives $1.41$;
      - a box, with probability $0.090$, gives $2.41$. The model was fairly sure it wasn't a box, and a confident mistake costs the most.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" aria-label="The red curve is the loss, minus the natural log of the probability given to the true class, drawn against that probability from 0.05 to 1. It falls to 0 at probability 1 and climbs steeply near 0. Three points mark our scores: cup, probability 0.665, loss 0.41; ball, probability 0.245, loss 1.41; box, probability 0.090, loss 2.41">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M80 300 H560 M80 300 V50" stroke="#d4d4d4"/>
      <path d="M104.0 60.34 L108.8 74.93 L113.6 87.26 L118.4 97.94 L123.2 107.36 L128.0 115.79 L132.8 123.42 L137.6 130.38 L142.4 136.78 L147.2 142.71 L152.0 148.23 L156.8 153.39 L161.6 158.24 L166.4 162.82 L171.2 167.14 L176.0 171.24 L180.8 175.15 L185.6 178.87 L190.4 182.43 L195.2 185.83 L200.0 189.1 L204.8 192.23 L209.6 195.25 L214.4 198.16 L219.2 200.97 L224.0 203.68 L228.8 206.31 L233.6 208.85 L238.4 211.31 L243.2 213.7 L248.0 216.01 L252.8 218.27 L257.6 220.46 L262.4 222.59 L267.2 224.67 L272.0 226.7 L276.8 228.67 L281.6 230.6 L286.4 232.48 L291.2 234.32 L296.0 236.12 L300.8 237.88 L305.6 239.6 L310.4 241.28 L315.2 242.93 L320.0 244.55 L324.8 246.13 L329.6 247.69 L334.4 249.21 L339.2 250.71 L344.0 252.17 L348.8 253.61 L353.6 255.03 L358.4 256.42 L363.2 257.79 L368.0 259.13 L372.8 260.46 L377.6 261.76 L382.4 263.04 L387.2 264.3 L392.0 265.54 L396.8 266.76 L401.6 267.96 L406.4 269.15 L411.2 270.31 L416.0 271.47 L420.8 272.6 L425.6 273.72 L430.4 274.82 L435.2 275.91 L440.0 276.99 L444.8 278.05 L449.6 279.09 L454.4 280.12 L459.2 281.14 L464.0 282.15 L468.8 283.14 L473.6 284.12 L478.4 285.09 L483.2 286.05 L488.0 287.0 L492.8 287.93 L497.6 288.86 L502.4 289.77 L507.2 290.68 L512.0 291.57 L516.8 292.46 L521.6 293.33 L526.4 294.19 L531.2 295.05 L536.0 295.9 L540.8 296.73 L545.6 297.56 L550.4 298.38 L555.2 299.2 L560.0 300.0" stroke="#ef4444" stroke-width="3" fill="#ffffff" fill-opacity="0"/>
