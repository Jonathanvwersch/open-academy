      <circle cx="197.47" cy="187.39" r="5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="209.47" y="177.39" fill="#171717" text-anchor="start">ball: 0.245, loss 1.41</text>
      <circle cx="123.21" cy="107.39" r="5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="135.21" y="97.39" fill="#171717" text-anchor="start">box: 0.090, loss 2.41</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="305" fill="#737373" text-anchor="end">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="225" fill="#737373" text-anchor="end">1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="145" fill="#737373" text-anchor="end">2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="65" fill="#737373" text-anchor="end">3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="80" y="322" fill="#737373" text-anchor="middle">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320.0" y="322" fill="#737373" text-anchor="middle">0.5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="560" y="322" fill="#737373" text-anchor="middle">1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="345" fill="#737373" text-anchor="middle">probability given to the true class</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="90" y="45" fill="#ef4444" text-anchor="start">loss = minus ln of that probability</text>
      </g></svg>
      ```

      Before rounding, each loss in the list is exactly 1 more than the one before, because each score is 1 lower. The worked example shows why.

      Be careful not to think the other classes don't matter because the loss reads only $p_{\text{true}}$. All the probabilities share a total of 1. If the object is a ball and the cup's score rises, cup takes a bigger share, so the ball's probability falls and the loss rises.
    worked: |
      Let's work out the loss if the object was really a ball, using the scores 2, 1 and 0 from the last step.

      1. **Find the true class's probability.** Softmax gave the ball $2.72$ out of a total of $11.11$.
         $$p_{\text{ball}}=\frac{2.72}{11.11}\approx0.245$$

      2. **Take minus the natural log.** The log of a probability below 1 is negative, so the minus sign makes the loss positive.
         $$L=-\ln0.245\approx1.41$$

      3. **See why the losses are 1 apart.** The ball's probability is $e^1/11.11$. We use two log rules: minus the log of a fraction is the log of the fraction flipped over, and the log of a division is the difference of the logs. And since $\ln$ undoes raising $e$ to a power, $\ln e^1=1$. A calculator gives $\ln11.11\approx2.41$.
         $$L=\ln\frac{11.11}{e^1}=\ln11.11-1\approx2.41-1=1.41$$

      Every class shares the same $\ln11.11$, so a score 1 lower always means a loss 1 higher. The ball's loss of $1.41$ is much bigger than a cup's $0.41$, because the model gave the ball only about a quarter of its probability.
    problems:
      [
        sm-ce-basics,
        sm-ce-reason,
        sm-ce-faded,
        sm-ce-template,
        sm-ce-confusion,
        sm-ce-bits,
