concept: classification-softmax
version: 1
objective: |
  **Goal:** turn a list of class scores into probabilities with softmax, compute the cross-entropy loss for the true class, and say which way training moves each score.
recap:
  - concept: logistic-regression
    text: "Logistic regression turns a score $z=wx+b$ into the probability of label 1 with the sigmoid $\\sigma(z)=1/(1+e^{-z})$, where $e\\approx2.72$. Its loss, binary cross-entropy, is $-\\ln$ of the true label's probability, and its slope against the score is $p-y$."
  - concept: information-theory
    text: "A labelled example's classification loss is the surprise of the class that actually happened, $\\log_2(1/q_{\\text{actual}})$ bits, where $q_{\\text{actual}}$ is the probability the forecast gave that class. Averaging it over many examples gives cross-entropy, which punishes confident mistakes most."
where_this_fits: |
  ### What is softmax?

  Softmax is a function that turns a list of scores, one for each class, into probabilities that are all positive and add up to 1. Cross-entropy then measures how wrong those probabilities are, so together they train a model to choose between any number of classes.

  Why? Logistic regression answers yes-or-no questions, but many questions have more answers, such as whether the object in a robot's gripper is a cup, a ball or a box. The information theory lesson scored probabilities with cross-entropy but never said where they come from. A model's scores can be any numbers, so we need a way to turn several scores into one set of probabilities, and then a loss and a training step that work with them.
knowledge_points:
  - id: sm-softmax
    title: Turn scores into probabilities
    explain: |
      ### One score for each class

      The robot's model must say whether the object in its gripper is a cup, a ball or a box. These three answers are the **classes**. Logistic regression made one score, $z=wx+b$. This model makes one score for each class, each with its own weights and bias, where $x$ stands for numbers read from the image, and a higher score means the model thinks that class is more likely. Such scores are called **logits**.

      Suppose the scores are 2 for cup, 1 for ball and 0 for box. They can't be probabilities yet. No probability can exceed 1, and these add up to 3.

      ### Make them positive, then divide by the total

      Softmax fixes this in two moves. First it raises $e\approx2.72$ to the power of each score, which makes every number positive and keeps the biggest score biggest. Squaring would also make numbers positive, but it would wrongly rank a score of $-3$ above a score of 2. Then it divides each result by their total, so the results add up to 1.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" aria-label="Softmax in two moves for a cup, a ball and a box. Left, the blue scores are 2, 1 and 0. Middle, raising e to the power of each score gives 7.39, 2.72 and 1, which add up to 11.11. Right, dividing each by 11.11 gives the green probabilities 0.67, 0.24 and 0.09, which add up to 1">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="20" y="30" fill="#171717" text-anchor="start">Scores</text>
      <path d="M20 250 H190" stroke="#737373"/>
      <rect x="30" y="100.0" width="40" height="150.0" fill="#3b82f6"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="50" y="92.0" fill="#171717" text-anchor="middle">2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="50" y="272" fill="#737373" text-anchor="middle">cup</text>
      <rect x="85" y="175.0" width="40" height="75.0" fill="#3b82f6"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="105" y="167.0" fill="#171717" text-anchor="middle">1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="105" y="272" fill="#737373" text-anchor="middle">ball</text>
      <rect x="140" y="250.0" width="40" height="0.0" fill="#3b82f6"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="160" y="242.0" fill="#171717" text-anchor="middle">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="160" y="272" fill="#737373" text-anchor="middle">box</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="230" y="30" fill="#171717" text-anchor="start">e to the power of</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="230" y="50" fill="#171717" text-anchor="start">each score</text>
      <path d="M230 250 H400" stroke="#737373"/>
      <rect x="240" y="100.0" width="40" height="150.0" fill="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="260" y="92.0" fill="#171717" text-anchor="middle">7.39</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="260" y="272" fill="#737373" text-anchor="middle">cup</text>
      <rect x="295" y="194.82" width="40" height="55.18" fill="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="315" y="186.82" fill="#171717" text-anchor="middle">2.72</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="315" y="272" fill="#737373" text-anchor="middle">ball</text>
      <rect x="350" y="229.7" width="40" height="20.3" fill="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="370" y="221.7" fill="#171717" text-anchor="middle">1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="370" y="272" fill="#737373" text-anchor="middle">box</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="440" y="30" fill="#171717" text-anchor="start">Probabilities</text>
      <path d="M440 250 H610" stroke="#737373"/>
      <rect x="450" y="150.21" width="40" height="99.79" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="470" y="142.21" fill="#171717" text-anchor="middle">0.67</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="470" y="272" fill="#737373" text-anchor="middle">cup</text>
      <rect x="505" y="213.29" width="40" height="36.71" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="525" y="205.29" fill="#171717" text-anchor="middle">0.24</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="525" y="272" fill="#737373" text-anchor="middle">ball</text>
      <rect x="560" y="236.5" width="40" height="13.5" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="580" y="228.5" fill="#171717" text-anchor="middle">0.09</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="580" y="272" fill="#737373" text-anchor="middle">box</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="230" y="302" fill="#737373" text-anchor="start">total 11.11</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="440" y="302" fill="#737373" text-anchor="start">total 1</text>
      <path d="M196 150 H222 M216 144 L222 150 L216 156 M406 150 H432 M426 144 L432 150 L426 156" stroke="#171717" stroke-width="2" fill="#ffffff" fill-opacity="0"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="209" y="138" fill="#171717" text-anchor="middle" font-size="13">raise e</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="419" y="138" fill="#171717" text-anchor="middle" font-size="13">÷ total</text>
      </g></svg>
      ```

      **Softmax** does both moves in one formula:

      $$p_k=\frac{e^{z_k}}{e^{z_1}+e^{z_2}+\dots+e^{z_K}}$$

      We number the classes cup 1, ball 2 and box 3. $z_k$ is the score of class $k$, $p_k$ is its probability and $K$ is the number of classes. Our scores give cup $0.67$, ball $0.24$ and box $0.09$, so the model predicts cup.

      ### Only the differences between scores matter

      - Adding 1 to every score, giving 3, 2 and 1, keeps the probabilities at $0.67$, $0.24$ and $0.09$. Each $e^{z_k}$ and the total all get multiplied by $e$, which cancels.
      - Doubling the differences, giving 4, 2 and 0, makes the model more sure of cup, at about $0.87$, $0.12$ and $0.02$ after rounding.
      - With three equal scores, each class gets $1/3$.

      Be careful not to read a score of 2 as "twice as likely" as a score of 1. Each extra point of difference between two scores multiplies the ratio of their probabilities by $e$. With two classes and scores $z$ and 0 (only differences matter), softmax gives $e^z/(e^z+1)$. Dividing top and bottom by $e^z$ gives the sigmoid, $1/(1+e^{-z})$, so logistic regression is the two-class case.
    worked: |
      Let's work out the softmax probabilities for the scores 2, 1 and 0, for cup, ball and box.

      1. **Raise $e$ to each score.** This makes every number positive and keeps them in the same order.
         $$e^2\approx7.39,\qquad e^1\approx2.72,\qquad e^0=1$$

      2. **Add them up.** The total is what we'll share out.
         $$7.39+2.72+1=11.11$$

      3. **Divide each by the total.** Dividing by the total makes the three add up to 1.
         $$p_{\text{cup}}=\frac{7.39}{11.11}\approx0.67,\qquad p_{\text{ball}}=\frac{2.72}{11.11}\approx0.24,\qquad p_{\text{box}}=\frac{1}{11.11}\approx0.09$$

      The probabilities add up to 1, and cup, with the highest score, gets the biggest share.
