concept: activation-functions
version: 5
objective: |
  **Goal:** explain why a network needs a bending function between its layers, compute ReLU, sigmoid and tanh, and use their slopes to say how a small change in a score changes the output.
recap:
  - concept: perceptron
    text: 'A perceptron computes a score $z=w\cdot x+b$, a weighted sum of its inputs plus a bias, then applies the step, giving $1$ if the score is positive and $0$ otherwise. Neurons can feed their outputs into other neurons.'
  - concept: derivatives
    text: "The derivative $f'(a)$ is the slope of $f$ at the input $a$. A small nudge to the input changes the output by about $f'(a)$ times the nudge."
where_this_fits: |
  ### What is an activation function?

  An activation function is the function a neuron applies to its score before passing the result on. In the perceptron lesson, that function was the step, which turns the score into a yes or a no. Here we'll meet three that networks use far more often, ReLU, sigmoid and tanh.

  Why do we need anything new? Real networks feed the outputs of some neurons into others, and we'll see that without an activation between them, all those neurons add up to no more than one weighted sum. The step fixes that, but it's flat everywhere except at its jump, so its slope can't tell training which way to nudge a weight. The activations in this lesson bend the score and still have useful slopes.
final: act-explain-layers
knowledge_points:
  - id: act-stacking-stays-straight
    title: "Why stacked layers stay straight"
    tldr: |
      - A layer multiplies its inputs by weights, adds them up and adds a bias.
      - Stacking two such layers still gives one weighted sum of the original inputs, which is a straight line.
      - Putting a function that bends between the layers lets the network make shapes a straight line can't.
    explain: |
      ### Feeding one score into another

      In the perceptron lesson, we saw that XOR needs several neurons, with some of them feeding their outputs into others. Networks are built this way in **layers**. A layer is a group of neurons that all read the same inputs, and each layer's outputs become the next layer's inputs.

      Stacking layers is how a network builds up more complex rules, so let's check what it gains. What happens if we stack two layers with nothing between them? Let's take the simplest case, with one input $x$ and one neuron in each layer. The first neuron computes $u=2x+1$, and the second takes $u$ as its input and computes $y=3u-4$.

      ### A straight line stays straight

      The grey line plots $y$ against $x$. Substitute the first rule into the second:

      $$
      \begin{aligned}
      y&=3(2x+1)-4 &&\text{replace }u\\
      &=6x+3-4 &&\text{expand the bracket}\\
      &=6x-1 &&\text{combine constants}
      \end{aligned}
      $$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" aria-label="Output y against input x for two stacked rules. Without anything between them the stack is the straight line y = 6x − 1, rising 6 per step at x = −1, 0, 1 (values −7, −1, 5). With max(0, u) between them the line is flat at −4 until x = −0.5, then rises: values −4, −1, 5.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M80 200 H576 M320 380 V38" stroke="#d4d4d4" fill="#171717" fill-opacity="0"/>
      <path d="M80.0 380.0 L560.0 56.0" stroke="#737373" stroke-width="3" fill="#171717" fill-opacity="0"/>
      <path d="M80.0 272.0 L240.0 272.0 L560.0 56.0" stroke="#10b981" stroke-width="3" stroke-dasharray="10 7" fill="#171717" fill-opacity="0"/>
      <circle cx="160.0" cy="326.0" r="4" fill="#737373"/>
      <circle cx="320.0" cy="218.0" r="4" fill="#737373"/>
      <circle cx="480.0" cy="110.0" r="4" fill="#737373"/>
      <circle cx="160.0" cy="272.0" r="4" fill="#10b981"/>
      <circle cx="320.0" cy="218.0" r="4" fill="#10b981"/>
      <circle cx="480.0" cy="110.0" r="4" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="168" y="344" fill="#737373">−7</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="160" y="294" fill="#10b981" text-anchor="middle">−4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="330" y="236">−1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="466" y="102" text-anchor="end">5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="410" y="46" fill="#737373">nothing between: y = 6x − 1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="88" y="242" fill="#10b981">max(0, u) between: bends</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="88" y="260" fill="#10b981">at x = −0.5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="582" y="205">x</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="328" y="52">y</text>
      <path d="M160 196 V204" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="160" y="220" fill="#737373" text-anchor="middle">−1</text>
      <path d="M480 196 V204" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="480" y="220" fill="#737373" text-anchor="middle">1</text>
      </g>
      </svg>
      ```

      This always happens. A **linear layer** is a layer whose neurons each compute a weighted sum of their inputs plus a bias. For one input, two of them stacked give

      $$
      \begin{aligned}
      a(cx+d)+e&=acx+ad+e &&\text{multiply out the bracket}\\
      &=(ac)x+(ad+e) &&\text{group slope and intercept}
      \end{aligned}
      $$

      which is one slope, $ac$, times $x$, plus one intercept, $ad+e$. With more inputs:
      $$
      \begin{aligned}
      3(2x_1+x_2+1)-4&=6x_1+3x_2+3-4 &&\text{multiply each term by three}\\
      &=6x_1+3x_2-1 &&\text{combine constants}
      \end{aligned}
      $$
      Any stack of linear layers is the same as a single linear layer.

      Be careful not to think that more layers always make a more powerful model. With nothing between them, ten linear layers still give each output one weighted sum of the inputs plus a bias.

      ### Putting a bend between the layers

      Now put $\max(0,u)$, the larger of $0$ and $u$, between the layers. It keeps positive $u$ and turns negative $u$ into $0$. The green dashed line bends where $u$ reaches zero:
      $$
      \begin{aligned}
      2x+1&=0 &&\text{find the crossing}\\
      2x&=-1 &&\text{subtract one}\\
      x&=-0.5 &&\text{divide by two}\\
      y&=3\cdot0-4=-4 &&\text{output below the crossing}
      \end{aligned}
      $$
      Above the crossing, the green line follows the grey one. No straight line can make this corner.

      So to make extra layers count, a network applies a function whose graph isn't a straight line to each score before passing it on. Such a function is called nonlinear, and it's the network's **activation function**.
    worked: |
      Let's combine $u=2x+1$ and $y=3u-4$ into one rule, then compare it with the version that has $\max(0,u)$ between the layers.

      1. **Put the first rule into the second.** The second layer reads $u$, so we replace $u$ with $2x+1$.
         $$y=3(2x+1)-4$$
      2. **Multiply out the bracket.** The $3$ multiplies both the $2x$ and the $1$.
         $$y=6x+3-4$$
      3. **Collect the numbers.** This leaves one slope and one intercept.
         $$y=6x-1$$
      4. **Check one input.** Compare the two layers with the single rule at $x=1$.
         $$\begin{aligned}u&=2(1)+1=3 &&\text{first layer}\\y&=3(3)-4=5 &&\text{second layer}\\6(1)-1&=5 &&\text{single rule agrees}\end{aligned}$$
      5. **Compare equal steps in $x$.** A straight line rises by the same amount for each equal step in $x$, so a table shows whether the result bends.

      | $x$ | $u=2x+1$ | $y$, nothing between | $y$, $\max(0,u)$ between |
      | --- | --- | --- | --- |
      | $-1$ | $-1$ | $-7$ | $-4$ |
      | $0$ | $1$ | $-1$ | $-1$ |
      | $1$ | $3$ | $5$ | $5$ |
      | Rise per step | | $6$, then $6$ | $3$, then $6$ |

      With nothing between the layers, the rise is $6$ every time, so the result is a straight line. With $\max(0,u)$ between them, the rise changes from $3$ to $6$, and that change is the bend.
