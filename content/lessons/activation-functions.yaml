      <path d="M140 296 V304" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="140" y="320" fill="#737373" text-anchor="middle">−2</text>
      <path d="M500 296 V304" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="500" y="320" fill="#737373" text-anchor="middle">2</text>
