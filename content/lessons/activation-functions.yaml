      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="59" y="360" fill="#f59e0b">tanh</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="310" y="252" fill="#3b82f6" text-anchor="end">0.5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="44" y="225" fill="#737373" text-anchor="end">1</text>
