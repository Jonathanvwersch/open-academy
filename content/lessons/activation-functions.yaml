        <line x1="255.3" y1="203.3" x2="404.7" y2="56.7" stroke="#3b82f6" stroke-width="3"/>
        <circle cx="330.0" cy="130.0" r="6" fill="#3b82f6"/>
        <line x1="442.0" y1="46.8" x2="591.3" y2="36.4" stroke="#ef4444" stroke-width="3"/>
