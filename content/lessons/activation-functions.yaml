        <text x="324" y="42" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">1</text>
        <text x="610" y="242" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">z</text>
      </svg>
      ```

      One ReLU problem: a neuron whose score is negative for every input always outputs 0 and always has slope 0, so nudging its numbers changes nothing. It's called a **dead** unit.
    worked: |
      This example shows sigmoid's slope at two scores and checks one with a small nudge.

      1. **At $z = 0$:** $\sigma(0) = 0.5$, so $\sigma'(0) = 0.5 \times (1 - 0.5) = 0.25$.
      2. **Check with a nudge:** $\sigma(0.01) \approx 0.502500$. The output rose by $0.0025$ for a nudge of $0.01$, a ratio of $0.25$.
      3. **At $z = 4$:** $\sigma(4) \approx 0.982$, so $\sigma'(4) \approx 0.982 \times 0.018 \approx 0.018$.

      At $z = 4$ the same nudge moves the output about 14 times less than at $z = 0$. A ReLU with a positive score would pass it through in full, with slope 1.
