  - id: act-slopes
    title: "How steep each activation is"
    tldr: |
      - An activation's slope tells how much its output changes after a small change in score.
      - Sigmoid and tanh become almost flat for large positive or negative scores.
      - ReLU keeps a useful slope for positive scores, but a neuron with only negative scores stops learning.
    explain: |
      ### How much does the output move?

      Training improves a network by nudging its weights, and each nudge changes a neuron's score a little. So we need to know how much an activation's output moves when its score moves. In the derivatives lesson, we saw that the answer is the slope. For a small change in score, the change in output is about the slope times the change in score.

      ### The slope of each curve

      The picture shows the blue sigmoid curve again, with two red lines that each just touch the curve at one score. These are its tangent lines. At $z=0$ the curve is at its steepest, with slope $0.25$. At $z=3$ the output is about $0.95$ and the curve has nearly levelled off, so its slope is only about $0.045$, and a nudge to the score there barely moves the output.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" aria-label="The sigmoid curve with two tangent lines. At z = 0 the curve is steepest and the tangent has slope 0.25. At z = 3 the curve has flattened and the tangent has slope about 0.045.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
