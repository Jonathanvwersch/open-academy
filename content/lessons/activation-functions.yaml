      An **activation's slope** is its derivative, how fast its output changes as its score changes. For our three activations, the slopes are

      $$\operatorname{ReLU}'(z)=\begin{cases}1 & \text{if } z>0\\ 0 & \text{if } z<0\end{cases}$$

      $$\sigma'(z)=\sigma(z)\,\bigl(1-\sigma(z)\bigr)$$

      $$\tanh'(z)=1-\tanh^2(z)$$

      where $\tanh^2(z)$ means the tanh output squared. ReLU has no single slope at its corner, $z=0$, so by convention we take it as $0$ there. The worked example finds the sigmoid's slope with the quotient rule. Tanh's slope comes out the same way, so we'll use it as given.

      ### When the slope is nearly zero

      The sigmoid and tanh have a real weakness. Far from $z=0$ both curves are almost flat, so their slopes are close to $0$. A flat stretch like this is called **saturation**. At $z=-4$ the sigmoid's slope is only about $0.018$, so changing the weights behind that neuron hardly changes anything, and training learns very slowly. ReLU never flattens for positive scores, which is the main reason it's the usual choice between layers. But a ReLU neuron whose score is negative for every input always outputs $0$ with slope $0$, so it stops learning altogether. This is called a dead unit, unit being another word for neuron.

      Be careful not to read a big output as a big slope. At $z=4$ the sigmoid outputs $0.982$, close to its largest value, but that's just where the curve is almost flat, so its slope is tiny.
    worked: |
      Let's find the sigmoid's slope with the quotient rule from the derivatives lesson, use it at $z=0$, and check the answer by nudging the score from $0$ to $0.1$.

      1. **Rewrite the sigmoid.** Multiplying the top and bottom of the fraction by $e^{z}$ gives a fraction whose top and bottom are built only from $e^{z}$, whose slope we know.
         $$\sigma(z)=\frac{1}{1+e^{-z}}=\frac{e^{z}}{e^{z}+1}$$
      2. **Apply the quotient rule.** The top is $e^{z}$ and the bottom is $e^{z}+1$, and both have slope $e^{z}$, because $e^{z}$ is its own derivative.
         $$\sigma'(z)=\frac{e^{z}(e^{z}+1)-e^{z}\cdot e^{z}}{(e^{z}+1)^2}=\frac{e^{z}}{(e^{z}+1)^2}$$
      3. **Spot the sigmoid in the answer.** We split the fraction into two factors. The first is $\sigma(z)$ from step 1. The second is $1-\sigma(z)$, because $\frac{e^{z}}{e^{z}+1}+\frac{1}{e^{z}+1}=1$.
         $$\sigma'(z)=\frac{e^{z}}{e^{z}+1}\cdot\frac{1}{e^{z}+1}=\sigma(z)\,\bigl(1-\sigma(z)\bigr)$$
      4. **Put in $z=0$.** Here $e^{0}=1$, so the output is $0.5$.
         $$\sigma'(0)=0.5\times(1-0.5)=0.25$$
      5. **Predict the change for a nudge of $0.1$.** The change in output is about the slope times the nudge.
         $$\text{change}\approx0.25\times0.1=0.025$$
      6. **Compare with the actual change.** Working out $\sigma(0.1)$ directly gives almost the same change.
         $$\sigma(0.1)-\sigma(0)\approx0.52498-0.5=0.02498$$

      So for a small nudge, the slope predicts the change very closely. The table compares the slopes at other scores.

      | Score $z$ | ReLU slope | Sigmoid slope | Tanh slope |
      | --- | --- | --- | --- |
      | $-4$ | $0$ | $0.018$ | $0.001$ |
      | $-2$ | $0$ | $0.105$ | $0.071$ |
      | $0$ | $0$ (by convention) | $0.25$ | $1$ |
      | $2$ | $1$ | $0.105$ | $0.071$ |
      | $4$ | $1$ | $0.018$ | $0.001$ |

      Far from $0$, the sigmoid and tanh slopes shrink towards $0$, while ReLU's slope stays at $1$ for every positive score.
