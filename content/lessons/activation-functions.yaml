concept: activation-functions
version: 2
objective: |
  **Goal:** evaluate ReLU, sigmoid and tanh and their slopes, and explain why a network needs a nonlinear activation between its layers.
knowledge_points:
  - id: act-stacking-stays-straight
    title: Stacking straight-line rules gives a straight line
    explain: |
      A single neuron can only draw a straight boundary. A natural idea is to stack them: feed the score of one weighted sum into another weighted sum, hoping the second can bend what the first drew.

      Try it with one input, a house's size $x$ (hundreds of m²). The first rule gives $u = 3x + 1$. The second rule takes $u$ and gives $y = 2u + 5$. Substitute:

      $$y = 2(3x + 1) + 5 = 6x + 7$$

      That's just another straight line, with slope $6$ and intercept $7$. Stacking didn't add anything a single rule couldn't do.

      The same happens with any number of inputs and any number of stacked rules: a weighted sum plus a bias, fed into another weighted sum plus a bias, is still one weighted sum plus a bias. Ten such layers are no more flexible than one.

      To get a bend, you have to put a function whose graph **isn't** a straight line between the rules. Applied to each score, that function is the neuron's **activation function** $\phi$, and because its graph isn't a straight line it's called a **nonlinear activation**. The perceptron's step rule is one example. The next point covers the ones networks use most.
    worked: |
      This example shows that two stacked rules with nothing between them behave exactly like one.

      With $u = 3x + 1$ and then $y = 2u + 5$:

      | size $x$ | $u = 3x + 1$ | $y = 2u + 5$ | $6x + 7$ |
      |---|---|---|---|
      | 1 | 4 | 13 | 13 |
      | 2 | 7 | 19 | 19 |
      | 3 | 10 | 25 | 25 |

      Each extra 100 m² adds exactly 6 to $y$, every time. The two-step rule and the one-step rule $6x + 7$ agree on every input, so the stack is a straight line.
    problems:
      - actp-stack-collapse
      - actp-collapse-template
      - actp-many-layers
      - actp-what-bends
      - actp-linear-candidate
      - actp-robot-linear
  - id: act-relu-sigmoid-tanh
    title: ReLU, sigmoid and tanh
    explain: |
      Which bend should go between the layers? Three activation functions cover most networks. Each takes a score $z$ and returns one number.

      - **ReLU** ("rectified linear unit"): $\text{ReLU}(z) = \max(0, z)$. Negative scores become 0 and positive scores pass through unchanged. It's the cheapest to compute and has no upper limit.
      - **Sigmoid**, written $\sigma$ ("sigma"): $\sigma(z) = \dfrac{1}{1 + e^{-z}}$, where $e \approx 2.718$. Its output is always between 0 and 1, and $\sigma(0) = 0.5$, so it suits an output that should read like a probability.
      - **tanh**: output between $-1$ and $1$, with $\tanh(0) = 0$. It's centred on zero, so its outputs fall above and below 0.

