        <text x="344" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#3b82f6">z = 0: slope 0.25 (steepest)</text>
        <text x="517" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#ef4444">z = 4: slope 0.018</text>
