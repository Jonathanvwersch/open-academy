      ### The three formulas

      $$\operatorname{ReLU}(z)=\max(0,z)$$

      $$\sigma(z)=\frac{1}{1+e^{-z}}$$

      $$\tanh(z)=\frac{e^{z}-e^{-z}}{e^{z}+e^{-z}}$$

      ReLU, short for rectified linear unit, is the $\max(0,u)$ from the first step. The sigmoid is written $\sigma$, the Greek letter sigma, and $e\approx2.718$ is the number from the derivatives lesson. Because $e^{-z}$ is always positive, the bottom of the sigmoid's fraction is more than $1$, so $\sigma(z)$ stays between $0$ and $1$. Tanh is short for hyperbolic tangent. ReLU has no upper limit, while the sigmoid and tanh level off at both ends.

      Be careful not to treat the sigmoid as the step under another name. The step jumps from $0$ to $1$ at $z=0$, while the sigmoid changes smoothly, so a score of $0$ gives $0.5$ and a score of $1$ gives about $0.73$.

      ### Where each one is used

      Most networks use ReLU between their layers, because it's cheap to compute and, as the next step shows, its slope doesn't shrink for large scores. The sigmoid suits a final yes-or-no output, because a value between $0$ and $1$ can be read as how likely the answer is to be yes. Tanh suits outputs centred on $0$.
    worked: |
      Let's pass the score $z=2$ through each of the three activations, then compare the results with $z=-2$ and $z=0$.

      1. **Apply ReLU.** The score is positive, so ReLU keeps it.
         $$\operatorname{ReLU}(2)=\max(0,2)=2$$
      2. **Find the two exponentials.** The sigmoid and tanh both use $e^{2}$ and $e^{-2}$, which is one over $e^{2}$.
         $$e^{2}\approx7.389,\qquad e^{-2}=\frac{1}{e^{2}}\approx0.135$$
      3. **Finish the sigmoid.** We put $e^{-2}$ into the bottom of its fraction.
         $$\sigma(2)=\frac{1}{1+0.135}\approx0.881$$
      4. **Finish tanh.** Its top subtracts the two exponentials and its bottom adds them.
         $$\tanh(2)=\frac{7.389-0.135}{7.389+0.135}=\frac{7.254}{7.524}\approx0.964$$
      5. **Compare three scores.** The same steps at $z=-2$ and $z=0$ fill in the rest of the table.

      | Score $z$ | ReLU | Sigmoid | Tanh |
      | --- | --- | --- | --- |
      | $-2$ | $0$ | $0.119$ | $-0.964$ |
      | $0$ | $0$ | $0.5$ | $0$ |
      | $2$ | $2$ | $0.881$ | $0.964$ |

      ReLU keeps a large positive score as it is, while the sigmoid and tanh squeeze it towards their upper limits. For the negative score, ReLU gives $0$, the sigmoid gives a small positive number and tanh gives the same size of answer as for $z=2$ but negative.
