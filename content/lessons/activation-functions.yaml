  - id: act-slopes
    title: The slope of each activation
    explain: |
      Later lessons train networks by nudging their numbers and watching how the output responds. So you need to know: if a score $z$ changes a little, how much does the activation's output change? That's its derivative, $\phi'(z)$, the slope of its graph.

      - **ReLU:** the slope is $1$ for $z > 0$ and $0$ for $z < 0$. A positive score passes changes through one-for-one; a negative score blocks them.
      - **Sigmoid:** $\sigma'(z) = \sigma(z)\,\big(1 - \sigma(z)\big)$. It's largest at $z = 0$, where it's $0.5 \times 0.5 = 0.25$, and close to 0 when $z$ is far from 0 in either direction. There the curve is flat, or **saturated**.
      - **tanh:** $\tanh'(z) = 1 - \tanh^2(z)$, which is 1 at $z = 0$ and also near 0 far from it.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" aria-label="The sigmoid curve with two tangent lines: a steep one at z = 0 with slope 0.25, and an almost flat one at z = 4 with slope about 0.018. Far from zero the curve is flat in both directions.">
        <line x1="50" y1="221.7" x2="610" y2="221.7" stroke="#d4d4d4" stroke-width="2"/>
        <line x1="330.0" y1="20" x2="330.0" y2="240" stroke="#d4d4d4" stroke-width="2"/>
