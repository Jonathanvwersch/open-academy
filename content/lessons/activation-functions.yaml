      - actp-robot-linear
  - id: act-relu-sigmoid-tanh
    title: "Three common activation functions"
    tldr: |
      - The step is flat almost everywhere, so training can't tell which way to move a weight.
      - So we use functions that bend and still have a slope training can follow.
      - ReLU keeps positive scores and turns negative scores into zero.
      - Sigmoid squeezes any score to between zero and one, and tanh squeezes it to between minus one and one.
    explain: |
      ### Why not use the step?

      The perceptron's step is an activation function, and it does bend a stack of layers. But it's flat everywhere except at $z=0$, where it jumps. In the derivatives lesson, we saw that a nudge changes the output by about the slope times the nudge. The step's slope is $0$ wherever it has one, so nudging a score, or a weight behind it, changes nothing, and training can't tell which way to move. So we want functions that bend and still have a slope that training can use.

      ### Three curves

      The picture shows three such functions, each plotted against a neuron's score $z$ from $-3$ to $3$. The green line is **ReLU**. It's flat at $0$ for negative scores and passes positive scores through unchanged, with one corner at $0$. The blue curve is the **sigmoid**, which rises smoothly from near $0$ to near $1$ and crosses $0.5$ at $z=0$. The orange curve is **tanh**, which has the same S shape but runs from near $-1$ to near $1$ and crosses $0$ at $z=0$.

