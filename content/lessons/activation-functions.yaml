summary: |
  - Stacked linear layers multiply out into one weighted sum plus a bias, so a network needs a nonlinear activation function between its layers.
  - $\operatorname{ReLU}(z)=\max(0,z)$ keeps positive scores and turns negative ones into $0$. The sigmoid $\sigma(z)=\frac{1}{1+e^{-z}}$ squeezes a score into $0$ to $1$, and tanh squeezes it into $-1$ to $1$.
  - An activation's slope says how much a small change in its score changes its output. ReLU's slope is $1$ for positive scores and $0$ for negative ones, the sigmoid's is $\sigma(z)(1-\sigma(z))$ and tanh's is $1-\tanh^2(z)$.
  - On saturated, almost flat stretches of the sigmoid and tanh, and for a dead ReLU unit, the slope is near $0$, so training barely changes that neuron.

  **Next:** In the forward-pass lesson, we stack whole layers of neurons with activations between them and follow the numbers from a network's input to its output.
