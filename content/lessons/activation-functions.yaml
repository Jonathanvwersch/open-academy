final: act-explain-layers
summary: |
  - Stacked weighted sums with nothing between them collapse into one weighted sum, so a network needs a nonlinear activation between its layers.
  - ReLU is $\max(0, z)$; sigmoid $\sigma(z) = 1/(1 + e^{-z})$ lies between 0 and 1; tanh lies between $-1$ and $1$, centred on 0.
  - Slopes: ReLU's is 1 for positive scores and 0 for negative ones; sigmoid's is $\sigma(1 - \sigma)$, at most 0.25 and near 0 far from $z = 0$.
