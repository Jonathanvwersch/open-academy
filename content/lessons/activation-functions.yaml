concept: activation-functions
version: 3
objective: |
  **Goal:** explain why neural networks need nonlinear activations and compute common activation outputs and slopes.
where_this_fits: |
  A perceptron uses one threshold to divide house-feature inputs with a flat boundary. Stacking weighted sums alone still gives a flat rule, which cannot capture curved price patterns. The house-price network therefore needs nonlinear activation functions between its layers so that several simple computations can represent a more flexible relationship.
knowledge_points:
  - id: act-stacking-stays-straight
    title: Linear layers alone collapse to one linear rule
    explain: |
      **What a linear layer is.** It maps an input vector to weighted sums plus a bias, such as $z=Wx+b$.

      **How it works.** If two layers contain only weighted sums, then $W_2(W_1x+b_1)+b_2=(W_2W_1)x+(W_2b_1+b_2)$, which is still one affine rule. Matrix multiplication and addition preserve affine structure, so adding more such layers cannot make the house-price relationship curved.

      **Why this is useful.** This tells us why a deeper house-price model must place a nonlinear operation between its weighted-sum layers.
    worked: |
      This example shows the calculation.
      For scalar layers:

      $$
      \begin{aligned}
      z_1 &= 2x+1,\\
      z_2 &= 3z_1-4.
      \end{aligned}
      $$

      Substitution gives:

      $$z_2=3(2x+1)-4=6x-1,$$

      still a straight-line rule.
    problems:
      [
        act-stacking-stays-straight-basics,
        actp-why-not-more-layers,
        actp-what-bends,
        actp-linear-candidate,
        actp-stack-collapse,
        actp-collapse-template,
        actp-robot-linear,
      ]
  - id: act-relu-sigmoid-tanh
    title: ReLU, sigmoid and tanh change each score
    explain: |
      **What an activation function is.** It is a function applied to a neuron's weighted score before that value is passed onward.

      **How it works.** ReLU returns $\max(0,z)$; sigmoid returns $1/(1+e^{-z})$ between 0 and 1; tanh returns a value between $-1$ and 1. At house-model score $z=0.5$, ReLU gives 0.5, sigmoid gives about 0.62 and tanh about 0.46. Each changes the score differently.

      **Why this is useful.** ReLU lets hidden house-price units represent bends, while sigmoid can express a bounded yes-or-no probability when the task calls for one.
    worked: |
      This example shows the calculation.
      For $z=0.5$:

      $$
      \begin{aligned}
      \operatorname{ReLU}(z) &= 0.5,\\
      \sigma(z) &= 1/(1+e^{-0.5})\approx0.62,\\
      \tanh(z) &\approx0.46.
      \end{aligned}
      $$
    problems:
      [
        act-relu-sigmoid-tanh-basics,
        actp-relu-values,
        actp-tanh-range,
        actp-relu-sum-template,
        actp-sigmoid-template,
        actp-relu-bend,
        actp-why-sigmoid-output,
      ]
  - id: act-slopes
    title: Activation slopes guide training
    explain: |
      **What an activation slope is.** It is the derivative of the activation output with respect to its input score.

      **How it works.** ReLU has slope 1 when $z>0$ and 0 when $z<0$. Sigmoid has slope $\sigma(z)(1-\sigma(z))$, which is at most 0.25 and gets close to zero for large positive or negative scores. Tanh has slope $1-\tanh^2(z)$. These slopes tell gradient calculations how a score change affects the next layer. The small slope of a nearly flat sigmoid passes only a small gradient backward, which can slow learning.

      **Why this is useful.** Activation derivatives let the training process calculate how hidden house-price units contribute to prediction error.
    worked: |
      This example shows the calculation.
      At $z=0$, sigmoid is 0.5 and its slope is $0.5(1-0.5)=0.25$. At a score far from zero the output saturates and the slope is smaller.
    problems:
      [
        act-slopes-basics,
        actp-relu-slope,
        actp-sigmoid-slope-template,
        actp-nudge-estimate,
        actp-tanh-slope,
        actp-why-saturation,
        actp-dead-unit,
      ]
final: act-explain-layers
summary: |
  - Weighted sums alone collapse into one affine rule, so hidden layers need nonlinear activations.
  - ReLU, sigmoid and tanh produce different output ranges and shapes.
  - Their derivatives determine how gradients pass through a network.

  **Next:** The multilayer perceptron lesson stacks these activated layers to predict a house price.
