      ReLU's graph has a corner at 0, and the other two are S-shaped curves. None is a straight line, so any of them stops stacked layers collapsing into one.
    worked: |
      This example shows all three activation functions on the same scores, then adds a ReLU bend between two rules.

      | score $z$ | $-2$ | $0.5$ | $3$ |
      |---|---|---|---|
      | ReLU | 0 | 0.5 | 3 |
      | sigmoid | 0.119 | 0.622 | 0.953 |
      | tanh | $-0.964$ | 0.462 | 0.995 |

      For sigmoid at $z = -2$: $e^{2} \approx 7.389$, so $\sigma(-2) = 1/(1 + 7.389) \approx 0.119$.

      Now put ReLU between two rules: $u = x - 1$, then $y = 2\,\text{ReLU}(u) + 1$.

      - $x = 0$: $u = -1$, ReLU gives 0, $y = 1$.
      - $x = 1$: $u = 0$, $y = 1$.
      - $x = 3$: $u = 2$, $y = 5$.

      The output is flat until $x = 1$, then rises: a corner no single straight line can make.
