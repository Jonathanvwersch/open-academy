concept: chain-rule
version: 1
fast_path: [objective, summary]
blocks:
  - kind: objective
    md: |
      **Goal:** differentiate compositions with the chain rule, and explain it as multiplying local sensitivities.
  - kind: intuition
    md: |
      If $y$ depends on $u$ and $u$ depends on $x$, a nudge in $x$ moves $u$, which then moves $y$. The total sensitivity is the product of the two local sensitivities:
      $$\frac{dy}{dx} = \frac{dy}{du}\cdot\frac{du}{dx}.$$
      This rule lets us differentiate a nested formula one step at a time.
  - kind: example
    md: |
      This example applies the chain rule to a square built from an inner linear expression.

      $y = (3x + 1)^2$. Let $u = 3x + 1$, so $y = u^2$. Then $dy/du = 2u$ and $du/dx = 3$, giving $dy/dx = 2(3x+1)\cdot 3 = 6(3x+1)$.
  - kind: math
    md: |
      Single variable: $(f\circ g)'(x) = f'(g(x))\,g'(x)$.

      Multivariable: if $L$ depends on $x$ through several intermediate variables $u_1,\dots,u_k$, **sum over the paths**:
      $$\frac{\partial L}{\partial x} = \sum_{j} \frac{\partial L}{\partial u_j}\frac{\partial u_j}{\partial x}.$$
  - kind: worked
    md: |
      This worked example differentiates a nested expression and adds contributions from two paths.

      **Square of a linear expression.** Let $u = 2x - 1$ and $y = u^2$.

      1. Inner: $du/dx = 2$.
      2. Outer: $dy/du = 2u$.
      3. Chain: $dy/dx = 2u\cdot 2 = 4(2x - 1)$.

      At $x = 2$, $u = 3$, so $dy/dx = 12$.

      **Two paths.** Let $f = u + v$, where $u = x^2$ and $v = 3x$. Then $df/dx = 2x + 3$. At $x = 2$, the two paths contribute 4 and 3, for a total of 7.
  - kind: check
    exercise: cr-check-1
  - kind: summary
    md: |
      - Multiply local derivatives along a chain.
      - When a variable affects the output along several paths, add the contributions of the paths.
