      - crp-why-multiply
      - crp-total-rate
      - crp-rate-product
      - crp-three-steps
  - id: cr-nested-formulas
    title: "Slope of a formula inside a formula"
    explain: |
      **The question.** How do you differentiate $y=(3x+1)^2$ without expanding the bracket? The rules you know handle $u^2$ and $3x+1$ separately, but here one sits inside the other.

      **Picture it.** Read the formula as two steps. First an **inner** step turns $x$ into $u=3x+1$. Then an **outer** step squares it: $y=u^2$. At $x=1$, the inner step gives $u=4$ and the outer step gives $y=16$. Each step has its own rate there: the inner one is $3$, and the outer one is $2u=8$, worked out at the value it receives, $u=4$. A nudge of $0.01$ in $x$ becomes $0.03$ in $u$, then about $0.24$ in $y$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" aria-label="Pipeline at x equals 1: the inner step u equals 3x plus 1 gives u equals 4 with rate 3, the outer step y equals u squared gives y equals 16 with rate 8, so dy/dx equals 24 and a nudge of 0.01 becomes about 0.24">
        <defs>
          <marker id="cr2-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <rect x="110" y="55" width="140" height="60" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
          <rect x="390" y="55" width="120" height="60" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
          <path d="M70 85 H107" stroke="#737373" stroke-width="2" marker-end="url(#cr2-arrow)"/>
          <path d="M250 85 H287" stroke="#737373" stroke-width="2" marker-end="url(#cr2-arrow)"/>
          <path d="M350 85 H387" stroke="#737373" stroke-width="2" marker-end="url(#cr2-arrow)"/>
          <path d="M510 85 H547" stroke="#737373" stroke-width="2" marker-end="url(#cr2-arrow)"/>
          <text x="14" y="90">x = 1</text>
          <text x="180" y="90" text-anchor="middle">u = 3x + 1</text>
          <text x="294" y="90">u = 4</text>
          <text x="450" y="90" text-anchor="middle">y = u²</text>
          <text x="554" y="90">y = 16</text>
          <text x="180" y="40" text-anchor="middle" fill="#737373">inner step</text>
          <text x="450" y="40" text-anchor="middle" fill="#737373">outer step</text>
          <text x="180" y="145" text-anchor="middle" fill="#3b82f6">du/dx = 3</text>
          <text x="450" y="145" text-anchor="middle" fill="#3b82f6">dy/du = 2u = 8</text>
          <text x="320" y="185" text-anchor="middle" font-size="15">dy/dx = 8 × 3 = 24</text>
          <text x="320" y="230" text-anchor="middle" fill="#f59e0b">nudge x by 0.01: u moves 0.03, y moves about 0.24</text>
        </g>
      </svg>
      ```

      **The idea.** Differentiate the outer step at the inner value, then multiply by the inner step's rate. A **composite function** applies one function to the output of another. Write $f\circ g$ (read “$f$ after $g$”) for the function that applies $g$ first, then $f$: $(f\circ g)(x)=f(g(x))$. The chain rule for it is

      $$(f\circ g)'(x)=f'(g(x))\cdot g'(x).$$

      In words: $f'(g(x))$ is the outer rate, evaluated at the inner value, and $g'(x)$ is the inner rate. For $(3x+1)^2$, $g(x)=3x+1$ and $f(u)=u^2$, so $f'(g(x))=2(3x+1)$ is the $2u$ above and $g'(x)=3$.

      **Common confusion.** “The derivative of $(3x+1)^2$ is just $2(3x+1)$, like the power rule.” Only half right. That is the outer rate. The bracket itself changes $3$ times as fast as $x$, so you must also multiply by $3$: the derivative is $6(3x+1)$.
    worked: |
      Find the slope of $y=(2x-1)^3$ at $x=2$, then check it with a small nudge.

      1. **Name the inner and outer steps.**
         $$u=2x-1,\qquad y=u^3.$$

      2. **Find the inner value and the inner rate.**
         $$u=2(2)-1=3,\qquad \frac{du}{dx}=2.$$

      3. **Find the outer rate at that inner value.**
         $$\frac{dy}{du}=3u^2=3(3)^2=27.$$

      4. **Multiply.**
         $$\frac{dy}{dx}=27\times2=54.$$

      5. **Check with a nudge of $0.01$.**
         $$(2(2.01)-1)^3-27=3.02^3-27=0.543608\approx 54\times0.01.$$

      **Compare cases.** Back to the pictured $y=(3x+1)^2$ at other points: the outer rate changes with the inner value, the inner rate stays $3$.

      | $x$ | $u=3x+1$ | $dy/du=2u$ | $dy/dx$ |
      | --- | --- | --- | --- |
      | $1$ | $4$ | $8$ | $24$ |
      | $0$ | $1$ | $2$ | $6$ |
      | $-1/3$ | $0$ | $0$ | $0$ |
      | $-1$ | $-2$ | $-4$ | $-12$ |

      **Where it shows up.** The derivatives lesson's house loss $L(w)=(12w-330)^2$ is an outer square of an inner error $e=12w-330$. The chain rule gives $dL/dw=2e\cdot12$, which is $-720$ at $w=25$, the same slope as before.
