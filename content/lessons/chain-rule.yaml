concept: chain-rule
version: 3
objective: |
  **Goal:** use the chain rule to find how a house-network parameter changes the final price loss.
where_this_fits: |
  The MLP forward pass turned the house features into a price through hidden values and an output layer. To train it, we must find how changing an early weight affects the final loss through every later calculation. The chain rule multiplies the local rates along that sequence.
knowledge_points:
  - id: cr-rates-multiply
    title: Rates along a chain multiply
    explain: |
      **What the chain rule is.** It finds the derivative of a nested calculation by multiplying the derivative at each step.

      **How it works.** For functions $f$ and $g$, $g\circ f$ means apply $f$ first, then $g$. In a small house network, area $a$ sets score $z=0.1a$, the hidden value is $h=\max(0,z)$, and the predicted price is $\hat y=15h+306.5$. At $a=12$, $z=h=1.2$. The local rates are $dh/dz=1$, $d\hat y/dh=15$, and $dz/da=0.1$, so $d\hat y/da=15\cdot1\cdot0.1=1.5$ thousand pounds per feature unit. Multiplying the rates works because each converts a change into the units of the next quantity.

      **Why this is useful.** The product tells how a house input affects the network's final price through its hidden computation.
    worked: |
      This example shows the calculation.
      For $a=12$, $z$ is positive, so the max operation has slope $dh/dz=1$:

      $$\frac{d\hat y}{da}=\frac{d\hat y}{dh}\frac{dh}{dz}\frac{dz}{da}=15\cdot1\cdot0.1=1.5.$$
    problems:
      [
        crp-total-rate,
        crp-rate-product,
        crp-why-multiply,
        crp-local-meaning,
        crp-robot-wheel,
        crp-three-steps,
      ]
  - id: cr-nested-formulas
    title: Differentiate a formula inside a formula
    explain: |
      **What a composite function is.** It is a function whose input is first transformed by another function.

      **How it works.** For the house network, let $z=0.1a$, $h=\max(0,z)$, $\hat y=15h+306.5$, and $L=(\hat y-330)^2$. At $a=12$, $\hat y=324.5$. The loss slope with respect to area multiplies each local derivative:

      $$\frac{dL}{da}=2(\hat y-330)\cdot15\cdot1\cdot0.1=-16.5.$$

      Including the max-operation derivative accounts for how the hidden value responds to its score.

      **Why this is useful.** The chain rule connects the house's final price error to an early network weight or input.
    worked: |
      This example shows the calculation.
      At $a=12$, the loss error is $324.5-330=-5.5$ and the max-operation slope is 1. Therefore $dL/da=2(-5.5)(15)(1)(0.1)=-16.5$. For the weight $0.1$, the final factor is $dz/dw=a=12$, giving $dL/dw=-1980$.
    problems:
      [
        crp-diff-cube,
        crp-nested-slope,
        crp-why-inner-factor,
        crp-inner-outer,
        crp-compose-notation,
        crp-diff-log,
      ]
  - id: cr-two-routes
    title: Add derivatives when an input has two routes
    explain: |
      **What a route is.** It is one sequence of operations through which an input affects an output.

      **How it works.** Suppose area contributes to two hidden values, $h_1=0.1a$ and $h_2=0.05a$, and the price score is $\hat y=15h_1+10h_2+306.5$. The two route rates are $15(0.1)=1.5$ and $10(0.05)=0.5$. Since both routes change the same output, add them: $d\hat y/da=2$. The route rates add because a small area change affects the output through both hidden values.

      **Why this is useful.** Adding paths accounts for every way a house feature can influence the predicted price.
    worked: |
      This example shows the calculation.
      Route 1 contributes $(d\hat y/dh_1)(dh_1/da)=15(0.1)=1.5$. Route 2 contributes $10(0.05)=0.5$. Their sum is $2$ thousand pounds per area-feature unit.
    problems:
      [
        crp-sum-routes,
        crp-trip-cost,
        crp-why-both-routes,
        crp-routes-expression,
        crp-partial-meaning,
        crp-robot-routes,
      ]
final: cr-explain
summary: |
  - The chain rule multiplies local derivatives along a route through nested functions.
  - If an input reaches an output by several routes, add the route products.
  - These rules connect house-network parameters to the final price loss.

  **Next:** Computational graphs draw the operations and routes before calculating their derivatives.
