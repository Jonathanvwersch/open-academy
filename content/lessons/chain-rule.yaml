  - id: cr-two-routes
    title: "When an input affects the output two ways"
    explain: |
      **The question.** Sometimes one input feeds two in-between values, and both feed the output. A chain gives one product of rates, but now there are two chains. How do you combine them?

      **Picture it.** Let $u=2x$ and $v=x+3$, and let the output be their product, $f=uv$. The picture draws each quantity as a circle and each dependence as an arrow, with each step's rate at $x=1$. There are two **routes** from $x$ to $f$: through $u$ (blue) and through $v$ (green). Along the blue route the rates are $2$ and $\partial f/\partial u=v=4$; along the green route they are $1$ and $\partial f/\partial v=u=2$. Each partial derivative asks “what if only this in-between value moved?”, holding the other one fixed, so it measures its own route only. The real nudge moves both.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" aria-label="x feeds u equals 2x along a blue route and v equals x plus 3 along a green route, both feed f equals uv; at x equals 1 the blue route gives 4 times 2 equals 8, the green route gives 2 times 1 equals 2, and df/dx equals 10">
        <defs>
          <marker id="cr3-blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
          <marker id="cr3-green-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M106.2 150.2 L290 81.2" stroke="#3b82f6" stroke-width="3" marker-end="url(#cr3-blue-arrow)"/>
          <path d="M346.2 79.8 L530 148.8" stroke="#3b82f6" stroke-width="3" marker-end="url(#cr3-blue-arrow)"/>
          <path d="M106.2 169.8 L290 238.8" stroke="#10b981" stroke-width="3" marker-end="url(#cr3-green-arrow)"/>
          <path d="M346.2 240.2 L530 171.2" stroke="#10b981" stroke-width="3" marker-end="url(#cr3-green-arrow)"/>
          <circle cx="80" cy="160" r="26" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <circle cx="320" cy="70" r="26" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <circle cx="320" cy="250" r="26" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <circle cx="560" cy="160" r="26" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <text x="80" y="166" text-anchor="middle" font-size="16">x</text>
          <text x="320" y="76" text-anchor="middle" font-size="16">u</text>
          <text x="320" y="256" text-anchor="middle" font-size="16">v</text>
          <text x="560" y="166" text-anchor="middle" font-size="16">f</text>
          <text x="80" y="208" text-anchor="middle">x = 1</text>
          <text x="320" y="30" text-anchor="middle">u = 2x = 2</text>
          <text x="320" y="298" text-anchor="middle">v = x + 3 = 4</text>
          <text x="560" y="208" text-anchor="middle">f = uv = 8</text>
          <text x="125" y="100" fill="#3b82f6">du/dx = 2</text>
          <text x="440" y="96" fill="#3b82f6">∂f/∂u = v = 4</text>
          <text x="125" y="236" fill="#10b981">dv/dx = 1</text>
          <text x="440" y="236" fill="#10b981">∂f/∂v = u = 2</text>
          <text x="320" y="165" text-anchor="middle">df/dx = 8 + 2 = 10</text>
          <text x="20" y="330" fill="#3b82f6">route through u: 4 × 2 = 8</text>
          <text x="340" y="330" fill="#10b981">route through v: 2 × 1 = 2</text>
        </g>
      </svg>
      ```

      **The idea.** Multiply the rates along each route, then add the routes. In general, if $f$ depends on $u$ and $v$, and both depend on $x$, the **multivariable chain rule** is

      $$\frac{df}{dx}=\frac{\partial f}{\partial u}\cdot\frac{du}{dx}+\frac{\partial f}{\partial v}\cdot\frac{dv}{dx}.$$

      Each term is one route's product; with more routes you add more terms. The routes add because, for a small nudge, each route's effect is small and they simply pile up; the cross effect of $u$ and $v$ moving together is a small nudge times a small nudge, too tiny to count.

      **Common confusion.** “$\frac{\partial f}{\partial u}\cdot\frac{du}{dx}$ is already the chain rule, so that's the derivative.” Only half right. That partial holds $v$ fixed, but nudging $x$ moves $v$ too. Leaving out the green route would give $8$ instead of $10$.
    worked: |
      Find $df/dx$ for $f=uv$ with $u=x^2$ and $v=3x+1$, at $x=2$.

      1. **Find the in-between values and their rates.**
         $$u=2^2=4,\qquad v=3(2)+1=7,\qquad \frac{du}{dx}=2x=4,\qquad \frac{dv}{dx}=3.$$

      2. **Multiply along the route through $u$.**
         $$\frac{\partial f}{\partial u}\cdot\frac{du}{dx}=v\cdot4=7\times4=28.$$

      3. **Multiply along the route through $v$.**
         $$\frac{\partial f}{\partial v}\cdot\frac{dv}{dx}=u\cdot3=4\times3=12.$$

      4. **Add the routes.**
         $$\frac{df}{dx}=28+12=40.$$

      5. **Check by substituting first.**
         $$f=x^2(3x+1)=3x^3+x^2,\qquad f'(x)=9x^2+2x=40\text{ at }x=2.$$

      **Compare cases.** Back to the pictured $f=uv$ with $u=2x$ and $v=x+3$: at other values of $x$ the two routes can share the work, or pull against each other.

      | $x$ | route through $u$: $2v$ | route through $v$: $u$ | $df/dx$ |
      | --- | --- | --- | --- |
      | $1$ | $8$ | $2$ | $10$ |
      | $0$ | $6$ | $0$ | $6$ |
      | $-1.5$ | $3$ | $-3$ | $0$ |
      | $-2$ | $2$ | $-4$ | $-2$ |

      **Where it shows up.** In a model, one weight can feed two in-between values that both reach the loss, so its loss slope is the sum of two route products. The next lesson, computational graphs, draws every route like this so none is missed.
    problems:
      - cr-two-routes-basics
      - crp-why-both-routes
      - crp-sum-routes
      - crp-routes-expression
      - crp-robot-heat
final: cr-explain
summary: |
  - Along a chain of steps, the rates of change multiply.
  - To differentiate a formula inside a formula, take the outer rate at the inner value and multiply by the inner rate.
  - When an input reaches the output by several routes, multiply along each route and add the routes.

  **Next:** Computational graphs draw the steps and routes of a calculation before you differentiate it.
