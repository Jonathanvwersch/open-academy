concept: chain-rule
version: 4
objective: |
  **Goal:** find how an output changes when its input reaches it through a chain of steps, by multiplying the rates along each route and adding the routes together.
where_this_fits: |
  To train a model you need the slope of its loss with respect to each weight. But a weight rarely touches the loss directly: it changes a prediction, the prediction changes the error, and the error changes the loss. The derivative rules you know work on one formula at a time, and expanding a long chain into a single formula quickly gets messy. This lesson builds the tool that follows the chain instead, the **chain rule**, in three steps:

  1. Multiply the rates of change along a chain of steps.
  2. Use that to differentiate a formula inside another formula.
  3. Add the contributions when an input reaches the output by more than one route.
knowledge_points:
  - id: cr-rates-multiply
    title: "Multiply the rates along a chain"
    explain: |
      **The question.** Suppose $x$ feeds a first step that produces an in-between value $u$, and $u$ feeds a second step that produces the output $y$. You know how fast each step responds to its own input. How fast does $y$ respond to $x$?

      **Picture it.** Take the simplest chain: the first step triples its input, $u=3x$, and the second doubles its input, $y=2u$. The picture shows three number lines on the same scale, one tick per $0.1$. Nudge $x$ by $0.1$ (amber). The first step turns that into a nudge of $0.3$ in $u$, and the second turns $0.3$ into $0.6$ in $y$. The output moved $6$ times as far as the input, and $6=2\times3$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="Three number lines on the same scale: a nudge of 0.1 in x becomes 0.3 in u after the times-3 step and 0.6 in y after the times-2 step">
        <defs>
          <marker id="cr1-blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M100 80 H600 M100 160 H600 M100 240 H600" stroke="#d4d4d4" stroke-width="1.5"/>
          <path d="M130 74 V86 M160 74 V86 M190 74 V86 M220 74 V86 M250 74 V86 M280 74 V86 M310 74 V86 M340 74 V86 M370 74 V86 M130 154 V166 M160 154 V166 M190 154 V166 M220 154 V166 M250 154 V166 M280 154 V166 M310 154 V166 M340 154 V166 M370 154 V166 M130 234 V246 M160 234 V246 M190 234 V246 M220 234 V246 M250 234 V246 M280 234 V246 M310 234 V246 M340 234 V246 M370 234 V246" stroke="#d4d4d4" stroke-width="1.5"/>
          <path d="M130 80 H160 M130 160 H220 M130 240 H310" stroke="#f59e0b" stroke-width="6" stroke-linecap="butt"/>
          <path d="M160 88 L217 152" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cr1-blue-arrow)"/>
          <path d="M220 168 L307 232" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cr1-blue-arrow)"/>
          <text x="60" y="85" font-size="16">x</text>
          <text x="60" y="165" font-size="16">u</text>
          <text x="60" y="245" font-size="16">y</text>
          <text x="170" y="66" fill="#f59e0b">nudge 0.1</text>
          <text x="232" y="148" fill="#f59e0b">moves 0.3</text>
          <text x="322" y="228" fill="#f59e0b">moves 0.6</text>
          <text x="420" y="125" fill="#3b82f6">u = 3x: ×3</text>
          <text x="420" y="205" fill="#3b82f6">y = 2u: ×2</text>
          <text x="100" y="285" fill="#737373">each tick = 0.1, same scale on every line</text>
        </g>
      </svg>
      ```

      **The idea.** A nudge passes through each step in turn and gets scaled by that step's rate, so the rates multiply. When a step's rate changes from point to point, this holds for small nudges, which is exactly what a derivative describes. In general, the **chain rule** says: if $y$ depends on $u$ and $u$ depends on $x$, then

      $$\frac{dy}{dx}=\frac{dy}{du}\cdot\frac{du}{dx}.$$

      Here $\frac{du}{dx}$ is another way to write the derivative of $u$ with respect to $x$: how much $u$ moves per unit of $x$. It is one symbol, not a fraction to cancel. Likewise $\frac{dy}{du}$ is the second step's rate. A longer chain just multiplies more rates.

      **Common confusion.** “Each step adds its own change, so I should add the rates: $3+2=5$.” No. The second step doesn't see the original nudge of $0.1$; it sees the already-tripled nudge of $0.3$, and doubles that. Scaling a scaled nudge is multiplication. Units agree: km per hour times litres per km gives litres per hour.
    worked: |
      A car drives at $50$ km per hour, uses $0.08$ litres of fuel per km, and fuel costs $1.5$ pounds per litre. Time $t$ sets distance $s$, distance sets fuel $F$, and fuel sets cost $C$. How fast does the cost grow, in pounds per hour?

      1. **Write down each step's rate.**
         $$\frac{ds}{dt}=50,\qquad \frac{dF}{ds}=0.08,\qquad \frac{dC}{dF}=1.5.$$

      2. **Multiply along the chain.**
         $$\frac{dC}{dt}=\frac{dC}{dF}\cdot\frac{dF}{ds}\cdot\frac{ds}{dt}.$$

      3. **Put in the numbers.**
         $$\frac{dC}{dt}=1.5\times0.08\times50=6.$$

      4. **Check the units.**
         $$\frac{\text{pounds}}{\text{litre}}\times\frac{\text{litres}}{\text{km}}\times\frac{\text{km}}{\text{hour}}=\frac{\text{pounds}}{\text{hour}}.$$

      So driving costs $6$ pounds per hour.

      **Compare cases.** Two-step chains with different rates:

      | $du/dx$ | $dy/du$ | $dy/dx$ |
      | --- | --- | --- |
      | $3$ | $2$ | $6$ |
      | $3$ | $-2$ | $-6$ |
      | $0.5$ | $4$ | $2$ |
      | $3$ | $0$ | $0$ |

      A negative rate anywhere flips the sign, and a zero rate anywhere makes the overall slope zero at that point.

      **Where it shows up.** A model's loss $L$ depends on its prediction $p$, which depends on a weight $w$. The loss slope for the weight is the product $\frac{dL}{dw}=\frac{dL}{dp}\cdot\frac{dp}{dw}$.
