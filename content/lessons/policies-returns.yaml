  - id: pr-weight-delay
    title: Choose how much delay matters
    explain: |
      ### The same trip with different weights

      Changing the discount factor lets us score the same trip in different ways. Keep the three rewards $-1$, $-1$, then $+10$ fixed as we change $\gamma$.

      The **discount factor** $\gamma$ controls the weight given to each extra step of delay. It lies between $0$ and $1$, including both ends. The first three weights are

      $$1,\quad\gamma,\quad\gamma^2.$$

      Let's compare three values of $\gamma$. The rewards and movements stay fixed.

      | $\gamma$ | Weights | $G_0$ |
      | --- | --- | --- |
      | $0$ | $(1,0,0)$ | $-1$ |
      | $0.9$ | $(1,0.9,0.81)$ | $6.2$ |
      | $1$ | $(1,1,1)$ | $8$ |

      With $\gamma=0$, only the next reward counts. The delayed success has no weight in the starting score. With $\gamma=1$, all remaining rewards count fully, so a finite trip's return is their ordinary sum. Between these ends, a larger $\gamma$ gives distant rewards more weight.

      ### Delayed gains and penalties

      For $0<\gamma<1$, the same positive reward counts for more when it arrives sooner.

      Discounting also reduces the weight of delayed penalties. Be careful not to assume that raising $\gamma$ always raises a return. Imagine a two-action game to see why. Its first action earns $0$. Its second action earns $-10$ and ends the game. Raising $\gamma$ from $0.5$ to $0.9$ changes its starting return from $-5$ to $-9$.

      ### Limitations

      A single trip's return gives limited evidence about a policy. Suppose left and right each have probability $0.5$ in cells 1 to 3. With $\gamma=0.9$, three rights give return $6.2$. A left wall bump followed by three rights gives $4.58$. Both trips can occur under this policy. Judging it requires considering the possible trips and how often they occur.

      We use $\gamma=1$ only for finite episodes here. Some tasks have no set end, such as a robot that keeps patrolling. If it keeps earning $+1$ each step, the totals after one, two and three actions are $1$, $2$ and $3$. The total keeps growing without a finite limit. Choosing $\gamma<1$ makes the total finite in this example.
    worked: |
      Let's compare how much the end reward adds to our three-move corridor return at $\gamma=0.5$ and $\gamma=0.9$.

      1. **Find its delay.** Two rewards come before the end reward, so its contribution uses two factors of the discount.
         $$\text{end reward contribution}=\gamma^2\times10.$$

      2. **Score with the smaller factor.** At $\gamma=0.5$, the goal's contribution is $2.5$, and we include the two step costs.
         $$G_0=(-1)+0.5(-1)+0.5^2(10)=1.$$

      3. **Score with the usual factor.** At $\gamma=0.9$, the goal's contribution is $8.1$.
         $$G_0=(-1)+0.9(-1)+0.9^2(10)=6.2.$$

      The trip earned the same rewards both times. The larger $\gamma$ gave the delayed goal more weight in its score.
