final: pr-explain-trip
summary: |
  - A deterministic policy $\pi(s)$ picks one action in each state. A stochastic policy $\pi(a\mid s)$ assigns action probabilities that add to $1$.
  - A return adds rewards from the current time onward, with weights $1,\gamma,\gamma^2,\dots$: $G_t=r_{t+1}+\gamma r_{t+2}+\dots$ through the episode's end.
  - The discount $\gamma$ controls the weight of delay: $0$ counts only the next reward, while $1$ counts every reward fully in a finite episode.
  - A return scores one episode. Judging a policy with random outcomes requires considering the possible episodes and how often they occur.

  **Next:** Value functions use the possible returns under a policy to describe how promising a state or an action is.
