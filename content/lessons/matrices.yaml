final: mat-explain-batch
summary: |
  - A matrix is a rectangular grid of numbers with a shape, rows $\times$ columns. A matrix times a vector takes one dot product per row, so an $m\times n$ matrix and an $n$-entry vector give $m$ answers.
  - To find the entry in row $i$ and column $j$ of $AB$, take the dot product of row $i$ of $A$ with column $j$ of $B$. The inner sizes must match and the outer sizes give the shape.
  - The transpose swaps rows and columns. We used it to put each set of prediction weights in a column of $W$ before multiplying by the house matrix $X$.

  **Next:** The determinants lesson uses matrices with the same number of rows and columns. It shows how such a matrix can move points and change the area between them.
