      **Why this is useful.** Put each house's measurements in one row and the model's weights in the vector. One multiplication then gives every house's predicted price: row 1 gives house 1's price, row 2 gives house 2's, and so on. The next lesson, linear regression, makes predictions for a whole dataset this way, and a layer of a neural network does the same calculation.
    worked: |
      This example shows three houses priced with one multiplication.

      Rows (12,3,20), (8,2,5), (15,4,30); weights $w=(25,10,−1)$.

      1. Row 1: $25\cdot12 + 10\cdot3 − 1\cdot20 = 300 + 30 − 20 = 310$.
      2. Row 2: $25\cdot8 + 10\cdot2 − 1\cdot5 = 200 + 20 − 5 = 215$.
      3. Row 3: $25\cdot15 + 10\cdot4 − 1\cdot30 = 375 + 40 − 30 = 385$.

      So $Xw=(310, 215, 385)$: a $3\times3$ matrix times a 3-entry vector gives 3 prices, one per house.
