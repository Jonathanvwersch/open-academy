  - id: mat-batches-transpose
    title: "Multiply matrices in NumPy"
    tldr: |
      - NumPy provides Python tools for grids of numbers.
      - It can multiply matrices and add a fixed amount to each prediction.
      - Swap rows and columns if the weights are stored the other way round.
      - Then one calculation gives all predictions for a group of examples.
    explain: |
      ### Matrices in Python

      For a thousand houses, we'd let a computer work out the product. In Python, the usual tool is **NumPy**. It's a library, ready-made code we can load, for grids of numbers, which it calls **arrays**. The line `import numpy as np` loads it under the short name `np`, and `np.array([[12, 3, 20], [8, 2, 5]])` builds our $X$ from a list of its rows. An array's `.shape` gives its size as (rows, columns), here `(2, 3)`, and `X @ W` is the matrix product $XW$. Models usually work through their houses in groups called **batches**, so `X` has one row for each house in the batch.

      ### Adding a bias to every row

      Many models also add a fixed amount to each prediction, whatever the house, like a base price. That amount is called a **bias**. With two predictions there's one bias for each, say 20 for price and 100 for rent, so $b=(20,100)$.

      The picture shows the shapes for a batch of five houses. The blue $X$ times the orange $W$ gives one row per house, and $b$ is a single row. In `X @ W + b`, NumPy **broadcasts** `b`, which means it reuses that one row for every house, drawn dashed. So every price goes up by 20 and every rent by 100.

