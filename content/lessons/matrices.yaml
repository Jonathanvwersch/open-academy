  - id: mat-matrix-products
    title: Multiplying matrices and matching shapes
    explain: |
      **What a matrix product is.** A **matrix product** combines a left matrix and a right matrix to make a new grid. For each output entry, take one row from the left matrix and one column from the right matrix, multiply matching entries, and add them; this is their dot product.

      **How it works.**
      1. If the left matrix has shape $m\times n$ and the right has shape $n\times p$, their **inner dimensions** are the matching counts $n$.
      2. The matching entries let each row-column pair form a dot product. The product has shape $m\times p$: the outer counts remain, while the inner count is summed over.
      3. For example, $(2\times3)(3\times2)$ gives a $2\times2$ result. But $(2\times3)(2\times4)$ is undefined because 3 and 2 do not match.

      The rule works because each feature in a house row is paired with exactly one weight for each score. The inner feature count is consumed by the sum; one output remains for each left row and right column.

      **Why this is useful.** Put each house's measurements in a row of $X$ and each set of buyer weights in a column of $W$. If $X$ has shape $n\times d$ and $W$ has shape $d\times k$, then $XW$ has shape $n\times k$: one score for each of $n$ houses and $k$ sets of weights.
    worked: |
      This example shows two sets of weights scoring two houses together.

      The rows of $X$ are two houses' area and bedroom measurements. The columns of $W$ are two sets of buyer weights:

      $$X=\begin{bmatrix}4&1\\2&3\end{bmatrix},\qquad W=\begin{bmatrix}0.5&1\\2&-1\end{bmatrix}.$$

      1. Both matrices have shape $2\times2$, so the inner counts match and the output has shape $2\times2$.
      2. House 1 with weights 1: $4\cdot0.5+1\cdot2=4$; with weights 2: $4\cdot1+1\cdot(-1)=3$.
      3. House 2 with weights 1: $2\cdot0.5+3\cdot2=7$; with weights 2: $2\cdot1+3\cdot(-1)=-1$.

      $$XW=\begin{bmatrix}4&3\\7&-1\end{bmatrix}.$$

      Each crossing of a house row and weight column is one dot product, so the result keeps one row per house and one column per set of weights.
    problems: [matp-shape, matp-entry-template, matp-invalid, matp-entry, matp-batch-shape]
  - id: mat-change-space
    title: Matrices transform coordinates and compose rules
    explain: |
      **What a matrix transformation is.** A **transformation** is a rule that changes a vector's coordinates. A matrix transformation is **linear**: it preserves addition and scaling, so transforming two vectors and then adding gives the same result as adding first and transforming once.

      **How it works.**
      1. A **shear** sends $(x,y)$ to $(x+2y,y)$. It adds twice the second coordinate to the first, while leaving the second unchanged.
      2. The **identity matrix** $I=\begin{bmatrix}1&0\\0&1\end{bmatrix}$ leaves every vector unchanged: $Ix=x$.
      3. **Composition** means applying two transformations in sequence. $ABx=A(Bx)$ means $B$ acts first and $A$ acts second. In general, $AB\ne BA$: the second rule receives a different input when the order changes.

      For example, with $A=\begin{bmatrix}1&1\\0&1\end{bmatrix}$ and $B=\begin{bmatrix}1&0\\1&1\end{bmatrix}$, $AB=\begin{bmatrix}2&1\\1&1\end{bmatrix}$ but $BA=\begin{bmatrix}1&1\\1&2\end{bmatrix}$. Matrix multiplication records the order because each output applies the next rule to the previous rule's result.

      **Why this is useful.** A house-price model can apply one consistent matrix transformation to every house's feature vector before scoring it. Robots use the same composition rule when changing coordinates between frames.
    worked: |
      This example shows a shear, the identity, and why transformation order matters.

      The shear matrix is $S=\begin{bmatrix}1&2\\0&1\end{bmatrix}$, so $S(x,y)=(x+2y,y)$.

      1. The identity keeps $(1,0)$ fixed: $I(1,0)=(1,0)$.
      2. The shear keeps $(1,0)$ fixed and sends $(0,1)$ to $(2,1)$.
      3. Let $A=\begin{bmatrix}1&1\\0&1\end{bmatrix}$ and $B=\begin{bmatrix}1&0\\1&1\end{bmatrix}$. Then $AB=\begin{bmatrix}2&1\\1&1\end{bmatrix}$, while $BA=\begin{bmatrix}1&1\\1&2\end{bmatrix}$.

      Thus $AB$ and $BA$ are different: doing $B$ and then $A$ does not generally give the same result as doing $A$ and then $B$.
    problems:
      [matp-linear, matp-shear-template, matp-identity, matp-why-order, matp-shear, matp-swap]
  - id: mat-batches-transpose
    title: Scoring many houses with NumPy
    explain: |
      **What a NumPy array is.** **NumPy** is a Python library for calculations on arrays, which are collections of numbers with a shape. A table $X$ with $n$ house rows and $d$ measurements per house has shape $(n,d)$.

      **How it works.**
      1. Store every house as a row of $X$. Store $k$ sets of weights as columns of $W$, shape $(d,k)$; `X @ W` gives shape $(n,k)$.
      2. The `@` operator performs matrix multiplication, so each output is a dot product. The `*` operator multiplies matching entries without adding them, so it does not produce weighted sums.
      3. A **bias** $b$ is a fixed amount added to each score. In `X @ W + b`, if `b` has shape $(k,)$, **broadcasting** reuses its $k$ amounts for every house row.
      4. `.shape` reports dimensions. The **transpose**, written `.T`, swaps rows and columns; it changes orientation without changing the numbers.

      These steps work because all house rows share the same feature order and weight columns. NumPy performs the repeated dot products together, then adds the same buyer-specific bias to each row.

      **Why this is useful.** One expression, `X @ W + b`, scores many houses for several sets of weights without writing a separate loop for every house. The output still has one row per house and one column per score, making the house-price calculations easy to check.
    worked: |
      This example shows how the app scores two houses for two buyers, then adds a fixed amount to each buyer's score.

      Areas are in hundreds of square metres, followed by bedroom counts. Thus $(4,1)$ describes a 400-square-metre house with one bedroom. Each column of `W` holds one buyer's weights. The import names NumPy `np` for short. `np.array` builds an array from lists; each inner list becomes a row. Here `b` is a list of two biases, one per buyer.

      ```python
      import numpy as np

      X = np.array([[4, 1], [2, 3]])       # two houses, two features
      W = np.array([[0.5, 1], [2, -1]])    # two features, two scores
      b = np.array([1, 10])               # one bias per score
      Y = X @ W + b
      print(Y)
      # [[ 5. 13.]
      #  [ 8.  9.]]
      print(Y.shape)                     # (2, 2)
      weights_as_rows = W.T
      print(weights_as_rows)
      # [[ 0.5  2. ]
      #  [ 1.  -1. ]]
      ```

      1. First house, first score: $4\cdot0.5+1\cdot2+1=2+2+1=5$.
      2. First house, second score: $4\cdot1+1\cdot(-1)+10=4-1+10=13$.
      3. Second house, first score: $2\cdot0.5+3\cdot2+1=1+6+1=8$.
      4. Second house, second score: $2\cdot1+3\cdot(-1)+10=2-3+10=9$.

      The two biases are reused for each house, and `weights_as_rows.T` restores the columns needed for the product.
    problems:
      [
        matp-code,
        matp-bias-template,
        matp-transpose,
        matp-broadcast,
        matp-why-batch,
        matp-transpose-product,
      ]
final: mat-explain-batch
summary: |
  - A matrix stores values in rows and columns. Multiplying by a vector takes one dot product per row; multiplying matrices pairs each left row with each right column, and the inner dimensions must match.
  - Matrices can represent transformations such as shears and the identity. Composition applies the rightmost matrix first, and $AB$ does not generally equal $BA$.
  - NumPy uses `@` to score many houses at once. In `X @ W + b`, the bias is broadcast across house rows.

  **Next:** Linear regression uses these matrix operations to predict prices for all houses and compare them with their sale prices.
