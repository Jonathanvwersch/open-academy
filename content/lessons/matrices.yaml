          <rect x="180" y="42" width="44" height="38" rx="4" fill="#ffffff" stroke="#d4d4d4"/>
          <rect x="180" y="80" width="44" height="38" rx="4" fill="#ffffff" stroke="#d4d4d4"/>
          <text x="198" y="67">3</text><text x="198" y="105">1</text>
