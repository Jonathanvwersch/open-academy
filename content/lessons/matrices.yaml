  - id: mat-batches-transpose
    title: Scoring many houses with NumPy
    explain: |
      **What a NumPy array is.** **NumPy** is a Python library for calculations on arrays, which are collections of numbers with a shape. A table $X$ with $n$ house rows and $d$ measurements per house has shape $(n,d)$.

      **How it works.**
      1. Store every house as a row of $X$. Store price and rent weights as columns of $W$, shape $(3,2)$; `X @ W` gives shape $(n,2)$.
      2. The `@` operator performs matrix multiplication, so each output is a dot product. The `*` operator multiplies matching entries without adding them, so it does not produce weighted sums.
      3. A **bias** $b$ is a fixed amount added to each output. In `X @ W + b`, if $b$ has shape $(2,)$, **broadcasting** reuses its two amounts for every house row.
      4. `.shape` reports dimensions. The **transpose**, written `.T`, swaps rows and columns.

      These steps work because all house rows share the same feature order and weight columns. NumPy performs the repeated dot products together, then adds the same price and rent biases to each row.

      **Why this is useful.** One expression, `X @ W + b`, predicts sale prices and monthly rents for many houses without writing a separate loop for every house. The output still has one row per house and one column per prediction.
    worked: |
      This example shows how NumPy predicts two outputs for the same houses, then adds a fixed amount to each output.

      Each row of `X` contains area in tens of square metres, bedroom count, and age in years. The first column of `W` gives sale-price weights in thousands of pounds per feature unit; the second gives monthly-rent weights in pounds per feature unit. The bias $b=(20,100)$ adds 20 thousand pounds to each price and 100 pounds to each monthly rent. NumPy is imported as `np`, and `np.array` builds an array from rows of numbers.

      ```python
      import numpy as np

      X = np.array([[12, 3, 20], [8, 2, 5]])
      W = np.array([[25, 100], [10, 50], [-1, -5]])
      b = np.array([20, 100])
      Y = X @ W + b
      print(Y)
      # [[330, 1350],
      #  [235,  975]]
      print(Y.shape)                     # (2, 2)
      print(W.T.shape)                   # (2, 3)
      ```

      1. House 1's price is $12\cdot25+3\cdot10+20\cdot(-1)+20=330$ thousand pounds.
      2. House 1's monthly rent is $12\cdot100+3\cdot50+20\cdot(-5)+100=1350$ pounds.
      3. House 2's price is $8\cdot25+2\cdot10+5\cdot(-1)+20=235$ thousand pounds.
      4. House 2's monthly rent is $8\cdot100+2\cdot50+5\cdot(-5)+100=975$ pounds.

      The two biases are reused for each house. `W.T` has shape $(2,3)$, with each output's three weights in one row.
    problems:
      - mat-batches-transpose-basics
      - matp-broadcast
      - matp-code
      - matp-bias-template
      - matp-transpose
      - matp-why-batch
      - matp-transpose-product
final: mat-explain-batch
summary: |
  - A matrix stores values in rows and columns. Multiplying by a vector takes one dot product per row.
  - A matrix product pairs every house row with each output column; the inner dimensions must match.
  - NumPy uses `@` to predict sale prices and monthly rents for many houses at once. In `X @ W + b`, the biases are broadcast across house rows.

  **Next:** Linear regression uses these matrix operations to predict prices for all houses and compare them with their sale prices.
