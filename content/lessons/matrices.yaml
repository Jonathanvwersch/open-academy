  - id: mat-matrix-products
    title: Multiplying matrices and matching shapes
    explain: |
      **What a matrix product is.** A **matrix product** combines two number grids into a new grid. Each output entry is the dot product of one row from the left matrix and one column from the right matrix.

      **How it works.**
      1. A matrix's **shape** is its row count followed by its column count. If the left shape is $m\times n$ and the right is $n\times p$, the two inner dimensions—the left column count and right row count—match.
      2. Dot each left row with each right column. Their matching entries multiply and add to one output entry. The product shape is $m\times p$: the outer counts remain and the inner count is summed over.
      3. Thus $(2\times3)(3\times2)$ gives a $2\times2$ result. But $(2\times3)(2\times4)$ is undefined because the inner counts 3 and 2 do not match.

      The rule works because each feature in a house row meets one weight for each output. The three feature products are added, leaving one predicted value for each house and output column. A loop can calculate those dot products one at a time, but the matrix product states the repeated row-column calculation together.

      **Why this is useful.** Use the same houses for two predictions: sale price and monthly rent. With $n$ house rows and three measurements, $X$ has shape $n\times3$. Put the price weights and rent weights in the two columns of $W$, shape $3\times2$. Then $XW$ has shape $n\times2$, one price and one rent prediction per house.
    worked: |
      This example shows how the same two houses get a sale-price prediction and a monthly-rent prediction.

      Each row of $X$ lists area in tens of square metres, bedrooms, and age in years. Column 1 of $W$ gives sale-price weights in thousands of pounds per feature unit. Column 2 gives monthly-rent weights in pounds per feature unit:

      $$X=\begin{bmatrix}12&3&20\\8&2&5\end{bmatrix},\qquad W=\begin{bmatrix}25&100\\10&50\\-1&-5\end{bmatrix}.$$

      1. $X$ has shape $2\times3$ and $W$ has shape $3\times2$. The inner dimensions match, so $XW$ has shape $2\times2$.
      2. House 1: $12\cdot25+3\cdot10+20\cdot(-1)=310$ thousand pounds; $12\cdot100+3\cdot50+20\cdot(-5)=1250$ pounds per month.
      3. House 2: $8\cdot25+2\cdot10+5\cdot(-1)=215$ thousand pounds; $8\cdot100+2\cdot50+5\cdot(-5)=875$ pounds per month.

      $$XW=\begin{bmatrix}310&1250\\215&875\end{bmatrix}.$$

      Each row is one house. The first output column is predicted sale price; the second is predicted monthly rent.
