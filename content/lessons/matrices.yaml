  - id: mat-matrix-products
    title: "Multiply two matrices"
    tldr: |
      - Put each set of prediction weights in its own column of a second matrix.
      - Dot each row of the first matrix with each column of the second.
      - The result gives every prediction for every example.
    explain: |
      ### A second prediction for each house

      A model can make more than one prediction for each house. Suppose we also want each house's monthly rent, in pounds. That needs a second set of weights, $(100,50,-5)$, in pounds a month for each ten square metres, each bedroom and each year of age. Two houses and two sets of weights make four dot products. Can one multiplication do all four?

      It can, if we put each set of weights in its own column of a second matrix $W$, price in column 1 and rent in column 2. The picture shows one of the four dot products. Row 1 of $X$, house 1 in blue, is laid against column 2 of $W$, the rent weights in orange. That gives the green 1250, house 1's rent, in row 1, column 2 of the answer.

