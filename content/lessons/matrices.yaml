summary: |
  - A matrix times a vector takes one dot product per row: an $m\times n$ matrix and an $n$-entry vector give $m$ answers.
  - Each entry of a matrix product is one left row dotted with one right column. The inner sizes must match, and the outer sizes give the result's shape.
  - In NumPy, `X @ W + b` gives every output for every house at once, with the bias broadcast to each row; `.T` swaps rows and columns.

  **Next:** Linear regression uses `X @ w + b` to predict every training house's price at once and compares those predictions with the real sale prices.
