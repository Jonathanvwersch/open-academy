      ### Each entry is a row times a column

      In the product $AB$, take the dot product of each row of $A$ with each column of $B$. Write $(i,j)$ for the position in row $i$ and column $j$. We write the number in that position as $(AB)_{ij}$.

      $$(AB)_{ij}=(\text{row }i\text{ of }A)\cdot(\text{column }j\text{ of }B)$$

      A vector with $n$ entries can be written as an $n\times1$ matrix. That is the one-column case we used in the last step.

      So $W$ turns any house's three measurements into two predictions.

      ### Which shapes fit together

      If $A$ has shape $m\times n$, then each row has $n$ entries. The columns of $B$ must also have $n$ entries to pair with them. If $B$ has $p$ columns, write the two shapes side by side as $(m\times n)(n\times p)$. The two middle numbers are the **inner sizes**. They must match. The numbers at the ends are the **outer sizes**. They give the shape $m\times p$ of the result.

      - $(2\times3)(3\times2)$ gives $2\times2$, a price and a rent for each house.
      - $(3\times2)(2\times3)$ gives $3\times3$, so swapping the order changes the answer.
      - $(2\times3)(2\times3)$ isn't defined, because the inner sizes 3 and 2 differ.

      Be careful not to think that two matrices of the same shape can always be multiplied. What must match is the number of columns in the first matrix and the number of rows in the second.

    worked: |
      Let's predict the price and the rent of both houses with one product, $XW$.

      $$X=\begin{bmatrix}12&3&20\\8&2&5\end{bmatrix}$$

      Start with the price weights in the first row and the rent weights in the second. To multiply by $X$, we need each set of weights in a column. Turn the rows into columns, keeping each set in order. The new matrix $W$ is the **transpose** of that grid. We mark a transpose with a raised $\top$.

      $$\begin{bmatrix}25&10&-1\\100&50&-5\end{bmatrix}^{\!\top}=\begin{bmatrix}25&100\\10&50\\-1&-5\end{bmatrix}.$$

      1. **Check the shapes.** The inner sizes are both 3, so the product exists, and the outer sizes give its shape.
         The product of shapes $(2\times3)(3\times2)$ has shape $2\times2$.

      2. **Copy the prices from the last step.** Column 1 of $W$ holds the price weights from the last step, so it gives the same prices, 310 for house 1 and 215 for house 2.

      3. **Dot house 1 with the rent column.** This is the entry in the picture, row 1 with column 2.
         $$
         \begin{aligned}
         12\times100+3\times50+20\times(-5)&=1200+150-100 &&\text{multiply matching entries}\\
         &=1250 &&\text{add the contributions}
         \end{aligned}
         $$

      4. **Dot house 2 with the rent column.** Row 2 with column 2 gives house 2's rent.
         $$
         \begin{aligned}
         8\times100+2\times50+5\times(-5)&=800+100-25 &&\text{multiply matching entries}\\
         &=875 &&\text{add the contributions}
         \end{aligned}
         $$

      5. **Place each answer in the grid.** Rows are houses and columns are predictions.
         $$XW=\begin{bmatrix}310&1250\\215&875\end{bmatrix}$$

      So house 1 is predicted to sell for £310,000 or rent for £1,250 a month, and house 2 for £215,000 or £875 a month.

      ### Adjust each house's predictions

      Suppose the same upgrade adds £20,000 to each house's price and £100 to its monthly rent. To add matrices of the same shape, add the entries at each matching row and column.

      1. **Write one adjustment row per house.** Prices are in thousands of pounds and rents are in pounds, so each house gets the row $(20,100)$.
         $$\begin{bmatrix}20&100\\20&100\end{bmatrix}$$

      2. **Add the matching entries.** Add each amount to the prediction in the same row and column.
         $$
         \begin{aligned}
         \begin{bmatrix}310&1250\\215&875\end{bmatrix}+\begin{bmatrix}20&100\\20&100\end{bmatrix}
         &=\begin{bmatrix}310+20&1250+100\\215+20&875+100\end{bmatrix}\\
         &=\begin{bmatrix}330&1350\\235&975\end{bmatrix}
         \end{aligned}
         $$

      The adjusted predictions still have one row per house and one column per kind of prediction.
