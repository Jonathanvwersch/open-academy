concept: matrices
version: 1
fast_path: [objective, summary]
blocks:
  - kind: objective
    md: |
      **Goal:** multiply matrices, predict result shapes, read a matrix as a linear map, and write batched products in NumPy.
  - kind: intuition
    md: |
      A matrix is a grid of numbers. Multiplying a matrix by a vector dots **each row** with the vector, producing one output number per row.

      A linear transformation is a rule that maps vectors to vectors while preserving addition and scaling. A matrix can rotate, scale or shear space; a shear slides points sideways in proportion to their height. Composing two transformations means multiplying their matrices, and order matters.

      $\mathbb R^{m\times n}$ means a matrix with $m$ rows and $n$ columns. If $X \in \mathbb{R}^{n \times d}$ holds $n$ rows of measurements and $W \in \mathbb{R}^{d \times k}$, then $XW$ gives $k$ output numbers for each row.

      In NumPy, `@` means matrix multiplication. Broadcasting lets NumPy reuse one value, such as a bias, for every row.
  - kind: example
    md: |
      This example shows a matrix transforming a vector by taking one dot product per row.

      $$A = \begin{pmatrix}1 & 2\\ 0 & 1\end{pmatrix},\quad x = \begin{pmatrix}3\\1\end{pmatrix},\quad Ax = \begin{pmatrix}1\cdot3 + 2\cdot1\\ 0\cdot3 + 1\cdot1\end{pmatrix} = \begin{pmatrix}5\\1\end{pmatrix}.$$
      Row 1 dotted with $x$ gives 5, and row 2 dotted with $x$ gives 1. Geometrically, $A$ is a shear: it slides points sideways in proportion to their height.
  - kind: math
    md: |
      The entry $A_{ik}$ is in row $i$, column $k$.
      For $A \in \mathbb{R}^{m\times n}$ and $B \in \mathbb{R}^{n\times p}$:
      $$(AB)_{ij} = \sum_{k=1}^{n} A_{ik}B_{kj}, \qquad AB \in \mathbb{R}^{m\times p}.$$
      The inner dimensions must match: $(m\times \mathbf{n})(\mathbf{n}\times p)$.

      Useful facts:
      - In general $AB \ne BA$.
      - The transpose $A^\top$ ("A transpose") swaps rows and columns. For example, $\begin{pmatrix}1&2&3\\4&5&6\end{pmatrix}^\top = \begin{pmatrix}1&4\\2&5\\3&6\end{pmatrix}$.
      - $(AB)^\top = B^\top A^\top$.
      - The identity matrix $I$ has ones on its diagonal and zeros elsewhere; $Ix=x$.
  - kind: worked
    md: |
      This worked example shows that multiplying matrices in opposite orders can give different results.

      $$\begin{pmatrix}1&2\\3&4\end{pmatrix}\begin{pmatrix}0&1\\1&0\end{pmatrix} = \begin{pmatrix}1\cdot0+2\cdot1 & 1\cdot1+2\cdot0\\ 3\cdot0+4\cdot1 & 3\cdot1+4\cdot0\end{pmatrix} = \begin{pmatrix}2&1\\4&3\end{pmatrix}.$$
      A permutation matrix reorders rows or columns when multiplied. Multiplying on the right by this one swaps the **columns**; multiplying on the left swaps the rows instead, which shows directly that $AB \neq BA$.

      In NumPy: `A @ B`. For a batch, `X @ W + b` broadcasts the bias over all rows.
  - kind: check
    exercise: mat-check-shape
  - kind: summary
    md: |
      - $(m\times n)(n\times p) \to m\times p$. Check shapes first.
      - Each output entry is a row of the left matrix dotted with a column of the right one.
      - Matrices compose transformations, and order matters.
      - `X @ W + b` computes a whole batch of linear outputs.
