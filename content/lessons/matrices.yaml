  - id: mat-matrix-products
    key_prereqs: [dot-product]
    title: "Multiply two matrices"
    tldr: |
      - Put each set of prediction weights in its own column of a second matrix.
      - Dot each row of the first matrix with each column of the second.
      - The result gives every prediction for every example.
      - Add the same fixed amount down a column to adjust that prediction for every example.
    explain: |
      ### A second prediction for each house

      We already have weights for the sale price, measured in thousands of pounds. Now add weights for the monthly rent, measured in pounds. Use $(100,50,-5)$ for the rent. Every ten square metres adds £100 a month, each bedroom adds £50, and each year of age takes away £5.

      Put the price weights in column 1 of a new matrix $W$ and the rent weights in column 2. One product then gives all four predictions. In the picture, row 1 of $X$ holds the first house's measurements, and column 2 of $W$ holds the rent weights. Their dot product gives the rent of £1,250.

