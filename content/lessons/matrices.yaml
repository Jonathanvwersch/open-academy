concept: matrices
version: 5
objective: |
  **Goal:** compute matrix–vector and matrix–matrix products as many dot products at once, predict the shape of any product, and write the NumPy line that predicts for many houses at once.
where_this_fits: |
  A house-price model predicts with a dot product: multiply each measurement by its weight and add the results. But a model is never used on just one house. Training compares predictions with the real prices of every house in the data, and some models make two predictions per house: sale price and monthly rent. That means thousands of dot products. A **matrix** stores the numbers as one grid, so a single multiplication does them all at once. This lesson builds that up in three steps:

  1. Multiply a matrix by a vector: one dot product per row.
  2. Multiply two matrices, and see which shapes fit together.
  3. Price many houses at once with one line of NumPy code.

  Linear regression, the next lesson, writes every prediction this way.
knowledge_points:
  - id: mat-rows-shapes
    title: One dot product per row
    explain: |
      **The question.** The dot-product lesson priced one house. With measurements $x=(12,3,20)$ and weights $w=(25,10,-1)$, it predicted $w\cdot x=310$ thousand pounds. Now there are two houses, or two thousand. How do you write all their measurements down together and price every house in one calculation?

      **Picture it.** Write each house as one row of a table, always with the same three measurements in the same order: area in tens of square metres (so 12 means 120 m²), number of bedrooms, and age in years. House 1 is $(12,3,20)$ and house 2 is $(8,2,5)$. The three weights stand beside it as a column, so each row can be laid against them entry by entry.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 245" aria-label="House rows (12, 3, 20) and (8, 2, 5) are each dotted with weights (25, 10, minus 1) to give prices 310 and 215" font-family="ui-sans-serif, system-ui, sans-serif">
      <text x="112" y="50" text-anchor="middle" font-size="13" fill="#737373">area</text>
      <text x="156" y="50" text-anchor="middle" font-size="13" fill="#737373">beds</text>
      <text x="200" y="50" text-anchor="middle" font-size="13" fill="#737373">age</text>
      <text x="78" y="82" text-anchor="end" font-size="13" fill="#737373">house 1</text>
      <rect x="90" y="60" width="44" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/><text x="112" y="82" text-anchor="middle" font-size="14" fill="#171717">12</text>
      <rect x="134" y="60" width="44" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/><text x="156" y="82" text-anchor="middle" font-size="14" fill="#171717">3</text>
      <rect x="178" y="60" width="44" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/><text x="200" y="82" text-anchor="middle" font-size="14" fill="#171717">20</text>
      <text x="78" y="116" text-anchor="end" font-size="13" fill="#737373">house 2</text>
      <rect x="90" y="94" width="44" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/><text x="112" y="116" text-anchor="middle" font-size="14" fill="#171717">8</text>
      <rect x="134" y="94" width="44" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/><text x="156" y="116" text-anchor="middle" font-size="14" fill="#171717">2</text>
      <rect x="178" y="94" width="44" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/><text x="200" y="116" text-anchor="middle" font-size="14" fill="#171717">5</text>
      <text x="272" y="50" text-anchor="middle" font-size="13" fill="#737373">w</text>
      <rect x="250" y="60" width="44" height="34" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/><text x="272" y="82" text-anchor="middle" font-size="14" fill="#171717">25</text>
      <rect x="250" y="94" width="44" height="34" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/><text x="272" y="116" text-anchor="middle" font-size="14" fill="#171717">10</text>
      <rect x="250" y="128" width="44" height="34" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/><text x="272" y="150" text-anchor="middle" font-size="14" fill="#171717">−1</text>
      <text x="312" y="99" text-anchor="middle" font-size="18" fill="#171717">=</text>
      <text x="352" y="50" text-anchor="middle" font-size="13" fill="#737373">Xw</text>
      <rect x="330" y="60" width="44" height="34" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/><text x="352" y="82" text-anchor="middle" font-size="14" fill="#171717">310</text>
      <text x="388" y="82" text-anchor="start" font-size="13" fill="#171717">12·25 + 3·10 + 20·(−1) = 310</text>
      <rect x="330" y="94" width="44" height="34" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/><text x="352" y="116" text-anchor="middle" font-size="14" fill="#171717">215</text>
      <text x="388" y="116" text-anchor="start" font-size="13" fill="#171717">8·25 + 2·10 + 5·(−1) = 215</text>
      <text x="156" y="195" text-anchor="middle" font-size="13" fill="#737373">X: 2 × 3</text>
      <text x="272" y="195" text-anchor="middle" font-size="13" fill="#737373">3 entries</text>
      <text x="352" y="195" text-anchor="middle" font-size="13" fill="#737373">2 entries</text>
      <text x="320" y="228" text-anchor="middle" font-size="14" fill="#171717">Each blue row is dotted with the amber weights and gives one green price.</text>
      </svg>
      ```

      **The idea.** A matrix times a vector is one dot product per row. A **matrix** is a rectangular grid of numbers, arranged in **rows**, which run across, and **columns**, which run down. Its **shape** is written rows $\times$ columns, so the table above is a $2\times3$ matrix, called $X$. To multiply a matrix $A$ by a vector $x$, take the dot product of each row of $A$ with $x$ and stack the answers in row order. An $m\times n$ matrix needs a vector with $n$ entries, one partner for every entry in a row, and $Ax$ then has $m$ entries: one per row.

      **Common confusion.** “A $2\times3$ matrix times a 3-entry vector gives 3 numbers.” No: it gives 2. Inside each row, the 3 entries are multiplied by the 3 weights and the 3 products are added into one number, so the 3 never appears in the size of the answer. The number of rows decides how many answers you get.
    worked: |
      Price both houses with one matrix–vector product.

      $$X=\begin{bmatrix}12&3&20\\8&2&5\end{bmatrix},\qquad w=\begin{bmatrix}25\\10\\-1\end{bmatrix}$$

      1. **Check that the shapes fit.** $X$ is $2\times3$ and $w$ has 3 entries, so every measurement in a row has a weight. The answer will have 2 entries, one per house.

      2. **Dot row 1 with the weights.**
         $$12\cdot25+3\cdot10+20\cdot(-1)=300+30-20=310$$

      3. **Dot row 2 with the weights.**
         $$8\cdot25+2\cdot10+5\cdot(-1)=200+20-5=215$$

      4. **Stack the answers in row order.**
         $$Xw=\begin{bmatrix}310\\215\end{bmatrix}$$

      House 1 is predicted at 310 thousand pounds and house 2 at 215 thousand pounds.

      **Compare cases.**

      | Matrix shape | Vector entries | Result |
      | --- | --- | --- |
      | $1\times3$ (one house) | 3 | 1 price |
      | $2\times3$ (two houses) | 3 | 2 prices |
      | $5\times3$ (five houses) | 3 | 5 prices |
      | $2\times3$ | 2 | Undefined: 3 entries per row but 2 weights |

      **Where it shows up.** Linear regression, the next lesson, stacks every training house as a row of one matrix $X$ and gets all the predictions as $Xw$. The rows need not be houses: a robot's sensor readings, one row per moment, work the same way.
    problems:
      - mat-rows-shapes-basics
      - matp-rows-self-explain
      - matp-vector
      - matp-vector-shape
      - matp-why-rows
      - matp-vector-entry
      - matp-vector-template
      - matp-recover-weight-template
  - id: mat-matrix-products
    title: Multiplying two matrices
    explain: |
      **The question.** Suppose the model needs a second **output**, or predicted quantity, for each house: monthly rent in pounds, from a second set of weights. That is two weight lists and two houses: four dot products. Can one multiplication do them all, and how do you tell whether two matrices can be multiplied?

      **Picture it.** Put each weight list in its own column of a second matrix $W$: price weights $(25,10,-1)$ in column 1 and rent weights $(100,50,-5)$ in column 2: pounds a month per 10 m², per bedroom and per year of age. House 1 (blue) with the rent weights (amber) gives the green entry 1250: house 1's predicted rent.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" aria-label="Row 1 of X, (12, 3, 20), is dotted with column 2 of W, (100, 50, minus 5), to give entry 1250 in row 1, column 2 of the 2 by 2 product" font-family="ui-sans-serif, system-ui, sans-serif">
      <text x="112" y="70" text-anchor="middle" font-size="13" fill="#737373">area</text>
      <text x="156" y="70" text-anchor="middle" font-size="13" fill="#737373">beds</text>
      <text x="200" y="70" text-anchor="middle" font-size="13" fill="#737373">age</text>
      <text x="78" y="102" text-anchor="end" font-size="13" fill="#737373">house 1</text>
      <rect x="90" y="80" width="44" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5"/><text x="112" y="102" text-anchor="middle" font-size="14" fill="#171717">12</text>
      <rect x="134" y="80" width="44" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5"/><text x="156" y="102" text-anchor="middle" font-size="14" fill="#171717">3</text>
      <rect x="178" y="80" width="44" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5"/><text x="200" y="102" text-anchor="middle" font-size="14" fill="#171717">20</text>
      <text x="78" y="136" text-anchor="end" font-size="13" fill="#737373">house 2</text>
      <rect x="90" y="114" width="44" height="34" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/><text x="112" y="136" text-anchor="middle" font-size="14" fill="#171717">8</text>
      <rect x="134" y="114" width="44" height="34" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/><text x="156" y="136" text-anchor="middle" font-size="14" fill="#171717">2</text>
      <rect x="178" y="114" width="44" height="34" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/><text x="200" y="136" text-anchor="middle" font-size="14" fill="#171717">5</text>
      <text x="262" y="50" text-anchor="middle" font-size="13" fill="#737373">price</text>
      <text x="306" y="50" text-anchor="middle" font-size="13" fill="#737373">rent</text>
      <rect x="240" y="60" width="44" height="34" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/><text x="262" y="82" text-anchor="middle" font-size="14" fill="#171717">25</text>
      <rect x="284" y="60" width="44" height="34" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2.5"/><text x="306" y="82" text-anchor="middle" font-size="14" fill="#171717">100</text>
      <rect x="240" y="94" width="44" height="34" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/><text x="262" y="116" text-anchor="middle" font-size="14" fill="#171717">10</text>
      <rect x="284" y="94" width="44" height="34" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2.5"/><text x="306" y="116" text-anchor="middle" font-size="14" fill="#171717">50</text>
      <rect x="240" y="128" width="44" height="34" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/><text x="262" y="150" text-anchor="middle" font-size="14" fill="#171717">−1</text>
      <rect x="284" y="128" width="44" height="34" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2.5"/><text x="306" y="150" text-anchor="middle" font-size="14" fill="#171717">−5</text>
      <text x="352" y="119" text-anchor="middle" font-size="18" fill="#171717">=</text>
      <text x="394" y="70" text-anchor="middle" font-size="13" fill="#737373">price</text>
      <text x="438" y="70" text-anchor="middle" font-size="13" fill="#737373">rent</text>
      <rect x="372" y="80" width="44" height="34" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/><text x="394" y="102" text-anchor="middle" font-size="13" fill="#171717">310</text>
      <rect x="416" y="80" width="44" height="34" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2.5"/><text x="438" y="102" text-anchor="middle" font-size="13" fill="#171717">1250</text>
      <rect x="372" y="114" width="44" height="34" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/><text x="394" y="136" text-anchor="middle" font-size="13" fill="#171717">215</text>
      <rect x="416" y="114" width="44" height="34" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/><text x="438" y="136" text-anchor="middle" font-size="13" fill="#171717">875</text>
      <text x="156" y="195" text-anchor="middle" font-size="13" fill="#737373">X: 2 × 3</text>
      <text x="284" y="195" text-anchor="middle" font-size="13" fill="#737373">W: 3 × 2</text>
      <text x="416" y="195" text-anchor="middle" font-size="13" fill="#737373">XW: 2 × 2</text>
      <text x="320" y="228" text-anchor="middle" font-size="14" fill="#171717">Row 1 of X · column 2 of W = 12·100 + 3·50 + 20·(−5) = 1250</text>
      <text x="320" y="252" text-anchor="middle" font-size="14" fill="#737373">Inner sizes match (3 and 3); outer sizes give the shape (2 × 2).</text>
      </svg>
      ```

      **The idea.** Each entry of a matrix product is one row of the left matrix dotted with one column of the right matrix. Say $A$ has $m$ rows and $n$ columns. Then $B$ needs $n$ rows; call its column count $p$. Written side by side, $(m\times n)(n\times p)$, the two middle numbers are the **inner sizes** and must be equal, so that every row has a partner for each of its entries. The two end numbers, the **outer sizes**, give the shape of the answer, $m\times p$: one row per row of $A$ and one column per column of $B$. The entry in row $i$, column $j$ of $AB$ is row $i$ of $A$ dotted with column $j$ of $B$.

      **Common confusion.** “Two matrices can be multiplied when they have the same shape.” No: two $2\times3$ matrices cannot be multiplied. Each left row has 3 entries, but each right column has only 2, one per row, and a dot product needs equal lengths. What must match is the columns on the left and the rows on the right.
    worked: |
      Predict price and rent for both houses with one product.

      $$X=\begin{bmatrix}12&3&20\\8&2&5\end{bmatrix},\qquad W=\begin{bmatrix}25&100\\10&50\\-1&-5\end{bmatrix}$$

      Column 1 of $W$ predicts sale price in thousands of pounds; column 2 predicts monthly rent in pounds.

      1. **Check the shapes.** The inner sizes are both 3, so the product exists; the outer sizes give its shape.
         $$(2\times3)(3\times2)\to2\times2$$

      2. **Reuse the price column.** Column 1 holds the same weights as in *One dot product per row*, so it gives the same prices: 310 for house 1 and 215 for house 2.

      3. **House 1 with the rent column.**
         $$12\cdot100+3\cdot50+20\cdot(-5)=1200+150-100=1250$$

      4. **House 2 with the rent column.**
         $$8\cdot100+2\cdot50+5\cdot(-5)=800+100-25=875$$

      5. **Put each answer at its row and column.**
         $$XW=\begin{bmatrix}310&1250\\215&875\end{bmatrix}$$

      Each row is a house; column 1 holds its price and column 2 its rent.

      **Compare cases.**

      | Left shape | Right shape | Product |
      | --- | --- | --- |
      | $2\times3$ | $3\times2$ | $2\times2$ |
      | $2\times3$ | $3\times4$ | $2\times4$ |
      | $3\times2$ | $2\times3$ | $3\times3$: the first case with the shapes swapped |
      | $2\times3$ | $2\times3$ | Undefined: inner sizes 3 and 2 differ |
      | $2\times3$ | $3\times1$ | $2\times1$: the matrix–vector product from *One dot product per row* |

      **Where it shows up.** A model with several outputs keeps one weight column per output. A robot that turns 3 sensor readings into speeds for its 2 wheels does the same thing with a $3\times2$ weight matrix.
    problems:
