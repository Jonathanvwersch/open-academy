summary: |
  - A matrix is a rectangular grid of numbers with a shape, rows $\times$ columns. A matrix times a vector takes one dot product per row, so an $m\times n$ matrix and an $n$-entry vector give $m$ answers.
  - Each entry of a matrix product $AB$ is one row of $A$ dotted with one column of $B$: $(AB)_{ij}=(\text{row }i\text{ of }A)\cdot(\text{column }j\text{ of }B)$. The inner sizes must match, and the outer sizes give the shape, $(m\times n)(n\times p)\to m\times p$.
  - In NumPy, `X @ W + b` gives every prediction for every house at once, with the bias `b` broadcast to each row, and `.T` swaps rows and columns.

  **Next:** The linear regression lesson uses `X @ w + b` to predict the price of every house we have data for at once, and explains what each weight and the bias mean.
