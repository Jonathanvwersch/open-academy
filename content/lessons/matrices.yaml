concept: matrices
version: 6
objective: |
  **Goal:** multiply matrices by hand and use their shapes to work out how many answers each product gives.
recap:
  - concept: dot-product
    text: "The dot product multiplies matching numbers in two lists and adds the products."
where_this_fits: |
  ### What is a matrix?

  A matrix is a rectangular grid of numbers, arranged in rows and columns. Multiplying a matrix by a vector, or by another matrix, does many dot products in one go.

  We'll use two houses with known measurements. A single matrix product will give a sale price and a monthly rent for each house.
knowledge_points:
  - id: mat-rows-shapes
    key_prereqs: [dot-product]
    title: "Multiply a matrix by a vector"
    tldr: |
      - A matrix is a grid that can hold one example in each row.
      - Its shape gives the number of rows and columns.
      - Multiplying it by a vector takes one dot product per row.
      - The result gives one answer for every row.
    explain: |
      ### Two houses in one grid

      We can price a house by taking a dot product. We list its area in tens of square metres, its bedroom count and its age in years, in that order. Use weights $w=(25,10,-1)$. Every ten square metres adds £25,000. Every bedroom adds £10,000, and every year of age takes away £1,000.

      Put the two houses, $(12,3,20)$ and $(8,2,5)$, on separate rows. Each row runs across the page. The picture lists the weights down a column so they can be used for both houses. Each number in the grid is called an entry. The blue measurements pair with the orange weights to give prices of £310,000 and £215,000.

