      **The idea.** **NumPy** is a Python library for grids of numbers, which it calls arrays; `import numpy as np` loads it under the short name `np`, and `np.array([[12, 3, 20], [8, 2, 5]])` builds one from a list of rows. An array's `.shape` gives its size as (rows, columns), and `@` multiplies matrices. Many models also add a fixed amount to every prediction, whatever the inputs: a **bias**, the base amount every prediction starts from. In `X @ W + b`, NumPy **broadcasts** `b`: because `b` has one entry per column, it is reused for every row. The **transpose**, written $W^\top$ in maths and `W.T` in NumPy, swaps rows and columns, so a (3, 2) array becomes (2, 3). Code sometimes stores weights with one row per output; `.T` turns those rows into the columns `@` expects.

      **Common confusion.** “`X * W` does the same as `X @ W`.” No: `*` multiplies the numbers in matching positions and adds nothing up. For two (1, 3) arrays, `[[1, 2, 3]] * [[4, 5, 6]]` gives `[[4, 10, 18]]`, not the dot product 32. For shapes (2, 3) and (3, 2) it stops with an error, because there are no matching positions.
    worked: |
      Predict price and rent for both houses in NumPy, including the bias.

      ```python
      import numpy as np

      X = np.array([[12, 3, 20], [8, 2, 5]])
      W = np.array([[25, 100], [10, 50], [-1, -5]])
      b = np.array([20, 100])
      Y = X @ W + b
      print(Y)           # [[ 330 1350]
                         #  [ 235  975]]
      print(Y.shape)     # (2, 2)

      W_rows = W.T       # the same weights, one row per output
      print(W_rows.shape)          # (2, 3)
      print(X @ W_rows.T + b)      # the same Y again
      ```

      1. **Multiply.** `X @ W` is the product $XW$ from *Multiplying two matrices*.
         $$XW=\begin{bmatrix}310&1250\\215&875\end{bmatrix}$$

      2. **Broadcast the bias.** `b` is copied down to both rows.
         $$\begin{bmatrix}20&100\\20&100\end{bmatrix}$$

      3. **Add entry by entry.**
         $$\begin{bmatrix}310+20&1250+100\\215+20&875+100\end{bmatrix}=\begin{bmatrix}330&1350\\235&975\end{bmatrix}$$

      4. **Check the shapes.** `Y.shape` is (2, 2): one row per house, one column per output.

      5. **Use the transpose.** `W_rows` stores the price weights in row 1 and the rent weights in row 2. `X @ W_rows` would fail, because the inner sizes 3 and 2 differ; `W_rows.T` turns the rows back into columns, so `X @ W_rows.T + b` gives the same `Y`.

      **Compare cases.**

      | Expression | Result |
      | --- | --- |
      | `X @ W` | Shape (2, 2): price and rent for each house |
      | `X @ W + b` | Shape (2, 2): every price +20, every rent +100 |
      | `X * W` | Error: shapes (2, 3) and (3, 2) do not line up |
      | `X @ W_rows` | Error: inner sizes 3 and 2 differ |
      | `X @ W_rows.T + b` | Shape (2, 2): the same `Y` |

      **Where it shows up.** Training code works on a batch, a group of examples handled together, so one line such as `X @ W + b` predicts for every example in it. When a shape error appears, printing each array's `.shape` is the first check.
