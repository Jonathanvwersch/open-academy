      ### Swapping rows and columns

      Some code stores the weights the other way round, with one row per prediction, so the price and rent weights make a $2\times3$ array. Then `X @ W_rows` stops with an error, because the inner sizes 3 and 2 differ. The **transpose** fixes this. It swaps a matrix's rows and columns, so the entry in row $i$, column $j$ moves to row $j$, column $i$, and a $2\times3$ matrix becomes $3\times2$. We write it $W^\top$ in maths and `W.T` in NumPy.

      Be careful not to use `*`, the usual multiplication sign in Python, for a matrix product. `X * W` multiplies matching entries and adds nothing up. For two arrays of shape `(1, 3)`:

      ```python
      products = np.array([[1, 2, 3]]) * np.array([[4, 5, 6]])
      print(products)         # [[ 4 10 18]]
      print(np.sum(products)) # 32
      ```

      Here `np.sum` adds the entries to give the dot product. For shapes `(2, 3)` and `(3, 2)`, `*` stops with an error.
    worked: |
      Let's predict the price and the rent of both houses in NumPy, this time with the bias. In the code, a list of lists makes a matrix with one inner list per row, `print` shows a result, `np.array_equal` checks whether two arrays hold the same numbers, and everything after a `#` is a comment, which here shows what each line prints.

      ```python
      import numpy as np

      X = np.array([[12, 3, 20], [8, 2, 5]])
      W = np.array([[25, 100], [10, 50], [-1, -5]])
      b = np.array([20, 100])

      Y = X @ W + b
      print(Y)          # [[ 330 1350]
                        #  [ 235  975]]
      print(Y.shape)    # (2, 2)

      W_rows = W.T      # one row per prediction
      print(W_rows.shape)                         # (2, 3)
      print(np.array_equal(X @ W_rows.T + b, Y))  # True
      ```

      1. **Multiply.** `X @ W` is the product $XW$ from the last step.
         $$XW=\begin{bmatrix}310&1250\\215&875\end{bmatrix}$$

      2. **Repeat the bias for each house.** NumPy reuses the one row of `b` for both houses.
         $$\begin{bmatrix}20&100\\20&100\end{bmatrix}$$

      3. **Add entry by entry.** Each prediction gets the bias for its own column.
         $$\begin{bmatrix}310+20&1250+100\\215+20&875+100\end{bmatrix}=\begin{bmatrix}330&1350\\235&975\end{bmatrix}$$

      4. **Check the shape.** `Y.shape` is `(2, 2)`, one row per house and one column per prediction.

      5. **Check the transposed weights.** `W_rows` holds the price weights in row 1 and the rent weights in row 2. Transposing it turns those rows back into columns, so `X @ W_rows.T + b` gives the same `Y`.

      With the bias, house 1 is predicted at £330,000 or £1,350 a month, and house 2 at £235,000 or £975 a month.
