concept: matrices
version: 4
objective: |
  **Goal:** use matrix products to turn house measurements into predictions for one or many houses, reason about shapes, and implement batch scoring in NumPy.
where_this_fits: |
  In the last lesson, the dot product turned one house's measurements into one predicted price. A real dataset has hundreds of houses, and writing out one dot product per house is slow and easy to get wrong. A matrix holds all the houses in one grid, so a single multiplication prices every house at once.
knowledge_points:
  - id: mat-rows-shapes
    title: What a matrix is, and multiplying by a vector
    explain: |
      **What a matrix is.** A **matrix** is a rectangular grid of numbers. A **row** runs across and a **column** runs down. Its **shape** is the number of rows, then the number of columns, so this matrix is $2\times3$:

      $$\begin{bmatrix}1&2&3\\4&5&6\end{bmatrix}$$

      A vector can be written as a matrix with one column.

      **Multiplying a matrix by a vector.** Take each row of the matrix, find its dot product with the vector, and stack the answers in order:

      $$\begin{bmatrix}1&2\\0&1\end{bmatrix}\begin{bmatrix}3\\1\end{bmatrix}=\begin{bmatrix}1\cdot3+2\cdot1\\0\cdot3+1\cdot1\end{bmatrix}=\begin{bmatrix}5\\1\end{bmatrix}.$$

      Row 1 gives 5 and row 2 gives 1. Each row produces one number, so a matrix with $m$ rows turns a vector into $m$ numbers. Each row must have as many entries as the vector, otherwise some entries have nothing to pair with.

      ```svg
