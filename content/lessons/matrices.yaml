      ### One dot product per row

      A **matrix** is a rectangular grid of numbers. Each number in it is an **entry**. Entries running across make a **row**, and entries running down make a **column**. A matrix's size is its **shape**, written rows $\times$ columns, so our grid of houses is a $2\times3$ matrix. We'll call it $X$, since matrices usually get capital letters.

      $X\in\mathbb{R}^{m\times n}$ says $X$ is an $m\times n$ matrix of numbers.

      In NumPy, `a.sum()` adds every entry of the array `a`, the same as `np.sum(a)`.

      To multiply a matrix $A$ by a vector $x$, we take the dot product of each row of $A$ with $x$, and stack the answers in the same order as the rows, where $\vdots$ means and so on:

      $$Ax=\begin{bmatrix}(\text{row 1 of }A)\cdot x\\(\text{row 2 of }A)\cdot x\\\vdots\end{bmatrix}$$

      So $Xw$ gives two prices, one per house.

      ### How many answers come out

      Each entry of a row needs a partner in $x$, so an $m\times n$ matrix, with $m$ rows and $n$ columns, can only multiply a vector with $n$ entries. The answer has $m$ entries, one for each row. For our three weights:

      - One house, a $1\times3$ matrix, gives 1 price.
      - Five houses, a $5\times3$ matrix, give 5 prices from the same three weights.
      - With only 2 weights the product isn't defined, because each row's third measurement would have no weight to pair with.

      Be careful not to expect three answers because each house has three measurements. Each row's products add up to one number, so the rows decide how many answers come out.
    worked: |
      Let's price both houses with one matrix–vector product, using the grid of houses and the weights from above.

      $$X=\begin{bmatrix}12&3&20\\8&2&5\end{bmatrix},\qquad w=\begin{bmatrix}25\\10\\-1\end{bmatrix}$$

      1. **Check that the shapes fit.** $X$ is $2\times3$ and $w$ has 3 entries, so every measurement in a row has a weight, and the answer will have 2 entries, one for each house.

      2. **Dot row 1 with the weights.** Row 1 is house 1, so this is its price.
         $$
         \begin{aligned}
         12\times25+3\times10+20\times(-1)&=300+30-20 &&\text{multiply matching entries}\\
         &=310 &&\text{add the contributions}
         \end{aligned}
         $$

      3. **Dot row 2 with the weights.** Row 2 is house 2, and it uses the same three weights.
         $$
         \begin{aligned}
         8\times25+2\times10+5\times(-1)&=200+20-5 &&\text{multiply matching entries}\\
         &=215 &&\text{add the contributions}
         \end{aligned}
         $$

      4. **Stack the two prices.** The first answer belongs to row 1, so it goes first.
         $$Xw=\begin{bmatrix}310\\215\end{bmatrix}$$

      So the model predicts £310,000 for house 1 and £215,000 for house 2, from a single product.
