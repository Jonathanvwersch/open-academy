concept: matrices
version: 6
objective: |
  **Goal:** multiply a matrix by a vector and by another matrix as many dot products at once, predict the shape of any product, and write the NumPy line that predicts for many houses at once.
recap:
  - concept: dot-product
    text: "The dot product multiplies the matching components of two vectors and adds the products into one number. A model with weights $(25,10,-1)$ prices a house with measurements $(12,3,20)$ at $25\\times12+10\\times3-1\\times20=310$."
where_this_fits: |
  ### What is a matrix?

  A matrix is a rectangular grid of numbers, arranged in rows and columns. Multiplying a matrix by a vector, or by another matrix, does many dot products in one go.

  That's useful because a model is almost never used on just one example. To check a house-price model, we compare its predictions with the real prices of every house we know about, which can mean thousands of dot products. Some models also make several predictions for each house, such as a sale price and a monthly rent. In the dot product lesson, we made one prediction at a time. A matrix lets us write all of them as a single multiplication, and one line of code can then work them all out.
knowledge_points:
  - id: mat-rows-shapes
    title: "Multiply a matrix by a vector"
    tldr: |
      - A matrix is a grid that can hold one example in each row.
      - Its shape gives the number of rows and columns.
      - Multiplying it by a vector takes one dot product per row.
      - The result gives one answer for every row.
    explain: |
      ### Two houses in one grid

      In the dot product lesson, a model priced a house from its measurements. Each house has three measurements, always in the same order: its area in tens of square metres (so 12 means 120 m²), its number of bedrooms, and its age in years. The weights are $w=(25,10,-1)$, in thousands of pounds, so each ten square metres adds £25,000, each bedroom adds £10,000 and each year of age takes away £1,000.

      Now take two houses, $(12,3,20)$ and $(8,2,5)$. Each house makes a row beside the column of weights. In the picture, each blue row is paired with the orange weights entry by entry, giving green prices of 310 and 215.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 235" aria-label="House rows (12, 3, 20) and (8, 2, 5) are each dotted with weights (25, 10, minus 1) to give prices 310 and 215" font-family="ui-sans-serif, system-ui, sans-serif">
      <text x="112" y="50" text-anchor="middle" font-size="13" fill="#737373">area</text>
      <text x="156" y="50" text-anchor="middle" font-size="13" fill="#737373">beds</text>
      <text x="200" y="50" text-anchor="middle" font-size="13" fill="#737373">age</text>
      <text x="78" y="82" text-anchor="end" font-size="13" fill="#737373">house 1</text>
