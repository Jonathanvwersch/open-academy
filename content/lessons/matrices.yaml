concept: matrices
version: 2
objective: |
  **Goal:** organise several weighted calculations in a grid of numbers, multiply these grids, and predict the size of the result. Use them to adjust robot coordinates and score several houses together in Python.
why: |
  A housing app needs two scores for each listing, such as suitability for a family and for a single buyer. A house with 300 square metres and one bedroom might suit those buyers differently. You could calculate a separate weighted total for every house and buyer, but repeating that code makes it easy to mix up measurements. A matrix stores the numbers in rows and columns so one multiplication organises all those totals. The same rule can correct a warehouse robot's map by calculating new east and north coordinates together. You'll use matrices in linear regression, the perceptron, attention, and rotation matrices to organise model calculations and robot coordinates.
knowledge_points:
  - id: mat-rows-shapes
    title: One dot product for each output
    explain: |
      **How can one calculation turn a vector into several numbers instead of just one?** Each output should be a weighted sum of the same input entries, but with its own weights. One dot product gives only one output, so arrange several weight lists in a grid.

      This grid is a **matrix**. A **row** runs across; a **column** runs down. Its **shape** gives the number of rows, then columns. Write $A\in\mathbb{R}^{m\times n}$ for a matrix $A$ of real numbers with $m$ rows and $n$ columns. Here $\times$ separates those counts.

      Square brackets display the grid. For $A=\begin{bmatrix}1&2\\0&1\end{bmatrix}$ and input $(3,1)$ written as one column, the outputs are $1\cdot3+2\cdot1=5$ and $0\cdot3+1\cdot1=1$.

      Picture each row reading the same input column. Each row's dot product fills one output position. This works because the rows can use different weights without changing which input each weight receives.

      For two matrices, pair every left row with every right column. Why this way? Multiplying matching entries alone leaves separate contributions, not weighted totals. The left column count must equal the right row count. These are the **inner dimensions**: $(m\times n)(n\times p)$ gives $m\times p$, where $p$ counts right columns.

      The entry $A_{ik}$ is in row $i$, column $k$. In the product with matrix $B$, $j$ selects an output column and $k$ runs over matching entries. The sum totals their products:

      $$(AB)_{ij}=\sum_{k=1}^{n}A_{ik}B_{kj}.$$

      A housing model can use one row per buyer's weights to calculate several suitability scores from the same house measurements.

    worked: |
      This example shows how the app scores one house for two buyers, then how the same multiplication rule works for two columns.

      The first buyer's weights are $(1,2)$ for area and bedrooms; the second buyer's weights are $(0,1)$. The house has 300 square metres and one bedroom, recorded as $(3,1)$.

      $$A=\begin{bmatrix}1&2\\0&1\end{bmatrix},\qquad x=\begin{bmatrix}3\\1\end{bmatrix}.$$

      1. Row one gives $1\cdot3+2\cdot1=3+2=5$.
      2. Row two gives $0\cdot3+1\cdot1=0+1=1$.
      3. Stack the results: $Ax=\begin{bmatrix}5\\1\end{bmatrix}$, with shape $2\times1$.

      For $B=\begin{bmatrix}0&1\\1&0\end{bmatrix}$, calculate all four entries:

      $$AB=\begin{bmatrix}1\cdot0+2\cdot1&1\cdot1+2\cdot0\\0\cdot0+1\cdot1&0\cdot1+1\cdot0\end{bmatrix}
      =\begin{bmatrix}2&1\\1&0\end{bmatrix}.$$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" aria-label="Two by three times three by four gives two by four; inner threes match">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#171717">
          <text x="20" y="35">left: 2 × 3</text><text x="205" y="35">right: 3 × 4</text><text x="405" y="35">result: 2 × 4</text>
          <path d="M110 48 V66 H275 V48" stroke="#10b981" stroke-width="3" fill="#10b981" fill-opacity="0"/>
          <text x="130" y="93" font-size="14">inner counts match</text><text x="400" y="93" font-size="14">outer counts remain</text>
        </g>
      </svg>
      ```

      Each output has one row for each buyer's weights. With several input columns, each column receives its own scores. The number of output rows and columns comes from the two counts outside the matching pair.
    problems:
      [matp-shape, matp-entry-template, matp-vector, matp-invalid, matp-entry, matp-batch-shape]
  - id: mat-change-space
    title: Changing a whole grid with one rule
    explain: |
      **What happens if we apply the same matrix to every point in a grid?** We want one consistent rule, not an unrelated instruction for each point. Knowing where a few points go is not enough unless the rule also tells us how their combinations behave.

      Take $A=\begin{bmatrix}1&2\\0&1\end{bmatrix}$. It sends $(3,1)$ to $(5,1)$: add twice the second coordinate to the first and keep the second unchanged.

      Picture each horizontal row of grid points sliding sideways. At height zero nothing moves; at height one points shift two units right. This is a **shear**, a sideways shift proportional to height. This works because fixed row weights apply the same coordinate rule everywhere.

      A matrix defines a **linear transformation**, meaning it preserves addition and scaling. Transforming two arrows then adding agrees with adding first then transforming, because multiplication distributes over addition. The origin stays at the origin.

      The **identity matrix** $I$ has ones on its diagonal, from top left to bottom right, and zeros elsewhere. It leaves every vector unchanged: $Ix=x$.

      Applying two rules in sequence is **composition**. To apply $B$ first, then $A$, write $ABx=A(Bx)$. Why this way? The second rule receives the first rule's output. Reversing them changes that input, so $AB$ and $BA$ need not agree.

      A **permutation matrix** reorders entries: on the right it reorders columns; on the left, rows. A robot can use such rules to correct map coordinates or reorder measurements consistently.
    worked: |
      This example shows a shear of a grid and why changing the order of two rules matters.

      Coordinates measure right and up. The shear keeps $(1,0)$ fixed: $(1+2\cdot0,0)=(1,0)$. It sends $(0,1)$ to $(0+2\cdot1,1)=(2,1)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" aria-label="A shear changes a square grid cell into a parallelogram, keeping (1,0) fixed and sending (0,1) to (2,1)">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M35 170 H195 M35 170 V50 M35 110 H95 V170" stroke="#d4d4d4" fill="#d4d4d4" fill-opacity="0"/>
          <path d="M35 170 V110" stroke="#10b981" stroke-width="3"/><path d="M35 110 L29 122 H41 Z" fill="#10b981"/>
          <path d="M35 170 H95" stroke="#3b82f6" stroke-width="3"/><path d="M95 170 L83 164 V176 Z" fill="#3b82f6"/>
          <text x="35" y="25">Before: right, up</text><text x="45" y="100">(0,1)</text><text x="80" y="195">(1,0)</text>
          <path d="M300 170 H550 M300 170 V50 M300 170 L420 110 H480 L360 170" stroke="#d4d4d4" fill="#d4d4d4" fill-opacity="0"/>
          <path d="M300 170 L420 110" stroke="#10b981" stroke-width="3"/><path d="M420 110 L406 111 L412 122 Z" fill="#10b981"/>
          <path d="M300 170 H360" stroke="#3b82f6" stroke-width="3"/><path d="M360 170 L348 164 V176 Z" fill="#3b82f6"/>
          <text x="300" y="25">After: right + 2 × up, up</text><text x="420" y="98">(2,1)</text><text x="340" y="195">(1,0)</text>
        </g>
      </svg>
      ```

      Now use $C=\begin{bmatrix}1&2\\3&4\end{bmatrix}$ and a rule that swaps the two coordinates, $P=\begin{bmatrix}0&1\\1&0\end{bmatrix}$. Where that swap happens matters:

      1. Right multiplication gives $CP=\begin{bmatrix}1\cdot0+2\cdot1&1\cdot1+2\cdot0\\3\cdot0+4\cdot1&3\cdot1+4\cdot0\end{bmatrix}=\begin{bmatrix}2&1\\4&3\end{bmatrix}$: columns swap.
      2. Left multiplication gives $PC=\begin{bmatrix}0\cdot1+1\cdot3&0\cdot2+1\cdot4\\1\cdot1+0\cdot3&1\cdot2+0\cdot4\end{bmatrix}=\begin{bmatrix}3&4\\1&2\end{bmatrix}$: rows swap.

      Swapping the input coordinates changes which measurement each weight receives. Swapping the output coordinates instead changes where the results are stored. They are different operations.
    problems:
      [matp-linear, matp-shear-template, matp-identity, matp-why-order, matp-shear, matp-swap]
  - id: mat-batches-transpose
    title: Scoring many houses in NumPy
    explain: |
      **How can the same weighted calculation handle many vectors at once?** The answer should give the same results as separate dot products, while keeping each input's outputs together. A loop works, but makes us manage every repeated calculation.

      Put input vectors in rows of $X$ and weights in columns of $W$. For row $(4,1)$ and weight column $(0.5,2)$, the result is $4\cdot0.5+1\cdot2=4$. Picture every input row meeting every weight column: their crossing marks one output. This works because each crossing performs the same dot product we would calculate separately.

      A group of examples processed together is a **batch**. For $n$ houses, $d$ features and $k$ buyer scores, $(n\times d)(d\times k)$ gives $n\times k$. Here the grid calculation lets a model score many houses together.

      If weights arrive as rows, use the **transpose**, written $A^\top$ (“A transpose”), to swap rows and columns without changing the numbers. For example, $\begin{bmatrix}1&2&3\\4&5&6\end{bmatrix}^\top=\begin{bmatrix}1&4\\2&5\\3&6\end{bmatrix}$ changes shape from $2\times3$ to $3\times2$.

      Transposing a product also reverses the order: $(AB)^\top=B^\top A^\top$.

      **NumPy** is a Python library for calculations on **arrays**, collections of numbers. Use `@` for matrix multiplication, `.T` to transpose, and `.shape` for dimensions. Why this way? `@` lets the library run the repeated dot products efficiently. `*` only multiplies matching entries, without summing the contributions.

      A **bias** is a fixed amount added to a score. In `X @ W + b`, **broadcasting** reuses the bias array `b` for every house row.
    worked: |
      This example shows how the app scores two houses for two buyers, then adds a fixed amount to each buyer's score.

      Areas are in hundreds of square metres, followed by bedroom counts. Thus $(4,1)$ describes a 400-square-metre house with one bedroom. Each column of `W` holds one buyer's weights. The import names NumPy `np` for short. `np.array` builds an array from lists; each inner list becomes a row. Here `b` is a list of two biases, one per buyer.

      ```python
      import numpy as np

      X = np.array([[4, 1], [2, 3]])       # two houses, two features
      W = np.array([[0.5, 1], [2, -1]])    # two features, two scores
      b = np.array([1, 10])               # one bias per score
      Y = X @ W + b
      print(Y)
      # [[ 5. 13.]
      #  [ 8.  9.]]
      print(Y.shape)                     # (2, 2)
      weights_as_rows = W.T
      print(weights_as_rows)
      # [[ 0.5  2. ]
      #  [ 1.  -1. ]]
      ```

      1. First house, first score: $4\cdot0.5+1\cdot2+1=2+2+1=5$.
      2. First house, second score: $4\cdot1+1\cdot(-1)+10=4-1+10=13$.
      3. Second house, first score: $2\cdot0.5+3\cdot2+1=1+6+1=8$.
      4. Second house, second score: $2\cdot1+3\cdot(-1)+10=2-3+10=9$.

      The two biases are reused for each house, and `weights_as_rows.T` would restore the columns needed for the product.

      One matrix product computes a score for every house and buyer. Adding `b` then adjusts every row by the same two fixed amounts.
    problems:
      [
        matp-code,
        matp-bias-template,
        matp-transpose,
        matp-broadcast,
        matp-why-batch,
        matp-transpose-product,
      ]
final: mat-explain-batch
summary: |
  - A matrix stores numbers in rows and columns. In a product, each left row meets each right column in a dot product. The left column count must match the right row count.
  - A matrix can adjust robot coordinates consistently while preserving vector addition and scaling. When applying two matrices, the rightmost acts first. Reversing the order can change the result.
  - Transposing swaps rows and columns. NumPy uses `@` to multiply matrices. In `X @ W + b`, adding a short bias array reuses its fixed score adjustments for every house.

  **Where you'll use this:** linear regression, the perceptron, and attention use matrix products for many weighted scores; rotation matrices transform robot coordinates.
