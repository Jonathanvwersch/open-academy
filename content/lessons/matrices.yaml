      <rect x="90" y="94" width="44" height="34" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/><text x="112" y="116" text-anchor="middle" font-size="14" fill="#171717">8</text>
