  - id: mat-batches-transpose
    title: Many houses at once in NumPy
    explain: |
      **The question.** On paper you can now price any number of houses with one product. How do you get a computer to do it for a thousand houses and add the model's bias?

      **Picture it.** The blue $X$ holds 5 houses as 5 rows of 3 measurements, and the amber $W$ holds the price and rent weights as 2 columns. Their product is the green $Y$: a price and a rent for every house. The amber $b$ holds one bias per output, 20 for price and 100 for rent; the dashed rows show it copied down to every house.

