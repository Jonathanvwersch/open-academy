concept: matrices
version: 2
objective: |
  **Goal:** multiply matrices, predict result shapes, explain their transformations of vectors, and write batched products in NumPy.
why: |
  A house model may need several weighted scores for thousands of houses. You could write a loop that takes a separate dot product for every house and score. That works, but repeating the bookkeeping makes it easy to mix up features and misses the efficient array operations numerical libraries provide. Matrices organise all those weights and examples into grids, so one product computes every score with a predictable shape. Transforming a floor move gives a picture of the same operation: each output coordinate is a weighted score of the input coordinates. You'll use this structure in linear regression, the perceptron, attention, and rotation matrices.
knowledge_points:
  - id: mat-rows-shapes
    title: One dot product for each output
    explain: |
      You have a floor move $(3,1)$. **How can you calculate two new coordinates with different weights?** One dot product gives only one number. Stack the weight lists into rows, then take one dot product per row.

      This grid of numbers is a **matrix**. Its **shape** counts rows first, then columns. Write $A\in\mathbb{R}^{m\times n}$ for a real-number matrix $A$ with $m$ rows and $n$ columns; $\times$ separates those counts here.

      Square brackets display the grid. Display a vector as one column: each matrix row gives one output entry. This works because each row independently weights the same input coordinates.

      To multiply matrices, dot each left row with each right column. Why this way? Matching-entry multiplication leaves contributions separate instead of totalling each output. Inner counts must match because each dot product pairs every entry: $(m\times n)(n\times p)$ gives $m\times p$, where $p$ counts right columns.

      The entry $A_{ik}$ means row $i$, column $k$. For a second matrix $B$, output row $i$, column $j$ is:

      $$(AB)_{ij}=\sum_{k=1}^{n}A_{ik}B_{kj}.$$

      Here $k$ runs through the matching entries, and $j$ selects the output column; the sum adds their products.
    worked: |
      This example shows one dot product per row, then the same rule for two output columns.

      $$A=\begin{bmatrix}1&2\\0&1\end{bmatrix},\qquad x=\begin{bmatrix}3\\1\end{bmatrix}.$$

      1. Row one gives $1\cdot3+2\cdot1=3+2=5$.
      2. Row two gives $0\cdot3+1\cdot1=0+1=1$.
      3. Stack the results: $Ax=\begin{bmatrix}5\\1\end{bmatrix}$, with shape $2\times1$.

      For $B=\begin{bmatrix}0&1\\1&0\end{bmatrix}$, calculate all four entries:

      $$AB=\begin{bmatrix}1\cdot0+2\cdot1&1\cdot1+2\cdot0\\0\cdot0+1\cdot1&0\cdot1+1\cdot0\end{bmatrix}
      =\begin{bmatrix}2&1\\1&0\end{bmatrix}.$$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" aria-label="Two by three times three by four gives two by four; inner threes match">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#171717">
          <text x="20" y="35">left: 2 × 3</text><text x="205" y="35">right: 3 × 4</text><text x="405" y="35">result: 2 × 4</text>
          <path d="M110 48 V66 H275 V48" stroke="#10b981" stroke-width="3" fill="#10b981" fill-opacity="0"/>
          <text x="130" y="93" font-size="14">inner counts match</text><text x="400" y="93" font-size="14">outer counts remain</text>
        </g>
      </svg>
      ```

      Every output entry is one row-column dot product, and the outer counts give the result shape.
    problems:
      [matp-shape, matp-entry-template, matp-vector, matp-invalid, matp-entry, matp-batch-shape]
  - id: mat-change-space
    title: Moving a whole grid with one rule
    explain: |
      The matrix $A=\begin{bmatrix}1&2\\0&1\end{bmatrix}$ turns $(3,1)$ into $(5,1)$. **What happens to every other floor move?** Testing points individually would never cover the whole grid. Instead, read the rows: add twice the height to the horizontal coordinate, and keep the height.

      This **shear** slides points sideways in proportion to height. Matrices can also rotate or stretch arrows. This works because fixed row weights apply the same coordinate rule to every input, changing the whole grid consistently.

      These are **linear transformations**: adding moves before transforming agrees with transforming both and adding afterwards. Scaling before or after also agrees, because multiplication distributes over addition. The origin stays at the origin.

      The **identity matrix** $I$ has ones on its diagonal, from top left to bottom right, and zeros elsewhere. It leaves every vector unchanged: $Ix=x$.

      To apply $B$ first and $A$ second, use $ABx=A(Bx)$. This **composition** applies the rightmost matrix first. Why this way? The second rule receives the first rule's output; swapping them changes that input. Thus $AB$ and $BA$ need not agree.

      A **permutation matrix** reorders entries. Multiplying by one on the right reorders columns, while multiplying on the left reorders rows.
    worked: |
      This example shows a shear and why swapping transformation order changes the result.

      The shear keeps $(1,0)$ fixed: $(1+2\cdot0,0)=(1,0)$. It sends $(0,1)$ to $(0+2\cdot1,1)=(2,1)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" aria-label="A square grid cell becomes a parallelogram under a horizontal shear; the upward arrow moves to (2,1)">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M35 170 H195 M35 170 V50 M35 110 H95 V170" stroke="#d4d4d4" fill="#d4d4d4" fill-opacity="0"/>
          <path d="M35 170 V110" stroke="#10b981" stroke-width="3"/><path d="M35 110 L29 122 H41 Z" fill="#10b981"/>
          <path d="M35 170 H95" stroke="#3b82f6" stroke-width="3"/><path d="M95 170 L83 164 V176 Z" fill="#3b82f6"/>
          <text x="35" y="25">Before</text><text x="45" y="100">(0,1)</text><text x="80" y="195">(1,0)</text>
          <path d="M300 170 H550 M300 170 V50 M300 170 L420 110 H480 L360 170" stroke="#d4d4d4" fill="#d4d4d4" fill-opacity="0"/>
          <path d="M300 170 L420 110" stroke="#10b981" stroke-width="3"/><path d="M420 110 L406 111 L412 122 Z" fill="#10b981"/>
          <path d="M300 170 H360" stroke="#3b82f6" stroke-width="3"/><path d="M360 170 L348 164 V176 Z" fill="#3b82f6"/>
          <text x="300" y="25">After: horizontal += 2 × height</text><text x="420" y="98">(2,1)</text><text x="340" y="195">(1,0)</text>
        </g>
      </svg>
      ```

      Now use $C=\begin{bmatrix}1&2\\3&4\end{bmatrix}$ and the swap matrix $P=\begin{bmatrix}0&1\\1&0\end{bmatrix}$.

      1. Right multiplication gives $CP=\begin{bmatrix}1\cdot0+2\cdot1&1\cdot1+2\cdot0\\3\cdot0+4\cdot1&3\cdot1+4\cdot0\end{bmatrix}=\begin{bmatrix}2&1\\4&3\end{bmatrix}$: columns swap.
      2. Left multiplication gives $PC=\begin{bmatrix}0\cdot1+1\cdot3&0\cdot2+1\cdot4\\1\cdot1+0\cdot3&1\cdot2+0\cdot4\end{bmatrix}=\begin{bmatrix}3&4\\1&2\end{bmatrix}$: rows swap.

      The same two matrices in opposite orders can produce different transformations.
    problems:
      [matp-linear, matp-shear-template, matp-identity, matp-why-order, matp-shear, matp-swap]
  - id: mat-batches-transpose
    title: Scoring many houses in NumPy
    explain: |
      You have many houses with area and bedroom features. **How can you compute two scores per house?** Separate dot products work, but a loop repeats the bookkeeping. Put houses in rows of $X$ and score weights in columns of $W$.

      This **batch** processes examples together. For $n$ houses, $d$ features and $k$ scores, $(n\times d)(d\times k)$ gives $n\times k$. This works because every house row meets every score column. The floor transformation's coordinate rule becomes an ML scoring rule.

      If weights are stored as rows, the **transpose** $A^\top$ (“A transpose”) swaps rows and columns without changing values. For example, $\begin{bmatrix}1&2&3\\4&5&6\end{bmatrix}^\top=\begin{bmatrix}1&4\\2&5\\3&6\end{bmatrix}$ changes shape from $2\times3$ to $3\times2$.

      Transposing a product reverses order: $(AB)^\top=B^\top A^\top$, keeping inner dimensions matched.

      **NumPy** is a Python library for numerical arrays. Its `@` operator multiplies matrices; `.T` transposes and `.shape` reports dimensions. Why this way? `@` organises the same dot products for efficient library execution; `*` only multiplies matching entries, without summing feature contributions.

      Add a **bias**, a fixed amount per score, with `X @ W + b`. **Broadcasting** reuses bias array `b` across house rows without adding columns.
    worked: |
      This example shows a batched product with two scores and a shared bias.

      The import names NumPy `np` for short. `np.array` builds an array from lists; inner lists are rows. Here `b` is a one-dimensional array of two biases.

      ```python
      import numpy as np

      X = np.array([[4, 1], [2, 3]])       # two houses, two features
      W = np.array([[0.5, 1], [2, -1]])    # two features, two scores
      b = np.array([1, 10])               # one bias per score
      Y = X @ W + b
      print(Y)
      # [[ 5. 13.]
      #  [ 8.  9.]]
      print(Y.shape)                     # (2, 2)
      weights_as_rows = W.T
      print(weights_as_rows)
      # [[ 0.5  2. ]
      #  [ 1.  -1. ]]
      ```

      1. First house, first score: $4\cdot0.5+1\cdot2+1=2+2+1=5$.
      2. First house, second score: $4\cdot1+1\cdot(-1)+10=4-1+10=13$.
      3. Second house, first score: $2\cdot0.5+3\cdot2+1=1+6+1=8$.
      4. Second house, second score: $2\cdot1+3\cdot(-1)+10=2-3+10=9$.

      The two biases are reused for each house, and `weights_as_rows.T` would restore the columns needed for the product.

      One batched matrix product computes every house-score pair, then broadcasting adds the matching bias to each row.
    problems:
      [
        matp-code,
        matp-bias-template,
        matp-transpose,
        matp-broadcast,
        matp-why-batch,
        matp-transpose-product,
      ]
final: mat-explain-batch
summary: |
  - Each matrix-product entry is a row-column dot product; matching inner counts leave the outer counts as the result shape.
  - A matrix transforms vectors while preserving addition and scaling; composing transformations multiplies matrices, with the rightmost acting first.
  - Transpose swaps rows and columns; NumPy uses `@` for batched products and broadcasts a bias across rows in `X @ W + b`.

  **Where you'll use this:** linear regression, the perceptron, and attention use matrix products for many weighted scores; rotation matrices transform robot coordinates.
