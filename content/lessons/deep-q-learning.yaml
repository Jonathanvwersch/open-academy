final: dqn-explain-stability
summary: |
  - A Q-network takes a state and outputs one Q-value per action. It is trained by gradient steps on the squared error between $Q(s,a)$ and the TD target $y=r+\gamma\max_{a'}Q(s',a')$, which is just $r$ when the episode ended. In DQN the next-state values come from the target network.
  - Experience replay stores transitions $(s,a,r,s',\text{done})$ in a replay buffer and trains on random minibatches, so updates aren't dominated by a run of similar moves and each move is reused.
  - Because one network sets both the prediction and the target, a step can push the target away, and naive training can diverge. A target network, a frozen copy with weights $\theta^-$ copied every $C$ steps, holds the targets still.
  - For a minibatch, each target is $y=r+\gamma\,(1-\text{done})\max_{a'}Q(s',a';\theta^-)$, computed without gradients, and the loss is the average of the squared errors.

  **Next:** Policy gradients learn the policy directly, which also works when there are too many actions to take a max over.
