      Be careful to pick actions with the Q-network, which has the newest values.

      In the 2015 paper, learning started after $50{,}000$ random moves had filled the buffer, with one gradient step every $4$ moves. The network read the last four screens, since one screen can't show which way things move. With one design and one set of settings, DQN learned 49 Atari 2600 games (a late-1970s games console) from the screen and score alone, and it scored at least $75\%$ of a professional human games tester's score on more than half of them.

      ### Limitations

      DQN needs a short list of actions, because it takes a max over the network's outputs. A robot arm that can set its joints to any angle has endless possible actions, so it needs other methods, such as the policy gradients in a later lesson. The max also tends to make the targets too high. If two actions are both truly worth $5$ and the network's estimates are $4$ and $6$, the max picks $6$. Errors upward get picked and errors downward get passed over, so the targets come out too high on average. A later version, Double DQN (2016), reduces this by choosing the next action with the Q-network and valuing it with the target network, so a lucky high estimate in one network isn't automatically the value used. And DQN needs a lot of experience, tens of millions of screens for each game.

      ### Targets for a whole minibatch

      In code we compute every target in a minibatch at once. The target network gives a table with one row per next state and one column per action. For each row, done is $1$ if the episode ended and $0$ otherwise:
      1. Take the largest output for that row's next state.
      2. Multiply by $1-\text{done}$ to remove future rewards after an ending.
      3. Discount the result.
      4. Add the reward.

      $$y=r+\gamma\,(1-\text{done})\max_{a'}Q(s',a';\theta^-).$$

      When done is $1$, the second term vanishes and the target is just $r$.

    worked: |
      Let's compute the targets and the loss for a minibatch of three transitions in our corridor of 4 cells, where reaching cell 4 ends the episode with reward $10$ and every other step gives $-1$, with $\gamma=0.9$. The target network still has the old weights, $Q(s,\text{left})=s+2$ and $Q(s,\text{right})=s+4$. Suppose training has since changed the Q-network to $Q(s,\text{left})=s+2$ and $Q(s,\text{right})=s+3$. These values are picked to keep the arithmetic simple, and they aren't the ones from step 3. The first transition is a move right from cell 1 to cell 2. The second is a move left from cell 2 to cell 1. The third is a move right from cell 3 to cell 4, which ends the episode.

      1. **Run the target network on the next states.** Take the largest output in each row. The numbers for cell 4 mean nothing, since the episode ended there, and the next step throws them away.
         $$
         \begin{aligned}
         \max(4,6)&=6 &&\text{next state is cell two}\\
         \max(3,5)&=5 &&\text{next state is cell one}\\
         \max(6,8)&=8 &&\text{next state is cell four}
         \end{aligned}
         $$

      2. **Build the targets.** Done is $0$ for the first two and $1$ for the third, so the third transition's $8$ is multiplied by $0$ and drops out.
         $$
         \begin{aligned}
         y_1&=-1+0.9\times6=4.4 &&\text{discount cell two's maximum}\\
         y_2&=-1+0.9\times5=3.5 &&\text{discount cell one's maximum}\\
         y_3&=10 &&\text{keep only the terminal reward}
         \end{aligned}
         $$

      3. **Pick the Q-network's predictions.** Each uses the action the robot took.
         $$Q(1,\text{right})=4,\quad Q(2,\text{left})=4,\quad Q(3,\text{right})=6.$$

      4. **Average the squared errors.**
         $$
         \begin{aligned}
         L&=\frac{(4-4.4)^2+(4-3.5)^2+(6-10)^2}{3} &&\text{average the squared errors}\\
         &=\frac{0.16+0.25+16}{3} &&\text{square each error}\\
         &=\frac{16.41}{3} &&\text{add}\\
         &=5.47 &&\text{divide by the batch size}
         \end{aligned}
         $$

      If we'd taken the first target from the Q-network instead, its cell 2 outputs $(4,5)$ would give $y_1=3.5$, so the two networks really do give different labels.

      Here is the same calculation in PyTorch. These lines are boxes 4 and 5 of the loop, and they use a few things we haven't met yet:

      - `copy_` writes values into a tensor, the way `fill_` does in PyTorch fundamentals, so it also goes inside `torch.no_grad()`.
      - `nn.Linear(1, 2)` stores its weights as a table with one row per output, so `[[1.0], [1.0]]` gives both outputs weight $1$.
      - `.max(dim=1)` takes the largest entry across the columns, so it gives one number per row, and `.values` keeps those numbers.
      - `torch.arange(3)` counts $0$, $1$, $2$. Indexing with two lists pairs them up, so `q[torch.arange(3), actions]` with `actions` equal to `[1, 0, 1]` picks row $0$ column $1$, row $1$ column $0$ and row $2$ column $1$, the action taken in each row, with $0$ for left and $1$ for right.
      - `nn.MSELoss()` averages the squared errors, as in step 4.

      ```python
      import torch
      from torch import nn

      target_net = nn.Linear(1, 2)
      q_net = nn.Linear(1, 2)
      with torch.no_grad():
          target_net.weight.copy_(torch.tensor([[1.0], [1.0]]))
          target_net.bias.copy_(torch.tensor([2.0, 4.0]))
          q_net.weight.copy_(torch.tensor([[1.0], [1.0]]))
          q_net.bias.copy_(torch.tensor([2.0, 3.0]))

      states = torch.tensor([[1.0], [2.0], [3.0]])
      actions = torch.tensor([1, 0, 1])
      rewards = torch.tensor([-1.0, -1.0, 10.0])
      next_states = torch.tensor([[2.0], [1.0], [4.0]])
      dones = torch.tensor([0.0, 0.0, 1.0])
      gamma = 0.9

      with torch.no_grad():
          next_max = target_net(next_states).max(dim=1).values
          targets = rewards + gamma * (1 - dones) * next_max
      q = q_net(states)
      loss = nn.MSELoss()(q[torch.arange(3), actions], targets)
      print([round(t, 2) for t in targets.tolist()])
      print(round(loss.item(), 2))
      # [4.4, 3.5, 10.0]
      # 5.47
      ```

      The targets are computed inside `torch.no_grad()`, so `loss.backward()` would find slopes only for the Q-network. A full program runs these lines inside the six-step loop above, with an optimiser built from `q_net.parameters()`. Each pass calls `optimizer.zero_grad()` before these lines, then `loss.backward()` and `optimizer.step()` after them. Every $C$ steps it copies the weights with `target_net.load_state_dict(q_net.state_dict())`, where `state_dict()` gives a module's weights and biases and `load_state_dict` writes them into another module.
