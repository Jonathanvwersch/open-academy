concept: train-test-split
version: 1
fast_path: [objective, summary]
blocks:
  - kind: objective
    md: |
      **Goal:** explain what training, validation and test sets are each for, and spot data leakage.
  - kind: intuition
    md: |
      A model that has seen the answers will look better than it is. To estimate performance on new data, you must evaluate on data the model, *and your decisions about the model*, never touched.

      - **Train:** fit the parameters.
      - **Validation:** choose settings and decide when to stop. You look at it many times, so it slowly becomes optimistic.
      - **Test:** touched once at the end, for an honest estimate.

      **Leakage** is any path by which information from the evaluation data reaches training: duplicate rows, averages computed from the full table before splitting, or copies of the same sale landing in both splits.
  - kind: example
    md: |
      A table has 100 house sales, but some rows are copies of the same sale. If a copy appears in both the training and test sets, the test can look better than it should because the model has already seen that sale. Keep copies of one sale together in the same split.
  - kind: math
    md: |
      If the test set resembles the data the model will face later, its error gives a useful estimate of future error. Each time you use that set to choose something, the estimate becomes too optimistic for the chosen model.
  - kind: check
    exercise: tts-check-purpose
  - kind: summary
    md: |
      - Train to fit, validate to choose, test once to report.
      - Calculate data summaries, such as means and scales, using the training set only.
      - Keep related records together when splitting, such as multiple measurements of the same house.
