summary: |
  - Training error only measures fit to the training examples. Error on a held-out test set estimates error on new examples of the same kind.
  - Training fits the weights, validation chooses between models, and test scores the chosen model once, because a comparison winner's score is likely a little too good.
  - Hyperparameters, such as the learning rate or the inputs, are fixed before training and chosen by validation error, not training error.
  - Data leakage lets held-out examples shape the model. To stop it, remove duplicates and split first, work out processing values from the training set only, and keep related records in one set.

  **Next:** Probability basics describes uncertainty in data and model predictions.
