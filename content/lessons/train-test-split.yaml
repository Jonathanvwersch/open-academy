concept: train-test-split
version: 3
objective: |
  **Goal:** separate house sales used to fit a model from sales used to choose it and evaluate it fairly.
where_this_fits: |
  Gradient descent adjusted the house-price model to reduce errors on observed sales. A low training loss alone does not show that the model predicts new houses well, because it may have fitted details of those examples. We need to hold out sales and check prediction errors on houses the model has not seen.
knowledge_points:
  - id: tts-why-hold-out
    title: Test on houses the model has not seen
    explain: |
      **What a held-out test is.** A test set is a group of house sales kept separate from fitting so it can estimate how well a trained model predicts unseen houses.

      **How it works.** Fit the weights using training houses, then predict prices for separate test houses without updating the model from their sale prices. Compare each prediction with its known sale. If the model memorised the training examples, its training error can be small while test error remains large.

      Why must test sale prices stay hidden during training? Using them to adjust weights would make the test no longer independent.

      **Why this is useful.** A held-out score checks whether house-price predictions work beyond the sales used to fit the weights.
    worked: |
      This example shows the calculation.
      Suppose a model fits 700 sales and predicts 150 different sales. If it predicts those held-out prices with small errors, that is evidence of generalisation; the fitting error alone cannot provide that evidence.
    problems:
      [
        ttsp-honest-estimate,
        ttsp-memoriser,
        ttsp-heldout-error,
        ttsp-pick-model,
        ttsp-why-hold-out,
        ttsp-robot-heldout,
      ]
  - id: tts-three-splits
    title: Separate training, validation and test houses
    explain: |
      **What the three splits are.** Training data fits model parameters; validation data chooses between model versions or settings; test data gives the final evaluation.

      **How it works.** Split house sales before fitting. Use training sales to calculate gradients and update weights. Compare alternatives on validation sales, but do not fit weights on them. After choosing, report the selected model's score once on the test sales. Why keep test houses separate from model selection? Repeatedly choosing by their scores indirectly fits the model to them.

      **Why this is useful.** Three separate groups let you tune a house-price model without making its final score optimistic.
    worked: |
      This example shows the calculation.
      From 1,000 house sales, one split might use 700 for training, 150 for validation and 150 for test. Only training sales update weights; validation selects a version; test evaluates the chosen version.
    problems:
      [
        ttsp-which-set-fit,
        ttsp-split-counts,
        ttsp-which-set-choose,
        ttsp-why-separate-test,
        ttsp-swap-after-test,
        ttsp-pick-version,
      ]
  - id: tts-hyperparameters
    title: Choose settings without tuning on the test set
    explain: |
      **What a hyperparameter is.** It is a model setting chosen outside the fitted weights, such as the number of hidden units.

      **How it works.** Train each candidate on the training houses and compare their validation errors. Select settings using validation data, then evaluate the selected model once on test houses. If many candidates are tried, the best validation score may partly reflect luck in that particular split.

      Why should test error not choose the number of hidden units? That would turn test examples into part of model selection.

      **Why this is useful.** Validation data helps choose house-model settings while keeping the final test score meaningful.
    worked: |
      This example shows the calculation.
      If house-price models have different numbers of hidden units, fit each on the same training split, select using validation error, and reserve test houses for the final check.
    problems:
      [
        ttsp-param-or-hyper-w,
        ttsp-param-or-hyper-inputs,
        ttsp-why-not-train-choose,
        ttsp-why-best-of-many,
        ttsp-gap-calc,
      ]
  - id: tts-leakage
    title: Prevent information leakage across house splits
    explain: |
      **What data leakage is.** Leakage happens when information from held-out examples influences fitting or model selection before final evaluation.

      **How it works.** Keep every record for the same house in one split. Calculate preprocessing values, such as a mean used to fill a missing area, from training houses only, then apply that value to validation and test houses. Otherwise held-out information can make the score look better than real future predictions.

      Why can duplicate records cause leakage? The same sale in both training and test lets the model see the answer before evaluation.

      **Why this is useful.** Preventing leakage keeps house-price test errors representative of genuinely unseen sales.
    worked: |
      This example shows the calculation.
      If two rows describe the same house sale, assign both to training or both to test, never one to each. Compute a missing-area fill value from training sales only.
    problems:
      [
        ttsp-duplicate-leak,
        ttsp-fill-average,
        ttsp-dup-error,
        ttsp-same-house,
        ttsp-robot-frames,
        ttsp-why-training-average,
      ]
final: tts-explain
summary: |
  - Test predictions on sales the model did not use for fitting.
  - Use training to fit, validation to choose, and test once for final evaluation.
  - Keep duplicates and preprocessing information within the correct split to prevent leakage.

  **Next:** Probability basics describes uncertainty in data and model predictions.
