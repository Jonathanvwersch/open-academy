      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="82" y="205" fill="#737373">3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="82" y="155" fill="#737373">4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="82" y="105" fill="#737373">5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="215" y="318" fill="#3b82f6">u = (2, 1)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="270" y="215" fill="#10b981">v = (1, 2), twice</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="312" y="96" fill="#f59e0b">1u + 2v = (4, 5)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="406" y="196" fill="#737373">multiples of u</text>
      </g>
      </svg>
      ```

      ### Linear combinations and span

      A **linear combination** of some vectors is what we get by multiplying each one by a number and adding the results. For two vectors $u$ and $v$ and any numbers $c_1$ and $c_2$, it's

      $$c_1u+c_2v.$$

      The **span** of a set of vectors is the set of all their linear combinations, every point we can reach with them.

      - One nonzero vector spans a line through the origin.
      - In a flat plane, two vectors that don't lie on one line span the whole plane.
      - In three-dimensional space, two vectors that don't lie on one line span a flat plane through the origin.
      - In three-dimensional space, three vectors that don't all lie in one plane span all of space.

      ### Is a vector in the span?

      To decide whether a vector $b$ is in the span, we look for the amounts. Writing $c_1u+c_2v=b$ one component at a time gives a system of equations, one for each component. For example, the first components of $c_1u$ and $c_2v$ must add up to the first component of $b$. If the system has a solution, $b$ is in the span, and the solution tells us the amounts. If the equations contradict each other, it isn't.

      Be careful not to assume that two vectors always span a plane. The vectors $u=(2,1)$ and $w=(4,2)$ lie on the same line, because $w=2u$. Every combination of them is still a multiple of $u$, so together they span only that line.
    worked: |
      Let's check whether $b=(2,3,5)$ is in the span of $p=(1,0,1)$ and $q=(0,1,1)$, two vectors in three-dimensional space. Then we'll try $(2,3,4)$, which turns out to be outside it.

      1. **Write the combination one component at a time.** Scaling and adding gives a vector whose components we can match against $b$.
         $$c_1p+c_2q=(c_1,\;c_2,\;c_1+c_2)$$

      2. **Match the first two components.** The first component is just $c_1$ and the second is just $c_2$, so they fix both amounts.
         $$c_1=2,\qquad c_2=3$$

      3. **Check the third component.** Use the two amounts to rebuild the vector and compare it with $b$.
         $$
         \begin{aligned}
         2p+3q&=(2,3,2+3) &&\text{put the amounts into the combination}\\
         &=(2,3,5) &&\text{add the third components}\\
         &=b &&\text{all three components match}
         \end{aligned}
         $$

      4. **Try $(2,3,4)$.** The first two components still force $c_1=2$ and $c_2=3$, but now the third doesn't match.
         $$c_1+c_2=5\neq4$$

      Since $p$ and $q$ don't lie on one line, their span is a plane through the origin. It contains $(2,3,5)$ but not $(2,3,4)$, because no amounts make all three components match.
