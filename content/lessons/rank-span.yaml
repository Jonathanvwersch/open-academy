summary: |
  - A linear combination multiplies each vector by a number and adds the results, $c_1u+c_2v$. The span of a set of vectors is all of their linear combinations, which can be a line, a plane or all of space. A vector $b$ is in the span when the equations for the amounts have a solution.
  - Vectors are linearly independent when none of them is a linear combination of the others. Elimination is how we test it. The rank, $\operatorname{rank}(A)$, is the number of pivots elimination leaves, and it equals the number of independent columns.
  - $Ax$ is a combination of the columns of $A$, so $Ax=b$ has a solution only when $b$ is in the column space. Then there's exactly one solution if the rank equals the number of unknowns and infinitely many if it's smaller. A square matrix has an inverse exactly when it's full rank, and for a $2\times2$ matrix that means a nonzero determinant.
  - A nonzero column times a nonzero row, $uv^\top$, has rank 1, and an $m\times k$ matrix times a $k\times n$ matrix has rank at most $k$, so a low-rank matrix can be stored as two thin factors with $mk+kn$ numbers instead of $mn$.

  **Next:** The orthogonality and projections lesson finds the closest point in a column space when $b$ isn't in it, which is how we fit a line to data points that don't all lie on it.
