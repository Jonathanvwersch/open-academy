concept: rank-span
version: 1
objective: |
  **Goal:** decide whether a vector is in the span of others, test vectors for independence and find a matrix's rank by elimination, use the rank to predict whether $Ax=b$ has one, no or infinitely many solutions, and explain why a tall matrix times a wide one has low rank.
recap:
  - concept: inverses-linear-systems
    text: "We write a system of equations as $Ax=b$ and solve it by elimination. When a square matrix $A$ has a nonzero determinant it has an inverse, and $Ax=b$ has exactly one solution, $x=A^{-1}b$."
where_this_fits: |
  ### What are span and rank?

  The span of a set of vectors is every vector we can build from them by scaling them and adding the results. The rank of a matrix counts the columns we really need, after dropping each column we could build from the others.

  Why do we need them? In the lesson on inverses and linear systems, we wrote equations as $Ax=b$ and solved them. A $2\times2$ matrix with a nonzero determinant always gives one answer. But what if the determinant is zero, or the matrix isn't square? Span and rank tell us whether $Ax=b$ has one solution, none or infinitely many. They also explain why a tall, narrow matrix times a short, wide one can be stored with far fewer numbers than the product.
knowledge_points:
  - id: rsp-span
    key_prereqs: [vectors, inverses-linear-systems]
    title: "Build vectors from other vectors"
    tldr: |
      - Scaling vectors and adding them lets us build new vectors.
      - All the vectors we can reach this way form their span.
      - A target is in the span exactly when some choice of amounts reaches it.
    explain: |
      ### Scaling and adding two vectors

      In the vectors lesson, we scaled a vector by multiplying every component by a number, and we added two vectors by adding matching components. Putting those two moves together lets us build new vectors out of old ones.

      Take $u=(2,1)$, the blue arrow, and $v=(1,2)$, the green arrow. Combine one copy of $u$ with two copies of $v$:
      $$
      \begin{aligned}
      2v&=(2,4) &&\text{double each component}\\
      u+2v&=(2,1)+(2,4) &&\text{add the first vector}\\
      &=(4,5) &&\text{add matching components}
      \end{aligned}
      $$
      The orange arrow reaches this point. By choosing other amounts of each, including negative and fractional ones, we can land on any point of the plane, because $u$ and $v$ point along different lines. The grey dashed line shows every multiple of $u$ on its own, so one vector alone only reaches the points on its own line.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" aria-label="A grid with the origin at the bottom left. The blue arrow u = (2, 1) goes from the origin to (2, 1). Two green arrows, each v = (1, 2), continue from (2, 1) to (3, 3) and then to (4, 5). The orange arrow goes straight from the origin to (4, 5), the combination 1u + 2v. A grey dashed line through the origin and (2, 1) marks every multiple of u">
      <defs><marker id="rs1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="rs1-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker><marker id="rs1-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M50 400 V50 M100 400 V50 M150 400 V50 M200 400 V50 M250 400 V50 M300 400 V50 M350 400 V50 M400 400 V50 M50 400 H400 M50 350 H400 M50 300 H400 M50 250 H400 M50 200 H400 M50 150 H400 M50 100 H400 M50 50 H400" stroke="#d4d4d4" stroke-width="1" fill="#ffffff" fill-opacity="0"/>
      <path d="M50 350 H400 M100 400 V50" stroke="#737373" stroke-width="1.5"/>
      <path d="M50 375 L400 200" stroke="#737373" stroke-width="2" stroke-dasharray="7 6"/>
      <path d="M100 350 L300 100" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#rs1-amber)"/>
