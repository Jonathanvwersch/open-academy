      Let's multiply a $3\times2$ matrix $F$ by a $2\times3$ matrix $G$, so $k=2$. Then we'll check the rank of the product and count the numbers each form stores.

      $$F=\begin{bmatrix}1&0\\0&1\\1&1\end{bmatrix},\qquad G=\begin{bmatrix}1&2&0\\0&1&1\end{bmatrix}$$

      1. **Multiply.** Each entry of $FG$ is a row of $F$ dotted with a column of $G$.
         $$FG=\begin{bmatrix}1&2&0\\0&1&1\\1&3&1\end{bmatrix}$$

      2. **Build each column of $FG$ from $F$'s columns.** Call $F$'s columns $f_1=(1,0,1)$ and $f_2=(0,1,1)$. Use each column of $G$ as the amounts:
         $$
         \begin{aligned}
         \text{column 1}&=f_1 &&\text{the amounts are }1,0\\
         \text{column 2}&=2f_1+f_2 &&\text{the amounts are }2,1\\
         &=(2,0,2)+(0,1,1) &&\text{scale the two vectors}\\
         &=(2,1,3) &&\text{add matching components}\\
         \text{column 3}&=f_2 &&\text{the amounts are }0,1
         \end{aligned}
         $$

      3. **Eliminate to find the rank.** Subtract row 1 from row 3, then subtract row 2 from the new row 3.
         $$
         \begin{aligned}
         FG&\longrightarrow\begin{bmatrix}1&2&0\\0&1&1\\0&1&1\end{bmatrix} &&\text{row 3 minus row 1}\\
         &\longrightarrow\begin{bmatrix}1&2&0\\0&1&1\\0&0&0\end{bmatrix} &&\text{row 3 minus row 2}\\
         \operatorname{rank}(FG)&=2 &&\text{count the two pivots}
         \end{aligned}
         $$
         This reaches the ceiling $k=2$.

      4. **Count the numbers stored.** The product has $3\times3$ entries, while the two factors have $3\times2$ and $2\times3$.
         $$9\ \text{against}\ 6+6=12$$

      At this tiny size the factors take more room than the product. The saving appears when $k$ is much smaller than $m$ and $n$, as in the $1000\times1000$ example.
