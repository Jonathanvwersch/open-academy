  - id: rsp-low-rank
    key_prereqs: [matrices, vectors, inverses-linear-systems]
    title: "Store a big matrix as two small ones"
    tldr: |
      - Multiplying one column by one row makes a matrix whose columns lie along one line.
      - More generally, a product can only reach vectors built from the first matrix's columns.
      - When few columns are needed, keeping the two smaller matrices can save many numbers.
    explain: |
      ### A column times a row

      In the lesson on inverses and linear systems, we met the transpose, which turns a column vector $v$ into a row $v^\top$. Take two new vectors with 3 entries each, $u=(1,2,3)$ and $v=(2,1,4)$, which replace the $u$ and $v$ from step 1. In matrix maths they're columns. Then $uv^\top$ is a $3\times1$ matrix times a $1\times3$ matrix, so the result is a $3\times3$ matrix. Its entry in row $i$, column $j$ is entry $i$ of $u$ times entry $j$ of $v$.

      $$uv^\top=\begin{bmatrix}2&1&4\\4&2&8\\6&3&12\end{bmatrix}.$$

      Every column is a multiple of $u$, with the entries of $v$ as the amounts:
      $$
      \begin{aligned}
      \text{column 1}&=2u &&\text{use the first entry of }v\\
      \text{column 2}&=1u &&\text{use the second entry of }v\\
      \text{column 3}&=4u &&\text{use the third entry of }v
      \end{aligned}
      $$
      So when $u$ and $v$ are both nonzero, $uv^\top$ has rank 1. Its 9 entries come from just 6 numbers.

      ### A tall matrix times a wide one

      Take a tall, narrow $m\times k$ matrix $F$ and a short, wide $k\times n$ matrix $G$, where $k$ is much smaller than $m$ and $n$. Follow one column of the product:

      1. Multiplying $F$ by one column of $G$ makes the matching column of $FG$.
      2. As in step 3, that multiplication combines the $k$ columns of $F$, so the result lies in their span.
      3. Every column of $FG$ lies in that span, which holds at most $k$ independent vectors. Therefore:

      $$\operatorname{rank}(FG)\le k.$$

      Be careful here. This bound is only a ceiling. The rank can be lower, for example when the columns of $F$ are themselves dependent.

      ### Saving numbers

      Storing the $m\times n$ product directly takes $mn$ numbers. The factors take $mk+kn$. For $m=n=1000$ and $k=10$:
      $$
      \begin{aligned}
      mn&=1000\times1000 &&\text{count the product's entries}\\
      &=1{,}000{,}000 &&\text{multiply the dimensions}\\
      mk+kn&=1000\times10+10\times1000 &&\text{count the two factors' entries}\\
      &=20{,}000 &&\text{add their sizes}\\
      1{,}000{,}000/20{,}000&=50 &&\text{compare storage}
      \end{aligned}
      $$
      The factors use fifty times fewer numbers.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" aria-label="A tall blue 1000 by 10 matrix, holding 10,000 numbers, times a wide green 10 by 1000 matrix, also holding 10,000 numbers, equals a grey 1000 by 1000 matrix holding 1,000,000 numbers, whose rank is at most 10">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="60" y="40" width="30" height="200" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2"/>
