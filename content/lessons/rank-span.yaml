      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="75" y="264" fill="#3b82f6" text-anchor="middle">1000 × 10</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="75" y="284" fill="#3b82f6" text-anchor="middle">10,000 numbers</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="235" y="96" fill="#10b981" text-anchor="middle">10 × 1000</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="235" y="116" fill="#10b981" text-anchor="middle">10,000 numbers</text>
