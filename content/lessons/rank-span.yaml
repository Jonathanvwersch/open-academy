  - id: rsp-independence-rank
    key_prereqs: [inverses-linear-systems, vectors]
    title: "Test independence and find rank"
    tldr: |
      - Some vectors can be built from the others, so they add no new direction.
      - Independent vectors each add a direction the others cannot supply.
      - A matrix's rank is the largest number of independent columns we can choose.
    explain: |
      ### Vectors that add nothing new

      In step 1, $w=(4,2)$ added nothing to $u=(2,1)$. Since $w=2u$, the span stayed a line. In general, a vector adds nothing new when it's a linear combination of the others, since anything built with it can be built without it.

      A set of vectors is **linearly independent** when none of them is a linear combination of the others. Otherwise it's **linearly dependent**. Two vectors are dependent exactly when one is a multiple of the other. Now look at the columns of

      $$A=\begin{bmatrix}1&1&2\\1&2&3\\2&1&3\end{bmatrix}.$$

      No column is a multiple of another, yet adding the first two gives the third:
      $$(1,1,2)+(1,2,1)=(2,3,3).$$
      So be careful. Checking the vectors in pairs isn't enough.

      ### Testing by elimination

      Elimination subtracts multiples of rows. If column 3 equals column 1 plus column 2, that equality holds in each row. Subtracting one row from another preserves the equality.

      Scan columns from left to right. Use a nonzero entry as a **pivot** to clear the entries below it. After each pivot, look only in the rows below it. Skip a column if all those rows have zero there. Swap rows if needed to bring the pivot to the first unused row. For $A$ the result is

      $$\begin{bmatrix}1&1&2\\0&1&1\\0&0&0\end{bmatrix}.$$

      After elimination, the first nonzero entry in each row is called a **pivot**, and we say its column has a pivot. Here columns 1 and 2 have pivots. Column 3 has none, a sign that it's a combination of earlier columns. In the eliminated matrix, column 3 is column 1 plus column 2, so the same holds for the original columns.

      ### Rank

      The **rank** of a matrix $A$, written $\operatorname{rank}(A)$, is the largest number of its columns that are independent of each other, which is the number of pivots elimination leaves. Our $A$ has rank 2. The columns are independent exactly when every column gets a pivot. Each pivot sits in its own row, so the rank can't exceed the number of rows. So three vectors with two components each, side by side in a two-row matrix, have rank at most 2 and are dependent.
    worked: |
      Let's find the rank of $A=\begin{bmatrix}1&1&2\\1&2&3\\2&1&3\end{bmatrix}$ by elimination, step by step.

      1. **Make column 1 zero below row 1.** Change one row at a time, keeping row 1 fixed.
         $$
         \begin{aligned}
         A&\longrightarrow\begin{bmatrix}1&1&2\\0&1&1\\2&1&3\end{bmatrix} &&\text{row 2 minus row 1}\\
         &\longrightarrow\begin{bmatrix}1&1&2\\0&1&1\\0&-1&-1\end{bmatrix} &&\text{row 3 minus twice row 1}
         \end{aligned}
         $$

      2. **Make column 2 zero below row 2.** Adding row 2 to row 3 removes the $-1$.
         $$\begin{bmatrix}1&1&2\\0&1&1\\0&0&0\end{bmatrix}$$

      3. **Count the pivots.** Rows 1 and 2 each have a first nonzero entry, and row 3 has none.
         $$\operatorname{rank}(A)=2$$

      4. **Check the relationship in the original columns.** Column 3 had no pivot, so it should be a combination of columns 1 and 2.
         $$(1,1,2)+(1,2,1)=(2,3,3)$$

      The first two columns give two independent directions. Since the third is their sum, adding it leaves the rank at 2.
    problems:
      - rsp-independence-basics
      - rspp-rank-self-explain
      - rspp-dependent-pair
      - rspp-rank-fixed
      - rspp-dependent-template
      - rspp-pairs-trap
      - rspp-too-many
      - rspp-duplicate-feature
  - id: rsp-solutions
    key_prereqs: [inverses-linear-systems, matrices]
    title: "Tell how many solutions a system has"
    tldr: |
      - A matrix times a vector combines the matrix's columns.
      - Multiplying a sum of vectors gives the sum of their separate outputs.
      - An equation has a solution only if those columns can build the target.
      - If they can, independent columns give one solution and dependent columns give infinitely many.
    explain: |
      ### A matrix times a vector combines its columns

      The determinants lesson showed that a $2\times2$ matrix sends $(x,y)$ to $x$ times column 1 plus $y$ times column 2. The same holds for any matrix. Name the $n$ columns of a matrix $A$ as $a_1,\dots,a_n$. If $x$ has entries $x_1,\dots,x_n$, then

      $$Ax=x_1a_1+x_2a_2+\dots+x_na_n.$$

      Multiplication distributes over vector addition: $A(x+y)=Ax+Ay$.

      So solving $Ax=b$ asks which amounts of the columns of $A$ build $b$, if any. The span of a matrix's columns is called its **column space**. Rank 1 makes it a line through the origin, and rank 2 a plane.

      ### One, none or infinitely many

      Take $B=\begin{bmatrix}1&2\\2&4\end{bmatrix}$. Its columns $(1,2)$ and $(2,4)$ lie on one line, so $\operatorname{rank}(B)=1$ and its column space is the line through them, dashed below.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" aria-label="The columns of B, blue (1, 2) and green (2, 4), are both drawn from the origin and lie along one grey dashed line through the origin, the column space of B. The orange point b = (3, 6) lies on that line, so it can be reached. The red point b = (3, 1) lies off the line, so no combination of the columns reaches it">
      <defs><marker id="rs3-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="rs3-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M75 415 V55 M120 415 V55 M165 415 V55 M210 415 V55 M255 415 V55 M300 415 V55 M345 415 V55 M75 415 H345 M75 370 H345 M75 325 H345 M75 280 H345 M75 235 H345 M75 190 H345 M75 145 H345 M75 100 H345 M75 55 H345" stroke="#d4d4d4" stroke-width="1" fill="#ffffff" fill-opacity="0"/>
      <path d="M75 370 H345 M120 415 V55" stroke="#737373" stroke-width="1.5"/>
      <path d="M97.5 415 L277.5 55" stroke="#737373" stroke-width="2" stroke-dasharray="7 6"/>
      <path d="M120 370 L210 190" stroke="#10b981" stroke-width="3.5" marker-end="url(#rs3-green)"/>
      <path d="M120 370 L165 280" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#rs3-blue)"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="161" y="390" fill="#737373">1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="206" y="390" fill="#737373">2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="251" y="390" fill="#737373">3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="296" y="390" fill="#737373">4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="102" y="330" fill="#737373">1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="102" y="285" fill="#737373">2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="102" y="240" fill="#737373">3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="102" y="195" fill="#737373">4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="102" y="150" fill="#737373">5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="102" y="105" fill="#737373">6</text>
      <circle cx="255" cy="100" r="6" fill="#f59e0b"/>
      <circle cx="255" cy="325" r="6" fill="#ef4444"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="177" y="292" fill="#3b82f6">column 1 = (1, 2)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="222" y="200" fill="#10b981">column 2 = (2, 4)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="269" y="105" fill="#f59e0b">b = (3, 6) is on the line: reachable</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="269" y="330" fill="#ef4444">b = (3, 1) is off the line: not reachable</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="287.5" y="71" fill="#737373">column space of B</text>
      </g>
      </svg>
      ```

      - The orange $b=(3,6)$ is on the line. Two choices reach it:
        $$
        \begin{aligned}
        B\begin{bmatrix}3\\0\end{bmatrix}&=3\begin{bmatrix}1\\2\end{bmatrix} &&\text{use three copies of column 1}\\
        &=\begin{bmatrix}3\\6\end{bmatrix} &&\text{scale the column}\\
        B\begin{bmatrix}1\\1\end{bmatrix}&=\begin{bmatrix}1\\2\end{bmatrix}+\begin{bmatrix}2\\4\end{bmatrix} &&\text{use one copy of each column}\\
        &=\begin{bmatrix}3\\6\end{bmatrix} &&\text{add the columns}
        \end{aligned}
        $$
        Column 2 is twice column 1, so we can trade one copy of column 2 for two of column 1.
      - The red $b=(3,1)$ is off the line, so nothing reaches it.
      - Now take $C=\begin{bmatrix}2&1\\1&2\end{bmatrix}$, whose columns are $u$ and $v$ from step 1. They span the plane, so every $b$ is reached. They're independent, so nothing can be traded and exactly one $x$ reaches it.

      In general, for $Ax=b$ with $n$ unknowns:

      - If $b$ isn't in the column space, there's no solution. Elimination shows this as a row that says $0$ equals a nonzero number, such as $0=1$.
      - If $b$ is in the column space and $\operatorname{rank}(A)=n$, there's exactly one solution, because the columns are independent.
      - If $b$ is in the column space and $\operatorname{rank}(A)<n$, there are infinitely many, because a dependent column lets us trade amounts, as with $B$.

      ### Which square matrices have inverses

      A square $n\times n$ matrix with rank $n$ is called **full rank**. Its columns reach every vector with $n$ entries, so every $b$ has exactly one solution. So we can always undo $A$, and it has an inverse. With a smaller rank, some $b$ can't be reached and there's no inverse. For a $2\times2$ matrix, rank below 2 means the columns lie on one line, which is exactly when the determinant is zero. For $B$:
      $$
      \begin{aligned}
      \det(B)&=1\times4-2\times2 &&\text{use the diagonal rule}\\
      &=4-4 &&\text{multiply the entries}\\
      &=0 &&\text{subtract the products}
      \end{aligned}
      $$
    worked: |
      Let's solve $Ax=b$ for the matrix $A=\begin{bmatrix}1&1&2\\1&2&3\\2&1&3\end{bmatrix}$, which has rank 2, first with $b=(3,4,5)$ and then with $b=(3,4,6)$. We'll call the entries of $x$ by the names $x_1$, $x_2$ and $x_3$.

      1. **Apply the same row operations to $b$.** Each row is an equation, so every operation on a row of $A$ must also be done to the matching entry of $b$.
         $$
         \begin{aligned}
         \begin{bmatrix}3\\4\\5\end{bmatrix}&\longrightarrow\begin{bmatrix}3\\1\\5\end{bmatrix} &&\text{row 2 minus row 1}\\
         &\longrightarrow\begin{bmatrix}3\\1\\-1\end{bmatrix} &&\text{row 3 minus twice row 1}\\
         &\longrightarrow\begin{bmatrix}3\\1\\0\end{bmatrix} &&\text{row 3 plus the new row 2}
         \end{aligned}
         $$

      2. **Write the resulting equations.** The matrix from the rank step and the new right-hand side give:
         $$\begin{aligned}x_1+x_2+2x_3&=3 &&\text{first row}\\x_2+x_3&=1 &&\text{second row}\\0&=0 &&\text{third row}\end{aligned}$$

      3. **Read the last row.** It says $0=0$, so there's no contradiction and $b$ is in the column space. The rank, 2, is less than the 3 unknowns, so there are infinitely many solutions.
         $$\operatorname{rank}(A)=2<3$$

      4. **Find the other entries from $x_3$.** Column 3 has no pivot, so we can choose $x_3$ freely, then solve the other rows.
         $$
         \begin{aligned}
         x_2&=1-x_3 &&\text{rearrange the second row}\\
         x_1&=3-x_2-2x_3 &&\text{rearrange the first row}\\
         &=3-(1-x_3)-2x_3 &&\text{put the expression for }x_2\text{ back}\\
         &=2-x_3 &&\text{collect terms}
         \end{aligned}
         $$

      5. **Choose two values of $x_3$.** Putting each choice into those expressions gives two solutions.
         $$
         \begin{aligned}
         x&=(2,1,0) &&\text{choose }x_3=0\\
         x&=(1,0,1) &&\text{choose }x_3=1
         \end{aligned}
         $$

      6. **Change $b$ to $(3,4,6)$.** Apply the same operations to the new right-hand side.
         $$
         \begin{aligned}
         \begin{bmatrix}3\\4\\6\end{bmatrix}&\longrightarrow\begin{bmatrix}3\\1\\6\end{bmatrix} &&\text{row 2 minus row 1}\\
         &\longrightarrow\begin{bmatrix}3\\1\\0\end{bmatrix} &&\text{row 3 minus twice row 1}\\
         &\longrightarrow\begin{bmatrix}3\\1\\1\end{bmatrix} &&\text{row 3 plus the new row 2}\\
         0&=1 &&\text{the last equation is false}
         \end{aligned}
         $$

      So with $b=(3,4,5)$ there are infinitely many solutions, and with $b=(3,4,6)$ there are none, because $(3,4,6)$ is not in the column space.
    problems:
