  - id: gauss-small-effects
    title: See why sums form a bell
    explain: |
      ### Adding independent changes

      Why might our sensor's readings form a bell shape? Electrical noise and vibration can each change a reading slightly, and those changes add together. To see what adding random contributions does, let's roll two fair six-sided dice and add their results. Why is a total of 7 more likely than 2?

      The dice give us a simple example whose results we can count. They are independent: one die's result tells us nothing about the other.

      An **ordered pair** records each die separately. The pair $(1,6)$ means first die 1, second die 6, so it differs from $(6,1)$ even though both sum to 7.

      Two dice make a pointed mound, but five make a rounder outline. Counting ordered results gives the bars' probabilities. Five-dice bars have width 1, so area equals height, comparable with **density**, probability per unit width. The worked example finds the average, or mean, and average squared distance from it, or variance, for a matching **Gaussian**, a symmetric bell-shaped distribution.

