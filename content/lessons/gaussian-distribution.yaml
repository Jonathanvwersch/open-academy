      ### When a bell becomes useful

      The **central limit theorem** explains why sums or averages can become approximately Gaussian. One simple version uses many independent effects with the same distribution and a limited range of possible sizes, as dice have. As we add dice, their total becomes more bell-shaped even though each die still has six equally likely faces.

      Sensor effects need not all have the same distribution. Other versions allow different small effects, provided no single effect accounts for most of the variation. This makes a Gaussian plausible, not guaranteed.

      ### Limitations

      The **standard deviation** $\sigma$ is the square root of variance. Be careful if stray reflections make a sensor report 150 cm. That is 25 standard deviations above its mean of 100 cm when $\sigma=2$, so a Gaussian gives nearby readings essentially no probability. Frequent readings there would contradict the model.

      The bell argument needs independent effects within a reading. A motor driving both noise and vibration breaks that independence. Counts are whole numbers, never negative. A Gaussian can approximate large counts far from zero, but fits small counts poorly.

      Compare the model with real readings. Other distributions handle counts or frequent large errors, so we need not force a Gaussian to fit.
    worked: |
      Let's count the two-dice picture, then find the centre and spread for five dice.

      1. **Count pairs.** Two dice have $6\times6=36$ equally likely results. The six pairs for 7 are $(1,6),(2,5),(3,4),(4,3),(5,2),(6,1)$, but only $(1,1)$ gives 2.
         $$P(\text{sum is }7)=\frac6{36}=\frac16,\qquad P(\text{sum is }2)=\frac1{36}$$

      2. **Find one die's mean.** We average its six equally likely faces.
         $$\mu=\frac{1+2+3+4+5+6}{6}=3.5$$

      3. **Find one die's variance.** We average squared distances from 3.5, just as in step 1 of the lesson.
         $$\text{variance}=\frac{2.5^2+1.5^2+0.5^2+0.5^2+1.5^2+2.5^2}{6}=\frac{35}{12}$$

      4. **Add five independent dice.** Means add, and for independent effects variances add too. Five dice have $6^5=7776$ equally likely ordered results.
         $$\mu=5\times3.5=17.5,\qquad\text{variance}=5\times\frac{35}{12}=\frac{175}{12}$$

      The overlaid Gaussian uses this mean and variance, with standard deviation equal to the square root of variance.
