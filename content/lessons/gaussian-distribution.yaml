      ### Height times width gives area

      The mean $\mu$, or average, sets the centre. The **standard deviation** $\sigma$, the square root of the average squared distance from the mean, sets the spread. Near the peak, a narrow 0.1 cm interval has probability about $0.20\times0.1=0.02$. That 0.20 is the **density**, or probability per centimetre.

      Narrower rectangles each get their own curve height. Their areas add to an interval's probability. The shaded area from 98 to 102 cm is about 68%. The thin ends far from the centre are called **tails**.

      Total area is 1. Chances belong to intervals, and every real reading lands in some interval. An exact value has zero probability because it has zero width. A displayed 100 cm, rounded to the nearest centimetre, means a reading between 99.5 and 100.5 cm.

      ### Areas we can reuse

      For a Gaussian, about 68%, 95% and 99.7% of the area lies within one, two and three standard deviations of the mean. A computer measures these areas once. Measuring in standard deviations makes the percentages the same for every centre and spread. Our sensor's ranges are 98–102, 96–104 and 94–106 cm.

      Be careful not to apply this rule to every distribution. The mean gives the centre and $\sigma$ gives spread, but only a Gaussian shape gives these percentages.
    worked: |
      Let's estimate how often our Gaussian sensor model falls outside 96–104 cm. Let $X$ be a reading before rounding.

      1. **Measure the distance.** Each endpoint is two standard deviations from 100 cm.
         $$\frac{104-100}{2}=2,\qquad\frac{96-100}{2}=-2$$

      2. **Use the bell rule.** About 95% lies inside this range.
         $$P(96\le X\le104)\approx0.95$$

      3. **Take the complement.** The rest is outside.
         $$P(X<96\text{ or }X>104)\approx1-0.95=0.05$$

      Symmetry splits that 5% equally, so each tail has about 2.5%.
    problems:
