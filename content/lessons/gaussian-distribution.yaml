summary: |
  - The mean $\mu$ gives the centre, variance averages squared distances, and $\sigma=\sqrt{\text{variance}}$ gives spread in the original units.
  - A Gaussian has total area 1. Interval areas give probabilities, with about 68%, 95% and 99.7% within one, two and three standard deviations.
  - Its density is $f(x)=\frac{1}{\sigma\sqrt{2\pi}}e^{-(x-\mu)^2/(2\sigma^2)}$, where $z=(x-\mu)/\sigma$ counts standard deviations from the centre. Greater spread makes the bell wider and lower.
  - Independent small effects can give Gaussian-like totals, but counts and frequent large errors may need other distributions.

  **Next:** Maximum likelihood uses density heights to choose the mean and standard deviation best fitting our readings.
