  - id: gauss-density-formula
    title: Calculate the bell's height
    explain: |
      ### Why calculate a height?

      Model a sensor with a Gaussian bell-shaped distribution centred at mean 100 cm and standard deviation 2 cm. Standard deviation is the square root of the average squared distance from the mean. Equal small intervals near 100 and 102 cm have chances in a ratio of about 1.65 to 1. Height times width estimates the chance. We'll build the height from a distance-dependent **shape factor** and a shared **front factor** that sets total area to 1.

      Keeping the centre at 100 cm, greater spread makes the bell wider and lower.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" aria-label="Two Gaussian densities with mean 100 cm. Standard deviation 1 cm gives peak 0.40 per cm in blue. Standard deviation 2 cm gives peak 0.20 per cm in orange, twice the width and half the height.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M50 30 V210 H500" fill="#171717" fill-opacity="0" stroke="#737373"/><text x="50" y="20">Density per cm</text><text x="275" y="260" text-anchor="middle">Reading (cm)</text><text x="50" y="233" text-anchor="middle">92</text><text x="160" y="233" text-anchor="middle">96</text><text x="270" y="233" text-anchor="middle">100</text><text x="380" y="233" text-anchor="middle">104</text><text x="490" y="233" text-anchor="middle">108</text><path d="M50.00 210.00 L55.50 210.00 L61.00 210.00 L66.50 210.00 L72.00 210.00 L77.50 210.00 L83.00 210.00 L88.50 210.00 L94.00 210.00 L99.50 210.00 L105.00 210.00 L110.50 210.00 L116.00 210.00 L121.50 210.00 L127.00 210.00 L132.50 210.00 L138.00 210.00 L143.50 210.00 L149.00 209.99 L154.50 209.98 L160.00 209.95 L165.50 209.88 L171.00 209.76 L176.50 209.51 L182.00 209.05 L187.50 208.23 L193.00 206.83 L198.50 204.57 L204.00 201.04 L209.50 195.81 L215.00 188.40 L220.50 178.42 L226.00 165.63 L231.50 150.11 L237.00 132.33 L242.50 113.21 L248.00 94.12 L253.50 76.71 L259.00 62.69 L264.50 53.58 L270.00 50.42 L275.50 53.58 L281.00 62.69 L286.50 76.71 L292.00 94.12 L297.50 113.21 L303.00 132.33 L308.50 150.11 L314.00 165.63 L319.50 178.42 L325.00 188.40 L330.50 195.81 L336.00 201.04 L341.50 204.57 L347.00 206.83 L352.50 208.23 L358.00 209.05 L363.50 209.51 L369.00 209.76 L374.50 209.88 L380.00 209.95 L385.50 209.98 L391.00 209.99 L396.50 210.00 L402.00 210.00 L407.50 210.00 L413.00 210.00 L418.50 210.00 L424.00 210.00 L429.50 210.00 L435.00 210.00 L440.50 210.00 L446.00 210.00 L451.50 210.00 L457.00 210.00 L462.50 210.00 L468.00 210.00 L473.50 210.00 L479.00 210.00 L484.50 210.00 L490.00 210.00" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="3"/><path d="M50.00 209.97 L55.50 209.96 L61.00 209.94 L66.50 209.92 L72.00 209.88 L77.50 209.83 L83.00 209.75 L88.50 209.66 L94.00 209.52 L99.50 209.35 L105.00 209.11 L110.50 208.81 L116.00 208.42 L121.50 207.92 L127.00 207.28 L132.50 206.49 L138.00 205.52 L143.50 204.33 L149.00 202.91 L154.50 201.20 L160.00 199.20 L165.50 196.88 L171.00 194.21 L176.50 191.19 L182.00 187.82 L187.50 184.10 L193.00 180.05 L198.50 175.73 L204.00 171.16 L209.50 166.43 L215.00 161.61 L220.50 156.78 L226.00 152.06 L231.50 147.55 L237.00 143.36 L242.50 139.59 L248.00 136.35 L253.50 133.72 L259.00 131.79 L264.50 130.61 L270.00 130.21 L275.50 130.61 L281.00 131.79 L286.50 133.72 L292.00 136.35 L297.50 139.59 L303.00 143.36 L308.50 147.55 L314.00 152.06 L319.50 156.78 L325.00 161.61 L330.50 166.43 L336.00 171.16 L341.50 175.73 L347.00 180.05 L352.50 184.10 L358.00 187.82 L363.50 191.19 L369.00 194.21 L374.50 196.88 L380.00 199.20 L385.50 201.20 L391.00 202.91 L396.50 204.33 L402.00 205.52 L407.50 206.49 L413.00 207.28 L418.50 207.92 L424.00 208.42 L429.50 208.81 L435.00 209.11 L440.50 209.35 L446.00 209.52 L451.50 209.66 L457.00 209.75 L462.50 209.83 L468.00 209.88 L473.50 209.92 L479.00 209.94 L484.50 209.96 L490.00 209.97" fill="#171717" fill-opacity="0" stroke="#f59e0b" stroke-width="3"/><text x="330" y="50" fill="#3b82f6">spread 1 cm; peak 0.40</text><text x="330" y="76" fill="#f59e0b">spread 2 cm; peak 0.20</text><text x="43" y="55" text-anchor="end">0.40</text><text x="43" y="134" text-anchor="end">0.20</text>
      </g>
      </svg>
      ```

      To **standardise** a reading, subtract the mean and divide by the standard deviation. This gives $z$, the signed distance in standard deviations, without units.

      $$z=\frac{x-\mu}{\sigma}$$

      ### Turning distances into heights

      Like $\pi\approx3.14$, $e\approx2.718$ is fixed. Negative powers mean reciprocals, so $e^{-1}=1/e$, $e^{-2}=1/e^2$, and $e^{-0.5}=1/\sqrt e$. A calculator handles these powers for us. Bigger squared distances give smaller values, which is all we need here.

      We square the distance so left and right match.

      $$z^2=\frac{(x-\mu)^2}{\sigma^2}$$

      The shape factor, which shrinks with distance from the centre, is

      $$e^{-z^2/2}=e^{-(x-\mu)^2/(2\sigma^2)}$$

      We use $e$ as the conventional base. Dividing by 2 makes $\sigma$ equal the curve's standard deviation. We will take that fact on trust. The factor is 1 at the centre, about 0.61 one standard deviation away, and 0.14 two away.

      ### Keeping area equal to one

      The **normal density** $f(x)$, read "f of x", is the curve's height above reading $x$. So $f(102)$ is the height above 102.

      $$f(x)=\frac{1}{\sigma\sqrt{2\pi}}e^{-(x-\mu)^2/(2\sigma^2)}$$

      The standard deviation $\sigma$ must be positive, and variance is $\sigma^2$. Histogram bars group readings into intervals whose areas give their probabilities. Their areas add to 1, including beyond the picture. The curve needs total area 1 too.

      The front factor is $1/(\sigma\sqrt{2\pi})$. Its derivation needs further maths. The shape-factor curve's area along the $z$ axis is $\sqrt{2\pi}\approx2.507$. Stretching width by $\sigma$ multiplies area by $\sigma$, so dividing by both gives area 1. Doubling width halves the peak. At 100 and 102 cm, the shared front factor cancels, leaving shape-factor ratio $1/e^{-1/2}\approx1/0.607\approx1.65$.

      Height is not probability. With $\sigma=0.1$ cm the peak is about 3.99 per cm. A narrow curve can be that tall while its area stays 1.
    worked: |
      Let's find the height at 102 cm for mean 100 cm and standard deviation 2 cm. Use a calculator for powers and square roots.

      1. **Standardise the reading.** We measure distance in standard deviations.
         $$z=\frac{102-100}{2}=1$$

      2. **Find the shape factor.** We square that distance and divide by 2 in the negative exponent.
         $$e^{-z^2/2}=e^{-1/2}=1/\sqrt e\approx0.61$$

      3. **Scale the height.** We keep the unrounded factor until the end.
         $$f(102)=\frac{e^{-1/2}}{2\sqrt{2\pi}}\approx0.12\text{ per cm}$$

      The peak is about 0.20 per cm. Equal narrow intervals near 102 and 100 therefore have chances in roughly the ratio $0.61$ to 1.
