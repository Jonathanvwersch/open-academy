concept: gaussian-distribution
version: 1
objective: "**Goal:** relate the mean and variance to the centre, width and height of a normal
  density, use it to describe measurement noise, and recognise when it is a poor model."
recap:
  - concept: probability-basics
    text: A distribution describes a random variable's chances. Its expected value $E[X]$ is its
      long-run average. Probabilities add to 1; independent events give no information about each
      other.
where_this_fits: |
  ### What is a Gaussian distribution?

  A Gaussian distribution, also called a normal distribution, is a model of chance with values clustered around a centre in a symmetric bell shape. Values farther away are less likely on either side.

  It helps describe measurement noise, the difference between a reading and the true distance. A table lists a die's chances, but measurements can fall anywhere along a number line. A smooth curve describes their chances using a centre and spread, helping us estimate how often readings will be unusually far away.
knowledge_points:
  - id: gauss-centre-spread
    title: Find the centre and spread
    explain: |
      ### Readings around a centre

      A **Gaussian** is a distribution with a symmetric bell-shaped curve. Two numbers fix its shape: its average, called the **mean**, and its typical distance from that average, measured by the **standard deviation**. A sensor aimed at a wall 100 cm away gives readings of 97, 99, 100, 101 and 103 cm. A robot uses such readings to judge its distance from obstacles.

      For a distribution, the mean is the expected value $E[X]$. For a list, add the readings and divide by how many there are. We write it as $\mu$, the Greek letter mu. Our mean is 100 cm.

      ### Why we square the distances

      Subtract the mean to get each reading's **deviation**, its signed distance from the centre. Signed means it can be negative, for readings below the mean. Our deviations are $-3,-1,0,1,3$ cm. Their average is zero despite the variation.

      Absolute distances, with minus signs dropped, would stop that cancellation too. We use squared distances because they give the **variance**, the spread measure that the Gaussian formula uses. In step 3 we will see how the bell formula is built from squared distance.

      Let $x$ stand for a reading. Then

      $$\text{variance}=\text{average of }(x-\mu)^2$$

      We count each reading equally here. For a distribution, each squared distance counts in proportion to its probability. Squaring gives squared units, and the next section puts spread back in centimetres.

      ### Taking the square root

      The **standard deviation** is the positive square root of variance, written $\sigma$, the Greek letter sigma.

      $$\sigma=\sqrt{\text{variance}}$$

      Our variance is 4 square centimetres, so $\sigma=2$ cm because $2^2=4$. Think of it as roughly the typical distance from the mean, not a limit. Our readings are 0, 1 or 3 cm away. Step 2 gives a more precise meaning for a Gaussian using its 68% rule.
    worked: |
      Let's find the centre and spread of our five sensor readings.

      1. **Find the mean.** We add the readings and divide by five.
         $$\mu=\frac{97+99+100+101+103}{5}=100\text{ cm}$$

      2. **Average squared distances.** We square each deviation to find variance.
         $$\text{variance}=\frac{(-3)^2+(-1)^2+0^2+1^2+3^2}{5}=4\text{ cm}^2$$

      3. **Take the square root.** This returns spread to centimetres.
         $$\sigma=\sqrt4=2\text{ cm}$$

      We assume Gaussian noise. Step 4 explains why that is plausible and when to check it.
    problems:
      - gauss-spread-basics
      - gauss-spread-why
      - gauss-variance-template
      - gauss-sd-template
      - gauss-shift
      - gauss-scale
  - id: gauss-bell-area
    title: Read chances from a bell
    explain: |
      ### From bars to a curve

      A **histogram** groups readings into intervals. Each bar's area is its fraction of readings. From 100 to 101 cm, the fraction is about 0.1915, so the height is $0.1915\div1=0.1915$ per cm.

      $$\text{bar height}=\frac{\text{fraction in interval}}{\text{interval width}}$$

      A **Gaussian distribution** has a symmetric bell-shaped curve. More readings from it and narrower bars trace that bell. Five readings cannot establish the shape. These fractions come from the model itself, as if we had very many readings.

      ```svg
