  - id: lr-gradient
    title: "Update the weight and bias"
    explain: |
      ### The slope of the loss against the score

      To use gradient descent, we need the slope of the loss for each parameter. Let's start with how the loss changes as the score changes, for a house that sold. The red curve shows its loss, $-\ln p$, drawn against the score.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" aria-label="The red curve is the loss for a house with label 1, drawn against the score z from minus 4 to 4. It falls as the score rises and flattens out towards 0. Orange tangent lines show its slope: minus 0.5 at score 0, where p is 0.5, and only minus 0.12 at score 2, where p is 0.88">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M80 300 H560 M320 300 V79.99999999999997" stroke="#d4d4d4"/>
      <path d="M80 99.09 L92 108.89 L104 118.65 L116 128.36 L128 138 L140 147.57 L152 157.05 L164 166.42 L176 175.66 L188 184.75 L200 193.65 L212 202.35 L224 210.8 L236 218.98 L248 226.84 L260 234.34 L272 241.44 L284 248.13 L296 254.35 L308 260.09 L320 265.34 L332 270.09 L344 274.35 L356 278.13 L368 281.44 L380 284.34 L392 286.84 L404 288.98 L416 290.8 L428 292.35 L440 293.65 L452 294.75 L464 295.66 L476 296.42 L488 297.05 L500 297.57 L512 298 L524 298.36 L536 298.65 L548 298.89 L560 299.09" stroke="#ef4444" stroke-width="3" fill="#ffffff" fill-opacity="0"/>
      <path d="M272 245.34 L368 285.34" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="320" cy="265.34" r="5" fill="#171717"/>
      <path d="M392 288.89 L488 298.42" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="440" cy="293.65" r="5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="296" y="299.34" fill="#f59e0b" text-anchor="end">score 0, p = 0.5: slope −0.5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="560" y="249.65" fill="#f59e0b" text-anchor="end">score 2, p = 0.88: slope −0.12</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="305" fill="#737373" text-anchor="end">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="255" fill="#737373" text-anchor="end">1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="205" fill="#737373" text-anchor="end">2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="155" fill="#737373" text-anchor="end">3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="70" y="105" fill="#737373" text-anchor="end">4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="80" y="322" fill="#737373" text-anchor="middle">−4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="200" y="322" fill="#737373" text-anchor="middle">−2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="322" fill="#737373" text-anchor="middle">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="440" y="322" fill="#737373" text-anchor="middle">2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="560" y="322" fill="#737373" text-anchor="middle">4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="342" fill="#737373" text-anchor="middle">score z</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="90" y="85" fill="#ef4444">loss for a house with label 1</text>
      </g>
      </svg>
      ```

      At score 0, where $p=0.5$, the orange line shows a slope of $-0.5$. A small nudge checks this: raising the score from 0 to $0.1$ lowers the loss from $0.69$ to $0.64$. At score 2, where $p=0.88$, the slope is only $-0.12$. In both cases the slope is $p-1$, the probability minus the label. Working out the derivative, which we'll skip here, shows that this holds for every score and for label 0 too, so

      $$\frac{\partial L}{\partial z}=p-y.$$

      It's negative when $p$ is below the label, so raising the score lowers the loss, and positive when $p$ is above it.

      ### From the score to the weight and bias

      The score is $z=wx+b$. Raising $w$ by a small amount raises the score by $x$ times that amount, so the slope for the weight is $x$ times the slope for the score. Raising $b$ raises the score by the same amount, so the bias keeps the score slope unchanged:

      $$\frac{\partial L}{\partial w}=(p-y)\,x,\qquad\frac{\partial L}{\partial b}=p-y.$$

      With several inputs, the slope for each weight $w_j$ is $(p-y)\,x_j$.

      ### One gradient descent step

      Now we subtract each slope times the learning rate $\eta$, just as in the gradient descent lesson:

      $$w_{\text{new}}=w-\eta\,(p-y)\,x,\qquad b_{\text{new}}=b-\eta\,(p-y).$$

      Be careful with an input of 0. The weight slope is then 0, so the weight doesn't move, but the bias still does.
    worked: |
      Let's take one gradient descent step for the new house with 2 viewings, which sold, so $x=2$ and $y=1$, starting from $w=1$ and $b=-4$ with a learning rate of $\eta=0.5$. Its score is $-2$ and its probability is $0.12$.

      1. **Find the score slope.** The score slope is the probability minus the label.
         $$p-y=0.12-1=-0.88.$$

      2. **Find the weight and bias slopes.** For the weight, we multiply the score slope by the input, 2; the bias slope is the score slope itself.
         $$\frac{\partial L}{\partial w}=-0.88\times2=-1.76,\qquad\frac{\partial L}{\partial b}=-0.88.$$

      3. **Subtract the scaled slopes.** Both slopes are negative, so subtracting them raises both parameters.
         $$w=1-0.5\times(-1.76)=1.88,\qquad b=-4-0.5\times(-0.88)=-3.56.$$

      4. **Check the new prediction.** The new score is $1.88\times2-3.56=0.2$, so the new probability is $\sigma(0.2)\approx0.55$.
         $$L=-\ln0.55\approx0.60.$$

      The loss fell from $2.13$ to $0.60$ in one step. In training we average each parameter's slopes over all the houses, take one step and repeat.

