concept: logistic-regression
version: 3
objective: |
  **Goal:** answer a yes-or-no question with logistic regression, by turning a weighted score into a probability, measuring that probability with binary cross-entropy and updating the weight and bias to lower the loss.
recap:
  - concept: linear-regression
    text: "A linear model with one input predicts $wx+b$: it multiplies the input $x$ by a weight $w$ and adds a bias $b$. The weight says how much the output rises when $x$ rises by one."
  - concept: gradient-descent
    text: "Gradient descent trains a model by repeating one step: find the slope of the loss for each parameter, multiply it by a small learning rate $\\eta$ and subtract it, so $w_{\\text{new}}=w-\\eta\\times\\text{slope}$."
  - concept: probability-basics
    text: "A probability is a number from 0 to 1 saying how likely something is, where 0 means impossible and 1 means certain. If something has probability $p$, the chance that it doesn't happen is $1-p$."
where_this_fits: |
  ### What is logistic regression?

  Logistic regression is a model that answers a yes-or-no question by giving the probability that the answer is yes. Like linear regression, it multiplies inputs by weights and adds them up, but then it squeezes that total into a number between 0 and 1.

  Why do we need it? Many useful questions have two answers: will this house sell within a month, is this email spam, is the robot's path blocked? Linear regression predicts an amount, and an amount such as $-3$ or $7$ can't be a probability. So we need a new last step for the model, a new loss that checks a probability against what happened, and a training step that uses them.
knowledge_points:
  - id: lr-classification
    title: "Predict a yes-or-no answer"
    explain: |
      ### Two answers written as 0 and 1

      Suppose an estate agent wants to know which houses will sell within a month. There are only two possible answers, so we write them as numbers: $y=1$ means it sold within a month and $y=0$ means it didn't. These numbers are names for the two answers, called **labels**, not amounts.

      Predicting one of two labels is called **binary classification**. "Binary" means there are two labels; the number of inputs can be anything.

      ### A score from one input

      Let's use one input, $x$, the number of viewings a house had in its first week. The picture shows six houses. The three with 1, 2 and 3 viewings didn't sell within a month, so they sit on the line for label 0. The three with 5, 6 and 7 viewings did, so they sit on the line for label 1. The blue line, which we'll build next, uses the same vertical axis for its score.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" aria-label="Six houses plotted by the number of viewings in the first week. The houses with 1, 2 and 3 viewings sit on the line for label 0, not sold, and the houses with 5, 6 and 7 viewings sit on the line for label 1, sold within a month. The blue line is the score z equals x minus 4. It gives the house with 6 viewings a score of 2, above 1, and the house with 2 viewings a score of minus 2, below 0">
