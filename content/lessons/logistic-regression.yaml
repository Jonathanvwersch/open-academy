      ```

      **Binary cross-entropy** is the loss that takes minus the natural log of the probability the model gave to the observed label. With $p$ the model's probability of label 1 and $y$ the observed label, it is

      $$L=-\left[y\ln p+(1-y)\ln(1-p)\right].$$

      Only one of the two terms is ever used. If $y=1$, the second term is multiplied by 0, so $L=-\ln p$. If $y=0$, it is $L=-\ln(1-p)$, using the chance of label 0.

      ### Three houses that sold

      Suppose the three new houses, with 2, 4 and 6 viewings, all sold. Each has $y=1$, so the loss is $-\ln p$:

      - 6 viewings, $p=0.88$: the loss is $0.13$.
      - 4 viewings, $p=0.5$: the loss is $0.69$.
      - 2 viewings, $p=0.12$: the loss is $2.13$, because the model was confident and wrong.

      Be careful: a correct decision doesn't mean zero loss. The house with 6 viewings was predicted correctly, but it still has a loss of $0.13$, because the model gave it $0.88$ rather than 1.

      ### Why not squared error?

      For a probability, the squared error $(p-y)^2$ can never be more than 1, as the grey dashed curve shows. A sold house given $p=0.01$ costs $0.98$, not much more than the $0.25$ for an unsure $p=0.5$. Cross-entropy charges $4.61$ and keeps climbing, so confident mistakes cost the most.
    worked: |
      Let's work out the loss for the new house with 2 viewings, which sold, so $y=1$. The sigmoid gave it $p=\sigma(-2)\approx0.119$.

      1. **Put the label into the loss.** With $y=1$, the term with $1-y$ is multiplied by 0.
         $$L=-\left[1\times\ln0.119+0\times\ln0.881\right]=-\ln0.119.$$

      2. **Take the natural log.** A small probability has a large negative log, and the minus sign makes it positive.
         $$L\approx-(-2.13)=2.13.$$

      The loss is $2.13$, much bigger than the $0.13$ for the house with 6 viewings, because the model gave so little probability to the sale.
