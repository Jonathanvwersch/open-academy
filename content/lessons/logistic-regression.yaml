concept: logistic-regression
version: 1
objective: |
  **Goal:** compute sigmoid probabilities and binary cross-entropy for house-sale predictions.
where_this_fits: |
  Linear regression gave us a weighted score for a house's price, and gradient descent showed how to adjust model parameters. Probability basics introduced events and conditional probabilities, so we can describe the chance that a house sells above asking given its features. A price score can be any real number, not a probability or a yes-or-no answer. This lesson maps that score to a probability and trains it with a binary loss.
knowledge_points:
  - id: lr-classification
    title: A yes-or-no target needs a classifier
    explain: |
      **What binary classification is.** Classification predicts a category from input features. Binary classification chooses between two labels, while regression predicts a numerical amount.

      **How it works.** In the house example, let $y=1$ mean a house sells above asking and $y=0$ mean it does not. A linear model gives a score $z=w\cdot x+b$. Unlike a price prediction, $z$ can be any real number: a score of $-2$ or $3$ is not a valid probability. The quantity we want is $P(y=1\mid x)$, the probability of the positive event given the house features. A classifier therefore needs to map its unrestricted score to a value from 0 to 1 before applying a decision threshold. The score ranks evidence; it is not yet a probability or a class.

      **Why this is useful.** A classifier can answer the house-sale question and report how likely the positive outcome is, rather than predicting a price.
    worked: |
      This example shows why a price prediction and a class prediction are different quantities.

      The linear-regression model predicts a house price of 310 thousand pounds. That is a numerical amount.

      For classification, $y=1$ means the house sells above asking, and $y=0$ means it does not.

      A current linear score of 3 is greater than 1, so it cannot be a probability.

      A score of $-2$ is below 0, so it cannot be a probability either.

      The classifier must turn either score into a value between 0 and 1; a later threshold can turn that probability into a class.
    problems:
      [
        lr-classification-basics,
        lr-score-numeric,
        lr-score-why,
        lr-score-read,
        lr-score-complete,
      ]
  - id: lr-sigmoid
    title: The sigmoid turns a score into a probability
    explain: |
      **What the sigmoid is.** The sigmoid function maps any real input to a number strictly between 0 and 1. The activation-functions lesson introduced its formula and derivative; here we use its output as the model's estimated probability of a positive label.

      **How it works.** If $z$ is the linear score, then $p=\sigma(z)=1/(1+e^{-z})$. The exponential uses base $e$. At $z=0$, the sigmoid returns 0.5. Positive scores give probabilities above 0.5, and negative scores give probabilities below 0.5. With a 0.5 decision threshold, predict $y=1$ when $p\geq0.5$; because the sigmoid is increasing, this is the same as $z\geq0$. The probability is the model's estimate of $P(y=1\mid x)$, not a guarantee about an individual sale.

      ```python
      import numpy as np

      scores = np.array([0.0, 0.5, -0.5])
      probabilities = 1 / (1 + np.exp(-scores))
      print(np.round(probabilities, 6).tolist())
      ```

      **Why this is useful.** The sigmoid turns a score with no fixed range into a probability that can be compared with the chosen decision threshold.
    worked: |
      This example shows how a house score of 0.5 becomes a sale probability.

      Apply the sigmoid:

      $$e^{-0.5}\approx0.606531.$$

      $$1+0.606531=1.606531.$$

      $$p=\frac{1}{1+e^{-0.5}}\approx\frac{1}{1.606531}=0.622459.$$

      Compare the probability with the threshold:

      $$0.622459>0.5.$$

      The classifier predicts that the house sells above asking, with an estimated probability of about 62.2%.
    problems:
      [
        lr-sigmoid-basics,
        lr-sigmoid-why,
        lr-sigmoid-fixed,
        lr-sigmoid-template,
        lr-sigmoid-read,
        lr-sigmoid-complete,
      ]
  - id: lr-binary-cross-entropy
    title: Binary cross-entropy scores probability errors
    explain: |
      **What binary cross-entropy is.** It is a loss that scores a predicted probability against a binary label. Let $y$ be 0 or 1 and let $p$ be the predicted probability of label 1. We use natural logarithms throughout: $\ln$ and NumPy's `np.log` both mean logarithm to base $e$.

      **How it works.** The loss is:

      $$L=-[y\ln p+(1-y)\ln(1-p)].$$

      If $y=1$, this reduces to $-\ln p$; if $y=0$, it reduces to $-\ln(1-p)$. Assigning a small probability to the true label produces a large loss. For example, when $y=1$ and $p=0.01$, the loss is about 4.605, whereas squared error is only $(0.01-1)^2=0.9801$. Mean squared error treats probabilities as ordinary numeric predictions and stays bounded by 1; binary cross-entropy keeps increasing as a confident prediction approaches the wrong label.

      ```python
      import numpy as np

      labels = np.array([1.0, 1.0])
      probabilities = np.array([0.8, 0.01])
      losses = -(
          labels * np.log(probabilities)
          + (1 - labels) * np.log(1 - probabilities)
      )
      print(np.round(losses, 6).tolist())
      ```

      **Why this is useful.** Cross-entropy gives a strong penalty when a house-sale classifier is confident but wrong about whether a house sells above asking.
    worked: |
      This example shows the binary cross-entropy calculation with natural logarithms.

      For a house that sells above asking, let $y=1$ and let its predicted probability be $p=0.8$:

      $$L=-[1\ln(0.8)+0\ln(0.2)].$$

      $$L=-\ln(0.8)\approx0.223144.$$

      If the same positive label receives probability $p=0.01$:

      $$L=-\ln(0.01)\approx4.605170.$$

      The squared error for that confident wrong prediction is:

      $$(0.01-1)^2=0.9801.$$

      Cross-entropy penalises the confident mistake much more heavily than squared error.
    problems:
      [
        lr-bce-basics,
        lr-bce-why,
        lr-bce-positive,
        lr-bce-negative,
        lr-bce-read,
        lr-bce-complete,
      ]
  - id: lr-gradient
    title: The score gradient is probability minus label
    explain: |
      **What the score gradient is.** It is the derivative of the loss with respect to the linear score $z$. It tells gradient descent how a small change in that score changes the loss.

      **How it works.** The sigmoid derivative taught in activation-functions is $\partial p/\partial z=p(1-p)$. Start with binary cross-entropy and differentiate with respect to $p$:

      $$\frac{\partial L}{\partial p}=-\frac{y}{p}+\frac{1-y}{1-p}.$$

      Apply the chain rule by multiplying by the sigmoid derivative:

      $$\frac{\partial L}{\partial z}=\left(-\frac{y}{p}+\frac{1-y}{1-p}\right)p(1-p).$$

      Cancel the denominators:

      $$\frac{\partial L}{\partial z}=-y(1-p)+(1-y)p.$$

      Expand and collect terms:

      $$\frac{\partial L}{\partial z}=-y+yp+p-yp=p-y.$$

      Since $z=w\cdot x+b$, the parameter gradients are $(p-y)x$ for the weights and $p-y$ for the bias. The second derivative is $p(1-p)>0$, so the loss is convex in the score and in the model's linear parameters.

      **Why this is useful.** The simple gradient lets gradient descent update every house-feature weight in the direction that reduces classification loss.
    worked: |
      This example shows one gradient-descent update for a house-sale classifier.

      Use one scaled feature $x=2$, weight $w=0.25$, bias $b=0$, target $y=1$ and learning rate $\eta=0.1$:

      $$z=2(0.25)+0=0.5.$$

      $$p=\sigma(0.5)\approx0.622459.$$

      $$L=-\ln(0.622459)\approx0.474077.$$

      The score and weight gradients are:

      $$\frac{\partial L}{\partial z}=p-y=0.622459-1=-0.377541.$$

      $$\frac{\partial L}{\partial w}=(p-y)x=(-0.377541)(2)=-0.755081.$$

      Apply one gradient-descent update:

      $$w'=0.25-0.1(-0.755081)=0.325508.$$

      $$b'=0-0.1(-0.377541)=0.037754.$$

      The new score is $z'=2(0.325508)+0.037754=0.688770$, so its probability is about 0.6657 and its loss about 0.407.

      The update raises the probability of the observed positive outcome and lowers its loss.
    problems:
      [
        lr-gradient-basics,
        lr-convex-why,
        lr-gradient-formula,
        lr-gradient-weight,
        lr-gradient-read,
        lr-gradient-complete,
      ]
final: lr-explain-logistic-regression
summary: |
  - A linear score can be any real number; sigmoid maps it to a probability for a binary house-sale outcome.
  - Binary cross-entropy uses natural logarithms and strongly penalises confident wrong probabilities.
  - Its score gradient is $p-y$, which gradient descent uses to update the model's weights and bias.

  **Next:** Compare how well the model fits training houses with how it predicts new ones.
