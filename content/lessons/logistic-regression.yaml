final: lr-explain-logistic-regression
summary: |
  - Binary classification predicts one of two labels, 0 or 1; logistic regression starts from a score $z=wx+b$, which can be any number.
  - The sigmoid $\sigma(z)=1/(1+e^{-z})$ turns the score into the probability $p$ of label 1, and a threshold such as $p\ge0.5$ turns that into a decision.
  - Binary cross-entropy, $L=-[y\ln p+(1-y)\ln(1-p)]$, is minus the log of the probability given to the observed label, so a correct decision can still have a loss.
  - The slope of the loss is $p-y$ for the score and the bias, and $(p-y)x$ for each weight. Gradient descent subtracts each slope times the learning rate.

  **Next:** Later lessons join many weighted scores like this one, each passed through a smooth function such as the sigmoid, to build neural networks.
