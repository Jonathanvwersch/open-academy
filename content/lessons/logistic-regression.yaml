      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="80" y="46" fill="#737373">chance of label 1, p</text>
      </g>
      </svg>
      ```

      ### From a probability to a decision

      To decide, we compare the probability with a **threshold**, usually $0.5$: predict label 1 if $p\ge0.5$, and label 0 otherwise. Because $\sigma(0)=0.5$, this is the same as predicting 1 whenever the score is at least 0.

      Be careful not to read a decision as certainty. When the model predicts that the house with 6 viewings will sell, it still gives a $1-0.88=0.12$ chance that it won't. The probability keeps that doubt.
    worked: |
      Let's turn the score of the house with 6 viewings, $z=2$, into a probability and then a decision.

      1. **Work out $e^{-z}$.** The sigmoid needs $e$ raised to minus the score.
         $$e^{-2}\approx0.135.$$

      2. **Put it into the sigmoid.** Dividing 1 by $1+e^{-z}$ gives a number between 0 and 1.
         $$p=\frac{1}{1+0.135}\approx0.88.$$

      3. **Compare with the threshold.** The probability is at least $0.5$, so the model predicts label 1.
         $$0.88\ge0.5.$$

      The model predicts that this house will sell within a month.
    problems:
      - lr-sigmoid-basics
      - lr-sigmoid-reason
      - lr-sigmoid-faded
      - lr-sigmoid-template
      - lr-sigmoid-confusion
      - lr-sigmoid-transfer
  - id: lr-binary-cross-entropy
    title: "Measure how wrong a probability is"
    explain: |
      ### What a good loss should do

      To train the model we need a loss. A prediction is now a probability, so a good loss should look at the probability the model gave to what actually happened. If that probability is near 1, the loss should be near 0. If it is near 0, the model was confidently wrong, and the loss should be large.

      ### Minus the log of the probability of what happened

      The natural logarithm, $\ln$, does this when we put a minus sign in front. We met it in the derivatives lesson: $\ln1=0$, and $\ln q$ falls without limit as $q$ shrinks towards 0. The red curve shows $-\ln q$, where $q$ is the probability the model gave to the observed label.

