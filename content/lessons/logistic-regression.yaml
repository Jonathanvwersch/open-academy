      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="560" y="350.5" fill="#737373" text-anchor="middle">8</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="370.5" fill="#737373" text-anchor="middle">viewings in the first week, x</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="90" y="127">label 1: sold within a month</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="560" y="200" text-anchor="end">label 0: not sold</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="428" y="84" fill="#3b82f6" text-anchor="end">6 viewings: score 2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="212" y="275" fill="#3b82f6">2 viewings: score −2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="510" y="50" fill="#3b82f6">score z = x − 4</text>
      </g>
      </svg>
      ```

      We can start just as linear regression does. The **score** is the weighted input plus the bias,

      $$z=wx+b.$$

      Here $x$ is the input, $w$ is its weight and $b$ is the bias. With several inputs we add one weighted term for each, $z=w_1x_1+w_2x_2+\dots+b$, where $x_j$ is the $j$th input and $w_j$ is its weight. For now we'll pick $w=1$ and $b=-4$ by hand, so the score is $z=x-4$, the blue line. The last step shows how training adjusts them.

      ### Why a score is not yet an answer

      The blue line rises with the number of viewings, which is the right pattern. But a house with 6 viewings scores $2$ and a house with 2 viewings scores $-2$. Neither is a label, and neither can be a probability, because a probability must lie between 0 and 1. So the next step turns each score into a probability.
    worked: |
      Let's work out the score of a house with 6 viewings in its first week, using $w=1$ and $b=-4$.

      1. **Multiply the input by its weight.** Each viewing adds $w$ to the score.
         $$wx=1\times6=6.$$

      2. **Add the bias.** The bias is added once, whatever the input is.
         $$z=6+(-4)=2.$$

      The score is $2$. It's bigger than 1, so it can't be a probability yet.
    problems:
      - lr-classification-basics
      - lr-classification-reason
      - lr-classification-faded
      - lr-classification-template
      - lr-classification-confusion
      - lr-classification-transfer
  - id: lr-sigmoid
    title: "Turn a score into a probability"
    explain: |
      ### Squeezing a score between 0 and 1

      Our scores can be any number, but a probability must lie between 0 and 1. So we need a function that turns any score into a number in that range, with bigger scores giving bigger numbers.

      The **sigmoid** is a smooth S-shaped function that does this. It takes any number $z$ and gives a number strictly between 0 and 1:

      $$\sigma(z)=\frac{1}{1+e^{-z}}.$$

      The Greek letter $\sigma$ (sigma) is the sigmoid's name, and $e\approx2.718$ is the number from the derivatives lesson. When $z$ is large, $e^{-z}$ is close to 0, so $\sigma(z)$ is close to 1. When $z$ is very negative, $e^{-z}$ is huge, so $\sigma(z)$ is close to 0. At $z=0$, $e^{0}=1$, so $\sigma(0)=1/2$.

      **Logistic regression** is the model that works out the score and then passes it through the sigmoid. Its output, $p=\sigma(wx+b)$, is the model's probability that the label is 1. Training with the loss in the next step is what makes these probabilities good estimates.

      ### Three houses on the curve

      The green curve is the sigmoid, with the score along the bottom and the probability up the side. Here are three new houses marked on it, with the score $z=x-4$:

      - 2 viewings: score $-2$, probability $0.12$, so a sale is unlikely.
      - 4 viewings: score $0$, probability $0.5$, so the model can't tell.
      - 6 viewings: score $2$, probability $0.88$, so a sale is likely.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" aria-label="The green sigmoid curve of the chance of label 1 against the score z, from minus 4 to 4. It rises smoothly from near 0 to near 1 and crosses the dashed threshold line at 0.5 when the score is 0. The houses with 2, 4 and 6 viewings, with scores minus 2, 0 and 2, get chances of 0.12, 0.5 and 0.88">
