final: ovf-explain-diagnosis
summary: |
  - Underfitting misses useful patterns even in training data and can indicate high bias, while overfitting follows training quirks and often goes with high variance across different sets of training houses.
  - High training error suggests underfitting, low training error with much higher validation error suggests overfitting, and low, close errors suggest a good fit.
  - The error gap is validation error minus training error, but a small gap alone does not make either error useful.
  - Keep the model or saved epoch with the lowest validation error, and use the test set once after choosing.

  **Next:** We'll explore ways to discourage an overly flexible model from fitting the training examples too closely.
