      ### Save the useful model before predictions get worse

      We compare saved copies using validation error. Only after choosing do we score predictions on the test houses we set aside at the start.

      ### Try a change that addresses the failure

      More training data can help overfitting because more houses make individual quirks matter less. A simpler model or stopping earlier can also help. If a model's errors are both high but still falling each pass, extra training may help instead. Keep checking whether validation predictions improve.

      Be careful not to react to every tiny rise in validation error. Checking only a few validation houses can make the learning curve wobble, so look for a clear trend before deciding what to change.
    worked: |
      Let's use the wiggly curve's saved scores to decide which copy to keep.

      | Epoch | Training | Validation |
      | ---: | ---: | ---: |
      | 0 | 50 | 52 |
      | 5 | 7 | 16 |
      | 10 | 1.2 | 31 |

      1. **Find copies that meet the target.** Of these saved scores, only epoch 5 has validation error below 30.

      2. **Check that no other epoch did better.** The green learning curve reaches its minimum at epoch 5. That makes this copy the best validation choice across the whole run, not just the three rows above.

      3. **Keep that saved copy.** The last copy's lower training error is not a reason to prefer it. We need the copy that predicts validation houses best.

      We stop at epoch 5 because continuing made validation predictions worse. The test houses we set aside at the start have not been used to make that decision.
