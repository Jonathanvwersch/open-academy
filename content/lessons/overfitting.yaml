  - id: ovf-error-gap
    title: "Compare training and validation errors"
    explain: |
      ### Compare mistakes on training and validation houses

      Suppose the people using this tool can tolerate an average price error below $30,000 when planning their budgets. That is the target they have given us, not a rule for every task. Throughout this step, errors are in thousands of dollars, so the target is below 30.

      - High training error suggests **underfitting**. A model whose shape cannot follow the pattern makes the same kind of mistake again and again. We call this **high bias**, as when the straight line cannot follow bending prices.
      - Low training error with much higher validation error suggests **overfitting**. This often goes with **high variance**, meaning the model would change a lot if we had picked a different six training houses from all the sales we know about.
      - If both errors meet the users' target and are close together, the model seems to fit well.

      Picking six houses from a larger collection could give us five of the same houses and one different house. We imitate that by swapping one sale for another at the same size but a higher price. The old sale is a hollow blue circle and the replacement is a blue square. Refitting the wiggly curve changes predictions most near 80–120 m², but also near 170 m². Following individual sales so closely makes predictions between training houses unreliable. Validation houses can fall in those spaces, so exact training predictions can go with poor validation predictions.

