      ### Why an exact training fit can fail

      Location and condition also affect price, but these models cannot see them. That is why prices scatter around the size-price trend instead of all landing on one smooth curve.

      **Underfitting** means missing useful patterns even in training data. The straight line's mistakes follow a repeated pattern because it cannot bend. We call a repeated pattern of errors a **systematic mistake**. **Overfitting** means following training details that do not carry over to new examples. The wiggly curve follows the scatter as though every training price must be reproduced exactly.

      ### Measure how far predicted prices are from real prices

      **Mean absolute error** is the average distance between predictions and true prices. A prediction 20 too high and one 20 too low are equally bad. We ignore direction so those mistakes do not cancel each other out. Throughout this step, prices and errors are in thousands of dollars, so an error of 28 means $28,000.
    worked: |
      Let's calculate each model's errors on the plotted houses. The computer reads predictions from each fitted model's formula more precisely than we can read the picture, which is why they have decimals. The tables show the predicted price and the distance it misses by, rounded to two decimal places.

      **87 m² house, real price 169**

      | Model | Price | Miss |
      | --- | ---: | ---: |
      | The straight line | 239.27 | 70.27 |
      | The smooth curve | 205.15 | 36.15 |
      | The wiggly curve | 289.60 | 120.60 |

      **173 m² house, real price 340.10**

      | Model | Price | Miss |
      | --- | ---: | ---: |
      | The straight line | 394.07 | 53.97 |
      | The smooth curve | 359.95 | 19.85 |
      | The wiggly curve | 275.50 | 64.60 |

      1. **Average the smooth curve's distances.** Add the two distances and divide by the number of validation houses. This gives its validation error.
         $$\frac{36.15+19.85}{2}=28$$

      2. **Average the straight line's distances.** Using the displayed distances gives its validation error to two decimal places.
         $$\frac{70.27+53.97}{2}=62.12$$

      3. **Average the wiggly curve's distances.** One prediction is too high and the other too low. Adding distances makes both mistakes count.
         $$\frac{120.60+64.60}{2}=92.60$$

      Training error averages the distances from predicted prices to real prices for the six training houses. The fractions below show the exact distances used, not rounded decimals. For example, 230/3 means 230 divided by 3. Rows follow the training houses from smallest to largest. The wiggly curve's six distances are all 0.

      | The straight line | The smooth curve |
      | ---: | ---: |
      | 230/3 | 10 |
      | 127/3 | 29 |
      | 49/3 | 37 |
      | 271/3 | 37 |
      | 47/3 | 29 |
      | 170/3 | 10 |

      The final scores below use unrounded distances for both sets, then round the averages to whole numbers. Train and Valid. mean training and validation error.

      | Model | Train | Valid. |
      | --- | ---: | ---: |
      | The straight line | 50 | 62 |
      | The smooth curve | 25 | 28 |
      | The wiggly curve | 0 | 93 |

      4. **Compare the validation predictions.** Be careful about trusting a perfect training score. The wiggly curve has the worst validation error despite getting every training price right. We choose the smooth curve because its validation error is lowest.
