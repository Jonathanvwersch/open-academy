  - id: ovf-learning-curves
    title: "Choose when to stop training"
    explain: |
      ### Watch predictions change during training

      The finished fits showed that following training prices too closely can hurt validation predictions. Now we'll watch a model get to that point so we can stop before it happens. The upper plot illustrates training the wiggly curve on more houses from our sales collection, rather than continuing the six-house fit. Training adjusts its weights a little during each pass through the training houses. These adjustable numbers control its predictions. Early adjustments can produce a smooth shape. Later adjustments can pull different parts towards individual training prices. One full pass is an **epoch**, and we can save a copy after each epoch.

      A **learning curve** shows how error changes during training. In both plots, the horizontal axis counts completed epochs and zero means before training. Throughout this step, errors are in thousands of dollars. Blue is training error and green is validation error.

      In the upper plot, both errors fall at first. After epoch 5, training error keeps falling but validation error rises. The wiggly curve is following training houses more closely while predicting validation houses less well, which suggests overfitting.

      ### Compare with the straight line

      The lower plot trains the straight line from step 1 in repeated passes too. Its errors settle at the same rounded scores of 50 and 62. Both stay above the dashed target of 30, suggesting underfitting. A more flexible model may help when extra passes no longer improve the training fit.

