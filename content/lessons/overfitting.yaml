      ### Measure how much worse validation predictions are

      The **error gap** measures how much worse validation predictions are than training predictions. Calculate both errors the same way so we can compare them fairly.

      $$\text{gap}=\text{validation error}-\text{training error}$$

      Be careful not to judge a fit by the gap alone. Two high errors can be close together even though neither meets the users' target.
    worked: |
      Let's compare two further trials, called the simpler model and the more flexible model, with the smooth curve. We want to know whether a small gap is enough to make a model useful.

      The simpler model has training error 60 and validation error 62. The more flexible model has training error 6 and validation error 38.

      1. **Check the simpler model.** Its training predictions are already poor, and its validation predictions are only a little worse.
         $$62-60=2$$
         Both errors exceed the target despite the small gap, so the simpler model likely underfits. Its lack of flexibility suggests high bias.

      2. **Check the more flexible model.** Its training error is low, but its validation error is much higher.
         $$38-6=32$$
         The more flexible model likely overfits. If its fitted shape also changes a lot when we swap training houses, that would show high variance.

      3. **Compare with the smooth curve.** Its rounded gap is slightly larger than the simpler model's gap, but both its errors meet the target.
         $$28-25=3$$

      The smooth curve has the lowest validation error of these choices. The smaller gap did not make the simpler model better.

      ### Limitations of judging from only a few houses

      With only two validation houses, a model might score well by luck. Also, scatter in prices can keep errors high even when a model follows the trend. These diagnoses are more dependable when the same pattern appears across many validation houses.
