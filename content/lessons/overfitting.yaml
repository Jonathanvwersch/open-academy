concept: overfitting
version: 1
objective: "**Goal:** diagnose overfitting, underfitting and a good fit from training and validation errors and learning curves."
recap:
  - concept: train-test-split
    text: "Models are judged on data they did not train on. The training set fits weights, the validation set compares choices, and the test set is used once at the end."
where_this_fits: |
  ### What are overfitting and underfitting?

  Overfitting means copying the training examples' quirks instead of learning a pattern that works on new examples. Underfitting means missing useful patterns even in the training examples. Telling them apart helps us decide whether to change the model's shape or how long we train it.

  We'll use a model that predicts a house's price from its size. From all the sales we know about, we put six houses in training and two in validation. We also set aside test houses for one final score. Comparing training and validation errors helps us see whether the model misses the pattern or follows individual houses too closely.
knowledge_points:
  - id: ovf-flexibility
    title: "Straight lines, smooth curves and wiggly curves"
    explain: |
      ### Three shapes for predicting prices

      We fit three models to the six training houses only. The two validation houses stay separate so we can check predictions that did not help train any model.

      A model's **flexibility** is how far it can bend to follow the data. The straight line can only tilt, the smooth curve can bend once, and the wiggly curve can bend many times.

      In the picture, size increases to the right and price upwards. Blue circles are training houses and green diamonds are validation houses. The straight line is grey and misses the bend. The smooth curve is orange and follows it, while the wiggly curve is red and passes through every blue circle. At both diamonds, the straight line and the wiggly curve predict further from the real price than the smooth curve does.

