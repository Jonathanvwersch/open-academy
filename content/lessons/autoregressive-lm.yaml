      - alm-next-robot
  - id: alm-teacher-forcing
    title: "Turn one sentence into many training examples"
    explain: |
      ### Every word after the first is a target

      Now that the model gives a next-token distribution, how do we train it? We need examples of a prefix together with the token that really came next, and any sentence is full of them. In "the cat sat on the mat", "the" is followed by cat, "the cat" by sat, and so on up to "the cat sat on the", which is followed by mat. Each of the last five words is the answer for the words before it, so a sentence of $T$ tokens gives $T-1$ training examples.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" aria-label="The sentence the cat sat on the mat split into five training examples. The top row holds the inputs, the, cat, sat, on, the, at positions 1 to 5. The bottom row holds the targets, the same sentence shifted left by one: cat, sat, on, the, mat. An arrow joins each position to its target. Position 3 is orange: it sees the cat sat and must predict on">
      <defs><marker id="alm2-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="alm2-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="20" y="81">input</text><text x="20" y="191">target</text>
      <text x="150" y="36" text-anchor="middle" fill="#737373">t = 1</text>
      <rect x="110" y="56" width="80" height="38" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="150" y="80" text-anchor="middle">the</text>
      <path d="M150 100 V158" stroke="#737373" stroke-width="2" marker-end="url(#alm2-muted)"/>
      <rect x="110" y="166" width="80" height="38" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/><text x="150" y="190" text-anchor="middle">cat</text>
      <text x="250" y="36" text-anchor="middle" fill="#737373">t = 2</text>
      <rect x="210" y="56" width="80" height="38" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="250" y="80" text-anchor="middle">cat</text>
      <path d="M250 100 V158" stroke="#737373" stroke-width="2" marker-end="url(#alm2-muted)"/>
      <rect x="210" y="166" width="80" height="38" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/><text x="250" y="190" text-anchor="middle">sat</text>
      <text x="350" y="36" text-anchor="middle" fill="#737373">t = 3</text>
      <rect x="310" y="56" width="80" height="38" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/><text x="350" y="80" text-anchor="middle">sat</text>
      <path d="M350 100 V158" stroke="#f59e0b" stroke-width="2" marker-end="url(#alm2-amber)"/>
      <rect x="310" y="166" width="80" height="38" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/><text x="350" y="190" text-anchor="middle">on</text>
      <text x="450" y="36" text-anchor="middle" fill="#737373">t = 4</text>
      <rect x="410" y="56" width="80" height="38" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="450" y="80" text-anchor="middle">on</text>
      <path d="M450 100 V158" stroke="#737373" stroke-width="2" marker-end="url(#alm2-muted)"/>
      <rect x="410" y="166" width="80" height="38" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/><text x="450" y="190" text-anchor="middle">the</text>
      <text x="550" y="36" text-anchor="middle" fill="#737373">t = 5</text>
      <rect x="510" y="56" width="80" height="38" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="550" y="80" text-anchor="middle">the</text>
      <path d="M550 100 V158" stroke="#737373" stroke-width="2" marker-end="url(#alm2-muted)"/>
      <rect x="510" y="166" width="80" height="38" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/><text x="550" y="190" text-anchor="middle">mat</text>
      <text x="320" y="246" text-anchor="middle" fill="#f59e0b">position 3 sees “the cat sat” and must predict “on”</text>
      </g>
      </svg>
      ```

      The picture shows how we set this up. The input is the sentence without its last token, $x_1,\dots,x_{T-1}$, along the top. The targets are the same sentence shifted left by one, $x_2,\dots,x_T$, along the bottom. The output at position $t$ is scored against $x_{t+1}$. Each arrow shows only which target a position is scored against. The vector at that position has also seen every word to its left.

      ### All the predictions in one run

      Because of the causal mask, position $t$ sees only $x_1,\dots,x_t$, so one run of the transformer over the input makes all $T-1$ predictions at once, each from its own prefix. Without the mask, position $t$ could look at $x_{t+1}$, the very token it's meant to predict, and it would learn to copy it. We'd then need one run per prefix.

      Each prediction is scored with cross-entropy, minus the log of the probability given to the true next token. The sentence's loss is the average over the positions:

      $$L=-\frac{1}{T-1}\sum_{t=1}^{T-1}\ln p(x_{t+1}\mid x_1,\dots,x_t)$$

      The $\sum$ adds up one term for each position $t$ from $1$ to $T-1$.

      ### Training on the real earlier words

      Every input prefix is the real text. We could instead let the model predict from its own guesses. Feeding it the true earlier tokens, even at positions where it would have guessed wrong, is called **teacher forcing**. Because every input is known before the run starts, the causal mask can then train all positions in the same run.

      Be careful not to score position $t$ against $x_t$. The model already has $x_t$ as input, so its target is the token after it, $x_{t+1}$.
    worked: |
      Let's turn the four tokens "the cat sat on" into training examples and work out their loss. Suppose the model gives probability $0.5$ to cat after "the", $0.4046$ to sat after "the cat" and $0.5$ to on after "the cat sat". We'll keep the decimals shown along the way and round to 2 only at the end.

      1. **Make the pairs.** With $T=4$ tokens there are $T-1=3$ examples, each a prefix and the word after it.
         $$\text{the}\to\text{cat},\qquad\text{the cat}\to\text{sat},\qquad\text{the cat sat}\to\text{on}$$

      2. **Score each prediction.** Cross-entropy is minus the natural log of the probability given to the true next word.
         $$-\ln0.5\approx0.693,\qquad-\ln0.4046\approx0.905,\qquad-\ln0.5\approx0.693$$

      3. **Average them.** The sentence's loss is the mean over its three positions.
         $$L=\frac{0.693+0.905+0.693}{3}\approx0.76$$

      Adding the three losses gives $2.291$. Because adding logs is the same as taking the log of a product, $\ln a+\ln b=\ln(ab)$, this is $-\ln(0.5\times0.4046\times0.5)=-\ln0.1012$, minus the log of the chance of "cat sat on" coming after "the". A smaller $-\ln$ means a bigger probability, so lowering this loss makes the model give the real text a higher chance.

      Here is the same split in Python, for the whole six-word sentence, so it gives five examples. The tokens are stored as a Python list of words. `tokens[:-1]` is the list without its last item and `tokens[1:]` is the list without its first. Python counts positions from $0$, so the code's `t` is one less than the maths' $t$. The loop runs `t` through $0,1,2,3,4$, and `inputs[:t + 1]` keeps the first $t+1$ words, the prefix for that target. `" ".join(...)` puts spaces between the words.

      ```python
      tokens = ["the", "cat", "sat", "on", "the", "mat"]
      inputs = tokens[:-1]   # x_1 ... x_(T-1)
      targets = tokens[1:]   # x_2 ... x_T
      for t in range(len(targets)):
          print(" ".join(inputs[:t + 1]), "->", targets[t])
      # prints five lines:
      # the -> cat
      # the cat -> sat
      # the cat sat -> on
      # the cat sat on -> the
      # the cat sat on the -> mat
      ```
