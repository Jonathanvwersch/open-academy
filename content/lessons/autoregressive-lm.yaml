      - alm-tf-basics
      - alm-tf-self-explain
      - alm-tf-count-template
      - alm-tf-target
      - alm-tf-loss-template
      - alm-tf-mask
      - alm-tf-code
      - alm-tf-total-loss
      - alm-tf-batch
  - id: alm-sampling
    title: "Write new text one word at a time"
    explain: |
      ### Writing one token at a time

      Once trained, the same model can write. We give it a prompt, such as "the cat sat", run it, and read the next-token distribution at the last position. We choose a token from it, add it to the end and run the model again on the longer text. We repeat until the text reaches a length limit, or until the model chooses a special end-of-text token. This extra vocabulary entry ends every training text, so the model learns when to stop. This loop is called **autoregressive generation**.

      Suppose that after "the cat sat" the model gives these probabilities: $0.2$ for the, $0.1$ for cat, $0.1$ for sat, $0.5$ for on and $0.1$ for mat. Which word should we choose?

      ### Taking the top word or drawing at random

      **Greedy decoding** always takes the most probable token, which here is on. It's simple, but the same prompt always gives the same text, so we can't ask for several different answers. It can also get stuck repeating a phrase, if writing it makes the same phrase the most likely continuation again.

      **Sampling** draws the next token at random, giving each token a chance equal to its probability. Picture the probabilities laid end to end along a line from 0 to 1. We pick a random number $u$ between 0 and 1 and take the token whose stretch it lands in.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" aria-label="A line from 0 to 1 split into stretches whose lengths are the next-word probabilities after the cat sat: the from 0 to 0.2, cat from 0.2 to 0.3, sat from 0.3 to 0.4, on from 0.4 to 0.9 and mat from 0.9 to 1. An orange marker at u equals 0.35 lands in the stretch for sat, and another at u equals 0.72 lands in the stretch for on">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="40" y="80" width="112" height="44" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="96" y="107" text-anchor="middle">the</text>
      <text x="96" y="70" text-anchor="middle" fill="#3b82f6">0.2</text>
      <rect x="152" y="80" width="56" height="44" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="180" y="107" text-anchor="middle">cat</text>
      <text x="180" y="70" text-anchor="middle" fill="#3b82f6">0.1</text>
      <rect x="208" y="80" width="56" height="44" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="236" y="107" text-anchor="middle">sat</text>
      <text x="236" y="70" text-anchor="middle" fill="#3b82f6">0.1</text>
      <rect x="264" y="80" width="280" height="44" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="404" y="107" text-anchor="middle">on</text>
      <text x="404" y="70" text-anchor="middle" fill="#3b82f6">0.5</text>
      <rect x="544" y="80" width="56" height="44" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="572" y="107" text-anchor="middle">mat</text>
      <text x="572" y="70" text-anchor="middle" fill="#3b82f6">0.1</text>
      <path d="M40 124 V132" stroke="#737373"/><text x="40" y="150" text-anchor="middle" fill="#737373">0</text>
      <path d="M152 124 V132" stroke="#737373"/><text x="152" y="150" text-anchor="middle" fill="#737373">0.2</text>
      <path d="M208 124 V132" stroke="#737373"/><text x="208" y="150" text-anchor="middle" fill="#737373">0.3</text>
      <path d="M264 124 V132" stroke="#737373"/><text x="264" y="150" text-anchor="middle" fill="#737373">0.4</text>
      <path d="M544 124 V132" stroke="#737373"/><text x="544" y="150" text-anchor="middle" fill="#737373">0.9</text>
      <path d="M600 124 V132" stroke="#737373"/><text x="600" y="150" text-anchor="middle" fill="#737373">1</text>
      <path d="M236 160 V128" stroke="#f59e0b" stroke-width="3"/><circle cx="236" cy="164" r="4" fill="#f59e0b"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="236" y="190" text-anchor="middle" fill="#f59e0b">u = 0.35</text>
      <path d="M443.2 160 V128" stroke="#f59e0b" stroke-width="3"/><circle cx="443.2" cy="164" r="4" fill="#f59e0b"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="443.2" y="190" text-anchor="middle" fill="#f59e0b">u = 0.72</text>
      <text x="40" y="30">next word after “the cat sat”, laid end to end from 0 to 1</text>
      </g>
      </svg>
      ```

      With $u=0.72$ we land in on's stretch, which runs from $0.4$ to $0.9$. With $u=0.35$ we land in sat's, from $0.3$ to $0.4$. Over many draws, on is picked half the time and sat a tenth of the time.

      ### Where generation goes wrong

      When the model writes, everything after the prompt is made of its own choices. Sometimes sampling picks a word that doesn't fit. That word stays in the text, and every later prediction is made from a prefix that contains it. With teacher forcing, training only showed the model real text, so it may predict badly after an odd word, and one bad word can lead to more.

      Generation is also slow, because writing needs a new run for each token, using the token the last run chose, while training scored every position in one run.
    worked: |
      Let's write two more words after "the cat sat" by sampling, with the random numbers $u=0.72$ and then $u=0.30$.

      1. **Add up the probabilities in order.** Adding them one after another, in the order the, cat, sat, on, mat, gives where each word's stretch ends.
         $$0.2,\quad0.3,\quad0.4,\quad0.9,\quad1.0$$

      2. **Find where $u$ lands.** We take the first word whose stretch ends above $u$. The stretch for on runs from $0.4$ to $0.9$.
         $$0.4\le0.72<0.9\quad\Rightarrow\quad\text{on}$$

      3. **Add it and predict again.** The text is now "the cat sat on". Suppose the model now gives $0.6$ to the and $0.1$ to each other word, so the stretches end at these points.
         $$0.6,\quad0.7,\quad0.8,\quad0.9,\quad1.0$$

      4. **Draw again.** The first stretch, for the, runs from $0$ to $0.6$.
         $$0\le0.30<0.6\quad\Rightarrow\quad\text{the}$$

      The text is now "the cat sat on the". Sampling picks this pair of words with chance $0.5\times0.6=0.3$, so other tries would often write something else.

      Here are both draws in Python. `probs2` holds the new probabilities after "the cat sat on". `def` defines a function called `sample`, and `zip` pairs each word with its probability. The function walks along the words, adding each probability to `total` with `+=`, and returns the first word whose stretch ends above `u`. The function's last line, `return words[-1]`, returns the last word in the list, since `-1` counts from the end. It's a safety net, because sums of decimals on a computer can come out a hair below 1. In real use, `u` comes from `random.random()` in Python's `random` module, which gives a random number from 0 up to 1.

      ```python
      words = ["the", "cat", "sat", "on", "mat"]
      probs = [0.2, 0.1, 0.1, 0.5, 0.1]

      def sample(words, probs, u):
          total = 0.0
          for word, p in zip(words, probs):
              total += p
              if u < total:
                  return word
          return words[-1]

      probs2 = [0.6, 0.1, 0.1, 0.1, 0.1]
      print(sample(words, probs, 0.72))    # prints: on
      print(sample(words, probs2, 0.30))   # prints: the
      ```
