concept: autoregressive-lm
version: 1
objective: |
  **Goal:** explain how a language model predicts the next token, how one sentence becomes many training examples with teacher forcing, and how the model writes new text by choosing one token at a time.
recap:
  - concept: classification-softmax
    text: "Softmax turns one score per class into probabilities that are positive and add up to 1, $p_k=e^{z_k}/(e^{z_1}+\\dots+e^{z_K})$. The multiclass cross-entropy loss is $L=-\\ln p_{\\text{true}}$, minus the log of the true class's probability."
where_this_fits: |
  ### What is an autoregressive language model?

  An autoregressive language model writes text one token at a time. It gives a probability to every token it knows for what comes next, picks one, adds it to the text and goes again.

  Why is it useful? Any ordinary text can train it, with no labels written by people, because each word after the first is the right answer for the words before it. Once trained, the same model can write new text, for example by finishing a sentence we start.

  A transformer turns each token into a vector, and a causal mask makes the vector at each position depend only on the tokens up to it. Softmax turns scores made from each vector into probabilities.
knowledge_points:
  - id: alm-next-token
    title: "Predict the next word"
    explain: |
      ### One prediction at each position

      Let's use the sentence "the cat sat on the mat". To keep the numbers small, we'll treat each word as one token, so the vocabulary is just the five words the, cat, sat, on and mat (the appears twice in the sentence), and its size is $N=5$. So here "word" and "token" mean the same thing. Real models use tens of thousands to a few hundred thousand smaller tokens, often parts of words.

      A transformer turns each token into a vector, and because of the causal mask, the vector at position $t$ has seen only the tokens $x_1,\dots,x_t$, where $x_t$ is the token at position $t$. To make a prediction, a final layer on top of the transformer multiplies that vector by a weight matrix to get one score for each of the $N$ tokens. They are the softmax's classes, so its $K$ is $N$ here. Softmax then turns the scores into probabilities. Suppose that after "the cat" the final layer gives a score of $1$ for sat and $0$ for each of the other four words. The blue bars show the probabilities this gives.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="The prefix the cat goes into the model, which gives a probability for each of the five words that could come next. The blue bars are 0.15 for the, 0.15 for cat, 0.40 for sat, 0.15 for on and 0.15 for mat, which add up to 1">
      <defs><marker id="alm1-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="20" y="130" width="56" height="36" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="48" y="153" text-anchor="middle">the</text>
      <rect x="84" y="130" width="56" height="36" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="112" y="153" text-anchor="middle">cat</text>
      <path d="M146 148 H178" stroke="#737373" stroke-width="2" marker-end="url(#alm1-muted)"/>
      <rect x="182" y="124" width="96" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="230" y="153" text-anchor="middle">model</text>
      <path d="M284 148 H316" stroke="#737373" stroke-width="2" marker-end="url(#alm1-muted)"/>
      <path d="M324 250 H620" stroke="#737373"/>
      <rect x="330" y="190.46" width="44" height="59.54" fill="#3b82f6"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="352" y="182.46" text-anchor="middle">0.15</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="352" y="272" fill="#737373" text-anchor="middle">the</text>
      <rect x="390" y="190.46" width="44" height="59.54" fill="#3b82f6"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="412" y="182.46" text-anchor="middle">0.15</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="412" y="272" fill="#737373" text-anchor="middle">cat</text>
      <rect x="450" y="88.16" width="44" height="161.84" fill="#3b82f6"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="472" y="80.16" text-anchor="middle">0.40</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="472" y="272" fill="#737373" text-anchor="middle">sat</text>
      <rect x="510" y="190.46" width="44" height="59.54" fill="#3b82f6"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="532" y="182.46" text-anchor="middle">0.15</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="532" y="272" fill="#737373" text-anchor="middle">on</text>
      <rect x="570" y="190.46" width="44" height="59.54" fill="#3b82f6"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="592" y="182.46" text-anchor="middle">0.15</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="592" y="272" fill="#737373" text-anchor="middle">mat</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="324" y="40">next word after “the cat”</text>
      </g>
      </svg>
      ```

      ### The next-token distribution

      The result is a **next-token distribution**: a probability for every token in the vocabulary, saying how likely it is to come next after the tokens so far. We write it as

      $$p(x_{t+1}\mid x_1,\dots,x_t)$$

      and read it as "the probability that the next token $x_{t+1}$ is a particular word, when we know the first $t$ tokens". Left of the bar, $x_{t+1}$ stands for whichever word comes next, so asking this for each of the five words gives the five bars. This distribution at every position is what an **autoregressive language model** computes.

      ### The chance of several words in a row

      Think of counting real sentences. If half of all sentences that start with "the" go on with cat, and $40\%$ of those then go on with sat, then $0.4\times0.5=0.2$ of them go on with "cat sat". The model's probabilities combine in the same way, so we multiply the next-token probabilities one after another:

      $$p(\text{cat sat}\mid\text{the})=p(\text{cat}\mid\text{the})\times p(\text{sat}\mid\text{the cat})$$

      Be careful not to read $p(\text{sat}\mid\text{the cat})$ as the chance that sat appears somewhere in the sentence. It's the chance that sat comes next, straight after "the cat".
    worked: |
      Let's work out the next-token probabilities after "the cat" from the scores $1$ for sat and $0$ for the other four words, and then the chance of "cat sat" after "the". We'll keep the decimals shown along the way and round to 2 only at the end.

      1. **Raise $e$ to each score.** Softmax first makes every score positive, so sat gets $e^1$ and each of the other four words gets $e^0$.
         $$e^1\approx2.718,\qquad e^0=1$$

      2. **Add them up.** The total is what the five words will share.
         $$2.718+4\times1=6.718$$

      3. **Divide each by the total.** This makes the five probabilities add up to 1. Each of the other four words gets $1/6.718\approx0.1489$, and sat gets
         $$p(\text{sat}\mid\text{the cat})=\frac{2.718}{6.718}\approx0.4046$$

      4. **Multiply along the sentence.** Suppose the model also gives $p(\text{cat}\mid\text{the})=0.5$. The chance of cat and then sat is the first probability times the second.
         $$p(\text{cat sat}\mid\text{the})=0.5\times0.4046\approx0.20$$

      Rounded, sat gets $0.40$ and each other word $0.15$, which add up to 1. After "the", the model expects "cat sat" about one time in five.
