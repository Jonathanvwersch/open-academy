final: alm-explain-final
summary: |
  - An autoregressive language model gives, at every position, a next-token distribution $p(x_{t+1}\mid x_1,\dots,x_t)$: a softmax over one score for each token in the vocabulary.
  - Multiplying next-token probabilities one after another gives the chance of several words in a row after a start, such as $p(\text{cat sat}\mid\text{the})=p(\text{cat}\mid\text{the})\times p(\text{sat}\mid\text{the cat})$.
  - A sentence of $T$ tokens gives $T-1$ training examples: the input is $x_1,\dots,x_{T-1}$ and the targets are the same tokens shifted left by one. With a causal mask and teacher forcing, one run scores them all, and the loss is the average of $-\ln$ of each true next token's probability.
  - To write, the model repeatedly predicts, chooses a token, by greedy decoding or by sampling, and adds it to the input. Its own mistakes become its input, and each new token needs another run.

  **Next:** The pretraining lesson trains models like this on huge amounts of text and looks at how data and compute shape the result.
