concept: regularization
version: 1
objective: "**Goal:** explain how an L2 penalty changes the loss and how weight decay changes each gradient-descent update, choose the penalty strength with validation error, and tell when an L1 penalty fits better."
recap:
  - concept: overfitting
    text: "Overfitting means a model follows quirks of its training examples that don't carry over, so its training error is low but its validation error is much higher. We compare models by validation error and can stop training once it rises."
  - concept: loss-functions
    text: "The squared error $e^2$ has slope $2e$, so its pull weakens as the error gets small. The absolute error $|e|$ has slope $+1$ or $-1$ whatever the size of $e$, with a sharp corner at $0$."
where_this_fits: |
  ### What is regularization?

  Regularization is any change to training that stops a model from fitting its training examples too closely, so that it does better on new examples. A model's **weights** are the numbers it learns that say how strongly each input affects its prediction. The most common kind of regularization adds a **penalty** to the loss, an amount that grows with the weights.

  The overfitting lesson fixed overfitting by switching to a less flexible model. Regularization keeps the flexible model and holds its weights back instead, by an amount we choose.

  Our running example has one weight, $\hat y=wx$, and one training example, $x=1$ with target $y=3$. Noise pushed that target too high, so in step 3 a smaller weight will do better on new examples.
knowledge_points:
  - id: rg-penalty
    title: "Add a penalty for large weights"
    explain: |
      ### Why large weights are a warning sign

      A weight says how much the prediction changes when its input rises by one. To copy a quirk, a model's prediction has to jump between examples that look almost the same, and only large weights turn a small change in the inputs into a big change in the prediction. Say a model has two inputs that almost always rise and fall together, with weights $+50$ and $-49$. When the two inputs are equal, the weights nearly cancel. If the first input is $0.1$ higher than the second, the prediction rises by an extra $50\times0.1=5$. A model with small weights changes its predictions more gently, and gentle changes are more likely to hold up on new examples.

      The **L2 penalty** adds $\lambda$ times the sum of the squared weights to the loss.

      So instead of the loss alone, we train the model to make the loss plus a penalty as small as possible.

      ### The L2 penalty

      $$L_{\text{total}}=L_{\text{data}}+\lambda\sum_j w_j^2.$$

      Here $L_{\text{data}}$ is the usual loss on the training examples, such as the squared error. The symbol $\sum_j$ means we add up over every weight, where $w_j$ is the $j$-th weight. The Greek letter $\lambda$ (lambda) is the **penalty strength**, a number we choose that is $0$ or more. With $\lambda=0$ we're back to plain training.

      ### One weight, one example

      For our model $\hat y=wx$ and the example $x=1$, $y=3$, the prediction is $w$ and the squared error is $(w-3)^2$. Without a penalty, the best weight is $w=3$, which copies the target exactly. With $\lambda=0.5$, we add $0.5w^2$.

      In the picture, the blue curve is the data loss, the dashed orange curve is the penalty and the green curve is their total. The total is lowest at $w=2$, and the worked example below finds that point. Moving from $3$ to $2$ costs $1$ in data loss but saves $2.5$ in penalty, because the penalty falls from $4.5$ to $2$.

