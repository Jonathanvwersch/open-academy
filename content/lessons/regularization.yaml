summary: |
  - Regularization changes training so that a model fits its training examples less closely and does better on new ones. The L2 penalty adds $\lambda\sum_j w_j^2$ to the loss, so each weight settles where shrinking it further would cost more data loss than it saves.
  - In gradient descent, the L2 penalty becomes weight decay. Every update first multiplies each weight by $1-2\eta\lambda$ and then takes the usual data step.
  - We choose $\lambda$ by validation error, because too small a value still overfits and too large a value underfits. We usually leave the bias out of the penalty.
  - Stopping early and dropout also regularize. Dropout switches off random units of a neural network during training.
  - The L1 penalty $\lambda\sum_j|w_j|$ moves each weight a fixed distance towards $0$ on every update, so it sets weights that don't help enough to exactly $0$.

  **Next:** The generalization lesson asks what it means for a model to work on examples it has never seen, and when that can fail.
