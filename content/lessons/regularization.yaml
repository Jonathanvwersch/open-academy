      So L1 sets weights that don't help enough to exactly $0$, and the worked example shows what "enough" means. A weight of $0$ means the model ignores that input, so L1 also tells us which inputs the model can do without. L2 makes weights small but leaves almost all of them nonzero.

      Neither penalty is better in general. L1 suits problems where we expect only a few inputs to matter. L2 is the usual default, and it's the penalty that weight decay comes from.
    worked: |
      Let's compare the penalties on two one-weight problems. The first is our running example, where the data wants $w=3$. The second has one training example $x=1$, $y=0.5$, so the data wants $w=0.5$. We use L1 with $\lambda=2$ and L2 with $\lambda=0.5$.

      1. **L1 on our example.** For a positive weight, the penalty $2|w|$ has slope $2$, so the slope of the total is $2(w-3)+2$. Setting it to zero gives
         $$2(w-3)+2=0,\ \text{so}\ w=2.$$

      2. **L2 on the second problem.** The total $(w-0.5)^2+0.5w^2$ has slope $2(w-0.5)+w=3w-1$, which is zero at
         $$w=\frac{1}{3}.$$

      3. **L1 on the second problem, for a positive weight.** The slope of $(w-0.5)^2+2|w|$ is positive for every positive $w$, so the total keeps falling as $w$ comes down towards $0$.
         $$2(w-0.5)+2=2w+1>0.$$

      4. **L1 for a negative weight.** Now the penalty's slope is $-2$, and the total's slope is negative for every negative $w$, so the total keeps falling as $w$ rises towards $0$.
         $$2(w-0.5)-2=2w-3<0.$$

      On our example, L1 and L2 both give $w=2$. On the second problem, the L1 total is lowest at exactly $w=0$, the corner of $|w|$. A corner has no single slope, so a lowest point there never shows up as a zero slope. L2 shrinks this weight to $1/3$ but keeps it, while L1 switches it off.

      In general, just right of $0$ the total's slope is the data slope plus $\lambda$, and just left of $0$ it's the data slope minus $\lambda$. If the data slope at $w=0$ is smaller than $\lambda$ in size, the total rises on both sides, so L1 keeps the weight at $0$. Here the data slope is $2(0-0.5)=-1$, smaller than $2$. In our running example it is $2(0-3)=-6$, bigger than $2$ in size, so that weight survives.
