      The weight stops moving where the two pulls balance. At $w=2$, the data slope is $-2$ and the penalty slope is $+2$, so the update leaves it there. That is the lowest point of the total loss from step 1.

      Be careful when you set weight decay in code. Some training libraries' gradient-descent optimizers, such as PyTorch's `SGD`, take a setting $d$ and use the update $(1-\eta d)\,w$, so to get our $\lambda$ you set $d=2\lambda$.
    worked: |
      Training often starts from a small weight, so let's run three updates on our example from $w=0$, with $\eta=0.1$ and $\lambda=0.5$. The update is $w_{\text{new}}=0.9w-0.1\times2(w-3)$.

      1. **Simplify the update.** Multiplying out the data step gives $0.9w-0.2w+0.6$, so each update becomes one short calculation.
         $$w_{\text{new}}=0.7w+0.6.$$

      2. **First update, from $w=0$.** There's nothing yet for the decay to shrink, so only the data step acts.
         $$0.7\times0+0.6=0.6.$$

      3. **Second update, from $w=0.6$.** The data step adds $-0.1\times2(0.6-3)=0.48$, while the decay takes off only $0.06$.
         $$0.7\times0.6+0.6=1.02.$$

      4. **Third update, from $w=1.02$.** Each update moves the weight less than the one before.
         $$0.7\times1.02+0.6=1.314.$$

      The weight's distance from $2$ goes $2$, $1.4$, $0.98$, $0.686$, shrinking by a factor of $0.7$ each update, because $0.7w+0.6-2=0.7(w-2)$. So the weight climbs towards $2$ and settles there, below the $3$ it would reach without the penalty.
