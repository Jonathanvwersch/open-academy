      It's tempting to think the penalty pushes the weight all the way to $0$, but it doesn't. The lowest point is where shrinking the weight further would add more data loss than it saves in penalty, which here is at $w=2$.
    worked: |
      Let's find the lowest point of the total loss $(w-3)^2+0.5w^2$ for our one-weight model, and check that the total there is lower than at $w=3$.

      1. **Find the slope of the total.** The lowest point of a smooth curve is where its slope is zero. From the recap, the squared error $e^2$ has slope $2e$. Here $e=w-3$ rises exactly as fast as $w$, so the data loss has slope $2(w-3)$, and the penalty $0.5w^2$ has slope $0.5\times2w=w$. So the total has slope
         $$2(w-3)+w.$$

      2. **Set the slope to zero.** At the lowest point, the data loss's slope and the penalty's slope cancel. Collecting terms in $2(w-3)+w=0$ gives
         $$3w-6=0,\ \text{so}\ w=2.$$

      3. **Work out the total at $w=2$.** We add the data loss and the penalty.
         $$(2-3)^2+0.5\times2^2=1+2=3.$$

      4. **Compare with $w=3$.** At the old best weight, the data loss is $0$ but the penalty is not.
         $$(3-3)^2+0.5\times3^2=0+4.5=4.5.$$

      So the penalty moves the best weight from $3$ to $2$, where the total is $3$ instead of $4.5$. There, the data loss's slope $2(2-3)=-2$ and the penalty's slope $+2$ cancel. With any $\lambda$ in place of $0.5$, the slope is $2(w-3)+2\lambda w$. Setting it to zero gives $2w-6+2\lambda w=0$, so $2(1+\lambda)w=6$ and $w=3/(1+\lambda)$. So a larger $\lambda$ pulls the weight further towards $0$.
