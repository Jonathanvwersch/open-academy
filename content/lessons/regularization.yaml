  - id: rg-strength
    title: "Choose how strong the penalty is"
    explain: |
      ### Too little, too much

      The penalty strength $\lambda$ is a **hyperparameter**, a setting that training doesn't learn, so we choose it ourselves. Too small a $\lambda$ changes little, and the model can still copy its training examples' quirks. Too large a $\lambda$ pushes every weight close to $0$, so the model can't follow even the real pattern and underfits.

      ### Choosing it with validation error

      We choose $\lambda$ the way the overfitting lesson chose between models. We train once for each of several values of $\lambda$, measure each trained model's error on the validation examples, and keep the $\lambda$ with the lowest validation error. We rarely know even roughly how big $\lambda$ should be, so we space the tries by factors of ten, such as $0.01$, $0.1$, $1$ and $10$. The test examples stay aside until the very end, for one final score.

      Be careful not to choose $\lambda$ by training loss. It is always lowest at $\lambda=0$, because the penalty only worsens the training fit.

      ### Which weights to penalize

      Many models also have a **bias** $b$, an extra number added to every prediction, as in $\hat y=wx+b$. We usually leave $b$ out of the penalty. The bias moves every prediction by the same amount, so it can't make predictions swing between nearby examples. Shrinking it wouldn't make the model any smoother, so it would only add error.

      ### Other ways to regularize

      Penalties aren't the only way to regularize. Training usually starts from small weights, so stopping early, as in the overfitting lesson, also regularizes. It keeps the weights from growing far enough to copy the quirks.

      Neural networks are models built from layers of simple **units**, each passing a number on to the next layer. They often use **dropout**. On each training update, dropout sets each unit's output to $0$ with some probability, such as $0.5$, and scales up the outputs it keeps so their average stays the same. With $0.5$, an output of $3$ becomes $0$ or $6$, which averages $3$. The network can't rely on any one unit, so it spreads what it learns across many. Dropout is switched off when the trained network makes predictions.
    worked: |
      Let's choose $\lambda$ for our example. Say the true pattern is $y=2x$ and only our training target picked up noise, so a fair validation example is $x=2$, $y=4$. There the prediction is $2w$, and its squared error is $(2w-4)^2$. Real validation examples are noisy too, but we've kept this one clean. We also try $\lambda=0$, $0.5$, $2$ and $5$ instead of factors of ten, so the numbers stay small.

      1. **Find the trained weight.** Training finds the lowest point of the total loss, which step 1 found at $w=3/(1+\lambda)$. For $\lambda=2$, that is
         $$w=\frac{3}{1+2}=1.$$

      2. **Work out the training loss.** For $\lambda=2$, the prediction on the training example is $1$ against a target of $3$.
         $$(1-3)^2=4.$$

      3. **Work out the validation loss.** For $\lambda=2$, the prediction on the validation example is $2\times1=2$ against a target of $4$.
         $$(2\times1-4)^2=4.$$

      4. **Fill in the other rows and compare.** Doing the same for $\lambda=0$, $0.5$ and $5$ gives the table below, which shows the data loss on each example, without the penalty. We look for the lowest validation loss.
         $$\min(4,\ 0,\ 4,\ 9)=0.$$

      | $\lambda$ | weight $w$ | training loss | validation loss |
      | --- | --- | --- | --- |
      | $0$ | $3$ | $0$ | $4$ |
      | $0.5$ | $2$ | $1$ | $0$ |
      | $2$ | $1$ | $4$ | $4$ |
      | $5$ | $0.5$ | $6.25$ | $9$ |

      With $\lambda=0$, the training loss is $0$ but the validation loss is $4$, because the model has copied the noise in its one training example. As $\lambda$ grows, the training loss keeps rising, but the validation loss first falls and then rises again. With $\lambda=2$, the training loss is high too, a sign of underfitting. We keep $\lambda=0.5$, the value with the lowest validation loss. It reaches exactly $0$ only because our validation example is clean.
    problems:
      - rg-strength-basics
      - rgp-strength-self-explain
      - rgp-diagnose-large
      - rgp-val-loss-template
      - rgp-bias
      - rgp-early-stop
      - rgp-dropout
      - rgp-still-falling
      - rgp-robot-strength
  - id: rg-l1
    title: "Penalize weights by their absolute size"
    explain: |
      ### The L1 penalty

      The **L1 penalty** charges each weight's absolute size instead of its square:

      $$L_{\text{total}}=L_{\text{data}}+\lambda\sum_j |w_j|.$$

      Both names come from ways of measuring the size of a list of weights. The L1 size adds up the $|w_j|$. The L2 size treats the weights as the coordinates of a point and measures its straight-line distance from $0$, whose square is $\sum_j w_j^2$.

      The loss functions recap tells us how the two penalties pull. The L2 penalty's slope $2\lambda w$ is proportional to the weight, so each update takes away the same fraction, $2\eta\lambda$, of whatever weight is left. The L1 penalty's slope is $+\lambda$ for every positive weight and $-\lambda$ for every negative one, so each update moves the weight the same distance, $\eta\lambda$, towards $0$, however small it already is.

      ### Shrinking towards zero, update by update

      Say a model has an input that has nothing to do with the target, such as a random number, and its weight happens to start at $1$. The data doesn't pull on that weight, so only the penalty acts. The picture follows it with $\eta=0.1$. We use $\lambda=0.5$ for L2 and $\lambda=2$ for L1, which both move our running example's weight from $3$ to $2$, so the two penalties are equally strong there. Under L2, in orange, the weight is multiplied by $0.9$ each update and is still $0.53$ after six. It gets ever closer to $0$ but never reaches it. Under L1, in red, it loses $0.2$ each update and reaches exactly $0$ after five. If an update would carry a weight past $0$, we set it to exactly $0$ instead, because on the other side L1 would only pull it back.

