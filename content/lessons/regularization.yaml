  - id: rg-weight-decay
    title: "Shrink every weight on each update"
    explain: |
      ### What the penalty does to one update

      Most models have too many weights to solve for the lowest point directly, as step 1 did. Instead, they're trained by gradient descent, which improves the weights in small updates. Each update moves a weight against the slope of the loss, scaled by a small number we choose called the learning rate $\eta$ (eta):

      $$w_{\text{new}}=w-\eta\,\frac{\partial L}{\partial w}.$$

      Here $\partial L/\partial w$ is the slope of $L$ as $w$ alone changes. The curly $\partial$ reminds us that the other weights are held still.

      With a penalty, $L$ is the total loss, so its slope has two parts. The data part is the slope of the data loss. For one weight, the penalty is $\lambda w^2$, with slope $2\lambda w$. That slope has the same sign as $w$, so stepping against it always moves the weight towards $0$. The update becomes

      $$w_{\text{new}}=w-\eta\Big(\frac{\partial L_{\text{data}}}{\partial w}+2\lambda w\Big).$$

      Collecting the terms in $w$ gives

      $$w_{\text{new}}=(1-2\eta\lambda)\,w-\eta\,\frac{\partial L_{\text{data}}}{\partial w}.$$

      This is called **weight decay**. On every update, each weight is multiplied by $1-2\eta\lambda$ and the usual data step, worked out at the same old weight, is added on. With $\eta=0.1$ and $\lambda=0.5$, that number is $0.9$, so every update takes away $10\%$ of the weight on top of the data step.

      ### Two updates on our example

      For our example $x=1$, $y=3$, the data slope is $2(w-3)$. The picture starts at $w=3$, the best weight without a penalty. There the data slope is $0$, so only the decay acts and the weight shrinks to $2.7$. Both parts of an update use the weight from before the update. From $2.7$, the decay takes off $10\%$, giving $2.43$. At $2.7$ the prediction is below the target, so the data step $-0.1\times2(2.7-3)=0.06$ pushes it back up, to $2.49$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="A number line for the weight w from 2 to 3. Update 1 starts at w = 3, where the data slope is 0, and an orange decay arrow multiplies the weight by 0.9, taking it to 2.7. Update 2 starts at 2.7: an orange decay arrow takes it to 2.43 and a short blue data-step arrow pushes it back up by 0.06 to 2.49. A green dot at 2 marks where the weight settles.">
