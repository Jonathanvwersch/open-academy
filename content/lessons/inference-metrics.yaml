concept: inference-metrics
version: 1
objective: |
  **Goal:** compute time to first token, inter-token latency, tokens per second and end-to-end latency from a request trace, summarise many requests with percentiles, and explain how batching can improve throughput, lengthen each user's wait and reach a throughput plateau.
recap:
  - concept: autoregressive-lm
    text: "A language model writes text one token at a time. It predicts a next-token distribution, chooses a token, adds it to the text and runs again, so each new token needs another run of the model."
where_this_fits: |
  ### What are inference metrics?

  Inference means running a trained model to answer requests. Inference metrics are the numbers that say how fast it does that. They tell us how long a user waits before the reply starts, how quickly the rest appears, and how many tokens the server writes per second for all its users together.

  Why do we need them? A reply can feel slow because it takes long to start or because it then trickles in, and these have different causes and fixes. Users care about their own wait, while whoever pays for the computer chips that run the model cares about how many users they serve. Serving more users at once can improve throughput while making replies slower, so we need numbers for both sides.
knowledge_points:
  - id: infm-one-request
    title: "Measure the wait for one reply"
    explain: |
      ### Following one request

      Our example in this course is a chat assistant that runs the Llama 3 8B model. It has about 8 billion parameters, the learned numbers inside it. It runs on one NVIDIA H100 SXM GPU, a chip built for the maths that models do.

      A user sends a message at time 0. Before anything appears, the server has to run the model over the whole prompt and choose the first token. This first run usually takes much longer than each later token. After that, as we saw in the autoregressive language models lesson, each new token needs another run of the model, so the reply arrives one token at a time. Chat apps usually show each token as soon as it's made, which is called **streaming**.

      To measure this, we record a **request trace**, a log of when each event happened. The picture shows a made-up trace for a short reply of 5 tokens. The first token arrives at 250 ms, and the others follow every 20 ms.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 215" aria-label="A timeline in milliseconds for one reply of 5 tokens. The request is sent at 0 ms and the tokens arrive at 250, 270, 290, 310 and 330 ms. An orange bracket from 0 to 250 ms marks the time to first token, 250 ms. A blue bracket from 250 to 270 ms marks one inter-token latency, 20 ms. A black bracket below the timeline from 0 to 330 ms marks the end-to-end latency, 330 ms">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="40" y="28" fill="#737373">one reply of 5 tokens, times in ms</text>
      <path d="M40 120 H600" stroke="#d4d4d4" stroke-width="2"/>
      <circle cx="40" cy="120" r="5" fill="#737373"/>
      <circle cx="440" cy="120" r="5" fill="#171717"/>
      <circle cx="472" cy="120" r="5" fill="#171717"/>
      <circle cx="504" cy="120" r="5" fill="#171717"/>
      <circle cx="536" cy="120" r="5" fill="#171717"/>
      <circle cx="568" cy="120" r="5" fill="#171717"/>
      <text x="40" y="146" text-anchor="middle" font-size="13">0</text>
      <text x="440" y="146" text-anchor="middle" font-size="13">250</text>
      <text x="472" y="146" text-anchor="middle" font-size="13">270</text>
      <text x="504" y="146" text-anchor="middle" font-size="13">290</text>
      <text x="536" y="146" text-anchor="middle" font-size="13">310</text>
      <text x="568" y="146" text-anchor="middle" font-size="13">330</text>
      <text x="48" y="104" fill="#737373">request sent</text>
      <path d="M40 92 V82 H440 V92" stroke="#f59e0b" stroke-width="2.5" fill="#ffffff" fill-opacity="0"/>
      <text x="240" y="72" text-anchor="middle" fill="#f59e0b">time to first token = 250 ms</text>
      <path d="M440 104 V94 H472 V104" stroke="#3b82f6" stroke-width="2.5" fill="#ffffff" fill-opacity="0"/>
      <text x="456" y="62" text-anchor="middle" fill="#3b82f6">ITL = 20 ms</text>
      <path d="M456 66 V90" stroke="#3b82f6" stroke-width="1.5"/>
      <path d="M40 160 V170 H568 V160" stroke="#171717" stroke-width="2.5" fill="#ffffff" fill-opacity="0"/>
      <text x="304" y="194" text-anchor="middle">end-to-end latency = 330 ms</text>
      </g>
      </svg>
      ```

      ### Three waits we measure

      Latency just means a waiting time. We measure three of them.

      **Time to first token (TTFT)** is the time from sending the request until the first output token arrives. Here it's 250 ms, shown by the orange bracket.

      **Inter-token latency (ITL)** is the gap between two consecutive output tokens. Here every gap is 20 ms, shown by the blue bracket. In real traces the gaps vary a little, so we report their average. We take the time from the first token to the last and divide it by the number of gaps.

      **End-to-end latency** is the time from sending the request until the last token arrives. A reply of $N$ tokens has its first token and then $N-1$ gaps, so

      $$\text{end-to-end latency}=\text{TTFT}+(N-1)\times\text{ITL}.$$

      Be careful to count the gaps. Five tokens have only four gaps between them. The wait before the first token is already counted in the TTFT, so it isn't a gap.

      ### Tokens per second for one user

      Once the reply starts, how fast does it appear? One token every 20 ms is 50 tokens per second (tokens/s). So a user's **tokens per second** while the reply streams is one divided by the ITL, with the ITL in seconds:

      $$\text{tokens/s}=\frac{1}{\text{ITL}}.$$
    worked: |
      Let's read the four numbers off a longer made-up trace from our chat assistant. The user sends a message at 0 s. The first output token arrives at 0.30 s, and the 101st and last token arrives at 2.30 s.

      1. **Read off the time to first token.** It's the arrival time of the first token, measured from when the request was sent.
         $$\text{TTFT}=0.30\ \text{s}$$

      2. **Find the average inter-token latency.** The 101 tokens have 100 gaps between them, and those gaps fill the time from the first token to the last.
         $$\text{ITL}=\frac{2.30-0.30}{100}=0.02\ \text{s}$$

      3. **Turn the ITL into tokens per second.** On average a new token arrives every 0.02 s, which is 20 ms, so one second holds $1/0.02$ of them.
         $$\frac{1}{0.02\ \text{s}}=50\ \text{tokens/s}$$

      4. **Check the end-to-end latency with the formula.** The TTFT plus 100 gaps should give the last token's arrival time.
         $$0.30+100\times0.02=2.30\ \text{s}$$

      So this user waited 0.3 s for the reply to start, then read it as it streamed in at 50 tokens/s, and had the whole reply after 2.3 s.
    problems:
      - infm-trace-basics
      - infm-trace-self-explain
      - infm-which-metric
      - infm-e2e-template
      - infm-avg-itl
      - infm-off-by-one
      - infm-speed-template
