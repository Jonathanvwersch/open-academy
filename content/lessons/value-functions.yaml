  - id: vf-bellman-optimality
    title: "Find the most reward the robot can get"
    tldr: |
      - A state's best value is the most return any policy can collect from it.
      - It equals the best move's reward plus the discounted best value of where it lands.
      - Repeating this spreads the goal's reward back one cell at a time.
      - When the values stop changing, the best move in each cell is the one worth the most.
    explain: |
      ### The best the robot can do

      Now we want the most return any policy could collect from each cell. We'll keep the corridor and $\gamma=0.9$, and we know where each move leads and what it pays.

      The **optimal state value** $V^*(s)$ is the largest value any policy can reach from state $s$. The **optimal action value** $Q^*(s,a)$ is the expected return from taking action $a$ in state $s$ and acting as well as possible after that.

      ### The Bellman optimality equation

      Here we take the best action. The **Bellman optimality equation** is

      $$V^*(s)=\max_a E\big[\,r+\gamma V^*(s')\,\big].$$

      Here $\max_a$ means "the largest over all actions $a$", and $E$ averages over the next state. For a move with one outcome,

      $$Q^*(s,a)=r+\gamma V^*(s').$$

      ### Backups that spread the reward

      One **sweep** backs up every cell once from the previous sweep's estimates. Cell 4 stays at $0$, because the episode ends there. Starting every other estimate at $0$, we get:

      | Sweep | $V(1)$ | $V(2)$ | $V(3)$ |
      | --- | --- | --- | --- |
      | 0 | $0$ | $0$ | $0$ |
      | 1 | $-1$ | $-1$ | $10$ |
      | 2 | $-1.9$ | $8$ | $10$ |
      | 3 | $6.2$ | $8$ | $10$ |
      | 4 | $6.2$ | $8$ | $10$ |

      In sweep 1, only cell 3 can reach the goal, so it gets $10$. Follow how the other estimates change:
      $$
      \begin{aligned}
      V(1)=V(2)&=-1+0.9\times0=-1 &&\text{sweep one: next estimates are zero}\\
      V(2)&=-1+0.9\times10=8 &&\text{sweep two: use cell three's ten}\\
      V(1)&=-1+0.9\times(-1)=-1.9 &&\text{sweep two: use cell two's old estimate}
      \end{aligned}
      $$
      Each sweep carries the $+10$ one cell further back. After sweep 3 nothing changes, so these are $V^*$. They match "always move right", so it's a best policy.

      Repeating sweeps like this is called **value iteration**.

      ### Reading off the best move

      With $V^*$ known, pick the largest $Q^*$. In cell 2:
      $$
      \begin{aligned}
      Q^*(2,\text{right})&=-1+0.9\times10=8 &&\text{use cell three's value}\\
      Q^*(2,\text{left})&=-1+0.9\times6.2=4.58 &&\text{use cell one's value}
      \end{aligned}
      $$
      So the best move is right.

      Be careful not to pick a move by its next reward alone. In cell 2 both moves give $-1$, and only the values of the cells they lead to tell them apart.
    worked: |
      Let's do the backup that fills in $V(1)$ in sweep 3. The estimates from sweep 2 are $V(1)=-1.9$ and $V(2)=8$, with $\gamma=0.9$.

      1. **Look one step ahead to the right.** Moving right pays $-1$ and lands in cell 2.
         $$-1+0.9\times8=6.2.$$

      2. **Look one step ahead to the left.** The wall keeps the robot in cell 1, so it pays $-1$ and uses cell 1's own estimate.
         $$-1+0.9\times(-1.9)=-2.71.$$

      3. **Take the larger.** The optimality equation keeps the best action's value.
         $$V(1)\leftarrow\max(6.2,\,-2.71)=6.2.$$

      After sweep 2, cell 2's estimate of $8$ already includes the $+10$. So this backup carries the $+10$ one more cell back, to cell 1.
    problems:
      - vf-bellman-optimality-basics
      - vfp-sweep-self-explain
      - vfp-average-or-max
      - vfp-optimal-backup-template
      - vfp-slow-spread
      - vfp-wall-q-star
      - vfp-greedy-reward-mistake
      - vfp-drone-land-or-fly
final: vf-explain-values
summary: |
  - The state value $V^\pi(s)$ is the expected return from state $s$ when the agent follows policy $\pi$, so it changes when the policy changes.
  - The action value $Q^\pi(s,a)$ is the expected return from taking action $a$ in state $s$ and then following $\pi$. For a move with one outcome it's $r+\gamma V^\pi(s')$, and $V^\pi(s)$ is the average of the $Q^\pi(s,a)$, weighted by $\pi(a\mid s)$.
  - The Bellman expectation equation, $V^\pi(s)=E\big[r+\gamma V^\pi(s')\big]$, links each value to the next state's value. A Bellman backup puts current estimates into its right-hand side to get a new estimate.
  - The Bellman optimality equation, $V^*(s)=\max_a E\big[r+\gamma V^*(s')\big]$, takes the value of the best action. Repeating its backups is value iteration, and the best move in each state is the one with the largest $Q^*(s,a)$.

  **Next:** The Q-learning lesson learns $Q^*$ from the robot's own experience, without knowing in advance where each move leads.
