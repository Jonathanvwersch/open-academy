      - vfp-arm-three-actions
  - id: vf-bellman-expectation
    title: "Get a state's value from the next state"
    tldr: |
      - A state's value is the next reward plus the discounted value of the state it leads to.
      - When choices or moves are random, we average over what can happen.
      - Using guesses for the next states gives a new guess for this one, a Bellman backup.
      - Repeating backups for every state brings the guesses to the true values.
    explain: |
      ### One step plus the rest

      In the same corridor, take "always move right" from cell 2. The robot pays $-1$ and lands in cell 3. Everything after that is the return from cell 3, worth $10$, one step later:
      $$V^\pi(2)=-1+0.9\times10=8.$$

      This works because the return splits into the next reward plus the discounted return from the next step on:

      $$G_t=r_{t+1}+\gamma\,G_{t+1}.$$

      ### The Bellman expectation equation

      When the policy or the moves are random, we average. The **Bellman expectation equation** says that a state's value is the expected reward for one step plus the discounted value of the next state:

      $$V^\pi(s)=E\big[\,r+\gamma V^\pi(s')\,\big].$$

      The average is over the action $a$, picked with probability $\pi(a\mid s)$. If moves can fail, it's also over the next state $s'$, and $p(s'\mid s,a)$ is the chance of landing in $s'$ after action $a$ in state $s$. Here's what gets averaged in three corridors:

      - With "always move right" and reliable moves, there's only one outcome.
      - With a policy that goes right with probability $0.8$ and left with $0.2$, the two moves get weights $0.8$ and $0.2$.
      - On a slippery floor, a move right from cell 1 might work with probability $0.8$ and otherwise leave it in place. Then $p(2\mid 1,\text{right})=0.8$ and $p(1\mid 1,\text{right})=0.2$ weight the two landing cells.

      ### One Bellman backup

      Usually we don't know the values, so we start from guesses, called estimates, and write them as plain $V(s)$. Putting them into the right-hand side gives a new estimate for one state. That's one **Bellman backup**. One backup can even move a single estimate further from its true value. Still, repeating backups for every state brings the estimates to $V^\pi$ when $\gamma<1$, because each round shrinks the largest gap from the true values to at most $\gamma$ times its size.

      The picture sets up a backup for cell 2 under the policy that goes right with probability $0.8$, from made-up estimates $V(1)=5$ and $V(3)=9$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="40 10 560 260" aria-label="A backup for cell 2. From the cell 2 box at the top, an orange arrow goes down to cell 3, labelled right, probability 0.8, reward minus 1, where the current estimate is V of 3 equals 9. A blue arrow goes down to cell 1, labelled left, probability 0.2, reward minus 1, where the current estimate is V of 1 equals 5">
      <defs><marker id="vf3-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker><marker id="vf3-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
      <rect x="210" y="25" width="220" height="50" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2.5"/>
      <text x="320" y="55" text-anchor="middle">cell 2: new estimate</text>
      <rect x="80" y="175" width="160" height="50" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <text x="160" y="205" text-anchor="middle">cell 1</text>
      <rect x="400" y="175" width="160" height="50" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <text x="480" y="205" text-anchor="middle">cell 3</text>
      <path d="M320 75 L172 170" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#vf3-blue)"/>
      <path d="M320 75 L468 170" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#vf3-amber)"/>
      <text x="215" y="115" text-anchor="end" fill="#3b82f6">left: chance 0.2</text>
      <text x="215" y="135" text-anchor="end" fill="#3b82f6">reward −1</text>
      <text x="425" y="115" fill="#f59e0b">right: chance 0.8</text>
      <text x="425" y="135" fill="#f59e0b">reward −1</text>
      <text x="160" y="250" text-anchor="middle">estimate V(1) = 5</text>
      <text x="480" y="250" text-anchor="middle">estimate V(3) = 9</text>
      </g>
      </svg>
      ```

      Be careful with the goal cell. Its value is $0$, because the $+10$ is paid on the step that reaches it. So in a backup, moving right from cell 3 gives $10+0.9\times0=10$.
    worked: |
      Let's do the backup in the picture: one new estimate for cell 2, under a policy that moves right with probability $0.8$ and left with probability $0.2$. Moves always work, $\gamma=0.9$, and the current estimates are $V(1)=5$ and $V(3)=9$.

      1. **Look one step ahead to the right.** Moving right pays $-1$ and lands in cell 3, whose estimate we shrink by $0.9$.
         $$-1+0.9\times9=7.1.$$

      2. **Look one step ahead to the left.** Moving left pays $-1$ and lands in cell 1.
         $$-1+0.9\times5=3.5.$$

      3. **Average with the policy's probabilities.** The equation averages over the actions, weighted by how often the policy picks each one.
         $$
         \begin{aligned}
         V(2)&\leftarrow0.8\times7.1+0.2\times3.5 &&\text{weight each action's return}\\
         &=5.68+0.7 &&\text{multiply}\\
         &=6.38 &&\text{add}
         \end{aligned}
         $$

      The symbol $\leftarrow$ means "replace with", since this is a new estimate built from old ones. We'd do the same for cells 1 and 3, then repeat.
