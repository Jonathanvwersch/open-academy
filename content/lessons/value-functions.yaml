final: vf-explain-values
summary: |
  - The state value $V^\pi(s)$ is the expected return from state $s$ when the agent follows policy $\pi$, so it changes when the policy changes.
  - The action value $Q^\pi(s,a)$ is the expected return from taking action $a$ in state $s$ and then following $\pi$. For a move with one outcome it's $r+\gamma V^\pi(s')$, and $V^\pi(s)$ is the average of the $Q^\pi(s,a)$, weighted by $\pi(a\mid s)$.
  - The Bellman expectation equation, $V^\pi(s)=E\big[r+\gamma V^\pi(s')\big]$, links each value to the next state's value. A Bellman backup puts current estimates into its right-hand side to get a new estimate.
  - The Bellman optimality equation, $V^*(s)=\max_a E\big[r+\gamma V^*(s')\big]$, takes the value of the best action. Repeating its backups is value iteration, and the best move in each state is the one with the largest $Q^*(s,a)$.

  **Next:** The Q-learning lesson learns $Q^*$ from the robot's own experience, without knowing in advance where each move leads.
