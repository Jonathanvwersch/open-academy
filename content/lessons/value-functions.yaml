concept: value-functions
version: 1
objective: |
  **Goal:** say what the state value $V^\pi(s)$ and the action value $Q^\pi(s,a)$ measure, and apply one Bellman backup, for a given policy and for the best policy, to work out a state's value from the values of the states that come after it.
recap:
  - concept: policies-returns
    text: "Return $G_t$ adds rewards from $r_{t+1}$ onward, with later rewards weighted by discount factor $\\gamma$. Policy $\\pi(a\\mid s)$ gives the chance of action $a$ in state $s$; a deterministic policy writes its action as $\\pi(s)$."
where_this_fits: |
  ### What is a value function?

  A value function gives each state a number for how much reward an agent can expect to collect from there on.

  The big reward is often many steps away. A value turns all that future reward into one number, so an agent can compare states and actions and pick the better one. The Bellman equations link each state's value to the next state's value, so we can find values without listing whole paths.
knowledge_points:
  - id: vf-state-value
    title: "Measure how good each state is"
    explain: |
      ### A robot in a corridor

      A robot moves along a corridor of 4 cells, numbered 1 to 4 from left to right, and it starts in cell 1. It can move left or right, and moving into a wall leaves it where it is. Reaching cell 4 ends the episode with a reward of $+10$, and every other step gives $-1$. We'll use a discount factor of $\gamma=0.9$.

      Each cell is a state. We'll start with the simplest policy, "always move right". When a policy always picks one action, we just write that action, so here $\pi(s)=\text{right}$. That's the same as $\pi(\text{right}\mid s)=1$.

      ### Adding up the reward to come

      From cell 1, the robot gets $-1$ for the step to cell 2, $-1$ for the step to cell 3 and $+10$ for reaching cell 4. Each later reward is shrunk by one more factor of $0.9$, and the total comes to $6.2$. Starting in cell 2 skips the first step and gives $-1+0.9\times10=8$. From cell 3, the next step pays $+10$, so the value is $10$. In cell 4 the episode is over, so its value is $0$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" aria-label="A corridor of four cells in a row. Orange arrows show the policy always moving right, with reward minus 1 for the moves from cell 1 to 2 and from 2 to 3, and plus 10 for the move from 3 to 4. Under that policy the values are 6.2 in cell 1, where the robot starts, 8 in cell 2, 10 in cell 3 and 0 in cell 4, the goal, where the episode ends">
      <defs><marker id="vf1-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="25" y="70" width="140" height="90" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="175" y="70" width="140" height="90" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="325" y="70" width="140" height="90" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="475" y="70" width="140" height="90" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <text x="95" y="100" text-anchor="middle" fill="#737373">cell 1</text>
      <text x="245" y="100" text-anchor="middle" fill="#737373">cell 2</text>
      <text x="395" y="100" text-anchor="middle" fill="#737373">cell 3</text>
      <text x="545" y="100" text-anchor="middle" fill="#737373">cell 4</text>
      <text x="95" y="136" text-anchor="middle" font-size="18">V = 6.2</text>
      <text x="245" y="136" text-anchor="middle" font-size="18">V = 8</text>
      <text x="395" y="136" text-anchor="middle" font-size="18">V = 10</text>
      <text x="545" y="136" text-anchor="middle" font-size="18">V = 0</text>
      <path d="M115 65 Q170 25 225 65" fill="#ffffff" fill-opacity="0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#vf1-amber)"/>
      <path d="M265 65 Q320 25 375 65" fill="#ffffff" fill-opacity="0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#vf1-amber)"/>
      <path d="M415 65 Q470 25 525 65" fill="#ffffff" fill-opacity="0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#vf1-amber)"/>
      <text x="170" y="34" text-anchor="middle" fill="#f59e0b">−1</text>
      <text x="320" y="34" text-anchor="middle" fill="#f59e0b">−1</text>
      <text x="470" y="34" text-anchor="middle" fill="#f59e0b">+10</text>
      <text x="95" y="184" text-anchor="middle">start</text>
      <text x="545" y="184" text-anchor="middle" fill="#10b981">goal: episode ends</text>
      <text x="25" y="218" fill="#737373">Policy: always move right. Discount γ = 0.9</text>
      </g>
      </svg>
      ```

      ### The state value

      The **state value** $V^\pi(s)$ is the expected return when the agent starts in state $s$ and follows the policy $\pi$ from then on:

      $$V^\pi(s)=E\big[G_t \mid s_t=s\big].$$

      Here $s_t$ is the state at step $t$, $E$ is the expected value, and the bar means "given that", so we average only over times the agent is in state $s$. Here nothing is random, so each start has one path, and the value is that path's return.

      ### Values depend on the policy

      A value belongs to a cell and a policy together. Under "always move left", the robot never reaches cell 4 and gets $-1$ on every step. Its return, $-1-0.9-0.81-\dots$, is a sum of shrinking terms that adds up to $-1/(1-0.9)=-10$. So cells 1 to 3 are worth $-10$.

      Be careful not to read a value as the next reward. In cell 2 the next reward is $-1$ whichever way the robot moves, but the value under "always move right" is $8$, because it counts the $+10$ that's coming.
    worked: |
      Let's work out $V^\pi(1)$, the value of the start cell under "always move right", with $\gamma=0.9$.

      1. **List the rewards along the path.** The robot starts at step $t=0$, so its rewards are $r_1$, $r_2$ and so on. The policy has no chance in it, so from cell 1 there's only one path: to cell 2, to cell 3, then to cell 4, where the episode ends.
         $$r_1=-1,\qquad r_2=-1,\qquad r_3=+10.$$

      2. **Shrink each later reward.** The reward $k$ steps after the first is multiplied by $\gamma^k$, so the factors are $1$, $0.9$ and $0.9^2=0.81$.
         $$-1,\qquad 0.9\times(-1)=-0.9,\qquad 0.81\times10=8.1.$$

      3. **Add them up.** With only one path, its return is the expected return, so it's the value.
         $$V^\pi(1)=-1-0.9+8.1=6.2.$$

      Starting one cell further from the goal lowers the value from $8$ to $6.2$, because the robot pays one more $-1$ and the $+10$ is shrunk once more.
