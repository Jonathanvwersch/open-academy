  - id: vf-action-value
    title: "Measure how good each move is"
    tldr: |
      - An action value scores one move: make it, then go back to following the policy.
      - It is the move's reward plus the discounted value of the cell it lands in.
      - Comparing the values of different moves shows where the policy could do better.
    explain: |
      ### Asking about one move

      A state value says how good a cell is when the robot follows its policy. To choose between moves, we'd like to know how good each one is. What would happen if the robot made one different move and then went back to its policy?

      We'll keep the same corridor and $\gamma=0.9$. Under "always move right", we found the values are $6.2$, $8$, $10$ and $0$ for cells 1 to 4.

      ### Two moves from cell 2

      In cell 2, moving right costs $-1$ and puts the robot in cell 3, which is worth $10$ from there on. Moving left also costs $-1$, but puts the robot in cell 1. From cell 1 it goes back to always moving right, which is worth $6.2$. Those values count rewards from the next cell on, which all arrive one step later, so we shrink each value by $0.9$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" aria-label="The four-cell corridor with values 6.2, 8, 10 and 0 under the policy always move right. From cell 2, an orange arrow moves right to cell 3 and is worth minus 1 plus 0.9 times 10, which is 8. A blue arrow moves left to cell 1 and is worth minus 1 plus 0.9 times 6.2, which is 4.58">
      <defs><marker id="vf2-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker><marker id="vf2-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="25" y="70" width="140" height="90" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="175" y="70" width="140" height="90" rx="6" fill="#ffffff" stroke="#171717" stroke-width="2.5"/>
      <rect x="325" y="70" width="140" height="90" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="475" y="70" width="140" height="90" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <text x="95" y="100" text-anchor="middle" fill="#737373">cell 1</text>
      <text x="245" y="100" text-anchor="middle" fill="#737373">cell 2</text>
      <text x="395" y="100" text-anchor="middle" fill="#737373">cell 3</text>
      <text x="545" y="100" text-anchor="middle" fill="#737373">cell 4</text>
      <text x="95" y="136" text-anchor="middle" font-size="18">V = 6.2</text>
      <text x="245" y="136" text-anchor="middle" font-size="18">V = 8</text>
      <text x="395" y="136" text-anchor="middle" font-size="18">V = 10</text>
      <text x="545" y="136" text-anchor="middle" font-size="18">V = 0</text>
      <path d="M265 65 Q320 25 375 65" fill="#ffffff" fill-opacity="0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#vf2-amber)"/>
      <text x="320" y="34" text-anchor="middle" fill="#f59e0b">right: −1 + 0.9 × 10 = 8</text>
      <path d="M225 165 Q170 205 115 165" fill="#ffffff" fill-opacity="0" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#vf2-blue)"/>
      <text x="170" y="222" text-anchor="middle" fill="#3b82f6">left: −1 + 0.9 × 6.2 = 4.58</text>
      </g>
      </svg>
      ```

      ### The action value

      The **action value** $Q^\pi(s,a)$, the value function for moves, is the expected return when the agent starts in state $s$, takes action $a$ first, and follows the policy $\pi$ after that. When an action always gives reward $r$ and lands in the same next state $s'$, its value is that reward plus the shrunk value of the next state:

      $$Q^\pi(s,a)=r+\gamma V^\pi(s').$$

      Apply this to cell 2:
      $$
      \begin{aligned}
      Q^\pi(2,\text{right})&=-1+0.9\times10=8 &&\text{use cell three's value}\\
      Q^\pi(2,\text{left})&=-1+0.9\times6.2=4.58 &&\text{use cell one's value}
      \end{aligned}
      $$
      The right move is better.

      ### Back from moves to the cell

      The state value is the average of the action values, each weighted by the chance $\pi(a\mid s)$ that the policy picks it. With two actions,

      $$V^\pi(s)=\pi(\text{left}\mid s)\,Q^\pi(s,\text{left})+\pi(\text{right}\mid s)\,Q^\pi(s,\text{right}).$$

      "Always move right" picks right with probability $1$, so $V^\pi(2)$ is just $Q^\pi(2,\text{right})=8$.

      Comparing action values shows where a policy can do better. Take a worse policy, "always move left", where cells 1 to 3 are worth $-10$. For it, $Q^\pi(3,\text{right})=10$, because that one move reaches cell 4 and earns $+10$. That's far above $-10$, so moving right in cell 3 would help.

      Be careful with what happens after the first move. $Q^\pi(2,\text{left})$ moves left once and then follows $\pi$ again. It doesn't mean moving left forever, which would be worth $-10$.
    worked: |
      Let's find both action values in cell 1 under "always move right", with $\gamma=0.9$ and values $V^\pi(1)=6.2$ and $V^\pi(2)=8$.

      1. **Move right.** The robot pays $-1$ and lands in cell 2, then follows the policy from there.
         $$Q^\pi(1,\text{right})=-1+0.9\times8=6.2.$$

      2. **Move left.** Cell 1 has a wall on its left, so the robot pays $-1$ and stays in cell 1, then follows the policy from there.
         $$Q^\pi(1,\text{left})=-1+0.9\times6.2=4.58.$$

      3. **Check against the state value.** The policy always moves right, so the state value should equal the action value for right.
         $$V^\pi(1)=Q^\pi(1,\text{right})=6.2.$$

      Bumping into the wall wastes a step, so it's worth $6.2-4.58=1.62$ less than moving right.
