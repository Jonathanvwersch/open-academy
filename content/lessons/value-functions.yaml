  - id: vf-bellman-optimality
    title: "Find the most reward the robot can get"
    explain: |
      ### The best the robot can do

      We want the most return any policy could collect from each cell. Our robot moves left or right along four cells numbered left to right, staying put at a wall. Entering cell 4 ends the episode with $+10$; other moves pay $-1$, and $\gamma=0.9$. We know where each move leads and what it pays.

      The **optimal state value** $V^*(s)$ is that largest return from state $s$. The **optimal action value** $Q^*(s,a)$ is the expected return from taking action $a$ in state $s$ and acting as well as possible after that.

      ### The Bellman optimality equation

      The **Bellman optimality equation** takes the best action:

      $$V^*(s)=\max_a E\big[\,r+\gamma V^*(s')\,\big].$$

      Here $\max_a$ means "the largest over all actions $a$", and $E$ averages over the next state. For a move with one outcome,

      $$Q^*(s,a)=r+\gamma V^*(s').$$

      ### Backups that spread the reward

      An **estimate** is a guessed state value. A **backup** updates it using the equation above. One **sweep** updates every cell from the previous sweep's estimates. Cell 4 stays at $0$ because the episode ends there. Starting other estimates at $0$ gives:

      | Sweep | $V(1)$ | $V(2)$ | $V(3)$ |
      | --- | --- | --- | --- |
      | 0 | $0$ | $0$ | $0$ |
      | 1 | $-1$ | $-1$ | $10$ |
      | 2 | $-1.9$ | $8$ | $10$ |
      | 3 | $6.2$ | $8$ | $10$ |
      | 4 | $6.2$ | $8$ | $10$ |

      In sweep 1, only cell 3 reaches the goal, earning $10$; every other move gives $-1+0.9\times0=-1$. In sweep 2, cell 2 uses cell 3's $10$ to get $8$, while cell 1 gets $-1+0.9\times(-1)=-1.9$. Each sweep carries the $+10$ one cell back. After sweep 3 nothing changes, so these are $V^*$, matching "always move right", a best policy.

      Repeating sweeps is **value iteration**.

      ### Reading off the best move

      With $V^*$ known, choose the action with largest $Q^*$. In cell 2, $Q^*(2,\text{right})=-1+0.9\times10=8$ and $Q^*(2,\text{left})=-1+0.9\times6.2=4.58$, so the best move is right.

      Be careful not to pick a move by its next reward alone. In cell 2 both moves give $-1$, and only the values of the cells they lead to tell them apart.
    worked: |
      Let's do the backup that fills in $V(1)$ in sweep 3. The estimates from sweep 2 are $V(1)=-1.9$ and $V(2)=8$, with $\gamma=0.9$.

      1. **Look one step ahead to the right.** Moving right pays $-1$ and lands in cell 2.
         $$-1+0.9\times8=6.2.$$

      2. **Look one step ahead to the left.** The wall keeps the robot in cell 1, so it pays $-1$ and uses cell 1's own estimate.
         $$-1+0.9\times(-1.9)=-2.71.$$

      3. **Take the larger.** The optimality equation keeps the best action's value.
         $$V(1)\leftarrow\max(6.2,\,-2.71)=6.2.$$

      After sweep 2, cell 2's estimate of $8$ already includes the $+10$. So this backup carries the $+10$ one more cell back, to cell 1.
    problems:
      - vf-bellman-optimality-basics
      - vfp-sweep-self-explain
      - vfp-average-or-max
      - vfp-optimal-backup-template
      - vfp-slow-spread
      - vfp-wall-q-star
      - vfp-greedy-reward-mistake
