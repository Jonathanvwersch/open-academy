concept: weight-init-normalization
version: 1
objective: |
  **Goal:** explain why a network's activations and slopes vanish or explode as they pass through many layers, how choosing the size of the starting weights prevents it, and what layer normalization (and batch normalization) does to keep each layer's outputs at a steady size.
recap:
  - concept: backpropagation
    text: "Backpropagation passes the loss's slope backwards, multiplying it by each operation's local derivative, so multiplying by a weight $w$ multiplies the slope by $w$. An example is one input to the network, and a batch holds many."
  - concept: gradient-descent
    text: "Gradient descent updates a weight by subtracting the learning rate times the loss's slope for that weight."
where_this_fits: |
  ### What are initialization and normalization?

  Initialization is how we choose a network's weights before training starts. Normalization is an extra step inside the network that rescales a layer's outputs so they stay about the same size. Both stop the numbers in a deep network from growing or shrinking out of control.

  Why does that matter? Every layer multiplies the numbers passing through it. If each layer doubles its input, ten layers make it about a thousand times bigger. Backpropagation multiplies the slopes in the same way. A tiny slope barely moves a weight, while a huge slope can move it too far in one update. Well-sized starting weights stop each layer from growing or shrinking the numbers, and normalization keeps it that way during training.
knowledge_points:
  - id: wi-depth-chain
    title: "Follow a number through many layers"
    tldr: |
      - Each layer multiplies the number it receives by a weight.
      - Repeating this can make the outputs grow huge or shrink towards zero.
      - Slopes do the same on the way back, making training unstable or very slow.
    explain: |
      ### A chain of layers

      Let's start with the simplest deep network we can draw, a chain of layers with one neuron each. We leave out the bias (the number a neuron adds) and the ReLU (which turns negative numbers into $0$). Each layer multiplies the number it receives by its weight and passes the result on. We'll give every layer the same weight $w$ and feed in the input $x=1$.

      The picture shows three chains. With $w=2$, the number doubles at every layer. With $w=1$, it stays at $1$. With $w=0.5$, it halves at every layer.

