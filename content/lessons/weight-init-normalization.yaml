      <path d="M368 288 L392 288" stroke="#3b82f6" stroke-width="2" marker-end="url(#wi1-blue)"/>
      <rect x="395" y="268" width="95" height="40" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="442.5" y="293" text-anchor="middle">0.125</text>
      <path d="M493 288 L517 288" stroke="#3b82f6" stroke-width="2" marker-end="url(#wi1-blue)"/>
      <rect x="520" y="268" width="95" height="40" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="567.5" y="293" text-anchor="middle">0.0625</text>
      </g>
