      ### Growing or shrinking with depth

      The numbers a layer outputs are often called its **activations**. Here the output of layer $k$, which we write $h_k$, is $w$ times the output before it, so after $d$ layers the input has been multiplied by $w$ once per layer:

      $$h_d=w^d\,x$$

      When the weight's size, ignoring its sign, is above $1$, the activations grow very fast with depth, which we call **exploding activations**. When it's below $1$, they shrink towards $0$, which we call **vanishing activations**. Only a weight whose size is close to $1$ keeps them a sensible size.

      ### The slopes do the same on the way back

      In the backpropagation lesson, we passed the loss's slope backwards and multiplied it by each operation's local derivative. Each layer here computes $h_k=w\,h_{k-1}$, so its local derivative for its input is $w$. The slope is therefore multiplied by $w$ at every layer it passes back through. With a weight of $0.5$, the slopes that reach the first layers are tiny, so those weights hardly change in training, which is called **vanishing gradients**. With a weight of $2$ they're huge, so each update throws those weights far off, which is called **exploding gradients**.

      Even a weight only a little above $1$ grows large in a deep network. With a weight of $1.1$, fifty layers multiply the input by about $117$.
    worked: |
      Let's follow a chain of four layers, each with weight $w=0.5$, from the input $x=1$, and say the loss's slope for the last output is $1$.

      1. **Run the forward pass.** Each layer halves the number it receives.
         $$h_1=0.5,\quad h_2=0.25,\quad h_3=0.125,\quad h_4=0.0625$$
      2. **Pass the slope back through the layers.** Each layer's local derivative for its input is $w=0.5$, so the slope halves at every layer.
         $$\frac{\partial L}{\partial h_4}=1,\quad \frac{\partial L}{\partial h_3}=0.5,\quad \frac{\partial L}{\partial h_2}=0.25,\quad \frac{\partial L}{\partial h_1}=0.125$$
      3. **Find the first weight's slope.** Let's call the first layer's weight $w_1$, so $h_1=w_1x$. To turn the slope for $h_1$ into a slope for $w_1$, we multiply by the local derivative of $h_1$ for $w_1$, which is $x=1$.
         $$\frac{\partial L}{\partial w_1}=0.125\times1=0.125$$

      After only four layers, the first weight gets $0.5^3$, an eighth of the slope that arrived at the output, because the slope halves once for each of the three layers after the first. With ten layers it would halve nine times, to $0.5^9$, about $0.002$. With a weight of $2$ it would double nine times instead, to $2^9=512$.
