      - wip-ln-robot
  - id: wi-batch-norm
    title: "Rescale across a batch instead"
    tldr: |
      - Batch normalization does the same rescaling for each neuron, across a batch of examples.
      - So each example's result depends on which other examples share its batch, and small batches make it jumpy.
      - After training it must fall back on saved averages, so layer normalization suits networks that run on one input at a time.
