  - id: wi-batch-norm
    title: "Rescale across a batch instead"
    explain: |
      ### Rows and columns of a batch

      Layer normalization, or LayerNorm, rescales one example's layer outputs by subtracting their mean and dividing by their standard deviation. Standard deviation measures spread: square the differences from the mean, average them and take the square root. Another common method works across a batch, the group of examples the network processes together. When a layer runs on a batch, its outputs form a grid with one row per example and one column per neuron. Below, example 1's row holds the outputs $1$, $7$, $9$ and $15$.

