      <circle cx="292" cy="240" r="6" fill="#10b981"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="292" y="228" text-anchor="middle" fill="#10b981">−0.2</text>
      <circle cx="348" cy="240" r="6" fill="#10b981"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="348" y="228" text-anchor="middle" fill="#10b981">0.2</text>
      <circle cx="516" cy="240" r="6" fill="#10b981"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="516" y="228" text-anchor="middle" fill="#10b981">1.4</text>
      </g>
      </svg>
      ```

      ### What layer normalization does

      **Layer normalization**, or LayerNorm, takes one example's outputs from a layer, subtracts their mean and divides by their standard deviation:

      $$\hat h_i=\frac{h_i-\mu}{s}$$

      Here $h_i$ is the output of neuron $i$, the hat on $\hat h_i$ (read "h-hat") marks its normalized value, $\mu$ (the Greek letter mu) is the mean of the outputs, and $s$ is their standard deviation. Then LayerNorm multiplies each $\hat h_i$ by a learned **gain** $\gamma$ (gamma) and adds a learned **shift** $\beta$ (beta), giving $\gamma\hat h_i+\beta$. Training adjusts these like weights, so the network can still pick another size or centre if that helps. They usually start at $\gamma=1$ and $\beta=0$.

      Now let's see what happens when the outputs drift, changing size or all moving up, keeping the gain at $1$ and the shift at $0$.

      - $1, 7, 9, 15$ give $-1.4, -0.2, 0.2, 1.4$.
      - $10, 70, 90, 150$, ten times bigger, have mean $80$ and standard deviation $50$, and give the same four numbers.
      - $101, 107, 109, 115$, all moved up by $100$, give the same four numbers again.

      If all the outputs are equal, then $s=0$ and we'd divide by zero. So in practice we add a tiny number to $s^2$ before the square root, dividing by $\sqrt{s^2+0.00001}$ instead.
    worked: |
      Let's normalize the outputs $4$, $8$, $10$, $12$ and $16$ of a five-neuron layer for one example, with the gain $\gamma=1$ and the shift $\beta=0$.

      1. **Find the mean.** We add the five outputs and divide by $5$.
         $$\mu=\frac{4+8+10+12+16}{5}=\frac{50}{5}=10$$
      2. **Subtract the mean.** This centres the outputs on $0$.
         $$-6,\ -2,\ 0,\ 2,\ 6$$
      3. **Find the standard deviation.** We square the differences, average them and take the square root. Normalization divides by all $5$ outputs, not by one less as a sample standard deviation does.
         $$s=\sqrt{\frac{36+4+0+4+36}{5}}=\sqrt{16}=4$$
      4. **Divide by it.** This makes the typical size $1$.
         $$\hat h=-1.5,\ -0.5,\ 0,\ 0.5,\ 1.5$$

      Whatever size the five outputs had, the next layer now receives numbers centred on $0$ with typical size $1$.
    problems:
      - wi-layer-norm-basics
      - wip-ln-self-explain
      - wip-ln-mean
      - wip-ln-std-template
      - wip-ln-value
      - wip-ln-drift
