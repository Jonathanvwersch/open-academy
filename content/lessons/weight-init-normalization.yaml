      ### Growing or shrinking with depth

      The numbers a layer outputs are often called its **activations**. Write $h_k$ for layer $k$'s output. Repeated multiplication gives:
      $$
      \begin{aligned}
      h_1&=wx &&\text{multiply the input}\\
      h_2&=w(wx)=w^2x &&\text{multiply once more}\\
      h_d&=w^d x &&\text{repeat for }d\text{ layers}
      \end{aligned}
      $$

      When the weight's size, ignoring its sign, is above $1$, the activations grow very fast with depth, which we call **exploding activations**. When it's below $1$, they shrink towards $0$, which we call **vanishing activations**. Only a weight whose size is close to $1$ keeps them a sensible size.

      ### The slopes do the same on the way back

      In the backpropagation lesson, we passed the loss's slope backwards and multiplied it by each operation's local derivative. Each layer here computes $h_k=w\,h_{k-1}$, so its local derivative for its input is $w$. The slope is therefore multiplied by $w$ at every layer it passes back through. With a weight of $0.5$, the slopes that reach the first layers are tiny, so those weights hardly change in training, which is called **vanishing gradients**. With a weight of $2$ they're huge, so each update throws those weights far off, which is called **exploding gradients**.

      Even a weight only a little above $1$ makes the numbers grow large in a deep network. With a weight of $1.1$, fifty layers multiply the input by:

      $$1.1^{50}\approx117.$$
    worked: |
      Let's follow a chain of four layers, each with weight $w=0.5$, from the input $x=1$, and say the loss's slope for the last output is $1$.

      1. **Run layer 1.** Halve the input.
         $$h_1=0.5\times1=0.5$$
      2. **Run layer 2.** Halve its input again.
         $$h_2=0.5\times0.5=0.25$$
      3. **Run layer 3.** Repeat the multiplication.
         $$h_3=0.5\times0.25=0.125$$
      4. **Run layer 4.** This gives the final output.
         $$h_4=0.5\times0.125=0.0625$$
      5. **Start with the output slope.** This was given as $1$.
         $$\frac{\partial L}{\partial h_4}=1$$
      6. **Pass back through layer 4.** Multiply by its local derivative, $0.5$.
         $$\frac{\partial L}{\partial h_3}=1\times0.5=0.5$$
      7. **Pass back through layer 3.** The slope halves again.
         $$\frac{\partial L}{\partial h_2}=0.5\times0.5=0.25$$
      8. **Pass back through layer 2.** This reaches the first layer's output.
         $$\frac{\partial L}{\partial h_1}=0.25\times0.5=0.125$$
      9. **Find the first weight's slope.** Let's call the first layer's weight $w_1$, so $h_1=w_1x$. To turn the slope for $h_1$ into a slope for $w_1$, we multiply by the local derivative of $h_1$ for $w_1$, which is $x=1$.
         $$\frac{\partial L}{\partial w_1}=0.125\times1=0.125$$

      The slope passes through every layer after the first. Starting with output slope $1$, compare three chains:
      $$
      \begin{aligned}
      \text{four layers, }w=0.5&:\ 0.5^{4-1}=0.125 &&\text{halve three times}\\
      \text{ten layers, }w=0.5&:\ 0.5^{10-1}\approx0.002 &&\text{halve nine times}\\
      \text{ten layers, }w=2&:\ 2^{10-1}=512 &&\text{double nine times}
      \end{aligned}
      $$
      Four layers already leave an eighth of the arriving slope. More layers magnify the change.
