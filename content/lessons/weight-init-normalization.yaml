      ### Batch normalization

      **Batch normalization**, or BatchNorm, normalizes each neuron's column separately: it subtracts that neuron's mean over the examples in the batch and divides by its standard deviation over them. Then, like LayerNorm, it multiplies by a learned gain and adds a learned shift. BatchNorm came first, and it's still common in networks trained on large batches. The two methods do the same arithmetic in different directions. LayerNorm goes along a row, the green outline, and BatchNorm goes down a column, the orange outline.

      Neuron 1's column holds $1$, $5$, $1$ and $5$, and the worked example below normalizes it.

      ### Limitations of batch normalization

      Because BatchNorm averages over the batch, each example's output depends on which other examples are in the batch with it.

      - With small batches, the mean and standard deviation jump around from batch to batch. With only two examples, the mean sits halfway between the two values, so both differ from it by the same amount, which is their standard deviation. Dividing by it turns any two different values into $-1$ and $1$.
      - A trained network often runs on one example, with no batch to average over. So during training, BatchNorm keeps a running average of each neuron's mean and of its squared standard deviation across batches. Afterwards it uses those saved values, and the network behaves a little differently than it did in training.

      LayerNorm needs only the example itself, so it works the same in training and afterwards, with any batch size. That suits a network that often runs on one input at a time, such as a robot's controller reading its sensors.
    worked: |
      Let's apply BatchNorm to neuron 1 in the grid, whose outputs for the four examples are $1$, $5$, $1$ and $5$, with the gain $1$ and the shift $0$.

      1. **Find the neuron's mean over the batch.** We add down the column and divide by the $4$ examples.
         $$\mu=\frac{1+5+1+5}{4}=3$$
      2. **Find its standard deviation.** The differences from the mean are $-2$, $2$, $-2$ and $2$.
         $$s=\sqrt{\frac{4+4+4+4}{4}}=\sqrt4=2$$
      3. **Normalize each example's output.** Example 1 has the output $1$.
         $$\hat h=\frac{1-3}{2}=-1$$

      Doing the same for the others gives $-1$, $1$, $-1$ and $1$. Example 1's value depends on the other three examples. LayerNorm on example 1's row gave $-1.4$ for the same output, $1$, because LayerNorm compared that output with the other outputs in example 1's row instead.
