      <path d="M180 240 v6" stroke="#737373"/><text x="180" y="264" text-anchor="middle" fill="#737373">−1</text>
      <path d="M320 240 v6" stroke="#737373"/><text x="320" y="264" text-anchor="middle" fill="#737373">0</text>
      <path d="M460 240 v6" stroke="#737373"/><text x="460" y="264" text-anchor="middle" fill="#737373">1</text>
      <path d="M600 240 v6" stroke="#737373"/><text x="600" y="264" text-anchor="middle" fill="#737373">2</text>
