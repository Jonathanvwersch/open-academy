      <circle cx="292" cy="240" r="6" fill="#10b981"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="292" y="228" text-anchor="middle" fill="#10b981">−0.2</text>
      <circle cx="348" cy="240" r="6" fill="#10b981"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="348" y="228" text-anchor="middle" fill="#10b981">0.2</text>
      <circle cx="516" cy="240" r="6" fill="#10b981"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="516" y="228" text-anchor="middle" fill="#10b981">1.4</text>
