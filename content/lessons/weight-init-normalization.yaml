summary: |
  - Each layer multiplies the numbers passing through it, so after $d$ layers a chain with weight $w$ gives $h_d=w^dx$: activations explode when the factor's size is above $1$ and vanish when it's below $1$, and backpropagation's slopes do the same.
  - A neuron with $n$ inputs and random weights of typical size $a$ gives scores whose average square is $n\,a^2$ when the inputs have typical size $1$, so LeCun initialization uses $a=1/\sqrt n$, and He initialization uses $a=\sqrt{2/n}$ for ReLU layers.
  - Layer normalization rescales one example's outputs from a layer to $\hat h_i=(h_i-\mu)/s$, mean $0$ and standard deviation $1$, then applies a learned gain $\gamma$ and shift $\beta$, so drift in the weights doesn't change the size the next layer sees.
  - Batch normalization does the same for each neuron across the examples in a batch, which makes it depend on the batch, while LayerNorm needs only the example itself.

  **Next:** The transformer block lesson builds the repeated block inside language models, which uses layer normalization to keep a very deep network trainable.
