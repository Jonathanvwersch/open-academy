summary: |
  - An ML compiler records a computational graph, splitting where a Python decision depends on tensor values, then lowers it to primitives: elementwise, reduce and movement. Eager execution starts operations as Python reaches them; the graph exposes opportunities to merge them.
  - Kernel fusion keeps in-between results on chip and reduces launch overhead. In our traffic model, $k$ elementwise operations on $S$ bytes move $2kS$ bytes eagerly and $2S$ fused. For our large, memory-bound chain, estimated time falls by the same factor as bytes.
  - An e-graph keeps equivalent versions in groups. Equality saturation applies rewrite rules until nothing new appears, and extraction picks the cheapest by a cost model. Our toy rules assume exact real arithmetic; rewrites for real machines must follow the compiler's rules for rounding and numbers too large to store.
  - Autotuning times candidate kernels on the real GPU and shape and keeps the fastest. Bytes moved divided by bandwidth gives the fastest time a memory-bound kernel could possibly take.

  **Next:** In the course project, you'll write a tiny graph compiler in Python that records elementwise operations, fuses each chain into one kernel and measures the speed-up.
