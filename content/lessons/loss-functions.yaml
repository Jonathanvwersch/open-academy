concept: loss-functions
version: 2
objective: |
  **Goal:** compute MSE and MAE, explain how their slopes treat large errors, and choose the best constant prediction for each loss.
knowledge_points:
  - id: loss-measure-misses
    title: Two ways to measure a missed price
    explain: |
      You predict three house prices in thousands of pounds: 370, 300 and 540. They sell for 360, 290 and 560. Your errors are +10, +10 and −20. Their average is zero, but you have not priced any house correctly. You need a loss that prevents opposite errors cancelling.

      One choice is to square each error, then average. This is **mean squared error (MSE)**. Another is to remove each error's sign, then average. This is **mean absolute error (MAE)**. Absolute value, written with bars, means distance from zero: $|-20|=20$.

      Write $\hat y_i$ for house $i$'s predicted price, $y_i$ for its actual price, and $n$ for the number of houses. The subscript $i$ identifies a house; $\sum_{i=1}^n$ means add across all houses:

      $$\text{MSE}=\frac{1}{n}\sum_{i=1}^n(\hat y_i-y_i)^2,\qquad \text{MAE}=\frac{1}{n}\sum_{i=1}^n|\hat y_i-y_i|.$$

      Averaging keeps the scale unchanged if you repeat the same sales. MAE is in thousands of pounds; MSE is in squared thousands of pounds, so their numbers are not directly comparable.
    worked: |
      This example shows every step of calculating both losses.

      | Prediction | Actual price | Error | Squared error | Absolute error |
      |---|---|---|---|---|
      | 370 | 360 | $370-360=10$ | $10^2=100$ | $\lvert10\rvert=10$ |
      | 300 | 290 | $300-290=10$ | $10^2=100$ | $\lvert10\rvert=10$ |
      | 540 | 560 | $540-560=-20$ | $(-20)^2=400$ | $\lvert-20\rvert=20$ |

      MSE is $(100+100+400)/3=200$. MAE is $(10+10+20)/3\approx13.33$.

      Repeating all rows gives MSE $1200/6=200$ and MAE $80/6\approx13.33$: the averages stay the same, unlike the totals.
    problems:
      [
        lossp-measure,
        lossp-mse-template,
        lossp-mae-template,
        lossp-cancellation,
        lossp-repeat,
        lossp-units,
      ]
  - id: loss-large-errors
    title: Why a large miss pulls harder under squared error
    explain: |
      Suppose your house-price errors are 1, 1 and 9 thousand pounds. Should the last sale cost nine times as much as either small miss, or 81 times as much? Choosing a loss means choosing which mistakes matter most.

      Squared error makes large misses disproportionately costly. An **outlier** is an unusually distant value, such as a sale price recorded with an extra zero. Under MSE, that one sale can outweigh many ordinary ones. MAE charges the same extra amount for each extra unit of error.

      The slope shows the difference too. Let $r=\hat y-y$ be one house's error, with prediction $\hat y$ and target $y$. Write $\ell$ ("ell") for its loss. For $\ell=r^2$, the derivative with respect to the prediction is $d\ell/d\hat y=2r$: bigger errors give steeper slopes.

      For $\ell=|r|$, the derivative is +1 above the target and −1 below it. This is $\operatorname{sign}(r)$ away from zero. The sign function is 0 at zero, but absolute error has a corner there, so no ordinary derivative exists at that point.

      For a mean loss over $n$ houses, divide each house's contribution by $n$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" aria-label="Squared error has a smooth bowl whose slopes steepen away from zero; absolute error has straight sides and a corner at zero">
        <path d="M30 25 V175 H275 M325 25 V175 H570" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="2"/>
        <path d="M55 55 Q155 285 255 55" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="3"/>
        <path d="M350 55 L450 170 L550 55" fill="#171717" fill-opacity="0" stroke="#f59e0b" stroke-width="3"/>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text x="50" y="18">Squared error: changing slope</text><text x="340" y="18">Absolute error: fixed slope size</text><text x="145" y="195">0</text><text x="440" y="195">0</text><text x="200" y="213">Price error</text><text x="495" y="213">Price error</text>
        </g>
      </svg>
      ```
    worked: |
      This example shows the cost and slope of a large house-price error.

      For errors 1, 1 and 9, MSE is $(1+1+81)/3=83/3\approx27.67$. MAE is $(1+1+9)/3=11/3\approx3.67$.

      | Individual error | Squared-error slope | Absolute-error slope |
      |---|---|---|
      | 1 | $2\times1=2$ | +1 |
      | 9 | $2\times9=18$ | +1 |
      | −9 | $2\times(-9)=-18$ | −1 |

      If each listed error belonged to a three-house average, its squared-error slope contribution would be $2/3$, $18/3=6$ or $-18/3=-6$ respectively; its absolute-error contribution would be $1/3$, $1/3$ or $-1/3$.

      Check suspicious labels too: changing the loss reduces their influence but does not repair them.
    problems:
      [
        lossp-outlier,
        lossp-slope-template,
        lossp-square-template,
        lossp-mae-slope,
        lossp-corner,
        lossp-sensor,
      ]
  - id: loss-constant-choice
    title: Which single price should you predict
    explain: |
      You need a baseline that predicts one price for every house. Your three sales are 290, 300 and 560 thousand pounds. No constant gets all three right. Which compromise should you choose?

      Under MSE, the best constant is the **mean**: add the prices and divide by their count. Here it is $(290+300+560)/3\approx383.33$. The expensive sale pulls this choice upwards. At the mean, the positive and negative squared-error slopes balance.

      Under MAE, the best constant is a **median**: order the prices and choose the middle value, here 300. Moving slightly above 300 increases the distances to 290 and 300 while only reducing the distance to 560. The total therefore grows. Moving below 300 also increases it.

      Neither choice is universally right. MSE suits a goal that penalises large misses especially strongly. MAE suits a goal based on typical absolute distance and is less pulled by extreme values.

      For an even count, any value between the two middle prices minimises MAE; their average is a conventional median.
    worked: |
      This example shows how the loss changes the best constant house price.

      Measure prices in tens of thousands of pounds to shorten the arithmetic: the targets are 29, 30 and 55. Their mean is $(29+30+55)/3=38$; their median is 30.

      | Constant | Squared-error total | Absolute-error total |
      |---|---|---|
      | 38 | $9^2+8^2+(-17)^2=81+64+289=434$ | $9+8+17=34$ |
      | 30 | $1^2+0^2+(-25)^2=1+0+625=626$ | $1+0+25=26$ |

      Dividing each total by 3 preserves the comparison: the mean wins under MSE, while the median wins under MAE.
    problems:
      [
        lossp-constant,
        lossp-mean-template,
        lossp-median-template,
        lossp-extreme-sale,
        lossp-even,
        lossp-route,
      ]
final: loss-explain-choice
summary: |
  - MSE averages squared errors; MAE averages absolute errors. Both prevent cancellation and stay on the same scale when data is repeated.
  - Squared-error slopes grow with the error; absolute-error slopes have constant magnitude away from zero, so outliers pull less under MAE.
  - The best constant is the mean for MSE and a median for MAE; choose the loss according to which mistakes matter.
