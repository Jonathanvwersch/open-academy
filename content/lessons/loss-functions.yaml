concept: loss-functions
version: 3
objective: |
  **Goal:** compute MSE and MAE, explain how their slopes treat large errors, and choose the best constant prediction for each loss.
where_this_fits: |
  The derivatives lesson showed how a small change to one house-model weight changes a loss. We still need to choose what loss to calculate: signed errors can cancel, and a very large price miss may deserve more attention than a small one. This lesson compares mean squared error and mean absolute error, then finds the best constant-price baseline. The next lesson separates the loss slope for each of a model's weights.
knowledge_points:
  - id: loss-measure-misses
    title: Two ways to measure a missed price
    explain: |
      **What a loss is.** A loss is a non-negative score for how far a model's prediction is from the true price. Mean squared error (MSE) squares each miss and averages; mean absolute error (MAE) takes each miss's absolute value and averages.

      For $n$ houses, $\hat y_i$ is house $i$'s predicted price and $y_i$ its sale price. Absolute value, written with bars, is distance from zero, so $|-20|=20$.

      **How it works.** The error is predicted price minus sale price. For three houses with errors $10,10,-20$ thousand pounds, the signed average is zero even though none is exact. Squaring or taking absolute values prevents opposite errors from cancelling. The formulas are:

      $$\text{MSE}=\frac{1}{n}\sum_{i=1}^n(\hat y_i-y_i)^2,\qquad \text{MAE}=\frac{1}{n}\sum_{i=1}^n|\hat y_i-y_i|.$$

      MSE is in squared thousands of pounds; MAE is in thousands of pounds.

      **Why this is useful.** Averaging the house-price losses gives one score that can compare models without overpricing cancelling underpricing.
    worked: |
      This example shows both losses for three house sales.

      The errors are $10,10,-20$ thousand pounds. Their squared errors are $100,100,400$, so MSE is $600/3=200$. Their absolute errors are $10,10,20$, so MAE is $40/3\approx13.33$.

      Repeating each sale does not change either average because both the total and the house count double.
    problems:
      [
        lossp-why-not-count,
        lossp-mse-template,
        lossp-mae-template,
        lossp-cancellation,
        lossp-repeat,
        lossp-units,
      ]
  - id: loss-large-errors
    title: Why a large miss pulls harder under squared error
    explain: |
      **What changes when an error is large.** Squared loss makes a large miss count disproportionately more; absolute loss increases at a constant rate as the miss grows.

      **How it works.** For one house with area 12 and sale price 330, the one-weight model has prediction $12w$ and squared loss $L(w)=(12w-330)^2=144w^2-7920w+108900$. Its derivative is $288w-7920$, which is $-720$ at $w=25$. There, the MAE is $330-12w$, so its slope is $-12$. Above the exact price its slope is $+12$, and at the exact price it has a corner with no ordinary derivative.

      A nine-thousand-pound miss contributes 81 to squared error but 9 to absolute error. This is why a wrongly recorded extreme sale can dominate MSE; MAE limits its pull.

      **Why this is useful.** Choose MAE for house sales when an extreme or misrecorded price should not dominate the model's fit.
    worked: |
      This example shows how error size changes each house-price loss.

      For a miss of 1 thousand pounds, squared error is $1^2=1$ and absolute error is 1. For a miss of 9, squared error is $9^2=81$ and absolute error is 9.

      MSE gives the larger miss 81 times the squared-error cost; MAE gives it 9 times the cost. Thus MSE emphasizes large misses more strongly.
    problems:
      [
        lossp-outlier,
        lossp-slope-template,
        lossp-why-square,
        lossp-mae-slope,
        lossp-corner,
        lossp-sensor,
      ]
  - id: loss-constant-choice
    title: Which single price should you predict
    explain: |
      **What a baseline is.** A baseline is a simple model used to check whether a more detailed house-price model is useful. A constant baseline predicts the same price for every house.

      **How it works.** The mean is the arithmetic average; the median is the middle value after prices are sorted. Under MSE, the best constant is the mean because squared-error slopes balance at the average. Under MAE, a median minimizes the total absolute distance because at least half the prices lie on each side.

      For sale prices 290, 300 and 560 thousand pounds, the mean is about 383.33 and the median is 300. The mean is pulled toward the high sale; the median is not. For an even number of prices, any value between the middle pair minimizes MAE.

      **Why this is useful.** Comparing a fitted model with the mean-price baseline shows whether its house features improve on predicting one average price.
    worked: |
      This example shows why the mean and median win under different losses.

      For prices 290, 300 and 560, the mean is $(290+300+560)/3=383.33$ and the median is 300.

      At 383.33, the squared-error total is approximately $93.33^2+83.33^2+(-176.67)^2=46{,}866.67$. At 300, it is $10^2+0^2+(-260)^2=67{,}700$.

      At 383.33, the absolute-error total is about 353.33. At 300, it is $10+0+260=270$. The mean minimizes squared error; the median minimizes absolute error.
    problems:
      [
        lossp-why-median,
        lossp-mean-template,
        lossp-median-template,
        lossp-extreme-sale,
        lossp-even,
        lossp-route,
      ]
final: loss-explain-choice
summary: |
  - MSE averages squared house-price errors; MAE averages their absolute values.
  - Squared loss pulls more strongly on large errors, while MAE is less affected by an extreme sale.
  - The mean is the best constant under MSE; a median is best under MAE.

  **Next:** Partial derivatives find the loss slope for each weight while holding the others fixed.
