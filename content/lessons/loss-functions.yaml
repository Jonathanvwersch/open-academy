summary: |
  - A loss turns a model's errors into one score. MAE averages the error sizes and MSE averages their squares, so opposite errors can't cancel.
  - Doubling a miss doubles its absolute error but quadruples its squared error. The squared-error slope $2e$ grows with the miss, while the absolute-error slope is $+1$ or $-1$.
  - The best constant prediction is the mean under MSE and the median under MAE, so a far-off value moves only the MSE choice.

  **Next:** Partial derivatives find the loss slope for each of a model's weights, holding the others fixed.
