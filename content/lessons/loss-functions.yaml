  - id: loss-constant-choice
    title: "The best single prediction: mean or median"
    explain: |
      **The question.** The simplest model ignores its inputs and predicts the same number $c$ for every example; any real model has to beat it. Which $c$ gives the smallest loss? The answer depends on the loss.

      **Picture it.** Take three true values: $1$, $2$ and $6$ (the black dots). The left plot shows the total squared error $(c-1)^2+(c-2)^2+(c-6)^2$ for each choice of $c$. It is a bowl, lowest at $c=3$. The right plot shows the total absolute error $|c-1|+|c-2|+|c-6|$. It is made of straight pieces and is lowest at $c=2$, the middle value. The far value $6$ drags only the squared-error choice towards itself.

