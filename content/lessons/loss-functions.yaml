      **The idea.** A **baseline** is a deliberately simple model used as a reference: a more detailed model is only worth using if it beats the baseline's loss. For a constant baseline, the best $c$ is:
      - under MSE, the **mean**: the sum of the values divided by how many there are;
      - under MAE, the **median**: the middle value once the values are sorted. With an even count, every value between the two middle ones gives the same total, so any of them is best.

      Why: by the slopes from the last step, under squared error each value pulls on $c$ in proportion to its distance, so the pulls balance at the mean. Under absolute error each value pulls with size $1$, so the pulls balance where as many values lie above $c$ as below. Dividing a total by $n$ doesn't move its lowest point, so the total loss and the average loss pick the same $c$.

      **Common confusion.** “The best single prediction is always the average.” Only under MSE. Under MAE the average $3$ gives total absolute error $2+1+3=6$, worse than the median's $1+0+4=5$.
    worked: |
      Find the best constant $c$ for the values $1$, $2$ and $6$ under each loss.

      1. **Find the slope of the total squared error.** Use the slope $2(c-y)$ for each value and add:
         $$\frac{d}{dc}\left[(c-1)^2+(c-2)^2+(c-6)^2\right]=2(c-1)+2(c-2)+2(c-6)$$
         $$=6c-18$$

      2. **Set the slope to zero.** The total is a U-shaped curve, and its bottom is where its slope is zero:
         $$6c-18=0\quad\Rightarrow\quad c=3=\frac{1+2+6}{3}$$

      3. **Find the slope of the total absolute error on each side of 2.** Each value below $c$ adds $+1$; each value above adds $-1$.
         $$1<c<2:\quad (+1)+(-1)+(-1)=-1$$
         $$2<c<6:\quad (+1)+(+1)+(-1)=+1$$
      4. **Check the ends and read off the lowest point.** Below $1$ the slope is $-3$ and above $6$ it is $+3$, so the total falls until $c=2$ and rises after it: $c=2$ is lowest.

      5. **Compare the totals at both choices.**
         $$c=3:\quad \text{squared } 4+1+9=14,\qquad \text{absolute } 2+1+3=6$$
         $$c=2:\quad \text{squared } 1+0+16=17,\qquad \text{absolute } 1+0+4=5$$

      **Compare cases.**

      | Values | Mean (best under MSE) | Median (best under MAE) |
      | --- | --- | --- |
      | $1,2,3$ | $2$ | $2$ |
      | $1,2,6$ | $3$ | $2$ |
      | $1,2,12$ | $5$ | $2$ |
      | $1,2,6,7$ | $4$ | any value from $2$ to $6$ |

      **Where it shows up.** For house prices, a constant baseline predicts one price for every house, and a fitted model is only worth its house details if its loss beats that baseline's. Changing the priciest sale into a mansion price raises the mean price, the MSE baseline, but leaves the median price, the MAE baseline, where it was.
