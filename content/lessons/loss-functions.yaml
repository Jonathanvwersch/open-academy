      ### The mean and the median

      For any set of values, the best constant prediction is:

      - under MSE, the **mean**, the sum of the values divided by how many there are;
      - under MAE, the **median**, the middle value once they're sorted. With an even number of values, anything between the two middle ones is equally good.

      The slopes from the last step explain why, with $c$ now playing the part of the prediction $\hat y$. At the lowest point the curve is flat, so the slope of the total, the sum of each term's slope, is zero. Under squared error, each term's slope is $2(c-y)$, proportional to the signed distance, and the worked example shows these add to zero at the mean. Under absolute error, every term's slope is $+1$ or $-1$, so they add to zero where as many values lie above $c$ as below it.

      ### Choosing between them

      Use MSE when one big miss really is worse than several small ones of the same total size. But a few wrongly recorded values, say with an extra zero, drag MSE's predictions towards them, as $6$ dragged the mean. MAE resists that pull. However, its slope stays the same size right up to the target, so it never signals that a prediction is nearly right, and at the corner it has no slope.
    worked: |
      Let's find the best constant $c$ for the values $1$, $2$ and $6$ under each loss.

      1. **Find the slope of the total squared error.** Each value adds its own slope, $2(c-y)$, and we collect the terms.
         $$2(c-1)+2(c-2)+2(c-6)=6c-18$$

      2. **Set the slope to zero.** The total is a bowl, and at its bottom the curve is flat, so the slope there is zero.
         $$6c-18=0\quad\Rightarrow\quad c=3=\frac{1+2+6}{3}$$

      3. **Find the slope of the total absolute error on each side of $2$.** A value below $c$ means the prediction is above that target, which adds $+1$, and a value above $c$ adds $-1$.
         $$1<c<2:\ (+1)+(-1)+(-1)=-1$$
         $$2<c<6:\ (+1)+(+1)+(-1)=+1$$

      4. **Check the ends and read off the lowest point.** Below $1$ the slope is $-3$ and above $6$ it is $+3$, so the total falls until $c=2$ and rises after it. That makes $c=2$ the lowest point.

      5. **Compare the totals at the mean.**
         $$\text{squared: }4+1+9=14$$
         $$\text{absolute: }2+1+3=6$$

      6. **Compare the totals at the median.**
         $$\text{squared: }1+0+16=17$$
         $$\text{absolute: }1+0+4=5$$

      So each loss is lowest at its own choice, and each choice loses under the other loss. Be careful not to assume the best single prediction is always the average, since under MAE the average $3$ gives $6$, worse than the median's $5$. The first two rows of the table make one value more extreme, and the last row has an even number of values. The mean, best under MSE, follows the far value, while the median, best under MAE, stays put.

      | Values | Mean | Median |
      | --- | --- | --- |
      | $1,2,6$ | $3$ | $2$ |
      | $1,2,12$ | $5$ | $2$ |
      | $1,2,6,7$ | $4$ | $2$ to $6$ |
