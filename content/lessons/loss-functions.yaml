concept: loss-functions
version: 5
objective: |
  **Goal:** compute MSE and MAE, explain why squared error weighs a large miss much more heavily, and find the best single prediction under each loss: the mean or the median.
recap:
  - concept: supervised-learning
    text: "A model with parameters, like a weight $w$, predicts $\\hat y$ for true value $y$, so its error is $\\hat y-y$. Training picks the parameters with the smallest average loss, and squaring each error stops opposite misses cancelling."
  - concept: derivatives
    text: "The derivative $f'(x)$ is the slope of $f$ at $x$. A small nudge changes the output by about slope times nudge. Powers follow $(x^n)'=nx^{n-1}$."
where_this_fits: |
  ### What is a loss function?

  A loss function is a rule that turns all of a model's errors into one number, a score for how wrong its predictions are. It's $0$ when every prediction is exact and grows as predictions move away from their targets.

  Why does the choice matter? Training makes this score as small as it can, so the loss decides what a good model is. Earlier we squared each error so that opposite misses couldn't cancel. Keeping only each error's size works too, but the two rules disagree about large misses, so they can train different models. Here we'll compute both, see how each reacts to a big miss, and find the best prediction under each for a model that always predicts one number.
knowledge_points:
  - id: loss-measure-misses
    title: "Turn many errors into one score"
    explain: |
      ### Errors that cancel

      A model makes a prediction for each example, and each prediction has an error, the prediction minus the true value. When the model guesses too high the error is positive, and when it guesses too low it's negative. Say a house-price model, with prices in thousands of pounds, misses three houses by $+3$, $+3$ and $-6$. So how do we turn all of these errors into one score?

      The obvious idea is to average the errors. In the picture, each grey arrow starts at $0$ and shows one error's size and direction. The two misses to the right exactly balance the one to the left, so the average is $0$, as if the model were perfect.

      ### Two ways to stop the cancelling

      We need every miss to add to the score, whichever side it's on. One way is to drop the sign and keep the error's size, its **absolute value**, written with bars, so $|-6|=6$. The other is to square the error, because $(-6)^2=36$ is positive too. The picture averages the sizes in green and the squares in blue, and the worked example goes through both.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" aria-label="Three errors drawn as grey arrows starting at zero: plus 3, plus 3 and minus 6. Their signed average is 0. The average of their sizes is 4, and the average of their squares is 18">
      <defs><marker id="l1-muted-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M32 190 H608" stroke="#737373"/>
      <path d="M104 184 V196" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="104" y="214" text-anchor="middle">−6</text>
      <path d="M212 184 V196" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="212" y="214" text-anchor="middle">−3</text>
      <path d="M320 184 V196" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="214" text-anchor="middle">0</text>
      <path d="M428 184 V196" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="428" y="214" text-anchor="middle">+3</text>
      <path d="M536 184 V196" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="536" y="214" text-anchor="middle">+6</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="608" y="180" fill="#737373" text-anchor="end">error</text>
      <path d="M320 40 V190" stroke="#d4d4d4" stroke-dasharray="4 4"/>
      <path d="M320 60 H428" stroke="#737373" stroke-width="3" marker-end="url(#l1-muted-arrow)"/>
      <circle cx="320" cy="60" r="3.5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="440" y="65">prediction 1: +3</text>
      <path d="M320 105 H428" stroke="#737373" stroke-width="3" marker-end="url(#l1-muted-arrow)"/>
      <circle cx="320" cy="105" r="3.5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="440" y="110">prediction 2: +3</text>
      <path d="M320 150 H104" stroke="#737373" stroke-width="3" marker-end="url(#l1-muted-arrow)"/>
      <circle cx="320" cy="150" r="3.5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="332" y="155">prediction 3: −6</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="40" y="252" fill="#737373">signed average: (3 + 3 − 6) / 3 = 0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="40" y="279" fill="#10b981">average size: (3 + 3 + 6) / 3 = 4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="40" y="306" fill="#3b82f6">average square: (9 + 9 + 36) / 3 = 18</text>
      </g></svg>
      ```

      ### The two formulas

      Both scores are losses, and they have names. The **mean absolute error (MAE)** averages the error sizes, and the **mean squared error (MSE)** averages the squared errors. Number the examples from $1$ to $n$, and write $\hat y_i$ and $y_i$ for the prediction and true value of example $i$. The $\sum$ sign adds up one term per example, and dividing by $n$ turns the total into an average.

      $$\text{MAE}=\frac{1}{n}\sum_{i=1}^{n}|\hat y_i-y_i|$$

      $$\text{MSE}=\frac{1}{n}\sum_{i=1}^{n}(\hat y_i-y_i)^2$$

      MAE is in the target's own units, here thousands of pounds. An error of $3$ thousand pounds squares to $9$ squared thousands of pounds, a unit with no everyday meaning, so an MSE can't be compared with a price or an MAE, only with other MSEs.

      Because each error is squared before averaging, a big error counts for much more under MSE than under MAE. The next step shows how much more.
    worked: |
      Let's score the errors $+3$, $+3$ and $-6$ three ways.

      1. **Average the signed errors.** We start with the plain average, to see it fail.
         $$\frac{3+3+(-6)}{3}=0$$

      2. **Take each error's size.** The absolute value drops the sign.
         $$|3|=3,\qquad |3|=3,\qquad |-6|=6$$

      3. **Average the sizes.** This average is the MAE.
         $$\text{MAE}=\frac{3+3+6}{3}=4$$

      4. **Square each error.** A negative number squared is positive, so nothing can cancel.
         $$3^2=9,\qquad 3^2=9,\qquad (-6)^2=36$$

      5. **Average the squares.** This average is the MSE.
         $$\text{MSE}=\frac{9+9+36}{3}=\frac{54}{3}=18$$

      So the signed average says nothing is wrong, while both losses see the misses. Be careful not to treat MSE as MAE squared. Here MAE is $4$ and $4^2=16$, but MSE is $18$. The table shows that the same MAE can hide very different errors. Every row has an MAE of $4$, but the MSE grows as the error sizes become more uneven.

      | Errors | Average | MAE | MSE |
      | --- | --- | --- | --- |
      | $4,4,4$ | $4$ | $4$ | $16$ |
      | $3,3,-6$ | $0$ | $4$ | $18$ |
      | $6,-6,0$ | $0$ | $4$ | $24$ |
      | $0,0,12$ | $4$ | $4$ | $48$ |
