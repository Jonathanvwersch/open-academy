concept: loss-functions
version: 4
objective: |
  **Goal:** compute MSE and MAE, explain why squared error weighs a large miss much more heavily, and find the best single prediction under each loss: the mean or the median.
where_this_fits: |
  Training chooses the model whose average loss is smallest, so the loss decides what a good model means. The supervised-learning lesson squared each error so that misses above and below the target could not cancel. Dropping the sign does that too, but the two choices disagree about large misses, so they can train different models from the same data. This lesson compares them in three steps:

  1. Turn a set of errors into one score: mean squared error (MSE) and mean absolute error (MAE).
  2. See how each score, and its slope, responds to one large miss.
  3. Find the single best prediction under each loss.
knowledge_points:
  - id: loss-measure-misses
    title: Turning errors into one score
    explain: |
      **The question.** A model makes many predictions, each with an error: prediction minus true value. Some errors are positive, some negative. How do you turn all of them into one score that says how wrong the model is?

      **Picture it.** Take the simplest case: three predictions with errors $+3$, $+3$ and $-6$. Each arrow starts at $0$ and shows one error's size and direction. Averaging the signed errors gives $0$, as if the model were perfect. Dropping the signs (green) or squaring (blue) stops the cancelling, and the two averages come out as $4$ and $18$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" aria-label="Three errors drawn as arrows from zero on a number line: plus 3, plus 3 and minus 6. Their signed average is 0; the average of their sizes is 4 (MAE) and the average of their squares is 18 (MSE)">
      <defs><marker id="l1-muted-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M32 190 H608" stroke="#737373"/>
      <path d="M104 184 V196" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="104" y="214" text-anchor="middle">−6</text>
      <path d="M212 184 V196" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="212" y="214" text-anchor="middle">−3</text>
      <path d="M320 184 V196" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="214" text-anchor="middle">0</text>
      <path d="M428 184 V196" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="428" y="214" text-anchor="middle">+3</text>
      <path d="M536 184 V196" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="536" y="214" text-anchor="middle">+6</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="608" y="180" fill="#737373" text-anchor="end">error</text>
      <path d="M320 60 H428" stroke="#737373" stroke-width="3" marker-end="url(#l1-muted-arrow)"/>
      <circle cx="320" cy="60" r="3.5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="440" y="65">prediction 1: +3</text>
      <path d="M320 105 H428" stroke="#737373" stroke-width="3" marker-end="url(#l1-muted-arrow)"/>
      <circle cx="320" cy="105" r="3.5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="440" y="110">prediction 2: +3</text>
      <path d="M320 150 H104" stroke="#737373" stroke-width="3" marker-end="url(#l1-muted-arrow)"/>
      <circle cx="320" cy="150" r="3.5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="332" y="155">prediction 3: −6</text>
      <path d="M320 40 V190" stroke="#d4d4d4" stroke-dasharray="4 4"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="40" y="252" fill="#737373">signed average: (3 + 3 − 6) / 3 = 0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="40" y="279" fill="#10b981">absolute (MAE): (3 + 3 + 6) / 3 = 4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="40" y="306" fill="#3b82f6">squared (MSE): (9 + 9 + 36) / 3 = 18</text>
      </g></svg>
      ```

      **The idea.** Both scores are losses: non-negative scores that are $0$ only when every prediction is exact and grow as predictions move away from their targets. The **mean absolute error (MAE)** averages the error sizes. The **mean squared error (MSE)** averages the squared errors. For $n$ examples, write $\hat y_i$ for the prediction on example $i$ and $y_i$ for its true value:

      $$\text{MAE}=\frac{1}{n}\sum_{i=1}^{n}|\hat y_i-y_i|$$

      $$\text{MSE}=\frac{1}{n}\sum_{i=1}^{n}(\hat y_i-y_i)^2$$

      The bars $|\cdot|$ mean absolute value, a number's distance from zero, so $|-6|=6$. The $\sum$ adds the term for every example from $i=1$ to $i=n$. MAE is in the target's units, such as pounds; MSE is in squared units, such as pounds squared, so compare MSE values with each other rather than with prices.

      **Common confusion.** “Isn't MSE just MAE squared?” No. Here MAE is $4$, and $4^2=16$, but MSE is $18$. Squaring each error before averaging lets the big $-6$ count as $36$ of the total $54$, two thirds of it, though it is only half of the total size $12$. The next step shows why that matters.
    worked: |
      Three predictions miss by $+3$, $+3$ and $-6$. Find the signed average, the MAE and the MSE.

      1. **Average the signed errors.**
         $$\frac{3+3+(-6)}{3}=0$$

      2. **Take each error's size.**
         $$|3|=3,\qquad |3|=3,\qquad |-6|=6$$

      3. **Average the sizes for MAE.**
         $$\text{MAE}=\frac{3+3+6}{3}=4$$

      4. **Square each error.**
         $$3^2=9,\qquad 3^2=9,\qquad (-6)^2=36$$

      5. **Average the squares for MSE.**
         $$\text{MSE}=\frac{9+9+36}{3}=18$$

      **Compare cases.** Every row below has MAE $4$, but MSE changes with how the error is spread out.

      | Errors | Signed average | MAE | MSE |
      | --- | --- | --- | --- |
      | $4,4,4$ | $4$ | $4$ | $16$ |
      | $3,3,-6$ | $0$ | $4$ | $18$ |
      | $6,-6,0$ | $0$ | $4$ | $24$ |
      | $0,0,12$ | $4$ | $4$ | $48$ |

      **Where it shows up.** In the supervised-learning lesson, three house prices were missed by $+10$, $+10$ and $-20$ thousand pounds. Their MAE says the model is off by about $13.3$ thousand pounds per house, and their MSE is $200$ in units of (thousand pounds) squared, a number you compare only with other MSEs.
