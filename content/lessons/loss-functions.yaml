concept: loss-functions
version: 1
fast_path: [objective, summary]
blocks:
  - kind: objective
    md: |
      **Goal:** compute MSE and MAE, and explain how squaring changes the way errors and outliers are weighted.
  - kind: intuition
    md: |
      A loss turns "how wrong is the model?" into one number that training can try to reduce. The choice of loss is a statement about which mistakes matter:

      - **MSE** squares every error, so one large error costs far more than several small ones.
      - **MAE** uses absolute errors, so every unit of error costs the same and outliers pull on the model less.
  - kind: example
    md: |
      This example compares how mean squared error and mean absolute error treat one large error.

      Errors $(1, 1, 1, 9)$: MSE $= (1 + 1 + 1 + 81)/4 = 21$, while MAE $= (1+1+1+9)/4 = 3$. The single 9 contributes 81 of MSE's 84 total.
  - kind: math
    md: |
      $$\text{MSE} = \frac1n\sum_{i}(\hat y_i - y_i)^2, \qquad \text{MAE} = \frac1n\sum_i|\hat y_i - y_i|.$$
      The function $\text{sign}(r)$ is $+1$ when $r>0$, 0 when $r=0$, and $-1$ when $r<0$. For one squared error, the derivative with respect to its prediction is $2(\hat y_i-y_i)$: it is twice how far the prediction is above or below the target. For MAE, the derivative is $\text{sign}(\hat y_i-y_i)$, with constant magnitude. Using the **mean** rather than the sum keeps the loss on the same scale whatever the dataset size.

      If one number must predict targets 1, 2 and 100, their mean $103/3\approx34.33$ minimises squared error, while their median 2 minimises absolute error.
  - kind: worked
    md: |
      This worked example calculates both error measures from three predictions and targets.

      Predictions $(2.5, 0, 2)$ and targets $(3, -0.5, 2)$:

      1. Errors: $(-0.5, 0.5, 0)$.
      2. MSE $= (0.25 + 0.25 + 0)/3 = 0.1667$.
      3. MAE $= (0.5 + 0.5 + 0)/3 = 0.3333$.
  - kind: check
    exercise: loss-check-mse
  - kind: summary
    md: |
      - MSE squares errors, so it is sensitive to outliers. Its gradient is proportional to the error.
      - MAE treats all errors linearly, so it is more robust. Its gradient has constant magnitude.
      - Use the mean, not the sum.
