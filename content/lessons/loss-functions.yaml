        lossp-corner,
        lossp-sensor,
      ]
  - id: loss-constant-choice
    title: Which single price should you predict
    explain: |
      Before building a real model, it helps to know how well the simplest possible model does: one that predicts the same price for every house. This is called a **baseline**, and any real model must beat it. Your three sales are 290, 300 and 560 thousand pounds. **Which single price should you predict?** No single price gets all three right. Picking one of the sales, say 300, makes the other two errors whatever they happen to be, so you need a rule for the best compromise.

      Under MSE, the best constant is the **mean**: add the prices and divide by their count. Here it is $(290+300+560)/3\approx383.33$. Why does this work? Each sale pulls the prediction towards itself with a slope proportional to its error, so the expensive sale pulls hardest. At the mean, the upward and downward pulls exactly balance.

      Under MAE, the best constant is a **median**: order the prices and choose the middle value, here 300. Every sale pulls with the same strength, so only how many prices lie on each side matters. Moving above 300 increases the distances to 290 and 300 while only reducing the distance to 560.

      Why this way? Neither choice is universally right. Use the mean when a large miss really is much worse. Use the median when typical distance matters and extreme or misrecorded prices shouldn't drag the answer.

      For an even count, any value between the two middle prices minimises MAE; their average is a conventional median.
    worked: |
      This example shows how the loss changes the best constant house price.

      Measure prices in tens of thousands of pounds to shorten the arithmetic: the targets are 29, 30 and 55. Their mean is $(29+30+55)/3=38$; their median is 30.

      | Constant | Squared-error total | Absolute-error total |
      |---|---|---|
      | 38 | $9^2+8^2+(-17)^2=81+64+289=434$ | $9+8+17=34$ |
      | 30 | $1^2+0^2+(-25)^2=1+0+625=626$ | $1+0+25=26$ |

      Dividing each total by 3 preserves the comparison: the mean wins under MSE, while the median wins under MAE.
    problems:
      [
        lossp-why-median,
        lossp-mean-template,
        lossp-median-template,
        lossp-extreme-sale,
        lossp-even,
        lossp-route,
      ]
final: loss-explain-choice
summary: |
  - MSE averages squared errors; MAE averages absolute errors. Both prevent cancellation and stay on the same scale when data is repeated.
  - Squared-error slopes grow with the error; absolute-error slopes have constant magnitude away from zero, so outliers pull less under MAE.
  - The best constant is the mean for MSE and a median for MAE; choose the loss according to which mistakes matter.

  **Where you'll use this:** gradient descent reduces the loss; backpropagation finds its effects on model weights.
