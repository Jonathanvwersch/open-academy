  - id: loss-constant-choice
    title: "Best single number to predict"
    explain: |
      ### The simplest possible model

      The two losses also disagree about which single number a model should predict. The simplest model ignores its inputs and predicts the same number $c$ for every example. This is called a **baseline**, and a real model has to beat the baseline's loss to be worth using. So which $c$ gives the smallest loss?

      ### Two curves with different lowest points

      Take the true values $1$, $2$ and $6$, shown as black dots. We'll add up the losses rather than average them, since dividing by $3$ shrinks the curve evenly and leaves its lowest point in place. The left plot shows the total squared error $(c-1)^2+(c-2)^2+(c-6)^2$ for each choice of $c$. It's a smooth bowl, lowest at $c=3$. The right plot shows the total absolute error $|c-1|+|c-2|+|c-6|$, which is made of straight pieces and is lowest at $c=2$, the middle value.

