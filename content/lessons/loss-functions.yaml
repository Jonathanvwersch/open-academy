concept: loss-functions
version: 2
objective: |
  **Goal:** compute MSE and MAE, explain how their slopes treat large errors, and choose the best constant prediction for each loss.
where_this_fits: |
  You have two house-price models and need to decide which one to improve. Eyeballing a few predictions is unreliable across thousands of sales. Averaging raw errors seems fair, but overpricing one house can cancel underpricing another, making a bad model look perfect. A loss turns the misses into one score without that cancellation. It lets you compare models on the same sales and gives a training algorithm a slope that tells which small changes reduce the score. Choosing the loss also decides how strongly a huge pricing mistake matters. Gradient descent uses this score to improve predictions; backpropagation carries its effects back to model weights.
knowledge_points:
  - id: loss-measure-misses
    title: Two ways to measure a missed price
    explain: |
      You predict three house prices in thousands of pounds: 370, 300 and 540. They sell for 360, 290 and 560. **How do you turn these misses into one score?** The obvious attempt is to average the errors, +10, +10 and −20. That average is zero, yet you have not priced any house correctly: opposite errors cancel.

      One fix is to square each error, then average. This is **mean squared error (MSE)**. Another is to remove each error's sign, then average. This is **mean absolute error (MAE)**. Absolute value, written with bars, means distance from zero: $|-20|=20$. Why does this work? Both turn every miss into a positive cost, so an overpriced house can no longer hide an underpriced one.

      Write $\hat y_i$ for house $i$'s predicted price, $y_i$ for its actual price, and $n$ for the number of houses. The subscript $i$ identifies a house; $\sum_{i=1}^n$ means add across all houses:

      $$\text{MSE}=\frac{1}{n}\sum_{i=1}^n(\hat y_i-y_i)^2,\qquad \text{MAE}=\frac{1}{n}\sum_{i=1}^n|\hat y_i-y_i|.$$

      Why not just count wrong prices? A price is almost never exactly right, so a house off by 1 and a house off by 100 each count as one miss, and the count can't show that a change made things better. Averaging keeps the scale unchanged if you repeat the same sales. MAE is in thousands of pounds; MSE is in squared thousands, so their numbers are not directly comparable.
    worked: |
      This example shows every step of calculating both losses.

      | Prediction | Actual price | Error | Squared error | Absolute error |
      |---|---|---|---|---|
      | 370 | 360 | $370-360=10$ | $10^2=100$ | $\lvert10\rvert=10$ |
      | 300 | 290 | $300-290=10$ | $10^2=100$ | $\lvert10\rvert=10$ |
      | 540 | 560 | $540-560=-20$ | $(-20)^2=400$ | $\lvert-20\rvert=20$ |

      MSE is $(100+100+400)/3=200$. MAE is $(10+10+20)/3\approx13.33$.

      Repeating all rows gives MSE $1200/6=200$ and MAE $80/6\approx13.33$: the averages stay the same, unlike the totals.
    problems:
      [
        lossp-why-not-count,
        lossp-mse-template,
        lossp-mae-template,
        lossp-cancellation,
        lossp-repeat,
        lossp-units,
      ]
  - id: loss-large-errors
    title: Why a large miss pulls harder under squared error
    explain: |
      Suppose your house-price errors are 1, 1 and 9 thousand pounds. **Should the last sale cost nine times as much as either small miss, or 81 times as much?** Choosing a loss means choosing which mistakes matter most.

      Squared error makes large misses disproportionately costly. An **outlier** is an unusually distant value, such as a sale price recorded with an extra zero. Under MSE, that one sale can outweigh many ordinary ones. Why? A square multiplies the error by itself, so each extra unit of error costs more than the one before: 9 costs 81 while 1 costs 1. MAE charges the same extra amount for each extra unit.

      Let $r=\hat y-y$ be one house's error, with prediction $\hat y$ and target $y$. Write $\ell$ ("ell") for its loss. For $\ell=r^2$, the prediction's slope is $d\ell/d\hat y=2r$.

      For $\ell=|r|$, the slope is +1 above the target and −1 below it. This is $\operatorname{sign}(r)$ away from zero. At zero, absolute error has a corner and no ordinary derivative.

      Why this way? Neither loss is always better. Squared error's slope is proportional to the miss, so it shows how far off you are and fades smoothly to zero at the target. Absolute error's slope has size 1 however large the miss, so one misrecorded price can't dominate: prefer MAE when outliers are likely.

      For a mean loss over $n$ houses, divide each house's contribution by $n$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" aria-label="Squared error has a smooth bowl whose slopes steepen away from zero; absolute error has straight sides and a corner at zero">
        <path d="M30 25 V175 H275 M325 25 V175 H570" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="2"/>
        <path d="M55 55 Q155 285 255 55" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="3"/>
        <path d="M350 55 L450 170 L550 55" fill="#171717" fill-opacity="0" stroke="#f59e0b" stroke-width="3"/>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text x="50" y="18">Squared error: changing slope</text><text x="340" y="18">Absolute error: fixed slope size</text><text x="145" y="195">0</text><text x="440" y="195">0</text><text x="200" y="213">Price error</text><text x="495" y="213">Price error</text>
        </g>
      </svg>
      ```
    worked: |
      This example shows the cost and slope of a large house-price error.

      For errors 1, 1 and 9, MSE is $(1+1+81)/3=83/3\approx27.67$. MAE is $(1+1+9)/3=11/3\approx3.67$.

      | Individual error | Squared-error slope | Absolute-error slope |
      |---|---|---|
      | 1 | $2\times1=2$ | +1 |
      | 9 | $2\times9=18$ | +1 |
      | −9 | $2\times(-9)=-18$ | −1 |

      If each listed error belonged to a three-house average, its squared-error slope contribution would be $2/3$, $18/3=6$ or $-18/3=-6$ respectively; its absolute-error contribution would be $1/3$, $1/3$ or $-1/3$.

      If a large error comes from a wrongly recorded sale price, fix the record too: changing the loss reduces that sale's influence but does not correct it.
    problems:
      [
        lossp-outlier,
        lossp-slope-template,
        lossp-why-square,
