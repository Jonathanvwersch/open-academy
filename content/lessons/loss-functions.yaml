summary: |
  - MAE averages the sizes of the errors and MSE averages their squares; both stop opposite errors cancelling.
  - Squared error's slope is twice the error, so a large miss pulls hardest; absolute error pulls with the same size, 1, on every miss.
  - The best constant prediction is the mean under MSE and the median under MAE.

