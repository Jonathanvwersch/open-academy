  - id: loss-large-errors
    title: "See how each loss treats a big miss"
    explain: |
      ### One error, two costs

      In the last table, four sets of errors had an MAE of $4$ but an MSE from $16$ to $48$. To see why, let's look at what each loss charges for a single error $e$.

      In the picture, the horizontal axis is the error and the height is its cost, the loss for that one error, with both curves drawn to the same scale. The blue curve is the squared error $e^2$ and the green V is the absolute error $|e|$. At $e=3$ the costs are $9$ and $3$, and at $e=-6$ they are $36$ and $6$. A miss of size $6$ is twice the size of a miss of $3$, and that doubles the green cost but makes the blue cost four times as big.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" aria-label="The cost of one error e, drawn to the same scale. The blue squared-error curve e squared reaches 9 at e equals 3 and 36 at e equals minus 6, while the green absolute-error V reaches only 3 and 6. Short orange lines at e equals minus 6 show the slopes, minus 12 for squared error and minus 1 for absolute error">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M23 300 H617 M320 300 V30" stroke="#737373"/>
      <path d="M50 295 V305" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="50" y="324" text-anchor="middle">−6</text>
      <path d="M185 295 V305" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="185" y="324" text-anchor="middle">−3</text>
      <path d="M455 295 V305" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="455" y="324" text-anchor="middle">3</text>
      <path d="M590 295 V305" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="590" y="324" text-anchor="middle">6</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="324" text-anchor="middle">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="621" y="305">e</text>
      <polyline points="41 30.92 45.5 39.53 50 48 54.5 56.33 59 64.52 63.5 72.57 68 80.48 72.5 88.25 77 95.88 81.5 103.37 86 110.72 90.5 117.93 95 125 99.5 131.93 104 138.72 108.5 145.37 113 151.88 117.5 158.25 122 164.48 126.5 170.57 131 176.52 135.5 182.33 140 188 144.5 193.53 149 198.92 153.5 204.17 158 209.28 162.5 214.25 167 219.08 171.5 223.77 176 228.32 180.5 232.73 185 237 189.5 241.13 194 245.12 198.5 248.97 203 252.68 207.5 256.25 212 259.68 216.5 262.97 221 266.12 225.5 269.13 230 272 234.5 274.73 239 277.32 243.5 279.77 248 282.08 252.5 284.25 257 286.28 261.5 288.17 266 289.92 270.5 291.53 275 293 279.5 294.33 284 295.52 288.5 296.57 293 297.48 297.5 298.25 302 298.88 306.5 299.37 311 299.72 315.5 299.93 320 300 324.5 299.93 329 299.72 333.5 299.37 338 298.88 342.5 298.25 347 297.48 351.5 296.57 356 295.52 360.5 294.33 365 293 369.5 291.53 374 289.92 378.5 288.17 383 286.28 387.5 284.25 392 282.08 396.5 279.77 401 277.32 405.5 274.73 410 272 414.5 269.13 419 266.12 423.5 262.97 428 259.68 432.5 256.25 437 252.68 441.5 248.97 446 245.12 450.5 241.13 455 237 459.5 232.73 464 228.32 468.5 223.77 473 219.08 477.5 214.25 482 209.28 486.5 204.17 491 198.92 495.5 193.53 500 188 504.5 182.33 509 176.52 513.5 170.57 518 164.48 522.5 158.25 527 151.88 531.5 145.37 536 138.72 540.5 131.93 545 125 549.5 117.93 554 110.72 558.5 103.37 563 95.88 567.5 88.25 572 80.48 576.5 72.57 581 64.52 585.5 56.33 590 48 594.5 39.53 599 30.92" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="2.5"/>
      <path d="M32 255.2 L320 300 L608 255.2" fill="#171717" fill-opacity="0" stroke="#10b981" stroke-width="2.5"/>
      <path d="M18.5 -10.8 L81.5 106.8" stroke="#f59e0b" stroke-width="3"/>
      <path d="M-13 248.2 L113 267.8" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="50" cy="48" r="4" fill="#171717"/>
      <circle cx="455" cy="237" r="4" fill="#171717"/>
      <circle cx="50" cy="258" r="4" fill="#171717"/>
      <circle cx="455" cy="279" r="4" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="64" y="53" fill="#3b82f6">36, slope −12</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="46" y="244" fill="#10b981">6, slope −1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="467" y="242" fill="#3b82f6">9</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="459" y="267" fill="#10b981">3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="374" y="40" fill="#3b82f6">squared error e²</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="374" y="64" fill="#10b981">absolute error |e|</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="374" y="88" fill="#f59e0b">orange: slope at e = −6</text>
      </g></svg>
      ```

      ### How fast each cost changes

      Training changes a model's predictions, so we want the slope, how fast each cost changes as a prediction moves. Write $e=\hat y-y$ and hold the true value $y$ fixed. Nudging the prediction $\hat y$ up nudges $e$ up by the same amount, so the slope of $e^2$ as the prediction moves, its **derivative with respect to the prediction**, is what the power rule gives:

      $$\text{slope of } e^2 = 2e$$

      For the absolute error, if the prediction is above the target, raising it adds $1$ to the cost per unit, so the slope is $+1$. Below the target, raising it moves it closer, so the cost drops by $1$ per unit and the slope is $-1$. The orange lines show the slope of each curve at $e=-6$, which is $-12$ for squared error and $-1$ for absolute error.

      Under squared error the slope's size is proportional to the miss, so the loss is most sensitive to the biggest miss, and moving a nearly correct prediction barely changes it. The absolute-error slope has the same size, $1$, for every miss. Right at $e=0$ the V has a sharp corner where the slope jumps from $-1$ to $+1$, so there's no single slope there.

      Be careful not to conclude that MAE ignores large errors. A miss of $6$ still costs twice as much as a miss of $3$, but MAE doesn't magnify large misses the way squaring does.
    worked: |
      Let's compare how much the large miss counts among the errors $+3$, $+3$ and $-6$, first in its slope and then in its share of the cost.

      1. **Find the squared-error slope for each prediction.** The slope is twice the error.
         $$2(3)=6,\qquad 2(3)=6,\qquad 2(-6)=-12$$

      2. **Find the absolute-error slope for each prediction.** Only the sign of the error matters.
         $$+1,\qquad +1,\qquad -1$$

      3. **Find the large miss's share of each loss.** We divide its cost by the total cost of all three, first for squared error and then for absolute error.
         $$\text{squared: }\frac{36}{54}=\frac{2}{3}$$
         $$\text{absolute: }\frac{6}{12}=\frac{1}{2}$$

      4. **Check the squared-error slope with a small nudge.** Raising the third prediction by $0.1$ moves its error from $-6$ to $-5.9$, and the change should be about the slope times the nudge.
         $$(-5.9)^2-(-6)^2=34.81-36=-1.19\approx-12\times0.1$$

      5. **Do the same for the absolute error.**
         $$|-5.9|-|-6|=5.9-6=-0.1=-1\times0.1$$

      So under squared error the big miss has a slope twice as steep as each small one, while under absolute error all three get the same.
