      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="590" y="324" text-anchor="middle">6</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="324" text-anchor="middle">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="621" y="305">e</text>
      <polyline points="41.0 30.92 45.5 39.53 50.0 48.0 54.5 56.33 59.0 64.52 63.5 72.57 68.0 80.48 72.5 88.25 77.0 95.88 81.5 103.37 86.0 110.72 90.5 117.93 95.0 125.0 99.5 131.93 104.0 138.72 108.5 145.37 113.0 151.88 117.5 158.25 122.0 164.48 126.5 170.57 131.0 176.52 135.5 182.33 140.0 188.0 144.5 193.53 149.0 198.92 153.5 204.17 158.0 209.28 162.5 214.25 167.0 219.08 171.5 223.77 176.0 228.32 180.5 232.73 185.0 237.0 189.5 241.13 194.0 245.12 198.5 248.97 203.0 252.68 207.5 256.25 212.0 259.68 216.5 262.97 221.0 266.12 225.5 269.13 230.0 272.0 234.5 274.73 239.0 277.32 243.5 279.77 248.0 282.08 252.5 284.25 257.0 286.28 261.5 288.17 266.0 289.92 270.5 291.53 275.0 293.0 279.5 294.33 284.0 295.52 288.5 296.57 293.0 297.48 297.5 298.25 302.0 298.88 306.5 299.37 311.0 299.72 315.5 299.93 320.0 300.0 324.5 299.93 329.0 299.72 333.5 299.37 338.0 298.88 342.5 298.25 347.0 297.48 351.5 296.57 356.0 295.52 360.5 294.33 365.0 293.0 369.5 291.53 374.0 289.92 378.5 288.17 383.0 286.28 387.5 284.25 392.0 282.08 396.5 279.77 401.0 277.32 405.5 274.73 410.0 272.0 414.5 269.13 419.0 266.12 423.5 262.97 428.0 259.68 432.5 256.25 437.0 252.68 441.5 248.97 446.0 245.12 450.5 241.13 455.0 237.0 459.5 232.73 464.0 228.32 468.5 223.77 473.0 219.08 477.5 214.25 482.0 209.28 486.5 204.17 491.0 198.92 495.5 193.53 500.0 188.0 504.5 182.33 509.0 176.52 513.5 170.57 518.0 164.48 522.5 158.25 527.0 151.88 531.5 145.37 536.0 138.72 540.5 131.93 545.0 125.0 549.5 117.93 554.0 110.72 558.5 103.37 563.0 95.88 567.5 88.25 572.0 80.48 576.5 72.57 581.0 64.52 585.5 56.33 590.0 48.0 594.5 39.53 599.0 30.92" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="2.5"/>
      <path d="M32 255.2 L320 300 L608 255.2" fill="#171717" fill-opacity="0" stroke="#10b981" stroke-width="2.5"/>
      <path d="M34.25 18.6 L65.75 77.4" stroke="#f59e0b" stroke-width="3"/>
      <path d="M18.5 253.1 L81.5 262.9" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="50" cy="48" r="4" fill="#171717"/>
      <circle cx="455" cy="237" r="4" fill="#171717"/>
      <circle cx="50" cy="258" r="4" fill="#171717"/>
      <circle cx="455" cy="279" r="4" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="64" y="53" fill="#3b82f6">36, slope −12</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="46" y="244" fill="#10b981">6, slope −1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="467" y="242" fill="#3b82f6">9</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="459" y="267" fill="#10b981">3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="374" y="40" fill="#3b82f6">squared error e²</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="374" y="64" fill="#10b981">absolute error |e|</text>
      </g></svg>
      ```

      **The idea.** Squared error grows faster and faster as an error grows; absolute error grows at a constant rate. The slope of a loss with respect to the prediction $\hat y$ says how much the cost changes per unit nudge of $\hat y$, with the true value $y$ fixed. For one example with error $e=\hat y-y$:

      $$\frac{d}{d\hat y}(\hat y-y)^2=2(\hat y-y)=2e$$

      $$\frac{d}{d\hat y}|\hat y-y|=\begin{cases}+1 & \text{if } e>0\\ -1 & \text{if } e<0\end{cases}$$

      The squared-error slope is proportional to the miss, so the largest miss pushes hardest. The absolute-error slope has size $1$ for every miss, big or small. At $e=0$ the V has a corner where the slope jumps from $-1$ to $+1$, so no single slope, and no derivative, exists there.

      **Common confusion.** “MAE ignores large errors.” No. Under MAE a miss of $6$ still costs twice a miss of $3$, and it still pushes. MAE counts every unit of error in full; it just doesn't magnify large misses the way squaring does.
    worked: |
      Use the errors $+3$, $+3$ and $-6$ again. Compare how strongly each loss reacts to the large miss.

      1. **Find the squared-error slope for each prediction.** Expand with $y$ fixed, then differentiate term by term:
         $$(\hat y-y)^2=\hat y^2-2y\hat y+y^2$$
         $$\frac{d}{d\hat y}\left(\hat y^2-2y\hat y+y^2\right)=2\hat y-2y=2e$$
         $$2(3)=6,\qquad 2(3)=6,\qquad 2(-6)=-12$$

      2. **Find the absolute-error slope for each prediction.**
         $$+1,\qquad +1,\qquad -1$$

      3. **Find the large miss's share of each total.**
         $$\text{squared: }\frac{36}{9+9+36}=\frac{2}{3}$$
         $$\text{absolute: }\frac{6}{3+3+6}=\frac{1}{2}$$

      4. **Check the slopes with a small nudge.** Raise the third prediction by $0.1$, so its error goes from $-6$ to $-5.9$.
         $$(-5.9)^2-(-6)^2=34.81-36=-1.19\approx -12\times 0.1$$
         $$|-5.9|-|-6|=5.9-6=-0.1=-1\times 0.1$$

      **Compare cases.**

      | Error $e$ | $e^2$ | $\lvert e\rvert$ | Squared slope $2e$ | Absolute slope |
      | --- | --- | --- | --- | --- |
      | $0.5$ | $0.25$ | $0.5$ | $1$ | $1$ |
      | $1$ | $1$ | $1$ | $2$ | $1$ |
      | $3$ | $9$ | $3$ | $6$ | $1$ |
      | $6$ | $36$ | $6$ | $12$ | $1$ |
      | $12$ | $144$ | $12$ | $24$ | $1$ |

      **Where it shows up.** Training changes the weights, which changes the predictions, so an example whose loss changes fast with its prediction has the most say in which way the weights move. A wrongly recorded house sale far from the model's prediction gets a huge squared-error slope and drags the model towards it; under MAE it pushes no harder than any other wrongly priced house.
