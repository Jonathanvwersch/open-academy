  - id: loss-large-errors
    title: Why squared error weighs a large miss more
    explain: |
      **The question.** In the last table, four sets of errors all had MAE $4$, but their MSE ranged from $16$ to $48$. Why does MSE care so much about one large miss? And if training nudges a prediction, how fast does each miss's loss change?

      **Picture it.** The plot shows the cost of one error $e$ under each loss, drawn to the same scale. The blue curve is the squared error $e^2$; the green V is the absolute error $|e|$. At $e=3$ the costs are $9$ and $3$; at $e=-6$ they are $36$ and $6$. Doubling the miss doubles the green cost but multiplies the blue cost by four. The amber segments show each curve's slope at $e=-6$: $-12$ for squared error, $-1$ for absolute error.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" aria-label="The cost of one error e, drawn to the same scale: the squared-error curve e squared reaches 9 at e equals 3 and 36 at e equals minus 6, while the absolute-error V reaches only 3 and 6. Short amber tangents at e equals minus 6 show slopes minus 12 and minus 1">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M23 300 H617 M320 300 V30" stroke="#737373"/>
      <path d="M50 295 V305" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="50" y="324" text-anchor="middle">−6</text>
      <path d="M185 295 V305" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="185" y="324" text-anchor="middle">−3</text>
