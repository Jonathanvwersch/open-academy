concept: supervised-learning
version: 3
objective: |
  **Goal:** identify the inputs, targets, model, loss and training data in any supervised problem, and explain why training means making the average loss small.
where_this_fits: |
  A family needs an estimate before offering 350 thousand pounds for a house. A computer could use a rule such as "larger houses cost more", but someone still has to choose how much more. Guessing a separate rule for every size and bedroom count quickly becomes unmanageable. Past sales give us both the house details and the actual prices. Supervised learning uses these examples to choose a model, a rule for making predictions, by measuring its mistakes. That lets us compare possible rules rather than trust our guesses. Linear regression, loss functions, gradient descent, and training and evaluation splits develop this approach. Behavioral cloning uses the same idea to teach robots from recorded human actions.
knowledge_points:
  - id: sl-inputs-targets
    title: Inputs, targets and the model
    explain: |
      A family is considering a 100 m² house with 2 bedrooms. **How can a computer estimate a fair price before they make an offer?** You could write a rule yourself, but you would still need to guess how much size and bedroom count should matter. Instead, collect past sales, each with the house's details and the price it actually sold for, and let the computer find a rule that fits them. Learning from examples with known answers is **supervised learning**.

      Every supervised problem has the same five ingredients:

      1. **Inputs** $x$: what you know when you make the prediction (the house's size and number of bedrooms).
      2. **Target** $y$: the answer you want to predict (the sale price).
      3. **Model** $f_\theta$: a rule that turns inputs into a prediction. It has adjustable settings called **parameters**, written $\theta$ ("theta").
      4. **Loss** $L$: a number that says how wrong a prediction is.
      5. **Dataset**: the past examples, each one an $(x, y)$ pair.

      This works because each known sale price gives us an answer to compare with the model's prediction. We can judge its settings by the size of those mistakes rather than by whether a rule sounds plausible.
    worked: |
      This example shows that a model is a rule with adjustable settings, and different settings give different predictions.

      A simple model combines size and bedroom count by multiplying each by a setting and adding a starting amount. Prices below are in thousands of pounds:

      $$\hat y = w_1 \cdot \text{size} + w_2 \cdot \text{bedrooms} + b$$

      The hat on $\hat y$ means "predicted price", to tell it apart from the true price $y$. The multipliers $w_1$ and $w_2$ are called **weights**. The added starting amount $b$ is called a **bias**. Together they are the parameters $\theta$. Changing them changes every prediction:

      - **Setting A:** $w_1 = 3,\ w_2 = 10,\ b = 50$. For a 100 m², 2-bedroom house, the predicted price is $3\cdot100 + 10\cdot2 + 50 = 370$ thousand pounds.
      - **Setting B:** $w_1 = 2,\ w_2 = 20,\ b = 100$. For the same house, the predicted price is $2\cdot100 + 20\cdot2 + 100 = 340$ thousand pounds.

      Training means choosing the setting. To choose, we need a way to say which one is better.
    problems: [slp-predict, slp-why-targets, slp-input-target, slp-parameters]
  - id: sl-measuring-error
    title: "Measuring how wrong: squared error"
    explain: |
      The first house sold for 360 thousand pounds, but Setting A predicted 370. That is an **error**, the prediction minus the true price, of +10. Another house might have an error of −10. **Why not just average the errors to judge the model?** These two errors average to zero, even though both predictions are wrong. Being too high on one house does not make up for being too low on another.

      Instead, square each error. The **squared-error loss** is $(\hat y - y)^2$. This works because both $10^2$ and $(-10)^2$ equal 100. Every wrong prediction contributes a positive amount, so opposite errors cannot cancel.

      Why square rather than use the error's absolute value, its distance from zero? Both prevent cancellation. Squaring makes an error of 20 count four times as much as an error of 10, rather than twice as much. That is useful when we especially want to avoid very large pricing mistakes. However, one unusual sale can then have a much larger influence on the score than the other sales.

      Squared error also changes smoothly as the prediction changes. Later, when we use derivatives to find how changing a model setting changes the loss, that smooth curve is easier to work with than the sharp corner of absolute error at zero.
    worked: |
      This example shows why signed errors can cancel and how squaring prevents it.

      Three past sales:

      | house | size (m²) | bedrooms | sold for $y$ | Setting A predicts | error |
      |---|---|---|---|---|---|
      | 1 | 100 | 2 | 360 | 370 | +10 |
      | 2 | 80 | 1 | 290 | 300 | +10 |
      | 3 | 150 | 4 | 560 | 540 | −20 |

      The errors add up to $10 + 10 - 20 = 0$, even though every prediction is wrong.

      Squaring gives $10^2 = 100$, $10^2 = 100$, and $(-20)^2 = 400$. The squared errors are all positive, so they do not cancel.
    problems: [slp-squared-error, slp-error-sum, slp-why-square, slp-why-square-not-absolute]
  - id: sl-training-loss
    title: Training chooses the smallest average loss
    explain: |
      Setting A has squared errors of 100, 100 and 400 on our three sales. **How should we judge the setting as a whole?** Choosing only its best house would hide the other mistakes, so we average the losses. This works because every sale contributes to the score. Average squared error is called **mean squared error (MSE)**. We divide by the number of houses so that the score describes error per house, rather than growing just because we collected more sales.

      The worked example is exactly what the standard formula says. Here it is, one piece at a time.

      **The loss on one house.** The small number $i$ below a symbol identifies the house. House $i$ has inputs $x_i$, true price $y_i$ and prediction $f_\theta(x_i)$. Its loss is $L\big(f_\theta(x_i), y_i\big)$, which is $\big(f_\theta(x_i) - y_i\big)^2$ for squared error.

      Add up the loss for all $n$ houses and divide by $n$:

      $$\frac{1}{n}\sum_{i=1}^{n} L\big(f_\theta(x_i), y_i\big)$$

      The symbol $\sum_{i=1}^{n}$ means "add this up for $i = 1, 2, \dots, n$". In the worked example $n = 3$.

      Training searches for the $\theta$ with the smallest average loss:

      $$\theta^\star = \arg\min_\theta \frac{1}{n}\sum_{i=1}^{n} L\big(f_\theta(x_i), y_i\big)$$

      Read $\arg\min_\theta$ as "the settings that make this average smallest". The symbol $\theta^\star$ ("theta star") names those settings. Gradient descent explains how to search for them automatically.
    worked: |
      This example shows two settings compared by their average squared error.

      | house | Setting A: squared error | Setting B predicts | Setting B: squared error |
      |---|---|---|---|
      | 1 | $10^2 = 100$ | 340 | $(-20)^2 = 400$ |
      | 2 | $10^2 = 100$ | 280 | $(-10)^2 = 100$ |
      | 3 | $(-20)^2 = 400$ | 480 | $(-80)^2 = 6400$ |
      | **average** | **200** | | **2300** |

      Setting A averages 200 and Setting B averages 2300, so Setting A fits these sales much better.
    problems: [slp-average-mse, slp-argmin, slp-best-setting, slp-why-average]
  - id: sl-new-data-targets
    title: New houses and two kinds of target
    explain: |
      Our model predicts 370 thousand pounds for a house that sold for 360. We can measure that mistake, but the family wants a price for a different house. **Does doing well on known sales show that the model will help them?** Not necessarily: a model could remember those sale prices without learning a rule that works elsewhere.

      We therefore also test on sales that were not used to choose its settings. This works because the model has to predict their prices without having used those answers during training. The lesson on training and evaluation splits explains how to keep these examples separate.

      A sale price is a numerical **target**, so predicting it is called **regression**. A target can instead be a category, such as "spam" or "not spam" for an email. Predicting a category is called **classification**. The inputs, model and training examples still have the same jobs, but the loss must suit the target. Why not use squared error for category names? There is no numerical difference to square between the words "spam" and "not spam".

      A robot can learn from recorded examples in the same way. A human might show it when to grasp an object and when to release it. The camera image is the input, and the human's chosen action is the target.
    worked: |
      This example shows two targets and identifies which ones are categories.

      A delivery service tells a customer whether a parcel will arrive today or tomorrow. These are two possible labels, so predicting which label applies is classification. Predicting the number of hours until arrival would instead be regression.

      A robot chooses between the actions "grasp" and "release" when handling a parcel. These are also two labels, so this choice is classification. Predicting how far its gripper should move, in centimetres, would instead be regression.
    problems:
      - slp-new-houses
      - slp-regression-classification
      - slp-target-type-travel
      - slp-target-type-parcel
      - slp-low-training-loss
final: sl-explain-setup
summary: |
  - A supervised problem uses inputs $x$, a target $y$, a model $f_\theta$ with adjustable parameters $\theta$, a loss $L$, and a dataset of known $(x, y)$ pairs.
  - The loss turns "how wrong" into a number. Squaring stops errors that are too high and too low from cancelling out.
  - Training picks the parameters with the smallest average loss on the training data, but what matters is performance on new data.

  **Where you'll use this:** linear regression, loss functions, gradient descent, training and evaluation splits, and behavioral cloning, where demonstration actions become targets for a robot.
