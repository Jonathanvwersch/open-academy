concept: supervised-learning
version: 4
objective: |
  **Goal:** identify the inputs, targets, model, loss and training data in any supervised problem, and explain why training means making the average loss small.
where_this_fits: |
  The introduction showed that machine learning learns a rule from examples, using house details to predict sale prices. We now need names for the inputs, target and model, and a way to measure a model's mistakes. This lesson names those parts and explains how known sale prices let us compare possible rules before using them on new houses.
knowledge_points:
  - id: sl-inputs-targets
    title: Inputs, targets and the model
    explain: |
      **What supervised learning is.** Supervised learning fits a model to examples that include both input measurements and known answers. For house prices, each example pairs a house's details with its sale price.

      **How it works.** A supervised problem has five ingredients:

      1. **Inputs** $x$: what you know when you make the prediction (the house's size and number of bedrooms).
      2. **Target** $y$: the answer you want to predict (the sale price).
      3. **Model** $f_\theta$: a rule that turns inputs into a prediction. It has adjustable settings called **parameters**, written $\theta$ ("theta").
      4. **Loss** $L$: a number that says how wrong a prediction is.
      5. **Dataset**: the past examples, each one an $(x, y)$ pair.

      This works because each known sale price gives us an answer to compare with the model's prediction. We can judge its settings by the size of those mistakes rather than by whether a rule sounds plausible.

      **Why this is useful.** Known sale prices let us compare a house-price model's predictions with real outcomes and adjust its parameters rather than hand-writing a separate rule for every house.
    worked: |
      This example shows that a model is a rule with adjustable settings, and different settings give different predictions.

      A simple model combines size and bedroom count by multiplying each by a setting and adding a starting amount. Prices below are in thousands of pounds:

      $$\hat y = w_1 \cdot \text{size} + w_2 \cdot \text{bedrooms} + b$$

      The hat on $\hat y$ means "predicted price", to tell it apart from the true price $y$. The multipliers $w_1$ and $w_2$ are called **weights**. The added starting amount $b$ is called a **bias**. Together they are the parameters $\theta$. Changing them changes every prediction:

      - **Setting A:** $w_1 = 3,\ w_2 = 10,\ b = 50$. For a 100 m², 2-bedroom house, the predicted price is $3\cdot100 + 10\cdot2 + 50 = 370$ thousand pounds.
      - **Setting B:** $w_1 = 2,\ w_2 = 20,\ b = 100$. For the same house, the predicted price is $2\cdot100 + 20\cdot2 + 100 = 340$ thousand pounds.

      Training means choosing the setting. To choose, we need a way to say which one is better.
    problems:
      - sl-inputs-targets-basics
      - slp-why-targets
      - slp-parameters
      - slp-predict
      - slp-input-target
  - id: sl-measuring-error
    title: "Measuring how wrong: squared error"
    explain: |
      **What squared-error loss is.** It is the square of the prediction minus the true value: $(\hat y-y)^2$.

      **How it works.** Suppose a model, called Setting A, predicts 370 thousand pounds for a house that sold for 360. Its **error** (prediction minus true price) is +10. An error of −10 on another house would cancel it in an ordinary average. Squaring makes both losses 100, so opposite errors cannot cancel.

      Squaring makes an error of 20 count four times as much as an error of 10, rather than twice as much. Why square instead of using the error's absolute value? Both prevent cancellation, but squaring gives extra weight to large mistakes.

      **Why this is useful.** The house-price model needs a score that penalises both overestimates and underestimates; squared error also makes a large pricing miss count more heavily.
    worked: |
      This example shows why signed errors can cancel and how squaring prevents it.

      Three past sales:

      | house | size (m²) | bedrooms | sold for $y$ | Setting A predicts | error |
      |---|---|---|---|---|---|
      | 1 | 100 | 2 | 360 | 370 | +10 |
      | 2 | 80 | 1 | 290 | 300 | +10 |
      | 3 | 150 | 4 | 560 | 540 | −20 |

      The errors add up to $10 + 10 - 20 = 0$, even though every prediction is wrong.

      Squaring gives:

      $$
      \begin{aligned}
      10^2 &= 100,\\
      10^2 &= 100,\\
      (-20)^2 &= 400.
      \end{aligned}
      $$

      The squared errors are all positive, so they do not cancel.
    problems:
      - sl-measuring-error-basics
      - slp-why-square
      - slp-squared-error
      - slp-error-sum
      - slp-why-square-not-absolute
      - slp-recover-prediction
  - id: sl-training-loss
    title: Training chooses the smallest average loss
    explain: |
      **What mean squared error (MSE) is.** MSE is the average of the squared losses across the examples.

      **How it works.** Setting A has squared errors 100, 100 and 400 on three house sales. Average them so every sale contributes; dividing by the number of houses means the score is error per house, not a total that grows with dataset size.

      **The loss on one house.** The small number $i$ below a symbol identifies the house. House $i$ has inputs $x_i$, true price $y_i$ and prediction $f_\theta(x_i)$. Its loss is $L\big(f_\theta(x_i), y_i\big)$, which is $\big(f_\theta(x_i) - y_i\big)^2$ for squared error.

      Add up the loss for all $n$ houses and divide by $n$:

      $$\frac{1}{n}\sum_{i=1}^{n} L\big(f_\theta(x_i), y_i\big)$$

      The symbol $\sum_{i=1}^{n}$ means "add this up for $i = 1, 2, \dots, n$". In the worked example $n = 3$.

      Training searches for the $\theta$ with the smallest average loss:

      $$\theta^\star = \arg\min_\theta \frac{1}{n}\sum_{i=1}^{n} L\big(f_\theta(x_i), y_i\big)$$

      Read $\arg\min_\theta$ as "the settings that make this average smallest". The symbol $\theta^\star$ ("theta star") names those settings. Gradient descent explains how to search for them automatically.

      **Why this is useful.** Comparing average loss gives one fair score for each candidate house-price model, even when the training sets contain different numbers of sales.
    worked: |
      This example shows two settings compared by their average squared error.

      | house | Setting A: squared error | Setting B predicts | Setting B: squared error |
      |---|---|---|---|
      | 1 | $10^2 = 100$ | 340 | $(-20)^2 = 400$ |
      | 2 | $10^2 = 100$ | 280 | $(-10)^2 = 100$ |
      | 3 | $(-20)^2 = 400$ | 480 | $(-80)^2 = 6400$ |
      | **average** | **200** | | **2300** |

      Setting A averages 200 and Setting B averages 2300, so Setting A fits these sales much better.
    problems:
      - sl-training-loss-basics
      - slp-argmin
      - slp-best-setting
      - slp-average-mse
      - slp-why-average
      - slp-recover-loss
  - id: sl-new-data-targets
    title: New houses and two kinds of target
    explain: |
      **What regression and classification are.** **Regression** predicts a number, such as a house's sale price. **Classification** predicts a category, such as whether that sale was above its asking price.

      **How it works.** The house details are inputs in either case. The known sale price is a numerical target for regression; the above-asking label is a category target for classification. The model is trained on known examples and evaluated on sales whose targets were not used to choose its settings. Why not use squared error for category names? A category has no numerical difference to square.

      **Why this is useful.** The target tells us what kind of prediction and loss the house model needs, while testing on new sales checks whether its learned rule works beyond examples it has already seen.
    worked: |
      This example shows numerical and category targets for the same house-price model.

      1. Predicting a house's sale price in thousands of pounds is regression because the target is a number.
      2. Predicting whether the house sold above its asking price is classification because the target is one of two labels.
      3. Use only training sales to choose model settings. Compare predictions with separate evaluation sales to check performance on new examples.
    problems:
      - sl-new-data-targets-basics
      - slp-new-houses
      - slp-regression-classification
      - slp-target-and-evaluation
      - slp-target-type-travel
      - slp-target-type-parcel
      - slp-low-training-loss
final: sl-explain-setup
summary: |
  - A supervised problem uses inputs $x$, a target $y$, a model $f_\theta$ with adjustable parameters $\theta$, a loss $L$, and a dataset of known $(x, y)$ pairs.
  - The loss turns "how wrong" into a number. Squaring stops errors that are too high and too low from cancelling out.
  - Training picks the parameters with the smallest average loss on the training data, but what matters is performance on new data.

  **Next:** Vectors give us a fixed-order way to hold a house's input measurements together before we combine them into predictions.
