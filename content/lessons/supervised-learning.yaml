concept: supervised-learning
version: 3
objective: |
  **Goal:** identify the inputs, targets, model, loss and training data in any supervised problem, and explain why training means making the average loss small.
why: |
  A house-price model must estimate a sale price before anyone knows what the buyer will pay. You could write rules by hand for every combination of size and bedroom count, but those rules multiply as you add details, and guessing their settings gives no reliable way to compare them. Past sales already contain both the details and the answers. Supervised learning turns those pairs into a way to choose a prediction rule: measure its mistakes and adjust its settings to reduce them. The same setup lets a robot learn actions from human demonstrations. Linear regression, loss functions, gradient descent, training and evaluation splits, and behavioral cloning all build on this setup.
knowledge_points:
  - id: sl-inputs-targets
    title: Inputs, targets and the model
    explain: |
      **How can we predict what a house will sell for?** Writing rules yourself means guessing their settings. Instead, collect past sales, each with the house's details and the price it actually sold for, and let the computer find a rule that fits them. Learning from examples with known answers is **supervised learning**.

      Every supervised problem has the same five ingredients:

      1. **Inputs** $x$: what you know when you make the prediction (the house's size and number of bedrooms).
      2. **Target** $y$: the answer you want to predict (the sale price).
      3. **Model** $f_\theta$: a rule that turns inputs into a prediction. It has adjustable settings called **parameters**, written $\theta$ ("theta").
      4. **Loss** $L$: a number that says how wrong a prediction is.
      5. **Dataset**: the past examples, each one an $(x, y)$ pair.

      This works because known answers let us judge settings by their mistakes rather than guesswork.
    worked: |
      This example shows that a model is a rule with adjustable settings, and different settings give different predictions.

      A simple model for house prices (in thousands) is a line:

      $$\hat y = w_1 \cdot \text{size} + w_2 \cdot \text{bedrooms} + b$$

      The hat on $\hat y$ means "predicted price", to tell it apart from the true price $y$. The numbers $w_1$, $w_2$ and $b$ are the parameters $\theta$. Changing them changes every prediction:

      - **Setting A:** $w_1 = 3,\ w_2 = 10,\ b = 50$. A 100 m², 2-bedroom house gets $3\cdot100 + 10\cdot2 + 50 = 370$.
      - **Setting B:** $w_1 = 2,\ w_2 = 20,\ b = 100$. The same house gets $2\cdot100 + 20\cdot2 + 100 = 340$.

      Training means choosing the setting. To choose, we need a way to say which one is better.
    problems: [slp-predict, slp-why-targets, slp-input-target, slp-parameters]
  - id: sl-measuring-error
    title: "Measuring how wrong: squared error"
    explain: |
      **Why not just average the errors?** High and low errors cancel even when every prediction is wrong. Use **squared-error loss**: $(\hat y - y)^2$.

      This works because squares cannot be negative. Why not absolute errors? Squaring penalises doubled misses fourfold and has a smooth curve for later differentiation, but unusual sales with enormous errors can dominate.
    worked: |
      This example shows why signed errors can cancel and how squaring prevents it.

      Three past sales:

      | house | size (m²) | bedrooms | sold for $y$ | Setting A predicts | error |
      |---|---|---|---|---|---|
      | 1 | 100 | 2 | 360 | 370 | +10 |
      | 2 | 80 | 1 | 290 | 300 | +10 |
      | 3 | 150 | 4 | 560 | 540 | −20 |

      The errors add up to $10 + 10 - 20 = 0$, even though every prediction is wrong.

      Squaring gives $10^2 = 100$, $10^2 = 100$, and $(-20)^2 = 400$. The squared errors are all positive, so they do not cancel.
    problems: [slp-squared-error, slp-error-sum, slp-why-square, slp-why-square-not-absolute]
  - id: sl-training-loss
    title: Training chooses the smallest average loss
    explain: |
      **Which setting fits better?** One house can be lucky or unlucky, so we average losses across the sales. This works because every sale contributes. Average squared error is **mean squared error (MSE)**. Why average rather than sum? We want error per house, not dataset-size-dependent totals.

      The worked example is exactly what the standard formula says. Here it is, one piece at a time.

      **The loss on one house.** Subscript $i$ identifies a house: inputs $x_i$, true price $y_i$, prediction $f_\theta(x_i)$. Its loss $L\big(f_\theta(x_i), y_i\big)$ measures the mistake; squared error gives $\big(f_\theta(x_i) - y_i\big)^2$.

      Add up the loss for all $n$ houses and divide by $n$:

      $$\frac{1}{n}\sum_{i=1}^{n} L\big(f_\theta(x_i), y_i\big)$$

      The symbol $\sum_{i=1}^{n}$ means "add this up for $i = 1, 2, \dots, n$". In the worked example $n = 3$.

      Training searches for the $\theta$ with the smallest average loss:

      $$\theta^\star = \arg\min_\theta \frac{1}{n}\sum_{i=1}^{n} L\big(f_\theta(x_i), y_i\big)$$

      Read $\arg\min_\theta$ as "the $\theta$ that makes what follows as small as possible", and $\theta^\star$ ("theta star") as "the best parameters". Gradient descent shows how to search automatically.
    worked: |
      This example shows two settings compared by their average squared error.

      | house | Setting A: squared error | Setting B predicts | Setting B: squared error |
      |---|---|---|---|
      | 1 | $10^2 = 100$ | 340 | $(-20)^2 = 400$ |
      | 2 | $10^2 = 100$ | 280 | $(-10)^2 = 100$ |
      | 3 | $(-20)^2 = 400$ | 480 | $(-80)^2 = 6400$ |
      | **average** | **200** | | **2300** |

      Setting A averages 200 and Setting B averages 2300, so Setting A fits these sales much better.
    problems: [slp-average-mse, slp-argmin, slp-best-setting, slp-why-average]
  - id: sl-new-data-targets
    title: New houses and two kinds of target
    explain: |
      **Will the model price new houses well?** Checking only its training sales can reward remembering those answers. Test on sales it didn't train on instead. This works because their answers were not used to choose the settings, so success tests prediction beyond the training examples. Training and evaluation splits covers how.

      Low average loss on past sales is a means to an end: good prices for houses the model has never seen.

      **Two kinds of target.** A numeric target $y$, like a price, means **regression**; a category, like "spam" or "not spam", means **classification**. The five ingredients stay the same. Why not use squared error for every target? Category names have no meaningful numeric distance, so classification needs a loss suited to categories.

      Robots use the same setup. In learning from demonstrations, the input is what the robot's camera sees and the target is the action a human took.
    worked: |
      This example shows two targets and identifies which ones are categories.

      A parcel's delivery status—today or tomorrow—is a category, so predicting it is classification.

      A robot's action—"grasp" or "release"—is also a category, so predicting it is classification.
    problems:
      - slp-new-houses
      - slp-regression-classification
      - slp-target-type-travel
      - slp-target-type-parcel
      - slp-low-training-loss
final: sl-explain-setup
summary: |
  - Five ingredients: inputs $x$, target $y$, a model $f_\theta$ with parameters $\theta$, a loss $L$, and a dataset of $(x, y)$ pairs.
  - The loss turns "how wrong" into a number. Squaring stops errors that are too high and too low from cancelling out.
  - Training picks the parameters with the smallest average loss on the training data, but what matters is performance on new data.

  **Where you'll use this:** linear regression, loss functions, gradient descent, training and evaluation splits, and behavioral cloning, where demonstration actions become targets for a robot.
