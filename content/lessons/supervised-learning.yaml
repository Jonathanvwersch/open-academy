concept: supervised-learning
version: 6
objective: |
  **Goal:** for any prediction problem, name its inputs, target, model and parameters, score predictions with squared error and average loss, and explain why training picks the parameters with the smallest average loss and then checks the model on examples it didn't learn from.
recap:
  - concept: what-is-ml
    text: "Machine learning gets a computer to do a task by choosing a rule, called a model, to fit examples, instead of having a person write the rule. Learning means choosing the values of the model's adjustable numbers."
where_this_fits: |
  ### What is supervised learning?

  Supervised learning is learning a rule from examples whose correct answers are already known. Each example pairs what we know, such as a house's size, with the answer we want, such as the price it sold for, and the computer adjusts its rule until its guesses come as close to those answers as it can.

  Why do we need to spell this out? "Make the predictions close to the real prices" is something a person understands, but a computer can't act on it. It has to be told exactly what goes in, what should come out, which numbers it may change, and how to score a guess. This lesson builds that exact setup, and every model in the course is trained inside it.
knowledge_points:
  - id: sl-inputs-targets
    title: "Name the inputs, target and model"

    tldr: |
      - The input is what we know, and the target is the answer we want.
      - A model turns the input into a prediction using adjustable numbers called parameters.
      - Learning chooses those parameters while the inputs and targets stay fixed.
    explain: |
      ### A rule for pricing houses

      Let's start with a problem we'll keep for the whole lesson. We have records of past house sales, each with a size and the price it sold for, and we want a rule that prices a house for sale now. Prices are in thousands of pounds.

      Here's one rule we could try: multiply the size in square metres by 3, then add 50. Take a 100 m² house that sold for 370, meaning £370,000:
      $$
      \begin{aligned}
      3\times100&=300 &&\text{multiply the size}\\
      300+50&=350 &&\text{add the fixed amount}
      \end{aligned}
      $$
      The guess is a little below the real price. In the diagram, size goes in on the left and the guess comes out on the right. The real price, 370, never goes into the rule; we only compare the guess with it.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" aria-label="The input, a 100 square metre house, goes into a model with adjustable numbers w equals 3 and b equals 50, which outputs the prediction 350; the known target 370 is only compared with the prediction">
        <defs>
          <marker id="sl1-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <rect x="10" y="40" width="150" height="70" rx="8" fill="#ffffff" stroke="#d4d4d4"/>
          <text x="24" y="68" font-weight="700">input x</text>
          <text x="24" y="92">size 100 m²</text>
          <path d="M160 75 H200" stroke="#737373" stroke-width="2" marker-end="url(#sl1-arrow)"/>
          <rect x="205" y="20" width="230" height="110" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
          <text x="219" y="48" font-weight="700">model</text>
          <text x="219" y="74">ŷ = w × size + b</text>
          <text x="219" y="100" fill="#3b82f6">parameters: w = 3, b = 50</text>
          <text x="219" y="120" font-size="13" fill="#737373">(training may change these)</text>
          <path d="M435 75 H475" stroke="#737373" stroke-width="2" marker-end="url(#sl1-arrow)"/>
          <rect x="480" y="40" width="150" height="70" rx="8" fill="#ffffff" stroke="#d4d4d4"/>
          <text x="494" y="68" font-weight="700">prediction ŷ</text>
          <text x="494" y="92">350</text>
          <rect x="480" y="170" width="150" height="70" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
          <text x="494" y="198" font-weight="700">target y</text>
          <text x="494" y="222">370 (known price)</text>
          <path d="M555 112 V166" stroke="#737373" stroke-width="2" stroke-dasharray="5 4"/>
          <text x="565" y="145" fill="#737373">compare</text>
        </g>
      </svg>
      ```

      Nothing in the problem fixes the 3 and the 50; we picked them. With 4 and 0 instead, the same house gets $4\times100+0=400$. Choosing those two numbers well is what learning means here.

      ### The parts, in general

      **Supervised learning** fits a rule to a **dataset** of examples, each a pair $(x,y)$. The **input** $x$ is what we know when we make a prediction, here the size. The **target** $y$ is the answer we want, known for every example in the dataset, here the sale price. The **model**, written $f_\theta$, is the rule that turns an input into a prediction $\hat y$ ("y-hat"). Here $\theta$ ("theta") stands for its adjustable numbers, called its **parameters**. Our model is

      $$\hat y=w\times\text{size}+b,$$

      where the **weight** $w$ says how much each square metre adds and the **bias** $b$ is an amount added to every prediction. So $\theta$ is the pair $(w,b)$, and one choice of it, such as $w=3$ and $b=50$, is called a **setting**.

      Be careful not to treat the price as an input just because it's in the data. For a house on sale today, the price is exactly what we're trying to find, so the model can't be given it.
    worked: |
      Let's name the parts for the 100 m² house that sold for 370, and price it with two settings.

      1. **Name the input and the target.** The input is what we know in advance, and the target is the answer we want.
         $$x=100,\qquad y=370$$

      2. **Predict with Setting A, $w=3$ and $b=50$.** We multiply by the weight and add the bias.
         $$\hat y=3\times100+50=350$$

      3. **Predict with Setting B, $w=1.5$ and $b=230$.** The house is the same, and only the parameters change.
         $$\hat y=1.5\times100+230=380$$

      Setting A is 20 too low and Setting B 10 too high, so on this house Setting B is closer. But a setting that's close on one house can miss others badly, so one house isn't enough to judge it.
    problems:
      - sl-inputs-targets-basics
      - slp-why-price-not-input
      - slp-why-targets
      - slp-parameters
      - slp-predict
      - slp-input-target
  - id: sl-measuring-error
    title: "Score one prediction"

    tldr: |
      - Subtracting the target from a prediction tells us how far it missed.
      - Positive and negative misses can cancel even when every prediction is wrong.
      - Squaring each miss prevents cancellation and gives bigger misses much higher scores.
    explain: |
      ### How wrong is one guess?

      Setting A ($w=3$, $b=50$) priced the 100 m² house at 350 when it sold for 370. To improve, the computer needs "how wrong" as one number that it can try to make smaller. Which number should that be?

      The obvious first try is the **error**, the prediction minus the target. Add two past sales: an 80 m² house that sold for 280, and a 120 m² house that sold for 400. Let's calculate the errors in order of size:
      $$
      \begin{aligned}
      (\hat y_1,\hat y_2,\hat y_3)&=(290,350,410) &&\text{predict with Setting A}\\
      (290-280,\ 350-370,\ 410-400)&=(10,-20,10) &&\text{subtract each target}\\
      10-20+10&=0 &&\text{add the signed errors}
      \end{aligned}
      $$
      Here the subscripts number the houses. The total looks perfect because the high misses cancel the low one.

      ### Squaring each error

      Squaring fixes this, because the square of a negative number is positive. The curve shows each possible error squared. Errors of $+10$ and $-10$ both score 100, and the error of $-20$ scores 400.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" aria-label="The curve squared error equals error squared, for errors from minus 25 to 25, with points at error plus 10 scoring 100 and error minus 20 scoring 400, and a hollow point at minus 10 also scoring 100">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M60 380 H590" stroke="#737373"/>
          <path d="M320 390 V50" stroke="#d4d4d4"/>
          <path d="M70 67.5 Q320 692.5 570 67.5" fill="#171717" fill-opacity="0" stroke="#737373" stroke-width="2.5"/>
          <path d="M420 380 V330 M120 380 V180 M220 380 V330" stroke="#737373" stroke-width="1.5" stroke-dasharray="5 4"/>
          <circle cx="420" cy="330" r="5" fill="#3b82f6"/>
          <circle cx="120" cy="180" r="5" fill="#3b82f6"/>
          <circle cx="220" cy="330" r="5" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="432" y="352">houses 1 and 3: +10 → 100</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="132" y="176">house 2: −20 → 400</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="205" y="345" text-anchor="end" fill="#737373">−10 → 100</text>
          <text x="112" y="402">−20</text>
          <text x="210" y="402">−10</text>
          <text x="316" y="402">0</text>
          <text x="410" y="402">+10</text>
          <text x="508" y="402">+20</text>
          <text x="210" y="424" fill="#737373">error = prediction − target</text>
          <text x="330" y="60" fill="#737373">squared error</text>
        </g>
      </svg>
      ```

      Squaring also makes big misses count much more. Doubling a miss from 10 to 20 multiplies its score by four, from 100 to 400. That's usually what we want, because one big mistake tends to hurt more than two small ones.

      A **loss** is a rule that gives a prediction a score, and the worse the prediction, the bigger the score. The **squared error** is the loss

      $$L(\hat y,y)=(\hat y-y)^2,$$

      where $L$ stands for the loss, $\hat y$ for the prediction and $y$ for the target. Another loss is the **absolute error**, the miss with its sign dropped. It also stops misses cancelling, but a miss twice as big scores only twice as much.

      Be careful not to read a signed total of zero as a perfect model. Large misses can balance too.
    worked: |
      Let's score Setting A ($w=3$, $b=50$) on our three past sales.

      1. **Predict each house and find its error.** Each prediction is $3\times\text{size}+50$, and a positive error means the guess was too high.

         | House | Size (m²) | Sold for $y$ | Predicted $\hat y$ | Error $\hat y-y$ |
         | --- | --- | --- | --- | --- |
         | 1 | 80 | 280 | 290 | $+10$ |
         | 2 | 100 | 370 | 350 | $-20$ |
         | 3 | 120 | 400 | 410 | $+10$ |

      2. **Add the signed errors.** This shows the problem with using them directly.
         $$10+(-20)+10=0$$

      3. **Square each error instead.** Every square is positive, so nothing can cancel.
         $$10^2=100,\qquad (-20)^2=400,\qquad 10^2=100$$

      The signed total said "perfect", but the squared errors show that every house was missed, and house 2 by the most.
    problems:
      - sl-measuring-error-basics
      - slp-why-add-signed
      - slp-why-square
      - slp-squared-error
      - slp-error-sum
      - slp-why-square-not-absolute
      - slp-recover-prediction
  - id: sl-training-loss
    title: "Choose the best weight and bias"

    tldr: |
      - Each choice of weight and bias gives a squared error for every house.
      - Averaging those errors gives one score for that choice.
      - Training chooses the weight and bias that make the average score smallest.
    explain: |
      ### One score for a whole dataset

      Squared error scores one house, but we have three. How do we give a whole setting one score, so we can keep the best?

      We average its squared errors over the houses. For Setting A:
      $$
      \begin{aligned}
      \text{total}&=100+400+100=600 &&\text{add the squared errors}\\
      \text{average}&=600\div3=200 &&\text{divide by the house count}
      \end{aligned}
      $$
      A setting that badly misses even one house gets a large average.

      ### Trying different values of b

      Hold $w$ at 3 and try other values of $b$. Each dot shows the average squared error for one setting. With $b=40$, every prediction drops by 10:
      $$
      \begin{aligned}
      (10-10,\ -20-10,\ 10-10)&=(0,-30,0) &&\text{lower each error}\\
      0^2+(-30)^2+0^2&=900 &&\text{square and add}\\
      900\div3&=300 &&\text{average over three houses}
      \end{aligned}
      $$
      Of these five settings, $b=50$ gives the lowest average.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" aria-label="Average squared error against b with w fixed at 3: 600 at b equals 30, 300 at 40, 200 at 50, 300 at 60 and 600 at 70, lowest at b equals 50, Setting A">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M70 380 H600" stroke="#737373"/>
          <path d="M70 390 V40" stroke="#737373"/>
          <path d="M80 50 Q330 550 580 50" fill="#171717" fill-opacity="0" stroke="#737373" stroke-width="2"/>
          <path d="M130 380 V140 M230 380 V260 M330 380 V300 M430 380 V260 M530 380 V140" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="5 4"/>
          <circle cx="130" cy="140" r="5" fill="#737373"/>
          <circle cx="230" cy="260" r="5" fill="#737373"/>
          <circle cx="430" cy="260" r="5" fill="#737373"/>
          <circle cx="530" cy="140" r="5" fill="#737373"/>
          <circle cx="330" cy="300" r="6" fill="#3b82f6"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="142" y="136">600</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="242" y="256">300</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="418" y="256" text-anchor="end">300</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="518" y="136" text-anchor="end">600</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="300" y="336" fill="#3b82f6">Setting A: 200</text>
          <text x="118" y="402">30</text>
          <text x="218" y="402">40</text>
          <text x="318" y="402">50</text>
          <text x="418" y="402">60</text>
          <text x="518" y="402">70</text>
          <text x="250" y="428" fill="#737373">b, with w = 3</text>
          <text x="80" y="32" fill="#737373">average squared error</text>
        </g>
      </svg>
      ```

      ### The training formula

      Let's write the average as a formula. Number the houses 1, 2 and 3, and call house $i$'s input $x_i$ and its target $y_i$. The model predicts $f_\theta(x_i)$ for it, so its loss is $L\big(f_\theta(x_i),y_i\big)$, which we'll shorten to $L_i$. For our three houses, the average is $\frac13(L_1+L_2+L_3)$.

      A dataset with $n$ examples would need $n$ terms, so we use $\sum_{i=1}^{n}$, which means "add up what follows for $i=1,2,\ldots,n$". The **average loss** is

      $$\frac{1}{n}\sum_{i=1}^{n}L\big(f_\theta(x_i),y_i\big),$$

      and with squared error it's called the **mean squared error (MSE)**. **Training** means choosing the parameters that make the average loss on the dataset as small as possible:

      $$\theta^\star=\arg\min_\theta\ \frac{1}{n}\sum_{i=1}^{n}L\big(f_\theta(x_i),y_i\big).$$

      Read $\arg\min_\theta$ as "the $\theta$ that makes what follows smallest", and $\theta^\star$ ("theta star") as the name of that best setting.

      Be careful not to think training changes the data to fit the model. The inputs and targets stay fixed, and only the parameters $\theta$ move.
    worked: |
      Let's compare Setting A ($w=3$, $b=50$) with Setting B ($w=1.5$, $b=230$) on our three sales, using squared error.

      1. **Average Setting A's squared errors.** We found them in step 2: 100, 400 and 100.
         $$\frac{100+400+100}{3}=\frac{600}{3}=200$$

      2. **Find Setting B's predictions.** Multiply each size by its weight, then add the bias.
         $$\begin{aligned}
         (1.5\times80,\ 1.5\times100,\ 1.5\times120)&=(120,150,180) &&\text{weight the sizes}\\
         (\hat y_1,\hat y_2,\hat y_3)&=(120+230,\ 150+230,\ 180+230) &&\text{add the bias}\\
         &=(350,380,410) &&\text{finish the predictions}
         \end{aligned}$$

      3. **Subtract the targets.** A positive error means the prediction is too high.
         $$(350-280,\ 380-370,\ 410-400)=(70,10,10)$$

      4. **Average Setting B's squared errors.** The big miss on house 1 dominates.
         $$\frac{70^2+10^2+10^2}{3}=\frac{4900+100+100}{3}=1700$$

      Since $200<1700$, training prefers Setting A, even though Setting B was closer on house 2. Trying a few settings can't prove which is best, but a calculation beyond this lesson shows that no choice of $w$ and $b$ beats 200 here, so $\theta^\star=(3,50)$. Real models have too many parameters to check by hand, and gradient descent, a method later in Week 1, searches for the best setting automatically.
    problems:
      - sl-training-loss-basics
      - slp-why-every-house
      - slp-argmin
      - slp-best-setting
      - slp-average-mse
      - slp-why-average
      - slp-recover-loss
  - id: sl-new-data-targets
    title: "Test on new houses, and target types"

    tldr: |
      - A model needs to work on examples it never learned from.
      - Scoring held-back examples checks how well it handles new inputs.
      - Predicting categories instead of numbers needs a different way to score mistakes.
    explain: |
      ### Scoring houses the model hasn't seen

      Training made the average loss small on our past sales. But the point is to price houses that haven't sold yet, so how do we check that?

      We keep some sales back. The three sales we've used so far are the ones we judged $w$ and $b$ on, so we call them the **training** sales. Two more, a 90 m² house that sold for 330 and a 110 m² house that sold for 360, play no part in choosing $w$ and $b$, so we only score Setting A on them. Its average squared error is 200 on the training sales and 250 on the held-back sales. The second number is the fair guide, because those houses are new to the model, just like a house for sale today.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" aria-label="Five past sales split into three training sales, used to choose w and b with average squared error 200, and two held-back sales, only scored, with average squared error 250">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text x="20" y="30" font-weight="700" fill="#3b82f6">training sales: choose w and b</text>
          <rect x="20" y="45" width="110" height="60" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
          <text x="34" y="72">80 m²</text><text x="34" y="94" fill="#737373">sold 280</text>
          <rect x="140" y="45" width="110" height="60" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
          <text x="154" y="72">100 m²</text><text x="154" y="94" fill="#737373">sold 370</text>
          <rect x="260" y="45" width="110" height="60" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
          <text x="274" y="72">120 m²</text><text x="274" y="94" fill="#737373">sold 400</text>
          <text x="400" y="30" font-weight="700" fill="#f59e0b">held back: only scored</text>
          <rect x="400" y="45" width="110" height="60" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
          <text x="414" y="72">90 m²</text><text x="414" y="94" fill="#737373">sold 330</text>
          <rect x="520" y="45" width="110" height="60" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
          <text x="534" y="72">110 m²</text><text x="534" y="94" fill="#737373">sold 360</text>
          <path d="M20 140 H370" stroke="#3b82f6" stroke-width="3"/>
          <path d="M400 140 H630" stroke="#f59e0b" stroke-width="3"/>
          <text x="20" y="172">Setting A: average squared error 200</text>
          <text x="400" y="172">Setting A: average 250</text>
          <text x="400" y="196" fill="#737373">how it does on new houses</text>
        </g>
      </svg>
      ```

      Be careful not to take a small training loss as proof that a model works. The parameters were chosen to make the training loss small, so it flatters the model. Only sales the model never learned from show how it does on new houses.

      ### Numbers or categories

      So far our target has been a number, a price. But sometimes the answer we want is a category, such as whether a house sold above its asking price, the price its seller asked for. **Regression** predicts a number. **Classification** predicts a **category**, a label from a fixed list.

      The inputs, such as the size, can stay the same, but the model must now output a label, yes or no. Squared error can't score a label, because we can't subtract "no" from "yes". So classification needs a different loss, which later lessons introduce.
    worked: |
      Let's check Setting A ($w=3$, $b=50$) on the two held-back sales.

      1. **Predict the held-back houses.** They are 90 m² and 110 m², sold for 330 and 360.
         $$3\times90+50=320,\qquad 3\times110+50=380$$

      2. **Find their errors.** We subtract each sale price from its prediction.
         $$320-330=-10,\qquad 380-360=+20$$

      3. **Average their squared errors.** There are two houses, so we divide by 2.
         $$\frac{(-10)^2+20^2}{2}=\frac{100+400}{2}=250$$

      Setting A does a little worse on the new houses, 250 against 200. Here are the two kinds of target side by side:

      | Target | Example answer | Kind | Task |
      | --- | --- | --- | --- |
      | Sale price | $370$ | number | regression |
      | Sold above asking price? | yes | category | classification |
    problems:
      - sl-new-data-targets-basics
      - slp-why-held-back
      - slp-new-houses
      - slp-regression-classification
      - slp-target-and-evaluation
      - slp-target-type-travel
      - slp-target-type-parcel
      - slp-low-training-loss
final: sl-explain-setup
summary: |
  - A supervised problem has inputs $x$, a target $y$ known for every example, and a model $f_\theta$ that predicts $\hat y$. Training changes only its parameters $\theta$, such as a weight and a bias.
  - A loss scores one prediction. Squared error, $(\hat y-y)^2$, stops misses that are too high and too low from cancelling, and counts big misses much more.
  - Training picks the parameters with the smallest average loss on the training examples, $\theta^\star=\arg\min_\theta\frac1n\sum_{i=1}^{n}L\big(f_\theta(x_i),y_i\big)$.
  - Regression predicts numbers and classification predicts categories, and a model is judged on examples it didn't learn from.

  **Next:** The vectors lesson shows how to hold a house's several measurements, such as size and bedrooms, in one ordered list.
