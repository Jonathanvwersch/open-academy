concept: supervised-learning
version: 1
fast_path: [objective, summary]
blocks:
  - kind: objective
    md: |
      **Goal:** identify the inputs, targets, model family, loss and training data in any supervised problem.
  - kind: intuition
    md: |
      Supervised learning means learning a function from examples of inputs paired with correct outputs. There are always five ingredients:

      1. **Inputs** $x$ are the measured values used to make a prediction.
      2. **Targets** $y$ are the known answers, such as a sale price or category.
      3. A **model family** $f_\theta$ is a rule with adjustable parameters $\theta$, such as a line.
      4. A **loss** $L(f_\theta(x), y)$ measuring how wrong a prediction is.
      5. A **dataset** of $(x, y)$ pairs.

      Training searches for parameters that make the average loss small. The real goal is to make accurate predictions on new examples.
  - kind: example
    md: |
      Here are the five ingredients for predicting a house's sale price:

      1. **Inputs** $x$: the size in m² and the number of bedrooms.
      2. **Target** $y$: the sale price.
      3. **Model**: a line, $\hat y = w_1 x_1 + w_2 x_2 + b$. The weights $w_1, w_2$ and the offset $b$ are the adjustable parameters $\theta$.
      4. **Loss**: the squared error $(\hat y - y)^2$, averaged over all the houses.
      5. **Dataset**: 1,000 past sales, each one a pair of (size and bedrooms, price).

      Training picks $w_1, w_2, b$ so the average squared error on those 1,000 sales is small. The real test is how well the line prices houses it hasn't seen.

      A robot learning from demonstrations uses the same five ingredients: the input is what its camera sees, and the target is the action the human took.
  - kind: math
    md: |
      Here's how "make the average loss small" becomes one formula. We'll build it in three steps with the house example.

      **1. The loss on one house.** For house number $i$, the model predicts $f_\theta(x_i)$ and the true price is $y_i$. The loss $L\big(f_\theta(x_i), y_i\big)$ is a single number saying how wrong that one prediction is. With squared error it is $\big(f_\theta(x_i) - y_i\big)^2$.

      **2. The average over all houses.** Add up the loss for every house and divide by the number of houses $n$:

      $$\frac{1}{n}\sum_{i=1}^{n} L\big(f_\theta(x_i), y_i\big)$$

      The symbol $\sum_{i=1}^{n}$ just means "add this up for $i = 1, 2, \dots, n$". For the 1,000 past sales, $n = 1000$.

      **3. Pick the best parameters.** Different parameters $\theta$ (here $w_1, w_2, b$) give different average losses. Training looks for the $\theta$ that makes the average as small as possible:

      $$\theta^\star = \arg\min_\theta \frac{1}{n}\sum_{i=1}^{n} L\big(f_\theta(x_i), y_i\big)$$

      Read $\arg\min_\theta$ as "the value of $\theta$ that gives the smallest result", and $\theta^\star$ as "the best parameters". The gradient descent lesson shows how training actually finds them.
  - kind: intuition
    md: |
      **Two kinds of target.** When the target $y$ is a number, like a sale price or tomorrow's electricity demand, the problem is called **regression**. When $y$ is a category, like "spam" or "not spam", it is called **classification**. The five ingredients are the same either way. Only the kind of target changes, and with it the choice of loss.
  - kind: check
    exercise: sl-check-target
  - kind: summary
    md: |
      - The five ingredients are inputs, targets, model, loss and data.
      - Training minimises the average loss on the training set, but what matters is performance on unseen data.
