      Now make red light on half the trials, blue on a quarter, and green and yellow on an eighth each. First score the outcomes, then average:
      $$\begin{aligned}\log_2 2&=1 &&\text{red's surprise}\\\log_2 4&=2 &&\text{blue's surprise}\\\log_2 8&=3 &&\text{green's and yellow's surprise}\\H&=\tfrac12(1)+\tfrac14(2)+\tfrac18(3)+\tfrac18(3) &&\text{weight by actual probabilities}\\&=1.75 &&\text{add, in bits}\end{aligned}$$

      This lies below the equal-probability result. Equal probabilities give the largest entropy for any fixed number of outcomes, though we won't prove that here. Zero is the minimum because surprises cannot be negative.
    worked: |
      Let's compute the weather's entropy.

      1. **Find each weather outcome's surprise.** For sun, cloud and rain, take logarithms of the reciprocals of $1/2,1/4,1/4$.
         $$\text{surprises: }1,\ 2,\ 2\text{ bits}$$

      2. **Weight and add.** To average across days, each surprise must count in proportion to how often it occurs.
         $$H(p)=\frac12\times1+\frac14\times2+\frac14\times2=1.5\text{ bits}$$

      Be careful not to average the three surprises equally. That incorrectly treats rainy and sunny days as equally common:
      $$\begin{aligned}(1+2+2)/3&=5/3 &&\text{incorrect equal weighting}\\&\approx1.667 &&\text{incorrect average in bits}\end{aligned}$$
    problems:
