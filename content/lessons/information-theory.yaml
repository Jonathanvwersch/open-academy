concept: information-theory
version: 1
objective: |
  **Goal:** compute entropy and cross-entropy for small distributions and explain why cross-entropy is the loss for classification.
recap:
  - concept: probability-basics
    text: A distribution lists outcome probabilities between 0 and 1, adding to 1. An expected value is a probability-weighted average. Independent events are events where knowing one happened does not change the chance of the other. Independent chances multiply.
where_this_fits: |
  ### What does information theory measure?

  Information theory measures surprise, meaning how unexpected an outcome is given its probability.

  A weather app uses a model to calculate probabilities for sunny, cloudy and rainy. We call these answers classes and the model a classifier. But are its probabilities good? Accuracy is the fraction of correct picks but ignores confidence, how strongly a pick is favoured.

  We'll compare forecasts with actual probabilities describing how often each weather happens over many days. We'll compute entropy, the average surprise from actual probabilities, and cross-entropy, which weights forecast surprises by actual probabilities. Cross-entropy scores errors as a loss. We train the model by changing its calculation to lower this loss. The difference from entropy, KL divergence, measures the extra surprise from wrong forecasts.
knowledge_points:
  - id: it-surprise
    title: Measure how surprising an outcome is
    tldr: |
      - Rare outcomes surprise us more than likely ones when they happen.
      - We measure surprise in bits, where a fair coin's result is one bit.
      - Each halving of an outcome's chance adds one more bit.
      - When independent outcomes happen together, their surprises add up.
    explain: |
      ### Rare outcomes tell us more

      To judge forecasts, we first need a number for how unexpected an outcome is. Over many days, suppose sun happens half the time, cloud a quarter and rain a quarter. Their actual distribution is $p=(1/2,1/4,1/4)$.

      Rain is less likely than sun, so it should give more surprise. An outcome sure to happen should give none. A **bit** measures the surprise of finding out which of two equally likely outcomes happened, such as a fair coin's heads or tails.

      The curve shows surprise falling as probability rises. Each point label gives probability first and surprise second.

