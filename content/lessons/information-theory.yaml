  - id: it-entropy
    title: Find the average surprise
    tldr: |
      - Each possible outcome has a surprise score.
      - Averaging those scores using their actual probabilities gives entropy.
      - Entropy is greatest when all the possible outcomes are equally likely.
    explain: |
      ### From one day to many

      We can score one outcome now. To summarise many days, we need an average that accounts for how often each weather happens.

      **Entropy** is the expected surprise of a distribution, written $H(p)$. Here $p$ gives the actual outcome probabilities.

      $$H(p)=p_1\log_2\frac{1}{p_1}+p_2\log_2\frac{1}{p_2}+\dots$$

      The entries $p_1,p_2$ are the probabilities of the first and second outcomes. The dots include the rest. Each term weights a surprise by its actual probability.

      ### Outcomes that never happen

      An outcome with probability zero contributes no observations to our total surprise. Its weighted contribution to the average is therefore zero. We use that value without evaluating the undefined $1/0$.

      ### Compare different distributions

      To compare probabilities on four outcomes, imagine a device that lights exactly one of red, blue, green and yellow. If red is certain, its zero surprise gives entropy zero. If all four are equally likely, each gives $\log_2 4=2$ bits, so the average is 2 bits. A fair coin's heads and tails each give 1 bit, so their average is 1 bit.

      The bars compare these cases with weather, whose 1.5-bit entropy we'll calculate below. R, B, G and Y mean red, blue, green and yellow. H and T mean heads and tails.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" aria-label="Probability bars for red certain, a fair coin, weather and four equal lights, with entropies 0, 1, 1.5 and 2 bits. Light bars are red, blue, green and yellow. Coin bars are heads and tails. Weather bars are sun, cloud and rain">
