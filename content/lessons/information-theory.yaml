      ### Doubling from 1

      A base-two logarithm, written $\log_2 x$, counts doublings from 1 to $x$. Three doublings give 2, then 4, then 8, so $\log_2 8=3$. For numbers between 2 and 4, the logarithm lies between 1 and 2. A calculator can evaluate these fractional logarithms.

      To calculate **surprise**, write $r$ for whichever single outcome probability we are scoring. This differs from $p$, which names the whole distribution.

      $$\text{surprise}=\log_2\frac{1}{r}\text{ bits}$$

      Rarer outcomes have larger reciprocals $1/r$, so they get larger surprises. Halving probability doubles its reciprocal, adding one doubling and thus one bit. The curve stops at $1/8$ because surprise grows without bound as probability approaches zero.

      ### Why a logarithm?

      If we report two coin results together instead of one at a time, their total surprise should not change.

      After the first heads, independence leaves the second heads chance at one half. So for two heads:
      $$\begin{aligned}P(\text{two heads})&=\tfrac12\times\tfrac12=\tfrac14 &&\text{multiply independent chances}\\\text{surprise}&=\log_2 4=2 &&\text{score the combined outcome}\\1+1&=2 &&\text{check the separate bit scores}\end{aligned}$$
      Logarithms turn products into sums because multiplying combines doublings. Using $1/r$ alone would multiply scores and give a certain outcome 1 rather than 0.
    worked: |
      Let's find sun's and rain's surprises.

      1. **Find the reciprocals.** We divide 1 by each probability.
         $$\begin{aligned}1/(1/2)&=2 &&\text{sun's reciprocal}\\1/(1/4)&=4 &&\text{rain's reciprocal}\end{aligned}$$

      2. **Count the doublings.** One doubling reaches 2, while two reach 4.
         $$\begin{aligned}\log_2 2&=1 &&\text{sun's surprise in bits}\\\log_2 4&=2 &&\text{rain's surprise in bits}\end{aligned}$$

      Cloud has the same probability and surprise as rain. Both give more surprise than sun.
