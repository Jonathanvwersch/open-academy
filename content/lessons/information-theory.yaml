      <text x="285" y="325">Four equal lights</text><path d="M285 370 h195" stroke="#737373"/><rect x="285" y="340" width="32" height="30" fill="#3b82f6"/><text x="301" y="390" text-anchor="middle">1/4</text>
      <rect x="329" y="340" width="32" height="30" fill="#3b82f6"/><text x="345" y="390" text-anchor="middle">1/4</text>
      <rect x="373" y="340" width="32" height="30" fill="#3b82f6"/><text x="389" y="390" text-anchor="middle">1/4</text>
      <rect x="417" y="340" width="32" height="30" fill="#3b82f6"/><text x="433" y="390" text-anchor="middle">1/4</text><text x="301" y="413" text-anchor="middle">R</text><text x="345" y="413" text-anchor="middle">B</text><text x="389" y="413" text-anchor="middle">G</text><text x="433" y="413" text-anchor="middle">Y</text><text x="285" y="439">2 bits</text>
      </g></svg>
