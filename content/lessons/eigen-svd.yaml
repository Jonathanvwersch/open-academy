      ### Eigenvectors and eigenvalues

      An **eigenvector** of a square matrix $A$ (one with as many rows as columns, so outputs have as many entries as inputs) is a vector $v$, other than the zero vector, that $A$ only stretches. Its **eigenvalue** is the stretch factor, a number written $\lambda$ (the Greek letter lambda):
      $$Av=\lambda v$$
      On the left is what the matrix does to $v$, and on the right is $v$ scaled by one number. A positive value keeps its direction, a negative one reverses it, and zero squashes it to the origin.

      - For $(1,1)$ above, $\lambda=3$, so the arrow triples in length.
      - For $(1,-1)$, $\lambda=1$, so the arrow stays exactly where it is.
      - A negative $\lambda$ flips the arrow round. The matrix $P=\begin{bmatrix}0&1\\1&0\end{bmatrix}$ swaps the two entries of its input, so it sends $(1,-1)$ to $(-1,1)$, which means $(1,-1)$ has $\lambda=-1$ for $P$.

      Along an eigenvector, a whole matrix acts like multiplying by a single number, which is why these directions are the easiest way to read what a matrix does.

      Be careful not to think an eigenvector is one particular arrow. Any nonzero multiple of it, such as $(2,2)$ or $(-5,-5)$ for $(1,1)$, is stretched by the same $\lambda$, so an eigenvector really names a whole direction.
    worked: |
      Let's check which of three inputs are eigenvectors of $A=\begin{bmatrix}2&1\\1&2\end{bmatrix}$, by multiplying each one and comparing the output with the input.

      1. **Multiply $(1,1)$.** Each output entry is a row of $A$ dotted with the input.
         $$A\begin{bmatrix}1\\1\end{bmatrix}=\begin{bmatrix}2+1\\1+2\end{bmatrix}=\begin{bmatrix}3\\3\end{bmatrix}=3\begin{bmatrix}1\\1\end{bmatrix}$$

      2. **Multiply $(1,-1)$.** The output equals the input, which is a stretch by $1$.
         $$A\begin{bmatrix}1\\-1\end{bmatrix}=\begin{bmatrix}2-1\\1-2\end{bmatrix}=\begin{bmatrix}1\\-1\end{bmatrix}=1\begin{bmatrix}1\\-1\end{bmatrix}$$

      3. **Multiply $(1,0)$.** If $(2,1)$ were $\lambda(1,0)$, its second entry would be $\lambda\times0=0$, but it is $1$.
         $$A\begin{bmatrix}1\\0\end{bmatrix}=\begin{bmatrix}2\\1\end{bmatrix}$$

      So $(1,1)$ is an eigenvector with eigenvalue $3$, $(1,-1)$ is an eigenvector with eigenvalue $1$, and $(1,0)$ is not an eigenvector.
