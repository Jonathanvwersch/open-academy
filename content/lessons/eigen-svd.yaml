      ### The singular value decomposition

      In symbols, the SVD writes a matrix as three moves. A turn may include a mirror flip, a reflection across a line:
      $$A=USV^\top$$
      $V$ has the perpendicular length-$1$ input directions as columns, so $V^\top$ dots the input with them. The diagonal entries of $S$ are the **singular values**, the stretches $s_1\ge s_2\ge0$. $U$ has the perpendicular length-$1$ output directions as columns. Here $e_i$ is the $i$th unit vector along an axis. For each input direction $v_i$, the three moves are:
      $$
      \begin{aligned}
      V^\top v_i&=e_i &&\text{turn onto axis }i\\
      Se_i&=s_i e_i &&\text{stretch by }s_i\\
      U(s_i e_i)&=s_i u_i &&\text{turn to }u_i
      \end{aligned}
      $$
      Thus $Av_i=s_i u_i$.

      For our $2\times2$ example, choose length-$1$ eigenvectors of $B^\top B$ as input directions. We'll use without proof that perpendicular choices always exist. Let $s_i^2$ be the eigenvalue for $v_i$. The squared output length is a self-dot product:
      $$
      \begin{aligned}
      \|Bv_i\|^2&=(Bv_i)^\top(Bv_i) &&\text{self-dot product}\\
      &=v_i^\top B^\top Bv_i &&\text{transpose the product}\\
      &=v_i^\top(s_i^2v_i) &&\text{eigenvector equation}\\
      &=s_i^2 &&\text{since }\|v_i\|=1
      \end{aligned}
      $$
      So the eigenvalues of $B^\top B$ are squared stretches. The singular values are their square roots.
      For a positive $s_i$, divide $Bv_i$ by $s_i$ to find $u_i$. A zero stretch gives zero output whichever direction we choose, so choose $u_i$ perpendicular to the other output direction. If both stretches are zero, use the coordinate axes for $U$.

      Be careful not to treat singular values as eigenvalues. $B$ has no real eigenvalues, yet its singular values are $10$ and $5$. Singular values are lengths, so they're never negative.
    worked: |
      Let's find the three moves for $B=\begin{bmatrix}4&-3\\6&8\end{bmatrix}$ with the eigenvalue method, then follow $v_1$ through them.

      1. **Multiply $B^\top$ by $B$.** The input directions are eigenvectors of $B^\top B$, so we build it first. Each entry is a row of $B^\top$ dotted with a column of $B$.
         $$B^\top B=\begin{bmatrix}4&6\\-3&8\end{bmatrix}\begin{bmatrix}4&-3\\6&8\end{bmatrix}=\begin{bmatrix}52&36\\36&73\end{bmatrix}$$

      2. **Find its eigenvalues.** They add up to $52+73=125$ and multiply to $52\times73-36\times36=2500$, so they're $100$ and $25$. The singular values are their square roots.
         $$s_1=\sqrt{100}=10,\qquad s_2=\sqrt{25}=5$$

      3. **Find the first input direction.** Putting $\lambda=100$ into the first row's equation gives $y=\tfrac43x$, and $(3,4)$ is on that line. Its length is $\sqrt{3^2+4^2}=5$, so divide both entries by $5$.
         $$(52-100)x+36y=0,\qquad v_1=(0.6,0.8)$$

      4. **Find the other input direction.** For $\lambda=25$, divide the first row's equation by $9$ and the second by $12$. Both give $3x+4y=0$. Choose $(-4,3)$, whose length is again $5$, and divide by $5$. Its dot product with $v_1$ is $0$, so it's perpendicular.
         $$3(-0.8)+4(0.6)=0,\qquad v_2=(-0.8,0.6)$$

      5. **Find the first output direction.** Since $Bv_1=s_1u_1$, multiply and divide by the singular value.
         $$u_1=\tfrac{1}{10}Bv_1=\tfrac{1}{10}(0,10)=(0,1)$$

      6. **Find the other output direction.** Do the same for the second input and its stretch.
         $$u_2=\tfrac15Bv_2=\tfrac15(-5,0)=(-1,0)$$

      7. **Turn $v_1$ onto an axis.** $V^\top$ dots it with $v_1$ and $v_2$.
         $$V^\top v_1=\begin{bmatrix}0.6&0.8\\-0.8&0.6\end{bmatrix}\begin{bmatrix}0.6\\0.8\end{bmatrix}=\begin{bmatrix}1\\0\end{bmatrix}$$

      8. **Stretch along the axes.** $S$ stretches the first axis by $10$ and the second by $5$.
         $$S\begin{bmatrix}1\\0\end{bmatrix}=\begin{bmatrix}10&0\\0&5\end{bmatrix}\begin{bmatrix}1\\0\end{bmatrix}=\begin{bmatrix}10\\0\end{bmatrix}$$

      9. **Turn to the output direction.** Put $u_1=(0,1)$ and $u_2=(-1,0)$ into the columns of $U$. This matrix makes a quarter turn.
         $$U\begin{bmatrix}10\\0\end{bmatrix}=\begin{bmatrix}0&-1\\1&0\end{bmatrix}\begin{bmatrix}10\\0\end{bmatrix}=\begin{bmatrix}0\\10\end{bmatrix}$$

      That's $Bv_1$. The same moves take $v_2$ to $(0,1)$, then $(0,5)$, then $(-5,0)=Bv_2$.

      Every input is a sum of multiples of these perpendicular directions. For example, dotting $(1,0)$ with $v_1$ and $v_2$ gives $0.6$ and $-0.8$, and those coefficients rebuild the input:
      $$0.6v_1-0.8v_2=0.6(0.6,0.8)-0.8(-0.8,0.6)=(1,0).$$
      Matrix multiplication distributes over the sum, so checking both directions checks every input.
    problems:
      - eig-svd-three-moves-basics
      - eigp-svd-self-explain
      - eigp-singular-sign
      - eigp-longest-output-template
      - eigp-second-direction
      - eigp-svd-no-eigen
      - eigp-robot-arm
  - id: eig-low-rank
    title: "Approximate a matrix with fewer numbers"

    tldr: |
      - The SVD lets us write a matrix as a sum of pieces, one per stretch.
      - Big stretches matter most, so we keep the biggest pieces and drop the rest.
      - The copy needs far fewer numbers, and its error is at most the biggest stretch we dropped.
    explain: |
      ### A matrix as a sum of pieces

      If one stretch is much bigger than the other, most of what the matrix does happens along that direction. Can we keep just the big stretch and drop the rest?

      We split the matrix into one piece per singular value. A column $u_1$ times a row $v_1^\top$ is a $2\times2$ matrix. For an input $x$, the first piece acts in two moves:
      $$
      \begin{aligned}
      s_1u_1v_1^\top x&=s_1u_1(v_1^\top x) &&\text{dot the input with }v_1\\
      &=(v_1^\top x)(s_1u_1) &&\text{scale }s_1u_1\text{ by that number}
      \end{aligned}
      $$
      It sends the two perpendicular unit directions to:
      $$
      \begin{aligned}
      s_1u_1v_1^\top v_1&=s_1u_1 &&v_1^\top v_1=1\\
      s_1u_1v_1^\top v_2&=0 &&v_1^\top v_2=0
      \end{aligned}
      $$
      The second piece handles $v_2$, so together the pieces handle every input:
      $$A=s_1u_1v_1^\top+s_2u_2v_2^\top.$$

      ### Low-rank approximation

      The **rank** is the number of nonzero singular values. Keeping the biggest $k$ nonzero pieces gives a **low-rank approximation** $A_k$. Its maximum output error over length-$1$ inputs is the first singular value dropped. For the rank-1 copy $A_1=s_1u_1v_1^\top$, write a length-$1$ input as $x=c_1v_1+c_2v_2$. The coordinates and their lengths are:
      $$
      \begin{aligned}
      c_1&=v_1^\top x &&\text{coordinate along }v_1\\
      c_2&=v_2^\top x &&\text{coordinate along }v_2\\
      1=\|x\|^2&=c_1^2+c_2^2 &&\text{Pythagoras}\\
      |c_2|&\le1 &&\text{each side is at most the hypotenuse}
      \end{aligned}
      $$
      Dropping the second piece leaves this error:
      $$
      \begin{aligned}
      (A-A_1)x&=s_2u_2v_2^\top x &&\text{omitted second piece}\\
      &=s_2c_2u_2 &&\text{use }c_2=v_2^\top x\\
      \|(A-A_1)x\|&=s_2|c_2| &&\text{unit output direction }u_2\\
      &\le s_2 &&\text{since }|c_2|\le1
      \end{aligned}
      $$
      We'll use without proof that no rank-$k$ matrix has a smaller worst-case error.

      For $B$, the first piece is the rank-1 copy $B_1=10\,u_1v_1^\top$. The picture compares both matrices on the same length-1 inputs: $B$ makes the grey ellipse, while $B_1$ makes the green line. For $v_2$, their outputs are $(-5,0)$ and $(0,0)$, separated by the red gap of length $5=s_2$. Hold the directions and first stretch fixed, and change the second stretch:

      - With $s_2=5$, as in $B$, it's off by up to $5$.
      - With $s_2=0.5$, it's off by at most $0.5$.
      - With $s_2=0$, the copy is exact.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="160 10 360 300" aria-label="The grey ellipse of all outputs of B, reaching 10 up and down and 5 left and right of the origin. The rank-1 copy B1 squashes every output onto the green vertical line from (0, minus 10) to (0, 10). For the input v2, B gives (minus 5, 0) on the ellipse while B1 gives (0, 0); the red gap between them is 5">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#171717">
      <path d="M200 160 H440 M320 300 V20" stroke="#d4d4d4"/>
      <ellipse cx="320" cy="160" rx="60" ry="120" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="2"/>
      <path d="M320 280 L320 40" stroke="#10b981" stroke-width="5"/>
      <path d="M260 160 L320 160" stroke="#ef4444" stroke-width="3"/>
      <circle cx="260" cy="160" r="5" fill="#171717"/>
      <circle cx="320" cy="160" r="5" fill="#10b981"/>
      <circle cx="320" cy="40" r="5" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="332" y="45">Bv₁ = B₁v₁<tspan x="332" dy="22">= (0, 10)</tspan></text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="245" y="153" text-anchor="end">Bv₂<tspan x="245" dy="22">= (−5, 0)</tspan></text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="330" y="186" fill="#10b981">B₁v₂ = (0, 0)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="290" y="148" fill="#ef4444" text-anchor="middle">5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="374" y="238" fill="#737373">outputs of B</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="332" y="275" fill="#10b981">outputs of B₁</text>
      </g>
      </svg>
      ```

      ### Why fewer numbers

      Absorb each singular value into its column. A rank-$k$ copy stores $k$ columns with $m$
      entries and $k$ rows with $n$ entries:
      $$
      \begin{aligned}
      \text{entries}&=km+kn &&\text{count both factors}\\
      &=k(m+n) &&\text{factor out }k
      \end{aligned}
      $$
      A $1000\times1000$ matrix's rank-8 copy uses:
      $$8(1000+1000)=16{,}000.$$
      That's fewer than a million entries. LoRA, introduced next, uses factors like these to learn changes to a language model's weight matrices.
