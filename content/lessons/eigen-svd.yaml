  - id: eig-low-rank
    title: "Approximate a matrix with fewer numbers"
    explain: |
      ### A matrix as a sum of pieces

      If one stretch is much bigger than the other, most of what the matrix does happens along that direction. Can we keep just the big stretch and drop the rest?

      We split the matrix into one piece per singular value. A column $u_1$ ($2\times1$) times a row $v_1^\top$ ($1\times2$) is a $2\times2$ matrix. The piece $s_1u_1v_1^\top$ dots the input with $v_1$ and multiplies $s_1u_1$ by the result, so it sends $v_1$ to $s_1u_1$ and the perpendicular $v_2$ to zero. The second piece does the same for $v_2$. Their sum treats $v_1$ and $v_2$ just as $A$ does, and since every input is a mix of the two,
      $$A=s_1u_1v_1^\top+s_2u_2v_2^\top.$$

      ### Low-rank approximation

      The **rank** of a matrix is the number of its singular values that aren't zero. Keeping only the biggest $k$ pieces gives a **low-rank approximation** $A_k$ of rank $k$, off by at most the first singular value we dropped. With two pieces, a length-1 input is $c_1v_1+c_2v_2$ with $c_1^2+c_2^2=1$ by Pythagoras, so dropping the second changes its output by $c_2s_2u_2$, at most $s_2$ long. We'll use without proof that no rank-$k$ matrix is off by less.

      For $B$, the first piece alone is the rank-1 copy $B_1=10\,u_1v_1^\top$. In the picture, $B$ turns the circle of length-1 arrows into the grey ellipse, while $B_1$ squashes it onto the green line. For $v_2$, $B$ gives $(-5,0)$ and $B_1$ gives $(0,0)$, off by the red $5=s_2$. If we change $B$'s $s_2$ and keep the rest, $B_1$ stays the same.

      - With $s_2=5$, as in $B$, it's off by up to $5$.
      - With $s_2=0.5$, it's off by at most $0.5$.
      - With $s_2=0$, the copy is exact.

