      Let's build the rank-1 copy of $B=\begin{bmatrix}4&-3\\6&8\end{bmatrix}$ from its first stretch $s_1=10$ and directions $u_1=(0,1)$ and $v_1=(0.6,0.8)$. We'll compare its outputs with $B$'s.

      1. **Build the first piece.** A column times a row gives each entry as one entry of $u_1$ times one entry of $v_1$, then everything is multiplied by $s_1=10$.
         $$B_1=10\begin{bmatrix}0\times0.6&0\times0.8\\1\times0.6&1\times0.8\end{bmatrix}=\begin{bmatrix}0&0\\6&8\end{bmatrix}$$

      2. **Build the second piece.** The same recipe with stretch $s_2=5$, output direction $u_2=(-1,0)$ and input direction $v_2=(-0.8,0.6)$ gives what the copy leaves out.
         $$5\begin{bmatrix}-1\times(-0.8)&-1\times0.6\\0\times(-0.8)&0\times0.6\end{bmatrix}=\begin{bmatrix}4&-3\\0&0\end{bmatrix}$$

      3. **Check that the pieces add up to $B$.** Adding entry by entry gives the matrix we started with.
         $$\begin{bmatrix}0&0\\6&8\end{bmatrix}+\begin{bmatrix}4&-3\\0&0\end{bmatrix}=\begin{bmatrix}4&-3\\6&8\end{bmatrix}$$

      4. **Compare outputs for $v_1$.** The copy gets this direction exactly right.
         $$B_1v_1=\begin{bmatrix}0\\6\times0.6+8\times0.8\end{bmatrix}=\begin{bmatrix}0\\10\end{bmatrix}=Bv_1$$

      5. **Compare outputs for $v_2$.** Here the copy gives zero, while $B$ gives $(-5,0)$.
         $$B_1v_2=\begin{bmatrix}0\\6\times(-0.8)+8\times0.6\end{bmatrix}=\begin{bmatrix}0\\0\end{bmatrix}$$

      So the rank-1 copy is exact along $v_1$ and off by $5=s_2$ along $v_2$, the largest error any length-1 input can have.
