      <path d="M175 275 L375 75 M175 225 L280 330" stroke="#737373" stroke-width="1.5" stroke-dasharray="6 5"/>
      <path d="M200 250 L350 100" stroke="#3b82f6" stroke-width="3" marker-end="url(#eig1-blue)"/>
      <path d="M200 250 L300 200" stroke="#3b82f6" stroke-width="3" marker-end="url(#eig1-blue)"/>
      <path d="M200 250 L250 300" stroke="#3b82f6" stroke-width="7" marker-end="url(#eig1-blue-s)"/>
