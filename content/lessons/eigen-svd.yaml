concept: eigen-svd
version: 1
objective: |
  **Goal:** find the eigenvalues and eigenvectors of a $2\times2$ matrix, explain the SVD as rotate, stretch, rotate, and use its biggest stretches to approximate a matrix with fewer numbers.
recap:
  - concept: matrices
    text: "A matrix times a vector dots each row with the vector, $\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}\\begin{bmatrix}x\\\\y\\end{bmatrix}=\\begin{bmatrix}ax+by\\\\cx+dy\\end{bmatrix}$. An $m\\times n$ matrix has $m$ rows and $n$ columns, and $(m\\times n)(n\\times p)$ gives $m\\times p$. The transpose $A^\\top$ swaps rows and columns."
where_this_fits: |
  ### What are eigenvectors and the SVD?

  An eigenvector of a matrix is a direction that the matrix only stretches. An arrow pointing that way comes out pointing the same way, just longer, shorter or flipped. The singular value decomposition, or SVD, works for every matrix and splits it into three simple moves, a turn (sometimes with a mirror flip), a stretch along the $x$- and $y$-axes and another turn.

  This is useful because a grid of numbers is hard to read, while a few stretches are easy to read. Keeping only the biggest stretches gives a close copy of the matrix stored in far fewer numbers. LoRA, a cheap way to adapt a trained language model, trains a separate low-rank change to its weights.
knowledge_points:
  - id: eig-stretch-directions
    title: "Find directions a matrix only stretches"
    explain: |
      ### What a matrix does to arrows

      In the matrices lesson, we multiplied a matrix by a vector to get a new vector. If we draw both as arrows from the origin, the matrix moves each input arrow to an output arrow. Usually the output points somewhere new. But for some inputs it points along the same line as the input, and this step finds those special directions.

      Let's take
      $$A=\begin{bmatrix}2&1\\1&2\end{bmatrix}$$
      and try three inputs. In the picture, grey arrows are inputs and blue arrows are what $A$ makes of them. The input $(1,1)$ comes out as $(3,3)$, on the same dashed line and three times as long. The input $(1,-1)$ comes out as $(1,-1)$, unchanged. The input $(1,0)$ comes out as $(2,1)$, which has turned off its line.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" aria-label="Three grey input arrows and the blue arrows the matrix with rows (2, 1) and (1, 2) turns them into. The input (1, 1) becomes (3, 3) on the same dashed line, three times as long. The input (1, minus 1) stays (1, minus 1). The input (1, 0) becomes (2, 1), which points in a new direction">
      <defs><marker id="eig1-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="eig1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="eig1-blue-s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M150 250 H420 M200 345 V40" stroke="#d4d4d4"/>
      <path d="M175 275 L375 75 M175 225 L280 330" stroke="#737373" stroke-width="1.5" stroke-dasharray="6 5"/>
      <path d="M200 250 L350 100" stroke="#3b82f6" stroke-width="3" marker-end="url(#eig1-blue)"/>
      <path d="M200 250 L300 200" stroke="#3b82f6" stroke-width="3" marker-end="url(#eig1-blue)"/>
      <path d="M200 250 L250 300" stroke="#3b82f6" stroke-width="7" marker-end="url(#eig1-blue-s)"/>
      <path d="M200 250 L250 200" stroke="#737373" stroke-width="2.5" marker-end="url(#eig1-grey)"/>
      <path d="M200 250 L250 250" stroke="#737373" stroke-width="2.5" marker-end="url(#eig1-grey)"/>
      <path d="M200 250 L250 300" stroke="#737373" stroke-width="2.5" marker-end="url(#eig1-grey)"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="232" y="190" fill="#737373" text-anchor="end">(1, 1)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="358" y="98" fill="#3b82f6">(3, 3): 3 times as long</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="306" y="196" fill="#3b82f6">(2, 1): turned</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="256" y="268" fill="#737373">(1, 0)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="262" y="314">(1, −1) stays (1, −1)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="414" y="270" fill="#737373">x</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="207" y="50" fill="#737373">y</text>
      </g>
      </svg>
