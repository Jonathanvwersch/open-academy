concept: eigen-svd
version: 2
objective: |
  **Goal:** find the eigenvalues and eigenvectors of a $2\times2$ matrix, explain the SVD as rotate, stretch, rotate, and use its biggest stretches to approximate a matrix with fewer numbers.
recap:
  - concept: matrices
    text: "A matrix times a vector dots each row with the vector. The transpose $A^\\top$ swaps rows and columns. A vector's squared length is its dot product with itself; perpendicular vectors have dot product $0$."
  - concept: orthogonality-projections
    text: "Column vectors use $x^\\top y$ for dot products; $(AB)^\\top=B^\\top A^\\top$. Orthonormal columns make square $Q$ an orthogonal matrix with $Q^\\top Q=I$; diagonal matrices have zeros outside the main diagonal; products regroup as $(AB)x=A(Bx)$ and distribute as $A(x+y)=Ax+Ay$."
where_this_fits: |
  ### What are eigenvectors and the SVD?

  An eigenvector of a matrix is a direction that the matrix only stretches. A vector can get longer, shorter, reverse direction or shrink to zero. The singular value decomposition, or SVD, works for every matrix. In two dimensions, its three moves are a turn (sometimes with a mirror flip), a stretch along the axes and another turn.

  This is useful because a grid of numbers is hard to read, while a few stretches are easy to read. When some stretches are small, dropping them gives a close copy stored in fewer numbers. We'll measure how close it is by how much the outputs change. This helps compress matrices and makes updating trained language models cheaper.
knowledge_points:
  - id: eig-stretch-directions
    title: "Find directions a matrix only stretches"

    tldr: |
      - A matrix turns each vector into a new vector, which usually points a different way.
      - Some directions don't turn, and the matrix only stretches them.
      - Those directions are the eigenvectors, and how much each one stretches is its eigenvalue.
    explain: |
      ### What a matrix does to arrows

      In the matrices lesson, we multiplied a matrix by a vector to get a new vector. If we draw both as arrows from the origin, the matrix moves each input arrow to an output arrow. Usually the output points somewhere new. But for some inputs it points along the same line as the input, and this step finds those special directions.

      Let's take
      $$A=\begin{bmatrix}2&1\\1&2\end{bmatrix}$$
      and try three inputs. In the picture, grey arrows are inputs and blue arrows are what $A$ makes of them. The input $(1,1)$ comes out as $(3,3)$, on the same dashed line and three times as long. The input $(1,-1)$ comes out as $(1,-1)$, unchanged. The input $(1,0)$ comes out as $(2,1)$, which has turned off its line.

      ```svg academy-visual=eigen-directions
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="140 40 400 310" aria-label="Three grey input arrows and the blue arrows the matrix with rows (2, 1) and (1, 2) turns them into. The input (1, 1) becomes (3, 3) on the same dashed line, three times as long. The input (1, minus 1) stays (1, minus 1). The input (1, 0) becomes (2, 1), which points in a new direction">
      <defs><marker id="eig1-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="eig1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="eig1-blue-s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
