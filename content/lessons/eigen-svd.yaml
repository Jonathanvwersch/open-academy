summary: |
  - An eigenvector of a square matrix $A$ is a direction that $A$ only stretches, so $Av=\lambda v$, and its eigenvalue $\lambda$ is the stretch factor. Any nonzero multiple of an eigenvector is also one.
  - For $A=\begin{bmatrix}a&b\\c&d\end{bmatrix}$, the eigenvalues solve $\lambda^2-(a+d)\lambda+(ad-bc)=0$, so they add up to $a+d$ and multiply to $ad-bc$. Putting each one into both $(a-\lambda)x+by=0$ and $cx+(d-\lambda)y=0$ gives its eigenvector; a row that reduces to $0=0$ gives no restriction.
  - Every matrix has an SVD, $A=USV^\top$. Read from right to left, $V^\top$ turns the input directions onto the axes, $S$ stretches them, and $U$ turns them onto the output directions. Either turn may include a mirror flip. For our $2\times2$ case, the stretches are $s_1\ge s_2\ge0$, with $Av_1=s_1u_1$ and $Av_2=s_2u_2$. They are the square roots of the eigenvalues of $A^\top A$.
  - Keeping the $k$ biggest pieces, such as $s_1u_1v_1^\top$, gives the closest rank-$k$ matrix, off by at most the first singular value dropped for any length-1 input. A rank-$k$ matrix with $m$ rows and $n$ columns needs only $k(m+n)$ numbers.

  **Next:** LoRA updates a trained language model by learning a low-rank change to its weight matrices, which store its learned numbers. The existing weights stay fixed, so only the much smaller change is learned from new examples.
