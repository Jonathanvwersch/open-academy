  - id: eig-find-eigenvalues
    title: "Find how much each direction stretches"

    tldr: |
      - Guessing directions only works for easy matrices, so we solve for them instead.
      - Asking for a vector that is only stretched gives one equation for the stretch amount.
      - Solving it gives the eigenvalues, and putting each one back in gives its direction.
    explain: |
      ### From guessing to solving

      We found special directions by trying arrows. Now we'll solve for the stretch factors, then their directions.

      Write $A=\begin{bmatrix}a&b\\c&d\end{bmatrix}$ and $v=(x,y)$. Move $\lambda x$ and $\lambda y$ to the left in $Av=\lambda v$:
      $$
      \begin{aligned}
      (a-\lambda)x+by&=0 &&\text{first row}\\
      cx+(d-\lambda)y&=0 &&\text{second row}
      \end{aligned}
      $$

      ### The equation for the eigenvalues

      Multiply the first row by $(d-\lambda)$ and the second by $b$, then subtract to remove $y$:
      $$
      \begin{aligned}
      (d-\lambda)((a-\lambda)x+by)-b(cx+(d-\lambda)y)&=0 &&\text{subtract}\\
      ((a-\lambda)(d-\lambda)-bc)x&=0 &&\text{collect }x
      \end{aligned}
      $$
      Multiplying the first row by $c$ and subtracting $(a-\lambda)$ times the second removes $x$:
      $$
      \begin{aligned}
      c((a-\lambda)x+by)-(a-\lambda)(cx+(d-\lambda)y)&=0 &&\text{subtract}\\
      (bc-(a-\lambda)(d-\lambda))y&=0 &&\text{collect }y
      \end{aligned}
      $$
      Let $q=(a-\lambda)(d-\lambda)-bc$. The two results give $qx=0$ and $-qy=0$, so:
      $$
      \begin{aligned}
      qx&=0 &&\text{from removing }y\\
      -qy&=0 &&\text{from removing }x\\
      qy&=0 &&\text{multiply by }-1
      \end{aligned}
      $$
      Since $x$ and $y$ can't both be zero, $q$ must be zero. We'll use without proof that $q=0$ also guarantees a nonzero solution of both row equations. Expanding $q$ gives:
      $$
      \begin{aligned}
      q&=(a-\lambda)(d-\lambda)-bc &&\text{definition}\\
      &=ad-(a+d)\lambda+\lambda^2-bc &&\text{multiply out}\\
      &=\lambda^2-(a+d)\lambda+(ad-bc) &&\text{group terms}
      \end{aligned}
      $$

      Call its solutions $\lambda_1$ and $\lambda_2$. Factoring and expanding gives:
      $$
      \begin{aligned}
      (\lambda-\lambda_1)(\lambda-\lambda_2)&=0 &&\text{the two roots}\\
      \lambda^2-(\lambda_1+\lambda_2)\lambda+\lambda_1\lambda_2&=0 &&\text{multiply out}
      \end{aligned}
      $$
      Matching coefficients shows their sum and product:
      $$
      \begin{aligned}
      \lambda_1+\lambda_2&=a+d &&\text{sum}\\
      \lambda_1\lambda_2&=ad-bc &&\text{product}
      \end{aligned}
      $$
      Try two numbers with that sum and product. Otherwise, the quadratic formula gives them directly; $\pm$ means calculate once with $+$ and once with $-$:
      $$\lambda=\frac{(a+d)\pm\sqrt{(a+d)^2-4(ad-bc)}}{2}.$$
      A negative number under the square root means no real eigenvalues, which here we call no eigenvalues.

      ### Three matrices side by side

      - For $\begin{bmatrix}2&1\\1&2\end{bmatrix}$:
        $$
        \begin{aligned}
        a+d&=2+2=4 &&\text{sum}\\
        ad-bc&=2\times2-1\times1=3 &&\text{product}\\
        \{\lambda_1,\lambda_2\}&=\{3,1\} &&\text{sum }4\text{, product }3
        \end{aligned}
        $$
      - For $\begin{bmatrix}3&0\\0&-1\end{bmatrix}$:
        $$
        \begin{aligned}
        a+d&=3+(-1)=2 &&\text{sum}\\
        ad-bc&=3\times(-1)-0=-3 &&\text{product}\\
        \{\lambda_1,\lambda_2\}&=\{3,-1\} &&\text{sum }2\text{, product }-3
        \end{aligned}
        $$
      - The matrix $\begin{bmatrix}0&-1\\1&0\end{bmatrix}$ sends $(1,0)$ to $(0,1)$ and $(0,1)$ to $(-1,0)$, a quarter turn. Its eigenvalues would have:
        $$
        \begin{aligned}
        a+d&=0 &&\text{sum}\\
        ad-bc&=1 &&\text{product}\\
        (a+d)^2-4(ad-bc)&=0^2-4\times1=-4<0 &&\text{discriminant}
        \end{aligned}
        $$
        A negative discriminant means it has no real eigenvalues.

      Be careful: diagonal entries give eigenvalues only when $b$ or $c$ is zero, because then $q=(a-\lambda)(d-\lambda)$. Check both row equations for each direction. For the diagonal example at $\lambda=3$, the rows become:
      $$
      \begin{aligned}
      0x+0y&=0 &&\text{first row}\\
      -4y&=0 &&\text{second row}
      \end{aligned}
      $$
      The first is true for every input, so use the second.
    worked: |
      Let's find the eigenvalues and eigenvectors of $A=\begin{bmatrix}2&1\\1&2\end{bmatrix}$ from the equation, and check that we get the directions we found by trying arrows.

      1. **Write the equation.** Here $a+d=4$ and $ad-bc=2\times2-1\times1=3$.
         $$\lambda^2-4\lambda+3=0$$

      2. **Find two numbers with sum $4$ and product $3$.** They are $3$ and $1$.
         $$(\lambda-3)(\lambda-1)=0,\qquad\lambda=3\text{ or }\lambda=1$$

      3. **Find the eigenvector for $\lambda=3$.** Substituting into both rows gives the same line, $y=x$.
         $$\begin{aligned}(2-3)x+y&=0\\x+(2-3)y&=0\end{aligned}$$

      4. **Find the eigenvector for $\lambda=1$.** The same equation with $\lambda=1$ gives the other direction.
         $$(2-1)x+y=0,\qquad y=-x$$

      Choosing $x=1$ gives $(1,1)$ with eigenvalue $3$ and $(1,-1)$ with eigenvalue $1$, the two directions $A$ only stretches.
    problems:
      - eig-find-eigenvalues-basics
      - eigp-solve-self-explain
      - eigp-sum-product
      - eigp-eigenvalue-template
      - eigp-diagonal-trap
      - eigp-eigenvector-entry
      - eigp-no-eigenvalues
      - eigp-population-growth
  - id: eig-svd-three-moves
    title: "Split any matrix into turn, stretch, turn"

    tldr: |
      - Some matrices turn every direction, so they have no eigenvectors.
      - But every matrix can be done in three moves: turn, stretch along the axes, turn again.
      - That's the SVD, and its stretch amounts are called singular values.
    explain: |
      ### A matrix with no stretch-only direction

      Some matrices have no real eigenvectors. Take
      $$B=\begin{bmatrix}4&-3\\6&8\end{bmatrix}.$$
      Its eigenvalue equation has a negative number under the square root:
      $$12^2-4\times50=-56.$$
      So no real arrow is only stretched by $B$. A different description, the **singular value decomposition** or SVD, works for every matrix, even nonsquare ones. It splits a matrix into a turn, a stretch along the axes and another turn. We'll work through the two-dimensional case.

      ### Turn, stretch, turn

      The tips of all length-$1$ arrows make a circle. $B$ turns it into an ellipse, an oval with a longest and shortest direction. Follow two perpendicular input arrows, $v_1=(0.6,0.8)$ and $v_2=(-0.8,0.6)$, through the picture. A turn lines them up with the axes. A stretch makes the green arrow $10$ long and the orange one $5$ long. Another turn points them along $u_1=(0,1)$ and $u_2=(-1,0)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 515" aria-label="Four panels, read across the top row then the bottom row. One: a circle of radius 1 with a green arrow v1 = (0.6, 0.8) and an orange arrow v2 = (minus 0.8, 0.6). Two: after the first turn, the green arrow lies along the x-axis and the orange along the y-axis. Three: after the stretch, an ellipse with the green arrow 10 long along x and the orange 5 long along y. Four: after the second turn, the green arrow points up, 10 long, and the orange points left, 5 long. The last two panels use a smaller scale">
      <defs><marker id="eig3-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker><marker id="eig3-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#171717">
      <text x="100" y="28" text-anchor="middle">1. Inputs</text><text x="300" y="28" text-anchor="middle">2. First turn</text>
      <text x="100" y="270" text-anchor="middle">3. Stretch</text><text x="300" y="270" text-anchor="middle">4. Last turn</text>
      <circle cx="100" cy="130" r="60" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="1.5"/>
