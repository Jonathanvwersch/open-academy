  - id: eig-svd-three-moves
    title: "Split any matrix into turn, stretch, turn"
    explain: |
      ### A matrix with no stretch-only direction

      Eigenvectors don't always exist. Take
      $$B=\begin{bmatrix}4&-3\\6&8\end{bmatrix}.$$
      Its diagonal adds to $12$ and $ad-bc=32+18=50$, and $12^2-4\times50=-56$ is negative, so $B$ has no eigenvalues. A matrix that isn't square has none either, since its outputs and inputs have different numbers of entries. So how can we describe what any matrix does to arrows?

      ### Turn, stretch, turn

      Think of all the arrows of length $1$, whose tips make a circle. Unless a $2\times2$ matrix squashes everything onto a line, it sends that circle to an ellipse, an oval with a longest and a shortest direction. The picture follows the circle through $B$ in three moves. First a turn lines up two perpendicular arrows, $v_1=(0.6,0.8)$ and $v_2=(-0.8,0.6)$, with the axes. Then a stretch makes the green arrow $10$ long and the orange one $5$ long. Then a second turn points them along $u_1=(0,1)$ and $u_2=(-1,0)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" aria-label="Four panels. One: a circle of radius 1 with a green arrow v1 = (0.6, 0.8) and an orange arrow v2 = (minus 0.8, 0.6). Two: after the first turn, the green arrow lies along the x-axis and the orange along the y-axis. Three: after the stretch, an ellipse with the green arrow 10 long along x and the orange 5 long along y. Four: after the second turn, the green arrow points up, 10 long, and the orange points left, 5 long. The last two panels are drawn at a smaller scale">
      <defs><marker id="eig3-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker><marker id="eig3-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker><marker id="eig3-grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
