  - id: eig-find-eigenvalues
    title: "Find how much each direction stretches"
    explain: |
      ### From guessing to solving

      In the last step we guessed eigenvectors, but we'd like a method that works for any $2\times2$ matrix. The trick is to find the eigenvalues first, because once we know the stretch, finding its direction is one equation.

      Write the matrix with letters, $A=\begin{bmatrix}a&b\\c&d\end{bmatrix}$, and the eigenvector as $v=(x,y)$. The equation $Av=\lambda v$ must hold in both entries of the output, so it's really two equations, one for each row of $A$. Moving $\lambda x$ and $\lambda y$ to the left gives
      $$(a-\lambda)x+by=0,\qquad cx+(d-\lambda)y=0.$$

      ### The equation for the eigenvalues

      Next, multiply the first equation by $(d-\lambda)$ and the second by $b$, so that both contain $b(d-\lambda)y$. Subtracting one from the other removes $y$ and leaves
      $$\big[(a-\lambda)(d-\lambda)-bc\big]\,x=0.$$
      The same trick with $c$ and $(a-\lambda)$ removes $x$ and leaves the bracket times $y$. An eigenvector can't have $x$ and $y$ both zero, so the bracket must be zero. So $\lambda$ is an eigenvalue exactly when
      $$\lambda^2-(a+d)\lambda+(ad-bc)=0.$$

      Call the two solutions $\lambda_1$ and $\lambda_2$. A quadratic that starts with $\lambda^2$ and is zero at both of them is $(\lambda-\lambda_1)(\lambda-\lambda_2)=\lambda^2-(\lambda_1+\lambda_2)\lambda+\lambda_1\lambda_2$. Matching the two forms, the eigenvalues add up to $a+d$ and multiply to $ad-bc$. Often we can spot two numbers with that sum and product. Otherwise the quadratic formula from algebra gives them:
      $$\lambda=\frac{(a+d)\pm\sqrt{(a+d)^2-4(ad-bc)}}{2}.$$
      If the number under the square root is negative, there are no real eigenvalues, which in this lesson we call having no eigenvalues.

      ### Three matrices side by side

      - For $\begin{bmatrix}2&1\\1&2\end{bmatrix}$ the sum is $4$ and the product is $3$, so the eigenvalues are $3$ and $1$.
      - For $\begin{bmatrix}3&0\\0&-1\end{bmatrix}$ the sum is $2$ and the product is $-3$, so they're $3$ and $-1$.
      - The matrix $\begin{bmatrix}0&-1\\1&0\end{bmatrix}$ sends $(1,0)$ to $(0,1)$ and $(0,1)$ to $(-1,0)$, a quarter turn. Its diagonal adds to $0$ and $ad-bc=1$, and $0^2-4\times1$ is negative, so it has no eigenvalues, which fits a turn that moves every arrow off its line.

      Be careful not to read the eigenvalues off the diagonal. That only works when the entries off the diagonal are $0$, as in the second matrix. The first has $2$ and $2$ on its diagonal but eigenvalues $3$ and $1$.
    worked: |
      Let's find the eigenvalues and eigenvectors of $A=\begin{bmatrix}2&1\\1&2\end{bmatrix}$ from the equation, and check that we get the directions we found by trying arrows.

      1. **Write the equation.** Here $a+d=4$ and $ad-bc=2\times2-1\times1=3$.
         $$\lambda^2-4\lambda+3=0$$

      2. **Find two numbers with sum $4$ and product $3$.** They are $3$ and $1$.
         $$(\lambda-3)(\lambda-1)=0,\qquad\lambda=3\text{ or }\lambda=1$$

      3. **Find the eigenvector for $\lambda=3$.** We put $\lambda=3$ into the first row's equation, $(a-\lambda)x+by=0$. The second row gives the same line, because $\lambda$ was chosen to make the two equations agree.
         $$(2-3)x+y=0,\qquad y=x$$

      4. **Find the eigenvector for $\lambda=1$.** The same equation with $\lambda=1$ gives the other direction.
         $$(2-1)x+y=0,\qquad y=-x$$

      Choosing $x=1$ gives $(1,1)$ with eigenvalue $3$ and $(1,-1)$ with eigenvalue $1$, the two directions $A$ only stretches.
