      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="306" y="192" fill="#3b82f6">(2, 1)<tspan x="306" dy="22">turned</tspan></text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="256" y="268" fill="#737373">(1, 0)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="262" y="322">(1, −1) stays (1, −1)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="414" y="270" fill="#737373">x</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="207" y="62" fill="#737373">y</text>
