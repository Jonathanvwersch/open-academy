      ### The singular value decomposition

      The **singular value decomposition** (SVD) writes any matrix as a turn, a stretch along the axes and another turn, where one turn may also flip arrows like a mirror:
      $$A=USV^\top$$
      Read it from right to left, since that's the order the moves happen in. $V$ has the perpendicular input directions $v_1$ and $v_2$, each of length $1$, as its columns, so $V^\top$ has them as its rows. Multiplying by $V^\top$ dots the input with $v_1$ and $v_2$, which sends $v_1$ to $(1,0)$ and $v_2$ to $(0,1)$. $S$ is a diagonal matrix holding the **singular values** $s_1\ge s_2\ge0$, the stretch along each axis. Finally $U$ has the output directions $u_1$ and $u_2$ as its columns and turns the axes onto them. So $A$ sends $v_1$ to $s_1u_1$ and $v_2$ to $s_2u_2$.

      To find these, we use the last step's method on $A^\top A$, which is always square. We'll use without proof that its eigenvectors are $v_1$ and $v_2$ and its eigenvalues are $s_1^2$ and $s_2^2$. Then $u_1$ is $Av_1$ divided by $s_1$, and the same for $u_2$ when $s_2$ isn't zero.

      Be careful not to treat singular values as eigenvalues. $B$ has no eigenvalues, yet its singular values are $10$ and $5$. Singular values are lengths, so they're never negative, and every matrix has them.
    worked: |
      Let's find the three moves for $B=\begin{bmatrix}4&-3\\6&8\end{bmatrix}$ with the eigenvalue method, then follow $v_1$ through them.

      1. **Multiply $B^\top$ by $B$.** The input directions are eigenvectors of $B^\top B$, so we build it first. Each entry is a row of $B^\top$ dotted with a column of $B$.
         $$B^\top B=\begin{bmatrix}4&6\\-3&8\end{bmatrix}\begin{bmatrix}4&-3\\6&8\end{bmatrix}=\begin{bmatrix}52&36\\36&73\end{bmatrix}$$

      2. **Find its eigenvalues.** They add up to $52+73=125$ and multiply to $52\times73-36\times36=2500$, so they're $100$ and $25$. The singular values are their square roots.
         $$s_1=\sqrt{100}=10,\qquad s_2=\sqrt{25}=5$$

      3. **Find the input directions.** Putting $\lambda=100$ into the first row's equation gives $y=\tfrac43x$, and $(3,4)$ is on that line. It has length $5$, so dividing by $5$ gives $v_1$. A quarter turn of $v_1$ gives the perpendicular direction $v_2$.
         $$(52-100)x+36y=0,\qquad v_1=(0.6,0.8),\qquad v_2=(-0.8,0.6)$$

      4. **Find the output directions.** Since $Bv_1=s_1u_1$, we multiply and divide by the singular value.
         $$u_1=\tfrac{1}{10}Bv_1=\tfrac{1}{10}(0,10)=(0,1)$$
         $$u_2=\tfrac15Bv_2=\tfrac15(-5,0)=(-1,0)$$

      5. **Follow $v_1$ through the three moves.** $V^\top$ dots it with $v_1$ and $v_2$, $S$ stretches the axes by $10$ and $5$, and the quarter turn $U$ turns the result.
         $$V^\top v_1=\begin{bmatrix}0.6&0.8\\-0.8&0.6\end{bmatrix}\begin{bmatrix}0.6\\0.8\end{bmatrix}=\begin{bmatrix}1\\0\end{bmatrix}$$
         $$S\begin{bmatrix}1\\0\end{bmatrix}=\begin{bmatrix}10&0\\0&5\end{bmatrix}\begin{bmatrix}1\\0\end{bmatrix}=\begin{bmatrix}10\\0\end{bmatrix},\qquad U\begin{bmatrix}10\\0\end{bmatrix}=\begin{bmatrix}0&-1\\1&0\end{bmatrix}\begin{bmatrix}10\\0\end{bmatrix}=\begin{bmatrix}0\\10\end{bmatrix}$$

      That's $Bv_1$, so the three moves do what $B$ does. The same moves take $v_2$ to $(0,1)$, then $(0,5)$, then $(-5,0)=Bv_2$.
