concept: what-is-ml
version: 3
objective: |
  **Goal:** explain what machine learning is and how it differs from writing a rule by hand, name the pieces a computer needs to learn a rule by itself (a model with weights, a loss and training), and see how Week 1 builds those pieces and how the same pieces later teach a robot.
where_this_fits: |
  ### What is machine learning?

  Machine learning is a way of getting a computer to do a task by learning a rule from examples, instead of having a person write the rule. We show it examples along with the answers they should give, and it adjusts its rule until its answers come as close to those as it can.

  Why is that useful? Some tasks have a rule we can write down, like turning metres into centimetres. But nobody can write the exact rule that prices a house from its details, or that turns a camera image into the movement a robot arm should make. What we often do have is lots of examples, such as past house sales. Machine learning turns those examples into a rule.
knowledge_points:
  - id: ml-what-it-is
    title: "Learn a rule from examples"
    explain: |
      ### Three sales and three possible rules

      Let's start with a simple house-price problem. Here are three past sales: a 50 m² (square metre) house sold for £150k (£150,000), an 80 m² house for £240k and a 100 m² house for £300k. In the picture, each sale is a dot, with area along the bottom and price up the side.

      Each line is a possible rule of the form

      $$\text{price}=w\times\text{area},$$

      where $w$ is the price per square metre in thousands of pounds, so $w=3$ means £3,000 per m². The grey line for $w=2$ runs below every sale and the grey line for $w=4$ runs above them, but the green line for $w=3$ passes through all three. Choosing the line that fits the examples is learning in its simplest form.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" aria-label="Three past house sales plotted as area against price, with three candidate lines price equals w times area: w equals 2 lies below every sale, w equals 4 above, and w equals 3 passes through all three">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M80.0 380.0 H620.0 M80.0 380.0 V47.0" stroke="#737373" fill="#171717" fill-opacity="0"/>
          <path d="M305 380.0 V385.0" stroke="#737373"/>
          <text x="295" y="402.0" fill="#737373">50</text>
          <path d="M440 380.0 V385.0" stroke="#737373"/>
          <text x="430" y="402.0" fill="#737373">80</text>
          <path d="M530 380.0 V385.0" stroke="#737373"/>
          <text x="520" y="402.0" fill="#737373">100</text>
          <path d="M75.0 290 H80.0" stroke="#737373"/>
          <text x="44.0" y="295" fill="#737373">100</text>
          <path d="M75.0 200 H80.0" stroke="#737373"/>
          <text x="44.0" y="205" fill="#737373">200</text>
          <path d="M75.0 110 H80.0" stroke="#737373"/>
          <text x="44.0" y="115" fill="#737373">300</text>
          <text x="470" y="426.0" fill="#737373">area (m²)</text>
          <text x="16" y="35" fill="#737373">price (£ thousands)</text>
          <path d="M80.0 380.0 L620 164" stroke="#d4d4d4" stroke-width="2"/>
          <path d="M80.0 380.0 L620 56" stroke="#10b981" stroke-width="3"/>
          <path d="M80.0 380.0 L485 56" stroke="#d4d4d4" stroke-width="2"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="560" y="215" fill="#737373">w = 2</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="415" y="62" fill="#737373">w = 4</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="548" y="52" fill="#10b981">w = 3</text>
          <circle cx="305" cy="245" r="5" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="318" y="248">sold for 150</text>
          <circle cx="440" cy="164" r="5" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="450" y="184">sold for 240</text>
          <circle cx="530" cy="110" r="5" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="540" y="130">sold for 300</text>
        </g>
      </svg>
      ```

      ### Models, weights and targets

      In machine learning, the rule the computer learns from the examples is called a **model**. A model contains adjustable numbers called **weights**, like $w$ here, and learning means choosing their values. When each example comes with its correct answer, that answer is called the **target**, and learning from such examples is called **supervised learning**. Here each house's sale price is its target.

      Be careful not to think that the computer just memorises the examples. A list of past sales could only answer for those three houses, but the rule price $=3\times$ area also prices a 70 m² house it has never seen, at £210k. The examples choose the rule, and the rule is what we use.

      ### When no line fits exactly

      Real sales rarely sit exactly on one line. Suppose a fourth house, of 60 m², sold for £190k. Here are each line's misses, the prediction minus the sale price:

      | Weight $w$ | Misses on 50, 80, 100 and 60 m² |
      | --- | --- |
      | $2$ | −50, −80, −100, −70 |
      | $3$ | 0, 0, 0, −10 |
      | $4$ | +50, +80, +100, +50 |

      None of the three weights makes every miss 0, but $w=3$ keeps them closest to 0, so it's still the one we'd pick. Real models have thousands of weights, though, so the computer needs a way to choose them without a person checking a picture by eye.
    worked: |
      Let's learn the weight $w$ in price $=w\times$ area from the first three sales, which a line fits exactly, so we can check the answer. Area is in m² and price in thousands of pounds. Learning repeats one cycle: predict, compare with the target, and adjust.

      1. **Guess a weight and predict.** We have to start somewhere, so we try $w=2$ on the 50 m² house.
         $$2\times50=100$$

      2. **Compare with the target.** The house sold for 150, so we subtract that from the prediction to get the miss.
         $$100-150=-50$$

      3. **Adjust the weight.** The miss is negative, so the prediction is too low, and a larger $w$ gives a larger prediction, so we raise $w$ to the next whole number, 3.
         $$3\times50=150$$

      4. **Check the second sale.** One house isn't enough, so we try the new weight on the 80 m² house, which sold for 240.
         $$3\times80=240$$

      5. **Check the third sale.** The 100 m² house sold for 300.
         $$3\times100=300$$

      All three predictions now match their sale prices, so $w=3$ is the learned weight. Here we chose each new value by eye, and the rest of Week 1 shows how a computer works out both which way to change a weight and by how much.
    problems:
      - ml-what-it-is-basics
      - ml-fit-self-explain
      - ml-fit-task
      - ml-learns-from
      - ml-why-not-hand
      - ml-adjust-direction
      - ml-fit-weight
  - id: ml-house-model
    title: "What a computer needs to learn"
    explain: |
      ### A house as a list of numbers

      So far we fitted one weight by trying values, but a real model has several measurements, each with its own weight, and thousands of sales. So what does a computer need to find all those weights by itself?

      First, it needs each house written as numbers. Take a house with an area of 120 m², 3 bedrooms and an age of 20 years. We count the area in tens of square metres, so that it's a small number like the other two, and the house becomes the list $(12,3,20)$. A list of numbers like this is called a **vector**.

      ### Weights turn the list into a price

      Next, the model gives each measurement its own weight and adds up each measurement times its weight. This is called a **weighted sum**. We call the measurements $x_1,x_2,x_3$ and their weights $w_1,w_2,w_3$, where the small number says which measurement it is and $w_1x_1$ means $w_1$ times $x_1$. Then

      $$\text{prediction}=w_1x_1+w_2x_2+w_3x_3.$$

      With weights $(25,10,-1)$, each ten square metres adds £25k, each bedroom adds £10k and each year of age takes off £1k, so this house is predicted at £310k. It actually sold for £330k.

      ### Scoring the weights and improving them

      Then it needs a score. A **loss** is one number that grows as the predictions move further from the targets, and is 0 only when every prediction is exact. One simple loss adds up the sizes of all the misses, ignoring their signs. **Training** means changing the weights again and again so that the loss on the examples gets smaller.

      For that, it must know which way to move each weight. A **derivative** measures how much one number changes when you nudge another, so it shows how the loss responds to each weight. **Gradient descent** uses it to nudge every weight so the loss falls, over and over. A **matrix**, a grid of numbers with one row per house, lets it make every prediction at once, and finally we test the trained model on houses it never saw.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" aria-label="The seven steps of the house-price model, each taught by a Week 1 lesson, from numbers and the weighted sum through matrices, loss, derivatives and gradient descent to test houses">
        <defs>
          <marker id="ml2-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <rect x="12" y="12" width="456" height="46" rx="8" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="2"/>
          <text x="28" y="40" font-weight="700">1. Numbers</text>
          <text x="196" y="40" fill="#737373">a house as a list: (12, 3, 20)</text>
          <path d="M240 58 V75" stroke="#737373" stroke-width="2" marker-end="url(#ml2-arrow)"/>
          <rect x="12" y="76" width="456" height="46" rx="8" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="2"/>
          <text x="28" y="104" font-weight="700">2. Weighted sum</text>
          <text x="196" y="104" fill="#737373">one house → one price</text>
          <path d="M240 122 V139" stroke="#737373" stroke-width="2" marker-end="url(#ml2-arrow)"/>
          <rect x="12" y="140" width="456" height="46" rx="8" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="2"/>
          <text x="28" y="168" font-weight="700">3. Matrices</text>
          <text x="196" y="168" fill="#737373">every house at once</text>
          <path d="M240 186 V203" stroke="#737373" stroke-width="2" marker-end="url(#ml2-arrow)"/>
          <rect x="12" y="204" width="456" height="46" rx="8" fill="#171717" fill-opacity="0" stroke="#f59e0b" stroke-width="2"/>
          <text x="28" y="232" font-weight="700">4. Loss</text>
          <text x="196" y="232" fill="#737373">one number for how wrong prices are</text>
          <path d="M240 250 V267" stroke="#737373" stroke-width="2" marker-end="url(#ml2-arrow)"/>
          <rect x="12" y="268" width="456" height="46" rx="8" fill="#171717" fill-opacity="0" stroke="#f59e0b" stroke-width="2"/>
          <text x="28" y="296" font-weight="700">5. Derivatives</text>
          <text x="196" y="296" fill="#737373">which way to move each weight</text>
          <path d="M240 314 V331" stroke="#737373" stroke-width="2" marker-end="url(#ml2-arrow)"/>
          <rect x="12" y="332" width="456" height="46" rx="8" fill="#171717" fill-opacity="0" stroke="#f59e0b" stroke-width="2"/>
          <text x="28" y="360" font-weight="700">6. Gradient descent</text>
          <text x="196" y="360" fill="#737373">move the weights, repeat</text>
          <path d="M240 378 V395" stroke="#737373" stroke-width="2" marker-end="url(#ml2-arrow)"/>
          <rect x="12" y="396" width="456" height="46" rx="8" fill="#171717" fill-opacity="0" stroke="#10b981" stroke-width="2"/>
          <text x="28" y="424" font-weight="700">7. Test houses</text>
          <text x="196" y="424" fill="#737373">check on houses it never saw</text>
          <path d="M478 16 H490 V182 H478" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="2"/>
          <text x="500" y="95.0" fill="#3b82f6" font-weight="700">the model:</text>
          <text x="500" y="113.0" fill="#3b82f6" font-weight="700">linear regression</text>
          <path d="M478 208 H490 V374 H478" fill="#171717" fill-opacity="0" stroke="#f59e0b" stroke-width="2"/>
          <text x="500" y="287.0" fill="#f59e0b" font-weight="700">training:</text>
          <text x="500" y="305.0" fill="#f59e0b" font-weight="700">lower the loss</text>
          <path d="M478 400 H490 V438 H478" fill="#171717" fill-opacity="0" stroke="#10b981" stroke-width="2"/>
          <text x="500" y="424.0" fill="#10b981" font-weight="700">checking</text>
        </g>
      </svg>
      ```

      Each box in the diagram is one of these pieces and one Week 1 lesson, which is why the maths lessons aren't a detour before the machine learning but are how it works.
    worked: |
      Let's follow the 120 m² house through the model and score the result. Its weights are £25k per ten square metres, £10k per bedroom and −£1k per year of age, which we write as $(25,10,-1)$, and it sold for £330k. We've simply picked these weights for now, because finding good ones is the job of training.

      1. **Record the house as numbers.** We count area in tens of square metres, so the house is the vector
         $$(12,\ 3,\ 20)$$

      2. **Multiply each measurement by its weight.** Each product is in thousands of pounds, and the age weight is negative, so age takes money off.
         $$25\times12=300,\quad 10\times3=30,\quad -1\times20=-20$$

      3. **Add the products to get the prediction.**
         $$300+30-20=310$$

      4. **Compare with the target.** We subtract the sale price from the prediction.
         $$310-330=-20$$

      The miss is −20, so the prediction is £20k too low. A loss grows with the size of misses like this, whatever their sign, and training changes the weights to push it towards 0. Here's what happens to the miss when we change one weight at a time, with the weights listed as (area, bedrooms, age):

      | Weights | Prediction | Miss |
      | --- | --- | --- |
      | $(25,\ 10,\ -1)$ | 310 | −20 |
      | $(26,\ 10,\ -1)$ | 322 | −8 |
      | $(27,\ 10,\ -1)$ | 334 | +4 |
      | $(25,\ 12,\ -1)$ | 316 | −14 |

      Raising the area weight by 1 moves the prediction by 12, because area is recorded as 12, and a derivative measures this kind of response for the loss.
    problems:
      - ml-house-model-basics
      - ml-weight-self-explain
      - ml-step-vector
      - ml-step-next
      - ml-predict-house
      - ml-why-derivatives
      - ml-why-new-houses
  - id: ml-to-robots
    title: "Teach a robot the same way"
    explain: |
      ### From house prices to a robot arm

      This course ends with robots that learn tasks such as picking up a cup by looking through a camera. So why start with house prices?

      Because a robot's problem has the same pieces. A camera image is numbers too, one brightness for each tiny dot, or pixel. The diagram compares house prices with a robot learning to pick up a cup from recordings of a person steering it. The inputs and outputs change, but there's still a model with weights, a loss and a target, which is the movement the person made.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="The house-price problem and a robot learning to pick up a cup, side by side: each has an input, a model with weights, an output, a target and a loss">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text x="140" y="28" font-weight="700">House prices</text>
          <text x="392" y="28" font-weight="700">Robot picking up a cup</text>
          <rect x="12" y="44" width="616" height="40" rx="8" fill="#171717" fill-opacity="0" stroke="#d4d4d4"/>
          <text x="24" y="69" font-weight="700">Input</text>
          <text x="140" y="69">(area, bedrooms, age)</text>
          <path d="M352 64 H380" stroke="#737373" stroke-width="2"/>
          <text x="392" y="69">camera image, joint angles</text>
          <rect x="12" y="94" width="616" height="40" rx="8" fill="#171717" fill-opacity="0" stroke="#d4d4d4"/>
          <text x="24" y="119" font-weight="700">Model</text>
          <text x="140" y="119">weighted sum (Week 1)</text>
          <path d="M352 114 H380" stroke="#737373" stroke-width="2"/>
          <text x="392" y="119">neural network (Week 2)</text>
          <rect x="12" y="144" width="616" height="40" rx="8" fill="#171717" fill-opacity="0" stroke="#d4d4d4"/>
          <text x="24" y="169" font-weight="700">Output</text>
          <text x="140" y="169">a predicted price</text>
          <path d="M352 164 H380" stroke="#737373" stroke-width="2"/>
          <text x="392" y="169">a predicted movement</text>
          <rect x="12" y="194" width="616" height="40" rx="8" fill="#171717" fill-opacity="0" stroke="#d4d4d4"/>
          <text x="24" y="219" font-weight="700">Target</text>
          <text x="140" y="219">the real sale price</text>
          <path d="M352 214 H380" stroke="#737373" stroke-width="2"/>
          <text x="392" y="219">the person's movement</text>
          <rect x="12" y="244" width="616" height="40" rx="8" fill="#171717" fill-opacity="0" stroke="#d4d4d4"/>
          <text x="24" y="269" font-weight="700">Loss</text>
          <text x="140" y="269">how far off the prices are</text>
          <path d="M352 264 H380" stroke="#737373" stroke-width="2"/>
          <text x="392" y="269">how far off the movements are</text>
        </g>
      </svg>
      ```

      A model that controls a robot is called a **policy**. Its input is what the robot senses, and its output is what the robot does next. We train it with the same cycle as the house model: predict, measure the loss, change the weights.

      ### Three ways to learn

      What changes across the course is what tells the model how well it did. There are three ways:

      - **Supervised learning** uses examples with known answers, as with house prices.
      - **Imitation learning** treats a person's recorded demonstrations as the answers, and then uses the supervised cycle.
      - **Reinforcement learning** has no answers at all, only a score called a **reward** for how well each attempt went. The robot learns by trial and error to make the reward as large as possible.

      Be careful not to think robots need a completely different kind of learning. Their models still predict, get scored and change their weights, so we learn that cycle first on house prices, where we can check it by hand.

      ### Where each week fits

      | Weeks | What's new | Learns from |
      | --- | --- | --- |
      | 1 | the cycle, on house prices | known sale prices |
      | 2–3 | neural networks, models built from many weighted sums | known answers |
      | 4 | transformers, the models behind chatbots like ChatGPT | the next word in a text |
      | 5–6 | how robots move and sense | no learning |
      | 7 | imitation learning | demonstrations |
      | 8 | reinforcement learning | rewards |
      | 9–12 | vision, language and projects | all of these |
    worked: |
      Let's go through one moment of the cup task. A person used a joystick to steer a robot arm to pick up a cup 200 times, and every moment was recorded. We'll take one moment and look only at the elbow joint.

      1. **Name the inputs.** The policy decides from what the robot senses at that moment, which is the camera image and the angles of its joints.

      2. **Name the target.** The answer to copy is what the person did at that moment, which was to turn the elbow by 10° (degrees).

      3. **Predict.** The policy is a neural network, a bigger model built from many weighted sums, which Week 2 teaches. It outputs an elbow turn of 6°.

      4. **Measure the miss.** As with house prices, we subtract the target from the prediction.
         $$6-10=-4$$

      5. **Train.** The policy's output was 4° too little. Training changes the network's weights to shrink misses like this one across all the recorded moments.

      Copying demonstrations with this supervised cycle is called **behavioral cloning**, and Week 7 teaches it.
    problems:
      - ml-to-robots-basics
      - ml-robot-self-explain
      - ml-robot-target
      - ml-which-week
      - ml-why-houses
      - ml-robot-sorter
final: ml-explain
summary: |
  - Machine learning means a computer fits a rule, called a model, to examples instead of a person writing the rule, and learning means choosing the model's weights.
  - The house model predicts with a weighted sum, $w_1x_1+w_2x_2+w_3x_3$, a loss scores how far its predictions are from the targets, and training changes the weights again and again to make the loss smaller.
  - Week 1 builds these pieces one lesson at a time, and the same cycle of predict, score and change the weights later trains a robot's policy. Only the inputs, the outputs and the score change, and the score can be a loss to shrink or a reward to grow.

  **Next:** The supervised learning lesson looks carefully at each part of a learning problem (inputs, target, model and loss), and each later Week 1 lesson then builds one of those parts.
