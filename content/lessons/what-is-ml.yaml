  - id: ml-to-robots
    title: From house prices to robots
    explain: |
      **Where the course goes after Week 1.** Each week takes the same learning loop (a model with weights, a loss, and training to reduce the loss) and applies it to something harder:
      - **Week 2, neural networks:** a more flexible model built from many small weighted totals, and **backpropagation**, the method that trains it.
      - **Week 3, deep learning practice:** training networks well, and recognising images.
      - **Week 4, transformers:** the model design behind ChatGPT, also used in modern robot models.
      - **Weeks 5–6, robotics foundations:** describing where things are in space, sensing, and controlling a robot arm.
      - **Week 7, imitation learning:** a robot learns a task from human demonstrations.
      - **Week 8, reinforcement learning:** a robot learns from trial and error and rewards.
      - **Weeks 9–10, modern robot learning:** models that turn camera images and instructions into robot actions.
      - **Weeks 11–12:** running a full robot-learning project, from data to evaluation, and a final capstone.

      **Why this is useful.** A robot's controller, called a **policy**, is a model like the house-price one. Its inputs are camera images and joint angles instead of house measurements, and its output is a movement instead of a price. It is trained with the same loop: measure how far its movements are from good ones, and change the weights to shrink that gap. Learning the loop on house prices first means you meet it with small numbers you can check.
    worked: |
      This example shows a robot task described with the same parts as the house-price problem.

      A robot arm should learn to pick up a cup. A person controls the arm 200 times, and every movement is recorded.

      - **Inputs:** the camera image and the arm's joint angles at each moment. (Houses: the measurements.)
      - **Target:** the movement the person made at that moment. (Houses: the sale price.)
      - **Model:** a neural network with weights (Week 2).
      - **Loss:** how far the network's movement is from the person's movement.
      - **Training:** gradient descent, changing the weights to shrink the loss (Week 1).

      This approach is called **behavioral cloning**, and Week 7 teaches it. Everything it needs, apart from the robot, is built in Weeks 1 to 4.
    problems:
      - ml-to-robots-basics
      - ml-robot-target
      - ml-which-week
      - ml-why-houses
      - ml-robot-sorter
final: ml-explain
summary: |
  - Machine learning means a computer learns a rule, called a model, from examples instead of being given the rule.
  - Learning works by adjusting weights to shrink a loss, a number that measures how wrong the predictions are.
  - Weeks 1 and 2 build this loop for house prices; later weeks apply it to images, language and robots.

  **Next:** Supervised learning names the parts of a learning problem precisely (inputs, target, model, loss and data), so the maths lessons have something to attach to.
