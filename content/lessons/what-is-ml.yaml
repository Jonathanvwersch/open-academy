concept: what-is-ml
version: 1
objective: |
  **Goal:** explain what machine learning is, name the steps a model learns by, and see how each week of the course builds on the last, from house prices to robot policies.
where_this_fits: |
  This is the first lesson. Before any maths, it explains what machine learning is, introduces the one problem Weeks 1 and 2 are built around (predicting a house's price), and shows how every topic in the course connects to teaching robots. Each later lesson starts with a short section like this one, saying what the previous lesson gave you and what the new one adds.
knowledge_points:
  - id: ml-what-it-is
    title: What machine learning is
    explain: |
      **What machine learning is.** Machine learning is a way of getting a computer to do a task by showing it examples, instead of writing the instructions yourself. The rule the computer ends up with is called a **model**.

      **Why not write the rule by hand?** Suppose you want to predict a house's sale price. You could write "price = £3,000 per square metre". But real prices also depend on bedrooms, age, location and more, in amounts nobody knows exactly. Recognising a cup in a camera image is harder still: nobody can write down which pixels make a cup.

      **How learning works instead.** Collect examples where you know the answer, such as past house sales with their measurements and prices. Start with a rule that contains adjustable numbers, called **weights**. Measure how far the rule's predictions are from the real prices, then adjust the weights to make that gap smaller. Repeat until the predictions are good.

      **Three ways to learn.** This course covers three:
      - **Supervised learning:** learn from examples with known answers (Weeks 1–4).
      - **Imitation learning:** a robot learns by copying recorded human demonstrations (Week 7).
      - **Reinforcement learning:** a robot learns by trial and error, guided by a score called a **reward** (Week 8).

      **Why this is useful.** Most things we want a robot to do, such as seeing objects and picking them up, are far too complicated to write as rules by hand. Learning them from examples is what makes them possible.
    worked: |
      This example shows learning one weight from three past sales.

      The rule is price = $w$ × area, with price in thousands of pounds and area in square metres. The sales were: 50 m² for 150, 80 m² for 240, and 100 m² for 300.

      1. Try $w=2$: the predictions are 100, 160 and 200. All are too low.
      2. Try $w=4$: the predictions are 200, 320 and 400. All are too high.
      3. Try $w=3$: the predictions are 150, 240 and 300. All three match.

      Learning means finding the weights whose predictions match the examples. Here we tried values by hand. A real model has thousands or millions of weights, so trying values is hopeless. Week 1 shows how the computer works out which way to change each weight instead.
    problems:
      - ml-what-it-is-basics
      - ml-fit-task
      - ml-learns-from
      - ml-why-not-hand
      - ml-fit-weight
  - id: ml-house-model
    title: The house-price model, step by step
    explain: |
      **The problem for Weeks 1 and 2.** Predict a house's sale price from its measurements, using past sales. It's a good first problem because every number is small enough to check by hand, and it needs every step a robot model needs.

      **The steps, in the order Week 1 teaches them:**
      1. **Describe a house with numbers.** Area (in tens of square metres), bedrooms and age become one list, such as (12, 3, 20). A list like this is a **vector**.
      2. **Turn the list into one price.** Multiply each measurement by a weight and add the results. This is the **dot product**.
      3. **Price many houses at once.** Put every house in one grid of numbers, a **matrix**, and do all the dot products in one calculation. The finished rule is called **linear regression**.
      4. **Measure how wrong it is.** A **loss** is one number that grows as predictions move further from the real prices.
      5. **Find which way to change each weight.** **Derivatives** and **gradients** say whether nudging a weight up makes the loss rise or fall.
      6. **Improve the weights.** **Gradient descent** repeats step 5, a small change at a time, until the loss is small.
      7. **Check it on new houses.** Keep some sales back and test on those (**training and test splits**).

