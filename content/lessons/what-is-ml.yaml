      **Why this is useful.** Every maths topic in Week 1 appears because one of these steps needs it. If a lesson ever seems to come from nowhere, find its step in this list.
    worked: |
      This example shows one house going through the steps.

      1. The house has 120 m², 3 bedrooms and is 20 years old, so we record it as (12, 3, 20).
      2. The weights are (25, 10, −1), in thousands of pounds per unit. Multiplying gives 25 × 12 = 300, 10 × 3 = 30 and −1 × 20 = −20.
      3. Adding gives the prediction: 300 + 30 − 20 = 310, so £310k.
      4. The house actually sold for £330k, so the prediction is £20k too low.
      5. Training changes the weights so that predictions like this one move closer to the real prices. Which weights to change, and by how much, is what derivatives and gradient descent answer.
    problems:
      - ml-house-model-basics
