final: gib-explain-gpu
summary: |
  - A model's weights take its number of parameters times the bytes per number, $N\times b$: 4 bytes at FP32, 2 at FP16 and BF16, 1 at INT8 and 0.5 at INT4. Llama 3 8B needs 32, 16 and 8 GB at FP32, FP16 and INT8.
  - The weights must fit in the GPU's main memory, HBM (80 GB on an H100), with room left for each conversation's working memory.
  - The chip's fast SRAM holds only about a tenth of a gigabyte, so the weights stay in HBM, and every number must come from HBM at up to the memory bandwidth (about 3.35 TB/s on an H100).
  - Decoding reads every weight for each token but does only about 2 FLOPs per parameter, so one conversation's speed is at most memory bandwidth divided by weight bytes, about 209 tokens/s for Llama 3 8B at BF16. A batch of $B$ shares each read, so total tokens/s grows about $B$ times until the maths catches up.

  **Next:** The KV cache lesson measures each conversation's working memory and adds it to the memory reads of every decode step.
