  - id: gib-memory-hierarchy
    title: "See where the GPU keeps its data"
    explain: |
      ### The parts of a GPU

      Llama 3 8B's weights fit in the H100's 80 GB. But where is that memory, and how do the weights reach the parts that do the maths?

      The H100's chip is made of 132 **streaming multiprocessors** (SMs). Each SM is a small processor with its own calculators, including Tensor Cores, which are built to do matrix multiplies fast. Together the SMs can do about 990 trillion 16-bit floating-point operations (FLOPs) per second. FLOPs is a count and FLOP/s a rate. A trillion is $10^{12}$, written T, so that's about 990 TFLOP/s, which we'll round to 1,000 TFLOP/s. Each operation the model runs, such as one matrix multiply, runs on the GPU as a small program called a **kernel**.

      ### Three levels of memory

      The picture shows the memory in layers, from big and slow at the bottom to small and fast on top.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" aria-label="The H100's memory in three layers. At the bottom, HBM, 80 GB, holds the weights, drawn in blue. A blue arrow labelled 3.35 TB per second carries data up to the L2 cache, 50 MB, shared by all SMs. A grey arrow carries it up to a row of SMs, 132 in all, each with Tensor Cores and about 0.5 MB of registers, shared memory and L1 cache. The L2 cache and the SMs are inside a dashed box labelled on the chip, SRAM">
      <defs><marker id="gib2-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="gib2-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="10" y="10" width="620" height="200" rx="8" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-dasharray="6 5"/>
      <text x="620" y="30" text-anchor="end" fill="#737373">on the chip (SRAM)</text>
      <rect x="30" y="40" width="90" height="50" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="75" y="70" text-anchor="middle">SM</text>
      <rect x="135" y="40" width="90" height="50" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="180" y="70" text-anchor="middle">SM</text>
      <rect x="240" y="40" width="90" height="50" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="285" y="70" text-anchor="middle">SM</text>
      <text x="345" y="70">… 132 SMs in all</text>
      <text x="30" y="106">each: Tensor Cores and about</text>
      <text x="30" y="124">0.5 MB of registers, shared</text>
      <text x="30" y="142">memory and L1 cache</text>
      <rect x="30" y="150" width="580" height="44" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <text x="320" y="177" text-anchor="middle">L2 cache: 50 MB, shared by all SMs</text>
      <path d="M320 150 V96" stroke="#737373" stroke-width="2" marker-end="url(#gib2-muted)"/>
      <rect x="30" y="270" width="580" height="54" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/>
      <text x="320" y="302" text-anchor="middle" fill="#3b82f6">HBM: 80 GB, holds the weights</text>
      <path d="M320 268 V200" stroke="#3b82f6" stroke-width="3" marker-end="url(#gib2-blue)"/>
      <text x="332" y="242" fill="#3b82f6">3.35 TB/s</text>
      </g>
      </svg>
      ```

      **HBM** (high-bandwidth memory) is the GPU's main memory, 80 GB of chips beside the main chip. The weights live here. The **L2 cache** is 50 MB ($50\times10^6$ bytes) of memory on the chip itself, shared by all the SMs, which keeps copies of recent data. Inside each SM is about 0.5 MB of faster memory still. The SM's registers hold the numbers being worked on. Its L1 cache and its shared memory hold data the SM is about to use. Here "shared" means shared by the calculators inside that one SM. All of this memory on the chip, the L2 cache plus every SM's memory, is called **SRAM**. It's much faster than HBM, but all of it together holds only about a tenth of a gigabyte.

      ### Memory bandwidth

      The **memory bandwidth** is how many bytes per second can move between HBM and the chip. The H100's is about 3.35 TB/s, where a TB is $10^{12}$ bytes. So moving data takes at least

      $$\text{time}=\frac{\text{bytes moved}}{\text{memory bandwidth}}.$$

      Fewer bytes from HBM means less time. So a kernel runs fastest when it reads each number from HBM once, keeps it in SRAM, and reuses it from there as many times as it can.

      Be careful not to mix up memory size and bandwidth. The 80 GB says how much fits, and the 3.35 TB/s says how fast it can be read.
    worked: |
      Let's check whether Llama 3 8B's 16 GB of BF16 weights could stay in the H100's fast on-chip memory, and work out how long reading them from HBM takes.

      1. **Add up the memory on the chip.** There are 132 SMs with about 0.5 MB each, plus the 50 MB L2 cache.
         $$132\times0.5+50=116\text{ MB}\approx0.12\text{ GB}.$$

      2. **Compare it with the weights.** We divide the weights' 16 GB by the chip's 116 MB, which is 0.116 GB.
         $$\frac{16}{0.116}\approx138.$$

      3. **Find the time to read the weights once.** The weights are far too big to stay on the chip, so they stay in HBM and have to be read through the 3.35 TB/s link.
         $$\frac{16\times10^9\text{ bytes}}{3.35\times10^{12}\text{ bytes/s}}\approx0.00478\text{ s}=4.78\text{ ms}.$$

      So the weights are about 138 times too big for the chip, and every pass through the whole model spends at least about 4.8 ms just reading them, however fast the maths is.
