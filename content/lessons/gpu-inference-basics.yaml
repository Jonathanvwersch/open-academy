concept: gpu-inference-basics
version: 1
objective: |
  **Goal:** estimate how much GPU memory a model's weights need at FP32, FP16 and INT8, and explain why the speed of reading those weights from GPU memory sets the top speed of decoding.
recap:
  - concept: pytorch-basics
    text: "A PyTorch tensor is an array of numbers with a shape and a data type, its `dtype`. Decimal numbers are stored as `torch.float32` unless we ask for another type."
  - concept: arithmetic-intensity
    text: "Arithmetic intensity is FLOPs per byte moved; if it is below the GPU's ops:byte ratio, memory movement rather than arithmetic limits speed."
where_this_fits: |
  ### What does a GPU do during inference?

  A GPU (graphics processing unit) is a chip with thousands of calculators working together and its own memory for model weights.

  We'll check whether the weights fit and how memory speed limits decoding for a chat assistant that serves Llama 3 8B, a language model anyone can download, on one NVIDIA H100 SXM GPU, the version that mounts directly on the server's board.

  In the lesson on arithmetic intensity, we learned that an operation's arithmetic intensity $I$ is the FLOPs it does per byte it moves to or from GPU memory. When $I$ is below the GPU's ops:byte ratio (peak FLOP/s ÷ memory bandwidth, about 300 for an H100), the operation is memory-bound.
knowledge_points:
  - id: gib-model-memory
    title: "Work out how much memory a model needs"
    explain: |
      ### Bytes per number

      Every weight in a model, also called a parameter, is a number, and the GPU stores each number in a fixed number of bytes. How many depends on the number format, which is called its **precision**. A byte is 8 bits, so a 16-bit format takes 2 bytes. We write $b$ for the bytes per number.

      | Format | Bits | Bytes per number $b$ |
      | --- | --- | --- |
      | FP32 | 32 | 4 |
      | FP16 and BF16 | 16 | 2 |
      | FP8 and INT8 | 8 | 1 |
      | INT4 | 4 | 0.5 |

      FP (floating-point) formats store decimals. BF16 can hold much larger and much smaller numbers than FP16, but less precisely. INT formats store whole numbers, and INT4 packs two numbers into each byte. A later lesson shows how to store decimal weights this way. In PyTorch, FP32 is the `dtype` `torch.float32`, FP16 is `torch.float16`, BF16 is `torch.bfloat16` and INT8 is `torch.int8`.

      ### Memory for the weights

      To find the memory a model's weights take, we multiply the number of parameters by the bytes each one uses:

      $$\text{weight memory}=N\times b,$$

      where $N$ is the number of parameters. We'll write GB for $10^9$ bytes throughout.

      Our running example is a chat assistant serving Llama 3 8B, which has about 8 billion parameters, on one H100 SXM GPU, which has 80 GB of memory. The bars show its weights at three precisions. They also show Llama 3 70B, a bigger model with about 70 billion parameters, at BF16 and INT8. The red line marks 80 GB.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="Bar chart of weight memory against the H100's 80 GB, drawn as a red dashed line. An 8-billion-parameter model takes 32 GB at FP32, 16 GB at BF16 and 8 GB at INT8, all green because they fit. A 70-billion-parameter model takes 140 GB at BF16, a red bar that passes the line, and 70 GB at INT8, a green bar just inside it">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="190" y="50" width="83.2" height="28" fill="#10b981"/>
      <rect x="190" y="95" width="41.6" height="28" fill="#10b981"/>
      <rect x="190" y="140" width="20.8" height="28" fill="#10b981"/>
      <rect x="190" y="200" width="364" height="28" fill="#ef4444"/>
      <rect x="190" y="245" width="182" height="28" fill="#10b981"/>
      <text x="180" y="69" text-anchor="end">8B model, FP32</text>
      <text x="180" y="114" text-anchor="end">8B model, BF16</text>
      <text x="180" y="159" text-anchor="end">8B model, INT8</text>
      <text x="180" y="219" text-anchor="end">70B model, BF16</text>
      <text x="180" y="264" text-anchor="end">70B model, INT8</text>
      <text x="281.2" y="69">32 GB</text>
      <text x="239.6" y="114">16 GB</text>
      <text x="218.8" y="159">8 GB</text>
      <text x="562" y="219">140 GB</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="380" y="264">70 GB</text>
      <path d="M190 40 V285" stroke="#737373"/>
      <path d="M398 34 V285" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="398" y="24" text-anchor="middle" fill="#ef4444">H100 memory: 80 GB</text>
      </g>
      </svg>
      ```

      - All three sizes of the 8B model are under 80 GB, so it fits at each.
      - A 70-billion-parameter model needs 140 GB at BF16, which doesn't fit on one H100. At INT8 it needs 70 GB, which fits with only 10 GB left.

      ### Room for more than the weights

      Fitting the weights is not enough to serve a model. The GPU also needs memory for each layer's results while it works. Each conversation also keeps numbers about its earlier tokens, called its KV cache, which grows as it gets longer. A later lesson measures it. So a model that only just fits can serve very few conversations.
    worked: |
      Let's work out how much memory Llama 3 8B's weights take at FP32, FP16 and INT8, and how much of the H100's 80 GB each one leaves.

      1. **Count the bytes at FP32.** Each of the 8 billion parameters takes 4 bytes.
         $$8\times10^9\times4=32\times10^9\text{ bytes}=32\text{ GB}.$$

      2. **Count them at FP16.** Each parameter now takes 2 bytes, so the total halves. BF16 also takes 2 bytes, so it gives the same answer.
         $$8\times10^9\times2=16\times10^9\text{ bytes}=16\text{ GB}.$$

      3. **Count them at INT8.** Each parameter takes 1 byte, so the total halves again.
         $$8\times10^9\times1=8\times10^9\text{ bytes}=8\text{ GB}.$$

      4. **Subtract each from the GPU's memory.** Whatever is left is room for everything else.
         $$80-32=48,\qquad 80-16=64,\qquad 80-8=72\text{ GB}.$$

      All three fit on one H100, and each halving of the bytes per number leaves more room for serving conversations.

      PyTorch can count the bytes for us. Here we make one $4096\times4096$ weight matrix, the size of one of Llama 3 8B's matrices, since its model width, the length of each token's vector, is 4096, at each of the three precisions. `torch.zeros(4096, 4096, dtype=...)` makes a tensor of that shape filled with zeros, `w.element_size()` gives the bytes per number and `w.numel()` counts the numbers in the tensor.

      ```python
      import torch
      for dtype in [torch.float32, torch.bfloat16, torch.int8]:
          w = torch.zeros(4096, 4096, dtype=dtype)
          print(dtype, w.element_size(), w.numel() * w.element_size())
      # prints three lines:
      # torch.float32 4 67108864
      # torch.bfloat16 2 33554432
      # torch.int8 1 16777216
      ```

      The FP32 matrix takes 67,108,864 bytes, about 0.067 GB, and each step down halves it, just as for the whole model.
