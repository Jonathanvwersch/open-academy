  - id: gib-decode-bound
    title: "Find the top speed of decoding"
    explain: |
      ### Decoding reads every weight

      A chat model writes its reply by **decoding**. Each pass through the model makes one new token, and the next pass needs that token. An operation's **arithmetic intensity** $I$ is the FLOPs it does for each byte it moves to or from GPU memory. A GPU's **ops:byte ratio**, read "ops per byte", is its peak FLOP/s divided by its memory bandwidth. For the H100 it's $1{,}000\times10^{12}/(3.35\times10^{12})\approx300$ FLOPs per byte. When $I$ is below that ratio, the operation is memory-bound, so memory sets its speed.

      Each pass multiplies one token's vector by every weight matrix. A $(1\times k)$ vector times a $(k\times n)$ matrix costs $2kn$ FLOPs, a multiply and an add per weight. Almost all parameters sit in these matrices, so one token costs about 2 FLOPs per parameter, and nearly every weight must be read from HBM.

      ### Reading time and maths time

      For Llama 3 8B at BF16, reading the 16 GB of weights takes about 4.78 ms. The maths is $2\times8\times10^9=1.6\times10^{10}$ FLOPs, which takes $0.016$ ms at 1,000 TFLOP/s. The GPU reads the next weights while doing maths on earlier ones, so a pass takes as long as the reading. With $1.6\times10^{10}$ bytes read, $I$ is 1 FLOP per byte, far below 300.

      One token every 4.78 ms is about 209 tokens/s. So the top decode speed for one conversation is

      $$\text{tokens/s}\le\frac{\text{memory bandwidth}}{\text{weight bytes}}=\frac{3.35\times10^{12}}{16\times10^9}\approx209.$$

      To raise it, we need more memory bandwidth or fewer bytes of weights. At INT8 the ceiling doubles to about 419 tokens/s.

      ### Sharing one read across a batch

      With a batch of $B$ conversations, we stack their token vectors into a $(B\times k)$ matrix and multiply it by each weight matrix. Each weight is read once and used $B$ times. The reading stays at 4.78 ms while the maths grows to $B\times0.016$ ms, so $I$ grows from 1 to $B$ FLOPs per byte. Until $B$ nears the ops:byte ratio of 300, the step takes about the same time and total tokens/s grows $B$ times. Past that, the maths is slower, the step time grows with $B$, and tokens/s levels off.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="Bars drawn to scale for one decode step of Llama 3 8B at BF16 on an H100. For batch sizes 1, 100 and 300, the blue bar for reading the weights is always 4.78 ms long. The orange bar for the maths is 0.016 ms at batch 1, almost invisible, 1.6 ms at batch 100 and 4.8 ms at batch 300, where it just passes the reading">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="10" y="64">B = 1</text>
      <rect x="130" y="40" width="477.6" height="20" fill="#3b82f6" fill-opacity="0.35"/><text x="136" y="55">read weights: 4.78 ms</text>
      <rect x="130" y="64" width="1.6" height="20" fill="#f59e0b"/><text x="138" y="79" fill="#737373">maths: 0.016 ms</text>
      <text x="10" y="134">B = 100</text>
      <rect x="130" y="110" width="477.6" height="20" fill="#3b82f6" fill-opacity="0.35"/><text x="136" y="125">read weights: 4.78 ms</text>
      <rect x="130" y="134" width="160" height="20" fill="#f59e0b" fill-opacity="0.45"/><text x="136" y="149">maths: 1.6 ms</text>
      <text x="10" y="204">B = 300</text>
      <rect x="130" y="180" width="477.6" height="20" fill="#3b82f6" fill-opacity="0.35"/><text x="136" y="195">read weights: 4.78 ms</text>
      <rect x="130" y="204" width="480" height="20" fill="#f59e0b" fill-opacity="0.45"/><text x="136" y="219">maths: 4.8 ms</text>
      <path d="M130 245 H610" stroke="#737373"/>
      <path d="M130 245 v5 M230 245 v5 M330 245 v5 M430 245 v5 M530 245 v5" stroke="#737373"/>
      <text x="130" y="266" text-anchor="middle" fill="#737373">0</text>
      <text x="230" y="266" text-anchor="middle" fill="#737373">1</text>
      <text x="330" y="266" text-anchor="middle" fill="#737373">2</text>
      <text x="430" y="266" text-anchor="middle" fill="#737373">3</text>
      <text x="530" y="266" text-anchor="middle" fill="#737373">4</text>
      <text x="370" y="290" text-anchor="middle" fill="#737373">time for one decode step (ms)</text>
      <text x="10" y="22" fill="#737373">one decode step, drawn to scale</text>
      </g>
      </svg>
      ```

      ### Limitations

      These speeds are upper limits. Each conversation also reads its own KV cache, and starting each kernel takes a little time, so real systems decode more slowly.
    worked: |
      Let's work out how fast Llama 3 8B at BF16 decodes on an H100 when 8 conversations decode together. We'll count only the weights as memory traffic, and use 3.35 TB/s and 1,000 TFLOP/s.

      1. **Find the time to read the weights.** One read of the 16 GB serves the whole batch.
         $$\frac{16\times10^9}{3.35\times10^{12}}\approx0.00478\text{ s}=4.78\text{ ms}.$$

      2. **Find the time for the maths.** Each of the 8 tokens costs 2 FLOPs per parameter, and 1,000 TFLOP/s is $10^{15}$ FLOP/s.
         $$\frac{8\times2\times8\times10^9}{10^{15}}=1.28\times10^{-4}\text{ s}=0.128\text{ ms}.$$

      3. **Take the slower of the two.** The GPU reads and computes at the same time, so the step lasts as long as the reading.
         $$\max(4.78,\ 0.128)=4.78\text{ ms}.$$

      4. **Count the tokens per second.** Each 4.78 ms step makes one token for each of the 8 conversations. That's 8 times the single-conversation speed of 209.375 tokens/s, which we rounded to 209.
         $$\frac{8\times3.35\times10^{12}}{16\times10^9}=1675\text{ tokens/s}.$$

      Each conversation still gets about 209 tokens/s, the same as decoding alone, but the GPU now makes 8 times as many tokens in total, because the maths is still far quicker than the reading.
