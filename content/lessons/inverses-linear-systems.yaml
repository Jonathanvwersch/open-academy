  - id: inv-elimination
    title: "Solve equations by removing unknowns"
    explain: |
      ### Equations as one matrix product

      Let's answer the café question from the start. Each order gives one equation. Two coffees and a tea cost £8, and one coffee and one tea cost £5. If we call the price of a coffee $x_1$ and of a tea $x_2$, in pounds, then

      $$\begin{aligned}2x_1+x_2&=8\\x_1+x_2&=5\end{aligned}$$

      Each left side is a row of counts dotted with the prices $x=(x_1,x_2)$, so the two equations are one matrix product:

      $$\begin{bmatrix}2&1\\1&1\end{bmatrix}\begin{bmatrix}x_1\\x_2\end{bmatrix}=\begin{bmatrix}8\\5\end{bmatrix}$$

      A **linear system** is a set of equations like these. Each unknown is multiplied by a number and the results are added. We write it $Ax=b$: $A$ holds those numbers, $x$ lists the unknowns, and $b$ lists the right-hand sides. This is the $A$ from step 1, with $b=(8,5)$. We already found $x=A^{-1}b=(3,2)$: £3 for coffee and £2 for tea.

      Each equation on its own is a straight line of points $(x_1,x_2)$. In the picture, the blue line is the first equation and the orange line is the second. The answer is the green point where they cross, $(3,2)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" aria-label="The blue line 2 x1 plus x2 equals 8 runs from (0, 8) to (4, 0). The orange line x1 plus x2 equals 5 runs from (0, 5) to (5, 0). They cross at the green point (3, 2), the solution." font-family="ui-sans-serif, system-ui, sans-serif">
      <g font-size="16" fill="#171717">
      <path d="M40 330 H360 M60 350 V60" stroke="#d4d4d4"/>
      <path d="M60 90 L180 330" stroke="#3b82f6" stroke-width="3"/>
      <path d="M60 180 L210 330" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="150" cy="270" r="6" fill="#10b981"/>
      <text x="164" y="266" fill="#10b981">(3, 2)</text>
      <text x="72" y="80" fill="#3b82f6">2x₁ + x₂ = 8</text>
      <text x="196" y="300" fill="#f59e0b">x₁ + x₂ = 5</text>
      <text x="346" y="352">x₁</text><text x="30" y="70">x₂</text>
      <g font-size="13" fill="#737373"><text x="176" y="348">4</text><text x="206" y="348">5</text><text x="44" y="95">8</text><text x="44" y="185">5</text></g>
      </g></svg>
      ```

      ### Removing one unknown at a time

      For bigger systems, we have no inverse formula here. **Elimination** finds $x$ without computing $A^{-1}$. It subtracts a multiple of one equation from another to remove an unknown. Both sides of a true equation are equal. Subtracting equal amounts from both sides keeps the solution unchanged. For a system with one solution, we repeat until one equation has a single unknown. We solve it, then put that value back into the others.

      Here, subtracting the second equation from the first removes $x_2$ and leaves $x_1=3$. Then $x_1+x_2=5$ gives $x_2=2$, so a coffee costs £3 and a tea £2.

      Sometimes elimination removes every unknown at once. Suppose a careless till gives $2x_1+2x_2=8$ and $x_1+x_2=5$. Their matrix has rows $(2,2)$ and $(1,1)$, with determinant zero. Subtracting twice the second equation from the first leaves $0=-2$. That's false, so no prices fit both orders. Dividing the first equation by 2 gives $x_1+x_2=4$. Both left sides are $x_1+x_2$, but they must equal 4 and 5. The lines have the same slope and different totals, so they are parallel and never cross.
    worked: |
      Let's add juice to the café menu and solve for three prices from three orders. One coffee, one tea and one juice cost £9. One coffee, two teas and three juices cost £19. One coffee, three teas and six juices cost £33. With $x_3$ for the price of a juice:

      $$\begin{aligned}x_1+x_2+x_3&=9\\x_1+2x_2+3x_3&=19\\x_1+3x_2+6x_3&=33\end{aligned}$$

      1. **Remove $x_1$ from the second equation.** Both equations start with one $x_1$, so subtracting the first equation from the second removes it.
         $$x_2+2x_3=10$$

      2. **Remove $x_1$ from the third equation.** Subtracting the first equation from the third does the same.
         $$2x_2+5x_3=24$$

      3. **Remove $x_2$.** The last two results now have only $x_2$ and $x_3$. Subtracting twice the result of step 1 from the result of step 2 leaves one unknown.
         $$\begin{aligned}(2x_2+5x_3)-2(x_2+2x_3)&=24-2\times10\\
         (2x_2-2x_2)+(5x_3-4x_3)&=24-20\\
         x_3&=4\end{aligned}$$

      4. **Put the values back.** The equation $x_2+2x_3=10$ gives $x_2=10-8=2$, and then the first equation gives $x_1$.
         $$x_1=9-2-4=3$$

      So a coffee costs £3, a tea £2 and a juice £4. Checking the third order, $3+3\times2+6\times4=33$, as it should.
