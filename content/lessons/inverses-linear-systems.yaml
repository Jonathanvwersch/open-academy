concept: inverses-linear-systems
version: 1
objective: |
  **Goal:** find and check the inverse of a $2\times2$ matrix, solve a small linear system $Ax=b$ by elimination, use the transpose rules including $(AB)^\top=B^\top A^\top$ to recognise symmetric matrices, and solve systems in NumPy with `np.linalg.solve`.
recap:
  - concept: determinants
    text: "A nonzero determinant allows an inverse. Row additions preserve the determinant; row swaps reverse its sign. Use these row operations to clear entries below pivots, then multiply the triangular diagonal entries and account for swaps."
where_this_fits: |
  ### What is a matrix inverse?

  The inverse of a matrix is a second matrix that undoes the first one. If a matrix sends an input to an output, its inverse sends that output back to the same input.

  That's useful when we know the output and want the input. At a café, suppose two coffees and a tea cost £8, and one coffee and one tea cost £5. What does each drink cost? Each total is that order's drink counts dotted with the unknown prices. So the counts form a matrix that turns prices into totals, and finding the prices means undoing it.

  We'll also learn rules for the transpose, the matrix with rows and columns swapped. We'll need them later in the course to fit lines to data.
knowledge_points:
  - id: inv-identity-inverse
    key_prereqs: [determinants, matrices]
    title: "Undo a matrix with its inverse"
    tldr: |
      - The identity matrix leaves every vector unchanged.
      - Multiplying a matrix by its inverse gives the identity.
      - For a square matrix, a nonzero determinant tells us that this inverse exists.
    explain: |
      ### A matrix that changes nothing

      To find the matrix that undoes another, we first need a matrix that leaves everything alone.

      The **identity matrix**, written $I$, has 1s down its main diagonal and 0s everywhere else:

      $$I=\begin{bmatrix}1&0\\0&1\end{bmatrix}$$

      In $AI$, each column of $I$ picks out the matching entry from each row of $A$. In $IA$, each row of $I$ picks out the matching row of $A$. Both products leave $A$ unchanged:

      $$AI=IA=A$$

      ### The matrix that undoes A

      Take $A=\begin{bmatrix}2&1\\1&1\end{bmatrix}$. Check its determinant:
      $$
      \begin{aligned}
      \det(A)&=2\times1-1\times1 &&\text{use the determinant formula}\\
      &=2-1 &&\text{multiply each pair}\\
      &=1 &&\text{subtract the products}
      \end{aligned}
      $$
      Its nonzero determinant means it can be undone. In the picture, $A$ sends the blue input $(3,2)$ to the green output $(8,5)$, along the orange arrow. The grey arrow goes back.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" aria-label="The matrix A with rows (2, 1) and (1, 1) sends the blue input point (3, 2) to the green output point (8, 5), shown by an orange curved arrow labelled A. A grey curved arrow labelled A inverse goes from the output back to the input." font-family="ui-sans-serif, system-ui, sans-serif">
      <defs><marker id="inv-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="inv-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker><marker id="inv-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker><marker id="inv-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-size="16" fill="#171717">
      <path d="M40 320 H370 M60 340 V120" stroke="#d4d4d4"/>
      <circle cx="150" cy="260" r="7" fill="#3b82f6"/>
      <circle cx="300" cy="170" r="7" fill="#10b981"/>
      <path d="M150 252 Q 190 160 290 164" fill="#ffffff" fill-opacity="0" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#inv-orange)"/>
      <path d="M300 180 Q 260 270 160 266" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="2.5" marker-end="url(#inv-grey)"/>
      <text x="96" y="248" fill="#3b82f6">(3, 2)</text>
      <text x="308" y="166" fill="#10b981">(8, 5)</text>
      <text x="188" y="168" fill="#f59e0b">A</text>
      <text x="262" y="262" fill="#737373">A⁻¹</text>
      <text x="20" y="344">(0, 0)</text>
      </g></svg>
      ```

      The **inverse** of $A$, written $A^{-1}$, sends every output back to its input. A matrix with an inverse is **invertible**. Every vector $y$ then comes from exactly one input. Applying $A^{-1}$ to $y$ finds that input, and applying $A$ returns $y$. Here $x$ is a vector written as a column. In a product like $A^{-1}Ax$, the matrix next to $x$ acts first. Both orders give $I$:

      $$AA^{-1}=A^{-1}A=I$$

      ### A formula for $2\times2$ inverses

      For $A=\begin{bmatrix}a&b\\c&d\end{bmatrix}$, swap the two diagonal entries, change the signs of the other two, and divide every entry by the determinant:

      $$A^{-1}=\frac{1}{ad-bc}\begin{bmatrix}d&-b\\-c&a\end{bmatrix}$$

      Why does this work? Multiply before dividing by the determinant:
      $$
      \begin{aligned}
      A\begin{bmatrix}d&-b\\-c&a\end{bmatrix}&=\begin{bmatrix}ad-bc&-ab+ba\\cd-dc&-cb+da\end{bmatrix} &&\text{dot each row with each column}\\
      &=\begin{bmatrix}ad-bc&0\\0&ad-bc\end{bmatrix} &&\text{cancel the off-diagonal terms}\\
      AA^{-1}&=I &&\text{divide by }ad-bc
      \end{aligned}
      $$
      When $ad-bc=0$, there is no inverse.

      Be careful not to take $1$ over each entry. The inverse of $\begin{bmatrix}2&1\\1&1\end{bmatrix}$ is not $\begin{bmatrix}0.5&1\\1&1\end{bmatrix}$.

      ### Undoing two matrices in a row

      Matrix products can be grouped either way:
      $$(AB)x=A(Bx).$$
      So $B$ acts first, then $A$. When both have inverses, undo them in reverse order:

      1. Undo $A$:
         $$A^{-1}(ABx)=Bx.$$
      2. Undo $B$:
         $$B^{-1}(Bx)=x.$$

      The inverse of a product reverses the order:

      $$(AB)^{-1}=B^{-1}A^{-1}$$
    worked: |
      Let's find the inverse of $A=\begin{bmatrix}2&1\\1&1\end{bmatrix}$, check it, and use it to take the output $(8,5)$ back to its input.

      1. **Find the determinant.** The formula divides by it, so it must not be zero.
         $$\det(A)=2\times1-1\times1=1$$

      2. **Apply the formula.** We swap the 2 and the 1 on the diagonal, change the signs of the other two entries, and divide by 1.
         $$A^{-1}=\begin{bmatrix}1&-1\\-1&2\end{bmatrix}$$

      3. **Check by multiplying.** Each entry is a row of $A$ dotted with a column of $A^{-1}$.
         $$
         \begin{aligned}
         AA^{-1}&=\begin{bmatrix}2\times1+1\times(-1)&2\times(-1)+1\times2\\1\times1+1\times(-1)&1\times(-1)+1\times2\end{bmatrix} &&\text{pair each row with each column}\\
         &=\begin{bmatrix}2-1&-2+2\\1-1&-1+2\end{bmatrix} &&\text{multiply matching entries}\\
         &=\begin{bmatrix}1&0\\0&1\end{bmatrix} &&\text{add the products}
         \end{aligned}
         $$

      4. **Undo the output.** $A^{-1}$ times $(8,5)$ should give back the input.
         $$A^{-1}\begin{bmatrix}8\\5\end{bmatrix}=\begin{bmatrix}8-5\\-8+10\end{bmatrix}=\begin{bmatrix}3\\2\end{bmatrix}$$

      We got $(3,2)$ back, the input that $A$ sent to $(8,5)$, so $A^{-1}$ really does undo $A$.
