summary: |
  - The identity matrix $I$ has 1s on its main diagonal and 0s elsewhere, so $AI=IA=A$. The inverse $A^{-1}$ undoes $A$, so $AA^{-1}=A^{-1}A=I$, and for a $2\times2$ matrix $A^{-1}=\frac{1}{ad-bc}\begin{bmatrix}d&-b\\-c&a\end{bmatrix}$ when $ad-bc\neq0$. The inverse of a product reverses the order, $(AB)^{-1}=B^{-1}A^{-1}$.
  - A linear system can be written $Ax=b$. Its augmented matrix $[A\mid b]$ keeps each total beside its equation. Elimination uses whole-row swaps and additions, then back-substitution finds the unknowns; when $A$ is invertible the answer is $x=A^{-1}b$.
  - The transpose swaps rows and columns, $(A^\top)_{ij}=A_{ji}$. The dot product is $x^\top y$, and a product's transpose reverses the order, $(AB)^\top=B^\top A^\top$. A symmetric matrix has $A^\top=A$, and $A^\top A$ is always symmetric.
  - In NumPy, `np.linalg.solve(A, b)` solves $Ax=b$. It is preferred to `np.linalg.inv(A) @ b` because it does less arithmetic and is usually at least as accurate.

  **Next:** We'll ask which vectors can be built from a matrix's columns, which tells us when $Ax=b$ has one solution, none or infinitely many.
