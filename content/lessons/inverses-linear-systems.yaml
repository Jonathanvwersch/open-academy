  - id: inv-elimination
    key_prereqs: [determinants, matrices]
    title: "Solve equations by removing unknowns"
    tldr: |
      - Store each equation's numbers and total together in one row.
      - Swap whole rows when needed, then subtract row multiples to remove unknowns.
      - Solve from the bottom row upwards, putting each known value back into earlier rows.
      - A false equation means there is no shared solution.
    explain: |
      ### Keep each equation in one row

      The café orders give several equations for the same prices. A **linear system** is a set of equations in which each unknown is multiplied by a number and the results are added. Write it $Ax=b$: $A$ holds those numbers, $x$ lists the unknowns and $b$ lists the totals. When $A$ is invertible, $x=A^{-1}b$.

      To organise elimination, put the totals beside the matrix. This **augmented matrix**, written $[A\mid b]$, has one row per equation. The vertical bar separates the numbers multiplying unknowns from the right-hand side. Keep the unknowns in the same column order. With three unknowns, a row $(2,2,0\mid10)$ means $2x_1+2x_2+0x_3=10$.

      The blue block holds $A$ and the orange column holds $b$. Each horizontal row keeps an equation's numbers and total together.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" aria-label="An augmented matrix with blue coefficient rows (0,2,1), (2,2,0), (4,6,5) and an orange totals column (8,10,44). A vertical bar separates the coefficient matrix A from b. Every horizontal row represents one equation." font-family="ui-sans-serif, system-ui, sans-serif">
      <rect x="80" y="45" width="210" height="120" fill="#3b82f6" fill-opacity="0.12"/>
      <rect x="310" y="45" width="70" height="120" fill="#f59e0b" fill-opacity="0.15"/>
      <path d="M70 40 H60 V170 H70 M390 40 H400 V170 H390 M300 45 V165" fill="#ffffff" fill-opacity="0" stroke="#171717" stroke-width="2"/>
      <g font-size="16" text-anchor="middle" fill="#171717">
      <text x="185" y="28" fill="#3b82f6">A: numbers multiplying unknowns</text><text x="345" y="28" fill="#f59e0b">b: totals</text>
      <text x="115" y="73">0</text><text x="185" y="73">2</text><text x="255" y="73">1</text><text x="345" y="73">8</text>
      <text x="115" y="113">2</text><text x="185" y="113">2</text><text x="255" y="113">0</text><text x="345" y="113">10</text>
      <text x="115" y="153">4</text><text x="185" y="153">6</text><text x="255" y="153">5</text><text x="345" y="153">44</text>
      </g></svg>
      ```

      ### Clear below the pivots

      **Elimination** subtracts multiples of equations to remove unknowns. Use the row additions and row swaps from determinants on the entire augmented row, including its total. A row addition performs the same arithmetic on both sides of an equation. Keeping the other equation lets us undo the addition, so the solution set stays the same. A row swap only reorders equations.

      If the next pivot position is zero, swap in a row with a nonzero entry there. Clear below each pivot until $A$ is upper triangular. Solve the last equation first, then put its value into the row above. Continuing upwards is **back-substitution**.

      Be careful to update the totals too. Changing only $A$ changes the equations.

      ### Recognise a contradiction

      Some systems have no shared solution. For $2x_1+2x_2=8$ and $x_1+x_2=5$, subtract twice the second equation from the first:
      $$
      \begin{aligned}
      (2x_1+2x_2)-2(x_1+x_2)&=8-2\times5 &&\text{subtract twice the second equation}\\
      0&=-2 &&\text{cancel the unknowns}
      \end{aligned}
      $$
      In augmented form, the resulting row is $(0,0\mid-2)$. It states a false equality, so no input satisfies both equations.
    worked: |
      Let's solve for three unknowns, keeping every right-hand side with its equation:

      $$\begin{aligned}2x_2+x_3&=8\\2x_1+2x_2&=10\\4x_1+6x_2+5x_3&=44\end{aligned}$$

      1. **Build the augmented matrix.** Use column order $x_1,x_2,x_3$, putting zero where an unknown is absent.
         $$[A\mid b]=\left[\begin{array}{ccc|c}0&2&1&8\\2&2&0&10\\4&6&5&44\end{array}\right]$$

      2. **Swap in a first pivot.** The top-left entry is zero, so exchange the first two whole rows.
         $$R_1\leftrightarrow R_2:\qquad\left[\begin{array}{ccc|c}2&2&0&10\\0&2&1&8\\4&6&5&44\end{array}\right]$$

      3. **Clear below the first pivot.** Subtract twice row 1 from row 3, including $44-2\times10$ in the totals column.
         $$R_3\leftarrow R_3-2R_1:\qquad\left[\begin{array}{ccc|c}2&2&0&10\\0&2&1&8\\0&2&5&24\end{array}\right]$$

      4. **Clear below the second pivot.** Subtract row 2 from row 3. The left block is now upper triangular.
         $$R_3\leftarrow R_3-R_2:\qquad\left[\begin{array}{ccc|c}2&2&0&10\\0&2&1&8\\0&0&4&16\end{array}\right]$$

      5. **Solve the bottom equation.** Read the last row as an equation for $x_3$.
         $$\begin{aligned}4x_3&=16 &&\text{read row 3}\\x_3&=4 &&\text{divide by }4\end{aligned}$$

      6. **Substitute into row 2.** Use the known value of $x_3$.
         $$\begin{aligned}2x_2+4&=8 &&\text{put }x_3=4\text{ into row 2}\\2x_2&=4 &&\text{subtract }4\\x_2&=2 &&\text{divide by }2\end{aligned}$$

      7. **Substitute into row 1.** Use the known value of $x_2$.
         $$\begin{aligned}2x_1+2\times2&=10 &&\text{put }x_2=2\text{ into row 1}\\2x_1&=6 &&\text{subtract }4\\x_1&=3 &&\text{divide by }2\end{aligned}$$

      8. **Check the original equations.** Multiply the original matrix by the solution vector.
         $$\begin{bmatrix}0&2&1\\2&2&0\\4&6&5\end{bmatrix}\begin{bmatrix}3\\2\\4\end{bmatrix}=\begin{bmatrix}8\\10\\44\end{bmatrix}$$

      The solution is $(3,2,4)$. The row swap and additions kept all three equations satisfied.
    problems:
      - inv-elimination-basics
      - inv-el-self-explain
      - inv-el-write-matrix
      - inv-el-two-template
      - inv-el-inverse-route
      - inv-el-no-solution
      - inv-el-three-unknowns
      - inv-el-augmented-three
      - inv-el-swap-needed
      - inv-el-fertiliser
  - id: inv-transpose
    key_prereqs: [matrices, dot-product]
    title: "Swap a matrix's rows and columns"
    tldr: |
      - Transposing a matrix swaps its rows and columns.
      - Transposing a product also reverses the order of its two matrices.
      - Multiplying a transpose by its original matrix makes entries on opposite sides of the diagonal match.
      - That matching pattern is called symmetry.
    explain: |
      ### Rows become columns

      In the matrices lesson, we used `.T` in NumPy to make shapes fit. The transpose also has rules of its own. We need them to write dot products as matrix products, and later in the course to fit a line to data.

      The **transpose** of a matrix $A$, written $A^\top$, turns each row of $A$ into a column: row 1 becomes column 1, row 2 becomes column 2, and so on. Writing $A_{ij}$ for the entry of $A$ in row $i$, column $j$:

      $$(A^\top)_{ij}=A_{ji}$$

      In the picture, the blue row of $B$ becomes the blue column of $B^\top$, and the orange row becomes the orange column, so a $2\times3$ matrix becomes $3\times2$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" aria-label="B, a 2 by 3 matrix with rows (1, 2, 3) in blue and (4, 5, 6) in orange, becomes its 3 by 2 transpose, with columns (1, 2, 3) in blue and (4, 5, 6) in orange." font-family="ui-sans-serif, system-ui, sans-serif">
      <g font-size="16" fill="#171717" text-anchor="middle">
      <rect x="40" y="60" width="120" height="40" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="40" y="100" width="120" height="40" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="60" y="86">1</text><text x="100" y="86">2</text><text x="140" y="86">3</text>
      <text x="60" y="126">4</text><text x="100" y="126">5</text><text x="140" y="126">6</text>
      <text x="100" y="180" fill="#737373">B: 2 × 3</text>
      <path d="M190 100 H270 M258 92 L270 100 L258 108" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0"/>
      <text x="230" y="88" fill="#737373">transpose</text>
      <rect x="300" y="40" width="40" height="120" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="340" y="40" width="40" height="120" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="320" y="66">1</text><text x="320" y="106">2</text><text x="320" y="146">3</text>
      <text x="360" y="66">4</text><text x="360" y="106">5</text><text x="360" y="146">6</text>
      <text x="340" y="190" fill="#737373">Bᵀ: 3 × 2</text>
      </g></svg>
      ```

      ### Dot products as matrix products

      In matrix maths we write a vector as a column, even when we write it as $(1,2)$ in a sentence. Its transpose $x^\top$ is a matrix with one row. For two vectors with $n$ entries each, $x^\top y$ has shape $(1\times n)(n\times1)$, so its single entry is their dot product. For $x=(1,2)$ and $y=(3,4)$:
      $$
      \begin{aligned}
      x^\top y&=1\times3+2\times4 &&\text{dot the row with the column}\\
      &=3+8 &&\text{multiply matching entries}\\
      &=11 &&\text{add the products}
      \end{aligned}
      $$

      ### The transpose of a product

      Transposing a product reverses its order:

      $$(AB)^\top=B^\top A^\top$$

      Follow one entry to see why:

      1. Transposing swaps the entry's row and column:
         $$((AB)^\top)_{ij}=(AB)_{ji}.$$
      2. Read that entry as a dot product:
         $$(AB)_{ji}=(\text{row }j\text{ of }A)\cdot(\text{column }i\text{ of }B).$$
      3. Transposing turns that row into a column and that column into a row. Reverse their dot product, which keeps the same sum:
         $$(\text{row }i\text{ of }B^\top)\cdot(\text{column }j\text{ of }A^\top)=(B^\top A^\top)_{ij}.$$

      ### Symmetric matrices

      A square matrix is **symmetric** when $A^\top=A$, so each entry matches its mirror image across the main diagonal. $\begin{bmatrix}2&1\\1&1\end{bmatrix}$ is one. For any matrix $A$, the product $A^\top A$ is symmetric:
      $$
      \begin{aligned}
      (A^\top A)^\top&=A^\top(A^\top)^\top &&\text{reverse the factors}\\
      &=A^\top A &&\text{transposing twice restores }A
      \end{aligned}
      $$
    worked: |
      Let's check the product rule on $A=\begin{bmatrix}1&2\\0&1\end{bmatrix}$ and $B=\begin{bmatrix}1&0\\3&1\end{bmatrix}$, then check that $A^\top A$ is symmetric.

      1. **Multiply $A$ by $B$.** Each entry is a row of $A$ dotted with a column of $B$. Work out the top left before collecting all four entries.
         $$
         \begin{aligned}
         (AB)_{11}&=1\times1+2\times3 &&\text{pair row 1 with column 1}\\
         &=1+6 &&\text{multiply matching entries}\\
         &=7 &&\text{add the products}\\
         AB&=\begin{bmatrix}7&2\\3&1\end{bmatrix} &&\text{collect all four row-column results}
         \end{aligned}
         $$

      2. **Transpose the product.** Row 1 of $AB$ becomes column 1.
         $$(AB)^\top=\begin{bmatrix}7&3\\2&1\end{bmatrix}$$

      3. **Multiply the transposes in reverse order.** $B^\top=\begin{bmatrix}1&3\\0&1\end{bmatrix}$ and $A^\top=\begin{bmatrix}1&0\\2&1\end{bmatrix}$. Check the top left again.
         $$
         \begin{aligned}
         (B^\top A^\top)_{11}&=1\times1+3\times2 &&\text{pair row 1 with column 1}\\
         &=1+6 &&\text{multiply matching entries}\\
         &=7 &&\text{add the products}\\
         B^\top A^\top&=\begin{bmatrix}7&3\\2&1\end{bmatrix} &&\text{collect all four row-column results}
         \end{aligned}
         $$

      4. **Try the original order.** Keeping the order the same gives a different matrix, so the reversal matters.
         $$A^\top B^\top=\begin{bmatrix}1&3\\2&7\end{bmatrix}$$

      5. **Multiply $A^\top$ by $A$.** Row 1 of $A^\top$ is column 1 of $A$, so the top right dots column 1 with column 2. The bottom left reverses the pair and gives the same sum.
         $$
         \begin{aligned}
         (A^\top A)_{12}&=1\times2+0\times1 &&\text{dot the two different columns}\\
         &=2+0 &&\text{multiply matching entries}\\
         &=2 &&\text{add the products}\\
         A^\top A&=\begin{bmatrix}1&2\\2&5\end{bmatrix} &&\text{collect all four row-column results}
         \end{aligned}
         $$

      Steps 2 and 3 agree, as the rule says, and $A^\top A$ matches its mirror image across the diagonal, so it is symmetric.
