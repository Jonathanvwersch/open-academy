      - inv-tr-ratings
  - id: inv-numpy
    key_prereqs: [matrices, determinants]
    title: "Solve a system in NumPy"
    tldr: |
      - When there is one answer, NumPy can solve a system with as many equations as unknowns.
      - Solving directly usually takes less work and adds less rounding error than finding an inverse.
      - Putting the answer back into the original equations checks that it works.
    explain: |
      ### Letting the computer eliminate

      Real systems can have thousands of unknowns, so we let a computer do the elimination. In the matrices lesson, we built matrices with `np.array` and multiplied them with `@`. NumPy keeps tools for matrix problems like ours in `np.linalg`, short for linear algebra, the maths of vectors and matrices. We'll use two of them, plus `np.eye`.

      - `np.linalg.solve(A, b)` returns the $x$ that solves $Ax=b$.
      - `np.linalg.inv(A)` returns the inverse $A^{-1}$.
      - `np.eye(3)` builds the $3\times3$ identity matrix; `eye` sounds like "I".

      The order of the inputs to `solve` matters: the matrix comes first, then the right-hand side.

      ### Why `solve` is the better choice

      Since $x=A^{-1}b$, we could also write `np.linalg.inv(A) @ b`. For small, tidy matrices both give the same answer, but `solve` is the one to use. It runs elimination directly on the equations $Ax=b$. To use `inv`, NumPy first has to work out every entry of the whole inverse, which is more arithmetic, and then still multiply by $b$.

      More arithmetic also means more rounding. A computer stores each number with a limited number of digits, so most calculations round a little. Each extra calculation can add a tiny error, which is why `solve` is usually at least as accurate as `inv(A) @ b`.

      NumPy usually stores numbers to about 16 digits. The `==` check asks whether each pair of entries is exactly equal. That check can report a mismatch over a tiny error in the last digit. Because of this rounding, we use `np.allclose(A @ x, b)`. It returns `True` when the arrays match apart from tiny differences.

      ### When there is no answer to find

      A **singular** matrix is a square matrix with no inverse. For a $2\times2$ matrix, that means its determinant is zero. Then `np.linalg.solve(A, b)` usually raises `LinAlgError: Singular matrix`. With decimal entries, rounding can hide the zero determinant, so `solve` may return enormous, meaningless numbers. Check the determinant and whether the result reproduces $b$; a tiny computed determinant can be a rounded zero.

      Be careful not to read that error as a bug in NumPy. It's telling you the equations don't pin down one answer, just as elimination did when every unknown vanished.
    worked: |
      Let's solve a café pricing system in NumPy. One coffee, one tea and one juice cost £9; one coffee, two teas and three juices cost £19; one coffee, three teas and six juices cost £33. The unknowns are the three drink prices:

      $$\begin{bmatrix}1&1&1\\1&2&3\\1&3&6\end{bmatrix}\begin{bmatrix}x_1\\x_2\\x_3\end{bmatrix}=\begin{bmatrix}9\\19\\33\end{bmatrix}$$

      1. **Build the arrays.** Each inner list of `A` is one order, and `b` holds the three totals.

      2. **Solve.** `np.linalg.solve(A, b)` returns decimal (floating-point) numbers, even with whole-number inputs. NumPy prints `3.` for 3.0.

      3. **Check the answer.** Multiplying the prices by `A` should give the totals back, apart from rounding.

      4. **Check the inverse.** We compute `inv` here only to check it. `A @ np.linalg.inv(A)` should be the identity, `np.eye(3)`.

      5. **Try a singular matrix.** The matrix with rows $(2,2)$ and $(1,1)$, from the careless till, has determinant zero, so `solve` stops with an error. Python runs the lines under `try:`, and if one raises an error, it runs the lines under `except` instead. Writing `as error` gives the error a name so we can print it.

      ```python
      import numpy as np

      A = np.array([[1, 1, 1], [1, 2, 3], [1, 3, 6]])
      b = np.array([9, 19, 33])

      x = np.linalg.solve(A, b)
      print(x)                                  # [3. 2. 4.]
      print(np.allclose(A @ x, b))              # True
      A_inv = np.linalg.inv(A)
      print(np.allclose(A @ A_inv, np.eye(3)))  # True

      C = np.array([[2, 2], [1, 1]])
      try:
          np.linalg.solve(C, np.array([8, 5]))
      except np.linalg.LinAlgError as error:
          print(error)                          # Singular matrix
      ```

      The code finds prices of £3, £2 and £4, and it refuses the singular system.
