      - mlp-two-layers-basics
      - mlpp-forward-why-h
      - mlpp-forward-order
      - mlpp-hidden-meaning
      - mlpp-forward-fixed
      - mlpp-forward-template
      - mlpp-why-activation
      - mlpp-why-no-sigmoid-output
      - mlpp-robot-forward
  - id: mlp-shapes
    title: "Keep one row per example"
    tldr: |
      - A batch stacks several examples as rows, and every example uses the same weights.
      - Transposing, or flipping, the weight matrix puts each neuron's weights in a column so the product lines up.
      - Each example stays in its own row all the way to its prediction.
      - A bigger batch gives bigger tables of results, but the same number of learned weights.
    explain: |
      ### Several inputs travel together

      We have run one example through the network. A **batch** groups several examples into one calculation, using the same weights and biases for each. Stack $(2,1)$, $(1,2)$ and $(0,1)$ as rows of a matrix $X$.

      In the picture, each row keeps its example from input to prediction. The hidden columns belong to the blue and orange neurons from step 1. The green column holds predictions from the single output neuron.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" aria-label="Three example rows: X has rows (2,1), (1,2), (0,1), shape 3 by 2. Hidden H has rows (2,0), (2,1), (0,1), shape 3 by 2. Predictions are 7, 9, 3, shape 3 by 1. Each row keeps the same example.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717" text-anchor="middle">
      <text x="60" y="30">X: 3×2</text><text x="180" y="30">H: 3×2</text><text x="300" y="30">Ŷ: 3×1</text>
      <rect x="20" y="50" width="80" height="120" stroke="#d4d4d4" fill="#171717" fill-opacity="0"/>
      <rect x="140" y="50" width="80" height="120" stroke="#d4d4d4" fill="#171717" fill-opacity="0"/>
      <rect x="260" y="50" width="80" height="120" stroke="#10b981" fill="#171717" fill-opacity="0"/>
      <text x="40" y="76">2</text><text x="80" y="76">1</text><text x="40" y="116">1</text><text x="80" y="116">2</text><text x="40" y="156">0</text><text x="80" y="156">1</text>
      <g fill="#3b82f6"><text x="160" y="76">2</text><text x="160" y="116">2</text><text x="160" y="156">0</text></g>
      <g fill="#f59e0b"><text x="200" y="76">0</text><text x="200" y="116">1</text><text x="200" y="156">1</text></g>
      <g fill="#10b981"><text x="300" y="76">7</text><text x="300" y="116">9</text><text x="300" y="156">3</text></g>
      <path d="M100 110 H140 M220 110 H260" stroke="#737373"/><path d="M132 106 L140 110 L132 114 M252 106 L260 110 L252 114" stroke="#737373" fill="#171717" fill-opacity="0"/>
      <text x="180" y="197" fill="#737373">one example per row throughout</text>
      </g>
      </svg>
      ```

      ### Why we transpose the weights

      A matrix product pairs a row with a column. Our blue neuron's weight row $(1,1)$ becomes the first column of $W_1^\top$. For example row $(2,1)$:
      $$
      \begin{aligned}
      2\cdot1+1\cdot1&=3 &&\text{dot with the weight column}\\
      3+(-1)&=2 &&\text{add the neuron's bias}
      \end{aligned}
      $$

      More generally, let $B$ count examples, $d_\text{in}$ count inputs and $d_\text{out}$ count neurons. Transposing puts the input count first in the weight shape, so the inner sizes match:

      $$(B\times d_\text{in})(d_\text{in}\times d_\text{out})=B\times d_\text{out}.$$

      Thus our two-layer batch calculation is

      $$H=\phi(XW_1^\top+b_1)$$

      $$\hat Y=HW_2^\top+b_2.$$

      Capital $H$ holds hidden values for all examples, and $\hat Y$ holds their predictions. Add bias $-1$ to the first column of scores and $0$ to the second, for every example row. NumPy calls this repeated addition **broadcasting**. ReLU acts on every entry separately.

      Be careful not to rely on compatible sizes alone to check the calculation. Without the transpose, our first row instead gives

      $$
      \begin{aligned}
      (2,1)W_1+(-1,0)&=(2-1,2+1)+(-1,0) &&\text{multiply without transposing}\\
      &=(1,3)+(-1,0) &&\text{evaluate the product}\\
      &=(0,3) &&\text{add biases}
      \end{aligned}
      $$

      Those are not the intended scores $(2,-1)$, because the columns of $W_1$ mix weights from different neurons.

      ### Count the weights and biases

      A layer's **parameters** are its adjustable weights and biases. Each neuron has one weight per input and one bias, so its parameter count is

      $$d_\text{out}d_\text{in}+d_\text{out}.$$

      Our layers have $6$ and $3$ parameters, giving $9$ in total. Be careful not to multiply that count by the batch size. More examples make larger arrays of computed values; the learned weights stay the same.
    worked: |
      Let's send our three examples through the same network and check the shapes as we go.

      1. **Arrange examples as rows.** Transpose the stored weights so each neuron becomes a column.
         $$X=\begin{pmatrix}2&1\\1&2\\0&1\end{pmatrix},\qquad W_1^\top=\begin{pmatrix}1&-1\\1&1\end{pmatrix}$$

      2. **Compute the scores.** A $3\times2$ matrix times a $2\times2$ matrix gives $3\times2$ scores; add $(-1,0)$ to each row.
         $$XW_1^\top+b_1=\begin{pmatrix}3-1&-1+0\\3-1&1+0\\1-1&1+0\end{pmatrix}=\begin{pmatrix}2&-1\\2&1\\0&1\end{pmatrix}$$

      3. **Apply ReLU to every entry.** The hidden array keeps the same shape.
         $$H=\begin{pmatrix}2&0\\2&1\\0&1\end{pmatrix}$$

      4. **Compute one prediction per row.** The output product has shape $(3\times2)(2\times1)=3\times1$.
         $$\hat Y=\begin{pmatrix}2&0\\2&1\\0&1\end{pmatrix}\begin{pmatrix}3\\2\end{pmatrix}+1=\begin{pmatrix}7\\9\\3\end{pmatrix}$$

      5. **Count the stored parameters.** Add each layer's weights and biases; computed hidden values are excluded.
         $$(2\cdot2+2)+(1\cdot2+1)=6+3=9$$

      Changing only the batch size changes the row counts while keeping the parameters fixed:

      | Batch size | $X$ | $H$ | $\hat Y$ | Parameters |
      | --- | --- | --- | --- | --- |
      | $1$ | $1\times2$ | $1\times2$ | $1\times1$ | $9$ |
      | $3$ | $3\times2$ | $3\times2$ | $3\times1$ | $9$ |
      | $32$ | $32\times2$ | $32\times2$ | $32\times1$ | $9$ |

      Here is the same calculation in NumPy, with one inner list per matrix row. We transpose the weights with `.T`, multiply matrices with `@` and apply ReLU with `np.maximum(0, ...)`. The additions repeat the biases across examples, and `.shape` reports each array size.

      ```python
      import numpy as np
      X = np.array([[2, 1], [1, 2], [0, 1]])
      W1 = np.array([[1, 1], [-1, 1]])
      b1 = np.array([-1, 0])
      W2 = np.array([[3, 2]])
      H = np.maximum(0, X @ W1.T + b1)
      Y = H @ W2.T + 1
      print(H.shape, Y.shape)  # (3, 2) (3, 1)
      print(Y)                # rows [7], [9], [3]
      ```

      The first prediction is still $7$: batching groups the calculations without changing them.
