  - id: mlp-shapes
    title: Shapes and parameter counts
    explain: |
      In code you rarely push one house through at a time. You stack many examples and process the whole group, called a **batch**, in one matrix product. Getting the shapes right is most of the work.

      Write $B$ for the number of examples in the batch, $d_\text{in}$ for the number of inputs per example and $d_\text{out}$ for the number of neurons in the layer.

      - $W$ has one row per neuron and one column per input, so $W \in \mathbb{R}^{d_\text{out} \times d_\text{in}}$.
      - The batch $X$ stores one example per row: $X \in \mathbb{R}^{B \times d_\text{in}}$.
      - $XW^\top + b$ applies the same weights to every row. $W^\top$ is $d_\text{in} \times d_\text{out}$, so the inner sizes match and the result is $B \times d_\text{out}$: one row of scores per example. The bias is added to every row.

      Many libraries store the weights already transposed, as $d_\text{in} \times d_\text{out}$, and write `X @ W + b`. The result is the same shape.

      Each layer has $d_\text{in} \cdot d_\text{out}$ weights plus $d_\text{out}$ biases. These are its **parameters**, the numbers training will adjust:

      $$\text{parameters} = d_\text{in} \cdot d_\text{out} + d_\text{out}$$
    worked: |
      This example shows shapes and parameter counts through the house network for a batch of $B = 3$ houses.

      The network takes 2 inputs, has 2 hidden neurons, and returns 1 output.

      | array | shape | why |
      |---|---|---|
      | input $X$ | $3 \times 2$ | 3 houses, 2 inputs each |
      | $W_1$ | $2 \times 2$ | 2 neurons, 2 inputs |
      | hidden $H$ | $3 \times 2$ | $(3 \times 2)(2 \times 2)$ |
      | $W_2$ | $1 \times 2$ | 1 neuron, 2 inputs |
      | output $\hat Y$ | $3 \times 1$ | $(3 \times 2)(2 \times 1)$ |

      Parameters: layer 1 has $2 \cdot 2 + 2 = 6$, layer 2 has $2 \cdot 1 + 1 = 3$, so the network has $9$. The batch size never appears in the count: the same 9 numbers are used for every house.
    problems:
      - mlpp-batch-shape
      - mlpp-params-template
      - mlpp-weight-shape
      - mlpp-hidden-array-size
      - mlpp-why-transpose
      - mlpp-robot-shapes
final: mlp-explain
summary: |
  - A layer computes $\phi(Wx + b)$: each row of $W$ is one neuron's weights, and the activation is applied to every score.
  - The forward pass runs the layers in order: $h = \phi(W_1 x + b_1)$, then $\hat y = W_2 h + b_2$, usually with no activation on the output.
  - For a batch $X$ of shape $B \times d_\text{in}$, a layer outputs $B \times d_\text{out}$ and has $d_\text{in} \cdot d_\text{out} + d_\text{out}$ parameters.
