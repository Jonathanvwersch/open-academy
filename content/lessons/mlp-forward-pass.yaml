  - id: mlp-two-layers
    title: The forward pass through two layers
    explain: |
      The house has hidden values $h = (1, 0)$, but you still need its final rating. **How should you combine them?** Simply adding them makes each count equally. A second layer instead gives each its own weight:

      $$h = \phi(W_1 x + b_1), \qquad \hat y = W_2 h + b_2$$

      $W_2$ contains those weights, $b_2$ is their bias, and $\hat y$ ("y-hat") is the prediction. This works because the rating can depend differently on each hidden value. The activation keeps the network from becoming one weighted sum.

      Running these layers in order is the **forward pass** of a **multilayer perceptron** (MLP). Why no output sigmoid? A house rating need not stay between 0 and 1.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" aria-label="The forward pass as four steps left to right: input x = (1, 2); layer 1 scores W1 x + b1 = (1, minus 1); hidden values after ReLU h = (1, 0); output y-hat = W2 h + b2 = 3.">
        <rect x="10" y="30" width="140" height="70" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
        <text x="80" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">x</text>
        <text x="80" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">(1, 2)</text>
