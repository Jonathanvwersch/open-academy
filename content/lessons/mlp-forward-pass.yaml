    worked: |
      This example shows the network rating a 300 m² house that is 4 km from the station, so $x = (3, 4)$.

      The first layer uses $W_1 = \begin{pmatrix}1 & 0\\ -1 & 1\end{pmatrix}$, $b_1 = (0, -2)$ and ReLU. The output layer uses $W_2 = (2, 3)$ and $b_2 = 1$.

      1. **Layer 1 scores:** The matrix product gives $W_1 x = (1 \cdot 3 + 0 \cdot 4,\ -1 \cdot 3 + 1 \cdot 4) = (3, 1)$. Adding the biases $b_1$ gives $(3, -1)$.
      2. **Activation:** ReLU keeps 3 and changes $-1$ to 0, giving $h = (3, 0)$.
      3. **Output:** The second layer combines these values into $\hat y = 2 \cdot 3 + 3 \cdot 0 + 1 = 7$.

      Without ReLU, step 3 would use $(3, -1)$ and give $2 \cdot 3 + 3 \cdot (-1) + 1 = 4$. The activation changed the answer.
