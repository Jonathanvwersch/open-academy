          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="464" y="132" fill="#737373" font-size="14" text-anchor="middle">+ b₂</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="260" fill="#737373" font-size="14" text-anchor="middle">each row is one example, from start to finish</text>
        </g>
      </svg>
      ```

      **The idea.** In a matrix product, each output entry is one row of the left matrix dotted with one column of the right. Each example is a row of $X$, so each neuron's weights must sit in a column. That is the transpose $W^\top$, which swaps the rows and columns of $W$. Write $B$ for the number of examples, $d_\text{in}$ for the number of inputs and $d_\text{out}$ for the number of neurons. A layer turns a batch of shape $B\times d_\text{in}$ into $B\times d_\text{out}$, because the inner sizes match:

      $$(B\times d_\text{in})(d_\text{in}\times d_\text{out})=B\times d_\text{out}$$

      For the two-layer network, with $H$ the hidden values and $\hat Y$ one prediction per row:

      $$H=\phi(XW_1^\top+b_1)$$

      $$\hat Y=HW_2^\top+b_2$$

      The same bias row is added to every row of the product, which NumPy calls broadcasting. A layer's **parameters**, the numbers training adjusts, are its $d_\text{out}\cdot d_\text{in}$ weights plus its $d_\text{out}$ biases; a model's parameter count, summed over its layers, is how many numbers training learns.

      **Common confusion.** “A bigger batch needs more weights.” No: every example uses the same weights and biases. The batch size $B$ changes only the number of rows of $X$, $H$ and $\hat Y$, so the parameter count stays the same.
    worked: |
      Push the batch through the network and check every shape.

      $$X=\begin{pmatrix}2&1\\1&2\\0&1\end{pmatrix}$$

      1. **Turn each neuron's weights into a column.**
         $$W_1^\top=\begin{pmatrix}1&-1\\1&1\end{pmatrix}$$

      2. **Check layer 1's shapes.**
         $$(3\times2)(2\times2)=3\times2$$

      3. **Compute layer 1's scores, adding $b_1=(-1,0)$ to every row.**
         $$XW_1^\top+b_1=\begin{pmatrix}3&-1\\3&1\\1&1\end{pmatrix}+\begin{pmatrix}-1&0\\-1&0\\-1&0\end{pmatrix}=\begin{pmatrix}2&-1\\2&1\\0&1\end{pmatrix}$$

      4. **Apply ReLU.**
         $$H=\begin{pmatrix}2&0\\2&1\\0&1\end{pmatrix}$$

      5. **Check the output layer's shapes.**
         $$(3\times2)(2\times1)=3\times1$$

      6. **Compute the predictions.**
         $$\hat Y=HW_2^\top+b_2=\begin{pmatrix}2&0\\2&1\\0&1\end{pmatrix}\begin{pmatrix}3\\2\end{pmatrix}+1=\begin{pmatrix}7\\9\\3\end{pmatrix}$$

      7. **Count the parameters.**
         $$\text{layer 1: }2\cdot2+2=6$$
         $$\text{layer 2: }1\cdot2+1=3$$
         $$\text{total: }6+3=9$$

      **Compare cases.**

      | Network, batch size | $X$ | $H$ | $\hat Y$ | Parameters |
      | --- | --- | --- | --- | --- |
      | 2 → 2 → 1, $B=1$ | $1\times2$ | $1\times2$ | $1\times1$ | $9$ |
      | 2 → 2 → 1, $B=3$ | $3\times2$ | $3\times2$ | $3\times1$ | $9$ |
      | 2 → 2 → 1, $B=32$ | $32\times2$ | $32\times2$ | $32\times1$ | $9$ |
      | 10 → 16 → 1, $B=32$ | $32\times10$ | $32\times16$ | $32\times1$ | $193$ |

      **Where it shows up.** To price 32 houses with 10 measurements each, $X$ is $32\times10$, and one forward pass gives a $32\times1$ column of prices. In NumPy the first layer is `np.maximum(0, X @ W1.T + b1)`, where `np.maximum(0, …)` applies ReLU to every entry.
