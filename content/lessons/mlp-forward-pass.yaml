concept: mlp-forward-pass
version: 1
fast_path: [objective, summary]
blocks:
  - kind: objective
    md: |
      **Goal:** compute a two-layer forward pass by hand, count parameters, and track array shapes through a multilayer perceptron.
  - kind: intuition
    md: |
      A multilayer perceptron (MLP) alternates linear layers with activations:
      $$h = \phi(W_1 x + b_1), \qquad \hat y = W_2 h + b_2.$$
      The hidden layer $h$ is a set of intermediate values, and the output layer combines them into a result. In code you can process a group of inputs at once, so each array has a leading dimension for the group.
  - kind: example
    md: |
      This example follows a two-layer network from its inputs through hidden values to an output.

      $x = (1, 2)$, $W_1 = \begin{pmatrix}1 & 0\\ -1 & 1\end{pmatrix}$, $b_1 = (0, -2)$, ReLU, $W_2 = (2, 3)$, $b_2 = 1$.

      1. $W_1x + b_1 = (1, 1) + (0, -2) = (1, -1)$.
      2. ReLU gives $h = (1, 0)$.
      3. $\hat y = 2\cdot1 + 3\cdot0 + 1 = 3$.
  - kind: math
    md: |
      $B$ is the number of examples in a batch, $d_\text{in}$ is the number of inputs per example, and $d_\text{out}$ is the number of outputs.

      For one input stored as a column, the layer uses $W_1x$. In a batch, inputs are rows, so $XW^\top$ applies the same weights to every row. With $X \in \mathbb{R}^{B\times d_\text{in}}$ and $W \in \mathbb R^{d_\text{out}\times d_\text{in}}$, the output shape is $B\times d_\text{out}$.

      Parameters per layer: $d_\text{in}\cdot d_\text{out} + d_\text{out}$.
  - kind: worked
    md: |
      This worked example follows how array shapes and parameter counts change across two layers.

      A two-layer network takes 2 inputs, has 2 hidden units, and returns 1 output. For a group of 3 examples:

      | array | shape |
      |---|---|
      | input $X$ | (3, 2) |
      | hidden values $H$ | (3, 2) |
      | output $\hat Y$ | (3, 1) |

      Parameters: $2\cdot2 + 2 = 6$ in the first layer, plus $2\cdot1 + 1 = 3$ in the second, for a total of $9$.
  - kind: check
    exercise: mlp-check-forward
  - kind: summary
    md: |
      - Linear, then activation, repeated, with a linear output layer.
      - Each layer has $d_\text{in}d_\text{out} + d_\text{out}$ parameters.
      - Track the group-of-examples dimension in every shape.
