concept: mlp-forward-pass
version: 2
objective: |
  **Goal:** compute a two-layer forward pass by hand, count a layer's weights and biases, and track the shape of every array as a batch of examples moves through a multilayer perceptron.
knowledge_points:
  - id: mlp-layer-of-neurons
    title: A layer is many neurons at once
    explain: |
      One neuron draws one straight boundary. To score a house on several things at once, you'd want several neurons, each with its own weights and bias, all reading the same inputs.

      Take a house with size $x_1 = 1$ (hundreds of m²) and distance $x_2 = 2$ km, so $x = (1, 2)$. Two neurons read it:

      - neuron 1 has weights $(1, 0)$ and bias $0$, so its score is $1 \cdot 1 + 0 \cdot 2 + 0 = 1$;
      - neuron 2 has weights $(-1, 1)$ and bias $-2$, so its score is $-1 \cdot 1 + 1 \cdot 2 - 2 = -1$.

      Stack each neuron's weights as one row of a matrix $W_1$ and their biases into a vector $b_1$. Then a matrix-vector product computes every score in one go, because it dots each row with $x$:

      $$W_1 = \begin{pmatrix}1 & 0\\ -1 & 1\end{pmatrix}, \quad b_1 = (0, -2), \quad W_1 x + b_1 = (1, -1)$$

      Row $i$ of $W_1$ belongs to neuron $i$, and the entry in row $i$, column $j$ is the weight from input $j$ to neuron $i$.

      Finally apply an activation $\phi$ to each score. Here it's ReLU, giving $h = \phi(W_1 x + b_1) = (1, 0)$. This group of neurons is a **layer**. Its outputs $h$ are **hidden values**: the network computes them itself; they aren't in the data. So it's called a **hidden layer**.

