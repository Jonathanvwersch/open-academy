concept: mlp-forward-pass
version: 1
fast_path: [objective, summary]
blocks:
  - kind: objective
    md: |
      **Goal:** compute a two-layer forward pass by hand, count parameters, and track tensor shapes through a multilayer perceptron.
  - kind: intuition
    md: |
      A multilayer perceptron (MLP) alternates linear layers with activations:
      $$h = \phi(W_1 x + b_1), \qquad \hat y = W_2 h + b_2.$$
      The hidden layer $h$ is a set of learned features, and the output layer is a linear model on those features. In code you process a whole **batch** at once, so every tensor gains a leading batch dimension.
  - kind: example
    md: |
      $x = (1, 2)$, $W_1 = \begin{pmatrix}1 & 0\\ -1 & 1\end{pmatrix}$, $b_1 = (0, -2)$, ReLU, $W_2 = (2, 3)$, $b_2 = 1$.

      1. $W_1x + b_1 = (1, 1) + (0, -2) = (1, -1)$.
      2. ReLU gives $h = (1, 0)$.
      3. $\hat y = 2\cdot1 + 3\cdot0 + 1 = 3$.
  - kind: check
    exercise: mlp-check-forward
  - kind: math
    md: |
      PyTorch convention: `nn.Linear(d_in, d_out)` stores $W \in \mathbb R^{d_\text{out}\times d_\text{in}}$ and computes $XW^\top + b$ for $X \in \mathbb{R}^{B\times d_\text{in}}$, giving shape $B\times d_\text{out}$.

      Parameters per layer: $d_\text{in}\cdot d_\text{out} + d_\text{out}$.
  - kind: worked
    md: |
      `Linear(784, 256) → ReLU → Linear(256, 10)` on a batch of 64:

      | tensor | shape |
      |---|---|
      | input | (64, 784) |
      | after layer 1 | (64, 256) |
      | output logits | (64, 10) |

      Parameters: $784\cdot256 + 256 = 200{,}960$, plus $256\cdot10 + 10 = 2{,}570$, for a total of $203{,}530$.
  - kind: summary
    md: |
      - Linear, then activation, repeated, with a linear output layer.
      - Each layer has $d_\text{in}d_\text{out} + d_\text{out}$ parameters.
      - Track the batch dimension in every shape.
