    worked: |
      This example shows a forward pass through the house network for a new house, $x = (3, 4)$.

      Network: $W_1 = \begin{pmatrix}1 & 0\\ -1 & 1\end{pmatrix}$, $b_1 = (0, -2)$, ReLU, $W_2 = (2, 3)$, $b_2 = 1$.

      1. **Layer 1 scores:** $W_1 x = (1 \cdot 3 + 0 \cdot 4,\ -1 \cdot 3 + 1 \cdot 4) = (3, 1)$. Add $b_1$: $(3, -1)$.
      2. **Activation:** ReLU gives $h = (3, 0)$.
      3. **Output:** $\hat y = 2 \cdot 3 + 3 \cdot 0 + 1 = 7$.

      Without ReLU, step 3 would use $(3, -1)$ and give $2 \cdot 3 + 3 \cdot (-1) + 1 = 4$. The activation changed the answer.
