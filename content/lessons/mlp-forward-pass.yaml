summary: |
  - A layer is several neurons reading the same inputs: $h=\phi(Wx+b)$, with one row of $W$ and one bias per neuron.
  - A forward pass runs the layers in order, each layer's output feeding the next, until the output layer gives the prediction $\hat y$.
  - In a batch each example is a row: a layer turns $B\times d_\text{in}$ into $B\times d_\text{out}$, and its $d_\text{out}\cdot d_\text{in}+d_\text{out}$ parameters don't depend on $B$.

  **Next:** Computational graphs break this forward pass into small steps, the starting point for working out how each weight affects the loss.
