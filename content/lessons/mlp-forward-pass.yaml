  - id: mlp-two-layers
    title: "Run the layers in order"
    tldr: |
      - One layer's outputs become the next layer's inputs.
      - The values between the input and prediction are called hidden values.
      - Running the layers in order, with their activations, gives the prediction.
    explain: |
      ### The outputs become the next inputs

      Our first layer produces two numbers, but we want one prediction. We can feed those numbers into one more neuron. It uses weights $(3,2)$ and bias $1$. We leave its score unchanged so it can predict a price without being squeezed into a fixed range, as we will discuss below.

      Read the picture from top to bottom. The first layer turns $(2,1)$ into $(2,0)$ after ReLU. The output neuron reads those new values and produces $7$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" aria-label="Input (2,1) passes through layer 1 and ReLU to hidden values (2,0). Layer 2 uses weights (3,2) and bias 1 with no activation, giving prediction 7.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
      <rect x="20" y="20" width="180" height="60" rx="6" stroke="#d4d4d4" fill="#171717" fill-opacity="0"/>
      <rect x="20" y="120" width="180" height="60" rx="6" stroke="#d4d4d4" fill="#171717" fill-opacity="0"/>
      <rect x="20" y="220" width="180" height="60" rx="6" stroke="#10b981" fill="#171717" fill-opacity="0"/>
      <text x="110" y="56" text-anchor="middle">input (2,1)</text>
      <text x="110" y="156" text-anchor="middle">hidden (2,0)</text>
      <text x="110" y="256" text-anchor="middle" fill="#10b981">prediction 7</text>
      <text x="220" y="96">layer 1</text><text x="220" y="118">then ReLU</text>
      <text x="220" y="196">layer 2</text><text x="220" y="218">no activation</text>
      <path d="M110 80 V120 M110 180 V220" stroke="#737373"/><path d="M106 112 L110 120 L114 112 M106 212 L110 220 L114 212" stroke="#737373" fill="#171717" fill-opacity="0"/>
      </g>
      </svg>
      ```

      A **multilayer perceptron (MLP)** is a network of layers where each neuron reads every output of the preceding layer. A **hidden layer** sits between the input and the output. Its outputs, the **hidden values**, are computed inside the network rather than supplied as data or returned as the prediction.

      A **forward pass** runs these layers in order. We write $\hat y$ for the prediction and $h$ for the hidden values. Subscripts identify the layer that owns each weight matrix and bias.

      $$h=\phi(W_1x+b_1)$$

      $$\hat y=W_2h+b_2.$$

      The output layer has one neuron, so $W_2$ has one row.

      You might wonder whether we could merge the two weighted sums into one. Without ReLU, we can. Substituting the first layer scores into the output gives one weighted sum of the original inputs.

      $$
      \begin{aligned}
      3(x_1+x_2-1)+2(-x_1+x_2)+1&=3x_1+3x_2-3-2x_1+2x_2+1 &&\text{expand both brackets}\\
      &=x_1+5x_2-2 &&\text{collect matching terms}
      \end{aligned}
      $$

      At $(2,1)$, this gives $5$. But ReLU changes the hidden scores $(2,-1)$ into $(2,0)$, giving $7$. Be careful not to merge the layers and skip the activation. As we just saw, removing ReLU changes the prediction.

      ### Choosing the output range

      Suppose we use this network to predict a house price in thousands of pounds from two measurements. Its answer must be a number like $250$, so we leave the output score unchanged. Sigmoid would squeeze every prediction between $0$ and $1$ and could never directly give that price. The hidden ReLU activations still replace negative scores with zero before the output neuron combines them.
    worked: |
      Let's finish the prediction for $x=(2,1)$, starting from the first layer output $h=(2,0)$ we just computed.

      1. **Set up the output neuron.** It needs one weight for each hidden value and one bias.
         $$W_2=\begin{pmatrix}3&2\end{pmatrix},\qquad b_2=1$$

      2. **Combine the hidden values.** The output neuron treats them as its inputs.
         $$W_2h=3\cdot2+2\cdot0=6$$

      3. **Add the output bias.** There is no output activation here, so this score is the prediction.
         $$\hat y=6+1=7$$

      Keeping the same network but changing its input gives these cases:

      | Input $x$ | Hidden $h$ | Prediction $\hat y$ |
      | --- | --- | --- |
      | $(1,0)$ | $(0,0)$ | $1$ |
      | $(0,1)$ | $(0,1)$ | $3$ |
      | $(1,2)$ | $(2,1)$ | $9$ |

      Even when both hidden values are zero, the output bias still contributes. Each row is a separate forward pass using the same weights and biases.
