    worked: |
      This example shows three neurons reading one house's two measurements. The house is 100 m² and 2 km from the station, so $x = (1, 2)$.

      $$W = \begin{pmatrix}2 & 1\\ 0 & -1\\ 1 & 1\end{pmatrix}, \quad b = (-1, 1, -4), \quad x = (1, 2)$$

      1. **Neuron 1:** Its row gives $2 \cdot 1 + 1 \cdot 2 = 4$. Adding its bias of $-1$ gives a score of $3$.
      2. **Neuron 2:** Its row gives $0 \cdot 1 + (-1) \cdot 2 = -2$. Adding its bias of $1$ gives a score of $-1$.
      3. **Neuron 3:** Its row gives $1 \cdot 1 + 1 \cdot 2 = 3$. Adding its bias of $-4$ gives a score of $-1$.
      4. **Activation:** ReLU changes the scores $(3, -1, -1)$ into hidden values $h = (3, 0, 0)$.

      The matrix has three rows because there are three neurons. Each row has two columns because each neuron reads the house's two measurements.
