      - mlpp-robot-layer
  - id: mlp-two-layers
    title: The forward pass runs the layers in order
    explain: |
      **The question.** A layer turns the inputs into a few new numbers, but you want one prediction. How do you get from the inputs to that prediction?

      **Picture it.** Add a second layer after the first. The first layer, from the last part, turns $x=(2,1)$ into $h=(2,0)$. These are **hidden values**: the network computes them on the way, and they are neither inputs nor the final answer. The second layer is a single output neuron (green) with weights $3$ and $2$ and bias $1$. It reads the hidden values and gives the prediction $7$. Values flow from left to right.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" aria-label="A forward pass from left to right: inputs 2 and 1 go through layer 1 and ReLU to hidden values 2 and 0, then the output neuron with weights 3 and 2 and bias 1 gives the prediction 7.">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="60" y="50" fill="#737373" font-size="14" text-anchor="middle">input x</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="290" y="50" fill="#737373" font-size="14" text-anchor="middle">hidden values h</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="520" y="50" fill="#737373" font-size="14" text-anchor="middle">output ŷ</text>
          <path d="M86.0 110.0 L264.0 110.0" stroke="#3b82f6" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="226" y="100" fill="#3b82f6" font-size="15" text-anchor="middle" font-weight="600">1</text>
          <path d="M82.6 227.2 L267.4 122.8" stroke="#3b82f6" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="228" y="142" fill="#3b82f6" font-size="15" text-anchor="middle" font-weight="600">1</text>
          <path d="M82.6 122.8 L267.4 227.2" stroke="#f59e0b" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="226" y="214" fill="#f59e0b" font-size="15" text-anchor="middle" font-weight="600">−1</text>
          <path d="M86.0 240.0 L264.0 240.0" stroke="#f59e0b" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="226" y="262" fill="#f59e0b" font-size="15" text-anchor="middle" font-weight="600">1</text>
          <path d="M315.0 117.1 L495.0 167.9" stroke="#10b981" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="416" y="134" fill="#10b981" font-size="15" text-anchor="middle" font-weight="600">3</text>
          <path d="M315.0 232.9 L495.0 182.1" stroke="#10b981" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="416" y="230" fill="#10b981" font-size="15" text-anchor="middle" font-weight="600">2</text>
          <circle cx="60" cy="110" r="26" fill="#ffffff" stroke="#171717" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="60" y="116" fill="#171717" font-size="17" text-anchor="middle" font-weight="600">2</text>
          <circle cx="60" cy="240" r="26" fill="#ffffff" stroke="#171717" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="60" y="246" fill="#171717" font-size="17" text-anchor="middle" font-weight="600">1</text>
          <circle cx="290" cy="110" r="26" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="290" y="116" fill="#171717" font-size="17" text-anchor="middle" font-weight="600">2</text>
          <circle cx="290" cy="240" r="26" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="290" y="246" fill="#171717" font-size="17" text-anchor="middle" font-weight="600">0</text>
          <circle cx="520" cy="175" r="26" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="520" y="181" fill="#171717" font-size="17" text-anchor="middle" font-weight="600">7</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="290" y="156" fill="#3b82f6" font-size="14" text-anchor="middle">bias −1</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="290" y="286" fill="#f59e0b" font-size="14" text-anchor="middle">bias 0</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="520" y="221" fill="#10b981" font-size="14" text-anchor="middle">bias 1</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="175" y="300" fill="#737373" font-size="14" text-anchor="middle">layer 1, then ReLU</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="405" y="300" fill="#737373" font-size="14" text-anchor="middle">layer 2 (output)</text>
        </g>
      </svg>
      ```

      **The idea.** Each layer's output becomes the next layer's input. A **multilayer perceptron (MLP)** is a chain of layers like this; the layers between the input and the output are **hidden layers**. Its **forward pass** is the calculation from input to prediction, one layer at a time, in order. For two layers, with $\hat y$ the prediction and subscripts 1 and 2 saying which layer a weight matrix or bias belongs to:

      $$h=\phi(W_1x+b_1)$$

      $$\hat y=W_2h+b_2$$

      The output layer here is the exception: it has no activation, so nothing limits the prediction's range. Sigmoid, for example, would keep it between $0$ and $1$, which can't express a price of $250$ thousand pounds.

      **Common confusion.** “I could multiply $W_2$ by $W_1$ first and skip a step.” No: the activation sits between the two layers and changes the numbers. Without ReLU, the hidden values would be the raw scores $(2,-1)$ and the output would be $5$, not $7$. As the activation-functions lesson showed, two layers with nothing in between multiply out into one weighted sum; the activation is what prevents that.
    worked: |
      Compute the prediction $\hat y$ for $x=(2,1)$. Layer 1 is the one from the last part, followed by ReLU. Layer 2 has one neuron, so $W_2$ is a single row:

      $$W_1=\begin{pmatrix}1&1\\-1&1\end{pmatrix},\quad b_1=(-1,0),\quad W_2=\begin{pmatrix}3&2\end{pmatrix},\quad b_2=1.$$

      1. **Compute layer 1's scores.**
         $$W_1x+b_1=\begin{pmatrix}3\\-1\end{pmatrix}+\begin{pmatrix}-1\\0\end{pmatrix}=\begin{pmatrix}2\\-1\end{pmatrix}$$

      2. **Apply the activation to get the hidden values.**
         $$h=\operatorname{ReLU}\begin{pmatrix}2\\-1\end{pmatrix}=\begin{pmatrix}2\\0\end{pmatrix}$$

      3. **Take the output neuron's weighted sum.**
         $$W_2h=3\cdot2+2\cdot0=6$$

      4. **Add the output bias.**
         $$\hat y=6+1=7$$

      **Compare cases.** The whole network, given different inputs:

      | Input $x$ | Hidden $h$ | Prediction $\hat y$ |
      | --- | --- | --- |
      | $(1,0)$ | $(0,0)$ | $1$ |
      | $(0,1)$ | $(0,1)$ | $3$ |
      | $(2,1)$ | $(2,0)$ | $7$ |
      | $(1,2)$ | $(2,1)$ | $9$ |
      | $(3,1)$ | $(3,0)$ | $10$ |

      **Where it shows up.** For a house, the inputs are its measurements, the hidden values are the first layer's combinations of them, and $\hat y$ is the predicted price. Every prediction a trained network makes is one forward pass.
