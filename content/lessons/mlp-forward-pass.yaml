  - id: mlp-shapes
    title: Shapes for a batch of examples
    explain: |
      **The question.** Networks usually handle many examples at once, called a **batch**. How do you lay them out so that one matrix product handles every example, and what size is each array?

      **Picture it.** Stack three inputs, $(2,1)$, $(1,2)$ and $(0,1)$, as the rows of a matrix $X$, and pass it through the same two layers. Each row stays one example the whole way: the first layer turns each row of 2 inputs into a row of 2 hidden values (blue for neuron 1, amber for neuron 2), and the output layer turns each of those rows into 1 prediction (green).

