concept: mlp-forward-pass
version: 5
objective: |
  **Goal:** compute a small neural network prediction layer by layer, track each array shape for a batch, and count the weights and biases.
recap:
  - concept: activation-functions
    text: "An activation transforms a weighted score. ReLU keeps positive scores and turns negative ones into zero. A nonlinear activation between weighted sums prevents them from collapsing into one weighted sum."
  - concept: matrices
    text: "A matrix product pairs rows of the left matrix with columns of the right. The inner sizes must match. Transposing a matrix swaps its rows and columns."
where_this_fits: |
  ### What is a forward pass?

  A **forward pass** is the calculation that turns a neural network input into a prediction, by running its layers in order. Each layer combines the numbers it receives and passes its outputs to the next layer.

  With one weighted sum, the prediction changes at a fixed rate as an input grows. ReLU between layers lets that rate change for different inputs. We will calculate a prediction, first for one example and then for a batch, using matrix products and activations. We will also count the weights and biases, which are the numbers training must learn. Adding examples does not add more of them.
knowledge_points:
  - id: mlp-layer-of-neurons
    title: "Compute several neurons together"
    tldr: |
      - Several neurons can read the same inputs with different weights and biases.
      - Each neuron computes its own score and applies an activation.
      - A matrix stores one neuron's weights per row so we can compute the whole layer together.
    explain: |
      ### Two neurons read the same inputs

      In the activation-functions lesson, a neuron turned a weighted score into an output. Now we want several neurons to read the same measurements, so each can build a different combination of them.

      Let's use two measured numbers, $x=(2,1)$. The blue neuron uses weights $(1,1)$ and bias $-1$. The orange neuron uses weights $(-1,1)$ and bias $0$. Each box shows its score before ReLU and its output after ReLU. Blue keeps its positive score, while orange turns its negative score into zero.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" aria-label="Input (2,1) feeds two neurons. Blue uses weights (1,1), bias minus 1, score 2 and ReLU output 2. Orange uses weights (minus 1,1), bias 0, score minus 1 and ReLU output 0.">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">
      <text x="180" y="28" text-anchor="middle">input x = (2,1)</text>
      <path d="M180 40 V55 H20 V205 H40 M20 105 H40" stroke="#737373" fill="#171717" fill-opacity="0"/>
      <rect x="40" y="70" width="300" height="70" rx="6" stroke="#3b82f6" fill="#171717" fill-opacity="0"/>
      <rect x="40" y="170" width="300" height="70" rx="6" stroke="#f59e0b" fill="#171717" fill-opacity="0"/>
      <text x="55" y="98" fill="#3b82f6">neuron 1: (1,1), bias −1</text>
      <text x="55" y="124">score 2 → ReLU → output 2</text>
      <text x="55" y="198" fill="#f59e0b">neuron 2: (−1,1), bias 0</text>
      <text x="55" y="224">score −1 → ReLU → output 0</text>
      </g>
      </svg>
      ```

      ### One row of weights per neuron

      A **layer** is a group of neurons that read the same inputs, each with its own weights and bias. We store one neuron's weights per row of a matrix $W$. For $n$ inputs and $m$ neurons, $W$ has shape $m\times n$, and the bias vector $b$ has $m$ entries.

      Multiplying $W$ by the input vector $x$ takes one dot product per neuron. Adding $b$ gives the score vector $z$. The activation $\phi$ ("phi") then acts on each score separately to give the output vector $h$.

      $$z=Wx+b$$

      $$h=\phi(z).$$

      Here ReLU gives $(2,0)$, in neuron order. These are new numbers computed from the inputs, ready for another layer to use.

    worked: |
      Let's compute both outputs for $x=(2,1)$ using the two neurons in the picture.

      1. **Collect the weights and biases.** Keep the blue neuron (neuron 1) from the picture first in both arrays so each bias matches its row.
         $$W=\begin{pmatrix}1&1\\-1&1\end{pmatrix},\qquad b=\begin{pmatrix}-1\\0\end{pmatrix}$$

      2. **Take one dot product per row.** Each neuron reads both input numbers.
         $$Wx=\begin{pmatrix}1\cdot2+1\cdot1\\-1\cdot2+1\cdot1\end{pmatrix}=\begin{pmatrix}3\\-1\end{pmatrix}$$

      3. **Add the biases.** Each score gets its own neuron's bias.
         $$z=\begin{pmatrix}3-1\\-1+0\end{pmatrix}=\begin{pmatrix}2\\-1\end{pmatrix}$$

      4. **Apply ReLU.** Keep the positive score and replace the negative one with zero.
         $$h=\begin{pmatrix}\max(0,2)\\\max(0,-1)\end{pmatrix}=\begin{pmatrix}2\\0\end{pmatrix}$$

      The layer gives two outputs from the same inputs. With the same weights and biases, changing the input changes which scores survive ReLU:

      | Input $x$ | Scores $z$ | Outputs $h$ |
      | --- | --- | --- |
      | $(1,0)$ | $(0,-1)$ | $(0,0)$ |
      | $(0,1)$ | $(0,1)$ | $(0,1)$ |
      | $(1,2)$ | $(2,1)$ | $(2,1)$ |
