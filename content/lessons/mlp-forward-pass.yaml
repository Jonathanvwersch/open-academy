  - id: mlp-shapes
    title: Shapes and parameter counts
    explain: |
      **How do you rate 3 houses at once?** A loop handles them separately. A **batch** groups them in a matrix, letting the computer process them together. This works because every row uses the same weights without mixing houses.

      A matrix's **shape** is its number of rows and columns. Let $B$ count houses, $d_\text{in}$ count inputs per house and $d_\text{out}$ count neurons.

      - $W$ has one row per neuron and one column per input, giving shape $d_\text{out} \times d_\text{in}$.
      - $X$ stores one house per row, giving shape $B \times d_\text{in}$.
      - Transposing $W$ gives $W^\top$ shape $d_\text{in} \times d_\text{out}$. Thus $XW^\top + b$ gives shape $B \times d_\text{out}$, with biases added to every house's scores.

      Some libraries store $W$ transposed and write `X @ W + b` instead.

      Why share weights? Every house needs the same rating rule. The adjustable numbers, called **parameters**, are each neuron's $d_\text{in}$ weights and one bias:

      $$\text{parameters} = d_\text{in} \cdot d_\text{out} + d_\text{out}$$
    worked: |
      This example shows how to check the numbers of rows, columns and parameters when rating a batch of $B = 3$ houses.

      The network takes 2 inputs, has 2 hidden neurons, and returns 1 output.

      | array | shape | why |
      |---|---|---|
      | input $X$ | $3 \times 2$ | 3 houses, 2 inputs each |
      | $W_1$ | $2 \times 2$ | 2 neurons, 2 inputs |
      | hidden $H$ | $3 \times 2$ | $(3 \times 2)(2 \times 2)$ |
      | $W_2$ | $1 \times 2$ | 1 neuron, 2 inputs |
      | output $\hat Y$ | $3 \times 1$ | $(3 \times 2)(2 \times 1)$ |

      Layer 1 has $2 \cdot 2 + 2 = 6$ parameters. Layer 2 has $2 \cdot 1 + 1 = 3$, so the network has $9$ in total. The batch size never appears in this count because every house uses the same 9 weights and biases.
    problems:
      - mlpp-batch-shape
      - mlpp-params-template
      - mlpp-why-shared-weights
      - mlpp-hidden-array-size
      - mlpp-why-transpose
      - mlpp-robot-shapes
final: mlp-explain
summary: |
  - A layer computes $\phi(Wx + b)$: each row of $W$ is one neuron's weights, and the activation is applied to every score.
  - The forward pass runs the layers in order: $h = \phi(W_1 x + b_1)$, then $\hat y = W_2 h + b_2$. Here the final numerical rating has no output activation.
  - For a batch $X$ of shape $B \times d_\text{in}$, a layer outputs $B \times d_\text{out}$ and has $d_\text{in} \cdot d_\text{out} + d_\text{out}$ parameters.

  **Where you'll use this:** Backpropagation reuses the values calculated in the forward pass. In PyTorch fundamentals you will implement layers, and in Stochastic and minibatch gradient descent you will train them on batches.
