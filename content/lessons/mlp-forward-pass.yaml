concept: mlp-forward-pass
version: 4
objective: |
  **Goal:** compute a small neural network's prediction by hand, layer by layer, and track the shape of every array when a batch of examples goes through it.
where_this_fits: |
  One weighted sum, as in linear regression, can only give a straight-line rule, but real patterns, such as how a house's price depends on its measurements, bend. A network gets bends by computing many weighted scores, putting each through an activation such as ReLU, and combining the results. You already know each piece: matrix products and activations. This lesson puts those pieces together into a **multilayer perceptron**, the basic neural network, in three steps:

  1. Compute a whole layer of neurons at once.
  2. Run the layers in order to turn an input into a prediction: the forward pass.
  3. Track the array shapes when a batch of examples goes through, and count the parameters.

  Every prediction a network makes is this calculation.
knowledge_points:
  - id: mlp-layer-of-neurons
    title: A layer is several neurons side by side
    explain: |
      **The question.** A perceptron computes one weighted score from its inputs. If you want several different scores from the same inputs, each combining them in its own way, how do you compute them all together?

      **Picture it.** Take two inputs, $x_1=2$ and $x_2=1$: any two measured numbers. Two neurons both read them. Neuron 1 (blue) has weights $1$ and $1$ and bias $-1$. Neuron 2 (amber) has weights $-1$ and $1$ and bias $0$. Each neuron forms its own score and then applies ReLU, which keeps a positive score and turns a negative one into $0$. Neuron 1 scores $2$ and outputs $2$; neuron 2 scores $-1$ and outputs $0$. Each circle shows that neuron's output.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" aria-label="Two inputs, 2 and 1, feed two neurons, each circle showing its output. Neuron 1 has weights 1 and 1 and bias minus 1, scores 2 and outputs 2 after ReLU. Neuron 2 has weights minus 1 and 1 and bias 0, scores minus 1 and outputs 0 after ReLU.">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="80" y="50" fill="#737373" font-size="14" text-anchor="middle">inputs</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="50" fill="#737373" font-size="14" text-anchor="middle">layer of 2 neurons</text>
          <path d="M106.0 110.0 L294.0 110.0" stroke="#3b82f6" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="253" y="100" fill="#3b82f6" font-size="15" text-anchor="middle" font-weight="600">1</text>
          <path d="M102.9 227.6 L297.1 122.4" stroke="#3b82f6" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="256" y="142" fill="#3b82f6" font-size="15" text-anchor="middle" font-weight="600">1</text>
          <path d="M102.9 122.4 L297.1 227.6" stroke="#f59e0b" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="254" y="214" fill="#f59e0b" font-size="15" text-anchor="middle" font-weight="600">−1</text>
          <path d="M106.0 240.0 L294.0 240.0" stroke="#f59e0b" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="253" y="262" fill="#f59e0b" font-size="15" text-anchor="middle" font-weight="600">1</text>
          <circle cx="80" cy="110" r="26" fill="#ffffff" stroke="#171717" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="80" y="116" fill="#171717" font-size="17" text-anchor="middle" font-weight="600">2</text>
          <circle cx="80" cy="240" r="26" fill="#ffffff" stroke="#171717" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="80" y="246" fill="#171717" font-size="17" text-anchor="middle" font-weight="600">1</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="80" y="156" fill="#737373" font-size="14" text-anchor="middle">x₁</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="80" y="286" fill="#737373" font-size="14" text-anchor="middle">x₂</text>
          <circle cx="320" cy="110" r="26" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="116" fill="#171717" font-size="17" text-anchor="middle" font-weight="600">2</text>
          <circle cx="320" cy="240" r="26" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/><text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="246" fill="#171717" font-size="17" text-anchor="middle" font-weight="600">0</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="362" y="150" fill="#3b82f6" font-size="14" text-anchor="start">neuron 1, bias −1</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="362" y="280" fill="#f59e0b" font-size="14" text-anchor="start">neuron 2, bias 0</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="362" y="104" fill="#3b82f6" font-size="14" text-anchor="start">score 1·2 + 1·1 − 1 = 2</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="362" y="126" fill="#3b82f6" font-size="14" text-anchor="start" font-weight="600">ReLU(2) = 2</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="362" y="234" fill="#f59e0b" font-size="14" text-anchor="start">score −1·2 + 1·1 + 0 = −1</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="362" y="256" fill="#f59e0b" font-size="14" text-anchor="start" font-weight="600">ReLU(−1) = 0</text>
        </g>
      </svg>
      ```

      **The idea.** A layer is a group of neurons that all read the same inputs, each with its own weights and bias. In general, a **layer** of $m$ neurons reading $n$ inputs stores its weights in an $m\times n$ matrix $W$, one row per neuron, and its biases in a vector $b$ with $m$ entries. Row $i$ of $W$ dotted with the input $x$, plus the bias $b_i$, is neuron $i$'s score, so all the scores together are $Wx+b$. The activation $\phi$, such as ReLU, is then applied to each score separately, giving the layer's output:

      $$h=\phi(Wx+b)$$

      **Common confusion.** “The neurons all read the same inputs, so they all give the same answer.” No: each neuron has its own row of weights and its own bias, so each combines the inputs differently. Here the same input $(2,1)$ gives $2$ from neuron 1 and $0$ from neuron 2.
    worked: |
      Compute the layer's output for $x=(2,1)$, with

      $$W=\begin{pmatrix}1&1\\-1&1\end{pmatrix},\qquad b=(-1,0).$$

      1. **Dot each row with the input.**
         $$Wx=\begin{pmatrix}1\cdot2+1\cdot1\\-1\cdot2+1\cdot1\end{pmatrix}=\begin{pmatrix}3\\-1\end{pmatrix}$$

      2. **Add each neuron's bias.**
         $$z=Wx+b=\begin{pmatrix}3-1\\-1+0\end{pmatrix}=\begin{pmatrix}2\\-1\end{pmatrix}$$

      3. **Apply ReLU to each score.**
         $$h=\operatorname{ReLU}(z)=\begin{pmatrix}\max(0,2)\\\max(0,-1)\end{pmatrix}=\begin{pmatrix}2\\0\end{pmatrix}$$

      **Compare cases.** The same layer, given different inputs:

      | Input $x$ | Scores $z=Wx+b$ | Output $h$ |
      | --- | --- | --- |
      | $(1,0)$ | $(0,-1)$ | $(0,0)$ |
      | $(0,1)$ | $(0,1)$ | $(0,1)$ |
      | $(2,1)$ | $(2,-1)$ | $(2,0)$ |
      | $(1,2)$ | $(2,1)$ | $(2,1)$ |
      | $(3,1)$ | $(3,-2)$ | $(3,0)$ |

      **Where it shows up.** In a house-price model the inputs are measurements such as area and bedrooms, and each neuron in the first layer builds its own combination of them, for example one that grows with area.
