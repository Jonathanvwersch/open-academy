concept: mlp-forward-pass
version: 2
objective: |
  **Goal:** compute a two-layer forward pass by hand, count a layer's weights and biases, and track the shape of every array as a batch of examples moves through a multilayer perceptron.
where_this_fits: |
  A model uses a house's size, say 100 m², and its distance from the station, say 2 km, to produce a rating. Several neurons can calculate different scores from those measurements. You could write each calculation separately, but repeating that code for hundreds of neurons makes mistakes hard to find. Instead, arrange neurons in groups called layers. Matrix multiplication calculates a group's scores together, activations change those scores, and the next group combines the results. This ordered calculation is the forward pass. Counting rows and columns helps you check that the right numbers reach each neuron. You will build on this in Backpropagation, PyTorch fundamentals, and Stochastic and minibatch gradient descent.
knowledge_points:
  - id: mlp-layer-of-neurons
    title: A layer is many neurons at once
    explain: |
      A model rates a 100 m² house that is 2 km from the station. Its inputs are $x = (1, 2)$, measuring size in hundreds of m² and distance in km. **How can several neurons use these measurements?** Calculate their scores:

      - Neuron 1 has weights $(1, 0)$ and bias $0$, so its score is $1 \cdot 1 + 0 \cdot 2 + 0 = 1$.
      - Neuron 2 has weights $(-1, 1)$ and bias $-2$, so its score is $-1 \cdot 1 + 1 \cdot 2 - 2 = -1$.

      Repeating this code for hundreds of neurons becomes hard to manage. Instead put each neuron's weights in one row of matrix $W_1$ and its bias in vector $b_1$. This works because each row's dot product with $x$ calculates one neuron's score:

      $$W_1 = \begin{pmatrix}1 & 0\\ -1 & 1\end{pmatrix}, \quad b_1 = (0, -2), \quad W_1 x + b_1 = (1, -1)$$

      Row $i$, column $j$ holds neuron $i$'s weight on input $j$. Why a matrix rather than a **loop**, code that repeats a calculation? Both give the same scores, but computers can handle matrix calculations together efficiently.

      Apply activation $\phi$ to each score. ReLU gives $h = \phi(W_1 x + b_1) = (1, 0)$. This group of neurons is a **layer**. Its outputs $h$ are **hidden values**, calculated inside the network rather than supplied in the data. This makes it a **hidden layer**.

