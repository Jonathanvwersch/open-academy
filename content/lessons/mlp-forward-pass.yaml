concept: mlp-forward-pass
version: 3
objective: |
  **Goal:** compute a neural network's forward pass and track parameter and activation shapes.
where_this_fits: |
  Activation functions showed how nonlinear operations let a network represent more than one straight rule. A multilayer perceptron (MLP) stacks neuron layers; each hidden unit transforms the same house measurements, and a final linear output predicts the sale price. We now calculate that prediction from input to output.
knowledge_points:
  - id: mlp-layer-of-neurons
    title: A layer computes several neurons together
    explain: |
      **What a layer is.** A neural-network layer applies one weighted sum per neuron, then applies an activation to each score.

      **How it works.** For house input:

      $$x=(12,3,20).$$

      Take:

      $$
      \begin{aligned}
      W_1 &= \begin{pmatrix}0.1&0&0\\0&0.1&0.05\end{pmatrix},\\
      b_1 &= (0,0).
      \end{aligned}
      $$

      Then:

      $$z_1=W_1x+b_1=(1.2,1.3).$$

      ReLU gives hidden values:

      $$h=(1.2,1.3).$$

      Each row is one unit's weights.

      Matrix multiplication applies the same layer rule to every neuron without changing the input order, so computing the rows together keeps the layer consistent.

      **Why this is useful.** The hidden layer gives the house-price model several learned intermediate features instead of one direct weighted sum.
    worked: |
      This example shows the calculation.
      $$W_1x=\begin{pmatrix}0.1&0&0\\0&0.1&0.05\end{pmatrix}\begin{pmatrix}12\\3\\20\end{pmatrix}=\begin{pmatrix}1.2\\1.3\end{pmatrix},\quad h=\operatorname{ReLU}(W_1x)=(1.2,1.3).$$
    problems:
      [
        mlp-layer-of-neurons-basics,
        mlpp-layer-values,
        mlpp-unit-score-template,
        mlpp-why-matrix,
        mlpp-weight-entry,
        mlpp-why-activation,
        mlpp-robot-layer,
      ]
  - id: mlp-two-layers
    title: The forward pass predicts a price
    explain: |
      **What a forward pass is.** It is the ordered computation from input features through every layer to the model's output.

      **How it works.** Continue with hidden values $h=(1.2,1.3)$. Let output weights be $(15,5)$ and output bias 300, all in units that make the result thousands of pounds. Then $\hat y=15(1.2)+5(1.3)+300=324.5$. The final layer is linear because a house price is not restricted to a fixed interval.

      The output layer needs the hidden values produced by the previous layer, so the layers must run in order.

      **Why this is useful.** A forward pass combines the house's area, bedrooms and age into one price prediction that can be compared with its sale.
    worked: |
      This example shows the calculation.
      With $h=(1.2,1.3)$, $W_2=(15,5)$ and $b_2=300$:

      1. $W_2h=15(1.2)+5(1.3)=24.5$.
      2. Add the output bias: $\hat y=24.5+300=324.5$ thousand pounds.
    problems:
      [
        mlp-two-layers-basics,
        mlpp-forward-order,
        mlpp-forward-template,
        mlpp-forward-fixed,
        mlpp-why-no-sigmoid-output,
        mlpp-hidden-meaning,
        mlpp-robot-forward,
      ]
  - id: mlp-shapes
    title: Shapes show which layer operations fit
    explain: |
      **What a shape is.** A shape records the number of rows and columns in a matrix or vector.

      **How it works.** For $B$ houses with three input features, $X$ has shape $B\times3$. The first layer uses a $3\times2$ weight matrix and produces $B\times2$ hidden values. The output weights have shape $2\times1$, producing $B\times1$ prices. This multiplication works because each inner dimension matches.

      Every row is a different house evaluated by the same model, so the same weights are applied to each row.

      **Why this is useful.** Shape checks prevent errors when applying the house-price network to many sales at once.
    worked: |
      This example shows the calculation.
      The first layer has $3\cdot2+2=8$ parameters including its bias. The output layer has $2\cdot1+1=3$, for 11 total trainable parameters.
    problems:
      [
        mlp-shapes-basics,
        mlpp-batch-shape,
        mlpp-params-template,
        mlpp-why-shared-weights,
        mlpp-hidden-array-size,
        mlpp-why-transpose,
        mlpp-robot-shapes,
      ]
final: mlp-explain
summary: |
  - A layer computes weighted sums and applies an activation to each neuron.
  - A forward pass computes hidden values, then a final price prediction.
  - Matrix shapes track how each layer maps a batch of houses to the next representation.

  **Next:** The chain rule calculates how a change in any network weight affects its final loss.
