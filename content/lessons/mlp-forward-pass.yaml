    worked: |
      This example shows a layer of three neurons for one input.

      $$W = \begin{pmatrix}2 & 1\\ 0 & -1\\ 1 & 1\end{pmatrix}, \quad b = (-1, 1, -4), \quad x = (1, 2)$$

      1. **Row 1:** $2 \cdot 1 + 1 \cdot 2 = 4$, plus $-1$ gives $3$.
      2. **Row 2:** $0 \cdot 1 + (-1) \cdot 2 = -2$, plus $1$ gives $-1$.
      3. **Row 3:** $1 \cdot 1 + 1 \cdot 2 = 3$, plus $-4$ gives $-1$.
      4. **ReLU:** $(3, -1, -1)$ becomes $h = (3, 0, 0)$.

      Three rows means three neurons and three hidden values. Two columns means each neuron reads two inputs.
