  - id: mlp-two-layers
    title: The forward pass through two layers
    explain: |
      The hidden values $h$ aren't the answer yet. You still need one number, say a score for how good the house is. So a second layer reads $h$ the same way the first read $x$:

      $$h = \phi(W_1 x + b_1), \qquad \hat y = W_2 h + b_2$$

      Here $W_2$ holds the output neuron's weights, $b_2$ its bias, and $\hat y$ ("y-hat") is the network's prediction. When the output is meant to be any number, like a price or a score, the output layer usually has no activation.

      Running an input through every layer in order is the **forward pass**. A network built this way, layers of neurons with an activation between them, is a **multilayer perceptron** (MLP). The activation between the layers is what stops them collapsing into one weighted sum.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" aria-label="The forward pass as four steps left to right: input x = (1, 2); layer 1 scores W1 x + b1 = (1, minus 1); hidden values after ReLU h = (1, 0); output y-hat = W2 h + b2 = 3.">
        <rect x="10" y="30" width="140" height="70" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
        <text x="80" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">x</text>
        <text x="80" y="84" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717">(1, 2)</text>
