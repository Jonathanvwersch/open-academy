summary: |
  - LoRA freezes a pretrained weight matrix $W$ and trains only a change to it, so a layer computes $h=Wx+\Delta Wx$, which equals $(W+\Delta W)x$.
  - The change is built from two thin matrices, $\Delta W=BA$, with $B$ of shape $d\times r$ and $A$ of shape $r\times k$, so it has rank at most $r$ and can be applied as $B(Ax)$.
  - A rank-$r$ change to a $d\times k$ matrix trains $r(d+k)$ numbers instead of $dk$, which is a big saving only when $r$ is much smaller than $d$ and $k$. It works because the change fine-tuning needs is usually close to low rank.
  - Training starts with $B=0$, so $BA=0$ and the model starts as the pretrained one. Afterwards, $W'=W+BA$ merges the change at no extra cost, or the small adapter is kept separate and swapped per task.

  **Next:** In the reward models lesson, we train a model to score responses, using pairs of responses that a person compared. That score is the first step towards training a model on human preferences.
