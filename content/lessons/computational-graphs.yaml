    worked: |
      **Worked example.** A simple model, a rule for predicting from inputs, predicts $p=w\cdot x$: $w$ is an adjustable multiplier (a weight), and $t$ is the desired output (the target). Its squared error $L=(p-t)^2$ scores the prediction's mistake: squaring makes either sign of error positive and gives larger mistakes more importance. Use $w=2$, $x=3$, $t=5$.

      1. **List the operations.**
         $$p=w\cdot x.$$
         $$e=p-t.$$
         $$L=e^2.$$

      2. **Draw the graph.** The blue labels show the values computed in step 3.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" aria-label="Inputs w, x and t feed multiplication p, subtraction e, and squaring L">
      <defs><marker id="cg5-grey" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="cg5-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker></defs>
      <path d="M74 63.25 L187.3 102.2" stroke="#737373" stroke-width="2" marker-end="url(#cg5-grey)"/>
      <path d="M74 156.75 L187.3 117.8" stroke="#737373" stroke-width="2" marker-end="url(#cg5-grey)"/>
      <path d="M231.19 121.26 L348.81 183.74" stroke="#737373" stroke-width="2" marker-end="url(#cg5-grey)"/>
      <path d="M74 269 L346.72 200.82" stroke="#737373" stroke-width="2" marker-end="url(#cg5-grey)"/>
      <path d="M394 195 L516 195" stroke="#737373" stroke-width="2" marker-end="url(#cg5-grey)"/>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717" text-anchor="middle">
      <rect x="26" y="31" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="60" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">w</text><text x="50" y="101" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2</text>
      <rect x="26" y="141" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="170" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">x</text><text x="50" y="211" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3</text>
      <rect x="26" y="251" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="280" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">t</text><text x="50" y="321" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5</text>
      <circle cx="210" cy="110" r="24" fill="#ffffff" stroke="#171717" stroke-width="2"/><text x="210" y="115" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">×</text><text x="210" y="156" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">p = 6</text>
      <circle cx="370" cy="195" r="24" fill="#ffffff" stroke="#171717" stroke-width="2"/><text x="370" y="200" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">−</text><text x="370" y="241" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">e = 1</text>
      <circle cx="540" cy="195" r="24" fill="#ffffff" stroke="#171717" stroke-width="2"/><text x="540" y="200" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">( )²</text><text x="540" y="241" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">L = 1</text>
      </g>
      </svg>
      ```

      3. **Compute each node.**
         $$p=2\cdot3=6.$$
         $$e=6-5=1.$$
         $$L=1^2=1.$$

      **Compare cases.**

      | Expression | Operation nodes (squaring = one node) | Inputs used more than once |
      | --- | --- | --- |
      | $x+y$ | 1 | None |
      | $(x+y)\cdot z$ | 2 | None |
      | $(x+y)^2$ | 2 | None |
      | $(x+y)\cdot(y+z)$ | 3 | $y$ |

      In $(x+y)^2$, compute $x+y$ once and feed that single value once to the squaring node. Neither $x$ nor $y$ is a reused input: each has only one outgoing arrow.

      **Where it shows up.** A model's prediction and loss form such a graph of multiplication, addition and squaring. Once drawn, its derivatives can be found one node at a time, as the next two points show.
