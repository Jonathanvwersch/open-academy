concept: computational-graphs
version: 7
objective: |
  **Goal:** draw a calculation as a graph of simple operations, find each operation's local derivative, and multiply along paths back from the output to find its derivative with respect to any input.
where_this_fits: |
  Training a model needs the loss's derivative with respect to every weight. The chain rule handles a chain written by hand, but a model's calculation can have many steps, values reused in several places and many inputs. Writing every chain by hand is slow and error-prone. A computational graph lays out the calculation so finding derivatives becomes mechanical:

  1. Draw each simple operation and the values it uses.
  2. Find each operation's local derivatives.
  3. Multiply derivatives along each path and add the path contributions.

  Backpropagation, the next lesson, reuses shared products during one backward sweep to find every weight's derivative.
knowledge_points:
  - id: cg-drawing-graphs
    title: Break a calculation into simple operations
    explain: |
      **The question.** To find a derivative, we'll need each step's effect on the output, but a formula can hide its steps and in-between values. How do you make each step visible?

      **Picture it.** Add two numbers, then multiply their sum by a third: $f=(x+y)\cdot z$, with inputs $x=1$, $y=2$, $z=4$. Rounded squares are inputs; circles are operations. Blue numbers are the values at the input nodes and the values each operation node computes.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" aria-label="Inputs x and y feed addition q; q and z feed multiplication f">
      <defs><marker id="cg1-grey" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="cg1-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker></defs>
      <path d="M74 61.6 L226.86 103.64" stroke="#737373" stroke-width="2" marker-end="url(#cg1-grey)"/>
      <path d="M74 158.4 L226.86 116.36" stroke="#737373" stroke-width="2" marker-end="url(#cg1-grey)"/>
      <path d="M272.89 117.21 L497.11 187.79" stroke="#737373" stroke-width="2" marker-end="url(#cg1-grey)"/>
      <path d="M74 270.91 L496.34 199.03" stroke="#737373" stroke-width="2" marker-end="url(#cg1-grey)"/>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717" text-anchor="middle">
      <rect x="26" y="31" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="60" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">x</text><text x="50" y="101" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1</text>
      <rect x="26" y="141" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="170" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">y</text><text x="50" y="211" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2</text>
      <rect x="26" y="251" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="280" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">z</text><text x="50" y="321" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">4</text>
      <circle cx="250" cy="110" r="24" fill="#ffffff" stroke="#171717" stroke-width="2"/><text x="250" y="115" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">+</text><text x="250" y="156" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">q = 3</text>
      <circle cx="520" cy="195" r="24" fill="#ffffff" stroke="#171717" stroke-width="2"/><text x="520" y="200" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">×</text><text x="520" y="241" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">f = 12</text>
      <text x="250" y="30" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">q = x + y</text>
      <text x="520" y="95" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">f = q · z</text>
      </g>
      </svg>
      ```

      Follow the grey arrows: $x$ and $y$ feed addition, producing $q=3$. That value and $z$ feed multiplication, producing $f=12$. You cannot compute $f$ until you know $q$.

      **The idea.** Make each small operation visible. A **computational graph** is a diagram with one node per input and per simple operation, such as addition, multiplication or squaring. An arrow connects each value to every operation that uses it; arrows point forward, with no loops. Computing each node in arrow order is the **forward pass**; the computed values are called **forward values**. Each operation node stands for both the operation and the value it produces: $q$ is the value of the $+$ node.

      **Common confusion.** “If a value is used twice, I draw it twice.” No: draw one node with two outgoing arrows. For $(x+y)\cdot(y+z)$, one $y$ feeds both additions, as shown below. Later in this lesson you'll add up both ways $y$ affects the output.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" aria-label="One y input feeds two additions a and b, whose outputs feed multiplication g">
      <defs><marker id="cg4-grey" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="cg4-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker></defs>
      <path d="M74 59.8 L226.47 90.29" stroke="#737373" stroke-width="2" marker-end="url(#cg4-grey)"/>
      <path d="M74 156.6 L227.35 102.93" stroke="#737373" stroke-width="2" marker-end="url(#cg4-grey)"/>
      <path d="M74 175.8 L228.11 245.15" stroke="#737373" stroke-width="2" marker-end="url(#cg4-grey)"/>
      <path d="M74 272.6 L226.12 257.39" stroke="#737373" stroke-width="2" marker-end="url(#cg4-grey)"/>
      <path d="M273.01 101.82 L496.99 168.18" stroke="#737373" stroke-width="2" marker-end="url(#cg4-grey)"/>
      <path d="M273.01 248.18 L496.99 181.82" stroke="#737373" stroke-width="2" marker-end="url(#cg4-grey)"/>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717" text-anchor="middle">
      <rect x="26" y="31" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="60" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">x</text><text x="50" y="101" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1</text>
      <rect x="26" y="141" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="170" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">y</text><text x="50" y="211" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2</text>
      <rect x="26" y="251" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="280" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">z</text><text x="50" y="321" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">4</text>
      <circle cx="250" cy="95" r="24" fill="#ffffff" stroke="#171717" stroke-width="2"/><text x="250" y="100" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">+</text><text x="250" y="141" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">a = 3</text>
      <circle cx="250" cy="255" r="24" fill="#ffffff" stroke="#171717" stroke-width="2"/><text x="250" y="260" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">+</text><text x="250" y="301" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">b = 6</text>
      <circle cx="520" cy="175" r="24" fill="#ffffff" stroke="#171717" stroke-width="2"/><text x="520" y="180" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">×</text><text x="520" y="221" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">g = 18</text>
      </g>
      </svg>
