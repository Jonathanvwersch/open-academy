  - id: cg-local-derivatives
    title: "The slope of each small operation"
    explain: |
      **The question.** To see how the output changes with an input, must you differentiate the whole formula at once? Or can you start with one operation at a time?

      **Picture it.** Return to $f=(x+y)\cdot z$ at $x=1$, $y=2$, $z=4$. Hold $z$ fixed: raising $q$ by 1 adds one more $z$ to $q\cdot z$, so $f$ grows by $z=4$. Therefore $\partial f/\partial q=z=4$. Blue labels are forward values; amber labels are local derivatives.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" aria-label="Inputs x and y feed addition q; q and z feed multiplication f">
      <defs><marker id="cg2-grey" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="cg2-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker></defs>
      <path d="M74 61.6 L226.86 103.64" stroke="#737373" stroke-width="2" marker-end="url(#cg2-grey)"/>
      <path d="M74 158.4 L226.86 116.36" stroke="#737373" stroke-width="2" marker-end="url(#cg2-grey)"/>
      <path d="M272.89 117.21 L497.11 187.79" stroke="#737373" stroke-width="2" marker-end="url(#cg2-grey)"/>
      <path d="M74 270.91 L496.34 199.03" stroke="#737373" stroke-width="2" marker-end="url(#cg2-grey)"/>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717" text-anchor="middle">
      <rect x="26" y="31" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="60" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">x</text><text x="50" y="101" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1</text>
      <rect x="26" y="141" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="170" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">y</text><text x="50" y="211" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2</text>
      <rect x="26" y="251" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="280" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">z</text><text x="50" y="321" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">4</text>
      <circle cx="250" cy="110" r="24" fill="#ffffff" stroke="#171717" stroke-width="2"/><text x="250" y="115" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">+</text><text x="250" y="156" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">q = 3</text>
      <circle cx="520" cy="195" r="24" fill="#ffffff" stroke="#171717" stroke-width="2"/><text x="520" y="200" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">×</text><text x="520" y="241" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">f = 12</text>
      <text x="150" y="55" fill="#f59e0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">∂q/∂x = 1</text>
      <text x="150" y="120" fill="#f59e0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">∂q/∂y = 1</text>
      <text x="385" y="137.5" fill="#f59e0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">∂f/∂q = z = 4</text>
      <text x="285" y="261" fill="#f59e0b" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">∂f/∂z = q = 3</text>
      </g>
      </svg>
      ```

      Addition passes a change in either input straight through to $q$, giving derivative 1. The multiplication's output $f$ changes by $q=3$ per unit change in $z$. Each amber label concerns only the operation at that arrow's end.

      **The idea.** Differentiate one small operation at a time. A **local derivative** is the derivative of one node's output with respect to one of its own inputs, holding that node's other inputs fixed. In $\partial q/\partial x$, the top names the output and the bottom names the input being changed.

      For addition $a+b$, both local derivatives are 1. For multiplication $a\cdot b$, the derivative with respect to $a$ is $b$, and with respect to $b$ is $a$. For subtraction $a-b$, they are 1 and $-1$, respectively. For squaring $u^2$, the derivative is $2u$. These rules can need forward values, such as $z=4$, so store those values during the forward pass before tracing backward.

      **Common confusion.** “The local derivative at $x$ tells me how $f$ changes with $x$.” No: $\partial q/\partial x=1$ only describes $q$. How $f$ changes with $x$ is a different number, which the next point finds by combining local derivatives.
    worked: |
      **Worked example.** Use the same squared error $L=(w\cdot x-t)^2$ at $w=2$, $x=3$, $t=5$. The forward pass gave $p=6$, $e=1$, $L=1$.

      1. **Differentiate the multiplication.**
         $$\frac{\partial p}{\partial w}=x=3.$$
         $$\frac{\partial p}{\partial x}=w=2.$$

      2. **Differentiate the subtraction.**
         $$\frac{\partial e}{\partial p}=1.$$
         $$\frac{\partial e}{\partial t}=-1.$$

      3. **Differentiate the squaring operation.**
         $$\frac{\partial L}{\partial e}=2e=2.$$

      4. **Check one local derivative with a nudge.** A **nudge** is a small change to one input, used to check a derivative numerically. Hold $x=3$ fixed and increase $w$ from 2 to 2.01.
         $$p_{\text{new}}=2.01\cdot3=6.03.$$
         $$p_{\text{new}}-p=0.03=0.01\cdot3.$$
         $$\frac{0.03}{0.01}=3=\frac{\partial p}{\partial w}=x.$$

      **Compare cases.**

      Hold $x=3$ and $t=5$ fixed:

      | $w$ | $p=w\cdot x$ | $e=p-t$ | $\partial p/\partial w=x$ | $\partial L/\partial e=2e$ |
      | --- | --- | --- | --- | --- |
      | 1 | 3 | $-2$ | 3 | $-4$ |
      | 2 | 6 | 1 | 3 | 2 |
      | 3 | 9 | 4 | 3 | 8 |

      Squaring's local derivative depends on the current forward value $e$; the multiplication's derivative with respect to $w$ depends only on $x$.

      **Where it shows up.** A loss is a score of prediction mistakes, such as our squared error. Even a large loss calculation built from these operations needs only this short list of local rules, reused at each node rather than a new rule for the whole formula.
