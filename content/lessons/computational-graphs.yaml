concept: computational-graphs
version: 1
fast_path: [objective, summary]
blocks:
  - kind: objective
    md: |
      **Goal:** draw the computational graph of an expression and compute the local derivative at each node.
  - kind: intuition
    md: |
      Any calculation can be broken into simple operations such as adding, multiplying and squaring numbers. Connect each operation to the values it uses: the inputs are at the start, and the final result is at the end.

      Each operation has a **local derivative** that tells how its output changes when one of its inputs changes. The chain rule combines these local changes to show how an input affects the final result.
  - kind: example
    md: |
      This example shows how local derivatives in an operation graph give an output's derivative with respect to an input.

      $f(x, y, z) = (x + y)\cdot z$ with $x=-2,\ y=5,\ z=-4$.

      - Node $q = x + y = 3$, with local derivatives $\partial q/\partial x = 1$ and $\partial q/\partial y = 1$.
      - Node $f = q\cdot z = -12$, with local derivatives $\partial f/\partial q = z = -4$ and $\partial f/\partial z = q = 3$.

      Chaining them: $\partial f/\partial x = \partial f/\partial q\cdot\partial q/\partial x = -4$.
  - kind: math
    md: |
      Local derivatives of common nodes:

      | node | output | local derivatives |
      |---|---|---|
      | add | $a + b$ | $1$, $1$ |
      | multiply | $ab$ | $b$, $a$ |
      | exp | $e^a$ | $e^a$ |
      | subtract | $a - b$ | $1$, $-1$ |
      | square | $a^2$ | $2a$ |

      Add nodes **copy** the incoming gradient to every input, and multiply nodes **swap** in the other input's value.
  - kind: check
    exercise: cg-check-1
  - kind: summary
    md: |
      - A calculation can be drawn as a directed graph of simple operations.
      - Each operation has local derivatives, and the chain rule combines them.
      - An add operation passes a change through unchanged; a multiply operation scales it by the other input.
