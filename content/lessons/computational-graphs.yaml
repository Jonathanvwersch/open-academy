      - cg-local-derivatives-basics
      - cgp-why-store-values
      - cgp-add-local
      - cgp-multiply-template
      - cgp-local-not-total
      - cgp-square-template
      - cgp-robot-subtract
  - id: cg-chaining-paths
    title: "Combine the small slopes into one"
    explain: |
      **The question.** How do you combine local derivatives to find the output's derivative for an early input, especially one used twice?

      **Picture it.** For $g=(x+y)\cdot(y+z)$ at $(x,y,z)=(1,2,4)$, the sums are $a=3$, $b=6$, giving $g=18$. Blue marks forward values, amber local derivatives, and green the paths from $y$ and their products. By the multiplication rule, $\partial g/\partial a=b=6$ and $\partial g/\partial b=a=3$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" aria-label="One y input feeds two additions a and b, whose outputs feed multiplication g">
      <defs><marker id="cg3-grey" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker><marker id="cg3-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker></defs>
      <path d="M74 59.8 L226.47 90.29" stroke="#737373" stroke-width="2" marker-end="url(#cg3-grey)"/>
      <path d="M74 156.6 L227.35 102.93" stroke="#10b981" stroke-width="2" marker-end="url(#cg3-green)"/>
      <path d="M74 175.8 L228.11 245.15" stroke="#10b981" stroke-width="2" marker-end="url(#cg3-green)"/>
      <path d="M74 272.6 L226.12 257.39" stroke="#737373" stroke-width="2" marker-end="url(#cg3-grey)"/>
      <path d="M273.01 101.82 L496.99 168.18" stroke="#10b981" stroke-width="2" marker-end="url(#cg3-green)"/>
      <path d="M273.01 248.18 L496.99 181.82" stroke="#10b981" stroke-width="2" marker-end="url(#cg3-green)"/>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#171717" text-anchor="middle">
      <rect x="26" y="31" width="48" height="48" rx="8" fill="#ffffff" stroke="#737373" stroke-width="2"/><text x="50" y="60" fill="#171717" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">x</text><text x="50" y="101" fill="#3b82f6" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1</text>
