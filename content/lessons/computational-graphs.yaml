concept: computational-graphs
version: 8
objective: |
  **Goal:** draw and evaluate a calculation as a graph of simple operations, find local derivatives, and combine every route to find the output derivative for an input.
recap:
  - concept: chain-rule
    text: "Multiply derivatives along each route from an input to the output, then add the route contributions; a partial derivative changes one input while holding the others fixed."
where_this_fits: |
  ### What is a computational graph?

  A computational graph is a diagram of the small operations in a calculation, with arrows showing which values each operation uses. It turns a long formula into steps you can follow one at a time.

  The chain rule tells us how to combine rates of change, but a formula can hide the steps between an input and the output. If one input is used in two operations, changing it can affect the output in two ways. Drawing both connections helps us find the output's derivative without missing either effect.
knowledge_points:
  - id: cg-drawing-graphs
    title: Draw and evaluate the graph
    tldr: |
      - A calculation can be split into small operations.
      - A graph draws those operations and connects each value to the operations that use it.
      - Following the connections in order gives the final result and all the values along the way.
    explain: |
      ### From a formula to a picture

      We know how to follow a chain of rates. First, let's make the calculation itself visible.

      We'll use a prediction and mistake score because they give us a calculation whose derivative tells us how changing a weight affects prediction mistakes. A simple prediction rule multiplies an input $x$ by an adjustable number $w$, called a weight. We'll call the prediction $p$. The desired result is the target, which we'll call $t$. Subtract the target to get the error $e$, then square it to get a mistake score $L$. Squaring gives positive scores for errors of either sign.

      In the picture, start with $w=2$ and $x=3$ on the left. Their arrows point to the circle marked ×, which multiplies them. Its result feeds subtraction along with $t=5$. The error then feeds squaring. The numbers below the circles show the inputs and results, including $p=6$ below ×.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" aria-label="w = 2 and x = 3 feed multiplication p = 6. p and t = 5 feed subtraction e = 1. e feeds squaring L = 1.">
      <defs><marker id="cg-1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <path d="M74.62 54.34 L195.38 75.66" stroke="#737373" stroke-width="2" marker-end="url(#cg-1)"/>
      <path d="M72.09 158.3 L197.91 91.7" stroke="#737373" stroke-width="2" marker-end="url(#cg-1)"/>
      <path d="M244.46 85.15 L385.54 114.85" stroke="#737373" stroke-width="2" marker-end="url(#cg-1)"/>
      <path d="M242.59 199.3 L387.41 130.7" stroke="#737373" stroke-width="2" marker-end="url(#cg-1)"/>
      <path d="M435 120 L555 120" stroke="#737373" stroke-width="2" marker-end="url(#cg-1)"/>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" text-anchor="middle">
      <circle cx="50" cy="50" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="50" y="56" fill="#171717">w</text><text x="50" y="105" fill="#3b82f6">2</text>
      <circle cx="50" cy="170" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="50" y="176" fill="#171717">x</text><text x="50" y="225" fill="#3b82f6">3</text>
      <circle cx="220" cy="80" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="220" y="86" fill="#171717">×</text><text x="220" y="135" fill="#3b82f6">p = 6</text>
      <circle cx="220" cy="210" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="220" y="216" fill="#171717">t</text><text x="220" y="265" fill="#3b82f6">5</text>
      <circle cx="410" cy="120" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="410" y="126" fill="#171717">−</text><text x="410" y="175" fill="#3b82f6">e = 1</text>
      <circle cx="580" cy="120" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="580" y="126" fill="#171717">²</text><text x="580" y="175" fill="#3b82f6">L = 1</text>
      </g>
      </svg>
      ```

      ### Arrows tell us the order

      A **computational graph** has a node for each input and each simple operation. Here, each node is a circle. An arrow points from a value to an operation that uses it. For example, the multiplication circle produces $p$, so its outgoing arrow carries that prediction to subtraction. Our formula is

      $$L=(w\cdot x-t)^2.$$

      The **forward pass** computes each operation after its inputs are ready:

      $$
      \begin{aligned}
      p&=2\cdot3=6 &&\text{multiply to predict}\\
      e&=6-5=1 &&\text{subtract the target}\\
      L&=1^2=1 &&\text{square the error}
      \end{aligned}
      $$

      These **forward values** are the numbers calculated as we follow the arrows. The arrows never loop back. If subtraction needed $L$ to produce $e$, while squaring needed $e$ to produce $L$, neither could start.

      Be careful not to draw two separate input nodes for one reused value. In $x\cdot x$, both factors mean the same number: changing $x$ from 2 to 3 changes both factors, taking $2\cdot2$ to $3\cdot3$. Draw one $x$ node with two arrows into multiplication.
    worked: |
      Let's evaluate the pictured mistake score at $w=2$, $x=3$, $t=5$.

      1. **Multiply to predict.** This supplies the value needed by subtraction.
         $$p=w\cdot x=2\cdot3=6.$$

      2. **Subtract the target.** This tells us how far the prediction is from the desired result.
         $$e=p-t=6-5=1.$$

      3. **Square the error.** This completes the last operation.
         $$L=e^2=1^2=1.$$

      The score is 1. We'll keep the in-between values $p=6$ and $e=1$ for the next step, where we'll use them to find how the operations respond to changes in their inputs.
    problems:
      - cg-drawing-graphs-basics
      - cgp-why-order
      - cgp-arrow-meaning
      - cgp-node-count
      - cgp-forward-template
      - cgp-shared-input
      - cgp-robot-forward
  - id: cg-local-derivatives
    title: Measure how each operation responds
    tldr: |
      - Each operation has its own rate of change for each input.
      - This rate, measured with the operation's other inputs held fixed, is called a local derivative.
      - Some local derivatives depend on the input value, so we save the forward values to find them.
    explain: |
      ### Look at one operation

      We have the forward values. Now we need the rate of change at each small operation before combining them with the chain rule.

      Zoom in on the multiplication $p=w\cdot x$. We'll keep $x=3$ while changing $w$. Increasing $w$ by 0.1 raises $p$ by 0.3, three times as much. The picture leaves out subtraction and squaring so we can focus on how multiplication responds.

      A **local derivative** is the rate of change of one operation's output with respect to one input, with other inputs fixed. Here it describes $p$ alone. Writing $\Delta$ for a change in a value:

      $$
      \begin{aligned}
      \Delta p&=0.3 &&\text{change in prediction}\\
      \Delta w&=0.1 &&\text{change in weight}\\
      \frac{\Delta p}{\Delta w}&=\frac{0.3}{0.1}=3 &&\text{divide the changes}
      \end{aligned}
      $$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" aria-label="With x fixed at 3, w changes from 2 to 2.1 and multiplication p changes from 6 to 6.3. The local derivative of p with respect to w is 3.">
      <defs><marker id="cg-2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <path d="M114.66 69.11 L365.34 110.89" stroke="#737373" stroke-width="2" marker-end="url(#cg-2)"/>
      <path d="M114.16 188.56 L365.84 121.44" stroke="#737373" stroke-width="2" marker-end="url(#cg-2)"/>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" text-anchor="middle">
      <circle cx="90" cy="65" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="90" y="71" fill="#171717">w</text><text x="90" y="120" fill="#3b82f6">2 → 2.1</text>
      <circle cx="90" cy="195" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="90" y="201" fill="#171717">x</text><text x="90" y="250" fill="#3b82f6">3 (fixed)</text>
      <circle cx="390" cy="115" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="390" y="121" fill="#171717">×</text><text x="390" y="170" fill="#3b82f6">p: 6 → 6.3</text>
      <text x="480" y="220" fill="#f59e0b">∂p/∂w = 3</text>
      </g>
      </svg>
      ```

      We write the rate of change of $p$ with respect to $w$ using partial-derivative notation:

      $$\frac{\partial p}{\partial w}=x.$$

      The top names the output $p$; the bottom names the input $w$ we're changing. With $x=3$, every increase in $w$ is multiplied by 3, so $p$ changes three times as much.

      ### Rules for the small operations

      Compare each operation before and after changing one input:

      1. **Add.** Changing $2+3=5$ to $3+3=6$ raises the output by $1$, giving derivative $1$.
      2. **Multiply.** Changing $2\cdot3=6$ to $3\cdot3=9$ raises the output by $3$, the other input's value.
      3. **Subtract: raise the first input.** Changing $6-5=1$ to $7-5=2$ raises the output by $1$, giving derivative $1$.
      4. **Subtract: raise the subtracted input.** Changing $6-5=1$ to $6-6=0$ lowers the output by $1$, giving derivative $-1$.

      Squaring depends on its input value:

      $$\frac{\partial L}{\partial e}=2e.$$

      Let's see why the squaring rule needs the error's value. With $x=3$ and $t=5$, three different weights give different errors, so squaring has a different local derivative in each case:

      | Weight $w$ | Error $e$ | Slope $2e$ |
      | --- | --- | --- |
      | 1 | $-2$ | $-4$ |
      | 2 | 1 | 2 |
      | 3 | 4 | 8 |

      We keep the calculated error so we can choose the right rate for squaring: at $e=1$ it is 2; at $e=-2$ it is $-4$.

      Be careful not to read a local derivative as the final score's derivative. The rate $\partial p/\partial w$ describes $p$ only; the later operations still matter.
    worked: |
      Let's find the local derivatives in our graph at $w=2$, $x=3$, $t=5$, where $p=6$ and $e=1$.

      1. **We keep the input fixed.** The multiplier of $w$ tells us how the prediction responds to the weight.
         $$\frac{\partial p}{\partial w}=x=3.$$

      2. **We keep the weight fixed.** Now $x$ changes while $w=2$, so the prediction changes twice as much as $x$.
         $$\frac{\partial p}{\partial x}=w=2.$$

      3. **We check the subtraction.** Raising the prediction raises the error; raising the target lowers it.
         $$\frac{\partial e}{\partial p}=1,\qquad\frac{\partial e}{\partial t}=-1.$$

      4. **We find how squaring responds.** We use the error $e=1$ that we calculated in the forward pass, because the squaring rule needs its input's current value.
         $$\frac{\partial L}{\partial e}=2e=2\cdot1=2.$$

      These rates describe the small operations separately. Next we'll join them into rates for the whole score.
    problems:
      - cg-local-derivatives-basics
      - cgp-why-store-values
      - cgp-add-local
      - cgp-multiply-template
      - cgp-local-not-total
      - cgp-square-template
      - cgp-robot-subtract
  - id: cg-chaining-paths
    title: Combine changes through the whole calculation
    tldr: |
      - An input can affect the output through several paths of operations.
      - Multiply the local derivatives along each path to find its contribution.
      - Add every path's contribution to get the output's derivative for that input.
    explain: |
      ### One number changes two sums

      We now combine local derivatives to find how the final output responds. A derivative label tells us how a change travels along an arrow. For example, rate 3 on the arrow from $w$ into multiplication means a 0.1 increase in $w$ raises $p$ by 0.3.

      Use $y$ twice with $x=1$, $y=2$ and $z=4$:

      $$
      \begin{aligned}
      a&=x+y=1+2=3 &&\text{first sum}\\
      b&=y+z=2+4=6 &&\text{second sum}\\
      g&=ab=3\cdot6=18 &&\text{multiply the sums}
      \end{aligned}
      $$

      One $y$ node feeds both additions, so changing $y$ changes both sums.

      Each addition passes a change in $y$ on at rate 1. Multiplication's derivative is the other input's value. Hold $b=6$ fixed and raise $a$ from 3 to 4:

      $$
      \begin{aligned}
      g_{\text{new}}&=4\cdot6=24 &&\text{evaluate the changed product}\\
      \frac{24-18}{4-3}&=6 &&\text{divide output change by input change}
      \end{aligned}
      $$

      Holding $a=3$ fixed instead gives rate 3 for changes in $b$. Multiply each rate by addition's rate 1 to get the diagram's contributions $6\cdot1$ and $3\cdot1$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" aria-label="x = 1 and y = 2 feed addition a = 3. y and z = 4 feed addition b = 6. a and b feed multiplication g = 18. The two paths from y contribute 6 times 1 and 3 times 1, totalling 9.">
      <defs><marker id="cg-3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <path d="M74.85 52.7 L255.15 72.3" stroke="#737373" stroke-width="2" marker-end="url(#cg-3)"/>
      <path d="M73.11 160.46 L256.89 84.54" stroke="#737373" stroke-width="2" marker-end="url(#cg-3)"/>
      <path d="M72.55 180.79 L257.45 269.21" stroke="#737373" stroke-width="2" marker-end="url(#cg-3)"/>
      <path d="M74.98 288.91 L255.02 281.09" stroke="#737373" stroke-width="2" marker-end="url(#cg-3)"/>
      <path d="M303.72 82.91 L541.28 162.09" stroke="#737373" stroke-width="2" marker-end="url(#cg-3)"/>
      <path d="M303.32 271 L541.68 179" stroke="#737373" stroke-width="2" marker-end="url(#cg-3)"/>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" text-anchor="middle">
      <circle cx="50" cy="50" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="50" y="56" fill="#171717">x</text><text x="50" y="105" fill="#3b82f6">1</text>
      <circle cx="50" cy="170" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="50" y="176" fill="#171717">y</text><text x="50" y="225" fill="#3b82f6">2</text>
      <circle cx="50" cy="290" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="50" y="296" fill="#171717">z</text><text x="50" y="345" fill="#3b82f6">4</text>
      <circle cx="280" cy="75" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="280" y="81" fill="#171717">+</text><text x="280" y="130" fill="#3b82f6">a = 3</text>
      <circle cx="280" cy="280" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="280" y="286" fill="#171717">+</text><text x="280" y="335" fill="#3b82f6">b = 6</text>
      <circle cx="565" cy="170" r="25" fill="#d4d4d4" fill-opacity="0.2" stroke="#737373"/><text x="565" y="176" fill="#171717">×</text><text x="565" y="225" fill="#3b82f6">g = 18</text>
      <text x="430" y="55" fill="#f59e0b">∂g/∂a = 6</text>
      <text x="430" y="310" fill="#f59e0b">∂g/∂b = 3</text>
      <text x="320" y="385" fill="#171717">From y: 6 × 1 + 3 × 1 = 9</text>
      </g>
      </svg>
      ```

      ### Add the two changes in g

      A **path** follows arrows from one node to another; here, $y$ to the upper addition to multiplication is one path from $y$ to $g$. Multiply local derivatives along each path, then add the products to get the output derivative. Here there are two paths from $y$:

      $$\frac{\partial g}{\partial y}=\frac{\partial g}{\partial a}\frac{\partial a}{\partial y}+\frac{\partial g}{\partial b}\frac{\partial b}{\partial y}.$$

      The first term follows $y$ to $a$ to $g$; the second follows $y$ to $b$ to $g$.

      - From $x$, only the path through $a$ contributes, giving $6\cdot1=6$.
      - From $y$, both paths contribute, giving $6+3=9$.
      - From $z$, only the path through $b$ contributes, giving $3\cdot1=3$.

      Be careful not to stop after one path from a reused input. That would give 6 or 3 for $y$, missing the other effect. The paths add because a small change in $y$ moves the output through both sums, just as in the chain rule recap.
    worked: |
      Let's return to our prediction score $L=(w\cdot x-t)^2$ at $w=2$, $x=3$, $t=5$. Each input has just one path to $L$.

      1. **Follow the weight's path.** The path goes through prediction, error and squaring, so multiply their local rates.
         $$\frac{\partial L}{\partial w}=\frac{\partial L}{\partial e}\frac{\partial e}{\partial p}\frac{\partial p}{\partial w}=2\cdot1\cdot3=6.$$

      2. **Follow the input's path.** Compared with the weight's path, the subtraction and squaring rates stay the same. At multiplication, $\partial p/\partial x=w=2$ replaces $\partial p/\partial w=x=3$.
         $$\frac{\partial L}{\partial x}=2\cdot1\cdot2=4.$$

      3. **Follow the target's path.** The target $t$ goes straight to the subtraction node, then the error goes to squaring. Multiplication uses only $w$ and $x$, so changing $t$ leaves the prediction $p$ fixed.
         $$\frac{\partial L}{\partial t}=2\cdot(-1)=-2.$$

      Near these values, a small increase in the weight or input raises the score, while a small increase in the target lowers it. The graph tells us which factors belong in each derivative.
    problems:
      - cg-chaining-paths-basics
      - cgp-why-multiply-path
      - cgp-path-product
      - cgp-chain-template
      - cgp-one-path-only
      - cgp-shared-template
      - cgp-robot-error
final: cg-explain
summary: |
  - A computational graph draws inputs and simple operations as nodes, with arrows from each value to the operations that use it. The forward pass computes nodes after their inputs are ready.
  - A local derivative describes one operation's output for one input, with other inputs held fixed. We keep the values calculated in the forward pass because some derivative rules need them; for example, squaring's local derivative $2e$ needs the error $e$.
  - Multiply local derivatives along every path from an input to the output, then add the path products. One reused input can have several paths.

  **Next:** Backpropagation uses these graph rules to reuse shared derivative calculations instead of following every path separately.
