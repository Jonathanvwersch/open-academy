      ```

      Calculate the answers from left to right. A node can run only after all its inputs have been calculated.
    worked: |
      This example shows the graph being evaluated one node at a time.

      We use the same house and settings: size $x = 2$, sale price $y = 5$, multiplying setting $w = 3$ and added amount $b = 1$.

      | step | node | inputs | value |
      |---|---|---|---|
      | 1 | multiply | $w = 3$, $x = 2$ | $m = 6$ |
      | 2 | add | $m = 6$, $b = 1$ | $\hat y = 7$ |
      | 3 | subtract | $\hat y = 7$, $y = 5$ | $r = 2$ |
      | 4 | square | $r = 2$ | $L = 4$ |

      Each step only needed values that earlier steps had already produced, and the last node gives the squared error, $L = 4$.
    problems:
      - cgp-steps-for-expression
      - cgp-forward-value
      - cgp-arrow-meaning
      - cgp-why-order
      - cgp-node-count
      - cgp-shared-input
  - id: cg-local-derivatives
    title: Each node has its own simple derivative
    explain: |
      Our house-price calculation multiplies $w = 3$ by $x = 2$ before adding the other terms. **How much does that multiplication's answer change when we change $w$?** Looking only at the complete error formula hides this small step. We can understand it by keeping $x = 2$ fixed and changing only $w$.

      A node's **local derivative** measures how its output changes per unit change in one input, with the others fixed. It is the partial derivative of that one operation. The same few rules apply wherever that operation appears:

      | node | output | local derivatives |
      |---|---|---|
      | add | $a + b$ | $1$ for $a$, $1$ for $b$ |
      | subtract | $a - b$ | $1$ for $a$, $-1$ for $b$ |
      | multiply | $a \cdot b$ | $b$ for $a$, $a$ for $b$ |
      | square | $a^2$ | $2a$ |

      This works because holding the other inputs fixed lets us measure one input's effect without mixing in other changes. For $a + b$, increasing $a$ by 0.1 increases the answer by 0.1. For $a \cdot b$ with $b = 4$, the same increase in $a$ increases the answer by 0.4.

      Why save answers such as $r = 2$? The derivative of $r^2$ needs that value to calculate $2r = 4$. Saving it uses memory, but avoids repeating all the calculations that produced $r$.
    worked: |
      This example shows every local derivative in the house graph, using the values from evaluating it ($w = 3$, $x = 2$, $m = 6$, $\hat y = 7$, $r = 2$).

      | node | local derivatives | values |
      |---|---|---|
      | $m = w \cdot x$ | $\partial m/\partial w = x$, $\partial m/\partial x = w$ | $2$ and $3$ |
      | $\hat y = m + b$ | $\partial \hat y/\partial m = 1$, $\partial \hat y/\partial b = 1$ | $1$ and $1$ |
      | $r = \hat y - y$ | $\partial r/\partial \hat y = 1$, $\partial r/\partial y = -1$ | $1$ and $-1$ |
      | $L = r^2$ | $dL/dr = 2r$ | $4$ |

      Each derivative uses one operation's rule and its saved inputs. We do not need to differentiate the complete price-error formula to fill in this table.

      For $\max(0, a)$, the output is whichever is larger: 0 or $a$. When $a = -3$, a small change leaves the output at 0, so the derivative is 0. When $a = 3$, the output changes by the same amount as $a$, so the derivative is 1. At zero the graph has a corner, so there is no derivative there.

      An exponential node calculates $e^a$. Its derivative is also $e^a$, so its saved output already gives the local derivative.
    problems:
      - cgp-multiply-local
      - cgp-multiply-nudge
      - cgp-square-local
      - cgp-why-store-values
      - cgp-subtract-local
      - cgp-max-node
  - id: cg-chaining-paths
    title: Chaining local derivatives back to an input
    explain: |
      For our house, increasing $w$ by 0.01 increases the multiplication result $m$ by 0.02 because $x = 2$. **Does that tell us how much the final error changes?** Not yet: the changed value still goes through addition, subtraction and squaring. We must include each of those operations, not stop at the first derivative.

      Follow the arrows from $w$ to $L$ and multiply the local derivatives. This works because each operation changes the amount it receives from the previous operation. Here addition and subtraction each multiply the change by 1. Squaring, at $r = 2$, multiplies it by about 4.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 130" aria-label="The path from w to L through m, y hat and r. The local derivatives along it are 2, 1, 1 and 4, which multiply to dL/dw = 8">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker></defs>
        <rect x="2" y="20" width="70" height="44" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
        <rect x="144" y="20" width="70" height="44" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
        <rect x="286" y="20" width="70" height="44" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
        <rect x="428" y="20" width="70" height="44" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
        <rect x="568" y="20" width="70" height="44" rx="8" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
        <text x="37" y="47" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">w</text>
        <text x="179" y="47" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">m</text>
        <text x="321" y="47" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">ŷ</text>
        <text x="463" y="47" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">r</text>
        <text x="603" y="47" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">L</text>
        <line x1="74" y1="52" x2="140" y2="52" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="216" y1="52" x2="282" y2="52" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="358" y1="52" x2="424" y2="52" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="500" y1="52" x2="564" y2="52" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="108" y="38" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#3b82f6">× 2</text>
        <text x="250" y="38" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#3b82f6">× 1</text>
        <text x="392" y="38" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#3b82f6">× 1</text>
        <text x="532" y="38" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#3b82f6">× 4</text>
        <text x="320" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#10b981">∂L/∂w = 4 × 1 × 1 × 2 = 8</text>
      </svg>
      ```

      $$\frac{\partial L}{\partial w} = \frac{dL}{dr}\cdot\frac{\partial r}{\partial \hat y}\cdot\frac{\partial \hat y}{\partial m}\cdot\frac{\partial m}{\partial w} = 4 \cdot 1 \cdot 1 \cdot 2 = 8$$

      So nudging $w$ up by 0.01 raises the squared error by about $8 \times 0.01 = 0.08$.

      Sometimes the same input is used by two later operations. Then there are two paths, or sequences of arrows, from that input to the result. Calculate the derivative along each path and add the two contributions. A change in the input affects the result through both calculations, so neither can be ignored.

      For our house-price model, we now know how the setting $w$ affects the final error. Backpropagation organises this calculation for every model setting.
    worked: |
      This example shows adding paths when one input is used twice.

      A robot cart receives the same movement command $b = -3$ for two one-second intervals. It travels $a \cdot b$ centimetres in the first interval and $c \cdot b$ centimetres in the second, where $a = 2$ and $c = 4$ describe how strongly it responds in each interval. Negative distances mean travelling backwards. The total distance with direction is $f = a \cdot b + c \cdot b$. We want to know how changing the command affects that total. The graph first calculates $p = a \cdot b$ and $q = c \cdot b$, then adds them as $f = p + q$.

      1. Path through $p$: $\frac{\partial f}{\partial p}\cdot\frac{\partial p}{\partial b} = 1 \cdot a = 2$.
      2. Path through $q$: $\frac{\partial f}{\partial q}\cdot\frac{\partial q}{\partial b} = 1 \cdot c = 4$.
      3. Adding the two contributions gives $\partial f/\partial b = 2 + 4 = 6$.

      We can check by rewriting $f = (a + c) \cdot b$. Its derivative with respect to $b$ is $a + c = 6$. Using only one path would give 2 or 4 and would miss part of the setting's effect on the robot's calculated movement.
    problems:
      - cgp-path-product
      - cgp-chain-template
      - cgp-one-path-only
      - cgp-used-twice
      - cgp-why-multiply-path
      - cgp-robot-error
final: cg-explain
summary: |
  - A computational graph breaks a calculation into nodes that each do one simple operation, and arrows carry each value to the node that uses it.
  - A local derivative describes one operation's response to a change in one input. For addition it is 1, for multiplication it is the other input, and for squaring it is twice the input.
  - Multiply derivatives along each path from an input to the result. If several paths exist, add their contributions because changing that input affects every route.

  **Where you'll use this:** backpropagation and automatic differentiation reuse these node rules and stored values to find how model settings affect a final loss.
