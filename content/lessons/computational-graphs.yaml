concept: computational-graphs
version: 3
objective: |
  **Goal:** represent a house-network calculation as operations and use local derivatives to trace its loss.
where_this_fits: |
  The chain rule multiplied local derivatives along each route from a house feature to the price loss. An MLP can contain many repeated operations and routes, so it helps to make the calculation explicit. A computational graph records each value and shows which later operation uses it.
knowledge_points:
  - id: cg-drawing-graphs
    title: Break the house calculation into operation nodes
    explain: |
      **What a computational graph is.** It is a directed diagram of values and operations, with an arrow from each input value to the operation that uses it.

      **How it works.** For the running house, let $z=0.1(12)=1.2$, $h=\max(0,z)=1.2$ (zero for a negative score, otherwise the score), $\hat y=15h+306.5=324.5$, and $L=(\hat y-330)^2=30.25$. Draw one node for each multiply, maximum, add and square; arrows show the order of dependence. Separate operation nodes make each local derivative simple to calculate.

      **Why this is useful.** A graph makes every dependency in the house-price calculation visible before computing its gradients.
    worked: |
      This example shows the calculation.
      $$a=12\longrightarrow z=0.1a=1.2\longrightarrow h=\max(0,z)=1.2\longrightarrow\hat y=15h+306.5=324.5\longrightarrow L=(\hat y-330)^2=30.25.$$
    problems:
      [
        cg-drawing-graphs-basics,
        cgp-steps-for-expression,
        cgp-forward-value,
        cgp-arrow-meaning,
        cgp-why-order,
        cgp-node-count,
        cgp-shared-input,
      ]
  - id: cg-local-derivatives
    title: Each graph operation has a local derivative
    explain: |
      **What a local derivative is.** It is the rate at one operation's output with respect to one of its inputs, holding the other inputs fixed.

      **How it works.** In the house graph, $d(0.1a)/da=0.1$, the maximum operation has slope 1 for this positive score, $d(15h+306.5)/dh=15$, and $d(\hat y-330)^2/d\hat y=2(\hat y-330)=-11$. These are small rules attached to their operation nodes. The forward values provide the current error $\hat y-330$ needed to differentiate the square.

      **Why this is useful.** Local derivatives reduce a large house-network gradient calculation to familiar rules for each operation.
    worked: |
      This example shows the calculation.
      At $\hat y=324.5$, the last operation gives $dL/d\hat y=2(324.5-330)=-11$. The output multiply gives $d\hat y/dh=15$.
    problems:
      [
        cg-local-derivatives-basics,
        cgp-multiply-local,
        cgp-multiply-nudge,
        cgp-square-local,
        cgp-why-store-values,
        cgp-subtract-local,
        cgp-max-node,
      ]
  - id: cg-chaining-paths
    title: Multiply derivatives backward along a path
    explain: |
      **What a backward path is.** It follows the graph from the final loss toward an earlier input, multiplying the local derivatives along the way.

      **How it works.** From loss back to area weight $w$, the factors are $dL/d\hat y=-11$, $d\hat y/dh=15$, $dh/dz=1$, and $dz/dw=12$. Their product is $dL/dw=-1980$. If a value feeds two later paths, add their contributions. The derivative at the weight is the loss slope needed to update that parameter.

      **Why this is useful.** The graph organizes the route from each house-network weight to the prediction loss.
    worked: |
      This example shows the calculation.
      $$\frac{dL}{dw}=\frac{dL}{d\hat y}\frac{d\hat y}{dh}\frac{dh}{dz}\frac{dz}{dw}=(-11)(15)(1)(12)=-1980.$$
    problems:
      [
        cg-chaining-paths-basics,
        cgp-path-product,
        cgp-chain-template,
        cgp-one-path-only,
        cgp-used-twice,
        cgp-why-multiply-path,
        cgp-robot-error,
      ]
final: cg-explain
summary: |
  - A computational graph records each operation and the values it depends on.
  - Local derivatives attach a simple slope to each operation.
  - Multiplying along paths and adding shared routes gives the loss slope for a house-network parameter.

  **Next:** Backpropagation applies these graph calculations efficiently to every network weight.
