      Via $a$, the product is $6\cdot1=6$; via $b$, it is $3\cdot1=3$. A small change in $y$ changes both $a$ and $b$; each change moves $g$, so the effects add, giving 9.

      **The idea.** Multiply along each path, then add the results. On a **computational graph**, the output's derivative with respect to any value is the sum of the products of local derivatives along every path from that value to the output. The Chain rule lesson taught both parts: derivatives multiply along a chain and add when an input has two routes.

      To trace backward, start at the output and walk against the arrows' direction, multiplying the local derivative on each arrow you cross. The arrows stay as drawn; only your walk reverses direction.

      **Common confusion.** “If a value feeds two operations, I just follow one path.” No: one path gives 6 or 3, missing the other contribution. Expand to check:
      $$g=xy+xz+y^2+yz.$$
      $$\frac{\partial g}{\partial y}=x+2y+z=1+4+4=9.$$
    worked: |
      **Worked example.** Return to the squared error $L=(w\cdot x-t)^2$ at $w=2$, $x=3$, $t=5$. With $p=w\cdot x=6$ and $e=p-t=1$, find the loss derivative for each input.

      We adjust $w$ to reduce prediction mistakes; we also differentiate with respect to $x$ and $t$ to see which factors their derivatives share.

      1. **Trace back to the weight.**
         $$\frac{\partial L}{\partial w}=\frac{\partial L}{\partial e}\cdot\frac{\partial e}{\partial p}\cdot\frac{\partial p}{\partial w}.$$
         $$\frac{\partial L}{\partial w}=2\cdot1\cdot3=6.$$

      2. **Trace back to the input.**
         $$\frac{\partial L}{\partial x}=\frac{\partial L}{\partial e}\cdot\frac{\partial e}{\partial p}\cdot\frac{\partial p}{\partial x}.$$
         $$\frac{\partial L}{\partial x}=2\cdot1\cdot2=4.$$

      3. **Trace back to the target.**
         $$\frac{\partial L}{\partial t}=\frac{\partial L}{\partial e}\cdot\frac{\partial e}{\partial t}.$$
         $$\frac{\partial L}{\partial t}=2\cdot(-1)=-2.$$

      Why start backward? The products above start at the output because factors near it can be reused further back: $w$ and $x$ share $\partial L/\partial e\cdot\partial e/\partial p=2$, while $t$ shares only $\partial L/\partial e=2$. Starting at the loss lets us build each shared product once, then use it for every earlier input that needs it.

      4. **Check the weight derivative with a nudge.**
         $$L_{\text{new}}=(2.01\cdot3-5)^2=1.0609.$$
         $$L_{\text{new}}-L=0.0609\approx0.01\cdot6=0.06.$$

      To see the gap from the derivative's prediction, write the nudged weight as $w=2+h$, where $h$ is the change in $w$:
      $$L_{\text{new}}=(3(2+h)-5)^2.$$
      $$L_{\text{new}}=(1+3h)^2=1+6h+9h^2.$$
      $$L_{\text{new}}-L=6h+9h^2.$$
      At $h=0.01$, the derivative predicts $6h=0.06$; the extra $9h^2=0.0009$ gives the actual change $0.0609$. At $h=0.001$, $6h=0.006$ and $9h^2=0.000009$: the correction shrinks 100-fold while the predicted change shrinks only tenfold.

      **Compare cases.** For the two-sum graph $g=(x+y)\cdot(y+z)$ pictured above:

      | Input | Paths to $g$ | Products | Output derivative |
      | --- | --- | --- | --- |
      | $x$ | 1 | $6\cdot1$ | $\partial g/\partial x=6$ |
      | $y$ | 2 | $6\cdot1$ and $3\cdot1$ | $\partial g/\partial y=9$ |
      | $z$ | 1 | $3\cdot1$ | $\partial g/\partial z=3$ |

      **Where it shows up.** Adjusting every weight to reduce loss needs a derivative for each one; tracing inputs separately would repeat shared products such as $\partial L/\partial e\cdot\partial e/\partial p$. Backpropagation, the next lesson, computes each shared product once in a backward sweep and reuses it for every input that needs it.
