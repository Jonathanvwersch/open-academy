concept: computational-graphs
version: 2
objective: |
  **Goal:** draw the computational graph of a calculation, find the local derivative at each node, and chain them to see how the result changes with any input.
knowledge_points:
  - id: cg-drawing-graphs
    title: Breaking a calculation into simple steps
    explain: |
      A line prices a house as $\hat y = wx + b$, where $x$ is the size, $w$ and $b$ are the line's settings, and $\hat y$ ("y hat") is the predicted price. The true price is $y$, and the squared error is $L = (wx + b - y)^2$. **How does $L$ change if you nudge $w$?**

      As one formula that's a tangle. So break it into steps that each do one simple operation, and give every in-between result a name:

      1. $m = w \cdot x$ (multiply)
      2. $\hat y = m + b$ (add)
      3. $r = \hat y - y$ (subtract: how far off the prediction is)
      4. $L = r^2$ (square)

      Now draw it. Each operation is a **node**. An arrow carries a value into the node that uses it. Inputs sit on the left and the final result on the right. This picture is a **computational graph**.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" aria-label="Computational graph of the squared error. w = 3 and x = 2 feed a multiply node giving m = 6. m and b = 1 feed an add node giving y hat = 7. y hat and y = 5 feed a subtract node giving r = 2. A square node gives L = 4">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#737373"/></marker></defs>
        <text x="20" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">w = 3</text>
        <text x="20" y="122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">x = 2</text>
        <line x1="70" y1="50" x2="90" y2="70" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
        <line x1="70" y1="112" x2="90" y2="92" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
        <rect x="92" y="60" width="56" height="40" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
        <text x="120" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#171717">×</text>
        <line x1="148" y1="80" x2="220" y2="80" stroke="#737373" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="184" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#3b82f6">m = 6</text>
        <rect x="222" y="60" width="56" height="40" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
        <text x="250" y="86" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#171717">+</text>
        <text x="250" y="170" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">b = 1</text>
