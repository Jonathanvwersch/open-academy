concept: computational-graphs
version: 2
objective: |
  **Goal:** draw the computational graph of a calculation, find the local derivative at each node, and chain them to see how the result changes with any input.
why: |
  A house-price model predicts 700 thousand pounds for a house that sold for 500 thousand. Before changing its settings, we want to know how each setting affects that mistake. We could expand the complete error formula and differentiate it by hand. That is manageable for a small model, but a larger model may reuse the same calculation many times, making the expanded formula long and hard to check. A computational graph records each small calculation and shows where its answer is used. We can then find derivatives one operation at a time and reuse answers we have already calculated. Backpropagation and automatic differentiation build on this representation to calculate how every model setting affects its final error.
knowledge_points:
  - id: cg-drawing-graphs
    title: Breaking a calculation into simple steps
    explain: |
      A house has size $x = 2$ in hundreds of m². We predict its price with $\hat y = wx + b$, where $w = 3$ multiplies the size and $b = 1$ is an amount added afterwards. Prices are in hundreds of thousands of pounds, so $\hat y = 7$ means 700 thousand pounds. The house actually sold for $y = 5$, so the squared error is $L = (wx + b - y)^2 = 4$. **How would changing $w$ change this error?**

      We could expand the formula before differentiating it, but that becomes hard to follow when a model has many repeated calculations. Instead, give each small calculation a name:

      1. $m = w \cdot x$ (multiply)
      2. $\hat y = m + b$ (add)
      3. $r = \hat y - y$ (subtract: how far off the prediction is)
      4. $L = r^2$ (square)

      Now draw it. Each operation is a **node**. An arrow carries a value into the node that uses it. Inputs sit on the left and the final result on the right. This picture is a **computational graph**.

      This works because every arrow tells us exactly where an earlier answer is needed. If two later calculations need the same answer, we can draw two arrows from it rather than calculate it twice.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" aria-label="Computational graph of the squared error. w = 3 and x = 2 feed a multiply node giving m = 6. m and b = 1 feed an add node giving y hat = 7. y hat and y = 5 feed a subtract node giving r = 2. A square node gives L = 4">
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#737373"/></marker></defs>
