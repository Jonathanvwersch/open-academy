  - id: gd-step-size
    title: "How big a step to take"
    explain: |
      ### Why the step size matters

      A tiny step is safe but slow. So it's tempting to think a big step just gets us to the bottom sooner. Let's see whether it does.

      ### Three learning rates on one bowl

      We'll use a bowl with a single input, $f(w)=w^2$, whose lowest point is at $w=0$. Its slope is $2w$, so one step gives

      $$w_{\text{new}}=w-\eta(2w)=(1-2\eta)\,w.$$

      That means every step multiplies $w$ by the same number, $1-2\eta$. Each panel below starts at $w=5$ and takes two steps with a different learning rate.

