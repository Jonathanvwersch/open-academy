      - gdp-robot-step
  - id: gd-step-size
    title: Choose the step size
    explain: |
      **The question.** The update is $\mathbf p-\eta\nabla f(\mathbf p)$, but what value should $\eta$ take? A tiny step is safe but slow. Does a big step simply get there sooner?

      **Picture it.** Use the simplest bowl, $f(w)=w^2$, with one input $w$. Its slope is $2w$, so one step gives

      $$w_{\text{new}}=w-\eta(2w)=(1-2\eta)\,w.$$

      Each step multiplies $w$ by the same number, $1-2\eta$. Each panel starts at $w=5$ and takes two steps with a different learning rate. With $\eta=0.1$, $w$ creeps down one side. With $\eta=0.75$, it jumps across the bottom but lands closer each time. With $\eta=1.25$, it jumps across and lands higher each time.

