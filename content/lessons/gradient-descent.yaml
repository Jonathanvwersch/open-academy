  - id: gd-price-gradients
    title: "Find the slopes from the model's error"
    explain: |
      ### Where the slopes come from

      So far the height was a formula like $x^2+2y^2$, and we could find its slopes directly. A model's loss is different. It depends on the weights only through the model's predictions, so to find each weight's slope we go through the error.

      ### One model, one example

      Let's take the smallest model there is. It has one input $x$, a weight $w$ and a bias $b$, and it predicts $\hat y=wx+b$. We start at $w=1$ and $b=1$, the grey line.

      Our training example is the black dot, with input $x=2$ and true output $y=7$. The model predicts $\hat y=1\times2+1=3$, so it's $4$ too low, which is the red gap. The **error** is $e=\hat y-y=3-7=-4$, and the loss is the squared error, $L=e^2=16$. The orange line is the model after one gradient-descent step, which we work out below.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" aria-label="Input x against output. The grey line is the starting model, prediction equals x plus 1, which predicts 3 at x equals 2. The training example is the black dot at (2, 7). A red segment from 3 up to 7 shows the error of minus 4. The amber line is the model after one gradient-descent step, prediction equals 1.8x plus 1.4, which predicts 5 at x equals 2">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M70 300 H470 M70 300 V15.0" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
      <text x="150" y="320" text-anchor="middle" fill="#737373">1</text>
      <text x="230" y="320" text-anchor="middle" fill="#737373">2</text>
      <text x="310" y="320" text-anchor="middle" fill="#737373">3</text>
      <text x="390" y="320" text-anchor="middle" fill="#737373">4</text>
      <path d="M65 210 h5" stroke="#737373"/><text x="60" y="215" text-anchor="end" fill="#737373">3</text>
      <path d="M65 150 h5" stroke="#737373"/><text x="60" y="155" text-anchor="end" fill="#737373">5</text>
      <path d="M65 90 h5" stroke="#737373"/><text x="60" y="95" text-anchor="end" fill="#737373">7</text>
      <path d="M70 270 L430.0 135" stroke="#737373" stroke-width="2.5"/>
      <path d="M70 258 L410.0 28.5" stroke="#f59e0b" stroke-width="2.5"/>
      <path d="M230 210 V90" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 5"/>
      <circle cx="230" cy="90" r="5" fill="#171717"/>
      <circle cx="230" cy="210" r="4.5" fill="#ffffff" stroke="#737373" stroke-width="2"/>
      <circle cx="230" cy="150" r="4.5" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="218" y="82" text-anchor="end">example: x = 2, y = 7</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="242" y="230">prediction 3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="218" y="168" fill="#ef4444" text-anchor="end">error −4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="244" y="155" fill="#f59e0b">after one step: 5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="438" y="140" fill="#737373">start: ŷ = x + 1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="418" y="33.5" fill="#f59e0b">after: ŷ = 1.8x + 1.4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="478" y="305">x</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="78" y="20">output</text>
      </g>
      </svg>
      ```

      ### The slope of each weight

      In the partial-derivatives lesson, we worked these slopes out for a linear model $\hat y=w\cdot x+b$ with squared-error loss $L=(\hat y-y)^2$. Each weight's slope is twice the error times that weight's input, and the bias's slope is twice the error:

      $$\frac{\partial L}{\partial w_j}=2e\,x_j,$$

      $$\frac{\partial L}{\partial b}=2e.$$

      Here $x_j$ is the $j$th input and $w_j$ is its weight. These slopes, one for each weight and one for the bias, are the model's **parameter gradients**. The bias acts like a weight whose input is always $1$, which is why its slope has no input in it.

      With several examples and an MSE loss, we find every example's error from the same current weights, average each slope over the examples, and then take one step.

      Be careful: the weight with the biggest slope isn't the one that's most wrong. Every slope contains the same error $e$, so what makes one slope bigger than another is its input. A weight on a large input gets a large slope, even though the mistake belongs to the whole prediction.
    worked: |
      Let's take one gradient-descent step for $\hat y=wx+b$, starting from $w=1$ and $b=1$, on the example $x=2$, $y=7$, with $\eta=0.05$.

      1. **Predict.** We put the input into the model with the current weight and bias.
         $$\hat y=1\times2+1=3.$$

      2. **Find the error.** The error compares the prediction with the true output.
         $$e=\hat y-y=3-7=-4.$$

      3. **Find the weight's slope.** It's twice the error times the input.
         $$\frac{\partial L}{\partial w}=2ex=2(-4)(2)=-16.$$

      4. **Find the bias's slope.** It's just twice the error.
         $$\frac{\partial L}{\partial b}=2e=2(-4)=-8.$$

      5. **Update both.** Each one moves against its own slope, by $\eta$ times that slope.
         $$w_{\text{new}}=1-0.05\times(-16)=1.8,$$
         $$b_{\text{new}}=1-0.05\times(-8)=1.4.$$

      6. **Check the new loss.** We predict again with the new weight and bias.
         $$\hat y=1.8\times2+1.4=5,\qquad e=-2,\qquad L=4.$$

      The loss fell from $16$ to $4$, so the step helped.

      To see how the error drives everything, here is the same starting model, $w=1$ and $b=1$, on four different examples:

      | Example $(x,y)$ | $\hat y$ | $e$ | $\partial L/\partial w=2ex$ | $\partial L/\partial b=2e$ | The step moves $w$ |
      | --- | --- | --- | --- | --- | --- |
      | $(2,7)$ | $3$ | $-4$ | $-16$ | $-8$ | up |
      | $(2,1)$ | $3$ | $2$ | $8$ | $4$ | down |
      | $(2,3)$ | $3$ | $0$ | $0$ | $0$ | not at all |
      | $(10,15)$ | $11$ | $-4$ | $-80$ | $-8$ | up, 5 times as far |

      The same thing happens in bigger models. In the partial-derivatives lesson, a house-price model had three inputs, $x=(12,3,20)$, with the house's age, $20$, last. With $w=(25,10,-1)$ and $b=0$ it predicted $310$ for a house that sold for $330$, so $e=-20$, and its gradient over $(w_1,w_2,w_3,b)$ was $(-480,-120,-800,-40)$. The age slope is the biggest only because age is the biggest input.
