final: gd-explain-training
summary: |
  - Subtract the learning rate times the current loss gradient, then recompute it at the new parameters.
  - Too-small rates can give slow progress; too-large rates can overshoot and diverge. Check the loss curve and whether distances shrink.
  - For a linear price model, average error-times-input contributions for weights and errors for the bias, then repeat prediction, error, slope and update.

  **Where you'll use this:** stochastic and minibatch gradient descent take these steps on small batches of data, momentum and Adam refine the step, and backpropagation computes the slopes for neural networks.
