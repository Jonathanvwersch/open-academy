  - kind: check
    exercise: gd-check-step
  - kind: summary
    md: |
      - Update rule: $\theta \leftarrow \theta - \eta\nabla L$.
      - If $\eta$ is too small, progress is slow. If it is too big, steps can move farther away and the loss may grow or become NaN (not a number).
      - A smooth decrease means progress; a plateau is little change; oscillation crosses the minimum; an explosion means errors grow.
