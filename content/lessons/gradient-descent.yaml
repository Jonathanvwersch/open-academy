concept: gradient-descent
version: 5
objective: |
  **Goal:** use gradient descent to train a model, by stepping its weights downhill on the loss, choosing a step size that works and repeating until the loss stops falling.
recap:
  - concept: gradients
    text: "The gradient $\\nabla f$ lists a function's slopes, one for each input. It points the way the function rises fastest, so $-\\nabla f$ points the way it falls fastest."
  - concept: loss-functions
    text: "A loss is one number that measures how wrong a model's predictions are. For squared error, $(\\hat y-y)^2$, the slope with respect to the prediction is twice the error, $2(\\hat y-y)$."
  - concept: linear-regression
    text: "The prediction of a linear model is $\\hat y=w\\cdot x+b$. The list $x$ holds the inputs, $w$ holds their weights, and $b$ is the bias."
where_this_fits: |
  ### What is gradient descent?

  Gradient descent is a way of finding the lowest point of a function by taking small steps downhill, over and over. It's how most machine-learning models learn: the function is the model's loss, and each step nudges the weights so that the loss gets a little smaller.

  Why do we need it? For a simple curve, or a small linear model, algebra can find the lowest point, and we'll practise on those because they're easy to check. But most models have thousands of weights and no such formula. What we can always work out is the gradient where we're standing, and in the gradients lesson we saw that its opposite points downhill. Gradient descent turns that one fact into a way of reaching the bottom.
knowledge_points:
  - id: gd-downhill-update
    key_prereqs: [gradients, vectors, partial-derivatives]
    title: "Take one step downhill"

    tldr: |
      - The gradient points the way the loss rises fastest, so the opposite way goes downhill fastest.
      - Gradient descent takes a small step that way.
      - A small positive number called the learning rate sets the size of each step.
      - Repeating the step from wherever we land keeps lowering the loss.
    explain: |
      ### Walking downhill

      Imagine the loss as the height of the ground, with one direction for each weight. In the gradients lesson, we found that the gradient points the way the height rises fastest, so the opposite direction, $-\nabla f$, is the steepest way down.

      So the plan is to work out the gradient where we're standing, take a small step the opposite way, and repeat from wherever we land.

      ### One step on a bowl

      Let's try one step on a simple landscape, the bowl-shaped function $f(x,y)=x^2+2y^2$, whose lowest point is $(0,0)$. For now, $x$ and $y$ are just its two inputs, the two directions we can move in. The picture shows it from above as a contour map. Each ring joins points at the same height, and the outer rings are higher.

      We start at $P=(1.5,1)$, where the height is $4.25$. The bowl's slopes are $2x$ and $4y$. The whole gradient would jump right past the bottom, so we use a tenth of it:
      $$
      \begin{aligned}
      \nabla f(P)&=(2\times1.5,\ 4\times1)=(3,4) &&\text{find the slopes}\\
      0.1\,\nabla f(P)&=(0.3,0.4) &&\text{scale the gradient}\\
      P-0.1\,\nabla f(P)&=(1.2,0.6) &&\text{subtract along the orange arrow}\\
      f(1.2,0.6)&=1.2^2+2\times0.6^2=2.16 &&\text{check the lower height}\\
      P+0.1\,\nabla f(P)&=(1.8,1.4) &&\text{add along the blue arrow}\\
      f(1.8,1.4)&=1.8^2+2\times1.4^2=7.16 &&\text{check the higher height}
      \end{aligned}
      $$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" aria-label="Contour map of the bowl x squared plus 2y squared seen from above, with rings at heights 2.16, 4.25 and 7.16 around the lowest point (0, 0). From P at (1.5, 1), height 4.25, the orange arrow subtracts a tenth of the gradient (3, 4) and lands at (1.2, 0.6), height 2.16. The blue arrow adds it instead and lands at (1.8, 1.4), height 7.16">
      <defs><marker id="gd1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="gd1-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M-10 215 H540 M250 415 V15" stroke="#d4d4d4"/>
      <ellipse cx="250" cy="215" rx="132.27" ry="93.53" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="1.5"/>
      <ellipse cx="250" cy="215" rx="185.54" ry="131.2" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="1.5"/>
      <ellipse cx="250" cy="215" rx="240.82" ry="170.29" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="1.5"/>
      <path d="M385 125 L412 89" stroke="#3b82f6" stroke-width="3" marker-end="url(#gd1-blue)"/>
      <path d="M385 125 L358 161" stroke="#f59e0b" stroke-width="3" marker-end="url(#gd1-amber)"/>
      <circle cx="385" cy="125" r="4" fill="#171717"/>
      <circle cx="358" cy="161" r="4" fill="#171717"/>
      <circle cx="412" cy="89" r="4" fill="#171717"/>
      <circle cx="250" cy="215" r="4" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="397" y="130">start P = (1.5, 1), height 4.25</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="424" y="77" fill="#3b82f6">add a tenth of ∇f: uphill</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="424" y="95">(1.8, 1.4), height 7.16</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="372" y="183" fill="#f59e0b">subtract a tenth of ∇f: downhill</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="372" y="201">(1.2, 0.6), height 2.16</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="242" y="237" text-anchor="end">lowest point (0, 0)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="546" y="220">x</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="256" y="13">y</text>
      </g>
      </svg>
      ```

      ### The update rule

      **Gradient descent** takes small steps against the gradient. Here $\mathbf p$ is the point we're starting from. Its two entries give the coordinates in our example. Write one step as

      $$\mathbf p_{\text{new}}=\mathbf p-\eta\,\nabla f(\mathbf p).$$

      The Greek letter $\eta$ (eta) is the **learning rate**, a small positive number that sets the size of the step. On the bowl, $\mathbf p$ was $P$ and $\eta$ was $0.1$. When we train a model, $f$ is its loss and $\mathbf p$ holds its weights and bias, which together are called its **parameters**. One step changes them all at once.

      It helps to read the rule one input at a time. If an input's slope is positive, raising that input would raise the height, so the step lowers it. If the slope is negative, the step raises it.

      Be careful with the minus sign. If we add $\eta\,\nabla f$ by habit, we follow the gradient uphill, like the blue arrow's climb to $7.16$.
    worked: |
      Let's work through that step on the bowl $f(x,y)=x^2+2y^2$, starting from $P=(1.5,1)$ with a learning rate of $\eta=0.1$.

      1. **Find the gradient at $P$.** The bowl's slopes are $2x$ and $4y$, so we put in $x=1.5$ and $y=1$.
         $$\nabla f(P)=(2\times1.5,\ 4\times1)=(3,4).$$

      2. **Scale it by the learning rate.** Multiplying by $\eta$ shrinks the gradient to the size of step we want.
         $$\eta\,\nabla f(P)=0.1\times(3,4)=(0.3,0.4).$$

      3. **Subtract it from $P$.** Subtracting, rather than adding, is what sends us downhill.
         $$P_{\text{new}}=(1.5,1)-(0.3,0.4)=(1.2,0.6).$$

      4. **Check that the height fell.** We put the new point back into $f$.
         $$f(1.2,0.6)=1.2^2+2\times0.6^2=1.44+0.72=2.16.$$

      The height fell from $4.25$ to $2.16$, so this one step roughly halved it.
