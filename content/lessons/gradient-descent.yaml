  - id: gd-training-loop
    title: "Repeat until the loss stops falling"
    explain: |
      ### Going round again

      One step lowered the loss from $16$ to $4$, but not to $0$. So we take another step, and another, each one starting from the weight and bias that the last one left behind. Every pass does the same four things, in a loop.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" aria-label="Left: the training loop as four boxes in a cycle, predict, measure error and loss, compute slopes, update weight and bias, with an arrow back to predict. Right: bars of the loss after each of four steps, 16, 4, 1 and 0.25">
      <defs><marker id="gd4-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="115.0" y="40" width="150" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <text x="190" y="67" text-anchor="middle">1. Predict ŷ</text>
      <rect x="215.0" y="140" width="150" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <text x="290" y="167" text-anchor="middle">2. Error and loss</text>
      <rect x="115.0" y="240" width="150" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <text x="190" y="267" text-anchor="middle">3. Slopes</text>
      <rect x="15.0" y="140" width="150" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <text x="90" y="167" text-anchor="middle">4. Update w, b</text>
      <path d="M230 84 L280 138" stroke="#737373" stroke-width="2" marker-end="url(#gd4-muted)"/>
      <path d="M280 186 L230 238" stroke="#737373" stroke-width="2" marker-end="url(#gd4-muted)"/>
      <path d="M150 238 L100 186" stroke="#737373" stroke-width="2" marker-end="url(#gd4-muted)"/>
      <path d="M100 138 L150 84" stroke="#737373" stroke-width="2" marker-end="url(#gd4-muted)"/>
      <path d="M395 70 V290 H635" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
      <rect x="415" y="80" width="36" height="210" fill="#10b981"/>
      <text x="433" y="72" text-anchor="middle">16</text>
      <text x="433" y="310" text-anchor="middle" fill="#737373">1</text>
      <rect x="470" y="237.5" width="36" height="52.5" fill="#10b981"/>
      <text x="488" y="229.5" text-anchor="middle">4</text>
      <text x="488" y="310" text-anchor="middle" fill="#737373">2</text>
      <rect x="525" y="276.875" width="36" height="13.125" fill="#10b981"/>
      <text x="543" y="268.875" text-anchor="middle">1</text>
      <text x="543" y="310" text-anchor="middle" fill="#737373">3</text>
      <rect x="580" y="286.719" width="36" height="3.281" fill="#10b981"/>
      <text x="598" y="278.719" text-anchor="middle">0.25</text>
      <text x="598" y="310" text-anchor="middle" fill="#737373">4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="515" y="332" fill="#737373" text-anchor="middle">pass</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="395" y="35">loss measured in each pass</text>
      </g>
      </svg>
      ```

      The bars on the right show the loss of our one-example model on four passes, $16$, $4$, $1$ and $0.25$. Each pass cuts it to a quarter.

      This cycle of predicting, measuring the loss, finding the slopes and updating is called a **training loop**. We stop after a fixed number of passes, or when a pass lowers the loss by only a tiny amount, say less than $0.1\%$.

      ### Work out the slopes again every pass

      The slopes belong to the point where we're standing, and that point moves. After the first step the error halves from $-4$ to $-2$, so the slopes halve too, from $(-16,-8)$ to $(-8,-4)$. If we kept reusing the first slopes, every step would stay full size, and by the third step the prediction would be $9$, past the true value of $7$.

      ### Reading a loss curve

      A plot of the loss on each pass is called a **loss curve**, and it's how you check that training is working. A steady fall is good. A slow fall from the very start usually means the learning rate is too small, and a loss that rises usually means it's too large.
    worked: |
      Let's run the second pass of the loop by hand. The model is still $\hat y=wx+b$ with the example $x=2$, $y=7$ and $\eta=0.05$, and the first pass left us with $w=1.8$ and $b=1.4$.

      1. **Predict.** We use the weight and bias from the first pass.
         $$\hat y=1.8\times2+1.4=5.$$

      2. **Measure the error and loss.** We compare the prediction with the true output, then square the error.
         $$e=5-7=-2,\qquad L=(-2)^2=4.$$

      3. **Find the slopes.** We work these out again from the new error, rather than reusing the first pass's slopes.
         $$\frac{\partial L}{\partial w}=2(-2)(2)=-8,\qquad \frac{\partial L}{\partial b}=2(-2)=-4.$$

      4. **Update.** Each parameter moves against its own slope.
         $$w=1.8-0.05\times(-8)=2.2,$$
         $$b=1.4-0.05\times(-4)=1.6.$$

      Here is the same loop in Python, running four passes. In Python, `**` means "to the power of", `range(1, 5)` counts the passes from $1$ to $4$, and `w, b = ..., ...` updates both from their old values at the same time. The indented lines run once per pass, and `round(loss, 4)` rounds the loss to $4$ decimal places.

      ```python
      x, y = 2.0, 7.0
      w, b = 1.0, 1.0
      lr = 0.05
      for step in range(1, 5):
          y_hat = w * x + b                # 1. predict
          e = y_hat - y                    # 2. error
          loss = e ** 2                    #    and loss
          dw, db = 2 * e * x, 2 * e        # 3. slopes
          w, b = w - lr * dw, b - lr * db  # 4. update
          print(step, round(loss, 4))
      # prints 1 16.0, 2 4.0, 3 1.0, 4 0.25
      ```

      This table follows all four passes. Each row is measured before that pass's update, so the losses match what the code prints.

      | Pass | $w$ | $b$ | $\hat y$ | $e$ | $L$ | Slopes $(\partial L/\partial w,\ \partial L/\partial b)$ |
      | --- | --- | --- | --- | --- | --- | --- |
      | $1$ | $1$ | $1$ | $3$ | $-4$ | $16$ | $(-16,-8)$ |
      | $2$ | $1.8$ | $1.4$ | $5$ | $-2$ | $4$ | $(-8,-4)$ |
      | $3$ | $2.2$ | $1.6$ | $6$ | $-1$ | $1$ | $(-4,-2)$ |
      | $4$ | $2.4$ | $1.7$ | $6.5$ | $-0.5$ | $0.25$ | $(-2,-1)$ |

      Notice that the slopes shrink as the error shrinks, so the steps get smaller near the bottom on their own. With many examples that don't all lie on one line, the errors can't all reach $0$, but their averaged slopes still shrink toward $0$ as we get close to the best parameters.

      Training a real model, such as a house-price model, runs this same loop thousands of times, with each slope averaged over all the training examples, and the loss curve is what you watch while it runs.
