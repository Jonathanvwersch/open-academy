      This can't happen to our linear model. Its squared-error loss is a bowl in $w$ and $b$, so any point where the slopes are all $0$ is as low as it gets. For losses with several dips, a common fix is to train from a few different starting points and keep whichever ends lowest.
    worked: |
      Let's run the second pass of the loop by hand. The model is still $\hat y=wx+b$, with the example $x=2$, $y=7$ and $\eta=0.05$, and the first pass left us with $w=1.8$ and $b=1.4$.

      1. **Predict.** We use the weight and bias that the first pass left behind.
         $$\hat y=1.8\times2+1.4=5.$$

      2. **Measure the error and loss.** We compare the prediction with the true output, then square the error.
         $$e=5-7=-2,\qquad L=(-2)^2=4.$$

      3. **Find the slopes.** We work these out again from the new error, rather than reusing the first pass's slopes.
         $$\frac{\partial L}{\partial w}=2\times(-2)\times2=-8,\qquad\frac{\partial L}{\partial b}=2\times(-2)=-4.$$

      4. **Update.** Each parameter moves against its own slope.
         $$w=1.8-0.05\times(-8)=2.2,\qquad b=1.4-0.05\times(-4)=1.6.$$

      The slopes were half the size of the first pass's, so this step was half as big. Check what it does to the loss:
      $$
      \begin{aligned}
      \hat y&=2.2\times2+1.6=6 &&\text{predict after the update}\\
      e&=6-7=-1 &&\text{subtract the target}\\
      L&=(-1)^2=1 &&\text{square the error}
      \end{aligned}
      $$
      The loss falls from $4$ to $1$.

      Here is the same loop in Python, running four passes. In Python, `**` means "to the power of", `range(1, 5)` counts the passes from $1$ to $4$, and `w, b = ..., ...` updates both from their old values at the same time. The `for` line repeats the indented lines once per pass, `lr` stands for the learning rate $\eta$, `dw` and `db` hold the two slopes, and `round(loss, 4)` rounds the loss to four decimal places.

      ```python
      x, y = 2.0, 7.0
      w, b = 1.0, 1.0
      lr = 0.05
      for step in range(1, 5):
          y_hat = w * x + b                # 1. predict
          e = y_hat - y                    # 2. error
          loss = e ** 2                    #    and loss
          dw, db = 2 * e * x, 2 * e        # 3. slopes
          w, b = w - lr * dw, b - lr * db  # 4. update
          print(step, round(loss, 4))
      # prints four lines: 1 16.0, then 2 4.0, then 3 1.0, then 4 0.25
      ```

      ### Find the weight slopes for a batch

      Use a group of examples, called a **batch**, to get one update that reflects several predictions. Put one example in each row of $X$. The vector $w$ holds the two weights, and $y$ holds one known answer per example. Here we leave out the bias. Subtract each answer from its prediction to get the vector of errors $r=Xw-y$. Let $n$ be the number of examples.

      1. **Make one error per row.** With inputs $(2,1)$ and $(3,2)$ and weights $(1,1)$, the predictions are 3 and 5. Both targets are 7.
         $$r=(3-7,\ 5-7)=(-4,-2).$$

      2. **Average the slopes for the first weight.** Each example contributes $2e\,x_1$, twice its first input times its error. Add those contributions and divide by the number of examples, $n=2$.
         $$\frac{2\times(-4)\times2+2\times(-2)\times3}{2}=-14.$$

      3. **Get both slopes at once.** In the matrices lesson, transposing a matrix turned its columns into rows. The product $X^\top r$ takes a dot product of each of those rows with the errors. Multiplying by 2 and dividing by $n$ gives the average of $2e\,x_j$ for each weight $w_j$. The result, $\nabla_w L$, is the vector of slopes for the weights.
         $$\nabla_w L=\frac{2X^\top r}{n}=\frac{2}{2}\begin{bmatrix}2&3\\1&2\end{bmatrix}\begin{bmatrix}-4\\-2\end{bmatrix}=\begin{bmatrix}-14\\-8\end{bmatrix}.$$

      4. **Update both weights.** Multiply each of the two slopes by the learning rate $0.05$ and subtract it from the matching weight. Write $w_{\text{new}}$ for the two updated weights.
         $w_{\text{new}}=(1,1)-0.05(-14,-8)=(1.7,1.4).$
