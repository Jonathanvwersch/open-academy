      - gd-downhill-update-basics
      - gdp-downhill-self-explain
      - gdp-positive-slope
      - gdp-one-weight-step
      - gdp-bowl-step-template
      - gdp-height-after-step
      - gdp-zero
      - gdp-robot-step
  - id: gd-step-size
    key_prereqs: [derivatives]
    title: "Choose how big each step is"

    tldr: |
      - A small learning rate makes slow progress.
      - A learning rate that is too large jumps past the bottom and can make the loss grow.
      - Steeper curves need smaller rates to stay safe.
      - In practice we watch the loss after each step and pick a rate that keeps it falling.
    explain: |
      ### Why the step size matters

      Why did we use a learning rate of only $0.1$? A bigger step might seem to reach the bottom sooner, so let's test that.

      ### Three step sizes on one curve

      Along $y=0$ the bowl is just $x^2$. Write it as a loss $f(w)=w^2$, with $w$ standing for a weight. Its slope is $2w$, so one step gives

      $$
      \begin{aligned}
      w_{\text{new}}&=w-\eta\times2w &&\text{subtract the scaled slope}\\
      &=(1-2\eta)\,w &&\text{factor out }w
      \end{aligned}
      $$

      So every step multiplies $w$ by $1-2\eta$. Each panel starts at $w=5$ and takes two steps.

