      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="238" y="96" text-anchor="end">example: x = 2, y = 7</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="262" y="236">prediction 3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="260" y="185.2" fill="#ef4444">error −4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="238" y="150" fill="#f59e0b" text-anchor="end">after one step: 5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="438" y="165" fill="#737373">start: ŷ = x + 1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="438" y="64.2" fill="#f59e0b">after: ŷ = 1.8x + 1.4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="492" y="305">x</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="78" y="16.6">output</text>
      </g>
      </svg>
      ```

      ### The slope of each weight

      If we nudge $w$ up by $0.01$, the prediction rises by $x$ times that. In the loss-functions lesson, we saw that the squared error's slope with respect to the prediction is $2e$, so we can estimate the loss change:
      $$
      \begin{aligned}
      \text{prediction change}&=2\times0.01=0.02 &&\text{input times weight nudge}\\
      2e&=2\times(-4)=-8 &&\text{loss slope for the prediction}\\
      \text{loss change}&\approx-8\times0.02=-0.16 &&\text{slope times prediction change}\\
      \text{weight slope}&\approx-0.16/0.01=-16 &&\text{divide by the weight nudge}\\
      2ex&=2\times(-4)\times2=-16 &&\text{identify the exact slope}
      \end{aligned}
      $$
      Nudging $b$ moves the prediction by the same amount as the nudge, so the bias's slope is just $2e$. For a model with several inputs, where $x_j$ is the $j$-th input and $w_j$ its weight, and $\partial L/\partial w_j$ means the slope of $L$ for $w_j$,

      $$\frac{\partial L}{\partial w_j}=2e\,x_j,\qquad\frac{\partial L}{\partial b}=2e.$$

      Each of these slopes is one entry of the gradient $\nabla L$, so we call it that parameter's gradient. With several examples and a mean squared error loss, we average each slope over the examples.

      The error's sign sets which way $w$ moves:

      | Example $(x,y)$ | $e$ | $\partial L/\partial w$ | $w$ moves |
      | --- | --- | --- | --- |
      | $(2,7)$ | $-4$ | $-16$ | up |
      | $(2,1)$ | $2$ | $8$ | down |
      | $(2,3)$ | $0$ | $0$ | not at all |

      Be careful not to read the biggest slope as the most wrong weight. In a model with several inputs, every weight's slope contains the same error $e$, so the weight on the biggest input gets the biggest slope, even though the mistake belongs to the whole prediction.
    worked: |
      Let's take the step that turns the grey line into the orange one. The model is $\hat y=wx+b$, starting from $w=1$ and $b=1$, with the example $x=2$, $y=7$ and a learning rate of $\eta=0.05$.

      1. **Predict.** We put the input into the model with the current weight and bias.
         $$\hat y=1\times2+1=3.$$

      2. **Find the error.** The error compares the prediction with the true output.
         $$e=\hat y-y=3-7=-4.$$

      3. **Find the weight's slope.** It's twice the error times the input.
         $$\frac{\partial L}{\partial w}=2ex=2\times(-4)\times2=-16.$$

      4. **Find the bias's slope.** It's just twice the error.
         $$\frac{\partial L}{\partial b}=2e=2\times(-4)=-8.$$

      5. **Update both.** Each one moves against its own slope, by $\eta$ times that slope.
         $$w_{\text{new}}=1-0.05\times(-16)=1.8,\qquad b_{\text{new}}=1-0.05\times(-8)=1.4.$$

      6. **Check the new loss.** We predict again with the new weight and bias.
         $$\hat y=1.8\times2+1.4=5,\qquad e=-2,\qquad L=4.$$

      The loss fell from $16$ to $4$, so the step helped, and the new model is the orange line, $\hat y=1.8x+1.4$.
