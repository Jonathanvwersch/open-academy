      - With $\eta=0.1$, $w$ creeps from $5$ to $4$ to $3.2$, and the loss falls slowly, from $25$ to $10.24$.
      - With $\eta=0.75$, $w$ jumps over the bottom to $-2.5$ and back to $1.25$, but the loss falls quickly, from $25$ to about $1.56$.
      - With $\eta=1.25$, $w$ jumps to $-7.5$ and then $11.25$, and the loss grows from $25$ to about $127$.

      A step that jumps past the bottom **overshoots**. If each overshoot lands further away, training **diverges**.

      ### The largest safe step size

      Each step multiplies $w$ by $1-2\eta$, so the distance from the bottom shrinks only if that multiplier lies between $-1$ and $1$. With $\eta$ positive, the multiplier is below $1$. For the other bound:
      $$
      \begin{aligned}
      1-2\eta&>-1 &&\text{keep the multiplier above minus one}\\
      2&>2\eta &&\text{add }1+2\eta\text{ to both sides}\\
      \eta&<1 &&\text{divide by two}
      \end{aligned}
      $$
      Together, these give $0<\eta<1$.

      Moving the bottom leaves this limit unchanged. For $L(w)=(w-3)^2$, expand the square to find its slope:
      $$
      \begin{aligned}
      L(w)&=(w-3)^2=w^2-6w+9 &&\text{expand the square}\\
      L'(w)&=2w-6 &&\text{take the slope term by term}\\
      &=2(w-3) &&\text{factor out two}
      \end{aligned}
      $$
      Now the same multiplier $1-2\eta$ applies to the offset $w-3$.

      The limit depends on how steep the curve is. Along the other direction of our bowl, $2y^2$, the slope is $4y$:
      $$
      \begin{aligned}
      y_{\text{new}}&=y-\eta\times4y &&\text{subtract the scaled slope}\\
      &=(1-4\eta)y &&\text{factor out }y\\
      1-4\eta&>-1 &&\text{bound the multiplier}\\
      2&>4\eta &&\text{add }1+4\eta\text{ to both sides}\\
      \eta&<0.5 &&\text{divide by four}
      \end{aligned}
      $$
      That's the limit for the whole bowl.

      ### Reading the loss curve

      For most models we can't work this out, so we watch a **loss curve**, a plot of the loss after each step. If it falls by only a sliver each step, the rate is probably too small, so we try a larger one. If it rises, the rate is too large.

      Be careful not to mistake swapping sides for failure. At $\eta=0.75$, $w$ swaps sides, yet the loss falls every step. The warning sign is a loss that goes up.
    worked: |
      Let's run two steps on $f(w)=w^2$, starting from $w=5$ with $\eta=0.75$, and watch what the loss does.

      1. **Find the multiplier.** Every step multiplies $w$ by $1-2\eta$, so we work that out first.
         $$1-2\eta=1-2\times0.75=-0.5.$$

      2. **Take the first step.** Subtracting $\eta$ times the slope $2w$ is the same as multiplying by $-0.5$.
         $$w=5-0.75\times(2\times5)=-0.5\times5=-2.5.$$

      3. **Take the second step.** We multiply by $-0.5$ again from where we landed.
         $$w=-0.5\times(-2.5)=1.25.$$

      4. **Read the loss after each step.** The loss is just $w^2$ at each point.
         $$f(5)=25,\quad f(-2.5)=6.25,\quad f(1.25)=1.5625.$$

      The loss falls on every step, so this rate works, even though $w$ changes sign each time.
