  - id: gd-price-gradients
    title: Work out the slopes from house-price errors
    explain: |
      Real training uses many sales, not one. Suppose you have two: a 100 m² house sold for £200,000 and a 200 m² house sold for £400,000. In the same scaled units, their input and target pairs are $(1,2)$ and $(2,4)$. **How do the two errors tell you which way to move the weight?** The obvious attempt is to average the errors. But that ignores a difference between the houses: when the weight changes, the bigger house's prediction changes twice as much.

      Keep the model $\hat y=wx$ without a bias. For one house with size $x$ and price $y$, expanding its squared error gives $w^2x^2-2wxy+y^2$. Treat $x$ and $y$ as fixed numbers. Differentiating with respect to $w$ gives $2wx^2-2xy=2x(wx-y)$.

      The **residual** $r_i=\hat y_i-y_i$ is just the prediction error for house $i$. For $n$ houses, average their slope contributions:

      $$\frac{\partial L}{\partial w}=\frac{2}{n}\sum_{i=1}^n x_i r_i.$$

      The partial-derivative symbol means the loss slope when you change this weight and keep anything else fixed. Each $x_i$ is a size and each $r_i$ its residual; the sum adds all houses.

      Why does this work? A weight nudge changes a house's prediction by that nudge times its size. Why this way? Multiplying by the input accounts for that extra sensitivity. A bias $b$ adds equally to every prediction, so its slope is twice the mean residual.
    worked: |
      This example shows one full weight update from the two sales.

      Start at $w=0$ and use rate $\eta=0.1$.

      1. Predictions: $0\times1=0$ and $0\times2=0$.
      2. Residuals: $0-2=-2$ and $0-4=-4$.
      3. Multiply by inputs: $1(-2)=-2$ and $2(-4)=-8$.
      4. Average doubled contributions: $(2/2)(-2-8)=-10$.
      5. Update: $w_{\text{new}}=0-0.1(-10)=1$; the subscript "new" means the value after the step.

      From $w=1$ instead, the residuals are −1 and −2, the slope is $(2/2)(-1-4)=-5$, and the next weight is $1-0.1(-5)=1.5$.

      Both steps increase the weight because both houses are underpriced.
    problems:
      [
        gdp-why-input-factor,
        gdp-gradient-template,
        gdp-data-step-template,
        gdp-feature-factor,
        gdp-average,
        gdp-bias-slope,
      ]
  - id: gd-training-loop
    title: Repeat prediction, error, slope and update
    explain: |
      One update moved the weight from 0 to 1, but the best weight is 2, so you need many updates. **Can you work out the slope once and reuse it?** No. After each update the predictions change, so the residuals change, and so does the slope. Reusing the first residuals would keep pushing as hard as at the start, even as the model gets close.

      A **training loop** repeats four jobs: predict, calculate errors, calculate slopes, then update the parameters. Why does this work? Recalculating slopes is like checking the tilt under your feet after moving down a curved hill: the old tilt no longer describes where you stand.

      Store the house inputs in matrix $X$, with one row per house and one column per feature. If there are $n$ houses and $d$ features, `X` has shape `(n, d)`, the weight vector `w` has shape `(d,)`, and the target array `y` has shape `(n,)`. The bias `b` is one number.

      In NumPy, `X @ w + b` predicts every price. Store residuals in array `r`. The transpose `X.T` turns columns into rows, so `X.T @ r` adds each feature times its residual over houses. Its shape is `(d,)`, one slope per weight. Dividing by `len(y)` averages over houses, not features. Why this way? Calculate all slopes before changing any parameter, so they all describe the same model. Check the loss after each step for divergence.
    worked: |
      This example shows a loop that handles every house at once with array operations, for the same two house sales, now allowing a bias.

      ```python
      import numpy as np
      X = np.array([[1.], [2.]])
      y = np.array([2., 4.])
      w = np.array([0.])
      b = 0.
      lr = 0.1  # learning rate
      steps = 20
      for step in range(steps):
          y_hat = X @ w + b
          r = y_hat - y
          dw = 2 * X.T @ r / len(y)
          db = 2 * r.mean()
          w = w - lr * dw
          b = b - lr * db
          new_r = X @ w + b - y
          print((new_r ** 2).mean())
      ```

      On the first step, `r` is `[-2, -4]`, `dw` is `[-10]` and `db` is $2(-2-4)/2=-6$. The new weight is 1 and the new bias is $0-0.1(-6)=0.6$.

      New predictions are $1+0.6=1.6$ and $2+0.6=2.6$. The loss falls from $(4+16)/2=10$ to $(0.16+1.96)/2=1.06$.

      Recompute the errors next time: both parameters have changed what the model predicts.
