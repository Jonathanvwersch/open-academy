      <path d="M604.17 255 v5" stroke="#737373"/><text x="604.17" y="275" text-anchor="middle" fill="#737373">10</text>
      <path d="M564.58 220.28 L465.62 176.88" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#gd2-amber)"/>
      <path d="M465.62 176.88 L614.06 79.22" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#gd2-amber)"/>
