final: gd-explain-training
summary: |
  - Gradient descent steps every input against its own slope: $\mathbf p_{\text{new}}=\mathbf p-\eta\nabla f(\mathbf p)$.
  - The learning rate sets the step size: too small is slow, too large overshoots and can make the loss grow.
  - For a linear model with squared error, each weight's slope is twice the error times its input, and the bias's slope is twice the error.
  - Training repeats predict, loss, gradient and update, recomputing the gradient every pass and watching the loss curve.

  **Next:** Training and evaluation splits show whether these updates help on examples the model has not seen.
