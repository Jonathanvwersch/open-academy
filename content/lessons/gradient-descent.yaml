      **The idea.** Keep stepping, and recompute everything from the current parameters each time. A **training loop** is the repeated cycle of prediction, loss, gradient and parameter update. The gradient must be recomputed every pass, because the slopes belong to the point where you stand. You stop after a fixed number of passes, or once a pass lowers the loss by only a tiny amount, say less than $0.1\%$ of its current value. A plot of the loss in each pass is a **loss curve**, the main way to check training: a steady fall is good, a fall that stays slow and steady from the start suggests a larger learning rate, and a rise suggests a smaller one.

      **Common confusion.** “The gradient is the direction to the answer, so I can compute it once and keep subtracting it.” No. It is the slope where you are standing, and it changes as you move. After the first step the error halves from $-4$ to $-2$, so the gradient halves too, from $(-16,-8)$ to $(-8,-4)$. Reusing the first gradient keeps every step full size, so by the third step the prediction is $9$, past the true $7$.
    worked: |
      This example runs the second pass of the loop for $\hat y=wx+b$ on the example $x=2$, $y=7$, with $\eta=0.05$. The first pass left $w=1.8$ and $b=1.4$.

      1. **Predict.**
         $$\hat y=1.8\times2+1.4=5.$$

      2. **Measure the error and loss.**
         $$e=5-7=-2,\qquad L=(-2)^2=4.$$

      3. **Find the slopes.**
         $$\frac{\partial L}{\partial w}=2(-2)(2)=-8,\qquad \frac{\partial L}{\partial b}=2(-2)=-4.$$

      4. **Update.**
         $$w=1.8-0.05\times(-8)=2.2,$$
         $$b=1.4-0.05\times(-4)=1.6.$$

      The same loop in Python, for four passes. `**` means "to the power", `range(1, 5)` counts passes $1$ to $4$, and `w, b = ..., ...` updates both from the old values at once. The indented lines repeat each pass, and `round(loss, 4)` rounds to $4$ decimal places.

      ```python
      x, y = 2.0, 7.0
      w, b = 1.0, 1.0
      lr = 0.05
      for step in range(1, 5):
          y_hat = w * x + b                # 1. predict
          e = y_hat - y                    # 2. error
          loss = e ** 2                    #    and loss
          dw, db = 2 * e * x, 2 * e        # 3. slopes
          w, b = w - lr * dw, b - lr * db  # 4. update
          print(step, round(loss, 4))
      # prints 1 16.0, 2 4.0, 3 1.0, 4 0.25
      ```

      **Compare cases.** Each pass, measured before its update, so the losses match what the code prints:

      | Pass | $w$ | $b$ | $\hat y$ | $e$ | $L$ | Slopes $(\partial L/\partial w,\ \partial L/\partial b)$ |
      | --- | --- | --- | --- | --- | --- | --- |
      | $1$ | $1$ | $1$ | $3$ | $-4$ | $16$ | $(-16,-8)$ |
      | $2$ | $1.8$ | $1.4$ | $5$ | $-2$ | $4$ | $(-8,-4)$ |
      | $3$ | $2.2$ | $1.6$ | $6$ | $-1$ | $1$ | $(-4,-2)$ |
      | $4$ | $2.4$ | $1.7$ | $6.5$ | $-0.5$ | $0.25$ | $(-2,-1)$ |

      The slopes shrink as the error shrinks, so the steps get smaller near the bottom on their own. With many examples that don't lie on one line, the single errors can't all reach $0$, but their averaged slopes still shrink toward $0$ near the best parameters.

      **Where it shows up.** Training a real model, such as the house-price model, runs this loop thousands of times, with each slope averaged over all the training examples. The loss curve is what you watch while it runs.
