concept: gradient-descent
version: 3
objective: |
  **Goal:** use the gradient to update every house-model parameter in a direction that lowers loss.
where_this_fits: |
  Gradients collected one loss slope for each weight and the bias. A gradient tells us which way loss rises fastest at the current parameters, but it does not itself change the model. Gradient descent takes a small step in the opposite direction, then recomputes the slopes at the new parameters.
knowledge_points:
  - id: gd-downhill-update
    title: Update the house model opposite its gradient
    explain: |
      **What gradient descent is.** Gradient descent repeatedly subtracts a scaled loss gradient from the model parameters.

      **How it works.** For $x=(12,3,20)$, $y=330$, $w=(25,10,-1)$ and $b=0$, the prediction is 310 and $\nabla L=(-480,-120,-800,-40)$. With learning rate $\eta=0.0001$, update weights and bias together:

      $$w'=w-\eta\nabla_w L=(25.048,10.012,-0.92),\qquad b'=b-\eta\frac{\partial L}{\partial b}=0.004.$$

      The new prediction is 312.216 and the loss falls from $400$ to $(312.216-330)^2=316.270656$. Why subtract the gradient? Its direction is steepest local increase, so the opposite points toward a local decrease.

      **Why this is useful.** This update gives a precise way to improve the same house-price model from its current prediction error.
    worked: |
      This example shows the calculation.
      Start with $L=(w\cdot x+b-y)^2$ and error $310-330=-20$, so the gradient is $(-480,-120,-800,-40)$.

      1. Multiply the weight slopes by $\eta$: $-0.0001(-480,-120,-800)=(0.048,0.012,0.08)$.
      2. Add that change to the weights: $w'=(25.048,10.012,-0.92)$.
      3. Update bias: $b'=0-0.0001(-40)=0.004$.
      4. Predict: $12(25.048)+3(10.012)+20(-0.92)+0.004=312.216$.
    problems:
      [
        gd-downhill-update-basics,
        gdp-why-negative-slope,
        gdp-step-template,
        gdp-positive-slope,
        gdp-zero,
        gdp-vector,
        gdp-repeat,
      ]
  - id: gd-step-size
    title: Keep the learning rate small enough
    explain: |
      **What the learning rate is.** The learning rate $\eta$ is the positive scale that sets how far each gradient-descent update moves.

      **How it works.** Each parameter changes by the learning rate times its own slope, so area and age weights move more than the bedroom weight. With $\eta=0.01$, the same update gives $w=(29.8,11.2,7)$ and $b=0.4$, prediction $531.6$, error $201.6$, and loss $201.6^2=40{,}642.56$, up from $400$. With $\eta=0.0001$, the KP1 update gives loss $316.270656\approx316.27$. The area-12 and age-20 features make their slopes large, so the larger rate overshoots and raises loss; a rate that is too small improves slowly.

      **Why this is useful.** Choosing a cautious rate prevents the large area- and age-feature slopes from destabilising house-price training.
    worked: |
      This example shows the calculation.
      The area and age contributions to the gradient are $-480$ and $-800$. Multiplying by the learning rate and subtracting gives changes $+0.048$ and $+0.08$. Their different sizes come from the different feature values.
    problems:
      [
        gd-step-size-basics,
        gdp-rate-choice,
        gdp-factor-template,
        gdp-threshold-template,
        gdp-loss-curve,
        gdp-slow,
        gdp-why-learning-rate,
      ]
  - id: gd-price-gradients
    title: Each feature sets its own weight slope
    explain: |
      **What a parameter gradient is.** It is the loss's partial derivative with respect to one adjustable weight or bias.

      **How it works.** For squared error $L=(w\cdot x+b-y)^2$, let $e=\hat y-y$. The partial-derivatives lesson found $\partial L/\partial w_j=2e x_j$ and $\partial L/\partial b=2e$. Thus the house with error $-20$ and features $(12,3,20)$ has weight slopes $(-480,-120,-800)$ and bias slope $-40$. The age slope has larger magnitude than the bedroom slope because its feature is 20, compared with 3 bedrooms.

      **Why this is useful.** The feature-scaled slopes tell training how each house measurement should change its own weight.
    worked: |
      This example shows the calculation.
      With $e=-20$ and $x=(12,3,20)$:

      - $\partial L/\partial w_1=2(-20)(12)=-480$.
      - $\partial L/\partial w_2=2(-20)(3)=-120$.
      - $\partial L/\partial w_3=2(-20)(20)=-800$.
      - $\partial L/\partial b=2(-20)=-40$.
    problems:
      [
        gd-price-gradients-basics,
        gdp-why-input-factor,
        gdp-gradient-template,
        gdp-data-step-template,
        gdp-feature-factor,
        gdp-average,
        gdp-bias-slope,
      ]
  - id: gd-training-loop
    title: Repeat prediction, loss, gradient and update
    explain: |
      **What a training loop is.** It is the repeated sequence of predicting, measuring loss, calculating gradients and updating parameters.

      **How it works.** For each pass over the training houses, compute current predictions and losses, find the average loss gradient, and apply one gradient-descent update. Then calculate new predictions from the changed parameters. Reusing the old gradient would move according to slopes at the wrong point because the updated weights define a different model with new errors and slopes.

      **Why this is useful.** Repeating this loop lets the house-price model improve across many observed sales rather than making a single adjustment.
    worked: |
      This example shows the calculation.
      After the first update, the prediction is 312.216 and the error is $-17.784$. The next gradient is $2(-17.784)(12,3,20,1)=(-426.816,-106.704,-711.36,-35.568)$, so the next pass must use fresh slopes.
    problems:
      [
        gd-training-loop-basics,
        gdp-loop-order,
        gdp-bias-step-template,
        gdp-code-gradient,
        gdp-code-update,
        gdp-why-fresh-errors,
        gdp-shape,
      ]
final: gd-explain-training
summary: |
  - Gradient descent subtracts a scaled gradient from every weight and the bias.
  - Large feature values can create large slopes, so the learning rate must keep updates controlled.
  - Training repeats prediction, loss, gradient and update with fresh values.

  **Next:** Training and test splits show whether these updates generalise to houses the model has not seen.
