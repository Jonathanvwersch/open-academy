  - id: gd-training-loop
    key_prereqs: [gradients, loss-functions, linear-regression]
    title: "Repeat until the loss stops falling"

    tldr: |
      - Training repeats four moves: predict, measure the loss, find the slopes and update.
      - The slopes change as the weights move, so we work them out again on every pass.
      - With a group of examples, we average the slopes for each weight before updating.
      - When the loss barely falls, we may be near the bottom of a dip.
    explain: |
      ### Repeating the step

      One step lowered our model's loss from $16$ to $4$, but not to $0$. So we take another step, and another, each one starting from the weight and bias that the last one left behind. Each time round is called a **pass**, and every pass does the same four things, shown on the left. On the right are the losses of our one-example model over four passes.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" aria-label="Left: the training loop as four boxes in a cycle, predict, error and loss, slopes, update w and b, with an arrow back to predict. Right: green bars of the loss at the start of each of four passes, 16, 4, 1 and 0.25">
      <defs><marker id="gd4-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="115" y="40" width="150" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="190" y="67" text-anchor="middle">1. Predict ŷ</text>
      <rect x="215" y="140" width="150" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="290" y="167" text-anchor="middle">2. Error and loss</text>
      <rect x="115" y="240" width="150" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="190" y="267" text-anchor="middle">3. Slopes</text>
      <rect x="15" y="140" width="150" height="44" rx="8" fill="#ffffff" stroke="#737373" stroke-width="1.5"/><text x="90" y="167" text-anchor="middle">4. Update w, b</text>
      <path d="M230 84 L280 138" stroke="#737373" stroke-width="2" marker-end="url(#gd4-muted)"/>
      <path d="M280 186 L230 238" stroke="#737373" stroke-width="2" marker-end="url(#gd4-muted)"/>
      <path d="M150 238 L100 186" stroke="#737373" stroke-width="2" marker-end="url(#gd4-muted)"/>
      <path d="M100 138 L150 84" stroke="#737373" stroke-width="2" marker-end="url(#gd4-muted)"/>
      <path d="M395 70 V290 H635" stroke="#737373" fill="#ffffff" fill-opacity="0"/>
      <rect x="415" y="80" width="36" height="210" fill="#10b981"/>
      <text x="433" y="72" text-anchor="middle">16</text><text x="433" y="310" text-anchor="middle" fill="#737373">1</text>
      <rect x="470" y="237.5" width="36" height="52.5" fill="#10b981"/>
      <text x="488" y="229.5" text-anchor="middle">4</text><text x="488" y="310" text-anchor="middle" fill="#737373">2</text>
      <rect x="525" y="276.88" width="36" height="13.12" fill="#10b981"/>
      <text x="543" y="268.88" text-anchor="middle">1</text><text x="543" y="310" text-anchor="middle" fill="#737373">3</text>
      <rect x="580" y="286.72" width="36" height="3.28" fill="#10b981"/>
      <text x="598" y="278.72" text-anchor="middle">0.25</text><text x="598" y="310" text-anchor="middle" fill="#737373">4</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="515" y="332" fill="#737373" text-anchor="middle">pass</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="395" y="35">loss at the start of each pass</text>
      </g>
      </svg>
      ```

      This cycle of predicting, measuring the loss, finding the slopes and updating is called a **training loop**. In our example the error halves on each pass, so the loss falls to a quarter, from $16$ to $4$ to $1$ to $0.25$.

      ### Work out the slopes again every pass

      The slopes belong to the point where we're standing, and that point moves. After the first step:
      $$
      \begin{aligned}
      e&=5-7=-2 &&\text{find the new error}\\
      2ex&=2\times(-2)\times2=-8 &&\text{recalculate the weight slope}\\
      2e&=2\times(-2)=-4 &&\text{recalculate the bias slope}
      \end{aligned}
      $$
      The error and slopes have halved, so the steps get smaller near the bottom on their own. Reusing the first slopes would keep adding $2$ to the prediction: $3$, $5$, $7$, $9$, $11$. It would sail straight past $7$ and keep going.

      ### When to stop

      We stop after a fixed number of passes, or once a pass barely lowers the loss, say by under $0.1\%$. Be careful not to confuse this with a loss that has crept down slowly from the start and is still high. That's the sign of a learning rate that's too small, not of being finished.

      ### Getting stuck in a dip

      When the loss stops falling, have we found the lowest point? Not always. Gradient descent only sees the slope where it stands, so it walks into the nearest dip and stops wherever the slope is $0$, even if a deeper dip lies somewhere else.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" aria-label="A loss curve with two dips. Gradient descent starts on the right, its orange steps roll into the nearer, shallower dip on the right and stop there, where the slope is 0. The deeper dip on the left, the lowest point, is never reached">
      <defs><marker id="gd5-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M30 325 H610" stroke="#d4d4d4"/>
      <path d="M44 122.14 50 143.07 56 162.02 62 179.09 68 194.38 74 207.98 80 220 86 230.51 92 239.62 98 247.4 104 253.94 110 259.32 116 263.62 122 266.92 128 269.3 134 270.82 140 271.56 146 271.59 152 270.98 158 269.78 164 268.06 170 265.88 176 263.3 182 260.36 188 257.14 194 253.67 200 250 206 246.18 212 242.26 218 238.27 224 234.26 230 230.25 236 226.3 242 222.42 248 218.66 254 215.03 260 211.56 266 208.28 272 205.22 278 202.37 284 199.78 290 197.44 296 195.38 302 193.59 308 192.1 314 190.9 320 190 326 189.4 332 189.1 338 189.09 344 189.38 350 189.94 356 190.78 362 191.87 368 193.22 374 194.78 380 196.56 386 198.53 392 200.66 398 202.92 404 205.3 410 207.75 416 210.26 422 212.77 428 215.26 434 217.68 440 220 446 222.17 452 224.14 458 225.86 464 227.3 470 228.38 476 229.06 482 229.28 488 228.98 494 228.09 500 226.56 506 224.32 512 221.3 518 217.42 524 212.62 530 206.82 536 199.94 542 191.9 548 182.62 554 172.01 560 160 566 146.48 572 131.38 578 114.59 584 96.02 590 75.57 596 53.14" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="2"/>
      <path d="M560 160 L539.6 195.26" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#gd5-amber)"/>
      <path d="M539.6 195.26 L526.55 210.28" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#gd5-amber)"/>
