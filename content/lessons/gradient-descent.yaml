  - id: gd-price-gradients
    key_prereqs: [loss-functions, linear-regression, partial-derivatives]
    title: "Work out which way to move each weight"

    tldr: |
      - A weight changes the loss only through the prediction it helps make.
      - With squared error, a weight's slope is twice the error times that weight's input.
      - The bias's slope is just twice the error.
      - The error's sign says whether each one should move up or down.
    explain: |
      ### Where the slopes come from

      A model's loss depends on its weights only through its predictions. So we ask how nudging a weight changes the prediction, and how that changes the loss.

      ### One model, one example

      Take the smallest model, with one input $x$, one weight $w$ and a bias $b$, which predicts $\hat y=wx+b$. We start with $w=1$ and $b=1$, the grey line in the picture.

      Our one training example is the black dot, $x=2$ with true output $y=7$. The **error** $e$ is the prediction minus the true output, and the loss $L$ is its square:
      $$
      \begin{aligned}
      \hat y&=1\times2+1=3 &&\text{predict}\\
      e&=\hat y-y=3-7=-4 &&\text{subtract the target}\\
      L&=e^2=(-4)^2=16 &&\text{square the error}
      \end{aligned}
      $$
      The prediction is $4$ too low, shown by the red gap.

