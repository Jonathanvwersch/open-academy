      <path d="M465.625 176.875 L614.062 79.219" stroke="#f59e0b" stroke-width="2.5" fill="#ffffff" fill-opacity="0" marker-end="url(#gd2-amber)"/>
      <circle cx="564.583" cy="220.278" r="4" fill="#171717"/>
      <circle cx="465.625" cy="176.875" r="4" fill="#171717"/>
      <circle cx="614.062" cy="79.219" r="4" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="525" y="30" text-anchor="middle">η = 1.25: blows up</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="525" y="300" fill="#737373" text-anchor="middle">w: 5 → −7.5 → 11.25</text>
      </g>
      </svg>
      ```

      - With $\eta=0.1$, $w$ creeps down one side, from $5$ to $4$ to $3.2$.
      - With $\eta=0.75$, it jumps over the bottom to $-2.5$, then back to $1.25$. Each landing is closer than the last.
      - With $\eta=1.25$, it jumps over to $-7.5$, then to $11.25$, and lands higher every time.

      A step that jumps past the bottom **overshoots**. If the overshoot is big enough, every step lands higher than the last, the loss keeps growing, and we say training **diverges**.

      ### Where the limit is

      For $f(w)=w^2$ we can work out exactly how big $\eta$ can be. The distance from the bottom, $|w|$, shrinks only when the multiplier is between $-1$ and $1$:

      $$-1<1-2\eta<1$$

      $$-2<-2\eta<0\quad\text{(subtract 1)}$$

      $$0<\eta<1\quad\text{(divide by }-2\text{, which flips the signs)}$$

      The limit depends on how steep the bowl is. For $2w^2$ the slope is $4w$, so each step multiplies $w$ by $1-4\eta$, and the limit drops to $\eta<0.5$. A real model's loss has no neat formula like this. So in practice you try a rate, watch the loss for a few passes, and use a smaller one if the loss rises.

      Be careful not to read the zigzag as failure. At $\eta=0.75$, $w$ swaps sides on every step, yet the loss still falls, from $25$ to $6.25$ to $1.5625$. The warning sign is a loss that goes up.
    worked: |
      Let's run two steps on $f(w)=w^2$, starting from $w=5$ with $\eta=0.75$, and watch what the loss does.

      1. **Find the multiplier.** Every step multiplies $w$ by $1-2\eta$, so we work that out first.
         $$1-2\eta=1-2(0.75)=-0.5.$$

      2. **Take the first step.** We subtract $\eta$ times the slope, $2w$, at $w=5$.
         $$w=5-0.75\times(2\times5)=5-7.5=-2.5.$$

      3. **Take the second step.** We do the same again from where we landed.
         $$w=-2.5-0.75\times(2\times(-2.5))=-2.5+3.75=1.25.$$

      4. **Read the loss after each step.** The loss is just $w^2$ at each point.
         $$f(5)=25,\quad f(-2.5)=6.25,\quad f(1.25)=1.5625.$$

      The loss keeps falling, so this rate works even though $w$ changes sign on every step.

      Here is the same experiment with five learning rates. Every run starts at $w=5$, where $f=25$.

      | $\eta$ | Multiplier $1-2\eta$ | $w$ over two steps | Loss over two steps | What you see |
      | --- | --- | --- | --- | --- |
      | $0.1$ | $0.8$ | $4,\ 3.2$ | $16,\ 10.24$ | slow, steady fall |
      | $0.5$ | $0$ | $0,\ 0$ | $0,\ 0$ | lands on the bottom |
      | $0.75$ | $-0.5$ | $-2.5,\ 1.25$ | $6.25,\ 1.5625$ | overshoots, settles |
      | $1$ | $-1$ | $-5,\ 5$ | $25,\ 25$ | bounces forever |
      | $1.25$ | $-1.5$ | $-7.5,\ 11.25$ | $56.25,\ 126.5625$ | diverges |

      When a model trains, the learning rate is the first setting to change if the loss falls too slowly or starts to rise. A steeper loss needs a smaller rate, just as $2w^2$ needs $\eta<0.5$ where $w^2$ allows anything below $1$.
