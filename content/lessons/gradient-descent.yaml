final: gd-explain-training
summary: |
  - Gradient descent walks downhill by moving every input against its slope, $\mathbf p_{\text{new}}=\mathbf p-\eta\,\nabla f(\mathbf p)$.
  - The learning rate $\eta$ sets the step size. Too small and training crawls; too large and the steps overshoot and the loss grows.
  - For a linear model with squared error, each weight's slope is twice the error times its input, $2e\,x_j$, and the bias's slope is $2e$.
  - Training repeats predict, loss, slopes and update, working the slopes out again on every pass, and the loss curve shows whether it's working.

  **Next:** Training and evaluation splits show whether these updates help on examples the model has not seen.
