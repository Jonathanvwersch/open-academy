      <circle cx="481.64" cy="229.28" r="5" fill="#f59e0b"/>
      <circle cx="143.24" cy="271.66" r="5" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="572" y="165">start</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="481.64" y="259.28" fill="#f59e0b" text-anchor="middle">stops here: slope 0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="143.24" y="301.66" fill="#10b981" text-anchor="middle">lowest point, never reached</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="605" y="320" fill="#737373" text-anchor="end">w</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="30" y="30">loss</text>
      </g>
      </svg>
