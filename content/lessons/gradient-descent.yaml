      **The idea.** Choose a learning rate big enough to make quick progress but small enough that every step lowers the loss. In practice: try a rate, watch the loss for some passes, and restart smaller if it rises. Too small, and the loss falls smoothly but slowly. Too large, and each step **overshoots**: it jumps past the bottom. A large overshoot lands higher than it started, so the loss grows every step: training **diverges**. For $f(w)=w^2$, the distance $|w|$ from the bottom shrinks only if the multiplier's size is below $1$:

      $$-1<1-2\eta<1$$

      $$-2<-2\eta<0\quad\text{(subtract 1)}$$

      $$0<\eta<1\quad\text{(divide by }-2\text{, which flips the signs)}$$

      How large is too large depends on how fast the slope grows: for the steeper bowl $2w^2$, the slope is $4w$, one step multiplies $w$ by $1-4\eta$, and the limit drops to $\eta<0.5$.

      **Common confusion.** “If $w$ jumps from one side of the bottom to the other, the learning rate is too big.” Only half right. At $\eta=0.75$, $w$ swaps sides every step, yet the loss still falls: $25$, then $6.25$, then $1.5625$. The warning sign is a loss that rises.
    worked: |
      This example runs two steps on $f(w)=w^2$ from $w=5$ with $\eta=0.75$, and reads the loss.

      1. **Find the multiplier.**
         $$1-2\eta=1-2(0.75)=-0.5.$$

      2. **Take the first step.**
         $$w=5-0.75\times(2\times5)=5-7.5=-2.5.$$

      3. **Take the second step.**
         $$w=-2.5-0.75\times(2\times(-2.5))=-2.5+3.75=1.25.$$

      4. **Read the loss after each step.**
         $$f(5)=25,\quad f(-2.5)=6.25,\quad f(1.25)=1.5625.$$

      The loss falls, so this rate works even though $w$ changes sign.

      **Compare cases.** Every run starts at $w=5$, where $f=25$.

      | $\eta$ | Multiplier $1-2\eta$ | $w$ over two steps | Loss over two steps | What you see |
      | --- | --- | --- | --- | --- |
      | $0.1$ | $0.8$ | $4,\ 3.2$ | $16,\ 10.24$ | slow, steady fall |
      | $0.5$ | $0$ | $0,\ 0$ | $0,\ 0$ | lands on the bottom |
      | $0.75$ | $-0.5$ | $-2.5,\ 1.25$ | $6.25,\ 1.5625$ | overshoots, settles |
      | $1$ | $-1$ | $-5,\ 5$ | $25,\ 25$ | bounces forever |
      | $1.25$ | $-1.5$ | $-7.5,\ 11.25$ | $56.25,\ 126.5625$ | diverges |

      **Where it shows up.** When a model trains, $\eta$ is the first setting to change if its loss falls too slowly or starts to rise. A steeper loss needs a smaller rate, just as $2w^2$ needs $\eta<0.5$ where $w^2$ allows $\eta<1$.
