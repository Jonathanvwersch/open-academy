concept: gradient-descent
version: 2
objective: |
  **Goal:** take gradient-descent steps by hand, choose and diagnose a learning rate, and implement a loop that fits a linear house-price model.
why: |
  Your house-price model predicts too little for the houses in its training data. You can measure its loss, but how should you change its weights to make the prices better? Trying a grid of values works for one weight, but with ten choices for each weight, every extra weight multiplies the number of combinations by ten. Random nudges also spend trials moving uphill. Gradient descent uses the current loss slopes to choose a downhill step, then repeats from the new setting. This turns fitting a model into a repeatable calculation rather than a search through every possible setting. Later, stochastic and minibatch gradient descent make these updates practical on large datasets, momentum and Adam refine the step, and backpropagation supplies the slopes for neural networks.
knowledge_points:
  - id: gd-downhill-update
    title: Change the price weight in the downhill direction
    explain: |
      You have a house-price model, but its current weight gives poor prices. **How should you change the weight?** The obvious attempt is to try many weights and keep the best, but every trial costs a loss calculation, and the number of trials explodes once there are many weights. You need a repeatable way to improve the current setting using the slope of its loss.

      For one 100 m² house sold for £300,000, measure size in hundreds of square metres and price in hundreds of thousands of pounds. The input is $x=1$, the target is $y=3$, and the model predicts $\hat y=wx$ with adjustable weight $w$ and no bias. Its squared-error loss is $L(w)=(w-3)^2$, where $L$ names the loss. The derivative $L'(w)=2(w-3)$ tells you which way increases loss.

      **Gradient descent** moves the other way. The **learning rate** $\eta$ ("eta") scales the step. Here $t$ counts updates, $w_t$ is the current weight and $w_{t+1}$ is the next one:

      $$w_{t+1}=w_t-\eta L'(w_t).$$

      A negative slope makes the weight increase; a positive slope makes it decrease. Why does this work? A slope describes the curve's local tilt, so moving against that tilt takes you down rather than up, provided the step is small enough.

      With several parameters collected in $\theta$ ("theta"), use their gradient $\nabla L(\theta)$, the vector of loss slopes:

      $$\theta\leftarrow\theta-\eta\nabla L(\theta).$$

      The arrow means "replace with". Why this way? One slope calculation gives the downhill direction for every weight at once, whereas trial nudges need extra loss calculations for each weight.
    worked: |
      This example shows three updates improving the price of the same house.

      Start at $w_0=0$ with $\eta=0.25$.

      | Update | Current slope | Next weight | New loss |
      |---|---|---|---|
      | 1 | $2(0-3)=-6$ | $0-0.25(-6)=1.5$ | $(1.5-3)^2=2.25$ |
      | 2 | $2(1.5-3)=-3$ | $1.5-0.25(-3)=2.25$ | $(2.25-3)^2=0.5625$ |
      | 3 | $2(2.25-3)=-1.5$ | $2.25-0.25(-1.5)=2.625$ | $(2.625-3)^2=0.140625$ |

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" aria-label="Three gradient-descent steps move down a loss curve towards the best price weight of 3">
        <path d="M50 25 V220 H565" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="2"/>
        <path d="M80 45 Q280 382 480 45" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="3"/>
        <path d="M80 45 L180 172 L230 204 L255 212" fill="#171717" fill-opacity="0" stroke="#10b981" stroke-width="3"/>
        <circle cx="80" cy="45" r="5" fill="#10b981"/><circle cx="180" cy="172" r="5" fill="#10b981"/><circle cx="230" cy="204" r="5" fill="#10b981"/><circle cx="255" cy="212" r="5" fill="#10b981"/>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text x="10" y="18">Loss</text><text x="84" y="35">Start: 0</text><text x="110" y="158">1.5</text><text x="189" y="195">2.25</text><text x="274" y="197">2.625</text><text x="267" y="241">3: best weight</text><text x="495" y="241">Weight</text>
        </g>
      </svg>
      ```

      Each update halves the distance to the best weight, so the predictions approach the actual price.
    problems:
      [
        gdp-why-negative-slope,
        gdp-step-template,
        gdp-positive-slope,
        gdp-zero,
        gdp-vector,
        gdp-repeat,
      ]
  - id: gd-step-size
    title: Choose a step that gets closer rather than overshooting
    explain: |
      Three updates still left the weight short of 3. **Why not take bigger steps to get there faster?** The slope only describes the loss near the current weight, so a big step can jump past the best weight and land with a larger error. The learning rate decides how far you trust it.

      Successive weights are called **iterates**. They **converge** when they approach the best weight, written $w^\star$ ("w star"). They **diverge** when they move farther away.

      For a bowl-shaped loss $L(w)=a(w-w^\star)^2$, the positive number $a$ controls how steep the bowl is. Our house example has $a=1$ and $w^\star=3$.

      Substitute its slope $2a(w-w^\star)$ into the update and subtract the best weight from both sides:

      $$w_{t+1}-w^\star=(1-2a\eta)(w_t-w^\star).$$

      Why does this work? Each update multiplies the gap to the best weight by the same factor, $1-2a\eta$. A negative factor means you jumped to the other side of the bottom, which is fine as long as the gap got smaller:

      - Between 0 and 1: approach from the same side, called **monotonic** approach.
      - Between −1 and 0: cross sides but get closer, called **damped oscillation**.
      - Magnitude greater than 1: get farther away and diverge.

      Thus $0<\eta<1/(2a)$ approaches monotonically; $1/(2a)<\eta<1/a$ oscillates but converges. At $\eta=1/(2a)$ this exact bowl reaches the minimum in one step; at $\eta=1/a$ it keeps crossing without improving unless already at the minimum.

      Why this way? Scaling by the slope makes steps shrink as this bowl flattens near its minimum.
    worked: |
      This example shows why crossing the best house-price weight is not always a failure.

      Use $L(w)=(w-3)^2$, starting at 0.

      | Rate | First weight | Second weight | Losses, including start |
      |---|---|---|---|
      | 0.1 | $0-0.1(-6)=0.6$ | $0.6-0.1(-4.8)=1.08$ | $9,\ 5.76,\ 3.6864$ |
      | 0.75 | $0-0.75(-6)=4.5$ | $4.5-0.75(3)=2.25$ | $9,\ 2.25,\ 0.5625$ |
      | 1.1 | $0-1.1(-6)=6.6$ | $6.6-1.1(7.2)=-1.32$ | $9,\ 12.96,\ 18.6624$ |

      Read a **loss curve** as loss plotted against update count: a smooth fall shows progress, a plateau shows little change, and rapidly growing loss suggests an unstable rate. A plateau alone does not prove the rate is too small; you might already be near the minimum. Exploding calculations can reach NaN, meaning "not a number".

      Crossing the minimum can still improve loss; crossing with increasing distance is the warning sign.
    problems:
      [
        gdp-rate-choice,
        gdp-factor-template,
        gdp-threshold-template,
        gdp-loss-curve,
        gdp-slow,
        gdp-why-learning-rate,
