concept: gradient-descent
version: 4
objective: |
  **Goal:** train a model with gradient descent: step every parameter against its loss slope, choose a learning rate that neither crawls nor blows up, and repeat the loop while the loss falls.
where_this_fits: |
  A model starts with poor weights and has to improve them from data. The gradients lesson showed that $-\nabla f$ points the way a function falls fastest, but a direction alone doesn't change any weights. You still need to decide how far to move, how to get the gradient of a model's loss, and what to do after the first move. This lesson turns that direction into **gradient descent**, the method that trains most machine-learning models, in four steps:

  1. Step every input of a function, such as a model's weight, against its slope.
  2. Choose how big each step is.
  3. Get the slopes from a model's error.
  4. Repeat the step in a loop while the loss falls.
knowledge_points:
  - id: gd-downhill-update
    title: Step against the gradient
    explain: |
      **The question.** The gradients lesson ended with a direction: $-\nabla f$ is the steepest way down. Knowing a direction doesn't move you, though. Standing at a point, how do you turn it into an actual move to a lower point?

      **Picture it.** Go back to the bowl $f(x,y)=x^2+2y^2$, seen from above as a contour map: each ring joins points of equal height, and outer rings are higher. At $P=(1.5,1)$ the height is $4.25$ and the gradient is $(3,4)$, the blue arrow pointing uphill. The amber arrow is the move: the gradient reversed and shrunk to a tenth, $-0.1\times(3,4)=(-0.3,-0.4)$. It lands at $(1.2,0.6)$, on a lower ring, where the height is $2.16$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" aria-label="Contour map of the bowl x squared plus 2y squared seen from above. From P at (1.5, 1) on the height-4.25 ring, the blue gradient arrow (3, 4) points uphill and the amber step, minus 0.1 times the gradient, goes the opposite way to (1.2, 0.6) on the lower height-2.16 ring">
      <defs><marker id="gd1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="gd1-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <ellipse cx="230" cy="220" rx="110" ry="77.782" fill="#ffffff" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
      <ellipse cx="230" cy="220" rx="161.666" ry="114.315" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="2.25"/>
      <ellipse cx="230" cy="220" rx="226.771" ry="160.351" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="2.25"/>
      <path d="M-20 220 H490 M230 395 V45" stroke="#d4d4d4" fill="#ffffff" fill-opacity="0"/>
      <path d="M395 110 l48 -64" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#gd1-blue)"/>
      <path d="M395 110 L362 154" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#gd1-amber)"/>
      <circle cx="395" cy="110" r="4.5" fill="#171717"/>
      <circle cx="362" cy="154" r="4.5" fill="#171717"/>
      <circle cx="230" cy="220" r="3.5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="409" y="106">P = (1.5, 1), height 4.25</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="348" y="180" text-anchor="end">new point (1.2, 0.6), height 2.16</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="451" y="50" fill="#3b82f6">∇f(P) = (3, 4), uphill</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="378" y="168" fill="#f59e0b">step −0.1∇f = (−0.3, −0.4)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="222" y="242" text-anchor="end">lowest point</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="496" y="225">x</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="236" y="42">y</text>
      </g>
      </svg>
      ```

      **The idea.** Take a small step in the direction opposite the gradient, then repeat from where you land. For a model, the inputs of the loss are its weights and bias. Each input moves against its own slope: an input with a positive slope goes down, one with a negative slope goes up. This method is **gradient descent**. Write $\mathbf p$ for the current point, the list of all the inputs. One step of gradient descent is

      $$\mathbf p_{\text{new}}=\mathbf p-\eta\,\nabla f(\mathbf p).$$

      Here $\eta$ (the Greek letter eta) is a small positive number called the **learning rate**. It sets how big each step is; the next part is about choosing it.

      **Common confusion.** “The gradient tells me where to go, so shouldn't I add it?” No. The gradient points uphill, so adding it climbs: $(1.5,1)+0.1\times(3,4)=(1.8,1.4)$ has height $7.16$, higher than $4.25$. Descent subtracts.
    worked: |
      This example takes one gradient-descent step on the bowl $f(x,y)=x^2+2y^2$ from $P=(1.5,1)$ with learning rate $\eta=0.1$.

      1. **Find the gradient at $P$.**
         $$\nabla f(P)=(2x,4y)=(2(1.5),4(1))=(3,4).$$

      2. **Scale it by the learning rate.**
         $$\eta\,\nabla f(P)=0.1\times(3,4)=(0.3,0.4).$$

      3. **Subtract it from $P$.**
         $$P_{\text{new}}=(1.5,1)-(0.3,0.4)=(1.2,0.6).$$

      4. **Check that the height fell.**
         $$f(1.2,0.6)=1.2^2+2(0.6)^2=1.44+0.72=2.16.$$

      The height fell from $4.25$ to $2.16$.

      **Compare cases.** Three moves of the same length, $0.5$, from $P$:

      | Move from $P$ | New point | Height | Change |
      | --- | --- | --- | --- |
      | subtract $0.1\nabla f(P)$ | $(1.2,0.6)$ | $2.16$ | $-2.09$ |
      | add $0.1\nabla f(P)$ | $(1.8,1.4)$ | $7.16$ | $+2.91$ |
      | at right angles to $\nabla f$, $(0.4,-0.3)$ | $(1.9,0.7)$ | $4.59$ | $+0.34$ |

      **Where it shows up.** For a model, the inputs are its weights and bias, and the height is its training loss $L$. One update subtracts $\eta$ times each parameter's loss slope from that parameter, all at the same time.
