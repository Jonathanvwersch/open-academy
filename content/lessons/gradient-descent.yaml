concept: gradient-descent
version: 4
objective: |
  **Goal:** train a model with gradient descent: step every weight against its slope, choose a learning rate that works, and repeat until the loss stops falling.
where_this_fits: |
  Gradient descent is the method most machine-learning models use to learn. It finds the weights that make a model's loss as small as possible, by starting somewhere and repeatedly taking a small step downhill.

  Why not just work the answer out? For a simple function we can, with algebra, but a real model has thousands of weights and no neat formula for its lowest point. Gradient descent only needs the slope where we're standing.

  What we're building to:

  - Each step moves every weight a little in the direction that lowers the loss.
  - The learning rate sets the step size: too small is slow, too large overshoots.
  - Each weight's slope comes from the model's error.
  - Training repeats the step until the loss stops falling.
knowledge_points:
  - id: gd-downhill-update
    title: "Take one step downhill"
    explain: |
      ### Walking downhill

      Think of the loss as the height of the ground, with one direction on the ground for each weight. In the gradients lesson, we found that the gradient points the way the height rises fastest. So to go down, we walk the opposite way, $-\nabla f$.

      One step of that walk is simple. We work out the gradient where we're standing, then take a small step in the opposite direction. From wherever we land, we do it again. This is **gradient descent**.

      ### One step on a bowl

      Let's try it on the bowl $f(x,y)=x^2+2y^2$, seen from above. Each ring joins points at the same height, and the outer rings are higher.

      We start at $P=(1.5,1)$, where the height is $4.25$. The gradient there is $(3,4)$, the blue arrow, and it points uphill. We go the other way, and take only a tenth of the gradient so that the step stays small. That gives $(-0.3,-0.4)$, the orange arrow.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" aria-label="Contour map of the bowl x squared plus 2y squared seen from above. From P at (1.5, 1) on the height-4.25 ring, the blue gradient arrow (3, 4) points uphill and the amber step, minus 0.1 times the gradient, goes the opposite way to (1.2, 0.6) on the lower height-2.16 ring">
      <defs><marker id="gd1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="gd1-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <ellipse cx="230" cy="220" rx="110" ry="77.782" fill="#ffffff" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
      <ellipse cx="230" cy="220" rx="161.666" ry="114.315" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="2.25"/>
      <ellipse cx="230" cy="220" rx="226.771" ry="160.351" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="2.25"/>
      <path d="M-20 220 H490 M230 395 V45" stroke="#d4d4d4" fill="#ffffff" fill-opacity="0"/>
      <path d="M395 110 l48 -64" stroke="#3b82f6" stroke-width="3.5" marker-end="url(#gd1-blue)"/>
      <path d="M395 110 L362 154" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#gd1-amber)"/>
      <circle cx="395" cy="110" r="4.5" fill="#171717"/>
      <circle cx="362" cy="154" r="4.5" fill="#171717"/>
      <circle cx="230" cy="220" r="3.5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="409" y="106">P = (1.5, 1), height 4.25</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="348" y="180" text-anchor="end">new point (1.2, 0.6), height 2.16</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="451" y="50" fill="#3b82f6">∇f(P) = (3, 4), uphill</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="378" y="168" fill="#f59e0b">step −0.1∇f = (−0.3, −0.4)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="222" y="242" text-anchor="end">lowest point</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="496" y="225">x</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="236" y="42">y</text>
      </g>
      </svg>
      ```

      We land at $(1.2,0.6)$, on a lower ring, where the height is $2.16$. The step took us downhill.

      ### The update rule

      We call the point we're standing at $\mathbf p$, which is the list of all the inputs. One step of gradient descent is

      $$\mathbf p_{\text{new}}=\mathbf p-\eta\,\nabla f(\mathbf p).$$

      The Greek letter $\eta$ (eta) is the **learning rate**. It's a small positive number that sets how big the step is, and on the bowl it was $0.1$. For a model, $\mathbf p$ is all of its weights and its bias, and $f$ is its training loss $L$, so one step changes every weight at once.

      Looking at one input at a time makes the rule easy to remember. If an input's slope is positive, raising that input raises the height, so the step lowers it. If the slope is negative, the step raises it.

      Be careful with the sign, because the minus is what sends us downhill. If we added a tenth of the gradient instead, we'd land at $(1.8,1.4)$, where the height is $7.16$, higher than where we started.
    worked: |
      Let's take that step carefully, on the same bowl, starting from $P=(1.5,1)$ with a learning rate of $\eta=0.1$.

      1. **Find the gradient at $P$.** The slopes of $x^2+2y^2$ are $2x$ and $4y$, so we put in $x=1.5$ and $y=1$.
         $$\nabla f(P)=(2x,4y)=(2(1.5),4(1))=(3,4).$$

      2. **Scale it by the learning rate.** Multiplying by $\eta$ shrinks the gradient to the size of step we want.
         $$\eta\,\nabla f(P)=0.1\times(3,4)=(0.3,0.4).$$

      3. **Subtract it from $P$.** Subtracting, rather than adding, is what sends us downhill.
         $$P_{\text{new}}=(1.5,1)-(0.3,0.4)=(1.2,0.6).$$

      4. **Check that the height fell.** We put the new point back into $f$.
         $$f(1.2,0.6)=1.2^2+2(0.6)^2=1.44+0.72=2.16.$$

      The height fell from $4.25$ to $2.16$, so the step took us downhill.

      To see why the direction matters, here are three moves of the same length, $0.5$, all starting from $P$. Only the move against the gradient goes downhill. Moving at right angles to the gradient hardly changes the height at first, and here it ends up a little higher because the bowl curves upward.

      | Move from $P$ | New point | Height | Change |
      | --- | --- | --- | --- |
      | subtract $0.1\nabla f(P)$ | $(1.2,0.6)$ | $2.16$ | $-2.09$ |
      | add $0.1\nabla f(P)$ | $(1.8,1.4)$ | $7.16$ | $+2.91$ |
      | at right angles to $\nabla f$, $(0.4,-0.3)$ | $(1.9,0.7)$ | $4.59$ | $+0.34$ |

