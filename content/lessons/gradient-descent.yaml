final: gd-explain-training
summary: |
  - Gradient descent finds a low point by stepping against the gradient again and again: $\mathbf p_{\text{new}}=\mathbf p-\eta\,\nabla f(\mathbf p)$.
  - The learning rate $\eta$ sets the step size. Too small and the loss falls slowly; too large and the steps overshoot until the loss grows, so we watch the loss curve and adjust.
  - For a linear model with squared error, each weight's slope is twice the error times its input, $2e\,x_j$, and the bias's slope is $2e$. With a batch, we average the slopes over the examples.
  - A training loop repeats predict, loss, slopes and update, working the slopes out again on every pass, and stops when the loss stops falling, which may be in a dip that isn't the lowest.

  **Next:** The training and evaluation splits lesson checks whether a model trained this way also does well on examples it has never seen.
