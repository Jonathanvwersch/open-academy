      <path d="M110 195 V83 M260 415 V303" stroke="#f59e0b" stroke-width="3" marker-end="url(#det-area-orange)"/>
      <text x="176" y="202" fill="#3b82f6">(2, 0)</text><text x="122" y="73" fill="#f59e0b">(0, 4)</text>
      <text x="104" y="424" fill="#3b82f6">(−2, 0)</text><text x="274" y="296" fill="#f59e0b">(0, 4)</text>
      <text x="192" y="139" fill="#10b981">area 8</text><text x="124" y="359" fill="#10b981">area 8</text>
      <text x="200" y="235" text-anchor="middle">Right then up: counterclockwise</text>
      <text x="200" y="275" text-anchor="middle">Stretch and flip</text>
      <text x="200" y="458" text-anchor="middle">Left then up: clockwise</text>
      <text x="200" y="500" text-anchor="middle">Half-turn: order stays the same</text>
      <path d="M145 570 H310 M230 625 V515" stroke="#d4d4d4"/>
      <rect x="202" y="570" width="28" height="28" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2"/>
      <rect x="230" y="542" width="28" height="28" fill="#737373" fill-opacity="0.08" stroke="#737373" stroke-width="1.5" stroke-dasharray="4 3"/>
