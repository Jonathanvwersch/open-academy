      ### Area with a sign

      In two dimensions, the **determinant**, written $\det(A)$, is the signed area scale of a $2\times2$ matrix. Its magnitude, $|\det(A)|$, multiplies the area of every region. The bars mean take the size while ignoring the sign.

      Why does one square tell us about other shapes? A linear transformation treats every part of a grid the same way. Cover a region with tiny squares: each square gets the same area factor, so their combined area does too.

      The sign records **orientation**. Turn from the original rightward edge towards the upward edge: that is counterclockwise. After the map, take the same ordered pair of edges. A positive determinant keeps that counterclockwise order; a negative one reverses it to clockwise.

      Be careful with a negative determinant. The area is positive; the minus sign records the reversed orientation. A positive determinant can still turn vectors: a half-turn sends right to left and up to down while preserving their counterclockwise order.
    worked: |
      Let's find the signed area scale for $A=\begin{bmatrix}2&0\\0&4\end{bmatrix}$ and then change its first entry to $-2$.

      1. **Find the output area.** The unit square becomes a rectangle of width 2 and height 4.
         $$\text{output area}=2\times4=8$$

      2. **Check the order of the edges.** The first edge points right and the second up, so their order stays counterclockwise.
         $$\det(A)=8$$

      3. **Flip the first edge.** Changing 2 to $-2$ sends the first edge left. The width stays 2, while the order becomes clockwise.
         $$\det\!\begin{pmatrix}-2&0\\0&4\end{pmatrix}=-8$$

      Both maps multiply area by 8; their signs tell us which one flips the picture.
