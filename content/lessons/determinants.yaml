concept: determinants
version: 1
objective: |
  **Goal:** calculate a 2×2 determinant, explain its size and sign as area scaling and orientation, and use zero to recognise when a square matrix loses information.
recap:
  - concept: matrices
    text: "Multiplying a matrix by a vector takes one dot product per row. For a two-entry input, $\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}\\begin{bmatrix}x\\\\y\\end{bmatrix}=\\begin{bmatrix}ax+by\\\\cx+dy\\end{bmatrix}$."
where_this_fits: |
  ### What is a determinant?

  A determinant is a number that measures how much a matrix changes area or volume, with a sign that records a mirror flip. It belongs to a **square matrix**, which has the same number of rows and columns. We'll work with $2\times2$ matrices and flat pictures, so the size of the determinant tells us how much areas grow or shrink.

  Matrix multiplication already lets us calculate where each point goes. The determinant answers a question about the whole picture: does it cover more area, turn over, or collapse? That last case matters when we want to recover an input from an output, because a collapse can erase information.

knowledge_points:
  - id: det-area-orientation
    title: "Measure changes to a square"
    tldr: |
      - A matrix can stretch or flip a square into a new shape.
      - The size of the determinant tells you what number the area is multiplied by.
      - A negative determinant also tells you the shape has flipped.
    explain: |
      ### Moving a square with a matrix

      A matrix can move every point in a picture. Write a point as $(x,y)$, with $x$ measuring rightwards and $y$ upwards from the origin, $(0,0)$. Multiplication by a $2\times2$ matrix gives its new coordinates. This is a **linear transformation**: it keeps the origin fixed and sends straight, evenly spaced grid lines to straight, evenly spaced lines, unless it collapses them.

      Draw a **unit square** with corners $(0,0)$, $(1,0)$, $(1,1)$ and $(0,1)$. Each side has length 1.

      Try $A=\begin{bmatrix}2&0\\0&4\end{bmatrix}$. It sends the rightward unit vector $(1,0)$ to column 1, $(2,0)$, and the upward unit vector $(0,1)$ to column 2, $(0,4)$. More generally, the output for $(x,y)$ is $x$ times column 1 plus $y$ times column 2. The square's fourth corner is $(1,1)$, so:
      $$
      \begin{aligned}
      A\begin{bmatrix}1\\1\end{bmatrix}&=1\begin{bmatrix}2\\0\end{bmatrix}+1\begin{bmatrix}0\\4\end{bmatrix} &&\text{use one copy of each column}\\
      &=\begin{bmatrix}2\\4\end{bmatrix} &&\text{add the columns}
      \end{aligned}
      $$
      The origin stays fixed, so we know where all four corners go.

      In the picture, the grey dashed square has area 1. Its blue first edge and orange second edge become the sides of a rectangle, 2 units across and 4 up.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 660" aria-label="Three maps of the unit square. First: the first edge goes right 2 and the second goes up 4, making a rectangle of area 8 and keeping their counterclockwise order. Second: the first edge goes left 2 and the second up 4, making area 8 but reversing the order to clockwise. Third: a half-turn sends right to left and up to down; their order stays counterclockwise." font-family="ui-sans-serif, system-ui, sans-serif">
