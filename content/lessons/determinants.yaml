      ### The two products

      For a general $2\times2$ matrix, name the top row's entries $a,b$ and the bottom row's entries $c,d$:

      $$A=\begin{bmatrix}a&b\\c&d\end{bmatrix}$$

      Its determinant comes from two products. Multiply the top-left entry by the bottom-right entry, then subtract the product of the other diagonal:

      $$\det(A)=ad-bc$$

      For positive $a,d$ with $b=c=0$, this is width times height. In our picture, the enclosing rectangle has width $a+b$ and height $c+d$. Two matching triangles cover a rectangle with the same base and height. Remove the top and bottom pair, then the side pair:

      $$
      \begin{aligned}
      \text{enclosing area}&=(a+b)(c+d) &&\text{width times height}\\
      \text{top and bottom area}&=c(a+b) &&\text{base times height for the pair}\\
      \text{side area}&=b(c+d) &&\text{base times height for the pair}\\
      \text{green area}&=(a+b)(c+d)-c(a+b)-b(c+d) &&\text{remove both pairs}\\
      &=ac+ad+bc+bd-(ac+bc)-(bc+bd) &&\text{expand the products}\\
      &=ad+bc-2bc &&\text{cancel }ac\text{ and }bd\\
      &=ad-bc &&\text{combine the remaining terms}
      \end{aligned}
      $$

      The terms $ac$ and $bd$ cancel; removing two copies of $bc$ from one leaves $-bc$. This picture preserves orientation, so its area is its determinant. Swapping columns reverses the edge order and changes the formula to $bc-ad$, reversing the sign.

      Be careful to subtract the second product. Adding it can give the wrong area and even the wrong sign.

      ### Which matrices this rule fits

      Determinants belong to square matrices, which have the same number of rows and columns; a $2\times3$ matrix has no determinant. The $ad-bc$ formula works for every $2\times2$ matrix, including negative entries. Larger square matrices also have determinants, but need a different calculation.
    worked: |
      Let's find the area of the green image of the unit square for $A=\begin{bmatrix}3&1\\1&2\end{bmatrix}$, then check the diagonal rule.

      1. **Find the enclosing area.** The far corner is $(4,3)$, so the enclosing rectangle is 4 wide and 3 high.
         $$\text{enclosing area}=4\times3=12$$

      2. **Count the outside triangles.** Each triangle covers half a rectangle with the same base and height. Find the areas before adding all four.
         $$
         \begin{aligned}
         \text{each top or bottom triangle}&=4\times1/2 &&\text{halve base times height}\\
         &=2 &&\text{work out the area}\\
         \text{each side triangle}&=3\times1/2 &&\text{halve base times height}\\
         &=1.5 &&\text{work out the area}\\
         \text{outside area}&=2+2+1.5+1.5 &&\text{add all four triangles}\\
         &=7 &&\text{work out the sum}
         \end{aligned}
         $$

      3. **Keep the green area.** Remove the grey triangles, which are outside the transformed square.
         $$\text{output area}=12-7=5$$

      4. **Check from the entries.** The diagonal rule gives the same result, and its positive sign keeps the orientation.
         $$\det(A)=3\times2-1\times1=5$$

      5. **Swap the columns.** This keeps the same parallelogram but reverses the order of its edges, so its determinant becomes negative.
         $$\det\!\begin{pmatrix}1&3\\2&1\end{pmatrix}=1\times1-3\times2=-5$$

      The map multiplies every area by 5. The two-product formula saves us drawing and subtracting the outside pieces each time.

