      <g font-size="18" fill="#171717">
      <text x="200" y="28" text-anchor="middle">Stretch</text>
      <path d="M90 195 H300 M110 215 V60 M140 415 H320 M260 435 V285" stroke="#d4d4d4"/>
      <path d="M110 195 L166 195 L166 83 L110 83 Z M260 415 L204 415 L204 303 L260 303 Z" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2"/>
