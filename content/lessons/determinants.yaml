  - id: det-zero-collapse
    title: "Check whether information is lost"
    tldr: |
      - A matrix can flatten a square into a line or a point.
      - Then its determinant is zero, and different inputs share an output.
      - Only a nonzero determinant lets us recover every input uniquely.
    explain: |
      ### When the area disappears

      The determinant also tells us when a matrix loses information. Imagine changing a square's two edges until they lie along the same line. The square is squeezed flat, so its area becomes zero.

      Try $C=\begin{bmatrix}2&1\\0&0\end{bmatrix}$. The first output coordinate is $2x+y$, and the second is always zero. Its columns, $(2,0)$ and $(1,0)$, both point along the horizontal axis, so the unit square becomes a line segment.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" aria-label="The matrix C with rows (2, 1) and (0, 0) turns the unit square into a horizontal segment from 0 to 3. The column arrows (2, 0) and (1, 0) lie on the same line, so the output area is zero." font-family="ui-sans-serif, system-ui, sans-serif">
      <defs><marker id="det-zero-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="det-zero-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-size="18" fill="#171717">
      <rect x="165" y="65" width="70" height="70" fill="#737373" fill-opacity="0.08" stroke="#737373" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="200" y="35" text-anchor="middle">Unit square: area 1</text>
      <path d="M200 160 V215 M190 202 L200 215 L210 202" stroke="#171717" stroke-width="2" fill="#171717" fill-opacity="0"/>
      <text x="220" y="194">C</text>
      <path d="M50 290 H310" stroke="#d4d4d4"/>
      <path d="M80 290 H260" stroke="#10b981" stroke-width="9"/>
      <path d="M80 290 H200" stroke="#3b82f6" stroke-width="5" marker-end="url(#det-zero-blue)"/>
      <path d="M80 290 H140" stroke="#f59e0b" stroke-width="3" marker-end="url(#det-zero-orange)"/>
      <text x="80" y="326" text-anchor="middle">0</text><text x="140" y="326" text-anchor="middle">1</text><text x="200" y="326" text-anchor="middle">2</text><text x="260" y="326" text-anchor="middle">3</text>
      <text x="200" y="254" text-anchor="middle">Both columns lie on one line</text>
      <text x="200" y="365" text-anchor="middle">Output area 0</text>
      </g></svg>
      ```

      For a $2\times2$ matrix, a zero determinant means every region collapses to a line or a point. There is then no clockwise or counterclockwise order left between the edges.

      ### Can we recover the input?

      An **inverse** undoes a matrix's map, recovering the original input from its output. A square matrix is **invertible** when that inverse exists.

      Why does zero prevent an inverse? Different inputs have merged into the same output. For $C$, the inputs $(1,0)$ and $(0,2)$ both give $(2,0)$. An inverse given $(2,0)$ could not tell which input to return.

      ### Following an output back

      With nonzero area, the columns point along different lines. To recover an input, start at its output and draw a line parallel to column 2 until it meets the line of column 1. Two nonparallel lines meet exactly once, telling us how many copies of column 1 were used. Subtract that contribution from the output. The remaining vector tells us how many copies of column 2 were used. These amounts, which can be negative, are $x$ and $y$.

      Return to $A=\begin{bmatrix}3&1\\1&2\end{bmatrix}$ and output $(4,3)$. Follow the recovery one move at a time:

      1. Draw a line parallel to column 2 until it meets column 1's line. The meeting point uses one copy of column 1:
         $$1\times(3,1)=(3,1).$$
      2. Subtract that contribution to find what's left:
         $$
         \begin{aligned}
         (4,3)-(3,1)&=(4-3,\;3-1) &&\text{subtract matching entries}\\
         &=(1,2) &&\text{one copy of column 2}
         \end{aligned}
         $$
      3. Read the two amounts as the input:
         $$(x,y)=(1,1).$$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-label="Recovering input (1, 1) for the noncollapsed slanted map. From output (4, 3), an orange dashed line parallel to column 2 meets the blue column-1 line once, at (3, 1). One blue column plus one orange column reaches the output." font-family="ui-sans-serif, system-ui, sans-serif">
      <defs><marker id="det-inverse-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="det-inverse-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-size="18" fill="#171717">
      <path d="M40 235 H350 M70 255 V55" stroke="#d4d4d4"/>
      <path d="M70 235 L340 145" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
      <path d="M70 235 L220 185" stroke="#3b82f6" stroke-width="3" marker-end="url(#det-inverse-blue)"/>
      <path d="M70 235 L120 135" stroke="#f59e0b" stroke-width="3" marker-end="url(#det-inverse-orange)"/>
      <path d="M270 85 L220 185" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#det-inverse-orange)"/>
      <path d="M120 135 L270 85" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>
      <circle cx="270" cy="85" r="4" fill="#171717"/>
      <text x="237" y="57">Output (4, 3)</text><text x="228" y="210" fill="#3b82f6">(3, 1)</text>
      <text x="57" y="121" fill="#f59e0b">(1, 2)</text><text x="24" y="258">(0, 0)</text>
      <text x="200" y="282" text-anchor="middle">One copy of each column</text>
      </g></svg>
      ```

      This construction works for every output when the columns are nonparallel, so a nonzero determinant guarantees an inverse.

      A positive or negative nonzero determinant allows an inverse. Stretching and mirror-flipping can be undone; losing a dimension cannot.

      Be careful not to judge by zero entries. The matrix $\begin{bmatrix}2&0\\0&4\end{bmatrix}$ has two zero entries, yet its determinant is 8, so it is invertible. The determinant tests the whole map.
    worked: |
      Let's check why $C=\begin{bmatrix}2&1\\0&0\end{bmatrix}$ cannot be undone.

      1. **Calculate its determinant.** Both diagonal products are zero.
         $$\det(C)=2\times0-1\times0=0$$

      2. **Try the first input.** Multiply each row by the entries of $(1,0)$.
         $$C\begin{bmatrix}1\\0\end{bmatrix}=\begin{bmatrix}2\\0\end{bmatrix}$$

      3. **Try a different input.** The input $(0,2)$ reaches exactly the same output.
         $$C\begin{bmatrix}0\\2\end{bmatrix}=\begin{bmatrix}2\\0\end{bmatrix}$$

      The vanished area reflects lost information: the output cannot identify one unique input, so $C$ has no inverse.
