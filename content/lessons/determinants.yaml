final: det-explain-map
summary: |
  - A determinant is the signed area scale of a $2\times2$ matrix: $|\det(A)|$ multiplies area, and a negative sign reverses orientation.
  - For $A=\begin{bmatrix}a&b\\c&d\end{bmatrix}$, the determinant is $\det(A)=ad-bc$. This shortcut applies to $2\times2$ matrices, while determinants themselves are defined for square matrices of any size.
  - A zero determinant collapses a two-dimensional picture to a line or a point, so different inputs can share an output. A square matrix is invertible exactly when its determinant is nonzero.

  **Next:** We'll look for directions a matrix only stretches, then describe a map as turns and stretches.
