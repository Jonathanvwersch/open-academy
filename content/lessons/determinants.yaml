  - id: det-two-by-two
    title: "Calculate a determinant"
    tldr: |
      - For two rows and two columns, start with the top-left entry times the bottom-right entry.
      - Then subtract the top-right entry times the bottom-left entry.
      - That gives the determinant, whose size tells how area scales and whose sign records a flip.
    explain: |
      ### A square can become slanted

      The rectangle made the area easy to see. A matrix can also slant a square into a **parallelogram**, a four-sided shape with opposite sides parallel. We still follow the same two edges.

      Take $A=\begin{bmatrix}3&1\\1&2\end{bmatrix}$. Its first column sends $(1,0)$ to $(3,1)$, the blue arrow, and its second sends $(0,1)$ to $(1,2)$, the orange arrow. The opposite corner uses one copy of each column:
      $$
      \begin{aligned}
      A\begin{bmatrix}1\\1\end{bmatrix}&=\begin{bmatrix}3\\1\end{bmatrix}+\begin{bmatrix}1\\2\end{bmatrix} &&\text{use both columns}\\
      &=\begin{bmatrix}4\\3\end{bmatrix} &&\text{add matching entries}
      \end{aligned}
      $$
      The green parallelogram is the transformed unit square. The grey triangles fill an enclosing rectangle. Call the top-right entry $b=1$ and the bottom-left entry $c=1$; these label distances in the picture.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" aria-label="The matrix with rows (3, 1) and (1, 2) maps a unit square to a parallelogram with corners (0, 0), (3, 1), (4, 3) and (1, 2). The enclosing rectangle is 4 wide and 3 high. The four outside grey triangles have areas 2, 2, 1.5 and 1.5, leaving green area 5." font-family="ui-sans-serif, system-ui, sans-serif">
      <defs><marker id="det-calc-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="det-calc-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-size="18" fill="#171717">
      <path d="M40 235 H350 M70 255 V55" stroke="#d4d4d4"/>
      <path d="M70 235 L220 185 L270 85 L120 135 Z" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
      <path d="M70 85 L270 85 L120 135 Z M70 235 L270 235 L220 185 Z M70 85 L120 135 L70 235 Z M270 85 L220 185 L270 235 Z" fill="#737373" fill-opacity="0.12" stroke="#737373" stroke-width="1"/>
      <text x="157" y="106" text-anchor="middle" fill="#737373">2</text>
      <text x="186" y="225" text-anchor="middle" fill="#737373">2</text>
      <text x="88" y="163" text-anchor="middle" font-size="16" fill="#737373">1.5</text>
      <text x="253" y="178" text-anchor="middle" font-size="16" fill="#737373">1.5</text>
      <path d="M70 235 L220 185" stroke="#3b82f6" stroke-width="3" marker-end="url(#det-calc-blue)"/>
      <path d="M70 235 L120 135" stroke="#f59e0b" stroke-width="3" marker-end="url(#det-calc-orange)"/>
      <text x="228" y="207" fill="#3b82f6">(3, 1)</text><text x="61" y="120" fill="#f59e0b">(1, 2)</text>
      <text x="280" y="80">(4, 3)</text>
      <text x="170" y="56" text-anchor="middle">4 wide</text>
      <text x="312" y="154">3 high</text><text x="20" y="258">(0, 0)</text>
      <text x="170" y="166" text-anchor="middle" fill="#10b981">area 5</text>
      <path d="M70 255 H120 M70 250 V260 M120 250 V260 M305 185 V235 M300 185 H310 M300 235 H310" stroke="#737373"/>
      <text x="95" y="280" text-anchor="middle" font-size="16">b = 1</text><text x="317" y="217" font-size="16">c = 1</text>
      <text x="200" y="320" text-anchor="middle">Green: image of the unit square</text>
      </g></svg>
