      ### The definition

      The **partial derivative** of a function with respect to one of its inputs is its slope when only that input changes and every other input is held fixed. We write it $\frac{\partial f}{\partial x}$, read "partial $f$ by partial $x$", meaning the change in $f$ per change in $x$. The curly $\partial$ signals that the other inputs are frozen. It's the limit that defined the derivative, except that only $x$ gets the small step $h$:

      $$\frac{\partial f}{\partial x}=\lim_{h\to0}\frac{f(x+h,y)-f(x,y)}{h}.$$

      In practice we skip the limit and use the derivative rules, as we did with $x^2+2$.

      ### Slopes at different points

      The same reasoning works with $y$ frozen at any value $c$:
      $$\begin{aligned}f(x,c)&=x^2+2c^2 &&\text{hold }y=c\\\frac{\partial f}{\partial x}&=2x &&\text{differentiate with }c\text{ fixed}\end{aligned}$$
      Freezing $x$ instead gives slope $4y$ along $y$, as we'll check below. The slopes change from point to point:

      - At $(1.5,1)$, the slope is $3$ along $x$ and $4$ along $y$.
      - At $(0,1)$, the slope along $x$ is $0$, so a small step in $x$ is level, but along $y$ it's still $4$.
      - At $(-1.5,1)$, the slope along $x$ is $-3$, so increasing $x$ takes us downhill.

      Be careful not to expect one slope at a point. With one input there was only one way to move, but now each input has its own slope.
    worked: |
      Let's find the slope in the $y$ direction at $P=(1.5,1)$ for the same function, $f(x,y)=x^2+2y^2$. We write it $\frac{\partial f}{\partial y}(P)$, where $(P)$ means the slope is measured at the point $P$.

      1. **Freeze $x$ at its value at $P$.** Only $y$ moves, so $x$ stays at $1.5$ and the $x^2$ term becomes the fixed number $2.25$.
         $$f(1.5,y)=2.25+2y^2$$

      2. **Differentiate this one-input function.** The $2.25$ is a constant, so its slope is $0$, and the power rule turns $2y^2$ into $4y$.
         $$\frac{\partial f}{\partial y}=0+4y=4y$$

      3. **Put in $y=1$.** This gives the slope at $P$ itself.
         $$\frac{\partial f}{\partial y}(P)=4\times1=4$$

      4. **Check with a small step.** If we move $y$ alone from $1$ to $1.01$, the height should rise by about $4\times0.01=0.04$, so dividing the rise by $0.01$ should give about $4$.
         $$\begin{aligned}f(1.5,1.01)&=2.25+2(1.01)^2=4.2902 &&\text{find the new height}\\\frac{f(1.5,1.01)-f(1.5,1)}{0.01}&=\frac{4.2902-4.25}{0.01} &&\text{substitute both heights}\\&=4.02 &&\text{divide the rise by the step}\end{aligned}$$

      The check gives $4.02$, close to $4$, and the extra $0.02$ comes from the step not being zero. So from $P$ the ground rises at $3$ along $x$ but at $4$ along $y$.
