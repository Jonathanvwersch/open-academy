concept: partial-derivatives
version: 3
objective: |
  **Goal:** compute the partial derivative of a function of several variables with respect to any one of them, and read it as the rate of change when only that variable moves.
where_this_fits: |
  The loss-functions lesson gave us a slope for a model's loss as one number changes. A house-price model has several weights, one for each feature, so changing all of them together hides each weight's separate effect. A partial derivative measures the loss change for one weight while the others stay fixed. The next lesson collects these separate slopes into one gradient vector.
knowledge_points:
  - id: pd-hold-fixed
    title: Change one weight, hold the rest fixed
    explain: |
      **What a partial derivative is.** It is the rate of change of a function with respect to one input while every other input is held fixed.

      **How it works.** For $x=(12,3,20)$, sale price $y=330$, and weights $w=(w_1,w_2,w_3)$, the squared loss is $L=(12w_1+3w_2+20w_3-y)^2$. At $w=(25,10,-1)$, prediction is 310 and the error is $e=-20$. If only $w_1$ changes by $h$, the error changes by $12h$. The loss difference divided by $h$ is $((e+12h)^2-e^2)/h=24e+144h$, which approaches $24e=-480$ as $h$ approaches zero.

      This is an ordinary derivative along one direction through the space of weights. Changing two weights together would combine their effects.

      **Why this is useful.** The partial tells us how changing the area weight alone affects this house's loss.
    worked: |
      This example shows the area-weight partial while bedrooms and age weights stay fixed.

      Keep $w_2=10$ and $w_3=-1$. Then $L(w_1)=(12w_1+30-20-330)^2$. At $w_1=25$, the error is −20.

      $$\frac{\partial L}{\partial w_1}=2(12w_1+30-20-330)\cdot12=-480.$$

      A small increase to $w_1$ lowers the squared error at this point.
    problems:
      [
        pd-hold-fixed-basics,
        pdp-meaning,
        pdp-house-rate,
        pdp-why-freeze,
        pdp-sign,
        pdp-nudge-check,
        pdp-how-many,
      ]
  - id: pd-compute
    title: Compute each partial with derivative rules
    explain: |
      **What a partial formula gives.** A partial-derivative formula is an expression for the loss slope with respect to one weight that holds at every parameter setting, so you plug in the current weights instead of re-deriving the slope each time.

      **How it works.** Let $e=12w_1+3w_2+20w_3-330$, and let $x_j$ be the $j$th house feature. If weight $w_j$ changes by $h$, the error changes by $x_jh$. The difference quotient is $((e+x_jh)^2-e^2)/h=2ex_j+x_j^2h$, which approaches $2ex_j$. Thus

      $$\frac{\partial L}{\partial w_1}=2e\cdot12,\quad \frac{\partial L}{\partial w_2}=2e\cdot3,\quad \frac{\partial L}{\partial w_3}=2e\cdot20.$$

      At $w=(25,10,-1)$, $e=-20$, so the three partials are $-480,-120,-800$. Each uses the same error but its own feature.

      **Why this is useful.** These separate slopes show which house-model weights can reduce loss when adjusted.
    worked: |
      This example shows all three weight partials for the same house.

      1. Compute $e=12(25)+3(10)+20(-1)-330=-20$.
      2. Area weight: $2e\cdot12=-480$.
      3. Bedroom weight: $2e\cdot3=-120$.
      4. Age weight: $2e\cdot20=-800$.

      A negative partial means a small increase to that weight lowers this house's squared loss.
    problems:
      [
        pd-compute-basics,
        pdp-compute-x,
        pdp-value-template,
        pdp-why-zero,
        pdp-exp-log,
        pdp-product,
        pdp-compute-y,
      ]
  - id: pd-many-inputs
    title: Include the bias as another input
    explain: |
      **What the bias partial is.** The bias is an adjustable offset added to the model's weighted total for every example. Its partial derivative is the rate at which the loss changes when only the bias changes, with every weight held fixed.

      **How it works.** With prediction $\hat y=w\cdot x+b$, one-house squared loss is $L=(w\cdot x+b-y)^2$. Write the error as $e=w\cdot x+b-y$. Changing the bias by $h$ changes the error by $h$, so the loss difference quotient is $((e+h)^2-e^2)/h=2e+h$, which approaches $2e$. Each weight partial is $2e$ times its feature; the bias partial is $2e$ because its multiplier is 1.

      For our house, $e=-20$, so $\partial L/\partial b=-40$. The data values $x$ and $y$ stay fixed: they describe the recorded house and sale, not settings the model can tune.

      **Why this is useful.** The bias is trained the same way as the weights, so the full set of slopes the next lesson collects has one entry per weight plus one for the bias.
    worked: |
      This example shows the weight and bias partials for the house sold for 330 thousand pounds.

      With $x=(12,3,20)$, $w=(25,10,-1)$ and $b=0$, prediction is 310 and error is $e=-20$.

      $$\frac{\partial L}{\partial w}=(2e\cdot12,2e\cdot3,2e\cdot20)=(-480,-120,-800),\qquad\frac{\partial L}{\partial b}=2e=-40.$$

      The three weight rates use the three feature values. The bias rate uses 1.
    problems:
      [
        pd-many-inputs-basics,
        pdp-gap-w,
        pdp-gap-template,
        pdp-gap-b,
        pdp-why-data-fixed,
        pdp-turn-dial,
        pdp-three-inputs,
      ]
final: pd-explain
summary: |
  - A partial derivative measures how loss changes with one weight while all other weights are held fixed.
  - For squared house-price loss, each weight partial is twice the prediction error times that feature; the bias partial is twice the error.
  - The data stays fixed while training changes model parameters.

  **Next:** Gradients collect the partial derivative for every model weight into one vector.
