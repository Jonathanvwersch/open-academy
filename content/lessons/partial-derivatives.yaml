summary: |
  - A partial derivative is the slope of a function of several inputs when only one input changes and every other input is held fixed. We write it $\frac{\partial f}{\partial x}$.
  - A function has one partial derivative for each input, and they usually differ. At $(1.5,1)$, $x^2+2y^2$ rises at $3$ along $x$ and at $4$ along $y$.
  - To find a partial-derivative formula, treat the other inputs as constants and use the ordinary derivative rules. A constant factor stays, and a term without the moving input gives $0$.
  - For a model's squared error $L=(wx+b-y)^2$, only the parameters get slopes, $\frac{\partial L}{\partial w}=2(wx+b-y)x$ and $\frac{\partial L}{\partial b}=2(wx+b-y)$, while the data stay fixed.

  **Next:** The gradients lesson collects a function's partial derivatives into one list and uses it to find the direction in which the function rises fastest.
