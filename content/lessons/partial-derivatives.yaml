  - id: pd-compute
    title: "Work out a partial derivative"
    tldr: |
      - To find one input's slope, treat every other input as a fixed number.
      - Fixed multipliers stay, while terms without the changing input contribute nothing.
      - The usual derivative rules then give a slope formula we can use at any point.
    explain: |
      ### Inputs that are multiplied together

      In $x^2+2y^2$, each term contained only one input, so freezing the other was easy. But what about $f(x,y)=x^2y+5y$, where $x$ and $y$ are multiplied together in $x^2y$? Can we still find one formula for $\frac{\partial f}{\partial x}$ that works at every point, so we needn't redo the work each time?

      Let's start with a rectangle's area, $A(x,y)=xy$, with width $x=3$ and height $y=2$. On the left, we widen it by a small amount $h$ while keeping height $2$. Write $\Delta A$ for the added orange area:
      $$\begin{aligned}\Delta A&=2h &&\text{height times added width}\\\frac{\Delta A}{h}&=2 &&\text{area change per unit width}\\\frac{\partial A}{\partial x}&=y &&\text{the rate is the fixed height}\end{aligned}$$

      On the right, raise the height by $h$ and keep width $3$:
      $$\begin{aligned}\Delta A&=3h &&\text{width times added height}\\\frac{\Delta A}{h}&=3 &&\text{area change per unit height}\\\frac{\partial A}{\partial y}&=x &&\text{the rate is the fixed width}\end{aligned}$$
      Either way, the input we froze becomes the multiplier.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" aria-label="Two copies of a rectangle 3 wide and 2 tall, with area 6. Left: an orange strip of width h added to the right side has area 2h. Right: an orange strip of height h added to the top has area 3h">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="30" y="40">widen: x moves, y stays 2</text>
      <rect x="60" y="100" width="180" height="120" fill="#ffffff" stroke="#737373" stroke-width="2"/>
      <rect x="240" y="100" width="30" height="120" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="2"/>
      <text x="150" y="245" text-anchor="middle">x = 3</text>
      <text x="255" y="245" fill="#f59e0b" text-anchor="middle">h</text>
      <text x="50" y="165" text-anchor="end">y = 2</text>
      <text x="150" y="165" text-anchor="middle">area 3 × 2 = 6</text>
      <text x="255" y="88" fill="#f59e0b" text-anchor="middle">added 2h</text>
      <text x="350" y="40">raise: y moves, x stays 3</text>
      <rect x="390" y="130" width="180" height="120" fill="#ffffff" stroke="#737373" stroke-width="2"/>
      <rect x="390" y="100" width="180" height="30" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="2"/>
      <text x="480" y="275" text-anchor="middle">x = 3</text>
      <text x="580" y="195">y = 2</text>
      <text x="580" y="120" fill="#f59e0b">h</text>
      <text x="480" y="195" text-anchor="middle">area 3 × 2 = 6</text>
      <text x="480" y="88" fill="#f59e0b" text-anchor="middle">added 3h</text>
      </g>
      </svg>
      ```

      ### Treat the other inputs as constants

      A frozen input behaves exactly like a fixed number, so the derivative rules work unchanged. To find $\frac{\partial f}{\partial x}$, we treat every input except $x$ as a constant and differentiate term by term:

      $$\begin{aligned}\frac{\partial}{\partial x}(x^2y)&=y\cdot2x=2xy &&\text{keep the constant factor }y\\\frac{\partial}{\partial x}(5y)&=0 &&\text{a constant term has zero slope}\\\frac{\partial f}{\partial x}&=2xy+0=2xy &&\text{add the term slopes}\end{aligned}$$
      Keeping $y$ works like keeping $5$ in $(5x^2)'=10x$. The result is a function of both inputs, called a **partial-derivative formula**. Substituting any point gives its slope.

      ### How common terms behave

      Here's how a few common terms behave:

      | Term | Partial in $x$ | Partial in $y$ |
      | --- | --- | --- |
      | $xy$ | $y$ | $x$ |
      | $x^2y$ | $2xy$ | $x^2$ |
      | $5y$ | $0$ | $5$ |
      | $e^y$ | $0$ | $e^y$ |

      Be careful not to drop an input just because it's held fixed. Only terms with no $x$ at all disappear. When $y$ multiplies $x$, it stays as a factor, so the partial of $xy$ in $x$ is $y$, just like the height of the strip in the picture.
    worked: |
      Let's find both partial-derivative formulas of $f(x,y)=x^2y+5y$, and then the two slopes at the point $(3,2)$.

      1. **Differentiate in $x$, treating $y$ as a constant.** The $y$ in $x^2y$ is a constant factor, so it stays, and $5y$ has no $x$, so it gives $0$.
         $$\frac{\partial f}{\partial x}=2x\cdot y+0=2xy$$

      2. **Differentiate in $y$, treating $x$ as a constant.** Now $x^2$ is the constant factor in front of $y$, and $5y$ gives $5$.
         $$\frac{\partial f}{\partial y}=x^2\cdot1+5=x^2+5$$

      3. **Put in the point $(3,2)$.** Each formula gives its slope at that point.
         $$\begin{aligned}\frac{\partial f}{\partial x}(3,2)&=2\times3\times2=12 &&\text{substitute into the }x\text{ slope}\\\frac{\partial f}{\partial y}(3,2)&=3^2+5=14 &&\text{substitute into the }y\text{ slope}\end{aligned}$$

      4. **Check the $x$ slope with a small step.** Move $x$ alone from $3$ to $3.01$, then divide the rise by $0.01$.
         $$\begin{aligned}f(3.01,2)&=3.01^2\times2+10=28.1202 &&\text{find the new output}\\\frac{f(3.01,2)-f(3,2)}{0.01}&=\frac{28.1202-28}{0.01} &&\text{substitute both outputs}\\&=12.02 &&\text{divide the rise by the step}\end{aligned}$$

      The check gives $12.02$, close to $12$. So at $(3,2)$ this function rises at $12$ along $x$ and at $14$ along $y$.
