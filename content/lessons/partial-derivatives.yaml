      ### Which inputs training can change

      If we write the loss out in full, it is

      $$L=(wx+b-y)^2.$$

      It contains four quantities, but training can only change $w$ and $b$, because the house's area and price are recorded facts. So $x$ and $y$ are constants, and only $w$ and $b$ get partials.

      Since $L=e\cdot e$, the product rule gives its slope with $b$ frozen:
      $$\begin{aligned}\frac{\partial L}{\partial w}&=\frac{\partial e}{\partial w}e+e\frac{\partial e}{\partial w} &&\text{differentiate both factors}\\&=2e\frac{\partial e}{\partial w} &&\text{combine equal terms}\\&=2ex &&\text{error changes at rate }x\end{aligned}$$
      The error changes by one per unit of bias, so the loss's bias derivative is $2e\times1$.

      The right-hand picture plots the loss against $w$, with $b=1$. At $w=1$:
      $$\begin{aligned}2e&=2(-4)=-8 &&\text{double the error}\\2ex&=-8(2)=-16 &&\text{multiply by the area}\end{aligned}$$
      It's negative, so raising $w$ a little lowers the loss. The curve reaches $0$ at $w=3$, where the prediction is exactly $7$.
    worked: |
      Let's find both slopes of the loss for our house, with area $x=2$ and price $y=7$, at $w=1$ and $b=1$.

      1. **Work out the error.** The prediction is $wx+b$, and the error is prediction minus price.
         $$e=1\times2+1-7=-4$$

      2. **Find how fast the error moves with each parameter.** With $b$ frozen, $w$ changes the error at the rate $x=2$, the area it multiplies. With $w$ frozen, $b$ changes it one for one.
         $$\begin{aligned}\frac{\partial e}{\partial w}&=2 &&\text{weight multiplies the area}\\\frac{\partial e}{\partial b}&=1 &&\text{bias adds directly}\end{aligned}$$

      3. **Multiply each rate by $2e$.** The product rule on $e\cdot e$ puts a factor of $2e=-8$ in front of each rate.
         $$\begin{aligned}\frac{\partial L}{\partial w}&=-8\times2=-16 &&\text{scale the weight's error rate}\\\frac{\partial L}{\partial b}&=-8\times1=-8 &&\text{scale the bias's error rate}\end{aligned}$$

      4. **Check the weight's slope with a small step.** Raising $w$ alone from $1$ to $1.01$ raises the prediction by $0.02$, so the error becomes $-3.98$.
         $$\begin{aligned}(-3.98)^2&=15.8404 &&\text{square the new error}\\\frac{(-3.98)^2-(-4)^2}{0.01}&=\frac{15.8404-16}{0.01} &&\text{substitute the losses}\\&=-15.96 &&\text{divide the loss change by the step}\end{aligned}$$

      The check gives $-15.96$, close to $-16$. Both slopes are negative because the model predicts too low, so raising either parameter a little lowers the loss. The weight's slope is twice the bias's because a change in $w$ is multiplied by the area, $2$.
