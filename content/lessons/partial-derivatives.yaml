concept: partial-derivatives
version: 4
objective: |
  **Goal:** compute the partial derivative of a function of several inputs with respect to any one of them, and read it as the rate of change when only that input moves.
where_this_fits: |
  A house-price model multiplies each recorded fact about a house by an adjustable **weight**, adds the results and one more adjustable number, the **bias**, to predict a price. Its **loss**, a function whose inputs are the weights and bias, scores how far the prediction is from the real price; training adjusts the weights to make it smaller. The derivatives lesson gave slopes for one input, but each weight moves the loss at its own rate. This lesson gives each input its own slope, the **partial derivative**:

  1. Move one input and hold the others fixed.
  2. Get a formula for that slope with the derivative rules you already know.
  3. Apply this to a house model's loss: one slope per weight, with the house's recorded facts held fixed.

knowledge_points:
  - id: pd-hold-fixed
    title: Move one input, hold the rest fixed
    explain: |
      **The question.** Take a function with two inputs, $f(x,y)$. Think of $f$ as the height of the ground above each point $(x,y)$ on a map. Standing at one point, the ground may rise steeply one way and gently another. Which slope do you measure, and how?

      **Picture it.** Take $f(x,y)=x^2+2y^2$ and stand at $P=(1.5,1)$, where the height is $1.5^2+2(1)^2=4.25$. Walk along the amber line on the map, where $y$ stays at $1$ and only $x$ changes (left). Along that line the height is $f(x,1)=x^2+2$, an ordinary function of $x$ alone (right). By the power rule its slope is $2x$, which is $3$ at $x=1.5$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" aria-label="Left: a map of inputs x and y with the point P at (1.5, 1) and an amber line through it where y stays 1. Right: the height x squared plus 2 along that line, with P at height 4.25 and a blue tangent of slope 3">
        <defs>
          <marker id="pd1-axis-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text x="20" y="30">the map: inputs (x, y)</text>
          <path d="M40 280 H262" stroke="#737373" fill="#0000" marker-end="url(#pd1-axis-arrow)"/>
          <path d="M40 280 V98" stroke="#737373" fill="#0000" marker-end="url(#pd1-axis-arrow)"/>
          <path d="M40 200 H240" stroke="#f59e0b" stroke-width="3"/>
          <circle cx="160" cy="200" r="4.5" fill="#171717"/>
          <text x="150" y="222">P = (1.5, 1)</text>
          <text x="48" y="190" fill="#f59e0b">y stays 1, x moves</text>
          <text x="268" y="285">x</text>
          <text x="34" y="90">y</text>
          <text x="20" y="300" fill="#737373">0</text>
          <text x="340" y="30">height along the amber line</text>
          <path d="M360 300 H632" stroke="#737373" fill="#0000" marker-end="url(#pd1-axis-arrow)"/>
          <path d="M360 300 V40" stroke="#737373" fill="#0000" marker-end="url(#pd1-axis-arrow)"/>
          <path d="M360 240 Q485 240 610 52.5" stroke="#f59e0b" stroke-width="3" fill="#0000"/>
          <path d="M460 217.5 L560 127.5" stroke="#3b82f6" stroke-width="3"/>
          <circle cx="510" cy="172.5" r="4.5" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="524" y="190">P, height 4.25</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="452" y="132" fill="#3b82f6">slope 3</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="372" y="230" fill="#f59e0b">f(x, 1) = x² + 2</text>
          <text x="618" y="322">x</text>
          <text x="368" y="52">height</text>
        </g>
      </svg>
      ```

      **The idea.** The **partial derivative** of a function with respect to one input is its rate of change when only that input changes and all the other inputs are held fixed. For $f(x,y)$ we write $\frac{\partial f}{\partial x}$, read "partial $f$ by partial $x$". The curly $\partial$ signals that other inputs exist and are frozen. It is the derivative's limit definition from the derivatives lesson, with the small step $h$ given to $x$ only:

      $$\frac{\partial f}{\partial x}=\lim_{h\to0}\frac{f(x+h,y)-f(x,y)}{h}.$$

      At $P$, with $y=1$, the top of the fraction is:

      $$(1.5+h)^2=2.25+3h+h^2,$$

      $$f(1.5+h,1)-f(1.5,1)=(2.25+3h+h^2+2)-4.25=3h+h^2.$$

      So the slope at $P$, written $\frac{\partial f}{\partial x}(P)$, is:

      $$\frac{\partial f}{\partial x}(P)=\lim_{h\to0}\frac{3h+h^2}{h}=\lim_{h\to0}(3+h)=3.$$

      In practice you freeze the other inputs and use the derivative rules, then check by working out the fraction with a small $h$, such as $0.01$, instead of the limit.

      **Common confusion.** "A point on a graph has one slope." That was true with one input. From $P$, walking along $x$ gives slope $3$, but walking along $y$ gives slope $4$ (worked out below). A function of two inputs has one partial derivative for each input, and they usually differ.
    worked: |
      Find $\frac{\partial f}{\partial y}$ for $f(x,y)=x^2+2y^2$ at $P=(1.5,1)$.

      1. **Freeze $x$ at its value at $P$.**
         $$f(1.5,y)=1.5^2+2y^2=2.25+2y^2.$$

      2. **Differentiate this one-input function.** The $2.25$ is a constant, so it contributes $0$.
         $$\frac{d}{dy}\left(2.25+2y^2\right)=4y.$$

      3. **Put in $y=1$.**
         $$\frac{\partial f}{\partial y}(P)=4(1)=4.$$

      4. **Check with a small step $h=0.01$ in $y$ only.**
         $$\frac{f(1.5,1.01)-f(1.5,1)}{0.01}=\frac{4.2902-4.25}{0.01}=4.02\approx4.$$
         The extra $0.02$ is there because $h$ is not zero; a smaller $h$ shrinks it.

      **Compare cases.** The slopes depend on where you stand. For this $f$, the slope along $x$ depends only on $x$: freeze $y$ at any value $c$ and the height is $x^2+2c^2$, whose slope is $2x$. Likewise the slope along $y$ is always $4y$. In the last row the slope along $x$ is negative, so $f$ falls as $x$ grows there.

      | Point | Slope along $x$ | Slope along $y$ |
      | --- | --- | --- |
      | $(1.5,1)$ | $3$ | $4$ |
      | $(0,1)$ | $0$ | $4$ |
      | $(1.5,0)$ | $3$ | $0$ |
      | $(-1.5,1)$ | $-3$ | $4$ |

      **Where it shows up.** A model's loss depends on all of its weights. The partial derivative for one weight says how fast the loss changes if you nudge only that weight, which tells you whether raising or lowering it will make the loss smaller.
    problems:
      [
        pd-hold-fixed-basics,
        pdp-freeze-self-explain,
        pdp-meaning,
        pdp-why-freeze,
        pdp-sign,
        pdp-how-many,
        pdp-house-rate,
        pdp-nudge-check,
        pdp-flat-weight,
      ]
  - id: pd-compute
    title: Treat the frozen inputs as constants
    explain: |
      **The question.** In $x^2+2y^2$ each input sat in its own term, so freezing one was easy. In $f(x,y)=x^2y+5y$ the inputs are multiplied together in $x^2y$. Can you still get one formula for $\frac{\partial f}{\partial x}$ that gives the slope at any point?

      **Picture it.** Start with the simplest product of two inputs, a rectangle's area $A(x,y)=xy$, with width $x=3$ and height $y=2$. Widen it by a small amount $h$ while the height stays $2$ (left). The added strip has area $2h$, so the area grows at rate $2$ per unit of width. That $2$ is the height, so at any size $\frac{\partial A}{\partial x}=y$. Raise the height instead, with the width fixed at $3$ (right). The strip has area $3h$, so $\frac{\partial A}{\partial y}=x$. The frozen input survives as a multiplier.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="Two copies of a 3 by 2 rectangle. Left: an amber strip of width h added on the right has area 2h. Right: an amber strip of height h added on top has area 3h">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text x="30" y="40">widen: x moves, y stays 2</text>
          <rect x="40" y="100" width="180" height="120" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <rect x="220" y="100" width="30" height="120" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="2"/>
          <text x="112" y="245">x = 3</text>
          <text x="226" y="245" fill="#f59e0b">h</text>
          <text x="2" y="165">y = 2</text>
          <text x="98" y="165">area 3 × 2</text>
          <text x="196" y="85" fill="#f59e0b">added 2h</text>
          <text x="350" y="40">raise: y moves, x stays 3</text>
          <rect x="380" y="130" width="180" height="120" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <rect x="380" y="100" width="180" height="30" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="2"/>
          <text x="452" y="275">x = 3</text>
          <text x="568" y="195">y = 2</text>
          <text x="568" y="120" fill="#f59e0b">h</text>
          <text x="438" y="195">area 3 × 2</text>
          <text x="438" y="85" fill="#f59e0b">added 3h</text>
        </g>
      </svg>
      ```

      **The idea.** A frozen input behaves exactly like a constant number, so the ordinary derivative rules apply unchanged. To find $\frac{\partial f}{\partial x}$, treat every input except $x$ as a constant and differentiate term by term:

      - a constant factor stays as a factor, so $\frac{\partial}{\partial x}(x^2y)=2xy$, just as the derivative of $5x^2$ is $10x$;
      - a term with no $x$ in it is a constant, so its derivative is $0$: $\frac{\partial}{\partial x}(5y)=0$.

      The result, the **partial-derivative formula**, is itself a function of the inputs: put in any point to get the slope there.

      **Common confusion.** "Since $y$ is held fixed, it drops out of $\frac{\partial f}{\partial x}$." Only terms with no $x$ drop out. When $y$ multiplies $x$, it stays as a constant factor: $\frac{\partial}{\partial x}(xy)=y$, not $1$ or $0$. That $y$ is the height of the strip in the picture.
    worked: |
      Find both partial-derivative formulas of $f(x,y)=x^2y+5y$, then the slopes at $(3,2)$.

      1. **Differentiate in $x$, treating $y$ as a constant.**
         $$\frac{\partial f}{\partial x}=2x\cdot y+0=2xy.$$

      2. **Differentiate in $y$, treating $x$ as a constant.**
         $$\frac{\partial f}{\partial y}=x^2\cdot1+5=x^2+5.$$

      3. **Put in the point $(3,2)$.**
         $$\frac{\partial f}{\partial x}(3,2)=2(3)(2)=12.$$
         $$\frac{\partial f}{\partial y}(3,2)=3^2+5=14.$$

      4. **Check the $x$-slope with a small step $h=0.01$ in $x$ only.**
         $$\frac{f(3.01,2)-f(3,2)}{0.01}=\frac{28.1202-28}{0.01}=12.02\approx12.$$

      **Compare cases.** How common kinds of term behave:

      | Term | Partial in $x$ | Partial in $y$ |
      | --- | --- | --- |
      | $x^2y$ | $2xy$ | $x^2$ |
      | $5y$ | $0$ | $5$ |
      | $xy$ | $y$ | $x$ |
      | $x^3$ | $3x^2$ | $0$ |
      | $e^y$ | $0$ | $e^y$ |

      **Where it shows up.** A house model's loss, as the next section shows, is built from its weights with sums, products and powers, so these rules give a formula for each weight's partial derivative. Training changes the weights many times, so you derive the formula once and evaluate it at whatever values the weights have each time.
    problems:
      [
        pd-compute-basics,
        pdp-constant-factor-self-explain,
        pdp-compute-x,
        pdp-compute-y,
        pdp-why-zero,
        pdp-value-template,
        pdp-exp-log,
        pdp-product,
      ]
  - id: pd-many-inputs
    title: One partial per adjustable number; the data stay fixed
    explain: |
      **The question.** A loss can depend on many numbers at once. For a house-price model, which of them get partial derivatives, and what do those partials look like?

      **Picture it.** A **linear model** predicts a price by multiplying each **feature** (a recorded fact about the house) by its weight, adding the results, and adding one more adjustable number, the **bias** $b$. Take a house with area $12$ (in tens of m², so 120 m²), $3$ bedrooms and age $20$ years, which sold for $330$ (thousands of pounds). With weights $w_1=25$, $w_2=10$, $w_3=-1$ (older houses sell for less) and $b=0$, the prediction is:

      $$12(25)+3(10)+20(-1)+0=310.$$

      The **error** $e$ is prediction minus price, $310-330=-20$. The **squared loss** is $e^2=400$: squaring makes misses positive and big misses count more. Amber: adjusted by training; grey: fixed data.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" aria-label="The house model as a flow: area 12 times w1, bedrooms 3 times w2, age 20 times w3 and bias b add to the prediction 310; minus the price 330 gives error minus 20; squaring gives loss 400. Weights and bias are amber, data are grey">
        <defs>
          <marker id="pd3-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <rect x="16" y="30" width="170" height="40" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
          <text x="28" y="55"><tspan fill="#737373">area 12</tspan> × <tspan fill="#f59e0b">w₁ = 25</tspan></text>
          <rect x="16" y="90" width="170" height="40" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
          <text x="28" y="115"><tspan fill="#737373">bedrooms 3</tspan> × <tspan fill="#f59e0b">w₂ = 10</tspan></text>
          <rect x="16" y="150" width="170" height="40" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
          <text x="28" y="175"><tspan fill="#737373">age 20</tspan> × <tspan fill="#f59e0b">w₃ = −1</tspan></text>
          <rect x="16" y="210" width="170" height="40" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
          <text x="28" y="235" fill="#f59e0b">bias b = 0</text>
          <path d="M186 50 L246 130 M186 110 L246 135 M186 170 L246 145 M186 230 L246 150" stroke="#d4d4d4" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <rect x="246" y="115" width="130" height="50" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
          <text x="258" y="137">add up:</text>
          <text x="258" y="155">prediction 310</text>
          <path d="M376 140 H414" stroke="#737373" stroke-width="1.5" marker-end="url(#pd3-arrow)"/>
          <rect x="418" y="60" width="206" height="60" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
          <text x="430" y="84">minus <tspan fill="#737373">price 330</tspan>:</text>
          <text x="430" y="106">error e = −20</text>
          <path d="M521 120 V176" stroke="#737373" stroke-width="1.5" marker-end="url(#pd3-arrow)"/>
          <rect x="418" y="180" width="206" height="50" rx="6" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
          <text x="430" y="210">loss e² = 400</text>
          <text x="16" y="284"><tspan fill="#f59e0b">amber: adjusted by training</tspan>   <tspan fill="#737373">grey: recorded data, fixed</tspan></text>
        </g>
      </svg>
      ```

      **The idea.** The loss is treated as a function of the **parameters**, the numbers training adjusts (here $w_1,w_2,w_3,b$), so there is one partial per parameter. The data act as constants. For this house:

      $$e=12w_1+3w_2+20w_3+b-330,$$

      $$L=e^2=e\cdot e.$$

      Here $e$ is the error, not the number $e\approx2.718$.

      The power rule on $e^2$ gives $2e$, but that is the rate per unit of $e$, and $e$ is not $w_1$. With the other parameters frozen, $e$ is an ordinary function of $w_1$, so use the product rule from the derivatives lesson on $e\cdot e$:

      $$\frac{\partial L}{\partial w_1}=\frac{\partial e}{\partial w_1}\cdot e+e\cdot\frac{\partial e}{\partial w_1}=2e\cdot\frac{\partial e}{\partial w_1}.$$

      Here $\frac{\partial e}{\partial w_1}=12$, the area, because area is the feature that $w_1$ multiplies. Each weight's partial is $2e$ times its feature; the bias's is $2e$ times $1$.

      **Common confusion.** "The features and the price are inputs too, so the loss needs partials for them." Training can't change a house's area or its sale price, so only the parameters, which it will adjust, need partials.
    worked: |
      For the house above, find the loss's partial derivative for every parameter at $w_1=25$, $w_2=10$, $w_3=-1$, $b=0$.

      1. **Compute the error.**
         $$e=12(25)+3(10)+20(-1)+0-330=-20.$$

      2. **Find how fast $e$ moves with each parameter.** Freeze the others; the rate is the feature that parameter multiplies (the $20$ for $w_3$ is the age, not the error).
         $$\frac{\partial e}{\partial w_1}=12,\quad\frac{\partial e}{\partial w_2}=3,\quad\frac{\partial e}{\partial w_3}=20,\quad\frac{\partial e}{\partial b}=1.$$

      3. **Multiply each rate by $2e=-40$.**
         $$\frac{\partial L}{\partial w_1}=-40(12)=-480,\qquad\frac{\partial L}{\partial w_2}=-40(3)=-120.$$
         $$\frac{\partial L}{\partial w_3}=-40(20)=-800,\qquad\frac{\partial L}{\partial b}=-40(1)=-40.$$

      4. **Check $w_3$ with a small step of $0.01$ in $w_3$ only.** The error moves by $20\times0.01=0.2$, to $-19.8$.
         $$\frac{(-19.8)^2-(-20)^2}{0.01}=\frac{392.04-400}{0.01}=-796\approx-800.$$
         The gap of $4$ is $0.5\%$ of $800$; as before, it comes from the step not being zero and shrinks with a smaller step.

      **Compare cases.** Every partial is $2e=-40$ times the parameter's multiplier. All are negative: the model predicts too low, so raising any one parameter a little lowers this house's loss.

      | Parameter | Multiplies | Partial of $L$ |
      | --- | --- | --- |
      | $w_1$ | area $12$ | $-480$ |
      | $w_2$ | bedrooms $3$ | $-120$ |
      | $w_3$ | age $20$ | $-800$ |
      | $b$ | $1$ | $-40$ |

      **Where it shows up.** Training reads these four slopes to decide which way to move each parameter, and a slope further from zero means that parameter moves the loss faster. With many houses, the loss is usually the average of their losses. Each partial is then the average of the houses' partials, because the derivative of a sum is the sum of the derivatives. Real models have thousands or millions of weights, and each one gets its own partial derivative in exactly this way.
    problems:
      [
        pd-many-inputs-basics,
        pdp-error-rate-self-explain,
        pdp-why-data-fixed,
        pdp-three-inputs,
        pdp-gap-w,
        pdp-gap-template,
        pdp-gap-b,
        pdp-turn-dial,
        pdp-bias-zero,
        pdp-sensor-gain,
      ]
final: pd-explain
summary: |
  - A partial derivative is the slope of a function when only one input moves and every other input is held fixed.
  - To find a partial-derivative formula, treat the other inputs as constants and use the ordinary derivative rules.
  - A model's loss has one partial for each weight and for the bias; the data stay fixed because training cannot change them.

  **Next:** Gradients collect these partial derivatives into a single list of numbers, one entry per input.
