concept: partial-derivatives
version: 5
objective: |
  **Goal:** compute the partial derivative of a function of several inputs with respect to any one of them, and read it as the rate of change when only that input moves.
recap:
  - concept: derivatives
    text: "The derivative $f'(a)$ is the slope of a function at the input $a$, so a small nudge to the input changes the output by about $f'(a)$ times the nudge. Rules like $(x^n)'=nx^{n-1}$ and the product rule find it quickly."
where_this_fits: |
  ### What is a partial derivative?

  A partial derivative is the slope of a function that has more than one input, measured while only one of those inputs changes and the others stay where they are. So a function of two inputs has two partial derivatives.

  Why do we need them? The derivative handles a function of one input, but most functions in machine learning have many. A machine-learning model is a formula that makes predictions, and its error depends on every adjustable number in it at once, and to improve the model we need to know how the error responds to each of those numbers on its own. Partial derivatives give us exactly that, one slope per input, worked out with the derivative rules we already know.
knowledge_points:
  - id: pd-hold-fixed
    title: "Change one input at a time"
    tldr: |
      - A function with several inputs can rise differently in each direction.
      - Holding the other inputs fixed leaves one direction to measure.
      - That direction's slope is called a partial derivative, and each input has its own.
    explain: |
      ### A function with two inputs

      In the derivatives lesson, every function had one input. Now let's take a function with two inputs, $f(x,y)=x^2+2y^2$. Think of $(x,y)$ as a point on a map and $f(x,y)$ as the height of the ground above it.

      We'll stand at $P=(1.5,1)$. Substituting its coordinates gives the height:
      $$f(1.5,1)=1.5^2+2\times1^2=4.25.$$
      The ground may rise at different rates along $x$ and $y$, so we have to say which way we're walking.

      ### Walking with only x changing

      Let's walk along the orange line on the left, where $y$ stays at $1$. This leaves a function of $x$ alone, drawn on the right:
      $$\begin{aligned}f(x,1)&=x^2+2 &&\text{freeze }y=1\\\text{slope along }x&=2x &&\text{use the power rule}\\2\times1.5&=3 &&\text{find the slope at }P\end{aligned}$$
      The blue line touches the curve at $P$ with this slope.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" aria-label="Left: a map of the inputs x and y, with the point P at (1.5, 1) and an orange line through it along which y stays 1 and only x moves. Right: the height along that orange line, the curve x squared plus 2, with P at height 4.25 and a blue line touching the curve at P with slope 3">
