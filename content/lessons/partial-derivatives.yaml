concept: partial-derivatives
version: 2
objective: |
  **Goal:** compute the partial derivative of a function of several variables with respect to any one of them, and read it as the rate of change when only that variable moves.
why: |
  A house-price model estimates £240,000 for a 100 m² house aged 20. An estate agent wants to know how much an extra room would add to that estimate. Comparing it with a larger, younger house mixes the effects of size and age. A partial derivative answers the question by changing size while keeping age fixed. The same idea helps improve the model itself. Its weights are adjustable numbers in its prediction formula; changing them all together hides which change helped. Partial derivatives show how each weight affects the prediction error while the others stay fixed. You'll need this idea for gradients, gradient descent, the chain rule, and backpropagation.
knowledge_points:
  - id: pd-hold-fixed
    title: Change one input, hold the rest fixed
    explain: |
      An estate agent wants to price an extension to a 100 m² house aged 20. Their formula uses size $s$, in tens of square metres, and age $a$, in years. The estimated price, in thousands of pounds, is

      $$P(s, a) = 30s - 2a - 0.1\,s\,a$$

      Here $s = 10$, giving $P(10, 20) = 300 - 40 - 20 = 240$, or £240,000. **How much does extra space add?** One derivative won't do, because the price depends on two inputs.

      So keep the age at 20 and differentiate in size alone. Comparing a larger, younger house instead would mix the effects of size and age.

      This works because you are walking along one row of the grid below. Along that row, price depends on size alone, so its slope measures size's effect.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" aria-label="A grid of houses by size and age. From the house at size 10 and age 20, a green arrow moves right along the size axis with age fixed, labelled partial P by partial s. An amber arrow moves up along the age axis with size fixed, labelled partial P by partial a.">
        <line x1="70" y1="220" x2="420" y2="220" stroke="#d4d4d4" stroke-width="2"/>
        <line x1="70" y1="220" x2="70" y2="20" stroke="#d4d4d4" stroke-width="2"/>
        <line x1="70" y1="120" x2="420" y2="120" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4 4"/>
        <line x1="220" y1="220" x2="220" y2="20" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4 4"/>
        <text x="420" y="244" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">size s (tens of m²)</text>
        <text x="78" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">age a (years)</text>
        <text x="220" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">10</text>
        <text x="60" y="125" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">20</text>
        <line x1="220" y1="120" x2="340" y2="120" stroke="#10b981" stroke-width="3"/>
        <polygon points="350,120 336,113 336,127" fill="#10b981"/>
        <line x1="220" y1="120" x2="220" y2="50" stroke="#f59e0b" stroke-width="3"/>
        <polygon points="220,40 213,54 227,54" fill="#f59e0b"/>
        <circle cx="220" cy="120" r="6" fill="#171717"/>
        <text x="212" y="142" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#171717">£240k</text>
        <text x="450" y="104" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#10b981">∂P/∂s: grow the size,</text>
        <text x="450" y="124" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#10b981">age held at 20</text>
        <text x="450" y="54" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f59e0b">∂P/∂a: add years,</text>
        <text x="450" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f59e0b">size held at 10</text>
      </svg>
      ```

      The derivative of $P$ with $s$ moving and $a$ held fixed is the **partial derivative** of $P$ with respect to $s$. It's written $\frac{\partial P}{\partial s}$, read "partial P by partial s". The curly $\partial$ is a reminder that only one input moves.

      In symbols, nudge $s$ by a small $h$ and keep $a$ exactly as it was:

      $$\frac{\partial P}{\partial s} = \lim_{h \to 0} \frac{P(s + h, a) - P(s, a)}{h}$$

      Swap the roles and you get $\frac{\partial P}{\partial a}$, the rate of change as the house ages with its size fixed. A function of two inputs has two partial derivatives.
    worked: |
      This example shows how keeping age fixed lets the agent estimate the value of extra space.

      Take the house with $s = 10$ and $a = 20$.

      1. Keep $a = 20$, so $P = 30s - 40 - 2s = 28s - 40$.
      2. Differentiate with respect to $s$: $\frac{\partial P}{\partial s} = 28$. This means £28,000 per extra 10 m².
      3. Add 1 m², which increases $s$ by $h = 0.1$. Then $P(10.1, 20) = 303 - 40 - 20.2 = 242.8$. The price rose by £2,800, giving a rate of $2.8 \div 0.1 = 28$ in our chosen units.

      Now keep $s = 10$ instead. We get $P = 300 - 2a - a = 300 - 3a$, so $\frac{\partial P}{\partial a} = -3$. Each extra year takes about £3,000 off this house's price.

      A partial derivative is an ordinary derivative taken while every other input is held fixed.
    problems:
      - pdp-meaning
      - pdp-house-rate
      - pdp-why-freeze
      - pdp-sign
      - pdp-nudge-check
      - pdp-how-many
  - id: pd-compute
    title: Computing partials with the derivative rules
    explain: |
      The agent needs estimates for many houses. **Can one derivative formula cover them all?** Substituting each house's age first means repeating the work. Instead, leave age as a letter and treat it as a constant, a number that stays fixed.

      This works because the letter keeps the same value while size changes, just as 20 did for our first house.

      All the derivative rules still apply. For $\frac{\partial}{\partial x}$, read "the partial derivative with respect to $x$ of":

      - A term without $x$, such as $3y$ or $e^y$, is constant and contributes 0.
      - A letter multiplying an $x$ term stays in front, like a constant multiple: $\frac{\partial}{\partial x}\,(x^2 y) = 2xy$.
      - Differentiate sums term by term. Products of two expressions containing $x$ need the product rule.

      Repeat for each input, keeping the others fixed.
    worked: |
      This example shows both partial derivatives of one function, computed term by term.

      Let $f(w, b) = w^2 b + 3b$, with inputs $w$ and $b$.

      **With respect to $w$** (treat $b$ as a constant):

      1. $w^2 b$: $b$ is a constant multiple of $w^2$, giving $2wb$.
      2. The term $3b$ contains no $w$, so its derivative is 0.
      3. So $\frac{\partial f}{\partial w} = 2wb$.

      **With respect to $b$** (treat $w$ as a constant):

      1. $w^2 b$: $w^2$ is a constant multiple of $b$, giving $w^2$.
      2. The derivative of $3b$ is 3.
      3. So $\frac{\partial f}{\partial b} = w^2 + 3$.

      At $(w, b) = (2, 5)$: $\frac{\partial f}{\partial w} = 2 \cdot 2 \cdot 5 = 20$ and $\frac{\partial f}{\partial b} = 4 + 3 = 7$.

      Once you decide which input changes, the usual derivative rules apply.
    problems:
      - pdp-compute-x
      - pdp-value-template
      - pdp-why-zero
      - pdp-exp-log
      - pdp-product
      - pdp-compute-y
  - id: pd-many-inputs
    title: A squared gap with many inputs
    explain: |
      A house-price model predicts $wx + b$, where $x$ is size in tens of square metres and price is in hundreds of thousands of pounds. The adjustable numbers $w$ and $b$ are called parameters. For a house with $x = 3$, $w = 1$ and $b = 1$, it predicts 4. If the recorded price is $y = 1$, its prediction is too high by 3. We measure the error by squaring the difference:

      $$f(w, b) = (wx + b - y)^2$$

      **How should we adjust $w$ and $b$ to reduce this error?** Changing both together hides which adjustment helped. Take a partial derivative for each parameter instead, keeping the recorded $x$ and $y$ fixed.

      Write $g = wx + b - y$ for the difference. Since $f = g \cdot g$, the product rule gives $g'g + gg' = 2g\,g'$. Here the prime means differentiation in the chosen parameter.

      This works because changing a parameter changes both copies of $g$. The product rule counts the effect on each copy:

      - $\frac{\partial g}{\partial w} = x$, so $\frac{\partial f}{\partial w} = 2(wx + b - y)\,x$.
      - $\frac{\partial g}{\partial b} = 1$, so $\frac{\partial f}{\partial b} = 2(wx + b - y)$.

      A positive partial means increasing that parameter slightly raises the error, so try decreasing it. An ML model with more parameters uses the same calculation for each one.
    worked: |
      This example shows which adjustment would reduce the house-price model's squared error.

      Size is measured in tens of square metres and price in hundreds of thousands of pounds. A house with $x = 3$ sold for $y = 1$. The model uses $w = 1$ and $b = 1$.

      1. The difference is $g = 1 \cdot 3 + 1 - 1 = 3$, so $f = 9$.
      2. Changing $w$ gives the rate $\frac{\partial f}{\partial w} = 2 \cdot 3 \cdot 3 = 18$.
      3. Changing $b$ gives the rate $\frac{\partial f}{\partial b} = 2 \cdot 3 = 6$.

      Both partials are positive, so decreasing either parameter slightly reduces the squared error. The same small decrease in $w$ reduces it about 3 times as much as a decrease in $b$, because $w$ is multiplied by $x = 3$.

      Each partial describes how much the error changes when one parameter changes and the other stays fixed.
    problems:
      - pdp-gap-w
      - pdp-gap-template
      - pdp-gap-b
      - pdp-why-data-fixed
      - pdp-turn-dial
      - pdp-three-inputs
final: pd-explain
summary: |
  - A partial derivative such as $\frac{\partial P}{\partial s}$ is the rate of change of the output as one input moves while every other input is held fixed.
  - To compute it, treat the other inputs as constants and use the ordinary derivative rules. Terms without the changing input contribute 0, and constant multipliers stay in front.
  - A function of $n$ inputs has $n$ partial derivatives. Each tells you how much the output changes for a small increase in one input.

  **Where you'll use this:** gradients collect these rates of change. Gradient descent uses them to adjust model weights, while the chain rule and backpropagation connect the rates across a model's calculations.
