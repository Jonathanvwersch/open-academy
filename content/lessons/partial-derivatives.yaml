  - id: pd-many-inputs
    title: "Find the slopes of a model's error"
    tldr: |
      - A prediction model has adjustable numbers, and training changes them to reduce its error.
      - The recorded data stay fixed while we measure each adjustable number's effect.
      - Partial derivatives tell us whether raising each number a little will lower the squared error.
    explain: |
      ### A model with two adjustable numbers

      A **model** is a formula that makes predictions. **Training** adjusts its numbers to bring predictions closer to the answers. Let's use partial derivatives to measure each number's effect.

      Our model predicts a house's price from its area $x$. It multiplies the area by a **weight** $w$, which says how much the price rises per unit of area, and adds a **bias** $b$, a fixed amount on top. So it predicts $wx+b$, and since training adjusts $w$ and $b$, we call them the model's **parameters**.

      Our house has area $x=2$, in hundreds of square metres, and price $y=7$, in hundreds of thousands of pounds. The **error** is prediction minus price; write $e$ for this error. Squaring it makes every miss positive, giving a **loss**, the score training tries to reduce. With $w=b=1$:
      $$\begin{aligned}wx+b&=1\times2+1=3 &&\text{predict the price}\\e&=3-7=-4 &&\text{find the error, the red gap}\\L&=e^2=16 &&\text{square the error}\end{aligned}$$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" aria-label="Left: area against price. The grey line is the model prediction w x plus b with w equal to 1 and b equal to 1, which predicts 3 at area 2. The house is the black dot at area 2 and price 7, and a red dashed segment from 3 up to 7 shows the error of minus 4. Right: the loss as w changes while b stays 1, a curve that is 16 at w equal to 1, where a blue line touches it with slope minus 16, and falls to 0 at w equal to 3">
      <defs><marker id="pd3-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
