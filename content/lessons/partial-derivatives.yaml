concept: partial-derivatives
version: 1
fast_path: [objective, summary]
blocks:
  - kind: objective
    md: |
      **Goal:** compute partial derivatives of functions of several variables.
  - kind: intuition
    md: |
      A function can depend on several variables at once. A **partial derivative** asks: *if I nudge only one variable and freeze all the others, how does the output change?* You differentiate with respect to that variable and treat every other variable as a constant.
  - kind: example
    md: |
      This example shows each partial derivative varying one variable while holding the other fixed.

      $f(w, b) = w^2 b + 3b$.

      - $\partial f/\partial w$: treat $b$ as a constant, so $2wb$.
      - $\partial f/\partial b$: treat $w$ as a constant, so $w^2 + 3$.
  - kind: math
    md: |
      $$\frac{\partial f}{\partial x_i}(x) = \lim_{h\to0}\frac{f(x_1,\dots,x_i + h,\dots,x_n) - f(x)}{h}$$
      Every single-variable rule still applies; the other variables simply behave like numbers.
  - kind: worked
    md: |
      This worked example applies the partial-derivative rules to a function of two variables.

      **A function of two variables.** $f(w, b) = (wx + b)^2$, where $x$ is held fixed.

      Let $q = wx + b$. Then:
      - $\partial f/\partial w = 2q \cdot x$
      - $\partial f/\partial b = 2q$

      With $x = 2$, $w = 1$, and $b = 0$, $q = 2$, so $\partial f/\partial w = 8$ and $\partial f/\partial b = 4$.
  - kind: check
    exercise: pd-check-1
  - kind: summary
    md: |
      - $\partial f/\partial x_i$: differentiate in $x_i$ and hold the other variables fixed.
      - In a loss, the data are constants and the parameters are the variables.
