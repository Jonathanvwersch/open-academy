concept: maximum-likelihood
version: 1
objective: "**Goal:** choose a model's unknown numbers by maximum likelihood, making the observed
  data as probable as possible, and show that with Gaussian noise this means minimising the mean
  squared error."
recap:
  - concept: probability-basics
    text: A probability is a number from 0 to 1 saying how likely an event is. Two events are
      independent when one happening tells us nothing about whether the other happens.
  - concept: gaussian-distribution
    text: A Gaussian with mean $\mu$ and standard deviation $\sigma$ has the bell-shaped density
      $f(x)=\frac{1}{\sigma\sqrt{2\pi}}e^{-(x-\mu)^2/(2\sigma^2)}$, highest at $\mu$. Height times a
      small width gives the chance of a reading in that narrow interval.
  - concept: derivatives
    text: A derivative gives a curve's slope, 0 at a smooth hill's top or valley's bottom. By the
      power rule, $x^n$ has slope $nx^{n-1}$. $\ln x$, the power of $e\approx2.718$ giving $x$,
      exists for $x>0$ with slope $1/x$.
where_this_fits: |
  ### What is maximum likelihood?

  Maximum likelihood is a rule for choosing the unknown numbers in a probability model, which says how likely each outcome is. It picks the values that make the data we saw as probable as possible.

  Models have numbers we must fill in from data, such as a coin's chance of heads. Probability says how likely data is once those numbers are known, but not how to choose them. Maximum likelihood works for any kind of data. Training a model means adjusting its numbers to make a **loss**, a score of how badly its predictions fit, as small as possible. Maximum likelihood explains where the usual loss for predicting numbers, the mean squared error, comes from when the random errors in the data are Gaussian.
knowledge_points:
  - id: mle-score-guess
    title: Score a guess for a coin's chance of heads
    explain: |
      ### Three flips of a bent coin

      Let's start with the simplest case. A bent coin lands heads with some unknown probability $p$. We flip it three times and see heads, heads, tails. Which value of $p$ fits these flips best? A coin that almost never lands heads would rarely give two heads, and a coin that always lands heads could never give a tail, so some guesses clearly fit better than others.

      ### The chance of the whole sequence

      Separate flips are independent, and the chance that independent events all happen is the product of their chances. Picture repeating the three flips many times. The first flip is heads on a fraction $p$ of those tries. Of those tries, a fraction $p$ also give heads on the second flip, and of those, a fraction $1-p$ give tails on the third. So if the chance of heads is $p$, the chance of our exact flips is

      $$L(p)=p\times p\times(1-p)$$

      This is the **likelihood** of the guess $p$: the probability of the data we saw, worked out as if $p$ were the true value. The data stay fixed, and we change the guess.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" aria-label="The likelihood L of p equals p times p times 1 minus p for the flips heads, heads, tails, drawn for every guess p from 0 to 1. It is 0 at both ends. Blue dots mark the guesses 0.2, 0.5 and 0.9, with likelihoods 0.032, 0.125 and 0.081. The orange dot marks the top of the curve at p equals 2/3, where the likelihood is 4/27, about 0.148"><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717"><path d="M70 270 H600 M70 270 V30" stroke="#737373" fill="#ffffff" fill-opacity="0"/><path d="M65 195 H70" stroke="#737373"/><text x="60" y="200" text-anchor="end" fill="#737373">0.05</text><path d="M65 120 H70" stroke="#737373"/><text x="60" y="125" text-anchor="end" fill="#737373">0.1</text><path d="M65 45 H70" stroke="#737373"/><text x="60" y="50" text-anchor="end" fill="#737373">0.15</text><text x="60" y="275" text-anchor="end" fill="#737373">0</text><path d="M70 270 v5" stroke="#737373"/><text x="70" y="292" text-anchor="middle" fill="#737373">0</text><path d="M174 270 v5" stroke="#737373"/><text x="174" y="292" text-anchor="middle" fill="#737373">0.2</text><path d="M330 270 v5" stroke="#737373"/><text x="330" y="292" text-anchor="middle" fill="#737373">0.5</text><path d="M416.67 270 v5" stroke="#737373"/><text x="416.67" y="292" text-anchor="middle" fill="#737373">2/3</text><path d="M538 270 v5" stroke="#737373"/><text x="538" y="292" text-anchor="middle" fill="#737373">0.9</text><path d="M590 270 v5" stroke="#737373"/><text x="590" y="292" text-anchor="middle" fill="#737373">1</text><text x="335" y="318" text-anchor="middle">guess p (chance of heads)</text><text x="70" y="20" text-anchor="start">likelihood L(p) of heads, heads, tails</text><path d="M70 270 L75.2 269.85 L80.4 269.41 L85.6 268.69 L90.8 267.7 L96 266.44 L101.2 264.92 L106.4 263.16 L111.6 261.17 L116.8 258.94 L122 256.5 L127.2 253.85 L132.4 250.99 L137.6 247.95 L142.8 244.72 L148 241.31 L153.2 237.74 L158