      ```

      The curve shows $L(p)$ for every guess. A fair-coin guess, $p=0.5$, gives $0.5\times0.5\times0.5=0.125$. The guess $p=0.9$ gives $0.9\times0.9\times0.1=0.081$, which is smaller because under that guess a tail is rare, with a chance of only 0.1. The guess $p=0.2$ gives only $0.032$.

      ### The best guess

      The **maximum likelihood estimate** is the guess with the largest likelihood, the top of the curve. Here it is $p=2/3$, the fraction of flips that were heads. The same calculation works for any number of flips, so the maximum likelihood estimate of a coin's chance of heads is always the fraction of heads seen.

      Be careful not to read $L(2/3)\approx0.148$ as "a 14.8% chance that $p$ is $2/3$". It is the chance of the flips *if* $p$ were $2/3$. Likelihoods are not chances of the different guesses, so there is no reason for them to add up to 1.
    worked: |
      Let's find the top of the likelihood curve exactly, using the fact that the slope is 0 at the top of a smooth hill.

      1. **Multiply out the likelihood.** The power rule works one power at a time, so we first write $L$ as a sum of powers of $p$.
         $$L(p)=p^2(1-p)=p^2-p^3$$

      2. **Take the derivative.** The power rule turns $p^2$ into $2p$ and $p^3$ into $3p^2$.
         $$L'(p)=2p-3p^2=p\,(2-3p)$$

      3. **Set the slope to 0.** A product is 0 only when one of its factors is 0, so the slope is 0 at $p=0$ or where $2-3p=0$. Guesses run from 0 to 1, so the highest point is either a flat point or one of the two ends, where the curve stops. The likelihood is 0 at both ends, $p=0$ and $p=1$, so the top is the other flat point.
         $$2-3p=0\quad\text{so}\quad p=\tfrac23$$

      4. **Check the height.** We put $p=2/3$ back into $L$.
         $$L(\tfrac23)=\tfrac23\times\tfrac23\times\tfrac13=\tfrac{4}{27}\approx0.148$$

      This beats every guess we tried, and $2/3$ is exactly the fraction of heads: two of the three flips.
