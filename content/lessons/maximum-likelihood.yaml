final: mle-explain
summary: |
  - The likelihood of a guess is the probability of the observed data if that guess were true. For measured readings such as distances, we use the product of density heights, which ranks guesses the same way. Maximum likelihood picks the guess that makes it largest; for a coin, that is the fraction of heads.
  - Logs turn the product over independent readings into a sum, $\ln(ab)=\ln a+\ln b$, without moving the best guess. We often minimise the negative log-likelihood $-\ln L$ instead.
  - For Gaussian readings with a fixed $\sigma$, the log-likelihood is a constant minus the sum of squared distances over $2\sigma^2$, so the best centre is the mean.
  - When a model's predictions are the centres of the bells, maximising the likelihood is minimising the mean squared error. That holds only for Gaussian noise; wild mistakes in readings or yes-or-no data call for care or another loss.

  **Next:** Language models, which predict the next word of a text, come later in the course. They are trained by maximum likelihood, adjusting their numbers to make real text as probable as possible.
