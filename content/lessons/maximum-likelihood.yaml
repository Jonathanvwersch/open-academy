  - id: mle-logs
    title: Swap a product of chances for a sum of logs
    explain: |
      ### Many flips make tiny numbers

      Real data has many readings, not three. Suppose we flip the coin 100 times and record a sequence with 60 heads and 40 tails. As in step 1, the likelihood is the chance of that exact sequence, so it multiplies 60 factors of $p$ and 40 factors of $1-p$:

      $$L(p)=p^{60}(1-p)^{40}$$

      Even at its best guess, $p=0.6$, this is only about $5.9\times10^{-30}$. With thousands of readings, the product gets so small that a computer, which stores numbers to limited precision, rounds it to exactly 0. Then every guess looks equally bad.

      ### Logs turn products into sums

      The natural logarithm $\ln x$, or log for short, is the power of $e$ that gives $x$. Powers add when we multiply, as in $e^a\times e^b=e^{a+b}$, so the log of a product is the sum of the logs:

      $$\ln(ab)=\ln a+\ln b$$

      Taking the log of the likelihood gives the **log-likelihood**. Sixty factors of $p$ become sixty copies of $\ln p$ added together:

      $$\ln L(p)=60\ln p+40\ln(1-p)$$

      Each log, such as $\ln 0.6\approx-0.51$, is an ordinary-sized number, so the sum stays easy to store however many flips there are.

      ### The same best guess

      The log changes the heights but never their order. Its slope, $1/x$, is positive for every $x$ above 0, so $\ln x$ always rises, and a larger likelihood always has a larger log-likelihood. A guess with likelihood 0 has no log, since $\ln x$ exists only for $x$ above 0, but it is never the best guess anyway. So the guess that maximises one also maximises the other. The picture below shows this for the three flips from step 1, where $\ln L(p)=2\ln p+\ln(1-p)$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" aria-label="Top: the likelihood L of p for heads, heads, tails, peaking at 0.148. Bottom: its log, ln L of p, which is negative everywhere, falls away on both sides and peaks at about minus 1.91. An orange dashed line shows that both peaks are at the same guess, p equals 2/3"><g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717"><path d="M70 160 H600 M70 160 V30" stroke="#737373" fill="#ffffff" fill-opacity="0"/><path d="M70 370 H600 M70 370 V210" stroke="#737373" fill="#ffffff" fill-opacity="0"/><text x="60" y="165" text-anchor="end" fill="#737373">0</text><path d="M65 80 H70" stroke="#737373"/><text x="60" y="85" text-anchor="end" fill="#737373">0.1</text><path d="M65 236.67 H70" stroke="#737373"/><text x="60" y="241.67" text-anchor="end" fill="#737373">−2</text><path d="M65 303.33 H70" stroke="#737373"/><text x="60" y="308.33" text-anchor="end" fill="#737373">−4</text><path d="M65 370 H70" stroke="#737373"/><text x="60" y="375" text-anchor="end" fill="#737373">−6</text><path d="M70 370 v5" stroke="#737373"/><text x="70" y="392" text-anchor="middle" fill="#737373">0</text><path d="M70 160 v5" stroke="#737373"/><path d="M330 370 v5" stroke="#737373"/><text x="330" y="392" text-anchor="middle" fill="#737373">0.5</text><path d="M330 160 v5" stroke="#737373"/><path d="M416.67 370 v5" stroke="#737373"/><text x="416.67" y="392" text-anchor="middle" fill="#737373">2/3</text><path d="M416.67 160 v5" stroke="#737373"/><path d="M590 370 v5" stroke="#737373"/><text x="590" y="392" text-anchor="middle" fill="#737373">1</text><path d="M590 160 v5" stroke="#737373"/><text x="80" y="25" text-anchor="start">likelihood L(p)</text><text x="80" y="205" text-anchor="start">log-likelihood ln L(p)</text><text x="600" y="358" text-anchor="end">guess p</text><path d="M70 160 L75.2 159.92 L80.4 159.69 L85.6 159.3 L90.8 158.77 L96 158.1 L101.2 157.29 L106.4 156.35 L111.6 155.29 L116.8 154.1 L1