  - id: mle-mse
    title: Turn likelihood into mean squared error
    explain: |
      ### From one centre to many predictions

      So far all readings shared one centre. A model is a rule with adjustable numbers that turns each input into a prediction. The same few numbers serve every example, so errors usually remain. Suppose a robot stands at four spots in a room and a model predicts its sensor's distance reading at each spot. The readings are $4,6,9$ and $7$ m. We write $y_i$ for the $i$-th measured reading and $\hat y_i$, said "y-hat", for the model's prediction of it. We assume each reading is its prediction plus independent Gaussian noise with a fixed $\sigma$, so each $y_i$ has its own bell centred at $\hat y_i$.

      ### The same steps with new centres

      As in step 3, the log-likelihood is the sum of the log heights at the readings, and each log height is now $c-(y_i-\hat y_i)^2/(2\sigma^2)$. We call each gap $y_i-\hat y_i$ an **error**. Write $E$ for the sum of the squared errors over all $n$ readings:

      $$\begin{aligned}E={}&(y_1-\hat y_1)^2+\dots\\&+(y_n-\hat y_n)^2\end{aligned}$$

      Adding the $n$ log heights then gives

      $$\ln L=nc-\frac{E}{2\sigma^2}$$

      Dividing $E$ by $n$ gives the **mean squared error**, an average that doesn't grow just because there are more readings:

      $$\text{MSE}=\frac{E}{n}$$

      Since $n$, $c$ and $\sigma$ stay fixed, the predictions with the higher likelihood are exactly those with the lower MSE. So training a model to minimise MSE *is* maximum likelihood, provided the noise is Gaussian with a fixed spread. That assumption often suits measured numbers, so MSE is the usual loss for predicting them.

      One model, model A, predicts 3, 7, 7 and 7 m. Its errors are $1,-1,2$ and $0$, their squares add to 6, and its MSE is $6/4=1.5$ square metres.

