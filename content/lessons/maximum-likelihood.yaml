      ```

      ### When squared error misleads

      Squaring makes a miss of 10 count 100 times as much as a miss of 1. That suits Gaussian noise, which almost never lands far away. Be careful when one reading is a wild mistake, say the sensor misfires and reads 50 m where 7 m was predicted. Its squared error of $43^2=1849$ swamps the rest, so training moves the predictions towards that bad reading. And yes-or-no outcomes, like whether a coin lands heads, aren't a number plus bell-shaped noise. For them, maximum likelihood gives the negative log-likelihood of step 2 as the loss.
    worked: |
      Model A has MSE 1.5, from the picture. Model B predicts 6, 8, 9 and 5 m for the same four readings. Let's check that the model with the lower MSE also has the higher likelihood, taking $\sigma=1$ m.

      1. **Find B's errors.** We subtract each of B's predictions from its measured reading.
         $$\begin{aligned}4-6&=-2,&6-8&=-2\\9-9&=0,&7-5&=2\end{aligned}$$

      2. **Find B's MSE.** We square the errors, add them and divide by 4.
         $$\text{MSE}_B=\frac{4+4+0+4}{4}=3$$

      3. **Score both models.** With $n=4$ and $2\sigma^2=2$, each log-likelihood is $4c-E/2$. A's squared errors add to 6 and B's to 12.
         $$\ln L_A=4c-3,\quad \ln L_B=4c-6$$

      4. **Compare.** The $4c$ cancels in the difference.
         $$(4c-3)-(4c-6)=3$$

      Undoing the log, model A's product of heights is about $e^3\approx20$ times model B's. So the model with the lower MSE is also the one with the higher likelihood.
