      The orange bell, centred at 101, is fairly high at all three readings. The blue bell, centred at 99, is higher at 98 but almost zero at 104, so its product of heights is about 4.5 times smaller. These products are not chances themselves. But the same $w^3$ was dropped from each, so their ratio is about the ratio of the chances.

      ### Taking logs gives squared distances

      From the recap, each height is $f(x)=\frac{1}{\sigma\sqrt{2\pi}}e^{-(x-\mu)^2/(2\sigma^2)}$. The log of a product is a sum, and $\ln(e^y)=y$, so the log of one height has two parts. The first, $\ln\frac{1}{\sigma\sqrt{2\pi}}$, is the same for every $\mu$, so we call it $c$:

      $$\ln f(x)=c-\frac{(x-\mu)^2}{2\sigma^2}$$

      Adding the three logs, with $2\sigma^2=8$, gives

      $$\ln L(\mu)=3c-\frac{S(\mu)}{8}$$

      where $S(\mu)$ is the sum of squared distances from the readings to $\mu$:

      $$\begin{aligned}S(\mu)={}&(98-\mu)^2+(101-\mu)^2\\&+(104-\mu)^2\end{aligned}$$

      Only $S(\mu)$ depends on $\mu$, and it is subtracted. So the most likely centre is the one with the **smallest sum of squared distances** to the readings. That sum is 21 at $\mu=100$, 18 at $\mu=101$ and 21 at $\mu=102$.

      Be careful about the role of $\sigma$. Plotted against the guess $\mu$, $\ln L$ is a hill with its top at $\mu=101$. Changing $\sigma$ reshapes the hill but never moves its top, because $\sigma$ doesn't change which $\mu$ makes $S(\mu)$ smallest.
    worked: |
      Let's find the centre $\mu$ that makes the sum of squared distances $S(\mu)$ as small as possible.

      1. **Expand one square.** Multiplying out writes each square as powers of $\mu$, ready for the power rule. Here $x$ is any one reading.
         $$(x-\mu)^2=x^2-2x\mu+\mu^2$$

      2. **Differentiate in $\mu$.** The reading $x$ is fixed, so $x^2$ has slope 0, $-2x\mu$ has slope $-2x$ and $\mu^2$ has slope $2\mu$. Adding the slopes for the three readings gives
         $$\begin{aligned}S'(\mu)&=(2\mu-196)+(2\mu-202)\\&\quad+(2\mu-208)\\&=6\mu-606\end{aligned}$$

      3. **Set the slope to 0.** The slope $6\mu-606$ is negative for $\mu$ below 101 and positive above it, so $S$ falls until $\mu=101$ and rises after. Its only flat point is the bottom.
         $$6\mu-606=0\quad\text{so}\quad\mu=101$$

      4. **Recognise the mean.** The 606 is twice the sum of the readings and the 6 is twice their count, so $\mu$ is their average.
         $$\mu=\frac{98+101+104}{3}=101$$

      The same steps work for any readings: the maximum likelihood centre for Gaussian readings is their mean.
