L402.8 233.81 L408 233.71 L413.2 233.66 L418.4 233.65 L423.6 233.69 L428.8 233.78 L434 233.91 L439.2 234.1 L444.4 234.33 L449.6 234.63 L454.8 234.98 L460 235.39 L465.2 235.87 L470.4 236.41 L475.6 237.04 L480.8 237.74 L486 238.52 L491.2 239.41 L496.4 240.39 L501.6 241.49 L506.8 242.71 L512 244.07 L517.2 245.59 L522.4 247.29 L527.6 249.2 L532.8 251.34 L538 253.78 L543.2 256.55 L548.4 259.75 L553.6 263.48 L558.8 267.91 L564 273.28 L569.2 280.02 L574.4 288.92 L579.6 301.75" fill="#ffffff" fill-opacity="0" stroke="#737373" stroke-width="2"/><path d="M416.67 30 V370" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/><circle cx="416.67" cy="41.48" r="6" fill="#f59e0b"/><text x="404.67" y="31.48" text-anchor="end" fill="#f59e0b">top: 0.148</text><circle cx="416.67" cy="233.65" r="6" fill="#f59e0b"/><text x="404.67" y="223.65" text-anchor="end" fill="#f59e0b">top: ln 0.148 ≈ −1.91</text></g></svg>
      ```

      Both curves peak at $p=2/3$. Training pushes a loss down, so a loss must be low when the fit is good. In practice we therefore flip the sign and *minimise* the **negative log-likelihood**, $-\ln L$. It has its lowest point at the same guess.

      Be careful with the signs. A likelihood below 1 has a log below 0, so log-likelihoods are usually negative. For example, a log-likelihood of $-67$ beats one of $-69$, because closer to zero means more likely. The worked example below has numbers like these.
    worked: |
      Let's compare the guesses $p=0.5$ and $p=0.6$ for the 100 flips with 60 heads, without ever forming a tiny product.

      1. **Score $p=0.5$.** All 100 factors are $0.5$, so we add 100 copies of $\ln0.5$.
         $$\ln L(0.5)=100\ln0.5\approx-69.31$$

      2. **Score $p=0.6$.** We add 60 copies of $\ln0.6$ for the heads and 40 copies of $\ln0.4$ for the tails.
         $$\begin{aligned}\ln L(0.6)&=60\ln0.6+40\ln0.4\\&\approx-30.65-36.65\\&=-67.30\end{aligned}$$

      3. **Compare.** The data are more probable under the guess with the larger log-likelihood, so $p=0.6$ fits better.
         $$-67.30-(-69.31)=2.01$$

      4. **Measure how much better.** Since $a=b\times(a/b)$, the rule $\ln(ab)=\ln a+\ln b$ gives $\ln a=\ln b+\ln(a/b)$. So the gap is the log of the ratio of likelihoods, and raising $e$ to the gap undoes the log.
         $$\frac{L(0.6)}{L(0.5)}=e^{2.01}\approx7.5$$

      The 100 flips are about 7.5 times as probable if $p=0.6$ as if $p=0.5$. And $0.6$ is the fraction of heads, so it is the maximum likelihood estimate.
