  - id: mle-gauss-centre
    title: Fit a bell curve's centre to readings
    explain: |
      ### Noisy readings of one distance

      Now let's apply the same rule to measured numbers with Gaussian noise. A robot's distance sensor gives readings with Gaussian noise of standard deviation $\sigma=2$ cm around the true distance $\mu$, which we don't know. Three readings come back: 98, 101 and 104 cm. Which $\mu$ fits best?

      ### Likelihood from heights

      A Gaussian gives any single exact distance a chance of 0. Only ranges have chances. This sensor reports whole centimetres, so a reading of 98 means somewhere between 97.5 and 98.5, an interval of width $w=1$ cm. Its chance is about height times width, $f(x)\,w$, where $f$ is the Gaussian density centred at the guess $\mu$. The readings are independent, so we multiply. The factor $w^3$ is the same for every guess, so it never changes which guess wins. We drop it and use the product of heights as the likelihood:

      $$L(\mu)=f(98)\times f(101)\times f(104)$$

