      <path d="M100 60 L160 120 M240 120 L300 180" stroke="#f59e0b" stroke-width="3"/>
      <path d="M130 90 L151 69" stroke="#3b82f6" stroke-width="3" marker-end="url(#px-b)"/>
      <path d="M270 150 L291 129" stroke="#3b82f6" stroke-width="3" marker-end="url(#px-b)"/>
      <circle cx="40" cy="180" r="7" fill="#ef4444"/>
      <circle cx="40" cy="60" r="7" fill="#ef4444"/>
      <circle cx="160" cy="180" r="7" fill="#ef4444"/>
      <circle cx="160" cy="60" r="7" fill="#10b981"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="100" y="30" fill="#171717" text-anchor="middle" font-weight="600">AND</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="26" y="185" fill="#737373" text-anchor="end">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="26" y="65" fill="#737373" text-anchor="end">1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="40" y="202" fill="#737373" text-anchor="middle">0</text>
