concept: perceptron
version: 3
objective: |
  **Goal:** explain how a perceptron turns house features into a simple yes-or-no decision.
where_this_fits: |
  Training and test splits showed how to check price predictions on unseen houses. Week 2 turns the same house measurements into a neural model, beginning with one perceptron. Its thresholded score can answer a yes-or-no question, such as whether a sale exceeds its asking price; later layers will predict the same sale price directly.
knowledge_points:
  - id: perc-score-and-step
    title: A weighted score followed by a yes-or-no output
    explain: |
      **What a perceptron is.** A perceptron multiplies each input feature by a weight, adds a bias, then applies the step activation $\phi(z)$: it outputs 1 when the score is positive and 0 otherwise.

      **How it works.** Let $x=(12,3,20)$ record area, bedrooms and age. The score is $z=w\cdot x+b$. For weights $(0.2,0.1,-0.02)$ and bias $-2.5$, $z=2.4+0.3-0.4-2.5=-0.2$, so the step output is 0. The output can represent a yes/no label such as “sale above asking.”

      Why use a threshold after the score? It converts a continuous number into one of two decisions.

      **Why this is useful.** This is the smallest neural decision rule for classifying house sales before the course builds a price-predicting network.
    worked: |
      This example shows the calculation.
      For $x=(12,3,20)$, weights $(0.2,0.1,-0.02)$ and bias $-2.5$:

      1. Compute $z=0.2(12)+0.1(3)-0.02(20)-2.5=-0.2$.
      2. Since $z$ is not positive, the perceptron outputs 0.
    problems:
      [
        percp-output,
        percp-score-template,
        percp-score-zero,
        percp-weight-sign,
        percp-why-bias,
        percp-robot-gripper,
      ]
  - id: perc-straight-boundary
    title: The decision boundary is a plane
    explain: |
      **What a decision boundary is.** It is the set of inputs where the perceptron's score is exactly zero. In three feature dimensions, this plane is also called a hyperplane.

      **How it works.** For three house features, the equation $w\cdot x+b=0$ describes a plane in three-dimensional input space. On one side the score is positive and the output is 1; on the other it is non-positive and the output is 0. Changing weights tilts the plane; changing the bias shifts it.

      Why is the boundary flat? The score is a weighted sum, so setting it to zero gives a linear equation.

      **Why this is useful.** The boundary shows which combinations of area, bedrooms and age change the model's yes/no house-sale decision.
    worked: |
      This example shows the calculation.
      With score $z=0.2a+0.1r-0.02g-2.5$, the boundary is $0.2a+0.1r-0.02g-2.5=0$. If age $g$ stays fixed, this is a straight line in area $a$ and bedroom count $r$.
    problems:
      [
        percp-boundary-meaning,
        percp-crossing-template,
        percp-which-side,
        percp-bias-shift,
        percp-why-straight,
        percp-no-curve,
      ]
  - id: perc-and-or-xor
    title: One boundary cannot separate XOR
    explain: |
      **What XOR is.** XOR outputs 1 when exactly one of two binary inputs is 1, and 0 when both inputs match.

      **How it works.** The four inputs are $(0,0),(0,1),(1,0),(1,1)$. For AND, only $(1,1)$ is positive; for OR, only $(0,0)$ is negative. A line can separate each pair of output groups. For XOR, the positive corners $(0,1)$ and $(1,0)$ alternate with the negative corners, so no single straight boundary separates them.

      Why does this matter for a perceptron? Its one linear boundary cannot represent every possible pattern.

      **Why this is useful.** XOR gives a precise reason the neural model needs multiple neurons and nonlinear activations.
    worked: |
      This example shows the calculation.
      Label $(0,1)$ and $(1,0)$ as 1, and $(0,0)$ and $(1,1)$ as 0. The labels alternate around the square, so no single line can put both positive corners on one side and both negative corners on the other.
    problems:
      [
        percp-xor-why,
        percp-count-yes-template,
        percp-or-bias,
        percp-nand-output,
        percp-which-pattern,
        percp-robot-bumpers,
      ]
final: perc-explain
summary: |
  - A perceptron computes a weighted score and thresholds it into a yes-or-no result.
  - Its linear decision boundary separates feature combinations with different outputs.
  - A single boundary cannot represent XOR, motivating layers with nonlinear activations.

  **Next:** Activation functions add the nonlinear step needed to represent more than one straight boundary.
