      - percp-or-bias
      - percp-robot-bumpers
final: perc-explain
summary: |
  - A perceptron adds weighted inputs and a bias, then outputs 1 for a positive score and 0 otherwise.
  - With two inputs, its zero-score boundary is a straight line; weights determine which way the line runs and bias shifts it.
  - AND and OR can be separated by one line, but XOR cannot, so one perceptron cannot compute XOR.

  **Next:** Compare smoother functions and calculate how their output changes as the score changes, which training needs.
