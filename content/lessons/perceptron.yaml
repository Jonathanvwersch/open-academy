  - id: perc-straight-boundary
    title: A straight line splits yes from no
    explain: |
      **The question.** Instead of checking inputs one at a time, can you see all the inputs that get a yes? Where does the answer change?

      **Picture it.** Keep $z=x_1+2x_2-4$. Horizontal position is the first input measurement; vertical position is the second. The amber line joins points whose score is zero.

      Even on the line, a point counts as no (red), since zero is not positive. Green means yes. The blue arrow points towards higher scores.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" aria-label="The boundary x1 plus 2x2 equals 4 passes through (4,0) and (0,2); the weight arrow (1,2) is perpendicular towards output 1.">
        <defs><marker id="p2-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M80 280 H520 M80 280 V30" stroke="#737373"/>
          <path d="M80 160 L320 280" stroke="#f59e0b" stroke-width="3"/>
          <path d="M200 220 L260 100" stroke="#3b82f6" stroke-width="3" marker-end="url(#p2-blue)"/>
          <circle cx="200" cy="100" r="6" fill="#10b981"/><circle cx="140" cy="220" r="6" fill="#ef4444"/><circle cx="320" cy="280" r="6" fill="#ef4444"/><circle cx="80" cy="100" r="6" fill="#10b981"/>
          <g stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
            <text x="528" y="284">x₁</text><text x="72" y="23">x₂</text><text x="64" y="302">0</text>
            <text x="12" y="155">(0,2)</text><text x="308" y="304">(4,0)</text><text x="15" y="90">(0,3)</text><text x="155" y="86">(2,3)</text><text x="92" y="244">(1,1)</text>
            <text x="275" y="103" fill="#3b82f6">w = (1,2)</text><text x="345" y="180" fill="#10b981">output 1</text><text x="110" y="263" fill="#ef4444">output 0</text>
            <text x="260" y="233" fill="#f59e0b">z = 0</text>
          </g>
        </g>
      </svg>
      ```

      **The idea.** A **decision boundary** is the set of inputs scoring zero. With at least one weight not zero, two input measurements give a line; three give a plane. If every weight is zero, the score is $b$ everywhere, so there is no boundary.

      This flat (straight, without curves) boundary is a **hyperplane**. Changing the weights' ratio turns it; scaling all of $w$ and $b$ together by a positive factor leaves it unchanged. The Compare cases table after the worked example shows this.

      Which side is yes? The arrow $w$ answers that. Compare it to directions along the line. Start at a boundary point $x$ and move by a non-zero vector $d$ along the line. Both scores are zero:

      $$w\cdot x+b=0.$$
      $$w\cdot(x+d)+b=0.$$
      $$w\cdot x+w\cdot d+b=0.$$

      Subtract the first equation from the third:

      $$w\cdot d=0.$$

      The dot-product lesson says zero dot product means perpendicular for non-zero arrows. So $w$ is perpendicular to the boundary. Stepping along $w$ instead gives:

      $$w\cdot(x+w)+b=(w\cdot x+b)+w\cdot w.$$
      $$w\cdot(x+w)+b=0+w\cdot w.$$

      $$w\cdot w=w_1^2+w_2^2>0.$$

      So the point $x+w$ scores $w\cdot w>0$: it is a yes. So $w$ points into the yes side.

      **Common confusion.** “Better weights could curve the boundary.” No: setting a weighted sum plus bias to zero gives a linear equation. You can turn or slide the line, not bend it.
    worked: |
      Find the boundary and identify the no side for the same perceptron.

      1. **Set the score to zero.**
         $$x_1+2x_2-4=0.$$
      2. **Rearrange to see how the line tilts.**
         $$x_2=2-\frac{x_1}{2}.$$
         For each unit right, the line drops half a unit: slope $-1/2$.

      3. **Find the axis crossings.** Set each input to zero in turn.
         $$x_1=0\quad\Rightarrow\quad x_2=2.$$
         $$x_2=0\quad\Rightarrow\quad x_1=4.$$

      4. **Check with a point: the origin.** It lies on the opposite side from $w$'s arrow. Both inputs are zero, leaving just the bias:
         $$z(0,0)=0+2\cdot0-4=-4.$$
         $$\phi(-4)=0.$$
         So the origin's side is the no side, confirming the arrow's result.

      **Compare cases.** Rows 1–2 show bias shifting the hyperplane without turning it; row 3 doubles row 2's weights and bias; row 4 changes row 2's line's direction.

      | Weights | Bias | Horizontal crossing | Vertical crossing |
      |---|---:|---|---|
      | $(1,2)$ | −2 | $(2,0)$ | $(0,1)$ |
      | $(1,2)$ | −4 | $(4,0)$ | $(0,2)$ |
      | $(2,4)$ | −8 | $(4,0)$ | $(0,2)$ |
      | $(2,1)$ | −4 | $(2,0)$ | $(0,4)$ |

      Doubling every weight and the bias doubles every score, so no sign changes: the same line and same yes side.

      **Where it shows up.** For the gripper's object-detected and already-closed inputs, $z=x_1-x_2-0.5$. Its boundary $x_1-x_2=0.5$ puts only $(1,0)$ on the yes side: close only when needed.
