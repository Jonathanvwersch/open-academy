final: perc-explain
summary: |
  - A neuron computes a score $z = w \cdot x + b$ and applies an activation $\phi$; a perceptron uses the step rule, outputting 1 if $z > 0$ and 0 otherwise.
  - Its decision boundary, where $w \cdot x + b = 0$, is a straight line (a plane or hyperplane with more inputs). The weights set its direction and the bias shifts it.
  - One straight boundary can compute AND and OR, but not XOR, whose yes corners are diagonally opposite.

  **Where you'll use this:** In Activation functions you will give neurons more flexible responses. Layers and the forward pass will combine neurons, and Backpropagation will show how to adjust their weights.
