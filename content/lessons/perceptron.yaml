concept: perceptron
version: 5
objective: |
  **Goal:** compute a perceptron's yes-or-no output from its weights, bias and inputs, find the straight line that separates its yes answers from its no answers, and explain why one perceptron can't compute XOR.
recap:
  - concept: dot-product
    text: "The dot product multiplies the matching entries of two vectors and adds the products, so $(2,-1)\\cdot(3,1)=6-1=5$. Two non-zero arrows whose dot product is $0$ are perpendicular, at right angles."
  - concept: linear-regression
    text: "Linear regression predicts a number by multiplying each feature by its weight, adding the results and adding one bias, $\\hat y=w\\cdot x+b$. A weight says how much the prediction changes when its feature rises by one."
where_this_fits: |
  ### What is a perceptron?

  A perceptron is the simplest model of a neuron. In the brain, a neuron is a cell that fires or stays quiet depending on the signals it receives, and neural networks are built from many artificial neurons. A perceptron works out a weighted sum of its inputs plus a bias, just as linear regression does, and then turns that number into a yes or a no.

  That's useful because so many decisions are yes-or-no questions. Should we go and see a house that's for sale? Linear regression gives us a number but not a decision. A perceptron gives the decision. Seeing which inputs get a yes shows us a simple rule that a single neuron can never follow, which is why networks use many neurons.
knowledge_points:
  - id: perc-score-and-step
    title: "Turn a score into yes or no"
    explain: |
      ### From a score to a decision

      In the linear regression lesson, a weighted sum plus a bias predicted a number. Now let's use the same kind of sum to decide something instead: should we visit a house?

      Each house has two inputs. $x_1$ is its size in hundreds of square metres, and $x_2$ is its distance from the station in kilometres. We want big houses near the station, so size gets the weight $2$, which makes 100 m² count twice as much as 1 km, and distance gets the weight $-1$, so extra kilometres count against a visit. Then we add a bias of $-1$ to set the bar a house must clear. That gives each house a **score**,

      $$z=2x_1-x_2-1.$$

      We turn the score into an answer with a switch called the **step**. A positive score gives $1$, meaning yes, and any other score gives $0$, meaning no. In the lower graph, the score runs along the bottom, and the dot at $0$ sits on the bottom line, so a score of exactly $0$ gives $0$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" aria-label="Size x1 is multiplied by 2 and distance x2 by minus 1, the two pieces are added, and the bias minus 1 is added to make the score z. The step then turns z into an output of 0 or 1. In the graph below, every score of 0 or less gives output 0, shown in red, and every positive score gives output 1, shown in green. A filled red dot shows that a score of exactly 0 gives 0">
      <defs><marker id="pc-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
      <path d="M120 45 L240 75 M120 105 L240 75 M340 75 H400 M480 75 H540" stroke="#737373" stroke-width="1.5" marker-end="url(#pc-m)"/>
      <rect x="240" y="45" width="100" height="60" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
      <rect x="400" y="45" width="80" height="60" rx="6" fill="#ffffff" stroke="#d4d4d4" stroke-width="1.5"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="16" y="50" fill="#171717" text-anchor="start">size x₁</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="16" y="110" fill="#171717" text-anchor="start">distance x₂</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="170" y="46" fill="#737373" text-anchor="middle">× 2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="170" y="118" fill="#737373" text-anchor="middle">× (−1)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="290" y="71" fill="#171717" text-anchor="middle">add, then</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="290" y="92" fill="#171717" text-anchor="middle">bias −1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="370" y="66" fill="#171717" text-anchor="middle">z</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="440" y="80" fill="#171717" text-anchor="middle">step</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="548" y="80" fill="#171717" text-anchor="start">0 or 1</text>
      <path d="M150 250 H470 M310 262 V150" stroke="#737373" stroke-width="1.5"/>
      <path d="M160 250 H310" stroke="#ef4444" stroke-width="3"/><path d="M310 200 H460" stroke="#10b981" stroke-width="3"/>
      <circle cx="310" cy="250" r="5" fill="#ef4444"/><circle cx="310" cy="200" r="5" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="298" y="205" fill="#171717" text-anchor="end">1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="310" y="280" fill="#171717" text-anchor="middle">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="478" y="255" fill="#171717" text-anchor="start">score z</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="146" fill="#171717" text-anchor="start">output</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="200" y="240" fill="#ef4444" text-anchor="middle">no</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="420" y="190" fill="#10b981" text-anchor="middle">yes</text>
      </g>
      </svg>
      ```

      ### The perceptron in symbols

      An artificial **neuron** works out a weighted sum of its inputs plus a bias, and then applies an **activation**, which turns the score into the output. A **perceptron** is a neuron whose activation is the step. If the inputs are in a vector $x$, the weights are in a vector $w$ in the same order and the bias is $b$, the score is a dot product plus the bias,

      $$z=w\cdot x+b.$$

      The step is written $\phi$ ("phi"). The brace lists its two cases, "$1$ if $z>0$, and $0$ otherwise",

      $$\phi(z)=\begin{cases}1&\text{if } z>0\\0&\text{otherwise.}\end{cases}$$

      ### Three houses

      Here are three houses:

      - A 200 m² house 1 km away, $x=(2,1)$, scores $4-1-1=2$, so it's a yes.
      - A 100 m² house 2 km away, $x=(1,2)$, scores $2-2-1=-1$, so it's a no.
      - A 100 m² house 1 km away, $x=(1,1)$, scores exactly $0$, so it's also a no, because $0$ isn't positive.

      Be careful not to think that a bigger score gives a bigger output. A score of $0.1$ and a score of $100$ both give $1$, because the step only checks whether the score is positive.
    worked: |
      Let's decide about a house of 250 m² that is 1 km from the station, with the weights $w=(2,-1)$ and the bias $b=-1$.

      1. **Write the house as an input vector.** The entries go in the same order as the weights, size first, and size is counted in hundreds of square metres.
         $$x=(2.5,\ 1)$$

      2. **Multiply matching entries and add.** This is the dot product of the weights and the inputs.
         $$w\cdot x=2\times2.5+(-1)\times1=4$$

      3. **Add the bias.** The bias is added once, to the whole total.
         $$z=4-1=3$$

      4. **Apply the step.** The score is positive, so the step gives $1$.
         $$\phi(3)=1$$

      So the perceptron says yes, we should visit this house. Its output is $1$ rather than the score $3$, because the step keeps only whether the score was positive.
    problems:
      - perc-score-and-step-basics
      - percp-score-reason
      - percp-weight-sign
      - percp-output
      - percp-score-template
      - percp-score-zero
      - percp-robot-gripper
  - id: perc-straight-boundary
    title: "Find the line between yes and no"
    explain: |
      ### Every house on one map

      Which houses get a yes? To see them all at once, let's draw a map with each house as a point, its size along the bottom and its distance from the station up the side.

      The green dot is the 200 m² house 1 km away, which scored $2$, and the red dots are the two houses that got a no. The orange line joins every point that scores exactly $0$. Houses below and to the right of it score above $0$ and get a yes. Houses above and to the left get a no, and so do houses on the line itself.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" aria-label="A map of houses with size x1, in hundreds of square metres, along the bottom and distance x2 from the station, in km, up the side. The orange line z = 0 runs from (0.5, 0) to (2, 3). The green house (2, 1) is below and to the right of the line, on the yes side. The red house (1, 2) is above and to the left, on the no side, and the red house (1, 1) is on the line. The blue arrow w = (2, −1) starts on the line at (1.5, 2) and points at right angles to it, into the yes side">
      <defs><marker id="pm-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M80 290 H400 M80 290 V30" stroke="#737373" stroke-width="1.5"/>
      <path d="M160 290 V296 M240 290 V296 M320 290 V296 M74 210 H80 M74 130 H80 M74 50 H80" stroke="#737373" stroke-width="1.5"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="160" y="312" fill="#737373" text-anchor="middle">1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="240" y="312" fill="#737373" text-anchor="middle">2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="312" fill="#737373" text-anchor="middle">3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="66" y="215" fill="#737373" text-anchor="end">1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="66" y="135" fill="#737373" text-anchor="end">2</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="66" y="55" fill="#737373" text-anchor="end">3</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="66" y="302" fill="#737373" text-anchor="end">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="240" y="334" fill="#171717" text-anchor="middle">size x₁ (hundreds of m²)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="88" y="24" fill="#171717" text-anchor="start">distance x₂ (km)</text>
      <path d="M120.0 290 L240 50" stroke="#f59e0b" stroke-width="3"/>
      <path d="M200.0 130 L360.0 210" stroke="#3b82f6" stroke-width="3" marker-end="url(#pm-b)"/>
      <circle cx="240" cy="210" r="6" fill="#10b981"/><circle cx="160" cy="130" r="6" fill="#ef4444"/><circle cx="160" cy="210" r="6" fill="#ef4444"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="250" y="232" fill="#10b981" text-anchor="start">(2, 1) yes</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="150" y="120" fill="#ef4444" text-anchor="end">(1, 2) no</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="150" y="215" fill="#ef4444" text-anchor="end">(1, 1) no</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="368.0" y="215" fill="#3b82f6" text-anchor="start">w = (2, −1)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="250" y="58" fill="#f59e0b" text-anchor="start">z = 0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="470" y="270" fill="#10b981" text-anchor="middle">yes side</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="150" y="60" fill="#ef4444" text-anchor="middle">no side</text>
      </g>
      </svg>
      ```

      ### The decision boundary

      The **decision boundary** is the set of inputs whose score is exactly $0$, where the answer changes. For our perceptron it's

      $$2x_1-x_2-1=0.$$

      With two inputs, this equation is always a straight line, as long as one weight isn't $0$, because we can solve it for one input. With more inputs it's a flat surface called a **hyperplane**. Be careful not to think that better weights could bend it. The weights turn the line and the bias slides it, but it always stays straight.

      ### Which side says yes

      The blue arrow is the weight vector $w=(2,-1)$, and it points into the yes side. Compare a house with one that is $d_1$ bigger and $d_2$ further away. The bias cancels, so their scores differ by $2d_1-d_2$, which is $w\cdot d$ for the arrow $d=(d_1,d_2)$.

      The arrow along the line from $(0.5,0)$ to $(2,3)$ is $d=(1.5,3)$, and $w\cdot d=3-3=0$. So by the dot product lesson, $w$ is perpendicular to the line. If instead $d$ is $w$ itself, the score rises by $w\cdot w=5$, so moving along $w$ leads into the yes side.

      ### Turning and sliding the line

      - With the bias $-3$ instead of $-1$, every score drops by $2$. The line now meets the size axis where $2x_1=3$, at $x_1=1.5$ instead of $0.5$, so it has slid right without turning.
      - With the weights $(1,-1)$, the line becomes $x_2=x_1-1$. It climbs 1 km per 100 m² instead of 2, so it has turned, and it now meets the size axis at $1$.
    worked: |
      Let's find our perceptron's boundary on the map, and then check which side is the no side.

      1. **Set the score to zero.** The boundary is where the score is exactly $0$.
         $$2x_1-x_2-1=0$$

      2. **Solve for the distance.** Writing $x_2$ in terms of $x_1$ shows how the line runs. For every extra 100 m², the line rises by 2 km.
         $$x_2=2x_1-1$$

      3. **Find where it meets the size axis.** Along that axis the distance is $0$.
         $$0=2x_1-1,\quad\text{so}\quad x_1=0.5$$

      4. **Find a second point.** Any size will do, and $x_1=2$ gives a whole number.
         $$x_2=2\times2-1=3$$

      5. **Test the origin.** A point that isn't on the line tells us which side is which. The origin is easy because both inputs are $0$, which leaves only the bias.
         $$z=2\times0-0-1=-1$$

      The line runs from $(0.5,0)$ through $(2,3)$, as on the map. The origin scores $-1$, so its side of the line, above and to the left, is the no side, which agrees with the arrow $w$ pointing down and to the right, into the other side.
    problems:
      - perc-straight-boundary-basics
      - percp-boundary-reason
      - percp-boundary-meaning
      - percp-which-side
      - percp-why-bias
      - percp-bias-shift
      - percp-why-straight
      - percp-crossing-template
      - percp-no-curve
  - id: perc-and-or-xor
    title: "Find what one perceptron can't do"
    explain: |
      ### Houses described by yes or no

      Let's describe each house by two yes-or-no facts instead of size and distance. $x_1$ is $1$ if the house has a garden, $x_2$ is $1$ if it's near the station, and each is $0$ otherwise. Then there are only four kinds of house, $(0,0)$, $(1,0)$, $(0,1)$ and $(1,1)$, and on the map they sit at the corners of a square.

      Here are four rules for which houses get a yes:

      - AND says yes only when both inputs are $1$.
      - OR says yes when at least one input is $1$.
      - XOR, short for "exclusive or", says yes when exactly one input is $1$.
      - NAND, short for "not AND", says yes unless both inputs are $1$.

      Green corners should get a yes and red corners a no.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" aria-label="Three squares, each with corners (0,0), (1,0), (0,1) and (1,1). AND has one green corner, (1,1), cut off from the three red corners by the orange line x1 + x2 = 1.5. OR has three green corners, cut off from the red corner (0,0) by the orange line x1 + x2 = 0.5. Blue arrows point into the yes side of each line. XOR has green corners at (1,0) and (0,1), diagonally opposite, and no single line separates them from the two red corners">
      <defs><marker id="px-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
