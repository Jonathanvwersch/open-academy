concept: perceptron
version: 4
objective: |
  **Goal:** compute a perceptron's yes-or-no output, see how a straight line splits its yes and no inputs, and explain why one perceptron cannot compute XOR.
where_this_fits: |
  A robot gripper needs a yes-or-no decision: close only if an object is detected and the fingers are not already closed. Linear regression's weighted sum plus a bias gives a number, such as 0.5 or −1.5, not a decision. A perceptron, the simplest model neuron, turns that score into yes or no. With inputs of 0 or 1 there are four input pairs, (0,0),(1,0),(0,1),(1,1): the corners of a square. Which yes-or-no rules on those corners can one perceptron match?

  1. Turn a weighted score into a yes-or-no answer.
  2. Draw the straight line separating the inputs that get each answer.
  3. Test rules such as "both inputs are 1" and "exactly one input is 1": which can one line separate?

  Next, you'll replace the on/off step with smoother functions.
knowledge_points:
  - id: perc-score-and-step
    title: Score the inputs, then answer yes or no
    explain: |
      **The question.** How can you turn two input measurements into a yes-or-no answer, rather than just another number?

      **Picture it.** Take two numbers, $x_1$ and $x_2$. Weights are numbers that set how much each input counts. Multiply the inputs by weights 1 and 2, add, then add a constant called the bias, here −4, to get the score $z$. These are just small example values, not numbers every perceptron uses.

      The step $\phi$ ("phi") is a switch: positive scores give yes (1); all others give no (0). The bottom graph jumps like a stair step: score goes across, output goes up. A filled dot means the point is included; a hollow dot means it is left out.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" aria-label="Two weighted inputs plus bias make a score, then a step gives 0 or 1; zero belongs to output 0.">
        <defs><marker id="p1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
          <path d="M75 45 L215 75 M75 105 L215 75 M315 75 H390 M475 75 H550" stroke="#737373" fill="#171717" fill-opacity="0" marker-end="url(#p1-arrow)"/>
          <rect x="215" y="45" width="100" height="60" rx="6" fill="#171717" fill-opacity="0" stroke="#d4d4d4"/>
          <rect x="390" y="45" width="85" height="60" rx="6" fill="#171717" fill-opacity="0" stroke="#d4d4d4"/>
          <g stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">
            <text x="25" y="48">x₁</text><text x="25" y="108">x₂</text><text x="115" y="43">× 1</text><text x="115" y="113">× 2</text>
            <text x="232" y="71">add, then</text><text x="232" y="92">bias −4</text><text x="345" y="64">z</text><text x="407" y="80">step φ</text><text x="555" y="80">0 / 1</text>
          </g>
          <path d="M130 220 H475 M300 238 V140" stroke="#737373"/>
          <path d="M145 220 H300" stroke="#ef4444" stroke-width="3"/><path d="M300 170 H455" stroke="#10b981" stroke-width="3"/>
          <circle cx="300" cy="220" r="5" fill="#ef4444"/><circle cx="300" cy="170" r="5" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
          <text x="280" y="215">0</text><text x="280" y="175">1</text><text x="310" y="242">0</text><text x="480" y="225">score z</text><text x="315" y="145">output φ(z)</text>
        </g>
      </svg>
      ```

      **The idea.** A **neuron** takes a weighted sum plus a bias, then applies an **activation**, a function transforming that score into an output.

      A **perceptron** is a neuron whose activation is the step; “activation” is the general word because later lessons swap in other functions.

      In practice, weights and bias are learned from examples (later lessons); here we pick them by hand.

      Write the input vector as $x$, its matching weights as $w$, the bias as $b$, and the score as $z$:

      $$z=w\cdot x+b.$$

      The **step activation** gives $\phi(z)=1$ if $z>0$, and 0 otherwise:

      $$\phi(z)=\begin{cases}1&z>0\\0&z\leq0.\end{cases}$$

      **Common confusion.** “Output 1 means it is completely sure.” No: scores 0.1 and 100 both give 1. This is a yes-or-no decision, not a probability measuring how sure it is.
    worked: |
      Use weights $w=(1,2)$, bias $b=-4$ and input $x=(2,3)$.

      1. **Weight each input.**
         $$w\cdot x=1\cdot2+2\cdot3=8.$$
      2. **Add the bias.**
         $$z=8-4=4.$$
      3. **Apply the step.** The score is positive.
         $$\phi(4)=1.$$

      **Compare cases.** Keep the weights and bias fixed; only change the input.

      | Input | Score $x_1+2x_2-4$ | Output |
      |---|---:|---:|
      | $(2,3)$ | 4 | 1 |
      | $(1,1)$ | −1 | 0 |
      | $(4,0)$ | 0 | 0 |
      | $(0,3)$ | 2 | 1 |

      The $(4,0)$ row scores exactly zero, so its output is 0.

      **Where it shows up.** For a gripper, let $x_1$ mean object detected and $x_2$ mean fingers already closed (each 0 or 1). Weights $(1,-1)$ and bias $-0.5$ give “close” only when an object is detected and the fingers are not already closed.

      At $(0,0),(1,0),(0,1),(1,1)$ the scores are $-0.5,0.5,-1.5,-0.5$: only $(1,0)$ gives yes. The negative weight on “already closed” pushes toward no.
