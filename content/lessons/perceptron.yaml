concept: perceptron
version: 2
objective: |
  **Goal:** compute a neuron's output from its weights, bias and inputs, and explain why one neuron can only split its inputs with a straight boundary, so it can't compute XOR.
why: |
  A program helps you choose houses to visit. Should a 120 m² house, 0.5 km from the station, make your list? Separate limits on size and distance miss the possibility that more space could justify a longer walk. A perceptron gives each measurement a weight, a number controlling how much it counts, and combines them into one score. Adding a fixed number, called the bias, makes a yes easier or harder without changing those weights. This gives you an adjustable decision rule rather than a growing list of exceptions. Its limits explain why we need several such units working together in Activation functions, Layers and the forward pass, and Backpropagation.
knowledge_points:
  - id: perc-score-and-step
    title: A weighted score, then a yes or no
    explain: |
      You need to choose houses to visit. **Should a 120 m² house, 0.5 km from the station, make your list?** Separate limits on size and distance cannot let extra space justify a longer walk.

      Write $x_1$ for size in hundreds of m² and $x_2$ for distance in km. This house has inputs $x = (1.2, 0.5)$.

      A **weight** multiplies an input to set its influence. With weights $w = (w_1, w_2)$, combine the inputs into a **score** $z$. Add a **bias** $b$, a fixed number that raises or lowers the score:

      $$z = w \cdot x + b = w_1 x_1 + w_2 x_2 + b$$

      This works because size can add to the score while distance subtracts. Why include a bias? It changes how hard it is to get a yes without changing the weights.

      The **step rule** outputs 1 if $z > 0$ and 0 otherwise. This is the **activation function** $\phi$ ("phi"), with output $a = \phi(z)$. A weighted sum plus bias followed by an activation is a **neuron**. Using the step rule makes it a **perceptron**.
    worked: |
      This example shows a neuron deciding which of three houses should make your list.

      Take $w = (2, -1)$ and $b = -1$: each 100 m² adds 2 to the score, each km from the station takes 1 away.

      | house | size $x_1$ | distance $x_2$ | score $z = 2x_1 - x_2 - 1$ | output $\phi(z)$ |
      |---|---|---|---|---|
      | A | 1.2 | 0.5 | $2.4 - 0.5 - 1 = 0.9$ | 1 |
      | B | 0.8 | 1.5 | $1.6 - 1.5 - 1 = -0.9$ | 0 |
      | C | 1.0 | 1.0 | $2 - 1 - 1 = 0$ | 0 |

      House C scores exactly 0, and the rule says 1 only for $z > 0$, so it gets a no. The score tells you how much the house exceeds or falls short of the required value. The step rule keeps only the yes or no.
    problems:
      - percp-output
      - percp-score-template
      - percp-score-zero
      - percp-weight-sign
      - percp-why-bias
      - percp-robot-gripper
  - id: perc-straight-boundary
    title: The yes/no boundary is a straight line
    explain: |
      **Which houses will this rule accept?** With score $z = 2x_1 - x_2 - 1$, house A scores 0.9 and B scores $-0.9$. Checking houses individually cannot show every possible decision.

      Instead find the **decision boundary**, where the answer changes from yes to no:

      $$\{x : w \cdot x + b = 0\}$$

      Read this as "all inputs $x$ whose score is zero". This works because the score changes smoothly and must cross zero to switch between positive and negative. With two inputs and nonzero weights, this equation describes a straight line.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" aria-label="Houses plotted by size and distance to the station. The straight line where the score 2 x1 minus x2 minus 1 equals zero separates yes houses below it from no houses above it.">
        <line x1="70" y1="270" x2="610" y2="270" stroke="#d4d4d4" stroke-width="2"/>
        <line x1="70" y1="270" x2="70" y2="30" stroke="#d4d4d4" stroke-width="2"/>
        <text x="340" y="315" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#737373">size x1 (hundreds of m²)</text>
        <text x="20" y="150" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#737373" transform="rotate(-90 20 150)">distance x2 (km)</text>
        <text x="70" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">0</text>
        <text x="340" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">1</text>
        <text x="610" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">2</text>
        <text x="56" y="194" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">1</text>
        <text x="56" y="114" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">2</text>
        <text x="56" y="34" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#737373">3</text>
        <line x1="205" y1="270" x2="610" y2="30" stroke="#3b82f6" stroke-width="3"/>
        <text x="465" y="110" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#3b82f6">score = 0</text>
        <circle cx="394" cy="230" r="8" fill="#10b981"/>
        <text x="408" y="235" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">A</text>
        <circle cx="520" cy="190" r="8" fill="#10b981"/>
        <circle cx="286" cy="150" r="8" fill="#ef4444"/>
        <text x="300" y="155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">B</text>
        <circle cx="160" cy="110" r="8" fill="#ef4444"/>
        <circle cx="340" cy="190" r="8" fill="#ef4444"/>
        <text x="354" y="182" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">C (on the line)</text>
        <text x="110" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#ef4444">score &lt; 0: output 0</text>
        <text x="470" y="255" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#10b981">score &gt; 0: output 1</text>
      </svg>
      ```

      Why not adjust the bias to curve the boundary? Adding a constant moves a line without bending it. Three inputs give a flat plane. With more inputs, this flat boundary is called a **hyperplane**.
    worked: |
      This example shows how to locate the boundary and how the bias moves it.

      With $w = (2, -1)$ and $b = -1$ the boundary is $2x_1 - x_2 - 1 = 0$.

      1. **Where it crosses the size axis:** set $x_2 = 0$. Then $2x_1 - 1 = 0$, so $x_1 = 0.5$: a 50 m² house right at the station sits on the line.
      2. **Another point:** set $x_1 = 1$. Then $2 - x_2 - 1 = 0$, so $x_2 = 1$. That's house C.
      3. **Change the bias to $b = -2$:** now $2x_1 - 2 = 0$ gives $x_1 = 1$ on the size axis. The line has moved right by 0.5 without turning, and a house needs to be bigger to get a yes.

      Changing the weights can turn the line. Changing only the bias moves it without turning it.
    problems:
      - percp-boundary-meaning
      - percp-crossing-template
