final: perc-explain
summary: |
  - A perceptron multiplies each input by its weight, adds the results and a bias to get a score, $z=w\cdot x+b$, and the step then gives $1$ (yes) if $z>0$ and $0$ (no) otherwise.
  - Its decision boundary is the set of inputs that score exactly $0$. With two inputs it's a straight line, perpendicular to $w$, and $w$ points into the yes side. Changing the weights turns the line and changing the bias slides it.
  - A single perceptron can only follow a rule whose yes and no inputs one straight line can separate. AND and OR work, but XOR, whose yes corners are diagonally opposite, can't be computed by one perceptron.

  **Next:** The activation functions lesson replaces the step with smoother functions, which networks of neurons use instead.
