concept: linear-regression
version: 3
objective: |
  **Goal:** write a linear house-price model in vector form, interpret its weights and bias, and make vectorised NumPy predictions for a batch of houses.
where_this_fits: |
  In the matrices lesson, one multiplication used the same weights to predict prices for several houses. That gave us the batch calculation, but not yet the full rule for one house or what each adjustable number means. This lesson writes the prediction as a weighted sum plus a bias, then applies it to a batch. The next lesson asks how to change the weights to reduce prediction error.
knowledge_points:
  - id: lr-add-contributions
    title: Build a price from weighted house features
    explain: |
      **What a linear regression model is.** It predicts a number by multiplying each input feature by a weight, adding the contributions, then adding a bias. A feature is a recorded input; a weight is its adjustable multiplier; a bias is a shared offset.

      **How it works.** For the house $x=(12,3,20)$, the entries are area in tens of square metres, bedrooms and age in years. With $w=(25,10,-1)$ and $b=0$, the prediction in thousands of pounds is

      $$\hat y=w\cdot x+b=25\cdot12+10\cdot3+(-1)\cdot20=310.$$

      The dot product pairs entries in order. The bias is added once, after those products; it lets every prediction shift by the same amount. A linear model assumes each feature has a fixed per-unit effect while the other features stay fixed.

      **Why this is useful.** The house-price model turns several measurements into one price using a rule that can be fitted from past sales.
    worked: |
      This example shows how the three house measurements contribute to one prediction.

      1. Area contributes $25\cdot12=300$ thousand pounds.
      2. Bedrooms contribute $10\cdot3=30$ thousand pounds.
      3. Age contributes $-1\cdot20=-20$ thousand pounds.
      4. Add the contributions and bias: $300+30-20+0=310$.

      The model predicts £310,000 for this house.
    problems:
      [lrp-why-bias, lrp-price-template, lrp-dot-template, lrp-order, lrp-bias-once, lrp-new-task]
  - id: lr-interpret-weights
    title: Read each weight in its own units
    explain: |
      **What a weight means.** A weight is the prediction change for a one-unit increase in its feature, with every other feature held fixed. Its units combine the price unit with the feature unit.

      **How it works.** In this model, area has weight 25 thousand pounds per ten square metres. If area rises by 2 tens of square metres while bedrooms and age stay the same, the prediction rises by $25\cdot2=50$ thousand pounds. The bedroom weight is 10 thousand pounds per bedroom; the age weight is −1 thousand pounds per year.

      These are effects in the model, not proof that changing a real house causes the same price change. Comparing weight numbers alone is misleading if their feature units differ.

      **Why this is useful.** Reading a weight in its units is how you check a trained model makes sense: an area weight of 25 thousand pounds per ten square metres is plausible, and 25 million would mean something went wrong.
    worked: |
      This example shows the effect of changing one house feature while holding the others fixed.

      Start with $x=(12,3,20)$ and $w=(25,10,-1)$.

      1. Add one bedroom: its contribution changes by $10\cdot1=10$ thousand pounds.
      2. Add one year of age: its contribution changes by $-1\cdot1=-1$ thousand pounds.
      3. Increase area by 2 tens of square metres: its contribution changes by $25\cdot2=50$ thousand pounds.

      Each calculation changes one feature only, so the corresponding weight gives the prediction change.
    problems:
      [
        lrp-why-hold-fixed,
        lrp-change-template,
        lrp-both-template,
        lrp-units,
        lrp-negative,
        lrp-zero-input,
      ]
  - id: lr-batch-predictions
    title: Predict every row with one matrix operation
    explain: |
      **What a batch prediction is.** A batch is several houses processed together. Put each house's feature vector in one row of an input matrix $X$.

      **How it works.** If there are $n$ houses and $d$ features, $X$ has shape $(n,d)$ and $w$ has $d$ entries. Multiplying $Xw$ computes one dot product per row, producing $n$ predictions. The bias is added to each one:

      $$\hat y=Xw+b\mathbf 1.$$

      Here $\mathbf 1$ is a vector of $n$ ones. In NumPy, `X @ w + b` broadcasts the single bias across all rows. Each row uses the same weights, but no row's measurements enter another house's prediction.

      **Why this is useful.** One matrix operation applies the same house-price rule to an entire sales dataset without writing a separate calculation for each house.
    worked: |
      This example shows two house predictions using one matrix multiplication.

      ```python
      import numpy as np
      X = np.array([[12., 3., 20.], [8., 2., 5.]])
      w = np.array([25., 10., -1.])
      b = 0.
      y_hat = X @ w + b
      # array([310., 215.]), shape (2,)
      ```

      The first row gives $25\cdot12+10\cdot3-20=310$. The second gives $25\cdot8+10\cdot2-5=215$. Both prices are in thousands of pounds.

      The matrix has shape $(2,3)$, the weight vector has shape $(3,)$, and the result has shape $(2,)$.
    problems:
      [
        lrp-why-matrix-product,
        lrp-batch-template,
        lrp-augmented-template,
        lrp-code,
        lrp-shape,
        lrp-bias-trick,
      ]
final: lr-explain-model
summary: |
  - A linear price model adds matching weight-times-feature contributions and one bias: $\hat y=w\cdot x+b$.
  - Each weight gives a per-unit prediction change while other features stay fixed; its units matter.
  - Use `X @ w + b` for one prediction per house in a batch.

  **Next:** Derivatives show how nudging one weight changes the house-price model's loss and by how much.
