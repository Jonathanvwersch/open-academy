concept: linear-regression
version: 4
objective: |
  **Goal:** predict a number with a linear regression model (each feature times its weight, added up, plus a bias), say what each weight and the bias mean, and compute predictions for many examples at once with `X @ w + b`.
where_this_fits: |
  You want to predict a number, such as a house's sale price, from a few measurements of it. You already have the pieces: the dot product turns measurements and weights into one total, and a matrix product does that for many houses at once. What you don't have yet is the model built from them: what its fixed extra amount does, what each of its numbers says, and how one line of code prices a whole dataset. This lesson assembles **linear regression**, a model that predicts a number from a weighted sum of measurements, in three steps:

  1. Build one prediction from weighted measurements plus a bias.
  2. Read what each weight and the bias mean.
  3. Predict a whole batch of examples with one matrix product.
knowledge_points:
  - id: lr-add-contributions
    title: One prediction from weighted features plus a bias
    explain: |
      **The question.** You know two things about a house, its area and its number of bedrooms, and you want one predicted sale price. What is the simplest rule that turns both measurements into one number, letting each push the price by its own amount?

      **Picture it.** Take a house with area $100$ m² and $2$ bedrooms, and a rule with three numbers: $3$ (thousand pounds per m²), $10$ (thousand pounds per bedroom) and $50$ (thousand pounds). Each measurement becomes one piece of the price: area gives $3\times100=300$ and bedrooms give $10\times2=20$. Then a fixed $50$ is added, whatever the house. The bar stacks the pieces into the prediction: $370$ thousand pounds.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" aria-label="A bar built from three pieces for the house with area 100 square metres and 2 bedrooms: area contributes 3 times 100 equals 300, bedrooms contribute 10 times 2 equals 20, and the bias adds 50, so the prediction is 370 thousand pounds">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <rect x="40" y="80" width="420" height="44" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
          <rect x="460" y="80" width="28" height="44" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="2"/>
          <rect x="488" y="80" width="70" height="44" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="250" y="107" fill="#3b82f6" text-anchor="middle">area: 3 × 100 = 300</text>
          <path d="M474 124 V146" stroke="#f59e0b" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="474" y="164" fill="#f59e0b" text-anchor="middle">bedrooms: 10 × 2 = 20</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="523" y="68" fill="#10b981" text-anchor="middle">bias: 50</text>
          <path d="M40 188 V194 H558 V188" stroke="#171717" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="299" y="216" text-anchor="middle">prediction ŷ = 300 + 20 + 50 = 370</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="40" y="68" fill="#737373" text-anchor="middle">0</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="558" y="142" fill="#737373" text-anchor="middle">370</text>
        </g>
      </svg>
      ```

      **The idea.** Multiply each measurement by its own number, add the results, then add one fixed number. A **linear regression model** predicts a numeric target this way. Its inputs are **features**, the measurements of one example, collected in a vector $x$. Each feature has a **weight**, collected in a vector $w$ in the same order. The **bias** $b$ is a single number added once:

      $$\hat y=w\cdot x+b.$$

      The hat on $\hat y$ marks a prediction, as opposed to the true target $y$. Without $b$, an example whose features are all $0$ would always be predicted $0$; the bias shifts every prediction by the same amount. It is called linear because each feature adds a fixed amount per unit, so plotting the predictions against one feature, with the others held fixed, gives a straight line.

      **Common confusion.** “Each feature gets the bias, so with two features I add it twice.” No: the bias belongs to the whole prediction, not to a feature. It is added once, which is why the bar has one green piece: $300+20+50=370$.
    worked: |
      Predict the price of a house with area $90$ m² and $4$ bedrooms, using weights $w=(3,10)$ and bias $b=50$.

      1. **Write the house as a feature vector, in the same order as the weights.**
         $$x=(90,4),\qquad w=(3,10).$$

      2. **Take the dot product: one piece per feature.**
         $$w\cdot x=3(90)+10(4)=270+40=310.$$

      3. **Add the bias once.**
         $$\hat y=w\cdot x+b=310+50=360.$$

      The model predicts £360,000.

      **Compare cases.**

      | Calculation for $x=(90,4)$ | Result |
      | --- | --- |
      | Weighted sum only, $w\cdot x$ | $310$ |
      | Weighted sum plus bias, $w\cdot x+b$ | $360$ |
      | Bias added once per feature (wrong) | $410$ |
      | Weights in the wrong order, $(10,3)\cdot(90,4)+50$ (wrong) | $962$ |

      **Where it shows up.** In supervised learning, training chooses $w$ and $b$ so that predictions like this land close to the known sale prices. A delivery robot can estimate a trip's time the same way, from features such as distance and number of parcels.
    problems:
      - lr-add-contributions-basics
      - lrp-why-bias
      - lrp-bias-once
      - lrp-dot-template
      - lrp-price-template
      - lrp-order
      - lrp-new-task
  - id: lr-interpret-weights
    title: What each weight and the bias mean
    explain: |
      **The question.** The house model has weight $3$ for area, weight $10$ for bedrooms and bias $50$. What does each number say about the predictions, and does $10>3$ mean bedrooms matter more?

      **Picture it.** Fix the bedroom count and plot the predicted price against area. For $2$-bedroom houses the rule becomes $3\cdot\text{area}+70$; for $3$ bedrooms it becomes $3\cdot\text{area}+80$. Both are straight lines. Along either line, $10$ more m² raises the price by $30$ (blue), so $3$ per m². Jumping from the lower line to the upper one at the same area adds one bedroom and raises the price by $10$ (amber).

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" aria-label="Predicted price against area for 2-bedroom and 3-bedroom houses: two parallel straight lines; along a line, 10 more square metres raises the price by 30, and the 3-bedroom line sits 10 above the 2-bedroom line">
        <defs>
          <marker id="lr2-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker>
        </defs>
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <path d="M90 395 H542 M90 395 V56" stroke="#737373" fill="#171717" fill-opacity="0"/>
          <path d="M110 395 v5" stroke="#737373"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="110" y="415" fill="#737373" text-anchor="middle">90</text>
          <path d="M250 395 v5" stroke="#737373"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="250" y="415" fill="#737373" text-anchor="middle">100</text>
          <path d="M390 395 v5" stroke="#737373"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="390" y="415" fill="#737373" text-anchor="middle">110</text>
          <path d="M530 395 v5" stroke="#737373"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="530" y="415" fill="#737373" text-anchor="middle">120</text>
          <path d="M90 380 h-5" stroke="#737373"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="82" y="385" fill="#737373" text-anchor="end">340</text>
          <path d="M90 290 h-5" stroke="#737373"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="82" y="295" fill="#737373" text-anchor="end">370</text>
          <path d="M90 200 h-5" stroke="#737373"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="82" y="205" fill="#737373" text-anchor="end">400</text>
          <path d="M90 110 h-5" stroke="#737373"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="82" y="115" fill="#737373" text-anchor="end">430</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="435" fill="#737373" text-anchor="middle">area (m²)</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="90" y="46" fill="#737373" text-anchor="start">predicted price (£ thousand)</text>
          <path d="M110 380 L530 110" stroke="#171717" stroke-width="2.5"/>
          <path d="M110 350 L530 80" stroke="#171717" stroke-width="2.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="538" y="85">3 bedrooms</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="538" y="119">2 bedrooms</text>
          <path d="M250 290 H390 V200" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="312" fill="#3b82f6" text-anchor="middle">+10 m²</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="398" y="250" fill="#3b82f6">+30</text>
          <path d="M180 335 V307" stroke="#f59e0b" stroke-width="3" marker-end="url(#lr2-amber)"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="190" y="359" fill="#f59e0b">+10 for one more bedroom</text>
          <circle cx="250" cy="290" r="4" fill="#171717"/>
          <circle cx="250" cy="260" r="4" fill="#171717"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="242" y="250" text-anchor="end">380</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="254" y="310" text-anchor="start">370</text>
        </g>
      </svg>
      ```

      **The idea.** A weight says how much the prediction moves when its feature rises by one unit and nothing else changes. In general, write $x_i$ for feature number $i$ and $w_i$ for its weight. Then $w_i$ is the change in $\hat y$ when $x_i$ rises by $1$ while every other feature stays fixed, and raising $x_i$ by any number $k$ of units changes $\hat y$ by $w_i k$. Its units are the target's units per unit of the feature: here, thousand pounds per m² and thousand pounds per bedroom. The bias is the prediction when every feature is $0$: the starting amount the feature pieces build on, even though no real house has zero area.

      These numbers describe the model's predictions, not a proven effect of renovating a real house.

      **Common confusion.** “The bedroom weight is bigger, so bedrooms matter more than area.” No: a weight's size depends on its feature's units. One bedroom adds $10$, but $10$ m² adds $30$. Measure area in hundreds of m² instead, and a $100$ m² house has area $1$; keeping its piece at $300$ needs an area weight of $300$.
    worked: |
      Start from the house $(100,2)$: area $100$ m², $2$ bedrooms, predicted price $370$ thousand pounds.

      1. **Add one bedroom, keeping the area at $100$ m².**
         $$\hat y=3(100)+10(3)+50=380.$$

      2. **Subtract the two predictions: the area piece and the bias cancel.**
         $$380-370=10(3-2)=10.$$

      3. **Now also add $10$ m².**
         $$\hat y=3(110)+10(3)+50=410.$$

      4. **Split the total change into one piece per feature.**
         $$410-370=3(10)+10(1)=30+10=40.$$

      **Compare cases.**

      | New house (area, bedrooms) | Prediction | Change from $370$ |
      | --- | --- | --- |
      | $(101,2)$ | $373$ | $+3$ |
      | $(110,2)$ | $400$ | $+30$ |
      | $(100,3)$ | $380$ | $+10$ |
      | $(110,3)$ | $410$ | $+40$ |
      | $(100,1)$ | $360$ | $-10$ |

      **Where it shows up.** After training, reading each weight in its units is a quick sanity check: $3$ thousand pounds per m² is plausible, while $3$ million per m² would mean something went wrong. A robot's trip-time model with weight $2$ seconds per metre says each extra metre adds $2$ seconds to the predicted time, if its other features stay the same.
