concept: linear-regression
version: 5
objective: |
  **Goal:** predict a number with a linear regression model, which multiplies each feature by its weight, adds the results and adds a bias; say what each weight and the bias mean; and compute predictions for many examples at once with `X @ w + b`.
recap:
  - concept: supervised-learning
    text: "A supervised model takes an example's inputs and predicts its target, such as a price. We write the prediction as $\\hat y$ and the target as $y$, and training adjusts the model's parameters until $\\hat y$ is close to $y$."
  - concept: dot-product
    text: "The dot product multiplies the matching entries of two vectors and adds the products into one number, so $(3,10)\\cdot(100,2)=3\\times100+10\\times2=320$."
  - concept: matrices
    text: "A matrix times a vector takes one dot product per row, so a matrix with $n$ rows gives $n$ answers. In NumPy, a matrix `X` times a vector `w` is written `X @ w`."
where_this_fits: |
  ### What is linear regression?

  Linear regression is a model that predicts a number from a few measurements. Predicting a number is what "regression" means. It multiplies each measurement by its own weight, adds the results, and then adds one fixed number called the bias.

  It's often the first model people try, because it's fast and every number in it has a meaning you can read off, such as how much each extra square metre adds to a house's price.

  In the dot product lesson, we turned measurements and weights into one total, and in the matrices lesson we did many dot products at once. What this lesson adds is the bias, what each weight tells us, and how to predict for a whole dataset in one line of code.
knowledge_points:
  - id: lr-add-contributions
    title: "Make one prediction"

    tldr: |
      - Each measurement contributes its value multiplied by its weight.
      - We add those contributions and then add one shared amount called the bias.
      - That total is the model's predicted price.
    explain: |
      ### Pricing one house

      Let's start with one house. We know its area, $100$ m², and its number of bedrooms, $2$. We want one predicted sale price, measured in thousands of pounds.

      Our rule has three given numbers. Each square metre adds $3$ thousand pounds, each bedroom adds $10$ thousand, and we always add $50$ thousand. Build the price one piece at a time:
      $$
      \begin{aligned}
      3\times100&=300 &&\text{area contribution}\\
      10\times2&=20 &&\text{bedroom contribution}\\
      300+20&=320 &&\text{add the feature pieces}\\
      320+50&=370 &&\text{add the fixed amount once}
      \end{aligned}
      $$
      The picture lays these blue, orange and green pieces end to end.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" aria-label="A bar for the house with area 100 square metres and 2 bedrooms, built from three pieces laid end to end: the blue area piece, 3 times 100 equals 300; the orange bedrooms piece, 10 times 2 equals 20; and the green bias piece, 50. Together they make the predicted price, 370 thousand pounds">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="40" y="80" width="420" height="44" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2"/>
      <rect x="460" y="80" width="28" height="44" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="2"/>
      <rect x="488" y="80" width="70" height="44" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="250" y="107" fill="#3b82f6" text-anchor="middle">area: 3 × 100 = 300</text>
      <path d="M474 124 V146" stroke="#f59e0b" stroke-width="1.5"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="474" y="164" fill="#f59e0b" text-anchor="middle">bedrooms: 10 × 2 = 20</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="523" y="68" fill="#10b981" text-anchor="middle">bias: 50</text>
      <path d="M40 188 V194 H558 V188" stroke="#171717" stroke-width="1.5" fill="#171717" fill-opacity="0"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="299" y="216" text-anchor="middle">predicted price = 300 + 20 + 50 = 370</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="40" y="68" fill="#737373" text-anchor="middle">0</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="558" y="142" fill="#737373" text-anchor="middle">370</text>
      </g>
      </svg>
      ```

      ### The model in symbols

      A **linear regression model** predicts a number by multiplying each feature by its own weight, adding the results, and adding a bias. The **features** are the measurements of one example, collected in a vector $x$; here $x=(100,2)$. Each feature has a **weight**, collected in a vector $w$ in the same order, so $w=(3,10)$. The **bias** $b$ is a single number, here $50$. The area and bedroom pieces together are exactly a dot product, so the whole model is

      $$\hat y=w\cdot x+b.$$

      Later lessons show how training finds the weights and the bias from data.

      ### Why the bias is there

      Without the bias, every price would have to be built from the feature pieces alone, starting from $0$. With a base price added, the weights only have to say how much each feature adds on top. The bias lets the model shift every prediction by the same amount. Here's what it does to our house:

      - With no bias, the prediction is just $w\cdot x=320$.
      - With the bias added once, it's $320+50=370$.

      Adding it once per piece instead would give $320+50+50=420$, which is wrong. The bias belongs to the whole prediction, so the bar has only one green piece.
    worked: |
      Let's predict the price of a second house, with area $90$ m² and $4$ bedrooms, using the same weights $w=(3,10)$ and bias $b=50$.

      1. **Write the house as a feature vector.** The dot product pairs entries by position, so the features go in the same order as the weights, area first.
         $$x=(90,4)$$

      2. **Take the dot product.** Each feature times its weight gives one piece, and we add the pieces.
         $$w\cdot x=3\times90+10\times4=270+40=310$$

      3. **Add the bias once.** The bias is added to the whole total.
         $$\hat y=310+50=360$$

      So the model predicts $360$ thousand pounds, or £360,000, for this house.
    problems:
      - lr-add-contributions-basics
      - lrp-add-self-explain
      - lrp-why-bias
      - lrp-bias-once
      - lrp-dot-template
      - lrp-price-template
      - lrp-order
      - lrp-new-task
  - id: lr-interpret-weights
    title: "Read the weights and the bias"

    tldr: |
      - A weight tells us how much one extra unit changes the prediction when other measurements stay fixed.
      - Its size depends on the units used for that measurement.
      - Each unit always adds the same amount, so predictions follow straight lines.
    explain: |
      ### Changing one feature at a time

      What does each number in our model say? The way to find out is to change one feature and watch the prediction.

      The picture plots predicted price against area. Fix the bedroom count to see how each line comes from the model:
      $$
      \begin{aligned}
      \hat y&=3\times\text{area}+10\times2+50 &&\text{keep two bedrooms}\\
      &=3\times\text{area}+20+50 &&\text{multiply the bedroom piece}\\
      &=3\times\text{area}+70 &&\text{combine the fixed pieces}\\
      \hat y&=3\times\text{area}+10\times3+50 &&\text{keep three bedrooms}\\
      &=3\times\text{area}+30+50 &&\text{multiply the bedroom piece}\\
      &=3\times\text{area}+80 &&\text{combine the fixed pieces}
      \end{aligned}
      $$
      These are parallel straight lines, $10$ apart. Start at our house, $100$ m² with $2$ bedrooms, predicted at $370$. Following the blue dashed path, $10$ more square metres takes the price up $30$, to $400$. Following the orange arrow instead, one more bedroom at the same area takes it up $10$, to $380$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" aria-label="Predicted price against area, drawn as two parallel straight lines, one for 2-bedroom houses and one for 3-bedroom houses. Starting from the 2-bedroom house of 100 square metres at 370, the blue path moves 10 square metres to the right and rises 30, to 400. The orange arrow goes straight up from the 2-bedroom line to the 3-bedroom line at 100 square metres, a rise of 10, from 370 to 380">
      <defs><marker id="lr2-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M90 395 H542 M90 395 V56" stroke="#737373" fill="#171717" fill-opacity="0"/>
      <path d="M110 395 v5" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="110" y="415" fill="#737373" text-anchor="middle">90</text>
      <path d="M250 395 v5" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="250" y="415" fill="#737373" text-anchor="middle">100</text>
      <path d="M390 395 v5" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="390" y="415" fill="#737373" text-anchor="middle">110</text>
      <path d="M530 395 v5" stroke="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="530" y="415" fill="#737373" text-anchor="middle">120</text>
