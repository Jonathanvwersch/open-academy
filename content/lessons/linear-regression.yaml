  - id: lr-batch-predictions
    title: Predict every example with one matrix product
    explain: |
      **The question.** A dataset has hundreds of houses, and the model must price every one with the same weights and bias. How do you get all the predictions in one calculation instead of one dot product at a time?

      **Picture it.** Stack the houses as the rows of a matrix $X$, each row holding one house's features in the same order as $w$. Multiplying $X$ by $w$ takes one dot product per row, and the bias is then added to each result. Row 1, $(100,2)$, gives $3\times100+10\times2+50=370$; the other rows give $320$ and $420$. Three rows in, three prices out.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" aria-label="A 3 by 2 matrix X of houses, area and bedrooms, multiplied by the weight vector (3, 10) plus bias 50 gives three predictions 370, 320 and 420; the first row and its prediction are highlighted">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="84" y="56" fill="#737373" text-anchor="middle">X (one house per row)</text>
          <rect x="20" y="70" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="52" y="95" text-anchor="middle">100</text>
          <rect x="84" y="70" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="116" y="95" text-anchor="middle">2</text>
          <rect x="20" y="110" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="52" y="135" text-anchor="middle">80</text>
          <rect x="84" y="110" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="116" y="135" text-anchor="middle">3</text>
          <rect x="20" y="150" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="52" y="175" text-anchor="middle">120</text>
          <rect x="84" y="150" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="116" y="175" text-anchor="middle">1</text>
          <rect x="20" y="70" width="128" height="40" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="3"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="52" y="212" fill="#737373" text-anchor="middle">area</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="116" y="212" fill="#737373" text-anchor="middle">bedrooms</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="178" y="135" text-anchor="middle">@</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="235" y="56" fill="#737373" text-anchor="middle">w</text>
          <rect x="203" y="90.0" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="235" y="115" text-anchor="middle">3</text>
          <rect x="203" y="130.0" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="235" y="155" text-anchor="middle">10</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="297" y="135" text-anchor="middle">+</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="327" y="135" fill="#10b981" text-anchor="middle">50</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="357" y="135" text-anchor="middle">=</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="409" y="56" fill="#737373" text-anchor="middle">ŷ</text>
          <rect x="377" y="70" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#3b82f6" stroke-width="3"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="409" y="95" fill="#3b82f6" text-anchor="middle">370</text>
          <rect x="377" y="110" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="409" y="135" text-anchor="middle">320</text>
          <rect x="377" y="150" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="409" y="175" text-anchor="middle">420</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="453" y="95" fill="#3b82f6">3×100 + 10×2 + 50</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="453" y="135" fill="#737373">3×80 + 10×3 + 50</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="453" y="175" fill="#737373">3×120 + 10×1 + 50</text>
          <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="409" y="212" fill="#737373" text-anchor="middle">one price per row</text>
        </g>
      </svg>
      ```

      **The idea.** A **batch prediction** computes a model's predictions for many examples in one operation. Put $n$ examples with $d$ features each as the rows of $X$, so $X$ has shape $(n,d)$ and $w$ has $d$ entries. Then

      $$\hat y=Xw+b\mathbf 1.$$

      Here $\mathbf 1$ is a vector of $n$ ones, so $b\mathbf 1$ adds $b$ to every entry. The result $\hat y$ has $n$ entries, one prediction per row. In NumPy this is `X @ w + b`. Adding a single number to an array adds it to every entry, which NumPy calls broadcasting. NumPy writes the shape of a vector with $d$ entries as `(d,)`. Every row uses the same weights, but no row's features enter another row's prediction.

      **Common confusion.** “`X * w + b` does the same thing.” No: `*` multiplies each row's entries by the matching entries of $w$ but doesn't add them, so each house keeps two separate pieces, such as $300$ and $20$, instead of one price. `@` adds the pieces within each row.
    worked: |
      Price three houses at once with $w=(3,10)$ and $b=50$.

      ```python
      import numpy as np
      X = np.array([[100., 2.], [80., 3.], [120., 1.]])
      w = np.array([3., 10.])
      b = 50.
      y_hat = X @ w + b
      print(y_hat)        # [370. 320. 420.]
      print(y_hat.shape)  # (3,)
      ```

      1. **Check that the shapes fit.** $X$ has $2$ columns and $w$ has $2$ entries, so each row pairs with $w$. There are $3$ rows, so there will be $3$ predictions.
         $$(3,2)\ \text{with}\ (2,)\ \to\ (3,)$$

      2. **Take one dot product per row.**
         $$Xw=(300+20,\ 240+30,\ 360+10)=(320,\ 270,\ 370).$$

      3. **Add the bias to every entry.**
         $$\hat y=(320,\ 270,\ 370)+50\,\mathbf 1=(370,\ 320,\ 420).$$

      4. **Let a column of ones carry the bias instead.** Some code stores the bias this way so that one product does all the work. Append $1$ to each row and put $b$ last in the weights, so row 1 becomes $(100,2,1)$ and the weights become $(3,10,50)$.
         $$(100,2,1)\cdot(3,10,50)=300+20+50=370.$$

      The extra $1$ is the same in every row, so it isn't a measurement of the house. Every row gains $1\times50$, so the new product gives the same three prices with no separate bias.

      **Compare cases.** Continue the code above with the column of ones:

      ```python
      X1 = np.column_stack([X, np.ones(3)])  # append a column of ones
      w1 = np.array([3., 10., 50.])
      ```

      | Expression | Shape | Result |
      | --- | --- | --- |
      | `X @ w + b` | `(3,)` | `[370, 320, 420]` |
      | `X1 @ w1` | `(3,)` | `[370, 320, 420]` |
      | `X1 @ w1 + b` (bias twice, wrong) | `(3,)` | `[420, 370, 470]` |
      | `X * w + b` (no adding, wrong) | `(3, 2)` | `[[350, 70], [290, 80], [410, 60]]` |

      **Where it shows up.** Training needs a prediction for every example in the dataset, again and again, and `X @ w + b` gives them all in one line. A robot choosing between candidate paths does the same to predict each path's travel time: one row of features per path, one predicted time per row.
