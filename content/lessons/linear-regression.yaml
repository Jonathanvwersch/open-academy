      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="90" y="44" fill="#737373" text-anchor="start">predicted price (£ thousand)</text>
      <path d="M110 380 L530 110" stroke="#171717" stroke-width="2.5"/>
