      ### One formula for all the houses

      Predicting for many examples in one operation is called a **batch prediction**. With $n$ examples and $d$ features each, $X$ has $n$ rows and $d$ columns, and $w$ has $d$ entries. Then

      $$\hat y=Xw+b\mathbf 1.$$

      Now $\hat y$ is a vector with $n$ entries, one prediction per row. The bold $\mathbf 1$ is a vector of $n$ ones, so $b\mathbf 1$ adds $b$ to every entry. In NumPy this is `X @ w + b`, since NumPy adds a single number to every entry.

      Avoid writing `X * w + b`. The `*` multiplies matching entries without adding them. Our house's row becomes two pieces, $300$ and $20$. Over all three houses, `X * w` gives three rows of two pieces each; we still need to add each row's pieces to get prices.

      ### Storing the bias as a weight

      Some code stores the bias as one more weight instead, so the whole model is one matrix product. Code that adjusts the weights during training then adjusts the bias along with them, with no separate step. It adds a column of $1$s to $X$, like a feature that is always $1$. Then it puts $b$ last in the weights. So row 1 becomes $(100,2,1)$ and the weights become $(3,10,50)$. The extra $1$ times $50$ adds the bias to every row, so we must not add $b$ again.
    worked: |
      Let's price three houses at once, $(100,2)$, $(80,3)$ and $(120,1)$, with the weights $w=(3,10)$ and bias $b=50$.

      1. **Check that the shapes fit.** Each row of $X$ is paired with $w$, so the number of columns must match the number of weights, and there will be one prediction per row.
         $$X:\ 3\ \text{rows},\ 2\ \text{columns},\qquad w:\ 2\ \text{entries}\ \to\ \hat y:\ 3\ \text{entries}$$

      2. **Take one dot product per row.** Each row's features are multiplied by the weights and added up.
         $$Xw=(300+20,\ 240+30,\ 360+10)=(320,\ 270,\ 370)$$

      3. **Add the bias to every entry.** Each entry is a different house's prediction, so each one needs the same bias $50$ added.
         $$\hat y=(320+50,\ 270+50,\ 370+50)=(370,\ 320,\ 420)$$

      4. **Check the column-of-ones version on row 1.** With a $1$ appended and $b$ as the last weight, the bias comes out of the dot product.
         $$(100,2,1)\cdot(3,10,50)=300+20+50=370$$

      Here is the same calculation in NumPy. `np.array` turns a Python list into a NumPy array, which is how NumPy stores a vector or a matrix. A list of lists makes a matrix, with one inner list per row. The dots in `100.` make the numbers decimals, so the prices print as decimals too. `import numpy as np` loads NumPy under the short name `np`, and `print` shows a result. `np.column_stack` adds `np.ones(3)`, three $1$s, to `X` as a new last column, so each row gets one $1$.

      ```python
      import numpy as np
      X = np.array([[100., 2.], [80., 3.], [120., 1.]])
      w = np.array([3., 10.])
      b = 50.
      print(X @ w + b)                     # one price per row
      X1 = np.column_stack([X, np.ones(3)])
      w1 = np.array([3., 10., 50.])
      print(X1 @ w1)                       # the bias is now a weight
      # prints [370. 320. 420.] twice
      ```

      Both versions give the same three prices, $370$, $320$ and $420$ thousand pounds.
