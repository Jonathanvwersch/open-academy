      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="409" y="135" text-anchor="middle">320</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="453" y="135" fill="#737373">3×80 + 10×3 + 50</text>
      <rect x="377" y="150" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="409" y="175" text-anchor="middle">420</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="453" y="175" fill="#737373">3×120 + 10×1 + 50</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="409" y="212" fill="#737373" text-anchor="middle">one price per row</text>
      </g>
      </svg>
