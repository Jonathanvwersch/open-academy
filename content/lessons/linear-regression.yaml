final: lr-explain-model
summary: |
  - A linear regression model multiplies each feature by its weight, adds the results and adds one bias: $\hat y=w\cdot x+b$.
  - A weight is how much the prediction changes when its feature rises by one unit and the other features stay the same, so its size depends on the feature's units. The bias is the prediction when every feature is $0$.
  - Because each feature adds a fixed amount per unit, the model's predictions change in straight lines.
  - For many examples, we put one per row of $X$, and `X @ w + b` gives one prediction per row. A column of $1$s with $b$ as its weight can carry the bias instead.

  **Next:** The loss functions lesson measures how far these predictions are from the true prices, and gradient descent then adjusts $w$ and $b$ to shrink that gap.
