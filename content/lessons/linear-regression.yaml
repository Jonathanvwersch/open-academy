      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="116" y="135" text-anchor="middle">3</text>
      <rect x="20" y="150" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
