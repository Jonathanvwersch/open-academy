final: lr-explain-model
summary: |
  - A linear regression model multiplies each feature by its weight, adds the pieces, then adds one bias: $\hat y=w\cdot x+b$.
  - A weight is how much the prediction changes for one more unit of its feature with the other features fixed, in the target's units per feature unit; the bias is the prediction when every feature is $0$.
  - For many examples, put one per row of $X$: `X @ w + b` gives one prediction per row, and a column of ones can carry the bias.

  **Next:** The coming lessons measure how far these predictions are from the true prices and change $w$ and $b$ to shrink that error.
