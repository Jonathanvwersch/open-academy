      <path d="M250 290 H390 V200" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 5" fill="#171717" fill-opacity="0"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="320" y="312" fill="#3b82f6" text-anchor="middle">+10 m²</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="398" y="250" fill="#3b82f6">+30</text>
      <path d="M180 335 V311" stroke="#f59e0b" stroke-width="3" marker-end="url(#lr2-amber)"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="172" y="361" fill="#f59e0b" text-anchor="start">+10 for one more bedroom</text>
      <circle cx="250" cy="290" r="4" fill="#171717"/>
      <circle cx="250" cy="260" r="4" fill="#171717"/>
      <circle cx="390" cy="200" r="4" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="242" y="250" text-anchor="end">380</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="254" y="310" text-anchor="start">370</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="382" y="190" text-anchor="end">400</text>
      </g>
      </svg>
      ```

      ### What each number means

      A **weight** is how much the prediction changes when its feature rises by one unit and every other feature stays the same. Raising a feature by $k$ units changes the prediction by its weight times $k$. So area adds $3$ thousand pounds per m², and each bedroom adds $10$ thousand pounds.

      The **bias** is the prediction when every feature is $0$. No real house has no area, so think of it as the starting amount the feature pieces build on.

      ### Comparing weights

      It's tempting to read the bigger weight as the more important feature, but a weight's size depends on its feature's units. Here are the same predictions written two ways:

      - With area in m², our house has area $100$, and a weight of $3$ gives $300$.
      - With area in hundreds of m², it has area $1$, so the weight must be $300$ to give the same $300$.

      To compare features, compare how far realistic changes move the prediction. Here $10$ more m² adds $30$ and one more bedroom adds $10$, so in this model a modest change in area matters more than a bedroom.

      ### Limitations

      Because each feature adds a fixed amount per unit, plotting the price against one feature, with the others fixed, always gives a straight line. It can't say that the $200$th square metre is worth less than the $50$th, because every square metre adds exactly $3$, whatever the house's size.
    worked: |
      Let's start from our house, area $100$ m² and $2$ bedrooms, predicted at $370$ thousand pounds, and change one feature at a time.

      1. **Add one bedroom and keep the area at $100$ m².** We put the new bedroom count into the model.
         $$\hat y=3\times100+10\times3+50=380$$

      2. **Subtract the two predictions.** The area piece and the bias are the same in both, so they cancel and only the bedroom piece is left.
         $$380-370=10\times(3-2)=10$$

      3. **Now add $10$ m² as well.** Compared with the original house, both the area and the bedrooms have now changed.
         $$\hat y=3\times110+10\times3+50=410$$

      4. **Split the total change into one piece per feature.** Each feature contributes its weight times its own change.
         $$410-370=3\times10+10\times1=30+10=40$$

      So the change of $40$ is $30$ from the extra area plus $10$ from the extra bedroom, exactly what the two weights predict.
    problems:
      - lr-interpret-weights-basics
      - lrp-weights-self-explain
      - lrp-why-hold-fixed
      - lrp-change-template
      - lrp-negative
      - lrp-zero-input
      - lrp-both-template
      - lrp-units
      - lrp-robot-change
      - lrp-straight-line
  - id: lr-batch-predictions
    title: "Predict every example at once"

    tldr: |
      - We can put each house's measurements in its own row of a matrix.
      - Multiplying by the weights gives one total per house.
      - Adding the bias to every total gives all the predicted prices at once.
    explain: |
      ### Many houses in one matrix

      So far we've priced one house at a time. But a dataset can hold hundreds of houses, and training compares the prediction with the target for every one of them, so we need all their predictions, with the same weights and bias. How do we get them all in one calculation?

      A matrix times a vector takes one dot product per row. Stack the houses as rows of a matrix $X$, with features in the same order as $w$. For row 1, our house $(100,2)$:
      $$
      \begin{aligned}
      w\cdot x&=3\times100+10\times2 &&\text{pair features with weights}\\
      &=320 &&\text{multiply and add}\\
      \hat y&=320+50=370 &&\text{add the bias}
      \end{aligned}
      $$
      The other rows give $320$ and $420$ after adding the same bias.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" aria-label="The matrix X has one house per row: (100, 2), (80, 3) and (120, 1), with columns area and bedrooms. It is multiplied by the weights w = (3, 10), and the green bias 50 is added, giving one predicted price per row: 370, 320 and 420. The first row and its price are outlined in black, with the sum 3 times 100 plus 10 times 2 plus 50 beside it">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="84" y="56" fill="#737373" text-anchor="middle">X (one house per row)</text>
      <rect x="20" y="70" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="52" y="95" text-anchor="middle">100</text>
      <rect x="84" y="70" width="64" height="40" fill="#171717" fill-opacity="0" stroke="#d4d4d4" stroke-width="1.5"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="116" y="95" text-anchor="middle">2</text>
