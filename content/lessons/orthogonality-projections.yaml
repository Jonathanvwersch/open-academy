final: orth-explain
summary: |
  - Two vectors are orthogonal when their dot product is zero. The projection of $x$ onto the line through $u$ is $p=\frac{u^\top x}{u^\top u}u$, the closest point on that line to $x$, and the leftover $x-p$ is orthogonal to $u$.
  - Vectors are orthonormal when each has length 1 and every pair is orthogonal. A square matrix $Q$ with orthonormal columns is an orthogonal matrix, so $Q^\top Q=I$ and $Q^{-1}=Q^\top$.
  - When $Ax=b$ has no solution, least squares finds the closest $A\hat x$ to $b$. The error $b-A\hat x$ is orthogonal to every column of $A$, which gives the normal equations $A^\top A\hat x=A^\top b$, and $\hat x$ makes the sum of squared errors as small as possible.
  - The best line is unique when the rank of $A$ equals the number of columns. If all readings have the same time, any line through the best fitted height at that time gives the same squared error.

  **Next:** The eigenvalues and SVD lesson looks for the directions a matrix only stretches, and describes any matrix using two orthogonal matrices and a stretch.
