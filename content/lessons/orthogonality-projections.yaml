  - id: orth-least-squares
    key_prereqs: [inverses-linear-systems, matrices, rank-span]
    title: "Find the line closest to three points"
    tldr: |
      - Measured points often do not all lie on one straight line.
      - Least squares chooses the line with the smallest sum of squared vertical errors.
      - At the best fit, the vector of errors is perpendicular to every column of the matrix that makes the predictions.
      - The line is unique when those columns are independent.
    explain: |
      ### Three points and no exact line

      Suppose we measure at the times $t=-1$, $0$ and $1$ and get $y=1$, $3$ and $2$. We'd like a straight line $y=c+mt$ through all three points, where $c$ is its height at $t=0$ and $m$ is its slope, the change in its height when $t$ goes up by $1$. Each point gives one equation:

      $$\begin{bmatrix}1&-1\\1&0\\1&1\end{bmatrix}\begin{bmatrix}c\\m\end{bmatrix}=\begin{bmatrix}1\\3\\2\end{bmatrix}.$$

      Call the matrix $A$. The two unknowns $x=(c,m)$ give the line, and $b$ lists the measured heights. The system $Ax=b$ asks for a line that hits every reading. Use the readings at $t=-1$ and $t=1$ to fix the only possible line, then check the reading at $t=0$.
      $$
      \begin{aligned}
      (c-m)+(c+m)&=1+2 &&\text{add the two equations}\\
      2c&=3 &&\text{cancel the slopes}\\
      c&=1.5 &&\text{divide by two}
      \end{aligned}
      $$
      The middle row needs $c=3$, so there's no solution. The vector $b$ lies outside $A$'s column space.

      ### The closest point instead

      The independent columns of $A$ span a plane that contains every $Ax$. Write the plane's closest point to $b$ as $A\hat x$, where $\hat x$ ("x hat") holds the best $c$ and $m$. Subtract $A\hat x$ from $b$ and from every point in the plane. This shifts the closest point to the origin without changing distances or directions. The origin is now the projection of the error vector $e=b-A\hat x$ onto every line through the origin in the shifted plane. So $e$ is perpendicular to both column directions.

      Each entry of $A^\top e$ dots a column with the error. Require these dot products to be zero:
      $$
      \begin{aligned}
      A^\top(b-A\hat x)&=0 &&\text{make the error orthogonal to each column}\\
      A^\top b-A^\top A\hat x&=0 &&\text{multiply out}\\
      A^\top A\hat x&=A^\top b &&\text{move one term across}
      \end{aligned}
      $$
      These are the **normal equations**; normal means perpendicular.

      ### What the closest point makes smallest

      The squared length of $e$ is the sum of the squared errors. The closest point makes $e$ as short as possible, so $\hat x$ gives the line with the smallest such sum. That's why this is called **least squares**. In the picture, the orange line is the fit, $y=2+0.5t$, and the red dashes are the errors.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="95 30 460 300" aria-label="The three points (minus 1, 1), (0, 3) and (1, 2) on axes of t and y, with the orange least-squares line y = 2 + 0.5t. Red dashed vertical gaps show the errors: minus 0.5 at t = minus 1, 1 at t = 0 and minus 0.5 at t = 1">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M110 300 H530 M315 320 V40" stroke="#d4d4d4"/>
      <path d="M185 300 v6 M445 300 v6 M315 240 h-6 M315 180 h-6 M315 120 h-6" stroke="#737373"/>
      <text x="185" y="322" text-anchor="middle" fill="#737373">−1</text>
      <text x="445" y="322" text-anchor="middle" fill="#737373">1</text>
      <text x="302" y="245" text-anchor="end" fill="#737373">1</text>
      <text x="302" y="125" text-anchor="end" fill="#737373">3</text>
      <text x="540" y="305" fill="#737373">t</text>
      <text x="322" y="44" fill="#737373">y</text>
      <path d="M120 225 L510 135" stroke="#f59e0b" stroke-width="3"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="302" y="185" text-anchor="end" fill="#737373">2</text>
      <path d="M185 240 V210 M315 120 V180 M445 180 V150" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 4"/>
      <circle cx="185" cy="240" r="5" fill="#171717"/>
      <circle cx="315" cy="120" r="5" fill="#171717"/>
      <circle cx="445" cy="180" r="5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="175" y="262" text-anchor="end" fill="#ef4444">error −0.5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="327" y="112" fill="#ef4444">error 1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="457" y="198" fill="#ef4444">error −0.5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="500" y="122" fill="#f59e0b" text-anchor="end">y = 2 + 0.5t</text>
      </g>
      </svg>
      ```

      Be careful not to picture the errors as the shortest distances from the points to the line. They are vertical gaps, measured in $y$ at each $t$. The right angle is between $e$ and the columns of $A$, in three dimensions, so this picture can't show it.

    worked: |
      Let's fit $y=c+mt$ to the points $(-1,1)$, $(0,3)$ and $(1,2)$ with the normal equations, using $A$ and $b=(1,3,2)$ from above.

      1. **Find $A^\top A$.** Each entry dots two columns of $A$. The off-diagonal entries match because swapping the two vectors leaves a dot product unchanged.
         $$
         \begin{aligned}
         (1,1,1)\cdot(1,1,1)&=3 &&\text{first column with itself}\\
         (1,1,1)\cdot(-1,0,1)&=-1+0+1 &&\text{multiply matching entries}\\
         &=0 &&\text{add the products}\\
         (-1,0,1)\cdot(-1,0,1)&=2 &&\text{second column with itself}\\
         A^\top A&=\begin{bmatrix}3&0\\0&2\end{bmatrix} &&\text{place the four dot products}
         \end{aligned}
         $$

      2. **Find $A^\top b$.** Each entry dots one column of $A$ with $b$.
         $$A^\top b=\begin{bmatrix}1+3+2\\-1+0+2\end{bmatrix}=\begin{bmatrix}6\\1\end{bmatrix}$$

      3. **Solve the normal equations.** The zeros leave one unknown per row.
         $$
         \begin{aligned}
         3c&=6 &&\text{read the first row}\\
         c&=2 &&\text{divide by three}\\
         2m&=1 &&\text{read the second row}\\
         m&=0.5 &&\text{divide by two}
         \end{aligned}
         $$

      4. **Find the errors.** First find the line's height at each time, then subtract those fitted values from $b=(1,3,2)$.
         $$
         \begin{aligned}
         A\hat x&=(2-0.5,\;2,\;2+0.5) &&\text{put each time into the line}\\
         &=(1.5,2,2.5) &&\text{work out the fitted heights}\\
         e&=(1-1.5,\;3-2,\;2-2.5) &&\text{subtract from the measurements}\\
         &=(-0.5,1,-0.5) &&\text{work out the errors}
         \end{aligned}
         $$

      5. **Check that $e$ is orthogonal to both columns.** Each column's dot product with the error must be zero.
         $$
         \begin{aligned}
         (1,1,1)\cdot e&=-0.5+1-0.5 &&\text{multiply by the first column's entries}\\
         &=0 &&\text{add the products}\\
         (-1,0,1)\cdot e&=0.5+0-0.5 &&\text{multiply by the second column's entries}\\
         &=0 &&\text{add the products}\\
         A^\top e&=\begin{bmatrix}0\\0\end{bmatrix} &&\text{stack the two checks}
         \end{aligned}
         $$

      The best line is $y=2+0.5t$. Compare its squared errors with those for $y=2+t$:
      $$
      \begin{aligned}
      \text{best line's sum}&=(-0.5)^2+1^2+(-0.5)^2 &&\text{square its errors}\\
      &=0.25+1+0.25 &&\text{work out the squares}\\
      &=1.5 &&\text{add them}\\
      \text{other line's errors}&=(1-1,\;3-2,\;2-3) &&\text{subtract its fitted heights}\\
      &=(0,1,-1) &&\text{work out the differences}\\
      \text{other line's sum}&=0^2+1^2+(-1)^2 &&\text{square its errors}\\
      &=2 &&\text{add the squares}
      \end{aligned}
      $$
      Least squares guarantees that no other line has a smaller sum than 1.5.

      ### When several lines fit just as well

      At the best fit, the error is perpendicular to the plane of predictions. Moving anywhere else in the plane adds a leg to that right triangle, making the total error longer. So only one prediction vector is closest. Will just one line give those heights? That depends on whether two choices of $c$ and $m$ can give the same predictions. As we saw in Rank and Span, only one choice can give them when the columns of $A$ are independent. This means the rank equals the number of columns.

      Imagine three sensors report heights $1$, $3$ and $2$ at the same time, $t=1$. Our line predicts the same height for all three sensors. We'll find that height first and then see which lines give it.

      1. **Write the new matrix.** Each row is $(1,1)$ because a line's height at $t=1$ is $c+m$. Both columns are the same, so there is just one independent column.
         $$A=\begin{bmatrix}1&1\\1&1\\1&1\end{bmatrix}$$

      2. **Build the normal equations.** The two columns both contain three ones. Their dot product is $3$, and the dot product of either column with the readings is $1+3+2=6$.
         $$\begin{bmatrix}3&3\\3&3\end{bmatrix}\begin{bmatrix}c\\m\end{bmatrix}=\begin{bmatrix}6\\6\end{bmatrix}$$

      3. **Read the one equation.** Both rows say $3c+3m=6$. Divide by 3 to find the height at $t=1$.
         $$c+m=2$$

      The lines $y=2$ and $y=1+t$ both pass through $(1,2)$. Every line through that point gives the same three fitted heights and the same squared errors, so there are infinitely many best lines.
