  - id: orth-least-squares
    title: "Find the line closest to three points"
    explain: |
      ### Three points and no exact line

      Suppose we measure at the times $t=-1$, $0$ and $1$ and get $y=1$, $3$ and $2$. We'd like a straight line $y=c+mt$ through all three points, where $c$ is its height at $t=0$ and $m$ is its slope, the change in its height when $t$ goes up by $1$. Each point gives one equation:

      $$\begin{bmatrix}1&-1\\1&0\\1&1\end{bmatrix}\begin{bmatrix}c\\m\end{bmatrix}=\begin{bmatrix}1\\3\\2\end{bmatrix}.$$

      We call the matrix $A$, the unknowns $x=(c,m)$ and the measurements $b$, so this is $Ax=b$. The first and third rows say $c-m=1$ and $c+m=2$, so $c=1.5$, but the middle row needs $c=3$. There's no solution, because $b$ isn't in the column space of $A$.

      ### The closest point instead

      The two columns of $A$ are independent, so they span a plane through the origin in three dimensions. Picture a sheet of paper through the origin, with $b$ sticking out. Every $Ax$ lies in that plane, the column space, so we look for its point closest to $b$. We write it $A\hat x$, where $\hat x$ ("x hat") holds the best $c$ and $m$. As with a line, the leftover, now called the error $e=b-A\hat x$, at the closest point is orthogonal to the plane, so to every arrow in it, including each column of $A$.

      Each entry of $A^\top e$ is a column of $A$ dotted with $e$, so we need $A^\top(b-A\hat x)=0$. Multiplying out gives $A^\top b-A^\top A\hat x=0$. Moving one term across gives the **normal equations** (normal means perpendicular):

      $$A^\top A\,\hat x=A^\top b.$$

      Here $A^\top A$ has determinant $6$, so there's one solution.

      ### What least squares makes smallest

      The squared length of $e$ is the sum of the squared errors. The closest point makes $e$ as short as possible, so $\hat x$ gives the line with the smallest such sum. That's why this is called **least squares**. In the picture, the orange line is the fit, $y=2+0.5t$, and the red dashes are the errors.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="95 30 460 300" aria-label="The three points (minus 1, 1), (0, 3) and (1, 2) on axes of t and y, with the orange least-squares line y = 2 + 0.5t. Red dashed vertical gaps show the errors: minus 0.5 at t = minus 1, 1 at t = 0 and minus 0.5 at t = 1">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M110 300 H530 M315 320 V40" stroke="#d4d4d4"/>
      <path d="M185 300 v6 M445 300 v6 M315 240 h-6 M315 180 h-6 M315 120 h-6" stroke="#737373"/>
      <text x="185" y="322" text-anchor="middle" fill="#737373">−1</text>
      <text x="445" y="322" text-anchor="middle" fill="#737373">1</text>
      <text x="302" y="245" text-anchor="end" fill="#737373">1</text>
      <text x="302" y="125" text-anchor="end" fill="#737373">3</text>
      <text x="540" y="305" fill="#737373">t</text>
      <text x="322" y="44" fill="#737373">y</text>
      <path d="M120 225 L510 135" stroke="#f59e0b" stroke-width="3"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="302" y="185" text-anchor="end" fill="#737373">2</text>
      <path d="M185 240 V210 M315 120 V180 M445 180 V150" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 4"/>
      <circle cx="185" cy="240" r="5" fill="#171717"/>
      <circle cx="315" cy="120" r="5" fill="#171717"/>
      <circle cx="445" cy="180" r="5" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="175" y="262" text-anchor="end" fill="#ef4444">error −0.5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="327" y="112" fill="#ef4444">error 1</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="457" y="198" fill="#ef4444">error −0.5</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="500" y="122" fill="#f59e0b" text-anchor="end">y = 2 + 0.5t</text>
      </g>
      </svg>
      ```

      Be careful not to picture the errors as the shortest distances from the points to the line. They are vertical gaps, measured in $y$ at each $t$. The right angle is between $e$ and the columns of $A$, in three dimensions, so this picture can't show it.
    worked: |
      Let's fit $y=c+mt$ to the points $(-1,1)$, $(0,3)$ and $(1,2)$ with the normal equations, using $A$ and $b=(1,3,2)$ from above.

      1. **Find $A^\top A$.** Each entry dots two columns of $A$. The first column $(1,1,1)$ with itself gives $3$, the two columns give $-1+0+1=0$, and the second column $(-1,0,1)$ with itself gives $2$.
         $$A^\top A=\begin{bmatrix}3&0\\0&2\end{bmatrix}$$

      2. **Find $A^\top b$.** Each entry dots one column of $A$ with $b$.
         $$A^\top b=\begin{bmatrix}1+3+2\\-1+0+2\end{bmatrix}=\begin{bmatrix}6\\1\end{bmatrix}$$

      3. **Solve the normal equations.** The zeros mean each row has one unknown, $3c=6$ and $2m=1$.
         $$c=2,\qquad m=0.5$$

      4. **Find the errors.** The fitted values, the line's heights at $t=-1$, $0$ and $1$, are $A\hat x=(1.5,2,2.5)$. Subtracting them from $b=(1,3,2)$ gives the errors.
         $$e=(-0.5,1,-0.5)$$

      5. **Check that $e$ is orthogonal to both columns.** Dotting $e$ with $(1,1,1)$ gives $-0.5+1-0.5$, and with $(-1,0,1)$ gives $0.5+0-0.5$. Both are zero.
         $$A^\top e=\begin{bmatrix}0\\0\end{bmatrix}$$

      The best line is $y=2+0.5t$, with a sum of squared errors of $0.25+1+0.25=1.5$. Least squares guarantees that no other line has a smaller sum. For example, $y=2+t$ has errors $(0,1,-1)$ and a sum of $2$.
    problems:
