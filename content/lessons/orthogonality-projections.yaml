  - id: orth-orthogonal-matrices
    key_prereqs: [inverses-linear-systems, dot-product, vectors]
    title: "Matrices whose inverse is their transpose"
    tldr: |
      - A square matrix is called orthogonal when its columns have length one and meet at right angles.
      - Those columns make the transpose its inverse.
      - It can turn or flip vectors while keeping every length the same.
    explain: |
      ### Orthogonal vectors of length 1

      A unit vector has length 1, so its projection formula simplifies:
      $$
      \begin{aligned}
      u^\top u&=1 &&\text{square its length}\\
      p&=\frac{u^\top x}{1}u &&\text{put that into the projection formula}\\
      &=(u^\top x)u &&\text{divide by one}
      \end{aligned}
      $$
      Unit vectors at right angles also make matrices easy to undo. A set of vectors is **orthonormal** when each has length 1 and every pair is orthogonal.

      Take two vectors, the blue $(0.6,0.8)$ and green $(-0.8,0.6)$. Their component squares add to the same total:
      $$
      \begin{aligned}
      \text{each length}&=\sqrt{0.36+0.64} &&\text{use the squared components}\\
      &=\sqrt{1} &&\text{add the squares}\\
      &=1 &&\text{take the square root}\\
      \text{their dot product}&=-0.48+0.48 &&\text{multiply matching entries}\\
      &=0 &&\text{add the products}
      \end{aligned}
      $$
      Both tips sit on the grey circle of radius 1, and they meet at a right angle.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="100 60 440 220" aria-label="A grey half circle of radius 1 around the origin. The blue arrow (0.6, 0.8) and the green arrow (minus 0.8, 0.6) both end on the circle, so both have length 1, and a small square at the origin marks the right angle between them. Grey dashed arrows show (1, 0) and (0, 1) for comparison">
      <defs><marker id="orth2-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="orth2-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker><marker id="orth2-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M140 250 H500 M320 270 V70" stroke="#d4d4d4"/>
      <path d="M170 250 A150 150 0 0 1 470 250" stroke="#737373" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
      <path d="M320 250 L470 250" stroke="#737373" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#orth2-muted)"/>
      <path d="M320 250 L320 100" stroke="#737373" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#orth2-muted)"/>
      <path d="M320 250 L410 130" stroke="#3b82f6" stroke-width="3" marker-end="url(#orth2-blue)"/>
      <path d="M320 250 L200 160" stroke="#10b981" stroke-width="3" marker-end="url(#orth2-green)"/>
      <path d="M328.4 238.8 L317.2 230.4 L308.8 241.6" stroke="#171717" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
      <circle cx="320" cy="250" r="4" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="420" y="126" fill="#3b82f6">(0.6, 0.8)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="190" y="156" fill="#10b981" text-anchor="end">(−0.8, 0.6)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="478" y="270" fill="#737373">(1, 0)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="328" y="92" fill="#737373">(0, 1)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="470" y="200" fill="#737373">radius 1</text>
      </g>
      </svg>
      ```

      ### Orthogonal matrices

      Now stand the two vectors side by side as the columns of a matrix,

      $$Q=\begin{bmatrix}0.6&-0.8\\0.8&0.6\end{bmatrix}.$$

      A square matrix with orthonormal columns is an **orthogonal matrix**. To find entry $(i,j)$ of $Q^\top Q$:

      1. Dot row $i$ of $Q^\top$ with column $j$ of $Q$.
      2. Row $i$ of $Q^\top$ is column $i$ of $Q$, so this dots two columns of $Q$.
      3. Matching columns give 1; different columns give 0. Those entries make the identity:

      $$Q^\top Q=I.$$

      To check for an inverse, let $x$ be a vector with one coefficient per column of $Q$. Suppose $Qx=0$, where $0$ is the zero vector:
      $$
      \begin{aligned}
      Q^\top Qx&=Q^\top0 &&\text{multiply by the transpose}\\
      x&=0 &&\text{use }Q^\top Q=I
      \end{aligned}
      $$
      Only zero amounts work, so every column has a pivot after elimination. The matrix is square, so every row has a pivot too. That makes $Qx=b$ solvable for any $b$, with no free variables, so $Q$ has an inverse. Now:
      $$
      \begin{aligned}
      Q^\top QQ^{-1}&=IQ^{-1} &&\text{multiply }Q^\top Q=I\text{ by the inverse}\\
      Q^\top&=Q^{-1} &&\text{cancel }QQ^{-1}
      \end{aligned}
      $$
      We can therefore solve $Qx=b$ with $x=Q^\top b$.

      $Q$ also preserves lengths:
      $$
      \begin{aligned}
      \|Qx\|^2&=(Qx)^\top Qx &&\text{write squared length as a self-dot product}\\
      &=x^\top Q^\top Qx &&\text{transpose the product}\\
      &=x^\top x &&\text{use }Q^\top Q=I\\
      &=\|x\|^2 &&\text{recognise the original squared length}
      \end{aligned}
      $$
      This $Q$ turns every vector by the same angle, so it's called a rotation matrix.

      Be careful to check the column lengths too. Take $M=\begin{bmatrix}3&-4\\4&3\end{bmatrix}$. Its columns are orthogonal but have length 5:
      $$
      \begin{aligned}
      M^\top M&=25I &&\text{matching columns give }25\text{; different ones give }0\\
      (M^\top/25)M&=I &&\text{divide by }25\\
      M^{-1}&=M^\top/25 &&\text{read off the inverse}
      \end{aligned}
      $$
      The inverse needs that extra division.
    worked: |
      Let's check that $Q=\begin{bmatrix}0.6&-0.8\\0.8&0.6\end{bmatrix}$ is orthogonal, then use its transpose to solve $Qx=b$ for $b=(2,11)$.

      1. **Check that each column has length 1.** We square each column's entries and add them. The second column, $(-0.8,0.6)$, has the same two numbers squared, so both columns give the same sum.
         $$0.6^2+0.8^2=0.36+0.64=1$$

      2. **Check that the columns are orthogonal.** Their dot product should be zero. The two products are $-0.48$ and $0.48$.
         $$0.6\times(-0.8)+0.8\times0.6=0$$

      3. **Multiply $b$ by $Q^\top$.** Since $Q^{-1}=Q^\top$, this gives the solution. The rows of $Q^\top$ are the columns of $Q$, so each entry of $x$ is one column of $Q$ dotted with $b$.
         $$x=\begin{bmatrix}0.6\times2+0.8\times11\\-0.8\times2+0.6\times11\end{bmatrix}=\begin{bmatrix}10\\5\end{bmatrix}$$

      4. **Check by multiplying by $Q$.** Putting $x$ back in should give $b$.
         $$Q\begin{bmatrix}10\\5\end{bmatrix}=\begin{bmatrix}6-4\\8+3\end{bmatrix}=\begin{bmatrix}2\\11\end{bmatrix}$$

      So $x=(10,5)$. Check that the lengths agree:
      $$
      \begin{aligned}
      \|x\|^2&=10^2+5^2 &&\text{square the input entries}\\
      &=125 &&\text{add the squares}\\
      \|b\|^2&=2^2+11^2 &&\text{square the output entries}\\
      &=125 &&\text{add the squares}\\
      \|x\|&=\sqrt{125} &&\text{take the input's square root}\\
      \|b\|&=\sqrt{125} &&\text{take the output's square root}
      \end{aligned}
      $$
      That fits with $Q$ preserving lengths.
