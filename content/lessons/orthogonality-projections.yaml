concept: orthogonality-projections
version: 1
objective: |
  **Goal:** project a vector onto a line, invert an orthogonal matrix with its transpose, and use the normal equations to fit a least-squares line and check whether it is unique.
recap:
  - concept: rank-span
    text: "The column space of $A$ is the span of its columns. $Ax=b$ has a solution only when $b$ is in the column space of $A$."
where_this_fits: |
  ### What is a projection?

  A projection finds the point on a line, or on a flat plane, that is closest to a given vector. It splits the vector into a part along the line and a leftover at right angles to it.

  Why do we need it? Say we measure three points and want a line through them. Measurements are noisy, so often no line fits exactly. In the rank lesson, we saw that $Ax=b$ has a solution only when $b$ is in the column space of $A$, the span of its columns. Projecting $b$ onto that space gives the closest point, and the $x$ that reaches it gives the best line. This is called least squares. The same right angles give matrices whose inverse is their transpose.
knowledge_points:
  - id: orth-line-projection
    key_prereqs: [dot-product, vectors]
    title: "Project a vector onto a line"
    tldr: |
      - A projection is the shadow vector on a line.
      - Dividing two dot products tells us how many copies of the line's direction vector to use.
      - Scaling by that amount gives the closest vector on the line.
      - The leftover is at right angles to the line.
    explain: |
      ### The shadow as a vector

      In the dot product lesson, we found the shadow of the vector $(7,1)$ on the line through $(6,8)$. A path dropped from the tip of $(7,1)$ meets that line at a right angle at $(3,4)$. Here we call the vectors $x=(7,1)$ and $u=(6,8)$. Two vectors are **perpendicular** when their dot product is zero. The usual word for this in linear algebra is **orthogonal**.

      That lesson called the shadow's length, $5$, the projection. From here on, the projection means the shadow vector itself, $(3,4)$.

      ### The closest point on the line

      In the picture, the blue arrow is $u$ and the green arrow is $x$. The orange arrow, $p=(3,4)$, is the shadow, and the red dashed arrow is the leftover, $x-p=(4,-3)$, which meets the line at a right angle. Pick another point on the line, such as the grey dot $q$. The straight path from it to $x$'s tip is the long side of a right-angled triangle whose other sides are a piece of the line and the red arrow. By Pythagoras' rule that path is longer than the red arrow, so $p$ is the closest point.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="20 10 380 345" aria-label="From the origin, the blue arrow u = (6, 8) and the green arrow x = (7, 1). The orange arrow p = (3, 4) runs halfway along u. A red dashed arrow, the leftover x minus p = (4, minus 3), runs from the tip of p to the tip of x and meets u's line at a right angle. A grey dot q on u's line at (1.5, 2) has a grey dotted path to the tip of x">
      <defs><marker id="orth1-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="orth1-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10b981"/></marker><marker id="orth1-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker><marker id="orth1-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M80 320 H400 M80 340 V20" stroke="#d4d4d4"/>
      <path d="M80 320 L296 32" stroke="#d4d4d4" stroke-width="1.5" stroke-dasharray="6 5"/>
      <path d="M80 320 L260 80" stroke="#3b82f6" stroke-width="3" marker-end="url(#orth1-blue)"/>
      <path d="M80 320 L290 290" stroke="#10b981" stroke-width="3" marker-end="url(#orth1-green)"/>
      <path d="M80 320 L170 200" stroke="#f59e0b" stroke-width="4" marker-end="url(#orth1-amber)"/>
      <path d="M170 200 L290 290" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#orth1-red)"/>
      <path d="M125 260 L290 290" stroke="#737373" stroke-width="2" stroke-dasharray="2 4"/>
      <circle cx="125" cy="260" r="4" fill="#737373"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="115" y="266" text-anchor="end" fill="#737373">q</text>
      <path d="M178 206 L184 198 L176 192" stroke="#737373" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
      <circle cx="80" cy="320" r="4" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="72" y="344" text-anchor="end">(0, 0)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="270" y="84" fill="#3b82f6">u = (6, 8)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="300" y="296" fill="#10b981">x = (7, 1)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="160" y="196" fill="#f59e0b" text-anchor="end">p = (3, 4)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="244" y="232" fill="#ef4444">x − p = (4, −3)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="306" y="40" fill="#737373">u's line</text>
      </g>
      </svg>
      ```

      ### The formula

      The **projection** of $x$ onto the line through $u$ is the vector on that line closest to $x$. We'll call it $p$:

      $$p=\frac{u^\top x}{u^\top u}\,u.$$

      As in the inverses lesson, $u^\top x$ is the dot product, and $u^\top u$ is $u$'s length squared. Their ratio tells us how many copies of $u$ make the shadow.

      Why this fraction? Call the number of copies $k$, so the shadow is $ku$. The leftover must be orthogonal to $u$:
      $$
      \begin{aligned}
      x-ku&=(7-6k,\;1-8k) &&\text{subtract the shadow}\\
      u^\top(x-ku)&=6(7-6k)+8(1-8k) &&\text{dot the leftover with }u\\
      &=42-36k+8-64k &&\text{expand the products}\\
      &=50-100k &&\text{collect terms}\\
      50-100k&=0 &&\text{require a right angle}\\
      50&=100k &&\text{add }100k\\
      k&=50/100 &&\text{divide by }100\\
      &=0.5 &&\text{use half of }u
      \end{aligned}
      $$
      The same moves work for any $x$ and nonzero $u$:
      $$
      \begin{aligned}
      u^\top(x-ku)&=0 &&\text{require an orthogonal leftover}\\
      u^\top x-k\,u^\top u&=0 &&\text{multiply out the dot product}\\
      u^\top x&=k\,u^\top u &&\text{add }k\,u^\top u\text{ to both sides}\\
      k&=\frac{u^\top x}{u^\top u} &&\text{divide by the squared length}
      \end{aligned}
      $$

      Be careful not to divide by $u$'s length instead of its length squared. That mistake gives:
      $$
      \begin{aligned}
      \text{wrong number of copies}&=50/10 &&\text{divide by length}\\
      &=5 &&\text{work out the quotient}\\
      5u&=(30,40) &&\text{scale }u
      \end{aligned}
      $$
      That is far past the shadow.
    worked: |
      Let's project $x=(7,1)$ onto the line through $u=(6,8)$, and check that the leftover really is orthogonal to $u$.

      1. **Find the dot product of $u$ and $x$.** This is the top of the fraction.
         $$u^\top x=6\times7+8\times1=50$$

      2. **Find $u^\top u$.** This is $u$'s length squared, the bottom of the fraction.
         $$u^\top u=6^2+8^2=100$$

      3. **Divide to find how many copies of $u$ we need.** This number is $k$.
         $$k=\frac{50}{100}=0.5$$

      4. **Scale $u$ by that number.** The projection is a multiple of $u$, so it lies on $u$'s line.
         $$p=0.5\times(6,8)=(3,4)$$

      5. **Find the leftover.** Subtract the projection from the original vector.
         $$
         \begin{aligned}
         x-p&=(7,1)-(3,4) &&\text{subtract the projection}\\
         &=(4,-3) &&\text{subtract matching entries}
         \end{aligned}
         $$

      6. **Check that the leftover is orthogonal to $u$.** Its dot product with $u$ should be zero.
         $$u^\top(x-p)=6\times4+8\times(-3)=0$$

      So $x$ splits into $(3,4)$ along the line plus $(4,-3)$ at right angles to it. Measure the leftover to find the distance to the line:
      $$
      \begin{aligned}
      \|x-p\|&=\sqrt{4^2+(-3)^2} &&\text{use the leftover's components}\\
      &=\sqrt{16+9} &&\text{square them}\\
      &=\sqrt{25} &&\text{add the squares}\\
      &=5 &&\text{take the square root}
      \end{aligned}
      $$
      The shadow's length is also 5 here, just by chance.
