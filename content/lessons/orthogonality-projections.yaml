      - orthp-sensor-fit
  - id: orth-numpy-fits
    title: "Fit a line in NumPy"
    explain: |
      ### Least squares in NumPy

      Three points are easy by hand, but real data sets have thousands of rows. NumPy's `np.linalg.lstsq(A, b, rcond=None)` finds the least-squares $\hat x$. It gives back four results, in order: $\hat x$, an array holding the sum of squared errors, the rank of $A$, and a fourth we won't need. Writing `rcond=None` picks NumPy's default setting.

      As in the matrices lesson, `@` multiplies arrays. So `A @ x_hat` gives the fitted values, which are the projection of $b$ onto the column space of $A$. Projecting onto a line also takes one line of code, since for two vectors `u @ x` is the dot product $u^\top x$.

      Be careful not to reach for `np.linalg.solve(A, b)` here. From the inverses lesson, `solve` needs a square matrix with an inverse. Our $A$ is $3\times2$, so it stops with an error.

      ### When there's no single best line

      The normal equations have one solution only when $A^\top A$ has an inverse. Suppose all three measurements were taken at the same time, $t=1$. Then both columns of $A$ are $(1,1,1)$, so they're dependent, and

      $$A^\top A=\begin{bmatrix}3&3\\3&3\end{bmatrix},$$

      whose determinant is $3\times3-3\times3=0$. Picture the three points stacked on one vertical line at $t=1$. At $t=1$ a line has one height, $c+m$, and the best height is the average of the three measurements. Every line through that height at $t=1$ has the same errors, whatever its slope, so there's no single best line. `lstsq` still returns one answer, the $\hat x=(c,m)$ with the smallest length $\sqrt{c^2+m^2}$. The rank it reports tells us when this happens. A rank below the number of columns means other answers fit just as well. Then the second result is an empty array.

      ### One bad point pulls the line

      Least squares squares each error, so big errors count a lot. In our fit, the error of $1$ adds $1$ to the sum, while each error of $0.5$ adds only $0.25$. One error of $4$ counts as much as sixteen errors of $1$. A single bad measurement, such as a sensor glitch, can drag the whole line towards itself. So after a fit, print the errors, `b - A @ x_hat`, and check any point with a much larger error.
    worked: |
      Let's do the line fit and the projection from earlier in NumPy. In the code, `x_hat, sse, rank, _ = ...` stores the four results under four names (`sse` is short for sum of squared errors, and `_` is a name for a result we don't need), and `np.allclose` checks whether numbers are equal apart from tiny rounding errors.

      ```python
      import numpy as np

      u = np.array([6, 8])
      x = np.array([7, 1])
      p = (u @ x) / (u @ u) * u
      print(p)                         # [3. 4.]

      A = np.array([[1, -1], [1, 0], [1, 1]])
      b = np.array([1, 3, 2])
      x_hat, sse, rank, _ = np.linalg.lstsq(A, b, rcond=None)
      print(x_hat)                     # [2.  0.5]
      print(sse)                       # [1.5]
      print(rank)                      # 2

      e = b - A @ x_hat
      print(np.allclose(A.T @ e, 0))   # True
      ```

      1. **Project $x$ onto $u$.** `(u @ x) / (u @ u)` is the fraction $50/100$, and multiplying by `u` gives $p=(3,4)$.

      2. **Fit the line.** `lstsq` returns $\hat x=(2,0.5)$, so the line is $y=2+0.5t$, and the sum of squared errors is $1.5$, as by hand. It prints as `[1.5]`, an array with one entry, because $A$ has more rows than columns and its rank equals its number of columns. When either of those fails, the array is empty, so get the sum yourself with `np.sum((b - A @ x_hat) ** 2)`, where `**` raises to a power.

      3. **Read the rank.** It's $2$, the number of columns, so this is the only best line.

      4. **Check the right angle.** `A.T @ e` dots each column with the errors. NumPy gets tiny numbers such as $2\times10^{-16}$ in place of exact zeros, so we use `np.allclose` instead of `==`.

      The code matches the hand calculation, and it would run just the same with a thousand rows in `A`.
