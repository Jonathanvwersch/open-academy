  - id: orth-orthogonal-matrices
    title: "Matrices whose inverse is their transpose"
    explain: |
      ### Orthogonal arrows of length 1

      The projection formula divides by $u^\top u$, which is $u$'s length squared. If $u$ is a unit vector, with length 1, then $u^\top u=1$ and the projection is just $(u^\top x)\,u$. With a unit vector the fraction goes away. Unit vectors at right angles to each other make matrices easy to undo too, so they have their own name. A set of vectors is **orthonormal** when each one has length 1 and every pair is orthogonal.

      The picture shows two orthonormal vectors, the blue $(0.6,0.8)$ and the orange $(-0.8,0.6)$. Each has length $\sqrt{0.36+0.64}=1$, so both tips sit on the grey arc, part of the circle of radius 1. Their dot product is $-0.48+0.48=0$, so they meet at a right angle.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="100 60 440 220" aria-label="A grey half circle of radius 1 around the origin. The blue arrow (0.6, 0.8) and the orange arrow (minus 0.8, 0.6) both end on the circle, so both have length 1, and a small square at the origin marks the right angle between them. Grey dashed arrows show (1, 0) and (0, 1) for comparison">
      <defs><marker id="orth2-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/></marker><marker id="orth2-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker><marker id="orth2-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M140 250 H500 M320 270 V70" stroke="#d4d4d4"/>
      <path d="M170 250 A150 150 0 0 1 470 250" stroke="#737373" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
      <path d="M320 250 L470 250" stroke="#737373" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#orth2-muted)"/>
      <path d="M320 250 L320 100" stroke="#737373" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#orth2-muted)"/>
      <path d="M320 250 L410 130" stroke="#3b82f6" stroke-width="3" marker-end="url(#orth2-blue)"/>
      <path d="M320 250 L200 160" stroke="#f59e0b" stroke-width="3" marker-end="url(#orth2-amber)"/>
      <path d="M328.4 238.8 L317.2 230.4 L308.8 241.6" stroke="#171717" stroke-width="1.5" fill="#ffffff" fill-opacity="0"/>
      <circle cx="320" cy="250" r="4" fill="#171717"/>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="420" y="126" fill="#3b82f6">(0.6, 0.8)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="190" y="156" fill="#f59e0b" text-anchor="end">(−0.8, 0.6)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="478" y="270" fill="#737373">(1, 0)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="328" y="92" fill="#737373">(0, 1)</text>
      <text stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" x="470" y="200" fill="#737373">radius 1</text>
      </g>
      </svg>
      ```

      ### Orthogonal matrices

      Now stand the two vectors side by side as the columns of a matrix,

      $$Q=\begin{bmatrix}0.6&-0.8\\0.8&0.6\end{bmatrix}.$$

      A square matrix whose columns are orthonormal is called an **orthogonal matrix**. Its transpose undoes it. Look at entry $(i,j)$ of $Q^\top Q$. It is row $i$ of $Q^\top$ dotted with column $j$ of $Q$. Row $i$ of $Q^\top$ is column $i$ of $Q$, so the entry is column $i$ dotted with column $j$. Each column dotted with itself gives 1, and the two different columns give 0, so

      $$Q^\top Q=I.$$

      Why is $Q^\top$ the inverse? If $Qx=0$, then $x=Q^\top Qx=0$, so the columns of $Q$ are independent and $Q$ has an inverse. Then $Q^\top=Q^\top QQ^{-1}=Q^{-1}$. So to solve $Qx=b$ we skip elimination and just work out $x=Q^\top b$.

      An orthogonal matrix never changes lengths. Using $(AB)^\top=B^\top A^\top$ from the inverses lesson, the squared length of $Qx$ is $(Qx)^\top Qx=x^\top Q^\top Qx=x^\top x$, the squared length of $x$. This $Q$ turns every arrow by the same angle, so it's called a rotation matrix. The course doesn't teach rotation matrices yet.

      Be careful: orthogonal columns aren't enough, and each column also needs length 1. The columns of $\begin{bmatrix}3&-4\\4&3\end{bmatrix}$ are orthogonal, but each has length 5. Each column dotted with itself gives 25, so its transpose times itself is $25I$. So the inverse is the transpose divided by 25, because that times the matrix gives $I$.
    worked: |
      Let's check that $Q=\begin{bmatrix}0.6&-0.8\\0.8&0.6\end{bmatrix}$ is orthogonal, then use its transpose to solve $Qx=b$ for $b=(2,11)$.

      1. **Check that each column has length 1.** We square each column's entries and add them. The second column, $(-0.8,0.6)$, has the same two numbers squared, so both columns give the same sum.
         $$0.6^2+0.8^2=0.36+0.64=1$$

      2. **Check that the columns are orthogonal.** Their dot product should be zero. The two products are $-0.48$ and $0.48$.
         $$0.6\times(-0.8)+0.8\times0.6=0$$

      3. **Multiply $b$ by $Q^\top$.** Since $Q^{-1}=Q^\top$, this gives the solution. The rows of $Q^\top$ are the columns of $Q$, so each entry of $x$ is one column of $Q$ dotted with $b$.
         $$x=\begin{bmatrix}0.6\times2+0.8\times11\\-0.8\times2+0.6\times11\end{bmatrix}=\begin{bmatrix}10\\5\end{bmatrix}$$

      4. **Check by multiplying by $Q$.** Putting $x$ back in should give $b$.
         $$Q\begin{bmatrix}10\\5\end{bmatrix}=\begin{bmatrix}6-4\\8+3\end{bmatrix}=\begin{bmatrix}2\\11\end{bmatrix}$$

      So $x=(10,5)$. Both $x$ and $b$ have length $\sqrt{125}$, since $10^2+5^2=125$ and $2^2+11^2=125$. That fits with $Q$ never changing lengths.
