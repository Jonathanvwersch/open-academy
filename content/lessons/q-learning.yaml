  - id: ql-full-run
    title: "Run Q-learning on the corridor"
    explain: |
      ### The whole algorithm

      We now have every piece, the table, the update and epsilon-greedy moves. Q-learning puts them together like this:

      1. Set every entry of the Q-table to $0$.
      2. Start an episode in cell 1.
      3. Choose a move with epsilon-greedy, make it, and see the reward $r$ and the new state $s'$.
      4. Update $Q(s,a)\leftarrow Q(s,a)+\eta\,\delta$, using the TD target from $r$ and $s'$.
      5. Make $s'$ the current state. If the episode has ended, go back to step 2, otherwise go back to step 3.

      After enough episodes, the robot picks the move with the biggest value in its cell.

      ### What the table ends up as

      On the corridor without the charger, with $\eta=0.5$, $\varepsilon=0.1$ and $\gamma=0.9$, the code below needs 500 episodes for the table to settle on the best values. Right is worth $6.2$, $8$ and $10$ in cells 1, 2 and 3, and left is worth $4.58$, $4.58$ and $6.2$. The left values are only learned from random moves, so they need the most episodes.

      Chris Watkins introduced Q-learning in his 1989 PhD thesis. In 1992, Watkins and Peter Dayan proved that it reaches the best values in any problem with a finite number of states and actions, as long as every action keeps being tried in every state and the learning rate shrinks toward $0$ at the right speed. On a small, predictable problem like the corridor, a fixed rate such as $0.5$ also works.

      ### Limitations: one entry per state

      A Q-table needs one entry for every state and action, and each entry only learns when that exact move is made. With 3 cells, that's only 6 entries. But a robot arm's state is its joint angles, which are real numbers, and a video game's state is the whole screen. There are far too many such states to store, and the robot would almost never see the same one twice, so nothing it learned would carry over.

      A later lesson on deep Q-learning replaces the table with a neural network, a model that predicts the values from the state. That is how DQN (deep Q-network) learned to play Atari video games from screen pixels (Mnih and colleagues, 2013).
    worked: |
      Let's follow one episode late in training, when the robot always moves right and its table holds $Q(1,\text{right})=4$, $Q(2,\text{right})=6$ and $Q(3,\text{right})=9$, with every left value below these. We use $\eta=0.5$ and $\gamma=0.9$.

      1. **Move from cell 1 to cell 2.** The target uses cell 2's current guess, $6$, so the TD error is $4.4-4=0.4$.
         $$Q(1,\text{right})\leftarrow4+0.5\times(-1+0.9\times6-4)=4.2.$$

      2. **Move from cell 2 to cell 3.** The target uses cell 3's current guess, $9$, so the TD error is $7.1-6=1.1$.
         $$Q(2,\text{right})\leftarrow6+0.5\times(-1+0.9\times9-6)=6.55.$$

      3. **Move from cell 3 to the goal.** The episode ends, so the target is just the reward, $10$.
         $$Q(3,\text{right})\leftarrow9+0.5\times(10-9)=9.5.$$

      Each value moved toward its best value, $6.2$, $8$ and $10$. Cell 1's target used cell 2's old guess of $6$, which is still too low, so cell 1 will keep improving as cell 2 does.

      Here is the whole algorithm in Python, running 500 episodes. `Q` is a dictionary that maps a (cell, action) pair to its value. `random.random()` gives a number between $0$ and $1$, so it is below `eps` with probability $\varepsilon$, and `random.choice` picks an action at random. `lambda b: Q[(s, b)]` is a small unnamed function that gives the value of action `b`. So `max(..., key=...)` picks the action whose value is biggest. `eta` is the learning rate. The `while` loop runs one episode, and `+=` adds to a value.

      ```python
      import random

      random.seed(0)
      gamma, eta, eps = 0.9, 0.5, 0.1
      Q = {(s, a): 0.0 for s in (1, 2, 3) for a in ("left", "right")}

      def step(s, a):
          s2 = max(s - 1, 1) if a == "left" else s + 1
          return s2, (10 if s2 == 4 else -1)

      for episode in range(500):
          s = 1
          while s != 4:
              if random.random() < eps:
                  a = random.choice(["left", "right"])
              else:
                  a = max(["left", "right"], key=lambda b: Q[(s, b)])
              s2, r = step(s, a)
              if s2 == 4:
                  best_next = 0
              else:
                  best_next = max(Q[(s2, "left")], Q[(s2, "right")])
              Q[(s, a)] += eta * (r + gamma * best_next - Q[(s, a)])
              s = s2

      for s in (1, 2, 3):
          print(s, round(Q[(s, "left")], 2), round(Q[(s, "right")], 2))
      # prints three lines: 1 4.58 6.2, then 2 4.58 8.0, then 3 6.2 10.0
      ```
