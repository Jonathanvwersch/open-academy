concept: q-learning
version: 1
objective: |
  **Goal:** perform a Q-learning update, by building the TD target from one move's reward and the next state's best value and moving the stored value part of the way toward it, and run the update with epsilon-greedy exploration until the table holds the best action values.
where_this_fits: |
  ### What is Q-learning?

  Q-learning is a way for a robot or a program to learn, by trial and error, how good each move is in each situation. It keeps a table of these numbers and corrects one after every move.

  Each number is the total reward the robot expects to collect, on average, from that move onward, with rewards further in the future counting a little less.

  Why is that useful? We can only work these values out by hand if we know where each action leads, and a robot in a new place doesn't. Q-learning learns them from experience, and then the biggest value marks the best action.
knowledge_points:
  - id: ql-q-table
    title: "Score every move in every cell"
    explain: |
      ### A robot in a corridor

      Our robot lives in a corridor of 4 cells, numbered 1 to 4 from the left. It starts in cell 1 and can move left or right, and moving into the wall at the left end leaves it where it is. The move into cell 4 gives a reward of $+10$ and ends the **episode**, one run from start to finish. Every other move gives a reward of $-1$.

      In reinforcement learning, learning by trial and reward, the robot is the **agent**, each cell is a **state** $s$, and each move is an **action** $a$. The **return** adds up the rewards from now on, with a reward $k$ steps ahead multiplied by $\gamma^k$. The **discount factor** $\gamma=0.9$ makes later rewards count less.

      ### One number for each state and action

      Q-learning stores a **Q-table**, one number $Q(s,a)$ for every state $s$ and action $a$, its current guess of that value. The corridor has 3 cells where the robot can act, and 2 actions, so the table has 6 entries. Cell 4 ends the episode, so it needs none.

      The picture shows the values the robot is aiming for. These are the **best values** $Q^*(s,a)$, the returns we get by taking action $a$ in state $s$ and then always choosing the moves that collect the most reward.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" aria-label="A corridor of four cells in a row. Cells 1, 2 and 3 each show two best values, moving left and moving right. Cell 1: left 4.58, right 6.2. Cell 2: left 4.58, right 8. Cell 3: left 6.2, right 10. The right value is bigger in every cell and is shown in orange. Cell 4 is the goal, worth plus 10, and the robot starts in cell 1">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="320" y="40" text-anchor="middle">Best values Q*(s, a): moving left (←) and moving right (→)</text>
      <rect x="40" y="70" width="140" height="100" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="180" y="70" width="140" height="100" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="320" y="70" width="140" height="100" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="460" y="70" width="140" height="100" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <text x="110" y="98" text-anchor="middle">cell 1</text>
      <text x="250" y="98" text-anchor="middle">cell 2</text>
      <text x="390" y="98" text-anchor="middle">cell 3</text>
      <text x="530" y="98" text-anchor="middle">cell 4: goal</text>
      <text x="52" y="140" fill="#737373">← 4.58</text>
      <text x="168" y="140" text-anchor="end" fill="#f59e0b">6.2 →</text>
      <text x="192" y="140" fill="#737373">← 4.58</text>
      <text x="308" y="140" text-anchor="end" fill="#f59e0b">8 →</text>
      <text x="332" y="140" fill="#737373">← 6.2</text>
      <text x="448" y="140" text-anchor="end" fill="#f59e0b">10 →</text>
      <text x="530" y="140" text-anchor="middle" fill="#10b981">+10, episode ends</text>
      <text x="110" y="195" text-anchor="middle">start</text>
      <text x="320" y="235" text-anchor="middle" fill="#f59e0b">orange: the bigger value in each cell</text>
      </g>
      </svg>
      ```

      ### Choosing from the table

      In each state the robot takes the action with the biggest value, which is called acting **greedily**. Here right, in orange, wins in every cell.

      ### Where the values come from

      Each value is the move's reward plus the discounted best value of the cell it lands in. Let $r$ be the move's reward, $s'$ the state it lands in, and $a'$ a fresh name for an action taken there. Then

      $$Q^*(s,a)=r+\gamma\max_{a'}Q^*(s',a').$$

      Here $\max_{a'}$ means the largest value over the actions we could take in $s'$. After the move into cell 4 the episode is over, so nothing follows and that max counts as $0$.

      Be careful not to read $Q$ as the reward of one move. Moving right from cell 2 earns only $-1$, but it is worth $8$, because $Q$ counts what comes after.
    worked: |
      Let's work out the best values of the corridor, with $\gamma=0.9$. We start next to the goal, because nothing comes after the goal, and then move left one cell at a time.

      1. **Start next to the goal.** Moving right from cell 3 reaches the goal for $+10$, and nothing comes after it.
         $$Q^*(3,\text{right})=10+0.9\times0=10.$$

      2. **Step back to cell 2.** Moving right gives $-1$ and lands in cell 3, where the best value is $10$.
         $$Q^*(2,\text{right})=-1+0.9\times10=8.$$

      3. **Step back to cell 1.** Moving right gives $-1$ and lands in cell 2, where the best value is $8$.
         $$Q^*(1,\text{right})=-1+0.9\times8=6.2.$$

      4. **Try left in cell 1.** Moving left bumps into the wall, gives $-1$ and leaves the robot in cell 1. Its best move there is right, worth $6.2$ from step 3, because bumping the wall again only wastes a step.
         $$Q^*(1,\text{left})=-1+0.9\times6.2=4.58.$$

      In cell 1, right is worth $6.2$ and left only $4.58$, so the greedy choice there is right, as the picture shows. The left values in cells 2 and 3 come the same way, $Q^*(2,\text{left})=-1+0.9\times6.2=4.58$ and $Q^*(3,\text{left})=-1+0.9\times8=6.2$.
