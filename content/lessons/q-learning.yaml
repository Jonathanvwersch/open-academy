concept: q-learning
version: 1
objective: |
  **Goal:** perform a Q-learning update, by building the TD target from one move's reward and the next state's best value and moving the stored value part of the way toward it, and run the update with epsilon-greedy exploration until the table holds the best action values.
recap:
  - concept: value-functions
    text: "The best action value $Q^*(s,a)$ is the return from taking $a$ in $s$ and then acting as well as possible: reward $r_{t+1}$ plus $\\gamma$ times the best next action value, or zero once the episode ends."
where_this_fits: |
  ### What is Q-learning?

  Q-learning is a way for a robot or a program to learn, by trial and error, how good each move is in each situation. It keeps a table of these numbers and corrects one after every move.

  Why is that useful? We can only work these values out by hand if we know where each action leads, and a robot in a new place doesn't. Q-learning learns them from experience, and then the biggest value marks the best action.
knowledge_points:
  - id: ql-q-table
    key_prereqs: [value-functions, mdp]
    title: "Score every move in every cell"
    tldr: |
      - Q-learning keeps a table with one number for each move in each state.
      - Each number is the move's reward plus the most return the robot can collect after it.
      - In each state, the robot picks the move with the biggest number.
    explain: |
      ### A robot in a corridor

      Our robot lives in a corridor of 4 cells, numbered 1 to 4 from the left. It starts in cell 1 and can move left or right, and moving into the wall at the left end leaves it where it is. The move into cell 4 gives a reward of $+10$ and ends the **episode**, one run from start to finish. Every other move gives a reward of $-1$.

      In reinforcement learning, the robot is the **agent**, each cell is a **state** $s$, and each move is an **action** $a$.

      ### One number for each state and action

      Q-learning, a way for the robot to learn these values by trial and error, stores a **Q-table**, one number $Q(s,a)$ for every state $s$ and action $a$, its current guess of that value. The corridor has 3 cells where the robot can act, and 2 actions, so the table has 6 entries. Cell 4 ends the episode, so it needs none.

      The picture shows the best action values $Q^*(s,a)$ the robot is aiming to learn.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" aria-label="A corridor of four cells in a row. Cells 1, 2 and 3 each show two best values, moving left and moving right. Cell 1: left 4.58, right 6.2. Cell 2: left 4.58, right 8. Cell 3: left 6.2, right 10. The right value is bigger in every cell and is shown in orange. Cell 4 is the goal, worth plus 10, and the robot starts in cell 1">
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <text x="320" y="40" text-anchor="middle">Best values Q*(s, a): moving left (←) and moving right (→)</text>
      <rect x="40" y="70" width="140" height="100" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="180" y="70" width="140" height="100" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="320" y="70" width="140" height="100" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="460" y="70" width="140" height="100" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <text x="110" y="98" text-anchor="middle">cell 1</text>
      <text x="250" y="98" text-anchor="middle">cell 2</text>
      <text x="390" y="98" text-anchor="middle">cell 3</text>
      <text x="530" y="98" text-anchor="middle">cell 4: goal</text>
      <text x="52" y="140" fill="#737373">← 4.58</text>
      <text x="168" y="140" text-anchor="end" fill="#f59e0b">6.2 →</text>
      <text x="192" y="140" fill="#737373">← 4.58</text>
      <text x="308" y="140" text-anchor="end" fill="#f59e0b">8 →</text>
      <text x="332" y="140" fill="#737373">← 6.2</text>
      <text x="448" y="140" text-anchor="end" fill="#f59e0b">10 →</text>
      <text x="530" y="140" text-anchor="middle" fill="#10b981">+10, episode ends</text>
      <text x="110" y="195" text-anchor="middle">start</text>
      <text x="320" y="235" text-anchor="middle" fill="#f59e0b">orange: the bigger value in each cell</text>
      </g>
      </svg>
      ```

      ### Choosing from the table

      In each state the robot takes the action with the biggest value, which is called acting **greedily**. Here right, in orange, wins in every cell.

      ### Where the values come from

      Each value is the move's reward plus the discounted best value of the cell it lands in. Let $r$ be the move's reward, $s'$ the state it lands in, and $a'$ a fresh name for an action taken there. Then

      $$Q^*(s,a)=r+\gamma\max_{a'}Q^*(s',a').$$

      Here $\max_{a'}$ means the largest value over the actions we could take in $s'$. After the move into cell 4 the episode is over, so nothing follows and that max counts as $0$.

      Be careful not to read $Q$ as the reward of one move. Moving right from cell 2 earns only $-1$, but it is worth $8$, because $Q$ counts what comes after.
    worked: |
      Let's work out the best values of the corridor, with $\gamma=0.9$. We start next to the goal, because nothing comes after the goal, and then move left one cell at a time.

      1. **Start next to the goal.** Moving right from cell 3 reaches the goal for $+10$, and nothing comes after it.
         $$Q^*(3,\text{right})=10+0.9\times0=10.$$

      2. **Step back to cell 2.** Moving right gives $-1$ and lands in cell 3, where the best value is $10$.
         $$Q^*(2,\text{right})=-1+0.9\times10=8.$$

      3. **Step back to cell 1.** Moving right gives $-1$ and lands in cell 2, where the best value is $8$.
         $$Q^*(1,\text{right})=-1+0.9\times8=6.2.$$

      4. **Try left in cell 1.** Moving left bumps into the wall, gives $-1$ and leaves the robot in cell 1. Its best move there is right, worth $6.2$ from step 3, because bumping the wall again only wastes a step.
         $$Q^*(1,\text{left})=-1+0.9\times6.2=4.58.$$

      In cell 1, right is worth $6.2$ and left only $4.58$, so the greedy choice there is right, as the picture shows. Apply the same rule to the remaining left moves:
      $$
      \begin{aligned}
      Q^*(2,\text{left})&=-1+0.9\times6.2=4.58 &&\text{land in cell one}\\
      Q^*(3,\text{left})&=-1+0.9\times8=6.2 &&\text{land in cell two}
      \end{aligned}
      $$
    problems:
      - ql-q-table-basics
      - qlp-wall-self-explain
      - qlp-greedy-pick
      - qlp-bellman-template
      - qlp-two-moves
      - qlp-reward-vs-value
      - qlp-aisle-choice
  - id: ql-update-rule
    key_prereqs: [value-functions, mdp]
    title: "Update one value after each move"
    tldr: |
      - After each move, the robot sees the reward and the state it lands in.
      - The reward plus the discounted best table value in the new state gives a target.
      - The robot moves that move's value part of the way toward the target, because one move can mislead.
      - Over many moves, the goal's reward spreads back along the corridor.
    explain: |
      ### Learning from one move

      The robot doesn't know the best values when it starts, so its table begins at $0$ everywhere. Each time it moves, it sees its reward $r$ and the state $s'$ it lands in, and it can read its own current guesses for $s'$ from the table. That's enough to improve the one entry $Q(s,a)$ for the move it just made.

      ### The target: a better guess

      The best values satisfy $Q^*(s,a)=r+\gamma\max_{a'}Q^*(s',a')$. We don't know $Q^*$ yet, so we put in the table's current guesses instead. That gives the **TD target**

      $$r+\gamma\max_{a'}Q(s',a').$$

      TD stands for temporal difference, because the target mixes a real reward with the table's guess for one step later in time. If the move ends the episode, the target is just $r$.

      ### Moving part of the way

      The target comes from a single move and from guesses that may still be wrong, so we don't jump all the way to it. We call the gap the **TD error**,

      $$\delta=r+\gamma\max_{a'}Q(s',a')-Q(s,a),$$

      and we move the entry a fraction of that gap:

      $$Q(s,a)\leftarrow Q(s,a)+\eta\,\delta.$$

      The symbol $\leftarrow$ means "replace with". The Greek letter $\eta$ (eta) is the **learning rate**, a number between $0$ and $1$ that sets how far each update goes. Reinforcement learning books often write it $\alpha$. With $\eta=0.5$, each update closes half the gap.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" aria-label="A number line from 0 to 10. The old value Q(3, right) is 0, shown as a grey dot at 0. The TD target is 10, a green dot at 10. With learning rate 0.5, an orange arrow moves the value halfway, to an orange dot at 5, the new value">
      <defs><marker id="ql2-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <path d="M60 120 H560" stroke="#d4d4d4" stroke-width="2"/>
      <path d="M60 120 v6 M110 120 v6 M160 120 v6 M210 120 v6 M260 120 v6 M310 120 v6 M360 120 v6 M410 120 v6 M460 120 v6 M510 120 v6 M560 120 v6" stroke="#737373"/>
      <text x="60" y="145" text-anchor="middle" fill="#737373">0</text>
      <text x="160" y="145" text-anchor="middle" fill="#737373">2</text>
      <text x="260" y="145" text-anchor="middle" fill="#737373">4</text>
      <text x="360" y="145" text-anchor="middle" fill="#737373">6</text>
      <text x="460" y="145" text-anchor="middle" fill="#737373">8</text>
      <text x="560" y="145" text-anchor="middle" fill="#737373">10</text>
      <path d="M66 90 L300 90" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ql2-amber)"/>
      <circle cx="60" cy="120" r="6" fill="#737373"/>
      <circle cx="310" cy="120" r="6" fill="#f59e0b"/>
      <circle cx="560" cy="120" r="6" fill="#10b981"/>
      <text x="50" y="60" fill="#737373">old value 0</text>
      <text x="310" y="60" text-anchor="middle" fill="#f59e0b">new value 5</text>
      <text x="575" y="60" text-anchor="end" fill="#10b981">TD target 10</text>
      <text x="310" y="180" text-anchor="middle">the update closes half the gap of 10</text>
      </g>
      </svg>
      ```

      The picture shows the update when the robot first reaches the goal. From cell 3 it moves right, earns $+10$ and the episode ends, so the target is $10$, and $Q(3,\text{right})$ moves halfway from $0$ to $5$.

      ### The reward spreads back along the corridor

      Only the entry for the move just made changes. The next time the robot moves right from cell 2, it lands in cell 3, where $Q(3,\text{right})$ is now $5$, so part of the goal's reward reaches cell 2. Over many episodes the reward spreads back along the corridor.

      Be careful to take the max over the actions of $s'$, the state the robot landed in, and not of $s$, the state it just left.
    worked: |
      Let's follow the robot through its first two episodes in the corridor. The table starts at $0$ everywhere, with $\eta=0.5$ and $\gamma=0.9$, and to keep the example short, the robot happens to move right every time.

      1. **Update the first two moves.** From cells 1 and 2 the robot earns $-1$ and lands in a cell whose values are all $0$, so each target is $-1$. Cell 3's values are still $0$ then, because its move comes later.
         $$Q(1,\text{right})=Q(2,\text{right})=0+0.5\times(-1-0)=-0.5.$$

      2. **Update the move into the goal.** From cell 3 it earns $+10$ and the episode ends, so the target is just $10$.
         $$Q(3,\text{right})\leftarrow0+0.5\times(10-0)=5.$$

      3. **Build cell 2's target in episode 2.** The robot moves right from cell 2 again and lands in cell 3, where the larger of $Q(3,\text{left})=0$ and $Q(3,\text{right})=5$ is $5$.
         $$\text{target}=-1+0.9\times5=3.5.$$

      4. **Update $Q(2,\text{right})$.** Find the TD error and move half of it.
         $$
         \begin{aligned}
         \delta&=3.5-(-0.5)=4 &&\text{target minus old value}\\
         Q(2,\text{right})&\leftarrow-0.5+0.5\times4=1.5 &&\text{move half the gap}
         \end{aligned}
         $$

      Cell 3's value is still below its best value of $10$, and cell 2's is below $8$, but the goal's reward has already started to reach cell 2.
    problems:
      - ql-update-rule-basics
      - qlp-second-target-self-explain
      - qlp-update-template
      - qlp-final-move-update
      - qlp-wrong-state
      - qlp-rate-one
      - qlp-delivery-path
  - id: ql-explore
    key_prereqs: [probability-basics, value-functions, policies-returns]
    title: "Try other moves now and then"
    tldr: |
      - Always picking the move that looks best can get stuck on a bad early guess.
      - So now and then the robot picks a move at random, which lets it find better ones.
      - The target still uses the best value in the next state, so the table learns the best values while the robot explores.
    explain: |
      ### Always picking the best can get stuck

      While the robot learns, it has to choose its moves somehow. The obvious choice is greedy, the move with the biggest value so far. But early on, that value can be wrong.

      To see this, let's add a charger to the corridor, just left of cell 1, in place of the left wall. Everything to the right of cell 1 stays the same. Moving left from cell 1 now docks the robot, gives $+1$ and ends the episode. Say the table is all $0$, and its first move is left. With $\eta=0.5$, update its value:
      $$Q(1,\text{left})\leftarrow0+0.5\times(1-0)=0.5.$$

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" aria-label="The corridor with a charger to the left of cell 1. From cell 1, an orange arrow points left to the charger, labelled Q(1, left) = 0.5 after one try. A grey arrow points right to cell 2, labelled Q(1, right) = 0, never tried. Cell 4 is the goal, worth plus 10, never found by a greedy robot">
      <defs><marker id="ql3-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f59e0b"/></marker><marker id="ql3-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#737373"/></marker></defs>
      <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#171717">
      <rect x="20" y="60" width="80" height="80" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <rect x="100" y="60" width="130" height="80" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="230" y="60" width="130" height="80" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="360" y="60" width="130" height="80" fill="#ffffff" stroke="#737373" stroke-width="1.5"/>
      <rect x="490" y="60" width="130" height="80" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <text x="60" y="95" text-anchor="middle">charger</text>
      <text x="60" y="115" text-anchor="middle" fill="#10b981">+1</text>
      <text x="165" y="105" text-anchor="middle">cell 1</text>
      <text x="295" y="105" text-anchor="middle">cell 2</text>
      <text x="425" y="105" text-anchor="middle">cell 3</text>
      <text x="555" y="95" text-anchor="middle">cell 4: goal</text>
      <text x="555" y="115" text-anchor="middle" fill="#10b981">+10</text>
      <path d="M150 170 L70 170" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ql3-amber)"/>
      <path d="M180 170 L280 170" stroke="#737373" stroke-width="2" marker-end="url(#ql3-muted)"/>
      <text x="20" y="200" fill="#f59e0b">Q(1, left) = 0.5</text>
      <text x="20" y="220" fill="#f59e0b">after one try</text>
      <text x="200" y="200">Q(1, right) = 0</text>
      <text x="200" y="220" fill="#737373">never tried</text>
      <text x="620" y="170" text-anchor="end" fill="#737373">never found</text>
      </g>
      </svg>
      ```

      Now left looks better than right, so a greedy robot goes left every time. $Q(1,\text{left})$ climbs toward $1$, and the robot never learns that right is really worth $6.2$, the same as without the charger, because it never tries it.

      ### Epsilon-greedy

      The usual fix is **epsilon-greedy**. On each move, with a small probability $\varepsilon$ (epsilon), such as $0.1$, the robot picks an action at random from all of them. Otherwise it moves greedily. The random pick can land on the greedy action too, so with $k$ actions,

      $$P(\text{greedy action})=1-\varepsilon+\frac{\varepsilon}{k}.$$

      Because every action keeps being tried now and then, the robot can eventually find cell 4, and the $+10$ starts to spread back.

      ### Learning the best values while exploring

      Q-learning's target always uses $\max_{a'}Q(s',a')$, the greedy choice in $s'$, even when the robot's next move will be a random one. So the table learns the values of acting greedily, the best values, while the robot behaves with some randomness. The rule a robot uses to choose its moves is called its **policy**. Q-learning learns the values of acting greedily. Meanwhile it follows a different policy, epsilon-greedy. So it is called **off-policy**.

      Be careful not to put the value of the next move the robot actually makes into the target. A related method called SARSA does that. It learns the values of the epsilon-greedy policy it follows, which can be lower than the best values when future random moves cost reward.
    worked: |
      Let's return to the corridor without the charger and continue the example from Step 2. Episode 2 also updated two other entries. Each closes half the gap to its target:
      $$
      \begin{aligned}
      Q(1,\text{right})&\leftarrow-0.5+0.5(-1-(-0.5))=-0.75 &&\text{the target is }-1\\
      Q(3,\text{right})&\leftarrow5+0.5(10-5)=7.5 &&\text{the target is }10
      \end{aligned}
      $$
      So the table holds $Q(1,\text{right})=-0.75$, $Q(2,\text{right})=1.5$ and $Q(3,\text{right})=7.5$, and every left value is still $0$. From episode 3 on, the robot moves epsilon-greedily with $\varepsilon=0.1$, and still $\eta=0.5$ and $\gamma=0.9$.

      1. **Find the chance of the greedy move.** In cell 1, left has the bigger value, $0$ against $-0.75$, because so far right has only cost rewards of $-1$. The robot picks left greedily with probability $0.9$, and its random pick, made with probability $0.1$, lands on left half the time.
         $$P(\text{left})=0.9+0.1\times\tfrac12=0.95.$$

      2. **Find the chance of exploring right.** Right only happens through the random pick.
         $$P(\text{right})=0.1\times\tfrac12=0.05.$$

      3. **Build a target while exploring.** Say the random pick sends the robot right. It earns $-1$ and lands in cell 2, where $Q(2,\text{left})=0$ and $Q(2,\text{right})=1.5$. The target uses the larger value, $1.5$, even though the move just made was random.
         $$\text{target}=-1+0.9\times1.5=0.35.$$

      4. **Update $Q(1,\text{right})$.** It was $-0.75$. Find the error, then move half of it.
         $$
         \begin{aligned}
         \delta&=0.35-(-0.75)=1.1 &&\text{target minus old value}\\
         Q(1,\text{right})&\leftarrow-0.75+0.5\times1.1=-0.2 &&\text{move half the gap}
         \end{aligned}
         $$

      The random move let the robot try right in cell 1. The target uses the best value in cell 2, whichever move the robot makes there next.
    problems:
      - ql-explore-basics
      - qlp-greedy-chance-self-explain
      - qlp-greedy-stuck
      - qlp-greedy-chance-template
      - qlp-explore-target
      - qlp-off-policy-meaning
      - qlp-vacuum-deploy
  - id: ql-full-run
    key_prereqs: [value-functions, mdp]
    title: "Run Q-learning on the corridor"
    tldr: |
      - Q-learning repeats three things: pick a move, see what happens, and update that move's value.
      - Over many episodes, the goal's reward spreads back until the table holds the best values.
      - A table only works when there are few enough states for every move to be tried many times.
    explain: |
      ### The whole algorithm

      Q-learning puts the table, the update and epsilon-greedy moves together:

      1. Set every entry of the Q-table to $0$.
      2. Start an episode in cell 1.
      3. Choose a move with epsilon-greedy, make it, and see the reward $r$ and the new state $s'$.
      4. Update $Q(s,a)\leftarrow Q(s,a)+\eta\,\delta$, using the TD target from $r$ and $s'$.
      5. Make $s'$ the current state. If the episode has ended, go back to step 2, otherwise go back to step 3.

      After learning, the robot picks the move with the biggest value in its cell.

      ### What the table ends up as

      The 500-episode worked example uses the corridor without the charger, with $\eta=0.5$, $\varepsilon=0.1$, $\gamma=0.9$ and a fixed sequence of random draws. In that run, right ends up worth $6.2$, $8$ and $10$ in cells 1, 2 and 3, and left ends up worth $4.58$, $4.58$ and $6.2$, rounded to 2 decimals. Once right is greedy, left values change only through exploration, so they settle last.

      Chris Watkins introduced Q-learning in his 1989 PhD thesis. In 1992, Watkins and Peter Dayan proved that it reaches the best values under certain conditions: there are finitely many states and actions, rewards stay between fixed lower and upper limits, and the discount factor $\gamma$ is below $1$. Every action must keep being tried in every state, and the learning rate must shrink toward $0$ at the right speed. On the corridor, a fixed rate such as $0.5$ also works.

      ### Limitations: one entry per state

      A Q-table needs one entry for every state and action, and each entry only learns when that exact move is made. With 3 cells, that's only 6 entries. But a robot arm's state is its joint angles, which are real numbers, and a video game's state is the whole screen. There are far too many such states to store, and the robot would almost never see the same one twice, so nothing it learned would carry over.

      Deep Q-learning replaces the table with a model that predicts action values, even in new states. It learned Atari games from screen pixels (Mnih and colleagues, 2013).
    worked: |
      Let's finish episode 3 from Step 3's example. The robot is in cell 2, where $Q(2,\text{left})=0$ and $Q(2,\text{right})=1.5$, and cell 3 holds $Q(3,\text{left})=0$ and $Q(3,\text{right})=7.5$. We use $\eta=0.5$ and $\gamma=0.9$.

      1. **Choose in cell 2.** Right, $1.5$, beats left, $0$, so the greedy move is right. Say the robot makes it.

      2. **Move from cell 2 to cell 3.** Use cell 3's current guess, $7.5$, to build the target, then move halfway toward it.
         $$
         \begin{aligned}
         \text{target}&=-1+0.9\times7.5=5.75 &&\text{reward plus discounted next value}\\
         \delta&=5.75-1.5=4.25 &&\text{subtract the old value}\\
         Q(2,\text{right})&\leftarrow1.5+0.5\times4.25=3.625 &&\text{move half the gap}
         \end{aligned}
         $$

      3. **Move from cell 3 to the goal.** Right is greedy again. The episode ends, so the target is just the reward, $10$.
         $$Q(3,\text{right})\leftarrow7.5+0.5\times(10-7.5)=8.75.$$

      After three episodes, right is worth $-0.2$, $3.625$ and $8.75$ in cells 1, 2 and 3, still short of the best values $6.2$, $8$ and $10$. Cell 2's target used cell 3's guess of $7.5$, which is still too low, so cell 2 keeps improving as cell 3 does.

      Here is the whole algorithm in Python, running 500 episodes. `Q` is a dictionary that maps a (cell, action) pair to its value, and the line that builds it makes one entry, set to $0$, for each pair. `def step(s, a)` defines a function that returns the next cell and the reward for a move. `random.random()` gives a number between $0$ and $1$, so it is below `eps` with probability $\varepsilon$, and `random.choice` picks an action at random. `lambda b: Q[(s, b)]` is a small unnamed function that gives the value of action `b`. So `max(..., key=...)` picks the action whose value is biggest. `eta` is the learning rate. The `while` loop runs one episode, and `+=` adds to a value.

      The code calls the next state $s'$ by the name `s2`. `random.seed(0)` starts Python's sequence of random numbers from a fixed point, so the same code draws the same numbers on each run.

      ```python
      import random

      random.seed(0)
      gamma, eta, eps = 0.9, 0.5, 0.1
      Q = {(s, a): 0.0 for s in (1, 2, 3) for a in ("left", "right")}

      def step(s, a):
          s2 = max(s - 1, 1) if a == "left" else s + 1
          return s2, (10 if s2 == 4 else -1)

      for episode in range(500):
          s = 1
          while s != 4:
              if random.random() < eps:
                  a = random.choice(["left", "right"])
              else:
                  a = max(["left", "right"], key=lambda b: Q[(s, b)])
              s2, r = step(s, a)
              if s2 == 4:
                  best_next = 0
              else:
                  best_next = max(Q[(s2, "left")], Q[(s2, "right")])
              Q[(s, a)] += eta * (r + gamma * best_next - Q[(s, a)])
              s = s2

      for s in (1, 2, 3):
          print(s, round(Q[(s, "left")], 2), round(Q[(s, "right")], 2))
      # prints three lines: 1 4.58 6.2, then 2 4.58 8.0, then 3 6.2 10.0
      ```
