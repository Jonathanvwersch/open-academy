final: ql-explain-learning
summary: |
  - A Q-table stores one value $Q(s,a)$ for every state and action. The best values satisfy $Q^*(s,a)=r+\gamma\max_{a'}Q^*(s',a')$, and acting greedily means taking the action with the biggest value.
  - After each move, Q-learning builds the TD target $r+\gamma\max_{a'}Q(s',a')$, or just $r$ if the episode ended, and updates $Q(s,a)\leftarrow Q(s,a)+\eta\,\delta$, where $\delta$ is the target minus the old value.
  - Epsilon-greedy picks a random action with probability $\varepsilon$, so every action keeps being tried. Because the target uses the max, Q-learning still learns the best values while it explores, which makes it off-policy.
  - Repeating this over many episodes fills the table with the best values, but a table only works when there are few enough states to visit each one many times.

  **Next:** The exploration lesson looks at how much an agent should explore, and deep Q-learning replaces the table with a neural network so the same update works on huge numbers of states.
