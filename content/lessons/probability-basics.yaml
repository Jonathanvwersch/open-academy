concept: probability-basics
version: 3
objective: |
  **Goal:** find the probability of an event and of its complement, describe a random variable by its distribution, work out its expected value, and update a probability once something extra is known, using a conditional probability.
where_this_fits: |
  ### What is probability?

  Probability is a number between 0 and 1 that says how likely something is to happen. A probability of 0 means it can't happen, 1 means it's certain, and $0.5$ means it's as likely to happen as not.

  We need it because so much of what we'd like to predict can't be known in advance. Before a house is sold, nobody knows for sure whether it will go for more than its asking price, or how many buyers will make an offer. Probability lets us say how likely each possibility is, sum up a whole range of possible numbers with one average, and change our answer when we learn something new. Machine learning models use this language whenever they're unsure, which is most of the time.
knowledge_points:
  - id: pb-events
    key_prereqs: []
    title: Measure how likely something is
    tldr: |
      - An event is a set of possible outcomes, such as rolling at least five.
      - Its probability measures how likely it is, from impossible to certain.
      - Subtracting that probability from one gives the chance that it will not happen.
    explain: |
      ### Six faces of a die

      Let's start with something simpler than a house sale. Picture one roll of a fair six-sided die, one of a pair of dice. There are six possible results, which we call **outcomes**, and because the die is fair, each one is equally likely.

      Suppose we care about rolling at least 5. In the picture, two of the six faces, 5 and 6, count, and the other four don't. So we'd expect to roll at least 5 on about two out of every six rolls.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" aria-label="A row of six die faces numbered 1 to 6. Faces 5 and 6 are highlighted because they count as at least 5, 2 of 6 faces, which is 1/3. Faces 1 to 4 do not count, 4 of 6 faces, which is 2/3">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
          <text x="40" y="36">One roll of a fair die: six equally likely outcomes</text>
          <rect x="40" y="60" width="70" height="70" rx="10" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <text x="75" y="104" text-anchor="middle" font-size="26" fill="#171717">1</text>
          <rect x="126" y="60" width="70" height="70" rx="10" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <text x="161" y="104" text-anchor="middle" font-size="26" fill="#171717">2</text>
          <rect x="212" y="60" width="70" height="70" rx="10" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <text x="247" y="104" text-anchor="middle" font-size="26" fill="#171717">3</text>
          <rect x="298" y="60" width="70" height="70" rx="10" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <text x="333" y="104" text-anchor="middle" font-size="26" fill="#171717">4</text>
          <rect x="384" y="60" width="70" height="70" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5"/>
          <text x="419" y="104" text-anchor="middle" font-size="26" fill="#3b82f6">5</text>
          <rect x="470" y="60" width="70" height="70" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5"/>
          <text x="505" y="104" text-anchor="middle" font-size="26" fill="#3b82f6">6</text>
          <path d="M40 150 V160 H368 V150" stroke="#737373" stroke-width="2" fill="#ffffff" fill-opacity="0"/>
          <text x="204.0" y="184" text-anchor="middle" fill="#737373">the other faces: 4/6 = 2/3</text>
          <path d="M384 150 V160 H540 V150" stroke="#3b82f6" stroke-width="2" fill="#ffffff" fill-opacity="0"/>
          <text x="462.0" y="184" text-anchor="middle" fill="#3b82f6">at least 5: 2/6 = 1/3</text>
        </g>
      </svg>
      ```

      ### Events and their probability

      A condition like "at least 5" picks out a set of outcomes, and that set is called an **event**. We often name an event with a letter, such as $A$. Its **probability**, written $P(A)$ and read "the probability of $A$", is a number from 0 to 1 that says how likely the event is. When every outcome is equally likely, it's the fraction of the outcomes that are in the event:

      $$P(A)=\frac{\text{number of outcomes in }A}{\text{number of all outcomes}}$$

      For the die, count the two faces and simplify:
      $$\begin{aligned}P(\text{at least 5})&=\frac26 &&\text{count faces that qualify}\\&=\frac13 &&\text{simplify the fraction}\end{aligned}$$

      The other four faces make up the **complement** of $A$, written "not $A$". Every roll lands in exactly one of the two, so their probabilities add up to 1, and we can always get one from the other:

      $$P(\text{not }A)=1-P(A)$$

      Here that's
      $$P(\text{not }A)=1-\frac13=\frac23.$$

      ### Counting past cases

      A house sale isn't like a die, because nobody can list its equally likely outcomes. So instead of counting possible outcomes, we count what happened in past cases. The fraction of past cases that were in the event is called its **frequency**, and it's our estimate of the probability. It's only an estimate, but it gets closer to the true chance as we count more cases.

      Be careful not to read a probability as a promise about a few tries. A chance of $\frac13$ doesn't mean that exactly two of every six rolls will be at least 5. Six rolls might give none, or four. Only over many rolls does the fraction settle near $\frac13$.
    worked: |
      Let's estimate how likely a house sale is to go above its asking price, using the records of 20 past sales. Of those 20 sales, 9 sold above asking.

      1. **Name the event.** Giving the event a letter keeps the working short.
         $$A=\text{the sale is above asking}$$

      2. **Divide the sales in the event by all the sales.** The frequency of $A$ is our estimate of its probability, so we write $\approx$, which means "about".
         $$P(A)\approx\frac{9}{20}=0.45$$

      3. **Subtract from 1 for the complement.** Every sale was either above asking or not, so the two probabilities add up to 1.
         $$P(\text{not }A)\approx1-0.45=0.55$$

      4. **Check by counting.** Count the remaining sales, then find their fraction.
         $$\begin{aligned}20-9&=11 &&\text{sales that were not above asking}\\\frac{11}{20}&=0.55 &&\text{their share of all sales}\end{aligned}$$

      So from these records, a sale is a little less likely than not to go above asking.
    problems:
      - pb-events-basics
      - pb-complement-why
      - pb-frequency-fixed
      - pb-complement-counts
      - pb-complement-template
      - pb-robot-grasp-failures
  - id: pb-distributions
    key_prereqs: []
    title: List the chance of each possible number
    tldr: |
      - A random variable is a number decided by chance.
      - Its distribution lists each possible value and its probability.
      - Adding the probabilities of the values we want gives their combined chance.
    explain: |
      ### A number decided by chance

      An event either happens or it doesn't. But often the uncertain thing is a number, such as how many offers a house gets, which might be 0, 1, 2 or 3. We'd like the chance of every one of those numbers at once.

      Let's picture it with a game spinner. It has four equal sectors but only three labels, because 0 points is printed on two sectors, and 1 point and 2 points on one each. Each spin is equally likely to stop in any sector. On the left of the picture is the spinner, and on the right is a bar for each number of points, as tall as its chance.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" aria-label="A spinner with four equal sectors labelled 0, 0, 1 and 2, beside a bar chart of its distribution: value 0 has probability 1/2, value 1 has probability 1/4 and value 2 has probability 1/4">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
          <text x="20" y="36">The spinner: four equal sectors</text>
          <circle cx="140" cy="170" r="100" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <path d="M40 170 H240 M140 70 V270" stroke="#737373" stroke-width="2"/>
          <text x="178.9" y="140.1" text-anchor="middle" font-size="26">0</text>
          <text x="178.9" y="217.9" text-anchor="middle" font-size="26">0</text>
          <text x="101.1" y="217.9" text-anchor="middle" font-size="26">1</text>
          <text x="101.1" y="140.1" text-anchor="middle" font-size="26">2</text>
          <text x="330" y="36">Its distribution</text>
          <path d="M330 270 H610" stroke="#737373" stroke-width="1.5"/>
          <rect x="355" y="110" width="50" height="160" fill="#3b82f6" fill-opacity="0.8"/>
          <text x="380" y="100" text-anchor="middle" fill="#3b82f6">1/2</text>
          <text x="380" y="294" text-anchor="middle">0</text>
          <rect x="445" y="190" width="50" height="80" fill="#3b82f6" fill-opacity="0.8"/>
          <text x="470" y="180" text-anchor="middle" fill="#3b82f6">1/4</text>
          <text x="470" y="294" text-anchor="middle">1</text>
          <rect x="535" y="190" width="50" height="80" fill="#3b82f6" fill-opacity="0.8"/>
          <text x="560" y="180" text-anchor="middle" fill="#3b82f6">1/4</text>
          <text x="560" y="294" text-anchor="middle">2</text>
          <text x="470" y="320" text-anchor="middle" fill="#737373">value of X (points)</text>
        </g>
      </svg>
      ```

      Two of the four sectors show 0, so 0 points has chance $\frac24=\frac12$. One point and two points each have chance $\frac14$.

      ### Random variables and distributions

      A **random variable** is a number whose value is decided by an uncertain outcome. We write it with a capital letter, so $X$ might stand for the points from one spin. Its **distribution** lists every value it can take, together with the probability of each. We write one entry as $P(X=1)$, read "the probability that $X$ equals 1", which here is $\frac14$.

      Every spin gives exactly one value, so the probabilities in a distribution are each between 0 and 1, and they add up to 1:

      $$\begin{aligned}P(X=0)+P(X=1)+P(X=2)&=\frac12+\frac14+\frac14 &&\text{insert each chance}\\&=1 &&\text{check their sum}\end{aligned}$$

      ### Chances of several values

      We can also ask about "at least 1 point", written $X\ge1$, where $\ge$ means "is at least". This event covers spins giving 1 or 2 points, so add their chances:
      $$\begin{aligned}P(X\ge1)&=P(X=1)+P(X=2) &&\text{include both values}\\&=\frac14+\frac14 &&\text{substitute their chances}\\&=\frac12 &&\text{add}\end{aligned}$$

      Be careful not to give each value the same chance just because there are three values. Each of the four sectors is equally likely, and 0 appears twice, so it's twice as likely as each other value.
    worked: |
      Let's estimate the distribution of the number of offers a house gets, from the same 20 past sales. Of those sales, 4 got no offers, 6 got 1 offer, 8 got 2 offers and 2 got 3 offers. Let $X$ be the number of offers a sale gets.

      1. **Divide the count for 0 offers by all 20 sales.** As in the last step, the frequency of a value is our estimate of its probability.
         $$P(X=0)\approx\frac{4}{20}=0.2$$

      2. **Do the same for 1, 2 and 3 offers.** Dividing $6$, $8$ and $2$ by $20$ gives the other three entries.
         $$\begin{aligned}P(X=1)&\approx6/20=0.3 &&\text{one offer}\\P(X=2)&\approx8/20=0.4 &&\text{two offers}\\P(X=3)&\approx2/20=0.1 &&\text{three offers}\end{aligned}$$

      3. **Check that they add up to 1.** Every sale got exactly one number of offers, so no chance should be missing.
         $$0.2+0.3+0.4+0.1=1$$

      4. **Add the values that count as at least two.** "At least two offers", written $X\ge2$, covers the values 2 and 3.
         $$P(X\ge2)\approx0.4+0.1=0.5$$

      So about half of these sales got at least two offers.
    problems:
      - pb-distribution-basics
      - pb-distribution-why
      - pb-distribution-fixed
      - pb-at-least-two-fixed
      - pb-distribution-template
      - pb-valid-distribution
  - id: pb-expectation
    key_prereqs: []
    title: Average the results over many tries
    tldr: |
      - Over many tries, more likely values appear more often.
      - Multiply each value by its probability to give it the right share of the average.
      - Adding those shares gives the expected value, the long-run average per try.
    explain: |
      ### Averaging many spins

      A distribution gives a chance for every value, but often we want one number that sums it up. If we spun the spinner from the last step many times, how many points would we get per spin, on average?

      Imagine 400 spins. About 200 stop on 0, 100 on 1 and 100 on 2. Count the points, then divide by the number of spins:
      $$\begin{aligned}0\times200+1\times100+2\times100&=300 &&\text{approximate total points}\\300/400&=0.75 &&\text{points per spin}\end{aligned}$$
      Dividing each count by 400 gives about its probability. That lets us write the average directly from the probabilities:
      $$\begin{aligned}\frac{0\times200+1\times100+2\times100}{400}&=0\times\frac12+1\times\frac14+2\times\frac14 &&\text{divide each count by }400\\&=0.75 &&\text{add the weighted values}\end{aligned}$$

      ### The expected value

      The **expected value** of a random variable $X$, written $E[X]$, is the average of its values, where each value counts in proportion to its probability. We multiply each value by its probability and add the results:

      $$E[X]=x_1\,P(X=x_1)+x_2\,P(X=x_2)+\dots$$

      Here $x_1$, $x_2$ and so on are the possible values, and the dots mean we include every value. Multiplying this average per try by the number of tries estimates the total:
      $$400\times0.75=300\text{ points}.$$

      ### The balance point

      In the picture, the bars are the spinner's distribution. Imagine the number line is a plank, and each bar is a weight standing on it, as heavy as its probability. The plank balances on the green triangle, which sits at the expected value, $0.75$. That's left of 1, the ordinary average of 0, 1 and 2 where each value counts the same, because half the weight sits at 0.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" aria-label="The spinner distribution as a bar chart over values 0, 1 and 2 with heights 1/2, 1/4 and 1/4. A green triangle under the axis at 0.75 is the point where the chart balances; a red dashed mark at 1 shows the plain average of the three values">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
          <text x="20" y="36">Bar heights are the probabilities; the chart balances at the expected value</text>
          <path d="M60 240 H560" stroke="#737373" stroke-width="2"/>
          <rect x="70" y="80" width="60" height="160" fill="#3b82f6" fill-opacity="0.8"/>
          <text x="100" y="70" text-anchor="middle" fill="#3b82f6">1/2</text>
          <rect x="270" y="160" width="60" height="80" fill="#3b82f6" fill-opacity="0.8"/>
          <text x="300" y="150" text-anchor="middle" fill="#3b82f6">1/4</text>
          <rect x="470" y="160" width="60" height="80" fill="#3b82f6" fill-opacity="0.8"/>
          <text x="500" y="150" text-anchor="middle" fill="#3b82f6">1/4</text>
          <path d="M250.0 242 L234.0 270 H266.0 Z" fill="#10b981"/>
          <text x="236" y="292" text-anchor="end" fill="#10b981">balance point 0.75</text>
          <text x="100" y="264" text-anchor="middle">0</text>
          <text x="500" y="264" text-anchor="middle">2</text>
          <text x="300" y="264" text-anchor="middle">1</text>
          <path d="M300 274 V300" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5 4"/>
          <text x="306" y="320" fill="#ef4444">plain average of 0, 1, 2 is 1</text>
        </g>
      </svg>
      ```

      Moving the weight moves the balance point. Here are two other spinners to compare:

      - If the spinner had four equal sectors marked 0, 1, 2 and 2, a value of 2 would be twice as likely as before, and that extra weight at 2 would pull the balance point up to $1.25$.
      - If it had three equal sectors 0, 1 and 2, every value is equally likely, so it's exactly the plain average, $1$.

      Be careful not to expect the expected value on a single try. No spin gives $0.75$ points. It's what the points average out to over many spins.
    worked: |
      Let's find the expected number of offers per sale, using the distribution we estimated from the 20 past sales in the last step, $P(X=0)=0.2$, $P(X=1)=0.3$, $P(X=2)=0.4$ and $P(X=3)=0.1$.

      1. **Multiply each value by its probability.** Each product is that value's share of the average.
         $$\begin{aligned}0\times0.2&=0 &&\text{share from zero offers}\\1\times0.3&=0.3 &&\text{share from one offer}\\2\times0.4&=0.8 &&\text{share from two offers}\\3\times0.1&=0.3 &&\text{share from three offers}\end{aligned}$$

      2. **Add the products.** Their sum is the expected value.
         $$E[X]=0+0.3+0.8+0.3=1.4$$

      3. **Scale up to many sales.** The expected value is an average per sale, so 100 similar sales should get about 100 times as many offers in total.
         $$100\times1.4=140$$

      So a sale like these gets $1.4$ offers on average, even though no single sale gets $1.4$ offers.
    problems:
      - pb-expectation-basics
      - pb-expectation-why
      - pb-expectation-fixed
      - pb-expected-total
      - pb-expectation-template
      - pb-robot-expected-reward
  - id: pb-conditional
    key_prereqs: []
    title: Update a chance with new information
    tldr: |
      - New information rules out some possible outcomes.
      - A conditional probability counts only the outcomes still possible.
      - If that new information leaves the chance unchanged, the two events are independent.
      - Multiply independent events' chances to find the chance of both happening.
    explain: |
      ### Ruling out faces

      So far we've worked out each probability with nothing else known. But suppose we learn something extra. If a house already has at least two offers, it seems more likely to sell above asking. How do we work out the new chance?

      Let's go back to one roll of a fair die. The chance of an even number (2, 4 or 6) is $\frac36=\frac12$. Now someone peeks and tells us the roll is at least 4. In the picture, faces 1, 2 and 3 are greyed out because they're ruled out, and the orange box holds the three faces that are left. Two of those three, 4 and 6, are even, so the chance of even is now $\frac23$.

      ```svg
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" aria-label="Six die faces. Faces 1, 2 and 3 are greyed out as ruled out; faces 4, 5 and 6 sit inside an orange dashed box for the known event, at least 4. Even faces 4 and 6 are highlighted in blue: 2 of the 3 remaining faces, so the chance of even rises from 1/2 to 2/3">
        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#171717">
          <text x="40" y="30">You learn the roll is at least 4 (orange box). Faces 1 to 3 are ruled out.</text>
          <rect x="40" y="70" width="70" height="70" rx="10" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
          <text x="75" y="114" text-anchor="middle" font-size="26" fill="#d4d4d4">1</text>
          <rect x="126" y="70" width="70" height="70" rx="10" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
          <text x="161" y="114" text-anchor="middle" font-size="26" fill="#d4d4d4">2</text>
          <rect x="212" y="70" width="70" height="70" rx="10" fill="#ffffff" stroke="#d4d4d4" stroke-width="2"/>
          <text x="247" y="114" text-anchor="middle" font-size="26" fill="#d4d4d4">3</text>
          <rect x="298" y="70" width="70" height="70" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5"/>
          <text x="333" y="114" text-anchor="middle" font-size="26" fill="#3b82f6">4</text>
          <rect x="384" y="70" width="70" height="70" rx="10" fill="#ffffff" stroke="#737373" stroke-width="2"/>
          <text x="419" y="114" text-anchor="middle" font-size="26" fill="#171717">5</text>
          <rect x="470" y="70" width="70" height="70" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5"/>
          <text x="505" y="114" text-anchor="middle" font-size="26" fill="#3b82f6">6</text>
          <rect x="288" y="58" width="262" height="94" rx="14" fill="#ffffff" fill-opacity="0" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6"/>
          <text x="40" y="200" fill="#737373">Before: even is 3 of 6 faces, 1/2.</text>
          <text x="40" y="226" fill="#3b82f6">After: even is 2 of the 3 faces left (4 and 6), 2/3.</text>
        </g>
      </svg>
      ```

      ### Conditional probability

      The **conditional probability** of $A$ given $B$, written $P(A\mid B)$ and read "the probability of $A$ given $B$", is the chance of $A$ once we know that $B$ happened. We keep only the outcomes in $B$, then ask what fraction of them are also in $A$. When the outcomes are equally likely, or when we count past cases, that fraction is

      $$P(A\mid B)=\frac{\text{number of outcomes in both }A\text{ and }B}{\text{number of outcomes in }B}$$

      For the die, $P(\text{even}\mid\text{at least 4})=\frac23$.

      Be careful not to swap the two events. The event after the vertical bar is the one we know, and it decides which outcomes we keep. $P(\text{even}\mid\text{rolled 6})=1$, because 6 is even, but $P(\text{rolled 6}\mid\text{even})=\frac13$, because 6 is one of three even faces.

      ### When knowing changes nothing

      Sometimes the extra fact doesn't help. Knowing the roll is at most 4 leaves faces 1, 2, 3 and 4, of which two are even:
      $$\begin{aligned}P(\text{even}\mid\text{at most 4})&=\frac24 &&\text{count within the remaining faces}\\&=\frac12 &&\text{simplify}\end{aligned}$$
      The chance stayed the same. When $P(A\mid B)=P(A)$, the events are **independent**, meaning knowing $B$ tells us nothing about $A$.

      With counts from data, two estimates can differ a little just by chance. Telling how big a gap has to be before it means something takes statistics, which comes later in the course, so here we only compare gaps that are clearly large.
    worked: |
      Let's check whether knowing the number of offers changes the chance of selling above asking, using the same 20 past sales. Of the 10 sales that got at least two offers, 7 sold above asking. Let $A$ be "the sale is above asking" and $B$ be "the sale got at least two offers".

      1. **Estimate the chance of $A$ with nothing else known.** As in the first step, 9 of the 20 sales were above asking.
         $$P(A)\approx\frac{9}{20}=0.45$$

      2. **Keep only the sales in $B$.** Knowing $B$ rules out the other 10 sales, so we count the above-asking sales among the 10 that are left.
         $$P(A\mid B)\approx\frac{7}{10}=0.7$$

      3. **Do the same for the sales not in $B$.** Subtract the known counts to find the sales with fewer than two offers.
         $$\begin{aligned}20-10&=10 &&\text{sales outside }B\\9-7&=2 &&\text{above-asking sales outside }B\\P(A\mid\text{not }B)&\approx\frac{2}{10}=0.2 &&\text{divide within that group}\end{aligned}$$

      So the chance of selling above asking rises from $0.45$ to $0.7$ when a house has at least two offers, and falls to $0.2$ when it doesn't. In this data, the two events are clearly not independent.

      ### The chance of both events

      In the die picture, let $A$ mean even and $B$ mean at least 4. Half the faces are in the orange box, and two thirds of those are even. Multiplying these fractions gives the share of all faces in both events. For any events with $P(B)>0$:
      $$P(A\text{ and }B)=P(B)\,P(A\mid B).$$

      Independence means $P(A\mid B)=P(A)$, so substitution gives:
      $$P(A\text{ and }B)=P(B)\,P(A)=P(A)\,P(B).$$

      For a numerical example of independence, let $A$ mean even and $B$ mean at most 4 on the same fair die.

      1. **Find each chance.** Three faces are even and four are at most 4.
         $$P(A)=\frac12,\qquad P(B)=\frac23.$$

      2. **Multiply the independent chances.** We already checked that knowing $B$ leaves the chance of even unchanged.
         $$P(A\text{ and }B)=\frac12\times\frac23=\frac13.$$

      Faces 2 and 4 meet both conditions, confirming the answer is two of six faces.
    problems:
      - pb-conditional-basics
      - pb-conditional-why
      - pb-conditional-fixed
      - pb-reverse-conditional
      - pb-conditional-template
      - pb-independence-check
      - pb-independent-joint
final: probability-basics-explain
summary: |
  - An event is a set of outcomes. Its probability $P(A)$ is between 0 and 1, it can be estimated by the fraction of past cases in the event, and its complement has probability $P(\text{not }A)=1-P(A)$.
  - A random variable is a number decided by chance. Its distribution lists each value with its probability, and those probabilities add up to 1.
  - The expected value multiplies each value by its probability and adds the results, $E[X]=x_1\,P(X=x_1)+x_2\,P(X=x_2)+\dots$, which gives the long-run average per try.
  - A conditional probability $P(A\mid B)$ keeps only the outcomes in $B$ and finds the fraction of them that are also in $A$. Two events are independent when $P(A\mid B)=P(A)$.

  **Next:** The perceptron, a model that answers yes-or-no questions, such as whether a house will sell above asking.
