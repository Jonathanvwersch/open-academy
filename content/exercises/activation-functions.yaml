concept: activation-functions
exercises:
  - id: act-stacking-stays-straight-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What rule do stacked linear layers represent when no activations intervene?"
    options:
      - {
          id: a,
          text: "A curved rule, since each added layer creates another bend in the prediction.",
          correct: false,
          feedback: "A bend requires a nonlinear activation between the weighted-sum layers.",
        }
      - {
          id: b,
          text: "A probability rule, since each layer restricts its output to values from zero to one.",
          correct: false,
          feedback: "A sigmoid can bound a score, but stacking linear layers alone does not bound outputs.",
        }
      - {
          id: c,
          text: "A nearest-neighbour rule, since each layer selects examples close to the current input.",
          correct: false,
          feedback: "Nearest-neighbour prediction compares stored examples instead of composing layer rules.",
        }
      - {
          id: d,
          text: "One straight-line rule, since a weighted sum fed into another multiplies out into one.",
          correct: true,
          feedback: "Multiplying out changes the slope and intercept but leaves one weighted sum plus bias.",
        }
    solution: "Stacked linear layers multiply out into one weighted sum plus bias, a single straight-line rule, so depth alone cannot add a bend."
  - id: act-relu-sigmoid-tanh-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is an activation function?"
    options:
      - {
          id: a,
          text: "A rate that measures how the loss changes when one adjustable model weight changes.",
          correct: false,
          feedback: "That rate is a loss derivative for a parameter, not a transformation of a neuron's score.",
        }
      - {
          id: b,
          text: "A multiplier that scales input features before a neuron computes its weighted score.",
          correct: false,
          feedback: "That multiplier is a weight; an activation transforms the score after the weighted sum.",
        }
      - {
          id: c,
          text: "A function applied to a neuron's weighted score before the value is passed to the next layer.",
          correct: true,
          feedback: "It transforms the weighted score before the next layer uses that value.",
        }
      - {
          id: d,
          text: "A non-negative score that measures the difference between a prediction and its target.",
          correct: false,
          feedback: "That score is a loss; an activation transforms a neuron's weighted score.",
        }
    solution: "An activation function transforms a neuron's weighted score before it is passed to the next layer."
  - id: act-slopes-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does an activation slope measure?"
    options:
      - {
          id: a,
          text: "The rate at which loss changes when one model weight changes.",
          correct: false,
          feedback: "That is a parameter's loss derivative, not the activation's output rate.",
        }
      - {
          id: b,
          text: "The angle between two input feature vectors being compared for direction.",
          correct: false,
          feedback: "Cosine similarity uses the angle between vectors; an activation slope is a derivative.",
        }
      - {
          id: c,
          text: "The rate at which activation output changes as its input score changes.",
          correct: true,
          feedback: "This derivative tells how a score change affects the value passed onward.",
        }
      - {
          id: d,
          text: "The difference between a model prediction and its known target.",
          correct: false,
          feedback: "That difference is a prediction error, not a derivative of an activation.",
        }
    solution: "An activation slope is the derivative of the activation output with respect to its input score."
  - id: act-check-relu
    dimension: math
    type: text
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: "Apply ReLU elementwise to $z = (-1.5, 0, 2)$. Answer as `(a, b, c)`."
    accept: ["(0,0,2)", "(0, 0, 2)", "0,0,2", "0, 0, 2", "[0,0,2]", "[0, 0, 2]"]
    solution: "$(0, 0, 2)$."
  - id: dx-dl-2
    dimension: conceptual
    type: mc
    role: diagnostic
    difficulty: 2
    est_minutes: 2
    prompt: "A network has three fully connected layers with **no** activation functions between them. What class of functions can it represent?"
    options:
      - {
          id: a,
          text: "Exactly the affine (linear + bias) functions, the same as a single layer",
          correct: true,
        }
      - {
          id: b,
          text: "Any continuous function, given enough units",
          correct: false,
          category: misunderstood_definition,
          feedback: "Universal approximation needs a nonlinearity. Composed affine maps are affine.",
        }
      - { id: c, text: "Polynomials of degree 3", correct: false, category: incorrect_reasoning }
    solution: "$W_3(W_2(W_1x+b_1)+b_2)+b_3 = Wx + b$ for some $W, b$."
  - id: act-sigmoid-deriv
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "What is the maximum possible value of the sigmoid's derivative $\\sigma'(z)$?"
    answer: 0.25
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 0.5,
          tolerance: { abs: 0.001 },
          category: math_error,
          feedback: "$\\sigma(0) = 0.5$, but $\\sigma'(0) = 0.5\\cdot0.5$.",
        }
      - {
          answer: 1,
          tolerance: { abs: 0.001 },
          category: recall_failure,
          feedback: "Review the relevant calculation.",
        }
    hints: ["$\\sigma'(z) = \\sigma(z)(1-\\sigma(z))$ is maximised where $\\sigma = 0.5$."]
    solution: "At $z=0$: $0.5 \\times 0.5 = 0.25$."
  - id: act-vanishing
    dimension: transfer
    type: numeric
    role: transfer
    difficulty: 3
    est_minutes: 3
    prompt: "Ten sigmoids are applied one after another, each to the previous one's output. A small change at the start is multiplied by each sigmoid's slope as it passes through. What is the largest factor the change can end up multiplied by? (Scientific notation is fine, e.g. `9.5e-7`.)"
    answer: 9.5367e-7
    tolerance: { rel: 0.01 }
    hints:
      ["Each factor is at most the sigmoid's largest slope, at $z = 0$, where its output is 0.5."]
    solution: "The sigmoid's largest slope is $0.5(1-0.5) = 0.25$, at $z = 0$. Each of the ten factors is at most that, so the total is at most $0.25^{10} \\approx 9.5\\times10^{-7}$. Even in the best case the change almost disappears."
  - id: act-review-deriv
    dimension: math
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "What is the derivative of ReLU at $z = 3$, and at $z = -3$?"
    options:
      - { id: a, text: "1 and 0", correct: true }
      - {
          id: b,
          text: "3 and 0",
          correct: false,
          category: misunderstood_definition,
          feedback: "That is the output, not the derivative.",
        }
      - {
          id: c,
          text: "1 and -1",
          correct: false,
          category: recall_failure,
          feedback: "ReLU is flat for negative inputs, so its slope there is not -1. Check the two linear regions on either side of zero.",
        }
    solution: "ReLU has slope 1 for $z>0$ and slope 0 for $z<0$."
  - id: act-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "Explain why neural networks need nonlinear activation functions, and how an activation's slope affects how much its output changes when training nudges the weights."
    rubric:
      - {
          id: r1,
          criterion: "Explain that a stack of weighted sums plus biases is still one weighted sum plus bias, so extra layers need a nonlinear activation to add a bend.",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Explain that a small output change is about the activation's slope times the score change, so a nearly flat activation barely responds and training learns slowly.",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Mention that a ReLU neuron with a negative score for every input has slope $0$ and stops learning.",
          weight: 1,
        }
    exemplar: "A stack of weighted sums plus biases is still one weighted sum plus bias, so a nonlinear activation is needed to add a bend. When training nudges the weights, the output changes by about the activation's slope times the change in score. Far from $z=0$, sigmoid and tanh are nearly flat, so their outputs barely respond and training learns slowly. A ReLU neuron whose score is negative for every input always outputs $0$ with slope $0$, so it stops learning."
  - id: act-explain-layers
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "Explain in 2–4 sentences why a network needs a nonlinear activation between its layers, and what the slopes of ReLU and sigmoid tell you about how their outputs respond to a change in the score."
    rubric:
      - {
          id: r1,
          criterion: "Explains that a weighted sum plus bias fed into another weighted sum plus bias is still one weighted sum plus bias, so without a nonlinear activation extra layers add nothing",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Explain that ReLU's slope is $1$ for positive scores and $0$ for negative scores, so a small change passes through in full or leaves the output unchanged.",
          weight: 1,
          required: true,
        }
      - {
          id: sigmoid-slope,
          criterion: "Explain that sigmoid's slope is at most $0.25$ at $z=0$ and close to $0$ far from there, so its output responds less to a small change in score.",
          weight: 1,
          required: true,
        }
      - {
          id: r3,
          criterion: "Mention that a ReLU neuron with a negative score for every input always outputs $0$ and stops learning.",
          weight: 1,
        }
    exemplar: "If you feed one weighted sum plus bias into another, you can multiply it out into a single weighted sum plus bias, so a stack of layers with nothing between them draws the same straight boundaries as one layer. A nonlinear activation such as ReLU or sigmoid bends each score, which stops the stack collapsing. ReLU's slope is 1 for a positive score, so changes pass through in full, and 0 for a negative score, so they're blocked; a unit that is always negative is dead. Sigmoid's slope is at most 0.25 at z = 0 and close to 0 far from it, where the curve is flat and the output barely responds."
  - id: actp-stack-collapse
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "An input $x$ goes through two linear layers with nothing between them: $u = 4x + 2$, then $y = 3u - 1$. What kind of rule is $y$ in terms of $x$?"
    options:
      - { id: a, text: "A single straight-line rule, $y = 12x + 5$", correct: true }
      - {
          id: b,
          text: "A curve, because two rules were applied one after the other",
          correct: false,
          category: misunderstood_definition,
          feedback: "Substitute: $3(4x + 2) - 1 = 12x + 5$. Applying straight-line rules in turn gives another straight line.",
        }
      - {
          id: c,
          text: "A straight line with slope $4 + 3 = 7$",
          correct: false,
          category: math_error,
          feedback: "The slopes multiply, not add: each step of $x$ adds 4 to $u$, and each step of $u$ adds 3 to $y$, so $4 \\times 3 = 12$.",
        }
    solution: "$y = 3(4x + 2) - 1 = 12x + 6 - 1 = 12x + 5$. It's one straight line, so the second rule added no bend."
  - id: actp-collapse-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      Two rules are stacked with no activation between them: $u = {{=a}}x + {{=c}}$, then $y = {{=d}}u + {{=e}}$.

      The stack equals a single rule $y = mx + k$. What is the intercept $k$?
    hints:
      - "Substitute the first rule into the second and multiply out the bracket."
    solution: |
      $y = {{=d}}({{=a}}x + {{=c}}) + {{=e}} = {{=a*d}}x + {{=d*c}} + {{=e}}$, so $k = {{=d*c + e}}$.

      The stack is one straight line, $y = {{=a*d}}x + {{=d*c + e}}$.
    answer_expr: "d * c + e"
    params:
      a: { min: 2, max: 5 }
      c: { min: 1, max: 5 }
      d: { min: 2, max: 4 }
      e: { min: 1, max: 6 }
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "c + e",
          category: math_error,
          feedback: "The second rule multiplies all of $u$ by its slope, including the first intercept. Multiply $c$ by $d$ before adding $e$.",
        }
      - {
          answer_expr: "d * c",
          category: incomplete_explanation,
          feedback: "You've multiplied out the bracket but left out the second rule's own intercept. Add $e$.",
        }
  - id: actp-why-not-more-layers
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Why won't adding ten more layers of weighted sums plus biases, with no nonlinear activation, let a house model draw a curved boundary?"
    options:
      - {
          id: a,
          text: "Multiplying and adding these rules only produces another weighted sum plus a bias",
          correct: true,
        }
      - {
          id: b,
          text: "It will work once there are more layers than inputs",
          correct: false,
          category: misunderstood_definition,
          feedback: "Layer count does not change the algebra: weighted sums of weighted sums are still a weighted sum plus bias.",
        }
      - {
          id: c,
          text: "Each layer keeps its own boundary in the final answer, so enough lines become a curve",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Without activations the intermediate scores are only scaled and added. Their boundaries are not kept as separate decisions.",
        }
      - {
          id: d,
          text: "The biases are nonlinear, so keeping them already prevents collapse",
          correct: false,
          category: misunderstood_definition,
          feedback: "A bias adds a constant. It shifts a straight-line rule but does not bend it.",
        }
    solution: "For example, $u = 3x + 1$ then $y = 2u + 5$ gives $y = 6x + 7$. More scaling and addition just change the final coefficients. A nonlinear activation, not extra straight-line layers, supplies a bend."
  - id: actp-what-bends
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "You want a stack of layers to be able to draw a curved boundary. What do you need to add?"
    options:
      - {
          id: a,
          text: "A function whose graph isn't a straight line, applied to each score between the layers",
          correct: true,
        }
      - {
          id: b,
          text: "More layers of weighted sums plus biases",
          correct: false,
          category: misunderstood_definition,
          feedback: "Any number of these layers collapses into one, so the boundary stays straight.",
        }
      - {
          id: c,
          text: "A bias in every layer",
          correct: false,
          category: incorrect_reasoning,
          feedback: "A bias only shifts a line. A weighted sum plus bias is still a straight-line rule.",
        }
      - {
          id: d,
          text: "Larger weights",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Larger weights make a line steeper, but it's still a line.",
        }
    solution: "Only a nonlinear activation between the layers stops them multiplying out into a single straight-line rule."
  - id: actp-linear-candidate
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Which of these candidate activations $\\phi(z)$, placed between layers, would still leave the whole network a single straight-line rule?"
    options:
      - { id: a, text: "$\\phi(z) = 3z + 2$", correct: true }
      - {
          id: b,
          text: "$\\phi(z) = 1$ if $z > 0$, else $0$ (the step rule)",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The step rule jumps at 0, so its graph isn't a straight line. It does bend the stack.",
        }
      - {
          id: c,
          text: "$\\phi(z) = z^2$",
          correct: false,
          category: incorrect_reasoning,
          feedback: "$z^2$ is a curve, so it would stop the layers collapsing.",
        }
    solution: "$3z + 2$ is itself a weighted sum plus bias, so feeding it into the next layer still multiplies out into one straight-line rule."
  - id: actp-robot-linear
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: 'A robot''s grip strength should rise slowly for light objects and sharply for heavy ones, a curved relationship. An engineer builds a controller from three layers of weighted sums plus biases, with no activation between them, and says "three layers is deep enough to learn the curve". What''s wrong?'
    options:
      - {
          id: a,
          text: "The three layers collapse into one straight-line rule, so it can't follow the curve",
          correct: true,
        }
      - {
          id: b,
          text: "Three layers can bend, but each needs more neurons to follow this curve",
          correct: false,
          category: misunderstood_definition,
          feedback: "Without an activation, more neurons per layer still multiply out into one weighted sum plus bias, which is straight.",
        }
      - {
          id: c,
          text: "Each layer adds one bend, so it needs as many layers as the curve has bends",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Layers of weighted sums plus biases add no bends at all. Any number of them collapses into a single straight line.",
        }
      - {
          id: d,
          text: "The biases bend the rule, so only curves with one bend can be learned",
          correct: false,
          category: misunderstood_definition,
          feedback: "Adding a bias shifts a straight line up or down. It doesn't bend it.",
        }
    solution: "Without activations, the stack equals one weighted sum plus bias, so grip strength can only rise at a constant rate. Adding a nonlinear activation such as ReLU between the layers lets it bend."
  - id: actp-relu-values
    dimension: math
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Apply ReLU to each score in $z = (-3, 1.5, 0)$."
    options:
      - { id: a, text: "$(0, 1.5, 0)$", correct: true }
      - {
          id: b,
          text: "$(3, 1.5, 0)$",
          correct: false,
          category: misunderstood_definition,
          feedback: "ReLU doesn't flip negative scores to positive; it sets them to 0.",
        }
      - {
          id: c,
          text: "$(0, 1, 0)$",
          correct: false,
          category: misunderstood_definition,
          feedback: "That's the step rule. ReLU passes a positive score through unchanged, so $1.5$ stays $1.5$.",
        }
      - {
          id: d,
          text: "$(-3, 1.5, 0)$",
          correct: false,
          category: recall_failure,
          feedback: "ReLU is $\\max(0, z)$, so $-3$ becomes $0$.",
        }
    solution: "$\\max(0, -3) = 0$, $\\max(0, 1.5) = 1.5$ and $\\max(0, 0) = 0$, giving $(0, 1.5, 0)$."
  - id: actp-relu-sum-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      Three neurons have scores $z_1 = {{=z1}}$, $z_2 = {{=z2}}$ and $z_3 = {{=z3}}$. Each passes its score through ReLU.

      What is the sum of the three outputs?
    hints:
      - "ReLU sets each negative score to 0 and keeps each positive score as it is. Then add."
    solution: |
      The outputs are $\max(0, {{=z1}}) = {{=max(0, z1)}}$, $\max(0, {{=z2}}) = {{=max(0, z2)}}$ and $\max(0, {{=z3}}) = {{=max(0, z3)}}$.

      Their sum is ${{=max(0, z1) + max(0, z2) + max(0, z3)}}$.
    answer_expr: "max(0, z1) + max(0, z2) + max(0, z3)"
    params:
      z1: { min: -4, max: -0.5, step: 0.5 }
      z2: { min: 0.5, max: 4, step: 0.5 }
      z3: { min: -3, max: 3, step: 0.5 }
    constraints: ["z3 != 0"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "z1 + z2 + z3",
          category: misunderstood_definition,
          feedback: "You added the raw scores. ReLU turns each negative score into 0 first.",
        }
      - {
          answer_expr: "abs(z1) + abs(z2) + abs(z3)",
          category: misunderstood_definition,
          feedback: "ReLU doesn't flip negative scores to positive; it sets them to 0.",
        }
  - id: actp-sigmoid-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      A neuron's score is $z = {{=z}}$. What is its sigmoid output $\sigma(z)$? Give 3 decimal places.
    hints:
      - "$\\sigma(z) = \\dfrac{1}{1 + e^{-z}}$. Work out $e^{-z}$ first (for $z = {{=z}}$ that's $e^{ {{=-z}} }$), add 1, then take 1 divided by the result."
    solution: |
      $\sigma(z) = \dfrac{1}{1 + e^{-z}}$. Here $e^{-({{=z}})} \approx {{=round(exp(-z), 4)}}$, so $\sigma({{=z}}) = \dfrac{1}{1 + {{=round(exp(-z), 4)}}} \approx {{=round(1 / (1 + exp(-z)), 3)}}$.

      A positive score gives an output above 0.5 and a negative score gives one below 0.5.
    answer_expr: "1 / (1 + exp(-z))"
    params:
      z: { min: -3, max: 3, step: 0.5 }
    constraints: ["z != 0"]
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer_expr: "1 / (1 + exp(z))",
          category: math_error,
          feedback: "The exponent is $-z$, not $z$. With the sign flipped you get $1 - \\sigma(z)$, the wrong side of 0.5.",
        }
  - id: actp-relu-bend
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Two rules with ReLU between them: $u = x - 2$, then $y = 3\\,\\text{ReLU}(u) + 1$. What is $y$ when $x = 0$?"
    answer: 1
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -5,
          tolerance: { abs: 0.001 },
          category: misunderstood_definition,
          feedback: "You skipped ReLU. $u = -2$ is negative, so ReLU gives 0 and $y = 3 \\times 0 + 1$.",
        }
      - {
          answer: 7,
          tolerance: { abs: 0.001 },
          category: misunderstood_definition,
          feedback: "ReLU doesn't flip $-2$ to $2$; it sets negative values to 0.",
        }
    hints: ["Find $u$ first, then apply ReLU, then the second rule."]
    solution: "$u = 0 - 2 = -2$, $\\text{ReLU}(-2) = 0$, so $y = 3 \\times 0 + 1 = 1$. For every $x$ up to 2 the output stays at 1, then it rises by 3 per unit: a bend."
  - id: actp-why-sigmoid-output
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: "Why choose sigmoid rather than ReLU or a step rule for an output meant to express how likely an email is to be spam?"
    options:
      - {
          id: a,
          text: "It can return values such as 0.2 or 0.8, while ReLU can exceed 1 and a step rule only gives yes/no",
          correct: true,
        }
      - {
          id: b,
          text: "ReLU also stays between 0 and 1 because it removes negative scores",
          correct: false,
          category: incorrect_reasoning,
          feedback: "ReLU has no upper limit, so it could output 7, which can't be a likelihood.",
        }
      - {
          id: c,
          text: "Sigmoid turns every positive score into exactly 1 and every negative score into 0",
          correct: false,
          category: recall_failure,
          feedback: "That describes the step rule. Sigmoid gives intermediate values, such as 0.5 at a score of 0.",
        }
      - {
          id: d,
          text: "Using sigmoid alone guarantees that 0.8 means exactly 80 percent of such emails are spam",
          correct: false,
          category: incomplete_explanation,
          feedback: "Sigmoid sets the output range, not its accuracy. Matching predicted likelihoods to data still depends on the model's weights.",
        }
    solution: "Sigmoid maps any score into the range between 0 and 1 while keeping differences between scores. ReLU can output 7, while the step rule only gives 0 or 1. Sigmoid's range suits an output meaning how likely an email is to be spam, but does not itself guarantee that the model is accurate."
  - id: actp-tanh-range
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Between which values do tanh's outputs lie, and what is $\\tanh(0)$?"
    options:
      - { id: a, text: "Between $-1$ and $1$, with $\\tanh(0) = 0$", correct: true }
      - {
          id: b,
          text: "Between 0 and 1, with $\\tanh(0) = 0.5$",
          correct: false,
          category: recall_failure,
          feedback: "That's the sigmoid. tanh has the same S shape but is centred on 0 and runs from $-1$ to $1$.",
        }
      - {
          id: c,
          text: "From 0 upwards with no limit, with $\\tanh(0) = 0$",
          correct: false,
          category: recall_failure,
          feedback: "That's ReLU. tanh levels off at $-1$ for very negative scores and at 1 for large ones.",
        }
      - {
          id: d,
          text: "Between $-1$ and $1$, with $\\tanh(0) = 0.5$",
          correct: false,
          category: recall_failure,
          feedback: "tanh is centred on 0: halfway between $-1$ and $1$ is 0, so $\\tanh(0) = 0$.",
        }
    solution: "Both are S-shaped, but tanh is centred on 0 and runs from $-1$ to $1$, while sigmoid runs from 0 to 1 and is 0.5 at $z = 0$."
  - id: actp-relu-slope
    dimension: math
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "What is ReLU's slope at $z = 2.5$, and at $z = -1$?"
    options:
      - { id: a, text: "1 and 0", correct: true }
      - {
          id: b,
          text: "2.5 and 0",
          correct: false,
          category: misunderstood_definition,
          feedback: "2.5 is ReLU's output at $z = 2.5$. Its slope there is 1: each extra unit of $z$ adds one unit of output.",
        }
      - {
          id: c,
          text: "1 and $-1$",
          correct: false,
          category: recall_failure,
          feedback: "For negative $z$ ReLU is flat at 0, so its slope is 0.",
        }
    solution: "For $z > 0$ ReLU is $z$ itself, slope 1. For $z < 0$ it's a constant 0, slope 0."
  - id: actp-sigmoid-slope-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      At some score, a sigmoid neuron outputs $\sigma(z) = {{=s}}$. What is the sigmoid's slope $\sigma'(z)$ there?
    hints:
      - "Use $\\sigma'(z) = \\sigma(z)\\,(1 - \\sigma(z))$."
    solution: |
      $\sigma'(z) = {{=s}} \times (1 - {{=s}}) = {{=s}} \times {{=round(1 - s, 2)}} = {{=round(s * (1 - s), 4)}}$.

      The slope is largest, 0.25, when the output is 0.5, and shrinks as the output nears 0 or 1.
    answer_expr: "s * (1 - s)"
    params:
      s: { min: 0.1, max: 0.9, step: 0.1 }
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "s",
          category: misunderstood_definition,
          feedback: "That's the output, not the slope. Multiply it by $1 - \\sigma(z)$.",
        }
  - id: actp-nudge-estimate
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A sigmoid neuron has score $z = 0$, so it outputs 0.5 and its slope is 0.25. Its score rises by 0.2. Using the slope, estimate the new output."
    answer: 0.55
    tolerance: { abs: 0.002 }
    common_wrong:
      - {
          answer: 0.7,
          tolerance: { abs: 0.002 },
          category: incorrect_reasoning,
          feedback: "You added the whole nudge to the output. The output changes by slope × nudge, $0.25 \\times 0.2$.",
        }
      - {
          answer: 0.05,
          tolerance: { abs: 0.002 },
          category: incomplete_explanation,
          feedback: "That's the change in output. Add it to the starting output of 0.5.",
        }
    hints: ["Change in output ≈ slope × change in score."]
    solution: "The output changes by about $0.25 \\times 0.2 = 0.05$, so it's about $0.5 + 0.05 = 0.55$. (The exact value is $\\sigma(0.2) \\approx 0.550$.)"
  - id: actp-why-saturation
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: "A sigmoid neuron already outputs 0.999. Why does a small increase in its score barely change the output?"
    options:
      - {
          id: a,
          text: "Its slope is $0.999(1 - 0.999)$, close to zero, so the curve is almost flat at this score",
          correct: true,
        }
      - {
          id: b,
          text: "Its slope equals its output, so it is almost 1",
          correct: false,
          category: recall_failure,
          feedback: "The output is a height, not a slope. Multiply it by $1 - 0.999$ to find the slope.",
        }
      - {
          id: c,
          text: "Sigmoid rounds every output above 0.5 to exactly 1",
          correct: false,
          category: misunderstood_definition,
          feedback: "Sigmoid does not round. Its output changes smoothly, just very slowly near either end.",
        }
      - {
          id: d,
          text: "The slope is large, but the output cannot exceed 1 so it ignores this change",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The smooth flattening is precisely a small slope. There is no separate clipping step that discards the nudge.",
        }
    solution: "The derivative is $0.999 \\times 0.001 = 0.000999$. A score increase of 0.1 therefore changes the output by roughly $0.000999 \\times 0.1 = 0.0000999$. This small response to a score change is saturation, not rounding."
  - id: actp-tanh-slope
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "At some score, a tanh neuron outputs $\\tanh(z) = 0.5$. What is tanh's slope there?"
    answer: 0.75
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 0.5,
          tolerance: { abs: 0.001 },
          category: math_error,
          feedback: "Square the output before subtracting: $1 - 0.5^2$, not $1 - 0.5$.",
        }
      - {
          answer: 0.25,
          tolerance: { abs: 0.001 },
          category: incomplete_explanation,
          feedback: "$0.25$ is $\\tanh^2(z)$. Subtract it from 1.",
        }
    hints: ["tanh's slope is $1 - \\tanh^2(z)$, where $\\tanh^2(z)$ means $\\tanh(z)$ squared."]
    solution: "tanh's slope is $\\tanh'(z) = 1 - \\tanh^2(z) = 1 - 0.5^2 = 1 - 0.25 = 0.75$."
  - id: actp-dead-unit
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "In a robot's obstacle detector, one ReLU neuron has a large negative bias, so its score is negative for every sensor reading the robot ever sees. What happens to this neuron?"
    options:
      - {
          id: a,
          text: "It always outputs 0 with slope 0, so weight changes have no effect",
          correct: true,
        }
      - {
          id: b,
          text: "It outputs negative values that cancel out other neurons",
          correct: false,
          category: misunderstood_definition,
          feedback: "ReLU never outputs a negative value; negative scores become 0.",
        }
      - {
          id: c,
          text: "It levels off near 1 and stops changing, like a sigmoid",
          correct: false,
          category: recall_failure,
          feedback: "ReLU doesn't level off at 1. For negative scores it's flat at 0.",
        }
    solution: "With every score negative, ReLU outputs 0 with slope 0, so nudging the neuron's weights or bias doesn't move its output. It's a dead unit."
  - id: actp-stack-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, $u=2x+1$ then $y=3u-4$ gives $y=6x-1$. Why is the combined slope $6$ rather than $2+3=5$?"
    options:
      - id: a
        text: "Each unit of $x$ raises $u$ by 2, and each unit of $u$ raises $y$ by 3, so $y$ rises $2\\times3$."
        correct: true
        feedback: "The second rule scales every change in $u$, so the two slopes multiply."
      - id: b
        text: "The second rule's intercept $-4$ adds one more unit to the slope, so $5$ becomes $6$."
        correct: false
        category: incorrect_reasoning
        feedback: "An intercept shifts the line up or down; it never changes the slope. The 6 comes from $3\\times2$."
      - id: c
        text: "Stacking two layers always doubles the larger of the two slopes, and $3$ doubled is $6$."
        correct: false
        category: incorrect_reasoning
        feedback: "That only matches here by chance. With $u=4x$ and $y=3u$ the combined slope is $4\\times3=12$, not $8$."
      - id: d
        text: "The slopes add to $5$, and the first rule's bias of $1$ adds one more to the slope."
        correct: false
        category: misunderstood_definition
        feedback: "The first bias ends up in the intercept: $3(1)-4=-1$. The slope is $3\\times2=6$."
    solution: "Substituting gives $3(2x+1)-4$, and multiplying out the bracket multiplies the slopes: $3\\times2=6$. Intercepts only shift the line."
  - id: actp-equal-steps
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A two-layer model gives outputs $y=-2,\\ 1,\\ 4,\\ 10$ at inputs $x=0,\\ 1,\\ 2,\\ 3$. Could it be two linear layers with nothing between them?"
    options:
      - id: a
        text: "No: the rise per step is 3, 3, then 6, and a straight-line rule rises equally each step."
        correct: true
        feedback: "Unequal rises for equal steps in $x$ mean the graph bends, which needs an activation."
      - id: b
        text: "Yes: the outputs keep increasing, and increasing outputs are what a straight-line rule gives."
        correct: false
        category: incorrect_reasoning
        feedback: "Increasing isn't enough. A straight line must rise by the same amount each step, but here the last rise is 6, not 3."
      - id: c
        text: "Yes: two linear layers can bend once, at the input where the second layer takes over."
        correct: false
        category: misunderstood_definition
        feedback: "Two linear layers multiply out into one straight-line rule, so there is no point where a bend can happen."
      - id: d
        text: "No: the first output is negative, and a straight-line rule can't give a negative output."
        correct: false
        category: misunderstood_definition
        feedback: "Straight lines can be negative: $y=6x-1$ gives $-1$ at $x=0$. The real sign is the unequal rises."
    solution: "The rises are $1-(-2)=3$, $4-1=3$ and $10-4=6$. Stacked linear layers equal one straight line, which rises equally per step, so this model must have an activation between its layers."
  - id: actp-squash-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, why is $\\sigma(2)$ about $0.881$ rather than $1$, even though $2$ is a fairly large score?"
    options:
      - id: a
        text: "$e^{-2}$ is about $0.135$, not $0$, so the fraction is $1/1.135$, which is below 1."
        correct: true
        feedback: "The sigmoid only gets close to 1 once $e^{-z}$ is close to 0, which needs a larger score."
      - id: b
        text: "The sigmoid rounds each score down to the nearest tenth before it divides."
        correct: false
        category: misunderstood_definition
        feedback: "The sigmoid does no rounding; $1/(1+e^{-z})$ changes smoothly with the score."
      - id: c
        text: "The sigmoid subtracts $e^{-2}$ from 1, and $1-0.135$ comes to about $0.881$."
        correct: false
        category: math_error
        feedback: "$1-0.135=0.865$, not $0.881$. The sigmoid divides: $1/(1+0.135)\\approx0.881$."
      - id: d
        text: "Sigmoid outputs are capped at $0.881$, the largest value the curve can reach."
        correct: false
        category: recall_failure
        feedback: "There is no cap below 1: larger scores get closer to 1, for example $\\sigma(4)\\approx0.982$."
    solution: "$\\sigma(2)=1/(1+e^{-2})$ and $e^{-2}\\approx0.135$ is still clearly above 0, so the result is $1/1.135\\approx0.881$. The output approaches 1 only as the score grows further."
  - id: actp-nudge-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, the slope predicted a change of $0.025$ and the actual change was $0.02498$. Why do they almost match?"
    options:
      - id: a
        text: "Over a small nudge the curve is nearly straight, so slope times nudge is a close estimate."
        correct: true
        feedback: "A derivative describes the curve near one point, so the estimate is good for small nudges."
      - id: b
        text: "The sigmoid is exactly straight near $z=0$, so the two numbers are really the same."
        correct: false
        category: incorrect_reasoning
        feedback: "They differ slightly, $0.02498$ against $0.025$, because the curve bends a little even over $0.1$."
      - id: c
        text: "The slope $0.25$ is the sigmoid's output at the new score $0.1$, so it predicts that output."
        correct: false
        category: misunderstood_definition
        feedback: "$\\sigma(0.1)\\approx0.525$, not $0.25$. The slope is $\\sigma(z)(1-\\sigma(z))$ at the starting score."
      - id: d
        text: "Any nudge size would match this well, because the sigmoid's slope is $0.25$ at every score."
        correct: false
        category: recall_failure
        feedback: "The slope changes along the curve: at $z=3$ it is only about $0.045$, so large nudges drift from the estimate."
    solution: "Change in output is about slope times change in score only for small changes, where the curve is nearly straight. Over $0.1$ the sigmoid bends very little, so $0.25\\times0.1=0.025$ is only about $0.00002$ away from the real change."
