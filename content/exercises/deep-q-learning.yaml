        }
      - {
          id: c,
          text: "Discard the move after updating its reward estimate.",
          correct: false,
          feedback: "This loses the experience replay needs. DQN records the transition for reuse.",
        }
    solution: Store $(s,a,r,s',\text{done})$ in the replay buffer. Then sample a random minibatch for training.
