  - id: vf-recall-action-value-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: vf-action-value
    difficulty: 2
    est_minutes: 0.5
    prompt: "In a corridor of four cells, policy $\\pi$ always moves left, and the discount factor is $0.9$. What does $Q^\\pi(2,\\text{right})$ score?"
    options:
      - id: a
