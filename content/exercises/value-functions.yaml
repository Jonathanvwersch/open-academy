        weight: 1
    exemplar: "$V^\\pi(s)$ is the expected return from starting in state $s$ and following $\\pi$ from then on. The policy changes which paths the robot takes, so the same state can have different values under different policies."
  - id: vf-recall-state-value-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: vf-state-value
    difficulty: 1
    est_minutes: 0.5
    prompt: "Two policies always take the same first action from state $s$, but can make different choices after that. Can their state values at $s$ differ?"
    options:
      - id: a
        text: "Yes, because the later actions can lead to different rewards"
        correct: true
        feedback: "The state value includes the expected return from the whole remaining trip under each policy."
      - id: b
        text: "No, because the first action fixes the whole return"
        correct: false
        feedback: "The first action sets up what happens next. Later actions can still affect the rewards that follow."
      - id: c
        text: "No, because both values use the best possible later actions"
        correct: false
        feedback: "Using the best possible later actions gives the optimal value. Each policy's state value uses the actions that policy chooses."
    solution: "$V^\\pi(s)$ follows $\\pi$ for the whole remaining trip, so a difference in later choices can change its value."
  - id: vf-recall-state-value-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: vf-state-value
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the quantity being averaged in the definition of the state value: $V^\\pi(s)=E\\big[\\underline{\\quad\\quad}\\mid s_t=s\\big]$. Use symbols or words."
    accept: [G_t, "G_{t}", Gt, Gₜ, G, return, discounted return, return from time t, G(t)]
    regex: '^\s*(?:g(?:\s*_?\s*(?:\{\s*t\s*\}|t|ₜ)|\s*\(\s*t\s*\))?|(?:the\s+)?(?:discounted\s+)?return(?:\s+(?:(?:from|at|starting\s+at)\s+(?:(?:time|step)\s+)?t|g\s*_?\s*(?:\{\s*t\s*\}|t|ₜ)))?|(?:the\s+)?(?:sum\s+of\s+(?:the\s+)?)?discounted\s+future\s+rewards)\s*$'
    solution: "$V^\\pi(s)=E\\big[G_t\\mid s_t=s\\big]$: the expected return, given that the agent is in state $s$."
  - id: vf-recall-action-value-say
    dimension: conceptual
