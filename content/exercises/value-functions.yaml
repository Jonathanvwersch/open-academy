  - id: vf-recall-action-value-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: vf-action-value
    difficulty: 1
    est_minutes: 0.5
    prompt: "Action $a$ in state $s$ always gives reward $r$ and lands in state $s'$, whose value under policy $\\pi$ is $v$. With discount factor $\\gamma$, write $Q^\\pi(s,a)$. Type `gamma` for $\\gamma$."
    answer: "r + gamma*v"
    variables: { r: [-5, 10], gamma: [0.1, 0.95], v: [-10, 10] }
    solution: "$Q^\\pi(s,a)=r+\\gamma V^\\pi(s')=r+\\gamma v$."
  - id: vf-recall-bellman-expectation-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: vf-bellman-expectation
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what does the Bellman expectation equation say about $V^\\pi(s)$, and what is one Bellman backup?"
    rubric:
      - id: equation
        criterion: Explain that a state's value is the expected reward for one step plus the discounted value of the next state, averaged over the policy's actions and the possible next states.
        weight: 1
        required: true
      - id: backup
        criterion: Explain that a Bellman backup puts the current estimates into the right-hand side to get a new estimate for one state.
        weight: 1
        required: true
      - id: converge
        criterion: Mention that repeating backups for every state brings the estimates to $V^\pi$ when $\gamma<1$.
        weight: 1
    exemplar: "The Bellman expectation equation says $V^\\pi(s)$ is the expected one-step reward plus the discounted value of the next state, averaged over what the policy and moves can do. A Bellman backup puts current estimates into that right-hand side to get a new estimate for one state."
  - id: vf-recall-bellman-expectation-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: vf-bellman-expectation
    difficulty: 2
    est_minutes: 0.5
    prompt: "At one state, moving right has a higher action value than moving left. The policy chooses right 80% of the time and left 20% of the time. Where does the Bellman expectation equation put the state's value?"
    options:
      - id: a
        text: "Between the two action values, closer to right"
        correct: true
        feedback: "The equation averages both moves using the policy's probabilities, so right has more weight."
      - id: b
        text: "Between the two action values, halfway between them"
        correct: false
        feedback: "A halfway value gives the moves equal weight. This policy chooses right more often."
      - id: c
        text: "At the value of moving right"
        correct: false
        feedback: "Taking the larger value ignores the times the policy moves left. The expectation equation uses both actions."
      - id: d
        text: "Between the two action values, closer to left"
        correct: false
        feedback: "That would give left more weight, even though the policy picks it less often."
    solution: "The state's value is 80% of the right action value plus 20% of the left action value, so it lies closer to right."
  - id: vf-recall-bellman-expectation-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: vf-bellman-expectation
    difficulty: 2
    est_minutes: 0.5
    prompt: "A policy moves right with probability $p$ and left with probability $1-p$, and moves always work. Each move earns $-1$. Moving right lands in a state with estimate $x$, and moving left lands in a state with estimate $y$. With discount factor $\\gamma$, write the new estimate of this state's value under the policy. Type `gamma` for $\\gamma$."
    answer: "p*(-1 + gamma*x) + (1-p)*(-1 + gamma*y)"
    variables: { p: [0.05, 0.95], gamma: [0.1, 0.95], x: [-10, 10], y: [-10, 10] }
    solution: "Average the one-step look-aheads with the policy's probabilities: $p(-1+\\gamma x)+(1-p)(-1+\\gamma y)$."
  - id: vf-recall-bellman-optimality-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: vf-bellman-optimality
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what is the optimal state value $V^*(s)$, and how does the Bellman optimality equation calculate it from the next states?"
    rubric:
      - id: meaning
        criterion: "Explain that $V^*(s)$ is the largest expected return any policy can get from $s$."
        weight: 1
        required: true
      - id: max
        criterion: "Explain that for each action we average $r+\\gamma V^*(s')$ over the possible outcomes, then take the largest of those action values."
        weight: 1
        required: true
      - id: iteration
        criterion: "Mention that repeating these backups for every state is called value iteration."
        weight: 1
    exemplar: "$V^*(s)$ is the largest expected return any policy can get from $s$. For each action, average $r+\\gamma V^*(s')$ over its outcomes, then take the largest of those averages."
  - id: vf-recall-bellman-optimality-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: vf-bellman-optimality
    difficulty: 2
    est_minutes: 0.5
    prompt: "You know $V^*$ for every state in a corridor. How can you use it to choose the best next move from cell 2, where each move leads to a known cell?"
    options:
      - id: a
        text: "Pick the move with the largest $r+\\gamma V^*(s')$"
        correct: true
        feedback: "The best move accounts for the reward it earns and the value of where it leads."
      - id: b
        text: "Pick the move with the largest $V^*(s')$"
        correct: false
        feedback: "The next state's value counts later rewards. You also need the reward for getting there."
      - id: c
        text: "Pick the move with the largest immediate reward $r$"
        correct: false
        feedback: "The immediate reward misses what the robot can earn after the move."
      - id: d
        text: "Pick the move with the largest $\\pi(a\\mid s)$"
        correct: false
        feedback: "That follows a given policy's most likely action. The policy may choose a move with a lower action value."
    solution: "For each move, compute $Q^*(s,a)=r+\\gamma V^*(s')$ and pick the move with the largest value."
  - id: vf-recall-bellman-optimality-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: vf-bellman-optimality
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the blank in the Bellman optimality equation: $V^*(s)=\\underline{\\quad\\quad}\\;E\\big[r+\\gamma V^*(s')\\big]$. Type the missing operation."
    accept:
      [
        max,
        maximum,
        max_a,
        "max_{a}",
        '\max_{a}',
        max over a,
        max over all actions,
        take the largest over actions,
      ]
    regex: "^\\s*(?:(?:(?:the\\s+)?\\\\?max(?:imum)?(?:\\s*_\\s*(?:\\{\\s*a\\s*\\}|a)|\\s+(?:(?:over|across|of|among)\\s+)?(?:a|(?:all\\s+(?:the\\s+)?)?actions?))?|(?:take\\s+)?(?:the\\s+)?(?:largest|highest|greatest)(?:\\s+value)?(?:\\s+(?:over|across|among)\\s+(?:a|(?:all\\s+)?actions))?))\\s*$"
    solution: "$V^*(s)=\\max_a E\\big[r+\\gamma V^*(s')\\big]$: the value of the best action."
