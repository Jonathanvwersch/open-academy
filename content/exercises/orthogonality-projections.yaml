        correct: false
        category: misunderstood_definition
        feedback: The fitted values come from `A @ x_hat` after the fit.
      - id: b
        text: The least-squares solution $\hat x$, one entry per column of $A$.
        correct: true
        feedback: The first result is $\hat x$. The others are an array holding the sum of squared errors, the rank and one more array.
      - id: c
        text: The error vector $b-A\hat x$, one entry for each row of $A$.
        correct: false
        category: misunderstood_definition
        feedback: The errors come from `b - A @ x_hat` after the fit.
      - id: d
        text: The sum of squared errors of the best fit, as one number.
        correct: false
        category: recall_failure
        feedback: The sum of squared errors is in the second result, an array with one entry when $A$ has more rows than columns and full rank.
    solution: The first result is the least-squares solution $\hat x$. Then come an array holding the sum of squared errors, the rank of $A$ and one more array.
  - id: orthp-numpy-self-explain
    lesson_only: true
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked example's code, why does the last line check `np.allclose(A.T @ e, 0)` instead of `A.T @ e == 0`?
    options:
      - id: a
        text: "NumPy leaves tiny rounding errors such as $2\\times10^{-16}$, so an exact test can fail."
        correct: true
        feedback: Computers store most decimals approximately, so exact zeros become tiny numbers.
      - id: b
        text: "The `==` operator can't compare a NumPy array with a single number at all."
        correct: false
        category: implementation_error
        feedback: "`==` compares each entry with the number and gives an array of True and False."
      - id: c
        text: "`np.allclose` also checks that `e` is the shortest possible error vector."
        correct: false
        category: implementation_error
        feedback: "`np.allclose` only checks that numbers are nearly equal."
      - id: d
        text: "`A.T @ e` should be close to `b`, and `np.allclose` measures that gap."
        correct: false
        category: misunderstood_definition
        feedback: The error is orthogonal to every column, so `A.T @ e` should be zero.
    solution: The exact answer is zero, but NumPy gets numbers like $2\times10^{-16}$ from rounding. `np.allclose` treats those as equal to zero.
  - id: orthp-code-solve
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: "`A` is a NumPy array with 5 rows and 2 columns, and `b` has 5 entries. What happens when you run `np.linalg.solve(A, b)`?"
    options:
      - id: a
        text: It returns the least-squares solution, just as `lstsq` would.
        correct: false
        category: implementation_error
        feedback: "`solve` only handles square matrices with an inverse. Use `lstsq` for a tall matrix."
      - id: b
        text: It stops with an error, because `solve` needs a square matrix.
        correct: true
        feedback: A $5\times2$ matrix isn't square, so `solve` raises an error.
      - id: c
        text: It solves the first two rows exactly and ignores the rest.
        correct: false
        category: implementation_error
        feedback: "`solve` doesn't drop rows. It refuses a matrix that isn't square."
      - id: d
        text: It returns a solution with 5 entries, one for each row.
        correct: false
        category: misunderstood_definition
        feedback: The unknowns match the columns, so any solution would have 2 entries. Here `solve` raises an error.
    solution: "`np.linalg.solve` needs a square matrix with an inverse, so a $5\\times2$ `A` gives an error. `np.linalg.lstsq` finds the least-squares solution."
  - id: orthp-code-fitted
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: This code fits $y=c+mt$ to the points $(0,1)$, $(1,2)$ and $(2,6)$. What number does it print, to two decimal places?
    code: |
      import numpy as np
      A = np.array([[1, 0], [1, 1], [1, 2]])
      b = np.array([1, 2, 6])
      x_hat, sse, rank, _ = np.linalg.lstsq(A, b, rcond=None)
      print((A @ x_hat)[2])
    answer: 5.5
    tolerance:
      abs: 0.01
    common_wrong:
      - answer: 6
        category: misunderstood_definition
        feedback: That is the measured $y$ at $t=2$. The code prints the fitted value there.
      - answer: 2.5
        category: implementation_error
        feedback: That is the slope $m$. `(A @ x_hat)[2]` is the fitted value for the third point.
    solution: The fit is $c=0.5$ and $m=2.5$, and `(A @ x_hat)[2]` is the fitted value at $t=2$, $0.5+2.5\times2=5.5$.
  - id: orthp-outlier-weight
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: In a least-squares fit, one point has an error of {{=k}} and every other point has an error of $1$. How many errors of $1$ add up to the same amount as the one error of {{=k}} in the sum of squared errors?
    params:
      k:
        min: 3
        max: 9
    answer_expr: k^2
    tolerance:
      abs: 0.001
    common_wrong:
      - answer_expr: k
        category: misunderstood_definition
        feedback: Least squares adds squared errors, so the error of {{=k}} counts as ${{=k}}^2$.
      - answer_expr: 2 * k
        category: math_error
        feedback: Squaring multiplies a number by itself, ${{=k}}\times{{=k}}$.
    solution: The squared errors are ${{=k}}^2={{=k*k}}$ and $1^2=1$, so the one big error counts as much as {{=k*k}} errors of $1$.
  - id: orthp-same-time
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: You fit $y=c+mt$ to five readings that were all taken at $t=3$, so every row of `A` is `[1, 3]`. What does `np.linalg.lstsq` report?
    options:
      - id: a
        text: Rank $1$, because the columns are dependent and many lines fit equally well.
        correct: true
        feedback: Column 2 is three times column 1, so $A^\top A$ has no inverse and the best line isn't unique.
      - id: b
        text: An error, because the normal equations have no solution here.
        correct: false
        category: implementation_error
        feedback: "`lstsq` still returns an answer, the one with the shortest $\\hat x$, and reports the low rank."
      - id: c
        text: Rank $2$, with one best line through the average reading.
        correct: false
        category: misunderstood_definition
        feedback: The two columns are multiples of each other, so the rank is $1$ and many lines fit equally well.
      - id: d
        text: Rank $5$, one for each reading, with every error zero.
        correct: false
        category: misunderstood_definition
        feedback: The rank can't exceed the number of columns, $2$. Here it is $1$.
    solution: Every row is $(1,3)$, so column 2 is three times column 1 and the rank is $1$. Every line through the average reading at $t=3$ fits equally well, and `lstsq` returns one of them.
  - id: orthp-outlier
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A line is fitted by least squares to 20 sensor readings. One reading is a glitch, 50 units away from where the others suggest. Why can this one reading move the fitted line a lot?
    options:
      - id: a
        text: Its error is squared, so it can outweigh all the other errors and pull the line towards it.
        correct: true
        feedback: An error of 50 adds 2500 to the sum, so the best line tilts to shrink it.
      - id: b
        text: Least squares counts each reading's error once, so the glitch can shift the line by about a twentieth.
        correct: false
        category: incorrect_reasoning
        feedback: Errors are squared before adding, so large errors count far more than small ones.
      - id: c
        text: Least squares leaves out readings far from the rest, so the line is fitted to too few points.
        correct: false
        category: misunderstood_definition
        feedback: Least squares uses every reading. Nothing is left out automatically.
      - id: d
        text: Squaring makes its error negative, so it cancels the errors of the other readings.
        correct: false
        category: math_error
        feedback: A square is never negative. Squaring makes the glitch's error count more.
    solution: Least squares adds squared errors, so an error of 50 contributes 2500. Making that one error smaller can lower the sum more than keeping the other errors small, so the line tilts towards the glitch.
  - id: orthp-code-projection
    dimension: transfer
    type: code_read
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "This code works with vectors that have three entries. `np.linalg.norm(v)` gives the length of a vector `v`. What does it print, to two decimal places?"
    code: |
      import numpy as np
      x = np.array([3, 1, 2])
      u = np.array([1, 1, 0])
      p = (u @ x) / (u @ u) * u
      print(np.linalg.norm(x - p))
    answer: 2.45
    tolerance:
      abs: 0.01
    common_wrong:
      - answer: 2.83
        tolerance:
          abs: 0.01
        category: implementation_error
        feedback: That is the length of `p`, the projection. The code prints the length of the leftover `x - p`.
      - answer: 3.74
        tolerance:
          abs: 0.01
        category: implementation_error
        feedback: That is the length of `x`. The code prints the length of the leftover `x - p`.
    solution: "`u @ x` is $4$ and `u @ u` is $2$, so `p` is $2u=(2,2,0)$. The leftover is $(1,-1,2)$, with length $\\sqrt6\\approx2.45$."
  - id: orth-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "When $Ax=b$ has no solution, explain why the best $\\hat x$ leaves an error $b-A\\hat x$ orthogonal to every column of $A$, how that gives the normal equations, and what $\\hat x$ makes as small as possible."
    rubric:
      - id: r1
        criterion: Explain that $A\hat x$ is the point in the column space of $A$ closest to $b$, so the error $b-A\hat x$ is orthogonal to every column, just as a projection onto a line leaves a leftover orthogonal to the line.
        weight: 1
        required: true
      - id: r2
        criterion: Explain that $A^\top(b-A\hat x)$ dots every column with the error, so setting it to zero and rearranging gives $A^\top A\hat x=A^\top b$.
        weight: 1
        required: true
      - id: r3
        criterion: Explain that $\hat x$ makes the sum of squared errors as small as possible.
        weight: 1
        required: true
      - id: r4
        criterion: Mention that `np.linalg.lstsq` finds $\hat x$ in NumPy.
        weight: 1
        required: false
    exemplar: "Every $Ax$ lies in the column space of $A$, so the best we can do is the point $A\\hat x$ in it closest to $b$. Like a projection onto a line, the closest point leaves an error $b-A\\hat x$ orthogonal to every column. $A^\\top(b-A\\hat x)$ dots every column with the error, so it is zero, and rearranging gives the normal equations $A^\\top A\\hat x=A^\\top b$. The solution $\\hat x$ makes the sum of squared errors as small as possible."
