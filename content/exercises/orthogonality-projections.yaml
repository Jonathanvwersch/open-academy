  - id: orth-recall-least-squares-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: orth-least-squares
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: For a least-squares line $y=c+mt$, what errors are squared?
    options:
      - id: a
        text: The shortest distances from points to the line.
        correct: false
        feedback: Each error is measured straight up or down, in $y$ at the point's own $t$. The shortest distance to the line is usually slanted.
      - id: b
        text: The horizontal gaps between points and the line.
        correct: false
