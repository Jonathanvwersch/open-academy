  - id: orth-recall-line-projection-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: orth-line-projection
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the denominator for nonzero $u$: $p=\\dfrac{u^\\top x}{\\underline{\\quad\\quad}}u$."
    accept:
      - u^T u
      - u^T*u
      - u^\top u
      - u^{\top}u
      - u^top u
      - u.T @ u
      - dot(u,u)
      - u dot u
      - "||u||^2"
      - norm(u)^2
      - the squared length of u
      - squared length of u
      - u’s length squared
      - u's length squared
      - uᵀu
      - uᵀ u
      - u @ u
      - u·u
      - u*u
      - \|u\|^2
      - u dot itself
      - the dot product of u with itself
      - "‖u‖^2"
      - ‖u‖²
      - "||u||²"
    regex: ^\s*(?:u\s*\^\s*\{?\s*\\?(?:t|top)\s*\}?\s*(?:\*|\\cdot)?\s*u|u\s*\.\s*t\s*@\s*u|(?:dot\s*\(\s*u\s*,\s*u\s*\)|u\s+dot\s+u)|\|\|\s*u\s*\|\|\s*\^\s*\{?2\}?|norm\s*\(\s*u\s*\)\s*\^\s*2|(?:the\s+)?squared\s+length\s+of\s+u|u[’\x27]s\s+length\s+squared)\s*$
    solution: Divide by $u^\top u=\|u\|^2$, the squared length of $u$.
  - id: orth-recall-orthogonal-matrices-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: orth-orthogonal-matrices
