  - id: orth-recall-orthogonal-matrices-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: orth-orthogonal-matrices
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the blank for an orthogonal matrix $Q$: $Q^{-1}=\\underline{\\quad\\quad}$."
