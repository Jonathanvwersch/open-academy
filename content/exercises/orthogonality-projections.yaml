      - Qᵀ
      - Q transpose
      - transposed Q
    regex: ^\s*(?:q\s*\^\s*\{?\s*\\?(?:t|top)\s*\}?|q\s*\.\s*t|(?:the\s+)?transpose\s+of\s+q|transpose\s*\(\s*q\s*\))\s*$
