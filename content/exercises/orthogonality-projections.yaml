  - id: orth-recall-least-squares-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: orth-least-squares
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the right-hand side of the normal equations: $A^\\top A\\hat x=\\underline{\\quad\\quad}$."
    accept:
      - A^T b
      - A^T*b
      - A^\top b
      - A^{\top}b
      - A^top b
      - A.T @ b
      - transpose(A)b
      - transpose(A)*b
      - Aᵀb
      - Aᵀ b
      - A transpose times b
    regex: ^\s*(?:a\s*\^\s*\{?\s*\\?(?:t|top)\s*\}?\s*(?:\*|\\cdot)?\s*b|a\s*\.\s*t\s*@\s*b|transpose\s*\(\s*a\s*\)\s*\*?\s*b)\s*$
    solution: The error is orthogonal to each column, giving $A^\top A\hat x=A^\top b$.
  - id: orth-recall-numpy-fits-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: orth-numpy-fits
