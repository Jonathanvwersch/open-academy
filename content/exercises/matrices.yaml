concept: matrices
exercises:
  - id: matp-shape
    dimension: math
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A matrix has shape $2\\times3$ and another has shape $3\\times4$. What is the shape of their product in that order?"
    solution: "Each of two left rows meets each of four right columns. This gives two rows and four columns of outputs."
    options:
      - {
          id: a,
          text: "$2\\times4$",
          correct: true,
          feedback: "The inner threes match; the outer counts remain.",
        }
      - {
          id: b,
          text: "$3\\times3$",
          correct: false,
          feedback: "The matching inner counts do not become the output shape.",
        }
      - {
          id: c,
          text: "$4\\times2$",
          correct: false,
          feedback: "Keep the left row count first and the right column count second.",
        }
  - id: matp-entry-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "The second row of $A$ is $({{=a}},{{=b}})$ and the first column of $B$ is $({{=c}},{{=d}})$. What is the entry in row 2, column 1 of $AB$?"
    solution: "Dot the selected row with the selected column: ${{=a}}\\cdot{{=c}}+({{=b}})\\cdot{{=d}}={{=a*c+b*d}}$. One row-column pair produces one output entry."
    tolerance: { abs: 0.000001 }
    params:
      a: { min: 1, max: 5 }
      b: { min: -3, max: 3 }
      c: { min: 1, max: 4 }
      d: { min: 1, max: 4 }
    answer_expr: "a*c+b*d"

  - id: matp-vector
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A matrix has three rows and two columns. It multiplies a two-entry column vector. What comes out?"
    solution: "The shapes are $(3\\times2)(2\\times1)$, giving $3\\times1$. There is one output entry per matrix row."
    options:
      - {
          id: a,
          text: "A column vector with three entries",
          correct: true,
          feedback: "Each matrix row produces one dot product.",
        }
      - {
          id: b,
          text: "A column vector with two entries",
          correct: false,
          feedback: "The input entry count is not the output entry count.",
        }
      - {
          id: c,
          text: "A single number from all six entries",
          correct: false,
          feedback: "Each row gives its own number, rather than one total for the matrix.",
        }
  - id: matp-invalid
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why can't a $2\\times3$ matrix multiply a $2\\times4$ matrix in that order, even though both have two rows?"
    solution: "Each left row has three entries but each right column has two. Their dot product is undefined, so this matrix product is undefined."
    options:
      - {
          id: a,
          text: "No, the inner counts 3 and 2 differ",
          correct: true,
          feedback: "A three-entry row cannot dot a two-entry column.",
        }
      - {
          id: b,
          text: "Yes, the two row counts match",
          correct: false,
          feedback: "Multiplication matches left columns with right rows, not both row counts.",
        }
      - {
          id: c,
          text: "Yes, the result has shape 3 by 4",
          correct: false,
          feedback: "An output shape is valid only after the inner counts match.",
        }
  - id: matp-entry
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $A=\\begin{bmatrix}2&0&1\\\\1&3&-1\\end{bmatrix}$ and $B=\\begin{bmatrix}1&2\\\\0&1\\\\4&0\\end{bmatrix}$, what is entry (row 2, column 1) of $AB$?"
    solution: "Use row two $(1,3,-1)$ and column one $(1,0,4)$. Their dot product is $1\\cdot1+3\\cdot0+(-1)\\cdot4=1+0-4=-3$."
    tolerance: { abs: 0.000001 }
    answer: -3

  - id: matp-batch-shape
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Five houses each have three features. Their $5\\times3$ table multiplies a $3\\times2$ weight table. What does the result hold?"
    solution: "The inner feature count three matches, giving shape $5\\times2$. This is two scores for each of five houses."
    options:
      - {
          id: a,
          text: "Five house rows with two scores each",
          correct: true,
          feedback: "Each house row meets both weight columns.",
        }
      - {
          id: b,
          text: "Three feature rows with three scores each",
          correct: false,
          feedback: "Features are summed over, not retained as output rows.",
        }
      - {
          id: c,
          text: "Two house rows with five scores each",
          correct: false,
          feedback: "The left rows remain rows, not output columns.",
        }
  - id: matp-linear
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Which property describes a matrix acting as a linear transformation?"
    solution: "A linear transformation preserves addition and scaling, so it treats combined moves consistently. It need not preserve their lengths."
    options:
      - {
          id: a,
          text: "Adding moves before or after transforming agrees",
          correct: true,
          feedback: "The transformation preserves vector addition and scaling.",
        }
      - {
          id: b,
          text: "Every move keeps exactly the same length",
          correct: false,
          feedback: "Stretching is linear even though it changes lengths.",
        }
      - {
          id: c,
          text: "The origin can move to any chosen point",
          correct: false,
          feedback: "A matrix alone sends the zero vector to zero.",
        }
  - id: matp-shear-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A shear sends $(x,y)$ to $(x+2y,y)$. For the floor point $({{=x}},{{=y}})$, what is the new horizontal coordinate?"
    solution: "Add twice the height to the horizontal coordinate: ${{=x}}+2\\cdot{{=y}}={{=x+2*y}}$. The vertical coordinate stays ${{=y}}$."
    tolerance: { abs: 0.000001 }
    params:
      x: { min: -3, max: 5 }
      y: { min: 0, max: 4 }
    answer_expr: "x+2*y"

  - id: matp-identity
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "What does $I=\\begin{bmatrix}1&0\\\\0&1\\end{bmatrix}$ do to $(3,-2)$?"
    solution: "The rows give $1\\cdot3+0\\cdot(-2)=3$ and $0\\cdot3+1\\cdot(-2)=-2$. Identity leaves every input unchanged."
    options:
      - {
          id: a,
          text: "Leaves it at $(3,-2)$",
          correct: true,
          feedback: "Each row picks out the matching input entry.",
        }
      - {
          id: b,
          text: "Swaps it to $(-2,3)$",
          correct: false,
          feedback: "A swap matrix has ones off the diagonal instead.",
        }
      - {
          id: c,
          text: "Sends it to $(0,0)$",
          correct: false,
          feedback: "That would require all-zero rows, not diagonal ones.",
        }
  - id: matp-why-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why can't you assume $ABx=BAx$ when both matrix products exist?"
    solution: "The second transformation receives the first one's output. For a shear $A$ sending $(x,y)$ to $(x+2y,y)$ and a swap $B$, input $(1,0)$ gives $ABx=(2,1)$ but $BAx=(0,1)$."
    options:
      - {
          id: a,
          text: "Swapping the order changes the input received by the second transformation",
          correct: true,
          feedback: "A shear after a swap need not agree with a swap after a shear.",
        }
      - {
          id: b,
          text: "The products must agree whenever the matrices are square",
          correct: false,
          feedback: "Square shapes let both orders exist; they do not make the transformations agree.",
        }
      - {
          id: c,
          text: "Both orders just multiply corresponding entries, so order cannot matter",
          correct: false,
          feedback: "That describes elementwise multiplication. Matrix multiplication takes row-column dot products and composes transformations.",
        }
  - id: matp-shear
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A floor shear maps $(x,y)$ to $(x+2y,y)$. What happens to points on the horizontal axis?"
    solution: "On the horizontal axis, $y=0$. The output is $(x+2\\cdot0,0)=(x,0)$, so every such point stays fixed."
    options:
      - {
          id: a,
          text: "They stay fixed because their height is zero",
          correct: true,
          feedback: "With y equal to zero, the added horizontal amount is zero.",
        }
      - {
          id: b,
          text: "They all move two units to the right",
          correct: false,
          feedback: "The shift is twice the height, not a fixed two units.",
        }
      - {
          id: c,
          text: "They all move onto the vertical axis",
          correct: false,
          feedback: "The shear keeps height fixed and does not swap coordinates.",
        }
  - id: matp-swap
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Let $C=\\begin{bmatrix}1&2\\\\3&4\\end{bmatrix}$ and $P=\\begin{bmatrix}0&1\\\\1&0\\end{bmatrix}$. Which describes $CP$?"
    solution: "Each row dots the columns $(0,1)$ then $(1,0)$ of P. This reverses the two entries of each row, swapping columns."
    options:
      - {
          id: a,
          text: "Its columns swap, giving $\\begin{bmatrix}2&1\\\\4&3\\end{bmatrix}$",
          correct: true,
          feedback: "Right multiplication by P selects the second column first.",
        }
      - {
          id: b,
          text: "Its rows swap, giving $\\begin{bmatrix}3&4\\\\1&2\\end{bmatrix}$",
          correct: false,
          feedback: "That is PC, with the swap matrix on the left.",
        }
      - {
          id: c,
          text: "Its entries stay at $\\begin{bmatrix}1&2\\\\3&4\\end{bmatrix}$",
          correct: false,
          feedback: "P is a swap matrix, not the identity.",
        }
  - id: matp-code
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In NumPy, X has shape (5, 3), W has shape (3, 2) and b has shape (2,). Which line gives two biased scores for every house?"
    solution: "X rows dot W columns, giving shape (5, 2). Adding b broadcasts one bias per score across all five houses."
    options:
      - {
          id: a,
          text: "`Y = X @ W + b`",
          correct: true,
          feedback: "The product has shape (5, 2), and the two biases repeat across rows.",
        }
      - {
          id: b,
          text: "`Y = W @ X + b`",
          correct: false,
          feedback: "The inner counts two and five do not match in that order.",
        }
      - {
          id: c,
          text: "`Y = X @ W.T + b`",
          correct: false,
          feedback: "W.T has shape (2, 3), so its row count does not match X columns.",
        }
  - id: matp-bias-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A house row is $({{=a}},{{=b}})$, one weight column is $(2,-1)$, and its bias is {{=c}}. What is the biased score?"
    solution: "First take the dot product: $2\\cdot{{=a}}-{{=b}}={{=2*a-b}}$. Add the bias to get ${{=2*a-b}}+({{=c}})={{=2*a-b+c}}$."
    tolerance: { abs: 0.000001 }
    params:
      a: { min: 1, max: 8 }
      b: { min: 1, max: 5 }
      c: { min: -2, max: 4 }
    answer_expr: "2*a-b+c"

  - id: matp-transpose
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Weights are stored as three score rows with two features each, shape (3, 2). House rows have shape (5, 2). Which product gives the scores?"
    solution: "Transpose swaps the weight rows into columns without changing their values. Then (5, 2) times (2, 3) gives (5, 3)."
    options:
      - {
          id: a,
          text: "`X @ W.T`, with shape (5, 3)",
          correct: true,
          feedback: "Transposing makes W shape (2, 3), matching the two features.",
        }
      - {
          id: b,
          text: "`X @ W`, with shape (5, 3)",
          correct: false,
          feedback: "Without transposing, the inner counts two and three differ.",
        }
      - {
          id: c,
          text: "`X.T @ W`, with shape (2, 2)",
          correct: false,
          feedback: "The inner counts five and three differ in that product.",
        }
  - id: matp-broadcast
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A NumPy product has shape (5, 2), and you add b with shape (2,). What does broadcasting do?"
    solution: "NumPy reuses the two bias entries across the five rows. The output shape stays (5, 2)."
    options:
      - {
          id: a,
          text: "Adds the two biases to every row",
          correct: true,
          feedback: "Each score column receives its matching bias for every house.",
        }
      - {
          id: b,
          text: "Adds two new columns to every row",
          correct: false,
          feedback: "Bias addition changes values, not the number of score columns.",
        }
      - {
          id: c,
          text: "Adds biases only to the first row",
          correct: false,
          feedback: "The shorter array is reused for all five rows.",
        }
  - id: matp-why-batch
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why use `X @ W` instead of a Python loop of separate house-score dot products, and why isn't `X * W` a substitute?"
    solution: "A loop can compute the same scores, but `@` groups the row-column dot products for efficient numerical-library execution. For X row $(4,1)$ and W column $(0.5,2)$, the score is $4\\cdot0.5+1\\cdot2=4$. Elementwise multiplication does not sum those contributions."
    options:
      - {
          id: a,
          text: "`@` groups the same dot products efficiently; `*` does not sum feature contributions",
          correct: true,
          feedback: "The loop is mathematically valid, but `@` handles the repeated house-score calculation in the library.",
        }
      - {
          id: b,
          text: "A loop cannot compute these scores correctly, regardless of how it is written",
          correct: false,
          feedback: "Correctly written loops give the same scores. The benefit is organised, efficient execution, not different mathematics.",
        }
      - {
          id: c,
          text: "`*` gives the same scores as `@` whenever both arrays are square",
          correct: false,
          feedback: "Square shapes do not change the operations: `*` multiplies corresponding entries without summing across features.",
        }
  - id: matp-transpose-product
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A has shape $2\\times3$ and B has shape $3\\times4$. Which is $(AB)^\\top$?"
    solution: "The product AB has shape two by four, so its transpose is four by two. Reversing the transposed factors gives (4 by 3)(3 by 2), the correct order and shape."
    options:
      - {
          id: a,
          text: "$B^\\top A^\\top$, shape $4\\times2$",
          correct: true,
          feedback: "Transpose reverses the order as well as swapping each shape.",
        }
      - {
          id: b,
          text: "$A^\\top B^\\top$, shape $4\\times2$",
          correct: false,
          feedback: "These factors have shapes three by two and four by three, so their inner counts differ.",
        }
      - {
          id: c,
          text: "$AB$, still with shape $2\\times4$",
          correct: false,
          feedback: "Transpose swaps the output rows and columns.",
        }
  - id: mat-explain-batch
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "Explain how a matrix turns a vector into new coordinates, then how NumPy can compute two weighted scores for each of five houses with three features. State the weight and output shapes, and explain adding one bias per score."
    rubric:
      - {
          id: rows,
          criterion: "Each output coordinate is a matrix row dotted with the input; this linear transformation preserves addition and scaling",
          weight: 2,
          required: true,
        }
      - {
          id: shapes,
          criterion: "For X shape (5, 3), W has shape (3, 2) and X @ W has shape (5, 2), with matching inner feature counts",
          weight: 2,
          required: true,
        }
      - {
          id: bias,
          criterion: "A bias of shape (2,) is broadcast across the five house rows in X @ W + b",
          weight: 1,
        }
    exemplar: "A matrix produces one dot product per row when acting on a column vector, transforming its coordinates while preserving addition and scaling. For five house rows with three features, X has shape (5, 3) and W needs shape (3, 2), so each house row dots two weight columns to produce shape (5, 2). In X @ W + b, the two-entry bias is reused across all five rows, adding one fixed amount per score."
    solution: "Rows and columns specify which dot products to take, and matching inner counts make those dot products possible. Broadcasting adds a bias to each score without changing the output shape."
  - id: mat-check-shape
    dimension: math
    type: mc
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: "$A$ has shape $128 \\times 512$ and $B$ has shape $512 \\times 64$. What is the shape of $AB$?"
    options:
      - { id: a, text: "$128 \\times 64$", correct: true }
      - {
          id: b,
          text: "$512 \\times 512$",
          correct: false,
          category: misunderstood_definition,
          feedback: "The inner dimension (512) disappears. The outer dimensions remain.",
        }
      - { id: c, text: "$64 \\times 128$", correct: false, category: misunderstood_definition }
      - {
          id: d,
          text: "Undefined",
          correct: false,
          category: misunderstood_definition,
          feedback: "The inner dimensions (512 and 512) match, so the product is defined.",
        }
    solution: "$(128\\times512)(512\\times64) = 128\\times64$."
  - id: dx-math-2
    dimension: math
    type: mc
    role: diagnostic
    difficulty: 1
    est_minutes: 1
    prompt: "A batch of images is flattened to $X \\in \\mathbb{R}^{32 \\times 784}$ and multiplied by a weight matrix $W \\in \\mathbb{R}^{784 \\times 10}$. What is the shape of $XW$?"
    options:
      - { id: a, text: "$32 \\times 10$", correct: true }
      - { id: b, text: "$784 \\times 784$", correct: false, category: misunderstood_definition }
      - { id: c, text: "$10 \\times 32$", correct: false, category: misunderstood_definition }
      - { id: d, text: "Undefined", correct: false, category: misunderstood_definition }
    solution: "Inner dimensions 784 match and the outer ones remain: $32 \\times 10$, i.e. 10 scores for each of the 32 images."
  - id: mat-product-entry
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: |
      $$A = \begin{pmatrix}2 & 0 & 1\\ 1 & 3 & -1\end{pmatrix}, \qquad B = \begin{pmatrix}1 & 2\\ 0 & 1\\ 4 & 0\end{pmatrix}$$
      What is the entry in row 2, column 1 of $AB$?
    answer: -3
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 5,
          category: math_error,
          feedback: "Check the sign: the last term is $(-1)\\cdot 4$.",
        }
      - {
          answer: 6,
          category: misunderstood_definition,
          feedback: "That is row 1 · column 1. Row 2 of $A$ is $(1, 3, -1)$.",
        }
    hints:
      [
        "Row 2 of $A$ dotted with column 1 of $B$.",
        "Row 2 of $A$ is $(1, 3, -1)$; column 1 of $B$ is $(1, 0, 4)$.",
      ]
    solution: "$1\\cdot1 + 3\\cdot0 + (-1)\\cdot4 = -3$."
  - id: mat-code-read
    dimension: implementation
    type: code_read
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "What does this print? Write the output exactly as Python would."
    code: |
      import numpy as np
      X = np.ones((5, 3))
      W = np.arange(6).reshape(3, 2)
      out = X @ W
      print(out.shape, out[0, 1])
    accept: ["(5, 2) 9.0", "(5,2) 9.0", "(5, 2) 9", "(5,2) 9"]
    hints:
      [
        "`np.arange(6).reshape(3, 2)` is [[0, 1], [2, 3], [4, 5]].",
        "Each row of `X` is all ones, so `out[0, 1]` is the sum of column 1 of `W`.",
      ]
    solution: "Shape $(5,3)(3,2) \\to (5,2)$. Row 0 of `X` is all ones, so `out[0,1]` = 1 + 3 + 5 = 9.0 (a float because `np.ones` is float). Output: `(5, 2) 9.0`."
  - id: mat-complete-batch
    dimension: implementation
    type: code_complete
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "Complete the line so that `Y` holds the outputs of a linear layer for a whole batch. `X` has shape `(n, d)`, `W` has shape `(d, k)` and `b` has shape `(k,)`."
    code: |
      import numpy as np
      Y = ____
    accept: ["X @ W + b", "np.dot(X, W) + b", "np.matmul(X, W) + b", "X.dot(W) + b", "b + X @ W"]
    hints: ["Which order of `X` and `W` makes the inner dimensions match?"]
    solution: "`Y = X @ W + b`: $(n\\times d)(d \\times k) = n \\times k$, and `b` broadcasts across the `n` rows."
  - id: mat-review-order
    dimension: conceptual
    type: mc
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "$R$ rotates the plane by $90^\\circ$ and $S$ stretches the x-axis by a factor of 2. Is $SR\\,x$ (rotate, then stretch) always equal to $RS\\,x$ (stretch, then rotate)?"
    options:
      - {
          id: a,
          text: "No. Matrix multiplication is not commutative, and the order of transformations matters",
          correct: true,
        }
      - {
          id: b,
          text: "Yes. Both apply the same two transformations",
          correct: false,
          category: misunderstood_definition,
          feedback: "Try $x = (1, 0)$: rotate then stretch gives $(0, 1)$; stretch then rotate gives $(0, 2)$.",
        }
    solution: "With $x = (1,0)$: $SRx = S(0,1) = (0,1)$ but $RSx = R(2,0) = (0,2)$."
