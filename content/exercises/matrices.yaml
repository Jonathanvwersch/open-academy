concept: matrices
exercises:
  - id: lab-pca-numpy-coordinates
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: A batch contains 40 row vectors with 64 features each. Each vector is projected onto 3 retained directions. How many numbers are in the resulting coordinate matrix?
    answer: 120
    tolerance: { abs: 0 }
    common_wrong:
      - answer: 192
        category: incorrect_reasoning
        feedback: That counts entries in the direction matrix. The output has one row per example.
      - answer: 2560
        category: incorrect_reasoning
        feedback: That counts entries before projection. Each output row has three coordinates.
    solution: The coordinate matrix has 40 rows and 3 columns, so it contains $40\times3=120$ numbers.
  - id: mat-rows-shapes-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: What is a matrix?
    options:
      - id: a
        text: A rectangular grid of numbers with a shape given by rows, then columns.
        correct: true
        feedback: Rows and columns form a rectangular grid, and their counts determine its shape.
      - id: b
        text: An ordered list of numbers with one position for each measurement.
        correct: false
        feedback: That is a vector.
      - id: c
        text: A single number made by multiplying matching vector entries and adding them.
        correct: false
        feedback: That is a dot product.
      - id: d
        text: A rule that adds up every number in a table to give one single total.
        correct: false
        feedback: A matrix is the grid itself. Multiplying it by a vector gives one total per row, not one total overall.
    solution: A matrix is a rectangular grid of numbers; its shape lists the number of rows and then columns.
  - id: matp-rows-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked example, why does $Xw$ have 2 entries even though each house has 3 measurements?
    options:
      - id: a
        text: "$X$ has 2 rows, and each row's 3 products are added into one dot product: one price per house."
        correct: true
        feedback: The 3 measurements are used up inside each row's dot product; the 2 rows set the number of answers.
      - id: b
        text: Age has a negative weight, so its product cancels out and that entry is dropped from the answer.
        correct: false
        category: incorrect_reasoning
        feedback: A negative weight only lowers the sum; no entry is dropped. Each row still gives exactly one number.
      - id: c
        text: Only the first two weights are used, because $X$ has two rows and each row takes one weight.
        correct: false
        category: misunderstood_definition
        feedback: Every row uses all 3 weights, one for each of its measurements.
      - id: d
        text: The answer keeps one entry per column of $X$, and only two columns are paired with weights.
        correct: false
        category: misunderstood_definition
        feedback: All 3 columns are paired with weights. The answer has one entry per row, not per column.
    solution: "Each row of $X$ is dotted with all 3 weights, which adds its 3 products into one number. $X$ has 2 rows, so $Xw$ has 2 entries: 310 and 215."
  - id: matp-vector
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: A matrix has three rows and two columns. It multiplies a vector with two entries. What comes out?
    solution: The shapes are $(3\times2)(2\times1)$, giving $3\times1$. There is one output entry per matrix row.
    options:
      - id: a
        text: A vector with three entries, one for each row.
        correct: true
        feedback: Each matrix row produces one dot product.
      - id: b
        text: A vector with two entries, one for each column.
        correct: false
        feedback: The input entry count is not the output entry count.
      - id: c
        text: One number that combines all six of the entries.
        correct: false
        feedback: Each row gives its own number, rather than one total for the matrix.
  - id: matp-vector-shape
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: One house's three measurements are written as a $1\times3$ matrix and multiplied by the 3-entry weight vector. How many numbers come out?
    options:
      - id: a
        text: One price for that house.
        correct: true
        feedback: The matrix has one row, so there is one dot product.
      - id: b
        text: Three numbers, one for each measurement.
        correct: false
        category: misunderstood_definition
        feedback: The three products are added into one dot product, so they do not stay separate.
      - id: c
        text: Three numbers, one for each column of the matrix.
        correct: false
        category: misunderstood_definition
        feedback: Each row gives one output. The columns are added together inside that row's dot product.
      - id: d
        text: Nine numbers, one for each measurement and weight pair.
        correct: false
        category: misunderstood_definition
        feedback: Only matching entries are paired, and their 3 products are added together.
    solution: A $1\times3$ matrix has one row, and its dot product with the 3 weights gives one price.
  - id: matp-why-rows
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: Why does each row of a matrix produce exactly one output when the matrix multiplies a vector?
    options:
      - id: a
        text: Each row is dotted with the vector, and one dot product adds its products into one number.
        correct: true
        feedback: One row, one dot product, one number.
      - id: b
        text: Each column of the matrix is copied directly into the output.
        correct: false
        category: misunderstood_definition
        feedback: The output is built from rows dotted with the vector; no column is copied.
      - id: c
        text: All the matrix entries are added together first, then the vector is used.
        correct: false
        category: misunderstood_definition
        feedback: Each row is dotted with the vector separately, so rows are never mixed.
      - id: d
        text: The matrix's number of columns sets how many outputs there are.
        correct: false
        category: misunderstood_definition
        feedback: The columns must match the vector's length; the rows set the number of outputs.
    solution: Each row is dotted with the same vector, which multiplies matching entries and adds them into one number. So every row gives one output.
  - id: matp-vector-entry
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: A house has area 4 tens of square metres and 1 bedroom. A simplified model uses weights $(2,-1)$ thousand pounds per unit. What sale-price prediction does their matrix-vector product give, in thousands of pounds?
    solution: 'Multiply matching entries and add: $4\cdot2+1\cdot(-1)=8-1=7$.'
    answer: 7
    tolerance:
      abs: 1.0e-06
  - id: matp-vector-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      A house has two measurements $({{=u}},{{=v}})$, written as a $1\times2$ matrix, and the model's weights are $({{=a}},{{=b}})$. What single number does the matrix times the weight vector give?
    solution: 'Multiply matching entries and add: ${{=u}}\cdot{{=a}}+{{=v}}\cdot{{=b}}={{=u*a+v*b}}$.'
    tolerance:
      abs: 1.0e-06
    params:
      u:
        min: 1
        max: 10
      v:
        min: 1
        max: 5
      a:
        min: 1
        max: 4
      b:
        min: 1
        max: 3
    answer_expr: u*a+v*b
  - id: matp-recover-weight-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: A matrix of two measurements for two houses is $X=\begin{bmatrix}1&0\\{{=a}}&1\end{bmatrix}$. Multiplying it by a weight vector $w=(w_1,w_2)$ gives $Xw=({{=p}},{{=q}})$. What is $w_2$?
    params:
      a:
        min: 2
        max: 4
      p:
        min: 2
        max: 5
      q:
        min: 20
        max: 25
    answer_expr: q-a*p
    tolerance:
      abs: 0
    solution: |-
      Row 1 dotted with $w$ is $1\times w_1+0\times w_2=w_1$, so it gives $w_1$ directly. Put that into row 2 and subtract its contribution.

      $$w_1={{=p}}$$

      $${{=a}}w_1+w_2={{=q}}$$

      $$w_2={{=q}}-{{=a}}\times{{=p}}$$

      $$w_2={{=q-a*p}}$$
  - id: mat-matrix-products-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: What does multiplying two matrices produce?
    options:
      - id: a
        text: A matrix whose entries come from rows of the left matrix paired with rows of the right.
        correct: false
        feedback: Matrix multiplication pairs each left row with a right column to form one output entry.
      - id: b
        text: A matrix whose entries are dot products of rows and columns from the two input matrices.
        correct: true
        feedback: Each output entry comes from a dot product of one left row with one right column.
      - id: c
        text: A single number from multiplying matching entries of two vectors and adding them.
        correct: false
        feedback: That describes the dot product of vectors.
      - id: d
        text: A list of the entries that appear in both of the two matrices.
        correct: false
        feedback: A product doesn't look for shared entries; each output entry is one left row dotted with one right column.
    solution: A matrix product combines two number grids, with each output entry formed from a left row and right column.
  - id: matp-products-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked example, why does 1250 go in row 1, column 2 of $XW$?
    options:
      - id: a
        text: It is house 1's row of $X$ dotted with the rent weights in column 2 of $W$.
        correct: true
        feedback: The entry in row $i$, column $j$ always comes from row $i$ on the left and column $j$ on the right.
      - id: b
        text: It is row 1 of $X$ dotted with row 2 of $W$, the second weight row.
        correct: false
        category: misunderstood_definition
        feedback: Left rows are paired with right columns; row 2 of $W$ holds the bedroom weights for both outputs.
      - id: c
        text: It is the largest of the four answers, and larger answers go in the last column.
        correct: false
        category: incorrect_reasoning
        feedback: Position comes from which row and column were used, not from the size of the answer.
      - id: d
        text: It was computed from column 2 of $X$, the bedroom counts of both houses.
        correct: false
        category: misunderstood_definition
        feedback: The entry uses all of house 1's row, $(12,3,20)$, not one column of $X$.
    solution: Row 1 of $X$ is house 1 and column 2 of $W$ holds the rent weights. Their dot product, $12\cdot100+3\cdot50+20\cdot(-5)=1250$, goes in row 1, column 2.
  - id: matp-shape
    dimension: math
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: A matrix has shape $2\times3$ and another has shape $3\times4$. What is the shape of their product in that order?
    solution: Each of two left rows meets each of four right columns. This gives two rows and four columns of outputs.
    options:
      - id: a
        text: $2\times4$
        correct: true
        feedback: The inner threes match; the outer counts remain.
      - id: b
        text: $3\times3$
        correct: false
        feedback: The matching inner sizes are used up inside each dot product; the outer sizes give the shape.
      - id: c
        text: $4\times2$
        correct: false
        feedback: Keep the left row count first and the right column count second.
  - id: matp-invalid
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: Why can't a $2\times3$ matrix multiply a $2\times4$ matrix in that order?
    solution: Each left row has three entries but each right column has two. Their dot product is undefined, so this matrix product is undefined.
    options:
      - id: a
        text: The left matrix has 3 columns, but the right matrix has only 2 rows.
        correct: true
        feedback: Each entry of the product dots a left row (3 entries) with a right column (2 entries), and those lengths must match.
      - id: b
        text: The left matrix has 2 rows, but the right matrix has 4 columns.
        correct: false
        category: misunderstood_definition
        feedback: The outer sizes only set the shape of the answer. What must match is the columns on the left and the rows on the right.
      - id: c
        text: The left matrix has 3 columns, but the right matrix has 4 columns.
        correct: false
        category: misunderstood_definition
        feedback: The right matrix's column count sets the answer's width. Its row count, 2, is what must match the left's 3 columns.
      - id: d
        text: Both matrices have 2 rows, and matching row counts aren't allowed.
        correct: false
        category: misunderstood_definition
        feedback: Equal row counts don't matter either way. What must match is the columns on the left and the rows on the right.
  - id: matp-entry-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: The second row of $A$ is $({{=a}},{{=b}})$ and the first column of $B$ is $({{=c}},{{=d}})$. What is the entry in row 2, column 1 of $AB$?
    solution: 'Dot the selected row with the selected column: ${{=a}}\cdot{{=c}}+({{=b}})\cdot{{=d}}={{=a*c+b*d}}$. One row-column pair produces one output entry.'
    tolerance:
      abs: 1.0e-06
    params:
      a:
        min: 1
        max: 5
      b:
        min: -3
        max: 3
      c:
        min: 1
        max: 4
      d:
        min: 1
        max: 4
    answer_expr: a*c+b*d
  - id: matp-entry
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: For $A=\begin{bmatrix}2&0&1\\1&3&-1\end{bmatrix}$ and $B=\begin{bmatrix}1&2\\0&1\\4&0\end{bmatrix}$, what is entry (row 2, column 1) of $AB$?
    solution: Use row two $(1,3,-1)$ and column one $(1,0,4)$. Their dot product is $1\cdot1+3\cdot0+(-1)\cdot4=1+0-4=-3$.
    tolerance:
      abs: 1.0e-06
    answer: -3
  - id: matp-batch-shape
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Five houses each have three measurements. Their $5\times3$ table multiplies a $3\times2$ weight table whose columns predict sale price and monthly rent. What does the result hold?
    solution: The inner measurement count three matches, giving shape $5\times2$. Each of the five house rows contains a sale-price and a monthly-rent prediction.
    options:
      - id: a
        text: The result has five house rows with a sale-price and monthly-rent prediction.
        correct: true
        feedback: Each house row meets both weight columns.
      - id: b
        text: The result has three measurement rows with three scores each.
        correct: false
        feedback: Measurements are summed over, not retained as output rows.
      - id: c
        text: The result has two house rows with five scores each.
        correct: false
        feedback: The left rows remain rows, not output columns.
  - id: matp-recover-factor-entry
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: The first row of $A$ is $(2,1)$ and the second column of $B$ is $(3,t)$. Entry (row 1, column 2) of $AB$ is 11. What is $t$?
    answer: 5
    tolerance:
      abs: 0
    solution: |-
      The output entry is the dot product of the given row and column. Subtract the known contribution to find the missing entry.

      $$2\times3+1\times t=11$$

      $$6+t=11$$

      $$t=11-6$$

      $$t=5$$
  - id: mat-batches-transpose-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: In NumPy, each row of `X` is a house and `w` holds one weight per measurement. What does `X @ w` compute?
    options:
      - id: a
        text: One weighted prediction for each house row in $X$, returned as a vector.
        correct: true
        feedback: Each row's dot product with `w` combines that house's measurements into one prediction.
      - id: b
        text: The products of each house row with the weights in matching positions, with no sum.
        correct: false
        feedback: That multiplies matching positions only; `@` also adds the products into one prediction per house.
      - id: c
        text: One shared prediction formed by adding every measurement across all house rows.
        correct: false
        feedback: That collapses rows together; matrix multiplication returns a separate result for each row.
      - id: d
        text: A column sum of the input matrix, scaled by the matching model weights.
        correct: false
        feedback: A column sum combines houses; `X @ w` instead takes a weighted sum within each house row.
    solution: "`X @ w` takes each house row's dot product with the measurement weights, producing one prediction per row."
  - id: matp-batch-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked example, why does adding `b` raise both prices by 20 and both rents by 100?
    options:
      - id: a
        text: "`b` has one entry per output column, and broadcasting adds those same two entries to every house's row."
        correct: true
        feedback: Each of the 2 entries of `b` lines up with one column of `X @ W` and is reused for every row.
      - id: b
        text: "`b` gives one entry per house: 20 is added to house 1's row and 100 to house 2's row."
        correct: false
        category: misunderstood_definition
        feedback: Then house 1's price and rent would both rise by 20. The entries of `b` belong to columns, not rows.
      - id: c
        text: "`b` is added to the weights before multiplying, so every weight in $W$ grows."
        correct: false
        category: incorrect_reasoning
        feedback: "`X @ W` is computed first; `b` is then added to the product, so the weights are unchanged."
      - id: d
        text: NumPy adds the total of `b`, 120, to every entry of the product.
        correct: false
        category: misunderstood_definition
        feedback: Broadcasting reuses each entry in its own column; it never adds the entries of `b` together.
    solution: "`b` has shape (2,), one entry per output column. NumPy reuses it for both rows, so every price gains 20 and every rent gains 100."
  - id: matp-broadcast
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: A NumPy product holds sale-price and monthly-rent predictions for five houses, shape (5, 2). You add b, an array of shape (2,) holding a sale-price bias and a rent bias. What does broadcasting do?
    solution: NumPy reuses the two bias entries across the five rows, so every house's sale price gets the first bias and every rent gets the second. The output shape stays (5, 2).
    options:
      - id: a
        text: It adds the first bias to every house's sale price and the second to every house's rent.
        correct: true
        feedback: Each output column receives its matching bias for every house.
      - id: b
        text: It adds the first bias to house 1's row and the second bias to house 2's row.
        correct: false
        category: misunderstood_definition
        feedback: b has one entry per column, so it lines up with the columns and is reused for all five rows.
      - id: c
        text: It adds the sum of both biases to every entry of the (5, 2) array.
        correct: false
        category: misunderstood_definition
        feedback: The biases stay separate. Each column gets its own bias.
      - id: d
        text: It raises an error, because b has 2 entries and the array has 5 rows.
        correct: false
        category: misunderstood_definition
        feedback: NumPy matches the last axis, which has size 2 in both, and repeats b across the rows.
  - id: matp-code
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A model stores five houses with three measurements each in NumPy array X, shape (5, 3). W holds weights for sale price and monthly rent, shape (3, 2), and b holds one bias for each prediction, shape (2,). Which line gives both predictions, with their biases, for every house?
    solution: X rows dot W columns, giving shape (5, 2). Adding b broadcasts one bias per output across all five houses.
    options:
      - id: a
        text: "`Y = X @ W + b`"
        correct: true
        feedback: The product has shape (5, 2), and the two biases repeat across rows.
      - id: b
        text: "`Y = W @ X + b`"
        correct: false
        feedback: W has shape (3, 2) and X has shape (5, 3), so the inner sizes 2 and 5 don't match in that order.
      - id: c
        text: "`Y = X @ W.T + b`"
        correct: false
        feedback: W.T has shape (2, 3), so the inner sizes 3 and 2 don't match.
  - id: matp-bias-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A robot predicts its wheel speed, in centimetres per second, from two sensor readings, $({{=a}},{{=b}})$. The model has weights $(2,-1)$ and a bias of ${{=c}}$, and a negative speed means the wheel turns backwards. What speed does it predict?
    solution: 'First take the dot product: $2\cdot{{=a}}-{{=b}}={{=2*a-b}}$. Add the bias to get ${{=2*a-b}}+({{=c}})={{=2*a-b+c}}$.'
    tolerance:
      abs: 1.0e-06
    params:
      a:
        min: 1
        max: 8
      b:
        min: 1
        max: 5
      c:
        min: -2
        max: 4
    answer_expr: 2*a-b+c
  - id: matp-transpose
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: W stores the sale-price and monthly-rent weights as rows, with three measurements per output, shape (2, 3). X stores five houses with the same measurements, shape (5, 3). Which product gives both predictions for every house?
    solution: Transpose swaps the two weight rows into columns without changing their values. Then (5, 3) times (3, 2) gives (5, 2).
    options:
      - id: a
        text: "`X @ W.T`, with shape (5, 2)"
        correct: true
        feedback: Transposing makes W shape (3, 2), matching the three house measurements.
      - id: b
        text: "`X @ W`, which is undefined"
        correct: false
        feedback: Without the transpose, the inner sizes 3 and 2 differ.
      - id: c
        text: "`X.T @ W`, which is undefined"
        correct: false
        feedback: X.T has shape (3, 5), so the inner sizes 5 and 2 differ.
  - id: matp-why-batch
    dimension: implementation
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: You could price houses one at a time, dotting each house row with each weight column. How does `X @ W` relate to doing that, and why isn't `X * W` a substitute?
    solution: Each entry of `X @ W` is one house row dotted with one weight column, exactly what pricing house by house computes; `@` does them all in one line. For house row $(12,3,20)$ and price weights $(25,10,-1)$ that entry is $12\cdot25+3\cdot10+20\cdot(-1)=310$. `*` multiplies matching positions and never adds them up.
    options:
      - id: a
        text: "`X @ W` does the same row-column dot products in one line, while `*` never adds the products."
        correct: true
        feedback: Same dot products, one line. `*` only multiplies numbers in matching positions.
      - id: b
        text: Pricing one house at a time gives different predictions, because `@` pairs the weights differently.
        correct: false
        feedback: Each entry of `X @ W` is the same row-column dot product, so the predictions are identical.
      - id: c
        text: "`*` gives the same predictions as `@` whenever both arrays have equal row and column counts."
        correct: false
        feedback: "Even for equal shapes, `*` multiplies matching positions and adds nothing, so no dot product is formed."
  - id: matp-robot-dot-count
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A robot logs 50 moments, each with 4 sensor readings, in `X` of shape (50, 4). Its weights for 2 wheel speeds are stored one row per wheel, in `W_rows` of shape (2, 4). How many dot products does `X @ W_rows.T` compute?
    answer: 100
    tolerance:
      abs: 0
    solution: |-
      `W_rows.T` has shape (4, 2), so the product has shape (50, 2). Each entry is one dot product of a reading row with a weight column.

      $$50\times2=100$$
  - id: mat-explain-batch
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: For houses with area in tens of square metres, bedroom count and age in years, explain how NumPy can predict both sale price and monthly rent for five houses. State the shapes of $X$, $W$ and $XW$, and explain adding one fixed amount per output.
    rubric:
      - id: rows
        criterion: Compute each output entry by dotting one house row with one output-weight column.
        weight: 2
        required: true
      - id: shapes
        criterion: Give $X$ shape $(5,3)$, $W$ shape $(3,2)$ and $XW$ shape $(5,2)$, with matching inner measurement counts.
        weight: 2
        required: true
      - id: bias
        criterion: Add a bias of shape `(2,)` in `X @ W + b`, reusing the same price and rent adjustments for each house.
        weight: 1
        required: true
    exemplar: Each output entry is one house row dotted with one output-weight column. Five houses with three measurements give X shape (5, 3). Sale-price and monthly-rent weights give W shape (3, 2), so X @ W has shape (5, 2). Adding b with shape (2,) reuses one fixed adjustment for each output across all five rows.
    solution: Each house row meets both output-weight columns. The matching inner measurement counts produce two predictions per house, and broadcasting adds one fixed adjustment per output without changing the shape.
  - id: mat-check-shape
    dimension: math
    type: mc
    role: check
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: $A$ has shape $128 \times 512$ and $B$ has shape $512 \times 64$. What is the shape of $AB$?
    options:
      - id: a
        text: $128 \times 64$
        correct: true
      - id: b
        text: $512 \times 512$
        correct: false
        category: misunderstood_definition
        feedback: The inner dimension (512) disappears. The outer dimensions remain.
      - id: c
        text: $64 \times 128$
        correct: false
        category: misunderstood_definition
        feedback: Matrix multiplication's output keeps the first matrix's row count and the second matrix's column count. These come from the outer dimensions, not from swapping them.
