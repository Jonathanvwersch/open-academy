concept: positional-encoding
exercises:
  - id: pe-order-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does permutation equivariance mean for attention without any position-dependent rules?
    options:
      - id: a
        text: Reordering the inputs reorders the corresponding outputs the same way.
        correct: true
        feedback: The mixtures follow their query tokens to the new slots.
      - id: b
        text: Reordering the inputs leaves the output sequence in its original order.
        correct: false
        feedback: That would be invariance; equivariance moves the outputs with the inputs.
      - id: c
        text: Reordering the inputs makes each output equal to its position number.
        correct: false
        feedback: Without a position-dependent rule, attention has no slot number to output.
    solution: Each query still sees the same keys with their associated values. Its mixture stays with its token, so the output sequence is rearranged in the same way as the input.
  - id: pe-order-worked
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why did the cat output stay $(1,3)$ in the worked example when “the cat” became “cat the”?
    options:
      - id: a
        text: Each slot kept its old weight, regardless of which key moved there.
        correct: false
        feedback: Weights are attached to query-key comparisons, not fixed slot numbers.
      - id: b
        text: Each key moved with its value, preserving the cat query's mixture.
        correct: true
        feedback: The weight for cat stayed with cat's value, and the weight for the stayed with its value.
      - id: c
        text: Every query always produces the average of all the token values.
        correct: false
        feedback: The weights were unequal, so this was not a simple average.
    solution: The cat query still weights the value for “cat” by $0.75$ and the value for “the” by $0.25$. Reversing the order of these two contributions doesn't change their sum.
  - id: pe-order-mixture
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      a: { min: 1, max: 4, step: 1 }
      b: { min: 1, max: 4, step: 1 }
    prompt: "Without position information, a query gives token A weight $0.25$ and token B weight $0.75$. Their values are $({{= 4*a }},0)$ and $({{= 4*b }},2)$. The tokens swap slots. What is the first entry of the output for this query after the swap?"
    answer_expr: a + 3*b
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: 4*a + 4*b
        category: math_error
        feedback: Multiply each value by its weight before adding; swapping slots doesn't remove the weights.
    solution: 'The weights follow their keys and values, so the first entry is $0.25\times{{= 4*a }}+0.75\times{{= 4*b }}={{= a + 3*b }}$, just as before the swap.'
  - id: pe-order-not-invariant
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: Attention without position-dependent rules maps two input tokens to distinct outputs $(u,v)$. What does swapping the inputs do?
    options:
      - id: a
        text: It gives $(u,v)$, because attention ignores input order completely.
        correct: false
        feedback: The corresponding outputs follow their tokens, so their order changes.
      - id: b
        text: It gives $(u,u)$, because both queries now see the same tokens.
        correct: false
        feedback: Seeing the same set of keys doesn't make different queries identical.
      - id: c
        text: It gives $(v,u)$, because each output follows its input token.
        correct: true
        feedback: The values of the mixtures stay attached to the corresponding queries.
    solution: Equivariance preserves the relationship between inputs and outputs under a rearrangement. The outputs move with their corresponding inputs.
  - id: pe-order-three
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A robot processes three sensor tokens $(A,B,C)$ using attention with shared transformations and no position-dependent rules. Its outputs are $(u,v,w)$. If the inputs become $(C,A,B)$, what is the new output order?
    options:
      - id: a
        text: $(w,u,v)$, following the new order of the sensor tokens.
        correct: true
        feedback: C carries w, A carries u, and B carries v to their new slots.
      - id: b
        text: $(u,v,w)$, preserving the original order of the output slots.
        correct: false
        feedback: That would ignore which token now occupies each slot.
      - id: c
        text: $(v,w,u)$, moving the outputs opposite to their input tokens.
        correct: false
        feedback: Equivariance uses the same rearrangement, not the opposite rearrangement.
    solution: Every query sees the same key/value pairs after the move. Its mixture follows its token, so C, A and B carry w, u and v respectively.
  - id: pe-order-position-rule
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: Under which conditions does rearranging attention inputs necessarily rearrange their outputs in the same way?
    options:
      - id: a
        text: Every slot can read every token, but slot 1 uses different query weights.
        correct: false
        feedback: Different query transformations by slot introduce position dependence.
      - id: b
        text: Every slot shares transformations and can read every token without position information.
        correct: true
        feedback: Moving a token then preserves both its query and the keys/values it can read.
      - id: c
        text: Every slot shares transformations, but each query can read only earlier slots.
        correct: false
        feedback: A rule based on earlier slots changes which keys a query can read when tokens move.
    solution: The argument needs the same token transformations and the same accessible key/value pairs after a rearrangement. Position-specific transformations or restrictions break those assumptions.
  - id: pe-add-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does an additive positional encoding do before attention makes queries, keys and values?
    options:
      - id: a
        text: It replaces every token embedding with a vector of zero entries.
        correct: false
        feedback: That removes token content instead of combining content and position.
      - id: b
        text: It appends a position vector to the end of each token embedding.
        correct: false
        feedback: Appending changes the width; additive positional encoding adds matching entries.
      - id: c
        text: It adds the slot's position vector to the token's embedding.
        correct: true
        feedback: The combined vector carries both token and position information.
    solution: The combined input is $z_t=e_t+p_t$. Both vectors have width $d$, and adding corresponding entries leaves the result at that width.
  - id: pe-add-worked
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: In the worked example, why did moving “cat” to slot 1 change its combined input from $(0,3)$ to $(1,2)$?
    options:
      - id: a
        text: Its embedding $(0,2)$ was added to the new slot's position vector.
        correct: true
        feedback: Slot 1 supplies (1,0) instead of slot 2's (0,1).
      - id: b
        text: Its embedding became the embedding of “the”, because it moved into that slot.
        correct: false
        feedback: An embedding belongs to a token identity, not to a sequence slot.
      - id: c
        text: Its position vector moved with it, but addition changed to subtraction in slot 1.
        correct: false
        feedback: The rule remains addition and the position vector belongs to the slot.
    solution: The token embedding stays $(0,2)$. The addition changes from $(0,2)+(0,1)$ to $(0,2)+(1,0)$ because the position changes.
  - id: pe-add-entry
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 1
    params:
      a: { min: 1, max: 5, step: 1 }
      b: { min: 1, max: 3, step: 1 }
    prompt: "A model uses additive positional encoding. A token has embedding $e=({{= a }},2)$, and its slot has position vector $p=({{= b }},1)$. What is the first entry of the input that attention receives for this token?"
    answer_expr: a + b
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: a - b
        category: math_error
        feedback: Add corresponding entries; don't subtract the position vector.
      - answer_expr: a
        category: incomplete_explanation
        feedback: That is the token embedding alone. The position vector is added to it before attention.
    solution: "Additive encoding adds the position vector to the embedding entry by entry, so the first entry is ${{= a }}+{{= b }}={{= a+b }}$. The second entry is $2+1=3$, and the combined vector still has two entries."
  - id: pe-add-width
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 1
    params:
      d: { min: 4, max: 16, step: 4 }
      T: { min: 3, max: 10, step: 1 }
    prompt: "A model's token embeddings have $d={{= d }}$ entries, and it uses additive positional encoding. A text of $T={{= T }}$ tokens goes in. How many numbers are in the grid of inputs that attention receives?"
    answer_expr: T*d
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: 2*T*d
        category: misunderstood_definition
        feedback: Doubling the width would join the two vectors end to end; addition keeps each token's width at $d$.
      - answer_expr: T*d + T
        category: misunderstood_definition
        feedback: The position is a whole vector of $d$ entries added to the embedding, so no extra entry is added.
    solution: "Each position vector has the same $d={{= d }}$ entries as the embedding, and adding them entry by entry keeps that width. So the grid has ${{= T }}$ rows of ${{= d }}$ numbers, ${{= T*d }}$ in total."
  - id: pe-add-table-limit
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A model learns a table of position vectors from training texts that are at most 4 tokens long, so the table has rows for slots 1 to 4. What happens when it is given a 5-token text?
    options:
      - id: a
        text: Slot 5 reuses row 1, so the fifth token is treated as if it came first.
        correct: false
        feedback: A learned table has no rule that repeats its rows. It simply ends at row 4.
      - id: b
        text: Slot 5 has no row in the table, so there is no learned vector to add there.
        correct: true
        feedback: A learned table holds only the rows it was trained with. Slot 5 would need a new row, and that row would need training.
      - id: c
        text: The table makes a row for slot 5 by continuing the pattern of rows 1 to 4.
        correct: false
        feedback: That describes the sine and cosine formula. A learned table has no formula to continue.
      - id: d
        text: Slot 5 gets a zero position vector, and the model works as well as before.
        correct: false
        feedback: Nothing fills in slot 5 automatically, and a missing position signal would hide where the token sits.
    solution: A learned table supplies only the rows it contains, and training only teaches the rows used during training. This table ends at row 4, so slot 5 has no position vector until the table is extended and trained further.
  - id: pe-add-waves
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A text model uses fixed sine/cosine position vectors and is trained only on sequences of up to four tokens. What follows about using eight tokens?
    options:
      - id: a
        text: The formula can produce the vectors, but good predictions are not guaranteed.
        correct: true
        feedback: The formula gives a vector at every slot; the model's accuracy at those lengths still has to be tested.
      - id: b
        text: The formula cannot produce the vectors, since each one requires a trained table row.
        correct: false
        feedback: Fixed sine/cosine vectors are computed from position, not read from learned rows.
      - id: c
        text: The formula guarantees good predictions, since every new position has a vector.
        correct: false
        feedback: A defined vector does not establish how well the model handles longer sequences.
    solution: A fixed wave rule can be evaluated at positions not used in training. The model's behavior at those positions still depends on what it learned, so longer-context accuracy is not guaranteed.
  - id: pe-add-collision
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: One token/position pair has $e=(2,0)$ and $p=(0,1)$; another has $e=(1,1)$ and $p=(1,0)$. What do their additive inputs show?
    options:
      - id: a
        text: Their sums differ, so addition guarantees a unique label for each pair.
        correct: false
        feedback: Both sums are (2,1), despite using different token and position vectors.
      - id: b
        text: Their sums are equal, so no position vector can ever influence attention.
        correct: false
        feedback: A collision in one example doesn't prevent position vectors from changing other combined inputs.
      - id: c
        text: Their sums are equal, so addition does not guarantee unique labels for pairs.
        correct: true
        feedback: Different vectors can cancel the differences between each other when added.
    solution: Both $(2,0)+(0,1)$ and $(1,1)+(1,0)$ equal $(2,1)$. This collision shows why different token/position pairs can have the same combined input.
  - id: pe-rotary-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does rotary positional encoding rotate as part of its position operation?
    options:
      - id: a
        text: Pairs of value entries, after the attention mixture has been computed.
        correct: false
        feedback: Rotary positional encoding changes query/key comparisons, not the value mixture afterwards.
      - id: b
        text: Pairs of query and key entries, before their dot products are computed.
        correct: true
        feedback: Position-dependent rotations change the dot products used in attention scores.
      - id: c
        text: Pairs of attention weights, after their scores have been normalized.
        correct: false
        feedback: The rotations operate on query/key vectors before scores, not on the later weights.
    solution: Rotary positional encoding turns pairs of query and key entries by position-dependent angles. Their dot products then carry position information, and the values remain available for the weighted mixture.
  - id: pe-rotary-worked
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why did the worked example give dot product zero for both query/key slot pairs $(1,2)$ and $(2,3)$?
    options:
      - id: a
        text: Every rotary dot product is zero, regardless of the vectors or the gap.
        correct: false
        feedback: The slot pair (1,3) in the example gave a dot product of -1.
      - id: b
        text: Only the keys turned; the queries stayed fixed when both slots moved.
        correct: false
        feedback: Both queries and keys turn by the angles of their respective positions.
      - id: c
        text: The unrotated query/key vectors were fixed, and both pairs had the same one-slot gap.
        correct: true
        feedback: Both vectors gained the same extra quarter turn, preserving their dot product.
    solution: The unrotated query/key vectors were identical across the two comparisons. Moving both positions forward turned both vectors equally, preserving the right angle between them and hence their zero dot product.
  - id: pe-rotary-quarter
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 1
    params:
      a: { min: 1, max: 4, step: 1 }
      b: { min: 1, max: 4, step: 1 }
    constraints: ["a != b"]
    prompt: "A toy rotary positional encoding turns each query pair counterclockwise by a quarter turn per slot, with zero turn at slot 1. A quarter turn maps any pair $(u,v)$ to $(-v,u)$. The query pair $({{= a }},{{= b }})$ is at slot 3. What is the first entry of its rotated pair?"
    answer_expr: -a
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: -b
        category: incomplete_explanation
        feedback: That is one quarter turn, the turn for slot 2. Slot 3 is two quarter turns from slot 1.
      - answer_expr: a
        category: misunderstood_definition
        feedback: That leaves the pair unturned. Only slot 1 has zero turn.
    solution: "Slot 3 gets two quarter turns. The first gives $(-{{= b }},{{= a }})$ and the second gives $(-{{= a }},-{{= b }})$, so the first entry is ${{= -a }}$. A rotation changes direction without changing the pair length."
  - id: pe-rotary-dot
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      a: { min: 1, max: 3, step: 1 }
      b: { min: 1, max: 3, step: 1 }
    prompt: 'A toy rotary positional encoding turns query and key pairs counterclockwise by a quarter turn per slot, with zero turn at slot 1. Before rotation, a query at slot 2 is $({{= a }},0)$ and a key at slot 4 is $({{= b }},0)$. What is the dot product of the rotated query and key, before attention divides it by $\sqrt{d_k}$?'
    answer_expr: -a*b
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: a*b
        category: incomplete_explanation
        feedback: That is the dot product without rotation. Rotate both vectors by their slot's turn first.
    solution: 'The query turns one quarter turn to $(0,{{= a }})$, and the key turns three quarter turns to $(0,-{{= b }})$. Their dot product is $0\times0+{{= a }}\times(-{{= b }})={{= -a*b }}$. Only the two-slot gap matters: a half turn between them points them in opposite directions.'
  - id: pe-rotary-shift
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A rotary rule turns query and key vectors by a fixed angle per slot. Keep their unrotated vectors fixed. Which shift guarantees that their dot product stays the same?
    options:
      - id: a
        text: Move the query from slot 2 to 4 and the key from slot 5 to 7.
        correct: true
        feedback: Both positions increase by two, so both vectors gain the same rotation.
      - id: b
        text: Move the query from slot 2 to 4 and keep the key in slot 5.
        correct: false
        feedback: The query gains a rotation without the key, so the relative angle can change.
      - id: c
        text: Keep the query in slot 2 and move the key from slot 5 to 7.
        correct: false
        feedback: The key gains a rotation without the query, so the relative angle can change.
    solution: Rotating both vectors by the same extra angle preserves their dot product. Shifting both positions equally preserves the gap, here $5-2=7-4=3$.
  - id: pe-rotary-content
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: Two different query/key token pairs have the same relative position gap under a rotary rule. Must their attention scores be equal?
    options:
      - id: a
        text: Yes, because the gap completely determines the score.
        correct: false
        feedback: Rotations act on the unrotated query/key vectors. Their entries also affect the score.
      - id: b
        text: No, because their unrotated query/key vectors can be different.
        correct: true
        feedback: The positional effect depends on the gap, but the dot product also depends on the vectors being turned.
      - id: c
        text: Yes, because rotating any two vectors makes their lengths equal.
        correct: false
        feedback: A rotation preserves each vector's existing length; it does not equalize different vectors.
    solution: The shared gap gives the same relative rotation rule. The unrotated query/key vectors also affect the dot product, so different vectors can yield different scores at the same gap.
  - id: pe-rotary-repeat
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A toy rotary positional encoding has only one pair and turns it by a quarter turn per slot, starting with zero turn at slot 1. Why is it insufficient for distinguishing many positions?
    options:
      - id: a
        text: Slot 5 applies the same rotation as slot 1, because four quarter turns make a full turn.
        correct: true
        feedback: The pair repeats every four slots, so it confuses positional gaps separated by four.
      - id: b
        text: Slot 5 makes every query zero, because rotations shrink vectors at every step.
        correct: false
        feedback: Rotations preserve length rather than shrinking it.
      - id: c
        text: Slot 5 has no defined rotation, because the rule needs one learned row per slot.
        correct: false
        feedback: This is a computed rotation rule, not a table of learned position vectors.
    solution: A full turn returns a vector to its initial direction. A single quarter-turn pair therefore repeats; multiple pairs turning at different rates provide a richer positional encoding.
  - id: pe-connect-order
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt: "Describe how learned positional encodings, sinusoidal positional encodings and rotary positional encodings put position information into a transformer."
    rubric:
      - id: two-mechanisms
        criterion: Describe adding a learned position-table row to each token embedding.
        weight: 1
        required: true
      - id: sinusoidal
        criterion: Describe computing fixed sine/cosine position vectors and adding them to embeddings.
        weight: 1
        required: true
      - id: rotary
        criterion:
          Describe rotating query/key pairs by position so the positional effect on their dot product depends
          on the relative gap.
        weight: 1
        required: true
    exemplar: "Learned positional encodings add a learned position-table row to each token embedding. Sinusoidal encodings add a position vector computed from fixed sine and cosine waves. Rotary encodings rotate query/key pairs by their positions, making the positional effect on their dot product depend on the gap between positions."
  - id: pe-recall-order-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: pe-reordering
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what does permutation equivariance mean for attention without position-dependent rules, and why does a moved token keep its mixture?"
    rubric:
      - id: r1
        criterion: "Explain that rearranging the inputs rearranges their corresponding outputs in the same way."
        weight: 1
        required: true
      - id: r2
        criterion: "Explain that queries and keys stay the same for each token pair and each value keeps its weight."
        weight: 1
        required: true
    exemplar: "Rearranging the inputs rearranges the corresponding outputs the same way. The query and key for each token pair stay the same, so each value keeps its weight and the mixture follows its query token."
  - id: pe-recall-order-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: pe-reordering
    difficulty: 1
    est_minutes: 0.5
    prompt: "Attention uses shared transformations and every token can attend to every token. After swapping two tokens, which result describes permutation equivariance?"
    options:
      - id: a
        text: "The corresponding outputs swap slots."
        correct: true
        feedback: "Each token keeps its mixture, and that output follows it to its new slot."
      - id: b
        text: "The output sequence stays in its old order."
        correct: false
        feedback: "This describes an unchanged output sequence. Equivariance moves corresponding outputs with their inputs."
      - id: c
        text: "Each token gets its new slot's position vector."
        correct: false
        feedback: "Position vectors are an added rule. Shared attention alone uses the token's unchanged embedding."
    solution: "Without a position-dependent rule, the outputs follow the input rearrangement."
  - id: pe-recall-order-contrast2
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: pe-reordering
    difficulty: 1
    est_minutes: 0.5
    prompt: "Which rule gives a moved token access to its new slot number?"
    options:
      - id: a
        text: "Apply the same query matrix at every slot."
        correct: false
        feedback: "Shared transformations use the embedding alone, so a moved token keeps its query."
      - id: b
        text: "Add a vector chosen from the slot number."
        correct: true
        feedback: "A position vector supplies slot information, so moving a token can change its input."
      - id: c
        text: "Mix source values using query–key weights."
        correct: false
        feedback: "Shared attention keeps each source's weight with its value when tokens move, preserving the query token's mixture."
    solution: "A slot-dependent position vector gives the input information about the token's new position."
  - id: pe-recall-add-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: pe-add-position
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, how does additive positional encoding change the input to attention, and where can the position vectors come from?"
    rubric:
      - id: r1
        criterion: "Explain that a position vector is added to the token embedding before making queries, keys and values."
        weight: 1
        required: true
      - id: r2
        criterion: "State that position vectors can be learned table rows or computed from fixed sine and cosine waves."
        weight: 1
        required: true
    exemplar: "Additive positional encoding adds a position vector to the token embedding before making queries, keys and values. These vectors can be learned table rows or come from fixed sine and cosine waves."
  - id: pe-recall-add-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: pe-add-position
    difficulty: 1
    est_minutes: 0.5
    prompt: "Which description belongs to sinusoidal positional encoding?"
    options:
      - id: a
        text: "A trained table stores a vector for each slot."
        correct: false
        feedback: "That is learned positional encoding. Training adjusts each stored position row."
      - id: b
        text: "A lookup selects a vector for each token id."
        correct: false
        feedback: "That is the token embedding lookup. A token keeps that vector when it moves between slots."
      - id: c
        text: "Fixed waves generate a vector for each slot."
        correct: true
        feedback: "Sinusoidal encodings compute position vectors with fixed sine and cosine waves."
    solution: "Sinusoidal position vectors come from fixed sine and cosine rules."
  - id: pe-recall-add-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: pe-add-position
    difficulty: 1
    est_minutes: 0.5
    prompt: "With token embedding $e_t$ and position vector $p_t$, fill in the missing operation: $z_t=e_t\\;\\underline{\\quad}\\;p_t$."
    accept: ["+", "plus", "add", "addition", "vector addition", "$+$"]
    regex: "^\\s*(?:\\$?\\s*\\+\\s*\\$?|plus|add|addition|vector\\s+addition)\\s*$"
    solution: "The combined input is $z_t=e_t+p_t$."
  - id: pe-recall-rotary-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: pe-rotate-position
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what does rotary positional encoding rotate, and how does the gap between positions affect the comparison?"
    rubric:
      - id: r1
        criterion: "Explain that pairs of query and key entries are rotated by angles chosen from their positions."
        weight: 1
        required: true
      - id: r2
        criterion: "Explain that for fixed original query and key vectors, the positional effect on their dot product depends on the gap between positions."
        weight: 1
        required: true
    exemplar: "Rotary positional encoding rotates pairs of query and key entries by position. For fixed original vectors, the positional effect on their dot product depends on the gap between their positions."
  - id: pe-recall-rotary-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: pe-rotate-position
    difficulty: 1
    est_minutes: 0.5
    prompt: "Where does rotary positional encoding apply its position-dependent change?"
    options:
      - id: a
        text: "To embeddings by adding position vectors"
        correct: false
        feedback: "Adding position vectors is additive positional encoding, before making queries, keys and values."
      - id: b
        text: "To query and key pairs before scoring"
        correct: true
        feedback: "Rotary encoding rotates their entries before the dot product."
