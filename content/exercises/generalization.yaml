concept: generalization
exercises:
  - id: gen-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does generalization mean for a house-price model?
    options:
      - {
          id: a,
          text: Remembering every price in its training sales.,
          correct: false,
          feedback: Remembering training prices does not show success on new houses.,
        }
      - {
          id: b,
          text: Making useful predictions for unseen houses.,
          correct: true,
          feedback: Generalization is success on new examples rather than memorising training sales.,
        }
      - {
          id: c,
          text: Giving every house the same predicted price.,
          correct: false,
          feedback: Generalization concerns useful predictions on unseen examples rather than identical predictions.,
        }
    solution: Generalization is useful prediction on examples the model did not learn from. Training success alone does not establish it.
  - id: gen-average-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does the worked example divide the total absolute error of 60 by four?
    options:
      - {
          id: a,
          text: To make each individual house have error 15.,
          correct: false,
          feedback: Averaging does not change the individual errors of 10 or 20.,
        }
      - {
          id: b,
          text: To guarantee error 15 on the next house.,
          correct: false,
          feedback: Even with matching independent examples an average does not guarantee an individual prediction.,
        }
      - { id: c, text: To measure average error per test house., correct: true }
    solution: Dividing by four gives a mean absolute error of 15 thousand dollars per house. It summarises these four predictions without promising that error on each future house.
  - id: gen-average-template
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      e:
        min: 5
        max: 15
        step: 5
    prompt:
      Four untouched test houses sold for 200, 250, 300 and 350 thousand dollars. A model predicted {{=200+e}},
      {{=240-e}}, {{=300-e}} and {{=360+e}} thousand dollars respectively. What is their mean absolute error in thousands
      of dollars?
    answer_expr: e + 5
    tolerance:
      abs: 0.01
    solution:
      Add the four absolute errors to get {{= 4*e+20 }}, then divide by four to get {{= e+5 }} thousand dollars.
      Individual prediction errors can be above or below this average.
  - id: gen-identical
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Which situation fits the identically distributed part of i.i.d. sampling?
    options:
      - {
          id: a,
          text: Different house sizes and prices drawn by one unchanged sales process.,
          correct: true,
        }
      - {
          id: b,
          text: Every house has the same size but prices come from changing markets.,
          correct: false,
          feedback: Matching sizes do not make the distribution of sizes and prices unchanged.,
        }
      - {
          id: c,
          text: Different sales processes are used but the model stays unchanged.,
          correct: false,
          feedback: Identically distributed describes where examples come from rather than whether the model changes.,
        }
    solution: Identically distributed means each example comes from the same distribution. Examples can have different values even when the process producing them stays the same.
  - id: gen-robot-evidence
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A robot predicts delivery time. A large untouched test set contains independent trips from the same unchanged
      process as future trips. Its average absolute error is 2 minutes. What does this support?
    options:
      - id: a
        text: Each future trip will be off by about 2 minutes.
        correct: false
        feedback: An average allows individual errors above or below it.
      - id: b
        text: Average future error is estimated at 2 minutes with some uncertainty.
        correct: true
      - id: c
        text: The model's training error must also be about 2 minutes.
        correct: false
        feedback: Training trips helped fit the model, so their average error can differ from test error.
    solution:
      Under these assumptions the test average estimates average future error. Neither independence nor an
      unchanged source guarantees an exact future average or a bound on every trip.
  - id: gen-shift-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What is distribution shift?
    options:
      - {
          id: a,
          text: A change in the distribution of examples between evaluation and use.,
          correct: true,
          feedback: The source or mix of examples can change even with an unchanged model.,
        }
      - {
          id: b,
          text: A change in model predictions with the example source kept fixed.,
          correct: false,
          feedback: Changing predictions is not itself a change in the distribution of examples.,
        }
      - {
          id: c,
          text: A difference in two house prices drawn from one unchanged source.,
          correct: false,
          feedback: Different example values are normal even without a distribution change.,
        }
    solution: Distribution shift means the examples in real use come from a different distribution than the examples tested on. House measurements or the prices associated with them can change.
  - id: gen-fixed-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does the worked example keep predictions at 100 and 200 when checking city B?
    options:
      - {
          id: a,
          text: Because city B must have the same real prices as city A.,
          correct: false,
          feedback: The example gives B prices of 200 and 300 instead.,
        }
      - {
          id: b,
          text: Because a model automatically learns new prices when used in a new city.,
          correct: false,
          feedback: Using the model in a new city does not teach it new prices without further training.,
        }
      - {
          id: c,
          text: Because we are checking the unchanged model on new sale prices.,
          correct: true,
        }
    solution: The model has not been trained again, so at the same sizes it makes the same predictions. Comparing those predictions with B's real prices reveals the error caused by this changed setting.
  - id: gen-shift-template
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      d:
        min: 20
        max: 100
        step: 20
    prompt:
      An unchanged model predicts 100 and 200 thousand dollars for two houses. In a new city their actual prices
      are {{=100+d}} and {{=200+2*d}} thousand dollars. What is its mean absolute error on these two houses in thousands
      of dollars?
    answer_expr: 3*d/2
    tolerance:
      abs: 0.01
    solution: The absolute errors are {{=d}} and {{=2*d}} thousand dollars. Their mean is $({{=d}}+{{=2*d}})/2={{=3*d/2}}$.
  - id: gen-large-houses
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A model was tested on mostly small houses. Its users now submit mostly large houses, although the price relationship at each size has stayed unchanged. What changed?
    options:
      - {
          id: a,
          text: Nothing relevant changed because the price relationship is unchanged.,
          correct: false,
          feedback: How often different sizes occur is also part of the distribution.,
        }
      - {
          id: b,
          text: The input distribution changed so the old average may not transfer.,
          correct: true,
        }
      - {
          id: c,
          text: Only the model changed because large houses cost more.,
          correct: false,
          feedback: The scenario changes the mix of houses rather than the model.,
        }
    solution: The frequencies of input sizes changed, which is distribution shift even with the same price relationship. A model may make different errors on large and small houses, changing its overall average.
  - id: gen-lighting
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A robot vision model has low error on independent daylight images. It will now work at night. Which next check best addresses whether its score transfers?
    options:
      - {
          id: a,
          text: Randomly divide the daylight images again and report that score.,
          correct: false,
          feedback: Another daylight split still does not evaluate the night setting.,
        }
      - {
          id: b,
          text: Report the training error because the robot hardware is unchanged.,
          correct: false,
          feedback: Hardware staying unchanged does not make night images match daylight images.,
        }
      - {
          id: c,
          text: Evaluate on separate labelled night images from its intended use.,
          correct: true,
        }
    solution: Night lighting can change the input distribution. Separate labelled night images directly test the intended setting instead of assuming that a daylight score transfers.
  - id: gen-independent-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: How does a group split help us evaluate predictions for new houses?
    options:
      - {
          id: a,
          text: It keeps all records for each house on one side of the split.,
          correct: true,
          feedback: Keeping records together prevents copies of a held-out sale from appearing in training.,
        }
      - {
          id: b,
          text: It puts one copy of each house in every side of the split.,
          correct: false,
          feedback: Putting copies on both sides leaks held-out sale information into training.,
        }
      - {
          id: c,
          text: It gives each row a new number before dividing the rows.,
          correct: false,
          feedback: New row numbers do not stop records of the same house from crossing the split.,
        }
    solution: A group split keeps each house's records together. This prevents a copy of a held-out house's sale from teaching the model the price it is supposed to predict.
  - id: gen-group-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does the worked example put both H copies in training and both J copies in validation?
    options:
      - {
          id: a,
          text: To give the model a copy of every validation sale during training.,
          correct: false,
          feedback: That is the problem with the original row split rather than the goal.,
        }
      - {
          id: b,
          text: To check a house whose sale was not already seen during training.,
          correct: true,
        }
      - {
          id: c,
          text: To make the two J copies count as two independent new sales.,
          correct: false,
          feedback: Identical copies remain one sale even when they are both held out.,
        }
    solution: Grouping by house keeps copies of the same sale on one side. It removes the duplicate-house shortcut but does not turn duplicate validation rows into independent evidence.
  - id: gen-count-template
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      a:
        min: 4
        max: 8
        step: 2
      b:
        min: 2
        max: 4
        step: 1
      k:
        min: 1
        max: 3
        step: 1
    prompt:
      "A validation table has {{=a+2*b}} rows: {{=a}} sales appear once each, and {{=b}} other sales appear
      as two identical copies each. Of the single sales, {{=k}} also appear in training; none of the copied sales
      appear in training. How many distinct validation sales are new to the model?"
    answer_expr: a+b-k
    tolerance:
      abs: 0.01
    solution:
      There are {{=a}} single sales and {{=b}} distinct copied sales. Remove the {{=k}} sales already seen
      in training, leaving ${{=a}}+{{=b}}-{{=k}}={{=a+b-k}}$ new sales.
    constraints:
      - k < a
  - id: gen-time-split
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: You want to predict next year's house prices using information available on each prediction date. Which evaluation most closely rehearses that use?
    options:
      - {
          id: a,
          text: Mix all dates randomly and allow later sale prices as inputs.,
          correct: false,
          feedback: Later sale prices would be unavailable when making the earlier predictions.,
        }
      - {
          id: b,
          text: Train on later years and evaluate predictions for earlier years.,
          correct: false,
          feedback: Learning from the future does not rehearse forecasting from earlier data.,
        }
      - {
          id: c,
          text: Train on earlier years and check later years using available inputs.,
          correct: true,
        }
    solution: A time split follows the direction of real forecasting and uses only information available at prediction time. It is a better rehearsal but cannot guarantee that next year's market will stay unchanged.
  - id: gen-patient-split
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A medical model must work on new patients. Each patient has many related scans. A random scan split gives
      very low validation error. What evaluation change best checks the intended task?
    options:
      - id: a
        text: Keep each patient's scans in one split and evaluate held-out patients.
        correct: true
      - id: b
        text: Use a larger random scan split so the validation error is more precise.
        correct: false
        feedback: More scans do not remove the shared patient information across splits.
      - id: c
        text: Remove exact duplicate scans and keep the random split.
        correct: false
        feedback: Different scans from the same patient still share information, even after exact duplicates are removed.
    solution:
      New-patient use calls for a patient-level group split. Related scans across splits can make validation
      appear easier than predicting for a patient the model has never seen.
  - id: gen-explain-evidence
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt: "A house model scores well on held-out city A sales, but some rows copy training sales and the model will be used in city B. Explain why the copied rows weaken the evidence, why the city change matters, and which sales you would reserve for a better evaluation."
    rubric:
      - id: leakage
        criterion: Explain that copied training sales are leakage and give no independent evidence about unseen houses.
        weight: 1
        required: true
      - id: shift
        criterion: Explain that city B can have a different mix of houses or different prices at the same sizes.
        weight: 1
        required: true
      - id: evaluation
        criterion: Propose evaluating on separate city B sales covering the kinds of houses the model will price.
        weight: 1
        required: true
    exemplar: "Copied training sales give no independent evidence about unseen houses. City B can have a different mix of houses or different prices at the same sizes, so city A's score is insufficient. I would reserve separate city B sales covering the kinds of houses the model will price."
  - id: gen-recall-unseen-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: gen-unseen-houses
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what do independent and identically distributed mean for house sales?"
    rubric:
      - id: point0
        criterion: "Explain that independent means knowing one sale gives no information about another."
        weight: 1
        required: true
      - id: point1
        criterion: "Explain that identically distributed means all examples, including future sales, come from the same unchanged distribution."
        weight: 1
        required: true
    exemplar: "Independent means knowing one sale gives no information about another. Identically distributed means all examples, including future sales, come from the same unchanged distribution."
  - id: gen-recall-unseen-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gen-unseen-houses
    difficulty: 1
    est_minutes: 0.5
    prompt: "Which condition concerns independence of sale records?"
    options:
      - id: a
        text: "Knowing one sale tells you nothing about another."
        correct: true
        feedback: "Independence means one example gives no information about another."
      - id: b
        text: "Each sale comes from the same unchanged city market."
        correct: false
        feedback: "A shared unchanged market describes being identically distributed. Sales can share a market and still be related."
      - id: c
        text: "The test set contains many houses of different sizes."
        correct: false
        feedback: "A range of house sizes shows what the set covers. Check how the records are related to assess independence."
    solution: "Independence means one example gives no information about another."
  - id: gen-recall-unseen-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: gen-unseen-houses
    difficulty: 1
    est_minutes: 0.5
    prompt: "For two untouched test houses, the predictions are $\\hat y_1$ and $\\hat y_2$ and the matching sale prices are $y_1$ and $y_2$. Write their mean absolute error. Type `yhat_1`, `yhat_2`, `y_1`, `y_2` and `abs(...)`."
    answer: "(abs(yhat_1-y_1)+abs(yhat_2-y_2))/2"
    variables: { "yhat_1": [50, 500], "yhat_2": [50, 500], "y_1": [50, 500], "y_2": [50, 500] }
    solution: "Take the distance between each prediction and its sale price, then average the two distances to get $(|\\hat y_1-y_1|+|\\hat y_2-y_2|)/2$."
  - id: gen-recall-shift-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: gen-changed-source
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what is distribution shift, and how should you check predictions in the new setting?"
    rubric:
      - id: point0
        criterion: "Explain that distribution shift means the examples we want to predict come from a different distribution than the examples we tested on."
        weight: 1
        required: true
      - id: point1
        criterion: "Explain that we collect examples with their real targets from the new setting and evaluate the model there."
        weight: 1
        required: true
    exemplar: "Distribution shift means the examples we want to predict come from a different distribution than the examples we tested on. We collect examples with their real targets from the new setting and evaluate the model there."
  - id: gen-recall-shift-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gen-changed-source
    difficulty: 1
    est_minutes: 0.5
    prompt: "Which change is distribution shift for a house-price model tested in one city?"
    options:
      - id: a
        text: "New independent sales arrive from the same unchanged market."
        correct: false
        feedback: "New independent sales from the unchanged source keep the old test score relevant."
      - id: b
        text: "A second agency sends an exact copy of every sale record."
        correct: false
        feedback: "Copying every record keeps the mix the same. The copies are related and can leak across a split."
      - id: c
        text: "Familiar house sizes sell for higher prices in a new city."
        correct: true
        feedback: "The relationship between house size and price has changed, which is distribution shift."
    solution: "Familiar house sizes can have different prices in a new market. That change is distribution shift."
  - id: gen-recall-shift-contrast2
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gen-changed-source
    difficulty: 1
    est_minutes: 0.5
    prompt: "A house-price model has low test error in its original city. You want to use the same model in a new city. Which check measures average prediction error for the new city?"
    options:
      - id: a
        text: "Score the model again on held-out sales from the original city."
        correct: false
        feedback: "A fresh set from the original market only estimates error for that market."
      - id: b
        text: "Score the model on new-city sales with recorded prices."
        correct: true
        feedback: "Recorded prices from the new city let you measure the model’s errors on the sales it will now predict."
      - id: c
        text: "Compare the distribution of house sizes in the two cities."
        correct: false
        feedback: "Similar house sizes can sell at different prices. Comparing sizes by themselves gives no prediction errors."
    solution: "Compare predictions with recorded sale prices from the new city to estimate the average error there."
  - id: gen-recall-records-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: gen-related-records
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what is data leakage, and how does a group split prevent the duplicate-house shortcut when evaluating new-house predictions?"
    rubric:
      - id: point0
        criterion: "Explain that data leakage occurs when information that should be unavailable for a prediction influences training or model selection."
        weight: 1
        required: true
      - id: point1
        criterion: "Explain that a group split keeps all records of one house in the same group so a copy of an evaluated house stays out of training."
        weight: 1
        required: true
    exemplar: "Data leakage occurs when information that should be unavailable for a prediction influences training or model selection. A group split keeps all records of one house in the same group so a copy of an evaluated house stays out of training."
  - id: gen-recall-records-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gen-related-records
    difficulty: 1
    est_minutes: 0.5
    prompt: "A price model’s validation error rises after you replace a random row split with a split that keeps each house together. Which problem with the row split could explain the rise?"
    options:
      - id: a
        text: "The split had a similar mix of house sizes on both sides."
        correct: false
        feedback: "Similar house sizes make the two groups easier to compare. A large jump after grouping can point to copies across the old split."
      - id: b
        text: "The split had more sales in training than in validation."
        correct: false
        feedback: "Different set sizes can affect how steady the scores are. They do not give the model access to validation prices."
      - id: c
        text: "The split put copies of the same sale on opposite sides."
        correct: true
        feedback: "Copies in training can reveal validation prices. Keeping each house together removes that shortcut."
    solution: "Grouping keeps copies of validation houses out of training, so the model can no longer get those prices by recognizing houses it already saw."
  - id: gen-recall-records-contrast2
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gen-related-records
    difficulty: 1
    est_minutes: 0.5
    prompt: "A price model will be trained once at the end of 2023 to score sales in 2024. You already removed duplicate records. Which validation split best mirrors this setup?"
    options:
      - id: a
        text: "Train on 2023 sales and check on 2024 sales."
        correct: true
        feedback: "A time split gives the model only sales it could have seen before making predictions."
      - id: b
        text: "Randomly assign sales from both years to training and validation."
        correct: false
        feedback: "A random split can let 2024 prices influence predictions of 2023 sales."
      - id: c
        text: "Assign neighbourhoods to training or validation, using both years."
        correct: false
        feedback: "Grouping by neighbourhood separates places. The training groups could still contain later sales."
    solution: "Train on the earlier year and check the later year, as the model will do when it makes predictions."
