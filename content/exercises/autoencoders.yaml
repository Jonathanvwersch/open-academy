  - id: ae-recall-error-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: ae-reconstruction
    difficulty: 1
    est_minutes: 0.5
    prompt: "What stops a basic autoencoder from simply passing every input pixel straight through?"
    options:
      - id: a
        text: "A latent vector with fewer numbers than the input."
        correct: true
        feedback: "The narrow middle forces the network to find patterns that let it rebuild the image."
      - id: b
        text: "An unlabelled training set with many different images."
        correct: false
