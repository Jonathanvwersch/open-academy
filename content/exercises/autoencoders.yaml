  - id: ae-recall-latent-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: ae-latent-space
    difficulty: 1
    est_minutes: 0.5
    prompt: "Two latent vectors are $(a,b)$ and $(c,d)$. Write their straight-line distance. Type `sqrt(...)` for a square root."
    answer: "sqrt((a-c)^2+(b-d)^2)"
    variables: { "a": [-2, 2], "b": [-2, 2], "c": [-2, 2], "d": [-2, 2] }
    solution: "Square matching-coordinate differences, add and take the square root: $\\sqrt{(a-c)^2+(b-d)^2}$."
