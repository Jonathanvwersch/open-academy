  - id: ae-recall-sizes-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: ae-sizes
    difficulty: 1
    est_minutes: 0.5
    prompt: "An image contains $n$ input values and its latent vector contains $k$ values. Write the compression factor."
    answer: "n/k"
    variables: { "n": { "values": [500, 1000, 2000] }, "k": { "values": [2, 32, 128] } }
