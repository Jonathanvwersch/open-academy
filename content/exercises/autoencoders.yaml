  - id: ae-recall-encode-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: ae-encode-decode
    difficulty: 1
    est_minutes: 0.5
    prompt: "An autoencoder has processed a new image through its encoder. Which values go into the decoder to rebuild the image?"
    options:
      - id: a
        text: "The values in the encoder’s weight matrix."
        correct: false
        feedback: "The encoder shares its weights across images. It uses them to produce a different vector for each image."
      - id: b
        text: "The values in the flattened input image."
        correct: false
        feedback: "The encoder reads the original image and produces the values the decoder needs."
      - id: c
        text: "The values in the encoder’s latent vector."
        correct: true
        feedback: "The decoder uses the latent vector to produce a reconstruction with the original input size."
    solution: "The decoder reads the latent vector from the encoder and outputs the reconstructed pixel values."
  - id: ae-recall-encode-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: ae-encode-decode
    difficulty: 1
    est_minutes: 0.5
    prompt: "A one-layer decoder has weight matrix $W_d$ and bias $b_d$. Fill in the missing input: $\\hat x=W_d\\,\\underline{\\quad}+b_d$. Type its symbol or name."
    accept:
      [
        "z",
        "latent vector",
        "the latent vector",
        "latent representation",
        "encoded vector",
        "encoder output",
        "output of the encoder",
      ]
    regex: "^\\s*(?:(?=\\$[\\s\\S]*\\$\\s*$)|(?=\\x60[\\s\\S]*\\x60\\s*$)|(?=\\\\\\([\\s\\S]*\\\\\\)\\s*$)|(?!\\$|\\x60|\\\\\\()(?![\\s\\S]*(?:\\$|\\x60|\\\\\\))\\s*$))(?:\\$|\\x60|\\\\\\()?\\s*(?:z|\\(\\s*z\\s*\\)|\\\\(?:mathbf|boldsymbol|vec)\\s*(?:\\{\\s*z\\s*\\}|z)|(?:(?:the|an?)\\s+)?(?:latent\\s+(?:vector|representation|code|values)|encoded\\s+(?:vector|representation|image)|encoder(?:[’\\x27]s)?\\s+output(?:\\s+vector)?|output(?:\\s+vector)?\\s+of\\s+the\\s+encoder))\\s*(?:\\$|\\x60|\\\\\\))?\\s*$"
    solution: "The decoder reads the latent vector $z$, giving $\\hat x=W_dz+b_d$."
