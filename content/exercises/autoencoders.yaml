    solution: "The narrow middle forces the network to find patterns that let it rebuild the image."
  - id: ae-recall-error-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: ae-reconstruction
    difficulty: 1
    est_minutes: 0.5
    prompt: "An image has two pixel values $x_1$ and $x_2$. Its reconstruction has values $\\hat x_1$ and $\\hat x_2$ in the same positions. Write the reconstruction error $E$ for this image. Type `x_1`, `x_2`, `xhat_1` and `xhat_2`."
    answer: "(xhat_1-x_1)^2+(xhat_2-x_2)^2"
    variables: { "x_1": [0, 1], "x_2": [0, 1], "xhat_1": [0, 1], "xhat_2": [0, 1] }
    solution: "Square each pixel’s difference and add the results to get $(\\hat x_1-x_1)^2+(\\hat x_2-x_2)^2$."
