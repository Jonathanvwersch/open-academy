    prompt: "For one logistic-regression example with binary cross-entropy, write the updated weight from current weight $w$, probability $p$, observed label $y$, input $x$ and learning rate $\\eta$. Type `eta` for the learning rate."
    answer: "w-eta*(p-y)*x"
    variables:
      {
        "w": [-2, 2],
        "p": [0.05, 0.95],
        "y": { "values": [0, 1] },
        "x": [1, 5],
        "eta": [0.01, 0.2],
      }
