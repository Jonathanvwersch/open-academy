concept: logistic-regression
exercises:
  - id: lr-classification-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: "What is binary classification?"
    options:
      - id: a
        text: "Predicting an exact numerical amount for each input."
        correct: false
        category: misunderstood_definition
        feedback: "That is regression; binary classification predicts one of two labels."
      - id: b
        text: "Predicting one of two categories from the input features."
        correct: true
        feedback: "Correct. Here the labels record whether a house sells above asking."
      - id: c
        text: "Sorting inputs by their feature values without predicting a label."
        correct: false
        category: misunderstood_definition
        feedback: "Classification uses features to predict a category, not just sort the inputs."
      - id: d
        text: "Changing model weights until the training error is zero."
        correct: false
        category: misunderstood_definition
        feedback: "That describes a possible training goal, not what classification means."
    solution: "Binary classification predicts one of two labels from input features, such as above asking or not above asking."
  - id: lr-score-numeric
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For weights `(0.4, -0.2)`, features `(2, 1)` and bias `0.1`, what is the linear score `z`?"
    answer: 0.7
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 0.6,
          category: math_error,
          feedback: "That omits the bias. Add 0.1 to the two weighted feature contributions.",
        }
      - {
          answer: 1.1,
          category: math_error,
          feedback: "Check the sign of the second weight: its contribution is `-0.2 × 1`.",
        }
    solution: "Compute $0.4(2)=0.8$ and $-0.2(1)=-0.2$, then add the bias: $0.8-0.2+0.1=0.7$."
  - id: lr-score-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why can the linear score not be read directly as the probability that a house sells above asking?"
    options:
      - id: a
        text: "It is computed from features, so it is already a calibrated probability."
        correct: false
        category: misunderstood_definition
        feedback: "A weighted sum is not automatically calibrated or restricted to the probability range."
      - id: b
        text: "The score is always an integer, but probabilities must be decimals."
        correct: false
        category: misunderstood_definition
        feedback: "A linear score can be fractional; the problem is that it is not restricted to the probability range."
      - id: c
        text: "The score already tells us which training example was used."
        correct: false
        category: misunderstood_definition
        feedback: "The score is a model output, not an identifier for a training example."
      - id: d
        text: "The score can be negative or greater than 1, outside the probability range."
        correct: true
        feedback: "Correct. A probability must lie between 0 and 1, while a linear score is unrestricted."
    solution: "A weighted score can be any real value, so it must be mapped to the 0-to-1 range before it can represent a probability."
  - id: lr-score-read
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "What linear scores does this NumPy code print?"
    code: |
      import numpy as np

      weights = np.array([0.4, -0.2])
      features = np.array([[2.0, 1.0], [1.0, 3.0]])
      bias = 0.1
      scores = features @ weights + bias
      print(np.round(scores, 2).tolist())
    accept: ["[0.7, -0.1]"]
    solution: "The two rows give $0.4(2)-0.2(1)+0.1=0.7$ and $0.4(1)-0.2(3)+0.1=-0.1$."
  - id: lr-score-complete
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Complete the NumPy expression that calculates the linear score from the features, weights and bias."
    code: |
      import numpy as np

      features = np.array([2.0, 1.0])
      weights = np.array([0.4, -0.2])
      bias = 0.1
      score = ____
      print(round(float(score), 1))
    accept: ["features @ weights + bias", "np.dot(features, weights) + bias"]
    solution: "The score is the weighted feature sum plus the bias: $0.4(2)-0.2(1)+0.1=0.7$."
  - id: lr-sigmoid-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: "What does the sigmoid function do to a linear score?"
    options:
      - id: a
        text: "Maps any real score to a value between 0 and 1."
        correct: true
        feedback: "Correct. Its output can be interpreted as a probability for the positive label."
      - id: b
        text: "Maps every score to either exactly 0 or exactly 1."
        correct: false
        category: misunderstood_definition
        feedback: "For finite scores, sigmoid returns a probability strictly between 0 and 1."
      - id: c
        text: "Adds the score to the house's asking price."
        correct: false
        category: misunderstood_definition
        feedback: "Sigmoid transforms the score; it does not add it to a price."
      - id: d
        text: "Forces every score to be positive without an upper limit."
        correct: false
        category: misunderstood_definition
        feedback: "Sigmoid has an upper bound of 1, so its output is a probability-scale value."
    solution: "The sigmoid maps a real-valued score to a probability strictly between 0 and 1."
  - id: lr-sigmoid-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why does a score of `z = 0` give probability `0.5` and sit at the decision boundary?"
    options:
      - id: a
        text: "The sigmoid treats zero as a missing feature and skips the prediction."
        correct: false
        category: misunderstood_definition
        feedback: "Zero is a valid score; the sigmoid evaluates it normally."
      - id: b
        text: "The sigmoid is undefined at zero, so it substitutes one half."
        correct: false
        category: misunderstood_definition
        feedback: "The sigmoid is defined at zero: $1/(1+e^0)=1/2$."
      - id: c
        text: "The sigmoid formula gives `1 / (1 + 1)`, exactly one half."
        correct: true
        feedback: "Correct. Scores on either side of zero map below or above the 0.5 threshold."
      - id: d
        text: "A score of zero means the target label must be one half."
        correct: false
        category: misunderstood_definition
        feedback: "The label remains 0 or 1; 0.5 is the model's predicted probability."
    solution: "At zero, $e^{-z}=1$, so the sigmoid is $1/(1+1)=0.5$, the threshold between the two predicted classes."
  - id: lr-sigmoid-fixed
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For score `z = 0.5`, what probability does the sigmoid assign to the positive label? Give 3 decimal places."
    answer: 0.622
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 0.5,
          category: math_error,
          feedback: "That is the score, not its sigmoid output. Evaluate `1 / (1 + exp(-0.5))`.",
        }
      - {
          answer: 0.378,
          category: math_error,
          feedback: "That is approximately the probability of the negative label, `1 - p`.",
        }
    solution: "The sigmoid gives $1/(1+e^{-0.5})\\approx0.622459$, so the probability is about 0.622."
  - id: lr-sigmoid-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 3
    prompt: "For score `z = {{z}}`, compute the sigmoid probability `1 / (1 + exp(-z))`."
    params:
      z: { min: -2, max: 2, step: 1 }
    constraints: ["z != 0"]
    answer_expr: "1 / (1 + exp(-z))"
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "z",
          category: misunderstood_definition,
          feedback: "A score is not yet a probability; apply the sigmoid to it.",
        }
      - {
          answer_expr: "1 / (1 + exp(z))",
          category: math_error,
          feedback: "The sigmoid exponent is the negative score, `-z`.",
        }
    solution: "Substitute the score into $1/(1+e^{-z})$; this maps any real score into a probability between 0 and 1."
  - id: lr-sigmoid-read
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "What probabilities does this NumPy code print for scores `0`, `0.5` and `-0.5`?"
    code: |
      import numpy as np

      scores = np.array([0.0, 0.5, -0.5])
      probabilities = 1 / (1 + np.exp(-scores))
      print(np.round(probabilities, 6).tolist())
    accept: ["[0.5, 0.622459, 0.377541]"]
    solution: "Applying the sigmoid gives 0.5 at zero, about 0.622 for 0.5, and about 0.378 for -0.5."
  - id: lr-sigmoid-complete
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Complete the NumPy expression so a positive score produces a probability above 0.5."
    code: |
      import numpy as np

      z = 0.5
      probability = 1 / (1 + np.exp(____))
      print(round(float(probability), 3))
    accept: ["-z", "-1 * z"]
    solution: "The sigmoid is $1/(1+e^{-z})$, so the exponent is the negative score."
  - id: lr-bce-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: "What does binary cross-entropy measure?"
    options:
      - id: a
        text: "The distance between house features and their average values."
        correct: false
        category: misunderstood_definition
        feedback: "Cross-entropy compares a predicted class probability with its binary label."
      - id: b
        text: "The number of houses that belong to the positive class."
        correct: false
        category: misunderstood_definition
        feedback: "It is a loss score for predictions, not a count of examples."
      - id: c
        text: "The difference between the score and the probability threshold."
        correct: false
        category: misunderstood_definition
        feedback: "The threshold converts a probability to a class; cross-entropy scores the probability against the label."
      - id: d
        text: "A loss for a predicted probability and a binary label."
        correct: true
        feedback: "Correct. It is small for a confident correct probability and large for a confident wrong one."
    solution: "Binary cross-entropy scores how well a probability assigned to the positive class matches the observed binary label."
  - id: lr-bce-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "Why is cross-entropy useful when a house-sale model is confidently wrong?"
    options:
      - id: a
        text: "Its loss grows sharply as the model assigns near-zero probability to the true label."
        correct: true
        feedback: "Correct. For a positive label, the loss `-ln(p)` grows without bound as `p` approaches zero."
      - id: b
        text: "It changes a wrong target label into the predicted probability."
        correct: false
        category: misunderstood_definition
        feedback: "The target remains the observed 0 or 1; the loss scores the model's probability against it."
      - id: c
        text: "It caps every incorrect prediction at a loss of one."
        correct: false
        category: misunderstood_definition
        feedback: "Squared error is bounded by one for probabilities; cross-entropy can grow larger."
      - id: d
        text: "It ignores predictions that are close to zero or one."
        correct: false
        category: misunderstood_definition
        feedback: "The loss is especially sensitive to confident predictions that give little probability to the true label."
    solution: "When the true label is 1, assigning probability $p$ incurs $-\\ln(p)$, which becomes large as $p$ approaches zero."
  - id: lr-bce-positive
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For target `y = 1` and probability `p = 0.8`, compute the binary cross-entropy using natural logs."
    answer: 0.223144
    tolerance: { abs: 0.00001 }
    common_wrong:
      - {
          answer: 0.8,
          category: misunderstood_definition,
          feedback: "The probability is not the loss; use `-ln(p)` when the label is 1.",
        }
      - {
          answer: 0.2,
          category: math_error,
          feedback: "That is `1-p`, not its negative natural logarithm.",
        }
    solution: "For $y=1$, the formula reduces to $-\\ln(0.8)\\approx0.223144$."
  - id: lr-bce-negative
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For target `y = 0` and probability `p = 0.8` for label 1, compute the binary cross-entropy using natural logs."
    answer: 1.609438
    tolerance: { abs: 0.00001 }
    common_wrong:
      - {
          answer: 0.223144,
          category: math_error,
          feedback: "That is the loss for label 1. For label 0, use `-ln(1-p)`.",
        }
      - {
          answer: 0.8,
          category: misunderstood_definition,
          feedback: "Use the probability assigned to the true label, which is `1-p` here, then take its negative natural log.",
        }
    solution: "For $y=0$, the formula reduces to $-\\ln(1-0.8)=-\\ln(0.2)\\approx1.609438$."
  - id: lr-bce-read
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "What loss does this NumPy code print for the positive label and a confident wrong probability?"
    code: |
      import numpy as np

      label = 1.0
      probability = 0.01
      loss = -(
          label * np.log(probability)
          + (1 - label) * np.log(1 - probability)
      )
      print(round(float(loss), 5))
    answer: 4.60517
    tolerance: { abs: 0.00001 }
    solution: "With $y=1$, the loss is $-\\ln(0.01)\\approx4.60517$."
  - id: lr-bce-complete
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Complete the positive-label term in the NumPy binary cross-entropy calculation."
    code: |
      import numpy as np

      label = 1.0
      probability = 0.8
      loss = -(
          label * ____
          + (1 - label) * np.log(1 - probability)
      )
      print(round(float(loss), 6))
    accept: ["np.log(probability)", "np.log(float(probability))"]
    solution: "The positive-label term is $\\ln(p)$, so the loss is $-\\ln(0.8)\\approx0.223144$."
  - id: lr-gradient-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: "What does the score gradient `p - y` tell us?"
    options:
      - id: a
        text: "The probability that the house is sold at all."
        correct: false
        category: misunderstood_definition
        feedback: "The probability is `p`; `p - y` is the loss derivative with respect to the score."
      - id: b
        text: "The number of features used by the linear model."
        correct: false
        category: misunderstood_definition
        feedback: "Feature count is unrelated to this score derivative."
      - id: c
        text: "How the loss changes when the linear score changes slightly."
        correct: true
        feedback: "Correct. This derivative guides the gradient-descent update to the score and parameters."
      - id: d
        text: "The class predicted after applying the 0.5 threshold."
        correct: false
        category: misunderstood_definition
        feedback: "The predicted class is 0 or 1; `p-y` is a derivative that can take other values."
    solution: "The derivative $p-y$ measures how the binary cross-entropy changes as the linear score changes."
  - id: lr-convex-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "Why is binary cross-entropy convex in the parameters of logistic regression?"
    options:
      - id: a
        text: "Every gradient-descent step is guaranteed to reach the global minimum."
        correct: false
        category: misunderstood_definition
        feedback: "Convexity rules out non-global local minima, but a fixed step size can still fail to converge."
      - id: b
        text: "Its score curvature is `p(1-p) > 0`, and the score is affine in the parameters."
        correct: true
        feedback: "Correct. A convex loss composed with an affine score remains convex in the model parameters."
      - id: c
        text: "The sigmoid makes the predicted class exactly correct for every house."
        correct: false
        category: misunderstood_definition
        feedback: "Convexity describes the shape of the loss, not whether each prediction is correct."
      - id: d
        text: "The loss is convex because all probabilities are greater than one half."
        correct: false
        category: misunderstood_definition
        feedback: "Probabilities can be below one half; the positive curvature is `p(1-p)` for any `0<p<1`."
    solution: "The second derivative with respect to the score is $p(1-p)>0$. Because the score is affine in the weights and bias, the loss is convex in those parameters."
  - id: lr-gradient-formula
    dimension: math
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 3
    prompt: "Enter the derivative of binary cross-entropy with respect to the score, using `p` for probability and `y` for the label."
    answer: "p - y"
    variables: { p: [0.1, 0.9], y: [0, 1] }
    common_wrong:
      - {
          answer: "y - p",
          category: math_error,
          feedback: "That reverses the derivative's sign; the derivative is probability minus label.",
        }
      - {
          answer: "p - (1 - y)",
          category: math_error,
          feedback: "Use the observed label, not its complement, in the probability-minus-label derivative.",
        }
    solution: "The chain-rule derivation simplifies to $\\partial L/\\partial z=p-y$."
  - id: lr-gradient-weight
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For feature `x = 2`, probability `p = 0.7` and label `y = 1`, what is the weight gradient `(p-y)x`?"
    answer: -0.6
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 0.6,
          category: math_error,
          feedback: "The derivative is `p-y`, not `y-p`, so keep the negative sign.",
        }
      - {
          answer: -0.3,
          category: math_error,
          feedback: "Multiply the score gradient by the feature value, 2.",
        }
    solution: "The score gradient is $0.7-1=-0.3$. Multiply by the feature: $(-0.3)(2)=-0.6$."
  - id: lr-gradient-read
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "What weight and bias does this NumPy gradient step produce?"
    code: |
      import numpy as np

      features = np.array([2.0])
      weights = np.array([0.25])
      bias = 0.0
      target = 1.0
      learning_rate = 0.1
      score = features @ weights + bias
      probability = 1 / (1 + np.exp(-score))
      score_gradient = probability - target
      weight_gradient = score_gradient * features
      bias_gradient = score_gradient
      weights = weights - learning_rate * weight_gradient
      bias = bias - learning_rate * bias_gradient
      print(round(float(weights[0]), 6), round(float(bias), 6))
    accept: ["0.325508 0.037754"]
    solution: "The gradients are about $-0.755081$ for the weight and $-0.377541$ for the bias. Subtracting 0.1 times each gives weight 0.325508 and bias 0.037754."
  - id: lr-gradient-complete
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Complete the NumPy score gradient from the predicted probability and binary label."
    code: |
      import numpy as np

      probability = 0.7
      label = 1.0
      score_gradient = ____
      print(round(float(score_gradient), 1))
    accept: ["probability - label", "probability + (-label)"]
    solution: "The score derivative is $p-y$, so here it is $0.7-1=-0.3$."
  - id: lr-explain-logistic-regression
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 5
    prompt: "Explain how logistic regression turns house features into a probability of selling above asking, how binary cross-entropy scores the result, and how the gradient updates the model."
    rubric:
      - {
          id: probability,
          criterion: "Explains that a linear score is mapped by sigmoid to a probability and that a threshold gives a binary class",
          weight: 1,
          required: true,
        }
      - {
          id: loss,
          criterion: "Gives the binary cross-entropy formula with natural logarithms and explains its penalty for confident wrong predictions",
          weight: 1,
          required: true,
        }
      - {
          id: gradient,
          criterion: "Derives or states the score gradient p-y and connects it to weight and bias updates",
          weight: 1,
          required: true,
        }
    exemplar: "The model first computes a linear score z from the house features. The sigmoid maps z to p, the estimated probability that the house sells above asking; a 0.5 threshold predicts the label. For binary label y, cross-entropy is −[y ln p + (1−y) ln(1−p)], using natural logs. It gives a large loss when the model assigns a tiny probability to the true outcome. By the chain rule, the sigmoid derivative p(1−p) multiplied by the BCE derivative simplifies to dL/dz = p−y. The weight gradient is (p−y)x and the bias gradient is p−y, so gradient descent subtracts a learning-rate-scaled gradient from each parameter."
  - id: lr-score-recover-bias
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A binary classifier for a robot has one sensor feature $x=2$ and weight $w=3$.
      Its linear score is $z=-1$. What bias $b$ gives that score in $z=wx+b$?"
    answer: -7
    tolerance: { abs: 0.000001 }
    solution: |
      Substitute the known score, feature and weight.

      $$-1=3(2)+b.$$

      $$-1=6+b.$$

      Subtract 6 from both sides.

      $$b=-7.$$
  - id: lr-sigmoid-recover-score
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A sigmoid classifier assigns probability $p=0.8$ to label 1. What score $z$
      produced it? Use $p=1/(1+e^{-z})$ and natural logarithms."
    answer: 1.38629436112
    tolerance: { abs: 0.000001 }
    solution: |
      Rearrange the sigmoid to isolate the exponential.

      $$e^{-z}=\frac{1}{0.8}-1.$$

      $$e^{-z}=0.25.$$

      Take natural logarithms.

      $$-z=\ln(0.25).$$

      $$z=\ln(4)\approx1.386294.$$
