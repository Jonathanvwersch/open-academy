concept: logistic-regression
exercises:
  - id: lr-classification-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What makes a task binary classification?
    options:
      - {
          id: a,
          text: "It predicts one of two possible categories.",
          correct: true,
          feedback: "The two labels name categories rather than amounts.",
        }
      - {
          id: b,
          text: "It predicts an amount using two features.",
          correct: false,
          feedback: "Binary refers to the number of categories, not features.",
        }
      - {
          id: c,
          text: "It predicts any number between two prices.",
          correct: false,
          feedback: "A range of amounts is still an amount-prediction task.",
        }
    solution: Binary classification predicts one of two categories; the number of input features can vary.
  - id: lr-classification-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does the worked example stop short of calling its score 2 a probability?
    options:
      - {
          id: a,
          text: "A probability cannot be greater than one.",
          correct: true,
          feedback: "The score still needs conversion to a chance.",
        }
      - {
          id: b,
          text: "Every positive score must be a price.",
          correct: false,
          feedback: "Scores are not prices unless the task defines them that way.",
        }
      - {
          id: c,
          text: "A probability must be either zero or one.",
          correct: false,
          feedback: "Those are the labels; probabilities can lie between them.",
        }
    solution: The weighted sum can exceed one, but a probability cannot; a score is a different quantity.
  - id: lr-classification-faded
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: A house had $x=3$ viewings. The model has weight $w=2$ and bias $b=-2$. What is the model's score?
    answer: 4
    tolerance:
      abs: 1.0e-06
    solution: Add the bias once after the weighted input, giving $6-2=4$.
  - id: lr-classification-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      A house had $x={{=x}}$ viewings in its first week. The model has weight $w={{=w}}$ and bias $b={{=b}}$.
      What is the model's score?
    params:
      x:
        min: 0
        max: 4
      w:
        min: 1
        max: 3
      b:
        min: -3
        max: 0
    answer_expr: w*x+b
    tolerance:
      abs: 1.0e-06
    solution: Multiply the input by its weight and add the bias once; the score is ${{=w*x+b}}$, not yet a probability.
  - id: lr-classification-confusion
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: Two houses get scores $z=0$ and $z=-3$. Which statement is correct?
    options:
      - id: a
        text: Neither score is a probability yet, since a score can be any number.
        correct: true
        feedback: The score must be converted to a probability.
      - id: b
        text: The first house has zero chance of selling, since its score is zero.
        correct: false
        feedback: A zero score becomes a 0.5 chance after conversion to a probability.
      - id: c
        text: The second house has a negative chance of selling, so the model is broken.
        correct: false
        feedback: A negative score is valid and becomes a probability between zero and one.
      - id: d
        text: Both houses have zero chance of selling, since neither score is positive.
        correct: false
        feedback: A nonpositive score still gives a positive sigmoid probability.
    solution:
      A weighted score can be any real number. Convert each score to a probability before interpreting it
      as a chance of selling.
  - id: lr-classification-transfer
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A robot predicts whether a doorway is blocked. With sensor reading $x=2$ and weight $w=3$, its score is
      $z=-1$. Find the bias.
    answer: -7
    tolerance:
      abs: 1.0e-06
    solution: The weighted input is 6, so the bias must be $-1-6=-7$ to give the stated score.
  - id: lr-sigmoid-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does the sigmoid do in logistic regression?
    options:
      - {
          id: a,
          text: "It converts a score into an estimated probability.",
          correct: true,
          feedback: "The output is strictly between zero and one for finite scores.",
        }
      - {
          id: b,
          text: "It converts an observed label into a feature.",
          correct: false,
          feedback: "The observed label is not the input to the sigmoid.",
        }
      - {
          id: c,
          text: "It converts every score directly into a class.",
          correct: false,
          feedback: "A separate threshold turns the probability into a class.",
        }
    solution: The sigmoid maps a freely ranging score to a probability; thresholding is a separate decision step.
  - id: lr-sigmoid-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does step 3 of the worked example predict label 1 after finding a probability of 0.88?
    options:
      - {
          id: a,
          text: "The probability is at least the chosen one-half threshold.",
          correct: true,
          feedback: "The prediction follows the chosen cut-off.",
        }
      - {
          id: b,
          text: "The probability proves that the observed label must be one.",
          correct: false,
          feedback: "A prediction does not prove the outcome.",
        }
      - {
          id: c,
          text: "The probability must first be rounded up to exactly one.",
          correct: false,
          feedback: "Keep the probability; compare it with the threshold instead.",
        }
    solution: The chosen decision rule predicts label 1 at or above one half, while retaining uncertainty in the probability.
  - id: lr-sigmoid-faded
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: A house has score $z=0$. What probability of selling does the sigmoid give it?
    answer: 0.5
    tolerance:
      abs: 1.0e-06
    solution: At score zero, the sigmoid gives $1/(1+e^0)=1/2$, so the estimated chance of selling is 0.5.
  - id: lr-sigmoid-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: 'A score is $z=\ln({{=k}})$. Find its sigmoid probability as an exact fraction or to four decimal places.'
    params:
      k: { min: 2, max: 5 }
    answer_expr: k/(k+1)
    tolerance: { abs: 0.0001 }
    solution: The exponential $e^{-z}$ is the reciprocal of $e^{\ln({{=k}})}$, so it equals $1/{{=k}}$. Substituting into the sigmoid gives ${{=k}}/{{=k+1}}$.
  - id: lr-sigmoid-confusion
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: A model gives label 1 probability $3/4$ and predicts label 1. Which interpretation is justified?
    options:
      - id: a
        text: Label 1 is the decision but label 0 remains possible.
        correct: true
        feedback: A thresholded decision does not remove uncertainty.
      - id: b
        text: Label 1 is certain because its chance exceeds one half.
        correct: false
        feedback: Exceeding the threshold is not the same as certainty.
      - id: c
        text: Label 0 should be predicted one time in four because its probability is $1/4$.
        correct: false
        feedback:
          The threshold rule picks label 1 here each time; it does not sample labels in proportion to their
          probabilities.
    solution:
      A probability of three quarters leaves one quarter for the other label, even though the decision is
      label 1.
  - id: lr-sigmoid-transfer
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: 'A robot assigns score $z=-\ln3$ to “door blocked”, label 1. Using threshold $1/2$, which label does it predict? Enter 0 or 1.'
    answer: 0
    tolerance: { abs: 0.000001 }
    solution: Here $e^{-z}=e^{\ln 3}=3$, so the sigmoid gives $1/(1+3)=1/4$. This is below one half, so the predicted label is 0.
  - id: lr-bce-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does binary cross-entropy penalise most strongly?
    options:
      - {
          id: a,
          text: "Giving very little probability to the observed label.",
          correct: true,
          feedback: "The negative log grows as that probability shrinks.",
        }
      - {
          id: b,
          text: "Giving very high probability to the observed label.",
          correct: false,
          feedback: "High probability for the true label gives a small loss.",
        }
      - {
          id: c,
          text: "Giving any probability that is not a whole number.",
          correct: false,
          feedback: "Fractional probabilities express uncertainty and are expected.",
        }
    solution: Cross-entropy is the negative logarithm of the probability of the true label, so little support for that label incurs a large penalty.
  - id: lr-bce-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does the worked example use $-\ln0.119$ rather than $-\ln0.881$?
    options:
      - {
          id: a,
          text: "The house sold, so $y=1$, and the model gave label 1 probability 0.119.",
          correct: true,
          feedback: "Choose the term for the observed label.",
        }
      - {
          id: b,
          text: "The loss always chooses whichever of the two probabilities is larger.",
          correct: false,
          feedback: "For a confident wrong prediction the true-label probability is smaller.",
        }
      - {
          id: c,
          text: "The loss always ignores the observed label and uses the predicted class.",
          correct: false,
          feedback: "The observed label selects which probability is scored.",
        }
    solution: Label 1 selects $p$ in the loss; label 0 would select $1-p$ instead.
  - id: lr-bce-faded
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      A house sold ($y=1$), and the model gave it probability $p=1/2$ of selling. Find the binary cross-entropy
      loss to four decimal places.
    answer: 0.69314718056
    tolerance:
      abs: 0.0001
    solution: The observed label selects $p$, giving $-\ln(1/2)=\ln2\approx0.6931$.
  - id: lr-bce-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For $y={{=y}}$ and predicted probability $p={{=k}}/4$ of label 1, calculate binary cross-entropy using natural logarithms. Give four decimal places."
    params:
      y: { min: 0, max: 1 }
      k: { min: 1, max: 3 }
    answer_expr: -(y*log(k/4)+(1-y)*log(1-k/4))
    tolerance: { abs: 0.0001 }
    solution: Choose $p$ for label 1 or $1-p$ for label 0 and take its negative natural logarithm; the loss is ${{=-(y*log(k/4)+(1-y)*log(1-k/4))}}$.
  - id: lr-bce-confusion
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "With observed label 1, both $p=3/4$ and $p=1/2$ predict label 1 at threshold $1/2$. How do their losses compare?"
    options:
      - {
          id: a,
          text: "Three quarters has smaller loss because it supports the true label more.",
          correct: true,
          feedback: "The negative logarithm decreases as true-label probability rises.",
        }
      - {
          id: b,
          text: "Both have zero loss because both predicted classes are correct.",
          correct: false,
          feedback: "The loss scores probabilities rather than just class correctness.",
        }
      - {
          id: c,
          text: "One half has smaller loss because uncertainty is always rewarded.",
          correct: false,
          feedback: "Cross-entropy rewards probability assigned to the observed label.",
        }
    solution: The losses are $\ln(4/3)$ and $\ln2$ respectively; the larger true-label probability has smaller loss.
  - id: lr-bce-transfer
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A robot gives “door blocked” probability $3/4$, but the door is clear ($y=0$). Compute its binary cross-entropy to four decimal places."
    answer: 1.38629436112
    tolerance: { abs: 0.0001 }
    solution: The true-label probability is $1-3/4=1/4$, so the loss is $-\ln(1/4)=\ln4\approx1.3863$.
  - id: lr-bce-squared-error
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "A house sold ($y=1$), but the model gave it $p=0.01$. Why does binary cross-entropy punish this more than squared error would?"
    options:
      - {
          id: a,
          text: "Its loss, $-\\ln0.01\\approx4.6$, keeps growing, but squared error stays below 1.",
          correct: true,
          feedback: "Cross-entropy climbs without limit as the probability of the true label shrinks.",
        }
      - {
          id: b,
          text: "Squared error is zero whenever the decision is wrong, so it gives no push.",
          correct: false,
          feedback: "Squared error here is $(0.01-1)^2\\approx0.98$, not zero.",
        }
      - {
          id: c,
          text: "Cross-entropy ignores the label and only looks at how small $p$ is.",
          correct: false,
          feedback: "The label chooses whether the loss uses $p$ or $1-p$.",
        }
    solution: "Squared error is $(0.01-1)^2\\approx0.98$, close to its largest possible value of 1, while cross-entropy is $-\\ln0.01\\approx4.61$ and keeps rising as $p$ falls further."
  - id: lr-gradient-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does probability minus observed label give for sigmoid plus binary cross-entropy?
    options:
      - {
          id: a,
          text: "The loss derivative with respect to the score.",
          correct: true,
          feedback: "This is the score slope used to build parameter gradients.",
        }
      - {
          id: b,
          text: "The final class after applying the threshold.",
          correct: false,
          feedback: "A class is zero or one; the derivative can be negative.",
        }
      - {
          id: c,
          text: "The loss derivative for every weight without scaling.",
          correct: false,
          feedback: "Each weight slope also multiplies by its input.",
        }
    solution: The slope of the loss with respect to the score works out to $p-y$, and each weight slope multiplies this by its input.
  - id: lr-gradient-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does step 2 multiply the score slope by 2 for the weight but not for the bias?
    options:
      - {
          id: a,
          text: "The input is 2, while the bias changes the score one-for-one.",
          correct: true,
          feedback: "The score derivatives with respect to weight and bias are x and 1.",
        }
      - {
          id: b,
          text: "There are two labels, so every weight slope must be doubled.",
          correct: false,
          feedback: "The factor comes from the input value, not the label count.",
        }
      - {
          id: c,
          text: "The bias never affects the score, so its derivative is ignored.",
          correct: false,
          feedback: "The bias affects the score directly and has slope p-y.",
        }
    solution: In $z=wx+b$, raising $w$ by a small amount raises the score by $x$ times that amount, while raising $b$ raises it by the same amount.
  - id: lr-gradient-faded
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt:
      A house with $x=4$ viewings sold ($y=1$), and the model gave it $p=1/2$. The loss slope with respect to
      the score is $-1/2$. What is the loss slope with respect to the weight $w$?
    answer: -2
    tolerance:
      abs: 1.0e-06
    solution: Multiply the score slope by the input, giving $(-1/2)(4)=-2$.
  - id: lr-gradient-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      For one example, the model gives label 1 probability $p={{=k}}/4$, the observed label is $y={{=y}}$ and
      the input is $x={{=x}}$. Find the loss gradient with respect to the weight.
    params:
      k:
        min: 1
        max: 3
      y:
        min: 0
        max: 1
      x:
        min: -2
        max: 4
    answer_expr: (k/4-y)*x
    tolerance:
      abs: 1.0e-06
    solution: Subtract the observed label from the probability, then multiply by the input; the weight slope is ${{=(k/4-y)*x}}$.
    constraints:
      - x != 0
  - id: lr-gradient-confusion
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "If $x=0$ and $p-y$ is nonzero, which gradients does this example produce?"
    options:
      - {
          id: a,
          text: "A zero weight slope and a nonzero bias slope.",
          correct: true,
          feedback: "The zero input removes the weight slope but not the bias slope.",
        }
      - {
          id: b,
          text: "Nonzero equal slopes for the weight and bias.",
          correct: false,
          feedback: "Multiplying the score slope by zero makes the weight slope zero.",
        }
      - {
          id: c,
          text: "Zero slopes for both the weight and the bias.",
          correct: false,
          feedback: "The bias slope is p-y even when the input is zero.",
        }
    solution: The weight slope is $(p-y)0=0$, while the bias slope remains $p-y$.
  - id: lr-gradient-transfer
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A robot starts with $w=0$, $b=0$, input $x=-2$, observed label $y=1$, and learning rate $1/2$. After one simultaneous weight-and-bias update, what is its new score for this example?"
    answer: 1.25
    tolerance: { abs: 0.000001 }
    solution: Initially $p=1/2$, so the weight slope is 1 and the bias slope is $-1/2$. The new parameters are $w=-1/2$, $b=1/4$, giving score $(-1/2)(-2)+1/4=5/4$.
  - id: lr-explain-logistic-regression
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 5
    prompt: "A logistic model predicts whether a house sells within a month from feature $x$. Explain how it forms a weighted score, turns that score into a sale probability, and scores the observed outcome during training."
    rubric:
      - id: prediction
        criterion: Form the score $z=wx+b$.
        weight: 1
        required: true
      - id: probability
        criterion: Use $p=\sigma(z)$ as the estimated probability of a sale within a month.
        weight: 1
        required: true
      - id: loss
        criterion: Score the observed label with minus the natural log of the probability assigned to it.
        weight: 1
        required: true
    exemplar: "The model forms the weighted score $z=wx+b$. Applying sigmoid gives $p=\\sigma(z)$, the estimated chance of a sale within a month. Training scores the observed outcome with $-\\ln p$ for a sale and $-\\ln(1-p)$ for no sale."
  - id: "lr-recall-score-say"
    dimension: "conceptual"
    type: "explain"
    role: "recall"
    knowledge_point: "lr-classification"
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what do the labels in binary classification represent, and how is the model's score formed?"
    rubric:
      - id: "first"
        criterion: "Explain that labels 0 and 1 name the two possible answers."
        weight: 1
        required: true
      - id: "second"
        criterion: "Explain that the score is the weighted input plus the bias."
        weight: 1
        required: true
    exemplar: "The labels 0 and 1 name the two possible answers. The model forms a score by multiplying its input by a weight and adding the bias."
  - id: "lr-recall-score-contrast"
    dimension: "conceptual"
    type: "mc"
    role: "recall"
    knowledge_point: "lr-classification"
    difficulty: 1
    est_minutes: 0.5
    prompt: "Which quantity can take values below zero or above one in a binary classifier?"
    options:
      - id: "a"
        text: "The observed label"
        correct: false
        feedback: "The observed label is one of the two values, 0 or 1."
      - id: "b"
        text: "The probability of label 1"
        correct: false
        feedback: "A probability lies between 0 and 1."
      - id: "c"
        text: "The weighted score"
        correct: true
        feedback: "The weighted score can be any number before conversion to a probability."
    solution: "The weighted score can be any number."
  - id: "lr-recall-score-formula"
    dimension: "math"
    type: "expression"
    role: "recall"
    knowledge_point: "lr-classification"
    difficulty: 1
    est_minutes: 0.5
    prompt: "Write the score $z$ for one input $x$, weight $w$ and bias $b$."
    answer: "w*x+b"
    variables: { "x": [1, 8], "w": [0.5, 2], "b": [-5, -1] }
    solution: "The score is $z=wx+b$."
  - id: "lr-recall-sigmoid-say"
    dimension: "conceptual"
    type: "explain"
    role: "recall"
    knowledge_point: "lr-sigmoid"
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what does the sigmoid do to a score, and what does its output mean in logistic regression?"
    rubric:
      - id: "first"
        criterion: "Explain that the sigmoid maps any score to a number strictly between zero and one."
        weight: 1
        required: true
      - id: "second"
        criterion: "Explain that the output is the model's probability that the label is 1."
        weight: 1
        required: true
    exemplar: "The sigmoid maps any score to a number strictly between 0 and 1. Logistic regression reads that number as the probability of label 1."
  - id: "lr-recall-sigmoid-contrast"
    dimension: "conceptual"
    type: "mc"
    role: "recall"
    knowledge_point: "lr-sigmoid"
    difficulty: 1
    est_minutes: 0.5
    prompt: "A logistic model predicts label 1 after comparing its probability with a threshold. What does that decision tell you?"
    options:
      - id: "a"
        text: "The observed label must be 1."
        correct: false
        feedback: "A prediction can be wrong because the outcome is still uncertain."
      - id: "b"
        text: "The probability reached the threshold."
        correct: true
        feedback: "The decision follows the threshold comparison and still carries uncertainty."
      - id: "c"
        text: "The sigmoid output must equal 1."
        correct: false
        feedback: "The sigmoid output is strictly between zero and one."
    solution: "A decision follows the threshold comparison. The probability still allows for either outcome."
  - id: "lr-recall-sigmoid-formula"
    dimension: "math"
    type: "text"
    role: "recall"
    knowledge_point: "lr-sigmoid"
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the blank in the sigmoid, which turns a score $z$ into a probability: $\\sigma(z)=\\dfrac{1}{1+\\underline{\\quad\\quad}}$."
    accept: ["e^{-z}", "e^(-z)", "e^-z", "exp(-z)", "\\exp(-z)", "1/e^z", "e^{−z}", "e^−z"]
    regex: "^\\s*\\$?\\s*(?:e\\s*\\^\\s*(?:\\{\\s*[-−]\\s*z\\s*\\}|\\(\\s*[-−]\\s*z\\s*\\)|[-−]\\s*z)|\\\\?exp\\s*\\(\\s*[-−]\\s*z\\s*\\)|e\\s*to\\s*the\\s*(?:power\\s*(?:of\\s*)?)?(?:minus|negative|[-−])\\s*z|1\\s*/\\s*e\\s*\\^\\s*(?:\\{\\s*z\\s*\\}|\\(\\s*z\\s*\\)|z))\\s*\\$?\\s*$"
    solution: "The sigmoid is $\\sigma(z)=1/(1+e^{-z})$. The minus sign makes a large score give a tiny $e^{-z}$, so $\\sigma(z)$ is close to 1."
  - id: "lr-recall-bce-say"
    dimension: "conceptual"
    type: "explain"
    role: "recall"
    knowledge_point: "lr-binary-cross-entropy"
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, how does binary cross-entropy score the observed label, and when does the loss become large?"
    rubric:
      - id: "first"
        criterion: "Explain that binary cross-entropy takes minus the natural logarithm of the probability given to the observed label."
        weight: 1
        required: true
      - id: "second"
        criterion: "Explain that the loss becomes large when that probability is near zero."
        weight: 1
        required: true
    exemplar: "Binary cross-entropy takes minus the natural log of the probability assigned to the observed label. It becomes large when the model gave that label a probability near zero."
  - id: "lr-recall-bce-contrast"
    dimension: "conceptual"
    type: "mc"
    role: "recall"
    knowledge_point: "lr-binary-cross-entropy"
    difficulty: 1
    est_minutes: 0.5
    prompt: "The observed label is 0, and $p$ is the model's probability of label 1. Which probability does binary cross-entropy put inside its logarithm?"
    options:
      - id: "a"
        text: "$p$"
        correct: false
        feedback: "$p$ is the probability of label 1. The loss uses $\\ln p$ only when the observed label is 1."
      - id: "b"
        text: "$1-p$"
        correct: true
        feedback: "The observed label is 0, whose probability is $1-p$."
      - id: "c"
        text: "$1-y$"
        correct: false
        feedback: "$1-y$ is the label factor that switches the second term on. Here it equals 1, and it multiplies $\\ln(1-p)$."
    solution: "For label 0, the loss is minus the natural log of $1-p$."
  - id: "lr-recall-bce-formula"
    dimension: "math"
    type: "expression"
    role: "recall"
    knowledge_point: "lr-binary-cross-entropy"
    difficulty: 1
    est_minutes: 0.5
    prompt: "Write binary cross-entropy for predicted probability $p$ of label 1 and observed label $y$, which is 0 or 1. Type `ln(...)` for the natural logarithm."
    answer: "-(y*log(p)+(1-y)*log(1-p))"
    variables: { "p": [0.05, 0.95], "y": { "values": [0, 1] } }
    solution: "The loss is $-[y\\ln p+(1-y)\\ln(1-p)]$."
