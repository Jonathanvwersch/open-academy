concept: dagger
exercises:
  - id: dx-il-3
    dimension: conceptual
    type: mc
    role: diagnostic
    difficulty: 3
    est_minutes: 2
    prompt: "How does DAgger address compounding errors in imitation learning?"
    options:
      - {
          id: a,
          text: "It collects learner rollouts, asks the expert for actions at the visited states, and retrains on those labels plus earlier data",
          correct: true,
        }
      - {
          id: b,
          text: "It collects noisy expert rollouts, retains the perturbed actions as labels, and retrains on those labels plus earlier data",
          correct: false,
          category: misunderstood_definition,
          feedback: "DAgger asks for expert actions at states visited by the learner. A perturbed action is not necessarily the expert's correction for that state.",
        }
      - {
          id: c,
          text: "It collects learner rollouts, uses the learner's executed actions as labels, and retrains on those labels plus earlier data",
          correct: false,
          category: misunderstood_definition,
          feedback: "Labelling a mistake with the learner's own action reinforces it. DAgger obtains expert action labels for those states.",
        }
      - {
          id: d,
          text: "It collects learner rollouts, asks the expert for actions at the visited states, and retrains after discarding all earlier data",
          correct: false,
          category: misunderstood_definition,
          feedback: "DAgger aggregates the new expert-labelled states with earlier data. Discarding earlier data can lose coverage of previously visited states.",
        }
    solution: "DAgger (Dataset Aggregation) iteratively collects data under the learner's state distribution, labels it with expert actions, and retrains on the aggregate, which closes the train/deploy distribution gap."
