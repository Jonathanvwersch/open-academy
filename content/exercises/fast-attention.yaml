          category: math_error,
          feedback: "The factor is $e^{3-5}=e^{-2}$, which is below 1.",
        }
    solution: "The first half's sum is moved to the new largest score by multiplying by $e^{3-5}=e^{-2}\\approx0.135$. So the total is $2.0\\times0.135+1.5\\approx1.77$."
  - id: fa-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 5
    prompt: Explain why a fused attention kernel moves far less data to and from HBM than three-kernel attention, and how it can add up softmax one block of keys at a time and still give the same output, apart from rounding.
    rubric:
      - {
          id: tables,
          criterion: "Explain that three-kernel attention writes the T by T score and weight tables to HBM and reads them back between kernels.",
          weight: 1,
          required: true,
        }
      - {
          id: fused,
          criterion: "Explain that a fused kernel keeps the scores on chip, so it only needs to read Q, K and V and write O.",
          weight: 1,
          required: true,
        }
      - {
          id: totals,
          criterion: "Explain that the kernel keeps a running sum of exponentials and a running sum of exponential-weighted values, adding each block to both.",
          weight: 1,
          required: true,
        }
      - {
          id: exact,
          criterion: "Explain that every weight divides by the same total, so dividing once after the last block gives the same output as softmax over the whole row.",
          weight: 1,
          required: true,
        }
      - {
          id: max,
          criterion: "Mention that it subtracts a running largest score and rescales both sums when that score grows, so the exponentials don't overflow.",
          weight: 1,
          required: false,
        }
      - {
          id: intensity,
          criterion: "Mention that this raises the arithmetic intensity from at most $d_h/b$ to about $T/b$.",
          weight: 1,
          required: false,
        }
    exemplar: Three-kernel attention writes the T by T score table to HBM, reads it back to apply softmax, writes the weight table, and reads that back to mix the values, so for long prompts those tables are most of the traffic. A fused kernel keeps the scores in on-chip memory, so it only reads Q, K and V and writes O. It brings the keys and values in a block at a time and keeps two running sums for each query, the sum of the exponentials of the scores and the sum of the values each multiplied by its exponential. Every weight divides by the same total, so after the last block one division gives exactly the softmax output, apart from rounding. To stop the exponentials overflowing, it also subtracts a running largest score and rescales both sums when that score grows.
