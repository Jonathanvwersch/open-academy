  - id: fa-recall-online-softmax-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: fa-online-softmax
    difficulty: 1
    est_minutes: 0.5
    prompt: "A kernel works through one query's keys in blocks. Which method gives the same output as softmax over the whole row?"
    options:
      - id: a
        text: "Average the blocks' separate softmax outputs"
        correct: false
        feedback: "Equal weights ignore that a block with larger exponentials should count for more."
      - id: b
        text: "Divide the summed weighted values by the summed exponentials"
        correct: true
        feedback: "Both sums can be built a block at a time, and their ratio is exactly the softmax output."
      - id: c
        text: "Use the softmax output of the block with the largest score"
        correct: false
        feedback: "The other blocks' keys still add to both sums, so they change the output."
    solution: "Keep the running totals $u=\\sum e^{s_j}v_j$ and $\\ell=\\sum e^{s_j}$ across blocks and divide once at the end. Averaging block outputs gives each block equal say, which is wrong."
  - id: fa-recall-online-softmax-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: fa-online-softmax
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the blank for online softmax after the last key block: $o=\\underline{\\qquad}$. Give the expression in terms of the two running totals, using the symbols for those totals."
    accept:
      - "u/ell"
      - "u/l"
      - "u/ℓ"
      - "u/\\ell"
      - "\\frac{u}{\\ell}"
      - "u ÷ ℓ"
      - "u over ell"
    regex: '^\s*\$?\s*(?:o\s*=\s*)?(?:u\s*(?:[/÷]|\s+over)\s*(?:\\?ell|ℓ|l)|\\(?:d|t)?frac\s*\{\s*u\s*\}\s*\{\s*(?:\\?ell|ℓ|l)\s*\})\s*\$?\s*$'
    solution: "Divide $u$, the sum of the values weighted by their score exponentials, by $\\ell$, the sum of those exponentials. The result is $u/\\ell$."
  - id: fa-recall-running-max-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: fa-running-max
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, why does a kernel working in blocks subtract the largest score seen so far from each score, and what does it do to its two running totals, the sum of shifted score exponentials and the sum of values multiplied by those same exponentials, if the largest score rises?"
    rubric:
      - id: shift
        criterion: "Explain that the largest score isn't known until the last block, so the kernel subtracts the largest so far, which keeps each exponential at most one and avoids overflow."
        weight: 1
        required: true
      - id: rescale
        criterion: "State that both old totals are multiplied by the same factor before adding the new block's terms."
        weight: 1
        required: true
    exemplar: "The largest score is only known after the last block, so the kernel subtracts the largest so far, which keeps each exponential at most one and avoids overflow. If that score rises, it multiplies both old totals by the same factor before adding the new terms."
  - id: fa-recall-running-max-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: fa-running-max
    difficulty: 1
    est_minutes: 0.5
    prompt: "A new key block raises the running largest score from $m$ to $m_{\\text{new}}$. What does the kernel multiply by $e^{m-m_{\\text{new}}}$?"
    options:
