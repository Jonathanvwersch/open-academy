        feedback: "The old $u$ was also built from $e^{s_j-m}$, and scaling only $\\ell$ would change $u/\\ell$."
      - id: b
        text: "Both old totals, $\\ell$ and $u$"
        correct: true
        feedback: "Every old term was measured from $m$, so both totals need the same factor."
      - id: c
        text: "The new block's terms"
        correct: false
        feedback: "The new terms are computed from $m_{\\text{new}}$ directly, so they need no rescaling."
    solution: "Every old term in $\\ell$ and $u$ was measured from $m$. Multiplying both by $e^{m-m_{\\text{new}}}$ measures them from $m_{\\text{new}}$, and the new block's terms are added after that."
