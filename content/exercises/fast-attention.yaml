          id: a,
          text: "All of K and V once for every query block, so many times more than reading them once.",
          correct: true,
          feedback: "That is why a real kernel moves more than the least count of $4Td_h$ numbers.",
        }
      - {
          id: b,
          text: "All of K and V exactly once, because each block is shared by every SM for free.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Each SM has its own on-chip memory, so each one reads the blocks it needs.",
        }
      - {
          id: c,
          text: "Only one block of K and V, because the other blocks are skipped.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Every query needs every key, so no block is skipped.",
        }
      - {
          id: d,
          text: "All of K and V once, plus the score table written to HBM for each block.",
          correct: false,
          category: misunderstood_definition,
          feedback: "A fused kernel never writes scores to HBM.",
        }
    solution: Each query block needs every key and value, so K and V are read once per query block. Bigger query blocks mean fewer passes over K and V, but they need more on-chip memory.
  - id: fa-max-transfer
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A model's last layer gives a score for each of the 128,256 tokens in its vocabulary, and a kernel computes their softmax in two halves. The first half has largest score 3, and the sum of $e^{s-3}$ over its scores is 2.0. The second half has largest score 5, and the sum of $e^{s-5}$ over its scores is 1.5. What is the sum of $e^{s-5}$ over all the scores? Give two decimal places."
    answer: 1.7707
