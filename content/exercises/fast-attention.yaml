  - id: fa-recall-standard-traffic-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: fa-standard-traffic
    difficulty: 1
    est_minutes: 0.5
    prompt: "For one head of standard attention on a prompt of $T$ tokens, the head width is $d_h$ and each number uses $b$ bytes. Write the total bytes moved across the three kernels. Type `dh` for the head width."
    answer: "b*(4*T*dh+4*T^2)"
    variables:
      {
        "T": { "values": [16, 256, 2048] },
        "dh": { "values": [16, 64, 128] },
        "b": { "values": [1, 2, 4] },
      }
    solution: "Four matrices contribute $Td_h$ numbers each. The two $T^2$ tables are each written and read, giving $b(4Td_h+4T^2)$ bytes."
