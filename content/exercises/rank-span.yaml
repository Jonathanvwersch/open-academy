        "x_1a_1+x_2a_2",
        "x_1a_1 + x_2a_2",
        "x1a1+x2a2",
        "x1a1 + x2a2",
        "x_1*a_1+x_2*a_2",
        "x1*a1+x2*a2",
        "x₁a₁+x₂a₂",
        "x₁a₁ + x₂a₂",
      ]
    regex: '^\s*(?:(?:x(?:_?\{?1\}?|₁)\s*(?:\*|×|·|\\cdot|\\times)?\s*a(?:_?\{?1\}?|₁)|a(?:_?\{?1\}?|₁)\s*(?:\*|×|·|\\cdot|\\times)?\s*x(?:_?\{?1\}?|₁))\s*\+\s*(?:x(?:_?\{?2\}?|₂)\s*(?:\*|×|·|\\cdot|\\times)?\s*a(?:_?\{?2\}?|₂)|a(?:_?\{?2\}?|₂)\s*(?:\*|×|·|\\cdot|\\times)?\s*x(?:_?\{?2\}?|₂))|(?:x(?:_?\{?2\}?|₂)\s*(?:\*|×|·|\\cdot|\\times)?\s*a(?:_?\{?2\}?|₂)|a(?:_?\{?2\}?|₂)\s*(?:\*|×|·|\\cdot|\\times)?\s*x(?:_?\{?2\}?|₂))\s*\+\s*(?:x(?:_?\{?1\}?|₁)\s*(?:\*|×|·|\\cdot|\\times)?\s*a(?:_?\{?1\}?|₁)|a(?:_?\{?1\}?|₁)\s*(?:\*|×|·|\\cdot|\\times)?\s*x(?:_?\{?1\}?|₁)))\s*$'
    solution: "Each input entry scales its matching column: $Ax=x_1a_1+x_2a_2$."
  - id: rsp-recall-low-rank-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: rsp-low-rank
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, why is the rank of an $m\times k$ matrix times a $k\times n$ matrix at most $k$, and why store the factors?
    rubric:
      - id: meaning
        criterion: Explain that every column of the product lies in the span of the first factor's $k$ columns.
        weight: 1
        required: true
      - id: rule
        criterion: Explain that the factors store $mk+kn$ numbers, far fewer than $mn$ when $k$ is much smaller than $m$ and $n$.
        weight: 1
        required: true
    exemplar: "Every column of the product is a combination of the first factor's $k$ columns, so at most $k$ can be independent. The factors store $mk+kn$ numbers, far fewer than $mn$ when $k$ is small."
  - id: rsp-recall-low-rank-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: rsp-low-rank
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: Matrices $F$ and $G$ have shapes $m\times k$ and $k\times n$. What can you say about the rank of $FG$?
    options:
      - id: a
        text: It equals $k$ for every choice of entries.
        correct: false
        feedback: The bound is only a ceiling. The rank can be smaller, for example when the columns of $F$ are dependent.
      - id: b
        text: It is at most $k$, and may be smaller.
        correct: true
        feedback: Every column of $FG$ lies in the span of the $k$ columns of $F$.
      - id: c
        text: It equals $mn$, the number of output entries.
        correct: false
        feedback: The entry count measures storage. Rank counts independent columns.
    solution: The shared size $k$ caps the rank, and dependent columns in $F$ can make it smaller.
  - id: rsp-recall-low-rank-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: rsp-low-rank
    difficulty: 1
    est_minutes: 0.5
    prompt: How many numbers store two factors of shapes $m\times k$ and $k\times n$? Write a formula in $m$, $n$ and $k$, using `*` for multiplication.
    answer: m*k+k*n
    variables:
      {
        "m": { "values": [20, 60, 100] },
        "n": { "values": [20, 60, 100] },
        "k": { "values": [1, 3, 5] },
      }
    solution: The two factors store $mk+kn=k(m+n)$ numbers.
