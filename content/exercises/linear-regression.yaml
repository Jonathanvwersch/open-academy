concept: linear-regression
exercises:
  - id: lr-add-contributions-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does a linear regression model do?"
    options:
      - {
          id: a,
          text: "It predicts a category by assigning input features to labels such as spam or not spam.",
          correct: false,
          feedback: "Classification predicts a category, while linear regression predicts a numeric value.",
        }
      - {
          id: b,
          text: "It draws a straight line through the two closest training examples without fitting feature weights.",
          correct: false,
          feedback: "Connecting nearby examples is a nearest-neighbour idea, not how linear regression fits weights.",
        }
      - {
          id: c,
          text: "It finds weights by testing every possible parameter setting and keeping the one whose predictions are closest to the targets.",
          correct: false,
          feedback: "That describes one way of choosing weights, not what the model does. The model is the prediction rule: weighted features added up, plus a bias.",
        }
      - {
          id: d,
          text: "It predicts a number by multiplying each input feature by a weight, adding the results, then adding a bias.",
          correct: true,
          feedback: "Each feature contributes its value times its weight, and those contributions plus the bias form the prediction.",
        }
    solution: "A linear regression model predicts a number by adding weighted feature contributions and a bias."
  - id: lr-interpret-weights-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does a weight mean in a linear model?"
    options:
      - {
          id: a,
          text: "How often that feature appears across the training examples in the dataset.",
          correct: false,
          feedback: "That would be a count about the data. A weight is a number in the model that multiplies its feature.",
        }
      - {
          id: b,
          text: "The prediction the model makes when every feature is set to zero.",
          correct: false,
          feedback: "That is the bias. A weight says how much one feature moves the prediction per unit.",
        }
      - {
          id: c,
          text: "How much every feature changes when the predicted price goes up.",
          correct: false,
          feedback: "It works the other way round: a weight says how the prediction moves when its feature changes.",
        }
      - {
          id: d,
          text: "How much the prediction changes when its feature rises by one unit and the others stay fixed.",
          correct: true,
          feedback: "Changing one feature by a unit changes the prediction by its weight when others stay fixed.",
        }
    solution: "A weight is the prediction change for a one-unit increase in its feature while other features stay fixed."
  - id: lr-batch-predictions-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is a batch prediction?"
    options:
      - {
          id: a,
          text: "A single house prediction made with a different weight for every feature.",
          correct: false,
          feedback: "That describes one prediction, not a batch.",
        }
      - {
          id: b,
          text: "A vector of predictions, one for each row of $X$, computed in one matrix operation.",
          correct: true,
          feedback: "Each row contains one house's features, so multiplying by shared weights gives one prediction per row.",
        }
      - {
          id: c,
          text: "A collection of predictions made by different models for the same house.",
          correct: false,
          feedback: "That compares models rather than processing several houses together.",
        }
      - {
          id: d,
          text: "A sum of predicted house prices used to set the model's shared bias value.",
          correct: false,
          feedback: "The bias is added to predictions; it is not a batch sum.",
        }
    solution: "A batch prediction processes several houses together by placing each feature vector in a row of $X$."
  - id: lr-check-predict
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: An estate agent's model predicts a house's price in thousands of pounds. Its weights are 3 per m² of area and 10 per bedroom, and its bias is 50. What price does it predict for a 120 m² house with 3 bedrooms?
    answer: 440
    tolerance:
      abs: 0.01
    solution: The area contributes $3\times120=360$ and the bedrooms contribute $10\times3=30$. Adding the bias gives $360+30+50=440$ thousand pounds, or £440,000.
  - id: lr-weight-meaning
    dimension: conceptual
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "A delivery company predicts fuel use in litres with $\\hat y = 0.08\\cdot\\text{distance\\_km} + 1.5\\cdot\\text{load\\_tonnes} + 2$. Distance is measured in kilometres and load in tonnes. What does the weight $1.5$ mean?"
    options:
      - {
          id: a,
          text: "If distance stays the same, each extra tonne of load adds 1.5 litres to the predicted fuel use",
          correct: true,
        }
      - {
          id: b,
          text: "Load is 1.5 times as important as distance",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Weights depend on units. Distance in metres would have a 1000× smaller weight without being any less important.",
        }
      - {
          id: c,
          text: "Predicted fuel use is 1.5 litres whenever the load is 1 tonne",
          correct: false,
          category: misunderstood_definition,
          feedback: "A load of 1 tonne contributes 1.5 litres, but the model also includes the distance contribution and the bias of 2 litres.",
        }
    solution: "Compare two predictions for the same distance, with the load increasing by 1 tonne. The distance contribution and bias stay the same, so only the load contribution changes. It rises by 1.5 litres. The two weights use different units, so their numbers alone do not tell you which feature matters more."
  - id: lr-bias-trick
    dimension: math
    type: mc
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "A house-price model uses matrix $X$ with $n$ house rows and $d$ feature columns, weights $(w_1, \\dots, w_d)$, and bias $b$. You add a column containing 1 for every house and stop adding a separate bias. What weights keep the prices unchanged?"
    options:
      - {
          id: a,
          text: "$(w_1, \\dots, w_d, b)$, so the bias is the weight on the new column",
          correct: true,
        }
      - {
          id: b,
          text: "$(w_1, \\dots, w_d, 1)$",
          correct: false,
          category: math_error,
          feedback: "That adds exactly 1 to every prediction, which is not $b$.",
        }
      - {
          id: c,
          text: "$(w_1, \\dots, w_d)$, unchanged",
          correct: false,
          category: misunderstood_definition,
          feedback: "Shapes no longer match: $X$ now has $d+1$ columns.",
        }
    solution: "Keep each original feature's weight and give the new column weight $b$. Its value is 1 for every house, so it adds $1\\times b=b$ to every prediction. This replaces the separate bias addition."
  - id: lrp-why-bias
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does the house-price model use a bias of 50 as well as weights of 3 for area and 10 for bedroom count?
    options:
      - id: a
        text: It shifts every prediction by the same amount without changing what an extra square metre or bedroom adds
        correct: true
        feedback: The bias raises every prediction by 50, while the weights still say how much each extra unit adds.
      - id: b
        text: It adds a share of the price for each feature, so larger houses with more bedrooms get more of it
        correct: false
        category: misunderstood_definition
        feedback: The bias is added once to every prediction, whatever the house's area or bedroom count.
      - id: c
        text: It sets the lowest price any real house can sell for, so no prediction drops below 50
        correct: false
        category: misunderstood_definition
        feedback: The bias is the prediction when every feature is zero; it says nothing about real sale prices.
      - id: d
        text: It makes up for the bedroom weight being smaller than the area weight, so bedrooms count fully
        correct: false
        category: incorrect_reasoning
        feedback: The bias doesn't belong to any feature; changing it moves every prediction by the same amount.
    solution: Without a bias, setting area and bedroom count to zero forces a prediction of zero. Adding 50 raises every prediction by 50 thousand pounds while leaving the weights at 3 and 10. The model can therefore change its starting price without changing how much each extra square metre or bedroom adds. A house with no area or bedrooms does not need to be realistic for this calculation to describe the rule.
  - id: lrp-price-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A house-price model, in thousands of pounds, has weights 3 per m² of area and 10 per bedroom, and a bias of 50. A house has area {{=a}} m² and {{=k}} bedrooms. What is its predicted price?
    params:
      a:
        min: 60
        max: 160
        step: 10
      k:
        min: 1
        max: 5
        step: 1
    answer_expr: 3*a+10*k+50
    tolerance:
      abs: 0.001
    solution: Area contributes {{=3*a}} and bedrooms contribute {{=10*k}}. Adding the bias gives {{=3*a}} + {{=10*k}} + 50 = {{=3*a+10*k+50}} thousand pounds.
    common_wrong:
      - answer_expr: 3*a+10*k
        category: math_error
        feedback: That is the dot product only; add the bias of 50 once.
  - id: lrp-dot-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A house has area {{=a}} m² and {{=k}} bedrooms, with weights 3 and 10. Before adding any
      bias, what is its weighted feature sum in thousands of pounds?
    params:
      a:
        min: 60
        max: 160
        step: 10
      k:
        min: 1
        max: 5
        step: 1
    answer_expr: 3*a+10*k
    tolerance:
      abs: 0.001
    solution: The dot product is 3 × {{=a}} + 10 × {{=k}} = {{=3*a+10*k}}. The question asks for
      the weighted sum before the bias is added.
    common_wrong:
      - answer_expr: 3*a+10*k+50
        category: math_error
        feedback: That includes an extra bias of 50; this question asks for the weighted sum alone.
  - id: lrp-order
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A house-price model, in thousands of pounds, has weight 3 for area in m² and 10 for bedroom count, and bias 50. A program stores a 120 m², 2-bedroom house as the vector $(2,120)$, bedrooms first, but uses the weight vector $(3,10)$. What price, in thousands of pounds, does the program compute?
    solution: The dot product pairs entries by position, so the program computes $3\times2+10\times120+50=6+1200+50=1256$. To keep the predictions unchanged after swapping the features, swap the weights too, to $(10,3)$.
    answer: 1256
    tolerance:
      abs: 0.001
    common_wrong:
      - answer: 430
        category: incorrect_reasoning
        feedback: That is the correct price, but the program pairs entries by position, so 3 multiplies the bedroom count and 10 multiplies the area.
  - id: lrp-bias-once
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: A house-price model, in thousands of pounds, has weights 3 per m² of area and 10 per bedroom, and a bias of 50. What price does it predict for a 100 m² house with 2 bedrooms, in thousands of pounds?
    options:
      - id: a
        text: "370"
        correct: true
        feedback: '$3\times100+10\times2+50=370$: both contributions plus one bias.'
      - id: b
        text: "420"
        correct: false
        category: misapplied_technique
        feedback: This adds the bias once for each feature. A linear model adds its bias once per prediction.
      - id: c
        text: "320"
        correct: false
        category: recall_failure
        feedback: This leaves out the bias. Every prediction adds the bias of 50.
    solution: Area contributes $3\times100=300$ and bedrooms $10\times2=20$. The bias is added once, so the prediction is $300+20+50=370$ thousand pounds.
  - id: lrp-new-task
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A delivery robot predicts trip times in minutes with a linear rule in distance (km) and parcel count. It predicts 5 minutes for a 2 km trip with no parcels, 7 minutes for a 3 km trip with no parcels, and 9 minutes for a 3 km trip with 4 parcels. What is the rule's bias, in minutes?
    solution: One extra km adds $7-5=2$ minutes, so the distance weight is 2. A 3 km trip with no parcels is $2\times3=6$ minutes of distance, so the bias is $7-6=1$ minute. (Four parcels add 2 minutes, so the parcel weight is 0.5.)
    answer: 1
    tolerance:
      abs: 0.001
    common_wrong:
      - answer: 5
        category: misunderstood_definition
        feedback: 5 minutes is the prediction for a 2 km trip. The bias is the prediction when distance and parcels are both zero.
      - answer: 2
        category: misunderstood_definition
        feedback: 2 minutes per km is the distance weight. The bias is what's left when every input is zero.
  - id: lrp-why-hold-fixed
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does interpreting the bedroom weight of 10 require comparing houses with the same area, such as two 100 m² houses with 2 and 3 bedrooms?
    options:
      - id: a
        text: Keeping area fixed makes its contribution cancel when comparing predictions, leaving only the bedroom change
        correct: true
      - id: b
        text: The model cannot predict a price when both area and bedroom count change
        correct: false
        category: incorrect_reasoning
        feedback: The model can predict both changes. Their weighted contributions add, so the total change is not due to bedrooms alone.
      - id: c
        text: Holding area fixed proves that adding a bedroom causes the actual sale price to rise by £10,000
        correct: false
        category: incorrect_reasoning
        feedback: Holding features fixed explains the model's predictions, not a guaranteed effect on actual sale prices.
    solution: With area 100 m², changing from 2 to 3 bedrooms changes the prediction from 370 to 380 thousand pounds. The area contribution and bias cancel when we subtract the predictions, leaving a change of 10 thousand pounds. If area also rose to 110 m², the prediction would rise to 410 thousand pounds. The total change of 40 would include 30 from area as well as 10 from bedrooms.
  - id: lrp-change-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      In the house model, the area weight is 3 thousand pounds per m². Area increases by {{=d}} m²
      while bedrooms and bias stay fixed. By how many thousands of pounds does the prediction rise?
    params:
      d:
        min: 2
        max: 20
        step: 2
    answer_expr: 3*d
    tolerance:
      abs: 0.001
    solution: "The change is weight times input change: 3 × {{=d}} = {{=3*d}} thousand pounds. Fixed
      bedroom and bias contributions cancel."
    common_wrong:
      - answer_expr: 3*d+50
        category: math_error
        feedback: The same bias appears in both predictions, so it cancels from their difference.
  - id: lrp-both-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Area increases by {{=d}} m² and bedroom count by {{=k}}. With weights 3 and 10, by how many
      thousands of pounds does the prediction rise? The bias stays fixed.
    params:
      d:
        min: 5
        max: 20
        step: 5
      k:
        min: 1
        max: 3
        step: 1
    answer_expr: 3*d+10*k
    tolerance:
      abs: 0.001
    solution: "Add both changes: 3 × {{=d}} + 10 × {{=k}} = {{=3*d+10*k}} thousand pounds. Neither
      feature is held fixed here."
    common_wrong:
      - answer_expr: 10*k
        category: math_error
        feedback: That counts only bedrooms; the changing area contributes too.
  - id: lrp-units
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A house-price model has an area weight of 3 thousand pounds per square metre. You now measure
      area in hundreds of square metres instead. What area weight keeps its predicted prices unchanged?
    options:
      - id: a
        text: 300, because each new input unit represents 100 m²
        correct: true
      - id: b
        text: 0.03, because the input number becomes 100 times smaller
        correct: false
        category: incorrect_reasoning
        feedback: A smaller input number needs a larger weight to preserve the product.
      - id: c
        text: 3, because changing the units cannot change the weight
        correct: false
        category: incorrect_reasoning
        feedback: Predictions can stay unchanged only if the weight compensates for the unit change.
    solution:
      A 100 m² house now has area 1. Its area piece was 3 × 100 = 300, so to keep it at 300 the new
      weight must be 300, because 300 × 1 = 300.
  - id: lrp-negative
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: A house-price model has weight −2 for distance from the town centre, in thousands of pounds per kilometre. House A is 3 km from the centre and house B is 5 km. In every other feature they are the same. How does B's predicted price compare with A's?
    options:
      - id: a
        text: B's is £4,000 lower
        correct: true
        feedback: B is 2 km further out, and each km changes the prediction by −2 thousand pounds.
      - id: b
        text: B's is £4,000 higher
        correct: false
        category: incorrect_reasoning
        feedback: The weight is negative, so moving further from the centre lowers the predicted price.
      - id: c
        text: B's is £10,000 lower
        correct: false
        category: math_error
        feedback: $-2\times5=-10$ is B's whole distance contribution; A's is $-6$, so the difference is 4 thousand pounds.
      - id: d
        text: B's is £2,000 lower
        correct: false
        category: math_error
        feedback: −2 is the change per kilometre, and B is 2 km further out.
    solution: Only distance differs, by $5-3=2$ km. Each km changes the prediction by $-2$ thousand pounds, so B's prediction is $-2\times2=-4$ thousand pounds, £4,000 lower, with the other features fixed.
  - id: lrp-zero-input
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the house-price model $3\cdot\text{area}+10\cdot\text{bedrooms}+50$, prices are in thousands of pounds. What does the bias of 50 mean?
    options:
      - id: a
        text: The model predicts 50 thousand pounds when both area and bedroom count are zero
        correct: true
      - id: b
        text: Every real house must sell for at least 50 thousand pounds regardless of the data
        correct: false
        category: incorrect_reasoning
        feedback: The bias is part of a prediction formula, not a guaranteed minimum real sale price.
      - id: c
        text: The area weight increases by 50 for each extra square metre
        correct: false
        category: incorrect_reasoning
        feedback: The bias shifts predictions without changing the per-unit area weight.
    solution:
      Setting both features to zero leaves only 50, although a zero-area, zero-bedroom house is
      not a realistic sale.
  - id: lrp-batch-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      An estate agent stores two houses as rows [{{=a}}, 2] and [{{=a+20}}, 3], with area in m²
      followed by bedroom count. The matching weights are [3, 10] and the bias is 50. What is the
      sum of the two predicted prices, in thousands of pounds?
    params:
      a:
        min: 60
        max: 140
        step: 10
    answer_expr: 6*a+210
    tolerance:
      abs: 0.001
    solution: The first prediction is {{=3*a+70}} and the second is {{=3*a+140}}. Their sum is
      {{=6*a+210}}; each row receives its own bias of 50.
    common_wrong:
      - answer_expr: 6*a+160
        category: math_error
        feedback: That includes the bias only once in the total; it is added to each row prediction.
  - id: lrp-augmented-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A house has area {{=a}} m² and {{=k}} bedrooms. To include the bias in the dot product,
      the program stores the house as [{{=a}}, {{=k}}, 1] and uses weights [3, 10, 50]. What is its
      predicted price in thousands of pounds, without adding a separate bias?
    params:
      a:
        min: 60
        max: 160
        step: 10
      k:
        min: 1
        max: 5
        step: 1
    answer_expr: 3*a+10*k+50
    tolerance:
      abs: 0.001
    solution:
      The three contributions are {{=3*a}}, {{=10*k}} and 1 × 50. Their sum is {{=3*a+10*k+50}},
      with the bias supplied by the last feature.
    common_wrong:
      - answer_expr: 3*a+10*k+100
        category: math_error
        feedback: The feature that is always 1 already adds 50 through its weight. Adding a separate bias would count it twice.
  - id: lrp-bias-trick
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      The house-price model uses area and bedroom count with weights (3, 10) and bias 50. You add
      a column containing 1 for every house to its input matrix. What weights keep the predictions
      unchanged when you stop adding a separate bias?
    options:
      - id: a
        text: Use weights (3, 10, 50) on the three columns
        correct: true
      - id: b
        text: Use weights (3, 10, 1) on the three columns
        correct: false
        category: incorrect_reasoning
        feedback: The constant feature value is 1, but its weight must be the old bias of 50.
      - id: c
        text: Use weights (3, 10) on the three columns
        correct: false
        category: incorrect_reasoning
        feedback: The new matrix has three columns, so it needs three matching weights.
    solution:
      The new column contributes 1 × 50 for each house. This adds the same 50 that the separate
      bias used to add, so every predicted price stays the same.
  - id: lrp-robot-change
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A warehouse robot predicts a trip's time in seconds as
      $2\cdot\text{distance}+0.5\cdot\text{load}+1$, with distance in metres and load in kilograms.
      Its next trip is 1 m shorter than the last one and carries 6 kg more. By how many seconds
      does the predicted time change? Use a negative number for a drop.
    answer: 1
    tolerance:
      abs: 0.001
    solution: Each feature changes the prediction by its weight times its change. Distance gives
      2 × (−1) = −2 and load gives 0.5 × 6 = 3. The bias of 1 is in both predictions, so it
      cancels. The total change is −2 + 3 = 1 second.
    common_wrong:
      - answer: 3
        category: math_error
        feedback: That counts only the load change. The shorter distance also changes the prediction, by 2 × (−1) = −2.
      - answer: 5
        category: math_error
        feedback: The distance falls, so its piece is −2, not +2.
      - answer: 2
        category: math_error
        feedback: The bias of 1 is in both predictions, so it cancels from the change.
  - id: lrp-robot-batch
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: |
      A delivery robot predicts trip times from rows $(3,4,1)$, $(1,0,1)$ and $(5,2,1)$.
      The first two entries give kilometres and parcels. The weight vector is $(2,0.5,1)$,
      and its last entry carries the bias. What is the total predicted time for all three trips, in minutes?
    answer: 24
    tolerance:
      abs: 0.001
    solution: Take one dot product per row. Trip 1 gives 2 × 3 + 0.5 × 4 + 1 × 1 = 9, trip 2 gives
      2 × 1 + 0 + 1 = 3 and trip 3 gives 2 × 5 + 0.5 × 2 + 1 = 12. The column of ones already adds
      the bias of 1 to every trip, so the total is 9 + 3 + 12 = 24 minutes.
    common_wrong:
      - answer: 27
        category: math_error
        feedback: The column of ones already adds the bias to each trip. Adding 1 per trip again counts it twice.
      - answer: 21
        category: math_error
        feedback: That leaves out the bias. The last column is 1 for every trip, and its weight 1 adds 1 minute to each.
  - id: lr-explain-model
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "An estate agent uses $3\\cdot\\text{area}+10\\cdot\\text{bedrooms}+50$ to predict prices in thousands of pounds from area in square metres and bedroom count. Explain its vector form, what the weights mean, and how a matrix product can give one price per house."
    rubric:
      - id: r1
        criterion: Write $x=(\text{area},\text{bedrooms})$, $w=(3,10)$ and $\hat y=w\cdot x+50$.
        weight: 1
        required: true
      - id: r2
        criterion:
          Explain that an extra square metre adds $3$ thousand pounds and an extra bedroom adds $10$ thousand
          pounds when the other feature stays fixed.
        weight: 1
        required: true
      - id: r3
        criterion: Use $Xw+b\mathbf 1$ with one house per row to get one prediction per house.
        weight: 1
        required: true
    exemplar: "Use $x=(\\text{area},\\text{bedrooms})$, $w=(3,10)$ and $b=50$, giving $\\hat y=w\\cdot x+b$. Holding the other feature fixed, an extra square metre adds $3$ thousand pounds and an extra bedroom adds $10$ thousand pounds. For many houses, put one house per row of $X$ and use $Xw+b\\mathbf 1$ to get one price per row."
    solution: "Use $x=(\\text{area},\\text{bedrooms})$, $w=(3,10)$ and $b=50$, giving $\\hat y=w\\cdot x+b$. Holding the other feature fixed, an extra square metre adds $3$ thousand pounds and an extra bedroom adds $10$ thousand pounds. For many houses, put one house per row of $X$ and use $Xw+b\\mathbf 1$ to get one price per row."
  - id: lrp-add-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked example, why does step 1 write the house as $x=(90,4)$, with area first, rather than $(4,90)$?
    options:
      - id: a
        text: The dot product pairs entries by position, so area must sit where its weight $3$ sits.
        correct: true
        feedback: Matching the order makes area meet the weight $3$ and bedrooms meet the weight $10$.
      - id: b
        text: The larger number always goes first in a feature vector, so $90$ comes before $4$.
        correct: false
        category: misunderstood_definition
        feedback: The order is fixed by the weights, not by size. If bedrooms came first, the weights would have to be $(10,3)$.
      - id: c
        text: The order doesn't matter, because a dot product gives the same total either way round.
        correct: false
        category: incorrect_reasoning
        feedback: Swapping only the features gives $3\times4+10\times90+50=962$, not $360$, because each feature meets the wrong weight.
      - id: d
        text: The bias is added to the first feature, so area has to come first to receive it.
        correct: false
        category: misunderstood_definition
        feedback: The bias is added once to the whole total, not to any one feature.
    solution: The dot product multiplies the first entries together and the second entries together. With $w=(3,10)$, area must be first so that it is multiplied by $3$ and the bedrooms by $10$, giving $270+40=310$ before the bias.
  - id: lrp-weights-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In step 2 of the worked example, why do the area piece and the bias disappear when we subtract $370$ from $380$?
    options:
      - id: a
        text: The area stayed at $100$ m², so both predictions contain the same $300$ and the same $50$.
        correct: true
        feedback: Anything that is the same in both predictions cancels, leaving only the bedroom piece.
      - id: b
        text: The bias only applies to the first prediction, so it isn't part of the second one.
        correct: false
        category: misunderstood_definition
        feedback: The bias is added to every prediction, including both of these; it cancels because it is in both.
      - id: c
        text: Area has a smaller weight than bedrooms, so its piece is too small to count.
        correct: false
        category: incorrect_reasoning
        feedback: The area piece is $300$, far from small. It cancels because it is the same in both predictions.
      - id: d
        text: Subtracting predictions always removes every piece except the one with the biggest weight.
        correct: false
        category: incorrect_reasoning
        feedback: In step 4, both area and bedrooms change, and both pieces stay in the difference.
    solution: Both predictions are $3\times100+10\times\text{bedrooms}+50$, so $300$ and $50$ appear in each and cancel. What's left is $10\times(3-2)=10$, the bedroom weight.
  - id: lrp-straight-line
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: An estate agent notices that in her town the first $50$ m² of a house add much more to its price than the area beyond $150$ m². Why can't the house-price model $3\cdot\text{area}+10\cdot\text{bedrooms}+50$ capture this?
    options:
      - id: a
        text: Each square metre adds the same $3$ thousand pounds, so price rises in a straight line with area.
        correct: true
        feedback: A linear model gives every unit of a feature the same weight, wherever it is.
      - id: b
        text: The bias of $50$ is too small, and a larger bias would make big houses rise more slowly.
        correct: false
        category: incorrect_reasoning
        feedback: The bias shifts every prediction by the same amount; it doesn't change how fast the price rises with area.
      - id: c
        text: The model has too few bedrooms in it, and adding a bedroom weight would fix the curve.
        correct: false
        category: incorrect_reasoning
        feedback: The model already has a bedroom weight. The problem is that the area piece is always $3$ per m².
      - id: d
        text: The model can capture it, because large houses have more bedrooms, which slows the rise.
        correct: false
        category: incorrect_reasoning
        feedback: Extra bedrooms add to the price; they can't make each extra square metre worth less.
    solution: The area piece is always $3\times\text{area}$, so going from $50$ to $51$ m² adds $3$, and so does going from $150$ to $151$ m². A pattern where early square metres are worth more needs a model whose predictions can bend.
  - id: lrp-batch-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In step 3 of the worked example, why do we add $50$ to each of the three entries of $Xw$, rather than adding $50$ once?
    options:
      - id: a
        text: Each entry is a different house's prediction, and every prediction includes its own bias.
        correct: true
        feedback: The model is $w\cdot x+b$ for every house, so each of the three prices gets $+50$.
      - id: b
        text: The bias is split equally between the houses, so each one gets a share of $50$.
        correct: false
        category: misunderstood_definition
        feedback: Nothing is shared out. Each house gets the whole bias, so each price rises by $50$.
      - id: c
        text: Adding $50$ three times corrects for there being three houses in the matrix.
        correct: false
        category: incorrect_reasoning
        feedback: The bias isn't a correction for the number of houses; it is part of each house's own prediction.
      - id: d
        text: The bias belongs to the features, so it is added once per column of $X$.
        correct: false
        category: misunderstood_definition
        feedback: The bias is added once per row, one house at a time, not once per feature column.
    solution: Row 1 on its own is $3\times100+10\times2+50=370$. Doing all three rows together must give the same prices as doing them one by one, so every entry of $Xw$ gets $+50$.
  - id: lrp-recall-contributions-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: lr-add-contributions
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, how does linear regression combine features into a prediction, and where does the bias enter?
    rubric:
      - id: first
        criterion: Explain that each feature is multiplied by its own weight and the products are added.
        weight: 1
        required: true
      - id: second
        criterion: Explain that the bias is added once to the whole prediction.
        weight: 1
        required: true
    exemplar: Linear regression adds each feature times its weight. It then adds the bias once to that total.
  - id: lrp-recall-contributions-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: lr-add-contributions
    difficulty: 1
    est_minutes: 0.5
    prompt: Which part of a linear regression model shifts every prediction by the same amount?
    options:
      - id: a
        text: The feature vector
        correct: false
        feedback: The feature vector holds one example's measurements, which differ from house to house.
      - id: b
        text: The bias
        correct: true
        feedback: The bias adds the same fixed amount to every prediction.
      - id: c
        text: The dot product
        correct: false
        feedback: The dot product adds up the feature pieces, which depend on the example.
      - id: d
        text: A weight
        correct: false
        feedback: A weight multiplies one feature, so the amount it adds changes with that feature's value.
    solution: The bias adds one fixed amount to each prediction.
  - id: lrp-recall-contributions-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: lr-add-contributions
    difficulty: 1
    est_minutes: 0.5
    prompt: Write a linear regression prediction with two features $x_1,x_2$, weights $w_1,w_2$ and bias $b$. Type `x1`, `x2`, `w1` and `w2` for the indexed symbols.
    answer: w1*x1+w2*x2+b
    variables:
      x1:
        - 1
        - 10
      x2:
        - 1
        - 10
      w1:
        - -3
        - 3
      w2:
        - -3
        - 3
      b:
        - 1
        - 5
    solution: The prediction is $w_1x_1+w_2x_2+b$.
  - id: lrp-recall-weights-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: lr-interpret-weights
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what does a feature's weight mean, and what does the bias mean?
    rubric:
      - id: first
        criterion: Explain that a weight gives the prediction change for a one-unit rise in its feature with all other features fixed.
        weight: 1
        required: true
      - id: second
        criterion: Explain that the bias is the prediction when every feature is zero.
        weight: 1
        required: true
    exemplar: A weight gives the change in prediction for one extra unit of its feature while the others stay fixed. The bias is the prediction when all features are zero.
  - id: lrp-recall-weights-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: lr-interpret-weights
    difficulty: 1
    est_minutes: 0.5
    prompt: A model's area weight changes when area is recorded in hundreds of square metres. What explains this?
    options:
      - id: a
        text: The feature has become more important.
        correct: false
        feedback: Importance is judged by how realistic feature changes move predictions.
      - id: b
        text: The bias has absorbed the area contribution.
        correct: false
        feedback: The area contribution is still the area times its weight.
      - id: c
        text: The weight depends on the feature's units.
        correct: true
        feedback: Rescaling a measurement requires rescaling its weight to preserve the contribution.
    solution: A weight's size depends on units, so its size alone cannot show importance.
  - id: lrp-recall-weights-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: lr-interpret-weights
    difficulty: 1
    est_minutes: 0.5
    prompt: One feature rises by $k$ units in a linear regression model. Its weight is $w$, and all other features stay fixed. Write the change in prediction.
    answer: w*k
    variables:
      w:
        - -5
        - 5
      k:
        - 2
        - 8
    solution: The prediction changes by the feature's weight times its change, $wk$.
  - id: lrp-recall-batch-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: lr-batch-predictions
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, how are examples arranged for a batch prediction, and what does the output contain?
    rubric:
      - id: first
        criterion: Explain that each example occupies one row of the feature matrix with features in the same order as the weights.
        weight: 1
        required: true
      - id: second
        criterion: Explain that the output has one prediction per row.
        weight: 1
        required: true
    exemplar: Each example forms one row of the feature matrix, with columns ordered to match the weights. A batch prediction returns one prediction for each row.
  - id: lrp-recall-batch-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: lr-batch-predictions
    difficulty: 1
    est_minutes: 0.5
    prompt: A feature matrix `X` already has a final column of ones, and the bias is stored as the last entry of the weights `w`. Which calculation gives the predictions?
    options:
      - id: a
        text: "$Xw$"
        correct: true
        feedback: The column of ones times the last weight adds the bias to every row inside the matrix product.
      - id: b
        text: "$Xw+b\\mathbf 1$"
        correct: false
        feedback: The column of ones already adds the bias, so this adds it twice.
      - id: c
        text: "entry-by-entry multiplication"
        correct: false
        feedback: "Entry-by-entry multiplication multiplies matching entries without adding them, so each row is left as separate pieces."
    solution: The column of ones carries the bias, so $Xw$ alone gives one prediction per row.
  - id: lrp-recall-batch-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: lr-batch-predictions
    difficulty: 1
    est_minutes: 0.5
    prompt: What vector multiplies the bias $b$ so that the same amount is added to each of the $n$ entries of $Xw$?
    accept: [ones vector, vector of ones, "a vector of ones", "n ones"]
    solution: Multiply $b$ by the vector of $n$ ones to add it to every prediction.
