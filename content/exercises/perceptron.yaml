concept: perceptron
exercises:
  - id: perc-check-1
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: "A neuron outputs $\\max(0, w \\cdot x + b)$: it outputs 0 for a negative score and keeps a positive score unchanged. With $w = (0.5, -1, 2)$ and $b = 0.5$, what is its output for $x = (2, 1, 0.5)$?"
    answer: 1.5
    tolerance: { abs: 0.001 }
    solution: "The score is $1 - 1 + 1 + 0.5 = 1.5$, so the neuron outputs $\\max(0, 1.5) = 1.5$."
  - id: dx-dl-1
    dimension: math
    type: numeric
    role: diagnostic
    difficulty: 1
    est_minutes: 2
    prompt: "A neuron outputs 0 for a negative score and keeps a positive score unchanged. Its score is $w\\cdot x+b$, with $w = (2, -1)$ and $b = 0.5$. What is its output for $x = (1, 3)$?"
    answer: 0
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -0.5,
          tolerance: { abs: 0.001 },
          category: misunderstood_definition,
          feedback: "$-0.5$ is the score before applying the rule. Negative scores give output 0.",
        }
    solution: "$z = 2 - 3 + 0.5 = -0.5$, so the output is 0."
  - id: perc-xor
    dimension: conceptual
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "Why can no single neuron $\\phi(w\\cdot x + b)$ with a monotonic activation compute XOR of two binary inputs?"
    options:
      - {
          id: a,
          text: "Its decision boundary is a single line, and XOR's positive points (0,1) and (1,0) cannot be separated from (0,0) and (1,1) by one line",
          correct: true,
        }
      - {
          id: b,
          text: "XOR needs more than two inputs",
          correct: false,
          category: misunderstood_definition,
        }
      - {
          id: c,
          text: "Because the weights would need to be negative",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Negative weights are allowed; the limitation is geometric.",
        }
    solution: "XOR is not linearly separable. A hidden layer creates new features (e.g. OR and AND) in which it becomes separable."
  - id: perc-boundary
    dimension: math
    type: numeric
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "A neuron has $w = (2, 1)$ and $b = -4$. Its decision boundary crosses the $x_1$-axis (where $x_2 = 0$) at what value of $x_1$?"
    answer: 2
    tolerance: { abs: 0.001 }
    solution: "$2x_1 + 0 - 4 = 0$, so $x_1 = 2$."
  - id: perc-review-and
    dimension: math
    type: mc
    role: review
    difficulty: 1
    est_minutes: 2
    prompt: "With a step activation (1 if $z > 0$), which weights and bias implement OR on binary inputs?"
    options:
      - { id: a, text: "$w = (1, 1)$, $b = -0.5$", correct: true }
      - {
          id: b,
          text: "$w = (1, 1)$, $b = -1.5$",
          correct: false,
          category: math_error,
          feedback: "That is AND: only (1,1) gives a positive score.",
        }
      - { id: c, text: "$w = (1, -1)$, $b = 0$", correct: false, category: math_error }
    solution: "Scores for (0,0),(0,1),(1,0),(1,1): $-0.5, 0.5, 0.5, 1.5$, giving outputs $0, 1, 1, 1$."
