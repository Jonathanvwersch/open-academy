concept: perceptron
exercises:
  - id: percp-score-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, why is the output 1 rather than 3?"
    options:
      - { id: a, text: "The step gives 1 for any positive score.", correct: true }
      - {
          id: b,
          text: "The step caps the score at 1, its largest output.",
          correct: false,
          feedback: "The step doesn't cap scores. A score of 0.4 would also give 1, because the step only checks whether the score is positive.",
        }
      - {
          id: c,
          text: "The step rounds the score to the nearest whole number.",
          correct: false,
          feedback: "Rounding would keep 3 as 3. The step only checks the sign of the score and outputs 0 or 1.",
        }
      - {
          id: d,
          text: "The step counts the inputs with positive weights.",
          correct: false,
          feedback: "The step acts on the whole score, which was 3 here. It doesn't look at the weights one by one.",
        }
    solution: "The weighted sum plus the bias is 3. Since 3 is positive, the step gives the decision 1 rather than returning the score."
  - id: percp-boundary-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Why does the boundary example test the origin after finding the line?"
    options:
      - { id: a, text: "Its negative score identifies the output-0 side.", correct: true }
      - {
          id: b,
          text: "Its zero inputs place it on every boundary.",
          correct: false,
          feedback: "The origin scores -1 here, so it is not on the boundary.",
        }
      - {
          id: c,
          text: "Its negative score makes the line output 1.",
          correct: false,
          feedback: "Every point on the line scores zero and outputs 0; the origin identifies a side.",
        }
      - {
          id: d,
          text: "Its inputs determine a new pair of weights.",
          correct: false,
          feedback: "The weights stay (2, -1); testing an input does not change them.",
        }
    solution: "The line locates the zero scores but does not by itself label the sides. The origin scores -1, so the side containing it gives output 0."
  - id: percp-xor-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked XOR argument, why does forcing a positive score at (1,1) prove failure?"
    options:
      - { id: a, text: "XOR needs 0 there, but a positive score gives 1.", correct: true }
      - {
          id: b,
          text: "XOR needs all four scores to have the same sign.",
          correct: false,
          feedback: "XOR needs two positive scores and two non-positive scores.",
        }
      - {
          id: c,
          text: "A positive score requires two negative weights.",
          correct: false,
          feedback: "The contradiction concerns the output at (1,1), not individual weight signs.",
        }
      - {
          id: d,
          text: "A positive score means the line has become curved.",
          correct: false,
          feedback: "The boundary is still straight; it cannot fit all four labels.",
        }
    solution: "The first three XOR requirements force a positive score for (1,1). The step gives 1 where XOR requires 0, ruling out every choice of weights and bias."
  - id: perc-score-and-step-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does a perceptron do?"
    options:
      - {
          id: a,
          text: "It predicts a number by adding weighted inputs and a bias.",
          correct: false,
          feedback: "That describes a linear regression prediction.",
        }
      - {
          id: b,
          text: "It applies a step to weighted inputs plus bias to answer yes or no.",
          correct: true,
          feedback: "The weighted sum plus bias becomes a yes-or-no decision through the step activation.",
        }
      - {
          id: c,
          text: "It copies the answer it gave to the most similar earlier input.",
          correct: false,
          feedback: "A perceptron uses its weights and bias, not an answer copied from a similar input.",
        }
      - {
          id: d,
          text: "It adds the two inputs without using weights or a bias.",
          correct: false,
          feedback: "A perceptron multiplies inputs by weights and adds a bias before applying the step.",
        }
    solution: "A perceptron scores its inputs using weights and a bias, then applies a step to answer yes or no."
  - id: perc-straight-boundary-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is a perceptron's decision boundary?"
    options:
      - {
          id: a,
          text: "The inputs whose score is exactly 0",
          correct: true,
          feedback: "On one side the score is positive and the step gives 1; on the other it's negative and gives 0.",
        }
      - {
          id: b,
          text: "The inputs whose score equals the bias",
          correct: false,
          feedback: "The score equals the bias wherever the weighted inputs add to 0. The boundary is where the whole score, bias included, is 0.",
        }
      - {
          id: c,
          text: "The inputs for which the perceptron outputs 1",
          correct: false,
          feedback: "Those inputs fill the whole yes side. The boundary is the edge of that side, where the score is 0.",
        }
      - {
          id: d,
          text: "The line joining the closest yes and no inputs",
          correct: false,
          feedback: "The boundary comes from the weights and bias, as the inputs where the score is 0, not from particular data points.",
        }
    solution: "A perceptron's decision boundary contains the inputs scoring zero. It separates positive-score yes answers from non-positive-score no answers."
  - id: perc-and-or-xor-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "XOR of two yes/no inputs outputs 1 when exactly one input is 1, and 0 otherwise. Why can't a single perceptron compute it?"
    options:
      - {
          id: a,
          text: "XOR needs negative weights, which a perceptron can't have.",
          correct: false,
          feedback: "Negative weights are allowed. The problem is where XOR's yes and no inputs sit.",
        }
      - {
          id: b,
          text: "XOR's yes inputs are diagonal corners, and no straight line separates them.",
          correct: true,
          feedback: "No straight line puts both yes corners on one side and both no corners on the other.",
        }
      - {
          id: c,
          text: "XOR needs a third output value besides 0 and 1.",
          correct: false,
          feedback: "XOR only needs outputs 0 and 1, exactly the two outputs a perceptron can give.",
        }
      - {
          id: d,
          text: "XOR needs both inputs, and a perceptron reads only one.",
          correct: false,
          feedback: "A perceptron can read any number of inputs, each with its own weight.",
        }
    solution: "XOR is not separable by one straight boundary, so a single perceptron cannot give all four inputs their required answers."
  - id: perc-check-1
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: "A neuron outputs $\\max(0, w \\cdot x + b)$: it outputs 0 for a negative score and keeps a positive score unchanged. With $w = (0.5, -1, 2)$ and $b = 0.5$, what is its output for $x = (2, 1, 0.5)$?"
    answer: 1.5
    tolerance: { abs: 0.001 }
    solution: "The score is $1 - 1 + 1 + 0.5 = 1.5$, so the neuron outputs $\\max(0, 1.5) = 1.5$."
  - id: dx-dl-1
    dimension: math
    type: numeric
    role: diagnostic
    difficulty: 1
    est_minutes: 2
    prompt: "A neuron outputs 0 for a negative score and keeps a positive score unchanged. Its score is $w\\cdot x+b$, with $w = (2, -1)$ and $b = 0.5$. What is its output for $x = (1, 3)$?"
    answer: 0
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -0.5,
          tolerance: { abs: 0.001 },
          category: misunderstood_definition,
          feedback: "$-0.5$ is the score before applying the rule. Negative scores give output 0.",
        }
    solution: "$z = 2 - 3 + 0.5 = -0.5$, so the output is 0."
  - id: perc-xor
    dimension: conceptual
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt:
      A single perceptron computes $\phi(w\cdot x+b)$ with weight vector $w$, binary input vector
      $x$, bias $b$ and step activation $\phi$. Why can't it compute XOR of two binary inputs?
    options:
      - {
          id: a,
          text: "Its boundary is one straight line, and XOR's yes points are diagonal",
          correct: true,
        }
      - {
          id: b,
          text: "XOR needs more than two inputs to tell the cases apart",
          correct: false,
          category: misunderstood_definition,
          feedback: "XOR is defined on exactly two inputs, so the number of inputs is not the limit. Plot the four input points and try to separate yes from no with one straight line.",
        }
      - {
          id: c,
          text: "The weights would need to be negative, which isn't allowed",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Negative weights are allowed; the limitation is geometric.",
        }
      - {
          id: d,
          text: "The step can output 1 for only one input pattern",
          correct: false,
          category: misunderstood_definition,
          feedback: "With $w = (1, 1)$ and $b = -0.5$ a perceptron outputs 1 for three of the four patterns (OR), so that isn't the limit.",
        }
    solution: "XOR is not linearly separable: its two yes corners are diagonally opposite, and no single straight boundary separates them from both no corners. Changing the weights or bias cannot remove this limit."
  - id: perc-boundary
    dimension: math
    type: numeric
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: A neuron has weight vector $w=(2,1)$ for inputs $x_1,x_2$ and bias $b=-4$. Its decision
      boundary crosses the $x_1$-axis (where $x_2=0$) at what value of $x_1$?
    answer: 2
    tolerance: { abs: 0.001 }
    solution: "$2x_1 + 0 - 4 = 0$, so $x_1 = 2$."
  - id: perc-review-and
    dimension: math
    type: mc
    role: review
    difficulty: 1
    est_minutes: 2
    prompt: A perceptron uses a step activation that outputs 1 if its score $z$ is positive and 0
      otherwise. Which weights and bias implement OR on two binary inputs?
    options:
      - { id: a, text: "$w = (1, 1)$, $b = -0.5$", correct: true }
      - {
          id: b,
          text: "$w = (1, 1)$, $b = -1.5$",
          correct: false,
          category: math_error,
          feedback: "That is AND: only (1,1) gives a positive score.",
        }
      - {
          id: c,
          text: "$w = (1, -1)$, $b = 0$",
          correct: false,
          category: math_error,
          feedback: "Changing the sign of one weight makes the two inputs push the score in opposite directions, so the rule is not OR. Compute all four scores and check which are above zero.",
        }
    solution: "Scores for (0,0),(0,1),(1,0),(1,1): $-0.5, 0.5, 0.5, 1.5$, giving outputs $0, 1, 1, 1$."
  - id: perc-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "Explain in 2–4 sentences what a perceptron computes from its inputs, and why a single perceptron can't compute XOR of two yes/no inputs."
    rubric:
      - {
          id: r1,
          criterion: "Describes the weighted sum of the inputs plus a bias, passed through the step rule (1 if the score is positive, else 0)",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Explains that the boundary where the score is zero is a straight line, and XOR's yes corners (0,1) and (1,0) are diagonally opposite, so no single line separates them from (0,0) and (1,1)",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Mention that changing the bias slides the straight decision boundary.",
          weight: 1,
        }
    exemplar: "A perceptron multiplies each input by its weight, adds the results and a bias to get a score, then outputs 1 if the score is above zero and 0 otherwise. The inputs that score exactly zero form a straight line (a hyperplane with more inputs), so the perceptron can only say yes on one side of a straight boundary; the weights set its direction and the bias slides it. XOR needs yes at (0,1) and (1,0) and no at (0,0) and (1,1). Those pairs are diagonally opposite corners of a square, so any straight line that puts both yes corners on one side also puts a no corner there."
  - id: percp-output
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      A shortlisting neuron has weights $w = (1, -2)$ and bias $b = -0.5$, and uses the step rule: output 1 if the score is above 0, otherwise 0.

      A house has size $x_1 = 2$ (200 m²) and is $x_2 = 0.5$ km from the station. What does the neuron output?
    hints:
      - "First compute the score $z = w_1 x_1 + w_2 x_2 + b$."
      - "Then apply the step rule to the score."
    answer: 1
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 0.5,
          tolerance: { abs: 0.001 },
          category: misunderstood_definition,
          feedback: "0.5 is the score $z$. The output is the step rule applied to the score.",
        }
      - {
          answer: 1.5,
          tolerance: { abs: 0.001 },
          category: math_error,
          feedback: "That score adds the bias as $+0.5$. The bias is $-0.5$, so the score is $2 - 1 - 0.5 = 0.5$.",
        }
    solution: "The score is $z = 1 \\cdot 2 + (-2) \\cdot 0.5 - 0.5 = 2 - 1 - 0.5 = 0.5$. It's above 0, so the step rule outputs 1: shortlist it."
  - id: percp-score-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      A perceptron has weights $w = ({{=w1}}, {{=w2}})$ and bias $b = {{=b}}$. A house has size $x_1 = {{=x1}}$ (hundreds of m²) and is $x_2 = {{=x2}}$ km from the station.

      What is the perceptron's score for this house, before the step?
    hints:
      - "Multiply each input by its weight, add the two results, then add the bias."
    solution: |
      $z = {{=w1}} \cdot {{=x1}} + ({{=w2}}) \cdot {{=x2}} + ({{=b}}) = {{=w1*x1 + w2*x2 + b}}$.

      The step rule then outputs 1 if this score is above 0 and 0 otherwise. The score is not itself a probability or a yes-or-no output.
    answer_expr: "w1 * x1 + w2 * x2 + b"
    params:
      w1: { min: 1, max: 4 }
      w2: { min: -3, max: -1 }
      b: { min: -3, max: -1 }
      x1: { min: 0.5, max: 2, step: 0.5 }
      x2: { min: 0.5, max: 3, step: 0.5 }
    constraints: ["2 * w2 * x2 != b"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "w1 * x1 + w2 * x2",
          category: incomplete_explanation,
          feedback: "That's the weighted sum without the bias. Add $b$ to get the score.",
        }
      - {
          answer_expr: "w1 * x1 - w2 * x2 + b",
          category: math_error,
          feedback: "The second weight is negative, so the distance term lowers the score.",
        }
  - id: percp-score-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: A house has perceptron score $z=0$, exactly on the decision boundary. Under the strict
      step-activation convention, what does the perceptron output?
    options:
      - { id: a, text: "0, because the step needs a positive score", correct: true }
      - {
          id: b,
          text: "1, because a score of 0 reaches the bar",
          correct: false,
          category: misunderstood_definition,
          feedback: "The step is strict: only a score greater than 0 gives 1.",
        }
      - {
          id: c,
          text: "0.5, because the house is halfway",
          correct: false,
          category: misunderstood_definition,
          feedback: "The step only ever outputs 0 or 1.",
        }
      - {
          id: d,
          text: "Nothing, because a score of 0 is undefined",
          correct: false,
          category: misunderstood_definition,
          feedback: "A score of 0 is fine. The step gives 1 only for a positive score, so 0 gives 0.",
        }
    solution: "The step outputs 1 only when $z > 0$. A score of exactly 0 isn't above 0, so the output is 0; zero is included in the non-positive case."
  - id: percp-weight-sign
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt:
      A shortlisting neuron has score $z=2x_1-x_2-1$, where $x_1$ represents the house's size and
      $x_2$ its distance to the station in kilometres. A house moves 1 km farther from the station with
      everything else fixed. What happens to its score?
    options:
      - { id: a, text: "It drops by 1, because the distance weight is $-1$", correct: true }
      - {
          id: b,
          text: "It rises by 1, because the distance went up by 1",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The change is the weight times the change in input: $-1 \\times 1 = -1$.",
        }
      - {
          id: c,
          text: "It drops by 2, because 2 is the first weight",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The weight 2 belongs to size, which didn't change.",
        }
      - {
          id: d,
          text: "It stays the same, because only the bias sets the score",
          correct: false,
          category: misunderstood_definition,
          feedback: "Every input contributes its weight times its value to the score.",
        }
    solution: "The distance contributes $-1 \\cdot x_2$ to the score, so 1 more km lowers the score by 1. A negative weight means that input counts against a yes."
  - id: percp-why-bias
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "A neuron choosing houses to visit reads two inputs, size and distance to the station. You lower its bias by 2 and leave both weights as they are. How do the scores of different houses change?"
    options:
      - { id: a, text: "Every house's score drops by 2", correct: true }
      - {
          id: b,
          text: "Bigger houses' scores drop more, because size has the larger weight",
          correct: false,
          category: misunderstood_definition,
          feedback: "Weights multiply inputs. The bias is added once, the same for every house, so it doesn't interact with size.",
        }
      - {
          id: c,
          text: "Only the scores of houses near the boundary change",
          correct: false,
          category: misunderstood_definition,
          feedback: "The bias is part of every house's score, so every score changes, not only those near the boundary.",
        }
      - {
          id: d,
          text: "Every score is divided by 2",
          correct: false,
          category: misunderstood_definition,
          feedback: "The bias is added to the weighted sum, so changing it adds or subtracts the same amount. It doesn't scale the score.",
        }
    solution: "The bias is added to every house's score, so lowering it by 2 subtracts 2 from every score while keeping both weights fixed. A house scoring 1 would now score $-1$ and switch to no; the trade-off between size and distance is unchanged."
  - id: percp-robot-gripper
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: "A robot gripper closes when a neuron outputs 1. The neuron's score is $z = 3p - 2d - 1$, where $p$ is the pressure reading on the fingers and $d$ is the gap between them in cm. Which numbers are the neuron's weights?"
    options:
      - { id: a, text: "3 and $-2$", correct: true }
      - {
          id: b,
          text: "$p$ and $d$",
          correct: false,
          category: misunderstood_definition,
          feedback: "$p$ and $d$ are the inputs: they change every time the sensors are read.",
        }
      - {
          id: c,
          text: "$-1$ only",
          correct: false,
          category: misunderstood_definition,
          feedback: "$-1$ is added on its own, not multiplied by an input, so it's the bias.",
        }
      - {
          id: d,
          text: "3, $-2$ and $-1$",
          correct: false,
          category: misunderstood_definition,
          feedback: "$-1$ isn't multiplied by an input, so it's the bias rather than a weight.",
        }
    solution: "The weights multiply the inputs: 3 multiplies $p$ and $-2$ multiplies $d$. The $-1$ on its own is the bias, and $p$ and $d$ are the inputs."
  - id: percp-boundary-meaning
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "What is a perceptron's decision boundary?"
    options:
      - { id: a, text: "The inputs whose score $w \\cdot x + b$ is exactly 0", correct: true }
      - {
          id: b,
          text: "The inputs for which the perceptron outputs 1",
          correct: false,
          category: misunderstood_definition,
          feedback: "That's the whole yes side. The boundary is where the yes side meets the no side.",
        }
      - {
          id: c,
          text: "The inputs whose score is as large as possible",
          correct: false,
          category: misunderstood_definition,
          feedback: "The score keeps growing as you move further into the yes side; the boundary is where it's 0.",
        }
      - {
          id: d,
          text: "The line through the origin in the direction of $w$",
          correct: false,
          category: misunderstood_definition,
          feedback: "The boundary is set by both the weights and the bias, and the bias moves it away from the origin.",
        }
    solution: "The boundary is $\\{x : w \\cdot x + b = 0\\}$, the inputs that score exactly 0. Inputs on one side score above 0 and get 1; inputs on the other side get 0."
  - id: percp-crossing-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: |
      A shortlisting neuron has weights $w = ({{=w1}}, {{=w2}})$ and bias $b = {{=b}}$, where $x_1$ is size (hundreds of m²) and $x_2$ is distance to the station (km).

      Its decision boundary crosses the size axis, where $x_2 = 0$, at what value of $x_1$?
    hints:
      - "On the boundary the score is 0."
      - "Set $x_2 = 0$, so the score is $w_1 x_1 + b = 0$, and solve for $x_1$."
    solution: |
      With $x_2 = 0$ the boundary is ${{=w1}} x_1 + ({{=b}}) = 0$, so $x_1 = {{=-b}} / {{=w1}} = {{=-b/w1}}$.

      A house of that size right at the station scores exactly 0.
    answer_expr: "-b / w1"
    params:
      w1: { min: 1, max: 2 }
      w2: { min: -3, max: -1 }
      b: { min: -6, max: -1 }
    tolerance: { abs: 0.01 }
    common_wrong:
      - {
          answer_expr: "b / w1",
          category: math_error,
          feedback: "Check the sign: moving $b$ to the other side of $w_1 x_1 + b = 0$ gives $w_1 x_1 = -b$.",
        }
  - id: percp-which-side
    dimension: math
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      A neuron has weight vector $w=(2,-1)$ and bias $b=-1$, with $x_1$ the size in hundreds of m²
      and $x_2$ the distance in km. Which house lies on the yes side of its boundary?
    options:
      - { id: a, text: "Size 1.5, 1.5 km away", correct: true }
      - {
          id: b,
          text: "Size 0.5, 0.2 km away",
          correct: false,
          category: math_error,
          feedback: "Its score is $1 - 0.2 - 1 = -0.2$, which is below 0.",
        }
      - {
          id: c,
          text: "Size 1.0, 1.2 km away",
          correct: false,
          category: math_error,
          feedback: "Its score is $2 - 1.2 - 1 = -0.2$, which is below 0.",
        }
      - {
          id: d,
          text: "Size 0.6, 0.4 km away",
          correct: false,
          category: math_error,
          feedback: "Its score is $1.2 - 0.4 - 1 = -0.2$, which is below 0.",
        }
    solution: "The house of size 1.5, 1.5 km away scores $3 - 1.5 - 1 = 0.5 > 0$, so it's on the yes side. The other three each score $-0.2$."
  - id: percp-bias-shift
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: For inputs $x_1$ and $x_2$, a neuron's decision boundary is the line $2x_1-x_2-1=0$. You
      change only the bias, from $-1$ to $-2$. What happens to the boundary line?
    options:
      - { id: a, text: "It slides sideways without turning", correct: true }
      - {
          id: b,
          text: "It turns around the point where it meets the origin",
          correct: false,
          category: misunderstood_definition,
          feedback: "The weights set the line's direction, and they didn't change.",
        }
      - {
          id: c,
          text: "It stays put and the yes and no sides swap",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The sides swap only if you flip the signs of all the weights and the bias together.",
        }
      - {
          id: d,
          text: "It bends into a curve",
          correct: false,
          category: misunderstood_definition,
          feedback: "$w_1 x_1 + w_2 x_2 + b = 0$ is a straight line for any bias.",
        }
    solution: "The weights fix the direction of the line and the bias shifts it. With $b = -2$ the line crosses the size axis at $x_1 = 1$ instead of $0.5$, parallel to the old line."
  - id: percp-why-straight
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "Why can't changing a single perceptron's weights and bias turn its boundary in a size-versus-distance plot into a closed circle?"
    options:
      - {
          id: a,
          text: "The boundary is where $w_1 x_1 + w_2 x_2 + b = 0$, a straight line for any values",
          correct: true,
        }
      - {
          id: b,
          text: "It could, if both weights were made large enough",
          correct: false,
          category: misunderstood_definition,
          feedback: "Larger coefficients change the line's direction or position, not the type of equation. It is still straight.",
        }
      - {
          id: c,
          text: "Only the bias must change; shifting a line repeatedly makes a circle",
          correct: false,
          category: misunderstood_definition,
          feedback: "Each bias setting gives one straight line. Moving that line does not combine its old positions into a new boundary.",
        }
      - {
          id: d,
          text: "The step rule rounds each input to 0 or 1, losing the positions needed for a circle",
          correct: false,
          category: misunderstood_definition,
          feedback: "The step rule acts on the combined score, not on each input. The weighted-sum score is what imposes the straight boundary.",
        }
    solution: "With two inputs the boundary is $w_1 x_1 + w_2 x_2 + b = 0$. Nonzero weights describe a line, whatever their values. They can turn the line and the bias can slide it, but neither creates a closed curve."
  - id: percp-no-curve
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A buyer wants every house within 1 km of a park, in any direction. The inputs are a house's position east and north of the park, in km. Can one perceptron say yes to exactly those houses?"
    options:
      - {
          id: a,
          text: "No, because its boundary is straight but this one is a circle",
          correct: true,
        }
      - {
          id: b,
          text: "Yes, if both weights are set to 1",
          correct: false,
          category: incorrect_reasoning,
          feedback: "With any weights the boundary $w_1 x_1 + w_2 x_2 + b = 0$ is a straight line.",
        }
      - {
          id: c,
          text: "Yes, if the bias is set to $-1$",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The bias only slides the line. It can't bend it into a circle.",
        }
      - {
          id: d,
          text: "No, because positions can be negative numbers",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Negative inputs are fine. The problem is the shape of the boundary.",
        }
    solution: "The yes region is a disc around the park, and its edge is a circle. A perceptron's boundary is always a straight line, so it can only split the map into two halves."
  - id: percp-xor-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "With yes/no inputs $x_1$ (garden) and $x_2$ (near the station), why can no single perceptron output 1 for exactly one of the two, and 0 otherwise?"
    options:
      - {
          id: a,
          text: "The yes corners (0,1) and (1,0) are diagonal, so no straight line can split them from the no corners",
          correct: true,
        }
      - {
          id: b,
          text: "A perceptron can't have negative weights, and this pattern needs them",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Negative weights are allowed. The limit is the straight boundary.",
        }
      - {
          id: c,
          text: "The pattern needs more than two inputs, and the perceptron only has two",
          correct: false,
          category: misunderstood_definition,
          feedback: "XOR is defined on exactly these two inputs. The trouble is where its yes corners sit.",
        }
      - {
          id: d,
          text: "The step rule can only output 1 for one of the four houses at a time",
          correct: false,
          category: misunderstood_definition,
          feedback: "OR outputs 1 for three of the four houses, so that isn't the limit.",
        }
    solution: "A perceptron's yes region is one side of a straight line. XOR wants yes at (0,1) and (1,0) and no at (0,0) and (1,1), and any line with both yes corners on one side also has a no corner there."
  - id: percp-count-yes-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: |
      A perceptron reads two yes/no inputs: $x_1 = 1$ if the house has a garden and $x_2 = 1$ if it's near the station, otherwise 0. It has weights $w = ({{=w1}}, {{=w2}})$, bias $b = {{=b}}$ and the step rule (output 1 if the score is above 0).

      For how many of the four houses $(0,0), (0,1), (1,0), (1,1)$ does it output 1?
    hints:
      - "For $(0,0)$ the score is just $b$; for $(1,0)$ it's $w_1 + b$."
      - "Compute all four scores and count the ones above 0."
    solution: |
      The four scores are:

      - $(0,0)$: $b = {{=b}}$
      - $(0,1)$: $w_2 + b = {{=w2 + b}}$
      - $(1,0)$: $w_1 + b = {{=w1 + b}}$
      - $(1,1)$: $w_1 + w_2 + b = {{=w1 + w2 + b}}$

      {{=(b > 0) + (w1 + b > 0) + (w2 + b > 0) + (w1 + w2 + b > 0)}} of them are above 0, so that many houses get a 1.
    answer_expr: "(b > 0) + (w2 + b > 0) + (w1 + b > 0) + (w1 + w2 + b > 0)"
    params:
      w1: { min: -2, max: 2, step: 0.5 }
      w2: { min: -2, max: 2, step: 0.5 }
      b: { min: -2, max: 1.5, step: 0.5 }
    constraints: ["b != 0", "w1 + b != 0", "w2 + b != 0", "w1 + w2 + b != 0", "w1 != 0", "w2 != 0"]
    tolerance: { abs: 0.001 }
  - id: percp-or-bias
    dimension: math
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A perceptron has weights $w = (1, 1)$ and the step rule, on yes/no inputs. Which bias makes it compute OR: 1 if at least one input is 1?"
    options:
      - { id: a, text: "$b = -0.5$", correct: true }
      - {
          id: b,
          text: "$b = -1.5$",
          correct: false,
          category: math_error,
          feedback: "The scores are $-1.5, -0.5, -0.5, 0.5$, so only (1,1) gets a 1. That's AND.",
        }
      - {
          id: c,
          text: "$b = 0.5$",
          correct: false,
          category: math_error,
          feedback: "Then (0,0) scores 0.5 and gets a 1 too, so every house gets a yes.",
        }
      - {
          id: d,
          text: "$b = -2.5$",
          correct: false,
          category: math_error,
          feedback: "The highest score is $2 - 2.5 = -0.5$, so no house gets a yes.",
        }
    solution: "With $b = -0.5$ the scores for (0,0), (0,1), (1,0), (1,1) are $-0.5, 0.5, 0.5, 1.5$, giving $0, 1, 1, 1$: OR."
  - id: percp-nand-output
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      A perceptron has weights $w=(-1,-1)$, bias $b=1.5$ and the step rule. Its two inputs indicate
      whether the house has a garden and whether it is near the station. What does it output for input
      vector $x=(1,1)$, meaning yes to both?
    answer: 0
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -0.5,
          tolerance: { abs: 0.001 },
          category: misunderstood_definition,
          feedback: "$-0.5$ is the score. Apply the step rule to it.",
        }
    solution: "The score is $-1 - 1 + 1.5 = -0.5$, which isn't above 0, so the output is 0. This perceptron says yes unless both inputs are 1."
  - id: percp-which-pattern
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "On yes/no inputs $(x_1, x_2)$, which of these patterns can a single perceptron compute?"
    options:
      - { id: a, text: "Output 1 only for (0,0)", correct: true }
      - {
          id: b,
          text: "Output 1 only for (0,1) and (1,0)",
          correct: false,
          category: misunderstood_definition,
          feedback: "That's XOR: its yes corners are diagonal, so no straight line splits them off.",
        }
      - {
          id: c,
          text: "Output 1 only for (0,0) and (1,1)",
          correct: false,
          category: incorrect_reasoning,
          feedback: "These yes corners are diagonal too, so no straight line splits them off.",
        }
      - {
          id: d,
          text: "None of these: two inputs are too few",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Two inputs are enough for AND and OR, and for cutting off one corner.",
        }
    solution: "A single corner can always be cut off by a straight line; for example $w = (-1, -1)$, $b = 0.5$ outputs 1 only for (0,0). The two diagonal patterns can't be split by one line."
  - id: percp-robot-bumpers
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A robot has a left and a right bump sensor, each reading 1 when pressed and 0 otherwise. It should turn when exactly one sensor is pressed, and not when neither or both are. Can a single perceptron make this decision?"
    options:
      - { id: a, text: "No, because this is XOR and its yes cases are diagonal", correct: true }
      - {
          id: b,
          text: "Yes, with weights $(1, 1)$ and bias $-0.5$",
          correct: false,
          category: math_error,
          feedback: "That's OR: it also turns when both sensors are pressed.",
        }
      - {
          id: c,
          text: "Yes, with weights $(1, 1)$ and bias $-1.5$",
          correct: false,
          category: math_error,
          feedback: "That's AND: it turns only when both sensors are pressed.",
        }
      - {
          id: d,
          text: "No, because sensor readings can't be inputs",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Any number can be an input. The problem is the pattern of yes cases.",
        }
    solution: "Turning for (0,1) and (1,0) but not (0,0) or (1,1) is XOR. Those yes cases are opposite corners of the square, so no straight boundary separates them."
  - id: perc-recall-score-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: perc-score-and-step
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, how does a perceptron get its score, and how does it turn that score into an output?"
    rubric:
      - id: score
        criterion: "Explain that the score is the sum of the matching input and weight products, plus one bias."
        weight: 1
        required: true
      - id: step
        criterion: "State that the step gives 1 for a positive score and 0 for a score of zero or less."
        weight: 1
        required: true
    exemplar: "A perceptron multiplies each input by its matching weight, adds the products and adds the bias once. Its step gives 1 for a positive score and 0 otherwise."
  - id: perc-recall-score-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: perc-score-and-step
    difficulty: 1
    est_minutes: 0.5
    prompt: "A perceptron's score rises from $0.2$ to $3$. What happens to its output?"
    options:
      - id: a
        text: "It rises by the same amount as the score."
        correct: false
        feedback: "The weighted sum plus bias rises by that amount. The step then turns each positive score into 1."
      - id: b
        text: "It stays at 1."
        correct: true
        feedback: "Every positive score gives 1, regardless of its size."
      - id: c
        text: "It rises from 0 to 1."
        correct: false
        feedback: "That switch would require starting at zero or below. Both scores here are positive."
      - id: d
        text: "It stays at 0."
        correct: false
        feedback: "The step gives 0 for scores of zero or less. Both scores here are positive."
    solution: "The step returns 1 at both scores because both are positive."
  - id: perc-recall-score-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: perc-score-and-step
    difficulty: 1
    est_minutes: 0.5
    prompt: "A perceptron has inputs $x_1,x_2$, matching weights $w_1,w_2$ and bias $b$. Write its score $z$ before the step. Type the subscripts as x1, x2, w1 and w2."
    answer: "w1*x1 + w2*x2 + b"
    variables: { x1: [-3, 3], x2: [-3, 3], w1: [-3, 3], w2: [-3, 3], b: [-2, 2] }
    solution: "Multiply each input by its weight, add the products and add the bias once. The score is $z=w_1x_1+w_2x_2+b$."
  - id: perc-recall-boundary-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: perc-straight-boundary
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what is a perceptron's decision boundary, and how does changing only its bias affect it when the weight vector is nonzero?"
    rubric:
      - id: zero-score
        criterion: "Explain that the boundary is the set of inputs whose score is exactly zero."
        weight: 1
        required: true
      - id: bias
        criterion: "Explain that changing the bias slides the boundary without turning it."
        weight: 1
        required: true
    exemplar: "The decision boundary is the set of inputs whose score is zero. Changing only the bias slides the boundary and keeps its direction the same."
  - id: perc-recall-boundary-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: perc-straight-boundary
    difficulty: 1
    est_minutes: 0.5
    prompt: "Start on a two-input perceptron's boundary with a nonzero weight vector $w$. Which move takes you into the yes side?"
    options:
      - id: a
        text: "Take a small step opposite to $w$."
        correct: false
        feedback: "This decreases the score below zero and takes you to the no side."
      - id: b
        text: "Take a small step perpendicular to $w$."
        correct: false
        feedback: "A perpendicular move has zero dot product with $w$, so the score stays at zero."
      - id: c
        text: "Take a small step along $w$."
        correct: true
        feedback: "Moving along $w$ raises the score above zero."
    solution: "The score increases when you move along $w$ because $w\\cdot w$ is positive."
  - id: perc-recall-boundary-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: perc-straight-boundary
    difficulty: 2
    est_minutes: 0.5
    prompt: "A perceptron has inputs $x_1,x_2$, matching weights $w_1,w_2$ and bias $b$. On its decision boundary, what is $x_2$ in terms of $x_1,w_1,w_2,b$? Assume $w_2$ is nonzero. Type x1, w1 and w2 for the subscripts."
    answer: "-(w1*x1+b)/w2"
    variables: { x1: [-4, 4], w1: [-3, 3], w2: [0.5, 4], b: [-2, 2] }
    solution: "Set the score to zero, then isolate $x_2$ to get $x_2=-(w_1x_1+b)/w_2$."
  - id: perc-recall-xor-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: perc-and-or-xor
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, when does XOR say yes, and why can't one perceptron give that pattern?"
    rubric:
      - id: pattern
        criterion: "State that XOR says yes when exactly one of the two inputs is 1."
        weight: 1
        required: true
      - id: separation
        criterion: "Explain that the yes points are opposite corners and no straight line separates both yes points from both no points."
        weight: 1
        required: true
    exemplar: "XOR says yes when exactly one input is 1. Those yes points sit at opposite corners of the square, so the single straight line a perceptron uses cannot separate both yes points from both no points."
  - id: perc-recall-xor-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: perc-and-or-xor
    difficulty: 1
    est_minutes: 0.5
    prompt: "Which two-input rule says yes for $(0,0)$, $(1,0)$ and $(0,1)$, and says no for $(1,1)$?"
    options:
      - id: a
        text: "AND"
        correct: false
        feedback: "AND says yes only at (1,1), where both inputs are 1."
      - id: b
        text: "OR"
        correct: false
        feedback: "OR says no at (0,0) and yes at every other corner."
      - id: c
        text: "XOR"
        correct: false
        feedback: "XOR says no when the two inputs agree, including at (0,0)."
      - id: d
        text: "NAND"
        correct: true
        feedback: "NAND says no only when both inputs are 1."
    solution: "Only (1,1) makes AND true. NAND reverses those answers."
  - id: perc-recall-xor-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: perc-and-or-xor
    difficulty: 1
    est_minutes: 0.5
    prompt: "Two perceptrons each read the same pair of binary inputs. One computes OR. A third perceptron takes the AND of their outputs to produce XOR. What rule does the second perceptron compute? Give its name or describe when it says yes."
    accept:
      [
        "NAND",
        "NOT AND",
        "not both",
        "not both inputs",
        "not both inputs are 1",
        "not both are 1",
        "not both inputs are yes",
        "negated AND",
        "the opposite of AND",
        "yes unless both inputs are 1",
        "yes unless both inputs are yes",
        "at least one input is 0",
        "at least one input is no",
        "at least one is 0",
        "0 only when both inputs are 1",
        "1 - AND",
        "¬AND",
        "!(x1 && x2)",
        "¬(x₁ ∧ x₂)",
      ]
    regex: '^\s*(?:(?:the\s+)?(?:n\s*[- ]?\s*and|(?:not|negated)\s*[- ]?\s*\(?\s*and\s*\)?)(?:\s+gate)?|(?:!|¬)\s*and|(?:not\s+both|(?:yes|1|one|true|it\s+says\s+yes)\s+(?:unless|except\s+when)\s+both)\s+(?:inputs\s+)?(?:are|equal|say)\s+(?:1|one|yes|true)|(?:at\s+least\s+one|one\s+or\s+both)(?:\s+inputs?)?\s+(?:is|are)\s+(?:0|zero|no|false)|(?:!|¬|not)\s*\(\s*(?:x\s*_?\s*[1₁]\s*(?:&&|∧|and)\s*x\s*_?\s*[2₂]|x\s*_?\s*[2₂]\s*(?:&&|∧|and)\s*x\s*_?\s*[1₁])\s*\))\s*[.!]?\s*$'
    solution: "OR requires at least one yes. NAND rules out two yes inputs, so their AND says yes exactly when one input is yes."
