concept: overfitting
exercises:
  - id: lab-image-classifier-selection
    dimension: transfer
    type: explain
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "An image classifier has training losses 0.30, 0.12 and 0.04 at epochs 2, 4 and 6. Validation losses are 0.34, 0.20 and 0.29. Which checkpoint would you keep? Explain what the later changes suggest and how you would use a test set after making this choice."
    rubric:
      - {
          id: choice,
          criterion: "Keeps epoch 4 using the lowest validation loss, 0.20.",
          weight: 1,
          required: true,
        }
      - {
          id: diagnosis,
          criterion: "Explains that falling training loss with rising validation loss after epoch 4 suggests overfitting.",
          weight: 1,
          required: true,
        }
      - {
          id: test,
          criterion: "Reserves test for a final score after choices are fixed, without using it to replace the validation choice.",
          weight: 1,
          required: true,
        }
    exemplar: "I would keep epoch 4 because its validation loss is lowest at 0.20. From epoch 4 to 6, training improves while validation worsens, which suggests overfitting. After fixing the training choices, I would restore epoch 4 and score it once on the test set. I would keep test results out of checkpoint selection."
    solution: "Epoch 4 has the smallest validation loss. The later gap suggests overfitting, and test data provides one final independent score."
  - id: ovf-fit-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What distinguishes overfitting from underfitting?
    options:
      - {
          id: a,
          text: "Overfitting follows training quirks; underfitting misses useful training patterns.",
          correct: true,
          feedback: "Overfitting fails to carry training success to new examples; underfitting misses useful patterns even in training.",
        }
      - {
          id: b,
          text: "Overfitting misses training patterns; underfitting follows training quirks.",
          correct: false,
          feedback: "Those descriptions are reversed: underfitting fails even on the training examples.",
        }
      - {
          id: c,
          text: "Overfitting means any curved model; underfitting means any straight model.",
          correct: false,
          feedback: "The appropriate shape depends on the pattern; a straight model can be suitable.",
        }
      - {
          id: d,
          text: "Overfitting predicts validation houses well; underfitting predicts them perfectly.",
          correct: false,
          feedback: "Neither term describes successful prediction on validation houses.",
        }
    solution: Underfitting misses useful patterns even in training data. Overfitting follows training details that do not carry over to new examples.
  - id: ovf-zero-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked table, why reject the wiggly curve with rounded training error 0 and validation error 93?"
    options:
      - {
          id: a,
          text: "Its zero error proves it cannot predict any house price.",
          correct: false,
          feedback: "It predicts the training prices exactly; the problem is its validation predictions.",
        }
      - {
          id: b,
          text: "Its validation predictions are worse despite perfect training predictions.",
          correct: true,
        }
      - {
          id: c,
          text: "Its validation predictions must improve whenever training error reaches zero.",
          correct: false,
          feedback: "The validation score is 93, worse than the smooth model's 28.",
        }
      - {
          id: d,
          text: "Its validation houses should have been added before comparing models.",
          correct: false,
          feedback: "Validation houses must stay out of training so we can compare validation predictions fairly.",
        }
    solution: Zero training error only describes the training houses. Validation error 93 is much worse than the smooth curve's 28, so perfect training fit is not a win here.
  - id: ovf-line-diagnosis
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt:
      A straight line is fitted to house prices that rise steeply for large houses. It misses most training
      prices by about 40 thousand dollars and validation prices by about the same. What does this suggest?
    options:
      - id: a
        text: Underfitting, because the line misses the pattern in training prices
        correct: true
        feedback: The shape is too simple to capture the steep rise.
      - id: b
        text: A good fit, because training and validation errors are close
        correct: false
        feedback: Close errors can both be too large to be useful.
      - id: c
        text: Overfitting, because validation error is not lower than training error
        correct: false
        feedback: Overfitting is suggested by low training error and much higher validation error.
      - id: d
        text: Overfitting, because the prediction misses are large on both sets
        correct: false
        feedback: Large errors on both sets suggest a failure to learn the pattern.
    solution:
      The line misses the price pattern even on training houses. Large, similar training and validation errors
      suggest underfitting.
  - id: ovfp-average-miss
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      a:
        min: 4
        max: 12
        step: 2
      b:
        min: 14
        max: 22
        step: 2
    prompt:
      Two validation houses sold for 300 and 250 thousand dollars. A model predicted {{=300+a}} and {{=250-b}}
      thousand dollars respectively. What is its mean absolute error in thousands of dollars?
    answer_expr: (a + b) / 2
    tolerance:
      abs: 0.01
    solution:
      "Add the two absolute misses and divide by two houses: ({{= a }} + {{= b }}) / 2 = {{= (a + b) / 2 }}
      thousand dollars. Squaring is not part of mean absolute error."
    common_wrong:
      - answer_expr: (a-b)/2
        category: misunderstood_definition
        feedback: Take the absolute value of each prediction error before averaging.
  - id: ovf-choose-fit
    dimension: transfer
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The straight line, the smooth curve and the wiggly curve have rounded training/validation errors 50/62, 25/28 and 0/93, respectively, in thousands of dollars. Which should we choose?"
    options:
      - {
          id: a,
          text: "The straight line, because simplicity outweighs its validation error of 62.",
          correct: false,
          feedback: "The aim is accurate validation predictions. The smooth curve scores much better on validation.",
        }
      - {
          id: b,
          text: "The smooth curve, because its validation error of 28 is lowest.",
          correct: true,
        }
      - {
          id: c,
          text: "The wiggly curve, because its training error of zero is lowest.",
          correct: false,
          feedback: "Training error does not measure validation predictions. The wiggly curve's validation error is worst.",
        }
    solution: Choose the smooth curve because 28 is the lowest validation error. The wiggly curve's perfect training predictions do not carry over to validation houses.
  - id: ovf-perfect-not-proof
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A model matches every training house exactly. No validation predictions have been checked yet. What can
      we conclude?
    options:
      - id: a
        text: It overfits, since zero training error means it memorised noise.
        correct: false
        feedback: Exact fit alone is not proof. We need to check validation predictions too.
      - id: b
        text: It generalises well, since it has learned every training pattern.
        correct: false
        feedback: Training success alone does not tell us how validation houses will be predicted.
      - id: c
        text: Its training fit is perfect, but validation predictions still need checking.
        correct: true
    solution:
      Perfect training fit does not by itself prove either success or overfitting. Compare validation predictions
      before making that diagnosis.
  - id: ovf-robot-fit
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A robot predicts travel time. Model A has mean absolute errors of 0 minutes on training trips and 9 on
      held-out trips. Model B has errors of 3 and 4 minutes respectively. What is A doing?
    options:
      - id: a
        text: Overfitting, since its training success fails to carry over
        correct: true
        feedback: A has a large training to held-out error gap.
      - id: b
        text: Underfitting, since its held-out error is high
        correct: false
        feedback: Underfitting would also show a poor training fit.
      - id: c
        text: Fitting well, since its training error is zero
        correct: false
        feedback: Held-out trips reveal poor predictions beyond training.
      - id: d
        text: Showing high bias, since it misses held-out trips
        correct: false
        feedback: Held-out misses alone do not establish high bias; A fits its training trips exactly.
    solution:
      A fits training trips exactly but has much worse held-out error. This is evidence of overfitting, especially
      compared with B's better held-out predictions.
  - id: ovfp-validation-choice
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    params:
      v:
        min: 10
        max: 20
        step: 2
      d:
        min: 3
        max: 9
        step: 3
    prompt:
      Three house models have validation errors {{=v+d}}, {{=v}} and {{=v+2*d}} thousand dollars. Their training
      errors are 8, 6 and 0 respectively. What is the error gap of the model we should choose, in thousands of dollars?
    answer_expr: v-6
    tolerance:
      abs: 0.01
    solution:
      The second model has the lowest validation error, {{=v}}. Its error gap is ${{=v}}-6={{=v-6}}$ thousand
      dollars.
  - id: ovf-gap-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: Which pair of errors most strongly suggests overfitting when both errors are measured in the same way and units?
    options:
      - {
          id: a,
          text: "Low training error and much higher validation error.",
          correct: true,
          feedback: "The model fits training examples well, but that success does not carry over to validation examples.",
        }
      - {
          id: b,
          text: "High training error and similarly high validation error.",
          correct: false,
          feedback: "Being wrong even on training examples suggests underfitting instead.",
        }
      - {
          id: c,
          text: "Low training error and similarly low validation error.",
          correct: false,
          feedback: "Low errors on both sets suggest a good fit, not overfitting.",
        }
    solution: Low training error with much higher validation error suggests the model learned training details that do not carry over.
  - id: ovf-gap-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "The simpler model has training/validation errors 60/62. Why still prefer the smooth curve, whose rounded gap is 3 rather than 2?"
    options:
      - {
          id: a,
          text: "A larger gap means that validation predictions must be better.",
          correct: false,
          feedback: "A larger gap is not a goal; compare the validation errors themselves.",
        }
      - {
          id: b,
          text: "Its validation error is lower. A small gap can join two poor scores.",
          correct: true,
        }
      - {
          id: c,
          text: "Training error alone determines which model should win.",
          correct: false,
          feedback: "Training error measures predictions on training houses, not validation houses.",
        }
    solution: The smooth curve's validation error is 28 rather than 62. The simpler model's smaller gap only says its two high errors are close together.
  - id: ovfp-gap
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      t:
        min: 2
        max: 10
        step: 2
      g:
        min: 5
        max: 25
        step: 5
    prompt:
      A house model has training error {{=t}}, validation error {{=t+g}} and test error {{=t+g+2}} checked once
      at the end. All are mean absolute errors in thousands of dollars. What is its error gap, in those units?
    answer_expr: g
    tolerance:
      abs: 0.01
    solution:
      "Subtract training error from validation error: {{= t + g }} - {{= t }} = {{= g }} thousand dollars.
      Reversing the subtraction would give the wrong sign."
  - id: ovf-small-gap
    dimension: transfer
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The simpler model has training/validation errors of 60/62 thousand dollars. Errors below 30 would be useful for this task. What is the best reading?"
    options:
      - {
          id: a,
          text: "It fits well because the two scores differ by only 2.",
          correct: false,
          feedback: "A small gap is not enough when both errors are too high to be useful.",
        }
      - {
          id: b,
          text: "It likely underfits because even training predictions are poor.",
          correct: true,
        }
      - {
          id: c,
          text: "It likely overfits because a small gap proves excess flexibility.",
          correct: false,
          feedback: "Overfitting is suggested by low training error and much worse validation error.",
        }
    solution: Both errors are high relative to the useful level of 30, even though their gap is only 2. This suggests underfitting, not a good fit.
  - id: ovf-variance
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      A flexible house-price curve changes shape dramatically when fitted to a different sample of six training
      sales from the same market. Which idea describes that sensitivity?
    options:
      - id: a
        text: High variance
        correct: true
        feedback: Large changes across training samples indicate high variance.
      - id: b
        text: High bias
        correct: false
        feedback: Bias concerns persistent errors from the model's assumptions.
      - id: c
        text: Underfitting
        correct: false
        feedback: Sensitivity to the sample does not establish a poor training fit.
      - id: d
        text: A good fit
        correct: false
        feedback: Sensitivity alone does not show accurate held-out predictions.
    solution:
      Variance describes how much the fitted model changes when we pick different training houses. Large changes
      suggest high variance.
  - id: ovfp-gap-choice
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    params:
      t:
        min: 4
        max: 10
        step: 2
      g:
        min: 2
        max: 6
        step: 2
    prompt:
      House model A uses size and location and has training/validation errors {{=t}}/{{=t+g}}. Model B uses
      size only and has errors 2/{{=t+g+5}}. All errors are in thousands of dollars. What is the error gap of the
      model we should use for new houses?
    answer_expr: g
    tolerance:
      abs: 0.01
    solution:
      A has the lower validation error, {{=t+g}}, even though B has lower training error. A's error gap is
      ${{=t+g}}-{{=t}}={{=g}}$.
  - id: ovf-delivery-diagnosis
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A delivery-time model has mean absolute error 1 minute on training trips and 18 minutes on validation trips. Errors of 2 minutes would be useful. Which diagnosis and next comparison make sense?"
    options:
      - {
          id: a,
          text: "Underfitting; compare a model that follows training trips more closely.",
          correct: false,
          feedback: "Training error is already low; unseen trips are the problem.",
        }
      - {
          id: b,
          text: "Good fit; report only the training error as future performance.",
          correct: false,
          feedback: "Validation error is much larger and is the evidence about unseen trips.",
        }
      - {
          id: c,
          text: "Overfitting; compare a simpler model on the same validation trips.",
          correct: true,
        }
    solution: Low training error with much higher validation error suggests overfitting. A simpler model is worth comparing, but validation predictions must decide whether it helps.
  - id: ovf-bias
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A straight-line house-price model cannot follow a bend in prices. Its mistakes keep following a similar
      pattern when fitted to different training sales from the same market. Which description fits?
    options:
      - id: a
        text: High bias
        correct: true
        feedback: The rigid shape repeatedly misses the same pattern.
      - id: b
        text: High variance
        correct: false
        feedback: High variance would show large changes across training samples.
      - id: c
        text: Overfitting
        correct: false
        feedback: This line is too rigid to capture the training pattern.
      - id: d
        text: A good fit
        correct: false
        feedback: A stable mistake is still a mistake.
    solution:
      The straight line repeats the same kind of mistake because it cannot bend, illustrating high bias. Its
      poor training fit suggests underfitting.
  - id: ovf-curve-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What pattern on a learning curve suggests that continued training is starting to overfit?
    options:
      - {
          id: a,
          text: "Training and validation errors both fall toward useful levels.",
          correct: false,
          feedback: "Both sets are improving; this does not show growing harm on unseen examples.",
        }
      - {
          id: b,
          text: "Training error falls while validation error rises after its minimum.",
          correct: true,
          feedback: "Continued training improves the seen examples while harming predictions on unseen examples.",
        }
      - {
          id: c,
          text: "Training and validation errors flatten at similarly high levels.",
          correct: false,
          feedback: "Both being high and flat suggests underfitting rather than growing overfitting.",
        }
    solution: After the validation minimum, falling training error with rising validation error suggests the model is increasingly fitting training-specific details.
  - id: ovf-epoch-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Why does the worked example keep epoch 5 (training 7, validation 16) instead of epoch 10 (training 1.2, validation 31)?"
    options:
      - {
          id: a,
          text: "Epoch 5 predicts validation houses better, despite worse training error.",
          correct: true,
        }
      - {
          id: b,
          text: "Epoch 5 must always be best for every house-price model.",
          correct: false,
          feedback: "The chosen epoch depends on the observed validation curve, not a universal epoch number.",
        }
      - {
          id: c,
          text: "Epoch 10 has not yet fitted the training houses closely enough.",
          correct: false,
          feedback: "Its training error is already lower, while validation predictions are worse.",
        }
    solution: Epoch 5 has the lowest observed validation error, 16. The later version improves training fit but worsens validation predictions to 31.
  - id: ovfp-best-epoch
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      e:
        min: 2
        max: 6
        step: 1
      v:
        min: 10
        max: 18
        step: 2
    prompt:
      Saved house models at epochs {{=e-1}}, {{=e}} and {{=e+1}} have validation errors {{=v+3}}, {{=v}} and
      {{=v+5}}. Their training errors are 8, 5 and 2 respectively, all in thousands of dollars. Which saved epoch
      should we keep? Give its epoch number.
    answer_expr: e
    tolerance:
      abs: 0.01
    solution:
      Keep epoch {{= e }}, whose validation error {{= v }} is the lowest of the three. Falling training errors
      do not make the last version the best choice.
  - id: ovfp-late-gap
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      t:
        min: 1
        max: 5
        step: 1
      v:
        min: 12
        max: 20
        step: 2
      g:
        min: 6
        max: 12
        step: 3
    prompt:
      At epochs 5, 10 and 15, a house model has training errors {{=t+6}}, {{=t+3}} and {{=t}} and validation
      errors {{=v+4}}, {{=v}} and {{=v+g}} respectively. All errors are in thousands of dollars. What is the error
      gap at the epoch we should keep?
    answer_expr: v-(t+3)
    tolerance:
      abs: 0.01
    solution:
      Keep epoch 10 because it has the lowest validation error, {{=v}}. Its error gap is ${{=v}}-{{=t+3}}={{=v-(t+3)}}$
      thousand dollars.
  - id: ovf-flat-high
    dimension: transfer
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The straight line's training and validation errors have flattened near 50 and 62 thousand dollars. Errors below 30 would be useful. Extra epochs no longer help. What should we compare next?"
    options:
      - {
          id: a,
          text: "A simpler model, because the small gap proves overfitting.",
          correct: false,
          feedback: "Both errors are high, which suggests underfitting, not overfitting.",
        }
      - {
          id: b,
          text: "The unchanged model forever, because all flat curves are good.",
          correct: false,
          feedback: "Flat curves can still describe poor predictions on both sets.",
        }
      - {
          id: c,
          text: "A more flexible model, because even the training fit is poor.",
          correct: true,
        }
    solution: High, close errors that no longer improve suggest underfitting. Compare a more flexible model using validation error to see whether it helps.
  - id: ovf-still-falling
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A house model's training and validation errors are both still high but falling each epoch. What is a reasonable
      next experiment?
    options:
      - id: a
        text: Train longer while monitoring validation error for continued improvement.
        correct: true
      - id: b
        text: Stop now and keep this epoch, since training longer leads to overfitting.
        correct: false
        feedback: Validation error is still falling, so more training may help. Watch for it to turn upward.
      - id: c
        text: Switch to a simpler model, since both errors are high.
        correct: false
        feedback: Both errors are improving with training; a simpler model may make the remaining fit worse.
    solution:
      Further training may help while both errors keep falling. Monitor validation and keep the best observed
      version.
  - id: ovf-speech-curves
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A speech model's training errors at epochs 2, 4 and 6 are 20, 10 and 5. Validation errors are 24, 16 and 22, measured in the same way and units. Which saved version should we keep?"
    options:
      - {
          id: a,
          text: "Epoch 2, because the earliest version always avoids underfitting.",
          correct: false,
          feedback: "Its validation error is 24, higher than the score at epoch 4.",
        }
      - {
          id: b,
          text: "Epoch 4, because it has the lowest observed validation error.",
          correct: true,
        }
      - {
          id: c,
          text: "Epoch 6, because it has the lowest observed training error.",
          correct: false,
          feedback: "Training error falls to 5 but validation error worsens to 22.",
        }
    solution: Keep epoch 4 because validation error 16 is lowest. Between epochs 4 and 6, training improves but validation worsens, suggesting overfitting.
  - id: ovf-test-once
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: You saved a house model after choosing the epoch with lowest validation error. How should the test set be used?
    options:
      - {
          id: a,
          text: "Score every epoch on test and replace the validation choice with the test winner.",
          correct: false,
          feedback: "That uses test data to make a choice and loses its final independent scoring role.",
        }
      - {
          id: b,
          text: "Add test houses to training before scoring the selected model on those same houses.",
          correct: false,
          feedback: "The final test score must measure predictions on houses that did not train the model.",
        }
      - {
          id: c,
          text: "Score the chosen model once on test after all training choices are finished.",
          correct: true,
        }
    solution: Keep test data out of fitting and model selection, then score the final choice once. Validation, not test, chooses the stopping epoch.
  - id: ovf-explain-diagnosis
    dimension: transfer
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "A straight line's training and validation errors are $50$ and $62$; a wiggly curve's are $0$ and $93$. All errors are in thousands of dollars, and errors below $30$ would be useful. Explain each model's likely problem and one change you would test for the wiggly curve."
    rubric:
      - id: diagnoses
        criterion:
          Identify likely underfitting because the straight line's training error of $50$ exceeds the useful-error
          target of $30$.
        weight: 1
        required: true
      - id: overfit
        criterion: Identify likely overfitting because the wiggly curve has training error $0$ and validation error $93$.
        weight: 1
        required: true
      - id: overfit-change
        criterion: Propose testing a simpler model, more training data or earlier stopping for the overfitting curve.
        weight: 1
        required: true
    exemplar: "The straight line likely underfits because even its training error of $50$ is too high to be useful. The wiggly curve likely overfits because training error is $0$ while validation error is $93$. I would test a simpler model for the wiggly curve."
    solution: "The straight line likely underfits because even its training error of $50$ is too high to be useful. The wiggly curve likely overfits because training error is $0$ while validation error is $93$. I would test a simpler model for the wiggly curve."
  - id: ovf-recall-flexibility-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: ovf-flexibility
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what are underfitting and overfitting?"
    rubric:
      - id: point0
        criterion: "Explain that underfitting means missing useful patterns even in training data."
        weight: 1
        required: true
      - id: point1
        criterion: "Explain that overfitting means following training details that do not carry over to new examples."
        weight: 1
        required: true
    exemplar: "Underfitting means missing useful patterns even in training data. Overfitting means following training details that do not carry over to new examples."
  - id: ovf-recall-flexibility-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: ovf-flexibility
    difficulty: 1
    est_minutes: 0.5
    prompt: "A very flexible curve fits every training house exactly and predicts prices poorly on a separate set of houses. What is the most likely explanation?"
    options:
      - id: a
        text: "The curve was too stiff to follow the main price trend."
        correct: false
        feedback: "Underfitting leaves useful patterns unexplained even on training houses. This curve fits every training house."
      - id: b
        text: "The curve followed price quirks specific to the training houses."
        correct: true
        feedback: "An overfit curve can match every training price and still miss new ones."
      - id: c
        text: "The curve found a price trend that carries over to new houses."
        correct: false
        feedback: "A trend that carries over should improve predictions on the separate houses."
    solution: "A very flexible model can follow quirks in the training prices, making its predictions worse on new houses."
  - id: ovf-recall-flexibility-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: ovf-flexibility
    difficulty: 1
    est_minutes: 0.5
