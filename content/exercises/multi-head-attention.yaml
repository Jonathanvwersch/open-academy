  - id: mha-recall-combine-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: mha-combine
    difficulty: 1
    est_minutes: 0.5
    prompt: "Which operation joins $h$ width-$d_k$ head outputs into one width-$d$ vector before applying $W_O$?"
    options:
      - id: a
        text: "Average the outputs"
        correct: false
        feedback: "Averaging keeps width $d_k$ and uses the same mixture for every entry."
      - id: b
        text: "Concatenate the outputs"
        correct: true
        feedback: "Concatenation writes all head entries side by side, giving width $hd_k=d$."
      - id: c
        text: "Add the outputs"
        correct: false
        feedback: "Adding equal-width outputs keeps width $d_k$, leaving too few entries for $W_O$."
    solution: "Concatenation restores width $d$ before the output matrix mixes the entries."
  - id: mha-recall-combine-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: mha-combine
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the missing learned matrix: $o_t=\\operatorname{concat}(o_t^{(1)},\\dots,o_t^{(h)})\\,\\underline{\\quad}$."
    accept: ["W_O", "W_O.", "W_{O}", "WO", "W O", "$W_O$", "output matrix", "the output matrix"]
    regex: "^\\s*\\$?\\s*w\\s*(?:_\\s*\\{?\\s*o\\s*\\}?|o)\\s*\\$?\\s*$"
    solution: "The joined row vector is multiplied by the learned output matrix $W_O$."
