    prompt: "A model uses embedding width $d$ and $h$ equal-width heads, with $d$ divisible by $h$. Write the head width $d_k$."
    answer: "d/h"
    variables: { "d": { "values": [8, 64, 512] }, "h": { "values": [1, 2, 4, 8] } }
    solution: "Each head has width $d_k=d/h$."
