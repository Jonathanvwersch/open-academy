  - id: mha-recall-heads-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: mha-heads
    difficulty: 1
    est_minutes: 0.5
    prompt: "A head has width $d_k$ inside a model with embedding width $d$. Which entries of an embedding can its query matrix use?"
    options:
      - id: a
        text: "All $d$ embedding entries"
        correct: true
        feedback: "A head's query matrix has shape $d\\times d_k$, so each query entry can use the whole embedding."
      - id: b
        text: "Only its own $d_k$ embedding entries"
        correct: false
        feedback: "$d_k$ is the width of the query it makes. Each column of the $d\\times d_k$ query matrix uses all $d$ entries of the embedding."
      - id: c
        text: "All entries of a source key"
        correct: false
        feedback: "Keys come from the key matrix and are compared with the query later. The query matrix reads only the token's own embedding."
    solution: "Each head transforms the whole width-$d$ embedding into a width-$d_k$ query."
  - id: mha-recall-heads-formula
    dimension: math
