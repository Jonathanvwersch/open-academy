concept: loss-functions
exercises:
  - id: loss-measure-misses-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is a loss?"
    options:
      - {
          id: a,
          text: "A signed prediction-minus-target difference that lets errors in opposite directions cancel.",
          correct: false,
          feedback: "Signed errors can cancel, so they are not a non-negative loss.",
        }
      - {
          id: b,
          text: "A learned parameter that shifts every model prediction by the same fixed amount.",
          correct: false,
          feedback: "That is the bias.",
        }
      - {
          id: c,
          text: "A ranking of models made by people judging their predictions by eye.",
          correct: false,
          feedback: "A loss is computed from the errors themselves, not from human judgement.",
        }
      - {
          id: d,
          text: "A non-negative score that grows as a prediction moves farther from its target.",
          correct: true,
          feedback: "A prediction farther from its target receives a larger non-negative error score.",
        }
    solution: "A loss is a non-negative score for how far a model's prediction is from the true price."
  - id: loss-large-errors-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "How does squared loss treat a large miss compared with absolute loss?"
    options:
      - {
          id: a,
          text: "Squared loss and absolute loss both add the same amount for each extra error unit.",
          correct: false,
          feedback: "Squared loss grows faster as the miss gets larger.",
        }
      - {
          id: b,
          text: "Squared loss makes large misses count more than absolute loss does.",
          correct: true,
          feedback: "Squaring makes the penalty grow faster as a miss grows, unlike absolute loss.",
        }
      - {
          id: c,
          text: "Squared loss takes the absolute value, while absolute loss squares the miss.",
          correct: false,
          feedback: "Those definitions are reversed.",
        }
      - {
          id: d,
          text: "Squared loss and absolute loss stay unchanged as prediction errors grow.",
          correct: false,
          feedback: "Both losses increase as prediction error grows.",
        }
    solution: "Squared loss makes large misses count disproportionately more, while absolute loss increases at a constant rate."
  - id: loss-constant-choice-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is a baseline model?"
    options:
      - {
          id: a,
          text: "A simple reference for judging whether a more detailed model is useful.",
          correct: true,
          feedback: "A simple baseline provides a reference score for judging whether added model detail helps.",
        }
      - {
          id: b,
          text: "A model that always predicts the training example's exact target.",
          correct: false,
          feedback: "That describes memorising training data.",
        }
      - {
          id: c,
          text: "A model that predicts a different price for every feature.",
          correct: false,
          feedback: "A baseline is deliberately simple; a constant baseline predicts one value for every example.",
        }
      - {
          id: d,
          text: "The most detailed model you can train, used as the final answer.",
          correct: false,
          feedback: "A baseline is the simple model a detailed one has to beat, not the final model.",
        }
    solution: "A baseline is a simple model used to check whether a more detailed house-price model is useful."
  - id: loss-check-mse
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "Predictions $(1, 3, 5)$, targets $(2, 3, 3)$. Compute the MSE."
    answer: 1.6667
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer: 5,
          category: misunderstood_definition,
          feedback: "That is the *sum* of squared errors. Divide by $n = 3$.",
        }
      - {
          answer: 1,
          category: misunderstood_definition,
          feedback: "That is the MAE. MSE squares the errors.",
        }
    hints: ["Errors are $(-1, 0, 2)$."]
    solution: "$(1 + 0 + 4)/3 \\approx 1.667$."
  - id: dx-ml-2
    dimension: math
    type: numeric
    role: diagnostic
    difficulty: 1
    est_minutes: 2
    prompt: "Predictions $(2, 4, 6)$, targets $(1, 4, 8)$. What is the mean squared error? (2 decimal places)"
    answer: 1.6667
    tolerance: { abs: 0.01 }
    common_wrong:
      - {
          answer: 5,
          category: misunderstood_definition,
          feedback: "That is the sum of squared errors, not the mean.",
        }
      - {
          answer: 1,
          category: misunderstood_definition,
          feedback: "That is the mean *absolute* error.",
        }
    solution: "Errors $(1, 0, -2)$, squared $(1, 0, 4)$, mean $5/3 \\approx 1.67$."
  - id: loss-mae
    dimension: math
    type: numeric
    role: core
    difficulty: 1
    est_minutes: 2
    prompt: "Predictions $(10, 12, 9, 20)$, targets $(11, 12, 7, 14)$. Compute the MAE."
    answer: 2.25
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer: 10.25,
          tolerance: { abs: 0.005 },
          category: misunderstood_definition,
          feedback: "That is the MSE.",
        }
    solution: "$|−1| + 0 + 2 + 6 = 9$, and $9/4 = 2.25$."
  - id: loss-outlier
    dimension: conceptual
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "Your training labels contain a few wildly wrong values (sensor glitches). You fit a linear model with MSE and the fit is pulled noticeably toward those points. What is the best explanation and the simplest fix?"
    options:
      - {
          id: a,
          text: "Squaring makes those few large residuals dominate the loss and its gradient; use MAE or a Huber loss, or clean the labels",
          correct: true,
        }
      - {
          id: b,
          text: "MSE ignores large errors; switch to a loss that squares them",
          correct: false,
          category: misunderstood_definition,
          feedback: "MSE does not ignore large errors: squaring gives them more influence. Think about whether a robust loss should reduce or amplify the effect of extreme residuals.",
        }
      - {
          id: c,
          text: "The model needs more training steps",
          correct: false,
          category: misapplied_technique,
          feedback: "More steps only get closer to the same MSE minimum, and the few large residuals still pull that minimum toward them.",
        }
    solution: "MSE's gradient grows with the error, so outliers pull hard. MAE or Huber caps that influence."
  - id: loss-review-grad
    dimension: math
    type: expression
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "For one example, $\\ell(\\hat y) = (\\hat y - y)^2$. Give $d\\ell/d\\hat y$ in terms of `yhat` and `y`."
    answer: "2*(yhat - y)"
    variables: { yhat: [-3, 3], y: [-3, 3] }
    solution: "$2(\\hat y - y)$."
  - id: loss-transfer-median
    dimension: transfer
    type: mc
    role: transfer
    difficulty: 3
    est_minutes: 3
    prompt: "A delivery robot's travel times on one route are usually 10 min but occasionally 60 min (blocked doors). You must predict one number for that route. Which loss gives the 'typical' value, and which is pulled toward the rare long trips?"
    options:
      - {
          id: a,
          text: "MAE gives the median (≈10); MSE gives the mean, pulled toward 60",
          correct: true,
        }
      - {
          id: b,
          text: "MSE gives the median; MAE gives the mean",
          correct: false,
          category: misunderstood_definition,
          feedback: "A rare 60-minute trip has much more leverage under a squared penalty than under an absolute one. Ask which statistic minimizes each penalty when you must choose a single value.",
        }
      - {
          id: c,
          text: "Both give the same constant",
          correct: false,
          category: incorrect_reasoning,
          feedback: "They do not generally give the same constant: a squared penalty gives an unusually long trip more influence than an absolute penalty. Consider how the two losses weigh the outlier.",
        }
    hints:
      [
        "What single number minimises the sum of squared deviations? The sum of absolute deviations?",
      ]
    solution: "The constant minimising MSE is the mean; the one minimising MAE is the median. A skewed distribution separates them."
  - id: lossp-why-not-count
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why not just count wrong house-price predictions instead of using MSE or MAE to guide small improvements?
    options:
      - id: a
        text: Almost every price is inexact, so the count hides improvements and has no useful slope
        correct: true
      - id: b
        text: Counting wrong predictions lets positive and negative errors cancel
        correct: false
        category: incorrect_reasoning
        feedback: Counts are nonnegative, so cancellation is not the problem. A smaller miss still counts as wrong.
      - id: c
        text: Counting wrong predictions penalises large misses more strongly than MSE
        correct: false
        category: incorrect_reasoning
        feedback: The count gives a tiny miss and a huge miss the same penalty; MSE distinguishes their sizes.
    solution: Reducing an error from 20 to 10 still leaves one wrong prediction. MSE and MAE decrease, but the count stays flat until exact equality, giving no useful slope for small improvements.
  - id: lossp-mse-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Two house-price errors are {{=a}} and −{{=b}} thousand pounds. What is their MSE? Give the
      number in squared thousands of pounds.
    params:
      a:
        min: 1
        max: 6
        step: 1
      b:
        min: 2
        max: 8
        step: 1
    answer_expr: (a^2+b^2)/2
    tolerance:
      abs: 0.001
    solution:
      "Square both errors, add them, and divide by 2: ({{=a}}² + {{=b}}²)/2 = {{=(a^2+b^2)/2}}.
      Squaring stops their signs cancelling."
    common_wrong:
      - answer_expr: a^2+b^2
        category: math_error
        feedback: That is the total squared error; divide by the two sales.
  - id: lossp-mae-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Two house-price errors are −{{=a}} and {{=b}} thousand pounds. What is their MAE in
      thousands of pounds?
    params:
      a:
        min: 1
        max: 9
        step: 1
      b:
        min: 2
        max: 10
        step: 1
    answer_expr: (a+b)/2
    tolerance:
      abs: 0.001
    solution:
      Their absolute errors are {{=a}} and {{=b}}, so MAE = ({{=a}} + {{=b}})/2 = {{=(a+b)/2}}.
      Both misses count positively.
    common_wrong:
      - answer_expr: (b-a)/2
        category: math_error
        feedback: That averages signed errors; remove each sign before averaging.
  - id: lossp-cancellation
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      A price model misses one house by +20 and another by −20. What does their signed average of
      zero tell you?
    options:
      - id: a
        text: The errors cancel, but both prices are wrong
        correct: true
      - id: b
        text: The model has zero loss under squared error
        correct: false
        category: incorrect_reasoning
        feedback: Each squared error is 400, so MSE is 400 rather than zero.
      - id: c
        text: The model has zero loss under absolute error
        correct: false
        category: incorrect_reasoning
        feedback: Each absolute error is 20, so MAE is 20 rather than zero.
    solution:
      A signed average measures the balance of over- and under-predictions, not their distances
      from the targets.
  - id: lossp-repeat
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      You duplicate every row of a house-sales dataset without changing predictions. What happens
      to MSE?
    options:
      - id: a
        text: It stays the same because total and count both double
        correct: true
      - id: b
        text: It doubles because every squared error appears twice
        correct: false
        category: incorrect_reasoning
        feedback: The count in the denominator also doubles.
      - id: c
        text: It halves because the dataset has twice as many rows
        correct: false
        category: incorrect_reasoning
        feedback: The total squared error doubles along with the count.
    solution:
      A mean divides by the number of rows, so repeating identical evidence changes the total
      but not the average.
  - id: lossp-units
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Prices are recorded in thousands of pounds. Which units describe the two losses?
    options:
      - id: a
        text: "MAE: thousands of pounds; MSE: squared thousands of pounds"
        correct: true
      - id: b
        text: "MAE: squared thousands of pounds; MSE: thousands of pounds"
        correct: false
        category: incorrect_reasoning
        feedback: MAE does not square the errors, but MSE does.
      - id: c
        text: "Both: thousands of pounds, because both use a mean"
        correct: false
        category: incorrect_reasoning
        feedback: Taking a mean preserves the units after squaring; it does not undo the square.
    solution:
      Absolute values preserve price units, whereas squaring changes them, so an MSE of 100 and
      an MAE of 10 cannot be compared as if they were the same measure.
  - id: lossp-outlier
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      One house has an error of 9; another has an error of 1, in the same price units. How much
      larger is the first contribution?
    options:
      - id: a
        text: 81 times for MSE; 9 times for MAE
        correct: true
      - id: b
        text: 9 times for MSE; 81 times for MAE
        correct: false
        category: incorrect_reasoning
        feedback: "MSE squares the errors, not MAE: 9²/1² = 81."
      - id: c
        text: 9 times for both losses after taking the mean
        correct: false
        category: incorrect_reasoning
        feedback: Both contributions are divided by the same count, so their ratio still depends on squaring.
    solution:
      "The common averaging factor cancels in the comparison: squared errors are 81 and 1, while
      absolute errors are 9 and 1."
  - id: lossp-slope-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      For one house, the prediction is {{=y+r}} and the actual price is {{=y}}, in thousands of
      pounds. What is the derivative of its squared error with respect to its prediction?
    params:
      y:
        min: 280
        max: 340
        step: 10
      r:
        min: -8
        max: -2
        step: 2
    answer_expr: 2*r
    tolerance:
      abs: 0.001
    solution:
      The error is {{=y+r}} − {{=y}} = {{=r}}. The squared-error derivative is twice the error,
      giving {{=2*r}}.
    common_wrong:
      - answer_expr: r
        category: math_error
        feedback: The derivative of a square includes the factor 2.
  - id: lossp-why-square
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Why does the squared-error slope tell you more than the absolute-error slope about how far a prediction is from its target?
    options:
      - id: a
        text: Its slope is twice the error, so it fades to zero at the target and grows for large misses
        correct: true
      - id: b
        text: Its slope always has size 1, regardless of the miss
        correct: false
        category: misunderstood_definition
        feedback: A fixed slope size of 1 describes absolute error away from zero, not squared error.
      - id: c
        text: Squaring caps the slope, so a huge miss pulls no harder than a small one
        correct: false
        category: incorrect_reasoning
        feedback: Squared-error slopes grow with the error without a cap. It is absolute error whose slope size stays fixed.
    solution: For an individual error e, the squared-error slope is 2e. Errors 9, 1 and 0.1 give slopes 18, 2 and 0.2, so the slope's size tracks the miss. Absolute error gives a slope of size 1 for all three.
  - id: lossp-mae-slope
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: A house is underpriced by 9 thousand pounds. What is the derivative of its individual
      absolute error with respect to the prediction?
    options:
      - id: a
        text: −1, because raising the prediction reduces the distance
        correct: true
      - id: b
        text: +1, because absolute error is always positive
        correct: false
        category: incorrect_reasoning
        feedback: The loss is positive, but its slope is negative below the target.
      - id: c
        text: −18, because twice the error gives the slope
        correct: false
        category: incorrect_reasoning
        feedback: Twice the error is the squared-error derivative, not the absolute-error derivative.
    solution:
      Below the target, raising the prediction by one unit removes one unit of absolute error,
      so the derivative is −1.
  - id: lossp-corner
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: At an exactly correct prediction, what happens to the absolute-error curve?
    options:
      - id: a
        text: It has a corner, so its ordinary derivative is undefined
        correct: true
      - id: b
        text: It has a smooth bottom with derivative exactly zero
        correct: false
        category: incorrect_reasoning
        feedback: The left slope is −1 and the right slope is +1, so there is no single ordinary derivative.
      - id: c
        text: It has derivative +1 because absolute values are positive
        correct: false
        category: incorrect_reasoning
        feedback: The right slope is +1, but the left slope differs.
    solution:
      Just below the target the slope is −1 and just above it is +1, so the curve has a corner
      there and no single slope.
  - id: lossp-sensor
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A robot distance sensor has a few incorrectly recorded targets far from all other values.
      Why might MAE be useful while you investigate?
    options:
      - id: a
        text: Large errors have less influence, but bad labels still need checking
        correct: true
      - id: b
        text: Large errors disappear entirely, so the labels need no checking
        correct: false
        category: incorrect_reasoning
        feedback: MAE still charges for every unit of error; it does not remove the bad records.
      - id: c
        text: Large errors get squared, so they matter more than before
        correct: false
        category: incorrect_reasoning
        feedback: Squaring is MSE; MAE uses absolute distance and a constant-magnitude slope.
    solution:
      MAE limits how much the slope grows with an extreme error, but the incorrect labels still
      provide misleading targets.
  - id: lossp-why-median
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Why does the median price 300 minimise MAE for sales at 290, 300 and 560 thousand pounds, rather than the mean of about 383.33?
    options:
      - id: a
        text: Moving away from 300 increases distances to two prices while reducing distance to only one
        correct: true
      - id: b
        text: The largest error has the steepest absolute-error slope, so it balances the two smaller errors
        correct: false
        category: incorrect_reasoning
        feedback: Absolute-error slopes have equal size away from zero. Larger errors get steeper slopes under squared error instead.
      - id: c
        text: MAE ignores the sale at 560 entirely because it is far from the others
        correct: false
        category: incorrect_reasoning
        feedback: The sale at 560 still contributes its full absolute distance. MAE limits its slope size; it does not discard it.
    solution: From 300, a small move upwards increases distances to 290 and 300 and decreases only the distance to 560. A small move downwards increases distances to 300 and 560 and decreases only the distance to 290. Each move raises the total, and continuing farther cannot reverse that increase. Dividing by three preserves the minimum.
  - id: lossp-mean-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Three house prices, in tens of thousands of pounds, are {{=a}}, {{=a+3}} and {{=a+18}}. What
      constant minimises MSE?
    params:
      a:
        min: 20
        max: 35
        step: 1
    answer_expr: a+7
    tolerance:
      abs: 0.001
    solution:
      Add the targets to get {{=3*a+21}}, then divide by 3 to get {{=a+7}}. The mean minimises
      squared error.
    common_wrong:
      - answer_expr: a+3
        category: math_error
        feedback: That is the median, which minimises MAE rather than MSE.
  - id: lossp-median-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      Three house prices, in tens of thousands of pounds, are {{=a}}, {{=a+3}} and {{=a+18}}. What
      constant minimises MAE?
    params:
      a:
        min: 20
        max: 35
        step: 1
    answer_expr: a+3
    tolerance:
      abs: 0.001
    solution:
      The ordered middle price is {{=a+3}}. Moving away from it increases two distances while
      reducing only one, so it minimises MAE.
    common_wrong:
      - answer_expr: a+7
        category: math_error
        feedback: That is the mean, which minimises MSE rather than MAE.
  - id: lossp-extreme-sale
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: The prices are 290, 300 and 560. Only the last changes, to 900. What happens to the best
      constant under each loss?
    options:
      - id: a
        text: The MSE choice rises; the MAE choice stays at 300
        correct: true
      - id: b
        text: Both choices rise by the same amount
        correct: false
        category: incorrect_reasoning
        feedback: The median remains the same middle sale even though the mean increases.
      - id: c
        text: The MAE choice rises; the MSE choice stays fixed
        correct: false
        category: incorrect_reasoning
        feedback: It is the mean, not the median, that is pulled by the changed extreme value.
    solution:
      The total price rises, moving the mean; the ordered middle value remains 300, so the MAE
      choice is unchanged.
  - id: lossp-even
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: Four sale prices are 280, 300, 320 and 600. Which constants minimise MAE?
    options:
      - id: a
        text: Every value from 300 to 320, including both ends
        correct: true
      - id: b
        text: Only 375, the mean of all four sale prices
        correct: false
        category: incorrect_reasoning
        feedback:
          The mean minimises MSE; for MAE, the whole interval between the middle values minimises
          the total distance.
      - id: c
        text: Only 280, the smallest of the four sale prices
        correct: false
        category: incorrect_reasoning
        feedback: Moving up towards the middle reduces more distances than it increases.
    solution:
      Between 300 and 320, moving the prediction changes two distances up and two down by equal
      amounts, leaving the total unchanged.
  - id: lossp-route
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A robot takes 10, 10 and 60 minutes on three recorded trips. Which constant is less pulled
      by the one long trip?
    options:
      - id: a
        text: The MAE choice of 10 minutes, the median
        correct: true
      - id: b
        text: The MSE choice of about 26.67 minutes, the mean
        correct: false
        category: incorrect_reasoning
        feedback: The mean includes all 60 minutes in the total and is pulled upwards.
      - id: c
        text: Both choices are equally pulled towards 60 minutes
        correct: false
        category: incorrect_reasoning
        feedback: The middle value stays at 10 even with the long trip.
    solution: The median remains at the typical short trip, while the mean is (10 + 10 + 60)/3, so
      squared error favours a larger constant.
  - id: lossp-measure-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example the errors are $+3$, $+3$ and $-6$. MAE is $4$, yet MSE is $18$ rather than $4^2=16$. Why?"
    options:
      - id: a
        text: "Squaring each error before averaging lets the $-6$ count as $36$ of the total $54$, though it is only half the total size."
        correct: true
        feedback: "MSE squares first and averages second, so the one large miss gets extra weight."
      - id: b
        text: "MSE divides the total by a different count than MAE, so the two averages always differ."
        correct: false
        category: misunderstood_definition
        feedback: "Both divide by the same count, 3. The difference comes from what is averaged."
      - id: c
        text: "The signed errors cancel under MAE but not under MSE, so MSE keeps more of the total."
        correct: false
        category: incorrect_reasoning
        feedback: "Neither loss lets errors cancel: MAE drops the signs and MSE squares them."
      - id: d
        text: "Squaring always adds a little extra, so MSE beats MAE squared by a fixed amount for any errors."
        correct: false
        category: incorrect_reasoning
        feedback: "For errors $4$, $4$, $4$, MSE is $16$, exactly MAE squared. The gap comes from the errors being unequal."
    solution: "MSE squares each error first: $(9+9+36)/3=18$. Squaring the average size instead gives $4^2=16$ and loses the extra weight on the large $-6$ miss."
  - id: lossp-mae-backwards
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "Two predictions have an MAE of $5$. One error is $-2$ and the other error is positive. What is the positive error?"
    answer: 8
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: 12
        category: misunderstood_definition
        feedback: "That treats $-2$ as signed. MAE uses its size, $2$."
      - answer: 3
        category: math_error
        feedback: "MAE is an average: the two sizes must add to $2\\times5=10$."
    solution: "The two sizes must add to $2\\times5=10$. The first size is $|-2|=2$, so the positive error is $10-2=8$."
  - id: lossp-large-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In step 4 of the worked example, raising the third prediction by $0.1$ lowers its squared error by about $1.2$ but its absolute error by only $0.1$. Why the difference?"
    options:
      - id: a
        text: "At an error of $-6$ the squared-error slope is $2e=-12$, while the absolute-error slope is $-1$."
        correct: true
        feedback: "Change is about slope times nudge: $-12\\times0.1$ against $-1\\times0.1$."
      - id: b
        text: "Absolute error only changes in whole steps, so a nudge of $0.1$ barely registers."
        correct: false
        category: misunderstood_definition
        feedback: "Absolute error changes smoothly away from 0: it fell by exactly $0.1$, from $6$ to $5.9$."
      - id: c
        text: "Squaring makes the nudge itself twelve times bigger before it changes the error."
        correct: false
        category: incorrect_reasoning
        feedback: "The nudge changes the error by $0.1$ under both losses; what differs is how steeply each cost changes per unit of error."
      - id: d
        text: "Absolute error has a corner at an error of $-6$, so its slope there is undefined."
        correct: false
        category: incorrect_reasoning
        feedback: "The corner is at an error of $0$. At $-6$ the absolute-error slope is $-1$."
    solution: "For a small nudge, change is about slope times nudge. The squared-error slope at $-6$ is $-12$, giving about $-1.2$; the absolute-error slope is $-1$, giving $-0.1$."
  - id: lossp-constant-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In step 3 of the worked example, for the values $1$, $2$ and $6$, why does the total absolute error rise for every $c$ between $2$ and $6$?"
    options:
      - id: a
        text: "Two values lie below $c$ and one above, so the slopes add to $(+1)+(+1)+(-1)=+1$."
        correct: true
        feedback: "Each value pulls with size 1, so the slope is the count below $c$ minus the count above."
      - id: b
        text: "Most of that range lies above the mean $3$, and the total always rises above the mean."
        correct: false
        category: incorrect_reasoning
        feedback: "The mean is where squared error is lowest. Absolute error depends on how many values lie on each side of $c$."
      - id: c
        text: "The value $6$ is far from $c$, so its pull outweighs the two nearby values."
        correct: false
        category: incorrect_reasoning
        feedback: "Under absolute error every value pulls with size 1, however far away it is."
      - id: d
        text: "Total absolute error always rises as $c$ gets larger, whatever the values are."
        correct: false
        category: incorrect_reasoning
        feedback: "Between $1$ and $2$ the slope is $-1$, so the total falls there."
    solution: "Between 2 and 6, raising $c$ moves it further from 1 and 2 and closer to 6. Two distances grow and one shrinks, so the slope is $+1$ and the total rises."
  - id: loss-explain-choice
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: Your house-price model has many small errors and a few very large ones. Explain how you
      would compute and choose between MSE and MAE, how their slopes treat the large errors, and
      which constant baseline each would choose.
    rubric:
      - id: r1
        criterion:
          Computes MSE by averaging squares and MAE by averaging absolute errors, preventing
          cancellation
        weight: 1
        required: true
      - id: r2
        criterion:
          Explains that squared-error slopes grow with the error while absolute-error slopes have
          constant magnitude away from zero, and relates this to outliers
        weight: 1
        required: true
      - id: r3
        criterion:
          Chooses the mean for a constant MSE baseline and a median for MAE, with a reason tied to
          the cost of mistakes
        weight: 1
        required: true
    exemplar:
      I subtract each actual price from its prediction, then average either the squared errors
      for MSE or their absolute values for MAE; opposite misses cannot cancel. Squared-error slopes
      are twice the errors, whereas absolute-error slopes have magnitude 1 away from zero, so large
      misses pull harder under MSE. I would use MSE if large misses deserve a much bigger penalty
      and MAE if typical absolute distance matters more; the constant baselines are the mean and a
      median respectively.
