concept: pytorch-basics
exercises:
  - id: ptb-tensors-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does a tensor's shape describe?"
    options:
      - {
          id: a,
          text: "The size of each dimension of its array.",
          correct: true,
          feedback: "Shape records the arrangement, such as rows and columns.",
        }
      - {
          id: b,
          text: "The numerical value of each of its entries.",
          correct: false,
          feedback: "Values can change without changing the array's shape.",
        }
      - {
          id: c,
          text: "The kind of number it stores, such as decimals.",
          correct: false,
          feedback: "That is the data type, not the shape.",
        }
      - {
          id: d,
          text: "The derivative of each of its entries.",
          correct: false,
          feedback: "Gradients are calculated separately; shape describes sizes.",
        }
    solution: "Shape lists dimension sizes, so `(2, 1)` means two rows and one column."
  - id: ptb-tensors-why
    lesson_only: true
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked example, what changes if `[[1.0], [2.0]]` is replaced by `[1.0, 2.0]`?
    options:
      - id: a
        text: The shape changes from `(2, 1)` to `(2,)`, removing the explicit input-column axis.
        correct: true
        feedback: Nested rows create a second axis; the flat list has only one.
      - id: b
        text: The shape changes from `(2, 1)` to `(1, 2)`, making one row with two inputs.
        correct: false
        feedback: A flat list has shape `(2,)`; a one-row table would need `[[1.0, 2.0]]`.
      - id: c
        text: The shape stays `(2, 1)`, since the two stored values have not changed.
        correct: false
        feedback: Equal values and equal entry counts can have different shapes.
      - id: d
        text: The shape changes from `(1, 2)` to `(2,)`, removing the example-row axis.
        correct: false
        feedback: The nested table starts with two rows and one column, so its shape is `(2, 1)`.
    solution:
      The nested version has two axes, with two rows and one column. Removing the inner lists
      produces shape `(2,)`, so the explicit column axis is lost.
  - id: ptb-tensor-complete
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Fill the blank with PyTorch's default floating-point type."
    code: |
      import torch
      x = torch.tensor([[1.0], [2.0]], dtype=____)
      print(x.dtype)
    accept: ["torch.float32", "torch.float"]
    solution: "`torch.float32` specifies floating-point numbers, suitable for the calculations and gradients used here."
  - id: ptb-tensor-template
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      x:
        min: 2
        max: 4
      w:
        min: 2
        max: 3
    prompt:
      Tensor `x` is `[[{{= x }}.0, 2.0]]` and tensor `w` is `[[{{= w }}.0], [-1.0]]`. What number
      does `(x @ w).item()` return?
    answer_expr: x*w-2
    tolerance:
      abs: 1.0e-06
    solution:
      "Matrix multiplication pairs each row entry with its matching weight and adds the products:
      ${{= x }}({{= w }})+2(-1)={{= x*w-2 }}$. The result has one entry, which `.item()` extracts."
  - id: ptb-tensor-nesting
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Which tensor represents two examples with one input each?"
    options:
      - {
          id: a,
          text: "`torch.tensor([[3.0, 4.0]])` makes the required table.",
          correct: false,
          feedback: "This has one row and two columns: one example with two inputs.",
        }
      - {
          id: b,
          text: "`torch.tensor([3.0, 4.0])` makes the required table.",
          correct: false,
          feedback: "This is a plain list of shape `(2,)`, not a two-row table.",
        }
      - {
          id: c,
          text: "`torch.tensor([[3.0], [4.0]])` makes the required table.",
          correct: true,
          feedback: "Each inner list holds the one input of one example.",
        }
      - {
          id: d,
          text: "`torch.tensor([[3.0]])` makes the required table.",
          correct: false,
          feedback: "This table contains only one example, not two.",
        }
    solution: "Two inner lists create two rows, and one value in each creates one column."
  - id: ptb-tensor-read
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "What number does this matrix multiplication print?"
    code: |
      import torch
      x = torch.tensor([[2.0, 3.0]])
      w = torch.tensor([[4.0], [2.0]])
      print((x @ w).item())
    answer: 14
    tolerance: { abs: 0.000001 }
    solution: |
      Pair each row entry with its matching weight, then add the contributions.

      $$2(4)+3(2)=14.$$

      The result contains one number, so `.item()` can extract it.
  - id: ptb-tensor-transfer
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "Two examples with two inputs each form `[[1.0, 2.0], [3.0, 4.0]]`. Multiply this input table by the weight table `[[2.0], [-1.0]]`. What number is in the second output row?"
    answer: 2
    tolerance: { abs: 0.000001 }
    solution: |
      Pair the second row with the weights.

      $$3(2)+4(-1)=2.$$

      The first row is a separate example and does not enter this result.
  - id: ptb-linear-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does a PyTorch linear module provide?"
    options:
      - {
          id: a,
          text: "A prediction rule whose weights and biases training adjusts.",
          correct: true,
          feedback: "The rule computes outputs and exposes its parameters for training.",
        }
      - {
          id: b,
          text: "A training dataset with recorded inputs and targets.",
          correct: false,
          feedback: "A module uses data; it does not supply the training examples.",
        }
      - {
          id: c,
          text: "A loss rule with squared errors and their average.",
          correct: false,
          feedback: "A linear module predicts outputs rather than scoring errors.",
        }
      - {
          id: d,
          text: "An update rule with gradients and a learning rate.",
          correct: false,
          feedback: "An update changes parameters; Linear only computes predictions.",
        }
    solution: "A linear module packages weighted sums and biases with the trainable tensors that implement them."
  - id: ptb-linear-why
    lesson_only: true
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why does the worked example set the weight and bias inside `torch.no_grad()`?"
    options:
      - {
          id: a,
          text: "To set starting values without PyTorch recording the edits for slopes.",
          correct: true,
          feedback: "The assignments set known starting values without recording their slopes.",
        }
      - {
          id: b,
          text: "To stop the model from treating its weight and bias as parameters.",
          correct: false,
          feedback: "They remain parameters that the optimiser can train after the setup block.",
        }
      - {
          id: c,
          text: "To make the layer choose different parameters for every input row.",
          correct: false,
          feedback: "Every row uses the same parameters, regardless of this block.",
        }
      - {
          id: d,
          text: "To keep future predictions from depending on the weight and bias.",
          correct: false,
          feedback: "Future calls still use the parameters and can track their gradients.",
        }
    solution: "The block sets known weight and bias values without recording the setup for slope calculations. Later model calls outside it can still calculate slopes for training."
  - id: ptb-linear-complete
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Create a linear module with one input and one output per example."
    code: |
      import torch
      from torch import nn
      model = ____
      print(tuple(model(torch.tensor([[1.0], [2.0]])).shape))
    accept:
      [
        "nn.Linear(1, 1)",
        "torch.nn.Linear(1, 1)",
        "nn.Linear(in_features=1, out_features=1)",
        "torch.nn.Linear(in_features=1, out_features=1)",
      ]
    solution: "The arguments specify one input and one output per example, so two input rows give an output of shape `(2, 1)`."
  - id: ptb-linear-template
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      x:
        min: 1
        max: 4
      w:
        min: 1
        max: 3
      b:
        min: 0
        max: 2
    prompt:
      A one-input linear module has weight {{= w }}, bias {{= b }} and input {{= x }}. What output
      does the module produce?
    answer_expr: w * x + b
    tolerance:
      abs: 1.0e-06
    solution: |
      The same linear rule multiplies the input by its weight, then adds the bias.

      $${{= w }}({{= x }})+{{= b }}={{= w * x + b }}.$$
  - id: ptb-linear-sizes
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "What do the arguments in `nn.Linear(2, 1)` mean?"
    options:
      - {
          id: a,
          text: "Two inputs and one output for each example.",
          correct: true,
          feedback: "They specify input and output counts, not parameter values.",
        }
      - {
          id: b,
          text: "Two input rows and one output for the whole table.",
          correct: false,
          feedback: "The row count comes from the input table, not the constructor.",
        }
      - {
          id: c,
          text: "Two as every weight and one as the shared bias.",
          correct: false,
          feedback: "Initial parameters are random; the arguments are sizes.",
        }
      - {
          id: d,
          text: "Two outputs and one input for each example.",
          correct: false,
          feedback: "The input size comes first and the output size second.",
        }
    solution: "`nn.Linear` takes the input count followed by the output count per example. It uses the same weight and bias values for every row."
  - id: ptb-linear-read
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "What number does the configured module print?"
    code: |
      import torch
      from torch import nn
      model = nn.Linear(1, 1)
      with torch.no_grad():
          model.weight.fill_(3.0)
          model.bias.fill_(-1.0)
      print(model(torch.tensor([[2.0]])).item())
    answer: 5
    tolerance: { abs: 0.000001 }
    solution: |
      Apply the assigned weight, then add the bias.

      $$3(2)-1=5.$$

      The constructor's sizes do not replace the explicitly assigned parameters.
  - id: ptb-linear-transfer
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A two-input linear module has weight row `[3.0, -1.0]`. For input row `[2.0, 4.0]` it must output $8$. What bias must you set?"
    answer: 6
    tolerance: { abs: 0.000001 }
    solution: |
      Find the weighted sum, then the bias needed to reach the desired output.

      $$3(2)-1(4)=2.$$

      $$8-2=6.$$

      The module adds this bias once to the row's total.
  - id: ptb-loss-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "Which operation changes parameter values using stored gradients?"
    options:
      - {
          id: a,
          text: "`loss.backward()`, since it works out the slopes.",
          correct: false,
          feedback: "Backward stores gradients but does not change parameter values.",
        }
      - {
          id: b,
          text: "`optimizer.step()`, since it reads the stored slopes.",
          correct: true,
          feedback: "It reads the stored gradients and applies the configured update rule.",
        }
      - {
          id: c,
          text: "`loss.item()`, since it reads the loss value.",
          correct: false,
          feedback: "Item only extracts a number from a single-entry tensor.",
        }
      - {
          id: d,
          text: "`model.parameters()`, since it lists the parameters.",
          correct: false,
          feedback: "This provides parameter tensors; it does not change them.",
        }
    solution: "An optimiser step changes parameters using gradients that backward has already stored."
  - id: ptb-loss-why
    lesson_only: true
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked update, what does `loss.backward()` supply for `optimizer.step()`?
    options:
      - id: a
        text: It stores the current loss gradients in the parameters' `.grad` fields.
        correct: true
        feedback: Step reads the gradients that backward calculated for the current loss.
      - id: b
        text: It updates the parameters, leaving step to calculate their new gradients.
        correct: false
        feedback: Backward calculates gradients; step uses them to change parameters.
      - id: c
        text: It clears the previous gradients, leaving step to calculate fresh ones.
        correct: false
        feedback: "`zero_grad()` clears gradients, and backward calculates and adds the fresh ones."
      - id: d
        text: It converts the loss to a number, leaving step to differentiate that number.
        correct: false
        feedback: Step reads `.grad`; extracting a Python number with `.item()` does not provide gradients.
    solution:
      Backward calculates the current loss gradients and stores them in `.grad`. The optimiser
      step then reads those gradients to update the parameters.
  - id: ptb-loss-complete
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Fill the blank with the mean squared error module."
    code: |
      import torch
      from torch import nn
      loss_fn = ____
      print(loss_fn(torch.tensor([1.0, 3.0]), torch.tensor([3.0, 3.0])).item())
    accept: ["nn.MSELoss()", "torch.nn.MSELoss()"]
    solution: |
      MSELoss averages the squared differences rather than returning their sum.

      $$(1-3)^2=4.$$

      $$(3-3)^2=0.$$

      $$\frac{4+0}{2}=2.$$
  - id: ptb-loss-template
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      w: { min: 1, max: 4 }
      t: { min: 5, max: 8 }
    prompt: "A parameter has value ${{= w }}$ and target ${{= t }}$. The squared-error slope stored in `.grad` is ${{= 2 * (w - t) }}$. With SGD learning rate $0.25$, what value does `optimizer.step()` produce?"
    answer_expr: "w - 0.25 * 2 * (w - t)"
    tolerance: { abs: 0.000001 }
    solution: |
      SGD subtracts the scaled gradient from the current value.

      $${{= w }}-0.25({{= 2 * (w - t) }})={{= w - 0.25 * 2 * (w - t) }}.$$
  - id: ptb-loss-backward
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A parameter starts at $2$ and `loss.backward()` stores slope $-4$ in `.grad`. Before any `optimizer.step()` call, what is the parameter value?"
    options:
      - {
          id: a,
          text: "It is still 2, because backward only stored a slope.",
          correct: true,
          feedback: "No update has run, so the parameter value is unchanged.",
        }
      - {
          id: b,
          text: "It is now -4, because backward replaced it with its slope.",
          correct: false,
          feedback: "The slope is stored separately in `.grad`, not in the parameter value.",
        }
      - {
          id: c,
          text: "It is now 3, because backward used learning rate 0.25.",
          correct: false,
          feedback: "Only the optimiser applies the learning rate and changes the value.",
        }
      - {
          id: d,
          text: "It is now 4, because backward copied over the target.",
          correct: false,
          feedback: "Backward calculates slopes; it does not copy targets into parameters.",
        }
    solution: "The value remains $2$ while its `.grad` contains $-4$. Backward stores the slope; only the optimiser step changes the parameter."
  - id: ptb-loss-read
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "What mean squared error does this print?"
    code: |
      import torch
      from torch import nn
      prediction = torch.tensor([[1.0], [5.0]])
      target = torch.tensor([[3.0], [1.0]])
      print(nn.MSELoss()(prediction, target).item())
    answer: 10
    tolerance: { abs: 0.000001 }
    solution: |
      Calculate both squared differences, then average them rather than adding them alone.

      $$(1-3)^2=4.$$

      $$(5-1)^2=16.$$

      $$\frac{4+16}{2}=10.$$
  - id: ptb-loss-transfer
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A parameter has value $5$ and target $1$. Use squared error and one SGD step with learning rate $0.125$. What is the new parameter value?"
    answer: 4
    tolerance: { abs: 0.000001 }
    solution: |
      Find the slope, then subtract the scaled gradient to move towards the target.

      $$2(5-1)=8.$$

      $$0.125(8)=1.$$

      $$5-1=4.$$
  - id: ptb-loop-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "Which sequence is a complete fresh PyTorch training update?"
    options:
      - {
          id: a,
          text: "Clear gradients, predict, measure loss, run backward, then step.",
          correct: true,
          feedback: "The step can use freshly calculated gradients from the current predictions.",
        }
      - {
          id: b,
          text: "Clear gradients, predict, measure loss, take a step, then backward.",
          correct: false,
          feedback: "The step runs before the current gradients have been calculated.",
        }
      - {
          id: c,
          text: "Predict, measure loss, run backward, clear gradients, then step.",
          correct: false,
          feedback: "This clears the new gradients before the step can use them.",
        }
      - {
          id: d,
          text: "Predict, measure loss, take a step, clear gradients, then backward.",
          correct: false,
          feedback: "The update lacks current gradients, and backward happens too late.",
        }
    solution: "Clear old gradients first, then calculate predictions, loss and gradients before applying the update."
  - id: ptb-loop-why
    lesson_only: true
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: The worked loop ends with `model(x)` inside `torch.no_grad()` to measure `new_loss`. Why
      are fresh predictions needed?
    options:
      - id: a
        text:
          The saved predictions use earlier parameters, so the final parameters need a new forward
          pass.
        correct: true
        feedback: Changing parameters does not recalculate existing prediction tensors.
      - id: b
        text: The saved predictions are current, but `no_grad()` must convert them into Python numbers.
        correct: false
        feedback: "`no_grad()` pauses gradient recording; `.item()` extracts a number."
      - id: c
        text:
          The saved predictions update with the parameters, but the loss must be given the targets
          again.
        correct: false
        feedback:
          Existing predictions keep their old values, so passing them to the loss again would
          still use old outputs.
      - id: d
        text:
          The saved predictions update only after `zero_grad()`, which the new forward pass calls
          internally.
        correct: false
        feedback:
          A forward pass neither clears gradients nor refreshes earlier tensors; it calculates
          new predictions.
    solution:
      The last stored predictions were calculated before the final update. A new forward pass
      uses the final parameters, allowing the new loss to measure that model.
  - id: ptb-loop-complete
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Fill the blank to clear gradients before calculating this update."
    code: |
      import torch
      from torch import nn
      model = nn.Linear(1, 1)
      with torch.no_grad():
          model.weight.fill_(1.0)
          model.bias.zero_()
      optimizer = torch.optim.SGD(model.parameters(), lr=0.125)
      ____
      loss = nn.MSELoss()(model(torch.tensor([[1.0]])), torch.tensor([[3.0]]))
      loss.backward()
      optimizer.step()
      print(model(torch.tensor([[1.0]])).item())
    accept:
      [
        "optimizer.zero_grad()",
        "optimizer.zero_grad(set_to_none=True)",
        "model.zero_grad()",
        "model.zero_grad(set_to_none=True)",
      ]
    solution: "`zero_grad()` clears any stored gradients, so this update uses only the current loss gradient. The new prediction is 2."
  - id: ptb-loop-template
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    params:
      w: { min: 0, max: 2 }
      t: { min: 3, max: 5 }
    prompt: "A one-input model starts with weight {{= w }}, bias 0, input 1 and target {{= t }}. Both parameter gradients are {{= 2 * (w - t) }}. One fresh SGD step uses learning rate 0.125. What is the new prediction, including the updated bias?"
    answer_expr: "w - 0.5 * (w - t)"
    tolerance: { abs: 0.000001 }
    solution: |
      Both weight and bias subtract the same scaled slope; with input 1, both changes enter the new prediction.

      $$\text{weight change}=-0.125({{= 2 * (w - t) }}).$$

      $$\text{bias change}=-0.125({{= 2 * (w - t) }}).$$

      $$\text{new prediction}={{= w }}-0.5({{= w }}-{{= t }})={{= w - 0.5 * (w - t) }}.$$
  - id: ptb-loop-stale
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The first backward call stores weight gradient -4. The next fresh calculation gives gradient -2, but you omit `zero_grad()`. What gradient is stored now?"
    options:
      - {
          id: a,
          text: "It is -6, because the new gradient is added to the old one.",
          correct: true,
          feedback: "Backward accumulates: -4 plus -2 gives -6.",
        }
      - {
          id: b,
          text: "It is -2, because the new gradient replaces the old one.",
          correct: false,
          feedback: "Replacement requires clearing first; backward adds rather than replaces.",
        }
      - {
          id: c,
          text: "It is -4, because the first gradient remains unchanged.",
          correct: false,
          feedback: "The second backward call adds its new contribution.",
        }
      - {
          id: d,
          text: "It is 0, because the optimiser step cleared the old one.",
          correct: false,
          feedback: "Step changes parameters but does not clear their stored gradients.",
        }
    solution: |
      Without clearing, backward adds the new slope to the stored value.

      $$-4+(-2)=-6.$$

      That is not the current model's slope -2.
  - id: ptb-loop-read
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "What number is printed: the loss before the update or a freshly measured loss?"
    code: |
      import torch
      from torch import nn
      model = nn.Linear(1, 1)
      with torch.no_grad():
          model.weight.fill_(1.0)
          model.bias.zero_()
      optimizer = torch.optim.SGD(model.parameters(), lr=0.125)
      optimizer.zero_grad()
      loss = nn.MSELoss()(model(torch.tensor([[1.0]])), torch.tensor([[3.0]]))
      loss.backward()
      optimizer.step()
      print(loss.item())
    answer: 4
    tolerance: { abs: 0.000001 }
    solution: |
      The printed loss was measured before the step.

      $$(1-3)^2=4.$$

      Step changed the parameters, but this loss tensor was not recomputed.
  - id: ptb-loop-transfer
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 4
    prompt: "A linear model has weight $0$ and bias $0$. Train once on input $2$ and target $4$ using squared error and SGD learning rate $0.125$, updating both parameters. What is the fresh loss after the step?"
    answer: 1
    tolerance: { abs: 0.000001 }
    hints:
      [
        "The starting error is -4, so the weight slope is -16 and the bias slope is -8.",
        "Update both parameters before making another prediction.",
      ]
    solution: |
      Update both parameters, then calculate a fresh prediction and squared error.

      $$w_{\text{new}}=0-0.125(-16)=2.$$

      $$b_{\text{new}}=0-0.125(-8)=1.$$

      $$\hat y_{\text{new}}=2(2)+1=5.$$

      $$(5-4)^2=1.$$

      The fresh loss is 1, not the original loss 16.
  - id: ptb-explain-loop
    dimension: implementation
    type: explain
    role: core
    difficulty: 3
    est_minutes: 5
    prompt: "Assume a PyTorch model, loss and optimiser are already created. Explain one update's call order, the different jobs of backward and step, and why gradients must be cleared between updates."
    rubric:
      - id: order
        criterion: Repeat clearing gradients, predicting, measuring loss, calling backward and stepping, in that order.
        weight: 1
        required: true
      - id: roles
        criterion: Explain that `loss.backward()` stores slopes in `.grad` and `optimizer.step()` updates parameters.
        weight: 1
        required: true
      - id: clearing
        criterion: Explain that backward adds to stored slopes, so clearing prevents accumulation across updates.
        weight: 1
        required: true
    exemplar: "Clear gradients with `optimizer.zero_grad()`, compute predictions and loss, call `loss.backward()`, then call `optimizer.step()`. Backward stores slopes in `.grad`, and step uses them to change parameters. Clearing prevents backward from adding the new slopes to slopes left by an earlier update."
