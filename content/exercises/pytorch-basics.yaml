  - id: ptb-loop-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: "What is a PyTorch training step?"
    options:
      - id: a
        text: "A second backward call that leaves the model parameters unchanged."
