  - id: ptb-linear-forward
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "After setting the known house weights and bias, what price does this model predict, in thousands of pounds?"
    code: |
      import torch
      from torch import nn

      model = nn.Linear(3, 1)
      with torch.no_grad():
          model.weight.copy_(torch.tensor([[25.0, 10.0, -1.0]]))
          model.bias.zero_()
      house = torch.tensor([[12.0, 3.0, 20.0]])
      print(model(house).item())
    answer: 310
    tolerance: { abs: 0.001 }
    solution: "The model calculates $25(12)+10(3)-20+0=310$. `nn.Linear` applies the same weighted sum and bias as the house model."
  - id: ptb-loss-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: "What is a loss function in this PyTorch model?"
    options:
      - id: a
        text: "A calculation that compares predictions with targets and scores their errors."
        correct: true
        feedback: "Correct. The loss is a numerical score for how far predictions are from their targets."
      - id: b
        text: "A collection of house inputs stored in one tensor."
        correct: false
        category: misunderstood_definition
        feedback: "A tensor can store inputs; a loss function compares predictions with targets."
      - id: c
        text: "A parameter update that changes weights before gradients are calculated."
        correct: false
        category: misunderstood_definition
        feedback: "An optimiser updates parameters; the loss scores current predictions against targets."
      - id: d
        text: "A shape conversion that turns three features into one output."
        correct: false
        category: misunderstood_definition
        feedback: "The linear layer maps features to an output; the loss measures the output's error."
    solution: "A loss function gives a numerical score to the mismatch between a model's prediction and the target price."
  - id: ptb-loss-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Why does `nn.MSELoss()` return 400 for a prediction of 310 and a target of 330?"
    options:
      - id: a
        text: "It subtracts the prediction from the target but does not square the result."
        correct: false
        category: math_error
        feedback: "The absolute difference is 20; MSE squares the error to get 400."
      - id: b
        text: "It adds the target and prediction, then divides by two."
        correct: false
        category: misunderstood_definition
        feedback: "MSE does not average the two prices; it averages their squared differences."
      - id: c
        text: "The single output's error is −20, and squaring it gives 400."
        correct: true
        feedback: "Correct. With one output, the mean squared error is just the squared difference."
      - id: d
        text: "It counts the two model parameters and multiplies them by 200."
        correct: false
        category: misunderstood_definition
        feedback: "MSE depends on prediction and target values, not on how many parameters the model has."
    solution: "The error is $310-330=-20$. `nn.MSELoss()` squares it, and with one output the mean is $(-20)^2=400$."
