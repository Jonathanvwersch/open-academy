        category: misunderstood_definition
        feedback: "A training step includes an update to the model parameters after gradients are calculated."
      - id: b
        text: "A sequence that predicts, measures loss, calculates gradients and updates parameters."
        correct: true
        feedback: "Correct. A training step connects the forward calculation, loss, backward calculation and parameter update."
      - id: c
        text: "A list of input rows and target prices without any model calculation."
        correct: false
        category: misunderstood_definition
        feedback: "That describes training data; a training step uses the data to calculate and update the model."
      - id: d
        text: "A conversion that changes every input tensor to a new data type."
        correct: false
        category: misunderstood_definition
        feedback: "Changing data type is a tensor operation, not a training step."
    solution: "A training step uses current parameters to predict and measure loss, calculates gradients, then updates the parameters once."
  - id: ptb-loop-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "What goes wrong if `optimizer.zero_grad()` is omitted between training-loop iterations?"
    options:
      - id: a
        text: "The model can no longer calculate a forward prediction."
        correct: false
        category: incorrect_reasoning
        feedback: "The forward pass still works; the problem is that old gradients remain stored."
      - id: b
        text: "SGD stops referring to the model's weights and bias."
        correct: false
        category: misunderstood_definition
        feedback: "The optimiser still holds the model parameters; it will use the accumulated gradients."
      - id: c
        text: "The loss changes from mean squared error to absolute error."
        correct: false
        category: misunderstood_definition
        feedback: "The loss function is unchanged; omitting zero_grad affects the gradients used for updates."
      - id: d
        text: "Each backward call adds new gradients to old ones, so updates use accumulated gradients."
        correct: true
        feedback: "Correct. PyTorch accumulates gradients, so clear them before calculating the next update."
    solution: "`backward()` adds to stored gradients. Without `zero_grad()`, later SGD updates use old and new gradient contributions together."
