  - id: ptb-loop-debug
    dimension: implementation
    type: debug
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "The training step runs without an exception, but the model does not use the current loss gradient for its update. Which line is wrong, and what fixes it?"
    code: |
      import torch
      from torch import nn

      features = torch.tensor([[12.0, 3.0, 20.0]])
      target = torch.tensor([[330.0]])
      model = nn.Linear(3, 1)
      loss_fn = nn.MSELoss()
      optimizer = torch.optim.SGD(model.parameters(), lr=0.0001)

      optimizer.zero_grad()
      prediction = model(features)
      loss = loss_fn(prediction, target)
      optimizer.step()
      loss.backward()
    buggy_line: 13
    fix_options:
      - id: a
        text: "Move `optimizer.zero_grad()` to after the forward pass."
        correct: false
        feedback: "Clearing after the forward pass would still happen before backward, but it would not fix the optimiser stepping before gradients are calculated."
      - id: b
        text: "Increase the learning rate so the optimiser uses a larger update."
        correct: false
        feedback: "The step runs before the current gradients exist, so changing the learning rate cannot make it use them."
      - id: c
        text: "Swap lines 13 and 14 so `loss.backward()` runs before `optimizer.step()`."
        correct: true
        feedback: "Correct. Backward must fill the gradients before the optimiser step reads them."
      - id: d
        text: "Replace `loss.backward()` with `loss.detach()`."
        correct: false
        feedback: "Detaching the loss cuts off gradient tracking instead of calculating gradients."
    solution: "`optimizer.step()` reads the stored gradients, but line 13 runs before `loss.backward()` has calculated them. Swap those lines so backward fills the gradients first."
  - id: ptb-loop-read
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "Starting from the known house weights, what loss does the code print after one SGD update?"
    code: |
      import torch
      from torch import nn

      features = torch.tensor([[12.0, 3.0, 20.0]])
      target = torch.tensor([[330.0]])
      model = nn.Linear(3, 1)
      with torch.no_grad():
          model.weight.copy_(torch.tensor([[25.0, 10.0, -1.0]]))
          model.bias.zero_()
      loss_fn = nn.MSELoss()
      optimizer = torch.optim.SGD(model.parameters(), lr=0.0001)
      optimizer.zero_grad()
      prediction = model(features)
      loss = loss_fn(prediction, target)
      loss.backward()
      optimizer.step()
      print(round(loss_fn(model(features), target).item(), 3))
    answer: 316.271
    tolerance: { abs: 0.002 }
    solution: "The starting loss is 400 and the gradient update changes the weights to about $(25.048,10.012,-0.92)$ and the bias to $0.004$. The updated prediction is about 312.216, so the new loss is about 316.271."
  - id: ptb-explain-loop
    dimension: implementation
    type: explain
    role: core
    difficulty: 2
    est_minutes: 5
    prompt: "Explain the five steps in a PyTorch training loop for the house-price model, what each line does, and what goes wrong if `optimizer.zero_grad()` is omitted."
    rubric:
      - {
          id: order,
          criterion: "Gives the order zero_grad, forward prediction, loss, backward, optimizer step",
          weight: 1,
          required: true,
        }
      - {
          id: roles,
          criterion: "Explains that the forward pass predicts, the loss scores error, backward calculates gradients and the optimiser updates parameters",
          weight: 1,
          required: true,
        }
      - {
          id: accumulation,
          criterion: "Explains that gradients accumulate unless cleared, so omitting zero_grad makes later updates use old and new gradients",
          weight: 1,
          required: true,
        }
    exemplar: "First, optimizer.zero_grad() clears gradients left from the previous update. The model then predicts the house price, and nn.MSELoss compares that prediction with the target. loss.backward() calculates gradients for the model's weights and bias. Finally, optimizer.step() uses those gradients to update the parameters. If I omit zero_grad, backward adds each new gradient to the stored one, so later updates use accumulated gradients rather than only the current loss gradient."
