concept: pytorch-basics
exercises:
  - id: ptb-tensor-recover-input
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A robot's floating-point sensor row is `(r, 3)` and its weight vector is `(2, -1)`. With no bias, `features @ weights` returns 13. What value of `r` was in the sensor row?"
    hints:
      - "Write the two weighted contributions, then solve for the missing sensor value."
    solution: |
      The tensor multiplication pairs each sensor value with its weight:

      $$2r + (-1) \times 3 = 13$$

      Undo the known contribution:

      $$2r = 13 + 3 = 16$$

      Divide by the first weight:

      $$r = \frac{16}{2} = 8$$

      Substituting 8 gives $2 \times 8 - 3 = 13$, as required.
    answer: 8
    tolerance: { abs: 0.000001 }
    common_wrong:
      - {
          answer: 5,
          category: math_error,
          feedback: "The second contribution is −3, so add 3 to the output before dividing by 2.",
        }
  - id: ptb-linear-robot-forward
    dimension: transfer
    type: code_read
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A robot controller combines two sensor readings using a linear module. What command value does this code print?"
    code: |
      import torch
      from torch import nn

      model = nn.Linear(2, 1)
      with torch.no_grad():
          model.weight.copy_(torch.tensor([[2.0, -1.0]]))
          model.bias.copy_(torch.tensor([0.5]))
      sensors = torch.tensor([[3.0, 1.0]])
      print(model(sensors).item())
    answer: 5.5
    tolerance: { abs: 0.000001 }
    solution: |
      Calculate each weighted sensor contribution:

      $$2 \times 3 = 6$$

      $$(-1) \times 1 = -1$$

      Sum the contributions, then add the module's bias:

      $$6 - 1 = 5$$

      $$5 + 0.5 = 5.5$$

      The module returns one command for the one sensor row.
  - id: ptb-loss-robot-batch
    dimension: transfer
    type: code_read
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A robot predicts its distance from a wall for two sensor readings. What mean squared error does this code print?"
    code: |
      import torch
      from torch import nn

      prediction = torch.tensor([[2.0], [5.0]])
      target = torch.tensor([[4.0], [4.0]])
      loss = nn.MSELoss()(prediction, target)
      print(loss.item())
    answer: 2.5
    tolerance: { abs: 0.000001 }
    solution: |
      Compute each prediction's error and square it:

      $$2 - 4 = -2$$

      $$(-2)^2 = 4$$

      $$5 - 4 = 1$$

      $$1^2 = 1$$

      MSE takes the mean across both squared errors:

      $$\frac{4 + 1}{2} = 2.5$$
  - id: ptb-tensors-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: "What is a tensor?"
    options:
      - id: a
        text: "A named Python variable that must contain exactly one number."
        correct: false
        category: misunderstood_definition
        feedback: "A tensor can contain many numbers arranged across one or more dimensions."
      - id: b
        text: "A two-dimensional table that cannot represent a single number or vector."
        correct: false
        category: misunderstood_definition
        feedback: "A tensor can have one or more dimensions, including a scalar or a vector."
      - id: c
        text: "An array of numbers that can have one or more dimensions."
        correct: true
        feedback: "Correct. Tensors store numbers in shapes such as scalars, vectors, matrices and higher-dimensional arrays."
      - id: d
        text: "A function that updates the model parameters using gradients."
        correct: false
        category: misunderstood_definition
        feedback: "An optimiser updates parameters; a tensor is an array of numerical values."
    solution: "A tensor is PyTorch's array of numerical values, and its shape describes how those values are arranged."
  - id: ptb-tensor-numeric
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Use house features `(12, 3, 20)` and weights `(25, 10, -1)`. What prediction does `features @ weights` make, in thousands of pounds?"
    answer: 310
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 330,
          category: math_error,
          feedback: "That leaves out the age contribution. Add $-1 \\times 20=-20$ to the area and bedroom contributions.",
        }
      - {
          answer: 300,
          category: math_error,
          feedback: "That includes the area contribution only. Add the bedroom contribution $10 \\times 3=30$ and the age contribution $-20$.",
        }
    solution: "The weighted contributions are $25(12)=300$, $10(3)=30$ and $(-1)(20)=-20$. Their sum is 310 thousand pounds."
  - id: ptb-tensors-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why use a floating-point data type for the house measurements and weights?"
    options:
      - id: a
        text: "It lets tensor arithmetic represent decimal values used in price calculations."
        correct: true
        feedback: "Correct. Floating-point values can represent the non-integer weights and predictions used by the model."
      - id: b
        text: "It changes a tensor's shape so each input becomes a separate row."
        correct: false
        category: misunderstood_definition
        feedback: "Shape describes the arrangement of values; the data type describes how each value is represented."
      - id: c
        text: "It automatically sets `requires_grad=True` on every number."
        correct: false
        category: misunderstood_definition
        feedback: "The data type and gradient tracking are separate settings; use `requires_grad=True` to request tracking."
      - id: d
        text: "It tells PyTorch which house feature has the largest effect."
        correct: false
        category: incorrect_reasoning
        feedback: "Feature effects come from the weights, not from the data type."
    solution: "The data type controls numerical representation, not shape, gradient tracking or feature importance. Floating point can represent the decimal weights used in price calculations."
  - id: ptb-tensor-shape
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "What does this code print?"
    code: |
      import torch

      features = torch.tensor([[12.0, 3.0, 20.0]], dtype=torch.float32)
      print(tuple(features.shape), features.dtype)
    accept: ["(1, 3) torch.float32"]
    solution: "There is one row with three feature values, so the shape is `(1, 3)`. The tensor stores them as 32-bit floating-point values."
  - id: ptb-tensor-matmul
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "What predictions does this tensor multiplication return, in thousands of pounds?"
    code: |
      import torch

      houses = torch.tensor([[12.0, 3.0, 20.0], [8.0, 2.0, 5.0]])
      weights = torch.tensor([25.0, 10.0, -1.0])
      print((houses @ weights).tolist())
    accept: ["[310.0, 215.0]"]
    solution: "The first row gives $25(12)+10(3)-20=310$, and the second gives $25(8)+10(2)-5=215$. Each row is multiplied by the same weight vector."
  - id: ptb-requires-grad
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Complete the tensor creation so PyTorch tracks operations that depend on `weight`."
    code: |
      import torch

      weight = torch.tensor(25.0, ____)
      contribution = weight * 12.0
      print(weight.requires_grad, contribution.item())
    accept: ["requires_grad=True", "requires_grad = True"]
    solution: "`requires_grad=True` asks PyTorch to track operations that depend on `weight`. The contribution is still 300."
  - id: ptb-linear-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: "What is `nn.Linear(3, 1)`?"
    options:
      - id: a
        text: "A layer that accepts one feature and returns three outputs."
        correct: false
        category: misunderstood_definition
        feedback: "The arguments are input features first and output features second, so this layer maps three inputs to one output."
      - id: b
        text: "A layer with no parameters that only changes the input data type."
        correct: false
        category: misunderstood_definition
        feedback: "The linear layer has trainable weights and a bias; it computes an output from the input features."
      - id: c
        text: "A layer that creates three independent output rows from one input."
        correct: false
        category: misunderstood_definition
        feedback: "The first argument is the number of input features, not the number of output rows."
      - id: d
        text: "A layer with three input weights and one output per input row."
        correct: true
        feedback: "Correct. `nn.Linear(3, 1)` uses three input features to compute one output for each row."
    solution: "The first argument sets the input feature count and the second sets the output feature count. The layer stores a weight and bias for its linear calculation."
  - id: ptb-linear-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why must each house row passed to `nn.Linear(3, 1)` contain three feature values?"
    options:
      - id: a
        text: "The layer needs three rows so it can calculate its single bias."
        correct: false
        category: misunderstood_definition
        feedback: "The first argument counts features in each row; the bias is a separate learned parameter."
      - id: b
        text: "Its three input weights match area, bedrooms and age in that fixed order."
        correct: true
        feedback: "Correct. Each input column pairs with one of the layer's three weights."
      - id: c
        text: "PyTorch uses the three values as three separate output prices."
        correct: false
        category: misunderstood_definition
        feedback: "The output feature count is one, so the layer returns one price for each input row."
      - id: d
        text: "Three features are needed because the layer has three bias values."
        correct: false
        category: misunderstood_definition
        feedback: "A layer with one output has one bias value; the three inputs match its three weights."
    solution: "Each input column is paired with a weight, so the three columns represent area, bedrooms and age. The layer then returns one price per row."
  - id: ptb-linear-shape
