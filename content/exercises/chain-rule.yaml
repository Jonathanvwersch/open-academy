concept: chain-rule
exercises:
  - id: lab-gc-inner-factor
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: 'For $f(x,y)=(x+2y)^4$, find $\partial f/\partial y$ at $(1,0)$.'
    answer: 8
    tolerance: { abs: 0.001 }
    hints: ["Track how the inner expression changes when y changes."]
    solution: "The outer derivative is $4(x+2y)^3$ and the inner partial is $2$. Their product at $(1,0)$ is $8$."
  - id: cr-rates-multiply-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "The in-between value $u$ changes $3$ times as fast as $x$, and $y$ changes $2$ times as fast as $u$. How fast does $y$ change compared with $x$?"
    options:
      - id: a
        text: "$5$ times as fast, because the two rates add."
        correct: false
        feedback: "The second step scales the already-tripled change, so the rates multiply, not add."
      - id: b
        text: "$6$ times as fast, because the rates multiply."
        correct: true
        feedback: 'A nudge is tripled, then doubled: $2\times3=6$.'
      - id: c
        text: "$1.5$ times as fast, because you divide the first rate by the second."
        correct: false
        feedback: "Nothing is divided; each step scales the nudge it receives."
      - id: d
        text: "$2$ times as fast, because only the last step reaches $y$."
        correct: false
        feedback: "The last step only sees what the first step passes on, which is already tripled."
    solution: 'Rates along a chain multiply: $\frac{dy}{dx}=\frac{dy}{du}\cdot\frac{du}{dx}=2\times3=6$.'
  - id: cr-nested-formulas-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "How do you differentiate $f(g(x))$, a formula $g$ inside a formula $f$?"
    options:
      - id: a
        text: "Differentiate $f$, evaluate it at $g(x)$, and multiply by $g'(x)$."
        correct: true
        feedback: "That is the chain rule: outer rate at the inner value, times the inner rate."
      - id: b
        text: "Differentiate $f$ and evaluate it at $g(x)$; nothing else is needed."
        correct: false
        feedback: "That is only the outer rate. The inside changes at its own rate $g'(x)$ too."
      - id: c
        text: "Add $f'(x)$ and $g'(x)$."
        correct: false
        feedback: "Rates along a chain multiply, and the outer rate must be taken at $g(x)$, not $x$."
      - id: d
        text: "Multiply $f'(x)$ by $g'(x)$, both evaluated at $x$."
        correct: false
        feedback: "$f$ never receives $x$; it receives $g(x)$, so $f'$ is evaluated there."
    solution: '$(f\circ g)''(x)=f''(g(x))\cdot g''(x)$.'
  - id: cr-two-routes-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "The output $f$ depends on $u$ and $v$, and both $u$ and $v$ depend on $x$. How do you find $df/dx$?"
    options:
      - id: a
        text: "Use only the route through $u$, because $u$ comes first."
        correct: false
        feedback: "Nudging $x$ moves $v$ as well, so the route through $v$ also changes $f$."
      - id: b
        text: "Multiply the rates along each route, then add the routes."
        correct: true
        feedback: "Each route gives one product of rates, and both contributions happen at once."
      - id: c
        text: "Multiply all four rates together."
        correct: false
        feedback: "The routes are separate paths, not one long chain, so their products are added."
      - id: d
        text: "Add all four rates together."
        correct: false
        feedback: "Within one route the rates multiply; only the route totals are added."
    solution: '$\frac{df}{dx}=\frac{\partial f}{\partial u}\cdot\frac{du}{dx}+\frac{\partial f}{\partial v}\cdot\frac{dv}{dx}$.'
  - id: cr-check-1
    dimension: math
    type: expression
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "Differentiate $y = (2x - 5)^3$."
    answer: "6*(2*x-5)^2"
    variables: { x: [-3, 3] }
    common_wrong:
      - {
          answer: "3*(2*x-5)^2",
          category: misunderstood_definition,
          feedback: "You forgot to multiply by the inner derivative, $d(2x-5)/dx = 2$.",
        }
    hints: ["Let $u = 2x - 5$. Then $dy/du = 3u^2$."]
    solution: "$3(2x-5)^2 \\cdot 2 = 6(2x-5)^2$."
  - id: dx-math-5
    dimension: math
    type: expression
    role: diagnostic
    difficulty: 2
    est_minutes: 2
    prompt: "Differentiate $f(x) = e^{x^2}$. Use `exp(...)` and `*` for multiplication."
    answer: "2*x*exp(x^2)"
    variables: { x: [-2, 2] }
    common_wrong:
      - {
          answer: "exp(x^2)",
          category: misunderstood_definition,
          feedback: "Multiply by the inner derivative, $2x$.",
        }
      - {
          answer: "exp(2*x)",
          category: misunderstood_definition,
          feedback: "Evaluate the outer derivative at the inner value $x^2$, then multiply by $2x$.",
        }
    solution: "The outer exponential keeps its value $e^{x^2}$. Multiply by the inner derivative $2x$ to get $2x e^{x^2}$."
  - id: cr-exp
    dimension: math
    type: expression
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "Differentiate $f(x) = e^{-x^2/2}$ (write `exp(...)`)."
    answer: "-x*exp(-x^2/2)"
    variables: { x: [-2, 2] }
    hints: ["Inner function $u = -x^2/2$, with $du/dx = -x$."]
    solution: "$e^{-x^2/2}\\cdot(-x)$."
  - id: cr-sigmoid
    dimension: math
    type: numeric
    role: core
    difficulty: 3
    est_minutes: 3
    prompt: "Let $s = g(wx + b)$, where $g'(0) = 0.25$. At $w = 0$, $b = 0$, and $x = 4$, what is $\\partial s/\\partial w$?"
    answer: 1
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 0.25,
          tolerance: { abs: 0.001 },
          category: math_error,
          feedback: "That is just the outer rate $g'(0)$. You still need the inner derivative $\\partial z/\\partial w = x = 4$.",
        }
    hints:
      [
        "The input to $g$ is $z = wx + b = 0$.",
        "Use $g'(0) = 0.25$, then multiply by $\\partial z/\\partial w$.",
      ]
    solution: "$0.25 \\cdot 4 = 1$."
  - id: cr-two-paths
    dimension: math
    type: expression
    role: review
    difficulty: 3
    est_minutes: 3
    prompt: "Let $L = u + uv$, where $u = 2x$ and $v = x^2$. Changing $x$ changes $L$ through both $u$ and $v$. Use the chain rule to find $dL/dx$, counting both effects."
    answer: "2 + 6*x^2"
    variables: { x: [-2, 2] }
    hints:
      [
        "$\\partial L/\\partial u = 1 + v$ and $\\partial L/\\partial v = u$.",
        "$du/dx = 2$ and $dv/dx = 2x$.",
      ]
    solution: "$(1+v)\\cdot2 + u\\cdot 2x = 2 + 2x^2 + 4x^2 = 2 + 6x^2$. Check: $L = 2x + 2x^3$."
  - id: cr-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "A journey's distance depends on driving time, and fuel use depends on distance. Explain in 2–4 sentences how the chain rule combines those rates. Then explain how to combine the effects if an extra kilometre adds both fuel costs and driver wages."
    rubric:
      - {
          id: r1,
          criterion: "Explain multiplying kilometres per hour by litres per kilometre to find litres per hour.",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Explain adding the extra fuel cost and extra wages caused by an extra kilometre to find the total extra cost.",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Mention that the intermediate units cancel when multiplying the rates along the chain.",
          weight: 1,
        }
    exemplar: "Multiply kilometres per hour by litres per kilometre to find litres per hour; the kilometres cancel from the units. More generally, multiply the derivatives of successive calculations to find how the final result changes. When an extra kilometre adds both fuel costs and wages, calculate each added cost separately and add them, since both appear on the bill."
  - id: crp-why-multiply
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In step 3 of the car example, why are $1.5$, $0.08$ and $50$ multiplied rather than added?"
    options:
      - id: a
        text: "Each step scales the change it receives from the step before."
        correct: true
        feedback: "One extra hour gives $50$ km, each km gives $0.08$ litres, and each litre costs $1.5$ pounds, so each rate scales the previous result."
      - id: b
        text: "Multiplying always gives a bigger number than adding."
        correct: false
        feedback: "Not true for rates below $1$, such as $0.08$; the reason is how the steps pass the change along."
      - id: c
        text: "The three numbers have the same units, so they can be multiplied."
        correct: false
        feedback: "They have different units (km per hour, litres per km, pounds per litre); multiplying them is what makes the units chain into pounds per hour."
      - id: d
        text: "Adding would also work; multiplying is just shorter."
        correct: false
        feedback: "Adding gives $51.58$, which mixes units and is not the cost per hour."
    solution: "Each rate converts the change from the previous step: hours to km, km to litres, litres to pounds."
  - id: crp-total-rate
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "The in-between value $u$ changes at $\\frac{du}{dx}=4$ and the output changes at $\\frac{dy}{du}=5$. Find $\\frac{dy}{dx}$."
    answer: 20
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: 9
        tolerance: { abs: 0.001 }
        category: misunderstood_definition
        feedback: "You added the rates. Along a chain they multiply."
    hints: ["Multiply the two rates."]
    solution: "Rates along a chain multiply, so $\\frac{dy}{dx}=5\\times4=20$."
  - id: crp-rate-product
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A car drives at {{=v}} km per hour and uses {{=r}} litres of fuel per km. Fuel costs {{=p}} pounds per litre. How many pounds per hour does the fuel cost?"
    answer_expr: "p * r * v"
    params:
      v: { min: 40, max: 100, step: 10 }
      r: { min: 0.05, max: 0.12, step: 0.01 }
      p: { min: 1.2, max: 1.8, step: 0.1 }
    tolerance: { abs: 0.01 }
    common_wrong:
      - answer_expr: "p + r + v"
        category: misunderstood_definition
        feedback: "Rates along a chain multiply, they do not add."
      - answer_expr: "r * v"
        category: math_error
        feedback: "That is litres per hour. Multiply by the price per litre to get pounds per hour."
    hints: ["Chain: hours to km, km to litres, litres to pounds."]
    solution: '$\frac{dC}{dt}=\frac{dC}{dF}\cdot\frac{dF}{ds}\cdot\frac{ds}{dt}={{=p}}\times{{=r}}\times{{=v}}={{=p*r*v}}$ pounds per hour.'
  - id: crp-three-steps
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A robot arm's motor angle rises at $3$ radians per second. The gearbox turns the joint $0.2$ radians per radian of motor. At this pose, the gripper rises $0.5$ cm per radian of joint. How fast does the gripper rise, in cm per second?"
    answer: 0.3
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: 3.7
        tolerance: { abs: 0.001 }
        category: misunderstood_definition
        feedback: "You added the rates. Each step scales what the previous step passes on, so multiply."
      - answer: 0.6
        tolerance: { abs: 0.001 }
        category: math_error
        feedback: 'That is the joint''s rate, $0.2\times3$ radians per second. Multiply by the gripper rate $0.5$ too.'
    hints:
      [
        "Name the chain: time, motor angle, joint angle, gripper height.",
        "Multiply the three rates.",
      ]
    solution: '$\frac{dh}{dt}=0.5\times0.2\times3=0.3$ cm per second.'
  - id: crp-why-inner-factor
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In step 4 of the worked example for $y=(2x-1)^3$, why is the outer rate $27$ multiplied by $2$?"
    options:
      - id: a
        text: "The bracket $2x-1$ changes $2$ times as fast as $x$, and the cube responds to the bracket."
        correct: true
        feedback: "The cube sees a change in $u$ that is already $2$ times the change in $x$."
      - id: b
        text: "Because the power rule for $u^3$ always gives a factor of $2$."
        correct: false
        feedback: "The power rule for $u^3$ gives $3u^2$; the $2$ comes from the inner step $2x-1$."
      - id: c
        text: "Because $x=2$ at this point."
        correct: false
        feedback: "The inner rate $2$ does not depend on $x$ at all; it is the slope of $2x-1$ everywhere."
      - id: d
        text: "To undo the $-1$ in the bracket."
        correct: false
        feedback: "Subtracting a constant does not change a rate; the $2$ is the slope of the inner step."
    solution: "The inner rate $du/dx=2$ converts a nudge in $x$ into the nudge in $u$ that the cube responds to."
  - id: crp-diff-cube
    dimension: math
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Differentiate $y=(4x+1)^3$. The inner step is $u=4x+1$ and the outer step is $y=u^3$."
    answer: "12*(4*x+1)^2"
    variables: { x: [-2, 2] }
    common_wrong:
      - answer: "3*(4*x+1)^2"
        category: misunderstood_definition
        feedback: "That is only the outer rate. Multiply by the inner rate, $du/dx=4$."
    hints: ["$dy/du=3u^2$ and $du/dx=4$."]
    solution: '$\frac{dy}{dx}=3(4x+1)^2\cdot4=12(4x+1)^2$.'
  - id: crp-nested-slope
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Find the slope of $y=({{=a}}x+{{=b}})^2$ at $x={{=c}}$."
    answer_expr: "2 * (a * c + b) * a"
    params:
      a: { min: 2, max: 4, step: 1 }
      b: { min: 1, max: 5, step: 1 }
      c: { min: 1, max: 3, step: 1 }
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: "2 * (a * c + b)"
        category: misunderstood_definition
        feedback: "That is only the outer rate. Multiply by the inner rate, {{=a}}."
      - answer_expr: "2 * a"
        category: math_error
        feedback: "The outer rate $2u$ must be evaluated at the inner value $u={{=a*c+b}}$."
    hints:
      [
        "Find the inner value $u={{=a}}x+{{=b}}$ at $x={{=c}}$ first.",
        "Outer rate $2u$, inner rate {{=a}}.",
      ]
    solution: '$u={{=a*c+b}}$, so $\frac{dy}{dx}=2u\cdot{{=a}}=2\times{{=a*c+b}}\times{{=a}}={{=2*(a*c+b)*a}}$.'
  - id: crp-diff-log
    dimension: math
    type: expression
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: 'Differentiate $y=\ln(x^2+1)$ (write `log(...)` for $\ln$ if you need it).'
    answer: "2*x/(x^2+1)"
    variables: { x: [-2, 2] }
    common_wrong:
      - answer: "1/(x^2+1)"
        category: misunderstood_definition
        feedback: "That is only the outer rate. Multiply by the inner rate, $2x$."
      - answer: "1/(2*x)"
        category: misunderstood_definition
        feedback: "The outer rate $1/u$ is evaluated at the inner value $u=x^2+1$, not at the inner rate $2x$."
    hints: ['Inner step $u=x^2+1$; outer step $y=\ln u$ with $dy/du=1/u$.']
    solution: '$\frac{dy}{dx}=\frac{1}{x^2+1}\cdot2x=\frac{2x}{x^2+1}$.'
  - id: crp-root-slope
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: 'A robot is $x$ metres along a straight track that passes $3$ m from a beacon, so its distance to the beacon is $r=\sqrt{x^2+9}$. How fast does $r$ change per metre of $x$ when $x=4$?'
    answer: 0.8
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: 0.1
        tolerance: { abs: 0.001 }
        category: misunderstood_definition
        feedback: 'That is only the outer rate $\frac{1}{2\sqrt{u}}$ at $u=25$. Multiply by the inner rate $2x=8$.'
      - answer: 8
        tolerance: { abs: 0.001 }
        category: misunderstood_definition
        feedback: 'That is only the inner rate. Multiply by the outer rate $\frac{1}{2\sqrt{25}}=0.1$.'
    hints:
      [
        'Inner step $u=x^2+9$, outer step $r=\sqrt{u}$ with $\frac{dr}{du}=\frac{1}{2\sqrt{u}}$.',
        "At $x=4$, $u=25$.",
      ]
    solution: '$u=16+9=25$, outer rate $\frac{1}{2\times5}=0.1$, inner rate $2\times4=8$, so the slope is $0.1\times8=0.8$.'
  - id: crp-why-both-routes
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example for $f=uv$, why add the route through $v$ instead of stopping at $28$?"
    options:
      - id: a
        text: 'Nudging $x$ also moves $v$, and $\partial f/\partial u$ holds $v$ fixed, so $28$ misses that effect.'
        correct: true
        feedback: "Each partial measures one route only; the full change needs both."
      - id: b
        text: "The route through $v$ is a check that should give the same $28$."
        correct: false
        feedback: "It gives $12$, a separate contribution, not a repeat of the first."
      - id: c
        text: "Because $v$ is bigger than $u$."
        correct: false
        feedback: "Sizes do not decide it; every route from $x$ to $f$ counts."
      - id: d
        text: "To average the two routes."
        correct: false
        feedback: "Both effects happen together, so they add rather than average."
    solution: "Both $u$ and $v$ move when $x$ moves, so both routes contribute: $28+12=40$."
  - id: crp-sum-routes
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: 'The output $f$ depends on $u$ and $v$, which both depend on $x$. You know $\frac{\partial f}{\partial u}=3$, $\frac{du}{dx}=2$, $\frac{\partial f}{\partial v}=5$ and $\frac{dv}{dx}=4$. Find $\frac{df}{dx}$.'
    answer: 26
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: 6
        tolerance: { abs: 0.001 }
        category: misunderstood_definition
        feedback: 'That is only the route through $u$. Add the route through $v$, $5\times4$.'
      - answer: 120
        tolerance: { abs: 0.001 }
        category: misunderstood_definition
        feedback: "The two routes are separate paths, so add their products instead of multiplying everything."
      - answer: 14
        tolerance: { abs: 0.001 }
        category: misunderstood_definition
        feedback: "Within each route the rates multiply; only the route totals are added."
    hints: ['Route through $u$: $3\times2$. Route through $v$: $5\times4$.']
    solution: '$\frac{df}{dx}=3\times2+5\times4=6+20=26$.'
  - id: crp-routes-expression
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: 'Let $f=uv$ with $u={{=a}}x$ and $v=x+{{=b}}$. Find $\frac{df}{dx}$ at $x={{=c}}$ by adding the two routes.'
    answer_expr: "(c + b) * a + a * c"
    params:
      a: { min: 1, max: 4, step: 1 }
      b: { min: 1, max: 5, step: 1 }
      c: { min: 1, max: 3, step: 1 }
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: "(c + b) * a"
        category: misunderstood_definition
        feedback: 'That is only the route through $u$. Add the route through $v$: $\frac{\partial f}{\partial v}\cdot\frac{dv}{dx}=u\cdot1$.'
      - answer_expr: "a * c"
        category: misunderstood_definition
        feedback: 'That is only the route through $v$. Add the route through $u$: $v\cdot{{=a}}$.'
    hints:
      [
        "At $x={{=c}}$: $u={{=a*c}}$ and $v={{=c+b}}$.",
        '$\frac{\partial f}{\partial u}=v$ and $\frac{\partial f}{\partial v}=u$.',
      ]
    solution: 'Route through $u$: $v\cdot{{=a}}={{=(c+b)*a}}$. Route through $v$: $u\cdot1={{=a*c}}$. Total $\frac{df}{dx}={{=(c+b)*a+a*c}}$.'
  - id: crp-robot-heat
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: 'A robot''s throttle $q$ sets its motor power $P=2q$ and its fan speed $s=20q$. The motor temperature is $T=3P-0.4s$: power heats it and the fan cools it. Find $\frac{dT}{dq}$.'
    answer: -2
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: 6
        tolerance: { abs: 0.001 }
        category: misunderstood_definition
        feedback: 'That is only the power route. The fan route is $-0.4\times20=-8$.'
      - answer: -8
        tolerance: { abs: 0.001 }
        category: misunderstood_definition
        feedback: 'That is only the fan route. Add the power route, $3\times2=6$.'
    hints:
      [
        'Power route: $\frac{\partial T}{\partial P}\cdot\frac{dP}{dq}=3\times2$.',
        'Fan route: $\frac{\partial T}{\partial s}\cdot\frac{ds}{dq}=-0.4\times20$.',
      ]
    solution: '$\frac{dT}{dq}=3\times2+(-0.4)\times20=6-8=-2$. Opening the throttle cools the motor slightly, because the fan route outweighs the power route.'
  - id: cr-recall-rates-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: cr-rates-multiply
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, how do rates combine along a chain of calculations, and why do they combine this way?"
    rubric:
      - id: point1
        criterion: "State that the rates along the chain multiply."
        weight: 1
        required: true
      - id: point2
        criterion: "Explain that each step scales the change passed to it by the previous step."
        weight: 1
        required: true
    exemplar: "Multiply the rates along the chain. Each step scales the change it receives from the previous step."
  - id: cr-recall-rates-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: cr-rates-multiply
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: "For a chain $x$ to $u$ to $y$, which operation combines $du/dx$ and $dy/du$ to give $dy/dx$?"
    options:
      - id: a
        text: "Add the two rates"
        correct: false
        feedback: "Adding combines separate route contributions; these steps lie on one route."
      - id: b
        text: "Divide the second rate by the first"
        correct: false
        feedback: "Dividing would undo the first step's scaling. The second step scales the already scaled change again, so the rates multiply."
      - id: c
        text: "Multiply the two rates"
        correct: true
        feedback: "Successive scaling multiplies the rates."
    solution: "Successive scaling multiplies the rates."
  - id: cr-recall-rates-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: cr-rates-multiply
    difficulty: 1
    est_minutes: 0.5
    prompt: "In a chain $x$ to $u$ to $y$, let $a=du/dx$ and $b=dy/du$ at the current input. Write $dy/dx$ in terms of $a$ and $b$."
    answer: "a*b"
    variables: { "a": [1.5, 5], "b": [-4, -0.5] }
    solution: "The chain rule multiplies the two rates, giving $ab$."
  - id: cr-recall-nested-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: cr-nested-formulas
    difficulty: 1
    est_minutes: 1
