  - id: sdp-recall-guess-sources-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: sd-guess-sources
    difficulty: 1
    est_minutes: 0.5
    prompt: "N-gram lookup always proposes the copied token $x$ at this position. Fill in the blank under exact speculative sampling: the probability of accepting that proposal is $\\underline{\\qquad}$. Use the usual probability notation or words."
    accept:
      - "p(x)"
      - "p"
      - "target probability"
      - "the target probability"
      - "the target's probability"
      - "target probability of x"
      - "the target probability of x"
      - "the target's probability of x"
      - "probability of x under the target"
      - "the probability of token x under the target"
    regex: '^\s*\$?\s*(?:p(?:\s*\(\s*x\s*\))?|\\?min\s*\(\s*(?:1\s*,\s*p(?:\s*\(\s*x\s*\))?|p(?:\s*\(\s*x\s*\))?\s*,\s*1)\s*\)|(?:the\s+)?(?:target(?:[''’]s)?\s+probability(?:\s+(?:of|for)\s+(?:token\s+)?x)?|probability\s+(?:of|for)\s+(?:token\s+)?x\s+(?:under|from)\s+(?:the\s+)?target(?:\s+model)?))\s*\$?\s*\.?\s*$'
    solution: "The draft's probability for the copied token is one. The acceptance rule then gives the target's probability $p(x)$."
