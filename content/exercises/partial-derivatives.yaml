concept: partial-derivatives
exercises:
  - id: pd-hold-fixed-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is a partial derivative?"
    options:
      - {
          id: a,
          text: "The function's rate of change for one input, with all other inputs held fixed.",
          correct: true,
          feedback: "Holding the other inputs fixed isolates how the chosen input affects the function.",
        }
      - {
          id: b,
          text: "The rate at which a function changes when all its inputs move by the same amount.",
          correct: false,
          feedback: "That describes a combined directional change.",
        }
      - {
          id: c,
          text: "The output value of the function when every input is set to zero.",
          correct: false,
          feedback: "That is one function value, not a derivative.",
        }
      - {
          id: d,
          text: "The average of all the input values at the current point.",
          correct: false,
          feedback: "An average of input values is a single number about the point, not a rate of change.",
        }
    solution: "A partial derivative measures a function's rate with respect to one input while holding the others fixed."
  - id: pd-compute-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "You have worked out the partial-derivative formula of a model's loss for one weight. What does that formula give you?"
    options:
      - {
          id: a,
          text: "The single weight value at which the model's prediction exactly matches the price.",
          correct: false,
          feedback: "A derivative formula gives a slope. It does not by itself pick out a weight that makes the error zero.",
        }
      - {
          id: b,
          text: "The loss's slope for that weight, at any values of the model's weights you put in.",
          correct: true,
          feedback: "The formula is a function of all the parameters: put in their values to get that weight's slope there.",
        }
      - {
          id: c,
          text: "The model's predicted price for the house at its current weights.",
          correct: false,
          feedback: "The prediction is the model's output, not a rate of change of the loss.",
        }
      - {
          id: d,
          text: "How fast the house's sale price changes when the house's area changes.",
          correct: false,
          feedback: "The price and area are recorded data and stay fixed; the partial is about how the loss changes with a weight.",
        }
    solution: "A partial-derivative formula for one weight gives the loss's slope for that weight at any setting of the parameters: put in their values to get the slope there."
  - id: pd-many-inputs-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "For one house, the error is $e$ = prediction minus price, and the loss is $e^2$. The bias $b$ is added to the prediction. What is the loss's partial derivative with respect to $b$?"
    options:
      - {
          id: a,
          text: "$2e$, because the bias adds to the prediction with multiplier $1$",
          correct: true,
          feedback: "Raising $b$ by $1$ raises $e$ by $1$, so the partial is $2e\\cdot1=2e$.",
        }
      - {
          id: b,
          text: "$2e$ times a feature value, because every partial includes a feature",
          correct: false,
          feedback: "A weight's partial includes the feature it multiplies. The bias multiplies no feature, so its multiplier is $1$.",
        }
      - {
          id: c,
          text: "$e$, because the derivative of the squared loss has no factor of $2$",
          correct: false,
          feedback: "Differentiating $e\\cdot e$ with the product rule gives two equal terms, so there is a factor of $2$: $2e$, not $e$.",
        }
      - {
          id: d,
          text: "$b$, because the bias's own value is the loss's slope",
          correct: false,
          feedback: "The bias's value is a setting, not a rate. Its partial is how fast the loss changes as $b$ moves.",
        }
    solution: |
      Freeze the weights. The error changes one-for-one with the bias:

      $$\frac{\partial e}{\partial b}=1$$

      The product rule on $L=e\cdot e$ gives:

      $$\frac{\partial L}{\partial b}=2e\cdot1=2e$$
  - id: pd-check-1
    dimension: math
    type: expression
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x, y) = x^2 y + 4xy^3$, give $\\partial f / \\partial x$."
    answer: "2*x*y + 4*y^3"
    variables: { x: [-2, 2], y: [-2, 2] }
    common_wrong:
      - {
          answer: "x^2 + 12*x*y^2",
          category: misunderstood_definition,
          feedback: "That is $\\partial f/\\partial y$. Here $y$ is the constant.",
        }
    hints: ["Treat $y$ as a constant number."]
    solution: "$2xy + 4y^3$."
  - id: pd-y
    dimension: math
    type: expression
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "For $f(x, y) = x^2 y + 4xy^3$, give $\\partial f / \\partial y$."
    answer: "x^2 + 12*x*y^2"
    variables: { x: [-2, 2], y: [-2, 2] }
    solution: "$x^2 + 12xy^2$."
  - id: pd-residual
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "Let $f(w, b) = (wx + b - y)^2$, where $x = 3$ and $y = 1$. At $w = 1$, $b = 1$, what is $\\partial f/\\partial w$?"
    answer: 18
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 6,
          category: math_error,
          feedback: "The difference $r = wx + b - y$ changes at rate $x = 3$ when $w$ changes. Multiply by that rate: $\\partial f/\\partial w = 2r \\cdot x$.",
        }
      - { answer: 9, category: math_error, feedback: "Don't forget the factor 2 from the square." }
    hints:
      [
        "Let the inner difference be $r = wx + b - y$.",
        "$r = 3$; $\\partial f/\\partial w = 2 r x$.",
      ]
    solution: "The inner difference is $3 + 1 - 1 = 3$, so $\\partial f/\\partial w = 2 \\cdot 3 \\cdot 3 = 18$."
  - id: pd-review-exp
    dimension: math
    type: expression
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "For $g(a, b) = e^{a} b^2 + a b$, give $\\partial g / \\partial b$ (write `exp(a)`)."
    answer: "2*b*exp(a) + a"
    variables: { a: [-1, 1], b: [-2, 2] }
    solution: "$2b e^a + a$."
  - id: pd-concept
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "A model's total prediction error $L$ depends on three adjustable numbers, called parameters: $w_1, w_2, w_3$. When finding $\\partial L/\\partial w_3$, which quantities are treated as constants?"
    options:
      - { id: a, text: "All data values and every parameter except $w_3$", correct: true }
      - {
          id: b,
          text: "Only the data values",
          correct: false,
          category: misunderstood_definition,
          feedback: "The other parameters are held fixed too. That is what makes it *partial*.",
        }
      - {
          id: c,
          text: "Only the other parameters; the data change",
          correct: false,
          category: misunderstood_definition,
          feedback: "The data don't change while you take a derivative with respect to a parameter. The data are constants too.",
        }
    solution: "A partial derivative varies one variable; everything else, data and other parameters alike, is held fixed."
  - id: pd-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "A house price formula $P(s, a)$ uses size $s$ (tens of m²) and age $a$ (years). At one house, $\\frac{\\partial P}{\\partial s} = 28$ and $\\frac{\\partial P}{\\partial a} = -3$, in thousands of pounds. Explain in 2–4 sentences what each number means and why the other input must be held fixed."
    rubric:
      - {
          id: r1,
          criterion: "Says $\\partial P/\\partial s = 28$ means the price rises about £28k per extra 10 m² when the age stays the same",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Says $\\partial P/\\partial a = -3$ means the price falls about £3k per extra year when the size stays the same",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Explains that holding the other input fixed isolates the effect of one input, so the two changes aren't mixed up",
          weight: 1,
        }
    exemplar: "∂P/∂s = 28 means that, keeping the house the same age, each extra 10 m² adds about £28k to the price. ∂P/∂a = -3 means that, keeping the size the same, each extra year takes about £3k off. Holding the other input fixed isolates the effect of one input; if both moved at once you couldn't tell which caused the change."
  - id: pdp-meaning
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "For a price formula $P(s, a)$ with size $s$ and age $a$, what does $\\frac{\\partial P}{\\partial s}$ measure?"
    options:
      - id: a
        text: "How fast the price changes as the size grows, with the age held fixed"
        correct: true
      - id: b
        text: "How fast the price changes when size and age both grow together"
        correct: false
        category: misunderstood_definition
        feedback: "A partial derivative moves one input only. The age stays exactly where it was."
      - id: c
        text: "The price of a house of size $s$"
        correct: false
        category: misunderstood_definition
        feedback: "That is $P$ itself. The partial derivative is a rate of change."
      - id: d
        text: "How fast the size changes as the price grows"
        correct: false
        category: misunderstood_definition
        feedback: "It is the other way round: the change in price per unit change in size."
    solution: "$\\frac{\\partial P}{\\partial s}$ nudges the size and keeps the age fixed, so it is the rate of change of price with size alone."
  - id: pdp-house-rate
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A price formula is $P(s, a) = {{=c}}s - {{=d}}a - 0.1\\,s\\,a$, with size $s$ in tens of m², age $a$ in years and price in thousands of pounds. What is $\\frac{\\partial P}{\\partial s}$ for a house aged $a = {{=a0}}$?"
    hints: ["Treat $a$ as a constant.", "$\\frac{\\partial P}{\\partial s} = {{=c}} - 0.1a$."]
    solution: "Holding $a$ fixed, $\\frac{\\partial P}{\\partial s} = {{=c}} - 0.1a = {{=c}} - {{=0.1*a0}} = {{=c-0.1*a0}}$, so each extra 10 m² adds about £{{=c-0.1*a0}}k."
    answer_expr: "c - 0.1 * a0"
    params:
      c: { min: 20, max: 40, step: 1 }
      d: { min: 1, max: 5, step: 1 }
      a0: { min: 10, max: 50, step: 10 }
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "c",
          category: math_error,
          feedback: "The term $-0.1\\,s\\,a$ also contains $s$, so it contributes $-0.1a$.",
        }
      - {
          answer_expr: "-d - 0.1 * a0",
          category: misunderstood_definition,
          feedback: "That mixes in the age term. $-{{=d}}a$ has no $s$ in it, so it contributes 0.",
        }
  - id: pdp-why-freeze
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Why must $x$ and $z$ stay fixed when computing $\\frac{\\partial f}{\\partial y}$ for $f(x, y, z)$?"
    options:
      - {
          id: a,
          text: "Otherwise their changes could mix with the effect of changing $y$",
          correct: true,
        }
      - id: b
        text: "Holding an input fixed means removing its contribution by setting it to 0"
        correct: false
        category: misunderstood_definition
        feedback: "They are held fixed at whatever values they have, not set to 0."
      - id: c
        text: "Their derivatives must be added to the derivative in $y$"
        correct: false
        category: misunderstood_definition
        feedback: "Only $y$ moves. Adding all the changes would mix up the effects of different inputs."
      - id: d
        text: "Only one other input needs to be fixed, so $z$ can still change"
        correct: false
        category: misunderstood_definition
        feedback: "Every input except $y$ is held fixed."
    solution: "Keeping $x$ and $z$ fixed lets us measure the effect of $y$ alone. If they also changed, we could not attribute the output change to $y$."
  - id: pdp-sign
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "For a price formula $P(s, a)$, a house has $\\frac{\\partial P}{\\partial a} = -3$ (thousands of pounds per year). What happens to its estimated price if it is one year older and the same size?"
    options:
      - { id: a, text: "It falls by about £3k", correct: true }
      - id: b
        text: "It rises by about £3k"
        correct: false
        category: incorrect_reasoning
        feedback: "A negative partial means the output goes down as that input goes up."
      - id: c
        text: "It becomes £3k"
        correct: false
        category: misunderstood_definition
        feedback: "The partial derivative is a rate of change, not the price."
      - id: d
        text: 'You can''t tell without also knowing $\partial P / \partial s$'
        correct: false
        category: incorrect_reasoning
        feedback: 'The size isn''t changing, so only $\partial P / \partial a$ matters here.'
    solution: "With the size fixed, the price changes by about $-3$ per extra year, so it falls by about £3k."
  - id: pdp-nudge-check
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For $f(x, y) = x^2 y$, $f(3, 2) = 18$ and $f(3.01, 2) = 18.1202$. Estimate $\\frac{\\partial f}{\\partial x}$ at $(3, 2)$ from these values."
    answer: 12.02
    tolerance: { abs: 0.05 }
    common_wrong:
      - {
          answer: 0.1202,
          category: math_error,
          feedback: "That is the change in output. Divide it by the increase in $x$, which is 0.01, to get a rate.",
        }
    hints:
      [
        "Divide the change in output by the change in $x$.",
        "$y$ stayed at 2, so this estimates the partial in $x$.",
      ]
    solution: "$(18.1202 - 18) \\div 0.01 = 12.02$, close to the exact value $2xy = 12$."
  - id: pdp-how-many
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A delivery cost $C$ depends on distance, parcel weight and time of day. How many partial derivatives does $C$ have?"
    options:
      - { id: a, text: "3, one for each input", correct: true }
      - id: b
        text: "1, because there is one output"
        correct: false
        category: misunderstood_definition
        feedback: "There is one partial for each input you can move on its own."
      - id: c
        text: "6, one for each pair of inputs"
        correct: false
        category: misunderstood_definition
        feedback: "A partial moves a single input, so you need one per input."
      - id: d
        text: "0, because derivatives need a single input"
        correct: false
        category: misunderstood_definition
        feedback: "Partial derivatives are exactly how you differentiate functions with several inputs."
    solution: "Each of the 3 inputs can be nudged on its own while the others are held fixed, giving 3 partials."
  - id: pdp-compute-x
    dimension: math
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x, y) = 3x^2 y - 5xy + y^2$, give $\\frac{\\partial f}{\\partial x}$."
    answer: "6*x*y - 5*y"
    variables: { x: [-2, 2], y: [-2, 2] }
    common_wrong:
      - {
          answer: "6*x*y - 5*y + 2*y",
          category: misunderstood_definition,
          feedback: "$y^2$ has no $x$ in it, so it is a constant here and contributes 0.",
        }
      - {
          answer: "3*x^2 - 5*x + 2*y",
          category: misunderstood_definition,
          feedback: "That is $\\partial f/\\partial y$. Here $y$ is the constant.",
        }
    hints: ["Treat $y$ as a constant number."]
    solution: "$3x^2 y \\to 6xy$, $-5xy \\to -5y$ and $y^2 \\to 0$, so $\\frac{\\partial f}{\\partial x} = 6xy - 5y$."
  - id: pdp-value-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For $f(x, y) = {{=a}}x^2 y + {{=b}}y$, what is $\\frac{\\partial f}{\\partial x}$ at $(x, y) = ({{=x0}}, {{=y0}})$?"
    hints: ["Treat $y$ as a constant: $\\frac{\\partial f}{\\partial x} = {{=2*a}}xy$."]
    solution: "$\\frac{\\partial f}{\\partial x} = {{=2*a}}xy$, because ${{=b}}y$ has no $x$. At $({{=x0}}, {{=y0}})$ that is ${{=2*a}} \\times {{=x0}} \\times {{=y0}} = {{=2*a*x0*y0}}$."
    answer_expr: "2 * a * x0 * y0"
    params:
      a: { min: 1, max: 5, step: 1 }
      b: { min: 2, max: 9, step: 1 }
      x0: { min: 1, max: 4, step: 1 }
      y0: { min: 1, max: 4, step: 1 }
    constraints: ["a * x0^2 + b != 2 * a * x0 * y0"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "a * x0^2 + b",
          category: misunderstood_definition,
          feedback: "That is $\\partial f/\\partial y$. For $\\partial f/\\partial x$, $y$ is the constant.",
        }
      - {
          answer_expr: "2 * a * x0 * y0 + b",
          category: misunderstood_definition,
          feedback: "${{=b}}y$ has no $x$ in it, so it contributes 0.",
        }
  - id: pdp-why-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Why does $e^y$ contribute 0 to $\\frac{\\partial f}{\\partial x}$ when $f(x, y) = x^3 + e^y$?"
    options:
      - { id: a, text: "With $y$ fixed, nudging $x$ leaves $e^y$ unchanged", correct: true }
      - id: b
        text: "Every exponential term has derivative 0"
        correct: false
        category: misapplied_technique
        feedback: "An exponential can change: with respect to $y$, the derivative of $e^y$ is $e^y$. Here it is constant only because $y$ is fixed."
      - id: c
        text: "The current value of $y$ must be 0"
        correct: false
        category: misapplied_technique
        feedback: "Fixed does not mean zero. Whatever value $y$ has, it stays there as $x$ moves."
      - id: d
        text: "Terms added to $x^3$ never affect any partial derivative"
        correct: false
        category: misapplied_technique
        feedback: "Added terms can affect a partial when they contain the moving input. Here $e^y$ contributes to the partial in $y$, but not in $x$."
    solution: "With $y$ held fixed, $e^y$ is just a number, and the derivative of a constant is 0."
  - id: pdp-exp-log
    dimension: math
    type: expression
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For $g(x, y) = y\\,e^x + x\\ln y$, give $\\frac{\\partial g}{\\partial y}$ (write `exp(x)` and `log(y)`)."
    answer: "exp(x) + x/y"
    variables: { x: [-1, 1], y: [0.5, 3] }
    common_wrong:
      - {
          answer: "y*exp(x) + log(y)",
          category: misunderstood_definition,
          feedback: "That is $\\partial g/\\partial x$. Here $x$ is the constant.",
        }
    hints: ["$e^x$ and $x$ are constants here.", "$\\ln y \\to \\frac1y$."]
    solution: "$y\\,e^x \\to e^x$ and $x\\ln y \\to \\frac{x}{y}$, so $\\frac{\\partial g}{\\partial y} = e^x + \\frac{x}{y}$."
  - id: pdp-product
    dimension: math
    type: expression
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "For $f(x, y) = x^2 e^x y$, give $\\frac{\\partial f}{\\partial x}$ (write `exp(x)`)."
    answer: "y*exp(x)*(2*x + x^2)"
    variables: { x: [-1, 1], y: [-2, 2] }
    common_wrong:
      - {
          answer: "2*x*exp(x)*y",
          category: misunderstood_definition,
          feedback: "Both $x^2$ and $e^x$ contain $x$, so you need the product rule $u'v + uv'$.",
        }
    hints: ["$y$ is a constant multiple.", "Use the product rule on $x^2 e^x$."]
    solution: "Keep $y$ in front and use the product rule on $x^2 e^x$: $y(2x e^x + x^2 e^x) = y\\,e^x(2x + x^2)$."
  - id: pdp-compute-y
    dimension: math
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x, y) = 4x^3 y^2 + 2x - 7y$, give $\\frac{\\partial f}{\\partial y}$."
    answer: "8*x^3*y - 7"
    variables: { x: [-2, 2], y: [-2, 2] }
    common_wrong:
      - {
          answer: "8*x^3*y + 2 - 7",
          category: misunderstood_definition,
          feedback: "$2x$ has no $y$ in it, so it contributes 0.",
        }
    solution: "$4x^3 y^2 \\to 8x^3 y$, $2x \\to 0$ and $-7y \\to -7$, so $\\frac{\\partial f}{\\partial y} = 8x^3 y - 7$."
  - id: pdp-gap-w
    dimension: math
    type: expression
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A house-price model predicts $wx + b$ for a house of size $x$ that sold for $y$. Its squared error is $f(w, b) = (wx + b - y)^2$. Keeping $x$ and $y$ fixed, give $\\frac{\\partial f}{\\partial w}$ in terms of $w$, $b$, $x$ and $y$."
    answer: "2*(w*x + b - y)*x"
    variables: { w: [-2, 2], b: [-2, 2], x: [-2, 2], y: [-2, 2] }
    common_wrong:
      - {
          answer: "2*(w*x + b - y)",
          category: math_error,
          feedback: "That is $\\partial f/\\partial b$. The partial of the gap with respect to $w$ is $x$, not 1.",
        }
    hints:
      [
        "Write $g = wx + b - y$, so $f = g \\cdot g$ and $f' = 2g\\,g'$.",
        "$\\frac{\\partial g}{\\partial w} = x$.",
      ]
    solution: "With $g = wx + b - y$, the product rule gives $2g \\cdot \\frac{\\partial g}{\\partial w} = 2(wx + b - y)\\,x$."
  - id: pdp-gap-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Let $f(w, b) = (wx + b - y)^2$ with $x = {{=x}}$ and $y = {{=y}}$. At $w = {{=w}}$, $b = {{=b}}$, what is $\\frac{\\partial f}{\\partial w}$?"
    hints:
      ["First compute the gap $g = wx + b - y$.", "$\\frac{\\partial f}{\\partial w} = 2g\\,x$."]
    solution: "The gap is ${{=w}} \\times {{=x}} + {{=b}} - {{=y}} = {{=w*x+b-y}}$, so $\\frac{\\partial f}{\\partial w} = 2 \\times {{=w*x+b-y}} \\times {{=x}} = {{=2*(w*x+b-y)*x}}$."
    answer_expr: "2 * (w*x + b - y) * x"
    params:
      x: { min: 2, max: 5, step: 1 }
      y: { min: 1, max: 9, step: 1 }
      w: { min: 1, max: 3, step: 1 }
      b: { min: 0, max: 4, step: 1 }
    constraints: ["w*x + b - y != 0", "x != 1"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "2 * (w*x + b - y)",
          category: math_error,
          feedback: "You dropped the factor $x = {{=x}}$: the partial of the gap with respect to $w$ is $x$.",
        }
      - {
          answer_expr: "(w*x + b - y) * x",
          category: math_error,
          feedback: "Don't forget the factor 2 from the square.",
        }
  - id: pdp-gap-b
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Let $f(w, b) = (wx + b - y)^2$ with $x = 2$ and $y = 9$. At $w = 3$, $b = 1$, what is $\\frac{\\partial f}{\\partial b}$?"
    answer: -4
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 4,
          category: math_error,
          feedback: "Check the sign of the gap: $6 + 1 - 9 = -2$.",
        }
      - {
          answer: -8,
          category: math_error,
          feedback: "The partial of the gap with respect to $b$ is 1, so there is no factor $x$ here.",
        }
    hints: ["The gap is $g = 3 \\cdot 2 + 1 - 9$.", "$\\frac{\\partial f}{\\partial b} = 2g$."]
    solution: "The gap is $6 + 1 - 9 = -2$, so $\\frac{\\partial f}{\\partial b} = 2 \\times (-2) = -4$."
  - id: pdp-why-data-fixed
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A house-price model predicts $wx + b$, with adjustable numbers $w$ and $b$. The house has size $x = 3$ and recorded sale price $y = 1$. Why do we keep $x$ and $y$ constant when using $f(w, b) = (wx + b - y)^2$ to improve the model?"
    options:
      - id: a
        text: "They are recorded facts about the house; we can adjust the model's $w$ and $b$ instead"
        correct: true
      - id: b
        text: "Holding the data fixed makes their values 0 in the gap"
        correct: false
        category: misunderstood_definition
        feedback: "They are held at their actual values, such as $x = 3$ and $y = 1$, not set to 0."
      - id: c
        text: "Every input to a price formula must stay fixed, including $w$ and $b$"
        correct: false
        category: misunderstood_definition
        feedback: "The house's facts stay fixed, but the model's adjustable numbers can change. Keeping those fixed too would prevent any improvement."
      - id: d
        text: 'They aren''t; you also need $\partial f / \partial x$ to shrink the gap'
        correct: false
        category: incorrect_reasoning
        feedback: "You cannot change the house's size or recorded sale price to improve the model. You need the rates of change for $w$ and $b$ instead."
    solution: "The size and sale price are fixed facts about the house. To improve the model, calculate how its error changes with the adjustable numbers $w$ and $b$."
  - id: pdp-turn-dial
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "A house-price model's squared error $f(w, b)$ depends on its adjustable numbers $w$ and $b$. You find $\\frac{\\partial f}{\\partial w} = 18$ and $\\frac{\\partial f}{\\partial b} = 6$. Compare changes of the same small amount to just one number. Which reduces $f$ the most?"
    options:
      - { id: a, text: "Decrease $w$ a little", correct: true }
      - id: b
        text: "Increase $w$ a little"
        correct: false
        category: incorrect_reasoning
        feedback: "The positive partial derivative means that increasing $w$ slightly raises the error, rather than reducing it."
      - id: c
        text: "Decrease $b$ a little"
        correct: false
        category: incorrect_reasoning
        feedback: "That reduces the error, but decreasing $w$ by the same small amount reduces it about 3 times as much, since $18 = 3 \\times 6$."
      - id: d
        text: "Increase $b$ a little"
        correct: false
        category: incorrect_reasoning
        feedback: "The positive partial derivative means that increasing $b$ slightly raises the error."
    solution: "Both partial derivatives are positive, so a small decrease in either number reduces the error. The rate for $w$ is 18 rather than 6, so the same small decrease in $w$ reduces the error more."
  - id: pdp-three-inputs
    dimension: math
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x, y, z) = x y z + 2y^2 - z$, give $\\frac{\\partial f}{\\partial z}$."
    answer: "x*y - 1"
    variables: { x: [-2, 2], y: [-2, 2], z: [-2, 2] }
    common_wrong:
      - {
          answer: "x*y + 4*y - 1",
          category: misunderstood_definition,
          feedback: "$2y^2$ has no $z$ in it, so it contributes 0.",
        }
    solution: "Freeze $x$ and $y$: $xyz \\to xy$, $2y^2 \\to 0$ and $-z \\to -1$, so $\\frac{\\partial f}{\\partial z} = xy - 1$."
  - id: pdp-flat-weight
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A model's loss depends on two weights: $L(a, b) = a^2 - 4ab + 5b^2$. Holding $b = 3$ fixed, at which value of $a$ is $\\frac{\\partial L}{\\partial a} = 0$?"
    answer: 6
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 12,
          category: math_error,
          feedback: "The derivative of $a^2$ with respect to $a$ is $2a$, not $a$.",
        }
      - {
          answer: 7.5,
          category: misunderstood_definition,
          feedback: "That sets $\\frac{\\partial L}{\\partial b}$ to zero. Differentiate with respect to $a$, holding $b$ fixed.",
        }
    hints:
      - "Treat $b$ as a constant: $\\frac{\\partial L}{\\partial a} = 2a - 4b$."
      - "Put $b = 3$ and set the result to zero."
    solution: |
      Hold $b$ fixed and differentiate with respect to $a$; the $5b^2$ term does not change:

      $$\frac{\partial L}{\partial a} = 2a - 4b$$

      Put $b = 3$:

      $$\frac{\partial L}{\partial a} = 2a - 12$$

      Set it to zero:

      $$2a - 12 = 0$$

      $$a = 6$$
  - id: pdp-sensor-gain
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A robot's distance sensor gives a raw reading $r$. Its calibration turns this into a distance $gr + c$, with an adjustable gain $g$ and offset $c$. Tested against an object at known distance $t$, the squared error is $f(g, c) = (gr + c - t)^2$. In one test $r = 4$ and $t = 10$. At $g = 2$ and $c = 1$, what is $\\frac{\\partial f}{\\partial g}$?"
    answer: -8
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -2,
          category: misapplied_technique,
          feedback: "That is $\\frac{\\partial f}{\\partial c}$. The gain multiplies $r$, so its partial has an extra factor $r = 4$.",
        }
      - {
          answer: -1,
          category: math_error,
          feedback: "That is the calibration gap $gr + c - t$. Multiply by 2 and by $r$ to get the partial in $g$.",
        }
    hints:
      - "The reading $r$ and the distance $t$ are recorded facts; $g$ and $c$ are the adjustable numbers."
      - "Hold $c$ fixed: $\\frac{\\partial f}{\\partial g} = 2(gr + c - t)\\,r$."
    solution: |
      Treat $r$, $t$ and $c$ as fixed and differentiate with respect to $g$:

      $$\frac{\partial f}{\partial g} = 2(gr + c - t)\,r$$

      The calibration gap is:

      $$gr + c - t = 2 \cdot 4 + 1 - 10 = -1$$

      So:

      $$\frac{\partial f}{\partial g} = 2 \cdot (-1) \cdot 4 = -8$$

      Raising the gain a little would lower the error, because the sensor currently reads short.
  - id: pdp-freeze-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In step 2 of the worked example, why does the $2.25$ contribute $0$ to the slope in $y$?"
    options:
      - id: a
        text: "With $x$ frozen at $1.5$, the $x^2$ term is the fixed number $2.25$, which does not change as $y$ moves."
        correct: true
        feedback: "A fixed number has derivative $0$, so only $2y^2$ contributes to the slope in $y$."
      - id: b
        text: "Holding $x$ fixed means setting $x$ to $0$, so the $x^2$ term vanishes from the function entirely."
        correct: false
        category: misunderstood_definition
        feedback: "Fixed does not mean zero: $x$ stays at $1.5$, which is why the term is $2.25$ rather than $0$."
      - id: c
        text: "Any squared term has derivative $0$ at a point, so $x^2$ adds nothing to either partial derivative."
        correct: false
        category: misapplied_technique
        feedback: "Squared terms do have slopes: $x^2$ gives the $2x=3$ slope along $x$. It adds nothing only when $x$ is the frozen input."
      - id: d
        text: "Only the larger term of $f$ at $P$ affects the slope, and $2y^2$ is the larger one when $y$ equals $1$."
        correct: false
        category: incorrect_reasoning
        feedback: "Size has nothing to do with it; in fact $2.25$ is larger than $2y^2=2$ at $P$. What matters is whether the term changes as $y$ moves."
    solution: "With $x$ frozen at $1.5$, $x^2$ is the constant $2.25$. A constant does not change as $y$ moves, so its derivative is $0$."
  - id: pdp-constant-factor-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In step 1 of the worked example, why does $x^2y$ give $2xy$ rather than $2x$?"
    options:
      - id: a
        text: "$y$ is held fixed, so it is a constant factor that stays in place, like the $5$ in $5x^2$."
        correct: true
        feedback: "A constant factor carries through the derivative, so $x^2y$ becomes $2x\\cdot y$."
      - id: b
        text: "Both inputs are differentiated at once, and the two separate results are then multiplied together."
        correct: false
        category: misunderstood_definition
        feedback: "Only $x$ moves in $\\partial f/\\partial x$. Differentiating $y$ too would give $2x\\cdot1$, not $2xy$."
      - id: c
        text: "$y$ is set to $1$ while it is held fixed, and its letter is written back in at the very end."
        correct: false
        category: misunderstood_definition
        feedback: "A held input keeps whatever value it has; it is not set to $1$. It simply behaves as a constant."
      - id: d
        text: "Every term of a partial derivative must contain both inputs, so a factor $y$ is added to complete it."
        correct: false
        category: incorrect_reasoning
        feedback: "Terms can lose inputs: $5y$ gives $0$ in $x$ and $x^3$ gives $3x^2$. The $y$ stays only because it was a factor already."
    solution: "With $y$ held fixed, $x^2y$ is a constant $y$ times $x^2$. The constant factor stays, so the partial in $x$ is $2x\\cdot y=2xy$."
  - id: pdp-error-rate-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, why does the error $e$ change at rate $20$ per unit of $w_3$?"
    options:
      - id: a
        text: "$w_3$ multiplies the house's age, $20$, and every other term in $e$ is frozen while $w_3$ moves."
        correct: true
        feedback: "Only the term $20w_3$ changes, and it changes by $20$ for each unit of $w_3$."
      - id: b
        text: "The error itself is $-20$, so every parameter changes the error at that same rate of $20$."
        correct: false
        category: misunderstood_definition
        feedback: "The error's value is $-20$, but its rate depends on the parameter: $12$ for $w_1$, $3$ for $w_2$, $1$ for $b$."
      - id: c
        text: "The current weight is $w_3=-1$, so the rate is the age multiplied by that weight and flipped in sign."
        correct: false
        category: math_error
        feedback: "The current value of $w_3$ does not appear in the rate: $20w_3$ changes by $20$ per unit wherever $w_3$ starts."
      - id: d
        text: "Larger features always change the error faster, and age is the largest of the three features here."
        correct: false
        category: incorrect_reasoning
        feedback: "Age does give the largest rate here, but the reason is that the rate equals the feature $w_3$ multiplies, $20$."
    solution: "In $e=12w_1+3w_2+20w_3+b-330$, only $20w_3$ contains $w_3$. With the others frozen, $e$ changes by $20$ for each unit of $w_3$."
  - id: pdp-bias-zero
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "For the lesson's house, the loss is $L=(12w_1+3w_2+20w_3+b-330)^2$. Keep the weights at $w_1=25$, $w_2=10$, $w_3=-1$. At which bias $b$ is $\\frac{\\partial L}{\\partial b}=0$?"
    answer: 20
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -20,
          category: math_error,
          feedback: "Check the sign: with these weights the error is $310+b-330=b-20$, which is zero when $b=20$.",
        }
      - {
          answer: 0,
          category: misunderstood_definition,
          feedback: "At $b=0$ the partial is $2(-20)=-40$, not $0$. Set the error $b-20$ to zero instead.",
        }
    hints:
      - "$\\frac{\\partial L}{\\partial b}=2e$, where $e=12w_1+3w_2+20w_3+b-330$."
      - "With these weights, $e=310+b-330$. Set it to zero."
    solution: |
      The bias partial is twice the error:

      $$\frac{\partial L}{\partial b}=2e$$

      With these weights the error is:

      $$e=310+b-330=b-20$$

      It is zero when the prediction equals the price:

      $$b=20$$
