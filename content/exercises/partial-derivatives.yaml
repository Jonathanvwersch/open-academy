concept: partial-derivatives
exercises:
  - id: lab-gc-fixed-coordinate
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: 'For $f(x,y)=xy+y^2$, find $\partial f/\partial x$ at $(2,3)$.'
    answer: 3
    tolerance: { abs: 0.001 }
    hints: ["Hold the other coordinate fixed."]
    solution: 'Holding $y$ fixed gives $\partial f/\partial x=y$. At $(2,3)$ this is $3$.'
  - id: pd-hold-fixed-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "What is a partial derivative?"
    options:
      - {
          id: a,
          text: "The function's rate of change for one input, with all other inputs held fixed.",
          correct: true,
          feedback: "Holding the other inputs fixed isolates how the chosen input affects the function.",
        }
      - {
          id: b,
          text: "The rate at which a function changes when all its inputs move by the same amount.",
          correct: false,
          feedback: "That describes a combined directional change.",
        }
      - {
          id: c,
          text: "The output value of the function when every input is set to zero.",
          correct: false,
          feedback: "That is one function value, not a derivative.",
        }
      - {
          id: d,
          text: "The average of all the input values at the current point.",
          correct: false,
          feedback: "An average of input values is a single number about the point, not a rate of change.",
        }
    solution: "A partial derivative measures a function's rate with respect to one input while holding the others fixed."
  - id: pd-compute-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "You have worked out the partial-derivative formula $\\frac{\\partial f}{\\partial x}$ for a function $f(x, y)$. What does that formula give you?"
    options:
      - {
          id: a,
          text: "The single value of $x$ at which the function $f$ equals zero.",
          correct: false,
          feedback: "A derivative formula gives a slope. It does not by itself pick out where $f$ is zero.",
        }
      - {
          id: b,
          text: "The slope of $f$ along $x$, at any point $(x, y)$ you put in.",
          correct: true,
          feedback: "The formula is a function of both inputs: put in a point to get the slope along $x$ there.",
        }
      - {
          id: c,
          text: "The value of the function $f$ at the point you put in.",
          correct: false,
          feedback: "That is $f$ itself, not a rate of change.",
        }
      - {
          id: d,
          text: "How fast the input $y$ changes when the input $x$ changes.",
          correct: false,
          feedback: "$y$ is held fixed. The formula says how fast $f$ changes as $x$ moves.",
        }
    solution: "A partial-derivative formula is itself a function of the inputs. Put in any point $(x, y)$ to get the slope of $f$ along $x$ there."
  - id: pd-many-inputs-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "For one house, the error is $e$ = prediction minus price, and the loss is $e^2$. The bias $b$ is added to the prediction. What is the loss's partial derivative with respect to $b$?"
    options:
      - {
          id: a,
          text: "$2e$, because the bias adds to the prediction with multiplier $1$",
          correct: true,
          feedback: "Raising $b$ by $1$ raises $e$ by $1$, so the partial is $2e\\cdot1=2e$.",
        }
      - {
          id: b,
          text: "$2e$ times an input value, because every partial includes an input such as the area",
          correct: false,
          feedback: "A weight's partial includes the input it multiplies. The bias multiplies no input, so its multiplier is $1$.",
        }
      - {
          id: c,
          text: "$e$, because the derivative of the squared loss has no factor of $2$",
          correct: false,
          feedback: "Differentiating $e\\cdot e$ with the product rule gives two equal terms, so there is a factor of $2$: $2e$, not $e$.",
        }
      - {
          id: d,
          text: "$b$, because the bias's own value is the loss's slope",
          correct: false,
          feedback: "The bias's value is a setting, not a rate. Its partial is how fast the loss changes as $b$ moves.",
        }
    solution: |
      Freeze the weights. The error changes one-for-one with the bias:

      $$\frac{\partial e}{\partial b}=1$$

      The product rule on $L=e\cdot e$ gives:

      $$\frac{\partial L}{\partial b}=2e\cdot1=2e$$
  - id: pd-check-1
    dimension: math
    type: expression
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x, y) = x^2 y + 4xy^3$, give $\\partial f / \\partial x$."
    answer: "2*x*y + 4*y^3"
    variables: { x: [-2, 2], y: [-2, 2] }
    common_wrong:
      - {
          answer: "x^2 + 12*x*y^2",
          category: misunderstood_definition,
          feedback: "That is $\\partial f/\\partial y$. Here $y$ is the constant.",
        }
    hints: ["Treat $y$ as a constant number."]
    solution: "$2xy + 4y^3$."
  - id: pd-y
    dimension: math
    type: expression
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "For $f(x, y) = x^2 y + 4xy^3$, give $\\partial f / \\partial y$."
    answer: "x^2 + 12*x*y^2"
    variables: { x: [-2, 2], y: [-2, 2] }
    solution: "$x^2 + 12xy^2$."
  - id: pd-residual
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "Let $f(w, b) = (wx + b - y)^2$, where $x = 3$ and $y = 1$. At $w = 1$, $b = 1$, what is $\\partial f/\\partial w$?"
    answer: 18
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 6,
          category: math_error,
          feedback: "The difference $r = wx + b - y$ changes at rate $x = 3$ when $w$ changes. Multiply by that rate: $\\partial f/\\partial w = 2r \\cdot x$.",
        }
      - { answer: 9, category: math_error, feedback: "Don't forget the factor 2 from the square." }
    hints: ["Let the error be $e = wx + b - y$.", "$e = 3$; $\\partial f/\\partial w = 2 e x$."]
    solution: "The error is $3 + 1 - 1 = 3$, so $\\partial f/\\partial w = 2 \\cdot 3 \\cdot 3 = 18$."
  - id: pd-review-exp
    dimension: math
    type: expression
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "For $g(a, b) = e^{a} b^2 + a b$, give $\\partial g / \\partial b$ (write `exp(a)`)."
    answer: "2*b*exp(a) + a"
    variables: { a: [-1, 1], b: [-2, 2] }
    solution: "$2b e^a + a$."
  - id: pd-concept
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "A model's total prediction error $L$ depends on three adjustable numbers, called parameters: $w_1, w_2, w_3$. When finding $\\partial L/\\partial w_3$, which quantities are treated as constants?"
    options:
      - { id: a, text: "All data values and every parameter except $w_3$", correct: true }
      - {
          id: b,
          text: "Only the data values",
          correct: false,
          category: misunderstood_definition,
          feedback: "The other parameters are held fixed too. That is what makes it *partial*.",
        }
      - {
          id: c,
          text: "Only the other parameters; the data change",
          correct: false,
          category: misunderstood_definition,
          feedback: "The data don't change while you take a derivative with respect to a parameter. The data are constants too.",
        }
    solution: "A partial derivative varies one variable; everything else, data and other parameters alike, is held fixed."
  - id: pd-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "A house price formula $P(s, a)$ uses size $s$ (tens of m²) and age $a$ (years). At one house, $\\frac{\\partial P}{\\partial s} = 28$ and $\\frac{\\partial P}{\\partial a} = -3$, in thousands of pounds. Explain in 2–4 sentences what each number means and why the other input must be held fixed."
    rubric:
      - id: r1
        criterion:
          Explain that near this house, price rises about $28$ thousand pounds per extra $10$ m² when age stays
          fixed.
        weight: 2
        required: true
      - id: r2
        criterion:
          Explain that near this house, price falls about $3$ thousand pounds per extra year when size stays
          fixed.
        weight: 2
        required: true
      - id: r3
        criterion: Explain that holding the other input fixed separates the effect of the input being changed.
        weight: 1
        required: true
    exemplar: "Near this house, $\\partial P/\\partial s=28$ means price rises about $28$ thousand pounds per extra $10$ m² when age stays the same. Likewise, $\\partial P/\\partial a=-3$ means price falls about $3$ thousand pounds per extra year when size stays the same. A partial derivative changes only one input so we measure its effect separately."
  - id: pdp-meaning
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "For a price formula $P(s, a)$ with size $s$ and age $a$, what does $\\frac{\\partial P}{\\partial s}$ measure?"
    options:
      - id: a
        text: "How fast the price changes as the size grows, with the age held fixed"
        correct: true
      - id: b
        text: "How fast the price changes when size and age both grow together"
        correct: false
        category: misunderstood_definition
        feedback: "A partial derivative moves one input only. The age stays exactly where it was."
      - id: c
        text: "The price of a house of size $s$"
        correct: false
        category: misunderstood_definition
        feedback: "That is $P$ itself. The partial derivative is a rate of change."
      - id: d
        text: "How fast the size changes as the price grows"
        correct: false
        category: misunderstood_definition
        feedback: "It is the other way round: the change in price per unit change in size."
    solution: "$\\frac{\\partial P}{\\partial s}$ nudges the size and keeps the age fixed, so it is the rate of change of price with size alone."
  - id: pdp-house-rate
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A price formula is $P(s, a) = {{=c}}s - {{=d}}a - 0.1\\,s\\,a$, with size $s$ in tens of m², age $a$ in years and price in thousands of pounds. What is $\\frac{\\partial P}{\\partial s}$ for a house aged $a = {{=a0}}$?"
    hints: ["Treat $a$ as a constant.", "$\\frac{\\partial P}{\\partial s} = {{=c}} - 0.1a$."]
    solution: "Holding $a$ fixed, $\\frac{\\partial P}{\\partial s} = {{=c}} - 0.1a = {{=c}} - {{=0.1*a0}} = {{=c-0.1*a0}}$, so each extra 10 m² adds about £{{=c-0.1*a0}}k."
    answer_expr: "c - 0.1 * a0"
    params:
      c: { min: 20, max: 40, step: 1 }
      d: { min: 2, max: 5, step: 1 }
      a0: { min: 10, max: 50, step: 10 }
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "c",
          category: math_error,
          feedback: "The term $-0.1\\,s\\,a$ also contains $s$, so it contributes $-0.1a$.",
        }
      - {
          answer_expr: "-d - 0.1 * a0",
          category: misunderstood_definition,
          feedback: "That mixes in the age term. $-{{=d}}a$ has no $s$ in it, so it contributes 0.",
        }
  - id: pdp-why-freeze
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "Why must $x$ and $z$ stay fixed when computing $\\frac{\\partial f}{\\partial y}$ for $f(x, y, z)$?"
    options:
      - {
          id: a,
          text: "Otherwise their changes could mix with the effect of changing $y$",
          correct: true,
        }
      - id: b
        text: "Holding an input fixed means removing its contribution by setting it to 0"
        correct: false
        category: misunderstood_definition
        feedback: "They are held fixed at whatever values they have, not set to 0."
      - id: c
        text: "Their derivatives must be added to the derivative in $y$"
        correct: false
        category: misunderstood_definition
        feedback: "Only $y$ moves. Adding all the changes would mix up the effects of different inputs."
      - id: d
        text: "Only one other input needs to be fixed, so $z$ can still change"
        correct: false
        category: misunderstood_definition
        feedback: "Every input except $y$ is held fixed."
    solution: "Keeping $x$ and $z$ fixed lets us measure the effect of $y$ alone. If they also changed, we could not attribute the output change to $y$."
  - id: pdp-sign
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "For a price formula $P(s, a)$, a house has $\\frac{\\partial P}{\\partial a} = -3$ (thousands of pounds per year). What happens to its estimated price if it is one year older and the same size?"
    options:
      - { id: a, text: "It falls by about £3k", correct: true }
      - id: b
        text: "It rises by about £3k"
        correct: false
        category: incorrect_reasoning
        feedback: "A negative partial means the output goes down as that input goes up."
      - id: c
        text: "It becomes £3k"
        correct: false
        category: misunderstood_definition
        feedback: "The partial derivative is a rate of change, not the price."
      - id: d
        text: 'You can''t tell without also knowing $\partial P / \partial s$'
        correct: false
        category: incorrect_reasoning
        feedback: 'The size isn''t changing, so only $\partial P / \partial a$ matters here.'
    solution: "With the size fixed, the price changes by about $-3$ per extra year, so it falls by about £3k."
  - id: pdp-nudge-check
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For $f(x, y) = x^2 y$, $f(3, 2) = 18$ and $f(3.01, 2) = 18.1202$. Estimate $\\frac{\\partial f}{\\partial x}$ at $(3, 2)$ from these values."
    answer: 12.02
    tolerance: { abs: 0.05 }
    common_wrong:
      - {
          answer: 0.1202,
          category: math_error,
          feedback: "That is the change in output. Divide it by the increase in $x$, which is 0.01, to get a rate.",
        }
    hints:
      [
        "Divide the change in output by the change in $x$.",
        "$y$ stayed at 2, so this estimates the partial in $x$.",
      ]
    solution: "$(18.1202 - 18) \\div 0.01 = 12.02$, close to the exact value $2xy = 12$."
  - id: pdp-how-many
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "A delivery cost $C$ depends on distance, parcel weight and time of day. How many partial derivatives does $C$ have?"
    options:
      - { id: a, text: "3, one for each input", correct: true }
      - id: b
        text: "1, because there is one output"
        correct: false
        category: misunderstood_definition
        feedback: "There is one partial for each input you can move on its own."
      - id: c
        text: "6, one for each pair of inputs"
        correct: false
        category: misunderstood_definition
        feedback: "A partial moves a single input, so you need one per input."
      - id: d
        text: "0, because derivatives need a single input"
        correct: false
        category: misunderstood_definition
        feedback: "Partial derivatives are exactly how you differentiate functions with several inputs."
    solution: "Each of the 3 inputs can be nudged on its own while the others are held fixed, giving 3 partials."
  - id: pdp-compute-x
    dimension: math
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x, y) = 3x^2 y - 5xy + y^2$, give $\\frac{\\partial f}{\\partial x}$."
    answer: "6*x*y - 5*y"
    variables: { x: [-2, 2], y: [-2, 2] }
    common_wrong:
      - {
          answer: "6*x*y - 5*y + 2*y",
          category: misunderstood_definition,
          feedback: "$y^2$ has no $x$ in it, so it is a constant here and contributes 0.",
        }
      - {
          answer: "3*x^2 - 5*x + 2*y",
          category: misunderstood_definition,
          feedback: "That is $\\partial f/\\partial y$. Here $y$ is the constant.",
        }
    hints: ["Treat $y$ as a constant number."]
    solution: "$3x^2 y \\to 6xy$, $-5xy \\to -5y$ and $y^2 \\to 0$, so $\\frac{\\partial f}{\\partial x} = 6xy - 5y$."
  - id: pdp-value-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For $f(x, y) = {{=a}}x^2 y + {{=b}}y$, what is $\\frac{\\partial f}{\\partial x}$ at $(x, y) = ({{=x0}}, {{=y0}})$?"
    hints: ["Treat $y$ as a constant: $\\frac{\\partial f}{\\partial x} = {{=2*a}}xy$."]
    solution: "$\\frac{\\partial f}{\\partial x} = {{=2*a}}xy$, because ${{=b}}y$ has no $x$. At $({{=x0}}, {{=y0}})$ that is ${{=2*a}} \\times {{=x0}} \\times {{=y0}} = {{=2*a*x0*y0}}$."
    answer_expr: "2 * a * x0 * y0"
    params:
      a: { min: 2, max: 5, step: 1 }
      b: { min: 2, max: 9, step: 1 }
      x0: { min: 1, max: 4, step: 1 }
      y0: { min: 1, max: 4, step: 1 }
    constraints: ["a * x0^2 + b != 2 * a * x0 * y0", "x0 != 2 * y0"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "a * x0^2 + b",
          category: misunderstood_definition,
          feedback: "That is $\\partial f/\\partial y$. For $\\partial f/\\partial x$, $y$ is the constant.",
        }
      - {
          answer_expr: "2 * a * x0 * y0 + b",
          category: misunderstood_definition,
          feedback: "${{=b}}y$ has no $x$ in it, so it contributes 0.",
        }
  - id: pdp-why-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "Why does $e^y$ contribute 0 to $\\frac{\\partial f}{\\partial x}$ when $f(x, y) = x^3 + e^y$?"
    options:
      - { id: a, text: "With $y$ fixed, nudging $x$ leaves $e^y$ unchanged", correct: true }
      - id: b
        text: "Every exponential term has derivative 0"
        correct: false
        category: misapplied_technique
        feedback: "An exponential can change: with respect to $y$, the derivative of $e^y$ is $e^y$. Here it is constant only because $y$ is fixed."
      - id: c
        text: "The current value of $y$ must be 0"
        correct: false
        category: misapplied_technique
        feedback: "Fixed does not mean zero. Whatever value $y$ has, it stays there as $x$ moves."
      - id: d
        text: "Terms added to $x^3$ never affect any partial derivative"
        correct: false
        category: misapplied_technique
        feedback: "Added terms can affect a partial when they contain the moving input. Here $e^y$ contributes to the partial in $y$, but not in $x$."
    solution: "With $y$ held fixed, $e^y$ is just a number, and the derivative of a constant is 0."
  - id: pdp-exp-log
    dimension: math
    type: expression
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For $g(x, y) = y\\,e^x + x\\ln y$, give $\\frac{\\partial g}{\\partial y}$ (write `exp(x)` and `log(y)`)."
    answer: "exp(x) + x/y"
    variables: { x: [-1, 1], y: [0.5, 3] }
    common_wrong:
      - {
          answer: "y*exp(x) + log(y)",
          category: misunderstood_definition,
          feedback: "That is $\\partial g/\\partial x$. Here $x$ is the constant.",
        }
    hints: ["$e^x$ and $x$ are constants here.", "$\\ln y \\to \\frac1y$."]
    solution: "$y\\,e^x \\to e^x$ and $x\\ln y \\to \\frac{x}{y}$, so $\\frac{\\partial g}{\\partial y} = e^x + \\frac{x}{y}$."
  - id: pdp-product
    dimension: math
    type: expression
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "For $f(x, y) = x^2 e^x y$, give $\\frac{\\partial f}{\\partial x}$ (write `exp(x)`)."
    answer: "y*exp(x)*(2*x + x^2)"
    variables: { x: [-1, 1], y: [-2, 2] }
    common_wrong:
      - {
          answer: "2*x*exp(x)*y",
          category: misunderstood_definition,
          feedback: "Both $x^2$ and $e^x$ contain $x$, so you need the product rule $u'v + uv'$.",
        }
    hints: ["$y$ is a constant multiple.", "Use the product rule on $x^2 e^x$."]
    solution: "Keep $y$ in front and use the product rule on $x^2 e^x$: $y(2x e^x + x^2 e^x) = y\\,e^x(2x + x^2)$."
  - id: pdp-compute-y
    dimension: math
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x, y) = 4x^3 y^2 + 2x - 7y$, give $\\frac{\\partial f}{\\partial y}$."
    answer: "8*x^3*y - 7"
    variables: { x: [-2, 2], y: [-2, 2] }
    common_wrong:
      - {
          answer: "8*x^3*y + 2 - 7",
          category: misunderstood_definition,
          feedback: "$2x$ has no $y$ in it, so it contributes 0.",
        }
    solution: "$4x^3 y^2 \\to 8x^3 y$, $2x \\to 0$ and $-7y \\to -7$, so $\\frac{\\partial f}{\\partial y} = 8x^3 y - 7$."
  - id: pdp-gap-w
    dimension: math
    type: expression
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A house-price model predicts $wx + b$ for a house of area $x$ that sold for $y$. Its squared error is $f(w, b) = (wx + b - y)^2$. Keeping $x$ and $y$ fixed, give $\\frac{\\partial f}{\\partial w}$ in terms of $w$, $b$, $x$ and $y$."
    answer: "2*(w*x + b - y)*x"
    variables: { w: [-2, 2], b: [-2, 2], x: [-2, 2], y: [-2, 2] }
    common_wrong:
      - {
          answer: "2*(w*x + b - y)",
          category: math_error,
          feedback: "That is $\\partial f/\\partial b$. The error $wx + b - y$ changes at rate $x$ with $w$, not 1.",
        }
    hints:
      [
        "Write the error as $e = wx + b - y$, so $f = e \\cdot e$ and the product rule gives $\\frac{\\partial f}{\\partial w} = 2e\\,\\frac{\\partial e}{\\partial w}$.",
        "$\\frac{\\partial e}{\\partial w} = x$.",
      ]
    solution: "With the error $e = wx + b - y$, the product rule gives $2e \\cdot \\frac{\\partial e}{\\partial w} = 2(wx + b - y)\\,x$."
  - id: pdp-gap-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Let $f(w, b) = (wx + b - y)^2$ with $x = {{=x}}$ and $y = {{=y}}$. At $w = {{=w}}$, $b = {{=b}}$, what is $\\frac{\\partial f}{\\partial w}$?"
    hints:
      ["First compute the error $e = wx + b - y$.", "$\\frac{\\partial f}{\\partial w} = 2e\\,x$."]
    solution: "The error is ${{=w}} \\times {{=x}} + {{=b}} - {{=y}} = {{=w*x+b-y}}$, so $\\frac{\\partial f}{\\partial w} = 2 \\times {{=w*x+b-y}} \\times {{=x}} = {{=2*(w*x+b-y)*x}}$."
    answer_expr: "2 * (w*x + b - y) * x"
    params:
      x: { min: 2, max: 5, step: 1 }
      y: { min: 1, max: 9, step: 1 }
      w: { min: 1, max: 3, step: 1 }
      b: { min: 0, max: 4, step: 1 }
    constraints: ["w*x + b - y != 0", "x != 1", "x != 2"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "2 * (w*x + b - y)",
          category: math_error,
          feedback: "You dropped the factor $x = {{=x}}$: the error changes at rate $x$ with $w$.",
        }
      - {
          answer_expr: "(w*x + b - y) * x",
          category: math_error,
          feedback: "Don't forget the factor 2 from the square.",
        }
  - id: pdp-gap-b
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Let $f(w, b) = (wx + b - y)^2$ with $x = 2$ and $y = 9$. At $w = 3$, $b = 1$, what is $\\frac{\\partial f}{\\partial b}$?"
    answer: -4
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 4,
          category: math_error,
          feedback: "Check the sign of the error: $6 + 1 - 9 = -2$.",
        }
      - {
