        }
    hints: ["The error is $e = 3 \\cdot 2 + 1 - 9$.", "$\\frac{\\partial f}{\\partial b} = 2e$."]
    solution: "The error is $6 + 1 - 9 = -2$, so $\\frac{\\partial f}{\\partial b} = 2 \\times (-2) = -4$."
  - id: pdp-why-data-fixed
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "A house-price model predicts $wx + b$, with adjustable numbers $w$ and $b$. The house has area $x = 3$ and recorded sale price $y = 1$. Why do we keep $x$ and $y$ constant when using $f(w, b) = (wx + b - y)^2$ to improve the model?"
    options:
      - id: a
        text: "They are recorded facts about the house; we can adjust the model's $w$ and $b$ instead"
        correct: true
      - id: b
        text: "Holding the data fixed makes their values 0 in the error"
        correct: false
        category: misunderstood_definition
        feedback: "They are held at their actual values, such as $x = 3$ and $y = 1$, not set to 0."
      - id: c
        text: "Every input to a price formula must stay fixed, including $w$ and $b$"
        correct: false
        category: misunderstood_definition
        feedback: "The house's facts stay fixed, but the model's adjustable numbers can change. Keeping those fixed too would prevent any improvement."
      - id: d
        text: 'They aren''t; you also need $\partial f / \partial x$ to shrink the error'
        correct: false
        category: incorrect_reasoning
        feedback: "You cannot change the house's area or recorded sale price to improve the model. You need the rates of change for $w$ and $b$ instead."
    solution: "The area and sale price are fixed facts about the house. To improve the model, calculate how its error changes with the adjustable numbers $w$ and $b$."
  - id: pdp-turn-dial
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "A house-price model's squared error $f(w, b)$ depends on its adjustable numbers $w$ and $b$. You find $\\frac{\\partial f}{\\partial w} = 18$ and $\\frac{\\partial f}{\\partial b} = 6$. Compare changes of the same small amount to just one number. Which reduces $f$ the most?"
    options:
      - { id: a, text: "Decrease $w$ a little", correct: true }
      - id: b
        text: "Increase $w$ a little"
        correct: false
        category: incorrect_reasoning
        feedback: "The positive partial derivative means that increasing $w$ slightly raises the error, rather than reducing it."
      - id: c
        text: "Decrease $b$ a little"
        correct: false
        category: incorrect_reasoning
        feedback: "That reduces the error, but decreasing $w$ by the same small amount reduces it about 3 times as much, since $18 = 3 \\times 6$."
      - id: d
        text: "Increase $b$ a little"
        correct: false
        category: incorrect_reasoning
        feedback: "The positive partial derivative means that increasing $b$ slightly raises the error."
    solution: "Both partial derivatives are positive, so a small decrease in either number reduces the error. The rate for $w$ is 18 rather than 6, so the same small decrease in $w$ reduces the error more."
  - id: pdp-three-inputs
    dimension: math
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x, y, z) = x y z + 2y^2 - z$, give $\\frac{\\partial f}{\\partial z}$."
    answer: "x*y - 1"
    variables: { x: [-2, 2], y: [-2, 2], z: [-2, 2] }
    common_wrong:
      - {
          answer: "x*y + 4*y - 1",
          category: misunderstood_definition,
          feedback: "$2y^2$ has no $z$ in it, so it contributes 0.",
        }
    solution: "Freeze $x$ and $y$: $xyz \\to xy$, $2y^2 \\to 0$ and $-z \\to -1$, so $\\frac{\\partial f}{\\partial z} = xy - 1$."
  - id: pdp-flat-weight
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A machine's running cost depends on two settings, $a$ and $b$, as $L(a, b) = a^2 - 4ab + 5b^2$. Holding $b = 3$ fixed, at which value of $a$ is the slope along $a$, $\\frac{\\partial L}{\\partial a}$, equal to $0$?"
    answer: 6
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 12,
          category: math_error,
          feedback: "The derivative of $a^2$ with respect to $a$ is $2a$, not $a$.",
        }
      - {
          answer: 7.5,
          category: misunderstood_definition,
          feedback: "That sets $\\frac{\\partial L}{\\partial b}$ to zero. Differentiate with respect to $a$, holding $b$ fixed.",
        }
    hints:
      - "Treat $b$ as a constant: $\\frac{\\partial L}{\\partial a} = 2a - 4b$."
      - "Put $b = 3$ and set the result to zero."
    solution: |
      Hold $b$ fixed and differentiate with respect to $a$; the $5b^2$ term does not change:

      $$\frac{\partial L}{\partial a} = 2a - 4b$$

      Put $b = 3$:

      $$\frac{\partial L}{\partial a} = 2a - 12$$

      Set it to zero:

      $$2a - 12 = 0$$

      $$a = 6$$
  - id: pdp-sensor-gain
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A robot's distance sensor gives a raw reading $r$. Its calibration turns this into a distance $gr + c$, with an adjustable gain $g$ and offset $c$. Tested against an object at known distance $t$, the squared error is $f(g, c) = (gr + c - t)^2$. In one test $r = 4$ and $t = 10$. At $g = 2$ and $c = 1$, what is $\\frac{\\partial f}{\\partial g}$?"
    answer: -8
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -2,
          category: misapplied_technique,
          feedback: "That is $\\frac{\\partial f}{\\partial c}$. The gain multiplies $r$, so its partial has an extra factor $r = 4$.",
        }
      - {
          answer: -1,
          category: math_error,
          feedback: "That is the calibration error $gr + c - t$. Multiply by 2 and by $r$ to get the partial in $g$.",
        }
    hints:
      - "The reading $r$ and the distance $t$ are recorded facts; $g$ and $c$ are the adjustable numbers."
      - "Hold $c$ fixed: $\\frac{\\partial f}{\\partial g} = 2(gr + c - t)\\,r$."
    solution: |
      Treat $r$, $t$ and $c$ as fixed and differentiate with respect to $g$:

      $$\frac{\partial f}{\partial g} = 2(gr + c - t)\,r$$

      The calibration error is:

      $$gr + c - t = 2 \cdot 4 + 1 - 10 = -1$$

      So:

      $$\frac{\partial f}{\partial g} = 2 \cdot (-1) \cdot 4 = -8$$

      Raising the gain a little would lower the error, because the sensor currently reads short.
  - id: pdp-freeze-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In step 2 of the worked example, why does the $2.25$ contribute $0$ to the slope in $y$?"
    options:
      - id: a
        text: "Holding $x$ fixed means setting $x$ to $0$, so the $x^2$ term vanishes from the function entirely."
        correct: false
        category: misunderstood_definition
        feedback: "Fixed does not mean zero: $x$ stays at $1.5$, which is why the term is $2.25$ rather than $0$."
      - id: b
        text: "Any squared term has derivative $0$ at a point, so $x^2$ adds nothing to either partial derivative."
        correct: false
        category: misapplied_technique
        feedback: "Squared terms do have slopes: $x^2$ gives the $2x=3$ slope along $x$. It adds nothing only when $x$ is the frozen input."
      - id: c
        text: "With $x$ frozen at $1.5$, the $x^2$ term is the fixed number $2.25$, which does not change as $y$ moves."
        correct: true
        feedback: "A fixed number has derivative $0$, so only $2y^2$ contributes to the slope in $y$."
      - id: d
        text: "Only the larger term of $f$ at $P$ affects the slope, and $2y^2$ is the larger one when $y$ equals $1$."
        correct: false
        category: incorrect_reasoning
        feedback: "Size has nothing to do with it; in fact $2.25$ is larger than $2y^2=2$ at $P$. What matters is whether the term changes as $y$ moves."
    solution: "With $x$ frozen at $1.5$, $x^2$ is the constant $2.25$. A constant does not change as $y$ moves, so its derivative is $0$."
  - id: pdp-constant-factor-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In step 1 of the worked example, why does $x^2y$ give $2xy$ rather than $2x$?"
    options:
      - id: a
        text: "Both inputs are differentiated at once, and the two separate results are then multiplied together."
        correct: false
        category: misunderstood_definition
        feedback: "Only $x$ moves in $\\partial f/\\partial x$. Differentiating $y$ too would give $2x\\cdot1$, not $2xy$."
      - id: b
        text: "$y$ is held fixed, so it is a constant factor that stays in place, like the $5$ in $5x^2$."
        correct: true
        feedback: "A constant factor carries through the derivative, so $x^2y$ becomes $2x\\cdot y$."
      - id: c
        text: "$y$ is set to $1$ while it is held fixed, and its letter is written back in at the very end."
        correct: false
        category: misunderstood_definition
        feedback: "A held input keeps whatever value it has; it is not set to $1$. It simply behaves as a constant."
      - id: d
        text: "Every term of a partial derivative must contain both inputs, so a factor $y$ is added to complete it."
        correct: false
        category: incorrect_reasoning
        feedback: "Terms can lose inputs: $5y$ gives $0$ in $x$ and $x^3$ gives $3x^2$. The $y$ stays only because it was a factor already."
    solution: "With $y$ held fixed, $x^2y$ is a constant $y$ times $x^2$. The constant factor stays, so the partial in $x$ is $2x\\cdot y=2xy$."
  - id: pdp-error-rate-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In step 2 of the worked example, why does the error $e$ change at rate $2$ per unit of $w$?"
    options:
      - id: a
        text: "The error is $-4$, and every parameter changes the error at half the error's size."
        correct: false
        category: misunderstood_definition
        feedback: "The error's value is $-4$, but its rate depends on the parameter: $2$ for $w$ and $1$ for $b$."
      - id: b
        text: "The current weight is $w=1$, so the rate is that weight times the area, $1\\times2$."
        correct: false
        category: math_error
        feedback: "The current value of $w$ does not appear in the rate: $wx$ changes by $x=2$ per unit of $w$ wherever $w$ starts."
      - id: c
        text: "A weight always changes the error twice as fast as the bias, whatever the house."
        correct: false
        category: incorrect_reasoning
        feedback: "The $2$ here is the area. For a house with area $5$, the rate would be $5$."
      - id: d
        text: "$w$ multiplies the house's area, $2$, and $b$ stays frozen while $w$ moves."
        correct: true
        feedback: "Only the term $wx$ changes, and it changes by $x=2$ for each unit of $w$."
    solution: "In $e=wx+b-y$, only $wx$ contains $w$. With $b$ frozen and the area $x=2$ fixed, $e$ changes by $2$ for each unit of $w$."
  - id: pdp-bias-zero
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A house-price model has three weights and a bias. For a house with area $12$, $3$ bedrooms and age $20$ that sold for $330$, its loss is $L=(12w_1+3w_2+20w_3+b-330)^2$. Keep the weights at $w_1=25$, $w_2=10$, $w_3=-1$. At which bias $b$ is $\\frac{\\partial L}{\\partial b}=0$?"
    answer: 20
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -20,
          category: math_error,
          feedback: "Check the sign: with these weights the error is $310+b-330=b-20$, which is zero when $b=20$.",
        }
      - {
          answer: 0,
          category: misunderstood_definition,
          feedback: "At $b=0$ the partial is $2(-20)=-40$, not $0$. Set the error $b-20$ to zero instead.",
        }
    hints:
      - "$\\frac{\\partial L}{\\partial b}=2e$, where $e=12w_1+3w_2+20w_3+b-330$."
      - "With these weights, $e=310+b-330$. Set it to zero."
    solution: |
      The bias partial is twice the error:

      $$\frac{\partial L}{\partial b}=2e$$

      With these weights the error is:

      $$e=310+b-330=b-20$$

      It is zero when the prediction equals the price:

      $$b=20$$
