  - id: gdp-recall-downhill-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gd-downhill-update
    difficulty: 1
    est_minutes: 0.5
    prompt: A parameter has a negative loss slope at its current value. What does a gradient descent step with a positive learning rate do?
    options:
      - id: a
        text: It lowers the parameter.
        correct: false
        feedback: Lowering a parameter with a negative slope moves locally uphill.
      - id: b
        text: It leaves the parameter fixed.
        correct: false
        feedback: A zero slope gives no change in that parameter.
      - id: c
