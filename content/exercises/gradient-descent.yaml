  - id: gdp-recall-downhill-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: gd-downhill-update
    difficulty: 1
    est_minutes: 0.5
    prompt: Write the updated value of one parameter $p$ when its current loss slope is $g$ and the learning rate is $\eta$. Type `eta` for the learning rate.
    answer: p-eta*g
    variables:
      p:
        - -5
        - 5
      eta:
        - 0.01
        - 0.2
      g:
        - -8
        - 8
    solution: "Subtract the learning rate times the slope: $p_{\\text{new}}=p-\\eta g$."
  - id: gdp-recall-rate-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: gd-step-size
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what happens when a learning rate is too small, and what can happen when it is too large?
    rubric:
      - id: first
        criterion: Explain that a learning rate that is too small makes the loss fall slowly.
        weight: 1
        required: true
      - id: second
        criterion: Explain that a learning rate that is too large can overshoot and make the loss grow.
        weight: 1
        required: true
    exemplar: A very small learning rate makes slow progress. A rate that is too large can overshoot the bottom and make the loss grow.
  - id: gdp-recall-rate-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gd-step-size
    difficulty: 1
    est_minutes: 0.5
    prompt: "During gradient descent on $f(w)=w^2$, the weight changes sign on each step while the loss falls each time. What does this show?"
    options:
      - id: a
        text: Training is diverging on these steps.
        correct: false
        feedback: Divergence means overshoots land further away and the loss grows.
      - id: b
        text: The steps are overshooting while improving the loss.
        correct: true
        feedback: A step can cross the bottom and still land at a lower loss.
      - id: c
        text: The learning rate is too small to move the weight.
        correct: false
        feedback: A rate that is too small makes the weight creep towards the bottom from one side without crossing it.
    solution: Changing sides can accompany a falling loss. A growing loss is the warning sign.
  - id: gdp-recall-rate-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: gd-step-size
    difficulty: 1
    est_minutes: 0.5
    prompt: For the loss $f(w)=w^2$, write the weight after one gradient descent step from $w$ with learning rate $\eta$. Type `eta` for the learning rate.
    answer: (1-2*eta)*w
    variables:
      w:
        - -8
        - 8
      eta:
        - 0.05
        - 0.95
    solution: The slope is $2w$, so the new weight is $w-2\eta w=(1-2\eta)w$.
  - id: gdp-recall-gradients-say
