        correct: false
        feedback: A loss with several dips can have a deeper dip elsewhere.
      - id: b
        text: Training must still be using its initial slopes.
        correct: false
        feedback: Even freshly recalculated slopes can become zero at a nearby dip.
      - id: c
        text: Training may have reached a nearby dip.
        correct: true
        feedback: Gradient descent uses the local slopes and can stop in a dip with a deeper one elsewhere.
