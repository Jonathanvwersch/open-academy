  - id: gdp-recall-loop-contrast2
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gd-training-loop
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: A model trains with gradient descent. Its loss is still high and has fallen only a little since training began. Its weights and bias move only a little on each update. What could explain this pattern?
    options:
      - id: a
        text: A small learning rate or shallow slopes of the loss with respect to the weights and bias.
        correct: true
        feedback: The learning rate multiplies each slope of the loss with respect to a weight or the bias. A small factor in that product can make the parameter move very little.
      - id: b
        text: A small learning rate gives the same small change on every update, whatever the slopes.
        correct: false
        feedback: Even at a fixed learning rate, the amount each weight and bias moves changes with the corresponding slope.
      - id: c
        text: Training has finished because a tiny drop in loss always means the model has converged.
        correct: false
        feedback: A tiny drop can be a stopping signal after the loss has already fallen substantially. Here the loss has stayed high, so check why the weights and bias are barely moving.
    solution: Gradient descent multiplies each slope of the loss with respect to a weight or the bias by the learning rate. A small learning rate or shallow slopes can make the weights and bias move very little even while the loss is high.
  - id: gd-review-square-loss-code
    dimension: implementation
    type: mc
    role: review
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: A Python training loop stores one example's target in `y` and its signed error in `e`. The signed error is the prediction minus the target. Which line computes the squared-error loss?
    options:
      - id: a
        text: "`loss = (e + y) ** 2`"
        correct: false
        feedback: Adding the target back recovers the prediction. Squaring it ignores how far it is from the target.
      - id: b
        text: "`loss = e ** 2`"
        correct: true
        feedback: Squaring the signed miss gives the loss for this example.
      - id: c
        text: "`loss = (e - y) ** 2`"
        correct: false
        feedback: The error already subtracts the target. Subtracting it again can give a nonzero loss even for a perfect prediction.
    solution: Use `e ** 2` to turn the signed miss into a squared error.
  - id: gd-review-stale-error-code
    dimension: implementation
    type: mc
    role: review
    difficulty: 2
    est_minutes: 1
    prompt: |
      This Python loop trains a model with weight `w` and squared-error loss. The input `x`, target `y` and learning rate `lr` stay fixed. The variable `step` counts loop passes, `e` holds the prediction error and `dw` holds the loss slope for the weight. Which edit ensures that every pass updates `w` using the loss slope at the start of that pass?

      ```python
      e = w * x - y
      for step in range(4):
          dw = 2 * e * x
          w = w - lr * dw
      ```
    options:
      - id: a
        text: Move the assignment to `e` inside the loop before the assignment to `dw`.
        correct: true
        feedback: The loop then recomputes the error using the weight at the start of each pass.
      - id: b
        text: Move the assignment to `dw` outside the loop just after the assignment to `e`.
        correct: false
        feedback: Computing the slope once makes every pass reuse the starting slope.
      - id: c
        text: Move the assignment to `w` outside the loop just after the assignment to `dw`.
        correct: false
        feedback: The model would only update once, after repeatedly computing the same slope.
    solution: Recompute the prediction error inside the loop before finding the slope. Each update changes the weight used on the next pass.
  - id: gd-review-average-slopes-code
    dimension: implementation
    type: mc
    role: review
    difficulty: 3
    est_minutes: 2
    prompt: A Python program computes the slope of each example's squared error with respect to the current model weight `w`. It stores those slopes in `dw_a` and `dw_b`, one per example. Which line takes one gradient descent step on the mean squared error for the two examples with learning rate `lr`?
    options:
      - id: a
        text: "`w = w - lr * (dw_a + dw_b)`"
        correct: false
        feedback: The sum makes the step twice as large as the mean slope calls for.
      - id: b
        text: "`w = w + lr * (dw_a + dw_b) / 2`"
        correct: false
        feedback: Adding the scaled slope steps uphill when the mean slope is nonzero.
      - id: c
        text: "`w = w - lr * (dw_a + dw_b) / 2`"
        correct: true
        feedback: This subtracts the learning rate times the average slope.
    solution: Take the mean of the two slopes, multiply by the learning rate and subtract that amount from the weight.
