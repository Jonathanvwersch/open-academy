concept: gradient-descent
exercises:
  - id: gd-check-step
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "$L(w) = (w - 3)^2$, $w_0 = 3.5$, $\\eta = 0.25$. What is $w_1$?"
    answer: 3.25
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 3.75,
          tolerance: { abs: 0.001 },
          category: incorrect_reasoning,
          feedback: "You stepped *up* the slope. The update subtracts $\\eta L'(w)$.",
        }
    hints: ["$L'(3.5) = 2(0.5) = 1$."]
    solution: "$w_1 = 3.5 - 0.25\\cdot 1 = 3.25$."
  - id: gd-faded-step
    dimension: math
    type: numeric
    role: check
    difficulty: 2
    est_minutes: 3
    prompt: "Data $(1, 2), (2, 4)$; model $\\hat y = wx$; MSE; $\\eta = 0.1$; $w_0 = 1$. What is $w_1$?"
    answer: 1.5
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 0.5,
          tolerance: { abs: 0.001 },
          category: incorrect_reasoning,
          feedback: "Sign error: the gradient is negative, so $w$ should *increase*.",
        }
      - {
          answer: 2,
          tolerance: { abs: 0.001 },
          category: math_error,
          feedback: "Check the $\\frac{2}{n}$ factor: here it is $2/2 = 1$, which gives a gradient of $-5$.",
        }
    hints:
      [
        "Residuals are $(-1, -2)$.",
        "$\\partial L/\\partial w = \\frac{2}{2}\\big((-1)(1) + (-2)(2)\\big) = -5$.",
      ]
    solution: "Gradient $-5$, so $w_1 = 1 + 0.5 = 1.5$."
  - id: dx-ml-4
    dimension: math
    type: numeric
    role: diagnostic
    difficulty: 2
    est_minutes: 2
    prompt: "One gradient-descent step on $L(w) = (w - 3)^2$ from $w_0 = 0$ with learning rate $\\eta = 0.1$. What is $w_1$?"
    answer: 0.6
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -0.6,
          tolerance: { abs: 0.001 },
          category: incorrect_reasoning,
          feedback: "The update subtracts the gradient: $w - \\eta L'(w)$, and $L'(0) = -6$.",
        }
      - {
          answer: 0.3,
          tolerance: { abs: 0.001 },
          category: math_error,
          feedback: "$L'(w) = 2(w-3)$, so the factor 2 matters.",
        }
    solution: "$L'(0) = -6$, so $w_1 = 0 - 0.1\\cdot(-6) = 0.6$."
  - id: gd-lr-regimes
    dimension: math
    type: numeric
    role: core
    difficulty: 3
    est_minutes: 3
    prompt: "For $L(w) = 4(w - 1)^2$, gradient descent converges only for learning rates below some threshold $\\eta_{\\max}$. What is $\\eta_{\\max}$?"
    answer: 0.25
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 0.125,
          tolerance: { abs: 0.001 },
          category: misunderstood_definition,
          feedback: "$1/(2a) = 0.125$ is where the iterates start to *oscillate*; they still converge until $1/a$.",
        }
    hints:
      [
        "Write the step as $w_{t+1} - 1 = (1 - 2a\\eta)(w_t - 1)$ with $a = 4$.",
        "Convergence needs $|1 - 8\\eta| < 1$.",
      ]
    solution: "$|1 - 8\\eta| < 1 \\iff 0 < \\eta < 0.25$."
  - id: gd-curve-diagnosis
    dimension: transfer
    type: mc
    role: transfer
    difficulty: 3
    est_minutes: 3
    prompt: "While training a small layered model, its error goes 2.30 → 1.90 → 3.10 → 8.70 → 41.2 → not a number over five steps. What is the most likely cause, and what is the first fix to try?"
    options:
      - {
          id: a,
          text: "The learning rate is too high and updates overshoot and diverge; reduce it (e.g. ×0.1)",
          correct: true,
        }
      - {
          id: b,
          text: "The model is underfitting; add more layers",
          correct: false,
          category: misapplied_technique,
        }
      - {
          id: c,
          text: "The loss is improving slowly; increase the step size",
          correct: false,
          category: misapplied_technique,
          feedback: "The loss first decreases, then grows rapidly, so the steps are too large rather than too small.",
        }
      - {
          id: d,
          text: "The learning rate is too low",
          correct: false,
          category: incorrect_reasoning,
          feedback: "A low learning rate gives a slow, smooth decrease, not growth.",
        }
    solution: "A loss that decreases once and then grows geometrically is the signature of $|1 - 2a\\eta| > 1$ in the steepest direction. Lower the learning rate, and check the input scaling."
  - id: gd-curve-slow
    dimension: transfer
    type: mc
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "A loss curve decreases smoothly but very slowly and almost linearly, still far from converged after 10,000 steps; doubling the learning rate makes it noticeably faster and still smooth. What is going on?"
    options:
      - {
          id: a,
          text: "The learning rate is too small; keep increasing it until just below where it becomes unstable",
          correct: true,
        }
      - {
          id: b,
          text: "The learning rate is too large",
          correct: false,
          category: incorrect_reasoning,
        }
      - {
          id: c,
          text: "The gradient computation is wrong",
          correct: false,
          category: incorrect_reasoning,
          feedback: "A wrong gradient usually fails to decrease the loss at all, or behaves erratically.",
        }
    solution: "Smooth and slow means you are far inside the stable region. Raise the learning rate."
  - id: gd-code-complete
    dimension: implementation
    type: code_complete
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "Complete the gradient for MSE with predictions `y_hat = X @ w` (`X`: `(n, d)`, `y`: `(n,)`)."
    code: |
      r = X @ w - y
      dw = ____
      w = w - lr * dw
    accept:
      [
        "2 * X.T @ r / len(y)",
        "2*X.T@r/len(y)",
        "2 * X.T @ r / n",
        "2 / len(y) * X.T @ r",
        "2 * X.T.dot(r) / len(y)",
        "(2 / len(y)) * X.T @ r",
        "2 * X.T @ r / X.shape[0]",
      ]
    hints: ["$\\nabla_w \\frac1n\\|Xw - y\\|^2 = \\frac2n X^\\top(Xw - y)$."]
    solution: "`dw = 2 * X.T @ r / len(y)`. The shape check: `X.T` is `(d, n)` and `r` is `(n,)`, so `dw` is `(d,)`."
  - id: gd-explain-lr
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "Explain to a colleague what the learning rate controls in gradient descent, what happens when it is too small or too large, and how you would tell from a loss curve."
    rubric:
      - {
          id: r1,
          criterion: "Learning rate scales the step taken along the negative gradient",
          weight: 1,
          required: true,
        }
      - { id: r2, criterion: "Too small: slow, smooth, steady decrease", weight: 2, required: true }
      - {
          id: r3,
          criterion: "Too large: overshooting, oscillation or divergence (loss increases / NaN)",
          weight: 2,
          required: true,
        }
      - {
          id: r4,
          criterion: "Mentions that the steepest-curvature direction limits stability (or that the safe range depends on the problem)",
          weight: 1,
        }
    exemplar: "The learning rate is the multiplier on the gradient step. Too small and the loss falls smoothly but painfully slowly; too large and each step overshoots the minimum, so the loss oscillates or explodes, often to NaN. The steepest direction of the loss sets the stability limit, so the right value depends on the problem and the feature scaling."
  - id: lab-linreg-lr-predict
    dimension: transfer
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "In your lab, you trained with lr = 0.01 and it converged smoothly. **Before running it**, predict what happens with lr = 10× larger, then with lr = 100× larger (the lab data has feature variance ≈ 1)."
    options:
      - {
          id: a,
          text: "10×: converges faster, maybe with slight oscillation; 100×: likely diverges (loss grows, may become NaN)",
          correct: true,
        }
      - {
          id: b,
          text: "Both converge 10× and 100× faster",
          correct: false,
          category: incorrect_reasoning,
          feedback: "There is a stability limit: past it the error grows each step.",
        }
      - { id: c, text: "Both diverge", correct: false, category: incorrect_reasoning }
    solution: "With unit-variance features, MSE curvature is about 2, so the stability limit is around $\\eta \\approx 1$. Then 0.1 is fast and safe, while 1.0 sits right at the edge and typically oscillates or diverges once noise and correlated features are included. Check this against your experiment."
  - id: lab-linreg-explain-divergence
    dimension: transfer
    type: explain
    role: core
    difficulty: 3
    est_minutes: 5
    prompt: "Using your loss and parameter-trajectory plots, explain what you observed for the largest learning rate you tried, and *why* it happens in terms of the update rule."
    rubric:
      - {
          id: r1,
          criterion: "Accurately describes the observed curve (e.g. oscillating or exploding loss, zig-zagging parameters)",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Explains overshoot: the step $\\eta\\nabla L$ jumps past the minimum to a point with larger error, which compounds",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Connects to curvature/feature scale or the $|1-2a\\eta|>1$ condition",
          weight: 1,
        }
    exemplar: "At lr=0.5 the loss dropped once and then grew every step until it hit inf, and the weight trajectory zig-zagged across the minimum with growing amplitude. Each step moves by η times the gradient; when η is too large relative to the curvature, the step jumps past the minimum to a point where the error (and so the gradient) is larger, so the next jump is bigger again — the factor |1−2aη| exceeds 1."
  - id: lab-linreg-val-vs-train
    dimension: conceptual
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "In the lab your train MSE is 0.24 and validation MSE is 0.27, with noise variance 0.25. What does this tell you?"
    options:
      - {
          id: a,
          text: "The model is close to the noise floor and generalises well; the small gap is normal sampling variation",
          correct: true,
        }
      - {
          id: b,
          text: "The prediction error on new examples is far above the noise level",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The validation error is 0.27, close to the noise level of 0.25 rather than far above it.",
        }
      - {
          id: c,
          text: "The model is underfitting and needs more features",
          correct: false,
          category: incorrect_reasoning,
        }
    solution: "With noise variance 0.25, no model can do much better than MSE ≈ 0.25 on new data."
  - id: gdp-why-negative-slope
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Why does subtracting a negative loss slope increase the house-price weight and reduce loss for a small enough step?
    options:
      - id: a
        text: The curve tilts down as the weight increases, and subtracting a negative number moves that way
        correct: true
      - id: b
        text: A negative slope means the weight itself must be negative, so subtraction corrects its sign
        correct: false
        category: incorrect_reasoning
        feedback: The slope describes how loss changes, not the sign of the weight. A positive weight can have a negative loss slope too.
      - id: c
        text: Any increase in the weight reduces loss, regardless of how large the step is
        correct: false
        category: incorrect_reasoning
        feedback: The slope describes a local tilt. A large increase can cross the minimum and leave a larger loss.
    solution: A negative slope means a small increase in the weight lowers loss. Subtracting a positive learning rate times that slope increases the weight. For example, slope −6 and rate 0.25 move weight 0 to 1.5 on the house-price bowl, reducing loss from 9 to 2.25.
  - id: gdp-step-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      For the house-price loss $L(w)=(w-3)^2$, the current weight is {{=w}} and the learning rate
      is 0.25. What is the next weight?
    params:
      w:
        min: -2
        max: 2
        step: 1
    answer_expr: w-0.25*2*(w-3)
    tolerance:
      abs: 0.001
    solution:
      "The slope is 2({{=w}} − 3) = {{=2*(w-3)}}. Subtract 0.25 times that slope: {{=w}} − 0.25
      × ({{=2*(w-3)}}) = {{=w-0.25*2*(w-3)}}."
    common_wrong:
      - answer_expr: w+0.25*2*(w-3)
        category: math_error
        feedback: That adds the gradient and moves uphill; the update subtracts it.
  - id: gdp-positive-slope
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      A house-price weight is 4 and the slope of its loss is +2. With a positive learning rate,
      what should a gradient-descent step do?
    options:
      - id: a
        text: Decrease the weight by the rate times 2
        correct: true
      - id: b
        text: Increase the weight by the rate times 2
        correct: false
        category: incorrect_reasoning
        feedback: A positive slope points towards increasing loss, so move in the opposite direction.
      - id: c
        text: Leave the weight unchanged until the slope turns negative
        correct: false
        category: incorrect_reasoning
        feedback: A positive slope is already enough to choose a downhill direction.
    solution:
      Subtracting a positive gradient decreases the weight; the sign rule works on either side
      of the minimum.
  - id: gdp-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: At weight 3, the house-price loss $(w-3)^2$ has slope zero. What does the next
      gradient-descent update do?
    options:
      - id: a
        text: Leaves the weight at 3 because the step is zero
        correct: true
      - id: b
        text: Moves the weight by the learning rate alone
        correct: false
        category: incorrect_reasoning
        feedback: The step is the rate multiplied by the gradient, which is zero here.
      - id: c
        text: Returns the weight to its initial value of 0
        correct: false
        category: incorrect_reasoning
        feedback: The update uses the current weight and gradient, not a reset to the starting value.
    solution: The gradient multiplier is zero, so the weight stays at 3, the minimum of this particular bowl.
  - id: gdp-vector
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A house-price model has an area weight, a bedroom weight and a bias. What does its loss
      gradient contain?
    options:
      - id: a
        text: One loss slope for each of the three parameters
        correct: true
      - id: b
        text: One predicted price for each of the training houses
        correct: false
        category: incorrect_reasoning
        feedback: Predictions have one entry per example; the gradient has one entry per parameter.
      - id: c
        text: One learning rate for each of the training houses
        correct: false
        category: incorrect_reasoning
        feedback: The gradient describes slopes, not step-size settings or individual training examples.
    solution:
      The gradient collects the partial derivatives with respect to the adjustable parameters;
      subtracting its scaled vector updates all of them.
  - id: gdp-repeat
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: After moving the price weight from 0 to 1.5, what should you use for the next step?
    options:
      - id: a
        text: The slope calculated at the new weight of 1.5
        correct: true
      - id: b
        text: The original slope calculated at the weight of 0
        correct: false
        category: incorrect_reasoning
        feedback: The slope changes along the curve; reusing it no longer follows the current loss.
      - id: c
        text: The actual sale price instead of a loss slope
        correct: false
        category: incorrect_reasoning
        feedback: The target helps calculate the error, but is not itself the gradient.
    solution:
      Gradient descent follows the current local slope, so every step requires a fresh slope at
      the current weight.
  - id: gdp-rate-choice
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: For the house-price loss $(w-3)^2$, weights go 0 → 4.5 → 2.25 while losses go 9 → 2.25 →
      0.5625. What is happening?
    options:
      - id: a
        text: The weight crosses the minimum but gets closer each time
        correct: true
      - id: b
        text: The weight diverges because it crosses the minimum
        correct: false
        category: incorrect_reasoning
        feedback: "Crossing is not enough to show divergence: the distance and the loss are shrinking."
      - id: c
        text: The loss oscillates upwards because the weight changes sides
        correct: false
        category: incorrect_reasoning
        feedback: The given losses decrease; oscillating weights need not mean increasing loss.
    solution: "This is damped oscillation: the signed distance changes sign but shrinks in magnitude."
  - id: gdp-factor-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: For $L(w)={{=a}}(w-3)^2$, the learning rate is 0.1. What factor multiplies the signed
      distance from 3 after one update?
    params:
      a:
        min: 1
        max: 8
        step: 1
    answer_expr: 1-0.2*a
    tolerance:
      abs: 0.001
    solution:
      The distance multiplier is 1 − 2 × {{=a}} × 0.1 = {{=1-0.2*a}}. Its sign tells you whether
      the next weight crosses the minimum.
    common_wrong:
      - answer_expr: 1+0.2*a
        category: math_error
        feedback:
          The update subtracts the gradient, so the factor is 1 minus twice the bowl scale times the
          rate.
  - id: gdp-threshold-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: For the bowl $L(w)={{=a}}(w-3)^2$, positive learning rates must be strictly below which
      threshold to converge from a weight other than 3? Give the threshold, not the
      monotonic-approach boundary.
    params:
      a:
        min: 2
        max: 8
        step: 1
    answer_expr: 1/a
    tolerance:
      abs: 0.001
    solution:
      Convergence requires the distance multiplier to have magnitude below 1, giving 0 < rate <
      1/{{=a}}. The upper threshold is {{=1/a}}, with equality excluded.
    common_wrong:
      - answer_expr: 1/(2*a)
        category: math_error
        feedback:
          That boundary separates same-side approach from convergent crossing, not convergence from
          divergence.
  - id: gdp-loss-curve
    dimension: transfer
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      House-price training losses go 10 → 6 → 12 → 40 → 180. What is the first sensible adjustment
      to try?
    options:
      - id: a
        text: Reduce the learning rate and check whether the growth stops
        correct: true
      - id: b
        text: Increase the learning rate because the first step improved
        correct: false
        category: incorrect_reasoning
        feedback: One improving step does not guarantee stability; subsequent growth suggests overshoot.
      - id: c
        text: Keep the rate unchanged because crossing is always harmless
        correct: false
        category: incorrect_reasoning
        feedback: Repeated growing loss is not the shrinking-distance crossing that can converge.
    solution:
      A sharp rise after an initial improvement suggests unstable steps, so try a smaller rate
      before blaming the model.
  - id: gdp-slow
    dimension: transfer
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      The house-price loss decreases smoothly but slowly. Doubling the rate makes it fall faster
      without instability. What does this evidence suggest?
    options:
      - id: a
        text: The old rate was small; try cautious increases while monitoring
        correct: true
      - id: b
        text: The old rate was large; halve it to speed the same progress
        correct: false
        category: incorrect_reasoning
        feedback: The larger rate improved progress without instability, suggesting the original was
          conservative.
      - id: c
        text: Any plateau proves the model has reached the best weights
        correct: false
        category: incorrect_reasoning
        feedback:
          A plateau can mean small steps as well as being near a minimum; the rate comparison gives
          additional evidence.
    solution:
      The controlled rate comparison supports slow steps as the cause; a flat curve alone would
      not establish it.
  - id: gdp-why-learning-rate
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Why does a downhill direction still need a learning rate to control the step on the house-price loss bowl?
    options:
      - id: a
        text: The slope describes the nearby tilt, but a large step can cross the bottom and end farther away
        correct: true
      - id: b
        text: The learning rate changes where the loss bowl's minimum is located
        correct: false
        category: incorrect_reasoning
        feedback: Changing the rate changes the updates, not the loss function or the location of its minimum.
      - id: c
        text: A downhill direction guarantees lower loss, so the rate only controls how quickly you reach it
        correct: false
        category: incorrect_reasoning
        feedback: A direction is downhill only locally. A large enough step can increase loss even when it starts in that direction.
    solution: For the bowl with best weight 3, starting at 0 gives slope −6. Rate 0.25 reaches 1.5 and lowers loss from 9 to 2.25; rate 1.1 reaches 6.6 and raises it to 12.96. Both steps start in the downhill direction, but only the smaller step ends closer.
  - id: gdp-why-input-factor
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Why does each house's contribution to the weight's MSE slope include its input size as well as its residual?
    options:
      - id: a
        text: The same weight nudge changes a larger house's prediction more, so its error has more influence on the slope
        correct: true
      - id: b
        text: Larger houses must always have larger residuals, even when the model predicts them correctly
        correct: false
        category: incorrect_reasoning
        feedback: A large house can have zero residual. Input size describes sensitivity to a weight nudge, not how wrong the current prediction must be.
      - id: c
        text: Multiplying by size removes each residual's sign so all houses push the weight upwards
        correct: false
        category: incorrect_reasoning
        feedback: Multiplication by a positive size keeps the residual's sign. Overpriced and underpriced houses can pull the weight in opposite directions.
    solution: With prediction wx, a weight increase of 0.1 raises predictions by 0.1 for input 1 and 0.2 for input 2. At equal residual −2, the individual squared-error slopes are −4 and −8. Multiplying twice the residual by the input accounts for this difference before averaging over houses.
  - id: gdp-gradient-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      House inputs are 1 and 2, with targets 2 and 4. The no-bias model has weight {{=w}}. What is
      the MSE slope with respect to the weight?
    params:
      w:
        min: -2
        max: 1
        step: 1
    answer_expr: 5*w-10
    tolerance:
      abs: 0.001
    solution: Residuals are {{=w-2}} and {{=2*w-4}}. The slope is (2/2) × (1 × ({{=w-2}}) + 2 ×
      ({{=2*w-4}})) = {{=5*w-10}}.
    common_wrong:
      - answer_expr: (5*w-10)/2
        category: math_error
        feedback:
          You averaged the residual-times-input values but omitted the factor 2 from differentiating
          the square.
  - id: gdp-data-step-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: For the same sales (1, 2) and (2, 4), the no-bias model has weight {{=w}} and MSE slope
      {{=5*w-10}}. At rate 0.1, what is the next weight?
    params:
      w:
        min: -2
        max: 1
        step: 1
    answer_expr: w-0.1*(5*w-10)
    tolerance:
      abs: 0.001
    solution:
      "Subtract rate times slope: {{=w}} − 0.1 × ({{=5*w-10}}) = {{=w-0.1*(5*w-10)}}. A negative
      slope increases the underpricing weight."
    common_wrong:
      - answer_expr: w+0.1*(5*w-10)
        category: math_error
        feedback: That adds the slope and moves in the wrong direction.
  - id: gdp-feature-factor
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Two sales have the same residual of −2, but their scaled sizes are 1 and 2. How do their
      individual weight-slope contributions compare?
    options:
      - id: a
        text: The larger house contributes −8; the smaller contributes −4
        correct: true
      - id: b
        text: Both houses contribute −4 because their errors are equal
        correct: false
        category: incorrect_reasoning
        feedback: A weight changes the larger house prediction twice as much, so input size also matters.
      - id: c
        text: The larger house contributes −4; the smaller contributes −8
        correct: false
        category: incorrect_reasoning
        feedback: The input multiplies the residual, so the larger input has the larger-magnitude
          contribution.
    solution: Twice residual times input gives 2 × (−2) × 1 = −4 and 2 × (−2) × 2 = −8 before averaging.
  - id: gdp-average
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: You repeat every training sale twice. What happens to the MSE gradient at the same parameters?
    options:
      - id: a
        text: It stays the same because contributions and count both double
        correct: true
      - id: b
        text: It doubles because each contribution is now counted twice
        correct: false
        category: incorrect_reasoning
        feedback: The denominator is also doubled, since the loss is a mean.
      - id: c
        text: It halves because the gradient is divided by more houses
        correct: false
        category: incorrect_reasoning
        feedback: The numerator doubles too; the average contribution is unchanged.
    solution:
      Mean-loss gradients average across the examples, so repeating all the same evidence does
      not change the slope.
  - id: gdp-bias-slope
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: House residuals are −2 and −4. What is the MSE slope for a shared bias?
    options:
      - id: a
        text: −6, twice the mean residual
        correct: true
      - id: b
        text: −10, twice the input-weighted mean residual
        correct: false
        category: incorrect_reasoning
        feedback: Input-weighting gives the weight slope for sizes 1 and 2, not the bias slope.
      - id: c
        text: +6, twice the mean absolute residual
        correct: false
        category: incorrect_reasoning
        feedback: The derivative keeps the residual signs; absolute values would lose the downhill direction.
    solution: A bias raises every prediction equally, giving slope 2 × (−2 − 4)/2 = −6.
  - id: gdp-loop-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Which order gives one correct house-price training update?
    options:
      - id: a
        text: Predict, compute residuals, compute all slopes, update parameters
        correct: true
      - id: b
        text: Predict, update parameters, compute residuals, compute all slopes
        correct: false
        category: incorrect_reasoning
        feedback: You need the current residuals and slopes before you can choose the parameter update.
      - id: c
        text: Compute residuals once, then repeatedly apply their first slopes
        correct: false
        category: incorrect_reasoning
        feedback: Residuals change when parameters change, so they must be recomputed in every iteration.
    solution:
      All slopes should describe the same current parameters; after updating, begin again with
      fresh predictions.
  - id: gdp-bias-step-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: The price-model bias is {{=b}} and the current mean residual is −{{=r}}. With MSE and
      learning rate 0.1, what is the next bias?
    params:
      b:
        min: 0
        max: 4
        step: 1
      r:
        min: 1
        max: 6
        step: 1
    answer_expr: b+0.2*r
    tolerance:
      abs: 0.001
    solution:
      The bias slope is 2 × (−{{=r}}) = {{=-2*r}}. The new bias is {{=b}} − 0.1 × ({{=-2*r}}) =
      {{=b+0.2*r}}.
    common_wrong:
      - answer_expr: b+0.1*r
        category: math_error
        feedback: The MSE derivative is twice the mean residual, so include the factor 2.
  - id: gdp-code-gradient
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Complete the vectorised MSE weight gradient. `X` has one row per sale, `r` is the current
      residual array, and `y` contains the targets.
    code: |
      dw = ____
    accept:
      - 2 * X.T @ r / len(y)
      - 2*X.T@r/len(y)
      - (2 / len(y)) * X.T @ r
    solution: "Use `2 * X.T @ r / len(y)`: the transpose adds each feature times its residual across
      sales, and division averages over sales."
  - id: gdp-code-update
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Complete the weight update. `dw` is the gradient at the current weights and `lr` is the
      learning rate.
    code: |
      w = ____
    accept:
      - w - lr * dw
      - w-lr*dw
      - w - dw * lr
    solution: Use `w - lr * dw` to move against the current gradient; adding it would move uphill.
  - id: gdp-why-fresh-errors
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: What goes wrong if the house-price training loop computes residuals `r` once and reuses them for every update?
    options:
      - id: a
        text: The slopes stop reflecting predictions from the current parameters
        correct: true
      - id: b
        text: Nothing goes wrong because the sale prices and house sizes have not changed
        correct: false
        category: incorrect_reasoning
        feedback: The data stays fixed, but the predictions change with the parameters. Residuals compare those current predictions with the targets.
      - id: c
        text: Reusing errors makes the steps shrink automatically as the current predictions improve
        correct: false
        category: incorrect_reasoning
        feedback: Fixed residuals give fixed slopes for this linear model. With a fixed rate, the loop keeps making the same changes instead of shrinking them.
    solution: For the two-house model without bias, weight 0 gives residuals −2 and −4 and slope −10. After a rate-0.1 step to weight 1, the residuals become −1 and −2 and the slope becomes −5. Reusing the old residuals would take another step of 1 instead of 0.5, ignoring the change in the loss surface's tilt.
  - id: gdp-shape
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      For 200 sales and 5 features, `X` has shape `(200, 5)` and `r` has shape `(200,)`. What is
      the shape of `X.T @ r`?
    options:
      - id: a
        text: "`(5,)`, one entry per weight"
        correct: true
      - id: b
        text: "`(200,)`, one entry per sale"
        correct: false
        category: incorrect_reasoning
        feedback: The transpose has shape (5, 200); multiplication sums over sales and leaves features.
      - id: c
        text: "`(200, 5)`, one entry per input value"
        correct: false
        category: incorrect_reasoning
        feedback: The product sums over the 200 residual contributions for each feature.
    solution: The product has one accumulated residual-times-input contribution for each of the five weights.
  - id: gd-explain-training
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt:
      "Explain how you would fit the house-price model with gradient descent: where each update
      comes from, what the loop recomputes, and how you would respond to slow or growing loss."
    rubric:
      - id: r1
        criterion: Subtracts learning rate times current gradient and explains the sign and step-size roles
        weight: 1
        required: true
      - id: r2
        criterion:
          Describes prediction, residual, mean weight and bias gradients, and updates followed by
          recomputation
        weight: 1
        required: true
      - id: r3
        criterion: Distinguishes slow progress, shrinking oscillation and divergence using losses or
          distances, and proposes cautious rate adjustment
        weight: 1
        required: true
    exemplar: I predict the training prices and subtract actual prices to get residuals. For MSE I
      average twice residual times each feature for its weight slope, and twice the residuals for
      the bias slope, then subtract the learning rate times these gradients and recompute
      predictions for the next step. A small rate can be slow; if a cautious increase helps without
      instability I can keep it, whereas growing losses suggest reducing the rate; crossing the
      minimum is not itself failure if distance and loss shrink.
    solution: I predict the training prices and subtract actual prices to get residuals. For MSE I
      average twice residual times each feature for its weight slope, and twice the residuals for
      the bias slope, then subtract the learning rate times these gradients and recompute
      predictions for the next step. A small rate can be slow; if a cautious increase helps without
      instability I can keep it, whereas growing losses suggest reducing the rate; crossing the
      minimum is not itself failure if distance and loss shrink.
