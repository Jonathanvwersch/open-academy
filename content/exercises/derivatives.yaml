concept: derivatives
exercises:
  - id: der-check-power
    dimension: math
    type: expression
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: "Differentiate $f(x) = 5x^3 - 4x^2 + 7$ with respect to $x$."
    answer: "15*x^2 - 8*x"
    variables: { x: [-3, 3] }
    hints: ["Power rule: $\\frac{d}{dx}x^n = n x^{n-1}$; constants differentiate to 0."]
    solution: "$15x^2 - 8x$."
  - id: der-faded-product
    dimension: math
    type: expression
    role: check
    difficulty: 2
    est_minutes: 2
    prompt: "Give $f'(x)$ for $f(x) = x^3 \\ln x$ (write `log(x)` for $\\ln x$)."
    answer: "3*x^2*log(x) + x^2"
    variables: { x: [0.5, 3] }
    common_wrong:
      - {
          answer: "3*x^2*(1/x)",
          category: misunderstood_definition,
          feedback: "The derivative of a product is not the product of the derivatives. Use $u'v + uv'$.",
        }
    hints: ["$v' = 1/x$.", "$uv' = x^3 \\cdot \\frac1x = x^2$."]
    solution: "$f'(x) = 3x^2 \\ln x + x^3\\cdot\\frac1x = 3x^2\\ln x + x^2$."
  - id: dx-math-3
    dimension: math
    type: expression
    role: diagnostic
    difficulty: 2
    est_minutes: 2
    prompt: "Differentiate $f(x) = x^3 e^x$ with respect to $x$ (write `exp(x)` or `e^x`)."
    answer: "3*x^2*exp(x) + x^3*exp(x)"
    variables: { x: [-2, 2] }
    common_wrong:
      - {
          answer: "3*x^2*exp(x)",
          category: misunderstood_definition,
          feedback: "This is a product, so you need both terms of the product rule.",
        }
    solution: "Product rule: $3x^2e^x + x^3e^x = e^x(x^3 + 3x^2)$."
  - id: der-quotient
    dimension: math
    type: expression
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "Differentiate $f(x) = \\dfrac{1}{1 + x^2}$."
    answer: "-2*x/(1+x^2)^2"
    variables: { x: [-3, 3] }
    common_wrong:
      - {
          answer: "1/(2*x)",
          category: misunderstood_definition,
          feedback: "You cannot differentiate the denominator separately. Use the quotient rule, or the chain rule on $(1 + x^2)^{-1}$.",
        }
      - {
          answer: "2*x/(1+x^2)^2",
          category: math_error,
          feedback: "Check the sign: $f$ decreases for $x > 0$, so $f'(x)$ must be negative there.",
        }
    hints:
      [
        "Write it as $(1 + x^2)^{-1}$, or use the quotient rule with $g = 1$, $h = 1 + x^2$.",
        "$g' = 0$ and $h' = 2x$.",
      ]
    solution: "$(0\\cdot(1+x^2) - 1\\cdot 2x)/(1+x^2)^2 = -2x/(1+x^2)^2$."
  - id: der-value
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x) = 3x^4 - 2x + \\ln x$, what is $f'(1)$?"
    answer: 11
    tolerance: { abs: 0.001 }
    hints: ["$f'(x) = 12x^3 - 2 + 1/x$."]
    solution: "$12 - 2 + 1 = 11$."
  - id: der-review-exp-log
    dimension: math
    type: expression
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "Differentiate $f(x) = 2e^x - 3\\ln x$ (write `exp(x)` and `log(x)`)."
    answer: "2*exp(x) - 3/x"
    variables: { x: [0.5, 3] }
    solution: "$2e^x - 3/x$."
  - id: der-sensitivity
    dimension: conceptual
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "A loss satisfies $L(5) = 2.0$ and $L'(5) = -0.4$. **Estimate** $L(5.1)$ using the derivative."
    answer: 1.96
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 2.04,
          category: incorrect_reasoning,
          feedback: "A negative derivative means the loss *decreases* as $x$ increases.",
        }
    hints: ["Linear approximation: $L(x + h) \\approx L(x) + L'(x)\\,h$."]
    solution: "$L(5.1) \\approx 2.0 + (-0.4)(0.1) = 1.96$. This first-order picture is exactly what gradient descent relies on."
