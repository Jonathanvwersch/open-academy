concept: derivatives
exercises:
  - id: der-speed-at-instant-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is a derivative?"
    options:
      - {
          id: a,
          text: "The total output change across a wide input interval, rather than the rate at one point.",
          correct: false,
          feedback: "That is the change over a whole stretch; a derivative gives the rate at one input value.",
        }
      - {
          id: b,
          text: "The average output value across several input settings, rather than the speed of change.",
          correct: false,
          feedback: "An average output summarizes values; a derivative measures how output changes locally.",
        }
      - {
          id: c,
          text: "How fast a function's output changes for each unit of input, at one particular input value",
          correct: true,
          feedback: "The derivative gives the local output rate per input unit at the specified input value.",
        }
      - {
          id: d,
          text: "The input value where a function reaches its minimum, rather than how fast it changes at one point.",
          correct: false,
          feedback: "That is where the output is lowest; the derivative is a rate measured at an input.",
        }
    solution: "A derivative is the rate at which a function's output changes for each unit of input at one point."
  - id: der-power-rule-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does the power rule say about $x^n$?"
    options:
      - {
          id: a,
          text: "Its derivative is $x^{n+1}/(n+1)$ for every fixed power.",
          correct: false,
          feedback: "That raises the power; differentiating lowers it by one and brings the old power down in front.",
        }
      - {
          id: b,
          text: "Its derivative is $nx^n$ because the exponent stays unchanged.",
          correct: false,
          feedback: "The power rule lowers the exponent by one.",
        }
      - {
          id: c,
          text: "Its derivative is $x^{n-1}$ because the power only lowers the exponent.",
          correct: false,
          feedback: "That omits the required multiplier $n$ from the power rule.",
        }
      - {
          id: d,
          text: "Its derivative is $nx^{n-1}$ for a fixed power $n$.",
          correct: true,
          feedback: "The exponent becomes a multiplier and then drops by one in the derivative.",
        }
    solution: "For a fixed power $n$, the derivative of $x^n$ is $nx^{n-1}$."
  - id: der-exp-log-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does the natural logarithm $\\ln x$ ask?"
    options:
      - {
          id: a,
          text: "Which positive number multiplied by itself gives the input $x$.",
          correct: false,
          feedback: "That asks for a square root; the logarithm asks for an exponent on base $e$.",
        }
      - {
          id: b,
          text: "Which power of the input $x$ gives the base $e$.",
          correct: false,
          feedback: "That uses $x$ as the base; $\\ln x$ asks which power of $e$ gives $x$.",
        }
      - {
          id: c,
          text: "Which power of $e$ equals the positive input $x$.",
          correct: true,
          feedback: "The logarithm is the exponent on $e$ that produces a positive input $x$.",
        }
      - {
          id: d,
          text: "Which rate describes how quickly $e^x$ changes at each input value.",
          correct: false,
          feedback: "That asks about a derivative; $\\ln x$ returns an exponent for a positive input.",
        }
    solution: "The natural logarithm asks which power of $e$ equals the positive input $x$."
  - id: der-product-quotient-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What do the product and quotient rules differentiate?"
    options:
      - {
          id: a,
          text: "A sum of two changing functions and a constant.",
          correct: false,
          feedback: "The sum rule handles separate terms; product and quotient rules handle multiplication and division.",
        }
      - {
          id: b,
          text: "A changing part times a constant, or a constant over a function.",
          correct: false,
          feedback: "Those use the constant-multiple rule; product and quotient rules cover two changing parts.",
        }
      - {
          id: c,
          text: "A product of two changing parts and a quotient of two functions.",
          correct: true,
          feedback: "Both rules account for changes in both parts of a product, or of a ratio.",
        }
      - {
          id: d,
          text: "A function inside another function, such as $\\ln(3x)$.",
          correct: false,
          feedback: "A function fed into another function needs a different rule; product and quotient rules handle products and ratios.",
        }
    solution: "The product rule differentiates two changing parts, while the quotient rule differentiates their ratio."
  - id: der-check-power
    dimension: math
    type: expression
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: "Differentiate $f(x) = 5x^3 - 4x^2 + 7$ with respect to $x$."
    answer: "15*x^2 - 8*x"
    variables: { x: [-3, 3] }
    hints: ["Power rule: $(x^n)' = n x^{n-1}$; a constant on its own has slope 0."]
    solution: "$15x^2 - 8x$."
  - id: der-faded-product
    dimension: math
    type: expression
    role: check
    difficulty: 2
    est_minutes: 2
    prompt: "Give $f'(x)$ for $f(x) = x^3 \\ln x$ (write `log(x)` for $\\ln x$)."
    answer: "3*x^2*log(x) + x^2"
    variables: { x: [0.5, 3] }
    common_wrong:
      - {
          answer: "3*x^2*(1/x)",
          category: misunderstood_definition,
          feedback: "The derivative of a product is not the product of the derivatives. Use $u'v + uv'$.",
        }
    hints: ["$v' = 1/x$.", "$uv' = x^3 \\cdot \\frac1x = x^2$."]
    solution: "$f'(x) = 3x^2 \\ln x + x^3\\cdot\\frac1x = 3x^2\\ln x + x^2$."
  - id: dx-math-3
    dimension: math
    type: expression
    role: diagnostic
    difficulty: 2
    est_minutes: 2
    prompt: "Differentiate $f(x) = x^3 e^x$ with respect to $x$ (write `exp(x)` or `e^x`)."
    answer: "3*x^2*exp(x) + x^3*exp(x)"
    variables: { x: [-2, 2] }
    common_wrong:
      - {
          answer: "3*x^2*exp(x)",
          category: misunderstood_definition,
          feedback: "This is a product, so you need both terms of the product rule.",
        }
    solution: "Product rule: $3x^2e^x + x^3e^x = e^x(x^3 + 3x^2)$."
  - id: der-quotient
    dimension: math
    type: expression
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "Differentiate $f(x) = \\dfrac{1}{1 + x^2}$."
    answer: "-2*x/(1+x^2)^2"
    variables: { x: [-3, 3] }
    common_wrong:
      - {
          answer: "1/(2*x)",
          category: misunderstood_definition,
          feedback: "You cannot differentiate the denominator separately. Use the quotient rule with $u = 1$ and $v = 1 + x^2$.",
        }
      - {
          answer: "2*x/(1+x^2)^2",
          category: math_error,
          feedback: "Check the sign: $f$ decreases for $x > 0$, so $f'(x)$ must be negative there.",
        }
    hints: ["Use the quotient rule with $u = 1$ and $v = 1 + x^2$.", "$u' = 0$ and $v' = 2x$."]
    solution: "$(0\\cdot(1+x^2) - 1\\cdot 2x)/(1+x^2)^2 = -2x/(1+x^2)^2$."
  - id: der-value
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x) = 3x^4 - 2x + \\ln x$, what is $f'(1)$?"
    answer: 11
    tolerance: { abs: 0.001 }
    hints: ["$f'(x) = 12x^3 - 2 + 1/x$."]
    solution: "$12 - 2 + 1 = 11$."
  - id: der-review-exp-log
    dimension: math
    type: expression
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "Differentiate $f(x) = 2e^x - 3\\ln x$ (write `exp(x)` and `log(x)`)."
    answer: "2*exp(x) - 3/x"
    variables: { x: [0.5, 3] }
    solution: "$2e^x - 3/x$."
  - id: der-sensitivity
    dimension: conceptual
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "A function satisfies $f(5) = 2.0$ and $f'(5) = -0.4$. **Estimate** $f(5.1)$ using the derivative."
    answer: 1.96
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 2.04,
          category: incorrect_reasoning,
          feedback: "A negative derivative means the output *decreases* as $x$ increases.",
        }
    hints: ["Linear approximation: $f(x + h) \\approx f(x) + f'(x)\\,h$."]
    solution: "$f(5.1) \\approx 2.0 + (-0.4)(0.1) = 1.96$. The slope at 5 helps estimate a nearby value."
  - id: der-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "A model's loss, a score of how wrong its predictions are, depends on one adjustable number, its weight $w$, as $L(w) = (2w - 6)^2$. Expand $L(w)$, find $L'(w)$ and $L'(2)$, then explain in 2–4 sentences what a small increase in $w$ near 2 will do to the loss."
    rubric:
      - {
          id: r1,
          criterion: "Expands $L(w)$ to $4w^2 - 24w + 36$ and differentiates to $L'(w) = 8w - 24$",
          weight: 2,
          required: true,
        }
      - { id: r2, criterion: "Evaluates $L'(2) = -8$", weight: 1, required: true }
      - {
          id: r3,
          criterion: "Explains that a small increase in $w$ near 2 lowers the loss by about 8 times the increase",
          weight: 2,
          required: true,
        }
    exemplar: "Expanding gives $L(w) = 4w^2 - 24w + 36$, so $L'(w) = 8w - 24$. At $w = 2$, the derivative is $-8$. Near 2, a small positive nudge to the weight lowers the loss by about 8 times the nudge; this local rate tells us the direction without trying many weights."
  - id: derp-meaning
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A function has $f'(4) = 3$. What does this tell you?"
    options:
      - id: a
        text: "Near $x = 4$, the output rises about 3 for each unit the input rises"
        correct: true
      - id: b
        text: "The output at $x = 4$ is 3"
        correct: false
        category: misunderstood_definition
        feedback: "That would be $f(4) = 3$. The derivative is a rate of change, not the value."
      - id: c
        text: "The output rises by 3 in total between $x = 0$ and $x = 4$"
        correct: false
        category: misunderstood_definition
        feedback: "That describes an average over a long stretch. The derivative is the rate at the single point $x = 4$."
      - id: d
        text: "The output at $x = 4$ is three times the input"
        correct: false
        category: misunderstood_definition
        feedback: "A derivative compares a change in output with a change in input, not the output with the input."
    solution: "$f'(4)$ is the slope of the tangent at $x = 4$: a small nudge to the input changes the output by about 3 times that nudge."
  - id: derp-average-speed
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A car has travelled $d(t) = t^2$ metres after $t$ seconds. What is its average speed, in m/s, between $t = {{=a}}$ and $t = {{=a+0.1}}$ seconds?"
    hints:
      [
        "Average speed = distance gained ÷ time taken.",
        "Compute $d({{=a+0.1}}) - d({{=a}})$, then divide by 0.1.",
      ]
    solution: "The car gains ${{=(a+0.1)^2}} - {{=a^2}} = {{=(a+0.1)^2-a^2}}$ m in 0.1 s, so its average speed is ${{=(a+0.1)^2-a^2}} \\div 0.1 = {{=2*a+0.1}}$ m/s. That is close to the instant speed $2 \\times {{=a}} = {{=2*a}}$ m/s, because the window is short."
    answer_expr: "((a+0.1)^2 - a^2) / 0.1"
    params:
      a: { min: 1, max: 8, step: 1 }
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "(a+0.1)^2 - a^2",
          category: math_error,
          feedback: "That is the distance gained. Divide it by the 0.1 s it took to get a speed.",
        }
      - {
          answer_expr: "2*a",
          category: misunderstood_definition,
          feedback: "That is the speed at the instant $t = {{=a}}$. The question asks for the average over the 0.1 s window.",
        }
  - id: derp-tangent
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "On a graph of $f$, what does $f'(2)$ measure?"
    options:
      - id: a
        text: "The slope of the tangent line that touches the curve at $x = 2$"
        correct: true
      - id: b
        text: "The height of the curve above the axis at $x = 2$"
        correct: false
        category: misunderstood_definition
        feedback: "The height is $f(2)$. The derivative is how steeply the curve rises there."
      - id: c
        text: "The slope of the straight line from $(0, 0)$ to the point at $x = 2$"
        correct: false
        category: misunderstood_definition
        feedback: "That is an average rate over a long stretch. The tangent uses only an instant at $x = 2$."
      - id: d
        text: "The slope of the line joining the points at $x = 2$ and $x = 3$"
        correct: false
        category: misunderstood_definition
        feedback: "That is an average rate over a window of width 1. The derivative is what this approaches as the window shrinks to 0."
    solution: "The derivative at a point is the slope of the tangent there, the limit of average slopes over shrinking windows."
  - id: derp-estimate
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A function has $f({{=x}}) = {{=y}}$ and $f'({{=x}}) = {{=s}}$. Use the derivative to estimate $f({{=x+0.1}})$."
    hints: ["For a small nudge $h$, $f(x + h) \\approx f(x) + f'(x)\\,h$.", "Here $h = 0.1$."]
    solution: "$f({{=x+0.1}}) \\approx {{=y}} + ({{=s}}) \\times 0.1 = {{=y+0.1*s}}$. The slope times the nudge estimates the change in output."
    answer_expr: "y + 0.1 * s"
    params:
      x: { min: 1, max: 5, step: 1 }
      y: { min: 10, max: 30, step: 1 }
      s: { min: -6, max: 6, step: 1 }
    constraints: ["s != 0"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "y + s",
          category: math_error,
          feedback: "Multiply the slope by the size of the nudge, 0.1, before adding it.",
        }
      - {
          answer_expr: "y - 0.1 * s",
          category: math_error,
          feedback: "Check the sign: add $f'(x) \\times 0.1$, so a positive slope raises the output.",
        }
  - id: derp-why-not-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "In $\\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h}$, why don't you simply put $h = 0$?"
    options:
      - id: a
        text: "The ratio becomes $0/0$, which has no value, so you watch what it approaches instead"
        correct: true
      - id: b
        text: "Putting $h = 0$ gives the output $f(x)$ instead of the rate"
        correct: false
        category: misunderstood_definition
        feedback: "With $h = 0$ the top is $f(x) - f(x) = 0$ and the bottom is 0, so you get $0/0$, not $f(x)$."
      - id: c
        text: "A nudge of 0 would make the derivative equal to 0"
        correct: false
        category: incorrect_reasoning
        feedback: "The derivative is often not 0. The issue is that $0/0$ is undefined, so you use the limit."
      - id: d
        text: "The limit only works when $h$ is a whole number"
        correct: false
        category: misunderstood_definition
        feedback: "The nudge $h$ shrinks through smaller and smaller values like 0.1, 0.01 and 0.001."
    solution: "At $h = 0$ both the change in output and the nudge are 0. The limit asks what the ratio gets closer to as $h$ shrinks, such as 6.1, 6.01, 6.001 approaching 6."
  - id: derp-robot-battery
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A delivery robot's battery charge after $t$ minutes is $b(t)$ percent, and $b'(10) = -0.5$. What does this mean?"
    options:
      - id: a
        text: "At 10 minutes the charge is falling by about 0.5 percentage points per minute"
        correct: true
      - id: b
        text: "At 10 minutes the battery holds 0.5 percent charge"
        correct: false
        category: misunderstood_definition
        feedback: "That would be $b(10) = 0.5$. The derivative is the rate of change of charge."
      - id: c
        text: "Over the first 10 minutes the charge fell by 0.5 percentage points"
        correct: false
        category: misunderstood_definition
        feedback: "That is a total change over a long stretch. $b'(10)$ is the rate at the 10-minute mark."
      - id: d
        text: "At 10 minutes the charge is rising by about 0.5 percentage points per minute"
        correct: false
        category: incorrect_reasoning
        feedback: "A negative derivative means the output is going down as time goes up."
    solution: "$b'(10)$ is the rate of change of charge at $t = 10$. The minus sign means it is going down, by about 0.5 points per minute."
  - id: derp-power-poly
    dimension: math
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Differentiate $f(x) = 4x^3 - 5x^2 + 2x - 7$ with respect to $x$."
    answer: "12*x^2 - 10*x + 2"
    variables: { x: [-3, 3] }
    common_wrong:
      - {
          answer: "12*x^2 - 10*x",
          category: math_error,
          feedback: "The derivative of $2x$ is 2, not 0. Only the lone constant $-7$ disappears.",
        }
      - {
          answer: "12*x^2 - 10*x + 2 - 7",
          category: misunderstood_definition,
          feedback: "A constant never changes, so its derivative is 0. Drop the $-7$.",
        }
    hints: ["Differentiate term by term with the power rule $x^n \\to n x^{n-1}$."]
    solution: "Term by term: $4x^3 \\to 12x^2$, $-5x^2 \\to -10x$, $2x \\to 2$, and $-7 \\to 0$. So $f'(x) = 12x^2 - 10x + 2$."
  - id: derp-power-value
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Let $f(x) = {{=a}}x^{{=n}} + {{=b}}x$. What is $f'({{=x0}})$?"
    hints:
      [
        "First find $f'(x)$ with the power, constant-multiple and sum rules.",
        "Then substitute $x = {{=x0}}$.",
      ]
    solution: "$f'(x) = {{=a*n}}x^{{=n-1}} + {{=b}}$, so $f'({{=x0}}) = {{=a*n}} \\times {{=x0^(n-1)}} + {{=b}} = {{=a*n*x0^(n-1)+b}}$."
    answer_expr: "a * n * x0^(n-1) + b"
    params:
      a: { min: 2, max: 5, step: 1 }
      n: { min: 2, max: 4, step: 1 }
      b: { min: 1, max: 9, step: 1 }
      x0: { min: 2, max: 3, step: 1 }
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "a * n * x0^n + b",
          category: math_error,
          feedback: "After bringing the power down, lower it by one: $x^n \\to n x^{n-1}$.",
        }
      - {
          answer_expr: "a * n * x0^(n-1)",
          category: math_error,
          feedback: "Don't drop the $x$ term: the derivative of ${{=b}}x$ is ${{=b}}$.",
        }
  - id: derp-power-cube
    dimension: math
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "What is the derivative of $x^3$?"
    options:
      - { id: a, text: "$3x^2$", correct: true }
      - id: b
        text: "$3x^3$"
        correct: false
        category: misapplied_technique
        feedback: "Bring the 3 down, then lower the power by one."
      - id: c
        text: "$x^2$"
        correct: false
        category: misapplied_technique
        feedback: "You lowered the power but forgot to bring the old power down in front."
      - id: d
        text: "$3x^4$"
        correct: false
        category: misapplied_technique
        feedback: "The power goes down by one, not up."
    solution: "Power rule: bring the 3 down and lower the power to 2, so $(x^3)' = 3x^2$."
  - id: derp-constant-term
    dimension: conceptual
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "What is the derivative of $f(x) = x^2 + 10$?"
    answer: "2*x"
    variables: { x: [-3, 3] }
    common_wrong:
      - answer: "2*x + 10"
        category: misunderstood_definition
        feedback: "Differentiation measures how the output changes with $x$. The added 10 stays fixed, so it contributes 0."
      - answer: "2*x + 1"
        category: misapplied_technique
        feedback: "The constant 10 is not $10x$ or $x$. It doesn't change with $x$, so its derivative is 0."
      - answer: "20*x"
        category: misunderstood_definition
        feedback: "The expression adds 10. It does not multiply $x^2$ by 10. Each term is differentiated separately."
    solution: "The value 10 stays fixed for every $x$, so it contributes no change in output. Thus $f'(x) = 2x$."
  - id: derp-drone-climb
    dimension: math
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A drone's height after $t$ seconds is $h(t) = 2t^3 - 3t^2 + 6t$ metres. Give its climbing speed $h'(t)$, in metres per second."
    answer: "6*t^2 - 6*t + 6"
    variables: { t: [0, 4] }
    hints: ["Differentiate each term with the power rule."]
    solution: "$2t^3 \\to 6t^2$, $-3t^2 \\to -6t$ and $6t \\to 6$, so $h'(t) = 6t^2 - 6t + 6$."
  - id: derp-power-fraction
    dimension: math
    type: expression
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Differentiate $f(x) = \\frac{x^4}{2} - 6x^2$."
    answer: "2*x^3 - 12*x"
    variables: { x: [-3, 3] }
    common_wrong:
      - {
          answer: "4*x^3 - 12*x",
          category: math_error,
          feedback: "Keep the constant multiple: $\\frac{x^4}{2}$ is $\\frac12 \\cdot x^4$, so its derivative is $\\frac12 \\cdot 4x^3$.",
        }
    hints: ["$\\frac{x^4}{2}$ is the constant $\\frac12$ times $x^4$."]
    solution: "$\\frac12 \\cdot 4x^3 = 2x^3$ and $-6 \\cdot 2x = -12x$, so $f'(x) = 2x^3 - 12x$."
  - id: derp-exp-log-mix
    dimension: math
    type: expression
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Differentiate $f(x) = 4e^x + 5\\ln x - x^2$ (write `exp(x)` for $e^x$)."
    answer: "4*exp(x) + 5/x - 2*x"
    variables: { x: [0.5, 3] }
    common_wrong:
      - {
          answer: "4*exp(x) + 5*log(x) - 2*x",
          category: recall_failure,
          feedback: "The derivative of $\\ln x$ is $\\frac1x$, not $\\ln x$. Only $e^x$ is its own derivative.",
        }
    hints: ["$e^x \\to e^x$ and $\\ln x \\to \\frac1x$; keep the constants in front."]
    solution: "$4e^x \\to 4e^x$, $5\\ln x \\to \\frac5x$ and $-x^2 \\to -2x$, so $f'(x) = 4e^x + \\frac5x - 2x$."
  - id: derp-ln-slope
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Let $f(x) = {{=a}}\\ln x$. What is the slope $f'({{=x0}})$? Round to 2 decimal places if needed."
    hints: ["The derivative of $\\ln x$ is $\\frac1x$, and the constant stays in front."]
    solution: "$f'(x) = \\frac{ {{=a}} }{x}$, so $f'({{=x0}}) = {{=a}} \\div {{=x0}} = {{=a/x0}}$."
    answer_expr: "a / x0"
    params:
      a: { min: 2, max: 9, step: 1 }
      x0: { min: 2, max: 5, step: 1 }
    tolerance: { abs: 0.01 }
    common_wrong:
      - {
          answer_expr: "a * log(x0)",
          category: misunderstood_definition,
          feedback: "That is the value $f({{=x0}})$. The slope uses the derivative $\\frac{ {{=a}} }{x}$.",
        }
  - id: derp-exp-slope
    dimension: math
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Why is the slope of $f(x) = e^x$ at any point equal to the function's value there?"
    options:
      - id: a
        text: "Base $e$ makes the slope at 0 exactly 1, and near any $x$ the curve is that piece stretched by $e^x$"
        correct: true
        feedback: "Since $e^{x+h} = e^x e^h$, the slope at $x$ is $e^x$ times the slope at 0, which is 1."
      - id: b
        text: "The power rule treats the variable exponent $x$ as if it were a fixed power"
        correct: false
        category: misapplied_technique
        feedback: "The power rule applies to a fixed exponent such as $x^2$. Here $x$ is the exponent; $e^x$ has its own derivative rule."
      - id: c
        text: "The derivative is the constant base $e$, which stays the same for every input"
        correct: false
        category: misunderstood_definition
        feedback: "The base is constant, but the function's value and slope change with $x$. Both equal $e^x$."
      - id: d
        text: "Because the base $e$ is a constant, the derivative of $e^x$ must be zero"
        correct: false
        category: misunderstood_definition
        feedback: "The base $e$ is constant, but the whole expression $e^x$ changes with $x$; it is not a constant function."
    solution: "The base $e$ is chosen so that the slope of $e^x$ at 0 is 1. Because $e^{x+h} = e^x \\cdot e^h$, the slope at any $x$ is $e^x \\cdot 1 = e^x$, the value itself."
  - id: derp-ln-meaning
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A calculator says $\\ln 20 \\approx 3$. What does that tell you?"
    options:
      - { id: a, text: '$e^3 \approx 20$', correct: true }
      - id: b
        text: '$20^3 \approx e$'
        correct: false
        category: misunderstood_definition
        feedback: '$\ln x$ asks which power of $e$ gives $x$, so the base is $e$.'
      - id: c
        text: '$3^e \approx 20$'
        correct: false
        category: misunderstood_definition
        feedback: "The 3 is the power, not the base. The base is always $e$."
      - id: d
        text: '$3e \approx 20$'
        correct: false
        category: misunderstood_definition
        feedback: "A logarithm undoes a power, not a multiplication."
    solution: "$\\ln 20$ is the power of $e$ that gives 20, so $e^3 \\approx 20$ (in fact $e^3 \\approx 20.09$)."
  - id: derp-tank-level
    dimension: math
    type: expression
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A water tank's level after $t$ hours is $L(t) = 10 - 2\\ln t$ metres, for $t \\geq 1$. Give the rate of change $L'(t)$ in metres per hour."
    answer: "-2/t"
    variables: { t: [1, 5] }
    common_wrong:
      - {
          answer: "10 - 2/t",
          category: misunderstood_definition,
          feedback: "The constant 10 never changes, so its derivative is 0.",
        }
    solution: "The 10 contributes 0 and $-2\\ln t \\to -\\frac2t$, so $L'(t) = -\\frac2t$. The level falls, and more slowly as time goes on."
  - id: derp-product-expr
    dimension: math
    type: expression
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "Differentiate $f(x) = (x^2 + 1)\\ln x$ (write `log(x)` for $\\ln x$)."
    answer: "2*x*log(x) + (x^2 + 1)/x"
    variables: { x: [0.5, 3] }
    common_wrong:
      - {
          answer: "2*x/x",
          category: misunderstood_definition,
          feedback: "That multiplies the two derivatives. The product rule is $u'v + uv'$.",
        }
    hints: ["Take $u = x^2 + 1$ and $v = \\ln x$.", "$u' = 2x$ and $v' = \\frac1x$."]
    solution: "$u'v + uv' = 2x\\ln x + (x^2 + 1)\\cdot\\frac1x$, so $f'(x) = 2x\\ln x + \\frac{x^2 + 1}{x}$."
  - id: derp-product-value
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "At $x = 2$, a function $u$ has $u(2) = {{=a}}$ and $u'(2) = {{=b}}$, and a function $v$ has $v(2) = {{=c}}$ and $v'(2) = {{=d}}$. Let $f(x) = u(x)\\,v(x)$. What is $f'(2)$?"
    hints: ["Product rule: $f' = u'v + uv'$."]
    solution: "$f'(2) = u'(2)\\,v(2) + u(2)\\,v'(2) = {{=b}} \\times {{=c}} + {{=a}} \\times {{=d}} = {{=b*c+a*d}}$."
    answer_expr: "b * c + a * d"
    params:
      a: { min: 1, max: 6, step: 1 }
      b: { min: 1, max: 6, step: 1 }
      c: { min: 1, max: 6, step: 1 }
      d: { min: 1, max: 6, step: 1 }
    constraints: ["b * d != b * c + a * d", "a * c != b * c + a * d"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "b * d",
          category: misunderstood_definition,
          feedback: "That multiplies the two derivatives. The product rule is $u'v + uv'$.",
        }
      - {
          answer_expr: "a * c",
          category: misunderstood_definition,
          feedback: "That is the value $f(2) = u(2)\\,v(2)$, not its rate of change.",
        }
  - id: derp-why-not-multiply
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A student differentiates $x^2 e^x$ by multiplying the derivatives of its two parts, $2x$ and $e^x$, and gets $2x e^x$. Which statement about this is correct?"
    options:
      - id: a
        text: "It misses a part: both factors change, so the derivative is $2x e^x + x^2 e^x$."
        correct: true
        feedback: "The product rule adds the change from each part times the other part."
      - id: b
        text: "It is correct: the derivative of a product is the product of the derivatives."
        correct: false
        category: misunderstood_definition
        feedback: 'Test it on $x \cdot x = x^2$: multiplying derivatives gives 1, but the true derivative is $2x$.'
      - id: c
        text: "It is wrong: the derivatives should be added instead, giving $2x + e^x$."
        correct: false
        category: misapplied_technique
        feedback: "Adding derivatives is the sum rule, for $u + v$. A product needs $u'v + uv'$."
      - id: d
        text: "It is wrong: by the power rule the derivative of $e^x$ is $x e^{x-1}$."
        correct: false
        category: misapplied_technique
        feedback: "The power rule does not apply when $x$ is the exponent. $e^x$ is its own derivative."
    solution: "With $u = x^2$ and $v = e^x$, $u'v + uv' = 2x e^x + x^2 e^x$. Multiplying derivatives misses the second term."
  - id: derp-quotient-expr
    dimension: math
    type: expression
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "Differentiate $f(x) = \\frac{x^2}{x + 1}$."
    answer: "(x^2 + 2*x)/(x + 1)^2"
    variables: { x: [0, 3] }
    common_wrong:
      - {
          answer: "2*x",
          category: misunderstood_definition,
          feedback: "You can't divide the derivative of the top by the derivative of the bottom. Use $\\frac{u'v - uv'}{v^2}$.",
        }
      - {
          answer: "-(x^2 + 2*x)/(x + 1)^2",
          category: math_error,
          feedback: "Check the order on top: $u'v$ comes first, then subtract $uv'$.",
        }
    hints: ["Take $u = x^2$ and $v = x + 1$.", "$u'v - uv' = 2x(x + 1) - x^2 \\cdot 1$."]
    solution: "$\\frac{2x(x+1) - x^2}{(x+1)^2} = \\frac{x^2 + 2x}{(x+1)^2}$."
  - id: derp-which-rule
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Which of these functions needs the product rule?"
    options:
      - { id: a, text: "$x^3 e^x$", correct: true }
      - id: b
        text: "$5x^3$"
        correct: false
        category: misapplied_technique
        feedback: "The 5 is a constant, so the constant-multiple rule is enough: $15x^2$."
      - id: c
        text: "$x^3 + e^x$"
        correct: false
        category: misapplied_technique
        feedback: "This is a sum, so differentiate term by term: $3x^2 + e^x$."
      - id: d
        text: "$3e^x$"
        correct: false
        category: misapplied_technique
        feedback: "A constant times $e^x$ only needs the constant-multiple rule: $3e^x$."
    solution: "Only $x^3 e^x$ multiplies two parts that both change with $x$. A constant multiplier or a sum has its own simpler rule."
  - id: derp-rectangle-rate
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A rectangle is 4 m wide and 3 m tall. Its width is growing at 0.5 m per second and its height at 0.2 m per second. How fast is its area growing, in square metres per second?"
    answer: 2.3
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 0.1,
          category: misunderstood_definition,
          feedback: "That multiplies the two rates. The area grows from both strips: $u'v + uv'$.",
        }
      - {
          answer: 1.5,
          category: incomplete_explanation,
          feedback: "That is only the strip from the growing width. Add the strip from the growing height too.",
        }
    hints: ["Area is width × height, so use the product rule $u'v + uv'$."]
    solution: "$u'v + uv' = 0.5 \\times 3 + 4 \\times 0.2 = 1.5 + 0.8 = 2.3$ square metres per second."
  - id: derp-nudge-backwards
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A model's loss, a score of how wrong its predictions are, depends on one adjustable number, its weight $w$, as $L(w)$. At $w = 2$ the loss is $L(2) = 5$ and its slope is $L'(2) = -4$. Use the derivative to estimate the small change $h$ in the weight that brings the loss down to $4.8$. Give $h$ with its sign."
    answer: 0.05
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -0.05,
          category: math_error,
          feedback: "Check the sign: the slope is negative, so the loss falls when the weight rises.",
        }
      - {
          answer: 0.8,
          category: misapplied_technique,
          feedback: "That multiplies the loss change by the slope. Divide the loss change by the slope instead.",
        }
    hints:
      - "For a small nudge $h$, $L(2 + h) \\approx L(2) + L'(2)\\,h$."
      - "Set the estimate equal to $4.8$ and solve for $h$."
    solution: |
      Start from the derivative estimate and set it equal to the target loss:

      $$L(2 + h) \approx L(2) + L'(2)\,h$$

      $$4.8 = 5 + (-4)h$$

      $$-0.2 = -4h$$

      $$h = 0.05$$

      Raising the weight by about 0.05 lowers the loss to about 4.8.
  - id: derp-flat-slope
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A model's loss, a score of how wrong its predictions are, depends on one adjustable number, its weight $w$, as $L(w) = w^3 - 12w + 20$, for $w > 0$. At which positive weight is the slope $L'(w)$ zero?"
    answer: 2
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 4,
          category: math_error,
          feedback: "That is $w^2$. Take the positive square root to find $w$.",
        }
      - {
          answer: 12,
          category: misunderstood_definition,
          feedback: "Differentiate first: $L'(w) = 3w^2 - 12$, then set that to zero.",
        }
    hints:
      - "Use the power rule on each term to find $L'(w)$."
      - "Set $3w^2 - 12 = 0$ and solve for positive $w$."
    solution: |
      Differentiate term by term with the power rule:

      $$L'(w) = 3w^2 - 12$$

      Set the slope to zero and solve:

      $$3w^2 - 12 = 0$$

      $$w^2 = 4$$

      $$w = 2 \quad (w > 0)$$

      At $w = 2$ the loss is $8 - 24 + 20 = 4$, and nudging the weight either way barely changes it.
  - id: derp-log-flat
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A model's loss, a score of how wrong its predictions are, depends on one positive adjustable number, its weight $w$, as $L(w) = w - 4\\ln w$. At which weight is the slope $L'(w)$ zero?"
    answer: 4
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 0.25,
          category: math_error,
          feedback: "Check the algebra: $1 - 4/w = 0$ gives $4/w = 1$, so $w = 4$.",
        }
      - {
          answer: 1,
          category: misunderstood_definition,
          feedback: "That is where $\\ln w = 0$. Set the derivative $L'(w) = 1 - 4/w$ to zero instead.",
        }
    hints:
      - "The derivative of $w$ is 1 and the derivative of $\\ln w$ is $1/w$."
      - "Set $1 - 4/w = 0$ and solve for $w$."
    solution: |
      Differentiate each term:

      $$L'(w) = 1 - \frac{4}{w}$$

      Set the slope to zero and solve:

      $$1 - \frac{4}{w} = 0$$

      $$\frac{4}{w} = 1$$

      $$w = 4$$

      Below $w = 4$ the slope is negative and above it the slope is positive, so the loss is lowest there.
  - id: derp-why-shrink
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In this step, why do we work out the car's average speed over 1, 0.1 and 0.01 seconds instead of stopping at the 1-second average?"
    options:
      - id: a
        text: "The 1-second average also counts how the speed changed later; shorter steps get closer to the speed at exactly $t = 3$."
        correct: true
        feedback: "Each shorter step measures less of the later speeding up, so the averages 7, 6.1, 6.01 close in on 6."
      - id: b
        text: "The 1-second step gives the wrong distance, so its average speed of 7 cannot be trusted."
        correct: false
        category: misunderstood_definition
        feedback: "The distance $16 - 9 = 7$ m is correct; it is just an average over the whole second, not the speed at $t = 3$."
      - id: c
        text: "Smaller steps make the distance travelled smaller, so the speed also gets smaller and smaller."
        correct: false
        category: incorrect_reasoning
        feedback: "The distance and the time both shrink, and their ratio settles at 6. It does not keep falling towards 0."
      - id: d
        text: "Averaging the three step results together gives a more accurate answer than any single one."
        correct: false
        category: misapplied_technique
        feedback: "The steps are not averaged together; the answer is the value the average slope approaches as the step shrinks."
    solution: "The average over a long step mixes in the speed at later times. As the step shrinks, the average speed (7, 6.1, 6.01) approaches the speed at the instant $t = 3$, which is 6 m/s."
  - id: derp-why-keep-constant
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, why is the derivative of $3x^2$ equal to $6x$ rather than $2x$?"
    options:
      - id: a
        text: "The 3 multiplies every height by 3, so every rise and therefore every slope is three times as big."
        correct: true
        feedback: "A number multiplying a function multiplies its slope: $3 \\cdot 2x = 6x$."
      - id: b
        text: "The power rule brings down the 3 in front instead of the power 2, giving $3 \\cdot 2x$."
        correct: false
        category: misapplied_technique
        feedback: "The power rule brings down the power 2. The 3 stays in front because a number multiplying a function multiplies its slope."
      - id: c
        text: "The 3 is added to the power first, so the power becomes 5 before the rule is applied."
        correct: false
        category: misapplied_technique
        feedback: "A multiplier does not change the power. $3x^2$ is 3 times $x^2$, and its slope is 3 times $2x$."
      - id: d
        text: "Constants always disappear, so the 6 comes from doubling the 3 left over in front."
        correct: false
        category: misunderstood_definition
        feedback: "Only an added constant disappears. A multiplied constant stays and multiplies the slope."
    solution: "$3x^2$ is 3 times $x^2$. Tripling every height triples every slope, so $(3x^2)' = 3 \\cdot 2x = 6x$."
  - id: derp-why-six-over-x
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, why is the slope of $6\\ln x$ at $x = 2$ equal to 3?"
    options:
      - id: a
        text: "The slope of $\\ln x$ is $\\frac1x$, which is $\\frac12$ at $x = 2$, and the 6 in front multiplies it."
        correct: true
        feedback: "Numbers multiply slopes, so $6 \\cdot \\frac12 = 3$."
      - id: b
        text: "The power rule on $\\ln x$ brings down a 1, so the slope is $6 \\div 2$ from the input alone."
        correct: false
        category: misapplied_technique
        feedback: "$\\ln x$ is not a power of $x$. Its own rule gives slope $\\frac1x$, and the 6 multiplies that."
      - id: c
        text: "The value $\\ln 2$ is about 0.69, and six times that rounds to the slope 3."
        correct: false
        category: misunderstood_definition
        feedback: "$6\\ln 2 \\approx 4.16$ is the height of the term at $x = 2$, not its slope."
      - id: d
        text: "The slope of $\\ln x$ equals its input, so at $x = 2$ it is 2 and the term adds 1."
        correct: false
        category: recall_failure
        feedback: "The slope of $\\ln x$ is $\\frac1x$, which shrinks as $x$ grows, so at $x = 2$ it is $\\frac12$."
    solution: "$(6\\ln x)' = 6 \\cdot \\frac1x = \\frac6x$, and at $x = 2$ that is $\\frac62 = 3$."
  - id: derp-exp-value
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Let $f(x) = 3e^x - 2x$. What is the slope $f'(0)$?"
    answer: 1
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 3,
          category: math_error,
          feedback: "That is only the slope of $3e^x$. The $-2x$ term adds a slope of $-2$.",
        }
      - {
          answer: -2,
          category: recall_failure,
          feedback: "The slope of $3e^x$ is $3e^x$, which is 3 at $x = 0$, not 0.",
        }
    hints: ["$(e^x)' = e^x$, and $e^0 = 1$."]
    solution: "$f'(x) = 3e^x - 2$, so $f'(0) = 3 \\cdot 1 - 2 = 1$."
  - id: derp-why-two-parts
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, why is $f'(1)$ the sum of two parts, $2$ and $6$?"
    options:
      - id: a
        text: "Both parts change with $x$; 2 is the change from $u$ times $v$, and 6 is $u$ times the change from $v$."
        correct: true
        feedback: "Those are the two strips of the rectangle: $u'v = 2 \\cdot 1$ and $uv' = 2 \\cdot 3$."
      - id: b
        text: "The two parts are the slopes of $u$ and $v$ at $x = 1$, which are added together."
        correct: false
        category: misunderstood_definition
        feedback: "The slopes are $u' = 2$ and $v' = 3$, which add to 5, not 8. Each term of the rule mixes one slope with the other part's value."
      - id: c
        text: "The two parts are the values of $u$ and $v$ at $x = 1$, which are added together."
        correct: false
        category: misunderstood_definition
        feedback: "At $x = 1$, $u = 2$ and $v = 1$, which add to 3. Each term of the rule mixes one slope with the other part's value."
      - id: d
        text: "The sum rule splits every function into two terms, and each term gets its own slope."
        correct: false
        category: misapplied_technique
        feedback: "The sum rule is for added terms. Here the two parts are multiplied, so the product rule applies."
    solution: "With $u = x^2 + 1$ and $v = 3x - 2$, at $x = 1$: $u'v = 2 \\cdot 1 = 2$ from the change in $u$, and $uv' = 2 \\cdot 3 = 6$ from the change in $v$, so $f'(1) = 8$."
  - id: derp-big-nudge
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "For $f(x) = x^2$, we know $f(3) = 9$ and $f'(3) = 6$. Estimating $f(5)$ as $9 + 6 \\times 2$ gives 21, but in fact $f(5) = 25$. Why is the estimate so far off?"
    options:
      - id: a
        text: "The estimate assumes the slope stays 6 all the way, but the curve gets steeper, so it only works for small nudges."
        correct: true
        feedback: "The slope at 3 describes the curve only near 3. Over a nudge of 2 the curve bends away from its tangent."
      - id: b
        text: "The slope at $x = 3$ is really 8, so the estimate used the wrong derivative from the very start."
        correct: false
        category: recall_failure
        feedback: "The slope of $x^2$ is $2x$, which is 6 at $x = 3$. The derivative is right; the nudge is too big."
      - id: c
        text: "The estimate should subtract the slope times the nudge, because the output always falls as we move."
        correct: false
        category: incorrect_reasoning
        feedback: "A positive slope means the output rises as the input rises, so adding is right. Subtracting gives 3, even further off."
      - id: d
        text: "The estimate should use the slope at $x = 5$, which is 10, because that is where we want the answer."
        correct: false
        category: misapplied_technique
        feedback: "That gives $9 + 10 \\times 2 = 29$, which is off the other way. No single slope is right over such a big nudge."
    solution: "The estimate $f(a + h) \\approx f(a) + f'(a)\\,h$ treats the curve as its tangent line. For $x^2$ the slope grows from 6 to 10 between 3 and 5, so over a nudge of 2 the tangent falls 4 short. For small nudges, like 0.1, the estimate is close."
