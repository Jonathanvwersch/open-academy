concept: llm-evaluation
exercises:
  - id: lab-post-training-held-out-claim
    dimension: transfer
    type: mc
    role: core
    difficulty: 3
    est_minutes: 2
    prompt: A base model is given 8 test prompts that ask it to repeat text in uppercase, and produces an exact match on 0. Its fine-tuned version matches all 8 exactly using the same rule, where every character must match. The prompts were excluded from all training. Which claim does this result support?
    options:
      - id: a
        text: The fine-tuned version repeated uppercase text correctly more often on these same 8 test prompts.
        correct: true
      - id: b
        text: The fine-tuned version improved factual accuracy across language tasks.
        correct: false
        feedback: The benchmark measures an echo task. It contains no evidence about factual questions or other language tasks.
      - id: c
        text: The fine-tuned version will answer every new echo prompt exactly.
        correct: false
        feedback: Eight held-out prompts provide a small sample. They cannot establish perfect performance on every future prompt.
    solution: The comparison supports better performance on these 8 uppercase-repeat prompts. Their small number and narrow task do not show performance on unrelated requests.
  - id: lev-benchmark-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What makes a collection of tasks a benchmark?
    options:
      - id: a
        text: The tasks are fixed and have stated rules for scoring answers.
        correct: true
        feedback: A fixed task collection and scoring rules let us repeat the comparison.
      - id: b
        text: The tasks are representative, while each model chooses its own scoring rule.
        correct: false
        feedback: Shared scoring rules are needed for comparable results. Each model choosing its own rules would change what the scores mean.
      - id: c
        text: The tasks change between models, while their total difficulty is estimated to match.
        correct: false
        feedback: A benchmark fixes the task collection so that model results can be compared on the same questions.
    solution: A benchmark fixes both the tasks and the scoring rules. Its score describes performance on those tasks.
  - id: lev-benchmark-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does the worked example report 50% on the fresh questions as well as 70% on the mixed benchmark?
    options:
      - id: a
        text: The fresh score proves training exposure caused exactly the whole difference.
        correct: false
        feedback: The groups can differ in difficulty too, so the score gap does not prove that training exposure caused it.
      - id: b
        text: The fresh score separates six new questions from four already seen in training.
        correct: true
        feedback: The split shows which results came from questions not encountered in training.
      - id: c
        text: The fresh score shows the assistant's exact accuracy on all future requests.
        correct: false
        feedback: The score describes only these six questions. Measuring performance on other requests requires additional evaluation.
    solution: The mixed set includes four questions seen in training, so it is not purely a test on new material. Reporting the fresh group makes that distinction visible without proving memorisation caused the gap.
  - id: lev-contamination-route
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: An assistant's fine-tuning data contains close copies of a benchmark's questions and accepted answers. What is the concern?
    options:
      - id: a
        text: Only pretraining exposure counts, so the benchmark remains unaffected.
        correct: false
        feedback: Test material can enter training during fine-tuning as well as pretraining.
      - id: b
        text: Exposure matters only if the benchmark's scoring program was also in training.
        correct: false
        feedback: Learning question–answer content can raise the score without any exposure to the scoring code.
      - id: c
        text: Training exposure may raise the score without showing ability on new questions.
        correct: true
        feedback: Close copies can raise scores by making the test material familiar.
    solution: This is benchmark contamination through fine-tuning. Familiar material in training may help the model answer these questions correctly.
  - id: lev-accuracy-template
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      seen: { min: 2, max: 6, step: 2 }
      fresh: { min: 2, max: 8, step: 2 }
    prompt: "A benchmark has {{=seen}} questions seen in training and 10 fresh questions. A model answers every seen question and {{=fresh}} fresh questions correctly. Using only evidence about performance on unseen material, what accuracy percentage should be reported? Enter a number from 0 to 100."
    answer_expr: "100 * fresh / 10"
    tolerance: { abs: 0.01 }
    hints:
      - Use only the fresh questions in both the numerator and denominator.
      - Divide the correct fresh answers by 10, then multiply by 100.
    solution: "The fresh accuracy is $100\\times{{=fresh}}/10={{= 100 * fresh / 10 }}\\%$. The seen questions are excluded because this score asks only about new questions."
  - id: lev-clean-claim
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A team removes every exact training-data copy it finds from a benchmark. Which conclusion is justified?
    options:
      - id: a
        text: The known copies are gone, but undiscovered or close copies may remain.
        correct: true
        feedback: An exact-match search cannot rule out every route by which test material entered training.
      - id: b
        text: The remaining score is a guarantee that every question is new to the model.
        correct: false
        feedback: The search may miss questions written in different words, close copies or inaccessible training data.
      - id: c
        text: The remaining score is clean if all remaining questions use different wording from training.
        correct: false
        feedback: Changing the wording can leave the same questions and answers recognizable, so it does not rule out contamination.
    solution: Removing known copies reduces a known source of contamination, but does not certify that all remaining material is unseen. Report how exposure was checked and what remains unknown.
  - id: lev-clean-design
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: A team repeatedly changes an assistant after inspecting a public benchmark's failures. Which plan best supports a final claim about new requests?
    options:
      - id: a
        text: Keep changing the assistant until it answers every public benchmark question correctly, then report that score alone.
        correct: false
        feedback: Repeated selection around those failures uses the benchmark to guide development. Final reporting needs a separate test set.
      - id: b
        text: Prepare representative fresh questions, keep them out of development, and report their score after choosing the model.
        correct: true
        feedback: A separate untouched set better tests the chosen model on requests not used to guide changes.
      - id: c
        text: Rewrite the public questions in different words after the changes, then use them as the final unseen test.
        correct: false
        feedback: Rewritten questions still use content already seen during development, so they do not form an independent test.
    solution: Keep development questions separate from the final test and avoid choosing model changes from final-test results. Fresh, representative questions reduce known exposure and task-coverage problems, though no finite set proves universal ability.
  - id: lev-domain-limit
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: An assistant scores highly on an uncontaminated reading benchmark. A team wants to use it to write robot-control code. What should the team do next?
    options:
      - id: a
        text: Treat the reading score as sufficient because both uses involve producing text.
        correct: false
        feedback: Different text tasks can require very different abilities and checks.
      - id: b
        text: Check that the reading questions mention robots, then use their score to decide whether it can write robot-control code.
        correct: false
        feedback: Shared subject matter does not make reading comprehension a test of code-writing ability or control errors.
      - id: c
        text: Evaluate representative code-writing tasks with checks for the mistakes that matter.
        correct: true
        feedback: Evaluate tasks that reflect how the assistant will be used.
    solution: A clean test can still measure a different ability from the one needed in use. Add code-writing tasks and checks for the errors that matter.
  - id: lev-pairwise-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does pairwise evaluation compare?
    options:
      - id: a
        text: Two answers to different prompts that have the same estimated difficulty.
        correct: false
        feedback: Pairwise response evaluation holds the prompt fixed so both answers address the same request.
      - id: b
        text: Two answers to the same prompt under a stated judging rule.
        correct: true
        feedback: Holding the prompt fixed lets the judge compare the answers against the same task.
      - id: c
        text: Two models' independent accuracy scores on different collections of prompts.
        correct: false
        feedback: Pairwise evaluation judges paired answers to the same prompt, rather than comparing separate aggregate scores.
    solution: Pairwise evaluation compares two answers to one prompt under explicit criteria. It can allow a tie when the answers are equally good under those criteria.
  - id: lev-pairwise-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does the worked example divide A's 2.5 points by four prompts rather than just A's two wins?
    options:
      - id: a
        text: The denominator counts all final decisions, including the tie and the loss.
        correct: true
        feedback: Each of the four compared prompts contributes a final decision to the rate.
      - id: b
        text: The denominator gives A one extra win for every tie and every loss.
        correct: false
        feedback: Ties give half credit in the numerator, and losses give no credit.
      - id: c
        text: The denominator counts how many accepted answers appeared during training.
        correct: false
        feedback: The pairwise denominator counts prompts with final decisions.
    solution: The rate measures credit per prompt with a final decision. Its denominator includes wins, ties and losses.
  - id: lev-win-template
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    params:
      wins: { min: 2, max: 6, step: 1 }
      ties: { min: 0, max: 4, step: 1 }
    prompt: "Across 10 prompts, A has a win count of {{=wins}}, a tie count of {{=ties}} and a loss count of {{= 10 - wins - ties }}. Each prompt has one final decision. Giving ties half credit, what is A's tie-adjusted win rate as a percentage? Enter a number from 0 to 100."
    answer_expr: "100 * (wins + 0.5 * ties) / 10"
    tolerance: { abs: 0.01 }
    hints:
      - Add the wins and half the ties, then divide by every evaluated prompt.
      - There are 10 prompts in the denominator, even when some are losses.
    solution: "A's percentage is $100\\times({{=wins}}+0.5\\times{{=ties}})/10={{= 100 * (wins + 0.5 * ties) / 10 }}\\%$. Losses earn zero credit but remain in the denominator."
  - id: lev-drop-ties
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      In a head-to-head evaluation, model A has one win, two ties and one loss. A report leaves the
      ties out and gives model A a win rate of $1/2$. It claims this is the same rule as counting
      each tie as half a win. Which assessment is right?
    options:
      - id: a
        text: Dropping ties is the half-credit rule whenever wins equal losses.
        correct: false
        feedback: Equal numerical results in this case do not make the conventions identical.
      - id: b
        text: Half credit means treating both ties as full wins and dividing by four.
        correct: false
        feedback: Full wins would give each tie too much credit.
      - id: c
        text: The rules differ, even though half credit also gives (1 + 1)/4 = 1/2 here.
        correct: true
        feedback: Half credit keeps all prompts; removing ties is a different convention that happens to agree here.
    solution: The half-credit rule gives $(1+0.5\times2)/4=1/2$. Dropping ties also gives $1/2$ in this symmetric case, but it uses a different denominator and need not agree in other cases.
  - id: lev-both-wrong
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A judge prefers A to B on a factual question, but a human later finds both answers wrong. What does A's win establish?
    options:
      - id: a
        text: A's answer was factually correct because a preference is an accuracy label.
        correct: false
        feedback: A comparison can prefer a less bad answer without finding it correct.
      - id: b
        text: The judge preferred A on that pair; the win alone did not establish correctness.
        correct: true
        feedback: Preference is relative to the other answer and the judging rule.
      - id: c
        text: The answer must become a tie because two wrong answers are always equally good.
        correct: false
        feedback: Wrong answers can differ in severity and in how well they meet other criteria.
    solution: The win records a preference between these two answers. Report task-specific correctness checks separately when correctness matters.
  - id: lev-opponent
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A beats B on a set of reading requests. Can we infer that A will beat a new model C on programming requests?
    options:
      - id: a
        text: No; the opponent and the task mix both changed, so a new comparison is needed.
        correct: true
        feedback: A pairwise rate is tied to the models, prompts and judging rule actually used.
      - id: b
        text: Yes; reading and programming both use text, so the measured lead should carry over.
        correct: false
        feedback: A lead on one comparison is not a universal ranking or task guarantee.
      - id: c
        text: Yes; a pairwise win rate estimates an opponent-independent quality score for A.
        correct: false
        feedback: A win rate depends on the opponent as well as the tasks. It does not assign A an opponent-independent quality score.
    solution: The original result is evidence only for the evaluated setting. Compare A and C on representative programming prompts before drawing that new conclusion.
  - id: lev-report-counts
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: Two reports each show a half-credit tie-adjusted rate of 50%. One contains four ties; the other contains two wins and two losses. What information would a rate alone hide?
    options:
      - id: a
        text: The reports must have compared different numbers of prompts to get the same rate.
        correct: false
        feedback: Both reports contain four prompts; their outcome counts differ.
      - id: b
        text: One model must have answered every question correctly while the other failed them all.
        correct: false
        feedback: Pairwise scores do not tell us absolute correctness.
      - id: c
        text: Equal credit can come from equal-quality pairs or from a mixture of wins and losses.
        correct: true
        feedback: Reporting the counts reveals this difference that the single rate compresses.
    solution: Four half-credit ties and two full-credit wins both give two points out of four prompts. Counts show whether the comparison found ties throughout or mixed strengths and weaknesses.
  - id: lev-judge-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What is position bias in an LLM judge?
    options:
      - id: a
        text: Letting an answer's length influence its rating beyond what the rubric rewards.
        correct: false
        feedback: That is length bias. Position bias concerns where an answer is displayed.
      - id: b
        text: Letting an answer's displayed position influence its quality rating.
        correct: true
        feedback: A preference for the first or left answer can distort the model comparison.
      - id: c
        text: Letting the displayed model name influence the answer's quality rating.
        correct: false
        feedback: That is identity bias. Position bias can occur even when model names are hidden.
    solution: Position bias means the answer's placement influences the preference independently of quality. Swapping the same answers helps expose sensitivity to placement.
  - id: lev-judge-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does the worked example send the cat question to a human when the judge picks Left twice?
    options:
      - id: a
        text: Left refers to different models after the swap, so the model-level preferences disagree.
        correct: true
        feedback: The first Left vote favours A, while the swapped Left vote favours B.
      - id: b
        text: Left always refers to A, so both calls establish a consistent final winner.
        correct: false
        feedback: The answer positions were swapped; model identities do not stay attached to Left.
      - id: c
        text: Left means the answers are equally good, so every repeated Left vote is a tie.
        correct: false
        feedback: Left selects a displayed answer; a tie is a separate equal-quality judgment.
    solution: After mapping the displayed choices back to models, the decisions favour different models. The predeclared rule sends that disagreement for human resolution.
  - id: lev-swap-map
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: In a first presentation Left holds B and Right holds A; the judge picks Right. In the swapped presentation Left holds A and Right holds B; the judge picks Left. Under the rule that keeps a winner only when both orders select the same model, what is the result?
    options:
      - id: a
        text: One win for B, because B appeared first in the initial presentation.
        correct: false
        feedback: Right in the first display selects A's answer. Check the model at the chosen position in each display.
      - id: b
        text: An unresolved comparison, because the displayed choices have different labels.
        correct: false
        feedback: Different position labels can refer to the same model after swapping.
      - id: c
        text: One win for A, because both displayed choices select A's answer.
        correct: true
        feedback: Right in the first call and Left in the second both map back to A.
    solution: Map each choice to the model occupying that position before comparing decisions. Both judgments select A, so this prompt contributes one final win for A.
  - id: lev-unresolved
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A study compares the same answer pair in both display orders. One order says A wins, and the swapped order says tie. How should the prompt be reported before human resolution of the two judgments?
    options:
      - id: a
        text: As a final tie, since one tie vote overrides any preference for a model.
        correct: false
        feedback: The declared rule requires both orders to say tie to keep a tie automatically.
      - id: b
        text: As unresolved, with both judgments retained until human review gives a final decision.
        correct: true
        feedback: Disagreement is not evidence that the answers are equally good.
      - id: c
        text: As two evaluated prompts, one giving A a win and the other a tie.
        correct: false
        feedback: There is one original prompt and answer pair, not two independent comparisons.
    solution: Follow the predeclared disagreement rule and label this prompt unresolved until reviewed. Report unresolved counts alongside any rate computed from prompts that already have final decisions.
  - id: lev-length-bias
    dimension: transfer
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A task requests a brief factual answer. A judge favours a long, repetitive answer over an equally correct concise answer in both display orders. What concern remains?
    options:
      - id: a
        text: The judge may reward length rather than the stated requirement for a brief answer.
        correct: true
        feedback: Agreement across orders does not remove a preference for irrelevant length.
      - id: b
        text: The judge has no remaining bias because swapping positions solved every problem.
        correct: false
        feedback: Swapping checks how changes in placement affect ratings. Other judging errors can persist.
      - id: c
        text: Agreement in both orders establishes that the longer answer better meets the brevity requirement.
        correct: false
        feedback: The judge may consistently misapply the rubric. Agreement across positions does not establish that repetition is useful.
    solution: A judge can consistently favour length in both orders. Compare its judgments with the rubric and human checks to see whether the extra detail helps meet the task's requirements.
  - id: lev-order-design
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: A team wants to compare two assistants using an LLM judge. Which plan best checks position bias while preserving one final decision per prompt?
    options:
      - id: a
        text: Hide names, randomise one display per prompt, and treat randomisation as a check of each pair's order sensitivity.
        correct: false
        feedback: Randomising only the displayed order balances overall positions, but it cannot reveal whether this pair gets a different judgment when swapped.
      - id: b
        text: Hide names, fix the rubric, judge both orders, and count both mapped votes as independent prompt outcomes.
        correct: false
        feedback: Both calls concern one prompt and answer pair. Resolve them into one final outcome rather than doubling the prompt count.
      - id: c
        text: Hide names, fix the rubric, randomise then swap each pair, map votes to models, and resolve disagreements.
        correct: true
        feedback: This checks the same pair in both positions while retaining one outcome for the original prompt.
    solution: Keep the task and rubric fixed while changing order, then translate displayed choices to model identities. Predeclare how disagreements are resolved and keep each prompt's two judgments with its one final decision.
  - id: lev-agreement-limit
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: On every prompt, an LLM judge picks the same model in both answer orders. What is the strongest supported conclusion?
    options:
      - id: a
        text: Every selected answer is correct, so human checks would add no information.
        correct: false
        feedback: The judge can consistently miss factual errors or favour style over the rubric.
      - id: b
        text: These decisions survived this order check, but other errors still need human sample checks.
        correct: true
        feedback: Agreement across orders shows these choices survived the position check. Human checks can still reveal factual errors or other biases.
      - id: c
        text: Position bias is absent on future prompts because it was absent on these comparisons.
        correct: false
        feedback: Stability on the tested pairs does not guarantee stability on different prompts or answer pairs.
    solution: The observed choices did not change model preference under these swaps. Human-reviewed samples are still needed because stable choices can reflect other biases or factual mistakes.
  - id: lev-explain-evaluation
    dimension: transfer
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt: "You want to compare a fine-tuned reading assistant with its starting model. Explain why a public benchmark score might mislead, which tasks you would reserve for final evaluation, and how to compute a pairwise preference rate when some comparisons are ties."
    rubric:
      - id: clean-tasks
        criterion:
          Explain that training exposure to benchmark questions, answers or close copies can raise the score
          by recall.
        weight: 1
        required: true
      - id: fresh-tasks
        criterion: Reserve fresh, representative final evaluation questions and answers outside training and development.
        weight: 1
        required: true
      - id: defined-score
        criterion: Compute $(\text{wins}+0.5\times\text{ties})/(\text{wins}+\text{ties}+\text{losses})$ from final decisions.
        weight: 1
        required: true
    exemplar: "Public benchmark questions or answers may have entered training, so a high score can partly reflect recall. Reserve fresh, representative evaluation questions and keep their answers out of training and development. Count ties as half a win and compute $(\\text{wins}+0.5\\times\\text{ties})/(\\text{wins}+\\text{ties}+\\text{losses})$ from the final decisions."

  - id: "lev-recall-clean-say"
    dimension: "conceptual"
    type: "explain"
    role: "recall"
    knowledge_point: "lev-clean-benchmarks"
    difficulty: 1
    est_minutes: 1
    prompt: "What is benchmark contamination, and how can it affect a reported score?"
    rubric:
      - id: "definition"
        criterion: "Explain that test questions, answers or close copies have entered training data."
        weight: 1
        required: true
      - id: "meaning"
        criterion: "Explain that recalling seen questions and answers can raise the score."
        weight: 1
        required: true
    exemplar: "Contamination occurs when test questions, answers or close copies enter training. Recalling them can raise the score."
  - id: "lev-recall-clean-contrast"
    dimension: "conceptual"
    type: "mc"
    role: "recall"
    knowledge_point: "lev-clean-benchmarks"
    difficulty: 1
    est_minutes: 0.5
    prompt: "Which practice preserves an independent final check after choosing model changes?"
    options:
      - id: "a"
        text: "Choose changes on one group and report on a reserved group."
        correct: true
        feedback: "A reserved group gives a separate check of the model once choices are fixed."
      - id: "b"
        text: "Choose changes on both groups and report on the harder group."
        correct: false
        feedback: "The model choices can adapt to either group if both inform those choices."
      - id: "c"
        text: "Train on one group and report on reworded copies of it."
        correct: false
        feedback: "Close copies in training contaminate the evaluation."
    solution: "Reserve one group for the final report. Predictions on that group do not inform model changes."
  - id: "lev-recall-clean-formula"
    dimension: "math"
    type: "expression"
    role: "recall"
    knowledge_point: "lev-clean-benchmarks"
    difficulty: 2
    est_minutes: 0.5
    prompt: "A benchmark scores $Q$ questions right or wrong and the model answers $C$ correctly. Write its accuracy as a fraction."
    answer: "C/Q"
    variables: { "C": { "values": [1, 5, 10] }, "Q": { "values": [12, 30, 50] } }
    solution: "Accuracy is correct answers divided by all questions scored."
  - id: "lev-recall-pairwise-say"
    dimension: "conceptual"
    type: "explain"
    role: "recall"
    knowledge_point: "lev-pairwise-scores"
    difficulty: 1
    est_minutes: 1
    prompt: "What does a pairwise evaluation judge, and how much credit does a tie receive in the tie-adjusted win rate?"
    rubric:
      - id: "definition"
        criterion: "Explain that it compares two answers to the same prompt using a stated rule."
        weight: 1
        required: true
      - id: "meaning"
        criterion: "Explain that a tie receives half a point."
        weight: 1
        required: true
    exemplar: "A pairwise evaluation compares two answers to one prompt using a stated rule. The tie-adjusted rate gives half a point for a tie."
  - id: "lev-recall-pairwise-contrast"
    dimension: "conceptual"
    type: "mc"
    role: "recall"
    knowledge_point: "lev-pairwise-scores"
    difficulty: 1
    est_minutes: 0.5
    prompt: "What does a tie-adjusted win rate describe?"
    options:
      - id: "a"
        text: "How often a model gives an answer that is judged correct."
        correct: false
        feedback: "Accuracy counts correct answers; pairwise judging can favour one of two wrong answers."
      - id: "b"
        text: "How much probability a model gives to the actual next token."
        correct: false
        feedback: "Next-token probability is a model prediction."
      - id: "c"
        text: "How often a model beats an opponent, with half credit for ties."
        correct: true
        feedback: "The rate depends on the opponent, prompts and judging rule."
    solution: "The rate depends on the opponent, prompts and judging rule."
  - id: "lev-recall-pairwise-formula"
    dimension: "math"
    type: "expression"
    role: "recall"
    knowledge_point: "lev-pairwise-scores"
    difficulty: 2
    est_minutes: 0.5
    prompt: "Model A wins $W_A$ times and draws $D$ times across $P$ prompts with final decisions. Write A's tie-adjusted win rate as a fraction. Type `WA` for $W_A$."
    answer: "(WA+0.5*D)/P"
    variables:
      {
        "WA": { "values": [1, 5, 10] },
        "D": { "values": [1, 3, 5] },
        "P": { "values": [20, 30, 40] },
      }
    solution: "Give one point per win and half per draw, then divide by all decisions."
  - id: "lev-recall-judge-say"
    dimension: "conceptual"
    type: "explain"
    role: "recall"
    knowledge_point: "lev-judge-bias"
    difficulty: 1
    est_minutes: 1
    prompt: "What is position bias in an LLM judge, and how do swapped-order comparisons check for it?"
    rubric:
      - id: "definition"
        criterion: "Explain that displayed position can influence an answer's rating."
        weight: 1
        required: true
      - id: "meaning"
