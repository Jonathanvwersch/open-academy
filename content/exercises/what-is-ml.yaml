  - id: ml-recall-robots-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: ml-to-robots
    difficulty: 1
    est_minutes: 0.5
    prompt: A robot learns to pick up a cup from 200 recordings of a person steering it with a joystick. Which kind of learning is this?
    options:
      - id: a
        text: Imitation learning
        correct: true
        feedback: Imitation learning treats a person's recorded demonstrations as the answers, then uses the supervised cycle.
      - id: b
        text: Reinforcement learning
        correct: false
        feedback: Reinforcement learning has no recorded answers. It learns by trial and error from a reward for each attempt.
      - id: c
        text: Writing a rule by hand
        correct: false
        feedback: A hand-written rule comes from a person and is never fitted to the recordings.
    solution: The recorded movements are the answers the robot copies, which is imitation learning.
  - id: ml-recall-robots-contrast2
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: ml-to-robots
    difficulty: 1
    est_minutes: 0.5
    prompt: A robot learns by trial and error. What tells it how well an attempt went?
    options:
      - id: a
        text: A recorded movement to copy
        correct: false
        feedback: Recorded movements are the answers in imitation learning, which copies a person's demonstrations.
      - id: b
        text: A reward score for the attempt
        correct: true
        feedback: Reinforcement learning scores each attempt with a reward and learns to make it as large as possible.
      - id: c
        text: A weight inside its model
        correct: false
        feedback: Weights are the numbers training changes. They give no score for an attempt.
    solution: Reinforcement learning scores attempts with rewards and learns to increase them.
