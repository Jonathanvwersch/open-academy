    exemplar: "Given the prefix, the model produces one score per vocabulary token and uses softmax to make next-token probabilities. Training averages minus the log of the probability given to each true next token. To generate, it chooses a token greedily or by sampling those probabilities, appends it to the prefix and runs again."
    solution: "Given the prefix, the model produces one score per vocabulary token and uses softmax to make next-token probabilities. Training averages minus the log of the probability given to each true next token. To generate, it chooses a token greedily or by sampling those probabilities, appends it to the prefix and runs again."
