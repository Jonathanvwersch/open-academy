  - id: alm-recall-next-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: alm-next-token
    difficulty: 1
    est_minutes: 0.5
    prompt: "What does $p(\\text{sat}\\mid\\text{the cat})$ describe?"
    options:
      - id: a
        text: "The probability that sat comes directly after the cat"
        correct: true
        feedback: "The expression predicts the next token after that prefix."
      - id: b
        text: "The score assigned to sat before applying softmax"
        correct: false
        feedback: "A score is an output-layer number. Softmax converts scores into the probabilities written with $p$."
      - id: c
        text: "The attention weight assigned to the token cat"
        correct: false
        feedback: "Attention weights mix source values inside the transformer. This probability is over possible next vocabulary tokens."
    solution: "The conditional probability gives the chance of sat as the next token after the cat."
  - id: alm-recall-next-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: alm-next-token
