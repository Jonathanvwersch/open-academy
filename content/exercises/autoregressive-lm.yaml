  - id: alm-recall-sampling-contrast2
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: alm-sampling
    difficulty: 1
    est_minutes: 0.5
    prompt: "Why does generation need another model run after choosing each token?"
    options:
      - id: a
        text: "Its next input includes the token just chosen."
        correct: true
        feedback: "The new prefix depends on that choice, so the next prediction uses the extended text."
      - id: b
        text: "Its next input is already supplied by the training text."
        correct: false
        feedback: "That describes teacher forcing. During generation the continuation consists of the model's choices."
      - id: c
        text: "Its causal mask is removed to expose later tokens."
        correct: false
        feedback: "Later tokens do not exist yet. Causal prediction uses only the prefix already available."
