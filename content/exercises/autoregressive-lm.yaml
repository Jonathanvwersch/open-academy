  - id: alm-recall-teacher-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: alm-teacher-forcing
    difficulty: 1
    est_minutes: 0.5
    prompt: "During training, the output at position $t$ is scored against which token?"
    options:
      - id: a
        text: "$x_t$"
        correct: false
        feedback: "Position $t$ already has $x_t$ as input, so scoring against it would only teach copying."
      - id: b
        text: "$x_{t+1}$"
        correct: true
        feedback: "The targets are the sentence shifted left by one, so position $t$ predicts the token after it."
      - id: c
        text: "$x_{t-1}$"
        correct: false
        feedback: "Position $t$ can already see the earlier token $x_{t-1}$. Its target is the token after $x_t$."
    solution: "Each position predicts the next token, so the output at position $t$ is scored against $x_{t+1}$."
  - id: alm-recall-teacher-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: alm-teacher-forcing
    difficulty: 2
    est_minutes: 0.5
    prompt: "A three-token training sentence supplies two next-token targets. Their true-token probabilities are $p$ and $q$. Write the sentence's mean cross-entropy loss. Type `ln(...)` for the natural logarithm."
    answer: "-(log(p)+log(q))/2"
    variables: { "p": [0.05, 0.95], "q": [0.05, 0.95] }
    solution: "Average the two losses: $L=(-\\ln p-\\ln q)/2$."
