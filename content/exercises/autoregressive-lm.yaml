    prompt: "Let $a=p(\\text{cat}\\mid\\text{the})$ and $b=p(\\text{sat}\\mid\\text{the cat})$. Write $p(\\text{cat sat}\\mid\\text{the})$."
    answer: "a*b"
    variables: { "a": [0.05, 0.95], "b": [0.05, 0.95] }
    solution: "Multiply successive conditional probabilities: $p(\\text{cat sat}\\mid\\text{the})=ab$."
