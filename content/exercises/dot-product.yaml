concept: dot-product
exercises:
  - id: dotp-total
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A viewer's taste weights are $(1,2,3)$ for action, comedy and romance. A film has scores $(4,-5,6)$ in that order. Negative scores mean the film has the opposite qualities in that category. What is the dot product?"
    solution: "Multiply matching entries, then add: $1\\cdot4+2\\cdot(-5)+3\\cdot6=4-10+18=12$. The result is one number."
    options:
      - { id: a, text: "12", correct: true, feedback: "The contributions are 4, minus 10 and 18." }
      - {
          id: b,
          text: "32",
          correct: false,
          feedback: "The second contribution is negative: two times minus five.",
        }
      - {
          id: c,
          text: "21",
          correct: false,
          feedback: "Adding all entries is not multiplying matching entries first.",
        }
  - id: dotp-total-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A film app uses taste weights $w=({{=u}},{{=v}})$ and film scores $x=({{=a}},{{=b}})$, both ordered as (action, comedy). What recommendation score does $w\\cdot x$ give?"
    solution: "The contributions are ${{=u}}\\cdot{{=a}}={{=u*a}}$ and ${{=v}}\\cdot{{=b}}={{=v*b}}$. Adding them gives ${{=u*a+v*b}}$, the weighted score."
    tolerance: { abs: 0.000001 }
    params:
      u: { min: 1, max: 4 }
      v: { min: -3, max: 3 }
      a: { min: 2, max: 8 }
      b: { min: 1, max: 5 }
    answer_expr: "u*a+v*b"

  - id: dotp-model
    dimension: transfer
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A film app uses taste weights $(0.5,2)$ for action and comedy. A film's comedy score rises by 1 while its action score stays fixed. How does the recommendation score change?"
    solution: "The extra comedy score adds $2\\cdot1=2$ to the total. The action part does not change."
    options:
      - {
          id: a,
          text: "The score rises by 2.",
          correct: true,
          feedback: "The comedy weight is 2, so each extra comedy point adds 2 to the total.",
        }
      - {
          id: b,
          text: "The score rises by 0.5.",
          correct: false,
          feedback: "The weight 0.5 belongs to action, which has not changed.",
        }
      - {
          id: c,
          text: "The whole score doubles.",
          correct: false,
          feedback: "The weight multiplies the added comedy point. It does not multiply the existing total.",
        }
  - id: dotp-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A film's scores are $(4,1)$ in the order (action, comedy). A viewer's weights are $(2,0.5)$ but are stored in the order (comedy, action). What should the app do before calculating their dot product?"
    solution: "The dot product pairs entries by position. Reorder one list so each feature is matched to its own weight."
    options:
      - {
          id: a,
          text: "It should reorder the weights to match the film's categories.",
          correct: true,
          feedback: "Each weight must multiply its intended feature.",
        }
      - {
          id: b,
          text: "It should add the two vectors first.",
          correct: false,
          feedback: "Adding entries does not fix which feature each weight belongs to.",
        }
      - {
          id: c,
          text: "It should keep the order because addition ignores order.",
          correct: false,
          feedback: "Reordering one vector alone changes the paired products.",
        }
  - id: dotp-negative-weight
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A viewer's taste weights are $(2,-1)$ for action and comedy. The negative weight means they dislike comedy. If a film gains 1 comedy point while its action score stays fixed, what happens to its recommendation score?"
    solution: "The extra comedy point adds $(-1)\\cdot1=-1$ to the total. The recommendation score falls by 1."
    options:
      - {
          id: a,
          text: "The score falls by 1.",
          correct: true,
          feedback: "The viewer's comedy weight is minus one.",
        }
      - {
          id: b,
          text: "The score rises by 1.",
          correct: false,
          feedback: "A negative weight makes an increase lower the score.",
        }
      - {
          id: c,
          text: "The score stays unchanged.",
          correct: false,
          feedback: "Only a zero comedy weight would ignore the extra comedy point.",
        }
  - id: dotp-why-total
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A film app uses taste weights $(0.5,2)$ and film scores $(4,1)$ for action and comedy. Why add the matching products instead of leaving them as a list?"
    solution: "The matching products are $(2,2)$, one number for each category. Adding gives 4, a single recommendation score the app can use to rank this film."
    options:
      - {
          id: a,
          text: "Adding gives one number for ranking the film.",
          correct: true,
          feedback: "Multiplication sets each contribution's size; addition totals them.",
        }
      - {
          id: b,
          text: "A list of products already gives one number for ranking the film.",
          correct: false,
          feedback: "A list still has separate entries. It does not supply the requested single score.",
        }
      - {
          id: c,
          text: "Adding makes both categories equally important, whatever the weights.",
          correct: false,
          feedback: "Weights have already changed the contributions before addition. Adding does not undo that weighting.",
        }
  - id: dotp-sign
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two non-zero arrows start at $(0,0)$ and form an angle greater than 90 degrees. What sign is their dot product?"
    solution: "The dot product is the product of two positive lengths and the angle cosine. Above 90 degrees the cosine is negative, so the score is negative."
    options:
      - {
          id: a,
          text: "It is negative because the projection points against the other arrow.",
          correct: true,
          feedback: "Cosine is negative for angles above 90 degrees.",
        }
      - {
          id: b,
          text: "It is positive because both arrows have positive lengths.",
          correct: false,
          feedback: "Positive lengths multiply a negative cosine.",
        }
      - {
          id: c,
          text: "It is zero because the arrows are different.",
          correct: false,
          feedback: "Only a right angle gives zero for non-zero arrows.",
        }
  - id: dotp-alignment-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two arrows from the origin are $a=({{=h}},{{=v}})$ and $b=({{=k}},0)$. What is $a\\cdot b$?"
    solution: "The first pair contributes ${{=h}}\\cdot{{=k}}={{=h*k}}$. The second contributes ${{=v}}\\cdot0=0$, so the total is ${{=h*k}}$."
    tolerance: { abs: 0.000001 }
    params:
      h: { min: -4, max: 4 }
      v: { min: 1, max: 5 }
      k: { min: 1, max: 4 }
    answer_expr: "h*k"

  - id: dotp-right-angle
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two non-zero arrows have dot product zero. What does this tell you about their directions?"
    solution: "With both lengths non-zero, a zero dot product means $\\cos\\theta=0$. The arrows are perpendicular, also called orthogonal."
    options:
      - {
          id: a,
          text: "The arrows meet at a right angle.",
          correct: true,
          feedback: "Non-zero lengths mean the angle cosine must be zero.",
        }
      - {
          id: b,
          text: "The arrows point in opposite directions.",
          correct: false,
          feedback: "Opposite arrows give a negative dot product.",
        }
      - {
          id: c,
          text: "The arrows must have equal lengths.",
          correct: false,
          feedback: "A zero dot product tells you about the angle. It does not require equal lengths.",
        }
  - id: dotp-projection
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two arrows are $a=(3,4)$ and $b=(2,0)$. The projection of $a$, its signed shadow along $b$'s direction, has length 3. What is $a\\cdot b$?"
    solution: "Multiply the signed projection by the other arrow length: $3\\cdot2=6$. Direct multiplication agrees: $3\\cdot2+4\\cdot0=6$."
    tolerance: { abs: 0.000001 }
    answer: 6

  - id: dotp-reverse
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two arrows have dot product 6. Reverse the second arrow without changing its length. What is their new dot product?"
    solution: "Reversing one vector negates each matching product. Their sum becomes $-6$, reflecting the reversed projection."
    options:
      - {
          id: a,
          text: "It is minus 6 because every product changes sign.",
          correct: true,
          feedback: "Reversing one vector changes every product sign.",
        }
      - {
          id: b,
          text: "It stays plus 6 because both lengths stay fixed.",
          correct: false,
          feedback: "The length is unchanged, but the projection now points against the reversed arrow.",
        }
      - {
          id: c,
          text: "It becomes zero because reversing an arrow makes it perpendicular.",
          correct: false,
          feedback: "Reversing gives the opposite direction, not a right-angle turn.",
        }
  - id: dotp-why-not-lengths
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Arrows $(2,0)$ and $(-2,0)$ both have length 2. Why can't lengths alone measure how much they point the same way?"
    solution: "Their equal lengths do not record their opposite directions. Their dot product is $2\\cdot(-2)+0\\cdot0=-4$, which records that opposition."
    options:
      - {
          id: a,
          text: "Equal lengths can belong to opposite arrows, which a negative dot product distinguishes.",
          correct: true,
          feedback: "Length measures how far an arrow reaches, not which way it points.",
        }
      - {
          id: b,
          text: "Equal lengths force the arrows to point the same way.",
          correct: false,
          feedback: "Reversing an arrow preserves its length but gives the opposite direction.",
        }
      - {
          id: c,
          text: "Multiplying the lengths gives a negative number for opposite arrows.",
          correct: false,
          feedback: "Non-zero lengths are positive. Their product cannot record opposition without the angle cosine.",
        }
  - id: dotp-cosine
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two viewers rate action and comedy as $a=(3,4)$ and $b=(4,3)$. What is their cosine similarity?"
    solution: "The dot product is $12+12=24$ and both lengths are 5. Divide by both lengths to get $24/(5\\cdot5)=0.96$."
    tolerance: { abs: 0.000001 }
    answer: 0.96

  - id: dotp-cosine-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two viewers rate action and comedy as $a=(3,4)$ and $b=({{=k}},3)$. What is their cosine similarity? Round to three decimal places."
    solution: "The dot product is $3\\cdot{{=k}}+4\\cdot3={{=3*k+12}}$. The arrow lengths are 5 and $\\sqrt{ {{=k*k+9}} }$. Dividing by their product gives ${{=(3*k+12)/(5*sqrt(k*k+9))}}$."
    tolerance: { abs: 0.00051 }
    params:
      k: { min: 1, max: 6 }
    answer_expr: "(3*k+12)/(5*sqrt(k*k+9))"

  - id: dotp-scaling
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A viewer triples every rating in their non-zero taste vector for action and comedy. Why does its cosine similarity with another viewer's fixed non-zero vector stay unchanged?"
    solution: "The top and bottom of the fraction both triple. Cancelling that factor leaves cosine similarity unchanged."
    options:
      - {
          id: a,
          text: "Both parts of the fraction triple, so the factor of three cancels.",
          correct: true,
          feedback: "The dot product and that vector length both triple.",
        }
      - {
          id: b,
          text: "It triples because the dot product triples.",
          correct: false,
          feedback: "You must also divide by the tripled length.",
        }
      - {
          id: c,
          text: "It becomes one because the vector is longer.",
          correct: false,
          feedback: "Being longer does not make directions identical.",
        }
  - id: dotp-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "One viewer has supplied no preferences, giving a taste vector $(0,0)$ for action and comedy. Another has ratings $(1,2)$. Can the app calculate their cosine similarity?"
    solution: "Cosine similarity divides by both norms. The zero vector has norm zero, making the ratio undefined."
    options:
      - {
          id: a,
          text: "No. The bottom of the fraction contains a zero length.",
          correct: true,
          feedback: "The zero vector has no direction and division by zero is undefined.",
        }
      - {
          id: b,
          text: "Yes. It is zero because the dot product is zero.",
          correct: false,
          feedback: "Even when the top of the fraction is zero, division by zero is not valid.",
        }
      - {
          id: c,
          text: "Yes. It is one because a zero vector points every way.",
          correct: false,
          feedback: "The zero vector has no direction, not every direction.",
        }
  - id: dotp-attention
    dimension: transfer
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A viewer's taste vector and a film's category vector have dot product 2. The app triples every film rating without changing the viewer's tastes. What happens to the dot product?"
    solution: "Multiplying the film vector by 3 multiplies the dot product by 3, so the score becomes 6. The dot product depends on rating size as well as the balance of categories."
    options:
      - {
          id: a,
          text: "The score becomes 6 even though the film's balance of categories is unchanged.",
          correct: true,
          feedback: "Each film rating triples, so every product in the sum triples.",
        }
      - {
          id: b,
          text: "The score stays 2 because direction is unchanged.",
          correct: false,
          feedback: "Cosine similarity would stay unchanged. An unadjusted dot product also depends on rating size.",
        }
      - {
          id: c,
          text: "The score becomes 18 because the arrow's length is squared.",
          correct: false,
          feedback: "Only the film vector is multiplied by 3. The total gains one factor of 3, not two.",
        }
  - id: dotp-position
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two viewers rate action and comedy as $(1,1)$ and $(10,10)$. Their cosine similarity is one. What does that establish?"
    solution: "Both viewers give equal importance to action and comedy, so their arrows point the same way. Their rating sizes are different."
    options:
      - {
          id: a,
          text: "They give the categories the same relative importance, but use different rating sizes.",
          correct: true,
          feedback: "One is ten times longer, so their endpoints differ.",
        }
      - {
          id: b,
          text: "They gave exactly the same ratings.",
          correct: false,
          feedback: "Cosine similarity ignores their different lengths.",
        }
      - {
          id: c,
          text: "The distance between the two rating vectors is zero.",
          correct: false,
          feedback: "Different coordinates give a non-zero distance despite equal direction.",
        }
  - id: dot-check-1
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: "A viewer's taste vector is $(1,2,3)$ and a film's category vector is $(4,-5,6)$, both ordered as (action, comedy, romance). Calculate the recommendation score using their dot product."
    answer: 12
    tolerance: { abs: 0.001 }
    hints: ["Multiply matching entries: $1\\cdot4$, $2\\cdot(-5)$, $3\\cdot6$."]
    solution: "$4 - 10 + 18 = 12$."
  - id: dot-faded-cos
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "Two viewers rate action and comedy as $a=(3,4)$ and $b=(4,3)$. Calculate their cosine similarity to two decimal places."
    answer: 0.96
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer: 24,
          category: incomplete_explanation,
          feedback: "24 is the dot product. Cosine similarity divides by $\\|a\\|\\|b\\| = 25$.",
        }
    hints: ["$a \\cdot b = 24$.", "Divide by $\\|a\\|\\|b\\| = 5 \\cdot 5$."]
    solution: "$24 / 25 = 0.96$: almost the same direction."
  - id: dot-cos-core
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "Two viewers rate action, comedy and romance as $u=(1,0,1)$ and $v=(0,1,1)$. What is their cosine similarity?"
    answer: 0.5
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer: 1,
          category: incomplete_explanation,
          feedback: "1 is the dot product. You still need to divide by both lengths ($\\sqrt2$ each).",
        }
    hints: ["$u \\cdot v = 1$.", "$\\|u\\| = \\|v\\| = \\sqrt2$."]
    solution: "$\\frac{1}{\\sqrt2\\sqrt2} = 0.5$, an angle of $60^\\circ$."
  - id: dot-review-zero
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "Two viewers' non-zero taste vectors have dot product $0$. What can you conclude about their arrows, drawn from the same starting point?"
    options:
      - {
          id: a,
          text: "The arrows are perpendicular, meaning they meet at a right angle.",
          correct: true,
        }
      - {
          id: b,
          text: "At least one vector must be zero.",
          correct: false,
          category: misunderstood_definition,
          feedback: "The question says both are non-zero. $(1,0)\\cdot(0,1) = 0$.",
        }
      - {
          id: c,
          text: "The arrows point in opposite directions.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Opposite directions give a *negative* dot product ($\\cos 180^\\circ = -1$).",
        }
      - {
          id: d,
          text: "The vectors are identical.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Identical non-zero vectors have a positive dot product, because it adds the squares of their entries.",
        }
    solution: "$a\\cdot b = \\|a\\|\\|b\\|\\cos\\theta = 0$ with non-zero lengths means $\\cos\\theta = 0$, so $\\theta = 90^\\circ$."
  - id: dot-review-weighted
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 2
    prompt: "A film app uses taste weights $w=(2,-1,0.5)$ for action, comedy and romance. A film has ratings $x=(3,4,2)$ in that order. What recommendation score does $w\\cdot x$ give?"
    answer: 3
    tolerance: { abs: 0.001 }
    solution: "$6 - 4 + 1 = 3$."
  - id: dot-transfer-attention
    dimension: transfer
    type: mc
    role: transfer
    difficulty: 2
    est_minutes: 2
    prompt: "A film app gives a film a positive recommendation score by taking the dot product of its category ratings with your taste weights. The app then triples every category rating for that film. Why might the new score be misleading?"
    options:
      - {
          id: a,
          text: "Its score triples even though its balance of categories has not changed.",
          correct: true,
        }
      - {
          id: b,
          text: "Its score stays unchanged because dot products depend only on direction.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Cosine similarity would stay unchanged. In a dot product, every multiplied pair now gives three times its previous value.",
        }
      - {
          id: c,
          text: "Its score becomes nine times larger.",
          correct: false,
          category: math_error,
          feedback: "Only the film's ratings triple. Your weights stay fixed, so each product gains one factor of three.",
        }
      - {
          id: d,
          text: "Its score becomes negative.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Multiplying a positive score by three keeps it positive.",
        }
    hints: ["What happens to each product if only the film's number triples?"]
    solution: "Every category adds three times its previous amount, so the total triples. The film may now rank higher without matching your balance of interests any better."
  - id: dot-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "A film app compares your taste weights with a film's category ratings using a dot product. Explain in 2–4 sentences why that can measure agreement, and why larger ratings can make the comparison misleading."
    rubric:
      - {
          id: r1,
          criterion: "States $a\\cdot b = \\|a\\|\\|b\\|\\cos\\theta$, or equivalently that it is large when the vectors point the same way",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Notes that it also grows with vector length, so long vectors score high even if they are less aligned",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Mentions cosine similarity or normalisation as the length-independent alternative",
          weight: 1,
        }
    exemplar: "For fixed arrow lengths, the dot product is largest when the represented tastes point in the same direction. It is zero for perpendicular arrows and negative for opposing arrows. Larger rating sizes can raise the score even without a better balance of interests. Cosine similarity divides by both lengths to compare direction alone."
