  - id: dot-transfer-attention
    dimension: transfer
    type: mc
    role: transfer
    difficulty: 2
    est_minutes: 2
    prompt: "Two non-zero arrows have a positive dot product. One arrow is made three times as long without turning. Why would using the new dot product alone to judge agreement of direction be misleading?"
    options:
      - {
          id: a,
          text: "The dot product triples even though the angle between the arrows has not changed.",
          correct: true,
        }
      - {
          id: b,
          text: "The dot product stays the same, because a dot product depends only on the angle.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Cosine similarity would stay unchanged. In a dot product, every multiplied pair now gives three times its previous value.",
        }
      - {
          id: c,
          text: "The dot product becomes nine times larger, since every product gains a factor of three twice.",
          correct: false,
          category: math_error,
          feedback: "Only one vector triples. The other stays fixed, so each product gains one factor of three.",
        }
      - {
          id: d,
          text: "The dot product turns negative, because the longer arrow now reaches past the other one.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The sign depends on the angle, which hasn't changed. Multiplying a positive score by three keeps it positive.",
        }
    hints: ["What happens to each product if only one vector's component triples?"]
    solution: "Every matching product becomes three times as large, so the total triples. The angle has not changed. Cosine similarity divides by both lengths to compare direction alone."
