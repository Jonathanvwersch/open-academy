  - id: dot-transfer-attention
    dimension: transfer
    type: mc
    role: transfer
    difficulty: 2
    est_minutes: 2
    prompt: "Two non-zero arrows have a positive dot product. One arrow is made three times as long without turning. Why would using the new dot product alone to judge agreement of direction be misleading?"
    options:
      - {
          id: a,
          text: "The dot product triples even though the angle between the arrows has not changed.",
          correct: true,
        }
      - {
          id: b,
          text: "Its score stays unchanged because dot products depend only on direction.",
          correct: false,
          category: misunderstood_definition,
