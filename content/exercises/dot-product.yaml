concept: dot-product
exercises:
  - id: dotp-total
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two vectors are $a=(1,2,3)$ and $b=(4,-5,6)$. What is their dot product?"
    solution: "Multiply matching entries, then add: $1\\cdot4+2\\cdot(-5)+3\\cdot6=4-10+18=12$. The result is one number."
    options:
      - { id: a, text: "12", correct: true, feedback: "The contributions are 4, minus 10 and 18." }
      - {
          id: b,
          text: "32",
          correct: false,
          feedback: "The second contribution is negative: two times minus five.",
        }
      - {
          id: c,
          text: "21",
          correct: false,
          feedback: "Adding all entries is not multiplying matching entries first.",
        }
  - id: dotp-total-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A simplified house-price model uses weights $w=({{=u}},{{=v}})$ for area in tens of square metres and age in years. A house has $x=({{=a}},{{=b}})$ in that order. Each weight is in thousand pounds per feature unit. What is $w\\cdot x$, in thousand pounds?"
    solution: "The contributions are ${{=u}}\\cdot{{=a}}={{=u*a}}$ and ${{=v}}\\cdot{{=b}}={{=v*b}}$. Adding them gives ${{=u*a+v*b}}$, the weighted score."
    tolerance: { abs: 0.000001 }
    params:
      u: { min: 1, max: 4 }
      v: { min: -3, max: 3 }
      a: { min: 2, max: 8 }
      b: { min: 1, max: 5 }
    answer_expr: "u*a+v*b"

  - id: dotp-model
    dimension: transfer
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A simplified house-price model uses weights $(0.5,2)$ for area in tens of square metres and bedroom count, in thousand pounds per feature unit. A house gains one bedroom while its area stays fixed. How does the predicted price change?"
    solution: "The extra bedroom adds $2\\cdot1=2$ thousand pounds to the total. The area contribution does not change."
    options:
      - {
          id: a,
          text: "The predicted price rises by 2 thousand pounds.",
          correct: true,
          feedback: "The bedroom weight is 2, so each extra bedroom adds 2 thousand pounds.",
        }
      - {
          id: b,
          text: "The predicted price rises by 0.5 thousand pounds.",
          correct: false,
          feedback: "The weight 0.5 belongs to area, which has not changed.",
        }
      - {
          id: c,
          text: "The whole predicted price doubles.",
          correct: false,
          feedback: "The weight multiplies the added bedroom. It does not multiply the existing total.",
        }
  - id: dotp-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A house's features are $(4,1)$ in the order (area in tens of square metres, bedrooms). A model stores weights $(2,0.5)$ in the reverse order (bedrooms, area), in thousand pounds per feature unit. What should it do before calculating their dot product?"
    solution: "The dot product pairs entries by position. Reorder one list so each feature is matched to its own weight."
    options:
      - {
          id: a,
          text: "It should reorder the weights to match the house's features.",
          correct: true,
          feedback: "Each weight must multiply its intended feature.",
        }
      - {
          id: b,
          text: "It should add the two vectors first.",
          correct: false,
          feedback: "Adding entries does not fix which feature each weight belongs to.",
        }
      - {
          id: c,
          text: "It should keep the order because addition ignores order.",
          correct: false,
          feedback: "Reordering one vector alone changes the paired products.",
        }
  - id: dotp-negative-weight
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A simplified house-price model uses weights $(2,-1)$ for area in tens of square metres and age in years, in thousand pounds per feature unit. If age increases by one year while area stays fixed, what happens to the prediction?"
    solution: "The extra year adds $(-1)\\cdot1=-1$ thousand pounds to the total. The prediction falls by 1 thousand pounds."
    options:
      - {
          id: a,
          text: "The prediction falls by 1 thousand pounds.",
          correct: true,
          feedback: "The age weight is minus one thousand pounds per year.",
        }
      - {
          id: b,
          text: "The prediction rises by 1 thousand pounds.",
          correct: false,
          feedback: "A negative weight makes an increase lower the score.",
        }
      - {
          id: c,
          text: "The prediction stays unchanged.",
          correct: false,
          feedback: "Only a zero age weight would ignore the extra year.",
        }
  - id: dotp-why-total
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A simplified house-price model uses weights $(0.5,2)$ and features $(4,1)$ for area in tens of square metres and bedroom count. Each weight is in thousand pounds per feature unit. Why add the matching products instead of leaving them as a list?"
    solution: "The matching products are $(2,2)$, each in thousand pounds. Adding gives one predicted price of 4 thousand pounds. These small example weights illustrate the calculation, not a reliable valuation."
    options:
      - {
          id: a,
          text: "Adding gives one number for the predicted price.",
          correct: true,
          feedback: "Multiplication sets each contribution's size; addition totals them.",
        }
      - {
          id: b,
          text: "A list of products already gives one number for the predicted price.",
          correct: false,
          feedback: "A list still has separate entries. It does not supply the requested single score.",
        }
      - {
          id: c,
          text: "Adding makes both features equally important, whatever the weights.",
          correct: false,
          feedback: "Weights have already changed the contributions before addition. Adding does not undo that weighting.",
        }
  - id: dotp-sign
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two non-zero arrows start at $(0,0)$ and form an angle greater than 90 degrees. What sign is their dot product?"
    solution: "The dot product is the product of two positive lengths and the angle cosine. Above 90 degrees the cosine is negative, so the score is negative."
    options:
      - {
          id: a,
          text: "It is negative because the projection points against the other arrow.",
          correct: true,
          feedback: "Cosine is negative for angles above 90 degrees.",
        }
      - {
          id: b,
          text: "It is positive because both arrows have positive lengths.",
          correct: false,
          feedback: "Positive lengths multiply a negative cosine.",
        }
      - {
          id: c,
          text: "It is zero because the arrows are different.",
          correct: false,
          feedback: "Only a right angle gives zero for non-zero arrows.",
        }
  - id: dotp-alignment-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two arrows from the origin are $a=({{=h}},{{=v}})$ and $b=({{=k}},0)$. What is $a\\cdot b$?"
    solution: "The first pair contributes ${{=h}}\\cdot{{=k}}={{=h*k}}$. The second contributes ${{=v}}\\cdot0=0$, so the total is ${{=h*k}}$."
    tolerance: { abs: 0.000001 }
    params:
      h: { min: -4, max: 4 }
      v: { min: 1, max: 5 }
      k: { min: 1, max: 4 }
    answer_expr: "h*k"

  - id: dotp-right-angle
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two non-zero arrows have dot product zero. What does this tell you about their directions?"
    solution: "With both lengths non-zero, a zero dot product means $\\cos\\theta=0$. The arrows are perpendicular, also called orthogonal."
    options:
      - {
          id: a,
          text: "The arrows meet at a right angle.",
          correct: true,
          feedback: "Non-zero lengths mean the angle cosine must be zero.",
        }
      - {
          id: b,
          text: "The arrows point in opposite directions.",
          correct: false,
          feedback: "Opposite arrows give a negative dot product.",
        }
      - {
          id: c,
          text: "The arrows must have equal lengths.",
          correct: false,
          feedback: "A zero dot product tells you about the angle. It does not require equal lengths.",
        }
  - id: dotp-projection
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two arrows are $a=(3,4)$ and $b=(2,0)$. The projection of $a$, its signed shadow along $b$'s direction, has length 3. What is $a\\cdot b$?"
    solution: "Multiply the signed projection by the other arrow length: $3\\cdot2=6$. Direct multiplication agrees: $3\\cdot2+4\\cdot0=6$."
    tolerance: { abs: 0.000001 }
    answer: 6

  - id: dotp-reverse
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two arrows have dot product 6. Reverse the second arrow without changing its length. What is their new dot product?"
    solution: "Reversing one vector negates each matching product. Their sum becomes $-6$, reflecting the reversed projection."
    options:
      - {
          id: a,
          text: "It is minus 6 because every product changes sign.",
          correct: true,
          feedback: "Reversing one vector changes every product sign.",
        }
      - {
          id: b,
          text: "It stays plus 6 because both lengths stay fixed.",
          correct: false,
          feedback: "The length is unchanged, but the projection now points against the reversed arrow.",
        }
      - {
          id: c,
          text: "It becomes zero because reversing an arrow makes it perpendicular.",
          correct: false,
          feedback: "Reversing gives the opposite direction, not a right-angle turn.",
        }
  - id: dotp-why-not-lengths
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Arrows $(2,0)$ and $(-2,0)$ both have length 2. Why can't lengths alone measure how much they point the same way?"
    solution: "Their equal lengths do not record their opposite directions. Their dot product is $2\\cdot(-2)+0\\cdot0=-4$, which records that opposition."
    options:
      - {
          id: a,
          text: "Equal lengths can belong to opposite arrows, which a negative dot product distinguishes.",
          correct: true,
          feedback: "Length measures how far an arrow reaches, not which way it points.",
        }
      - {
          id: b,
          text: "Equal lengths force the arrows to point the same way.",
          correct: false,
          feedback: "Reversing an arrow preserves its length but gives the opposite direction.",
        }
      - {
          id: c,
          text: "Multiplying the lengths gives a negative number for opposite arrows.",
          correct: false,
          feedback: "Non-zero lengths are positive. Their product cannot record opposition without the angle cosine.",
        }
  - id: dotp-cosine
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two robot movements are $a=(3,4)$ and $b=(4,3)$, in metres east and north. What is their cosine similarity?"
    solution: "The dot product is $12+12=24$ and both lengths are 5. Divide by both lengths to get $24/(5\\cdot5)=0.96$."
    tolerance: { abs: 0.000001 }
    answer: 0.96

  - id: dotp-cosine-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two arrows are $a=(3,4)$ and $b=({{=k}},3)$. What is their cosine similarity? Round to three decimal places."
    solution: "The dot product is $3\\cdot{{=k}}+4\\cdot3={{=3*k+12}}$. The arrow lengths are 5 and $\\sqrt{ {{=k*k+9}} }$. Dividing by their product gives ${{=(3*k+12)/(5*sqrt(k*k+9))}}$."
    tolerance: { abs: 0.00051 }
    params:
      k: { min: 1, max: 6 }
    answer_expr: "(3*k+12)/(5*sqrt(k*k+9))"

  - id: dotp-scaling
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "One non-zero arrow is made three times as long without turning. Another non-zero arrow stays fixed. Why does their cosine similarity stay unchanged?"
    solution: "The top and bottom of the fraction both triple. Cancelling that factor leaves cosine similarity unchanged."
    options:
      - {
          id: a,
          text: "Both parts of the fraction triple, so the factor of three cancels.",
          correct: true,
          feedback: "The dot product and that vector length both triple.",
        }
      - {
          id: b,
          text: "It triples because the dot product triples.",
          correct: false,
          feedback: "You must also divide by the tripled length.",
        }
      - {
          id: c,
          text: "It becomes one because the vector is longer.",
          correct: false,
          feedback: "Being longer does not make directions identical.",
        }
  - id: dotp-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot has not moved, so its movement vector is $(0,0)$. Another movement is $(1,2)$ metres east and north. Can cosine similarity compare their directions?"
    solution: "Cosine similarity divides by both norms. The zero vector has norm zero, making the ratio undefined."
    options:
      - {
          id: a,
          text: "No. The bottom of the fraction contains a zero length.",
          correct: true,
          feedback: "The zero vector has no direction and division by zero is undefined.",
        }
      - {
          id: b,
          text: "Yes. It is zero because the dot product is zero.",
          correct: false,
          feedback: "Even when the top of the fraction is zero, division by zero is not valid.",
        }
      - {
          id: c,
          text: "Yes. It is one because a zero vector points every way.",
          correct: false,
          feedback: "The zero vector has no direction, not every direction.",
        }
  - id: dotp-attention
    dimension: transfer
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two arrows have dot product 2. Every entry of one vector is multiplied by 3 while the other vector stays fixed. What happens to the dot product?"
    solution: "Each matching product becomes three times as large, so their sum is $3\\cdot2=6$. The dot product depends on arrow lengths as well as their directions."
    options:
      - {
          id: a,
          text: "The dot product becomes 6 even though neither arrow has turned.",
          correct: true,
          feedback: "Each entry of one vector triples, so every product in the sum triples.",
        }
      - {
          id: b,
          text: "The score stays 2 because direction is unchanged.",
          correct: false,
          feedback: "Cosine similarity would stay unchanged. An unadjusted dot product also depends on length.",
        }
      - {
          id: c,
          text: "The score becomes 18 because the arrow's length is squared.",
          correct: false,
          feedback: "Only one vector is multiplied by 3. The total gains one factor of 3, not two.",
        }
  - id: dotp-position
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two robot movements are $(1,1)$ and $(10,10)$ metres east and north. Their cosine similarity is one. What does that establish?"
    solution: "Both movements point in the same direction because each covers equal distances east and north. Their lengths are different."
    options:
      - {
          id: a,
          text: "They have the same heading but different travel distances.",
          correct: true,
          feedback: "One is ten times longer, so their endpoints differ.",
        }
      - {
          id: b,
          text: "They represent exactly the same movement.",
          correct: false,
          feedback: "Cosine similarity ignores their different lengths.",
        }
      - {
          id: c,
          text: "The distance between their endpoints is zero.",
          correct: false,
          feedback: "Different coordinates give a non-zero distance despite equal direction.",
        }
  - id: dot-check-1
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: "Calculate the dot product of vectors $(1,2,3)$ and $(4,-5,6)$."
    answer: 12
    tolerance: { abs: 0.001 }
    hints: ["Multiply matching entries: $1\\cdot4$, $2\\cdot(-5)$, $3\\cdot6$."]
    solution: "$4 - 10 + 18 = 12$."
  - id: dot-faded-cos
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "Two arrows are $a=(3,4)$ and $b=(4,3)$. Calculate their cosine similarity to two decimal places."
    answer: 0.96
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer: 24,
          category: incomplete_explanation,
          feedback: "24 is the dot product. Cosine similarity divides by $\\|a\\|\\|b\\| = 25$.",
        }
    hints: ["$a \\cdot b = 24$.", "Divide by $\\|a\\|\\|b\\| = 5 \\cdot 5$."]
    solution: "$24 / 25 = 0.96$: almost the same direction."
  - id: dot-cos-core
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "Two vectors are $u=(1,0,1)$ and $v=(0,1,1)$. What is their cosine similarity?"
    answer: 0.5
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer: 1,
          category: incomplete_explanation,
          feedback: "1 is the dot product. You still need to divide by both lengths ($\\sqrt2$ each).",
        }
    hints: ["$u \\cdot v = 1$.", "$\\|u\\| = \\|v\\| = \\sqrt2$."]
    solution: "$\\frac{1}{\\sqrt2\\sqrt2} = 0.5$, an angle of $60^\\circ$."
  - id: dot-review-zero
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "Two non-zero vectors have dot product $0$. What can you conclude about their arrows, drawn from the same starting point?"
    options:
      - {
          id: a,
          text: "The arrows are perpendicular, meaning they meet at a right angle.",
          correct: true,
        }
      - {
          id: b,
          text: "At least one vector must be zero.",
          correct: false,
          category: misunderstood_definition,
          feedback: "The question says both are non-zero. $(1,0)\\cdot(0,1) = 0$.",
        }
      - {
          id: c,
          text: "The arrows point in opposite directions.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Opposite directions give a *negative* dot product ($\\cos 180^\\circ = -1$).",
        }
      - {
          id: d,
          text: "The vectors are identical.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Identical non-zero vectors have a positive dot product, because it adds the squares of their entries.",
        }
    solution: "$a\\cdot b = \\|a\\|\\|b\\|\\cos\\theta = 0$ with non-zero lengths means $\\cos\\theta = 0$, so $\\theta = 90^\\circ$."
  - id: dot-review-weighted
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 2
    prompt: "A simplified house-price model uses weights $w=(2,-1,0.5)$ for area in tens of square metres, age in years, and bedroom count. Each weight is in thousand pounds per feature unit. A house has $x=(3,4,2)$ in that order. What is $w\\cdot x$, in thousand pounds?"
    answer: 3
    tolerance: { abs: 0.001 }
    solution: "$6 - 4 + 1 = 3$."
  - id: dot-transfer-attention
    dimension: transfer
    type: mc
    role: transfer
    difficulty: 2
    est_minutes: 2
    prompt: "Two non-zero arrows have a positive dot product. One arrow is made three times as long without turning. Why would using the new dot product alone to judge agreement of direction be misleading?"
    options:
      - {
          id: a,
          text: "The dot product triples even though the angle between the arrows has not changed.",
          correct: true,
        }
      - {
          id: b,
          text: "Its score stays unchanged because dot products depend only on direction.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Cosine similarity would stay unchanged. In a dot product, every multiplied pair now gives three times its previous value.",
        }
      - {
          id: c,
          text: "Its score becomes nine times larger.",
          correct: false,
          category: math_error,
          feedback: "Only one vector triples. The other stays fixed, so each product gains one factor of three.",
        }
      - {
          id: d,
          text: "Its score becomes negative.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Multiplying a positive score by three keeps it positive.",
        }
    hints: ["What happens to each product if only one vector's entry triples?"]
    solution: "Every matching product becomes three times as large, so the total triples. The angle has not changed. Cosine similarity divides by both lengths to compare direction alone."
  - id: dot-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "Two robot movement vectors record metres east and north. Explain in 2–4 sentences how their dot product measures agreement between their directions, and why a longer movement can raise the score without making the headings closer."
    rubric:
      - {
          id: r1,
          criterion: "States $a\\cdot b = \\|a\\|\\|b\\|\\cos\\theta$, or equivalently that it is large when the vectors point the same way",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Notes that it also grows with vector length, so long vectors score high even if they are less aligned",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Mentions cosine similarity or normalisation as the length-independent alternative",
          weight: 1,
        }
    exemplar: "For fixed lengths, the dot product is largest when the movement arrows point in the same direction. It is zero for perpendicular arrows and negative when their angle exceeds a right angle. Lengthening one arrow without turning raises a positive score even though the headings are no closer. Cosine similarity divides by both non-zero lengths to compare direction alone."
