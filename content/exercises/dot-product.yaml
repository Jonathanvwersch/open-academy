concept: dot-product
exercises:
  - id: dot-weighted-total-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "What does the dot product of two vectors do?"
    options:
      - {
          id: a,
          text: "It compares two directions after dividing out both vector lengths.",
          correct: false,
          feedback: "That is cosine similarity; the dot product itself also depends on both lengths.",
        }
      - {
          id: b,
          text: "It adds components in matching positions and keeps the result as a vector.",
          correct: false,
          feedback: "That is vector addition; a dot product multiplies matching components and returns one number.",
        }
      - {
          id: c,
          text: "It multiplies matching components and adds their products into one number.",
          correct: true,
          feedback: "The sum combines each matched feature's weighted contribution into one scalar.",
        }
      - {
          id: d,
          text: "It multiplies matching components but leaves each product as a separate output component.",
          correct: false,
          feedback: "That is element-wise multiplication; the dot product also adds the products together.",
        }
    solution: "The dot product multiplies matching vector components and adds those products to make one number."
  - id: dot-arrow-alignment-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "What does the sign of a dot product tell you about two arrows?"
    options:
      - {
          id: a,
          text: "Positive means the first arrow is longer, and negative means it is shorter.",
          correct: false,
          feedback: "Length is measured by the norm; the sign depends on how the directions compare.",
        }
      - {
          id: b,
          text: "Positive means the arrows' tips are far apart, and negative means they are close.",
          correct: false,
          feedback: "Distance between tips is never negative, but a dot product can be.",
        }
      - {
          id: c,
          text: "Positive means roughly the same way, zero means a right angle, and negative means more than a right angle apart.",
          correct: true,
          feedback: "The sign follows whether one arrow's shadow on the other points forwards, nowhere or backwards.",
        }
      - {
          id: d,
          text: "Positive means every component of both arrows is positive, and negative means one is not.",
          correct: false,
          feedback: "Signs of single components are not enough; $(3,-1)\\cdot(1,0)=3$ is positive even with a negative component.",
        }
    solution: "A dot product is positive for arrows less than a right angle apart, zero for perpendicular arrows and negative for arrows more than a right angle apart."
  - id: dot-direction-only-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "What is cosine similarity?"
    options:
      - {
          id: a,
          text: "A number measuring one vector's straight-line length from the origin.",
          correct: false,
          feedback: "That is the L2 norm; cosine similarity compares two directions.",
        }
      - {
          id: b,
          text: "The dot product of two vectors before dividing by their lengths.",
          correct: false,
          feedback: "That is the dot product before dividing by the lengths, so longer vectors can increase its value.",
        }
      - {
          id: c,
          text: "A score comparing vector lengths while ignoring the angle between them.",
          correct: false,
          feedback: "Cosine similarity removes vector lengths and keeps the directional comparison.",
        }
      - {
          id: d,
          text: "A score comparing non-zero vector directions without rewarding their lengths.",
          correct: true,
          feedback: "Dividing by both lengths removes size, leaving a score determined by the angle.",
        }
    solution: "Cosine similarity compares the directions of non-zero vectors without rewarding their lengths."
  - id: dotp-total
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Two vectors are $a=(1,2,3)$ and $b=(4,-5,6)$. What is their dot product?"
    solution: "Multiply matching components, then add: $1\\times4+2\\times(-5)+3\\times6=4-10+18=12$. The result is one number."
    options:
      - { id: a, text: "12", correct: true, feedback: "The contributions are 4, minus 10 and 18." }
      - {
          id: b,
          text: "32",
          correct: false,
          feedback: "The second contribution is negative: two times minus five.",
        }
      - {
          id: c,
          text: "21",
          correct: false,
          feedback: "That adds all six components and drops the minus sign; multiply matching pairs first, then add.",
        }
  - id: dotp-total-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A simplified house-price model uses weights $w=({{=u}},{{=v}})$ for area in tens of square metres and age in years. A house has $x=({{=a}},{{=b}})$ in that order. Each weight is in thousand pounds per feature unit. What is $w\\cdot x$, in thousand pounds?"
    solution: "The contributions are ${{=u}}\\times{{=a}}={{=u*a}}$ and ${{=v}}\\times{{=b}}={{=v*b}}$. Adding them gives ${{=u*a+v*b}}$, the weighted score."
    tolerance: { abs: 0.000001 }
    params:
      u: { min: 1, max: 4 }
      v: { min: -3, max: 3 }
      a: { min: 2, max: 8 }
      b: { min: 1, max: 5 }
    answer_expr: "u*a+v*b"

  - id: dotp-model
    dimension: transfer
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: "A simplified house-price model uses weights $(0.5,2)$ for area in tens of square metres and bedroom count, in thousand pounds per feature unit. A house gains one bedroom while its area stays fixed. How does the predicted price change?"
    solution: "The extra bedroom adds $2\\times1=2$ thousand pounds to the total. The area contribution does not change."
    options:
      - {
          id: a,
          text: "The predicted price rises by 2 thousand pounds.",
          correct: true,
          feedback: "The bedroom weight is 2, so each extra bedroom adds 2 thousand pounds.",
        }
      - {
          id: b,
          text: "The predicted price rises by 0.5 thousand pounds.",
          correct: false,
          feedback: "The weight 0.5 belongs to area, which has not changed.",
        }
      - {
          id: c,
          text: "The whole predicted price doubles.",
          correct: false,
          feedback: "The weight multiplies the added bedroom. It does not multiply the existing total.",
        }
  - id: dotp-quiz-backwards
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A quiz gives 3 points for a correct answer, 0 for a skip and $-1$ for a wrong answer. A student got 5 correct, skipped 3 and scored 13. How many did they get wrong?"
    solution: "Call the number wrong $w$. The score is $(5,3,w)\\cdot(3,0,-1)=15+0-w$. Setting $15-w=13$ gives $w=2$."
    tolerance: { abs: 0.000001 }
    answer: 2
  - id: dotp-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A house's features are $(4,1)$ in the order (area in tens of square metres, bedrooms). A model stores its weights as $(2,0.5)$ in the reverse order (bedrooms, area), in thousand pounds per feature unit. What price should the model predict, in thousand pounds?"
    solution: "The dot product pairs components by meaning, so each feature must meet its own weight. Area 4 takes weight 0.5 and bedrooms 1 take weight 2: $4\\times0.5+1\\times2=4$."
    options:
      - {
          id: a,
          text: "4, pairing the area with 0.5 and the bedrooms with 2.",
          correct: true,
          feedback: "Each weight multiplies the feature it belongs to, then the products are added.",
        }
      - {
          id: b,
          text: "8.5, pairing the entries in the order they are stored.",
          correct: false,
          category: misapplied_technique,
          feedback: "That multiplies the area by the bedroom weight. Reorder the weights to (area, bedrooms) = $(0.5,2)$ first.",
        }
      - {
          id: c,
          text: "7.5, adding all four numbers together.",
          correct: false,
          category: misunderstood_definition,
          feedback: "A dot product multiplies matching components before adding them.",
        }
      - {
          id: d,
          text: "1, multiplying the two weights together.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Each weight multiplies a feature of the house, and the products are added.",
        }
  - id: dotp-negative-weight
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: "A simplified house-price model uses weights $(2,-1)$ for area in tens of square metres and age in years, in thousand pounds per feature unit. If age increases by one year while area stays fixed, what happens to the prediction?"
    solution: "The extra year adds $(-1)\\times1=-1$ thousand pounds to the total. The prediction falls by 1 thousand pounds."
    options:
      - {
          id: a,
          text: "The prediction falls by 1 thousand pounds.",
          correct: true,
          feedback: "The age weight is minus one thousand pounds per year.",
        }
      - {
          id: b,
          text: "The prediction rises by 1 thousand pounds.",
          correct: false,
          feedback: "A negative weight makes an increase lower the score.",
        }
      - {
          id: c,
          text: "The prediction stays unchanged.",
          correct: false,
          feedback: "Only a zero age weight would ignore the extra year.",
        }
  - id: dotp-why-total
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, the quiz contributions were 18, 0 and $-2$. Why can they be added into one score?"
    solution: "Each count was multiplied by points per answer, so every contribution is measured in points, and points can be added into one score of 16."
    options:
      - {
          id: a,
          text: "Each count was multiplied by points per answer, so every contribution is in points.",
          correct: true,
          feedback: "Same unit, so adding gives the total score.",
        }
      - {
          id: b,
          text: "All three counts were whole numbers, so their products can always be added.",
          correct: false,
          feedback: "Whole numbers aren't the reason; what matters is that every product is measured in points.",
        }
      - {
          id: c,
          text: "The three counts add up to 10 questions, so the contributions must add up too.",
          correct: false,
          feedback: "The number of questions doesn't make the products addable; multiplying by points per answer does.",
        }
      - {
          id: d,
          text: "Adding the contributions makes each kind of answer count equally in the score.",
          correct: false,
          feedback: "The points already set how much each kind counts; adding just totals the contributions.",
        }
  - id: dotp-why-shadow
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why is the projection of $a=(7,1)$ onto $b=(6,8)$ exactly 5?"
    solution: "The drop $(4,-3)$ from $(3,4)$ to $a$'s tip meets $b$'s line at a right angle, so $a$'s shadow ends at $(3,4)$, which is $\\sqrt{3^2+4^2}=5$ from the origin."
    options:
      - {
          id: a,
          text: "The drop from $(3,4)$ to $a$'s tip meets $b$'s line at a right angle, and $(3,4)$ is 5 from the origin.",
          correct: true,
          feedback: "A right-angle drop marks where the shadow ends.",
        }
      - {
          id: b,
          text: "An arrow's shadow on a line is always exactly as long as the arrow itself, and here that is 5.",
          correct: false,
          feedback: "$a$ has length $\\sqrt{50}\\approx7.07$; its shadow is shorter because $a$ does not lie along $b$.",
        }
      - {
          id: c,
          text: "The length of $b$ is 5, and the shadow on a line always matches the length of the arrow along it.",
          correct: false,
          feedback: "$b$ has length 10, and the shadow depends on where $a$ points, not only on $b$.",
        }
  - id: dotp-sign
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: "Arrow $b=(1,0)$ points right. Arrow $a$ points up and to the left. What sign is $a\\cdot b$?"
    solution: "With $b=(1,0)$, $a\\cdot b$ is $a$'s first component: how far $a$ goes to the right. Going left makes that negative, so the dot product is negative."
    options:
      - {
          id: a,
          text: "It is negative because $a$ goes left, against $b$'s direction.",
          correct: true,
          feedback: "The distance $a$ goes along $b$ is negative, so the dot product is too.",
        }
      - {
          id: b,
          text: "It is positive because both arrows have positive lengths.",
          correct: false,
          feedback: "The lengths are positive, but the distance $a$ goes along $b$ is negative.",
        }
      - {
          id: c,
          text: "It is zero because the arrows point different ways.",
          correct: false,
          feedback: "Zero needs a right angle. This arrow also goes left, against $b$.",
        }
  - id: dotp-alignment-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Two arrows from the origin are $a=({{=h}},{{=v}})$ and $b=({{=k}},0)$. What is $a\\cdot b$?"
    solution: "The first pair contributes ${{=h}}\\times{{=k}}={{=h*k}}$. The second contributes ${{=v}}\\times0=0$, so the total is ${{=h*k}}$."
    tolerance: { abs: 0.000001 }
    params:
      h: { min: -4, max: 4 }
      v: { min: 1, max: 5 }
      k: { min: 1, max: 4 }
    answer_expr: "h*k"

  - id: dotp-right-angle
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: "Two non-zero arrows have dot product zero. What does this tell you about their directions?"
    solution: "Both lengths are non-zero, so the distance one arrow goes along the other must be zero. That happens only at a right angle: the arrows are perpendicular, also called orthogonal."
    options:
      - {
          id: a,
          text: "The arrows meet at a right angle.",
          correct: true,
          feedback: "Zero distance along the other arrow means they meet at a right angle.",
        }
      - {
          id: b,
          text: "The arrows point in opposite directions.",
          correct: false,
          feedback: "Opposite arrows give a negative dot product.",
        }
      - {
          id: c,
          text: "The arrows must have equal lengths.",
          correct: false,
          feedback: "A zero dot product tells you about the angle. It does not require equal lengths.",
        }
  - id: dotp-projection
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: "Two arrows are $a=(3,4)$ and $b=(2,0)$. The projection of $a$ onto $b$, the distance $a$ goes in $b$'s direction, is 3. What is $a\\cdot b$?"
    solution: "Multiply the projection by $b$'s length: $3\\times2=6$. Direct multiplication agrees: $3\\times2+4\\times0=6$."
    tolerance: { abs: 0.000001 }
    answer: 6

  - id: dotp-reverse
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "Arrows $a$ and $b$ have dot product 6. Reverse $b$ without changing its length. What is the new dot product of $a$ with the reversed arrow?"
    solution: "Reversing one vector negates each matching product. Their sum becomes $-6$, because $a$ now goes against the reversed arrow's direction."
    options:
      - {
          id: a,
          text: "It is minus 6 because every product changes sign.",
          correct: true,
          feedback: "Reversing one vector changes every product sign.",
        }
      - {
          id: b,
          text: "It stays plus 6 because both lengths stay fixed.",
          correct: false,
          feedback: "The length is unchanged, but $a$ now goes against the reversed arrow's direction.",
        }
      - {
          id: c,
          text: "It becomes zero because reversing an arrow makes it perpendicular.",
          correct: false,
          feedback: "Reversing gives the opposite direction, not a right-angle turn.",
        }
  - id: dotp-corridor
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A straight corridor runs in the direction of $b=(3,4)$, in metres east and north. A robot moves $a=(2,11)$ metres. How many metres has it moved along the corridor?"
    solution: "The distance along the corridor is the projection of $a$ onto $b$. The dot product is $2\\times3+11\\times4=50$ and $\\|b\\|=5$, so the projection is $50/5=10$ metres."
    tolerance: { abs: 0.000001 }
    answer: 10
  - id: dotp-why-not-lengths
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Arrows $(2,0)$ and $(-2,0)$ both have length 2. Which statement about how they point is correct?"
    solution: "Their equal lengths do not record their directions. Their dot product is $2\\times(-2)+0\\times0=-4$, and the negative sign shows they point opposite ways."
    options:
      - {
          id: a,
          text: "Their dot product is $-4$, so they point in opposite directions.",
          correct: true,
          feedback: "A negative dot product means the arrows are more than a right angle apart. These are exactly opposite.",
        }
      - {
          id: b,
          text: "Their dot product is $4$, so they point in the same direction.",
          correct: false,
          category: math_error,
          feedback: "The first components are $2$ and $-2$, so their product is $-4$, not $4$.",
        }
      - {
          id: c,
          text: "Their dot product is $0$, so they meet at a right angle.",
          correct: false,
          category: math_error,
          feedback: "Only the second components give $0\\times0=0$. The first components give $2\\times(-2)=-4$.",
        }
      - {
          id: d,
          text: "They have equal lengths, so they point in the same direction.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Length says how far an arrow reaches, not which way it points. Reversing an arrow keeps its length.",
        }
  - id: dotp-cosine
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Two robot movements are $a=(3,4)$ and $b=(4,3)$, in metres east and north. What is their cosine similarity?"
    solution: "The dot product is $12+12=24$ and both lengths are 5. Divide by both lengths to get $24/(5\\times5)=0.96$."
    tolerance: { abs: 0.000001 }
    answer: 0.96

  - id: dotp-cosine-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Two arrows are $a=(3,4)$ and $b=({{=k}},3)$. What is their cosine similarity? Round to three decimal places."
    solution: "The dot product is $3\\times{{=k}}+4\\times3={{=3*k+12}}$. The arrow lengths are 5 and $\\sqrt{ {{=k*k+9}} }$. Dividing by their product gives ${{=(3*k+12)/(5*sqrt(k*k+9))}}$."
    tolerance: { abs: 0.00051 }
    params:
      k: { min: 1, max: 6 }
    answer_expr: "(3*k+12)/(5*sqrt(k*k+9))"

  - id: dotp-dot-from-cos
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "Two arrows have lengths 2 and 3, and their cosine similarity is 0.5. What is their dot product?"
    solution: "Cosine similarity is the dot product divided by both lengths, so the dot product is $2\\times3\\times0.5=3$."
    tolerance: { abs: 0.000001 }
    answer: 3
  - id: dotp-scaling
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why did doubling $a$ from $(3,4)$ to $(6,8)$ leave the cosine similarity at 0.96?"
    solution: "Doubling $a$ doubles the dot product, from 24 to 48, and doubles $a$'s length, from 5 to 10. The factor of 2 appears above and below the fraction, so it cancels."
    options:
      - {
          id: a,
          text: "The dot product and $a$'s length both doubled, so the factor of 2 cancels in the fraction.",
          correct: true,
          feedback: "Top and bottom grow together, leaving the score unchanged.",
        }
      - {
          id: b,
          text: "Doubling an arrow does not change its dot product with another arrow.",
          correct: false,
          feedback: "The dot product did double, from 24 to 48; the division by length undoes it.",
        }
      - {
          id: c,
          text: "Cosine similarity only uses $b$, and $b$ did not change in the example.",
          correct: false,
          feedback: "It uses both arrows; $a$'s change cancels because the top and bottom both double.",
        }
      - {
          id: d,
          text: "Scores close to 1 stay the same when an arrow gets longer, but other scores change.",
          correct: false,
          feedback: "Lengthening an arrow without turning it leaves every cosine similarity unchanged, not only those near 1.",
        }
  - id: dotp-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A robot has not moved, so its movement vector is $(0,0)$. Another movement is $(1,2)$ metres east and north. Can cosine similarity compare their directions?"
    solution: "Cosine similarity divides by both norms. The zero vector has norm zero, making the ratio undefined."
    options:
      - {
          id: a,
          text: "No. The bottom of the fraction contains a zero length.",
          correct: true,
          feedback: "The zero vector has no direction and division by zero is undefined.",
        }
      - {
          id: b,
          text: "Yes. It is zero because the dot product is zero.",
          correct: false,
          feedback: "Even when the top of the fraction is zero, division by zero is not valid.",
        }
      - {
          id: c,
          text: "Yes. It is one because a zero vector points every way.",
          correct: false,
          feedback: "The zero vector has no direction, not every direction.",
        }
  - id: dotp-attention
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "Two arrows have dot product 2. Every component of one vector is multiplied by 3 while the other vector stays fixed. What happens to the dot product?"
    solution: "Each matching product becomes three times as large, so their sum is $3\\times2=6$. The dot product depends on arrow lengths as well as their directions."
    options:
      - {
          id: a,
          text: "The dot product becomes 6 even though neither arrow has turned.",
          correct: true,
          feedback: "Each component of one vector triples, so every product in the sum triples.",
        }
      - {
          id: b,
          text: "The score stays 2 because direction is unchanged.",
          correct: false,
          feedback: "Cosine similarity would stay unchanged. An unadjusted dot product also depends on length.",
        }
      - {
          id: c,
          text: "The score becomes 18 because the arrow's length is squared.",
          correct: false,
          feedback: "Only one vector is multiplied by 3. The total gains one factor of 3, not two.",
        }
  - id: dotp-position
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: "Two robot movements are $(1,1)$ and $(10,10)$ metres east and north. Their cosine similarity is one. What does that establish?"
    solution: "Both movements point in the same direction because each covers equal distances east and north. Their lengths are different."
    options:
      - {
          id: a,
          text: "They have the same heading but different travel distances.",
          correct: true,
          feedback: "One is ten times longer, so their endpoints differ.",
        }
      - {
          id: b,
          text: "They represent exactly the same movement.",
          correct: false,
          feedback: "Cosine similarity ignores their different lengths.",
        }
      - {
          id: c,
          text: "The distance between their endpoints is zero.",
          correct: false,
          feedback: "Different coordinates give a non-zero distance despite equal direction.",
        }
  - id: dot-check-1
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "Calculate the dot product of vectors $(1,2,3)$ and $(4,-5,6)$."
    answer: 12
    tolerance: { abs: 0.001 }
    hints: ["Multiply matching components: $1\\times4$, $2\\times(-5)$, $3\\times6$."]
    solution: "$4 - 10 + 18 = 12$."
  - id: dot-faded-cos
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: "Two arrows are $a=(3,4)$ and $b=(4,3)$. Calculate their cosine similarity to two decimal places."
    answer: 0.96
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer: 24,
          category: incomplete_explanation,
          feedback: "24 is the dot product. Cosine similarity divides by $\\|a\\|\\|b\\| = 25$.",
        }
    hints: ["$a \\cdot b = 24$.", "Divide by $\\|a\\|\\|b\\| = 5 \\times 5$."]
    solution: "$24 / 25 = 0.96$: almost the same direction."
  - id: dot-cos-core
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "Two vectors are $u=(1,0,1)$ and $v=(0,1,1)$. What is their cosine similarity?"
    answer: 0.5
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer: 1,
          category: incomplete_explanation,
          feedback: "1 is the dot product. You still need to divide by both lengths ($\\sqrt2$ each).",
        }
    hints: ["$u \\cdot v = 1$.", "$\\|u\\| = \\|v\\| = \\sqrt2$."]
    solution: "$\\frac{1}{\\sqrt2\\sqrt2} = 0.5$, an angle of $60^\\circ$."
  - id: dot-review-zero
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "Two non-zero vectors have dot product $0$. What can you conclude about their arrows, drawn from the same starting point?"
    options:
      - {
          id: a,
          text: "The arrows are perpendicular, meaning they meet at a right angle.",
          correct: true,
        }
      - {
          id: b,
          text: "At least one vector must be zero.",
          correct: false,
          category: misunderstood_definition,
          feedback: "The question says both are non-zero. $(1,0)\\cdot(0,1) = 0$.",
        }
      - {
          id: c,
          text: "The arrows point in opposite directions.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Opposite directions give a *negative* dot product ($\\cos 180^\\circ = -1$).",
        }
      - {
          id: d,
          text: "The vectors are identical.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Identical non-zero vectors have a positive dot product, because it adds the squares of their components.",
        }
    solution: "$a\\cdot b = \\|a\\|\\|b\\|\\cos\\theta = 0$ with non-zero lengths means $\\cos\\theta = 0$, so $\\theta = 90^\\circ$."
