  - id: rlhf4-recall-contrast-old
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: rlhf-pipeline
    difficulty: 1
    est_minutes: 0.5
    prompt: In the PPO stage of RLHF, what is $\pi_{\theta_\text{old}}$?
    options:
      - id: a
        text: The policy that wrote the current batch of replies.
        correct: true
        feedback: PPO compares new probabilities with this policy's for clipping.
      - id: b
        text: The frozen copy of the SFT model.
        correct: false
        category: incorrect_reasoning
        feedback: That is the reference model $\pi_{\text{ref}}$.
      - id: c
        text: The reward model.
        correct: false
        category: incorrect_reasoning
        feedback: The reward model gives scores $r_\phi$.
      - id: d
        text: The policy at the end of training.
        correct: false
        category: incorrect_reasoning
        feedback: The old policy is defined by which policy generated the current batch. The final policy is defined by when training finishes, even if its weights match those of the old policy.
    solution: $\pi_{\theta_\text{old}}$ is the policy that wrote the batch. The ratio in $L^{\text{CLIP}}$ compares the current policy with it.
  - id: rlhf4-recall-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: rlhf-pipeline
    difficulty: 1
    est_minutes: 0.5
    prompt: A finished reply gets reward model score $r$. Its last token has log-probability $u$ under the policy that wrote the batch and $v$ under the frozen reference. With KL coefficient $\beta$, write the adjusted reward for just the last token. Use `beta` for $\beta$ and `*` for multiplication.
    answer: r-beta*(u-v)
    variables:
      r: [-2, 4]
      beta: [0.01, 0.5]
      u: [-4, -0.1]
      v: [-6, -0.2]
    solution: The final token gets the reward model's score and pays only its own penalty, so its reward is $r-\beta(u-v)$.
  - id: rlhf-explain-training
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: 'Explain how RLHF trains a language model: what scores a finished reply, why a KL penalty is subtracted from that score, and what the coefficient $\beta$ controls.'
    rubric:
      - id: r1
        criterion: State that a reward model scores each finished reply.
        weight: 1
        required: true
      - id: r2
        criterion: Explain that the penalty limits drift from the SFT model towards text the reward model overrates.
        weight: 1
        required: true
      - id: r3
        criterion: Explain that a larger $\beta$ keeps the policy closer to the SFT model and a smaller one lets it chase the reward model's score.
        weight: 1
        required: true
    exemplar: The policy writes a reply token by token, and the reward model scores the finished reply. From that score we subtract beta times the log of the policy's probability of the reply over the reference model's, where the reference is a frozen copy of the SFT model. The penalty limits drift towards text the reward model overrates. A larger beta keeps the policy closer to the SFT model, and a smaller beta lets it chase the score. PPO maximises this reward.
