        weight: 1
        required: true
    exemplar: First supervised fine-tuning on replies people wrote, then a reward model trained on people's rankings, then reinforcement learning. The last stage uses PPO on the reward model's score minus a KL penalty that keeps the policy near the SFT model.
  - id: rlhf4-recall-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: rlhf-pipeline
    difficulty: 1
    est_minutes: 0.5
    prompt: Which stage of RLHF trains on replies that people wrote themselves?
    options:
      - id: a
        text: Supervised fine-tuning.
        correct: true
        feedback: SFT copies example replies people wrote.
      - id: b
        text: Training the reward model.
        correct: false
