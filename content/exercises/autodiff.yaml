concept: autodiff
exercises:
  - id: ad-recording-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: While a forward calculation that depends on a tracked weight runs, what does PyTorch record?
    options:
      - id: a
        text: The operations, their connections and values needed for derivatives.
        correct: true
        feedback: The record links small derivative rules to the calculation that actually ran.
      - id: b
        text: A list of better weights that will always lower the final loss.
        correct: false
        feedback: Recording describes the current calculation; it does not choose new weights.
      - id: c
        text: A separate expanded derivative formula for every possible branch.
        correct: false
        feedback: The record follows executed operations, not every possible branch.
      - id: d
        text: Only the final loss value, without any intermediate connections.
        correct: false
        feedback: A final number alone does not show how earlier inputs affected it.
    solution: The record keeps how the result was calculated, so each operation's local slope can be
      multiplied in later on the way back.
  - id: ad-record-why-save
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked example, why keep the value $e=2$ after squaring it?
    options:
      - id: a
        text: The square's derivative rule needs the value that was squared.
        correct: true
        feedback: Its local slope is $2e$, which uses the saved input.
      - id: b
        text: The square's derivative rule always equals the final loss value.
        correct: false
        feedback: The square has derivative $2e$, not $e^2$.
      - id: c
        text: The saved value replaces the need to record the square operation.
        correct: false
        feedback: The operation tells software which rule to apply; the value supplies its input.
      - id: d
        text: The saved value guarantees the next forward loss will be smaller.
        correct: false
        feedback: Saving values does not change any inputs or guarantee a smaller loss.
    solution:
      The square has local slope $2e$, so its input value is needed when the derivative rule is
      applied.
  - id: ad-record-value
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      A recorded calculation uses $w={{=w}}$, fixed $x={{=x}}$ and fixed $y={{=y}}$. It computes
      $z=wx$, $e=z-y$, then $L=e^2$. What is the forward value of $L$?
    params:
      w:
        min: 1
        max: 3
      x:
        min: 2
        max: 4
      y:
        min: 1
        max: 3
    answer_expr: (w*x-y)^2
    tolerance: { abs: 0 }
    hints:
      - "Find $z=wx$, then $e=z-y$."
      - "Square $e$ to get $L$."
    solution:
      The record stores $z={{=w}}\cdot{{=x}}$ and $e={{=w}}\cdot{{=x}}-{{=y}}$. Squaring that
      difference gives the final value $L$; it is a value, not a derivative.
  - id: ad-record-constants
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Only $w$ has `requires_grad=True` in $z=wx$, with fixed $x=3$. Which statement is right?
    options:
      - id: a
        text: $z$ is tracked, and the fixed value $x$ can still be saved.
        correct: true
        feedback: The result depends on $w$; the multiply's slope with respect to $w$ needs $x$.
      - id: b
        text: $z$ is untracked, because one of its two inputs is fixed.
        correct: false
        feedback: Dependence on the tracked input $w$ is enough to track this operation.
      - id: c
        text: $x$ must request its own gradient before its value can be saved.
        correct: false
        feedback: Saving a value for a rule is different from requesting its derivative.
      - id: d
        text: $w$ stops being tracked as soon as the product is computed.
        correct: false
        feedback: A later use does not remove the request for derivatives of $w$.
    solution:
      Tracking follows dependence on $w$. Fixed inputs need no gradients of their own, but their
      values may be needed for derivative rules.
  - id: ad-record-branch
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      "Your code runs `if w > 0: z = w * 3` and otherwise `z = w * 5`. At $w=2$, what is recorded
      for $z$?"
    options:
      - id: a
        text: The executed multiply by three, not the unused multiply by five.
        correct: true
        feedback: A run-time record follows the branch that actually executes.
      - id: b
        text: Both multiplies, with their output values added into one result.
        correct: false
        feedback: The code selects one branch; it does not add the alternatives.
      - id: c
        text: The unused multiply by five, ready for a possible later input.
        correct: false
        feedback: A later run builds its own record; this run executes the positive branch.
      - id: d
        text: Neither multiply, because a conditional prevents any recording.
        correct: false
        feedback: Operations in the executed branch can still be tracked.
    solution:
      At $w=2$ the positive branch executes, so its multiply belongs to this run's record. The
      other branch does not.
  - id: ad-record-robot
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A robot records $a=2q$, $b=a+q$, $r=b^2$, where the joint angle $q$ requests a gradient.
      Which connections must the record preserve?
    options:
      - id: a
        text: "Both uses of $q$: in the multiply and in the later addition."
        correct: true
        feedback: Both uses can affect the result, so neither dependency may be dropped.
      - id: b
        text: Only the multiply's use of $q$, because it executes first.
        correct: false
        feedback: The later addition also depends directly on $q$.
      - id: c
        text: Only the addition's use of $q$, because it executes last.
        correct: false
        feedback: The intermediate $a$ still depends on the earlier multiply.
      - id: d
        text: Only the square, because it produces the final result $r$.
        correct: false
        feedback: The square alone does not describe how the joint angle reaches its input.
    solution: The record must retain every dependency that produced $r$. Here $q$ affects $b$ both
      directly and through $a$.
  - id: ad-reverse-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: What does `loss.backward()` do when `loss` is a recorded tensor holding one number?
    options:
      - id: a
        text: It works back through the record and adds each leaf's slope to its `.grad`.
        correct: true
        feedback: The backward pass calculates loss slopes and accumulates the requested leaf gradients.
      - id: b
        text: It applies weight updates directly and then clears every leaf `.grad`.
        correct: false
        feedback: Weight updates and clearing gradients are separate operations.
      - id: c
        text: It reruns predictions at slightly shifted weights to estimate `.grad`.
        correct: false
        feedback: That describes finite differences, not automatic differentiation through the record.
      - id: d
        text: It runs the forward model again and stores predictions in `.grad`.
        correct: false
        feedback: Gradients are derivatives, not predictions.
    solution: The backward pass multiplies local slopes in reverse order and adds each leaf's slope
      to its `.grad`, without changing the weights.
  - id: ad-reverse-why-multiply
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked example, why is the final step $dL/dw=4\cdot3$?
    options:
      - id: a
        text: The loss slope at $z$ is four and the local slope from $w$ to $z$ is three.
        correct: true
        feedback: The chain rule multiplies the downstream sensitivity by $dz/dw=x$.
      - id: b
        text: The loss value is four and a loss value always acts as a derivative.
        correct: false
        feedback: Four happens to be both the loss and $dL/dz$ here; the chain rule uses the derivative.
      - id: c
        text: The weight is two and adding one always gives the missing local slope.
        correct: false
        feedback: The local slope comes from the multiplier $x=3$, not from $w+1$.
      - id: d
        text: The stored gradient is four and every backward call triples stored gradients.
        correct: false
        feedback: The factor three belongs to this multiply operation, not to backward calls generally.
    solution: At $z$ the loss derivative is four. Since $z=3w$, multiplying by $dz/dw=3$ passes that
      sensitivity to $w$.
  - id: ad-reverse-gradient
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      For $L=(wx-y)^2$, use $w={{=w}}$, fixed $x={{=x}}$ and fixed $y={{=y}}$. The backward pass has
      reached $dL/dz=2(wx-y)$ for $z=wx$. What is $dL/dw$?
    params:
      w:
        min: 1
        max: 3
      x:
        min: 2
        max: 4
      y:
        min: 1
        max: 3
    answer_expr: 2*(w*x-y)*x
    tolerance: { abs: 0 }
    hints:
      - "The local slope of $z=wx$ with respect to $w$ is $x$."
      - "Multiply $dL/dz$ by that local slope."
    solution: The local slope of $z=wx$ with respect to $w$ is $x$. The chain rule therefore gives
      $dL/dw=2(wx-y)x$, including the inner multiplier.
  - id: ad-reverse-update
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A leaf weight starts at $2$ with no gradient. Its backward pass calculates a gradient of
      $12$. Before any update, what is stored?
    options:
      - id: a
        text: The weight is still two, and its `.grad` contains twelve.
        correct: true
        feedback: Backward computes the slope but leaves the weight unchanged.
      - id: b
        text: The weight is now minus ten, and its `.grad` contains twelve.
        correct: false
        feedback: Subtracting the gradient would be a separate update, not part of backward.
      - id: c
        text: The weight is now twelve, and its `.grad` still contains two.
        correct: false
        feedback: The weight and gradient have separate storage and meanings.
      - id: d
        text: The weight is still two, and its `.grad` is automatically cleared.
        correct: false
        feedback: The gradient remains stored until you clear or replace it.
    solution:
      Backward stores the calculated slope in `.grad`. A separate update is needed to change the
      weight.
  - id: ad-reverse-accumulate
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A leaf's `.grad` already holds {{=old}}. A fresh forward record gives another gradient
      contribution of {{=new}}. After calling backward on that record without clearing `.grad`, what
      does it hold?
    params:
      old:
        min: -3
        max: 3
      new:
        min: 1
        max: 5
    answer_expr: old+new
    tolerance: { abs: 0 }
    hints:
      - "Backward adds to `.grad`; it does not replace it."
    solution:
      PyTorch adds the new contribution to the existing gradient. Without clearing, the stored
      result is ${{=old}}+{{=new}}$.
  - id: ad-reverse-robot
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A robot's joint angle $q={{=q}}$ affects $a=2q$, $b=a+q$ and $L=b^2$. What gradient does one
      backward pass store for $q$, starting with no stored gradient?
    params:
      q:
        min: 1
        max: 4
    answer_expr: 18*q
    tolerance: { abs: 0 }
    hints:
      - "Find $db/dq$ by adding the two paths: $2$ through $a$ and $1$ directly."
      - "Then $dL/dq=2b\\cdot db/dq$ with $b=3q$."
    solution: The two paths from $q$ to $b$ have slopes $2$ and $1$, so $db/dq=3$. Since $b=3q$, the
      chain rule gives $dL/dq=2(3q)\cdot3=18q$.
  - id: ad-modes-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: To find the slope of every output with respect to every input, how many passes does each mode need?
    options:
      - id: a
        text: "Forward: one per input; reverse: one recording pass plus one per output."
        correct: true
        feedback: Each forward pass chooses an input; reverse mode records once, then goes backward per output.
      - id: b
        text: "Forward: one per output; reverse: one recording pass plus one per input."
        correct: false
        feedback: "Those roles are swapped: forward shares work from an input, reverse from an output."
      - id: c
        text: "Forward: one per operation; reverse: one per operation, without any recording."
        correct: false
        feedback: Both traverse operations within a pass; the number of passes depends on inputs or outputs.
      - id: d
        text: "Forward: one pass always; reverse: one pass always, regardless of output count."
        correct: false
        feedback: One ordinary pass does not generally give every derivative for many inputs and outputs.
    solution:
      Forward mode shares work for one input's effects on outputs; reverse mode shares work for
      one output's sensitivities to inputs.
  - id: ad-modes-why-two
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why did forward mode take two passes for $s=uv$ in the worked example?
    options:
      - id: a
        text: One pass followed changes in $u$; another followed changes in $v$.
        correct: true
        feedback: Each ordinary forward derivative pass chooses one input direction.
      - id: b
        text: One pass multiplied the inputs; another squared the resulting product.
        correct: false
        feedback: The example contains no square; the two derivative passes select different inputs.
      - id: c
        text: One pass found the loss value; another corrected a rounding error.
        correct: false
        feedback: The count is about derivative directions, not correcting arithmetic.
      - id: d
        text: One pass found a slope; another reversed its sign for training.
        correct: false
        feedback: The two slopes belong to different inputs, not opposite signs of one slope.
    solution:
      To get both partial derivatives with ordinary forward mode, choose $u$ in one pass and $v$
      in another. Reverse mode gets both from a single output.
  - id: ad-modes-forward-count
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A drone's planner takes four adjustable inputs: its position east, north and up, and its heading angle. It returns two outputs: the distance to a landing pad and the battery the flight will use. How many ordinary forward-mode derivative passes find every input-output derivative?"
    answer: 4
    tolerance: { abs: 0 }
    common_wrong:
      - {
          answer: 2,
          tolerance: { abs: 0 },
          category: misunderstood_definition,
          feedback: "One pass per output is reverse mode's backward count. A forward-mode pass follows one input to every output.",
        }
      - {
          answer: 8,
          tolerance: { abs: 0 },
          category: misunderstood_definition,
          feedback: "One forward pass carries a chosen input's effect to all the outputs at once, so you need one pass per input, not one per pair.",
        }
      - {
          answer: 3,
          tolerance: { abs: 0 },
          category: misunderstood_definition,
          feedback: "That's reverse mode's total: one recording pass plus one backward pass per output. Forward mode needs one pass per input.",
        }
    hints:
      - "Each forward pass follows one chosen input."
    solution: "Forward mode chooses one input per pass and carries that input's effects to all outputs. The planner has 4 inputs, so it needs 4 passes."
  - id: ad-modes-same-slopes
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      For $s=uv$ at $u=2$, $v=3$, reverse mode gives slopes $(3,2)$ in $(u,v)$ order. What should
      forward mode give?
    options:
      - id: a
        text: The same slopes, $(3,2)$, because both use the chain rule.
        correct: true
        feedback: The direction changes the work organisation, not the mathematical derivatives.
      - id: b
        text: The opposite slopes, $(-3,-2)$, because its arrows point forward.
        correct: false
        feedback: Arrow direction does not negate derivative values.
      - id: c
        text: The swapped slopes, $(2,3)$, because it visits inputs first.
        correct: false
        feedback: Input order remains $(u,v)$, so the derivative with respect to $u$ is three.
      - id: d
        text: The values $(2,3)$, because forward mode returns only inputs.
        correct: false
        feedback: Forward mode carries derivatives as well as values; it does not simply return the inputs.
    solution:
      Both methods differentiate the same product at the same values. The partial derivatives
      are $\partial s/\partial u=v=3$ and $\partial s/\partial v=u=2$.
  - id: ad-modes-reverse-count
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A calculation has inputs and outputs. Inputs: {{=inputs}}. Outputs: {{=outputs}}. Including one forward recording pass, how many total passes does reverse mode need to find every input-output derivative?"
    params:
      inputs:
        min: 2
        max: 6
      outputs:
        min: 1
        max: 4
    answer_expr: 1 + outputs
    tolerance: { abs: 0 }
    hints:
      - "Count one forward recording pass, then one backward pass per output."
    solution: One backward pass gives one chosen output's derivatives with respect to every input. Add one forward recording pass to the number of outputs to get the total.
  - id: ad-modes-robot
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A robot calculation takes one joint angle and returns three position coordinates. You need
      all three coordinate slopes with respect to that angle. Which ordinary pass plan shares the
      most work?
    options:
      - id: a
        text: One forward derivative pass, carrying the angle's effect to all coordinates.
        correct: true
        feedback: One input means one forward pass; reverse mode needs one recording pass plus three backward passes.
      - id: b
        text: Three forward derivative passes, choosing one coordinate in each pass.
        correct: false
        feedback: Forward passes choose input directions, not output coordinates.
      - id: c
        text: One reverse derivative pass, treating three coordinates as one scalar.
        correct: false
        feedback:
          Combining coordinates gives a combined sensitivity, not all three separate coordinate
          slopes.
      - id: d
        text: One recording pass plus three backward passes, fewer than forward mode.
        correct: false
        feedback: That reverse plan takes four passes in total, exceeding the one forward pass needed here.
    solution: With one input and three outputs, forward mode finds all three requested slopes in one
      derivative pass. Reverse mode needs one recording pass plus three backward passes, one per output.
  - id: ad-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt:
      A friend writes a model's forward calculation and calls `loss.backward()`. Explain what was
      recorded, what the call does and why reverse mode suits many weights and one loss. Say whether
      the call changes the weights.
    rubric:
      - id: record
        criterion:
          Explains that executed forward operations, dependencies and needed values are recorded
          for local derivative rules.
        weight: 1
        required: true
      - id: reverse
        criterion:
          Explains reverse chain-rule multiplication and path summation, accumulation in leaf
          .grad, and that backward does not update weights.
        weight: 1
        required: true
      - id: cost
        criterion: Contrasts one forward derivative pass per input with one recording pass plus one backward pass per output, favouring reverse for many weights and one loss.
        weight: 1
        required: true
    exemplar:
      The forward run records the operations that actually execute, their connections and values
      needed by derivative rules. Starting at the scalar loss with derivative one, backward
      multiplies local derivatives in reverse order and adds contributions from different paths,
      accumulating requested leaf gradients in .grad without updating the weights. After one recording pass, one backward pass gives that loss's slopes for all weights, whereas ordinary forward mode needs one derivative pass per weight.
