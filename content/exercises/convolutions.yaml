  - id: conv-field-unequal-sides
    dimension: math
    type: numeric
    role: review
    difficulty: 3
    est_minutes: 2
    prompt: "Three convolution layers in order use square filters with side lengths of $3$, $5$ and $5$ pixels. All have stride $1$, with no padding or pooling. What is the side length in pixels of one final output cell's receptive field in the original input?"
    answer: 11
    tolerance: { abs: 0 }
    solution: "Start with one cell and trace backward. The layers add $5-1$, $5-1$ and $3-1$ to the side length, giving $1+4+4+2=11$."
