    prompt: "A convolution has $C_{\\mathrm{in}}$ input channels and $C_{\\mathrm{out}}$ filters of square side $k$. Each filter has one bias. Write the layer’s parameter count. Type `C_in` and `C_out`."
    answer: "C_out*(C_in*k^2+1)"
    variables:
      {
        "C_in": { "values": [1, 4, 8] },
        "C_out": { "values": [2, 16, 32] },
        "k": { "values": [2, 4, 7] },
      }
