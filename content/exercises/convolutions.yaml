  - id: conv-recall-pool-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: conv-pool
    difficulty: 1
    est_minutes: 0.5
    prompt: "Stack $L$ convolutional layers, each with a square filter of side $k$, stride one and no padding or pooling. Write the side length of an output cell’s receptive field in the original image."
    answer: "1+L*(k-1)"
    variables: { "L": { "values": [1, 4, 8] }, "k": { "values": [2, 4, 7] } }
    solution: "Start with a single pixel. Each layer adds $k-1$ to the side length, giving $1+L(k-1)$."

