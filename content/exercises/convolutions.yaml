concept: convolutions
exercises:
  - id: conv-slide-basics
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "What does one convolutional filter do?"
    options:
      [
        {
          "id": "a",
          "text": "It reuses a small grid of weights across image patches.",
          "correct": true,
          "feedback": "Each position uses the same weights.",
        },
        {
          "id": "b",
          "text": "It gives each image position its own new weights.",
          "correct": false,
          "feedback": "The same weights are shared, not recreated at each position.",
        },
        {
          "id": "c",
          "text": "It takes the largest pixel from each image patch.",
          "correct": false,
          "feedback": "That selects one value instead of taking a weighted sum.",
        },
      ]
    solution: "A filter multiplies matching pixels and weights, adds them and a bias, then repeats at another position."
  - id: conv-slide-why-zero
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked all-bright patch, which calculation explains the zero score before ReLU?
    options:
      - id: a
        text: Each row has equal left and right values, so its negative and positive weighted terms
          cancel.
        correct: true
        feedback: With row weights (-1, 0, 1), an all-bright row contributes -1 + 0 + 1 = 0.
      - id: b
        text:
          Each row is first reduced to its brightest value, which is then multiplied by the middle
          weight.
        correct: false
        feedback:
          A convolution uses the sum of all matching pixel-weight products, not a maximum followed
          by the middle weight.
      - id: c
        text: Each row gives a positive sum, but the filter's zero bias replaces that sum.
        correct: false
        feedback: A zero bias adds nothing to the weighted sum; it does not replace it.
    solution:
      Every all-bright row pairs equal pixel values with weights -1 and 1. Their contributions
      cancel, so adding the three rows and zero bias gives a zero score.
  - id: conv-score
    dimension: "math"
    type: "numeric"
    tolerance: { abs: 0.000001 }
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "A patch has three identical rows (0,1,1). The filter has three identical rows (−1,0,1), with bias −1. What is the output after ReLU?"
    answer: 2
    solution: "Each row contributes 1, so the score is 3 − 1 = 2. ReLU keeps it."
  - id: conv-slide-template
    dimension: "math"
    type: "numeric"
    tolerance: { abs: 0.000001 }
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "A patch has three identical rows (0,0,{{= a }}). Its filter has three identical rows (−1,0,1), and bias {{= b }}. What is the output after ReLU?"
    params: { "a": { "min": 0, "max": 3 }, "b": { "min": -3, "max": 2 } }
    answer_expr: "max(0,3*a+b)"
    solution: "The three rows contribute {{= 3*a }} and the bias gives {{= 3*a+b }}. ReLU returns {{= max(0,3*a+b) }}."
  - id: conv-bias-trap
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "A 3×3 filter uses bias 2. How is that bias used for one output score?"
    options:
      [
        {
          "id": "a",
          "text": "Add 2 once after summing the nine products.",
          "correct": true,
          "feedback": "There is one bias per filter.",
        },
        {
          "id": "b",
          "text": "Add 2 to each of the nine products.",
          "correct": false,
          "feedback": "That would count the bias nine times.",
        },
        {
          "id": "c",
          "text": "Add 2 only at the first image position.",
          "correct": false,
          "feedback": "The shared bias is used at every output position.",
        },
      ]
    solution: "The bias belongs to the reused neuron, so each output score adds it exactly once."
  - id: conv-edge-robot
    lesson_only: true
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A robot moves a camera past a dark-to-bright vertical boundary. What can the example's filter detect?"
    options:
      [
        {
          "id": "a",
          "text": "The same local boundary at different patch positions.",
          "correct": true,
          "feedback": "Shared weights test each patch for the same brightness change.",
        },
        {
          "id": "b",
          "text": "Only the boundary at its original image position.",
          "correct": false,
          "feedback": "The filter uses the same weights wherever its patch starts.",
        },
        {
          "id": "c",
          "text": "Every bright uniform patch as a strong boundary.",
          "correct": false,
          "feedback": "Equal left and right brightness cancels in a uniform patch.",
        },
      ]
    solution: "The shared filter responds when a patch has greater right-hand brightness than left-hand brightness."
  - id: conv-size-basics
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "What does stride specify?"
    options:
      [
        {
          "id": "a",
          "text": "The distance between neighbouring patch starts.",
          "correct": true,
          "feedback": "A stride of two advances two input pixels.",
        },
        {
          "id": "b",
          "text": "The number of zeros added on each border.",
          "correct": false,
          "feedback": "That is padding, not stride.",
        },
        {
          "id": "c",
          "text": "The number of weights inside each filter.",
          "correct": false,
          "feedback": "Filter size determines the number of weights.",
        },
      ]
    solution: "Stride controls how far the patch moves before computing the next output."
  - id: conv-size-why-floor
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      In the worked size calculation, the padded side is 36, the filter side is 5 and stride is
      2. Why does rounding the patch count up include an invalid position?
    options:
      - id: a
        text: It includes start 32, whose five-pixel patch extends past the padded side.
        correct: true
        feedback: Indices for that patch would run from 32 through 36, beyond the last valid index 35.
      - id: b
        text: It includes start 30, which is invalid because a five-pixel filter needs an odd start.
        correct: false
        feedback: Filter side and start parity are independent; the stride-two start at 30 is valid.
      - id: c
        text: It excludes start 31, which must be reached because it is the last fitting start.
        correct: false
        feedback: Stride two reaches only even starts from zero, so fitting start 31 is not reached.
    solution:
      Stride two reaches starts 0 through 30. Rounding up adds start 32, whose patch would require
      a pixel beyond the 36-pixel padded side.
  - id: conv-size-template
    dimension: "math"
    type: "numeric"
    tolerance: { abs: 0.000001 }
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "An image has height {{= h }}. With square filter side {{= k }}, padding {{= p }} and stride {{= s }}, how many output rows fit?"
    params:
      {
        "h": { "min": 6, "max": 14 },
        "k": { "min": 3, "max": 5, "step": 2 },
        "p": { "min": 0, "max": 2 },
        "s": { "min": 1, "max": 3 },
      }
    answer_expr: "floor((h+2*p-k)/s)+1"
    solution: "The padded height is {{= h+2*p }}. Counting starts gives floor(({{= h+2*p-k }})/{{= s }}) + 1 = {{= floor((h+2*p-k)/s)+1 }}."
  - id: conv-size-fixed
    dimension: "math"
    type: "numeric"
    tolerance: { abs: 0.000001 }
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt:
      A convolution uses a $3\times3$ filter on a $9\times9$ image, with no padding and a stride of
      2 pixels. How many rows are in the output?
    answer: 4
    solution: "Starts 0, 2, 4 and 6 fit, giving four output rows."
  - id: conv-padding-trap
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt:
      An image has height $H$ pixels. You pad it by 2 pixels on each edge. What is its height before
      convolution?
    options:
      [
        {
          "id": "a",
          "text": "H + 4, because two rows are added at each end.",
          "correct": true,
          "feedback": "Padding applies on both sides.",
        },
        {
          "id": "b",
          "text": "H + 2, because padding is added only once.",
          "correct": false,
          "feedback": "That counts only one of the two borders.",
        },
        {
          "id": "c",
          "text": "2H, because padding doubles the whole image.",
          "correct": false,
          "feedback": "Padding adds fixed borders rather than scaling the image.",
        },
      ]
    solution: "Two rows above and two below add four rows in total."
  - id: conv-stride-robot
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A robot's camera pipeline needs fewer output positions without changing filter weights. Which change does that?"
    options:
      [
        {
          "id": "a",
          "text": "Increase stride from one to two.",
          "correct": true,
          "feedback": "More distant starts give fewer output cells.",
        },
        {
          "id": "b",
          "text": "Increase the bias at every position.",
          "correct": false,
          "feedback": "The bias changes scores, not the count of positions.",
        },
        {
          "id": "c",
          "text": "Increase zero padding with stride unchanged.",
          "correct": false,
          "feedback": "More padding can add positions rather than remove them.",
        },
      ]
    solution: "Larger stride skips intermediate starts, reducing spatial output size without changing the filter weights."
  - id: conv-width-template
    dimension: "math"
    type: "numeric"
    tolerance: { abs: 0.000001 }
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "An image is {{= h }} rows by {{= w }} columns. With k=3, p=1 and s=2, what is the output width?"
    params: { "h": { "min": 8, "max": 12 }, "w": { "min": 13, "max": 19 } }
    answer_expr: "floor((w-1)/2)+1"
    solution: "Use width {{= w }}, not height {{= h }}. There are {{= floor((w-1)/2)+1 }} allowed column starts."
  - id: conv-channels-basics
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "What does one filter do on an RGB image?"
    options:
      [
        {
          "id": "a",
          "text": "It sums contributions from all three channels into one map.",
          "correct": true,
          "feedback": "One filter produces one output channel.",
        },
        {
          "id": "b",
          "text": "It makes three independent maps, one per colour.",
          "correct": false,
          "feedback": "The channel contributions are summed before the bias is added.",
        },
        {
          "id": "c",
          "text": "It reads only one channel and ignores the others.",
          "correct": false,
          "feedback": "A filter spans all input channels.",
        },
      ]
    solution: "One filter has weights for all input channels and produces one score at each position."
  - id: conv-channels-why-small
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      In the worked RGB convolution, what makes the 448-parameter count independent of the number
      of spatial output positions?
    options:
      - id: a
        text: Each filter reuses its weights and bias at every spatial position.
        correct: true
        feedback: Spatial positions add uses of a filter, so they add no new parameters.
      - id: b
        text: Each filter reads a local patch but learns separate weights at each spatial position.
        correct: false
        feedback:
          Local patches limit inputs per use, but separate position-specific weights would still
          grow the parameter count.
      - id: c
        text: Each filter keeps separate spatial weights but shares one set across the RGB channels.
        correct: false
        feedback: A filter has weights for all input channels and shares them across positions, not
          across colour channels.
    solution:
      Each filter has a fixed set of weights spanning the input channels plus one bias. Reusing
      that set at every position makes the count independent of spatial output size.
  - id: conv-params-template
    dimension: "math"
    type: "numeric"
    tolerance: { abs: 0.000001 }
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "A convolution has {{= c }} input channels and {{= f }} filters of side {{= k }}. Include one bias per filter. How many parameters does it have?"
    params:
      {
        "c": { "min": 1, "max": 4 },
        "f": { "min": 2, "max": 8, "step": 2 },
        "k": { "min": 1, "max": 5, "step": 2 },
      }
    answer_expr: "f*(c*k*k+1)"
    solution: "Each filter has {{= c*k*k }} weights plus one bias, so the total is {{= f*(c*k*k+1) }}."
  - id: conv-shape-template
    dimension: "math"
    type: "numeric"
    tolerance: { abs: 0.000001 }
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "Input CHW shape is (3,{{= h }},{{= h }}). There are {{= f }} filters with k=3, p=1, s=2. How many numbers are in the whole output tensor?"
    params: { "h": { "min": 8, "max": 16, "step": 2 }, "f": { "min": 2, "max": 6, "step": 2 } }
    answer_expr: "f*(floor((h-1)/2)+1)^2"
    solution: "The output shape is ({{= f }},{{= floor((h-1)/2)+1 }},{{= floor((h-1)/2)+1 }}). Multiplying its three sizes gives {{= f*(floor((h-1)/2)+1)^2 }}."
  - id: conv-channels-trap
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "If image height and width double but channels and filters stay fixed, what happens to convolutional parameter count?"
    options:
      [
        {
          "id": "a",
          "text": "It stays the same because each filter is reused.",
          "correct": true,
          "feedback": "Spatial extent is absent from the parameter-count formula.",
        },
        {
          "id": "b",
          "text": "It doubles because there are twice as many rows.",
          "correct": false,
          "feedback": "Rows add uses of weights, not new weights.",
        },
        {
          "id": "c",
          "text": "It quadruples because there are four times as many pixels.",
          "correct": false,
          "feedback": "More pixels require more calculations, not more filter parameters.",
        },
      ]
    solution: "Only input channels, filter side and number of filters determine this layer's weights and biases."
  - id: conv-channels-robot
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt:
      A robot receives an image array of shape $(3,12,18)$ in channels, height, width order. Its
      convolution uses 4 filters of size $3\times3$, padding of 1 pixel on each side and a stride of 2
      pixels. What is the output shape in the same axis order?
    options:
      [
        {
          "id": "a",
          "text": "(4,6,9)",
          "correct": true,
          "feedback": "Four filters give four channels, and the spatial counts are six and nine.",
        },
        {
          "id": "b",
          "text": "(3,6,9)",
          "correct": false,
          "feedback": "Input channel count is not output channel count.",
        },
        {
          "id": "c",
          "text": "(4,12,18)",
          "correct": false,
          "feedback": "Stride two reduces the spatial counts even with padding one.",
        },
      ]
    solution: "Height is floor(11/2)+1=6 and width is floor(17/2)+1=9. Four filters give the leading size four."
  - id: conv-shape-fixed
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt:
      An RGB input has shape $(3,10,14)$ in channels, height, width order. The convolution uses six
      $3\times3$ filters, no padding and a stride of 1 pixel. Which output shape is correct in the same
      axis order?
    options:
      [
        {
          "id": "a",
          "text": "(6,8,12)",
          "correct": true,
          "feedback": "Six filters give six maps, each eight rows by twelve columns.",
        },
        {
          "id": "b",
          "text": "(3,8,12)",
          "correct": false,
          "feedback": "The output has one channel per filter, not per input channel.",
        },
        {
          "id": "c",
          "text": "(6,10,14)",
          "correct": false,
          "feedback": "Without padding, the spatial sides shrink by two.",
        },
      ]
    solution: "Subtracting three and adding one gives sides eight and twelve. The six filters give six output channels."
  - id: conv-pool-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt:
      A feature map has several channels. How does 2×2 max pooling group the values that compete
      for one output?
    options:
      - id: a
        text: Four neighbouring spatial values from one channel compete for that channel's output.
        correct: true
        feedback: Pooling works separately inside each channel's spatial map.
      - id: b
        text: All channel values at one pixel compete for one channel-combined output.
        correct: false
        feedback: That would reduce the channel axis; spatial max pooling preserves it.
      - id: c
        text: Every value in one channel competes for one output for that entire channel.
        correct: false
        feedback: A 2×2 pool uses local patches, not the whole map unless the map itself is 2×2.
    solution:
      Spatial max pooling compares the four values in a 2×2 patch within one channel. It repeats
      independently across positions and channels.
  - id: conv-pool-why-four
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked pooling example, swapping the top-left patch's largest value with another
      value inside that same patch leaves its pooled output unchanged. Why?
    options:
      - id: a
        text: Pooling keeps the maximum value without recording its position inside the patch.
        correct: true
        feedback: Permuting the same four patch values leaves their maximum unchanged.
      - id: b
        text: Pooling keeps the patch's top-left value, so movements elsewhere cannot affect it.
        correct: false
        feedback:
          The output compares all four patch values, including any value moved into the top-left
          position.
      - id: c
        text: Pooling sums weighted positions, so changing a value's position changes its weight.
        correct: false
        feedback: Max pooling selects the largest value and has no position-specific weights.
    solution:
      The set of four patch values is unchanged, so its maximum is unchanged. Max pooling keeps
      that value and discards which within-patch position supplied it.
  - id: conv-pool-value
    dimension: "math"
    type: "numeric"
    tolerance: { abs: 0.000001 }
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "Apply 2×2 max pooling with stride 2 to rows (2,7,1,3), (4,5,8,0), (6,1,2,4), (0,3,5,9). What is the bottom-left output value?"
    answer: 6
    solution: "The bottom-left patch contains 6, 1, 0 and 3, whose maximum is 6."
  - id: conv-pool-template
    dimension: "math"
    type: "numeric"
    tolerance: { abs: 0.000001 }
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "A feature map has CHW shape ({{= c }},{{= h }},{{= h }}). Apply 2×2 max pooling with stride 2, no padding. How many numbers are in the output?"
    params: { "c": { "min": 1, "max": 4 }, "h": { "min": 4, "max": 11 } }
    answer_expr: "c*floor(h/2)^2"
    solution: "The channel count stays {{= c }} and each side becomes {{= floor(h/2) }}. The output contains {{= c*floor(h/2)^2 }} numbers."
  - id: conv-field-template
    dimension: "math"
    type: "numeric"
    tolerance: { abs: 0.000001 }
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "Stack {{= l }} square convolutions with filter side {{= k }}, all stride 1 and no pooling. For an interior output cell, what is its receptive-field side in the original input?"
    params: { "l": { "min": 1, "max": 4 }, "k": { "min": 3, "max": 5, "step": 2 } }
    answer_expr: "1+l*(k-1)"
    solution: "Start with one input cell and add {{= k-1 }} per layer. The side is {{= 1+l*(k-1) }}."
  - id: conv-field-trap
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "Two 3×3 convolutions both have stride 1. What is the receptive-field side of an interior output cell?"
    options:
      [
        {
          "id": "a",
          "text": "5, because neighbouring patches overlap.",
          "correct": true,
          "feedback": "Each extra layer adds two to the side.",
        },
        {
          "id": "b",
          "text": "6, because the two side lengths add.",
          "correct": false,
          "feedback": "This ignores the overlap between the patches.",
        },
        {
          "id": "c",
          "text": "9, because the two side lengths multiply.",
          "correct": false,
          "feedback": "Multiplying treats overlapping patches as disjoint.",
        },
      ]
    solution: "The side starts at one and grows by two per layer, so it is 1 + 2·2 = 5."
  - id: conv-pool-robot
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A robot needs an edge's exact position within a 2×2 area. Which two patterns show why keeping
      only that area's max-pooled value can lose needed information?
    options:
      - id: a
        text: A response of 5 in the top-left or 5 in the bottom-right, with all other entries 0.
        correct: true
        feedback: Both pool to 5, so the pooled value cannot distinguish their different response positions.
      - id: b
        text: A response of 5 or 3 in the same top-left pixel, with all other entries 0.
        correct: false
        feedback: These pool to different values, 5 and 3, so the maximum distinguishes this pair.
      - id: c
        text: Four entries equal to 5 or four entries equal to 0.
        correct: false
        feedback: These pool to 5 and 0, so their maxima are different.
    solution:
      Putting the same largest response at two different positions gives the same pooled value.
      The maximum alone therefore cannot recover the edge's exact within-patch position.
  - id: conv-explain
    dimension: "conceptual"
    type: "explain"
    role: "core"
    difficulty: 3
    est_minutes: 4
    prompt: "Explain how local patches and filter reuse each reduce a convolution's parameter count, and how the number of filters determines its output channels."
    rubric:
      - id: local-shared
        criterion: Explain that each output reads a small local patch, limiting the weights it needs.
        weight: 1
        required: true
      - id: sharing
        criterion:
          Explain that reusing each filter's weights and bias across positions avoids separate parameters at
          every position.
        weight: 1
        required: true
      - id: channels
        criterion: Explain that each filter produces one output channel.
        weight: 1
        required: true
    exemplar: "Each convolution output reads a small local patch, limiting the number of input connections it needs. The same filter weights and bias are reused across positions, so extra positions need no extra filter parameters. Each filter produces one output channel."
    solution: "Each convolution output reads a small local patch, limiting the number of input connections it needs. The same filter weights and bias are reused across positions, so extra positions need no extra filter parameters. Each filter produces one output channel."
  - id: conv-recall-slide-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: conv-slide
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what is a convolutional filter, and how does it produce a feature map?"
    rubric:
      - id: point0
        criterion: "Explain that a filter is a small grid of weights reused across image patches."
        weight: 1
        required: true
      - id: point1
        criterion: "Explain that at each patch it multiplies pixels by matching weights, adds the products and a bias, then places that score in the feature map."
        weight: 1
        required: true
    exemplar: "A filter is a small grid of weights reused across image patches. At each patch it multiplies pixels by matching weights, adds the products and a bias, then places that score in the feature map."
  - id: conv-recall-slide-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: conv-slide
    difficulty: 1
    est_minutes: 0.5
    prompt: "What does one cell of a convolutional feature map contain before any ReLU?"
    options:
      - id: a
        text: "The largest pixel brightness in the corresponding patch."
        correct: false
        feedback: "Keeping the largest value describes max pooling."
      - id: b
        text: "The weighted sum of that patch’s pixels plus a bias."
        correct: true
        feedback: "The convolution applies the shared filter to that patch and adds its bias."
      - id: c
        text: "The weighted sum of all image pixels plus a bias."
        correct: false
        feedback: "A fully connected neuron can use the whole image for one score. A convolution computes a score for each local patch."
    solution: "A convolution applies the shared filter to a patch and adds its bias to produce one score."
  - id: conv-recall-slide-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: conv-slide
    difficulty: 1
    est_minutes: 0.5
    prompt: "A grayscale convolution uses filter weights $w_{u,v}$ and pixels $x$. Fill in the missing term in its score formula: $y_{i,j}=\\sum_{u=0}^{k-1}\\sum_{v=0}^{k-1}w_{u,v}x_{i+u,j+v}+\\underline{\\quad}$. Type a symbol or words."
    accept:
      [
        "b",
        "bias",
        "the bias",
        "shared bias",
