concept: evaluation-metrics
exercises:
  - id: lab-classifier-precision
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: |
      Class 1 is the positive class. What is its precision? Give a decimal.

      | Actual class | Predicted 0 | Predicted 1 |
      | --- | --- | --- |
      | Class 0 | 18 | 6 |
      | Class 1 | 2 | 4 |
    answer: 0.4
    tolerance: { abs: 0.001 }
    solution: The Predicted 1 column has $6+4=10$ predictions, and 4 are correct. Precision is $4/10=0.4$.
  - id: lab-classifier-recall
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: |
      The two classes in this table are class 2 and Other. Class 2 is the positive class. What is its recall? Give a decimal.

      | Actual class | Predicted Other | Predicted 2 |
      | --- | --- | --- |
      | Other | 17 | 3 |
      | Class 2 | 3 | 9 |
    answer: 0.75
    tolerance: { abs: 0.001 }
    solution: The Class 2 row contains $3+9=12$ actual examples, and 9 are correct. Recall is $9/12=0.75$.
  - id: evm-recall-three-classes
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: |
      A camera sorts parts into scratch, dent and fine. Find recall for dents minus recall for scratches. Give the difference as a decimal.

      | Actual class | Predicted scratch | Predicted dent | Predicted fine |
      | --- | --- | --- | --- |
      | Scratch | 5 | 1 | 4 |
      | Dent | 1 | 6 | 1 |
      | Fine | 1 | 1 | 8 |
    answer: 0.25
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: -0.25
        category: math_error
        feedback: The question asks for dent recall first, then subtract scratch recall.
      - answer: 0.03571428571428571
        category: misapplied_technique
        feedback: Column totals give precision. Each recall uses the total of the actual class's row.
    solution: The Dent row gives $6/(1+6+1)=0.75$. The Scratch row gives $5/(5+1+4)=0.5$, so the difference is $0.25$.
  - id: evm-count-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does a confusion matrix record?
    options:
      - id: a
        text: Counts of what parts actually are and what the camera says.
        correct: true
        feedback: Each cell pairs what parts actually are with what the camera says.
      - id: b
        text: The order in which a model learned its training examples.
        correct: false
        feedback: The table counts what the camera says about parts, not training order.
      - id: c
        text: The size of each error in a number prediction.
        correct: false
        feedback: Error sizes belong to regression. These cells count parts.
    solution:
      A confusion matrix compares what parts actually are with what the camera says. It shows
      both correct answers and each kind of mistake.
  - id: evm-count-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does the worked example add 6 and 88 when finding accuracy?
    options:
      - id: a
        text: Only parts actually faulty can count as correct answers.
        correct: false
        feedback: That would exclude correctly cleared fine parts.
      - id: b
        text: Both caught faulty parts and correctly cleared fine parts are right.
        correct: true
        feedback: Accuracy counts parts the camera gets right, whether faulty or fine.
      - id: c
        text: Every flagged part is correct, even when it is fine.
        correct: false
        feedback: A fine part flagged faulty is a false positive, which is wrong.
    solution:
      The camera gets the 6 true positives and 88 true negatives right. Accuracy counts both,
      then divides by all 100 parts.
  - id: evm-false-alarm
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: A camera says faulty for an actually fine part. With faulty as positive, which cell contains it?
    options:
      - id: a
        text: False negative, because the part is actually fine.
        correct: false
        feedback: Negative describes what the camera says, not what the part actually is.
      - id: b
        text: True positive, because the camera raised a flag.
        correct: false
        feedback: A flag is correct only if the part is actually faulty.
      - id: c
        text: False positive, because the warning was wrong.
        correct: true
        feedback: The camera said faulty but the part was actually fine.
    solution: A false positive is a false alarm. Here the camera flags an actually fine part.
  - id: evm-accuracy-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A camera has TP = {{= k }}, FP = 5, FN = {{= 25 - k }} and TN = 70 on 100 test parts.
      What is its accuracy as a decimal, not a percentage?
    params:
      k:
        min: 5
        max: 25
        step: 5
    answer_expr: (k + 70) / 100
    tolerance:
      abs: 0.000001
    solution:
      The four counts sum to all 100 test parts. Add TP and TN to get {{= k + 70 }} parts the
      camera gets right, then divide by 100 for accuracy {{= (k + 70) / 100 }}.
  - id: evm-always-fine
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: Of 100 test parts, 10 are actually faulty. A camera says fine for every part. What is its accuracy?
    options:
      - id: a
        text: 0.90, because it correctly clears the 90 fine parts.
        correct: true
        feedback: It misses ten faulty parts but correctly says fine for the 90 fine parts.
      - id: b
        text: 0.00, because it never catches any of the faulty parts.
        correct: false
        feedback: That describes its caught fraction of faults, not its overall accuracy.
      - id: c
        text: 1.00, because the camera says the same thing for every part.
        correct: false
        feedback: Saying fine every time does not make the ten missed faulty parts correct.
    solution: It correctly labels 90 fine parts out of 100, giving 0.90 accuracy despite missing every fault.
  - id: evm-robot-count
    dimension: math
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt:
      A robot flags failed grasps as positive. Of 20 failed grasps it flags 15. Of 80 successful
      grasps it flags 5. Which counts are correct?
    options:
      - id: a
        text: TP = 15, FN = 5, FP = 75, TN = 5.
        correct: false
        feedback: Only five successful grasps were flagged, so FP is five, not 75.
      - id: b
        text: TP = 15, FN = 5, FP = 5, TN = 75.
        correct: true
        feedback: Five failed grasps were missed and 75 successful grasps were correctly cleared.
      - id: c
        text: TP = 5, FN = 15, FP = 5, TN = 75.
        correct: false
        feedback: The robot flagged 15 actual failures, so TP is 15.
    solution: The 20 failures split into 15 caught and 5 missed. The 80 successes split into 5 false
      alarms and 75 correct clearances.
  - id: evm-rare-class
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt:
      Only 1 in 100 test parts is actually faulty. A camera claims its 99% accuracy proves it catches
      faults well. What should you check first?
    options:
      - id: a
        text: Whether it used the same prediction for every training example.
        correct: false
        feedback: Training behaviour alone does not show which test faults it caught.
      - id: b
        text: Whether its test set contains exactly as many faults as fine parts.
        correct: false
        feedback:
          Only a few test parts are faulty. Changing that balance does not explain what this camera
          gets right or wrong.
      - id: c
        text: Whether it simply says fine for every test part.
        correct: true
        feedback: That rule gets 99 of 100 right while missing the only fault.
    solution: An always-fine camera reaches 99% accuracy here without detecting anything. Read the
      confusion matrix before trusting that score.
  - id: evm-catch-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does recall measure when faulty is positive?
    options:
      - id: a
        text: The share of flagged parts that are actually faulty.
        correct: false
        feedback: That starts from the flags and measures precision.
      - id: b
        text: The share of actually faulty parts that are flagged.
        correct: true
        feedback: Recall starts from the Actually faulty row, including caught and missed faulty parts.
      - id: c
        text: The share of all parts the camera gets right.
        correct: false
        feedback: That includes correctly cleared fine parts and measures accuracy.
    solution: Recall asks how many actually faulty parts were flagged, so it divides TP by TP + FN.
  - id: evm-catch-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does the worked example use 6 + 2 for precision but 6 + 4 for recall?
    options:
      - id: a
        text: Precision starts with flags. Recall starts with actually faulty parts.
        correct: true
        feedback: The flagged column includes false alarms. The actually faulty row includes missed faults.
      - id: b
        text: Precision counts correct answers. Recall counts every test part.
        correct: false
        feedback: Both fractions have TP on top. Neither starts from all test parts.
      - id: c
        text: Precision ignores mistakes. Recall includes both kinds of mistakes.
        correct: false
        feedback: Precision's starting group includes FP, while recall's includes FN.
    solution: Precision starts from the column of eight flagged parts, including two false alarms.
      Recall starts from the row of ten actually faulty parts, including four misses.
  - id: evm-precision-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      "A camera checks 100 parts. Its counts are: true positives {{=5*k}}, false positives {{=20-5*k}}, false
      negatives 10 and true negatives {{=100-5*k-(20-5*k)-10}}. What is precision as a decimal?"
    params:
      k:
        min: 1
        max: 4
        step: 1
    constraints:
      - k != 2
    answer_expr: 5 * k / 20
    tolerance:
      abs: 1.0e-06
    solution:
      Of 20 flagged parts, {{= 5 * k }} are actually faulty. Precision is {{= 5 * k }} / 20 = {{= 5 * k /
      20 }}.
    common_wrong:
      - answer_expr: 5*k/(5*k+10)
        category: misunderstood_definition
        feedback: That uses all actual positives and gives recall. Precision uses all predicted positives.
  - id: evm-recall-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      "A camera checks 100 parts. Its counts are: true positives {{=5*k}}, false negatives {{=20-5*k}}, false
      positives 6 and true negatives {{=100-5*k-(20-5*k)-6}}. What is recall as a decimal?"
    params:
      k:
        min: 1
        max: 4
        step: 1
    answer_expr: 5 * k / 20
    tolerance:
      abs: 1.0e-06
    solution:
      There are 20 actually faulty parts, including the misses. Recall is {{= 5 * k }} / 20 = {{= 5 * k /
      20 }}.
  - id: evm-swapped-denominator
    dimension: math
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt:
      A camera detects faulty parts. It records 8 true positives, 2 false positives and 12 false
      negatives. A learner reports recall as $8/(8+2)=0.8$. What went wrong?
    options:
      - id: a
        text: They should include true negatives in the starting group.
        correct: false
        feedback: Recall starts from actually faulty parts, not fine parts correctly called fine.
      - id: b
        text: They should count false positives as detected faults.
        correct: false
        feedback: False positives are fine parts incorrectly flagged, not detected faults.
      - id: c
        text: They started from flagged parts instead of actually faulty parts.
        correct: true
        feedback: Recall uses TP + FN = 20, so recall is 8/20 = 0.4.
    solution: The group of 8 + 2 counts flagged parts. Recall uses the 8 caught plus 12 missed
      faulty parts, giving 0.4.
  - id: evm-no-flags
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: A camera flags nothing in a test set containing 10 actually faulty parts. Which statement is correct?
    options:
      - id: a
        text: Precision can't be computed and recall is zero.
        correct: true
        feedback: Precision divides by zero because there are no flags. Recall is 0/10.
      - id: b
        text: Precision is one and recall is zero.
        correct: false
        feedback: No false alarms does not make 0/0 equal one.
      - id: c
        text: Precision is zero and recall is one.
        correct: false
        feedback: No faulty parts were caught, so recall cannot be one. Precision can't be computed.
    solution: With TP = FP = 0, precision is 0/0 and can't be computed. With FN = 10, recall is 0/10 = 0.
  - id: evm-spam
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt:
      A spam filter marks spam as positive. Blocking a genuine email is very costly, but users can
      tolerate some spam in their inbox. Which priority fits?
    options:
      - id: a
        text: Favour recall alone, even if many genuine emails are blocked.
        correct: false
        feedback: That ignores the stated high cost of false positives.
      - id: b
        text: Favour precision while still reporting recall.
        correct: true
        feedback:
          High precision means blocked messages are mostly genuine spam. Recall shows how much spam
          slips through.
      - id: c
        text: Favour accuracy alone, without checking blocked messages.
        correct: false
        feedback: Accuracy can hide the costly false positives among many correctly delivered messages.
    solution: Blocking genuine email is a false positive. Precision directly checks the genuine-spam
      share of blocked messages, but recall is still needed to reveal missed spam.
  - id: evm-numbers-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does mean absolute error measure?
    options:
      - id: a
        text: The average error size after ignoring positive and negative signs.
        correct: true
        feedback: Absolute error measures distance from zero, so signs cannot cancel.
      - id: b
        text: The average signed error after allowing opposite signs to cancel.
        correct: false
        feedback: That can hide large misses and is not mean absolute error.
      - id: c
        text: The fraction of predicted categories that match the correct ones.
        correct: false
        feedback: That is accuracy for category predictions, not a price-error score.
    solution: MAE averages how far predicted prices are from actual prices, in the same units as the prices.
  - id: evm-numbers-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does the house worked example square the errors before averaging for RMSE?
    options:
      - id: a
        text: Squaring removes the need to divide by the number of houses.
        correct: false
        feedback: MSE is still an average, so it must divide by four houses.
      - id: b
        text: Squaring makes all large errors contribute less than small ones.
        correct: false
        feedback: Squaring increases the relative contribution of larger errors.
      - id: c
        text: Squaring prevents sign cancellation and emphasises larger misses.
        correct: true
        feedback: A 40-unit miss contributes 1600 before averaging, compared with 100 for a 10-unit miss.
    solution:
      Squaring keeps positive and negative errors from cancelling and gives large misses greater
      relative weight. The final square root restores the original units.
  - id: evm-mae-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      A model's errors on four held-out houses are +{{= k }}, −{{= k }}, +{{= 3 * k }} and −{{= 3
      * k }} thousand pounds. What is MAE in thousands of pounds?
    params:
      k:
        min: 1
        max: 10
        step: 1
    answer_expr: 2 * k
    tolerance:
      abs: 0.000001
    solution: The absolute errors sum to {{= 8 * k }}. Divide by four houses to get {{= 2 * k }}
      thousand pounds.
  - id: evm-rmse-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      A model's errors on four test houses are 0, 0, 0 and +{{= 4 * k }} thousand pounds. What is
      RMSE in thousands of pounds?
    params:
      k:
        min: 1
        max: 10
        step: 1
    answer_expr: 2 * k
    tolerance:
      abs: 0.000001
    solution:
      The squared errors sum to {{= 16 * k * k }}. MSE is {{= 4 * k * k }}, whose square root is
      {{= 2 * k }} thousand pounds.
  - id: evm-cancellation
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt:
      Two price errors are +20 and −20 thousand pounds. A learner says the model is perfect because their average
      is zero. What is the mistake?
    options:
      - id: a
        text: Nothing; errors of $+20$ and $−20$ balance, so the model is accurate on average.
        correct: false
        feedback: A zero signed average hides two misses of $20$; it does not mean accurate individual predictions.
      - id: b
        text: Opposite signed errors cancel even when both predictions miss.
        correct: true
        feedback: Both predictions miss by $20$, so both error scores are $20$.
      - id: c
        text: They should average the predictions, which would differ from the average actual price.
        correct: false
        feedback: With signed errors summing to zero, the two averages are equal. Measure each miss before averaging.
    solution:
      Signed error averages can cancel overpricing against underpricing. Absolute or squared errors reveal
      both misses, giving MAE = RMSE = $20$.
  - id: evm-units
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: House prices are measured in pounds. Which units do MSE and RMSE have?
    options:
      - id: a
        text: MSE uses squared pounds, while RMSE uses pounds.
        correct: true
        feedback: Squaring changes the units. The final square root reverses that change.
      - id: b
        text: MSE uses pounds, while RMSE uses squared pounds.
        correct: false
        feedback: That reverses the effects of squaring and taking a square root.
      - id: c
        text: MSE and RMSE are both fractions without units.
        correct: false
        feedback: These errors measure numeric price differences, not class proportions.
    solution: MSE averages squared price errors, in pounds squared. RMSE takes the square root,
      restoring pounds.
  - id: evm-robot-distance
    dimension: math
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt:
      A robot predicts travel distances. Model A has errors +2, −2, +2, −2 cm. B has 0, 0, 0, +8
      cm. Large single misses are especially dangerous. Which comparison fits?
    options:
      - id: a
        text: Both MAE and RMSE tie, so either model is equally safe.
        correct: false
        feedback: MAE ties at 2 cm, but RMSE is 2 for A and 4 for B.
      - id: b
        text: MAE favours B because it is exactly right three times.
        correct: false
        feedback: B's 8 cm miss makes its average absolute error 2 cm, equal to A's.
      - id: c
        text: MAE ties, but RMSE favours A for avoiding one large miss.
        correct: true
        feedback: The squared averages are 4 and 16, giving RMSE 2 and 4 cm.
    solution:
      Both total absolute errors are 8 cm, so MAE ties at 2 cm. RMSE is 2 cm for A and 4 cm for
      B, revealing B's dangerous large miss.
  - id: evm-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt:
      A factory camera has $94\%$ test accuracy, with 6 true positives, 2 false positives, 4 false
      negatives and 88 true negatives. Calculate and interpret precision, calculate and interpret recall,
      and explain why the accuracy can be misleading when missed faults are dangerous.
    rubric:
      - id: scores
        criterion: Calculate precision as $6/8=0.75$, the genuine share of flagged parts.
        weight: 1
        required: true
      - id: recall
        criterion: Calculate recall as $6/10=0.60$, the caught share of actually faulty parts.
        weight: 1
        required: true
      - id: cost
        criterion:
          Explain that the $88$ correctly cleared fine parts make accuracy high even though four of ten faults
          were missed.
        weight: 1
        required: true
    exemplar: "Precision is $6/8=0.75$, so three quarters of flags are genuine faults. Recall is $6/10=0.60$, so four of ten faults were missed. The $88$ true negatives make accuracy high while those dangerous misses remain."
    solution: "Precision is $6/8=0.75$, so three quarters of flags are genuine faults. Recall is $6/10=0.60$, so four of ten faults were missed. The $88$ true negatives make accuracy high while those dangerous misses remain."
  - id: evm-recall-count-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: evm-count
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what does accuracy measure, and why can it hide missed faults when faults are rare?
    rubric:
      - id: first
        criterion: Explain that accuracy is the fraction of all test parts classified correctly.
        weight: 1
        required: true
      - id: second
        criterion: Explain that correctly cleared fine parts can give high accuracy while the camera misses every fault.
        weight: 1
        required: true
    exemplar: Accuracy is the share of all test parts the camera gets right. When faults are rare, correctly clearing the many fine parts can give high accuracy even when every fault is missed.
  - id: evm-recall-count-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: evm-count
    difficulty: 1
    est_minutes: 0.5
    prompt: A factory camera calls a fine part faulty. Which confusion-matrix count increases?
    options:
      - id: a
        text: False negatives
        correct: false
        feedback: A false negative is a faulty part that the camera misses.
      - id: b
        text: False positives
        correct: true
        feedback: A false positive is a fine part wrongly flagged as faulty.
      - id: c
        text: True positives
        correct: false
        feedback: A true positive is a faulty part correctly flagged.
    solution: A fine part wrongly flagged is a false positive.
  - id: evm-recall-count-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: evm-count
    difficulty: 1
    est_minutes: 0.5
    prompt: Write accuracy using the four confusion-matrix counts $\text{TP}$, $\text{TN}$, $\text{FP}$ and $\text{FN}$. Type `tp`, `tn`, `fp` and `fn` for those counts.
    answer: (tp+tn)/(tp+tn+fp+fn)
    variables:
      {
        "tp": { "values": [1, 25, 50] },
        "tn": { "values": [1, 50, 100] },
        "fp": { "values": [1, 15, 30] },
        "fn": { "values": [1, 15, 30] },
      }
    solution: "Accuracy divides the correct counts by all counts: $(\text{TP}+\text{TN})/(\text{TP}+\text{TN}+\text{FP}+\text{FN})$."
  - id: evm-recall-catch-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: evm-catch
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what do precision and recall each measure for a fault-detection camera?
    rubric:
      - id: first
        criterion: Explain that precision is the fraction of flagged parts that are actually faulty.
        weight: 1
        required: true
      - id: second
        criterion: Explain that recall is the fraction of actually faulty parts that the camera flags.
        weight: 1
        required: true
    exemplar: Precision is the fraction of flagged parts that are actually faulty. Recall is the fraction of actually faulty parts the camera flags.
  - id: evm-recall-catch-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: evm-catch
    difficulty: 1
    est_minutes: 0.5
    prompt: A camera flags no parts in a test batch that contains faulty parts. What should be reported for its precision?
    options:
      - id: a
        text: Precision is 1.
        correct: false
        feedback: Having no false alarms can look perfect, but with no flags there is nothing to divide by.
      - id: b
        text: Precision is 0.
        correct: false
        feedback: It is recall that is 0, because every fault was missed. Precision has zero flags on the bottom.
      - id: c
        text: Precision can't be computed.
        correct: true
        feedback: There are no flags, so precision would be $0/0$.
    solution: Precision divides caught faults by all flags. With no flags, it is $0/0$ and can't be computed.
  - id: evm-recall-catch-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: evm-catch
    difficulty: 1
    est_minutes: 0.5
    prompt: Write precision using confusion-matrix counts $\text{TP}$, $\text{FP}$ and $\text{FN}$. Type `tp`, `fp` and `fn` for those counts.
    answer: tp/(tp+fp)
    variables:
      {
        "tp": { "values": [1, 25, 50] },
        "fp": { "values": [1, 15, 30] },
        "fn": { "values": [1, 15, 30] },
      }
    solution: Precision is $\text{TP}/(\text{TP}+\text{FP})$, the share of all flags that are actually faulty.
  - id: evm-recall-numbers-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: evm-numbers
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what does mean absolute error average, and why does RMSE use the same units as the predicted prices?
    rubric:
      - id: first
        criterion: Explain that mean absolute error averages the sizes of the errors, ignoring their signs.
        weight: 1
        required: true
      - id: second
        criterion: Explain that taking the square root of mean squared error puts RMSE back in the units of the prices.
        weight: 1
        required: true
    exemplar: Mean absolute error averages the sizes of the misses, ignoring their signs. RMSE takes the square root of MSE, returning the score to the units of the prices.
  - id: evm-recall-numbers-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: evm-numbers
    difficulty: 1
    est_minutes: 0.5
    prompt: Two house-price models tie on mean absolute error. One has a much larger single miss. Which score gives that large miss extra influence?
    options:
      - id: a
        text: Mean squared error
        correct: true
        feedback: Squaring makes a large miss contribute much more than a small miss.
      - id: b
        text: Mean signed error
        correct: false
        feedback: Positive and negative signed errors can cancel.
      - id: c
        text: Mean absolute error
        correct: false
        feedback: Absolute error counts each miss by its size, and the models tie on this score.
    solution: MSE squares each error before averaging, giving large misses extra influence.
  - id: evm-recall-numbers-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: evm-numbers
    difficulty: 1
    est_minutes: 0.5
    prompt: A price model has signed errors $e_1$, $e_2$, $e_3$ and $e_4$ on four held-out houses. Write its root mean squared error. Type `e1` for $e_1$, and so on, and `sqrt(...)` for a square root.
    answer: sqrt((e1^2+e2^2+e3^2+e4^2)/4)
    variables:
      e1: [-40, 40]
      e2: [-40, 40]
      e3: [-40, 40]
      e4: [-40, 40]
    solution: 'Square each error, average the squares to get the MSE, then take the square root: $\text{RMSE}=\sqrt{(e_1^2+e_2^2+e_3^2+e_4^2)/4}$.'
