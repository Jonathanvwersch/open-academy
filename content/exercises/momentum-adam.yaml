concept: momentum-adam
exercises:
  - id: mad-memory-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does momentum use to choose a parameter's update?"
    options:
      - {
          id: a,
          text: "A weighted average of recent signed gradients.",
          correct: true,
          feedback: "The stored average keeps part of earlier gradients and includes the latest one.",
        }
      - {
          id: b,
          text: "Only the largest gradient seen during training.",
          correct: false,
          feedback: "Momentum weights recent history; it does not select the largest gradient.",
        }
      - {
          id: c,
          text: "An average of the targets instead of gradients.",
          correct: false,
          feedback: "Targets help determine loss, but momentum's memory stores loss gradients.",
        }
      - {
          id: d,
          text: "The first gradient, reused without any changes.",
          correct: false,
          feedback: "A fresh gradient enters the average on every update.",
        }
    solution: "Momentum combines the current gradient with a stored average of earlier gradients. This lets more than one batch influence the move."
  - id: mad-memory-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why is the second move only $+0.05$ when the new gradient is $-4$? Use $m_1=1$, $\\beta_1=0.75$ and $\\eta=0.2$."
    options:
      - {
          id: a,
          text: "The learning rate switches sign when a gradient reverses.",
          correct: false,
          feedback: "The rate stays positive; subtracting the negative average raises the parameter.",
        }
      - {
          id: b,
          text: "The old positive average partly offsets the new negative gradient.",
          correct: true,
          feedback: "The average is 0.75 times 1 plus 0.25 times -4, which is -0.25.",
        }
      - {
          id: c,
          text: "The negative gradient is discarded before updating the average.",
          correct: false,
          feedback: "The negative gradient contributes -1, so its sign is retained.",
        }
      - {
          id: d,
          text: "The prediction is reset to its starting value before each move.",
          correct: false,
          feedback: "The next update starts at the prediction left by the preceding update.",
        }
    solution: "The new average is $0.75(1)+0.25(-4)=-0.25$, so the move is $-0.2(-0.25)=+0.05$. The old positive average softened this reversal."
  - id: mad-memory-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "With $\\beta_1=0.75$, previous average ${{= old }}$ and fresh gradient ${{= g }}$, what is the new signed average?"
    params:
      old: { min: -4, max: 4 }
      g: { min: -8, max: 8, step: 2 }
    answer_expr: "0.75*old+0.25*g"
    tolerance: { abs: 0.001 }
    solution: "Keep three quarters of the old average and one quarter of the new gradient: $m_t=0.75({{= old }})+0.25({{= g }})={{= 0.75*old+0.25*g }}$. The signs of both contributions matter."
  - id: mad-memory-zero
    dimension: math
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The previous average is $4$, the latest gradient is $0$, $\\beta_1=0.75$ and $\\eta=0.2$. What is momentum's change in $w$?"
    options:
      - {
          id: a,
          text: "$0$, because the latest gradient is zero.",
          correct: false,
          feedback: "Zero current gradient does not erase the previous average.",
        }
      - {
          id: b,
          text: "$+0.6$, because the remaining average is positive.",
          correct: false,
          feedback: "A positive average is subtracted, so it lowers w.",
        }
      - {
          id: c,
          text: "$-0.6$, because the remaining average is $3$.",
          correct: true,
          feedback: "The average becomes 0.75 times 4, and the move is -0.2 times 3.",
        }
      - {
          id: d,
          text: "$-0.8$, because the old average stays at $4$.",
          correct: false,
          feedback: "The old average is multiplied by 0.75 even when the new gradient is zero.",
        }
    solution: "The average decays to $0.75\\times4+0.25\\times0=3$. Subtracting $0.2\\times3$ changes $w$ by $-0.6$, so memory can keep the parameter moving."
  - id: mad-memory-update-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A parameter is $w={{= w }}$, with previous signed average ${{= old }}$. A new batch gives gradient ${{= g }}$. Use momentum with $\\beta_1=0.75$ and $\\eta=0.2$. What is the updated parameter?"
    params:
      w: { min: 1, max: 6 }
      old: { min: -4, max: 4, step: 2 }
      g: { min: -8, max: 8, step: 4 }
    answer_expr: "w-0.2*(0.75*old+0.25*g)"
    tolerance: { abs: 0.001 }
    solution: "First update the average to $0.75({{= old }})+0.25({{= g }})={{= 0.75*old+0.25*g }}$. Then subtract the scaled average: $w_{\\text{new}}={{= w }}-0.2({{= 0.75*old+0.25*g }})={{= w-0.2*(0.75*old+0.25*g) }}$."
  - id: mad-memory-robot
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A robot's training gradients have recently changed direction consistently. Its momentum average still points the old way. What is a reasonable explanation?"
    options:
      - {
          id: a,
          text: "The averaging arithmetic must be wrong whenever signs disagree.",
          correct: false,
          feedback: "A weighted history can temporarily disagree with the latest gradients even with correct arithmetic.",
        }
      - {
          id: b,
          text: "The gradient's sign no longer matters after the first update.",
          correct: false,
          feedback: "Every new signed gradient enters the average and can eventually reverse it.",
        }
      - {
          id: c,
          text: "The batch targets must have been replaced by old predictions.",
          correct: false,
          feedback: "No target replacement is implied by momentum; the explanation lies in the stored gradients.",
        }
      - {
          id: d,
          text: "A long memory can delay responding to a useful change in direction.",
          correct: true,
          feedback: "Earlier gradients retain weight, especially with a large beta one.",
        }
    solution: "Momentum retains old direction information, so a useful reversal can take several updates to dominate. A larger $\\beta_1$ generally keeps that influence longer."
  - id: mad-scale-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does the squared-gradient average $v_t$ remember?"
    options:
      - {
          id: a,
          text: "The sign of the most recent batch gradient.",
          correct: false,
          feedback: "Squaring removes sign; the signed average m keeps direction information.",
        }
      - {
          id: b,
          text: "Recent squared gradient sizes for one parameter.",
          correct: true,
          feedback: "Each parameter has its own average of its squared gradient entries.",
        }
      - {
          id: c,
          text: "The average of all model parameters' current values.",
          correct: false,
          feedback: "The average is over one parameter's gradient history, not over different parameters.",
        }
      - {
          id: d,
          text: "The number of examples in the current minibatch.",
          correct: false,
          feedback: "Batch size counts examples; v averages squared slopes.",
        }
    solution: "$v_t$ averages squared gradients over recent updates for a single parameter. Its square root provides that parameter's gradient-size estimate."
  - id: mad-scale-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why do the worked example's first gradients $4$ and $2$ both give $m_1/\\sqrt{v_1}=0.5$ with zero starting averages and $\\beta_1=\\beta_2=0.75$?"
    options:
      - {
          id: a,
          text: "Both parameters are forced to use a shared squared-gradient average.",
          correct: false,
          feedback: "Their averages are separate: v is 4 for one and 1 for the other.",
        }
      - {
          id: b,
          text: "Squaring makes the two gradients equal before averaging them.",
          correct: false,
          feedback: "Their squares are 16 and 4, which are different.",
        }
      - {
          id: c,
          text: "The larger signed average also has a proportionally larger denominator.",
          correct: true,
          feedback: "The pairs are 1 divided by 2 and 0.5 divided by 1.",
        }
      - {
          id: d,
          text: "The first gradient of every run is ignored by the size calculation.",
          correct: false,
          feedback: "The first gradient supplies all the nonzero information in both averages.",
        }
    solution: "For gradient $4$, the ratio is $1/\\sqrt4=0.5$; for gradient $2$, it is $0.5/\\sqrt1=0.5$. The square root makes the denominator grow in proportion to the initial gradient's magnitude."
  - id: mad-squares-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Use $\\beta_2=0.75$, previous squared-gradient average $v_{t-1}={{= old }}$ and new gradient $g_t={{= g }}$. What is $v_t$?"
    params:
      old: { min: 0, max: 16, step: 4 }
      g: { min: -6, max: 6, step: 2 }
    answer_expr: "0.75*old+0.25*g^2"
    tolerance: { abs: 0.001 }
    solution: "Square the new gradient before averaging: $v_t=0.75({{= old }})+0.25({{= g }})^2={{= 0.75*old+0.25*g^2 }}$. A negative gradient still contributes a nonnegative squared size."
  - id: mad-squares-sign
    dimension: math
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Start with $v_0=0$ and use $\\beta_2=0.75$. The first gradient is $-4$. What is $v_1$?"
    options:
      - {
          id: a,
          text: "$-4$, from keeping the gradient's sign after squaring.",
          correct: false,
          feedback: "The square of -4 is positive 16, not negative 16.",
        }
      - {
          id: b,
          text: "$-1$, from averaging the signed gradient directly.",
          correct: false,
          feedback: "That would be the signed average with beta one 0.75; v needs the square.",
        }
      - {
          id: c,
          text: "$16$, from replacing the average with the whole square.",
          correct: false,
          feedback: "With $\\beta_2=0.75$, only one quarter of the first squared gradient enters.",
        }
      - {
          id: d,
          text: "$4$, from adding one quarter of the squared gradient.",
          correct: true,
          feedback: "One quarter of (-4) squared is one quarter of 16, which is 4.",
        }
    solution: "$v_1=0.75(0)+0.25(-4)^2=4$. The square removes the sign, while the averaging coefficient reduces the initial value."
  - id: mad-denominator-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "Before starting-value correction, a parameter has signed average $m_t={{= k*s }}$ and squared-gradient average $v_t={{= s^2 }}$. What is the scaled value $m_t/\\sqrt{v_t}$?"
    params:
      k: { min: -3, max: 3 }
      s: { min: 1, max: 4 }
    constraints: ["k != 0"]
    answer_expr: "k"
    tolerance: { abs: 0.001 }
    solution: "The denominator is $\\sqrt{{{= s^2 }}}={{= s }}$, so the ratio is ${{= k*s }}/{{= s }}={{= k }}$. Take the square root of the size average, and keep the numerator's sign."
  - id: mad-scale-new-model
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "Two parameters in a new model both have signed average $2$. Their size estimates $\\sqrt{v_t}$ are $1$ and $4$. Before correction, how do their scaled values compare?"
    options:
      - {
          id: a,
          text: "They are $2$ and $0.5$, so the second is smaller.",
          correct: true,
          feedback: "Divide each signed average by its own size estimate.",
        }
      - {
          id: b,
          text: "They are $2$ and $8$, so the second is larger.",
          correct: false,
          feedback: "The size estimate divides the signed average; it does not multiply it.",
        }
      - {
          id: c,
          text: "They are both $2$, since their signed averages match.",
          correct: false,
          feedback: "Different denominators change the scaled values even with matching numerators.",
        }
      - {
          id: d,
          text: "They are both $0.8$, since their sizes must be pooled.",
          correct: false,
          feedback: "Pooling 1 and 4 would give 2.5, but the method uses a separate size per parameter.",
        }
    solution: "The scaled values are $2/1=2$ and $2/4=0.5$. Holding the signed average fixed, a larger size estimate reduces the magnitude of the scaled value."
  - id: mad-correction-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "Why does Adam divide its averages by $1-\\beta_1^t$ and $1-\\beta_2^t$?"
    options:
      - {
          id: a,
          text: "To remove all disagreement between a batch and the full dataset.",
          correct: false,
          feedback: "The correction addresses zero initialisation, not sampling noise.",
        }
      - {
          id: b,
          text: "To reset both stored gradient averages to zero after every batch.",
          correct: false,
          feedback: "Resetting would discard the history. Correction rescales the averages for the move and keeps their raw values for later.",
        }
      - {
          id: c,
          text: "To remove the starting zero's influence on the weighted averages.",
          correct: true,
          feedback: "Real gradients initially have less than the full total weight, so we divide by their weight.",
        }
      - {
          id: d,
          text: "To force each remembered direction to equal the latest gradient.",
          correct: false,
          feedback: "Changing gradients still form a weighted history after correction.",
        }
    solution: "Starting the averages at zero makes their early values too small relative to the gradients they average. Dividing by the weight assigned to real gradients removes that starting effect."
  - id: mad-correction-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why do we divide $m_2=1.75$ by $7/16$ rather than by $2$?"
    options:
      - {
          id: a,
          text: "Two is the batch size, which applies only to squared gradients.",
          correct: false,
          feedback: "Two here counts updates, not examples; the correction uses weights, not a batch size.",
        }
      - {
          id: b,
          text: "The two real gradients carry total weight $7/16$ in the stored average.",
          correct: true,
          feedback: "Their weights are 3/16 and 1/4, leaving 9/16 on the starting zero.",
        }
      - {
          id: c,
          text: "The new gradient is $7/16$ of the previous gradient's value.",
          correct: false,
          feedback: "Both gradients are 4; 7/16 describes their total weight, not their values.",
        }
      - {
          id: d,
          text: "Every average must be divided by its current numerical value.",
          correct: false,
          feedback: "Dividing 1.75 by itself would give 1, not the corrected gradient 4.",
        }
    solution: "The starting zero retains weight $(3/4)^2=9/16$, leaving $7/16$ on real gradients. Dividing $1.75$ by that total weight gives $4$; dividing by the update count would not undo the zero start."
  - id: mad-correction-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "On update $t=1$, use $\\beta_1=0.75$ and stored signed average $m_1={{= g/4 }}$, obtained from a first gradient of ${{= g }}$. What is the corrected average $\\hat m_1$?"
    params:
      g: { min: -8, max: 8, step: 2 }
    constraints: ["g != 0"]
    answer_expr: "g"
    tolerance: { abs: 0.001 }
    solution: "Divide by $1-0.75^1=0.25$: $\\hat m_1=({{= g/4 }})/0.25={{= g }}$. With only one real gradient, the correction recovers that gradient exactly."
  - id: mad-correction-clock
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "An epoch is one pass through the training data. A run has made $20$ batch updates during $2$ epochs without resetting its averages. Which $t$ belongs in Adam's next bias correction?"
    options:
      - {
          id: a,
          text: "$t=3$, because the next epoch follows two epochs.",
          correct: false,
          feedback: "The counter counts batch updates, not epochs.",
        }
      - {
          id: b,
          text: "$t=20$, because the new gradient has not counted yet.",
          correct: false,
          feedback: "The new gradient is included in the averages being corrected, so it counts as update 21.",
        }
      - {
          id: c,
          text: "$t=1$, because each new batch restarts the averages.",
          correct: false,
          feedback: "Averages are retained across batches; a new batch is not a new run.",
        }
      - {
          id: d,
          text: "$t=21$, because the new gradient makes the twenty-first update.",
          correct: true,
          feedback: "Both correction powers use the number of updates since the averages were initialised.",
        }
    solution: "The next gradient will be included as update $21$, so use $1-\\beta_1^{21}$ and $1-\\beta_2^{21}$. Epoch boundaries do not reset the memory or its counter."
  - id: mad-correction-two-memories
    dimension: math
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "On the first update with gradient $4$, take $\\beta_1=0.5$ and $\\beta_2=0.75$. Stored averages are $m_1=2$, $v_1=4$. Which corrected pair $(\\hat m_1,\\hat v_1)$ is right?"
    options:
      - {
          id: a,
          text: "$(4,16)$, using the matching correction for each average.",
          correct: true,
          feedback: "Divide 2 by 0.5 and 4 by 0.25.",
        }
      - {
          id: b,
          text: "$(4,8)$, using the signed average's setting for both.",
          correct: false,
          feedback: "The squared average uses beta two, so its divisor is 0.25, not 0.5.",
        }
      - {
          id: c,
          text: "$(8,16)$, using the squared average's setting for both.",
          correct: false,
          feedback: "The signed average uses beta one, so its divisor is 0.5, not 0.25.",
        }
      - {
          id: d,
          text: "$(2,4)$, using the stored values without correcting.",
          correct: false,
          feedback: "Both memories started at zero, so both need the first-update correction.",
        }
    solution: "$\\hat m_1=2/(1-0.5)=4$ and $\\hat v_1=4/(1-0.75)=16$. The two chosen fractions may differ, and each correction must match the average it corrects."
  - id: mad-correction-changing
    dimension: math
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A new model's first two gradients are $4,-4$. With $\\beta_1=0.75$, its raw averages are $m_1=1$, $m_2=-0.25$. Since $1-0.75^2=7/16$, which is the corrected second average?"
    options:
      - {
          id: a,
          text: "$-4$, because correction must return the latest gradient.",
          correct: false,
          feedback: "Correction retains a weighted history, not just the latest gradient.",
        }
      - {
          id: b,
          text: "$0$, because opposite gradients always cancel equally.",
          correct: false,
          feedback: "The more recent gradient carries greater weight.",
        }
      - {
          id: c,
          text: "$-4/7$, because correction rescales the stored history.",
          correct: true,
          feedback: "Divide -1/4 by 7/16 to get -4/7.",
        }
      - {
          id: d,
          text: "$-7/64$, because correction multiplies by the real gradients' weight.",
          correct: false,
          feedback: "Multiplying by 7/16 would shrink the value further; the correction divides.",
        }
    solution: "$\\hat m_2=(-1/4)/(7/16)=-4/7$. Correction removes the zero start while retaining the unequal weights of the two real gradients."
  - id: mad-adam-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "Which describes Adam's parameter move after updating and correcting its two averages?"
    options:
      - {
          id: a,
          text: "Add the squared average times the learning rate to the parameter.",
          correct: false,
          feedback: "Adam subtracts a scaled signed direction; the squared average supplies a denominator.",
        }
      - {
          id: b,
          text: "Subtract the rate times the corrected direction divided by corrected size plus epsilon.",
          correct: true,
          feedback: "The direction is m hat, and the corrected size is the square root of v hat.",
        }
      - {
          id: c,
          text: "Subtract the rate times the loss divided by the number of parameters.",
          correct: false,
          feedback: "The update uses gradient histories, not the numerical loss itself.",
        }
      - {
          id: d,
          text: "Replace the parameter with its squared-gradient average after each batch.",
          correct: false,
          feedback: "The parameter is updated after each batch and remains distinct from the gradient averages.",
        }
    solution: "Adam uses $w_t=w_{t-1}-\\eta\\hat m_t/(\\sqrt{\\hat v_t}+\\epsilon)$. The signed average chooses direction, while the denominator scales the move separately for each parameter."
  - id: mad-adam-why
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the full worked example, why is the denominator $5$ when $\\hat v_1=16$ and $\\epsilon=1$?"
    options:
      - {
          id: a,
          text: "We take the square root of $16+1$, then round it.",
          correct: false,
          feedback: "Epsilon is outside the square root, and this calculation requires no rounding.",
        }
      - {
          id: b,
          text: "We divide $16$ by the gradient, then omit epsilon.",
          correct: false,
          feedback: "The denominator is a square root plus epsilon, not a division by the gradient.",
        }
      - {
          id: c,
          text: "We add the two raw averages, $1+4$, as a general rule.",
          correct: false,
          feedback: "That happens to give 5 here, but raw averages are not added to form the denominator.",
        }
      - {
          id: d,
          text: "We take the square root of $16$, then add $1$.",
          correct: true,
          feedback: "The corrected size is 4, and epsilon adds 1 outside the root.",
        }
    solution: "Adam's denominator is $\\sqrt{\\hat v_1}+\\epsilon=\\sqrt{16}+1=5$. The deliberately large epsilon makes its position visible in this example."
  - id: mad-adam-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "An Adam update starts at $w={{= w }}$. Its corrected averages are $\\hat m_t={{= k*s }}$ and $\\hat v_t={{= (4*s-1)^2 }}$. With $\\eta=0.2$ and $\\epsilon=1$ for easy arithmetic, what is the new parameter?"
    params:
      w: { min: 1, max: 6 }
      k: { min: -2, max: 2 }
      s: { min: 1, max: 3 }
    constraints: ["k != 0"]
    answer_expr: "w-0.05*k"
    tolerance: { abs: 0.001 }
    solution: "The denominator is $\\sqrt{{{= (4*s-1)^2 }}}+1={{= 4*s }}$, so the scaled direction is ${{= k*s }}/{{= 4*s }}={{= k/4 }}$. Subtracting the scaled move gives ${{= w }}-0.2({{= k/4 }})={{= w-0.05*k }}$."
  - id: mad-epsilon-position
    dimension: math
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Suppose $\\hat m_t=0$, $\\hat v_t=0$ and $\\epsilon>0$. What does Adam's fraction $\\hat m_t/(\\sqrt{\\hat v_t}+\\epsilon)$ become?"
    options:
      - {
          id: a,
          text: "$0$, since its denominator is the positive epsilon.",
          correct: true,
          feedback: "Zero divided by a positive number is defined and equals zero.",
        }
      - {
          id: b,
          text: "Undefined, since epsilon does not affect the denominator.",
          correct: false,
          feedback: "Epsilon is added to the denominator specifically to keep it positive.",
        }
      - {
          id: c,
          text: "$1$, since the two zero averages cancel each other.",
          correct: false,
          feedback: "Zero over zero cannot be cancelled; here the denominator is epsilon instead.",
        }
      - {
          id: d,
          text: "$\\epsilon$, since it is added to the signed average.",
          correct: false,
          feedback: "Epsilon is in the denominator, not the numerator.",
        }
    solution: "The fraction is $0/(0+\\epsilon)=0$. A positive epsilon avoids the undefined division $0/0$ and produces no move in this case."
  - id: mad-adam-store
    dimension: math
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "After update 1, the worked example stores $m_1=1$, $v_1=4$, while $\\hat m_1=4$, $\\hat v_1=16$. If the next fresh gradient is $0$ and $\\beta_1=\\beta_2=0.75$, what raw averages are stored after update 2?"
    options:
      - {
          id: a,
          text: "$(3,12)$, from reusing the corrected averages as memory.",
          correct: false,
          feedback: "The next averaging calculation uses raw 1 and 4, not corrected 4 and 16.",
        }
      - {
          id: b,
          text: "$(0,0)$, from clearing both memories for the new batch.",
          correct: false,
          feedback: "The histories persist; zero new gradient only lets them decay.",
        }
      - {
          id: c,
          text: "$(0.75,3)$, from retaining three quarters of each raw average.",
          correct: true,
          feedback: "The zero gradient adds nothing, so raw 1 becomes 0.75 and raw 4 becomes 3.",
        }
      - {
          id: d,
          text: "$(1,4)$, from leaving both memories unchanged at zero gradient.",
          correct: false,
          feedback: "The previous values are still multiplied by the chosen fraction.",
        }
    solution: "$m_2=0.75(1)+0.25(0)=0.75$ and $v_2=0.75(4)+0.25(0^2)=3$. Corrected averages calculate the move; raw averages carry history forward."
  - id: mad-adam-rate
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A new model trained with Adam shows growing loss after very large parameter moves. A teammate says adaptive scaling makes the learning rate irrelevant. What should you conclude?"
    options:
      - {
          id: a,
          text: "Growing loss proves that the squared-gradient averages are negative.",
          correct: false,
          feedback: "Correct squared averages remain nonnegative; too-large moves can raise loss anyway.",
        }
      - {
          id: b,
          text: "Adaptive scaling still multiplies by the rate, so try reducing an excessive rate.",
          correct: true,
          feedback: "The global learning rate scales every Adam move even though each parameter has its own denominator.",
        }
      - {
          id: c,
          text: "Every Adam update must lower loss, so the measured loss can be ignored.",
          correct: false,
          feedback: "Adam makes no per-update decrease guarantee, especially with noisy batches or excessive rates.",
        }
      - {
          id: d,
          text: "The rate should increase until it cancels every parameter's size estimate.",
          correct: false,
          feedback: "Increasing an excessive rate makes overshooting worse; it does not fix scale adaptation.",
        }
    solution: "Adam adapts relative scales, but the learning rate still multiplies the entire move. Watch the loss and reduce an excessive rate rather than assuming adaptation guarantees progress."
  - id: mad-explain-adam
    dimension: math
    type: explain
    role: core
    difficulty: 3
    est_minutes: 5
    prompt: "Write Adam's update rule for one parameter, starting its two averages at zero. Explain what the two memories, the correction, and epsilon each do, and why an adaptive update still needs a suitable learning rate."
    rubric:
      - {
          id: memories,
          criterion: "Give $m_t = \\beta_1m_{t-1} + (1-\\beta_1)g_t$ and $v_t = \\beta_2v_{t-1} + (1-\\beta_2)g_t^2$ with zero starts, distinguishing signed direction from squared size.",
          weight: 1,
          required: true,
        }
      - {
          id: correction,
          criterion: "Give $\\hat m_t = m_t/(1-\\beta_1^t)$ and $\\hat v_t = v_t/(1-\\beta_2^t)$, with $t$ counting updates, to remove the zero-start distortion while retaining raw memories.",
          weight: 1,
          required: true,
        }
      - {
          id: move,
          criterion: "Give $w_t = w_{t-1} - \\eta\\hat m_t/(\\sqrt{\\hat v_t}+\\epsilon)$, explain positive $\\epsilon$ prevents division by zero, and note an excessive $\\eta$ can still raise loss.",
          weight: 1,
          required: true,
        }
    exemplar: |
      Start $m_0=v_0=0$. For a fresh batch gradient $g_t$ at the current parameter, update $m_t=\beta_1m_{t-1}+(1-\beta_1)g_t$ and $v_t=\beta_2v_{t-1}+(1-\beta_2)g_t^2$. The first remembers signed directions and the second remembers squared sizes, separately for every parameter. Correct the zero start with $\hat m_t=m_t/(1-\beta_1^t)$ and $\hat v_t=v_t/(1-\beta_2^t)$, where $t$ counts batch updates. Then use $w_t=w_{t-1}-\eta\hat m_t/(\sqrt{\hat v_t}+\epsilon)$; positive epsilon prevents a zero denominator. Keep the raw averages for the next fresh gradient. The learning rate still scales the move, so an excessive value can overshoot and increase loss.
    solution: "Adam combines a signed gradient memory with a squared-size memory, corrects both for zero initialisation, and divides corrected direction by corrected size plus epsilon before taking the scaled step. Its learning rate remains a choice that affects whether training improves."
