concept: momentum-adam
exercises:
  - id: mad-memory-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: Which quantity supplies momentum's direction for one parameter update?
    options:
      - id: a
        text: A weighted average of recent signed gradients for that parameter.
        correct: true
        feedback: Momentum retains signed gradient history and adds the new signed gradient.
      - id: b
        text: The current gradient for that parameter, with earlier gradients discarded.
        correct: false
        feedback: That omits momentum's stored history.
      - id: c
        text: A weighted average of recent gradient magnitudes for that parameter.
        correct: false
        feedback: Taking magnitudes loses the signs that momentum needs for direction.
      - id: d
        text: The current gradient averaged across all of the model's parameters.
        correct: false
        feedback: Momentum keeps a separate history for each parameter.
    solution:
      Momentum combines each parameter's current signed gradient with its stored signed average.
      This lets recent history influence the update direction.
  - id: mad-memory-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      In the worked example, $m_1=1$, the next gradient is $-4$, $\beta_1=0.75$ and $\eta=0.2$.
      Which statement explains how momentum combines the two directions?
    options:
      - id: a
        text: The old average is kept in full, then three quarters of the new gradient is added.
        correct: false
        feedback: The old average receives weight 0.75 and the new gradient receives weight 0.25.
      - id: b
        text:
          Three quarters of the old positive average partly offsets one quarter of the new negative
          gradient.
        correct: true
        feedback: The contributions are 0.75 and -1, giving the new signed average -0.25.
      - id: c
        text: The two signed values receive equal weights, so their arithmetic mean sets the move.
        correct: false
        feedback: The coefficient 0.75 gives unequal weights to the stored average and new gradient.
      - id: d
        text: Three quarters of each magnitude is combined, with the latest gradient supplying the sign.
        correct: false
        feedback: Momentum averages signed values directly, using complementary weights.
    solution:
      The new average is $0.75(1)+0.25(-4)=-0.25$. Its old positive contribution partly offsets
      the fresh negative one, so the move is $-0.2(-0.25)=+0.05$.
  - id: mad-memory-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "With $\\beta_1=0.75$, previous average ${{= old }}$ and fresh gradient ${{= g }}$, what is the new signed average?"
    params:
      old: { min: -4, max: 4 }
      g: { min: -8, max: 8, step: 2 }
    answer_expr: "0.75*old+0.25*g"
    tolerance: { abs: 0.001 }
    solution: "Keep three quarters of the old average and one quarter of the new gradient: $m_t=0.75({{= old }})+0.25({{= g }})={{= 0.75*old+0.25*g }}$. The signs of both contributions matter."
  - id: mad-memory-zero
    dimension: math
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The previous average is $4$, the latest gradient is $0$, $\\beta_1=0.75$ and $\\eta=0.2$. What is momentum's change in $w$?"
    options:
      - {
          id: a,
          text: "$0$, because the latest gradient is zero.",
          correct: false,
          feedback: "Zero current gradient does not erase the previous average.",
        }
      - {
          id: b,
          text: "$+0.6$, because the remaining average is positive.",
          correct: false,
          feedback: "A positive average is subtracted, so it lowers w.",
        }
      - {
          id: c,
          text: "$-0.6$, because the remaining average is $3$.",
          correct: true,
          feedback: "The average becomes 0.75 times 4, and the move is -0.2 times 3.",
        }
      - {
          id: d,
          text: "$-0.8$, because the old average stays at $4$.",
          correct: false,
          feedback: "The old average is multiplied by 0.75 even when the new gradient is zero.",
        }
    solution: "The average decays to $0.75\\times4+0.25\\times0=3$. Subtracting $0.2\\times3$ changes $w$ by $-0.6$, so memory can keep the parameter moving."
  - id: mad-memory-update-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A parameter is $w={{= w }}$, with previous signed average ${{= old }}$. A new batch gives gradient ${{= g }}$. Use momentum with $\\beta_1=0.75$ and $\\eta=0.2$. What is the updated parameter?"
    params:
      w: { min: 1, max: 6 }
      old: { min: -4, max: 4, step: 2 }
      g: { min: -8, max: 8, step: 4 }
    answer_expr: "w-0.2*(0.75*old+0.25*g)"
    tolerance: { abs: 0.001 }
    solution: "First update the average to $0.75({{= old }})+0.25({{= g }})={{= 0.75*old+0.25*g }}$. Then subtract the scaled average: $w_{\\text{new}}={{= w }}-0.2({{= 0.75*old+0.25*g }})={{= w-0.2*(0.75*old+0.25*g) }}$."
  - id: mad-memory-robot
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt:
      A robot model's gradients have settled into the opposite direction from its stored momentum.
      Holding the learning rate fixed, how would reducing $\beta_1$ usually affect its response?
    options:
      - id: a
        text: It would preserve the old direction longer by giving old gradients more weight.
        correct: false
        feedback: Reducing beta one reduces the old average's weight.
      - id: b
        text: It would leave the direction unchanged because beta one only rescales the final move.
        correct: false
        feedback: Beta one changes the balance of old and new signed gradients inside the average.
      - id: c
        text: It would remove gradient signs, making the response depend only on their sizes.
        correct: false
        feedback: The gradients remain signed at every beta one setting.
      - id: d
        text: It would respond sooner by giving the fresh opposite gradients more weight.
        correct: true
        feedback: A smaller beta one gives the stored direction less influence and the new gradient
          more.
    solution:
      A smaller $\beta_1$ retains less of the old signed average and gives more weight to the
      new gradient. A sustained new direction therefore usually takes over sooner.
  - id: mad-scale-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does the squared-gradient average $v_t$ remember?"
    options:
      - {
          id: a,
          text: "The sign of the most recent batch gradient.",
          correct: false,
          feedback: "Squaring removes sign; the signed average m keeps direction information.",
        }
      - {
          id: b,
          text: "Recent squared gradient sizes for one parameter.",
          correct: true,
          feedback: "Each parameter has its own average of its squared gradient entries.",
        }
      - {
          id: c,
          text: "The average of all model parameters' current values.",
          correct: false,
          feedback: "The average is over one parameter's gradient history, not over different parameters.",
        }
      - {
          id: d,
          text: "The number of examples in the current minibatch.",
          correct: false,
          feedback: "Batch size counts examples; v averages squared slopes.",
        }
    solution: "$v_t$ averages squared gradients over recent updates for a single parameter. Its square root provides that parameter's gradient-size estimate."
  - id: mad-scale-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why do the worked example's first gradients $4$ and $2$ both give $m_1/\\sqrt{v_1}=0.5$ with zero starting averages and $\\beta_1=\\beta_2=0.75$?"
    options:
      - {
          id: a,
          text: "Both parameters are forced to use a shared squared-gradient average.",
          correct: false,
          feedback: "Their averages are separate: v is 4 for one and 1 for the other.",
        }
      - {
          id: b,
          text: "Squaring makes the two gradients equal before averaging them.",
          correct: false,
          feedback: "Their squares are 16 and 4, which are different.",
        }
      - {
          id: c,
          text: "The larger signed average also has a proportionally larger denominator.",
          correct: true,
          feedback: "The pairs are 1 divided by 2 and 0.5 divided by 1.",
        }
      - {
          id: d,
          text: "The first gradient of every run is ignored by the size calculation.",
          correct: false,
          feedback: "The first gradient supplies all the nonzero information in both averages.",
        }
    solution: "For gradient $4$, the ratio is $1/\\sqrt4=0.5$; for gradient $2$, it is $0.5/\\sqrt1=0.5$. The square root makes the denominator grow in proportion to the initial gradient's magnitude."
  - id: mad-squares-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Use $\\beta_2=0.75$, previous squared-gradient average $v_{t-1}={{= old }}$ and new gradient $g_t={{= g }}$. What is $v_t$?"
    params:
      old: { min: 0, max: 16, step: 4 }
      g: { min: -6, max: 6, step: 2 }
    answer_expr: "0.75*old+0.25*g^2"
    tolerance: { abs: 0.001 }
    solution: "Square the new gradient before averaging: $v_t=0.75({{= old }})+0.25({{= g }})^2={{= 0.75*old+0.25*g^2 }}$. A negative gradient still contributes a nonnegative squared size."
  - id: mad-squares-sign
    dimension: math
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Start with $v_0=0$ and use $\\beta_2=0.75$. The first gradient is $-4$. What is $v_1$?"
    options:
      - {
          id: a,
          text: "$-4$, from keeping the gradient's sign after squaring.",
          correct: false,
          feedback: "The square of -4 is positive 16, not negative 16.",
        }
      - {
          id: b,
          text: "$-1$, from averaging the signed gradient directly.",
          correct: false,
          feedback: "That would be the signed average with beta one 0.75; v needs the square.",
        }
      - {
          id: c,
          text: "$16$, from replacing the average with the whole square.",
          correct: false,
          feedback: "With $\\beta_2=0.75$, only one quarter of the first squared gradient enters.",
        }
      - {
          id: d,
          text: "$4$, from adding one quarter of the squared gradient.",
          correct: true,
          feedback: "One quarter of (-4) squared is one quarter of 16, which is 4.",
        }
    solution: "$v_1=0.75(0)+0.25(-4)^2=4$. The square removes the sign, while the averaging coefficient reduces the initial value."
  - id: mad-denominator-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt:
      Before starting-value correction, a parameter has signed average $m_t={{= k*s }}$ and squared-gradient
      average $v_t={{= s^2 }}$. Ignoring epsilon, what scaled direction does Adam use before multiplying
      by the learning rate?
    params:
      k:
        min: -3
        max: 3
      s:
        min: 1
        max: 4
    constraints:
      - k != 0
    answer_expr: k
    tolerance:
      abs: 0.001
    solution:
      The denominator is $\sqrt{{{= s^2 }}}={{= s }}$, so the ratio is ${{= k*s }}/{{= s }}={{=
      k }}$. Take the square root of the size average, and keep the numerator's sign.
  - id: mad-scale-new-model
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "Two parameters in a new model both have signed average $2$. Their size estimates $\\sqrt{v_t}$ are $1$ and $4$. Before correction, how do their scaled values compare?"
    options:
      - {
          id: a,
          text: "They are $2$ and $0.5$, so the second is smaller.",
          correct: true,
          feedback: "Divide each signed average by its own size estimate.",
        }
      - {
          id: b,
          text: "They are $2$ and $8$, so the second is larger.",
          correct: false,
          feedback: "The size estimate divides the signed average; it does not multiply it.",
        }
      - {
          id: c,
          text: "They are both $2$, since their signed averages match.",
          correct: false,
          feedback: "Different denominators change the scaled values even with matching numerators.",
        }
      - {
          id: d,
          text: "They are both $0.8$, since their sizes must be pooled.",
          correct: false,
          feedback: "Pooling 1 and 4 would give 2.5, but the method uses a separate size per parameter.",
        }
    solution: "The scaled values are $2/1=2$ and $2/4=0.5$. Holding the signed average fixed, a larger size estimate reduces the magnitude of the scaled value."
  - id: mad-correction-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "Why does Adam divide its averages by $1-\\beta_1^t$ and $1-\\beta_2^t$?"
    options:
      - {
          id: a,
          text: "To remove all disagreement between a batch and the full dataset.",
          correct: false,
          feedback: "The correction addresses zero initialisation, not sampling noise.",
        }
      - {
          id: b,
          text: "To reset both stored gradient averages to zero after every batch.",
          correct: false,
          feedback: "Resetting would discard the history. Correction rescales the averages for the move and keeps their raw values for later.",
        }
      - {
          id: c,
          text: "To remove the starting zero's influence on the weighted averages.",
          correct: true,
          feedback: "Real gradients initially have less than the full total weight, so we divide by their weight.",
        }
      - {
          id: d,
          text: "To force each remembered direction to equal the latest gradient.",
          correct: false,
          feedback: "Changing gradients still form a weighted history after correction.",
        }
    solution: "Starting the averages at zero makes their early values too small relative to the gradients they average. Dividing by the weight assigned to real gradients removes that starting effect."
  - id: mad-correction-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why do we divide $m_2=1.75$ by $7/16$ rather than by $2$?"
    options:
      - {
          id: a,
          text: "Two is the batch size, which applies only to squared gradients.",
          correct: false,
          feedback: "Two here counts updates, not examples; the correction uses weights, not a batch size.",
        }
      - {
          id: b,
          text: "The two real gradients carry total weight $7/16$ in the stored average.",
          correct: true,
          feedback: "Their weights are 3/16 and 1/4, leaving 9/16 on the starting zero.",
        }
      - {
          id: c,
          text: "The new gradient is $7/16$ of the previous gradient's value.",
          correct: false,
          feedback: "Both gradients are 4; 7/16 describes their total weight, not their values.",
        }
      - {
          id: d,
          text: "Every average must be divided by its current numerical value.",
          correct: false,
          feedback: "Dividing 1.75 by itself would give 1, not the corrected gradient 4.",
        }
    solution: "The starting zero retains weight $(3/4)^2=9/16$, leaving $7/16$ on real gradients. Dividing $1.75$ by that total weight gives $4$; dividing by the update count would not undo the zero start."
  - id: mad-correction-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: On update $t=2$, the stored signed average is $m_2={{= q/16 }}$. With $\beta_1=0.75$ and
      a zero initial average, what is the corrected average $\hat m_2$? Give three decimal places.
    params:
      q:
        min: -21
        max: 21
        step: 3
    constraints:
      - q != 0
    answer_expr: q/7
    tolerance:
      abs: 0.001
    solution: The correction divides by $1-0.75^2=7/16$. Thus $\hat m_2=({{= q/16 }})/(7/16)={{= q/7
      }}$ before rounding.
  - id: mad-correction-clock
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "An epoch is one pass through the training data. A run has made $20$ batch updates during $2$ epochs without resetting its averages. Which $t$ belongs in Adam's next bias correction?"
    options:
      - {
          id: a,
          text: "$t=3$, because the next epoch follows two epochs.",
          correct: false,
          feedback: "The counter counts batch updates, not epochs.",
        }
      - {
          id: b,
          text: "$t=20$, because the new gradient has not counted yet.",
          correct: false,
          feedback: "The new gradient is included in the averages being corrected, so it counts as update 21.",
        }
      - {
          id: c,
          text: "$t=1$, because each new batch restarts the averages.",
          correct: false,
          feedback: "Averages are retained across batches; a new batch is not a new run.",
        }
      - {
          id: d,
          text: "$t=21$, because the new gradient makes the twenty-first update.",
          correct: true,
          feedback: "Both correction powers use the number of updates since the averages were initialised.",
        }
    solution: "The next gradient will be included as update $21$, so use $1-\\beta_1^{21}$ and $1-\\beta_2^{21}$. Epoch boundaries do not reset the memory or its counter."
  - id: mad-correction-two-memories
    dimension: math
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "On the first update with gradient $4$, take $\\beta_1=0.5$ and $\\beta_2=0.75$. Stored averages are $m_1=2$, $v_1=4$. Which corrected pair $(\\hat m_1,\\hat v_1)$ is right?"
    options:
      - {
          id: a,
          text: "$(4,16)$, using the matching correction for each average.",
          correct: true,
          feedback: "Divide 2 by 0.5 and 4 by 0.25.",
        }
      - {
          id: b,
          text: "$(4,8)$, using the signed average's setting for both.",
          correct: false,
          feedback: "The squared average uses beta two, so its divisor is 0.25, not 0.5.",
        }
      - {
          id: c,
          text: "$(8,16)$, using the squared average's setting for both.",
          correct: false,
          feedback: "The signed average uses beta one, so its divisor is 0.5, not 0.25.",
        }
      - {
          id: d,
          text: "$(2,4)$, using the stored values without correcting.",
          correct: false,
          feedback: "Both memories started at zero, so both need the first-update correction.",
        }
    solution: "$\\hat m_1=2/(1-0.5)=4$ and $\\hat v_1=4/(1-0.75)=16$. The two chosen fractions may differ, and each correction must match the average it corrects."
  - id: mad-correction-changing
    dimension: math
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A new model's first two gradients are $4,-4$. With $\\beta_1=0.75$, its raw averages are $m_1=1$, $m_2=-0.25$. Since $1-0.75^2=7/16$, which is the corrected second average?"
    options:
      - {
          id: a,
          text: "$-4$, because correction must return the latest gradient.",
          correct: false,
          feedback: "Correction retains a weighted history, not just the latest gradient.",
        }
      - {
          id: b,
          text: "$0$, because opposite gradients always cancel equally.",
          correct: false,
          feedback: "The more recent gradient carries greater weight.",
        }
      - {
          id: c,
          text: "$-4/7$, because correction rescales the stored history.",
          correct: true,
          feedback: "Divide -1/4 by 7/16 to get -4/7.",
        }
      - {
          id: d,
          text: "$-7/64$, because correction multiplies by the real gradients' weight.",
          correct: false,
          feedback: "Multiplying by 7/16 would shrink the value further; the correction divides.",
        }
    solution: "$\\hat m_2=(-1/4)/(7/16)=-4/7$. Correction removes the zero start while retaining the unequal weights of the two real gradients."
  - id: mad-adam-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: After Adam updates and corrects its averages, which rule gives the new parameter value?
    options:
      - id: a
        text: $w_t=w_{t-1}-\eta\hat m_t/(\hat v_t+\epsilon)$
        correct: false
        feedback: The squared-gradient average needs a square root before it serves as a size estimate.
      - id: b
        text: $w_t=w_{t-1}-\eta\hat m_t/(\sqrt{\hat v_t}+\epsilon)$
        correct: true
        feedback:
          The corrected signed average supplies direction and the corrected size plus epsilon
          divides it.
      - id: c
        text: $w_t=w_{t-1}+\eta\hat m_t/(\sqrt{\hat v_t}+\epsilon)$
        correct: false
        feedback: The scaled signed direction is subtracted from the parameter.
      - id: d
        text: $w_t=w_{t-1}-\eta\hat m_t/\sqrt{\hat v_t+\epsilon}$
        correct: false
        feedback: Adam adds epsilon after taking the square root.
    solution:
      Adam subtracts the learning rate times the corrected signed average divided by corrected
      size plus epsilon. The size is $\sqrt{\hat v_t}$, with epsilon outside that square root.
  - id: mad-adam-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the full worked example, why is the denominator $5$ when $\\hat v_1=16$ and $\\epsilon=1$?"
    options:
      - {
          id: a,
          text: "We take the square root of $16+1$, then round it.",
          correct: false,
          feedback: "Epsilon is outside the square root, and this calculation requires no rounding.",
        }
      - {
          id: b,
          text: "We divide $16$ by the gradient, then omit epsilon.",
          correct: false,
          feedback: "The denominator is a square root plus epsilon, not a division by the gradient.",
        }
      - {
          id: c,
          text: "We add the two raw averages, $1+4$, as a general rule.",
          correct: false,
          feedback: "That happens to give 5 here, but raw averages are not added to form the denominator.",
        }
      - {
          id: d,
          text: "We take the square root of $16$, then add $1$.",
          correct: true,
          feedback: "The corrected size is 4, and epsilon adds 1 outside the root.",
        }
    solution: "Adam's denominator is $\\sqrt{\\hat v_1}+\\epsilon=\\sqrt{16}+1=5$. The deliberately large epsilon makes its position visible in this example."
  - id: mad-adam-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "An Adam update starts at $w={{= w }}$. Its corrected averages are $\\hat m_t={{= k*s }}$ and $\\hat v_t={{= (4*s-1)^2 }}$. With $\\eta=0.2$ and $\\epsilon=1$ for easy arithmetic, what is the new parameter?"
    params:
      w: { min: 1, max: 6 }
      k: { min: -2, max: 2 }
      s: { min: 1, max: 3 }
    constraints: ["k != 0"]
    answer_expr: "w-0.05*k"
    tolerance: { abs: 0.001 }
    solution: "The denominator is $\\sqrt{{{= (4*s-1)^2 }}}+1={{= 4*s }}$, so the scaled direction is ${{= k*s }}/{{= 4*s }}={{= k/4 }}$. Subtracting the scaled move gives ${{= w }}-0.2({{= k/4 }})={{= w-0.05*k }}$."
  - id: mad-epsilon-position
    dimension: math
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      An Adam parameter has zero signed and squared-gradient averages. How does a positive epsilon
      affect its next update?
    options:
      - id: a
        text: It keeps the denominator positive while the zero signed average gives no move.
        correct: true
        feedback: Epsilon prevents a zero denominator, and the zero numerator still produces no change.
      - id: b
        text: It replaces the zero signed average, giving a small positive direction.
        correct: false
        feedback: Epsilon is added to the denominator; it does not replace the signed average.
      - id: c
        text: It cancels the two zero averages, giving a unit direction before scaling.
        correct: false
        feedback: Zero averages do not cancel into a unit direction; epsilon leaves a positive denominator.
      - id: d
        text: It leaves the denominator at zero because it is only added when the gradient is nonzero.
        correct: false
        feedback: Epsilon is included even when both averages are zero.
    solution:
      Adam adds epsilon to the square-root size in its denominator. When both averages are zero,
      the denominator is positive and the numerator is zero, so the parameter does not move.
  - id: mad-adam-store
    lesson_only: true
    dimension: math
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "After update 1, the worked example stores $m_1=1$, $v_1=4$, while $\\hat m_1=4$, $\\hat v_1=16$. If the next fresh gradient is $0$ and $\\beta_1=\\beta_2=0.75$, what raw averages are stored after update 2?"
    options:
      - {
          id: a,
          text: "$(3,12)$, from reusing the corrected averages as memory.",
          correct: false,
          feedback: "The next averaging calculation uses raw 1 and 4, not corrected 4 and 16.",
        }
      - {
          id: b,
          text: "$(0,0)$, from clearing both memories for the new batch.",
          correct: false,
          feedback: "The histories persist; zero new gradient only lets them decay.",
        }
      - {
          id: c,
          text: "$(0.75,3)$, from retaining three quarters of each raw average.",
          correct: true,
          feedback: "The zero gradient adds nothing, so raw 1 becomes 0.75 and raw 4 becomes 3.",
        }
      - {
          id: d,
          text: "$(1,4)$, from leaving both memories unchanged at zero gradient.",
          correct: false,
          feedback: "The previous values are still multiplied by the chosen fraction.",
        }
    solution: "$m_2=0.75(1)+0.25(0)=0.75$ and $v_2=0.75(4)+0.25(0^2)=3$. Corrected averages calculate the move; raw averages carry history forward."
  - id: mad-adam-rate
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: Two Adam runs have the same current parameter, corrected averages $\hat m_t=2$ and $\hat
      v_t=9$, and $\epsilon=1$. Their learning rates are 0.4 and 0.2. What are their next parameter
      changes?
    options:
      - id: a
        text: $-0.8$ and $-0.4$, using only the corrected signed average.
        correct: false
        feedback: Adam also divides the signed average by the corrected size plus epsilon.
      - id: b
        text: $-0.2$ and $-0.1$, so halving the rate halves this move.
        correct: true
        feedback: The common denominator is square root of 9 plus 1, which is 4.
      - id: c
        text: $-0.5$ and $-0.5$, since adaptive scaling removes the learning-rate dependence.
        correct: false
        feedback: The learning rate still multiplies the whole scaled direction.
      - id: d
        text: $-0.08$ and $-0.04$, dividing by the corrected squared average plus epsilon.
        correct: false
        feedback: Take the square root of 9 before adding epsilon to form the denominator.
    solution:
      The shared scaled direction is $2/(\sqrt9+1)=0.5$. Multiplying by each learning rate and
      subtracting gives changes -0.2 and -0.1, showing that Adam retains the global rate\'s effect.
  - id: mad-explain-adam
    dimension: math
    type: explain
    role: core
    difficulty: 3
    est_minutes: 5
    prompt: "For one parameter, Adam keeps memories $m_t$ and $v_t$. Assume zero-start correction has produced $\\hat m_t$ and $\\hat v_t$. Explain what each memory tracks and give the parameter update using the corrected values."
    rubric:
      - id: memories
        criterion: Describe $m_t$ as a running average of recent signed gradients.
        weight: 1
        required: true
      - id: squared-memory
        criterion: Describe $v_t$ as a running average of recent squared gradient sizes.
        weight: 1
        required: true
      - id: move
        criterion: Update with $w_t=w_{t-1}-\eta\hat m_t/(\sqrt{\hat v_t}+\epsilon)$.
        weight: 1
        required: true
      - id: epsilon
        criterion: Explain that positive $\epsilon$ keeps the denominator above zero.
        weight: 0.25
        required: false
    exemplar: "The memory $m_t$ averages recent signed gradients, and $v_t$ averages recent squared gradient sizes. Using the corrected values, update $w_t=w_{t-1}-\\eta\\hat m_t/(\\sqrt{\\hat v_t}+\\epsilon)$, where $\\eta$ is the learning rate. Positive $\\epsilon$ keeps the denominator above zero."
    solution: "The memory $m_t$ averages recent signed gradients, and $v_t$ averages recent squared gradient sizes. Using the corrected values, update $w_t=w_{t-1}-\\eta\\hat m_t/(\\sqrt{\\hat v_t}+\\epsilon)$, where $\\eta$ is the learning rate. Positive $\\epsilon$ keeps the denominator above zero."
  - id: mad-recall-momentum-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: mad-remember-slopes
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what gradient does momentum move against, and what does a larger value of its memory setting do?"
    rubric:
      - id: direction
        criterion: "Explain that momentum moves against a running weighted average of recent signed gradients."
        weight: 1
        required: true
      - id: memory
        criterion: "Explain that a larger memory setting keeps more of the old average, so older gradients fade more slowly."
        weight: 1
        required: true
    exemplar: "Momentum moves against a weighted average of recent gradients. A larger memory setting keeps more of the previous average, so the earlier gradients have an effect for longer."
  - id: mad-recall-momentum-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: mad-remember-slopes
    difficulty: 1
    est_minutes: 0.5
    prompt: "Momentum receives a batch gradient of zero, and its previous average is positive. Its memory setting $\\beta_1$ is between zero and one, excluding both ends. What happens to the parameter with a positive learning rate?"
    options:
      - id: a
        text: "It stays where it is."
        correct: false
        feedback: "A zero current gradient would stop an update using only this batch. Momentum keeps some of the positive average."
      - id: b
        text: "It moves down."
        correct: true
        feedback: "The new average keeps part of the old positive value, so subtracting it moves the parameter down."
      - id: c
        text: "It moves up."
        correct: false
        feedback: "An upward move would need a negative average. A zero gradient leaves a fraction of the positive one."
    solution: "The new average stays positive because it retains part of its previous value. The update subtracts the learning rate times that average."
  - id: mad-recall-momentum-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: mad-remember-slopes
    difficulty: 1
    est_minutes: 0.5
    prompt: "Momentum has previous average $m_{t-1}$, current batch gradient $g_t$ and memory setting $\\beta_1$. Write the new average $m_t$. Type mprev, g and beta1 for those three inputs."
    answer: "beta1*mprev+(1-beta1)*g"
    variables: { mprev: [-6, 6], g: [-6, 6], beta1: [0, 0.99] }
    solution: "Keep $\\beta_1$ of the old average and add $1-\\beta_1$ of the new signed gradient."
  - id: mad-recall-scale-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: mad-scale-moves
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what does the squared-gradient average track for each parameter, and why do we take its square root when scaling a move?"
    rubric:
      - id: squares
        criterion: "Explain that it is a running average of that parameter's squared gradients, so opposite signs do not cancel."
        weight: 1
        required: true
      - id: root
        criterion: "Explain that its square root is on the scale of gradient size, so it can divide the signed average."
        weight: 1
        required: true
    exemplar: "Each parameter keeps an average of its recent squared gradients to track their size without cancelling opposite signs. The square root brings the average back to the size of a gradient before it is used as the divisor."
  - id: mad-recall-scale-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: mad-scale-moves
    difficulty: 1
    est_minutes: 0.5
    prompt: "Two parameters have the same positive remembered gradient, but the first has a larger squared-gradient average. Both size estimates are positive. What does dividing by their respective size estimates do?"
    options:
      - id: a
        text: "It gives the first parameter a smaller scaled value."
        correct: true
        feedback: "The first parameter divides the same signed average by a larger square root."
      - id: b
        text: "It gives the first parameter a larger scaled value."
        correct: false
        feedback: "The size estimate is a divisor. Increasing it shrinks the scaled value for the same signed average."
      - id: c
        text: "It gives the parameters equal scaled values."
        correct: false
        feedback: "A shared learning rate can still give different moves, since the size estimates are separate."
    solution: "The two numerators are the same. A larger square root in the denominator makes the first scaled value smaller."
  - id: mad-recall-scale-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: mad-scale-moves
    difficulty: 1
    est_minutes: 0.5
    prompt: "The old squared-gradient average is $v_{t-1}$, the current gradient is $g_t$ and the memory setting is $\\beta_2$. Write the new squared-gradient average $v_t$. Type vprev, g and beta2 for the inputs."
    answer: "beta2*vprev+(1-beta2)*g^2"
    variables: { vprev: [0, 16], g: [-6, 6], beta2: [0, 0.99] }
    solution: "Keep $\\beta_2$ of the old average. Add $1-\\beta_2$ of the current gradient squared."
  - id: mad-recall-correction-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: mad-correct-start
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, why can Adam's stored averages start too close to zero, and what does bias correction divide them by?"
    rubric:
      - id: zero
        criterion: "Explain that some of each early average's weight still goes to its starting zero."
        weight: 1
        required: true
      - id: divide
        criterion: "State that bias correction divides each average by the total weight on actual gradients or their squares."
        weight: 1
        required: true
    exemplar: "Some of the weight in each early average still goes to its starting zero, which pulls it toward zero. Divide each stored average by the weight that went to the real gradients or their squares."
  - id: mad-recall-correction-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: mad-correct-start
    difficulty: 1
    est_minutes: 0.5
    prompt: "Adam uses a signed memory setting strictly between zero and one, and the batch gradients have changed from one step to the next. After correcting the signed average for its zero start, what does it describe?"
    options:
      - id: a
        text: "The latest batch's gradient alone."
        correct: false
        feedback: "The correction removes the weight on the starting zero. It keeps the earlier batches' contributions."
      - id: b
        text: "The gradient of the full training dataset."
        correct: false
        feedback: "The correction uses gradients already in the running average. It does not measure the examples left out of the batches."
      - id: c
        text: "A weighted average of the gradients from the batches so far."
        correct: true
        feedback: "The correction leaves only the weights on real gradients and scales those weights to sum to one."
    solution: "Bias correction removes the starting zero's share. The weighted gradient history still contributes."
  - id: mad-recall-correction-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: mad-correct-start
    difficulty: 1
    est_minutes: 0.5
    prompt: "Adam started its signed average at zero. At update $t$, its raw average is $m_t$ and its memory setting is $\\beta_1$. Write the bias-corrected signed average $\\hat m_t$. Type m for $m_t$ and beta1 for $\\beta_1$."
    answer: "m/(1-beta1^t)"
    variables: { m: [-5, 5], beta1: [0, 0.99], t: [1, 12] }
    solution: "After $t$ updates the starting zero has weight $\\beta_1^t$. Divide the raw average by the remaining weight, $1-\\beta_1^t$."
  - id: mad-recall-adam-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: mad-combine-update
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, which averages does Adam use to move a parameter now, and which averages does it keep for the next batch?"
    rubric:
      - id: use
        criterion: "State that Adam uses both bias-corrected averages for the current move."
        weight: 1
        required: true
      - id: keep
        criterion: "State that it keeps both raw averages to update with the next batch gradient."
        weight: 1
        required: true
    exemplar: "Adam uses the corrected signed and squared averages to calculate the move. It keeps the two raw averages as the starting point for the next batch's averaging calculation."
  - id: mad-recall-adam-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: mad-combine-update
    difficulty: 1
    est_minutes: 0.5
    prompt: "In Adam, what keeps the divisor in the final move positive even when the corrected squared-gradient average is zero?"
    options:
      - id: a
        text: "The learning rate $\\eta$."
        correct: false
        feedback: "The learning rate scales the move outside the division. It cannot change the divisor."
      - id: b
        text: "The added constant $\\epsilon$."
        correct: true
        feedback: "Epsilon is positive and is added to the square root of the corrected squared-gradient average."
      - id: c
        text: "The signed average $\\hat m_t$."
        correct: false
        feedback: "The corrected signed average is the numerator and can have either sign."
    solution: "The divisor is $\\sqrt{\\hat v_t}+\\epsilon$, which stays positive because $\\epsilon$ is positive."
  - id: mad-recall-adam-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: mad-combine-update
    difficulty: 2
    est_minutes: 0.5
    prompt: "In Adam, the old parameter is $w_{t-1}$, and the corrected averages are $\\hat m_t$ and $\\hat v_t$. Write the new parameter $w_t$ using w for the old parameter, m and v for the corrected averages, eta for the learning rate and eps for $\\epsilon$. Type sqrt(...) for square roots."
    answer: "w-eta*m/(sqrt(v)+eps)"
    variables: { w: [-4, 5], m: [-6, 6], v: [0, 16], eta: [0.001, 0.5], eps: [0.000001, 0.1] }
    solution: "Divide the corrected signed average by $\\sqrt{\\hat v_t}+\\epsilon$, scale by $\\eta$ and subtract from the old parameter."
