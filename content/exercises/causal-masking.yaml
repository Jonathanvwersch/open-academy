  - id: cm-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: Explain to a friend why a language model trained on whole sentences needs a causal mask in its attention, how the mask is built and applied to the scores, and what it guarantees about each position's output.
    rubric:
      - id: r1
        criterion: Explain that without a mask each position could attend to the next token and copy the answer it must predict.
        weight: 2
        required: true
      - id: r2
        criterion: Describe a $T\times T$ mask with $0$ where $j\le t$ and $-\infty$ where $j>t$, added to the scores before softmax.
        weight: 2
        required: true
      - id: r3
        criterion: Explain that output $o_t$ depends only on tokens $1$ to $t$, so each position predicts without seeing its answer.
        weight: 1
        required: true
    exemplar: A language model learns to predict each next token, and in training the whole sentence goes in at once. With plain attention, position $t$ could attend to token $x_{t+1}$ and copy it. The causal mask is a $T\times T$ grid with 0 on and below the diagonal and $-\infty$ above it. Adding it to the scores before the softmax gives every later position $e^{-\infty}=0$ weight, while the allowed weights still add up to 1. So each output $o_t$ mixes only $v_1$ to $v_t$ and depends only on the first $t$ tokens, which means every prediction in one pass is made without seeing its answer.
