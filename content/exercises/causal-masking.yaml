  - id: cm-code-debug
    dimension: implementation
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: 'A programmer starts with a $T\times T$ grid of finite scores with $T\ge2$. They build the blocked cells with `np.triu(np.ones((T, T)), k=0) == 1`, put $-\infty$ in them, raise $e$ to each score and divide each row by its sum. Assume the finite scores give positive, finite exponentials. NumPy prints `nan` for $0/0$. Which row consists entirely of `nan`, and why?'
    options:
      - id: a
        text: The first row, because it has no allowed cells and its sum is zero.
        correct: true
        feedback: With `k=0` the diagonal is blocked too, so row 1 has only $-\infty$ and the division is $0/0$.
      - id: b
        text: Every row, because each blocked cell has a zero exponential.
        correct: false
        category: implementation_error
        feedback: A blocked cell has a zero exponential, but a row with allowed scores has a positive sum.
      - id: c
        text: The last row, because the blocked triangle fills that row.
        correct: false
        category: implementation_error
        feedback: The blocked triangle starts at the top row. The last row can still read the earlier tokens.
      - id: d
        text: No row, because each token still has its own score on the diagonal.
        correct: false
        category: implementation_error
        feedback: "With `k=0` the diagonal is part of the blocked triangle. The first row has no allowed score left."
    solution: '`k=0` includes the diagonal, so the first row contains only $-\infty$. Its exponentials and their sum are all 0, so each division gives `nan`. Each later row has an allowed score to its left and hence a positive sum.'
  - id: cm-code-shifted-targets
