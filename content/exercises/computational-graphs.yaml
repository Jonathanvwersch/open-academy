concept: computational-graphs
exercises:
  - id: cg-drawing-graphs-basics
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "What does a computational graph show?"
    options:
      - id: a
        text: "The values and operations used in a calculation."
        correct: true
        feedback: "Nodes and arrows make dependencies explicit."
      - id: b
        text: "The input nudges tried during a training run."
        correct: false
        feedback: "A graph describes one calculation, not a training history."
      - id: c
        text: "The output values plotted against each input."
        correct: false
        feedback: "A plot shows values but not the operations producing them."
      - id: d
        text: "The derivative values sorted by their sizes."
        correct: false
        feedback: "A graph records dependencies, not a ranking of slopes."
    solution: "A computational graph connects inputs and simple operations with arrows showing which values each operation uses."
  - id: cgp-why-order
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example $L=(w\\cdot x-t)^2$, why compute $p$ before $e$?"
    options:
      - id: a
        text: "Because multiplication always precedes every subtraction."
        correct: false
        feedback: "Order follows dependencies, not a universal order of operation types."
      - id: b
        text: "Because the subtraction needs the value produced at $p$."
        correct: true
        feedback: "The arrow from p to e means e needs p's value."
      - id: c
        text: "Because the target changes whenever $p$ changes."
        correct: false
        feedback: "The target t is held fixed in this calculation."
      - id: d
        text: "Because computing $p$ first avoids needing the target."
        correct: false
        feedback: "Computing e still needs both p and t."
    solution: "The subtraction is $e=p-t$, so its input $p$ must be available first."
  - id: cgp-arrow-meaning
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "What does an arrow from $q$ to a multiplication node mean?"
    options:
      - id: a
        text: "The multiplication produces the earlier value $q$."
        correct: false
        feedback: "Arrows point from a value to an operation using it."
      - id: b
        text: "The multiplication uses $q$ as one of its inputs."
        correct: true
        feedback: "The arrow records that dependency."
      - id: c
        text: "The multiplication has the same numerical value as $q$."
        correct: false
        feedback: "A dependency does not mean equal values."
      - id: d
        text: "The multiplication can be computed before finding $q$."
        correct: false
        feedback: "The operation must wait for q's value."
    solution: "An arrow points from a value to an operation that uses it, so the multiplication depends on $q$."
  - id: cgp-node-count
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "How many operation nodes does $(x+y)^2$ need when squaring is one operation?"
    options:
      - id: a
        text: "One: square the inputs together."
        correct: false
        feedback: "The addition and square are distinct operations."
      - id: b
        text: "Two: add first, then square."
        correct: true
        feedback: "The addition produces the square's input."
      - id: c
        text: "Three: add, then square twice."
        correct: false
        feedback: "There is only one square in the expression."
      - id: d
        text: "Four: copy both inputs first."
        correct: false
        feedback: "Input nodes are not operation nodes, and no copies are needed."
    solution: "There is one addition node followed by one square node, giving two operation nodes."
  - id: cgp-forward-template
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "A graph computes $q=x+y$, then $f=q\\cdot z$. With $x={{x}}$, $y={{y}}$, $z={{z}}$, what is $f$?"
    params:
      { "x": { "min": 1, "max": 4 }, "y": { "min": 1, "max": 4 }, "z": { "min": 2, "max": 5 } }
    answer_expr: "(x+y)*z"
    tolerance: { abs: 0.001 }
    solution: "Add the first two inputs before multiplying: $q={{= x+y}}$, so $f={{= (x+y)*z}}$."
  - id: cgp-shared-input
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "For $(r+s)\\cdot(s+t)$, how should the graph represent $s$?"
    options:
      - id: a
        text: "One input node feeding both addition nodes."
        correct: true
        feedback: "One value can feed more than one operation."
      - id: b
        text: "Two input nodes, each with an unrelated value."
        correct: false
        feedback: "Copies would hide that the same input is reused."
      - id: c
        text: "One input node feeding only the final multiply."
        correct: false
        feedback: "The additions, not the final multiply, directly use s."
      - id: d
        text: "Two input nodes connected in a circular path."
        correct: false
        feedback: "A computational graph has no loops."
    solution: "The same input $s$ is used by both sums, so one node has two outgoing arrows."
  - id: cgp-robot-forward
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A robot's movement calculation uses a setting $w={{w}}$, a sensor input $x={{x}}$ and target $t={{t}}$. It computes $p=w\\cdot x$, $e=p-t$, then cost $C=e^2$. What is $C$?"
    params:
      { "w": { "min": 2, "max": 4 }, "x": { "min": 2, "max": 4 }, "t": { "min": 1, "max": 3 } }
    answer_expr: "(w*x-t)^2"
    tolerance: { abs: 0.001 }
    solution: "Follow the dependencies: $p={{= w*x}}$, then $e={{= w*x-t}}$, and finally $C={{= (w*x-t)^2}}$."
  - id: cg-local-derivatives-basics
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "What does a local derivative measure?"
    options:
      - id: a
        text: "The final output rate for every graph input together."
        correct: false
        feedback: "That is not a derivative for one operation and input."
      - id: b
        text: "One operation's output rate for one of its inputs."
        correct: true
        feedback: "Other inputs to that operation are held fixed."
      - id: c
        text: "One operation's output value at the current inputs."
        correct: false
        feedback: "A value is not a rate of change."
      - id: d
        text: "The number of later operations using an input value."
        correct: false
        feedback: "Counting dependencies does not measure a rate."
    solution: "A local derivative concerns one operation's output and one of its own inputs, holding its other inputs fixed."
  - id: cgp-why-store-values
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "Why does the worked example use the forward value $e=1$ when differentiating $L=e^2$?"
    options:
      - id: a
        text: "Because the square's local rate is its output $L$."
        correct: false
        feedback: "The output is e squared, not the derivative."
      - id: b
        text: "Because the square's local rate is its input $e$."
        correct: false
        feedback: "The power rule gives 2e, not e."
      - id: c
        text: "Because the square's local rate is twice its input $e$."
        correct: true
        feedback: "The square rule needs the current input value."
      - id: d
        text: "Because the square's local rate is always the number 2."
        correct: false
        feedback: "The factor 2 still multiplies the current input."
    solution: "The rule is $\\partial L/\\partial e=2e$, so the forward value $e=1$ gives local rate 2."
  - id: cgp-add-local
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "For $q=x+y$, what is $\\partial q/\\partial y$ with $x$ held fixed?"
    options:
      - id: a
        text: "It is $0$, since $x$ stays fixed."
        correct: false
        feedback: "Holding x fixed does not prevent y changing q."
      - id: b
        text: "It is $1$, since $y$ enters once."
        correct: true
        feedback: "A unit increase in y increases q by one."
      - id: c
        text: "It is $x$, the other input value."
        correct: false
        feedback: "Using the other input is the multiplication rule."
      - id: d
        text: "It is $q$, the current output value."
        correct: false
        feedback: "The output value is not the addition's rate."
    solution: "Increasing $y$ by a small amount increases $q$ by the same amount, so the local derivative is 1."
  - id: cgp-multiply-template
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "At a multiply node $p=w\\cdot x$, $w={{w}}$ and $x={{x}}$. What is the local derivative $\\partial p/\\partial w$?"
    params: { "w": { "min": 2, "max": 4 }, "x": { "min": 5, "max": 8 } }
    answer_expr: "x"
    tolerance: { abs: 0.001 }
    solution: "Hold $x$ fixed: the derivative of $w\\cdot x$ with respect to $w$ is the other input, $x={{x}}$."
  - id: cgp-local-not-total
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "For $q=x+y$, $f=q\\cdot z$ at $x=1$, $y=2$, $z=4$, what does $\\partial q/\\partial x=1$ describe?"
    options:
      - id: a
        text: "How $q$ responds when only $x$ changes."
        correct: true
        feedback: "Its numerator names q and its denominator names x."
      - id: b
        text: "How $f$ responds when only $x$ changes."
        correct: false
        feedback: "The rate for f also depends on the later multiplication."
      - id: c
        text: "How $q$ responds when only $z$ changes."
        correct: false
        feedback: "q does not use z."
      - id: d
        text: "How $f$ responds when only $z$ changes."
        correct: false
        feedback: "The local derivative for f with respect to z is q."
    solution: "The local derivative names $q$, not $f$, as its output; it measures how the addition responds to $x$."
  - id: cgp-square-template
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A new graph computes $s=u^2$, then $v=s+5$. At $u={{u}}$, what is the local derivative $\\partial s/\\partial u$ of the square node alone?"
    params: { "u": { "min": -4, "max": -1 } }
    answer_expr: "2*u"
    tolerance: { abs: 0.001 }
    solution: "The square rule gives $\\partial s/\\partial u=2u={{= 2*u}}$; the later addition is not part of this local derivative."
  - id: cgp-robot-subtract
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A robot computes error $e=p-t$, where $p$ is position and $t$ is the target. What is the local rate $\\partial e/\\partial t$?"
    options:
      - id: a
        text: "It is $1$: raising the target raises the error."
        correct: false
        feedback: "The target is subtracted, so its effect is negative."
      - id: b
        text: "It is $-1$: raising the target lowers the error."
        correct: true
        feedback: "With position fixed, one extra target unit removes one error unit."
      - id: c
        text: "It is $p$: the rate equals the other input."
        correct: false
        feedback: "Using the other input is the multiplication rule."
      - id: d
        text: "It is $e$: the rate equals the present error."
        correct: false
        feedback: "The subtraction's rate does not depend on the error value."
    solution: "With $p$ fixed, increasing the subtracted target decreases $e$ by the same amount, giving rate $-1$."
  - id: cg-chaining-paths-basics
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "How do local derivatives give the output's derivative for an earlier input?"
    options:
      - id: a
        text: "Add along each path, then multiply the paths."
        correct: false
        feedback: "Successive rates multiply; separate routes add."
      - id: b
        text: "Multiply along each path, then add the paths."
        correct: true
        feedback: "This is the chain rule applied to every route."
      - id: c
        text: "Multiply along one path, then discard the others."
        correct: false
        feedback: "Every route from the input can contribute."
      - id: d
        text: "Add the forward values, then divide by the input."
        correct: false
        feedback: "Values are not rates of change."
    solution: "Multiply local rates along every path from the input to the output, then add those path products."
  - id: cgp-why-multiply-path
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why is $\\partial L/\\partial w=2\\cdot1\\cdot3$?"
    options:
      - id: a
        text: "Each factor gives one node's output change per unit input change."
        correct: true
        feedback: "The derivative for each node links its input change to its output change."
      - id: b
        text: "Each operation receives the original weight change independently."
        correct: false
        feedback: "That would describe separate routes, not successive steps."
      - id: c
        text: "Each operation contributes its forward value rather than its rate."
        correct: false
        feedback: "Forward values give p, e and L, not the required rates."
      - id: d
        text: "Each operation's rate replaces the earlier rate instead of combining."
        correct: false
        feedback: "The later operation receives the change already produced earlier."
    solution: "The weight changes $p$ at rate 3, $p$ changes $e$ at rate 1, and $e$ changes $L$ at rate 2, so the chain's rates multiply."
  - id: cgp-path-product
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "A single path has local rates 2, 4 and 3. What is its contribution to the output derivative?"
    options:
      - id: a
        text: "$24$, from multiplying all three rates."
        correct: true
        feedback: "Successive rates multiply to 24."
      - id: b
        text: "$9$, from adding all three rates."
        correct: false
        feedback: "Adding rates is for separate routes, not successive steps."
      - id: c
        text: "$3$, from keeping only the final rate."
        correct: false
        feedback: "The earlier rates also scale the nudge."
      - id: d
        text: "$2$, from keeping only the first rate."
        correct: false
        feedback: "The later rates also scale the nudge."
    solution: "A path contribution is $2\\cdot4\\cdot3=24$: each local derivative gives a node's output change per unit change in its input, and the chain rule multiplies them."
  - id: cgp-chain-template
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "A graph computes $p=w\\cdot x$, $e=p-t$, then $L=e^2$. At $w={{w}}$, $x={{x}}$, $t={{t}}$, what is $\\partial L/\\partial w$?"
    params:
      { "w": { "min": 2, "max": 4 }, "x": { "min": 2, "max": 4 }, "t": { "min": 1, "max": 3 } }
    answer_expr: "2*(w*x-t)*x"
    tolerance: { abs: 0.001 }
    solution: "The path rates are $2e$, 1 and $x$, giving $2(w x-t)x={{= 2*(w*x-t)*x}}$."
  - id: cgp-one-path-only
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "For $g=(x+y)\\cdot(y+z)$ at $(1,2,4)$, a learner follows only the route through $a=x+y$ and gets 6 for $\\partial g/\\partial y$. What is missing?"
    options:
      - id: a
        text: "Add 3 from the route through $b=y+z$."
        correct: true
        feedback: "The second route contributes 3, so the total is 9."
      - id: b
        text: "Multiply by 3 from the route through $b=y+z$."
        correct: false
        feedback: "Multiplication is for rates along one route, not separate routes."
      - id: c
        text: "Subtract 3 from the route through $b=y+z$."
        correct: false
        feedback: "Both route contributions are positive here."
      - id: d
        text: "Replace 6 with 3 from the route through $b=y+z$."
        correct: false
        feedback: "Both routes matter; neither replaces the other."
    solution: "The $b$ route contributes $3\\cdot1=3$ in addition to the $a$ route's 6, giving 9."
  - id: cgp-shared-template
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A new graph computes $a=r+s$, $b=s+t$, then $h=a\\cdot b$. At $r={{r}}$, $s={{s}}$, $t={{t}}$, what is $\\partial h/\\partial s$?"
    params:
      { "r": { "min": 1, "max": 3 }, "s": { "min": 1, "max": 3 }, "t": { "min": 4, "max": 6 } }
    answer_expr: "(s+t)+(r+s)"
    tolerance: { abs: 0.001 }
    solution: "The route through $a$ contributes $b$, and the route through $b$ contributes $a$; add them to get ${{= (s+t)+(r+s)}}$."
  - id: cgp-robot-error
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A robot's position is $p=k\\cdot u$, with setting $k={{k}}$ and command $u={{u}}$. It computes error $e=p-t$ for target $t={{t}}$, then cost $C=e^2$. What is $\\partial C/\\partial u$?"
    params:
      { "k": { "min": 2, "max": 4 }, "u": { "min": 2, "max": 4 }, "t": { "min": 1, "max": 3 } }
    answer_expr: "2*(k*u-t)*k"
    tolerance: { abs: 0.001 }
    solution: "Trace the command's path: the local rates are $k$, 1 and $2e$, so $\\partial C/\\partial u=2(k u-t)k={{= 2*(k*u-t)*k}}$."
  - id: cg-check-1
    dimension: "math"
    type: "numeric"
    role: "check"
    difficulty: 1
    est_minutes: 2
    prompt: "A robot calculates a movement command by adding a position error $x = -2$ to a correction $y = 5$, then multiplying by a setting $z = -4$. Its graph is $q = x + y$, then $f = q \\cdot z$. How much does the command change per unit change in $z$, that is, what is $\\partial f/\\partial z$?"
    answer: 3
    tolerance: { "abs": 0.001 }
    common_wrong:
      [
        {
          "answer": -4,
          "category": "misunderstood_definition",
          "feedback": "For a multiply node, the derivative with respect to one input is the *other* input's value, here $q = 3$.",
        },
      ]
    solution: "The multiply node's derivative with respect to $z$ is its other input, $q=x+y=-2+5=3$."
  - id: cg-mul-add
    dimension: "math"
    type: "numeric"
    role: "core"
    difficulty: 2
    est_minutes: 3
    prompt: "A robot cart uses command $b = -3$ in two movement calculations. They give distances $a \\cdot b$ and $c \\cdot b$ centimetres, with $a = 2$ and $c = 4$. Its total movement is $f = a \\cdot b + c \\cdot b$. How much does the total change per unit change in $b$, that is, what is $\\partial f/\\partial b$?"
    answer: 6
    tolerance: { "abs": 0.001 }
    common_wrong:
      [
        {
          "answer": 2,
          "category": "incomplete_explanation",
          "feedback": "$b$ feeds two nodes, so its derivative is the sum of both path contributions: $a+c$.",
        },
      ]
    hints: ["$b$ appears in two multiply nodes, so add both contributions."]
    solution: "The two paths contribute $a=2$ and $c=4$, so their sum is $\\partial f/\\partial b=6$."
  - id: cg-relu-node
    dimension: "math"
    type: "numeric"
    role: "review"
    difficulty: 2
    est_minutes: 2
    prompt: "A robot computes position $p=w\\cdot x$, error $e=p-t$, then cost $C=e^2$. At $w=-1$, $x=3$, $t=-3$, what is $\\partial C/\\partial w$?"
    answer: 0
    tolerance: { "abs": 0.001 }
    common_wrong:
      [
        {
          "answer": 3,
          "category": "incomplete_explanation",
          "feedback": "That is only the multiply node's local rate; the square contributes 2e=0.",
        },
      ]
    solution: "Here $p=-3$ and $e=0$, so the path product is $2e\\cdot1\\cdot x=0$."
  - id: cg-explain
    dimension: "conceptual"
    type: "explain"
    role: "core"
    difficulty: 3
    est_minutes: 4
    prompt: "How does a computational graph turn a big output derivative into small steps? Explain how you draw and evaluate the graph, find local derivatives, and combine all the paths from an input to the output."
    rubric:
      - {
          "id": "graph",
          "criterion": "Describes one node per input and simple operation, arrows for dependencies, and a forward pass to compute values.",
          "weight": 1,
          "required": true,
        }
      - {
          "id": "local",
          "criterion": "Defines local derivatives for one operation and one input with other inputs fixed, using forward values when needed.",
          "weight": 1,
          "required": true,
        }
      - {
          "id": "paths",
          "criterion": "Multiplies local derivatives along each path and adds all path contributions for an input's output derivative.",
          "weight": 2,
          "required": true,
        }
    exemplar: "I draw one node per input and simple operation, joining each value to every operation that uses it. I compute the nodes in arrow order to get their forward values. For each operation, I find the derivative of its output with respect to each of its inputs while holding the others fixed; these local rules may use the forward values. I then trace every path from the chosen input to the final output, multiply the local derivatives along each path, and add the path products. That gives the output's derivative without differentiating the whole formula at once."
    solution: "The graph exposes the dependencies, local rules supply each small rate, and the chain rule combines every path product into the full output derivative."
