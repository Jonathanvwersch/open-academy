concept: computational-graphs
exercises:
  - id: cg-drawing-graphs-basics
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "What does a computational graph show?"
    options:
      - id: a
        text: "Each simple operation, and which values it uses."
        correct: true
        feedback: "Nodes and arrows make dependencies explicit."
      - id: b
        text: "How the output changes as one input changes."
        correct: false
        feedback: "That's a plot of the function. A graph shows the operations that compute the output and which values each one uses."
      - id: c
        text: "The inputs and the output, joined by one arrow."
        correct: false
        feedback: "A computational graph splits the calculation into small operations, each with its own node, between the inputs and the output."
      - id: d
        text: "The lines of code, in the order they were written."
        correct: false
        feedback: "A graph records which operation uses which value. Two lines of code can be in either order if neither uses the other's result."
    solution: "A computational graph connects inputs and simple operations with arrows showing which values each operation uses."
  - id: cgp-why-order
    lesson_only: true
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example $L=(w\\cdot x-t)^2$, why compute $p$ before $e$?"
    options:
      - id: a
        text: "Because multiplication always precedes every subtraction."
        correct: false
        feedback: "Order follows dependencies, not a universal order of operation types."
      - id: b
        text: "Because the subtraction needs the value produced at $p$."
        correct: true
        feedback: "The arrow from p to e means e needs p's value."
      - id: c
        text: "Because the target changes whenever $p$ changes."
        correct: false
        feedback: "The target t is held fixed in this calculation."
      - id: d
        text: "Because computing $p$ first avoids needing the target."
        correct: false
        feedback: "Computing e still needs both p and t."
    solution: "The subtraction is $e=p-t$, so its input $p$ must be available first."
  - id: cgp-arrow-meaning
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "What does an arrow from $q$ to a multiplication node mean?"
    options:
      - id: a
        text: "The multiplication produces the earlier value $q$."
        correct: false
        feedback: "Arrows point from a value to an operation using it."
      - id: b
        text: "The multiplication uses $q$ as one of its inputs."
        correct: true
        feedback: "The arrow records that dependency."
      - id: c
        text: "The multiplication has the same numerical value as $q$."
        correct: false
        feedback: "A dependency does not mean equal values."
      - id: d
        text: "The multiplication can be computed before finding $q$."
        correct: false
        feedback: "The operation must wait for q's value."
    solution: "An arrow points from a value to an operation that uses it, so the multiplication depends on $q$."
  - id: cgp-node-count
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "How many operation nodes does $(x+y)^2$ need when squaring is one operation?"
    options:
      - id: a
        text: "One: apply squaring to the inputs together."
        correct: false
        feedback: "Addition and squaring are distinct operations."
      - id: b
        text: "Two: add first, then apply squaring."
        correct: true
        feedback: "The addition produces the squaring operation's input."
      - id: c
        text: "Three: add, then apply squaring twice."
        correct: false
        feedback: "There is only one squaring operation in the expression."
      - id: d
        text: "Four: copy both inputs first."
        correct: false
        feedback: "Input nodes are not operation nodes, and no copies are needed."
    solution: "There is one addition node followed by one squaring node, giving two operation nodes."
  - id: cgp-forward-template
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "A graph computes $q=x+y$, then $f=q\\cdot z$. With $x={{= x}}$, $y={{= y}}$, $z={{= z}}$, what is $f$?"
    params:
      { "x": { "min": 1, "max": 4 }, "y": { "min": 1, "max": 4 }, "z": { "min": 2, "max": 5 } }
    answer_expr: "(x+y)*z"
    tolerance: { abs: 0.001 }
    solution: "Add the first two inputs before multiplying: $q={{= x+y}}$, so $f={{= (x+y)*z}}$."
  - id: cgp-shared-input
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "For $(r+s)\\cdot(s+t)$, how should the graph represent $s$?"
    options:
      - id: a
        text: "One input node feeding both addition nodes."
        correct: true
        feedback: "One value can feed more than one operation."
      - id: b
        text: "Two input nodes, each with an unrelated value."
        correct: false
        feedback: "Copies would hide that the same input is reused."
      - id: c
        text: "One input node feeding only the final multiply."
        correct: false
        feedback: "The additions, not the final multiply, directly use s."
      - id: d
        text: "Two input nodes connected in a circular path."
        correct: false
        feedback: "A computational graph has no loops."
    solution: "The same input $s$ is used by both sums, so one node has two outgoing arrows."
  - id: cgp-robot-forward
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A robot's movement calculation uses a setting $w={{= w}}$, a sensor input $x={{= x}}$ and target $t={{= t}}$. It computes $p=w\\cdot x$, $e=p-t$, then cost $C=e^2$. What is $C$?"
    params:
      { "w": { "min": 2, "max": 4 }, "x": { "min": 2, "max": 4 }, "t": { "min": 1, "max": 3 } }
    answer_expr: "(w*x-t)^2"
    tolerance: { abs: 0.001 }
    solution: "Follow the dependencies: $p={{= w*x}}$, then $e={{= w*x-t}}$, and finally $C={{= (w*x-t)^2}}$."
  - id: cg-local-derivatives-basics
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "What does a local derivative measure?"
    options:
      - id: a
        text: "The final output's derivative for every graph input together."
        correct: false
        feedback: "That is not a derivative for one operation and input."
      - id: b
        text: "One operation's output derivative for one of its inputs."
        correct: true
        feedback: "Other inputs to that operation are held fixed."
      - id: c
        text: "One operation's output value at the current inputs."
        correct: false
        feedback: "A value is not a derivative."
      - id: d
        text: "The number of later operations using an input value."
        correct: false
        feedback: "Counting dependencies does not give a derivative."
    solution: "A local derivative concerns one operation's output and one of its own inputs, holding its other inputs fixed."
  - id: cgp-why-store-values
    lesson_only: true
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "Why does the worked example use the forward value $e=1$ when differentiating $L=e^2$?"
    options:
      - id: a
        text: "Because squaring's local derivative is its output $L$."
        correct: false
        feedback: "The output is e squared, not the derivative."
      - id: b
        text: "Because squaring's local derivative is its input $e$."
        correct: false
        feedback: "The power rule gives 2e, not e."
      - id: c
        text: "Because squaring's local derivative is twice its input $e$."
        correct: true
        feedback: "The squaring rule needs the current input value."
      - id: d
        text: "Because squaring's local derivative is always the number 2."
        correct: false
        feedback: "The factor 2 still multiplies the current input."
    solution: "The rule is $\\partial L/\\partial e=2e$, so the forward value $e=1$ gives local derivative 2."
  - id: cgp-add-local
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "For $q=x+y$, what is $\\partial q/\\partial y$ with $x$ held fixed?"
    options:
      - id: a
        text: "It is $0$, since $x$ stays fixed."
        correct: false
        feedback: "Holding x fixed does not prevent y changing q."
      - id: b
        text: "It is $1$, since $y$ enters once."
        correct: true
        feedback: "A unit increase in y increases q by one."
      - id: c
        text: "It is $x$, the other input value."
        correct: false
        feedback: "Using the other input is the multiplication rule."
      - id: d
        text: "It is $q$, the current output value."
        correct: false
        feedback: "The output value is not the addition's local derivative."
    solution: "Increasing $y$ by a small amount increases $q$ by the same amount, so the local derivative is 1."
  - id: cgp-multiply-template
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "A multiply node computes $p=w\\cdot x$. At $w={{= w}}$ it outputs $p={{= w*x}}$. What is the local derivative $\\partial p/\\partial w$?"
    params: { "w": { "min": 2, "max": 4 }, "x": { "min": 5, "max": 8 } }
    answer_expr: "x"
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "w",
          category: misunderstood_definition,
          feedback: "Holding $x$ fixed, each unit of $w$ adds $x$ to $p$. The local derivative is the other input, $x$.",
        }
      - {
          answer_expr: "w*x",
          category: misunderstood_definition,
          feedback: "That's the node's output. The local derivative is how much $p$ changes per unit change in $w$.",
        }
    solution: "Hold $x$ fixed: the derivative of $w\\cdot x$ with respect to $w$ is the other input, $x$. Since $p={{= w*x}}$ and $w={{= w}}$, $x={{= w*x}}/{{= w}}={{= x}}$."
  - id: cgp-local-not-total
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "For $q=x+y$, $f=q\\cdot z$ at $x=1$, $y=2$, $z=4$, what does $\\partial q/\\partial x=1$ describe?"
    options:
      - id: a
        text: "How $q$ responds when only $x$ changes."
        correct: true
        feedback: "Its numerator names q and its denominator names x."
      - id: b
        text: "How $f$ responds when only $x$ changes."
        correct: false
        feedback: "The derivative for f also depends on the later multiplication."
      - id: c
        text: "How $q$ responds when only $z$ changes."
        correct: false
        feedback: "q does not use z."
      - id: d
        text: "How $f$ responds when only $z$ changes."
        correct: false
        feedback: "The local derivative for f with respect to z is q."
    solution: "The local derivative names $q$, not $f$, as its output; it measures how the addition responds to $x$."
  - id: cgp-square-template
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A new graph computes $s=u^2$, then $v=s+5$. At $u={{= u}}$, what is the local derivative $\\partial s/\\partial u$ of the squaring node alone?"
    params: { "u": { "min": -4, "max": -1 } }
    answer_expr: "2*u"
    tolerance: { abs: 0.001 }
    solution: "The squaring rule gives $\\partial s/\\partial u=2u={{= 2*u}}$; the later addition is not part of this local derivative."
  - id: cgp-robot-subtract
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A robot computes error $e=p-t$, where $p$ is position and $t$ is the target. What is the local derivative $\\partial e/\\partial t$?"
    options:
      - id: a
        text: "It is $1$: raising the target raises the error."
        correct: false
        feedback: "The target is subtracted, so its effect is negative."
      - id: b
        text: "It is $-1$: raising the target lowers the error."
        correct: true
        feedback: "With position fixed, one extra target unit removes one error unit."
      - id: c
        text: "It is $p$: the derivative equals the other input."
        correct: false
        feedback: "Using the other input is the multiplication rule."
      - id: d
        text: "It is $e$: the derivative equals the present error."
        correct: false
        feedback: "The subtraction's local derivative does not depend on the error value."
    solution: "With $p$ fixed, increasing the subtracted target decreases $e$ by the same amount, giving local derivative $-1$."
  - id: cg-chaining-paths-basics
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "How do local derivatives give the output's derivative for an earlier input?"
    options:
      - id: a
        text: "Add along each path, then multiply the paths."
        correct: false
        feedback: "Local derivatives along a path multiply; separate path products add."
      - id: b
        text: "Multiply along each path, then add the paths."
        correct: true
        feedback: "This is the chain rule applied to every route."
      - id: c
        text: "Multiply along one path, then discard the others."
        correct: false
        feedback: "Every route from the input can contribute."
      - id: d
        text: "Add the forward values, then divide by the input."
        correct: false
        feedback: "Forward values are not derivatives."
    solution: "Multiply local derivatives along every path from the input to the output, then add those path products."
  - id: cgp-why-multiply-path
    lesson_only: true
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why is $\\partial L/\\partial w=2\\cdot1\\cdot3$?"
    options:
      - id: a
        text: "Each factor gives one node's output change per unit input change."
        correct: true
        feedback: "The derivative for each node links its input change to its output change."
      - id: b
        text: "Each factor is a separate path contribution, so they should add."
        correct: false
        feedback: "These factors belong to one path through e and p, not separate paths."
      - id: c
        text: "Each factor is a forward value, so their product gives the loss."
        correct: false
        feedback: "The factors are local derivatives, not the forward values p, e and L."
      - id: d
        text: "Each factor can give the loss derivative alone, so only one is needed."
        correct: false
        feedback: "One local derivative describes only one node; the loss derivative needs every factor on the path."
    solution: "The local derivatives are $\\partial L/\\partial e=2$, $\\partial e/\\partial p=1$ and $\\partial p/\\partial w=3$; multiplying them gives the loss derivative 6."
  - id: cgp-path-product
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "A single path has local derivatives 2, 4 and 3. What is its contribution to the output derivative?"
    options:
      - id: a
        text: "$24$, from multiplying all three derivatives."
        correct: true
        feedback: "The three local derivatives multiply to 24."
      - id: b
        text: "$9$, from adding all three derivatives."
        correct: false
        feedback: "Add separate path products, not local derivatives along one path."
      - id: c
        text: "$3$, from keeping only the final derivative."
        correct: false
        feedback: "The other local derivatives on the path also contribute."
      - id: d
        text: "$2$, from keeping only the first derivative."
        correct: false
        feedback: "The other local derivatives on the path also contribute."
    solution: "A path contribution is $2\\cdot4\\cdot3=24$: each local derivative gives a node's output change per unit change in its input, and the chain rule multiplies them."
  - id: cgp-chain-template
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "A graph computes $p=w\\cdot x$, $e=p-t$, then $L=e^2$. At $w={{= w}}$, $x={{= x}}$, $t={{= t}}$, what is $\\partial L/\\partial w$?"
    params:
      { "w": { "min": 2, "max": 4 }, "x": { "min": 2, "max": 4 }, "t": { "min": 1, "max": 3 } }
    answer_expr: "2*(w*x-t)*x"
    tolerance: { abs: 0.001 }
    solution: "The path's local derivatives are $2e$, 1 and $x$, giving $2(w x-t)x={{= 2*(w*x-t)*x}}$."
  - id: cgp-one-path-only
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "For $g=(x+y)\\cdot(y+z)$ at $(1,2,4)$, a learner follows only the route through $a=x+y$ and gets 6 for $\\partial g/\\partial y$. What is missing?"
    options:
      - id: a
        text: "Add 3 from the route through $b=y+z$."
        correct: true
        feedback: "The second route contributes 3, so the total is 9."
      - id: b
        text: "Multiply by 3 from the route through $b=y+z$."
        correct: false
        feedback: "Multiply local derivatives along one route, not separate route contributions."
      - id: c
        text: "Subtract 3 from the route through $b=y+z$."
        correct: false
        feedback: "Both route contributions are positive here."
      - id: d
        text: "Replace 6 with 3 from the route through $b=y+z$."
        correct: false
        feedback: "Both routes matter; neither replaces the other."
    solution: "The $b$ route contributes $3\\cdot1=3$ in addition to the $a$ route's 6, giving 9."
  - id: cgp-shared-template
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A new graph computes $a=r+s$, $b=s+t$, then $h=a\\cdot b$. At $r={{= r}}$, $s={{= s}}$, $t={{= t}}$, what is $\\partial h/\\partial s$?"
    params:
      { "r": { "min": 1, "max": 3 }, "s": { "min": 1, "max": 3 }, "t": { "min": 4, "max": 6 } }
    answer_expr: "(s+t)+(r+s)"
    tolerance: { abs: 0.001 }
    solution: "The route through $a$ contributes $b$, and the route through $b$ contributes $a$; add them to get ${{= (s+t)+(r+s)}}$."
  - id: cgp-robot-error
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 2
    prompt: "A robot's position is $p=k\\cdot u$, with setting $k={{= k}}$ and command $u={{= u}}$. It computes error $e=p-t$ for target $t={{= t}}$, then cost $C=e^2$. What is $\\partial C/\\partial u$?"
    params:
      { "k": { "min": 2, "max": 4 }, "u": { "min": 2, "max": 4 }, "t": { "min": 1, "max": 3 } }
    answer_expr: "2*(k*u-t)*k"
    tolerance: { abs: 0.001 }
    solution: "Trace the command's path: the local derivatives are $k$, 1 and $2e$, so $\\partial C/\\partial u=2(k u-t)k={{= 2*(k*u-t)*k}}$."
  - id: cg-check-1
    dimension: "math"
    type: "numeric"
    role: "check"
    difficulty: 1
    est_minutes: 2
    prompt: "A robot calculates a movement command by adding a position error $x = -2$ to a correction $y = 5$, then multiplying by a setting $z = -4$. Its graph is $q = x + y$, then $f = q \\cdot z$. How much does the command change per unit change in $z$, that is, what is $\\partial f/\\partial z$?"
    answer: 3
    tolerance: { "abs": 0.001 }
    common_wrong:
      [
        {
          "answer": -4,
          "category": "misunderstood_definition",
          "feedback": "For a multiply node, the derivative with respect to one input is the *other* input's value, here $q = 3$.",
        },
      ]
    solution: "The multiply node's derivative with respect to $z$ is its other input, $q=x+y=-2+5=3$."
  - id: cg-mul-add
    dimension: "math"
    type: "numeric"
    role: "core"
    difficulty: 2
    est_minutes: 3
    prompt: "A robot cart uses command $b = -3$ in two movement calculations. They give distances $a \\cdot b$ and $c \\cdot b$ centimetres, with $a = 2$ and $c = 4$. Its total movement is $f = a \\cdot b + c \\cdot b$. How much does the total change per unit change in $b$, that is, what is $\\partial f/\\partial b$?"
    answer: 6
    tolerance: { "abs": 0.001 }
    common_wrong:
      [
        {
          "answer": 2,
          "category": "incomplete_explanation",
          "feedback": "$b$ feeds two nodes, so its derivative is the sum of both path contributions: $a+c$.",
        },
      ]
    hints: ["$b$ appears in two multiply nodes, so add both contributions."]
    solution: "The two paths contribute $a=2$ and $c=4$, so their sum is $\\partial f/\\partial b=6$."
  - id: cg-relu-node
    dimension: "math"
    type: "numeric"
    role: "review"
    difficulty: 2
    est_minutes: 2
    prompt: "A robot computes position $p=w\\cdot x$, error $e=p-t$, then cost $C=e^2$. At $w=-1$, $x=3$, $t=-3$, what is $\\partial C/\\partial w$?"
    answer: 0
    tolerance: { "abs": 0.001 }
    common_wrong:
      [
        {
          "answer": 3,
          "category": "incomplete_explanation",
          "feedback": "That is only the multiply node's local derivative; squaring contributes 2e=0.",
        },
      ]
    solution: "Here $p=-3$ and $e=0$, so the path product is $2e\\cdot1\\cdot x=0$."
  - id: cg-explain
    dimension: "conceptual"
    type: "explain"
    role: "core"
    difficulty: 3
    est_minutes: 4
    prompt: "Explain how a computational graph represents a calculation, what a local derivative means, and how the local derivatives give the output's derivative for one input."
    rubric:
      - id: graph
        criterion:
          Describe one node per input and simple operation, with arrows from values to the operations that use
          them.
        weight: 1
        required: true
      - id: local
        criterion: Define a local derivative as one operation's output slope for one input, holding its other inputs fixed.
        weight: 1
        required: true
      - id: paths
        criterion: Explain multiplying local derivatives along each input-to-output path and adding the path products.
        weight: 1
        required: true
    exemplar: "The graph has one node per input and simple operation, with arrows showing which values each operation uses. A local derivative gives one operation's output slope for one input while holding its other inputs fixed. Multiply these derivatives along every path from the chosen input to the output, then add the path products."
    solution: "The graph has one node per input and simple operation, with arrows showing which values each operation uses. A local derivative gives one operation's output slope for one input while holding its other inputs fixed. Multiply these derivatives along every path from the chosen input to the output, then add the path products."
