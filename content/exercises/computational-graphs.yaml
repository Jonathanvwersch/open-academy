concept: computational-graphs
exercises:
  - id: cg-check-1
    dimension: math
    type: numeric
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "A robot calculates a movement command by adding a position error $x = -2$ to a correction $y = 5$, then multiplying by a setting $z = -4$. Its graph is $q = x + y$, then $f = q \\cdot z$. How much does the command change per unit change in $z$, that is, what is $\\partial f/\\partial z$?"
    answer: 3
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -4,
          category: misunderstood_definition,
          feedback: "For a multiply node, the derivative with respect to one input is the *other* input's value, here $q = 3$.",
        }
    solution: "$\\partial f/\\partial z = q = x + y = 3$."
  - id: cg-mul-add
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "A robot cart uses command $b = -3$ in two movement calculations. They give distances $a \\cdot b$ and $c \\cdot b$ centimetres, with $a = 2$ and $c = 4$. Its total movement is $f = a \\cdot b + c \\cdot b$. How much does the total change per unit change in $b$, that is, what is $\\partial f/\\partial b$?"
    answer: 6
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 2,
          category: incomplete_explanation,
          feedback: "$b$ feeds two nodes, so its gradient is the *sum* of both paths: $a + c$.",
        }
    hints: ["$b$ appears in two multiply nodes, so add both contributions."]
    solution: "$\\partial f/\\partial b = a + c = 6$."
  - id: cg-relu-node
    dimension: math
    type: numeric
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "A robot's model estimates a forward movement $wx$, but replaces negative estimates with 0 because this command must not move backwards. Its output is $f = \\max(0, wx)$, which means the larger of 0 and $wx$. For $w = -1$ and $x = 3$, what is $\\partial f/\\partial w$?"
    answer: 0
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 3,
          category: misunderstood_definition,
          feedback: "The input is $-3 < 0$, so $\\max(0, wx)$ has local derivative 0 there.",
        }
    solution: "The inside value is $-3$, so $\\max(0, wx)$ is 0 there and $\\partial f/\\partial w = 0 \\cdot x = 0$."
  - id: cg-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "A house-price model predicts 7 for a house whose true price is 5, using units of hundreds of thousands of pounds. We want to know how changing a model setting changes its squared error. Why does breaking the calculation into addition, multiplication and squaring help us find that derivative?"
    rubric:
      - {
          id: r1,
          criterion: "Each operation node uses only its own local derivative rule",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "The chain rule composes local derivatives along paths (summing over multiple paths) to get the gradient of the output with respect to any input/parameter",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Explains that software can apply the same operation rules automatically to different models",
          weight: 1,
        }
    exemplar: "Each node performs one operation with a known derivative rule. For example, a multiplication's derivative with respect to one input is the other input. The chain rule multiplies these derivatives along each path from a setting to the loss. If several paths exist, we add their contributions. We can therefore find the complete derivative without expanding the whole error formula. Software can record the operations and apply these same rules automatically for different models."
  - id: cgp-steps-for-expression
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A house-price model adds two amounts $a = 2$ and $b = 1$, then multiplies by a size adjustment $c = 3$. Its formula is $f = (a + b) \\cdot c$. Which list of operation nodes preserves this calculation?"
    options:
      - { id: a, text: "$q = a + b$, then $f = q \\cdot c$", correct: true }
      - id: b
        text: "$q = b \\cdot c$, then $f = a + q$"
        correct: false
        category: misunderstood_definition
        feedback: "The brackets say $a + b$ is worked out first, and the result is multiplied by $c$."
      - id: c
        text: "$q = a \\cdot c$, then $f = q + b$"
        correct: false
        category: misunderstood_definition
        feedback: "That graph computes $ac + b$, which is a different calculation. The brackets in the original formula require adding $a$ and $b$ before multiplying by $c$."
      - id: d
        text: "One node, $f = a + b + c$"
        correct: false
        category: misunderstood_definition
        feedback: "That changes the calculation. Each node does one operation, and this formula has an add and a multiply."
    solution: "Brackets are worked out first, so an add node makes $q = a + b$, and a multiply node then makes $f = q \\cdot c$."
  - id: cgp-forward-value
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A house-price model uses size $x = {{=x}}$, multiplier $w = {{=w}}$ and added amount $b = {{=b}}$. The true sale price is $y = {{=y}}$ in the same price units. It calculates $m = w \\cdot x$, $\\hat y = m + b$, $r = \\hat y - y$, then $L = r^2$. What squared error $L$ does it report?"
    hints: ["Work left to right: find $m$, then $\\hat y$, then $r$, then square it."]
    solution: "$m = {{=w}} \\cdot {{=x}} = {{=w*x}}$, $\\hat y = {{=w*x}} + {{=b}} = {{=w*x+b}}$, $r = {{=w*x+b}} - {{=y}} = {{=w*x+b-y}}$, so $L = ({{=w*x+b-y}})^2 = {{=(w*x+b-y)^2}}$."
    answer_expr: "(w * x + b - y)^2"
    params:
      w: { min: 1, max: 4 }
      x: { min: 1, max: 4 }
      b: { min: 0, max: 3 }
      y: { min: 1, max: 10 }
    constraints: ["abs(w * x + b - y) > 1"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: "w * x + b - y"
        category: incomplete_explanation
        feedback: "That is $r$. The last node squares it."
  - id: cgp-arrow-meaning
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the house-price model, node A calculates $3 \\cdot 2 = 6$ and an arrow connects it to node B, which adds 1. What does that arrow mean?"
    options:
      - { id: a, text: "B uses A's output as one of its inputs", correct: true }
      - id: b
        text: "B is computed before A is computed"
        correct: false
        category: misunderstood_definition
        feedback: "It's the other way round: B needs A's value, so A runs first."
      - id: c
        text: "B is the derivative of A's output"
        correct: false
        category: misunderstood_definition
        feedback: "Arrows carry values forward. Derivatives are worked out separately, node by node."
      - id: d
        text: "A and B always produce the same value"
        correct: false
        category: misunderstood_definition
        feedback: "B applies its own operation to A's value, so the outputs usually differ."
    solution: "An arrow carries a value: A's output is fed into B. That's also why A must be evaluated before B."
  - id: cgp-why-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "The house-price model calculates $m = w \\cdot x$, then $\\hat y = m + b$, with $w = 3$, $x = 2$ and $b = 1$. Why must the addition wait until after the multiplication?"
    options:
      - { id: a, text: "It needs $m$, which the multiply node produces", correct: true }
      - id: b
        text: "Adding is always done after multiplying"
        correct: false
        category: incorrect_reasoning
        feedback: "In $(a + b) \\cdot c$ the add comes first. The order comes from which node needs which value."
      - id: c
        text: "The add node has fewer inputs than the multiply node"
        correct: false
        category: incorrect_reasoning
        feedback: "Both have two inputs. What matters is that one of the add node's inputs is $m$."
      - id: d
        text: "Order doesn't matter in a computational graph"
        correct: false
        category: misunderstood_definition
        feedback: "A node can only run once every value flowing into it is known."
    solution: "A node can run only when all its inputs have values. The add node's input $m$ comes from the multiply node, so the multiply runs first."
  - id: cgp-node-count
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A robot measures its position as $a = 5$ cm and its goal as $b = 3$ cm. To score the error, it calculates $f = (a - b)^2 \\cdot c$, where $c = 2$ sets how strongly position errors count. With one operation per node, how many operation nodes does the graph need?"
    answer: 3
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: 6
        tolerance: { abs: 0.001 }
        category: misunderstood_definition
        feedback: "The inputs $a$, $b$ and $c$ are where arrows start, not operations. Count only the operations."
      - answer: 2
        tolerance: { abs: 0.001 }
        category: incomplete_explanation
        feedback: "Squaring is an operation too, so it gets its own node."
    solution: "The graph needs three operation nodes. First it subtracts $b$ from $a$, then squares that answer, then multiplies the square by $c$."
  - id: cgp-shared-input
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "A robot cart uses command $b = -3$ in two movement calculations, $a \\cdot b$ and $c \\cdot b$, with $a = 2$ and $c = 4$. In the graph for their sum $f = a \\cdot b + c \\cdot b$, how should the command $b$ appear?"
    options:
      - { id: a, text: "Once, with arrows into both multiply nodes", correct: true }
      - id: b
        text: "Once, with one arrow into the add node"
        correct: false
        category: misunderstood_definition
        feedback: "$b$ is multiplied by $a$ and by $c$, so it feeds both multiply nodes."
      - id: c
        text: "It doesn't appear, because it cancels out"
        correct: false
        category: incorrect_reasoning
        feedback: "Nothing cancels here. Every input used in the formula appears in the graph."
      - id: d
        text: "Once, with one arrow into the first multiply node"
        correct: false
        category: misunderstood_definition
        feedback: "$b$ is also used in $c \\cdot b$, so it needs an arrow into that node too."
    solution: "Each input appears once. Because $b$ is used in two multiplications, it has two arrows out, one to each multiply node."
  - id: cgp-multiply-local
    dimension: math
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A robot's model multiplies sensor reading $b = -3$ by an adjustable weight $a = 4$ to calculate $q = a \\cdot b$. Keeping the reading fixed, what is the local derivative $\\partial q/\\partial a$?"
    options:
      - { id: a, text: "$-3$", correct: true }
      - id: b
        text: "$4$"
        correct: false
        category: misunderstood_definition
        feedback: "For a multiply node, the derivative for one input is the value of the *other* input."
      - id: c
        text: "$1$"
        correct: false
        category: misunderstood_definition
        feedback: "1 is the local derivative of an add node. A multiply node scales by the other input."
      - id: d
        text: "$-12$"
        correct: false
        category: misunderstood_definition
        feedback: "$-12$ is the node's output $a \\cdot b$, not its derivative."
    solution: "Holding $b$ fixed, $q = a \\cdot b$ changes by $b$ for each unit of $a$, so $\\partial q/\\partial a = b = -3$."
  - id: cgp-multiply-nudge
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A robot's model multiplies a sensor reading $a = {{=a}}$ by a weight $b = {{=b}}$ to calculate $q = a \\cdot b$. If you increase the weight $b$ by 0.1 while keeping the reading fixed, by how much does $q$ increase?"
    hints: ["The local derivative $\\partial q/\\partial b$ is the other input, $a$."]
    solution: "$\\partial q/\\partial b = a = {{=a}}$, so a nudge of 0.1 raises $q$ by ${{=a}} \\times 0.1 = {{=a*0.1}}$."
    answer_expr: "a * 0.1"
    params:
      a: { min: 2, max: 9 }
      b: { min: 2, max: 9 }
    constraints: ["a != b"]
    tolerance: { abs: 0.0001 }
    common_wrong:
      - answer_expr: "b * 0.1"
        category: misunderstood_definition
        feedback: "A nudge in $b$ is scaled by the *other* input, $a = {{=a}}$."
  - id: cgp-square-local
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A house-price model's prediction error is $r = {{=r}}$ in its price units. It measures the mistake with squared loss $L = r^2$. What is the local derivative $dL/dr$?"
    hints: ["The derivative of $r^2$ is $2r$."]
    solution: "$dL/dr = 2r = 2 \\times ({{=r}}) = {{=2*r}}$."
    answer_expr: "2 * r"
    params:
      r: { min: -6, max: 6 }
    constraints: ["r != 0", "r != 2"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: "r^2"
        category: misunderstood_definition
        feedback: "$r^2$ is the node's output. Its local derivative is $2r$."
  - id: cgp-why-store-values
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "The house-price model calculates prediction error $r = 2$ and squared loss $L = r^2 = 4$. Why save $r$ for the derivative calculation rather than repeat the earlier calculations to find it again?"
    options:
      - {
          id: a,
          text: "The local derivative needs $r$, and reusing it avoids repeating the operations that produced it",
          correct: true,
        }
      - id: b
        text: "The saved value is already the derivative, so no derivative rule is needed"
        correct: false
        category: misapplied_technique
        feedback: "The saved input is 2, but the square node's derivative is $2r = 4$. We still need the node's rule."
      - id: c
        text: "Recomputing $r$ with unchanged inputs would give a different derivative"
        correct: false
        category: misunderstood_definition
        feedback: "If the inputs have not changed, repeating the calculation gives the same value and derivative. Saving the value avoids that repeated work; it does not change the answer."
      - id: d
        text: "Stored values remain valid even after changing the model's settings"
        correct: false
        category: misunderstood_definition
        feedback: "Changing a model setting can change $r$. To find derivatives for the new settings, we must first calculate the forward values for those settings."
    solution: "The square node needs its input to compute $2r$. Keeping $r = 2$ gives the derivative 4 without repeating the earlier multiply, add and subtract operations, but uses memory."
  - id: cgp-subtract-local
    dimension: math
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A house-price model predicts $\\hat y = 7$ when the true price is $y = 5$, in the same price units. It calculates the error $r = \\hat y - y$. What are the local derivatives $\\partial r/\\partial \\hat y$ and $\\partial r/\\partial y$?"
    options:
      - { id: a, text: "$1$ and $-1$", correct: true }
      - id: b
        text: "$1$ and $1$"
        correct: false
        category: misunderstood_definition
        feedback: "Raising $y$ makes $\\hat y - y$ smaller, so that derivative is negative."
      - id: c
        text: "$-1$ and $1$"
        correct: false
        category: misunderstood_definition
        feedback: "Raising $\\hat y$ makes $\\hat y - y$ bigger, so $\\partial r/\\partial \\hat y = +1$."
      - id: d
        text: "$y$ and $\\hat y$"
        correct: false
        category: misapplied_technique
        feedback: "Using the other input's value is the multiply rule. Subtracting gives $1$ and $-1$."
    solution: "Raising $\\hat y$ by 1 raises $r$ by 1. Raising $y$ by 1 lowers $r$ by 1. So the local derivatives are $1$ and $-1$."
  - id: cgp-max-node
    dimension: math
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "A robot's model must not request a negative forward distance, so it calculates $q = \\max(0, a)$, the larger of 0 and its estimate $a$. At $a = -3$ cm, what is the local derivative $dq/da$?"
    options:
      - { id: a, text: "$0$, because the output is stuck at 0 here", correct: true }
      - id: b
        text: "$1$, because $\\max$ passes its input through"
        correct: false
        category: misunderstood_definition
        feedback: "It passes the input through only when $a > 0$. At $a = -3$ the output is 0 for any small nudge."
      - id: c
        text: "$-3$, because that is the input value"
        correct: false
        category: misunderstood_definition
        feedback: "The local derivative is a rate of change, not the input's value."
      - id: d
        text: "$3$, because the input is flipped to positive"
        correct: false
        category: misunderstood_definition
        feedback: "$\\max(0, a)$ doesn't flip signs. For a negative input it outputs 0."
    solution: "At $a = -3$, $\\max(0, a) = 0$. A small increase or decrease in $a$ still leaves it negative, so the output stays 0. The rate of change is therefore 0."
  - id: cgp-path-product
    dimension: math
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For the house-price model, $m = w \\cdot x$, $\\hat y = m + b$, $r = \\hat y - y$ and $L = r^2$. The added amount $b$ changes the prediction directly. Which product includes every operation between $b$ and the squared error, giving $\\partial L/\\partial b$?"
    options:
      - id: a
        text: "$\\frac{dL}{dr}\\cdot\\frac{\\partial r}{\\partial \\hat y}\\cdot\\frac{\\partial \\hat y}{\\partial b}$"
        correct: true
      - id: b
        text: "$\\frac{dL}{dr}\\cdot\\frac{\\partial r}{\\partial \\hat y}\\cdot\\frac{\\partial \\hat y}{\\partial m}\\cdot\\frac{\\partial m}{\\partial w}$"
        correct: false
        category: misapplied_technique
        feedback: "That is the path from $w$. The path from $b$ goes straight into the add node."
      - id: c
        text: "$\\frac{\\partial \\hat y}{\\partial b}$ on its own"
        correct: false
        category: incomplete_explanation
        feedback: "That only covers the first step. Keep multiplying along the path all the way to $L$."
      - id: d
        text: "$\\frac{dL}{dr} + \\frac{\\partial r}{\\partial \\hat y} + \\frac{\\partial \\hat y}{\\partial b}$"
        correct: false
        category: misunderstood_definition
        feedback: "Local derivatives along one path multiply. Only separate paths add."
    solution: "$b$ enters the add node, then flows through the subtract and square nodes. Multiply the local derivatives along that path: $2r \\cdot 1 \\cdot 1$."
  - id: cgp-chain-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "A house-price model uses size $x = {{=x}}$, weight $w = {{=w}}$ and added amount $b = {{=b}}$ to predict $\\hat y = wx + b$. The actual price is $y = {{=y}}$ in the same price units. Its graph calculates $m = w \\cdot x$, $r = \\hat y - y$ and $L = r^2$. To improve the weight, what is $\\partial L/\\partial w$?"
    hints:
      - "Evaluate the graph first to get $r$."
      - "Multiply along the path: $dL/dr = 2r$, then $1$, then $1$, then $\\partial m/\\partial w = x$."
    solution: "Forward: $r = {{=w}} \\cdot {{=x}} + {{=b}} - {{=y}} = {{=w*x+b-y}}$. Along the path: $\\partial L/\\partial w = 2r \\cdot 1 \\cdot 1 \\cdot x = 2 \\times ({{=w*x+b-y}}) \\times {{=x}} = {{=2*(w*x+b-y)*x}}$."
    answer_expr: "2 * (w * x + b - y) * x"
    params:
      w: { min: 1, max: 4 }
      x: { min: 2, max: 4 }
      b: { min: 0, max: 3 }
      y: { min: 1, max: 12 }
    constraints: ["w * x + b != y", "w != x"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: "2 * (w * x + b - y)"
        category: incomplete_explanation
        feedback: "That stops at $\\hat y$. The last step, through the multiply node, scales by $\\partial m/\\partial w = x = {{=x}}$."
      - answer_expr: "2 * (w * x + b - y) * w"
        category: misapplied_technique
        feedback: "At the multiply node the derivative for $w$ is the *other* input, $x = {{=x}}$."
  - id: cgp-one-path-only
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A robot cart calculates its total movement as $f = a \\cdot b + c \\cdot b$, with $a = 2$, $b = -3$ and $c = 4$. A student follows only the first movement calculation, $a \\cdot b$, and reports $\\partial f/\\partial b = a$. What did they miss?"
    options:
      - { id: a, text: "The path through $c \\cdot b$; the answer is $a + c$", correct: true }
      - id: b
        text: "Nothing; one path from $b$ is enough"
        correct: false
        category: incomplete_explanation
        feedback: "$b$ feeds two nodes, so a nudge in $b$ changes $f$ along both paths."
      - id: c
        text: "They should multiply the paths, giving $a \\cdot c$"
        correct: false
        category: misapplied_technique
        feedback: "Separate paths add. Multiplying is for steps along one path."
      - id: d
        text: "The add node's derivative; the answer is $a + 1$"
        correct: false
        category: math_error
        feedback: "The add node's local derivative is 1 and it multiplies the path, giving $1 \\cdot a$. The missing piece is the second path, $1 \\cdot c$."
    solution: "$b$ has arrows into both multiply nodes. The two paths give $1 \\cdot a$ and $1 \\cdot c$, and they add to $a + c$."
  - id: cgp-used-twice
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A house-price rule multiplies size $x = 3$ by a weight $y = 5$, then adds size once more: $p = x \\cdot y$ and $f = p + x$. Size is used in both operations. How much does the prediction change per unit change in size, that is, what is $\\partial f/\\partial x$?"
    answer: 6
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: 5
        tolerance: { abs: 0.001 }
        category: incomplete_explanation
        feedback: "That is only the path through $p$. $x$ also goes straight into the add node, adding 1."
      - answer: 1
        tolerance: { abs: 0.001 }
        category: incomplete_explanation
        feedback: "That is only the direct path. Add the path through $p$: $1 \\cdot y = 5$."
    hints: ["Path through $p$: $1 \\cdot y$. Direct path into the add node: $1$."]
    solution: "Through $p$: $\\frac{\\partial f}{\\partial p}\\cdot\\frac{\\partial p}{\\partial x} = 1 \\cdot y = 5$. Directly: $\\partial f/\\partial x = 1$. Add the paths: $5 + 1 = 6$."
  - id: cgp-why-multiply-path
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the house-price graph, increasing a weight by 0.01 first increases an intermediate answer by 0.02. The later operations multiply that change by about 4. Why multiply the local derivatives 2 and 4 rather than add them?"
    options:
      - {
          id: a,
          text: "The first node doubles a small nudge, and the next scales that doubled nudge by 4",
          correct: true,
        }
      - id: b
        text: "Each node receives the original nudge independently, so the contributions add"
        correct: false
        category: misunderstood_definition
        feedback: "That describes separate paths. Along one path, the next node receives the already-scaled nudge."
      - id: c
        text: "Only the last derivative matters, because earlier changes disappear"
        correct: false
        category: incomplete_explanation
        feedback: "The last node receives the change produced by the first node. If we ignore the first factor, we incorrectly treat its input change as 0.01 rather than 0.02."
      - id: d
        text: "We should multiply the node outputs instead of their derivatives"
        correct: false
        category: misunderstood_definition
        feedback: "Node outputs tell us values. Derivatives tell us how changes in those values are scaled."
    solution: "An input nudge of 0.01 becomes about 0.02 after the first node and 0.08 after the second. The overall scale is $2 \\cdot 4 = 8$, not $2 + 4 = 6$."
  - id: cgp-robot-error
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A robot gripper is at position $p = 5$ cm and its goal is $g = 3$ cm. Its graph computes $r = p - g$, then the cost $C = r^2$. What is $\\partial C/\\partial p$?"
    answer: 4
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: -4
        tolerance: { abs: 0.001 }
        category: misapplied_technique
        feedback: "$-4$ is $\\partial C/\\partial g$. For $p$, the subtract node's local derivative is $+1$."
      - answer: 2
        tolerance: { abs: 0.001 }
        category: incomplete_explanation
        feedback: "2 is $r$. The square node's local derivative is $2r$."
    solution: "$r = 5 - 3 = 2$. Along the path: $\\frac{dC}{dr}\\cdot\\frac{\\partial r}{\\partial p} = 2r \\cdot 1 = 4$. Moving the gripper further from the goal raises the cost."
