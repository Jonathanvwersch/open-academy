        correct: false
        feedback: "The function value gives the height at the point."
      - id: c
        text: "The gradient"
        correct: true
        feedback: "The gradient is a vector containing one partial derivative per input."
    solution: "The gradient is a vector containing one partial derivative per input."
  - id: grad-recall-gradient-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: grad-vector-of-partials
    difficulty: 1
    est_minutes: 0.5
    prompt: "For inputs ordered $(x,y)$, complete $\\nabla f=(\\partial f/\\partial x,\\underline{\\quad})$. Type the missing derivative in symbols or words."
    accept:
      [
        "∂f/∂y",
        "partial f/partial y",
        "f_y",
        "fy",
        "partial derivative with respect to y",
        "the partial derivative with respect to y",
      ]
    regex: "^\\s*(?:(?:∂|partial\\s*)f\\s*/\\s*(?:∂|partial\\s*)y|f\\s*_?\\s*y|(?:the\\s+)?partial\\s+derivative\\s+(?:of\\s+f\\s+)?with\\s+respect\\s+to\\s+y)\\s*$"
    solution: "The second component is $\\partial f/\\partial y$, the slope for the second input."
  - id: grad-recall-direction-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: grad-points-uphill
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what does a directional derivative measure, and why do we use a direction vector of length one?"
    rubric:
      - id: point1
        criterion: "Explain that it is the slope at a point in a chosen direction."
        weight: 1
        required: true
      - id: point2
        criterion: "Explain that a unit direction makes the result measure change per unit distance."
        weight: 1
        required: true
    exemplar: "A directional derivative is the slope at a point in a chosen direction. Using a vector of length one measures the output change per unit distance."
  - id: grad-recall-direction-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: grad-points-uphill
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: "Which operation gives the slope in a chosen unit direction $\\mathbf u$ at $P$?"
    options:
      - id: a
        text: "The function value $f(P)$"
        correct: false
        feedback: "The function value gives height at the starting point."
      - id: b
        text: "The dot product $\\nabla f(P)\\cdot\\mathbf u$"
        correct: true
        feedback: "The dot product combines the effects of the input changes in that direction."
      - id: c
        text: "The length $\\|\\nabla f(P)\\|$"
        correct: false
        feedback: "The gradient's length gives the largest possible uphill slope."
    solution: "The dot product combines the effects of the input changes in that direction."
  - id: grad-recall-direction-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: grad-points-uphill
    difficulty: 1
    est_minutes: 0.5
    prompt: "The gradient at $P$ is $(a,b)$ and a unit direction is $(0.6,0.8)$. Write the slope in that direction as a scalar expression."
    answer: "0.6*a+0.8*b"
    variables: { "a": [1, 5], "b": [-4, 4] }
    solution: "The dot product gives $0.6a+0.8b$."
  - id: grad-recall-descent-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: grad-steepest-descent
    difficulty: 1
