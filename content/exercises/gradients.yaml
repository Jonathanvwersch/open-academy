concept: gradients
exercises:
  - id: grad-vector-of-partials-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is a gradient?"
    options:
      - {
          id: a,
          text: "A scalar loss score for one training example, rather than a derivative for model parameters.",
          correct: false,
          feedback: "A loss is a score; a gradient is a vector of derivatives.",
        }
      - {
          id: b,
          text: "A vector of the loss's partial derivatives, one for each weight and bias",
          correct: true,
          feedback: "Each vector entry is the loss's partial derivative for one weight or bias.",
        }
      - {
          id: c,
          text: "A vector of input features describing the measurements of one house.",
          correct: false,
          feedback: "That is a feature vector.",
        }
      - {
          id: d,
          text: "A direction that always increases the model's predicted output, regardless of its loss slope.",
          correct: false,
          feedback: "It points toward increasing loss here; it does not always increase a model's prediction.",
        }
    solution: "A gradient is an ordered vector containing one partial derivative for each adjustable model parameter."
  - id: grad-points-uphill-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is a directional change?"
    options:
      - {
          id: a,
          text: "The exact output difference after changing one input by an arbitrary amount.",
          correct: false,
          feedback: "A directional change is a first-order approximation for several inputs moving a small amount.",
        }
      - {
          id: b,
          text: "An estimate of how output changes when several inputs move a small amount together.",
          correct: true,
          feedback: "A small move combines changes across inputs to estimate the output change.",
        }
      - {
          id: c,
          text: "The output difference between current inputs and the all-zero input setting.",
          correct: false,
          feedback: "That is one finite change; a directional change estimates a small move along a chosen direction.",
        }
      - {
          id: d,
          text: "The local rate of one output with respect to one selected input.",
          correct: false,
          feedback: "That is a partial derivative; a directional change combines several input movements.",
        }
    solution: "A directional change approximates the output change caused by moving several inputs a small amount together."
  - id: grad-steepest-descent-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does steepest descent mean?"
    options:
      - {
          id: a,
          text: "The direction that changes the most input values at once.",
          correct: false,
          feedback: "Changing more coordinates does not ensure the fastest decrease per unit distance.",
        }
      - {
          id: b,
          text: "The direction in which the gradient gets steeper fastest.",
          correct: false,
          feedback: "Steepest descent lowers the function locally rather than making its gradient grow.",
        }
      - {
          id: c,
          text: "The direction that reaches the global minimum in one update.",
          correct: false,
          feedback: "A local step may lower the function without reaching any minimum, let alone the global one.",
        }
      - {
          id: d,
          text: "The direction in which a small step lowers the function fastest",
          correct: true,
          feedback: "Among unit-length directions, this one gives the greatest local decrease for a small step.",
        }
    solution: "Steepest descent is the direction that lowers a function fastest per unit distance for a small step."
  - id: grad-check-1
    dimension: math
    type: text
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x, y) = x^2 + 3y^2$, what is $\\nabla f$ at $(2, -1)$? Answer as `(a, b)`."
    accept: ["(4,-6)", "(4, -6)", "4,-6", "4, -6", "[4,-6]", "[4, -6]"]
    hints: ["$\\nabla f = (2x, 6y)$."]
    solution: "$(2\\cdot2,\\ 6\\cdot(-1)) = (4, -6)$."
  - id: dx-math-4
    dimension: math
    type: text
    role: diagnostic
    difficulty: 2
    est_minutes: 3
    prompt: "For $f(w_1, w_2) = w_1^2 + 3w_1w_2$, compute $\\nabla f$ at $(w_1, w_2) = (1, 2)$. Answer as `(a, b)`."
    accept: ["(8,3)", "(8, 3)", "8,3", "8, 3", "[8,3]", "[8, 3]"]
    solution: "$\\partial f/\\partial w_1 = 2w_1 + 3w_2 = 8$ and $\\partial f/\\partial w_2 = 3w_1 = 3$, so $\\nabla f = (8, 3)$."
  - id: grad-core-1
    dimension: math
    type: text
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "For $f(x, y) = x y^2 - 2x$, compute $\\nabla f(3, 1)$. Answer as `(a, b)`."
    accept: ["(-1,6)", "(-1, 6)", "-1,6", "-1, 6", "[-1,6]", "[-1, 6]"]
    hints: ["$\\partial f/\\partial x = y^2 - 2$.", "$\\partial f/\\partial y = 2xy$."]
    solution: "$(1 - 2,\\ 2\\cdot3\\cdot1) = (-1, 6)$."
  - id: grad-descent-direction
    dimension: conceptual
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "A model's error $L$ has gradient $\\nabla L = (3, -4)$ at its current weights. Which direction vector of length 1 gives the largest estimated decrease for the same small change in the weights?"
    options:
      - { id: a, text: "$(-0.6, 0.8)$", correct: true }
      - {
          id: b,
          text: "$(0.6, -0.8)$",
          correct: false,
          category: incorrect_reasoning,
          feedback: "That points along $+\\nabla L$, which increases the error fastest rather than decreasing it.",
        }
      - {
          id: c,
          text: "$(0.8, 0.6)$",
          correct: false,
          category: incorrect_reasoning,
          feedback: "This is at right angles to the gradient. The estimate using the current slopes therefore predicts no change in $L$.",
        }
      - {
          id: d,
          text: "$(-1, 0)$",
          correct: false,
          category: incorrect_reasoning,
          feedback: "This does decrease $L$, but more slowly: $\\nabla L \\cdot \\delta = -3$ versus $-5$ for the best direction.",
        }
    hints: ["Steepest descent is $-\\nabla L / \\|\\nabla L\\|$."]
    solution: "The gradient has length 5. Divide its negative by 5 to get $(-3, 4)/5 = (-0.6, 0.8)$. The error decreases at an estimated rate of 5 per unit distance in this direction."
  - id: grad-review-flat
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "A smooth function $f$ has a local minimum, meaning its value is no larger than at any nearby point. Assume its inputs can vary freely in every direction. What is $\\nabla f$ there?"
    options:
      - { id: a, text: "The zero vector", correct: true }
      - {
          id: b,
          text: "A vector pointing toward the lowest value anywhere in the function",
          correct: false,
          category: misunderstood_definition,
          feedback: "The gradient at a local minimum is determined by nearby changes, not by the lowest value somewhere far away. Use the first-order behavior around the point.",
        }
      - {
          id: c,
          text: "A vector of all ones",
          correct: false,
          category: recall_failure,
          feedback: "All ones would mean $f$ still increases when you step in any input direction, so stepping the other way would lower it. That cannot happen at a local minimum.",
        }
    solution: "At a local minimum every partial derivative is zero, otherwise you could step downhill."
  - id: grad-transfer-scale
    dimension: transfer
    type: mc
    role: transfer
    difficulty: 3
    est_minutes: 3
    prompt: "A model's loss, its numerical measure of error, is $L(w_1, w_2) = w_1^2 + 100\\,w_2^2$. Its weights start at $(1, 1)$. Each update subtracts $s\\nabla L$ from the weights, using one positive number $s$ to control the size of both changes. Which statement describes the difficulty?"
    options:
      - {
          id: a,
          text: "A small enough update to reduce the size of $w_2$ changes $w_1$ very slowly; a faster update for $w_1$ can make $w_2$ grow in size instead",
          correct: true,
        }
      - {
          id: b,
          text: "Both weights approach 0 at the same rate because the gradient points at the minimum",
          correct: false,
          category: misunderstood_definition,
          feedback: "The gradient $(2, 200)$ points steeply along $w_2$, not at the minimum $(0, 0)$.",
        }
      - {
          id: c,
          text: "The gradient is zero, so nothing happens",
          correct: false,
          category: math_error,
          feedback: "At $(1, 1)$ the gradient is $(2, 200)$, not zero. Compare how steep the loss is along $w_1$ and along $w_2$.",
        }
    hints: ["Compute $\\nabla L(1,1)$ and compare the two components."]
    solution: "$\\nabla L(1,1) = (2, 200)$. Each step multiplies $w_2$ by $1 - 200s$, so $w_2$ only shrinks if $s < 0.01$. At $s = 0.01$, each step multiplies $w_1$ by $1 - 2s = 0.98$, so it shrinks by only 2% per step. This mismatch motivates rescaling features and using methods that adjust the step size."
  - id: grad-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "Explain in 2–4 sentences why stepping along the negative gradient decreases a function fastest, for small steps."
    rubric:
      - {
          id: r1,
          criterion: "Estimates the change using the current slopes: $f(x+\\delta) \\approx f(x) + \\nabla f\\cdot\\delta$ (or describes the change as a dot product with the gradient)",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Argues the dot product is most negative when $\\delta$ points opposite to $\\nabla f$ (angle 180°)",
          weight: 2,
          required: true,
        }
      - { id: r3, criterion: "Notes that the estimate only applies to small changes", weight: 1 }
    exemplar: "For a small displacement δ, estimate the change in f using ∇f·δ = |∇f||δ|cosθ. For equal distances, this is most negative when cosθ = -1, so δ points opposite the gradient. This uses the slopes at the starting point; a larger move can pass the lowest point and raise the value again."
  - id: gradp-compute
    dimension: math
    type: text
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x, y) = 2x^2 + xy$, what is $\\nabla f$ at $(1, 3)$? Answer as `(a, b)`."
    accept: ["(7,1)", "(7, 1)", "7,1", "7, 1", "[7,1]", "[7, 1]"]
    hints:
      ["$\\frac{\\partial f}{\\partial x} = 4x + y$ and $\\frac{\\partial f}{\\partial y} = x$."]
    solution: "$\\nabla f = (4x + y,\\ x)$, so at $(1, 3)$ it is $(4 + 3,\\ 1) = (7, 1)$."
  - id: gradp-component
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For $f(x, y) = {{=a}}x^2 + {{=b}}xy$, what is the first component of $\\nabla f$ (the partial in $x$) at $(x, y) = ({{=x0}}, {{=y0}})$?"
    hints: ["The first component is $\\frac{\\partial f}{\\partial x} = {{=2*a}}x + {{=b}}y$."]
    solution: "$\\frac{\\partial f}{\\partial x} = {{=2*a}}x + {{=b}}y = {{=2*a}} \\times {{=x0}} + {{=b}} \\times {{=y0}} = {{=2*a*x0+b*y0}}$."
    answer_expr: "2*a*x0 + b*y0"
    params:
      a: { min: 1, max: 4, step: 1 }
      b: { min: 1, max: 5, step: 1 }
      x0: { min: 1, max: 4, step: 1 }
      y0: { min: 1, max: 4, step: 1 }
    constraints: ["b*x0 != 2*a*x0 + b*y0"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "b*x0",
          category: misunderstood_definition,
          feedback: "That is the second component, $\\frac{\\partial f}{\\partial y}$. The first component is the partial in $x$.",
        }
      - {
          answer_expr: "2*a*x0",
          category: math_error,
          feedback: "The term ${{=b}}xy$ also contains $x$, so it contributes ${{=b}}y$.",
        }
  - id: gradp-why-vector
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Why keep the partial derivatives of $f(x, y)$ as a vector instead of adding them into one number?"
    options:
      - id: a
        text: "Each partial belongs to a different input direction, and the vector preserves that information"
        correct: true
      - id: b
        text: "Adding the partials always gives 0, even on a slope"
        correct: false
        category: misunderstood_definition
        feedback: "The sum need not be 0: partials 3 and 4 sum to 7. The problem is losing which slope belongs to which direction."
      - id: c
        text: "A vector stores the height as well as the slopes"
        correct: false
        category: misunderstood_definition
        feedback: "Neither partial stores the height. Both are rates of change, and their vector still contains only rates."
      - id: d
        text: "Only the largest partial matters; the other component can be discarded"
        correct: false
        category: misunderstood_definition
        feedback: "A step can change both inputs. Discarding one partial loses its contribution to the output change."
    solution: "Partials 3 and 4 describe different slopes. Their sum 7 loses which input has slope 3 and which has slope 4; the vector keeps both so a step's effects can be computed."
  - id: gradp-three-inputs
    dimension: math
    type: text
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "For $f(x, y, z) = x^2 + yz$, what is $\\nabla f$ at $(1, 2, 3)$? Answer as `(a, b, c)`."
    accept: ["(2,3,2)", "(2, 3, 2)", "2,3,2", "2, 3, 2", "[2,3,2]", "[2, 3, 2]"]
    hints: ["One partial per input: $2x$, $z$ and $y$."]
    solution: "$\\nabla f = (2x,\\ z,\\ y)$, so at $(1, 2, 3)$ it is $(2, 3, 2)$. Three inputs give three components."
  - id: gradp-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "For $h(x, y) = x^2 + 2y^2$, a classmate writes $\\nabla h(1.5, 1) = (4, 3)$. What went wrong?"
    options:
      - id: a
        text: "The components are swapped; the partial in $x$ comes first, giving $(3, 4)$"
        correct: true
      - id: b
        text: "Nothing; the order of components doesn't matter"
        correct: false
        category: misunderstood_definition
        feedback: "$(4, 3)$ and $(3, 4)$ point in different directions. The components follow the order of the inputs."
      - id: c
        text: "The gradient should be a single number, 7"
        correct: false
        category: misunderstood_definition
        feedback: "The gradient is a vector of partials, not their sum."
      - id: d
        text: "Both components should be 0 because $h$ is a valley"
        correct: false
        category: incorrect_reasoning
        feedback: "The gradient is only $(0, 0)$ at the valley floor, $(0, 0)$, not on the slope."
    solution: "$\\frac{\\partial h}{\\partial x} = 2x = 3$ and $\\frac{\\partial h}{\\partial y} = 4y = 4$, and the components follow the order of the inputs: $(3, 4)$."
  - id: gradp-exp-component
    dimension: math
    type: expression
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For $f(x, y) = x\\,e^y + \\ln x$, give the second component of $\\nabla f$, the partial in $y$ (write `exp(y)`)."
    answer: "x*exp(y)"
    variables: { x: [0.5, 3], y: [-1, 1] }
    common_wrong:
      - {
          answer: "exp(y) + 1/x",
          category: misunderstood_definition,
          feedback: "That is the first component, the partial in $x$.",
        }
    solution: "Freeze $x$: $x\\,e^y \\to x\\,e^y$ and $\\ln x \\to 0$, so the second component is $x\\,e^y$."
  - id: gradp-uphill
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "On a hillside, the gradient of the height at your position is $(2, -1)$. Which way does it point?"
    options:
      - id: a
        text: "The direction in which the height increases fastest"
        correct: true
      - id: b
        text: "Straight towards the lowest point of the hill"
        correct: false
        category: misunderstood_definition
        feedback: "The gradient only describes the slope where you stand. Its direction is the steepest way up."
      - id: c
        text: "Along a contour, where the height stays the same"
        correct: false
        category: misunderstood_definition
        feedback: "Steps along a contour are at right angles to the gradient."
      - id: d
        text: "The direction in which the height decreases fastest"
        correct: false
        category: incorrect_reasoning
        feedback: 'That is $-\nabla h$. The gradient itself points uphill.'
    solution: "For a small step $\\delta$ the height changes by about $\\nabla h \\cdot \\delta$, which is largest for steps along the gradient, so the gradient points steepest uphill."
  - id: gradp-approx
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "At a point $p$, a function has $\\nabla f(p) = ({{=g1}}, {{=g2}})$. Estimate the change in $f$ for the small step $\\delta = ({{=d1}}, {{=d2}})$."
    hints:
      ["The change is about $\\nabla f \\cdot \\delta$.", "Multiply matching components and add."]
    solution: "$\\nabla f \\cdot \\delta = ({{=g1}})({{=d1}}) + ({{=g2}})({{=d2}}) = {{=g1*d1+g2*d2}}$."
    answer_expr: "g1*d1 + g2*d2"
    params:
      g1: { min: -5, max: 5, step: 1 }
      g2: { min: -5, max: 5, step: 1 }
      d1: { min: -0.2, max: 0.2, step: 0.1 }
      d2: { min: -0.2, max: 0.2, step: 0.1 }
    constraints:
      [
        "g1 != 0",
        "g2 != 0",
        "d1 != 0",
        "d2 != 0",
        "g1*d1 + g2*d2 != 0",
        "g1*d2 + g2*d1 != g1*d1 + g2*d2",
      ]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "g1*d2 + g2*d1",
          category: math_error,
          feedback: "Pair matching components: the first with the first, the second with the second.",
        }
  - id: gradp-contour
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "A hillside has gradient $\\nabla h = (3, 4)$ where you stand. Using the slopes at this point, which small displacement gives a predicted height change of 0?"
    options:
      - { id: a, text: "$(0.08, -0.06)$", correct: true }
      - id: b
        text: "$(0.06, 0.08)$"
        correct: false
        category: incorrect_reasoning
        feedback: "This is along the gradient: $0.18 + 0.32 = 0.5$, the biggest climb."
      - id: c
        text: "$(-0.06, -0.08)$"
        correct: false
        category: incorrect_reasoning
        feedback: "This is opposite the gradient: the change is $-0.5$, the biggest drop."
      - id: d
        text: "$(0.1, 0)$"
        correct: false
        category: math_error
        feedback: '$\nabla h \cdot \delta = 3 \times 0.1 = 0.3$, so the height rises.'
    solution: "$\\nabla h \\cdot (0.08, -0.06) = 0.24 - 0.24 = 0$. The step is at right angles to the gradient, along a contour."
  - id: gradp-length
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "On a hill, $\\nabla h = (1, 0)$ at point A and $(6, 8)$ at point B. What does this tell you?"
    options:
      - id: a
        text: "The ground is steeper at B, because its gradient is longer"
        correct: true
      - id: b
        text: "The ground is steeper at A, because its gradient points due east"
        correct: false
        category: misunderstood_definition
        feedback: "The direction says which way is uphill. The length says how steep it is."
      - id: c
        text: "B is higher up than A"
        correct: false
        category: misunderstood_definition
        feedback: "The gradient describes the slope, not the height itself."
      - id: d
        text: "Both are equally steep, because gradients always have length 1"
        correct: false
        category: misunderstood_definition
        feedback: 'Gradient lengths vary: $\|(6, 8)\| = 10$ and $\|(1, 0)\| = 1$.'
    solution: "$\\|(6, 8)\\| = 10$ and $\\|(1, 0)\\| = 1$, so the height changes 10 times as fast per unit step at B."
  - id: gradp-predict-height
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "At $(2, 1)$, a valley has height $h = 6$ m and gradient $\\nabla h = (4, 4)$. Estimate the height after the small step $\\delta = (-0.1, 0.05)$."
    answer: 5.8
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -0.2,
          category: incomplete_explanation,
          feedback: "That is the change in height. Add it to the starting height of 6 m.",
        }
      - {
          answer: 6.6,
          category: math_error,
          feedback: "Check the sign of the first component: $4 \\times (-0.1) = -0.4$.",
        }
    hints: ["$h(p + \\delta) \\approx h(p) + \\nabla h \\cdot \\delta$."]
    solution: "$\\nabla h \\cdot \\delta = 4 \\times (-0.1) + 4 \\times 0.05 = -0.2$, so the height is about $6 - 0.2 = 5.8$ m."
  - id: gradp-small-step
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "Why does $f(p + \\delta) \\approx f(p) + \\nabla f \\cdot \\delta$ only work for small steps?"
    options:
      - id: a
        text: "The gradient describes the slope at $p$, and the slope can change as you move away"
        correct: true
      - id: b
        text: "Dot products are only defined for short vectors"
        correct: false
        category: misunderstood_definition
        feedback: "You can take the dot product of any two vectors of the same size."
      - id: c
        text: "Large steps always make $f$ smaller"
        correct: false
        category: incorrect_reasoning
        feedback: "A large step can raise or lower $f$. The issue is that the prediction can be wrong."
      - id: d
        text: "It works for any step size"
        correct: false
        category: incorrect_reasoning
        feedback: "On $h = x^2 + 2y^2$ the gradient changes from point to point, so a long step uses an out-of-date slope."
    solution: "The approximation treats the function as having the slope $\\nabla f(p)$ everywhere. That is only accurate close to $p$."
  - id: gradp-descent-unit
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The gradient of $f$ is $(-5, 12)$ and has length 13. Which direction vector of length 1 gives the greatest estimated decrease in $f$ per unit distance?"
    options:
      - { id: a, text: '$\left(\frac{5}{13}, -\frac{12}{13}\right)$', correct: true }
      - id: b
        text: '$\left(-\frac{5}{13}, \frac{12}{13}\right)$'
        correct: false
        category: incorrect_reasoning
        feedback: 'That is along $+\nabla f$, the direction of steepest increase.'
      - id: c
        text: "$(5, -12)$"
        correct: false
        category: misapplied_technique
        feedback: 'This has the right direction, but its length is 13. Divide by $\|\nabla f\| = 13$ to get length 1.'
      - id: d
        text: "$(0, -1)$"
        correct: false
        category: incorrect_reasoning
        feedback: "This decreases $f$ at rate 12, but the best unit step gives 13."
    solution: "Steepest descent is $-\\frac{\\nabla f}{\\|\\nabla f\\|} = \\frac{(5, -12)}{13}$, where $f$ falls at rate 13."
  - id: gradp-steepest-rate
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "At a point, $\\nabla f = ({{=a}}, {{=b}})$. For a step of length 1 in the steepest-descent direction, about how much does $f$ change? Round to 2 decimal places."
    hints:
      [
        "Along $-\\frac{\\nabla f}{\\|\\nabla f\\|}$, the change per unit step is $-\\|\\nabla f\\|$.",
        "$\\|\\nabla f\\| = \\sqrt{a^2 + b^2}$.",
      ]
    solution: "$\\|\\nabla f\\| = \\sqrt{ {{=a^2}} + {{=b^2}} } \\approx {{=sqrt(a^2+b^2)}}$. Stepping opposite the gradient, $f$ changes by about $-{{=sqrt(a^2+b^2)}}$."
    answer_expr: "-sqrt(a^2 + b^2)"
    params:
      a: { min: 1, max: 8, step: 1 }
      b: { min: 1, max: 8, step: 1 }
    tolerance: { abs: 0.01 }
    common_wrong:
      - {
          answer_expr: "sqrt(a^2 + b^2)",
          category: incorrect_reasoning,
          feedback: "That is the rate going uphill. Stepping opposite the gradient makes $f$ go down.",
        }
      - {
          answer_expr: "-(a + b)",
          category: math_error,
          feedback: "The length of a vector is $\\sqrt{a^2 + b^2}$, not $a + b$.",
        }
  - id: gradp-direction-rate
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A hillside's height $f$ has gradient $(3, 4)$ where you stand. Using those slopes, what is the estimated rate of height change per unit distance due west, in direction $(-1, 0)$?"
    answer: -3
    tolerance: { abs: 0.001 }
    common_wrong:
      - { answer: 3, category: math_error, feedback: "Check the sign: $3 \\times (-1) = -3$." }
      - {
          answer: -5,
          category: incorrect_reasoning,
          feedback: "$-5$ is the rate in the steepest-descent direction $(-0.6, -0.8)$. Due west is less steep.",
        }
    solution: "$\\nabla f \\cdot (-1, 0) = -3$. That is downhill, but less steep than the $-5$ you get opposite the gradient."
  - id: gradp-why-180
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For steps $\\delta$ of a fixed small length, why is $\\nabla f \\cdot \\delta$ most negative when $\\delta$ points opposite $\\nabla f$?"
    options:
      - id: a
        text: '$\nabla f \cdot \delta = \|\nabla f\|\,\|\delta\|\cos\theta$, and $\cos\theta$ is smallest, $-1$, at $\theta = 180^\circ$'
        correct: true
      - id: b
        text: 'Because $\cos\theta$ is 0 at $\theta = 180^\circ$'
        correct: false
        category: recall_failure
        feedback: '$\cos 180^\circ = -1$. The cosine is 0 at $90^\circ$, which gives no change.'
      - id: c
        text: "Because opposite steps are longer"
        correct: false
        category: incorrect_reasoning
        feedback: "Every step here has the same length, so only the angle matters."
      - id: d
        text: "Because the gradient is always negative"
        correct: false
        category: misunderstood_definition
        feedback: "The gradient is a vector, and its components can have either sign."
    solution: "With both lengths fixed, the change depends only on $\\cos\\theta$, which is smallest at $\\theta = 180^\\circ$, i.e. stepping exactly opposite the gradient."
  - id: gradp-not-at-minimum
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "In the valley $h(x, y) = x^2 + 2y^2$ at $(1.5, 1)$, $-\\nabla h = (-3, -4)$. The floor is at $(0, 0)$, in the direction $(-1.5, -1)$ from you. What does this show?"
    options:
      - id: a
        text: "The steepest way down right here need not point straight at the lowest point"
        correct: true
      - id: b
        text: 'The gradient has been computed wrongly, because $-\nabla h$ always points at the minimum'
        correct: false
        category: misunderstood_definition
        feedback: "The gradient only uses the slope where you stand. Here it is steeper in $y$, so it tilts towards $y$."
      - id: c
        text: 'Walking along $-\nabla h$ makes you go uphill'
        correct: false
        category: incorrect_reasoning
        feedback: 'For a small step along $-\nabla h$ the height falls, at rate $\|\nabla h\| = 5$.'
      - id: d
        text: "The valley has no lowest point"
        correct: false
        category: incorrect_reasoning
        feedback: 'The floor is at $(0, 0)$, where $h = 0$ and $\nabla h = (0, 0)$.'
    solution: "The negative gradient uses the slopes where you stand, not the location of the lowest point. Here the height changes at rates 3 eastward and 4 northward, so the steepest downhill direction is $(-3, -4)$. That is not parallel to $(-1.5, -1)$, the direction toward the lowest point."
  - id: gradp-descent-step
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "At $(1.5, 1)$ the valley has $h = 4.25$ and $\\nabla h = (3, 4)$. You take the small step $\\delta = -0.02\\,\\nabla h$. Estimate the new height."
    answer: 3.75
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -0.5,
          category: incomplete_explanation,
          feedback: "That is the change. Add it to the starting height 4.25.",
        }
      - {
          answer: 4.75,
          category: math_error,
          feedback: "The step is opposite the gradient, so the height should go down.",
        }
    hints: ["$\\delta = (-0.06, -0.08)$.", "Change $\\approx \\nabla h \\cdot \\delta$."]
    solution: "$\\delta = (-0.06, -0.08)$, so $\\nabla h \\cdot \\delta = -0.18 - 0.32 = -0.5$ and the height is about $4.25 - 0.5 = 3.75$ m."
