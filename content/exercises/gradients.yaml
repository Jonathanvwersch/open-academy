        weight: 1
        required: true
      - id: point2
        criterion: "State that those derivatives are kept in input order."
        weight: 1
        required: true
    exemplar: "The gradient is a vector with one partial derivative for every input. Its components follow the input order."
  - id: grad-recall-gradient-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: grad-vector-of-partials
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: "Which quantity keeps the slopes for every input together at a point?"
    options:
      - id: a
