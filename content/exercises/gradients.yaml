  - id: grad-recall-descent-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: grad-steepest-descent
    difficulty: 1
    est_minutes: 0.5
    prompt: "A nonzero gradient has components $(a,b)$. Write the first component of the steepest downhill unit vector. Type `sqrt(...)` for a square root."
    answer: "-a/sqrt(a^2+b^2)"
    variables: { "a": [1, 5], "b": [1, 5] }
    solution: "Reverse the gradient and divide by its length. The first component is $-a/\\sqrt{a^2+b^2}$."
