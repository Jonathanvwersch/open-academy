    prompt: "In one or two sentences, at a point with a nonzero gradient, which direction gives the fastest decrease per unit distance, and how do you make it a unit vector?"
    rubric:
      - id: point1
        criterion: "State that the negative gradient points in the direction of fastest decrease."
        weight: 1
        required: true
      - id: point2
        criterion: "Explain that dividing the negative gradient by its length gives a unit direction."
        weight: 1
        required: true
    exemplar: "The negative gradient points steepest downhill. Divide it by its length to get a unit vector."
  - id: grad-recall-descent-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: grad-steepest-descent
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: "For a nonzero gradient, which direction gives zero directional slope?"
    options:
      - id: a
        text: "A direction perpendicular to the gradient"
        correct: true
        feedback: "Perpendicular vectors have zero dot product."
      - id: b
        text: "A direction along the gradient"
        correct: false
        feedback: "Along the gradient the slope is largest and positive."
      - id: c
        text: "A direction opposite the gradient"
        correct: false
        feedback: "Opposite the gradient the slope is smallest and negative."
