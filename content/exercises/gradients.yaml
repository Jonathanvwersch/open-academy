concept: gradients
exercises:
  - id: lab-gc-downhill-coordinate
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "At the point $(4,3)$ a surface has gradient $(6,20)$. You step downhill by subtracting $0.1$ times the gradient from the point. What is the new $y$ coordinate?"
    answer: 1
    tolerance: { abs: 0.001 }
    hints: ["Which way does the gradient point: uphill or downhill?"]
    solution: 'The new coordinate is $3-0.1\times20=1$.'
  - id: grad-vector-of-partials-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "At a point, what does the gradient contain?"
    options:
      - id: a
        text: "The function's height at that point, written as one number."
        correct: false
        feedback: "That is the function value; the gradient contains slopes."
      - id: b
        text: "One partial derivative for each input, in input order."
        correct: true
        feedback: "Each component is the slope for its matching input."
      - id: c
        text: "The coordinates of the nearest minimum of the function."
        correct: false
        feedback: "The gradient describes local slopes, not the location of a minimum."
      - id: d
        text: "One number equal to the sum of all partial derivatives."
        correct: false
        feedback: "Adding the partials loses which input each slope belongs to."
    solution: "The gradient is the vector of partial derivatives, with one component for each input."
  - id: grad-points-uphill-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "If you know the gradient and choose a unit direction, how do you find the slope in that direction?"
    options:
      - id: a
        text: "Take the dot product of the gradient and the chosen direction."
        correct: true
        feedback: "The dot product gives the gradient's component along that unit direction."
      - id: b
        text: "Add the gradient's components and use that total as the slope."
        correct: false
        feedback: "The total ignores which way you chose to move."
      - id: c
        text: "Use the gradient's length for every possible direction."
        correct: false
        feedback: "The gradient length is the slope only in the steepest-uphill direction."
      - id: d
        text: "Read the function value at the starting point as the slope."
        correct: false
        feedback: "The function value is height; the slope depends on the chosen direction."
    solution: "The dot product projects the gradient onto the chosen unit direction, giving one slope."
  - id: grad-steepest-descent-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "Among unit directions, what does steepest descent mean?"
    options:
      - id: a
        text: "The direction that lowers the function fastest nearby."
        correct: true
        feedback: "Steepest descent is the largest local decrease per unit distance."
      - id: b
        text: "The direction that reaches the lowest point in one step."
        correct: false
        feedback: "A steepest local step need not reach any minimum."
      - id: c
        text: "The direction that changes the greatest number of inputs."
        correct: false
        feedback: "Changing more inputs does not guarantee a faster decrease."
      - id: d
        text: "The direction in which the gradient's length grows fastest."
        correct: false
        feedback: "Descent is about lowering the function, not changing gradient length."
    solution: "Steepest descent is the unit direction that gives the greatest local decrease."
  - id: grad-check-1
    dimension: math
    type: text
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x, y) = x^2 + 3y^2$, what is $\\nabla f$ at $(2, -1)$? Answer as `(a, b)`."
    accept: ["(4,-6)", "(4, -6)", "4,-6", "4, -6", "[4,-6]", "[4, -6]"]
    hints: ["$\\nabla f = (2x, 6y)$."]
    solution: "$(2\\cdot2,\\ 6\\cdot(-1)) = (4, -6)$."
  - id: dx-math-4
    dimension: math
    type: text
    role: diagnostic
    difficulty: 2
    est_minutes: 3
    prompt: "For $f(w_1, w_2) = w_1^2 + 3w_1w_2$, compute $\\nabla f$ at $(w_1, w_2) = (1, 2)$. Answer as `(a, b)`."
    accept: ["(8,3)", "(8, 3)", "8,3", "8, 3", "[8,3]", "[8, 3]"]
    solution: "$\\partial f/\\partial w_1 = 2w_1 + 3w_2 = 8$ and $\\partial f/\\partial w_2 = 3w_1 = 3$, so $\\nabla f = (8, 3)$."
  - id: grad-core-1
    dimension: math
    type: text
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "For $f(x, y) = x y^2 - 2x$, compute $\\nabla f(3, 1)$. Answer as `(a, b)`."
    accept: ["(-1,6)", "(-1, 6)", "-1,6", "-1, 6", "[-1,6]", "[-1, 6]"]
    hints: ["$\\partial f/\\partial x = y^2 - 2$.", "$\\partial f/\\partial y = 2xy$."]
    solution: "$(1 - 2,\\ 2\\cdot3\\cdot1) = (-1, 6)$."
  - id: grad-descent-direction
    dimension: conceptual
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: >-
      A model's error $L$ has gradient $\nabla L=(3,-4)$ with respect to its two weights, in weight order. Which unit direction in that same order gives the largest estimated decrease for the same small step size?
    options:
      - { id: a, text: "$(-0.6, 0.8)$", correct: true }
      - {
          id: b,
          text: "$(0.6, -0.8)$",
          correct: false,
          category: incorrect_reasoning,
          feedback: "That points along $+\\nabla L$, which increases the error fastest rather than decreasing it.",
        }
      - {
          id: c,
          text: "$(0.8, 0.6)$",
          correct: false,
          category: incorrect_reasoning,
          feedback: "This is at right angles to the gradient. The estimate using the current slopes therefore predicts no change in $L$.",
        }
      - {
          id: d,
          text: "$(-1, 0)$",
          correct: false,
          category: incorrect_reasoning,
          feedback: "This does decrease $L$, but more slowly: $\\nabla L \\cdot \\delta = -3$ versus $-5$ for the best direction.",
        }
    hints: ["Steepest descent is $-\\nabla L / \\|\\nabla L\\|$."]
    solution: "The gradient has length 5. Divide its negative by 5 to get $(-3, 4)/5 = (-0.6, 0.8)$. The error decreases at an estimated rate of 5 per unit distance in this direction."
  - id: grad-review-flat
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "A smooth function $f$ has a local minimum, meaning its value is no larger than at any nearby point. Assume its inputs can vary freely in every direction. What is $\\nabla f$ there?"
    options:
      - { id: a, text: "The zero vector", correct: true }
      - {
          id: b,
          text: "A vector pointing toward the lowest value anywhere in the function",
          correct: false,
          category: misunderstood_definition,
          feedback: "The gradient at a local minimum is determined by nearby changes, not by the lowest value somewhere far away. Use the first-order behavior around the point.",
        }
      - {
          id: c,
          text: "A vector of all ones",
          correct: false,
          category: recall_failure,
          feedback: "All ones would mean $f$ still increases when you step in any input direction, so stepping the other way would lower it. That cannot happen at a local minimum.",
        }
    solution: "At a local minimum every partial derivative is zero, otherwise you could step downhill."
  - id: grad-transfer-scale
    dimension: transfer
    type: mc
    role: transfer
    difficulty: 3
    est_minutes: 3
    prompt: "A model's loss, its numerical measure of error, is $L(w_1, w_2) = w_1^2 + 100\\,w_2^2$. Its weights start at $(1, 1)$. Each update subtracts $s\\nabla L$ from the weights, using one positive number $s$ to control the size of both changes. Which statement describes the difficulty?"
    options:
      - {
          id: a,
          text: "A small enough update to reduce the size of $w_2$ changes $w_1$ very slowly; a faster update for $w_1$ can make $w_2$ grow in size instead",
          correct: true,
        }
      - {
          id: b,
          text: "Both weights approach 0 at the same rate because the gradient points at the minimum",
          correct: false,
          category: misunderstood_definition,
          feedback: "The gradient $(2, 200)$ points steeply along $w_2$, not at the minimum $(0, 0)$.",
        }
      - {
          id: c,
          text: "The gradient is zero, so nothing happens",
          correct: false,
          category: math_error,
          feedback: "At $(1, 1)$ the gradient is $(2, 200)$, not zero. Compare how steep the loss is along $w_1$ and along $w_2$.",
        }
    hints: ["Compute $\\nabla L(1,1)$ and compare the two components."]
    solution: "$\\nabla L(1,1) = (2, 200)$. Each step multiplies $w_2$ by $1 - 200s$, so $w_2$ only shrinks if $s < 0.01$. At $s = 0.01$, each step multiplies $w_1$ by $1 - 2s = 0.98$, so it shrinks by only 2% per step. This mismatch motivates rescaling features and using methods that adjust the step size."
  - id: grad-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: 'Using $f(x,y)=x^2+2y^2$ at $P=(1.5,1)$, or a hill of your own, explain in your own words: what the gradient at a point tells you, how you get the slope in any chosen direction from it, and why a small step along $-\nabla f$ lowers the function fastest.'
    rubric:
      - {
          id: what-gradient,
          criterion: "Says the gradient is the vector of partial derivatives, pointing in the direction of steepest ascent, with length equal to that steepest slope.",
          weight: 2,
          required: true,
        }
      - {
          id: directional,
          criterion: "Says the slope in a chosen unit direction $u$ is the dot product $\\nabla f\\cdot u$ (the directional derivative), a single number for each direction.",
          weight: 2,
          required: true,
        }
      - {
          id: descent,
          criterion: "Explain that $\\nabla f\\cdot u = \\|\\nabla f\\|\\cos\\theta$ is most negative at $\\theta=180^\\circ$, so $-\\nabla f$ gives the steepest local decrease.",
          weight: 1,
          required: true,
        }
    exemplar: "The gradient at a point collects the partial derivatives, here $(3, 4)$. It is a vector pointing in the direction where $f$ rises fastest, and its length, $5$, is that fastest slope. To get the slope in any other direction, take a unit vector $u$ for that direction and compute $\\nabla f\\cdot u$: for $u=(0.6, 0.8)$ it is $5$, for $(0.8, -0.6)$ it is $0$, and for $(-0.6, -0.8)$ it is $-5$. Because $\\nabla f\\cdot u = \\|\\nabla f\\|\\cos\\theta$, the slope is most negative when $u$ points opposite the gradient, so a small step along $-\\nabla f$ lowers $f$ fastest."
  - id: gradp-why-vector
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why keep the slopes as $(3,4)$ instead of adding them to get $7$?"
    options:
      - id: a
        text: "The $3$ is the x-slope and $4$ is the y-slope; the order keeps each slope tied to its input."
        correct: true
        feedback: "The first entry is the x-partial and the second is the y-partial; their sum loses that assignment."
      - id: b
        text: "The $3$ and $4$ are the coordinates of $P$; adding them gives the bowl's height there."
        correct: false
        category: misunderstood_definition
        feedback: "Coordinates locate $P$; the gradient contains the slopes, which are 3 along x and 4 along y."
      - id: c
        text: "The entries measure the x-slope at different steps; adding them combines both changes."
        correct: false
        category: misunderstood_definition
        feedback: "The entries are slopes for separate inputs at the same point, not repeated x-slopes."
      - id: d
        text: "A gradient is one total slope, so adding $3$ and $4$ gives its rate regardless of direction."
        correct: false
        category: incorrect_reasoning
        feedback: "The slope depends on direction; the ordered vector preserves enough information to find it."
    solution: "The 3 is the slope along x and the 4 is the slope along y. Keeping their order preserves which input each slope belongs to; the sum 7 loses that information."
  - id: gradp-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "For $f(x,y)=x^2+2y^2$ at $(1.5,1)$, a learner writes the gradient as $(4,3)$. What is the mistake?"
    options:
      - id: a
        text: "The partial derivatives are in the wrong input order."
        correct: true
        category: misunderstood_definition
        feedback: "The x-partial is 3 and the y-partial is 4, so the gradient is $(3,4)$."
      - id: b
        text: "The two partial derivatives should be added into one number."
        correct: false
        category: misunderstood_definition
        feedback: "Adding them gives 7 and loses which input each slope belongs to."
      - id: c
        text: "The gradient should contain the function value as well."
        correct: false
        category: misunderstood_definition
        feedback: "The function value is 4.25; the gradient contains only partial derivatives."
      - id: d
        text: "Both partial derivatives should be zero away from the bowl's bottom."
        correct: false
        category: incorrect_reasoning
        feedback: "The slopes are 3 and 4 at this point; they are both zero only at the bottom."
    solution: "The x-partial is 3 and comes first; the y-partial is 4 and comes second, so the gradient is $(3,4)$."
  - id: gradp-compute
    dimension: math
    type: text
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $f(x,y)=x^2+2y^2$, compute $\\nabla f$ at $P=(1.5,1)$. Answer as `(a, b)`."
    accept: ["(3,4)", "(3, 4)", "3,4", "3, 4", "[3,4]", "[3, 4]"]
    hints: ["Differentiate with respect to x and y separately."]
    solution: "The partials are $2x=3$ and $4y=4$ at $P$, so in input order $\\nabla f(P)=(3,4)$."
  - id: gradp-component
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "For $g(x,y)=2x^2+xy$, what is the x-component of $\\nabla g$ at $(1,2)$?"
    answer: 6
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 2,
          category: math_error,
          feedback: "Differentiate $2x^2$ to get $4x$ and $xy$ with respect to x to get $y$; then substitute $(1,2)$.",
        }
    solution: "The x-partial is $4x+y$. At $(1,2)$ it is $4+2=6$."
  - id: gradp-three-inputs
    dimension: math
    type: text
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "For $q(x,y,z)=x^2+yz$, compute $\\nabla q$ at $(1,2,3)$. Answer as `(a, b, c)`."
    accept: ["(2,3,2)", "(2, 3, 2)", "2,3,2", "2, 3, 2", "[2,3,2]", "[2, 3, 2]"]
    hints: ["Take one partial for x, one for y and one for z."]
    solution: "The partials are $2x$, $z$ and $y$, so at $(1,2,3)$ the gradient is $(2,3,2)$."
  - id: gradp-flat-point
    dimension: math
    type: text
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "For $f(x,y)=x^2-2x+y^2+4y$, at which point is $\\nabla f=(0,0)$? Answer as `(a, b)`."
    accept: ["(1,-2)", "(1, -2)", "1,-2", "1, -2", "[1,-2]", "[1, -2]"]
    hints:
      - "$\\nabla f=(2x-2,2y+4)$."
      - "Set both components to zero."
    solution: "Setting $2x-2=0$ and $2y+4=0$ gives $x=1$ and $y=-2$, so the gradient is zero at $(1,-2)$."
  - id: gradp-robot-gradient
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A robot is at $(1,2)$ on a surface with height $h(x,y)=x^2+3y^2$. Which vector is the gradient of its height there?"
    options:
      - id: a
        text: "$(2,12)$, one height slope for each coordinate."
        correct: true
        feedback: "The partials are $2x=2$ and $6y=12$ at $(1,2)$."
      - id: b
        text: "$(2,6)$, using the coefficients of the squared terms."
        correct: false
        category: math_error
        feedback: "The y-partial is $6y$, so substitute $y=2$ to get 12."
      - id: c
        text: "$(1,12)$, using the x-coordinate without differentiating."
        correct: false
        category: math_error
        feedback: "The x-partial is $2x$, which is 2 at $x=1$."
      - id: d
        text: "$(1,2)$, the robot's current position."
        correct: false
        category: misunderstood_definition
        feedback: "The position gives the input coordinates; the gradient contains the surface's partial derivatives."
    solution: "The partial derivatives are $(2x,6y)$, which equal $(2,12)$ at $(1,2)$."
  - id: gradp-approx
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why does the dot product give one number for a chosen direction, and why must $\\mathbf u$ have length 1?"
    options:
      - id: a
        text: "It adds each gradient component's contribution along $\\mathbf u$; unit length makes the result change per unit distance."
        correct: true
        feedback: "The dot product projects the gradient onto one direction, and a unit vector represents one unit of travel."
      - id: b
        text: "It selects the largest gradient component; unit length makes that selected component a per-unit slope."
        correct: false
        category: incorrect_reasoning
        feedback: "Both components can contribute; the dot product weights them by the chosen direction."
      - id: c
        text: "It returns the gradient's length in every direction; unit length removes any scaling from the angle."
        correct: false
        category: misunderstood_definition
        feedback: "Only the gradient direction gives its full length; other directions give different projections."
      - id: d
        text: "It measures distance walked; unit length turns that distance into the function's slope."
        correct: false
        category: misunderstood_definition
        feedback: "The dot product gives a rate of change, not distance; unit length sets the distance scale."
    solution: "The dot product combines the gradient components along one chosen direction, so it gives one slope. A unit vector represents one unit of travel, making that slope a rate per unit distance."
  - id: gradp-direction-rate
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "At $P$, $\\nabla f(P)=(3,4)$. What is the slope in the unit direction $(1,0)$?"
    answer: 3
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 4,
          category: math_error,
          feedback: "The vector $(1,0)$ selects the x-component, which is 3.",
        }
    solution: "$\\nabla f(P)\\cdot(1,0)=3(1)+4(0)=3$."
  - id: gradp-contour
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "At $P$, $\\nabla f(P)=(3,4)$. Which unit direction gives a predicted slope of zero?"
    options:
      - id: a
        text: "$(0.8,-0.6)$"
        correct: true
        feedback: "$3(0.8)+4(-0.6)=2.4-2.4=0$."
      - id: b
        text: "$(0.6,0.8)$"
        correct: false
        category: incorrect_reasoning
        feedback: "This points along the gradient and has slope 5."
      - id: c
        text: "$(-0.6,-0.8)$"
        correct: false
        category: incorrect_reasoning
        feedback: "This points opposite the gradient and has slope -5."
      - id: d
        text: "$(1,0)$"
        correct: false
        category: math_error
        feedback: "The slope along $+x$ is 3, not zero."
    solution: "The dot product with $(0.8,-0.6)$ is $3(0.8)+4(-0.6)=0$, so it has zero slope."
  - id: gradp-predict-height
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "At $P$, $f(P)=4.25$ and $\\nabla f(P)=(3,4)$. For the small step $\\delta=(0.01,0.02)$, estimate the new value of $f$."
    answer: 4.36
    tolerance: { abs: 0.001 }
    hints:
      - "Estimate the change with $\\nabla f(P)\\cdot\\delta$."
      - "Add that change to 4.25."
    solution: "The estimated change is $3(0.01)+4(0.02)=0.11$, so the estimated new value is $4.25+0.11=4.36$."
  - id: gradp-small-step
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "At $P$, a learner computes $\\nabla f(P)\\cdot(2,0)=6$. What is the slope per unit distance along the positive x-axis?"
    options:
      - id: a
        text: "$3$, dividing the change estimate by the step length."
        correct: true
        category: misunderstood_definition
        feedback: "The step has length 2, so the slope per unit distance is 6/2."
      - id: b
        text: "$6$, using the dot product without rescaling the step."
        correct: false
        category: misunderstood_definition
        feedback: "The dot product uses a step of length 2; divide by that length."
      - id: c
        text: "$12$, multiplying the change estimate by the step length."
        correct: false
        category: misunderstood_definition
        feedback: "Multiplying by the length scales the estimate up again; divide by 2."
      - id: d
        text: "$-3$, reversing the sign when normalising the step."
        correct: false
        category: math_error
        feedback: "Normalising preserves the positive x direction, so the sign stays positive."
    solution: "The step $(2,0)$ has length 2. Dividing the change estimate 6 by 2 gives a slope of 3 per unit distance along the positive x-axis."
  - id: gradp-target-drop
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: >-
      A model loss has gradient $(3,-2)$ with respect to its first and second parameters, in that order. If only the second parameter changes, what step in that parameter estimates a loss decrease of 0.1?
    answer: 0.05
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -0.05,
          category: math_error,
          feedback: "The second partial is -2, so a positive step makes the estimated loss change negative.",
        }
      - { answer: 0.2, category: math_error, feedback: "Set $-2\\delta_2=-0.1$ and divide by -2." }
    hints:
      - "The step is $(0,\\delta_2)$, so the estimated change is $-2\\delta_2$."
      - "Set that change equal to $-0.1$."
    solution: "Solve $-2\\delta_2=-0.1$ to get $\\delta_2=0.05$. The positive step lowers the loss because its partial derivative is negative."
  - id: gradp-robot-direction
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A robot is at $(1,1)$ on a surface with height $h(x,y)=x^2+3y^2$. Its unit walking direction is $(0.6,0.8)$. What is the directional derivative of its height?"
    answer: 6
    tolerance: { abs: 0.001 }
    hints: ["At $(1,1)$, the gradient is $(2,6)$. Take its dot product with the walking direction."]
    solution: "The gradient is $(2,6)$, so the slope is $(2,6)\\cdot(0.6,0.8)=1.2+4.8=6$."
  - id: gradp-steepest-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why does the gradient direction give slope 5, the opposite direction slope -5, and a perpendicular direction slope 0?"
    options:
      - id: a
        text: "For unit $\\mathbf u$, the slope is $5\\cos\\theta$: the cosines are $1$ along, $-1$ opposite, and $0$ perpendicular."
        correct: true
        feedback: "The dot-product formula is $D_{\\mathbf u}f=\\|\\nabla f\\|\\cos\\theta$, and here the gradient length is 5."
      - id: b
        text: "The gradient has length $5$ in every direction, so all three slopes should have magnitude $5$."
        correct: false
        category: misunderstood_definition
        feedback: "The length is the steepest slope; other directions scale it by the cosine of their angle."
      - id: c
        text: "The opposite vector has length $-1$ and the perpendicular vector length $0$, scaling the gradient."
        correct: false
        category: incorrect_reasoning
        feedback: "All three directions are unit length; the sign and zero come from their angles, not their lengths."
      - id: d
        text: "The signs of the direction's coordinates alone determine the three slopes, regardless of the angle."
        correct: false
        category: incorrect_reasoning
        feedback: "The dot product depends on the angle between the vectors, not just the coordinate signs."
    solution: "For a unit direction, the slope is $\\|\\nabla f\\|\\cos\\theta=5\\cos\\theta$. The directions along, opposite, and perpendicular to the gradient have cosines $1$, $-1$, and $0$, giving slopes $5$, $-5$, and $0$."
  - id: gradp-why-180
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: "For equal-length unit directions, why is the slope most negative at an angle of $180^\\circ$ to the gradient?"
    options:
      - id: a
        text: "The cosine is $-1$ there, the smallest possible value."
        correct: true
        feedback: "The dot-product formula makes the slope smallest when $\\cos\\theta=-1$."
      - id: b
        text: "The cosine is $0$ there, so the slope disappears."
        correct: false
        category: recall_failure
        feedback: "The cosine is 0 at $90^\\circ$; at $180^\\circ$ it is $-1$."
      - id: c
        text: "The opposite direction has a greater length than the others."
        correct: false
        category: incorrect_reasoning
        feedback: "All directions are unit length, so their lengths are equal."
      - id: d
        text: "Every gradient points in the negative coordinate directions."
        correct: false
        category: misunderstood_definition
        feedback: "Gradient components can have either sign; the angle explains the decrease."
    solution: "For unit directions the slope is $\\|\\nabla f\\|\\cos\\theta$. The cosine is smallest, at $-1$, when the direction is opposite the gradient."
  - id: gradp-length
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "For $f(x,y)=x^2+2y^2$, compare $P=(1.5,1)$ and $Q=(0,1)$. Where is the steepest uphill slope larger?"
    options:
      - id: a
        text: "At P: the steepest slopes are $5$ at P and $4$ at Q."
        correct: true
        feedback: "The gradient lengths are 5 at P and 4 at Q."
      - id: b
        text: "At P: the steepest slopes are $4.25$ at P and $2$ at Q."
        correct: false
        category: misunderstood_definition
        feedback: "These are function values. Steepest slope is measured by the gradient length."
      - id: c
        text: "They are equal: the largest partial derivative is $4$ at both."
        correct: false
        category: misunderstood_definition
        feedback: "Combining both partial derivatives can give a larger slope than either component."
      - id: d
        text: "At Q: its slope is $4$, while P has slope $5/\\sqrt{3.25}$."
        correct: false
        category: math_error
        feedback: "The position vector length does not normalise a slope; compare the gradient lengths directly."
    solution: "The gradient is $(2x,4y)$, giving $(3,4)$ at P and $(0,4)$ at Q. Their lengths are 5 and 4, so the steepest uphill slope is larger at P."
  - id: gradp-descent-unit
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "At $P$, $\\nabla f(P)=(3,4)$. Which unit direction gives the steepest local decrease?"
    options:
      - id: a
        text: "$(-0.6,-0.8)$"
        correct: true
        feedback: "This is $-\\nabla f/\\|\\nabla f\\|$, the unit direction opposite the gradient."
      - id: b
        text: "$(0.6,0.8)$"
        correct: false
        category: incorrect_reasoning
        feedback: "This points along the gradient and gives steepest increase."
      - id: c
        text: "$(0.8,-0.6)$"
        correct: false
        category: incorrect_reasoning
        feedback: "This is perpendicular to the gradient, so its first-order slope is zero."
      - id: d
        text: "$(-3,-4)$"
        correct: false
        category: misapplied_technique
        feedback: "It points downhill but has length 5; divide by 5 to make a unit direction."
    solution: "The gradient has length 5, so the opposite unit direction is $-(3,4)/5=(-0.6,-0.8)$."
  - id: gradp-steepest-rate
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "At $P$, $\\nabla f(P)=(3,4)$. What is the slope for a unit step in the steepest-downhill direction?"
    answer: -5
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 5,
          category: incorrect_reasoning,
          feedback: "The gradient length 5 is the uphill slope; the opposite direction has slope -5.",
        }
    solution: "The steepest-downhill slope is the negative gradient length, $-\\sqrt{3^2+4^2}=-5$."
  - id: gradp-descent-step
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: "At $P$, $f(P)=4.25$ and $\\nabla f(P)=(3,4)$. For the small step $\\delta=-0.02\\nabla f(P)$, estimate the new value of $f$."
    answer: 3.75
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -0.5,
          category: incomplete_explanation,
          feedback: "That is the estimated change. Add it to the starting value 4.25.",
        }
      - {
          answer: 4.75,
          category: math_error,
          feedback: "A step opposite the gradient should lower the function.",
        }
    hints:
      - "$\\delta=(-0.06,-0.08)$."
      - "Estimate the change with $\\nabla f(P)\\cdot\\delta$."
    solution: "The estimated change is $3(-0.06)+4(-0.08)=-0.5$, so the estimated new value is $4.25-0.5=3.75$."
  - id: gradp-not-at-minimum
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "For $f(x,y)=x^2+2y^2$ at $P=(1.5,1)$, which vector points in the steepest local descent direction?"
    options:
      - id: a
        text: "$(-3,-4)$, taking the negative of each partial derivative."
        correct: true
        category: misunderstood_definition
        feedback: "The negative gradient points in the direction of steepest local decrease."
      - id: b
        text: "$(-1.5,-1)$, taking the vector from P to the minimum."
        correct: false
        category: math_error
        feedback: "The vector to the minimum can differ from the steepest local descent direction."
      - id: c
        text: "$(-4,-3)$, swapping the two negative partial derivatives."
        correct: false
        category: incorrect_reasoning
        feedback: "Each partial belongs to its matching input; swapping components changes the direction."
      - id: d
        text: "$(3,4)$, taking the positive values of the partial derivatives."
        correct: false
        category: incorrect_reasoning
        feedback: "The positive gradient points in the direction of steepest local increase."
    solution: "The gradient at P is $(3,4)$, so steepest local descent points along $(-3,-4)$. The vector to the minimum $(0,0)$ is $(-1.5,-1)$, which is not parallel: steepest descent need not point straight at the minimum."
  - id: gradp-robot-descent
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A robot is at $(3,4)$ on a surface with height $h(x,y)=x^2+y^2$. Which unit direction gives the steepest local decrease, and what is its slope?"
    options:
      - id: a
        text: "$(-0.6,-0.8)$, with slope $-10$."
        correct: true
        feedback: "The gradient is $(6,8)$ with length 10; its opposite unit direction has slope -10."
      - id: b
        text: "$(0.6,0.8)$, with slope $10$."
        correct: false
        category: incorrect_reasoning
        feedback: "That is the steepest uphill direction, not downhill."
      - id: c
        text: "$(-1,0)$, with slope $-6$."
        correct: false
        category: misapplied_technique
        feedback: "This lowers the height, but less steeply than the direction opposite $(6,8)$."
      - id: d
        text: "$(-0.8,-0.6)$, with slope $-9.6$."
        correct: false
        category: math_error
        feedback: "This is a downhill direction, but its slope is -9.6, not the steepest possible slope -10."
    solution: "The gradient is $(6,8)$ with length 10, so the steepest downhill unit direction is $-(6,8)/10=(-0.6,-0.8)$ and its slope is $-10$."
  - id: grad-recall-gradient-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: grad-vector-of-partials
