        weight: 1
        required: true
      - id: rule
        criterion: Explain that a square matrix is symmetric when it equals its transpose.
        weight: 1
        required: true
    exemplar: Transposing turns row 1 into column 1, row 2 into column 2, and so on. A square matrix is symmetric when transposing leaves it unchanged.
  - id: inv-recall-transpose-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: inv-transpose
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: Which property must hold for a symmetric matrix?
    options:
      - id: a
        text: Every entry on the main diagonal equals $1$.
        correct: false
        feedback: The identity has 1s on the diagonal. A symmetric matrix can have other diagonal entries.
      - id: b
        text: Multiplying it by its inverse always gives $I$.
        correct: false
        feedback: Every invertible matrix has that property. Symmetry asks whether transposing leaves the matrix unchanged.
      - id: c
        text: Its entries match across the main diagonal.
        correct: true
        feedback: Matching entries across the diagonal mean A equals its transpose.
    solution: A symmetric matrix equals its transpose, so mirror entries across the main diagonal agree.
  - id: inv-recall-transpose-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: inv-transpose
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the blank: $(AB)^\\top=\\underline{\\quad\\quad}$."
    accept:
      - B^T A^T
      - B^T*A^T
      - B^top A^top
      - B^\top A^\top
      - B^{\top}A^{\top}
      - B.T @ A.T
      - transpose(B) transpose(A)
      - BᵀAᵀ
      - Bᵀ Aᵀ
      - transpose(B) @ transpose(A)
    regex: ^\s*(?:b\s*\^\s*\{?\s*\\?(?:t|top)\s*\}?\s*(?:\*|\\cdot)?\s*a\s*\^\s*\{?\s*\\?(?:t|top)\s*\}?|b\s*\.\s*t\s*@\s*a\s*\.\s*t|transpose\s*\(\s*b\s*\)\s*\*?\s*transpose\s*\(\s*a\s*\))\s*$
    solution: "Transposing a product reverses the order: $(AB)^\\top=B^\\top A^\\top$."
  - id: inv-recall-numpy-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: inv-numpy
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, why use `np.linalg.solve(A, b)` to solve a system, and how should you check the resulting output?
    rubric:
      - id: meaning
        criterion: Explain that solve runs elimination directly and avoids calculating the whole inverse.
        weight: 1
        required: true
      - id: rule
        criterion: Explain that np.allclose(A @ x, b) allows tiny rounding differences when checking the answer.
        weight: 1
        required: true
    exemplar: Use solve to eliminate directly, avoiding the extra arithmetic of the whole inverse. Check with np.allclose(A @ x, b), which allows tiny rounding differences.
  - id: inv-recall-numpy-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: inv-numpy
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: A computed solution reproduces $b$ apart from a tiny last-digit rounding difference. Which check fits this situation?
    options:
      - id: a
        text: "`np.allclose(A @ x, b)`"
        correct: true
        feedback: allclose allows tiny differences caused by finite computer precision.
      - id: b
        text: "`A @ x == b`"
        correct: false
        feedback: Exact equality can reject a good answer over a tiny rounding difference.
      - id: c
        text: "`np.allclose(A @ b, x)`"
        correct: false
        feedback: This reverses the roles of input and output. The system requires A @ x to reproduce b.
    solution: Use `np.allclose(A @ x, b)` to check the original equations while allowing tiny rounding differences.
  - id: inv-recall-numpy-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: inv-numpy
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the blank to solve $Ax=b$ directly in NumPy: `x = np.linalg.____(A, b)`."
    accept:
