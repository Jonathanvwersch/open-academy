concept: inverses-linear-systems
exercises:
  - id: inv-identity-inverse-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: >-
      For an invertible matrix $A$, how do the identity matrix $I$ and the inverse matrix $A^{-1}$ each act on vectors?
    options:
      - id: a
        text: I leaves vectors unchanged; the inverse undoes A.
        correct: true
        feedback: The identity leaves every vector unchanged.
      - id: b
        text: I sends vectors to zero; the inverse undoes A.
        correct: false
        feedback: The zero matrix sends vectors to zero.
      - id: c
        text: I leaves vectors unchanged; the inverse applies A twice.
        correct: false
        feedback: Repeating A does not generally undo it.
    solution: The identity leaves every input unchanged, and $A^{-1}A=I$.
  - id: inv-ii-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked example, why multiply $A$ by the inverse that the formula gave?
    options:
      - id: a
        text: Getting A would show that doing both matrices gives back every input.
        correct: false
        feedback: A can change the input.
      - id: b
        text: Getting zero would show that doing both matrices gives back every input.
        correct: false
        feedback: A zero product loses the input.
      - id: c
        text: Getting I would show that doing both matrices gives back every input.
        correct: true
        feedback: That is the inverse property.
    solution: The product must equal $I$ to show the two matrices undo each other.
    lesson_only: true
  - id: inv-ii-identity-product
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: >-
      Matrix $A$ has rows $(4,-2)$ and $(3,5)$. Let $I$ be the $2\times2$ identity matrix. Find the entry in row 2, column 1 of $AI$.
    answer: 3
    solution: Since $AI=A$, the entry is 3.
    tolerance:
      abs: 0.000001
  - id: inv-ii-pick-inverse
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Matrix $A$ has rows $(3,1)$ and $(1,1)$. Which rows form $A^{-1}$?
    options:
      - id: a
        text: $(1,-1)$ and $(-1,3)$
        correct: false
        feedback: This forgets to divide by the determinant, 2.
      - id: b
        text: (0.5,0.5) and (0.5,1.5)
        correct: false
        feedback: The top-right and bottom-left entries must change signs.
      - id: c
        text: $(0.5,-0.5)$ and $(-0.5,1.5)$
        correct: true
        feedback: The determinant is 2, so divide the swapped and sign-changed entries by 2.
      - id: d
        text: (1/3,1) and (1,1)
        correct: false
        feedback: Taking 1 over each entry does not undo a matrix.
    solution: The determinant is 2. Swap diagonal entries, change the other signs, and divide by 2.
  - id: inv-ii-entry-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Matrix $A$ has rows $({{=p}},1)$ and $({{=p*q-1}},{{=q}})$. Find entry $(2,1)$ of $A^{-1}$.
    params:
      p:
        min: 2
        max: 4
      q:
        min: 2
        max: 4
    answer_expr: 1-p*q
    solution: The determinant is 1. Change the sign of entry $(2,1)$ to get {{=1-p*q}}.
    tolerance:
      abs: 0.000001
  - id: inv-ii-missing-entry
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Matrix $A$ has rows $(2,1)$ and $(1,1)$. Matrix $C$ has rows $(1,-1)$ and $(-1,k)$. Find $k$
      so that $C=A^{-1}$.
    answer: 2
    solution: Entry $(1,2)$ of $AC$ must be zero, so $-2+k=0$. With $k=2$, both products give $I$.
    tolerance:
      abs: 0.000001
  - id: inv-ii-product-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: >-
      Let $A$ and $B$ be invertible matrices and $x$ a column vector. Which matrix takes the result $ABx$ back to $x$?
    options:
      - id: a
        text: $B^{-1}A^{-1}$
        correct: true
        feedback: Undo A first, then B.
      - id: b
        text: $A^{-1}B^{-1}$
        correct: false
        feedback: Keeping the old order need not bring inverse factors together.
      - id: c
        text: $AB$
        correct: false
        feedback: Repeating a transformation does not generally undo it.
    solution: The rule is $(AB)^{-1}=B^{-1}A^{-1}$.
  - id: inv-ii-colour-filter
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: >-
      A filter maps a pixel's original intensities $x=(r,g)$ in (red, green) order to filtered intensities $b=Ax$ in the same order. The rows of $A$ are $(2,1)$ and $(1,1)$. A filtered pixel is $(17,10)$. What was its original red intensity $r$?
    answer: 7
    solution: The first row of the inverse is $(1,-1)$, so $r=17-10=7$.
    tolerance:
      abs: 0.000001
  - id: inv-elimination-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: What does elimination do to solve equations?
    options:
      - id: a
        text: Replaces each number in the equations with 1 over that number.
        correct: false
        feedback: Taking 1 over each number does not solve the equations.
      - id: b
        text: Changes numbers multiplying unknowns while keeping all totals fixed.
        correct: false
        feedback: Equation operations must also update right-hand sides.
      - id: c
        text: Subtracts multiples of equations to remove unknowns.
        correct: true
        feedback: These operations leave the solution unchanged.
    solution: Elimination removes unknowns, then puts solved values back.
  - id: inv-el-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: Why subtract augmented row $(0,2,1\mid8)$ from row $(0,2,5\mid24)$ when solving for $x_1,x_2,x_3$?
    options:
      - id: a
        text: It makes both right-hand sides zero.
        correct: false
        feedback: The resulting right-hand side is $24-8=16$.
      - id: b
        text: It removes $x_2$ and leaves an equation for $x_3$.
        correct: true
        feedback: The $2x_2$ terms cancel, leaving $4x_3=16$.
      - id: c
        text: It removes $x_3$ and leaves an equation for $x_2$.
        correct: false
        feedback: The $x_3$ terms become $5x_3-x_3=4x_3$.
    solution: The subtraction gives augmented row $(0,0,4\mid16)$, so $x_3=4$. Put this value back into the earlier rows to find the other unknowns.
    lesson_only: true
  - id: inv-el-write-matrix
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: >-
      Consider the equations $3x_1+2x_2=12$ and $x_1+4x_2=14$, with unknowns in the column vector $x=(x_1,x_2)$. Which coefficient matrix $A$ and right-hand-side vector $b$ write this system as $Ax=b$?
    options:
      - id: a
        text: A has rows (3,2), (1,4); b=(12,14).
        correct: true
        feedback: Each equation supplies one row and its total.
      - id: b
        text: A has rows (3,1), (2,4); b=(12,14).
        correct: false
        feedback: This puts the equations in columns.
      - id: c
        text: A has rows (3,2), (1,4); b=(14,12).
        correct: false
        feedback: This reverses totals without reversing rows.
    solution: Keep the numbers multiplying unknowns and the total from each equation together.
  - id: inv-el-two-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Solve $2x_1+x_2={{=u}}$ and $x_1+x_2={{=v}}$. What is $x_1$?
    params:
      u:
        min: 11
        max: 13
      v:
        min: 7
        max: 9
    answer_expr: u-v
    solution: Subtracting the second equation from the first leaves $x_1={{=u}}-{{=v}}={{=u-v}}$.
    tolerance:
      abs: 0.000001
  - id: inv-el-inverse-route
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: >-
      In the system $Ax=b$, the rows of the inverse coefficient matrix $A^{-1}$ are $(2,-1)$ and $(-1,1)$. The right-hand-side vector is $b=(7,4)$. What is the second entry $x_2$ of the solution vector $x$?
    answer: -3
    solution: The second row of $A^{-1}$ dotted with $b$ gives $-7+4=-3$.
    tolerance:
      abs: 0.000001
  - id: inv-el-no-solution
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Eliminating on $2x_1+2x_2=8$ and $x_1+x_2=5$ leaves $0=-2$. What does this mean?
    options:
      - id: a
        text: Every pair satisfies both equations.
        correct: false
        feedback: That would need a true statement after removing unknowns.
      - id: b
        text: The unique solution is $(0,-2)$.
        correct: false
        feedback: The remaining statement has no unknowns and is false.
      - id: c
        text: No pair satisfies both equations.
        correct: true
        feedback: The false statement rules out every pair.
    solution: Subtracting twice the second equation gives a contradiction, so no solution exists.
  - id: inv-el-three-unknowns
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Solve $x_1+x_2+x_3=10$, $x_1+2x_2+3x_3=23$, and $x_1+3x_2+6x_3=41$. Find $x_3$.
    answer: 5
    solution:
      Subtract the first equation from the other two to get $x_2+2x_3=13$ and $2x_2+5x_3=31$.
      Subtract twice the first result to get $x_3=5$.
    tolerance:
      abs: 0.000001
  - id: inv-el-augmented-three
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: The augmented matrix for unknowns $x_1,x_2,x_3$ is $\left[\begin{array}{ccc|c}0&1&1&7\\1&1&1&9\\2&3&5&33\end{array}\right]$. What is $x_2$ in its solution?
    answer: 3
    tolerance: { abs: 0.000001 }
    common_wrong:
      - answer: 4
        category: incorrect_reasoning
        feedback: That is $x_3$. Put it into the equation $x_2+x_3=7$ to find $x_2$.
      - answer: 7
        category: incorrect_reasoning
        feedback: The first total includes both $x_2$ and $x_3$. Eliminate and back-substitute to separate them.
    solution: Swap rows 1 and 2, subtract twice row 1 from row 3, then subtract row 2 from row 3 to get $(0,0,2\mid8)$. Thus $x_3=4$, and row 2 gives $x_2=7-4=3$.
  - id: inv-el-swap-needed
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: During elimination for $x_1,x_2,x_3$, the augmented matrix is $\left[\begin{array}{ccc|c}1&1&0&5\\0&0&2&8\\0&3&1&10\end{array}\right]$. Which next operation puts a nonzero second pivot on the diagonal while preserving the solution?
    options:
      - id: swap-whole-rows
        text: Swap the whole second and third rows, including their totals.
        correct: true
        feedback: The third row supplies the second-column pivot 3. Moving its total with it keeps the same equation.
      - id: swap-left-block
        text: Swap the second and third rows of the left block, keeping the totals fixed.
        correct: false
        feedback: This attaches 8 to the wrong left side and 10 to the other one, changing both equations.
      - id: replace-zero
        text: Replace the zero in row 2, column 2 by 1, keeping every other entry.
        correct: false
        feedback: Changing one number changes the equation. A row operation must act on a whole equation.
    solution: Row 2 has zero in the second pivot position, and row 3 has 3 there. Swapping both complete augmented rows keeps every equation intact and supplies the pivot.
  - id: inv-el-fertiliser
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      Each kg of fertiliser P has 2 nitrogen units and 1 potassium unit. Each kg of Q has 1 unit
      of each. A crop needs 16 nitrogen units and 10 potassium units. How many kg of P should be
      used?
    answer: 6
    solution: For amounts $p,q$ in kg, $2p+q=16$ and $p+q=10$. Subtract to get $p=6$ kg.
    tolerance:
      abs: 0.000001
  - id: inv-transpose-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: >-
      What does transposing a matrix $A$ to obtain $A^\top$ do to its entries?
    options:
      - id: a
        text: Changes the signs of the top-right and bottom-left entries.
        correct: false
        feedback: Those sign changes belong to the 2 by 2 inverse formula.
      - id: b
        text: Turns each row into the corresponding column.
        correct: true
        feedback: Entry (i,j) moves to (j,i).
      - id: c
        text: Reverses entries within each row.
        correct: false
        feedback: Reversing a row does not swap row and column positions.
    solution: The transpose swaps rows and columns.
  - id: inv-tr-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does $B^\top A^\top$ match $(AB)^\top$ in the worked example?
    options:
      - id: a
        text: Transposing a product reverses the order of the matrices.
        correct: true
        feedback: The reversed order reproduces each dot product.
      - id: b
        text: Transposing a product keeps the order of the matrices unchanged.
        correct: false
        feedback: The worked product in the original order gives different entries.
      - id: c
        text: Transposing a product makes it symmetric.
        correct: false
        feedback: The example has different top-right and bottom-left entries.
    solution: The product rule is $(AB)^\top=B^\top A^\top$.
    lesson_only: true
  - id: inv-tr-entry-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: Matrix $A$ has rows $(1,{{=p}})$ and $({{=q}},2)$. Find $(A^\top)_{12}$.
    params:
      p:
        min: 3
        max: 5
      q:
        min: 6
        max: 8
    answer_expr: q
    solution: Entry $(1,2)$ of the transpose comes from entry $(2,1)$ of $A$, which is {{=q}}.
    tolerance:
      abs: 0.000001
  - id: inv-tr-dot-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: For column vectors $x=({{=p}},2)$ and $y=(3,{{=q}})$, find $x^\top y$.
    params:
      p:
        min: 2
        max: 4
      q:
        min: 4
        max: 6
    answer_expr: 3*p+2*q
    solution: "Pair matching entries: ${{=p}}\\times3+2\\times{{=q}}={{=3*p+2*q}}$."
    tolerance:
      abs: 0.000001
  - id: inv-tr-product-shapes
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: >-
      Matrix $A$ is $2\times3$ and matrix $B$ is $3\times4$. What is the shape of the transpose $(AB)^\top$ of their product?
    options:
      - id: a
        text: $2\times4$
        correct: false
        feedback: This is the shape before transposing.
      - id: b
        text: $3\times3$
        correct: false
        feedback: The inner dimensions check compatibility. The outer dimensions give the product shape.
      - id: c
        text: $4\times2$
        correct: true
        feedback: AB is 2 by 4, then transposing swaps dimensions.
    solution: AB has 2 rows and 4 columns, so its transpose has 4 rows and 2 columns.
  - id: inv-tr-pick-symmetric
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Which matrix is symmetric?
    options:
      - id: a
        text: Rows $(2,-3)$ and $(5,2)$.
        correct: false
        feedback: Equal diagonal entries do not ensure matching mirrored entries.
      - id: b
        text: Rows $(2,-3)$ and $(-3,5)$.
        correct: true
        feedback: Its mirrored entries match.
      - id: c
        text: Rows $(2,-3)$ and $(3,5)$.
        correct: false
        feedback: The top-right and bottom-left entries have different signs.
    solution: The matrix with rows $(2,-3)$ and $(-3,5)$ equals its transpose because its mirrored entries match.
  - id: inv-tr-gram-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Matrix $A$ has rows $({{=p}},1)$ and $(2,{{=q}})$. Find entry $(1,2)$ of $A^\top A$.
    params:
      p:
        min: 3
        max: 5
      q:
        min: 4
        max: 6
    constraints: ["p != q"]
    answer_expr: p+2*q
    solution: "Dot column 1 with column 2: ${{=p}}\\times1+2\\times{{=q}}={{=p+2*q}}$."
    tolerance:
      abs: 0.000001
  - id: inv-tr-ratings
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A ratings matrix $A$ has users as rows and films as columns. Entry $(i,j)$ of $A^\top A$ is
      the dot product of films $i,j$ across users. What does symmetry mean here?
    options:
      - id: a
        text: Swapping the two films gives the same dot product.
        correct: true
        feedback: Mirrored entries pair the same ratings.
      - id: b
        text: Each user gave the same rating to both films.
        correct: false
        feedback: Symmetry holds even when ratings differ.
      - id: c
        text: All films have the same dot product with themselves.
        correct: false
        feedback: Symmetry does not require equal diagonal entries.
    solution: $A^\top A$ is symmetric, so entries $(i,j)$ and $(j,i)$ match.
  - id: inv-explain-solve
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 5
    prompt: >-
      A system of equations has invertible coefficient matrix $A$, unknown vector $x$ and right-hand-side vector $b$, with $Ax=b$. Explain how the inverse gives the solution. Describe how elimination finds it and how you can check it in the original system.
    rubric:
      - id: inverse
        criterion: Explain that the inverse undoes A, giving x = A^{-1}b.
        weight: 1
        required: true
      - id: elimination
        criterion:
          Explain that elimination subtracts multiples of equations to remove unknowns, then puts
          solved values back.
        weight: 1
        required: true
      - id: check
        criterion: Explain that multiplying the proposed solution by the original matrix should give b.
        weight: 1
        required: true
    exemplar:
      The inverse undoes $A$, so $x=A^{-1}b$. Elimination subtracts multiples of equations until
      one unknown can be solved, then puts values back into the other equations. Multiply $A$ by
      the proposed solution and check that the result is $b$.
    solution: The inverse and elimination give the same input. Multiplying that input by the original $A$ should recover $b$.
  - id: inv-recall-identity-inverse-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: inv-identity-inverse
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what does an inverse do to an output, and how do you check it by multiplication?
    rubric:
      - id: meaning
        criterion: Explain that an inverse sends every output back to its original input.
        weight: 1
        required: true
      - id: rule
        criterion: State that multiplying the matrix and its inverse in either order gives the identity.
        weight: 1
        required: true
    exemplar: An inverse recovers the original input from every output. Multiplying it with the original matrix in either order gives the identity matrix.
  - id: inv-recall-identity-inverse-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: inv-identity-inverse
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: For invertible matrices $A$ and $B$, which matrix is $(AB)^{-1}$?
    options:
      - id: a
        text: $B^{-1}A^{-1}$
        correct: true
        feedback: The product $AB$ applies $B$ first and $A$ second, so its inverse undoes $A$ first. In $B^{-1}A^{-1}$, the factor $A^{-1}$ acts first.
      - id: b
        text: $A^{-1}B^{-1}$
        correct: false
        feedback: This is the inverse of $BA$. Inverting $AB$ reverses the order of its factors.
      - id: c
        text: $B^\top A^\top$
        correct: false
        feedback: This is the transpose of $AB$, which swaps its rows and columns. A transpose does not undo a matrix in general.
    solution: The inverse reverses the factors, giving $(AB)^{-1}=B^{-1}A^{-1}$. The rightmost factor acts first.
  - id: inv-recall-identity-inverse-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: inv-identity-inverse
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the missing factor for $A=\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}$ with nonzero determinant: $A^{-1}=\\dfrac{1}{\\underline{\\quad\\quad}}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}$."
    accept:
      - ad-bc
      - a*d-b*c
      - da-cb
      - d*a-c*b
      - det(A)
      - det A
      - the determinant of A
      - determinant of A
      - "|A|"
      - a d - b c
      - a×d-b×c
      - a\cdot d-b\cdot c
    regex: ^\s*(?:\(?\s*(?:a\s*\*?\s*d|d\s*\*?\s*a)\s*[-−]\s*(?:b\s*\*?\s*c|c\s*\*?\s*b)\s*\)?|(?:\\?det|determinant)\s*\(?\s*a\s*\)?|\|\s*a\s*\|)\s*$
    solution: Divide by the determinant $ad-bc$ after swapping the diagonal entries and changing the other signs.
  - id: inv-recall-elimination-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: inv-elimination
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what does $[A\mid b]$ store for a linear system, and why must a row addition act on both sides of its bar?
    rubric:
      - id: meaning
        criterion: Explain that the augmented matrix keeps each equation's numbers multiplying unknowns beside its right-hand side.
        weight: 1
        required: true
      - id: rule
        criterion: Explain that applying a row addition to both the numbers and the total performs the same arithmetic on both sides of the equation, preserving its solutions.
        weight: 1
        required: true
    exemplar: Each row of $[A\mid b]$ holds the numbers multiplying the unknowns and the total of one equation. A row addition updates both parts so it performs the same arithmetic on both sides of the equation and preserves the solutions.
    solution: The bar separates the left side's numbers from the right-hand side, and both belong to the same equation.
  - id: inv-recall-elimination-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: inv-elimination
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: While solving two equations, elimination gives $0=-2$. What does this tell you?
    options:
      - id: a
        text: The unknowns must both be zero.
        correct: false
        feedback: Setting the unknowns to zero cannot make $0$ equal $-2$. The equations contradict each other.
      - id: b
        text: There is no shared solution.
        correct: true
        feedback: The false equation means no input can satisfy both original equations.
      - id: c
        text: The original matrix has an inverse.
        correct: false
        feedback: An inverse would give a solution for every right-hand side. A contradiction rules that out.
    solution: A false equality after elimination shows that no values satisfy both equations.
  - id: inv-recall-elimination-contrast2
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: inv-elimination
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: "A system has the equations $2x_1+x_2=8$ and $x_1+x_2=5$. Which change keeps its solution the same?"
    options:
      - id: a
        text: Subtract the second equation from the first, both sides.
        correct: true
        feedback: Equal amounts come off both sides, so the prices that fit before still fit. This leaves $x_1=3$.
      - id: b
        text: Subtract 2 from the left side of the first equation.
        correct: false
        feedback: Taking 2 from one side only breaks the equality, so the old solution no longer fits.
      - id: c
        text: Swap the 8 and the 5 on the right-hand sides.
        correct: false
        feedback: That changes the totals of the two orders, so it describes different prices.
    solution: Subtracting one equation from another takes equal amounts from both sides, so the solution stays the same.
  - id: inv-recall-transpose-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: inv-transpose
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what does transposing do to a matrix, and when is a matrix symmetric?
    rubric:
      - id: meaning
        criterion: Explain that transposing turns each row into the matching column.
        weight: 1
        required: true
      - id: rule
        criterion: Explain that a square matrix is symmetric when it equals its transpose.
        weight: 1
        required: true
    exemplar: Transposing turns row 1 into column 1, row 2 into column 2, and so on. A square matrix is symmetric when transposing leaves it unchanged.
  - id: inv-recall-transpose-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: inv-transpose
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: Which property must hold for a symmetric matrix?
    options:
      - id: a
        text: Every entry on the main diagonal equals $1$.
        correct: false
        feedback: The identity has 1s on the diagonal. A symmetric matrix can have other diagonal entries.
      - id: b
        text: Multiplying it by its inverse always gives $I$.
        correct: false
        feedback: Every invertible matrix has that property. Symmetry asks whether transposing leaves the matrix unchanged.
      - id: c
        text: Its entries match across the main diagonal.
        correct: true
        feedback: Matching entries across the diagonal mean $A$ equals its transpose.
    solution: A symmetric matrix equals its transpose, so mirror entries across the main diagonal agree.
  - id: inv-recall-transpose-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: inv-transpose
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the blank: $(AB)^\\top=\\underline{\\quad\\quad}$."
    accept:
      - B^T A^T
      - B^T*A^T
      - B^top A^top
      - B^\top A^\top
      - B^{\top}A^{\top}
      - transpose(B) transpose(A)
      - BᵀAᵀ
      - Bᵀ Aᵀ
    regex: ^\s*(?:b\s*\^\s*\{?\s*\\?(?:t|top)\s*\}?\s*(?:\*|\\cdot)?\s*a\s*\^\s*\{?\s*\\?(?:t|top)\s*\}?|b\s*\.\s*t\s*@\s*a\s*\.\s*t|transpose\s*\(\s*b\s*\)\s*[@*]?\s*transpose\s*\(\s*a\s*\))\s*$
    solution: "Transposing a product reverses the order: $(AB)^\\top=B^\\top A^\\top$."
