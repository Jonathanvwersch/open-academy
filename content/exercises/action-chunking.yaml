concept: action-chunking
exercises:
  - id: dx-il-4
    dimension: conceptual
    type: mc
    role: diagnostic
    difficulty: 3
    est_minutes: 2
    prompt: "Policies such as ACT predict a chunk of the next $k$ actions at each step instead of a single action. What is the main benefit?"
    options:
      - {
          id: a,
          text: "It models coordinated action sequences, shortening the effective decision horizon and capturing timing patterns in demonstrations",
          correct: true,
        }
      - {
          id: b,
          text: "It makes actions within each chunk conditionally independent, so the policy can ignore correlations between consecutive actions",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Chunk prediction can model correlations among consecutive actions, including coordinated movements and pauses.",
        }
      - {
          id: c,
          text: "It corrects disturbances within a chunk without new observations, because later predicted actions already incorporate those disturbances",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Predicted actions cannot incorporate an unforeseen disturbance. Correcting it needs new feedback and replanning.",
        }
      - {
          id: d,
          text: "It supplies recovery labels for states reached after mistakes, because expert actions later in a demonstration cover those states",
          correct: false,
          category: misunderstood_definition,
          feedback: "Demonstrations show the expert's states. Predicting chunks does not label new states reached after the learner makes a mistake.",
        }
    solution: "Predicting $k$ actions at once shrinks the effective decision horizon by a factor of $k$, so errors have fewer opportunities to compound. Temporal ensembling of overlapping chunks smooths execution."
