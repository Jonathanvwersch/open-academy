concept: attention
exercises:
  - id: attn-score-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does a query–key score measure in attention?
    options:
      - {
          id: a,
          text: How well a query matches a source token's key.,
          correct: true,
          feedback: A query describes what is sought and each key is compared with it.,
        }
      - {
          id: b,
          text: How much information is already stored in the output.,
          correct: false,
          feedback: The score is calculated before the output is formed from values.,
        }
      - {
          id: c,
          text: How many times a source token appears in the vocabulary.,
          correct: false,
          feedback: Scores compare vectors rather than counting vocabulary occurrences.,
        }
      - {
          id: d,
          text: How large a source's value is after multiplying by its weight.,
          correct: false,
          feedback: Scores compare queries with keys; values are used later.,
        }
    solution: A score compares a query with a source token's key. The values do not enter that comparison.
  - id: attn-score-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does the worked example divide both dot products by 2?
    options:
      - {
          id: a,
          text: Because there are two tokens in the example.,
          correct: false,
          feedback: "The divisor depends on key width, not sequence length.",
        }
      - {
          id: b,
          text: Because the query happens to have a component equal to 2.,
          correct: false,
          feedback: Query component values do not set the divisor.,
        }
      - {
          id: c,
          text: Because each key has four components and the divisor is the square root of four.,
          correct: true,
        }
      - {
          id: d,
          text: Because dividing any pair of scores by 2 makes them add up to 1.,
          correct: false,
          feedback: Scaling scores does not generally make them add up to 1.,
        }
    solution: The key width is $d_k=4$, so the scaled score divides the dot product by $\sqrt4=2$. The number of source tokens is irrelevant to this divisor.
  - id: attn-score-faded
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: A query and a key each have four components, and their dot product is 6. What is their scaled attention score?
    answer: 3
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: 6
        category: incomplete_explanation
        feedback: That is the dot product. Attention divides it by the square root of the key width.
      - answer: 1.5
        category: misunderstood_definition
        feedback: That divides by the key width, 4. The divisor is its square root, 2.
    solution: The key width is 4, so the divisor is $\sqrt4=2$. The scaled score is $6/2=3$.
  - id: attn-score-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A query is $q=({{=u}},{{=v}},0,0)$ and a key is $k=({{=r}},{{=b}},0,0)$. What is their scaled attention score?"
    params:
      u: { min: 1, max: 3 }
      v: { min: 1, max: 2 }
      r: { min: -1, max: 2 }
      b: { min: -1, max: 2 }
    constraints: ["u*r+v*b != 0"]
    answer_expr: (u*r+v*b)/2
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: u*r+v*b
        category: misunderstood_definition
        feedback: You found the dot product; divide by the square root of the key width, which is 2.
      - answer_expr: (u*r+v*b)/4
        category: misunderstood_definition
        feedback: That divides by the key width, 4. The divisor is its square root, 2.
    solution: 'Multiplying matching components and adding gives ${{=u*r+v*b}}$. The vectors have four components, so the divisor is $\sqrt4=2$ and the score is ${{=(u*r+v*b)/2}}$.'
  - id: attn-score-cosine
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A nonzero query is doubled while its width and all keys stay fixed. What happens to every scaled dot-product score?
    options:
      - {
          id: a,
          text: It stays unchanged because scaling removes all length information.,
          correct: false,
          feedback: Dividing by key width's square root is not division by vector lengths.,
        }
      - {
          id: b,
          text: It doubles because the dot product doubles and the divisor stays fixed.,
          correct: true,
        }
      - {
          id: c,
          text: It halves because the key width also doubles with the query.,
          correct: false,
          feedback: Doubling components does not change the number of components.,
        }
      - {
          id: d,
          text: It becomes positive because all scaled scores are positive.,
          correct: false,
          feedback: "Scores may be negative, zero or positive; doubling preserves their sign.",
        }
    solution: Every product in the dot product doubles. Since $d_k$ stays fixed, each scaled score doubles too; length has not been removed as in cosine similarity.
  - id: attn-score-transfer
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A robot compares a query $q=(2,-2,0,0)$ with two object keys $k_1=(1,1,0,0)$ and $k_2=(0,2,0,0)$ using scaled attention scores. How much larger is the first object's score than the second's?"
    answer: 2
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer: 4
        category: incomplete_explanation
        feedback: That is the difference between the dot products. Divide each by $\sqrt4=2$ first.
      - answer: 1
        category: misunderstood_definition
        feedback: That divides by the key width, 4. The divisor is its square root, 2.
    solution: The dot products are $0$ and $-4$, and the keys have four components, so dividing by $\sqrt4=2$ gives scores $0$ and $-2$. Their difference is $0-(-2)=2$; a zero score can still beat a negative one.
  - id: attn-weight-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: How does attention turn the scores for one query into mixing weights?
    options:
      - {
          id: a,
          text: It divides each raw score by the sum of the raw scores.,
          correct: false,
          feedback: Raw scores can be negative or have a zero total; attention uses softmax.,
        }
      - {
          id: b,
          text: It gives weight 1 to the largest score and 0 to every other score.,
          correct: false,
          feedback: Softmax assigns positive shares rather than selecting only the largest score.,
        }
      - {
          id: c,
          text: It applies softmax across the source scores for that query.,
          correct: true,
          feedback: These scores share one denominator so their weights add up to 1.,
        }
      - {
          id: d,
          text: It applies softmax separately to each score on its own.,
          correct: false,
          feedback: All sources for a query share one denominator; separate single-score softmaxes would each give 1.,
        }
    solution: Softmax compares all source scores for one query together. Its positive outputs sum to 1 and assign larger shares to larger scores.
  - id: attn-weight-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: In the worked example with scores $(1,0)$, why does cat still receive some weight despite its score being 0?
    options:
      - { id: a, text: "Softmax raises $e$ to the score, and $e^0=1$ is positive.", correct: true }
      - {
          id: b,
          text: A source always receives at least half the weight on itself.,
          correct: false,
          feedback: There is no such lower bound; here cat receives about 0.27.,
        }
      - {
          id: c,
          text: 'The divisor $\sqrt{d_k}$ adds 1 to every zero score.',
          correct: false,
          feedback: Scaling divides the dot product; the positive numerator comes from exponentiation.,
        }
      - {
          id: d,
          text: Zero scores are ignored until the remaining weight is assigned equally.,
          correct: false,
          feedback: "Every score enters the same softmax calculation, including zero scores.",
        }
    solution: The numerator for the zero score is $e^0=1$. Dividing by $e+1$ gives a positive weight of about $0.27$.
  - id: attn-weight-faded
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: For one query, the scaled scores of three sources are $(1,0,0)$. What attention weight goes to the first source? Round to two decimals.
    answer: 0.5761
    tolerance: { abs: 0.006 }
    common_wrong:
      - answer: 1
        tolerance: { abs: 0.01 }
        category: misunderstood_definition
        feedback: Softmax doesn't give all the weight to the largest score. Raise $e$ to every score, including the zeros, then divide by the total.
      - answer: 0.33
        tolerance: { abs: 0.006 }
        category: misunderstood_definition
        feedback: Equal weights would need equal scores. The first score is larger, so its weight is larger.
    solution: Softmax raises $e$ to each score, giving $e$, $1$ and $1$, with total $e+2\approx4.72$. The first weight is $e/(e+2)\approx2.72/4.72\approx0.58$.
  - id: attn-weight-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The scaled scores for one query are $({{=s}},0)$. What is the softmax weight of the first source? Round only the final answer to two decimals."
    params:
      s: { min: -3, max: 3, step: 0.25 }
    constraints: ["s != -2", "s != -1", "s != 0", "s != 1", "s != 2"]
    answer_expr: exp(s)/(exp(s)+1)
    tolerance: { abs: 0.006 }
    solution: 'The positive numbers are $e^{ {{=s}} }$ and $e^0=1$. Dividing the first by their sum gives $e^{ {{=s}} }/(e^{ {{=s}} }+1)\approx{{=round(exp(s)/(exp(s)+1),2)}}$.'
  - id: attn-weight-confusion
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Two sources have scaled scores $(-2,-2)$ for a query. What are their softmax weights?"
    options:
      - {
          id: a,
          text: "$(-0.5,-0.5)$, because both scores are negative.",
          correct: false,
          feedback: "Exponentials are positive, so attention weights cannot be negative.",
        }
      - {
          id: b,
          text: "$(0,0)$, because negative scores cannot contribute.",
          correct: false,
          feedback: Each negative score still has a positive exponential.,
        }
      - {
          id: c,
          text: "$(1,1)$, because the two sources match equally.",
          correct: false,
          feedback: "Equal weights must share a total of 1, not each receive 1.",
        }
      - { id: d, text: "$(0.5,0.5)$, because equal scores get equal shares.", correct: true }
    solution: Both numerators are $e^{-2}$ and the denominator is twice that. Each source gets half the total weight, regardless of their common negative score.
  - id: attn-weight-transfer
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A robot compares two object keys. One query gives scaled scores $(1,0)$; another gives $(0,2)$. Which pair lists the weight on the first object for the first query, then for the second query?"
    options:
      - {
          id: a,
          text: "About $(0.73,0.88)$.",
          correct: false,
          feedback: "0.88 is the second object's weight for scores (0,2), not the first object's.",
        }
      - { id: b, text: "About $(0.73,0.12)$.", correct: true }
      - {
          id: c,
          text: "About $(0.27,0.12)$.",
          correct: false,
          feedback: "For scores (1,0), the first object has the larger score and gets about 0.73.",
        }
      - {
          id: d,
          text: "About $(0.50,0.50)$.",
          correct: false,
          feedback: "Neither query has equal scores, so neither gives equal weights.",
        }
    solution: For the first query the weight is $e/(e+1)\approx0.73$. For the second it is $1/(1+e^2)\approx0.12$; each query uses its own denominator.
  - id: attn-mix-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What information does an attention output combine?
    options:
      - {
          id: a,
          text: It adds the keys after multiplying each by its attention weight.,
          correct: false,
          feedback: Keys help determine weights; the output combines values.,
        }
      - {
          id: b,
          text: It copies the value with the highest score and drops the others.,
          correct: false,
          feedback: Softmax makes a weighted mixture rather than a hard choice.,
        }
      - {
          id: c,
          text: It sorts the query components from the smallest to the largest.,
          correct: false,
          feedback: "The query is used to score keys, not sorted to form the output.",
        }
      - {
          id: d,
          text: It adds values after multiplying each by its attention weight.,
          correct: true,
          feedback: The output is the sum of the weighted value vectors.,
        }
    solution: Each source's value is multiplied by its share for the receiving query. Adding those weighted vectors gives the output.
  - id: attn-mix-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked example, why is the output's second component positive even though "the" has the larger weight?
    options:
      - {
          id: a,
          text: The query's second component is copied directly into the output.,
          correct: false,
          feedback: The query's second component is 0; the output comes from weighted values.,
        }
      - {
          id: b,
          text: Cat's value has second component 2 and still receives a positive share.,
          correct: true,
        }
      - {
          id: c,
          text: The largest weight is assigned to every nonzero value component.,
          correct: false,
          feedback: "Each source has its own weight, applied to all of that source's components.",
        }
      - {
          id: d,
          text: Adding two values always makes every output component positive.,
          correct: false,
          feedback: Values can contain zeros or negative components; adding them does not guarantee positive output components.,
        }
    solution: Cat contributes $2/(e+1)$ to the second component. A larger weight for another source does not erase that positive contribution.
  - id: attn-mix-faded
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two attention weights are $(0.25,0.75)$ and the corresponding values are $v_1=(4,0)$ and $v_2=(0,8)$. What is the second component of the output?"
    answer: 6
    tolerance: { abs: 0.001 }
    solution: Mix the second components with their matching weights. The result is $0.25\times0+0.75\times8=6$.
  - id: attn-mix-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The weights are $({{=p/4}},{{=1-p/4}})$ and values are $v_1=({{=u}},1)$, $v_2=({{=v}},3)$. What is the first component of their attention output?"
    params:
      p: { min: 1, max: 3 }
      u: { min: 2, max: 6, step: 2 }
      v: { min: -2, max: 0, step: 1 }
    answer_expr: p*u/4+(1-p/4)*v
    tolerance: { abs: 0.001 }
    solution: 'Multiply each first component by its own weight, then add: ${{=p/4}}\times{{=u}}+{{=1-p/4}}\times({{=v}})={{=p*u/4+(1-p/4)*v}}$. The second components do not enter this coordinate.'
  - id: attn-mix-keys
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Attention gives two sources weights $(0.6,0.4)$. Their values change but their query and keys stay fixed. What happens?
    options:
      - { id: a, text: "The weights stay fixed, but the output may change.", correct: true }
      - {
          id: b,
          text: "The weights must change, but the output stays fixed.",
          correct: false,
          feedback: Weights depend on the query and keys; the output depends on the values too.,
        }
      - {
          id: c,
          text: Both weights become 0.5 whenever either value changes.,
          correct: false,
          feedback: Changing values alone does not equalize query–key scores.,
        }
      - {
          id: d,
          text: Both output and weights always stay exactly the same.,
          correct: false,
          feedback: Holding weights fixed still allows changed values to change their weighted sum.,
        }
    solution: Query–key scores and their softmax weights do not use the values. Changing a value can change the output even when its weight stays fixed.
  - id: attn-mix-full
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 4
    prompt: "Let $q=(2,0,0,0)$, $k_1=(2,0,0,0)$, $k_2=(0,1,0,0)$, $v_1=(4,0,0,0)$ and $v_2=(0,4,0,0)$. Compute the first component of the attention output using scaled scores with $d_k=4$, then softmax and a weighted sum. Round only the final answer to two decimals."
    answer: 3.52
    tolerance: { abs: 0.006 }
    solution: The dot products are 4 and 0, giving scaled scores 2 and 0. The first output component is $4e^2/(e^2+1)\approx3.52$, keeping full precision until the final rounding.
  - id: attn-mix-transfer
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A robot uses attention weights $(0.2,0.3,0.5)$ to mix three two-component sensor values $(10,0)$, $(0,10)$ and $(4,4)$. What is the second component of the mixed value?"
    answer: 5
    tolerance: { abs: 0.001 }
    solution: Use the second component from each source with its matching weight. The result is $0.2\times0+0.3\times10+0.5\times4=5$.
  - id: attn-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt: Explain how scaled dot-product attention turns a query, two keys and two values into one output vector. Say why a source with the larger score need not be the only source contributing.
    rubric:
      - {
          id: scores,
          criterion: Says to dot the query with each key and divide each result by the square root of key width.,
          weight: 1,
          required: true,
        }
      - {
          id: weights,
          criterion: Describes softmax across source scores producing positive weights that sum to 1.,
          weight: 1,
          required: true,
        }
      - {
          id: values,
          criterion: Describes adding weighted values and explains that the lower-scoring source still has a positive weight.,
          weight: 1,
          required: true,
        }
    exemplar: Compute the dot product of the query with each key and divide by the square root of the key width. Apply softmax to those two scores together so the weights are positive and sum to 1, then multiply each value by its weight and add the vectors. Every source's value is included with a positive weight, so the source with the largest score need not supply the whole output.
  - id: dx-tf-3
    dimension: math
    type: numeric
    role: diagnostic
    difficulty: 3
    est_minutes: 4
    prompt: |
      A query $q_1=(1,0)$ has keys $k_1=(2,0)$ and $k_2=(0,2)$, with value vectors $v_1=(10,0)$ and $v_2=(0,0)$. The key width is $d_k=2$.

      Compute the first component of $o_1=\sum_{j=1}^{2}a_{1j}v_j$, using scores $s_{1j}=q_1\cdot k_j/\sqrt{d_k}$ and weights $a_{1j}=\text{softmax}_j(s_{1j})$. Round only at the end and give two decimal places.
    answer: 8.0443
    tolerance: { abs: 0.02 }
    common_wrong:
      - {
          answer: 8.808,
          tolerance: { abs: 0.02 },
          category: misunderstood_definition,
          feedback: "That is the result without the $1/\\sqrt{d_k}$ scaling (softmax of scores 2 and 0).",
        }
      - {
          answer: 10,
          tolerance: { abs: 0.01 },
          category: misunderstood_definition,
          feedback: "Attention takes a softmax-weighted average of all values, not the value of the best-matching key.",
        }
      - {
          answer: 5,
          tolerance: { abs: 0.01 },
          category: math_error,
          feedback: "Equal weights would only happen if both scores were equal. Here $q_1\\cdot k_1=2$ and $q_1\\cdot k_2=0$.",
        }
    hints:
      [
        "Compute each score $s_{1j}=q_1\\cdot k_j/\\sqrt{d_k}$ first.",
        "Scores are $\\sqrt2 \\approx 1.414$ and $0$; apply softmax to them.",
      ]
    solution: "The scores are $s_{11}=\\sqrt2\\approx1.414$ and $s_{12}=0$, with $e^{1.414}\\approx4.112$. Softmax exponentiates and normalizes these scores, giving $a_{11}=e^{\\sqrt2}/(e^{\\sqrt2}+1)\\approx0.80443$ and $a_{12}\\approx0.19557$ when computed without intermediate rounding. Their weighted sum is $o_1\\approx(8.0443,0)$, so the first component rounds to $8.04$."
  - id: attn-recall-score-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: attn-score-matches
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what does a scaled query–key score compare, and how is it calculated?"
    rubric:
      - id: r1
        criterion: "Explain that a query describes what a token needs and a source key describes what it offers."
        weight: 1
        required: true
      - id: r2
        criterion: "State that the score is their dot product divided by the square root of the key width."
        weight: 1
        required: true
    exemplar: "A query describes what a token needs, and each source key describes what it offers. Their score is the query–key dot product divided by the square root of the key width."
  - id: attn-recall-score-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: attn-score-matches
    difficulty: 1
    est_minutes: 0.5
    prompt: "Every component of a query is doubled, and the keys stay the same. Which quantity doubles too?"
    options:
      - id: a
        text: "The scaled dot-product score"
        correct: true
        feedback: "The divisor $\\sqrt{d_k}$ depends only on the key width, so doubling the query doubles the score."
      - id: b
        text: "The cosine similarity"
        correct: false
        feedback: "Cosine similarity divides by both lengths. Doubling the query doubles its length too, so the cosine stays the same."
      - id: c
        text: "The attention weight"
        correct: false
        feedback: "Softmax turns the scores into shares that add up to 1, so a weight can never double past 1. Doubling the scores changes the shares by a different amount."
    solution: "The score is $q\\cdot k/\\sqrt{d_k}$. Doubling $q$ doubles the dot product, and the divisor depends only on width."
  - id: attn-recall-score-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: attn-score-matches
    difficulty: 2
    est_minutes: 0.5
    prompt: "Write the scaled attention score for query $(a,b)$ and key $(c,d)$. Type `sqrt(...)` for square root."
    answer: "(a*c+b*d)/sqrt(2)"
    variables: { "a": [-4, 4], "b": [-4, 4], "c": [-4, 4], "d": [-4, 4] }
    solution: "The dot product is $ac+bd$, and the key width is 2, giving $(ac+bd)/\\sqrt2$."
  - id: attn-recall-weights-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: attn-make-weights
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what is an attention weight, and how does softmax obtain it from scores?"
    rubric:
      - id: r1
        criterion: "Explain that an attention weight is one source's share for a particular query."
        weight: 1
        required: true
      - id: r2
        criterion: "Explain that softmax raises $e$ to each score and divides that source's result by the total for all sources."
        weight: 1
        required: true
    exemplar: "An attention weight is one source's share for a particular query. Softmax raises $e$ to every score and divides each result by their total for all sources."
  - id: attn-recall-weights-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: attn-make-weights
    difficulty: 1
    est_minutes: 0.5
    prompt: "Which quantity must be positive and belongs to a set that adds up to 1 for each query?"
    options:
      - id: a
        text: "A scaled query–key score"
        correct: false
        feedback: "Scaled scores can be negative or exceed 1."
      - id: b
        text: "An attention weight"
        correct: true
        feedback: "Softmax gives each source a positive share, and the shares sum to 1."
      - id: c
        text: "A value component"
        correct: false
        feedback: "A value component carries information to mix, and it can be any number, including a negative one."
    solution: "Attention weights are the positive shares produced by softmax for one query."
  - id: attn-recall-weights-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: attn-make-weights
    difficulty: 2
    est_minutes: 0.5
    prompt: "A query has two source scores $x$ and $y$. Write the attention weight for the first source. Type `exp(...)` for the exponential."
    answer: "exp(x)/(exp(x)+exp(y))"
    variables: { "x": [-5, 5], "y": [-5, 5] }
    solution: "The first source gets $e^x/(e^x+e^y)$."
  - id: attn-recall-mix-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: attn-mix-values
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, how is an attention output formed from values and weights, and why must the values have equal widths?"
    rubric:
      - id: r1
        criterion: "Explain that each value vector is multiplied by its attention weight and the results are added."
        weight: 1
        required: true
      - id: r2
        criterion: "Explain that equal value widths let matching components line up for addition."
        weight: 1
        required: true
    exemplar: "Multiply each value vector by its attention weight and add the results. Values need equal widths so matching components line up for addition."
  - id: attn-recall-mix-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: attn-mix-values
    difficulty: 1
    est_minutes: 0.5
    prompt: "In attention, which two kinds of vector must have the same width as each other?"
    options:
      - id: a
        text: "A query and a key"
        correct: true
        feedback: "A query is dotted with each key, and a dot product needs matching components."
      - id: b
        text: "A query and a value"
        correct: false
        feedback: "Values are only added to other values, so their width can differ from the query's."
      - id: c
        text: "A key and a value"
        correct: false
        feedback: "Keys are dotted with queries and values are added to values, so a value's width can differ from a key's."
    solution: "A query is dotted with every key, so they need the same width. Values are added only to other values, so their width can differ."
  - id: attn-recall-mix-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: attn-mix-values
    difficulty: 2
    est_minutes: 0.5
    prompt: "A query gives two sources attention weights $w$ and $1-w$. The first entries of their values are $x$ and $y$. Write the first entry of the output."
    answer: "w*x+(1-w)*y"
    variables: { "w": [0.05, 0.95], "x": [-5, 5], "y": [-5, 5] }
    solution: "Multiply each value entry by its weight and add, giving $wx+(1-w)y$."
  - id: attn-recover-weight
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "Two sources have one-component values $2$ and $10$. Their attention output is $8$. What attention weight did the source with value $10$ receive?"
    answer: 0.75
    tolerance: { abs: 0 }
    solution: "The two weights add to $1$. If the second weight is $w$, the output is $2(1-w)+10w=2+8w$, so $w=0.75$."
  - id: attn-code-scale-width
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "What numeric divisor belongs in place of `scale` to compute a scaled attention score for these inputs?"
    code: |
      q = [2, 1, 3, 0]
      k = [1, 2, 0, 1]
      dot = sum(q[i] * k[i] for i in range(len(k)))
      score = dot / scale
    solution: "The divisor is the square root of the key width. The key has four entries, so the divisor is $2$."
    answer: 2
    tolerance: { abs: 0 }
  - id: attn-code-query-pair
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "`queries` and `keys` hold the query and key vectors by token position. The code fills `scores[t][j]` for output position `t` and source position `j`. The function `dot` computes a dot product, and `scale` holds the square root of the key width. Which line assigns the scaled attention score?"
    options:
      - id: a
        text: "`scores[t][j] = dot(queries[j], keys[t]) / scale`"
        correct: false
        feedback: "This scores the source's query against the output position's key. Their roles are swapped."
      - id: b
        text: "`scores[t][j] = dot(queries[t], keys[j]) / scale`"
        correct: true
        feedback: "Each entry compares the output position's query to the source's key."
      - id: c
        text: "`scores[t][j] = dot(queries[t], keys[t]) / scale`"
        correct: false
        feedback: "This uses the output position's own key for every source."
    solution: "Use the query indexed by the row and the key indexed by the source column. `scale` is the square root of the key width."
  - id: attn-code-softmax-axis
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "In a self-attention implementation, `scores[t][j]` holds the score from query position `t` to source position `j`. The function `softmax` takes a list of scores and returns their weights in order. Which Python expression supplies the scores for query position `t`?"
    options:
      - id: a
        text: "`[scores[j][j] for j in range(len(scores))]`"
        correct: false
        feedback: "This takes only the scores where the query and source are the same token."
      - id: b
        text: "`[scores[j][t] for j in range(len(scores))]`"
        correct: false
        feedback: "This fixes the source and collects scores from different queries."
      - id: c
        text: "`[scores[t][j] for j in range(len(scores))]`"
        correct: true
        feedback: "This row contains every source score for a single query."
    solution: "Softmax normalizes over the source scores for one query, so pass row `t`."
  - id: attn-code-value-array
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "For one query, `weights[j]` is the attention weight for source `j`. The `keys`, `queries`, and `values` lists contain the corresponding vectors. Which Python expression computes the first component of the attention output?"
    options:
      - id: a
        text: "`sum(weights[j] * keys[j][0] for j in range(len(weights)))`"
        correct: false
        feedback: "Keys are used to find scores. The output carries the source values."
      - id: b
        text: "`sum(weights[j] * values[j][0] for j in range(len(weights)))`"
        correct: true
        feedback: "This adds the first value components after weighting each by its source weight."
      - id: c
        text: "`sum(weights[j] * queries[j][0] for j in range(len(weights)))`"
        correct: false
        feedback: "Queries describe what each token looks for. They do not supply the content to mix."
    solution: "Apply each source's weight to its value's first component and sum those contributions."
  - id: attn-code-output-width
    dimension: implementation
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: "An attention function creates the output with `out = [0] * len(query)`. It then loops over the components of each value vector and adds each weighted component to the matching entry in `out`. Which input will make the function try to write beyond the end of `out`?"
    options:
      - id: a
        text: "Queries and keys of width 4, with three value vectors of width 2."
        correct: false
        feedback: "The function allocates too many entries, but both value components fit."
      - id: b
        text: "Queries and keys of width 4, with five value vectors of width 4."
        correct: false
        feedback: "This changes how many vectors are mixed while keeping the component count right."
      - id: c
        text: "Queries and keys of width 4, with three value vectors of width 6."
        correct: true
        feedback: "The code allocates four components and has six components to add for each value."
    solution: "The output needs one component for every component in a value vector. A query width of 4 and value width of 6 expose the mismatch."
