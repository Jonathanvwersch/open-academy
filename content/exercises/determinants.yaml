concept: determinants
exercises:
  - id: det-pivots-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: After using only row additions and row swaps to make a square matrix upper triangular, how do you find the original determinant?
    options:
      - id: product-sign
        text: Multiply the diagonal entries and reverse the sign for each swap.
        correct: true
        feedback: Row additions preserve the determinant, while each swap reverses its sign.
      - id: sum-sign
        text: Add the diagonal entries and reverse the sign for each swap.
        correct: false
        feedback: The diagonal entries of a triangular matrix give its determinant when multiplied together.
      - id: product-additions
        text: Multiply the diagonal entries and reverse the sign for each row addition.
        correct: false
        feedback: Row additions keep the determinant unchanged. Swaps cause the sign reversals.
    solution: Multiply the triangular diagonal entries, then multiply by $(-1)^{\text{swaps}}$ to account for the row swaps.
  - id: det-pivots-self-explain
    dimension: conceptual
    type: mc
    role: practice
    lesson_only: true
    difficulty: 2
    est_minutes: 2
    prompt: The worked example also checks the $2\times2$ matrix $B=\begin{bmatrix}2&1\\4&5\end{bmatrix}$, whose determinant is 6. The output coordinates $(x,y)$ from $B$ are the inputs to the row-addition map. Subtracting twice row 1 from row 2 gives that map's output coordinates $(x,y-2x)$. Apply the row-addition map on its own to the unit square whose bottom-left corner is at the origin and whose sides follow the coordinate axes. What happens to the determinant of the matrix after the row addition, and why?
    options:
      - id: one-swap
        text: The vertical sides keep their length and spacing, and orientation stays the same, so the determinant stays 6.
        correct: true
        feedback: The left edge stays fixed. Both endpoints of the right edge move down by 2, so its length stays the same. The horizontal spacing stays at 1, and the slide does not reverse orientation.
      - id: two-additions
        text: The vertical sides keep their length and spacing, and orientation reverses, so the determinant changes to $-6$.
        correct: false
        feedback: Subtracting twice the horizontal coordinate is not the same as negating the vertical coordinate. The top endpoint on each side stays above the bottom endpoint, and the right side stays to the right of the left side.
      - id: initial-zero
        text: The vertical sides keep their length but get farther apart, and orientation stays the same, so the determinant increases.
        correct: false
        feedback: The top and bottom edges get longer, but the spacing between the vertical sides is measured horizontally. Their horizontal coordinates are still 0 and 1.
    solution: The right edge slides down by 2, keeping both vertical sides one unit long and one unit apart with their original top endpoints still above their bottom endpoints. The row addition therefore scales every signed area by $+1$, so the image of the unit square under $B$ keeps its signed area of 6 after the row addition.
  - id: det-pivots-triangular-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: What is the determinant of $T=\begin{bmatrix}{{=p}}&2&1\\0&-{{=q}}&3\\0&0&{{=r}}\end{bmatrix}$?
    params:
      p: { min: 2, max: 4 }
      q: { min: 2, max: 4 }
      r: { min: 2, max: 4 }
    answer_expr: -p*q*r
    tolerance: { abs: 0.000001 }
    common_wrong:
      - answer_expr: p*q*r
        category: math_error
        feedback: The middle diagonal entry is negative, so the diagonal product is negative.
      - answer_expr: p-q+r
        category: misunderstood_definition
        feedback: Multiply the diagonal entries. Their sum does not give a triangular determinant.
    solution: The matrix is upper triangular, so its determinant is ${{=p}}\times(-{{=q}})\times{{=r}}={{=-p*q*r}}$.
  - id: det-pivots-row-addition-error
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A learner changes $\begin{bmatrix}2&1\\4&5\end{bmatrix}$ to $\begin{bmatrix}2&1\\0&3\end{bmatrix}$ by subtracting twice row 1 from row 2, then says the determinant changed sign. Which statement corrects the error?
    options:
      - id: addition-preserves
        text: Adding a multiple of another row keeps the determinant unchanged.
        correct: true
        feedback: This operation slides the output picture while preserving its area and orientation.
      - id: negative-multiple
        text: Subtracting a row multiple changes the determinant to a negative number.
        correct: false
        feedback: The sign of the multiple does not matter. Adding any row multiple preserves the determinant.
      - id: zero-collapse
        text: Creating a zero entry makes the determinant vanish.
        correct: false
        feedback: A single zero entry does not imply collapse. The new diagonal product is $2\times3=6$.
    solution: Subtracting twice another row is a row addition, so the determinant stays 6. A row swap would reverse its sign.
  - id: det-pivots-two-swaps
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Two row swaps and several row additions change a matrix $A$ into $T=\begin{bmatrix}2&0&0\\1&-3&0\\0&2&4\end{bmatrix}$. What is $\det(A)$?
    answer: -24
    tolerance: { abs: 0.000001 }
    common_wrong:
      - answer: 24
        category: incorrect_reasoning
        feedback: Two swaps reverse the sign twice. The original determinant has the same sign as the triangular product.
      - answer: 3
        category: misunderstood_definition
        feedback: That adds the diagonal entries. Multiply them to find the determinant.
    solution: The triangular determinant is $2\times(-3)\times4=-24$. The factor $(-1)^2=1$ leaves it unchanged.
  - id: det-pivots-zero-column
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A square matrix becomes $T=\begin{bmatrix}2&1&3\\0&0&4\\0&0&0\end{bmatrix}$ using row additions. What does this tell you about its determinant?
    options:
      - id: zero-diagonal
        text: It is zero because the triangular diagonal product contains zero.
        correct: true
        feedback: There is no second-column pivot available, and the diagonal product is $2\times0\times0=0$.
      - id: nonzero-pivots
        text: It is 8 because the two nonzero pivots multiply to 8.
        correct: false
        feedback: A full set of pivots is missing. Include every diagonal position, including its zeros.
      - id: last-entry
        text: It is 4 because the last nonzero row ends with 4.
        correct: false
        feedback: The determinant uses all diagonal entries. A row's last entry alone does not determine it.
    solution: Row additions preserve the determinant, and the triangular matrix has diagonal product zero. Missing pivots prevent a full set of nonzero diagonal entries.
  - id: det-pivots-three-by-three
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: What is the determinant of $A=\begin{bmatrix}0&1&2\\2&1&1\\4&3&6\end{bmatrix}$?
    answer: -4
    tolerance: { abs: 0.000001 }
    common_wrong:
      - answer: 4
        category: incorrect_reasoning
        feedback: Swapping the first two rows lets you start clearing entries. Include the sign reversal from that swap.
      - answer: 0
        category: misunderstood_definition
        feedback: A zero at the top left can be replaced by swapping in a nonzero entry from below.
    solution: Swap rows 1 and 2, subtract twice the new row 1 from row 3, then subtract row 2 from row 3. The triangular diagonal is $2,1,2$, giving $\det(A)=-(2\times1\times2)=-4$.
  - id: det-pivots-coordinate-map
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: A robot maps planar coordinate vectors by multiplying them by a $2\times2$ matrix. The input vector $(1,0)$ becomes $(0,2)$, and the input vector $(0,1)$ becomes $(3,1)$. What is the signed area scale of this map?
    answer: -6
    tolerance: { abs: 0.000001 }
    common_wrong:
      - answer: 6
        category: incorrect_reasoning
        feedback: The magnitude is 6, and the coordinate map reverses orientation. Keep the sign.
      - answer: 0
        category: misunderstood_definition
        feedback: A zero entry alone does not force a zero determinant. Swap the rows to get a nonzero first pivot.
    solution: The two outputs are the columns of $A=\begin{bmatrix}0&3\\2&1\end{bmatrix}$. Swapping rows gives a triangular matrix with diagonal $2,3$, so the original signed area scale is $-(2\times3)=-6$.
  - id: det-recall-pivots-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: det-pivots
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what is a pivot when clearing entries below the diagonal, and how do pivots give the determinant of a square matrix when every column has one? Assume only row additions and row swaps are used.
    rubric:
      - id: pivot
        criterion: Explain that a pivot is the first nonzero entry of a row used to clear entries below it.
        weight: 1
        required: true
      - id: product-and-sign
        criterion: Explain that a full set of pivots lies on the triangular diagonal, whose product is multiplied by $(-1)^{\text{swaps}}$.
        weight: 1
        required: true
    exemplar: A pivot is the first nonzero entry of a row used to make the entries below it zero. With a pivot in every column, multiply the pivots on the triangular diagonal and multiply by $(-1)^{\text{swaps}}$ to account for row swaps.
    solution: Row additions preserve the determinant, so only the triangular diagonal and the swap count enter the final product.
  - id: det-recall-pivots-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: det-pivots
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: Which row move always preserves a matrix's determinant?
    options:
      - id: row-addition
        text: Add three times row 1 to row 2, keeping row 1.
        correct: true
        feedback: Adding a multiple of one row to another leaves the determinant unchanged.
      - id: swap
        text: Exchange row 1 and row 2, keeping every entry.
        correct: false
        feedback: A row swap reverses the determinant's sign. A nonzero determinant changes.
      - id: erase
        text: Replace row 2 with zeros, keeping row 1.
        correct: false
        feedback: A zero row gives a zero determinant, so replacing a row by zeros can change the determinant.
    solution: The row-addition rule says that adding a multiple of one row to another leaves the determinant unchanged.
  - id: det-recall-pivots-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: det-pivots
    difficulty: 1
    est_minutes: 0.5
    prompt: Row additions and $s$ row swaps turn a $3\times3$ matrix into a triangular matrix with diagonal entries $p,q,r$. Write the original determinant. Use `*` for multiplication and `^` for powers.
    answer: p*q*r*(-1)^s
    variables:
      p: { values: [-3, -1, 2, 4] }
      q: { values: [-2, 1, 3] }
      r: { values: [-4, 1, 2] }
      s: { values: [0, 1, 2, 3] }
    solution: Multiply the three diagonal entries and include one factor of $-1$ for each row swap, giving $pqr(-1)^s$.
  - id: det-area-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: What does the determinant of a $2\times2$ matrix describe?
    options:
      - id: signed-area
        text: How it scales area, with a sign recording orientation.
        correct: true
        feedback: Its magnitude multiplies areas, and its sign records whether orientation reverses.
      - id: arrow-length
        text: How it scales every arrow, with a sign recording direction.
        correct: false
        feedback: Different arrows can change length by different amounts. The determinant measures area scaling.
      - id: entry-total
        text: How its entries add up, with a sign recording their total.
        correct: false
        feedback: Adding the entries does not measure what the matrix does to area.
    solution: The determinant gives the area scale with a sign. A positive sign preserves orientation and a negative sign reverses it.
  - id: det-area-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    lesson_only: true
    est_minutes: 1
    prompt: In the worked example, why do we multiply 2 by 4 to get the area scale?
    options:
      - id: rectangle
        text: The unit square becomes a rectangle of width 2 and height 4.
        correct: true
        feedback: Its area starts at 1 and ends at 8, so every area is multiplied by 8.
      - id: entry-count
        text: There are two nonzero entries, each acting on four corners.
        correct: false
        feedback: Counting entries or corners does not give area. We multiply the rectangle's width by its height.
      - id: arrow-total
        text: Each output arrow is 2 times 4 units long after the map.
        correct: false
        feedback: The output arrows have lengths 2 and 4. Their perpendicular sides enclose area 8.
    solution: The two perpendicular edges have lengths 2 and 4, so the output rectangle has area $2\times4=8$. The original square had area 1, making 8 the area scale.
  - id: det-area-scaled-region
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A planar map sends $(x,y)$ to $(3x,3y)$. A region starts with area 2 square units. What is its area after the map, in square units?
    answer: 18
    tolerance: { abs: 0 }
    common_wrong:
      - {
          answer: 6,
          category: misunderstood_definition,
          feedback: "Both dimensions triple, so the area scale is 9, not 3.",
        }
      - {
          answer: 9,
          category: incorrect_reasoning,
          feedback: "That is the area scale. Apply it to the region's original area of 2.",
        }
    solution: Both perpendicular dimensions triple, giving an area scale of $3\times3=9$. The region's new area is $2\times9=18$.
  - id: det-area-negative-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      What is the determinant of $A=\begin{bmatrix}-{{=p}}&0\\0&{{=q}}\end{bmatrix}$?
    params:
      p: { min: 2, max: 5 }
      q: { min: 2, max: 5 }
    answer_expr: -p*q
    tolerance: { abs: 0 }
    common_wrong:
      - answer_expr: p*q
        category: misunderstood_definition
        feedback: The first edge goes left and the second up, reversing orientation. Keep the negative sign.
    solution: The rectangle has side lengths {{=p}} and {{=q}}, while its orientation reverses. Its determinant is $-({{=p}}\times{{=q}})={{=-p*q}}$.
  - id: det-area-negative-meaning
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: A $2\times2$ matrix has determinant $-3$. What does this say about a region it transforms?
    options:
      - id: area-and-flip
        text: Its area triples and its orientation reverses.
        correct: true
        feedback: The magnitude 3 controls area and the negative sign records the flip.
      - id: negative-area
        text: Its area becomes negative and its orientation stays the same.
        correct: false
        feedback: Ordinary area remains positive. The negative sign records reversed orientation.
      - id: lengths-and-flip
        text: Every edge triples in length and points the opposite way.
        correct: false
        feedback: The determinant does not give a common scale for every edge. It measures area and orientation.
    solution: The area is multiplied by $|-3|=3$, and the negative sign means orientation reverses.
  - id: det-area-one-meaning
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: A $2\times2$ matrix has determinant 1. What can you conclude about its effect on a picture?
    options:
      - id: area-preserved
        text: Areas and orientation are preserved, though the shape may change.
        correct: true
        feedback: The magnitude 1 preserves area; the positive sign preserves orientation.
      - id: everything-preserved
        text: Every point stays in place, so the shape and position are unchanged.
        correct: false
        feedback: Area can be preserved while a matrix slants or turns the shape.
      - id: lengths-preserved
        text: Every edge keeps its length, though the orientation may reverse.
        correct: false
        feedback: A determinant of 1 describes area, not individual lengths, and its positive sign preserves orientation.
    solution: The area scale is 1 and the sign is positive. This preserves area and orientation but does not require the matrix to leave points or edge lengths unchanged.
  - id: det-area-half-turn
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: A planar map multiplies coordinate vectors by a $2\times2$ matrix. It sends the first edge vector $(1,0)$ to $(-1,0)$ and the second edge vector $(0,1)$ to $(0,-1)$. What happens to orientation?
    options:
      - id: preserved
        text: It is preserved, because turning from the first edge to the second is still counterclockwise.
        correct: true
        feedback: Both edges turn halfway around, keeping the order of the pair. The determinant is positive.
      - id: reversed
        text: It is reversed, because both arrows end up pointing in the opposite direction from before.
        correct: false
        feedback: Changing individual directions does not necessarily reverse the order of the pair.
      - id: undefined
        text: It is undefined, because neither arrow ends up pointing along a positive coordinate axis.
        correct: false
        feedback: Orientation is still defined on the negative axes. The ordered pair remains counterclockwise.
    solution: This is a half-turn, which keeps the order of the edges. Turning from left to down is counterclockwise, just as turning from right to up was.
  - id: det-area-camera-region
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A camera applies a $2\times2$ matrix to a flat map. A region of area 6 becomes a region of area 18, and an ordered pair of edges changes from counterclockwise to clockwise. What is the matrix's determinant?
    answer: -3
    tolerance: { abs: 0 }
    common_wrong:
      - {
          answer: 3,
          category: misunderstood_definition,
          feedback: "The area scale is 3, but the reversed edge order makes the determinant negative.",
        }
      - {
          answer: -18,
          category: incorrect_reasoning,
          feedback: "Use the ratio of output area to input area, not the output area alone.",
        }
    solution: The area scale is $18/6=3$. The reversed order makes the signed scale, the determinant, $-3$.
  - id: det-calculate-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: For $A=\begin{bmatrix}a&b\\c&d\end{bmatrix}$, which calculation gives its determinant?
    options:
      - id: diagonal-difference
        text: Multiply $a$ by $d$, then subtract $b$ times $c$.
        correct: true
        feedback: The signed area scale is $ad-bc$.
      - id: diagonal-sum
        text: Multiply $a$ by $d$, then add $b$ times $c$.
        correct: false
        feedback: Adding the two products loses the subtraction that accounts for the slant and orientation.
      - id: row-difference
        text: Multiply $a$ by $b$, then subtract $c$ times $d$.
        correct: false
        feedback: The products pair opposite corners, not entries in the same row.
    solution: The $2\times2$ determinant is $ad-bc$, the top-left to bottom-right product minus the other diagonal product.
  - id: det-calculate-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    lesson_only: true
    est_minutes: 1
    prompt: Why does the worked example subtract the grey triangles from the enclosing rectangle?
    options:
      - id: outside-output
        text: They lie inside the enclosing rectangle and outside the transformed square.
        correct: true
        feedback: Removing only those outside pieces leaves the green parallelogram's area.
      - id: remove-slant
        text: They lie inside the transformed square and must be removed when it tilts.
        correct: false
        feedback: Areas inside the transformed square must be kept. The grey triangles are outside it.
      - id: outside-input
        text: They lie outside the original unit square and count as lost input area.
        correct: false
        feedback: We are finding the output area, not subtracting from the original unit square. The grey pieces fill the enclosing rectangle outside the output.
    solution: The enclosing rectangle contains the green parallelogram plus four grey triangles. Subtracting the grey area leaves $12-7=5$, the area of the unit square's image.
  - id: det-calculate-fixed
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: What is the determinant of $\begin{bmatrix}2&3\\1&5\end{bmatrix}$?
    answer: 7
    tolerance: { abs: 0 }
    common_wrong:
      - {
          answer: 13,
          category: math_error,
          feedback: "Subtract the other diagonal product instead of adding it.",
        }
      - {
          answer: -7,
          category: math_error,
          feedback: "Keep the top-left to bottom-right product first.",
        }
    solution: The diagonal products are $2\times5=10$ and $3\times1=3$. Their difference is $10-3=7$.
  - id: det-calculate-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      What is the determinant of $A=\begin{bmatrix}{{=a}}&{{=b}}\\{{=c}}&{{=d}}\end{bmatrix}$?
    params:
      a: { min: 1, max: 4 }
      b: { min: 1, max: 4 }
      c: { min: 1, max: 4 }
      d: { min: 1, max: 4 }
    constraints: ["abs(a*d-b*c) > 4"]
    answer_expr: a*d-b*c
    tolerance: { abs: 0 }
    common_wrong:
      - answer_expr: a*d+b*c
        category: math_error
        feedback: The second diagonal product is subtracted, not added.
      - answer_expr: b*c-a*d
        category: math_error
        feedback: Reversing the subtraction flips the sign. Start with the top-left to bottom-right product.
    solution: The first diagonal gives ${{=a}}\times{{=d}}={{=a*d}}$, and the other gives ${{=b}}\times{{=c}}={{=b*c}}$. Subtracting gives ${{=a*d-b*c}}$.
  - id: det-calculate-wrong-addition
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: A learner reports determinant 14 for $A=\begin{bmatrix}3&2\\1&4\end{bmatrix}$, after calculating $3\times4+2\times1$. What went wrong?
    options:
      - id: addition
        text: They added the second diagonal product when they needed to subtract it.
        correct: true
        feedback: The determinant is $3\times4-2\times1=10$.
      - id: reversed
        text: They used the second diagonal product first, reversing the determinant's sign.
        correct: false
        feedback: They kept the first product in the right place. Their error was adding the second product.
      - id: rows
        text: They paired entries within each row when they needed opposite corners.
        correct: false
        feedback: Both products use the correct corners. The operation between the products is wrong.
    solution: The products are correct but should be subtracted. The signed area scale is $12-2=10$, rather than 14.
  - id: det-calculate-rectangular
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: A matrix has 2 rows and 3 columns. What can you say about its determinant?
    options:
      - id: undefined
        text: It has no determinant because the matrix is not square.
        correct: true
        feedback: A determinant is defined for a matrix with equal row and column counts.
      - id: first-two
        text: Its determinant comes from the first two columns only.
        correct: false
        feedback: Dropping a column would make a different matrix, not a determinant for the original one.
      - id: three-products
        text: Its determinant comes from three diagonal products.
        correct: false
        feedback: Extra products cannot give a determinant to a nonsquare matrix.
    solution: A determinant belongs to a square matrix. A $2\times3$ matrix is rectangular, so its determinant is not defined.
  - id: det-calculate-robot-region
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: A robot converts planar coordinates $(x,y)$ to $(x+2y,3x+y)$. A region starts with area 2 square units. What is its area after this conversion, in square units?
    answer: 10
    tolerance: { abs: 0 }
    common_wrong:
      - {
          answer: -10,
          category: misunderstood_definition,
          feedback: "The determinant is negative, but ordinary area uses its magnitude.",
        }
      - {
          answer: 5,
          category: incorrect_reasoning,
          feedback: "That is the area scale. The original region has area 2.",
        }
    solution: The coordinate map has matrix $\begin{bmatrix}1&2\\3&1\end{bmatrix}$ and determinant $1-6=-5$. Its area scale is 5, so the region's new area is $2\times5=10$.
  - id: det-zero-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 1
    prompt: What does a zero determinant mean for a $2\times2$ matrix's map?
    options:
      - id: collapse
        text: It collapses areas to zero and cannot uniquely recover inputs.
        correct: true
        feedback: The plane is squeezed to a line or point, and different inputs share an output.
      - id: reflection
        text: It preserves areas but reverses the order of the two edges.
        correct: false
        feedback: A negative nonzero determinant can reverse the order. Zero means the area has collapsed.
      - id: zero-vector
        text: It sends every input to the origin and has no other output.
        correct: false
        feedback: A zero determinant can also collapse the plane to an entire line, not just the origin.
    solution: A zero determinant means all area disappears. Inputs merge into shared outputs, so the map has no inverse.
  - id: det-zero-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    lesson_only: true
    est_minutes: 1
    prompt: In the worked example for $C$, why do the two inputs giving $(2,0)$ rule out an inverse?
    options:
      - id: ambiguity
        text: One output cannot identify which of those different inputs it came from.
        correct: true
        feedback: An inverse must recover one unique original input from each output.
      - id: output-zero
        text: An output containing a zero coordinate always prevents a matrix inverse.
        correct: false
        feedback: Invertible maps can produce zero coordinates. The problem is different inputs sharing the same output.
      - id: reciprocals
        text: An inverse must take the reciprocal of each entry, and the output contains zero.
        correct: false
        feedback: Undoing a matrix map does not mean taking reciprocals of output entries. The problem is different inputs sharing one output.
    solution: Both $(1,0)$ and $(0,2)$ become $(2,0)$. There is no unique input an inverse could recover from that output.
  - id: det-zero-nonzero-entries
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Calculate the determinant of $\begin{bmatrix}2&3\\4&6\end{bmatrix}$.
    answer: 0
    tolerance: { abs: 0 }
    common_wrong:
      - {
          answer: 24,
          category: math_error,
          feedback: "Subtract the two diagonal products; do not add them.",
        }
      - {
          answer: 12,
          category: math_error,
          feedback: "That is one diagonal product. Subtract the other diagonal product too.",
        }
    solution: The determinant is $2\times6-3\times4=12-12=0$. Even though every entry is nonzero, the columns lie along the same line.
  - id: det-zero-missing-entry-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      Choose $t$ so that $A=\begin{bmatrix}{{=a}}&{{=b}}\\{{=a*k}}&t\end{bmatrix}$ has no inverse.
    params:
      a: { min: 2, max: 5 }
      b: { min: 2, max: 5 }
      k: { min: 2, max: 3 }
    constraints: ["a != b", "b*k != a"]
    answer_expr: b*k
    tolerance: { abs: 0 }
    common_wrong:
      - answer_expr: a*k
        category: misunderstood_definition
        feedback: Copying the bottom-left entry does not make the determinant zero. Balance the two diagonal products.
      - answer_expr: b
        category: misunderstood_definition
        feedback: The bottom row must keep the same ratio as the top row. Copying the top-right entry misses that ratio.
    solution: With no inverse, the determinant must be zero. Its diagonal products are ${{=a}}t$ and ${{=b}}\times{{=a*k}}$, which balance when $t={{=b*k}}$.
  - id: det-zero-entry-mistake
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: A learner says $A=\begin{bmatrix}2&0\\0&3\end{bmatrix}$ has no inverse because it contains zero entries. What is the right conclusion?
    options:
      - id: invertible
        text: It has an inverse because its determinant is 6.
        correct: true
        feedback: Its determinant is nonzero, so the independent stretches can be undone.
      - id: no-inverse
        text: It has no inverse because either zero entry erases an input.
        correct: false
        feedback: Each input still controls its own output coordinate. Zero entries alone do not imply lost information.
      - id: negative
        text: It has no inverse because its determinant is $-6$.
        correct: false
        feedback: Its determinant is $2\times3-0\times0=6$. A negative nonzero determinant would also allow an inverse.
    solution: The determinant is $2\times3-0\times0=6$, so the matrix is invertible. The input coordinates can be recovered by undoing the two stretches.
  - id: det-zero-negative-inverse
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: A square matrix has determinant $-4$. What does this tell us about recovering the original input from its output?
    options:
      - id: can-undo
        text: An inverse exists because the determinant is nonzero.
        correct: true
        feedback: A mirror flip can be undone. A zero determinant, not a negative one, signals lost information.
      - id: cannot-flip
        text: No inverse exists because a reversed orientation loses information.
        correct: false
        feedback: Reversing orientation does not merge different inputs. A negative nonzero determinant still allows an inverse.
      - id: require-one
        text: An inverse exists only after the determinant has been changed to 1.
        correct: false
        feedback: Any nonzero determinant allows an inverse; area need not be preserved.
    solution: The determinant is nonzero, so the square matrix is invertible. Its reversed orientation does not prevent recovery of the input.
  - id: det-zero-robot-inputs
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A robot stores a planar position $(x,y)$ as $(x+2y,2x+4y)$. Which pair of different positions produces the same stored pair?
    options:
      - id: merged-positions
        text: Positions $(2,1)$ and $(0,2)$.
        correct: true
        feedback: Both positions give $(4,8)$, so the conversion loses information about which position was the input.
      - id: swapped-coordinates
        text: Positions $(1,2)$ and $(2,1)$.
        correct: false
        feedback: These give $(5,10)$ and $(4,8)$. Swapping the input coordinates does not preserve this map's output.
      - id: sign-error
        text: Positions $(-2,1)$ and $(0,2)$.
        correct: false
        feedback: These give $(0,0)$ and $(4,8)$. The negative first coordinate changes the output.
    solution: The matrix is $\begin{bmatrix}1&2\\2&4\end{bmatrix}$, whose determinant is $4-4=0$. In particular, $(2,1)$ and $(0,2)$ both become $(4,8)$, so no inverse can distinguish them.
  - id: det-explain-map
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt: |
      For $A=\begin{bmatrix}-2&1\\0&3\end{bmatrix}$, calculate the determinant and explain what its size and sign say about a picture. Then explain why a zero determinant would prevent an inverse.
    rubric:
      - {
          id: calculation,
          criterion: "Calculate the determinant as $(-2)\\times3-1\\times0=-6$.",
          weight: 1,
          required: true,
        }
      - {
          id: area-scale,
          criterion: "Explain that the magnitude 6 multiplies every area by 6.",
          weight: 1,
          required: true,
        }
      - {
          id: orientation,
          criterion: "Explain that the negative sign reverses orientation.",
          weight: 1,
          required: true,
        }
      - {
          id: lost-input,
          criterion: "Explain that a zero determinant merges different inputs into the same output, preventing an inverse.",
          weight: 1,
          required: true,
        }
    exemplar: The determinant is $(-2)\times3-1\times0=-6$. Every region's area grows by a factor of 6, while the negative sign means its orientation reverses. If the determinant were zero, the plane would collapse to a line or point and different inputs would share an output, so there would be no unique input for an inverse to recover.
    solution: A determinant combines an area scale with orientation. Its magnitude is 6 here and its sign records a flip; zero would instead mean information was lost.
  - id: det-recall-area-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: det-area-orientation
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what do the magnitude and the sign of a two-dimensional determinant tell you?
    rubric:
      - id: meaning
        criterion: Explain that the determinant’s magnitude is the factor multiplying every region’s area.
        weight: 1
        required: true
      - id: rule
        criterion: Explain that a negative determinant reverses orientation and a positive one preserves it.
        weight: 1
        required: true
    exemplar: The magnitude tells how much every region’s area is multiplied by. A positive sign keeps the orientation, and a negative sign reverses it.
  - id: det-recall-area-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: det-area-orientation
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: A map has determinant $-1$. What happens to a region?
    options:
      - id: a
        text: Its area stays the same and its orientation is preserved.
        correct: false
        feedback: That describes determinant $1$. The negative sign records reversed orientation.
      - id: b
        text: Its area becomes zero and its shape collapses to a line.
        correct: false
        feedback: A collapse has determinant zero. A determinant of $-1$ has magnitude 1, so area stays the same.
      - id: c
        text: Its area stays the same and its orientation is reversed.
        correct: true
        feedback: Magnitude 1 preserves area, and the negative sign reverses orientation.
    solution: The magnitude gives area scale 1, and the negative sign records a flip.
  - id: det-recall-area-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: det-area-orientation
    difficulty: 1
    est_minutes: 0.5
    prompt: A region has area $S$. A two-dimensional linear transformation has determinant $d$. Write the output area. Use `abs(...)` for magnitude.
    answer: S*abs(d)
    variables:
      S:
        - 0.5
        - 8
      d:
        - -5
        - 5
    solution: Every area is multiplied by the determinant’s magnitude, giving $S|d|$.
  - id: det-recall-two-by-two-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: det-two-by-two
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, how do you calculate the determinant of a two-by-two matrix, and which matrices does this shortcut cover?
    rubric:
      - id: meaning
        criterion: Explain that the determinant is top-left times bottom-right minus top-right times bottom-left.
        weight: 1
        required: true
      - id: rule
        criterion: Explain that this shortcut works for every two-by-two matrix, including negative entries.
        weight: 1
        required: true
    exemplar: Multiply the top-left and bottom-right entries, then subtract the product of the other diagonal. This works for every two-by-two matrix, including matrices with negative entries.
  - id: det-recall-two-by-two-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: det-two-by-two
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: A two-by-two matrix with nonzero determinant has its columns swapped. How does its determinant change?
    options:
      - id: a
        text: It keeps its magnitude and reverses its sign.
        correct: true
        feedback: Swapping columns reverses the edge order and changes $ad-bc$ into $bc-ad$.
      - id: b
        text: It keeps its magnitude and keeps its sign.
        correct: false
        feedback: The parallelogram and its area stay the same. Its edges now come in the opposite order, so the sign flips.
      - id: c
        text: It becomes zero because the area collapses.
        correct: false
        feedback: A collapse means the columns lie on the same line. Swapping columns preserves their directions.
    solution: Swapping columns changes $ad-bc$ to $bc-ad$, the negative of the original determinant.
  - id: det-recall-two-by-two-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: det-two-by-two
    difficulty: 1
    est_minutes: 0.5
    prompt: Write the determinant of $A=\begin{bmatrix}a&b\\c&d\end{bmatrix}$.
    answer: a*d-b*c
    variables:
      a:
        - -5
        - 5
      b:
        - -5
        - 5
      c:
        - -5
        - 5
      d:
        - -5
        - 5
    solution: "$\\det(A)=ad-bc$: subtract the second diagonal product from the first."
  - id: det-recall-zero-collapse-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: det-zero-collapse
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what does a zero determinant do to a two-dimensional picture, and why does that prevent an inverse?
    rubric:
      - id: meaning
        criterion: Explain that the picture collapses to a line or a point.
        weight: 1
        required: true
      - id: rule
        criterion: Explain that different inputs share an output, so the original input cannot be recovered uniquely.
        weight: 1
        required: true
    exemplar: A zero determinant collapses a two-dimensional picture to a line or a point. Different inputs then share an output, so an inverse cannot identify which input to return.
  - id: det-recall-zero-collapse-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: det-zero-collapse
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: Which observation shows that a square matrix has lost information?
    options:
      - id: a
        text: It doubles the area of every region in the picture.
        correct: false
        feedback: An area scale of 2 has nonzero determinant. Stretching can be undone without losing information.
      - id: b
        text: It sends two different inputs to the very same output.
        correct: true
        feedback: Once inputs merge, the output cannot tell us which original input to return.
      - id: c
        text: It sends a square to a shape with reversed orientation.
        correct: false
        feedback: A mirror flip with nonzero determinant can be undone.
    solution: Different inputs sharing an output prevent unique recovery.
  - id: det-recall-zero-collapse-contrast2
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: det-zero-collapse
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: Which condition describes exactly when a two-by-two matrix has an inverse?
    options:
      - id: a
        text: Every matrix entry is nonzero.
        correct: false
        feedback: 'All entries of $\begin{bmatrix}1&2\\2&4\end{bmatrix}$ are nonzero, yet its determinant is $4-4=0$.'
      - id: b
        text: Its determinant is not zero.
        correct: true
        feedback: Every nonzero determinant allows an inverse, whether positive or negative.
      - id: c
        text: Its determinant is positive.
        correct: false
        feedback: Negative determinants reverse orientation and still allow inverses, so positive leaves out invertible matrices.
    solution: A positive or negative nonzero determinant guarantees an inverse.
  - id: det-stencil-mirror-map
    dimension: transfer
    type: mc
    role: review
    difficulty: 3
    est_minutes: 1
    prompt: A print shop moves every point of a flat stencil by multiplying its coordinate vector by a $2\times2$ matrix. Which matrix reverses the orientation of the stencil and keeps its area the same?
    options:
      - id: same-orientation
        text: '$\begin{bmatrix}2&1\\1&1\end{bmatrix}$'
        correct: false
        feedback: Its determinant is $1$, so it keeps both the area and the orientation.
        category: misunderstood_definition
      - id: reverse-same-area
        text: '$\begin{bmatrix}1&2\\1&1\end{bmatrix}$'
        correct: true
        feedback: Its determinant is $-1$, which reverses orientation and leaves the area unchanged.
      - id: reverse-larger-area
        text: '$\begin{bmatrix}1&2\\2&1\end{bmatrix}$'
        correct: false
        feedback: Its determinant is $-3$, so it reverses orientation but triples the area.
        category: misunderstood_definition
    solution: The stencil needs a negative determinant with magnitude 1. The matrix with rows $(1,2)$ and $(1,1)$ has determinant $1\times1-2\times1=-1$.
