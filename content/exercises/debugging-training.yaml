concept: debugging-training
exercises:
  - id: lab-image-classifier-dropout
    dimension: transfer
    type: explain
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "A model that sorts pictures into categories uses dropout. Its weights stay fixed, but repeated validation calls give different losses. The evaluator uses `torch.no_grad()` and calls `model.train()`. Explain the likely cause, the change you would make, and how you would check the fix."
    rubric:
      - {
          id: cause,
          criterion: "Explain that dropout randomly sets some input numbers to $0$ in training mode, so the same pictures and weights can give different losses.",
          weight: 1,
          required: true,
        }
      - {
          id: fix,
          criterion: "Call `model.eval()` to turn dropout off during evaluation.",
          weight: 1,
          required: true,
        }
      - {
          id: check,
          criterion: "Repeat evaluation on unchanged inputs and weights and check that the losses agree.",
          weight: 1,
          required: true,
        }
      - {
          id: recording,
          criterion: "Mention keeping `torch.no_grad()` to pause recording the calculations needed to find slopes; dropout stays active in training mode.",
          weight: 0.5,
          required: false,
        }
    exemplar: "Training mode keeps dropout active, so some numbers are randomly set to $0$ on each call. I would call `model.eval()` to turn dropout off and keep `torch.no_grad()` to pause recording the calculations needed to find slopes. I would measure loss twice on the same pictures with the same weights and check that the losses agree. Before training again, I would call `model.train()`."
    solution: "Training mode keeps dropout active even inside `torch.no_grad()`. Call `model.eval()` with `torch.no_grad()` and compare repeated losses on unchanged inputs and weights."
  - id: dx-dl-5
    dimension: transfer
    type: debug
    role: diagnostic
    difficulty: 3
    est_minutes: 3
    prompt: "This PyTorch training loop takes inputs and targets from `loader`, one batch at a time. It runs without errors, but the loss never improves. Which line is wrong, and what is the fix?"
    code: |
      for xb, yb in loader:
          optimizer.zero_grad()
          pred = model(xb)
          loss = loss_fn(pred, yb)
          optimizer.step()
          loss.backward()
    buggy_line: 5
    fix_options:
      - {
          id: a,
          text: "Swap lines 5 and 6: call loss.backward() before optimizer.step()",
          correct: true,
          feedback: "`optimizer.step()` uses the slopes in `.grad`. They have just been cleared, so the weights stay fixed.",
        }
      - {
          id: b,
          text: "Move `optimizer.zero_grad()` after `optimizer.step()`",
          correct: false,
          feedback: "The update would still come before slope calculation, so it would lack slopes from the current batch.",
        }
      - {
          id: c,
          text: "Add another `optimizer.zero_grad()` just after `loss.backward()`",
          correct: false,
          feedback: "This clears the slopes as soon as they are calculated.",
        }
      - {
          id: d,
          text: "Lower the learning rate",
          correct: false,
          feedback: "Changing the rate still leaves the update without the slopes it needs.",
        }
    solution: "Every update reads `.grad` after the slopes have been cleared, so the weights stay fixed. Compute the current batch's slopes with `loss.backward()` before applying them with `optimizer.step()`."
  - id: dbt-curve-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt:
      A run starts with poor predictions and repeats exactly the same full-data loss after every
      update. Which measurement best tests whether updates are being applied?
    options:
      - id: a
        text: Compare parameter values immediately before and after one update.
        correct: true
        feedback: This directly checks whether the update changes the model.
      - id: b
        text: Compare training loss with validation loss at the end of the epoch.
        correct: false
        feedback:
          That helps check performance on new examples, but does not directly check parameter changes
          during a step.
        category: incorrect_reasoning
      - id: c
        text: Compare the current full-data loss with the current minibatch loss.
        correct: false
        feedback: Different example sets can have different losses even when no parameter update is
          applied.
        category: incorrect_reasoning
    solution:
      Check whether the parameters change from before the update to after it. If they stay the
      same despite nonzero gradients, inspect the update code.
  - id: dbt-floor-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does the green run in the worked example approach loss 5 rather than zero?
    options:
      - id: a
        text: One constant time cannot match all four recorded times.
        correct: true
        feedback: The best constant is 4, but the remaining squared errors average to 5.
      - id: b
        text: A learning rate of 0.25 always leaves loss 5.
        correct: false
        feedback: The floor comes from these data and this model, not a universal rate rule.
        category: incorrect_reasoning
      - id: c
        text: The update code stops before the best prediction.
        correct: false
        feedback: The green run approaches the best constant prediction.
        category: incorrect_reasoning
    solution: The best constant is 4, but the remaining squared errors average to 5.
  - id: dbt-update-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: A model predicts one constant time $w={{= w }}$ for trips lasting 1, 3, 5 and 7 seconds.
      Using their mean squared error and one gradient-descent step with $\eta={{= eta }}$, what is the
      new $w$?
    params:
      w:
        min: 0
        max: 8
        step: 2
      eta:
        min: 0.1
        max: 0.3
        step: 0.1
    answer_expr: w-eta*2*(w-4)
    tolerance:
      abs: 0.001
    solution: Average the four loss slopes to get $2({{= w }}-4)={{= 2*(w-4) }}$. Subtract the rate
      times this slope, giving $w_{\text{new}}={{= w-eta*2*(w-4) }}$.
    common_wrong:
      - answer_expr: w+eta*2*(w-4)
        category: math_error
        feedback: Gradient descent subtracts the scaled average slope from the current prediction.
    constraints:
      - w != 4
  - id: dbt-rising
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Full-batch losses rise from 21 to 41 to 86. Which comparison would help separate excessive
      step size from an incorrect update sign?
    options:
      - id: a
        text: Rerun from the same parameters at half the learning rate and compare the loss trend.
        correct: true
        feedback:
          A smaller rate can stabilize correct overshooting steps, while a flipped sign still
          moves uphill.
      - id: b
        text: Rerun at the same rate with the full-batch examples in a different order.
        correct: false
        feedback:
          Reordering the same full batch does not change its average gradient, so it does not
          isolate step size or sign.
        category: incorrect_reasoning
      - id: c
        text: Compare training and validation losses to determine whether the update sign is correct.
        correct: false
        feedback:
          That comparison checks performance on new examples; it does not directly separate overshooting
          from a sign error.
        category: incorrect_reasoning
    solution:
      Reducing the learning rate from the same starting parameters tests the step-size explanation.
      A still-rising curve calls for checking the update sign and other causes; it does not identify
      the bug on its own.
  - id: dbt-slow
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Full-data loss falls smoothly by very small amounts, and comparable runs reach much lower
      loss. Which trial most directly tests a learning rate that is too small?
    options:
      - id: a
        text: Cautiously increase the rate and compare full-data progress from the same start.
        correct: true
        feedback: A larger rate tests whether the useful steps were simply too small.
      - id: b
        text: Increase batch size while keeping the rate fixed to reduce sampling noise.
        correct: false
        feedback:
          The smooth full-data curve gives no particular evidence that sampling noise is causing
          the slow progress.
        category: incorrect_reasoning
      - id: c
        text: Use a smaller rate and train for the same number of updates.
        correct: false
        feedback: That makes each step smaller and does not test whether larger steps would improve
          progress.
        category: incorrect_reasoning
    solution:
      Cautiously increasing the rate tests whether each update was too small. Compare the full-data
      loss trend and stop increasing if larger steps become unstable.
  - id: dbt-noise
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A delivery-time model has occasional minibatch loss increases while whole-dataset loss falls
      each epoch. Which evidence should guide the first diagnosis?
    options:
      - id: a
        text: The falling whole-dataset trend supports progress despite differing minibatches.
        correct: true
        feedback: Different minibatches can give noisy losses and gradients, so the broader trend is
          informative.
      - id: b
        text: The minibatch increases identify a reversed update sign despite the full-data trend.
        correct: false
        feedback: A batch increase alone cannot identify a sign error; valid stochastic updates can
          show bumps.
        category: incorrect_reasoning
      - id: c
        text: The falling whole-dataset trend establishes that the exact gradient formula is correct.
        correct: false
        feedback: A wrong gradient with a useful direction can still reduce loss, so gradient checks
          remain a separate test.
        category: incorrect_reasoning
    solution:
      Minibatch gradients are noisy estimates, and different batches can have different losses.
      A falling whole-dataset trend supports overall progress, while exact gradient correctness needs
      its own check.
  - id: dbt-floor-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt:
      A constant model predicts one time for trips lasting $a={{= a }}$ and $b={{= b }}$ seconds.
      Its best prediction is their average. What is the lowest average squared-error loss?
    params:
      a:
        min: 1
        max: 3
        step: 1
      b:
        min: 5
        max: 9
        step: 2
    answer_expr: ((b-a)/2)^2
    tolerance:
      abs: 0.001
    solution:
      Use the stated formula with the sampled values. This gives ${{= ((b-a)/2)^2 }}$, because the
      calculation keeps the same examples and settings throughout.
    common_wrong:
      - answer_expr: (b-a)^2
        category: math_error
        feedback: Check the sign and every factor in the stated formula before applying it.
  - id: dbt-tiny-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: What can repeated training on a tiny batch with a known zero-loss fit help test?
    options:
      - id: a
        text: Whether the implemented model and updates can fit those chosen examples.
        correct: true
        feedback: A known achievable fit makes failure on this small batch useful evidence.
      - id: b
        text: Whether the implemented gradients match numerical slopes for every parameter.
        correct: false
        feedback:
          Successful fitting does not verify each slope formula; numerical gradient checks address
          that.
        category: incorrect_reasoning
      - id: c
        text: Whether a plateau on that batch proves the model has too few adjustable weights.
        correct: false
        feedback:
          The known zero-loss fit already shows the model has enough adjustable weights for those examples; a plateau
          can come from code or settings.
        category: incorrect_reasoning
    solution:
      The tiny-batch test checks whether the model and update implementation can reach a known
      fit. It narrows debugging to a small case, while gradient accuracy and new-example performance
      require separate checks.
  - id: dbt-tiny-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: The buggy run's weight slope is zero at w=2.6. Why does its loss still stay at 0.1?
    options:
      - id: a
        text: The weight contributions cancel and the bias never changes.
        correct: true
        feedback: The weight cannot improve by its current slope, while the nonzero bias slope is ignored.
      - id: b
        text: Zero weight slope proves both examples have zero error.
        correct: false
        feedback: The errors are -0.4 and 0.2, which are not zero.
        category: incorrect_reasoning
      - id: c
        text: The remaining loss must be caused by batch noise.
        correct: false
        feedback: Both examples are used every time, so no subset is being sampled.
        category: incorrect_reasoning
    solution: The weight cannot improve by its current slope, while the nonzero bias slope is ignored.
  - id: dbt-tiny-update
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt:
      A linear model $\hat y=wx+b$ starts at $w=b=0$ on trips $(x,y)=(1,{{= y1 }}),(2,{{= y2 }})$.
      Using mean squared error and one gradient-descent step with rate 0.1, what is the new $w$?
    params:
      y1:
        min: 2
        max: 4
        step: 1
      y2:
        min: 5
        max: 7
        step: 1
    answer_expr: .1*(y1+2*y2)
    tolerance:
      abs: 0.001
    solution:
      Use the stated formula with the sampled values. This gives ${{= .1*(y1+2*y2) }}$, because
      the calculation keeps the same examples and settings throughout.
    common_wrong:
      - answer_expr: .1*(y1+y2)
        category: math_error
        feedback: Check the sign and every factor in the stated formula before applying it.
  - id: dbt-tiny-loss
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt:
      A linear model $\hat y=wx+b$ has $w={{= w }}$ and $b={{= b }}$. For trips $(x,y)=(1,3),(2,5)$,
      what is its mean squared-error loss?
    params:
      w:
        min: 1
        max: 3
        step: 1
      b:
        min: 0
        max: 2
        step: 1
    answer_expr: ((w+b-3)^2+(2*w+b-5)^2)/2
    tolerance:
      abs: 0.001
    solution:
      Use the stated formula with the sampled values. This gives ${{= ((w+b-3)^2+(2*w+b-5)^2)/2
      }}$, because the calculation keeps the same examples and settings throughout.
    common_wrong:
      - answer_expr: (w+b-3)^2+(2*w+b-5)^2
        category: math_error
        feedback: Check the sign and every factor in the stated formula before applying it.
    constraints:
      - w != 2 or b != 1
  - id: dbt-tiny-flat
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: On trips $(1,3)$ and $(2,5)$, a linear model stalls at $w=2.6$, $b=0$ with loss 0.1. Its
      weight slope is 0 and bias slope is -0.2. What should you inspect first?
    options:
      - id: a
        text: Whether the bias parameter is included in the optimiser updates.
        correct: true
        feedback: The nonzero bias slope offers improvement even though the weight slope is zero.
      - id: b
        text: Whether a hidden layer is needed because the linear model cannot fit both trips.
        correct: false
        feedback:
          The line with weight 2 and bias 1 fits both trips exactly, so a hidden layer is unnecessary
          for this test.
        category: incorrect_reasoning
      - id: c
        text: Whether a larger weight-only learning rate can move the zero weight slope.
        correct: false
        feedback: Scaling a zero weight slope cannot move that weight; the nonzero bias slope is the
          useful clue.
        category: incorrect_reasoning
    solution:
      The bias slope is nonzero, so applying its update could still reduce the loss. Check that
      the optimiser includes the bias and actually changes it.
  - id: dbt-tiny-drone
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A drone model has a known zero-loss fit on eight chosen examples, but training stalls high.
      Which experiment best isolates the fitting failure?
    options:
      - id: a
        text: Keep those eight examples fixed and inspect parameter changes and slopes at a smaller
          rate.
        correct: true
        feedback: The fixed easy case lets you test update application, suspicious gradients and stability.
      - id: b
        text: Switch to the full dataset and compare validation loss after a complete training run.
        correct: false
        feedback: That adds examples and cost before explaining failure on the known easy case.
        category: incorrect_reasoning
      - id: c
        text: Add more layers and compare the final training losses after the same long run.
        correct: false
        feedback:
          The known fit already shows the model has enough adjustable weights for this batch; extra layers add
          a new variable.
        category: incorrect_reasoning
    solution: Keep the known fitting case small while checking that parameters change and suspicious
      gradients agree with numerical slopes. Trying a smaller rate can also test whether unstable steps
      prevent fitting.
  - id: dbt-tiny-generalise
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A tiny-batch test reaches nearly zero loss. What has it established?
    options:
      - id: a
        text: The updates can fit this batch, but new-example performance is unknown.
        correct: true
        feedback: The test uses training examples repeatedly, so validation is still needed.
      - id: b
        text: The model must also have nearly zero validation loss.
        correct: false
        feedback: The test has not measured validation predictions.
        category: incorrect_reasoning
      - id: c
        text: Every individual slope formula is necessarily correct.
        correct: false
        feedback: Even a wrong slope can sometimes keep moving downhill.
        category: incorrect_reasoning
    solution: The test uses training examples repeatedly, so validation is still needed.
  - id: dbt-check-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: What does a gradient check compare?
    options:
      - id: a
        text: A code slope and a slope estimated by nudging one parameter.
        correct: true
        feedback: Both describe how the same loss changes with that parameter, which makes disagreement useful.
      - id: b
        text: Training loss and validation loss on different examples.
        correct: false
        feedback: That comparison checks performance on new examples. The question asks how to check the code's slope calculation.
        category: incorrect_reasoning
      - id: c
        text: Two learning rates with all weights changed at once.
        correct: false
        feedback: A gradient check holds other parameters fixed and tests one slope.
        category: incorrect_reasoning
    solution: Both describe how the same loss changes with that parameter, which makes disagreement useful.
  - id: dbt-check-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does the worked example divide the loss difference by 2h rather than h?
    options:
      - id: a
        text: The two tested weights are w-h and w+h, separated by 2h.
        correct: true
        feedback: A slope divides output change by the distance between the two input values.
      - id: b
        text: There are two examples in the batch.
        correct: false
        feedback: The example checks one trip, and the denominator is a weight distance.
        category: incorrect_reasoning
      - id: c
        text: Squared error always requires doubling the denominator.
        correct: false
        feedback: The denominator comes from the two nudges, not the choice of squared error.
        category: incorrect_reasoning
    solution: A slope divides output change by the distance between the two input values.
  - id: dbt-slope-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt:
      A gradient check tests the model $\hat y=wx$ with squared-error loss $(wx-y)^2$. At $x={{=
      x }}$, $y={{= y }}$ and $w={{= w }}$, what weight slope should the model's calculation give,
      matching the numerical slope?
    params:
      x:
        min: 2
        max: 4
        step: 1
      y:
        min: 5
        max: 7
        step: 1
      w:
        min: 0
        max: 1
        step: 1
    answer_expr: 2*(w*x-y)*x
    tolerance:
      abs: 0.001
    solution:
      Differentiate the squared error and multiply by the prediction's weight derivative $x$.
      The weight slope is $2({{= w }}({{= x }})-{{= y }})({{= x }})={{= 2*(w*x-y)*x }}$.
    common_wrong:
      - answer_expr: 2*(w*x-y)
        category: math_error
        feedback: The prediction changes by x times the weight change, so include the extra factor x.
  - id: dbt-numerical
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A check uses h=0.01, L(w+h)=8.8804 and L(w-h)=9.1204. What is the numerical slope?
    answer: -12
    tolerance:
      abs: 0.001
    common_wrong:
      - answer: -24
        category: math_error
        feedback: Divide by the full separation 2h=0.02, not by h.
    solution:
      The weights are separated by 0.02, so the slope is (8.8804-9.1204)/0.02=-12. Keeping everything
      else fixed makes this a check of the weight slope.
  - id: dbt-relative-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt:
      A gradient check gives code slope $a={{= a }}$ and numerical slope $n={{= n }}$. What fraction
      of the larger slope magnitude is the size of their difference? Give three decimal places.
    params:
      a:
        min: -8
        max: -2
        step: 2
      n:
        min: -12
        max: -10
        step: 2
    answer_expr: abs(a-n)/max(abs(a),abs(n))
    tolerance:
      abs: 0.001
    solution:
      Take the absolute difference and divide by the larger slope magnitude. This gives $|{{=
      a }}-({{= n }})|/\max(|{{= a }}|,|{{= n }}|)={{= abs(a-n)/max(abs(a),abs(n)) }}$ before rounding.
    common_wrong:
      - answer_expr: abs(a-n)
        category: math_error
        feedback: That is just the size of the difference; divide it by the larger slope magnitude.
  - id: dbt-falling-trap
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: For positive inputs, code omits the input factor from a squared-error weight slope, yet
      loss still falls. How can a gradient check expose this?
    options:
      - id: a
        text: The code and numerical slopes can share a sign while disagreeing in size.
        correct: true
        feedback: A missing positive factor can preserve a downhill direction while changing the derivative.
      - id: b
        text: The code and numerical slopes must agree because both describe a falling loss.
        correct: false
        feedback: Falling loss constrains the direction of a useful step, not the exact derivative magnitude.
        category: incorrect_reasoning
      - id: c
        text: The code and numerical slopes must have opposite signs whenever a factor is missing.
        correct: false
        feedback: Omitting a positive input factor changes size without reversing the sign.
        category: incorrect_reasoning
    solution: Omitting a positive input factor preserves the slope sign, so updates may still lower
      loss. Comparing with numerical nudges reveals the incorrect slope magnitude.
  - id: dbt-check-cost
    dimension: implementation
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A numerical check estimates each weight's slope using one small increase and one small
      decrease. For 1,000,000 weights, how many loss evaluations are needed?
    options:
      - id: a
        text: 2,000,000, using an upward and downward nudge for each weight.
        correct: true
        feedback: Each separately adjusted weight needs its own pair of loss measurements.
      - id: b
        text: 1,000,001, sharing one baseline loss with one upward nudge per weight.
        correct: false
        feedback: That uses one shared starting loss and one upward nudge per weight; here each weight needs two nudges.
        category: incorrect_reasoning
      - id: c
        text: 2, using one upward and one downward nudge of all weights together.
        correct: false
        feedback: Changing every weight together checks a combined direction, not each individual derivative.
        category: incorrect_reasoning
    solution:
      Central differences need two loss evaluations for each separately nudged weight. A million
      weights therefore need two million evaluations, making a few sampled weights much cheaper.
  - id: dbt-bias-debug
    dimension: implementation
    type: debug
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt:
      This one-trip squared-error loop uses separate slopes for w and b. Which line computes the wrong
      slope, and how should it change?
    code: |-
      for _ in range(20):
          e = w * x + b - y
          dw = 2 * e * x
          db = 2 * e * x
          w = w - lr * dw
          b = b - lr * db
    buggy_line: 4
    fix_options:
      - id: a
        text: Use db = 2 * e.
        correct: true
        feedback:
          The bias adds directly to the prediction, so its slope is twice the error without x. Line
          4 should be db = 2 * e.
      - id: b
        text: Use dw = 2 * e.
        correct: false
        feedback: The weight slope needs x because the weight multiplies the input.
      - id: c
        text: Use `b = b + lr * db`.
        correct: false
        feedback: Adding the slope would move the bias uphill, not repair its formula.
    solution:
      The bias adds directly to the prediction, so its slope is twice the error without x. Line
      4 should be db = 2 * e.
  - id: dbt-check-dropout
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      You're checking a weight's slope in a model that assigns labels to pictures and uses dropout. On the same pictures,
      the measured loss changes from call to call even before you nudge the weight. How can you
      make the two loss measurements reflect just the weight nudge?
    options:
      - id: a
        text: Use `model.train()` and measure both losses inside `torch.no_grad()`.
        correct: false
        feedback: Pausing slope recording leaves dropout active in training mode, so either loss can still vary.
      - id: b
        text: Use `model.eval()` and measure both losses inside `torch.no_grad()`.
        correct: true
        feedback: Evaluation mode turns dropout off for both measurements, so you can isolate the change in weight.
      - id: c
        text: Measure the first loss in `model.eval()` and the second in `model.train()`.
        correct: false
        feedback: Changing modes switches dropout on for the second measurement, so the losses can differ even without a weight nudge.
    solution:
      Keep the model in evaluation mode for both nudges so dropout stays off. When comparing with
      the slope calculated by the training code, compute it in evaluation mode too, with slope recording enabled.
  - id: dbt-symptom-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: Training loss keeps falling while validation loss clearly rises. What does this suggest?
    options:
      - id: a
        text: Overfitting rather than necessarily a broken update.
        correct: true
        feedback:
          The model is fitting training examples more closely while predicting held-out examples less
          well.
      - id: b
        text: A parameter that has never changed since training began.
        correct: false
        feedback: Falling training loss shows that predictions are changing.
        category: incorrect_reasoning
      - id: c
        text: Proof that every computed slope has the wrong sign.
        correct: false
        feedback: An uphill update would not explain the sustained improvement on training examples.
        category: incorrect_reasoning
    solution:
      The model is fitting training examples more closely while predicting held-out examples less
      well.
  - id: dbt-halve-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does halving the rates distinguish the two runs in the worked example?
    options:
      - id: a
        text: Correct steps become small enough, but flipped steps still go uphill.
        correct: true
        feedback: The correct distance multiplier has magnitude 0.25, while the flipped multiplier is 1.25.
      - id: b
        text: Halving any rate automatically fixes a wrong update sign.
        correct: false
        feedback: Smaller positive rates do not turn addition into subtraction.
        category: incorrect_reasoning
      - id: c
        text: The runs must keep identical losses at every smaller rate.
        correct: false
        feedback: Their original matching losses hid different distance multipliers.
        category: incorrect_reasoning
    solution: The correct distance multiplier has magnitude 0.25, while the flipped multiplier is 1.25.
  - id: dbt-flipped-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: A model predicts one constant time $w={{= w }}$ for trips lasting 1, 3, 5 and 7 seconds
      and uses mean squared error. Its buggy update is `w += eta * slope`, with $\eta={{= eta }}$. What
      value does this code assign to $w$?
    params:
      w:
        min: 0
        max: 2
        step: 1
      eta:
        min: 0.1
        max: 0.3
        step: 0.1
    answer_expr: w+2*eta*(w-4)
    tolerance:
      abs: 0.001
    solution:
      Use the stated formula with the sampled values. This gives ${{= w+2*eta*(w-4) }}$, because
      the calculation keeps the same examples and settings throughout.
    common_wrong:
      - answer_expr: w-2*eta*(w-4)
        category: math_error
        feedback: Check the sign and every factor in the stated formula before applying it.
  - id: dbt-nan
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Loss rises rapidly before becoming `nan` (not a number), and all input values are ordinary numbers. Which trial first
      tests unstable update sizes?
    options:
      - id: a
        text: Reduce the learning rate from the same start and compare the loss trajectory.
        correct: true
        feedback: Smaller steps test whether large updates are causing the numerical blow-up.
      - id: b
        text: Keep the rate fixed and use a number format that can store a wider range of values.
        correct: false
        feedback: That tests the computer's number range while keeping the update size unchanged.
        category: incorrect_reasoning
      - id: c
        text: Keep the rate fixed and add adjustable weights so the model can fit more complex patterns.
        correct: false
        feedback: Changing the model size adds another variable and does not isolate update size.
        category: incorrect_reasoning
    solution:
      Rapidly increasing loss can indicate unstable parameter updates. Reducing the rate from
      the same starting point tests that cause. If `nan` remains, inspect which calculations produce it.
  - id: dbt-check-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Training loss plateaus high on the full dataset. Which plan best separates an update-code
      problem from a learning setting?
    options:
      - id: a
        text: Test a known-fit tiny batch, check suspicious slopes numerically, then tune full runs.
        correct: true
        feedback: These small tests can expose update failures before expensive setting comparisons.
      - id: b
        text: Search rates on full runs, then use a tiny batch and gradient checks if none works.
        correct: false
        feedback: That spends full runs tuning before checking whether the implementation can fit a
          known easy case.
        category: incorrect_reasoning
      - id: c
        text: Fit a tiny batch, accept any falling loss as proof of correct slopes, then tune full runs.
        correct: false
        feedback: Falling loss does not verify exact gradients; a wrong slope can still point downhill.
        category: incorrect_reasoning
    solution:
      Start with a known-fit tiny batch and numerically check slopes that look suspicious. Once
      those tests support the implementation, full-run tuning is easier to interpret.
  - id: dbt-arm
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A robot-arm model's training loss keeps falling while validation loss rises after epoch
      12. Which next action best follows this evidence?
    options:
      - id: a
        text: Keep the best validation checkpoint and test an overfitting remedy.
        correct: true
        feedback: The split trend shows worse predictions on new examples despite improved training fit.
      - id: b
        text: Discard earlier checkpoints and keep the final model with the lowest training loss.
        correct: false
        feedback: Training fit alone does not select the checkpoint that predicts held-out examples
          best.
        category: incorrect_reasoning
      - id: c
        text: Treat the split as evidence of a reversed update sign and debug that sign first.
        correct: false
        feedback:
          Sustained falling training loss with rising validation loss is the overfitting pattern,
          so it does not by itself indicate a reversed update.
        category: incorrect_reasoning
    solution:
      Keep the checkpoint with the best validation loss and investigate overfitting. The diverging
      training and validation trends do not by themselves establish a gradient-code error.
  - id: dbt-assign-debug
    dimension: implementation
    type: debug
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt:
      This constant-model loop prints unchanged loss. Which line fails to update the parameter used
      in the next iteration?
    code: |-
      for _ in range(20):
          e = w - y
          dw = 2 * e
          w_new = w - lr * dw
          print((w - y)**2)
    buggy_line: 4
    fix_options:
      - id: a
        text: Assign `w = w - lr * dw`.
        correct: true
        feedback:
          Line 4 stores the result in `w_new` but later iterations still use unchanged `w`. Assigning
          the result to `w` makes the next prediction use the update.
      - id: b
        text: Use dw = -2 * e.
        correct: false
        feedback: Changing a sign does not assign the new value to w.
      - id: c
        text: Increase the learning rate without changing any assignment.
        correct: false
        feedback: The computed value is still stored in `w_new` rather than `w`.
    solution:
      Line 4 stores the result in `w_new` but later iterations still use unchanged `w`. Assigning the
      result to `w` makes the next prediction use the update.
  - id: dbt-explain-diagnosis
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt:
      A friend says their training loss levels off high. Explain how you would distinguish a bug from
      a setting or model limitation using training and validation loss curves, a tiny-batch test and a gradient check.
    rubric:
      - id: curve
        criterion: Uses the curve and validation trend as clues rather than proof of a single cause.
        weight: 1
        required: true
      - id: tiny
        criterion: Repeatedly fit a tiny batch with a known achievable loss to test whether training can reach it.
        weight: 0.5
        required: true
      - id: updates
        criterion: If the tiny-batch test fails, inspect whether updates reach every parameter.
        weight: 0.5
        required: true
      - id: slope
        criterion: Compares code slopes with numerical nudges before deciding what to tune.
        weight: 1
        required: true
    exemplar:
      I would first see whether loss was flat from the start, fell slowly or fell before levelling
      off, and compare the validation trend. I would repeatedly fit a tiny batch whose achievable loss I
      know, checking whether updates reach every parameter if the test fails. I would compare suspicious code
      slopes with two-nudge numerical slopes, keeping other parameters fixed. If those checks support the
      code, I would try a suitable rate or model change; a plateau alone is not proof of a bug because the
      model may have reached its best fit.
    solution:
      The tests narrow down different explanations rather than naming a cause from a plateau alone.
      A known tiny-batch answer tests fitting, while numerical nudges test the slope itself.
  - id: dbt-recall-curves-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: dbt-loss-curves
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what does a loss curve record, and why can a flat curve be a healthy result?"
    rubric:
      - id: point0
        criterion: "Explain that a loss curve records loss during training."
        weight: 1
        required: true
      - id: point1
        criterion: "Explain that a flat curve can mean the model has reached its lowest possible loss."
        weight: 1
        required: true
    exemplar: "A loss curve records loss during training. A flat curve can mean the model has reached its lowest possible loss."
  - id: dbt-recall-curves-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: dbt-loss-curves
    difficulty: 1
    est_minutes: 0.5
    prompt: "A run uses all training examples for each update, and its loss grows while its prediction swings across the best value. Which cause fits this pattern?"
    options:
      - id: a
        text: "The learning rate is too small."
        correct: false
        feedback: "A small rate shrinks the gap slowly and makes loss fall slowly."
      - id: b
        text: "The learning rate is too large."
        correct: true
        feedback: "A rate that makes the gap multiplier's size exceed one causes growing swings and rising loss."
      - id: c
        text: "The code leaves the prediction unchanged."
        correct: false
        feedback: "An unchanged prediction produces a flat loss curve."
    solution: "A rate that makes the gap multiplier's size exceed one causes growing swings and rising loss."
  - id: dbt-recall-curves-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: dbt-loss-curves
    difficulty: 1
    est_minutes: 0.5
    prompt: "A model predicts a single time $w$ for trips of $1,3,5,7$ seconds and minimizes their mean squared error. Write the signed gap $w_{\\mathrm{new}}-4$ after one gradient-descent update at learning rate $\\eta$. Type `eta`."
    answer: "(1-2*eta)*(w-4)"
    variables: { "w": [-2, 10], "eta": [0.01, 1.4] }
    solution: "The update subtracts $\\eta$ times the slope $2(w-4)$, so the new gap is $(1-2\\eta)(w-4)$."
  - id: dbt-recall-tiny-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: dbt-tiny-batch
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, how do you run a tiny-batch test, and what should happen to its loss when an exact fit is possible?"
    rubric:
      - id: point0
        criterion: "Explain that you train repeatedly on the same small batch to see if the model can fit those examples."
        weight: 1
        required: true
      - id: point1
        criterion: "Explain that correct updates and a suitable learning rate should drive the loss close to zero when the model has enough parameters to fit the examples exactly."
        weight: 1
        required: true
    exemplar: "Train repeatedly on the same small batch to check if the model can fit those examples. If an exact fit is possible, correct updates and a suitable learning rate should bring the loss close to zero."
  - id: dbt-recall-tiny-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: dbt-tiny-batch
    difficulty: 1
    est_minutes: 0.5
    prompt: "A linear model’s training loss stalls above zero on two trips. You already know that a line can fit both trips exactly. Which check would help isolate the problem?"
    options:
      - id: a
        text: "Compare the weight and bias before and after each update."
        correct: true
        feedback: "Check that updates reach both parameters. A frozen bias can prevent the model from reaching the line that fits."
      - id: b
        text: "Compare the trained model’s errors on a larger set of unseen trips."
        correct: false
        feedback: "Unseen trips test predictions on new examples. The immediate problem is fitting these two training trips."
      - id: c
        text: "Compare the average loss on different pairs of trips."
        correct: false
        feedback: "Changing the examples can change the best fit. Keep the test batch fixed so you know what the run should reach."
    solution: "Check whether both the weight and the bias change during the run. The known fit gives you a clear target for the training code."
  - id: dbt-recall-tiny-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: dbt-tiny-batch
    difficulty: 1
    est_minutes: 0.5
    prompt: "Two trips in a training batch have signed prediction errors $e_1$ and $e_2$. Write the batch’s mean squared error $L$. Type `e_1` and `e_2`."
    answer: "(e_1^2+e_2^2)/2"
    variables: { "e_1": [-5, 5], "e_2": [-5, 5] }
    solution: "Square each trip’s error and average the two results to get $(e_1^2+e_2^2)/2$."
  - id: dbt-recall-grad-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: dbt-grad-check
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, how does a gradient check estimate a slope, and what does it compare that estimate with?"
    rubric:
      - id: point0
        criterion: "Explain that it nudges one parameter up and down a little while keeping everything else fixed and measures the loss change over the separation."
        weight: 1
        required: true
      - id: point1
        criterion: "Explain that it compares that numerical slope with the slope computed by the code."
        weight: 1
        required: true
    exemplar: "It nudges one parameter up and down a little while keeping everything else fixed and measures the loss change over the separation. It compares that numerical slope with the slope computed by the code."
  - id: dbt-recall-grad-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: dbt-grad-check
    difficulty: 1
    est_minutes: 0.5
    prompt: "A model fits a tiny training batch, but its gradient check gives very different slopes for one weight. What should you investigate first?"
    options:
      - id: a
        text: "Whether the model needs more weights to fit the batch."
        correct: false
        feedback: "A more flexible model can help fit hard examples. This model already fits the batch and the slope discrepancy remains."
      - id: b
        text: "Whether the model needs fewer epochs to avoid overfitting."
        correct: false
        feedback: "Early stopping uses a validation curve. It cannot explain a difference between two estimates of the same slope."
      - id: c
        text: "Whether the slope code missed a factor for that weight."
        correct: true
        feedback: "A missing factor can change the size of the slope while leaving the update downhill."
    solution: "A slope of the wrong size can still lower the loss. Use the disagreement to check the code for the weight’s slope."
  - id: dbt-recall-grad-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: dbt-grad-check
    difficulty: 1
    est_minutes: 0.5
    prompt: "A gradient check gives a code slope $a$ and a numerical slope $n$, with at least one nonzero slope. Write the size of their difference divided by the larger slope magnitude. Type `abs(...)` and `max(...)` for absolute value and maximum."
    answer: "abs(a-n)/max(abs(a),abs(n))"
    variables: { "a": [-20, 20], "n": [-15, -0.2] }
    solution: "Divide the size of the difference by the larger slope magnitude to get $|a-n|/\\max(|a|,|n|)$."
  - id: dbt-recall-symptoms-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: dbt-symptoms
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what should you try first when training loss blows up, and what should you inspect if it still rises at the smaller rate?"
    rubric:
      - id: rate
        criterion: "Explain that the learning rate may be too large, so lower it and test again."
        weight: 1
        required: true
      - id: sign
        criterion: "Explain that a still-rising loss at a smaller rate is a reason to inspect whether the update adds the slope instead of subtracting it."
        weight: 1
        required: true
    exemplar: "Lower the learning rate and test again because the steps may be too large. If loss still rises, inspect whether the update adds the slope instead of subtracting it."
  - id: dbt-recall-symptoms-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: dbt-symptoms
    difficulty: 1
    est_minutes: 0.5
    prompt: "Which symptom suggests trying a larger learning rate?"
    options:
      - id: a
        text: "Training loss barely falls on each update."
        correct: true
        feedback: "The learning rate may be too small. Raise it and test again."
      - id: b
        text: "Training loss falls while validation loss clearly rises."
        correct: false
        feedback: "This suggests overfitting. Keep the saved parameters with the lowest validation loss."
      - id: c
        text: "Training loss grows rapidly with each update."
        correct: false
        feedback: "Try a smaller learning rate. If the loss still rises, check the update sign."
    solution: "A loss that falls very slowly may indicate a learning rate that is too small."
  - id: dbt-recall-symptoms-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: dbt-symptoms
    difficulty: 1
    est_minutes: 0.5
    prompt: "A constant prediction $w$ is trained on trip times $1,3,5,7$ using mean squared error. The update adds learning rate $\\eta$ times the loss slope to $w$. Write the signed gap $w_{\\mathrm{new}}-4$ after this update. Type `eta`."
    answer: "(1+2*eta)*(w-4)"
    variables: { "w": [-2, 10], "eta": [0.01, 1.4] }
    solution: "The slope is $2(w-4)$. Adding the slope step gives $w+2\\eta(w-4)-4=(1+2\\eta)(w-4)$."

  - id: dbt-epoch-loss-logging
    dimension: implementation
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "A training loop currently logs the loss on the final minibatch of each epoch. The resulting curve jumps around. Which quantity should it log to check if training loss is falling across epochs?"
    options:
      - id: a
        text: "Loss on the whole training set at the end of each epoch."
        correct: true
      - id: b
        text: "Loss on the first training minibatch of each epoch."
        correct: false
        feedback: "The first batch is still only a slice of the data."
      - id: c
        text: "The smallest minibatch loss seen in each epoch."
        correct: false
        feedback: "The lowest batch loss leaves out the harder examples and can hide overall changes."
    solution: "After each epoch, evaluate loss on all training examples with the weights at that point. An individual batch can give a noisy view."

  - id: dbt-relative-check-code
    dimension: implementation
    type: expression
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "A program checks a code slope `a` against a numerical slope `n`. Assume at least one slope is nonzero. Write the expression for their relative difference. Type `abs(...)` for absolute value and `max(...)` for maximum."
    answer: "abs(a-n)/max(abs(a),abs(n))"
    variables:
      a: { values: [-11, -0.8, -0.4, -0.1, 0.2, 0.35, 0.7, 7] }
      n: { values: [-15, -0.7, -0.3, -0.05, 0.15, 0.4, 0.9, 9] }
    common_wrong:
      - answer: "abs(a-n)/max(a,n)"
        category: math_error
        feedback: "Taking the maximum of the signed slopes can use the wrong scale for negative slopes."
      - answer: "abs(a-n)/(abs(a)+abs(n))"
        category: math_error
        feedback: "Adding the sizes changes the scale; the check uses just the larger size."
    solution: "Use `abs(a - n) / max(abs(a), abs(n))`. The absolute values measure the difference and the slope sizes whether the slopes are positive or negative."
