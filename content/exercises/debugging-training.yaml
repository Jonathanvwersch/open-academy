concept: debugging-training
exercises:
  - id: lab-image-classifier-dropout
    dimension: transfer
    type: explain
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "A PyTorch image model has dropout. Its weights stay fixed, but repeated validation calls give different losses. The evaluator uses `torch.no_grad()` and calls `model.train()`. Explain the likely cause, the change you would make, and how you would check the fix."
    rubric:
      - {
          id: cause,
          criterion: "Explain that training mode makes dropout randomly zero unit outputs on each call, so validation losses can differ with fixed weights.",
          weight: 1,
          required: true,
        }
      - {
          id: fix,
          criterion: "Call `model.eval()` to turn dropout off during evaluation.",
          weight: 1,
          required: true,
        }
      - {
          id: check,
          criterion: "Repeat evaluation on unchanged inputs and weights and check that the losses agree.",
          weight: 1,
          required: true,
        }
      - {
          id: recording,
          criterion: "Mention keeping `torch.no_grad()` to stop recording slopes; it leaves dropout active on its own.",
          weight: 0.5,
          required: false,
        }
    exemplar: "Training mode keeps dropout active, randomly zeroing unit outputs on each call. I would call `model.eval()` to disable dropout during evaluation and keep `torch.no_grad()` to stop recording slopes. Then I would evaluate the same images twice with fixed weights and check that both losses agree. Training should call `model.train()` again for the next epoch."
    solution: "Dropout remains active in train mode even inside `no_grad()`. Use `eval()` with `no_grad()` and compare repeated scores on unchanged data."
  - id: dx-dl-5
    dimension: transfer
    type: debug
    role: diagnostic
    difficulty: 3
    est_minutes: 3
    prompt: "This PyTorch training loop runs without errors, but the loss never improves from the first batch onward. Which line is wrong, and what is the fix?"
    code: |
      for xb, yb in loader:
          optimizer.zero_grad()
          pred = model(xb)
          loss = loss_fn(pred, yb)
          optimizer.step()
          loss.backward()
    buggy_line: 5
    fix_options:
      - {
          id: a,
          text: "Swap lines 5 and 6: call loss.backward() before optimizer.step()",
          correct: true,
          feedback: "`step()` uses the gradients currently stored in `.grad`. Here they were just zeroed, so every step is a no-op; `backward()` then fills `.grad`, only for `zero_grad()` to clear it next iteration.",
        }
      - {
          id: b,
          text: "Move `optimizer.zero_grad()` after `optimizer.step()`",
          correct: false,
          feedback: "Zeroing after the step is fine in general, but the step would still run before backward(), on stale or zero gradients.",
        }
      - {
          id: c,
          text: "Call loss.detach() before loss.backward()",
          correct: false,
          feedback: "Detaching cuts the graph, so no gradients would reach the parameters at all.",
        }
      - {
          id: d,
          text: "Lower the learning rate",
          correct: false,
          feedback: "With zero gradients at step time the learning rate is irrelevant: the update is $\\eta \\times 0$.",
        }
    solution: "`optimizer.step()` reads `.grad`. Because `zero_grad()` ran first and `backward()` runs after the step, `.grad` is always zero at step time, so parameters never change. Order must be: `zero_grad()` → forward → loss → `backward()` → `step()`."
  - id: dbt-curve-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt:
      A run starts with poor predictions and repeats exactly the same full-data loss after every
      update. Which measurement best tests whether updates are being applied?
    options:
      - id: a
        text: Compare parameter values immediately before and after one optimiser step.
        correct: true
        feedback: This directly checks whether the update changes the model.
      - id: b
        text: Compare training loss with validation loss at the end of the epoch.
        correct: false
        feedback: That helps diagnose generalisation, but does not directly check parameter changes
          during a step.
        category: incorrect_reasoning
      - id: c
        text: Compare the current full-data loss with the current minibatch loss.
        correct: false
        feedback: Different example sets can have different losses even when no parameter update is
          applied.
        category: incorrect_reasoning
    solution:
      A before-and-after parameter comparison directly tests whether the optimiser changes the
      model. If it changes nothing despite nonzero gradients, inspect the update code.
  - id: dbt-floor-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does the green run in the worked example approach loss 5 rather than zero?
    options:
      - id: a
        text: One constant time cannot match all four recorded times.
        correct: true
        feedback: The best constant is 4, but the remaining squared errors average to 5.
      - id: b
        text: A learning rate of 0.25 always leaves loss 5.
        correct: false
        feedback: The floor comes from these data and this model, not a universal rate rule.
        category: incorrect_reasoning
      - id: c
        text: The update code stops before the best prediction.
        correct: false
        feedback: The green run approaches the best constant prediction.
        category: incorrect_reasoning
    solution: The best constant is 4, but the remaining squared errors average to 5.
  - id: dbt-update-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: A model predicts one constant time $w={{= w }}$ for trips lasting 1, 3, 5 and 7 seconds.
      Using their mean squared error and one gradient-descent step with $\eta={{= eta }}$, what is the
      new $w$?
    params:
      w:
        min: 0
        max: 8
        step: 2
      eta:
        min: 0.1
        max: 0.3
        step: 0.1
    answer_expr: w-eta*2*(w-4)
    tolerance:
      abs: 0.001
    solution: Average the four loss slopes to get $2({{= w }}-4)={{= 2*(w-4) }}$. Subtract the rate
      times this slope, giving $w_{\text{new}}={{= w-eta*2*(w-4) }}$.
    common_wrong:
      - answer_expr: w+eta*2*(w-4)
        category: math_error
        feedback: Gradient descent subtracts the scaled average slope from the current prediction.
    constraints:
      - w != 4
  - id: dbt-rising
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Full-batch losses rise from 21 to 41 to 86. Which comparison would help separate excessive
      step size from an incorrect update sign?
    options:
      - id: a
        text: Rerun from the same parameters at half the learning rate and compare the loss trend.
        correct: true
        feedback:
          A smaller rate can stabilize correct overshooting steps, while a flipped sign still
          moves uphill.
      - id: b
        text: Rerun at the same rate with the full-batch examples in a different order.
        correct: false
        feedback:
          Reordering the same full batch does not change its average gradient, so it does not
          isolate step size or sign.
        category: incorrect_reasoning
      - id: c
        text: Compare training and validation losses to determine whether the update sign is correct.
        correct: false
        feedback:
          That comparison diagnoses generalisation; it does not directly separate overshooting
          from a sign error.
        category: incorrect_reasoning
    solution:
      Reducing the learning rate from the same starting parameters tests the step-size explanation.
      A still-rising curve calls for checking the update sign and other causes; it does not identify
      the bug on its own.
  - id: dbt-slow
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Full-data loss falls smoothly by very small amounts, and comparable runs reach much lower
      loss. Which trial most directly tests a learning rate that is too small?
    options:
      - id: a
        text: Cautiously increase the rate and compare full-data progress from the same start.
        correct: true
        feedback: A larger rate tests whether the useful steps were simply too small.
      - id: b
        text: Increase batch size while keeping the rate fixed to reduce sampling noise.
        correct: false
        feedback:
          The smooth full-data curve gives no particular evidence that sampling noise is causing
          the slow progress.
        category: incorrect_reasoning
      - id: c
        text: Use a smaller rate and train for the same number of updates.
        correct: false
        feedback: That makes each step smaller and does not test whether larger steps would improve
          progress.
        category: incorrect_reasoning
    solution:
      Cautiously increasing the rate tests whether each update was too small. Compare the full-data
      loss trend and stop increasing if larger steps become unstable.
  - id: dbt-noise
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A delivery-time model has occasional minibatch loss increases while whole-dataset loss falls
      each epoch. Which evidence should guide the first diagnosis?
    options:
      - id: a
        text: The falling whole-dataset trend supports progress despite differing minibatches.
        correct: true
        feedback: Different minibatches can give noisy losses and gradients, so the broader trend is
          informative.
      - id: b
        text: The minibatch increases identify a reversed update sign despite the full-data trend.
        correct: false
        feedback: A batch increase alone cannot identify a sign error; valid stochastic updates can
          show bumps.
        category: incorrect_reasoning
      - id: c
        text: The falling whole-dataset trend establishes that the exact gradient formula is correct.
        correct: false
        feedback: A wrong gradient with a useful direction can still reduce loss, so gradient checks
          remain a separate test.
        category: incorrect_reasoning
    solution:
      Minibatch gradients are noisy estimates, and different batches can have different losses.
      A falling whole-dataset trend supports overall progress, while exact gradient correctness needs
      its own check.
  - id: dbt-floor-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt:
      A constant model predicts one time for trips lasting $a={{= a }}$ and $b={{= b }}$ seconds.
      Its best prediction is their average. What is the lowest average squared-error loss?
    params:
      a:
        min: 1
        max: 3
        step: 1
      b:
        min: 5
        max: 9
        step: 2
    answer_expr: ((b-a)/2)^2
    tolerance:
      abs: 0.001
    solution:
      Use the stated formula with the sampled values. This gives ${{= ((b-a)/2)^2 }}$, because the
      calculation keeps the same examples and settings throughout.
    common_wrong:
      - answer_expr: (b-a)^2
        category: math_error
        feedback: Check the sign and every factor in the stated formula before applying it.
  - id: dbt-tiny-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: What can repeated training on a tiny batch with a known zero-loss fit help test?
    options:
      - id: a
        text: Whether the implemented model and updates can fit those chosen examples.
        correct: true
        feedback: A known achievable fit makes failure on this small batch useful evidence.
      - id: b
        text: Whether the implemented gradients match numerical slopes for every parameter.
        correct: false
        feedback:
          Successful fitting does not verify each slope formula; numerical gradient checks address
          that.
        category: incorrect_reasoning
      - id: c
        text: Whether a plateau on that batch proves the model lacks enough capacity.
        correct: false
        feedback: The known zero-loss fit already establishes capacity for those examples; a plateau
          can come from code or settings.
        category: incorrect_reasoning
    solution:
      The tiny-batch test checks whether the model and update implementation can reach a known
      fit. It narrows debugging to a small case, while gradient accuracy and new-example performance
      require separate checks.
  - id: dbt-tiny-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: The buggy run's weight slope is zero at w=2.6. Why does its loss still stay at 0.1?
    options:
      - id: a
        text: The weight contributions cancel and the bias never changes.
        correct: true
        feedback: The weight cannot improve by its current slope, while the nonzero bias slope is ignored.
      - id: b
        text: Zero weight slope proves both examples have zero error.
        correct: false
        feedback: The errors are -0.4 and 0.2, which are not zero.
        category: incorrect_reasoning
      - id: c
        text: The remaining loss must be caused by batch noise.
        correct: false
        feedback: Both examples are used every time, so no subset is being sampled.
        category: incorrect_reasoning
    solution: The weight cannot improve by its current slope, while the nonzero bias slope is ignored.
  - id: dbt-tiny-update
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt:
      A linear model $\hat y=wx+b$ starts at $w=b=0$ on trips $(x,y)=(1,{{= y1 }}),(2,{{= y2 }})$.
      Using mean squared error and one gradient-descent step with rate 0.1, what is the new $w$?
    params:
      y1:
        min: 2
        max: 4
        step: 1
      y2:
        min: 5
        max: 7
        step: 1
    answer_expr: .1*(y1+2*y2)
    tolerance:
      abs: 0.001
    solution:
      Use the stated formula with the sampled values. This gives ${{= .1*(y1+2*y2) }}$, because
      the calculation keeps the same examples and settings throughout.
    common_wrong:
      - answer_expr: .1*(y1+y2)
        category: math_error
        feedback: Check the sign and every factor in the stated formula before applying it.
  - id: dbt-tiny-loss
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt:
      A linear model $\hat y=wx+b$ has $w={{= w }}$ and $b={{= b }}$. For trips $(x,y)=(1,3),(2,5)$,
      what is its mean squared-error loss?
    params:
      w:
        min: 1
        max: 3
        step: 1
      b:
        min: 0
        max: 2
        step: 1
    answer_expr: ((w+b-3)^2+(2*w+b-5)^2)/2
    tolerance:
      abs: 0.001
    solution:
      Use the stated formula with the sampled values. This gives ${{= ((w+b-3)^2+(2*w+b-5)^2)/2
      }}$, because the calculation keeps the same examples and settings throughout.
    common_wrong:
      - answer_expr: (w+b-3)^2+(2*w+b-5)^2
        category: math_error
        feedback: Check the sign and every factor in the stated formula before applying it.
    constraints:
      - w != 2 or b != 1
  - id: dbt-tiny-flat
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: On trips $(1,3)$ and $(2,5)$, a linear model stalls at $w=2.6$, $b=0$ with loss 0.1. Its
      weight slope is 0 and bias slope is -0.2. What should you inspect first?
    options:
      - id: a
        text: Whether the bias parameter is included in the optimiser updates.
        correct: true
        feedback: The nonzero bias slope offers improvement even though the weight slope is zero.
      - id: b
        text: Whether a hidden layer is needed because the linear model cannot fit both trips.
        correct: false
        feedback:
          The line with weight 2 and bias 1 fits both trips exactly, so a hidden layer is unnecessary
          for this test.
        category: incorrect_reasoning
      - id: c
        text: Whether a larger weight-only learning rate can move the zero weight slope.
        correct: false
        feedback: Scaling a zero weight slope cannot move that weight; the nonzero bias slope is the
          useful clue.
        category: incorrect_reasoning
    solution:
      The bias slope is nonzero, so applying its update could still reduce the loss. Check that
      the optimiser includes the bias and actually changes it.
  - id: dbt-tiny-drone
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A drone model has a known zero-loss fit on eight chosen examples, but training stalls high.
      Which experiment best isolates the fitting failure?
    options:
      - id: a
        text: Keep those eight examples fixed and inspect parameter changes and slopes at a smaller
          rate.
        correct: true
        feedback: The fixed easy case lets you test update application, suspicious gradients and stability.
      - id: b
        text: Switch to the full dataset and compare validation loss after a complete training run.
        correct: false
        feedback: That adds examples and cost before explaining failure on the known easy case.
        category: incorrect_reasoning
      - id: c
        text: Add more layers and compare the final training losses after the same long run.
        correct: false
        feedback: The known fit already establishes enough capacity for this batch; extra layers add
          a new variable.
        category: incorrect_reasoning
    solution: Keep the known fitting case small while checking that parameters change and suspicious
      gradients agree with numerical slopes. Trying a smaller rate can also test whether unstable steps
      prevent fitting.
  - id: dbt-tiny-generalise
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A tiny-batch test reaches nearly zero loss. What has it established?
    options:
      - id: a
        text: The updates can fit this batch, but new-example performance is unknown.
        correct: true
        feedback: The test uses training examples repeatedly, so validation is still needed.
      - id: b
        text: The model must also have nearly zero validation loss.
        correct: false
        feedback: The test has not measured validation predictions.
        category: incorrect_reasoning
      - id: c
        text: Every individual slope formula is necessarily correct.
        correct: false
        feedback: Even a wrong slope can sometimes keep moving downhill.
        category: incorrect_reasoning
    solution: The test uses training examples repeatedly, so validation is still needed.
  - id: dbt-check-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: What does a gradient check compare?
    options:
      - id: a
        text: A code slope and a slope estimated by nudging one parameter.
        correct: true
        feedback: Both describe how the same loss changes with that parameter, which makes disagreement useful.
      - id: b
        text: Training loss and validation loss on different examples.
        correct: false
        feedback: That comparison diagnoses generalisation, not a slope calculation.
        category: incorrect_reasoning
      - id: c
        text: Two learning rates with all weights changed at once.
        correct: false
        feedback: A gradient check holds other parameters fixed and tests one slope.
        category: incorrect_reasoning
    solution: Both describe how the same loss changes with that parameter, which makes disagreement useful.
  - id: dbt-check-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does the worked example divide the loss difference by 2h rather than h?
    options:
      - id: a
        text: The two tested weights are w-h and w+h, separated by 2h.
        correct: true
        feedback: A slope divides output change by the distance between the two input values.
      - id: b
        text: There are two examples in the batch.
        correct: false
        feedback: The example checks one trip, and the denominator is a weight distance.
        category: incorrect_reasoning
      - id: c
        text: Squared error always requires doubling the denominator.
        correct: false
        feedback: The denominator comes from the two nudges, not the choice of squared error.
        category: incorrect_reasoning
    solution: A slope divides output change by the distance between the two input values.
  - id: dbt-slope-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt:
      A gradient check tests the model $\hat y=wx$ with squared-error loss $(wx-y)^2$. At $x={{=
      x }}$, $y={{= y }}$ and $w={{= w }}$, what analytic weight slope should agree with the numerical
      slope?
    params:
      x:
        min: 2
        max: 4
        step: 1
      y:
        min: 5
        max: 7
        step: 1
      w:
        min: 0
        max: 1
        step: 1
    answer_expr: 2*(w*x-y)*x
    tolerance:
      abs: 0.001
    solution:
      Differentiate the squared error and multiply by the prediction's weight derivative $x$.
      The weight slope is $2({{= w }}({{= x }})-{{= y }})({{= x }})={{= 2*(w*x-y)*x }}$.
    common_wrong:
      - answer_expr: 2*(w*x-y)
        category: math_error
        feedback: The prediction changes by x times the weight change, so include the extra factor x.
  - id: dbt-numerical
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A check uses h=0.01, L(w+h)=8.8804 and L(w-h)=9.1204. What is the numerical slope?
    answer: -12
    tolerance:
      abs: 0.001
    common_wrong:
      - answer: -24
        category: math_error
        feedback: Divide by the full separation 2h=0.02, not by h.
    solution:
      The weights are separated by 0.02, so the slope is (8.8804-9.1204)/0.02=-12. Keeping everything
      else fixed makes this a check of the weight slope.
  - id: dbt-relative-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt:
      A gradient check gives code slope $a={{= a }}$ and numerical slope $n={{= n }}$. Using the
      larger slope magnitude as the reference size, what is their relative error? Give three decimal
      places.
    params:
      a:
        min: -8
        max: -2
        step: 2
      n:
        min: -12
        max: -10
        step: 2
    answer_expr: abs(a-n)/max(abs(a),abs(n))
    tolerance:
      abs: 0.001
    solution:
      Take the absolute difference and divide by the larger slope magnitude. This gives $|{{=
      a }}-({{= n }})|/\max(|{{= a }}|,|{{= n }}|)={{= abs(a-n)/max(abs(a),abs(n)) }}$ before rounding.
    common_wrong:
      - answer_expr: abs(a-n)
        category: math_error
        feedback: That is the absolute error; divide it by the larger slope magnitude for relative error.
  - id: dbt-falling-trap
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: For positive inputs, code omits the input factor from a squared-error weight slope, yet
      loss still falls. How can a gradient check expose this?
    options:
      - id: a
        text: The code and numerical slopes can share a sign while disagreeing in size.
        correct: true
        feedback: A missing positive factor can preserve a downhill direction while changing the derivative.
      - id: b
        text: The code and numerical slopes must agree because both describe a falling loss.
        correct: false
        feedback: Falling loss constrains the direction of a useful step, not the exact derivative magnitude.
        category: incorrect_reasoning
      - id: c
        text: The code and numerical slopes must have opposite signs whenever a factor is missing.
        correct: false
        feedback: Omitting a positive input factor changes size without reversing the sign.
        category: incorrect_reasoning
    solution: Omitting a positive input factor preserves the slope sign, so updates may still lower
      loss. Comparing with numerical nudges reveals the incorrect slope magnitude.
  - id: dbt-check-cost
    dimension: implementation
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A central-difference check nudges one weight at a time. For 1,000,000 weights, how many
      loss evaluations does a complete numerical check require, excluding the analytic backward pass?
    options:
      - id: a
        text: 2,000,000, using an upward and downward nudge for each weight.
        correct: true
        feedback: Every coordinate needs its own pair of loss measurements.
      - id: b
        text: 1,000,001, sharing one baseline loss with one upward nudge per weight.
        correct: false
        feedback: That describes a one-sided estimate; central differences use two nudges per coordinate.
        category: incorrect_reasoning
      - id: c
        text: 2, using one upward and one downward nudge of all weights together.
        correct: false
        feedback: Changing every weight together checks a combined direction, not each individual derivative.
        category: incorrect_reasoning
    solution:
      Central differences need two loss evaluations for each separately nudged weight. A million
      weights therefore need two million evaluations, making a few sampled weights much cheaper.
  - id: dbt-bias-debug
    dimension: implementation
    type: debug
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt:
      This one-trip squared-error loop uses separate slopes for w and b. Which line computes the wrong
      slope, and how should it change?
    code: |-
      for _ in range(20):
          e = w * x + b - y
          dw = 2 * e * x
          db = 2 * e * x
          w = w - lr * dw
          b = b - lr * db
    buggy_line: 4
    fix_options:
      - id: a
        text: Use db = 2 * e.
        correct: true
        feedback:
          The bias adds directly to the prediction, so its slope is twice the error without x. Line
          4 should be db = 2 * e.
      - id: b
        text: Use dw = 2 * e.
        correct: false
        feedback: The weight slope needs x because the weight multiplies the input.
      - id: c
        text: Use `b = b + lr * db`.
        correct: false
        feedback: Adding the slope would move the bias uphill, not repair its formula.
    solution:
      The bias adds directly to the prediction, so its slope is twice the error without x. Line
      4 should be db = 2 * e.
  - id: dbt-symptom-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: Training loss keeps falling while validation loss clearly rises. What does this suggest?
    options:
      - id: a
        text: Overfitting rather than necessarily a broken update.
        correct: true
        feedback:
          The model is fitting training examples more closely while predicting held-out examples less
          well.
      - id: b
        text: A parameter that has never changed since training began.
        correct: false
        feedback: Falling training loss shows that predictions are changing.
        category: incorrect_reasoning
      - id: c
        text: Proof that every computed slope has the wrong sign.
        correct: false
        feedback: An uphill update would not explain the sustained improvement on training examples.
        category: incorrect_reasoning
    solution:
      The model is fitting training examples more closely while predicting held-out examples less
      well.
  - id: dbt-halve-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does halving the rates distinguish the two runs in the worked example?
    options:
      - id: a
        text: Correct steps become small enough, but flipped steps still go uphill.
        correct: true
        feedback: The correct distance multiplier has magnitude 0.25, while the flipped multiplier is 1.25.
      - id: b
        text: Halving any rate automatically fixes a wrong update sign.
        correct: false
        feedback: Smaller positive rates do not turn addition into subtraction.
        category: incorrect_reasoning
      - id: c
        text: The runs must keep identical losses at every smaller rate.
        correct: false
        feedback: Their original matching losses hid different distance multipliers.
        category: incorrect_reasoning
    solution: The correct distance multiplier has magnitude 0.25, while the flipped multiplier is 1.25.
  - id: dbt-flipped-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: A model predicts one constant time $w={{= w }}$ for trips lasting 1, 3, 5 and 7 seconds
      and uses mean squared error. Its buggy update is `w += eta * slope`, with $\eta={{= eta }}$. What
      value does this code assign to $w$?
    params:
      w:
        min: 0
        max: 2
        step: 1
      eta:
        min: 0.1
        max: 0.3
        step: 0.1
    answer_expr: w+2*eta*(w-4)
    tolerance:
      abs: 0.001
    solution:
      Use the stated formula with the sampled values. This gives ${{= w+2*eta*(w-4) }}$, because
      the calculation keeps the same examples and settings throughout.
    common_wrong:
      - answer_expr: w-2*eta*(w-4)
        category: math_error
        feedback: Check the sign and every factor in the stated formula before applying it.
  - id: dbt-nan
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Loss rises rapidly before becoming `nan`, and all input values are finite. Which trial first
      tests unstable update sizes?
    options:
      - id: a
        text: Reduce the learning rate from the same start and compare the loss trajectory.
        correct: true
        feedback: Smaller steps test whether large updates are causing the numerical blow-up.
      - id: b
        text: Keep the rate fixed and use higher-precision arithmetic to delay numerical overflow.
        correct: false
        feedback: That tests numerical range while keeping the update size setting unchanged.
        category: incorrect_reasoning
      - id: c
        text: Keep the rate fixed and add model layers to reduce representational error.
        correct: false
        feedback: Changing capacity adds another variable and does not isolate update size.
        category: incorrect_reasoning
    solution:
      Rapidly increasing loss can indicate unstable parameter updates. Reducing the rate from
      the same starting point tests that cause, although persistent nonfinite values still need investigation.
  - id: dbt-check-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Training loss plateaus high on the full dataset. Which plan best separates an update-code
      problem from a learning setting?
    options:
      - id: a
        text: Test a known-fit tiny batch, check suspicious slopes numerically, then tune full runs.
        correct: true
        feedback: These small tests can expose update failures before expensive setting comparisons.
      - id: b
        text: Search rates on full runs, then use a tiny batch and gradient checks if none works.
        correct: false
        feedback: That spends full runs tuning before checking whether the implementation can fit a
          known easy case.
        category: incorrect_reasoning
      - id: c
        text: Fit a tiny batch, accept any falling loss as proof of correct slopes, then tune full runs.
        correct: false
        feedback: Falling loss does not verify exact gradients; a wrong slope can still point downhill.
        category: incorrect_reasoning
    solution:
      Start with a known-fit tiny batch and numerically check slopes that look suspicious. Once
      those tests support the implementation, full-run tuning is easier to interpret.
  - id: dbt-arm
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A robot-arm model's training loss keeps falling while validation loss rises after epoch
      12. Which next action best follows this evidence?
    options:
      - id: a
        text: Keep the best validation checkpoint and test an overfitting remedy.
        correct: true
        feedback: The split trend points toward worsening generalisation despite improved training fit.
      - id: b
        text: Discard earlier checkpoints and keep the final model with the lowest training loss.
        correct: false
        feedback: Training fit alone does not select the checkpoint that predicts held-out examples
          best.
        category: incorrect_reasoning
      - id: c
        text: Treat the split as evidence of a reversed update sign and debug that sign first.
        correct: false
        feedback:
          Sustained falling training loss with rising validation loss is the overfitting pattern,
          so it does not by itself indicate a reversed update.
        category: incorrect_reasoning
    solution:
      Keep the checkpoint with the best validation loss and investigate overfitting. The diverging
      training and validation trends do not by themselves establish a gradient-code error.
  - id: dbt-assign-debug
    dimension: implementation
    type: debug
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt:
      This constant-model loop prints unchanged loss. Which line fails to update the parameter used
      in the next iteration?
    code: |-
      for _ in range(20):
          e = w - y
          dw = 2 * e
          w_new = w - lr * dw
          print((w - y)**2)
    buggy_line: 4
    fix_options:
      - id: a
        text: Assign `w = w - lr * dw`.
        correct: true
        feedback:
          Line 4 stores the result in `w_new` but later iterations still use unchanged `w`. Assigning
          the result to `w` makes the next prediction use the update.
      - id: b
        text: Use dw = -2 * e.
        correct: false
        feedback: Changing a sign does not assign the new value to w.
      - id: c
        text: Increase the learning rate without changing any assignment.
        correct: false
        feedback: The computed value is still stored in `w_new` rather than `w`.
    solution:
      Line 4 stores the result in `w_new` but later iterations still use unchanged `w`. Assigning the
      result to `w` makes the next prediction use the update.
  - id: dbt-explain-diagnosis
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt:
      A friend says their training loss levels off high. Explain how you would distinguish a bug from
      a setting or model limitation using training and validation loss curves, a tiny-batch test and a gradient check.
    rubric:
      - id: curve
        criterion: Uses the curve and validation trend as clues rather than proof of a single cause.
        weight: 1
        required: true
      - id: tiny
        criterion: Repeatedly fit a tiny batch with a known achievable loss to test whether training can reach it.
        weight: 0.5
        required: true
      - id: updates
        criterion: If the tiny-batch test fails, inspect whether updates reach every parameter.
        weight: 0.5
        required: true
      - id: slope
        criterion: Compares code slopes with numerical nudges before deciding what to tune.
        weight: 1
        required: true
    exemplar:
      I would first see whether loss was flat from the start, fell slowly or fell before levelling
      off, and compare the validation trend. I would repeatedly fit a tiny batch whose achievable loss I
      know, checking whether updates reach every parameter if the test fails. I would compare suspicious code
      slopes with two-nudge numerical slopes, keeping other parameters fixed. If those checks support the
      code, I would try a suitable rate or model change; a plateau alone is not proof of a bug because the
      model may have reached its best fit.
    solution:
      The tests narrow down different explanations rather than naming a cause from a plateau alone.
      A known tiny-batch answer tests fitting, while numerical nudges test the slope itself.
