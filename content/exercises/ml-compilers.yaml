    solution: "The cost model predicts which unmeasured candidates look fast. The autotuner can spend its measurements on those."
  - id: mlcp-recall-autotune-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: mlc-autotune
    difficulty: 1
    est_minutes: 0.5
    prompt: "A memory-bound kernel moves $D$ bytes on a GPU with bandwidth $W$ bytes per second. Its autotuned run takes $t$ seconds. Write the fraction of the best possible speed that the run reaches."
