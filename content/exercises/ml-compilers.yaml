      - id: b
        text: "Replace the kernels with equivalent arithmetic expressions."
        correct: false
        feedback: "Equivalent forms come from rewrite rules. The model estimates how a candidate will perform."
      - id: c
        text: "Combine the operations into one new kernel."
        correct: false
