    est_minutes: 0.5
    prompt: "A model uses a Python `if` whose condition depends on a number inside a tensor. What does `torch.compile` do at that point?"
    options:
      - id: a
        text: "Continue one graph through the branch with stand-in tensor shapes."
        correct: false
        feedback: "The shape alone doesn't tell it the number that decides the branch."
      - id: b
        text: "Check the condition in Python and run a graph for the branch taken."
        correct: true
        feedback: "The tensor value matters, so the conditional splits the graph."
      - id: c
        text: "Lower both branches into one graph and keep their results."
        correct: false
        feedback: "This tensor-dependent Python condition splits the graph. Python decides which branch to run."
    solution: "The compiled graph stops at the data-dependent condition. Python checks it, and the program runs a graph for the branch it takes."
  - id: mlcp-recall-record-graph-contrast2
