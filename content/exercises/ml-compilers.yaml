  - id: mlcp-recall-autotune-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: mlc-autotune
    difficulty: 1
    est_minutes: 0.5
    prompt: "An autotuner measures a few candidate kernels, then wants to avoid timing every remaining candidate. What can its cost model do?"
    options:
      - id: a
        text: "Predict the time of untried versions from their code."
