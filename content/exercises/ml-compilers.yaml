    difficulty: 1
    est_minutes: 0.5
    prompt: "A tensor takes $S$ bytes. In eager execution, each of $k$ elementwise operations launches its own kernel and reads and writes the full tensor through HBM. Write the total eager HBM traffic in bytes."
    answer: "2*k*S"
    variables: { "S": { "values": [100, 10000, 100000] }, "k": { "values": [2, 6, 12] } }
    solution: "Each kernel moves $2S$ bytes for its read and write. Over $k$ kernels that is $2kS$."
  - id: mlcp-recall-egraph-say
