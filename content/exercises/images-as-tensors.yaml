concept: images-as-tensors
exercises:
  - id: iat-grid-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: What does a grayscale image array store?
    options:
      - id: a
        text: One brightness value per pixel
        correct: true
        feedback: Each grayscale pixel holds one brightness, so the image is a matrix.
      - id: b
        text: Three values per pixel
        correct: false
        feedback: That describes an RGB image, not grayscale.
      - id: c
        text: One value per whole row
        correct: false
        feedback: Each row contains many separate pixels.
    solution: A grayscale image is a matrix with one brightness number at each pixel.
  - id: iat-grid-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does the position (1, 3) select brightness 153 in the worked example?
    options:
      - id: a
        text: Indices start at zero, so it selects row two, column four
        correct: true
      - id: b
        text: Indices start at one, so it selects row one, column three
        correct: false
        feedback: Image coordinates in this lesson start both indices at zero.
      - id: c
        text: The first index selects a column, so it selects column two
        correct: false
        feedback: The row index comes first.
    solution: Counting from zero makes index 1 the second row and index 3 the fourth column.
  - id: iat-pixel-count
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A grayscale image has height {{= h }} and width {{= w }}. How many pixels does it contain?
    params:
      h:
        min: 2
        max: 20
        step: 1
      w:
        min: 3
        max: 24
        step: 1
    answer_expr: h*w
    tolerance: { abs: 0.000001 }
    solution: There are {{= h }} rows of {{= w }} pixels, so the total is {{= h*w }}.
  - id: iat-grid-index
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Which (row, column) pair names the top-left pixel?
    options:
      - id: a
        text: (0, 0)
        correct: true
      - id: b
        text: (1, 1)
        correct: false
        feedback: That selects the second row and second column.
      - id: c
        text: (0, 1)
        correct: false
        feedback: That selects the second column of the first row.
    solution: The first row and first column both have index zero.
  - id: iat-grid-size
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A grayscale image is advertised as 800×600 (width × height). What is its array shape?
    options:
      - id: a
        text: (600, 800)
        correct: true
      - id: b
        text: (800, 600)
        correct: false
        feedback: Array shape lists height before width.
      - id: c
        text: (600, 800, 3)
        correct: false
        feedback: Grayscale needs no three-channel axis.
    solution: Rows count height and columns count width, so the shape is (600, 800).
  - id: iat-grid-bytes
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A uint8 grayscale image has height {{= h }} and width {{= w }}. How many bytes do its pixel values take up?
    params:
      h:
        min: 3
        max: 25
        step: 1
      w:
        min: 4
        max: 30
        step: 1
    answer_expr: h*w
    tolerance: { abs: 0.000001 }
    solution: Each pixel occupies one byte, so {{= h }} times {{= w }} gives {{= h*w }} bytes.
  - id: iat-depth-grid
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A robot's depth camera stores one distance number per pixel, with 12 rows and 20 columns. Without an explicit channel axis, what shape does it have?
    options:
      - id: a
        text: (12, 20)
        correct: true
      - id: b
        text: (20, 12)
        correct: false
        feedback: The row count comes first.
      - id: c
        text: (12, 20, 3)
        correct: false
        feedback: One distance per pixel does not require three colour channels.
    solution: One measurement per pixel fits a matrix, with height 12 and width 20.
  - id: iat-layout-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: What does CHW mean?
    options:
      - id: a
        text: Channels, height, width
        correct: true
        feedback: CHW names the axes in their stored order, with channels first.
      - id: b
        text: Columns, height, width
        correct: false
        feedback: C counts channels, not columns.
      - id: c
        text: Channels, width, height
        correct: false
        feedback: H comes before W.
    solution: CHW lists the channel axis first, followed by height and width.
  - id: iat-layout-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why is the worked example's red plane [[10, 40], [70, 100]]?
    options:
      - id: a
        text: It takes the first channel of each pixel without moving its row or column
        correct: true
      - id: b
        text: It takes the first four numbers when read pixel by pixel, left to right
        correct: false
        feedback: That would produce [[10, 20], [30, 40]], which mixes channels.
      - id: c
        text: It averages the three numbers of every pixel
        correct: false
        feedback: Transposing preserves values rather than averaging them.
    solution: Red is the first number of each RGB triple; transpose preserves its spatial position.
  - id: iat-values-count
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: An HWC colour image has height {{= h }}, width {{= w }} and 3 channels. How many scalar values does it store?
    params:
      h:
        min: 2
        max: 16
        step: 1
      w:
        min: 2
        max: 20
        step: 1
    answer_expr: h*w*3
    tolerance: { abs: 0.000001 }
    solution: Each of {{= h*w }} pixels has three values, giving {{= h*w*3 }} values.
  - id: iat-chw-height
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: An HWC image has shape ({{= h }}, {{= w }}, 3). After transpose with (2, 0, 1), what is the size of axis 1 (the second axis)?
    params:
      h:
        min: 2
        max: 20
        step: 1
      w:
        min: 21
        max: 40
        step: 1
    answer_expr: h
    tolerance: { abs: 0.000001 }
    solution: CHW has shape (3, {{= h }}, {{= w }}), so axis 1 is height, {{= h }}.
  - id: iat-reshape-trap
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: An HWC RGB array contains pixel triples in row order. What goes wrong if you reshape it into three grids, each with height $H$ and width $W$, to make CHW planes?
    options:
      - id: a
        text: It regroups consecutive values, mixing channels within the supposed colour planes.
        correct: true
        feedback:
          Reshape keeps the default value order and cuts it into new shapes instead of moving
          axes.
      - id: b
        text: It keeps each colour plane intact but swaps height and width within each plane.
        correct: false
        feedback: A plain reshape does not first gather each channel's values into a plane.
      - id: c
        text: It gathers the correct colour values into planes but reverses the RGB channel order.
        correct: false
        feedback:
          Reshape does not gather channels or intentionally reverse their order; transpose is
          needed to move the channel axis.
    solution: Reshape regroups the existing value sequence, so a supposed channel plane can contain
      several colours. Transpose moves the channel axis while keeping every value with its pixel.
  - id: iat-batch-count
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A robot stores {{= n }} RGB images in NCHW, each height {{= h }} and width {{= w }}. How many scalar values are in the batch?
    params:
      n:
        min: 2
        max: 8
        step: 1
      h:
        min: 2
        max: 12
        step: 1
      w:
        min: 3
        max: 15
        step: 1
    answer_expr: n*3*h*w
    tolerance: { abs: 0.000001 }
    solution: "Multiply images, channels, height and width: {{= n }} × 3 × {{= h }} × {{= w }} = {{= n*3*h*w }}."
  - id: iat-depth-layout
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A depth image has HWC shape (6, 9, 1), with one distance channel. What is its CHW shape?
    options:
      - id: a
        text: (1, 6, 9)
        correct: true
      - id: b
        text: (3, 6, 9)
        correct: false
        feedback: Depth has one channel; transpose does not create two more.
      - id: c
        text: (1, 9, 6)
        correct: false
        feedback: Height stays before width.
    solution: Move the last axis first while keeping height before width, yielding (1, 6, 9).
  - id: iat-scale-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 2
    prompt: An RGB image is loaded as uint8 values from 0 to 255. Which preparation puts its values
      on a 0-to-1 scale?
    options:
      - id: a
        text: Convert to floating point and divide every channel value by 255.
        correct: true
        feedback: This maps brightness endpoints to 0 and 1 without changing the axes.
      - id: b
        text: Convert to floating point and subtract 255 from every channel value.
        correct: false
        feedback: Subtracting gives values from -255 to 0 instead of the requested scale.
      - id: c
        text: Keep values unchanged and move the channel axis to the first position.
        correct: false
        feedback: Axis movement changes layout while leaving brightness values unchanged.
    solution:
      Convert to floating point and divide each value by 255. This changes the brightness scale
      while preserving each pixel's channel values and position.
  - id: iat-scale-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why does the worked example's blue channel become zero?
    options:
      - id: a
        text: Its rescaled value equals its channel mean
        correct: true
      - id: b
        text: Every channel's smallest value must become zero
        correct: false
        feedback: Standardisation depends on the supplied mean, not the pixel's rank.
      - id: c
        text: Its standard deviation is zero
        correct: false
        feedback: Its standard deviation is 0.1; division by zero would be invalid.
    solution: The blue value is 0.2 and its mean is 0.2, so subtraction gives zero.
  - id: iat-rescale-value
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      An 8-bit camera pixel has whole-number brightness {{= k*51 }}. What floating-point brightness
      should a model expecting the 0-to-1 scale receive?
    params:
      k:
        min: 0
        max: 5
        step: 1
    answer_expr: k/5
    tolerance:
      abs: 1.0e-06
    solution: Rescaling 8-bit brightness uses division by 255, giving ${{= k*51 }}/255={{= k/5 }}$.
  - id: iat-standard-value
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A channel has already been rescaled to {{= q/10 }}. Its mean is 0.5 and its standard deviation is 0.25. What is the standardised value?
    params:
      q:
        min: 0
        max: 10
        step: 1
    answer_expr: (q/10-0.5)/0.25
    tolerance: { abs: 0.000001 }
    solution: "Subtract 0.5, then divide by 0.25: the result is {{= (q/10-0.5)/0.25 }}."
  - id: iat-pretrained
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      A camera image already contains floats between 0 and 1. A pretrained model was trained on
      that scale with fixed channel means and standard deviations. Which preparation preserves its expected
      input?
    options:
      - id: a
        text: Standardise once with the model's fixed channel statistics.
        correct: true
        feedback: The image is already rescaled, so only the model's expected standardisation remains.
      - id: b
        text: Divide by 255 again, then standardise with the model's fixed statistics.
        correct: false
        feedback: The second rescaling makes the values too small before the fixed statistics are applied.
      - id: c
        text: Replace the fixed channel statistics with each new image's own statistics.
        correct: false
        feedback: Per-image statistics change the preparation from the one the pretrained model expects.
    solution:
      The floating-point image already has the expected 0-to-1 scale. Apply the model's fixed
      channel statistics once, preserving the preparation used for training.
  - id: iat-robot-scale
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A robot camera channel rescales to {{= q/5 }}. The model expects mean 0.4 and standard deviation 0.2. What value should be fed for that channel?
    params:
      q:
        min: 0
        max: 5
        step: 1
    answer_expr: (q/5-0.4)/0.2
    tolerance: { abs: 0.000001 }
    solution: "Use the model's statistics: ({{= q/5 }} − 0.4) / 0.2 = {{= (q/5-0.4)/0.2 }}."
  - id: iat-explain-pipeline
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt: "An RGB array has HWC shape $(480,640,3)$. Explain how to move its channels first, how to make a single-image NCHW batch, and why reshape can mix pixels when used to move the colour axis."
    rubric:
      - id: axes
        criterion: Transpose axes with order $(2,0,1)$ to obtain CHW shape $(3,480,640)$.
        weight: 1
        required: true
      - id: batch
        criterion: Add a front axis of size $1$ to obtain NCHW shape $(1,3,480,640)$.
        weight: 1
        required: true
      - id: reshape
        criterion:
          Explain that reshape regroups the default index-order sequence and can mix channels from different
          pixels.
        weight: 1
        required: true
    exemplar: "Transpose with axis order $(2,0,1)$ to obtain $(3,480,640)$, keeping values with their pixels. Add a front axis of size $1$ for the single-image batch $(1,3,480,640)$. Reshape regroups the default index-order sequence, so using it to move channels can mix values from different pixels."
    solution: "Transpose with axis order $(2,0,1)$ to obtain $(3,480,640)$, keeping values with their pixels. Add a front axis of size $1$ for the single-image batch $(1,3,480,640)$. Reshape regroups the default index-order sequence, so using it to move channels can mix values from different pixels."
  - id: iat-recall-grid-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: iat-pixels-grid
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what does each entry of a grayscale image array represent, and what do its first and second axes count?"
    rubric:
      - id: point0
        criterion: "Explain that each entry is the brightness of one pixel."
        weight: 1
        required: true
      - id: point1
        criterion: "Explain that the first axis counts rows for height and the second counts columns for width."
        weight: 1
        required: true
    exemplar: "Each entry is the brightness of one pixel. The first axis counts rows for height and the second counts columns for width."
  - id: iat-recall-grid-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: iat-pixels-grid
    difficulty: 1
    est_minutes: 0.5
    prompt: "An image viewer gives the size of a grayscale photo as width by height. In what order does the image array list the two sizes in the array’s shape?"
    options:
      - id: a
        text: "Width first, then height."
        correct: false
        feedback: "Photo dimensions often list width first. The image array lists rows first."
      - id: b
        text: "Height first, then width."
        correct: true
        feedback: "The array’s rows give height and its columns give width."
      - id: c
        text: "The smaller size first, then the larger size."
        correct: false
        feedback: "The order is set by the axes of the array. It stays the same for tall and wide images."
    solution: "The image array gives the row count first and the column count second, so the shape starts with the height."
  - id: iat-recall-grid-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: iat-pixels-grid
    difficulty: 1
    est_minutes: 0.5
    prompt: "A grayscale image has height $H$ and width $W$. Write its number of pixels."
    answer: "H*W"
    variables: { "H": { "values": [2, 100, 1000] }, "W": { "values": [2, 100, 1000] } }
    solution: "There are $H$ rows of $W$ pixels, giving $HW$ pixels."
  - id: iat-recall-layout-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: iat-channels-layout
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what do HWC and CHW mean, and what does a transpose preserve when changing between them?"
    rubric:
      - id: point0
        criterion: "Explain that HWC puts height and width before channels, while CHW puts channels before height and width."
        weight: 1
        required: true
      - id: point1
        criterion: "Explain that a transpose moves axes while keeping each value with its own pixel."
        weight: 1
        required: true
    exemplar: "HWC puts height and width before channels, while CHW puts channels before height and width. A transpose moves axes while keeping each value with its own pixel."
  - id: iat-recall-layout-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: iat-channels-layout
    difficulty: 1
    est_minutes: 0.5
    prompt: "An RGB array comes from a camera in HWC layout. Which change to the axes converts it to CHW with the same values at the same pixels?"
    options:
      - id: a
        text: "Reverse all three axes."
        correct: false
        feedback: "Reversing the three axes gives CWH and swaps height and width."
      - id: b
        text: "Use reshape with a new shape."
        correct: false
        feedback: "Reshape can give the target shape while mixing values from different pixels and channels."
      - id: c
        text: "Move the channel axis first and keep the height before the width."
        correct: true
        feedback: "An explicit axis order moves the channel axis to the front and keeps height before width."
    solution: "Use an explicit axis transpose to move the channels and preserve the row and column of each value."
  - id: iat-recall-layout-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: iat-channels-layout
    difficulty: 1
    est_minutes: 0.5
    prompt: "Fill in the missing axis order to convert an HWC image to CHW. Give the three axis numbers in order."
    accept: ["(2, 0, 1)", "[2, 0, 1]", "2, 0, 1", "2 0 1"]
    regex: '^\s*(?:\(\s*2\s*,\s*0\s*,\s*1\s*\)|\[\s*2\s*,\s*0\s*,\s*1\s*\]|2(?:\s*,\s*|\s+)0(?:\s*,\s*|\s+)1)\s*$'
    solution: "The old channel axis is 2, followed by height axis 0 and width axis 1."
  - id: iat-recall-normalize-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: iat-normalization
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, how do you rescale uint8 pixel values, and how do you then standardise each channel?"
    rubric:
      - id: point0
        criterion: "Explain that rescaling divides each uint8 value by 255 to put it between zero and one."
        weight: 1
        required: true
      - id: point1
        criterion: "Explain that per-channel standardisation subtracts that channel's mean and divides by its positive standard deviation."
        weight: 1
        required: true
    exemplar: "Rescaling divides each uint8 value by 255 to put it between zero and one. Per-channel standardisation subtracts that channel's mean and divides by its positive standard deviation."
  - id: iat-recall-normalize-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: iat-normalization
    difficulty: 1
    est_minutes: 0.5
    prompt: "Which operation is per-channel standardisation of a rescaled image?"
    options:
      - id: a
        text: "Subtract each channel's mean and divide by its spread."
        correct: true
        feedback: "Per-channel standardisation uses the mean and standard deviation of the matching channel."
      - id: b
        text: "Divide every original uint8 pixel value by 255."
        correct: false
        feedback: "Division by 255 rescales uint8 values to the interval from zero to one."
      - id: c
        text: "Move the channel axis ahead of height and width."
        correct: false
        feedback: "Moving the channel axis changes layout while preserving pixel values."
    solution: "Per-channel standardisation uses the mean and standard deviation of the matching channel."
  - id: iat-recall-normalize-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: iat-normalization
    difficulty: 1
    est_minutes: 0.5
    prompt: "A rescaled pixel value is $x$ in channel $c$. The channel’s mean is $m_c$ and its standard deviation is $s_c>0$. Write the standardised value $x^\\prime$. Type `m_c` and `s_c`."
    answer: "(x-m_c)/s_c"
    variables: { "x": [0, 1], "m_c": [0.1, 0.9], "s_c": [0.05, 0.5] }
    solution: "Subtract the channel mean and divide by its standard deviation to get $(x-m_c)/s_c$."

  - id: iat-grid-row-from-index
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "A grayscale image has two rows of brightness values: $(14,38,72)$ and $(101,53,26)$, in that order. What is the brightness at row $1$, column $0$ in the image array?"
    answer: 101
    tolerance: { abs: 0 }
    solution: "The array counts from zero, so row $1$ is the second row and column $0$ is its first entry: $101$."

  - id: iat-rgba-channel-axis
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "A colour image has HWC shape $(6,9,4)$ because it includes a channel for transparency. It is transposed to CHW. What is the size of the first axis of the result?"
    answer: 4
    tolerance: { abs: 0 }
    solution: "In CHW the channel axis comes first. Transposing changes where the axis goes, so its size is still $4$."

  - id: iat-batch-pixels-from-shape
    dimension: math
    type: numeric
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "An RGB image batch in NCHW layout has shape $(5,3,2,7)$. How many pixels are there across the whole batch, counting each pixel once?"
    answer: 70
    tolerance: { abs: 0 }
    solution: "Each of the $5$ images has $2\\times7$ pixel positions. The $3$ channels describe the same pixels, so the batch has $5\\cdot2\\cdot7=70$ pixels."

  - id: iat-blue-plane-read
    dimension: math
    type: numeric
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "An RGB image in HWC layout has two rows of pixels. Row $0$ contains $(15,20,25)$ and $(30,35,40)$. Row $1$ contains $(45,50,55)$ and $(60,65,70)$. After transposing the image to CHW, what value is at index $(2,0,1)$? All indices start at zero."
    answer: 40
    tolerance: { abs: 0 }
    solution: "In CHW, index $2$ selects the blue channel. Row $0$, column $1$ is the pixel $(30,35,40)$, whose blue value is $40$."

  - id: iat-standardise-from-uint8
    dimension: math
    type: numeric
    role: review
    difficulty: 3
    est_minutes: 2
    prompt: "A uint8 RGB pixel has values $(51,204,102)$ in red, green and blue order. A model expects values rescaled to $[0,1]$ and then standardised. In that same colour order, its means are $(0.5,0.7,0.3)$ and its standard deviations are $(0.1,0.25,0.2)$. What green value should go to the model?"
    answer: 0.4
    tolerance: { abs: 0.0001 }
    solution: "Green rescales to $204/255=0.8$. Using the green mean and standard deviation gives $(0.8-0.7)/0.25=0.4$."
