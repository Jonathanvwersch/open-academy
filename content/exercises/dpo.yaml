  - id: dpo-explain-training
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "Explain how DPO trains a language model on a preference pair: what its loss compares, which way lowering it pushes each reply, and what DPO does without compared with RLHF."
    rubric:
      - id: r1
        criterion: State that the loss compares each reply's policy log-probability with the reference's, and takes $-\ln\sigma$ of $\beta$ times the chosen reply's log ratio minus the rejected reply's.
        weight: 1
        required: true
      - id: r2
        criterion: State that lowering the loss raises the chosen reply's log-probability and lowers the rejected reply's, relative to the reference.
        weight: 1
        required: true
      - id: r3
        criterion: State that DPO needs no separate reward model and no loop of writing and scoring new replies, and learns only from fixed preference pairs.
        weight: 1
        required: true
      - id: r4
        criterion: Mention that the push is largest when the policy ranks the pair the wrong way round.
        weight: 0.5
        required: false
    exemplar: For each reply in the pair, DPO takes the policy's log-probability minus the frozen reference's. The loss is minus the log of the sigmoid of beta times the chosen reply's log ratio minus the rejected reply's. Lowering it with gradient descent raises the chosen reply's log-probability and lowers the rejected reply's, relative to the reference, and the push is largest when the policy ranks the pair the wrong way round. Unlike RLHF, DPO needs no separate reward model and no loop of writing and scoring new replies. It learns only from the fixed preference pairs.
