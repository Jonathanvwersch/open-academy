concept: behavioral-cloning
exercises:
  - id: dx-il-1
    dimension: conceptual
    type: mc
    role: diagnostic
    difficulty: 2
    est_minutes: 2
    prompt: "Which description of behavioral cloning is most accurate?"
    options:
      - {
          id: a,
          text: "Supervised learning of a mapping from observations to the expert's actions, using recorded demonstrations",
          correct: true,
        }
      - {
          id: b,
          text: "Learning a reward function from demonstrations, then optimising it with RL",
          correct: false,
          category: misunderstood_definition,
          feedback: "That is inverse reinforcement learning.",
        }
      - {
          id: c,
          text: "Copying the expert's trajectory and replaying it open-loop",
          correct: false,
          category: misunderstood_definition,
          feedback: "BC learns a closed-loop policy that reacts to new observations.",
        }
      - {
          id: d,
          text: "Trial-and-error learning that maximises reward",
          correct: false,
          category: misunderstood_definition,
          feedback: "That describes reinforcement learning.",
        }
    solution: "BC treats each (observation, expert action) pair as a labelled example and fits a policy $\\pi(a\\mid o)$ with a standard supervised loss."
