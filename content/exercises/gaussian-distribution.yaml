concept: gaussian-distribution
exercises:
  - id: gauss-spread-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: What does the standard deviation describe?
    options:
      - id: a
        text: Spread around the mean, in the original units.
        correct: true
        feedback: It is the square root of the average squared distance.
      - id: b
        text: The signed average distance from the mean.
        correct: false
        feedback: Signed deviations cancel, even when values vary.
      - id: c
        text: The location of the largest possible reading.
        correct: false
        feedback: Standard deviation measures spread, not a maximum.
    solution: Standard deviation measures spread in the same units as the readings; variance uses
      squared units.
  - id: gauss-spread-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why did we square the distances before averaging in the five-reading worked example?
    options:
      - id: a
        text: To stop opposite signed distances cancelling.
        correct: true
        feedback: Both positive and negative deviations become nonnegative.
      - id: b
        text: To move the mean closer to the largest reading.
        correct: false
        feedback: We already found the mean; squaring deviations measures spread.
      - id: c
        text: To return the spread to centimetres immediately.
        correct: false
        feedback: Squaring gives squared centimetres; the square root returns centimetres.
    solution:
      Deviations sum to zero around the mean. Squaring makes distances on either side contribute
      to spread.
  - id: gauss-variance-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: Three readings are {{= m-d}}, {{= m}} and {{= m+d}} cm, with mean {{= m}} cm. Find their
      variance in square centimetres by averaging the three squared distances from the mean.
    params:
      m:
        min: 20
        max: 100
        step: 10
      d:
        min: 3
        max: 9
        step: 3
    answer_expr: 2*d^2/3
    tolerance:
      abs: 0.005
    solution:
      The deviations are $-{{= d}},0,{{= d}}$. Their squared average is $2\times{{= d}}^2/3={{=
      2*d^2/3}}$ square centimetres.
  - id: gauss-sd-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: A distribution has variance {{= s*s}} square centimetres. What is its standard deviation in cm?
    params:
      s:
        min: 1
        max: 8
        step: 1
    answer_expr: s
    tolerance:
      abs: 0.005
    solution: Standard deviation is the positive square root of variance, so it is $\sqrt{ {{= s*s}}
      }={{= s}}$ cm.
  - id: gauss-shift
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Add 10 cm to every sensor reading. What happens to the mean and standard deviation?
    options:
      - id: a
        text: The mean rises by 10 cm; the standard deviation stays the same.
        correct: true
        feedback: Each reading and the mean move together, preserving deviations.
      - id: b
        text: Both the mean and standard deviation rise by 10 cm.
        correct: false
        feedback: Shifting changes location but not distances from the mean.
      - id: c
        text: The mean stays fixed; the standard deviation rises by 10 cm.
        correct: false
        feedback: The mean shifts with all the readings; spread does not.
    solution: Adding a constant shifts the mean by that constant. Deviations from the new mean are unchanged.
  - id: gauss-scale
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A factory doubles every measured length. Originally the standard deviation was 2 cm and
      variance was 4 square centimetres. What are they now?
    options:
      - id: a
        text: Standard deviation 4 cm; variance 16 square centimetres.
        correct: true
        feedback: Deviations double, so their squares quadruple.
      - id: b
        text: Standard deviation 4 cm; variance 8 square centimetres.
        correct: false
        feedback: Variance scales with the square of the scale factor.
      - id: c
        text: Standard deviation 2 cm; variance 4 square centimetres.
        correct: false
        feedback: Multiplying lengths changes distances, unlike adding a constant.
    solution:
      Every deviation doubles, so variance becomes $4\times4=16$ and standard deviation becomes
      $\sqrt{16}=4$ cm.
  - id: gauss-area-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: How does a Gaussian model for measurements that can take any value on a number line assign probability to an interval?
    options:
      - id: a
        text: By the area under its density curve across that interval.
        correct: true
        feedback: Area combines height and width.
      - id: b
        text: By the density at the interval's midpoint alone.
        correct: false
        feedback: Height alone ignores the interval's width.
      - id: c
        text: By the number of endpoints in the interval alone.
        correct: false
        feedback: Endpoints do not measure the probability within a range.
    solution: Interval probability is area under the density; height is probability per unit of reading.
  - id: gauss-area-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why did the worked example subtract 0.95 from 1 to find the chance outside 96–104 cm?
    options:
      - id: a
        text: Inside and outside split the total area into complements.
        correct: true
        feedback: All probability lies either inside or outside.
      - id: b
        text: The height of every density curve is exactly 1.
        correct: false
        feedback: The total area is 1; the height need not be.
      - id: c
        text: Outside always has the same chance as inside.
        correct: false
        feedback: A central interval and its complement need not have equal areas.
    solution: The total area is 1. About 0.95 is inside, so about $1-0.95=0.05$ is outside.
  - id: gauss-interval-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt:
      A Gaussian has mean {{= m}} and standard deviation {{= s}}. What is the upper endpoint of
      the central range containing about 95% of its values? Use the 68–95–99.7 rule.
    params:
      m:
        min: 30
        max: 90
        step: 10
      s:
        min: 2
        max: 6
        step: 1
    answer_expr: m+2*s
    tolerance:
      abs: 0.005
    solution: The central 95% range extends about two standard deviations each way, so the upper
      endpoint is ${{= m}}+2\times{{= s}}={{= m+2*s}}$.
  - id: gauss-exact
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      A Gaussian model for measurements that can take any value on a number line has density 0.20 per cm at exactly 100 cm. What is the
      probability of exactly 100 cm before rounding?
    options:
      - id: a
        text: Zero, because an exact value has no interval width.
        correct: true
        feedback: A zero-width strip has zero area.
      - id: b
        text: 0.20, because density and probability are identical.
        correct: false
        feedback: Density must be combined with width to give area.
      - id: c
        text: One, because 100 cm is the peak of the curve.
        correct: false
        feedback: The peak is a location of high density, not certainty.
    solution:
      A single exact value has zero width and thus zero area in a model for measurements that can take any value on a number line. A rounded
      reading represents an interval instead.
  - id: gauss-tail
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      For a Gaussian with mean 100 cm and standard deviation 2 cm, about what fraction of readings
      exceed 104 cm?
    options:
      - id: a
        text: "0.025"
        correct: true
        feedback: About 5% lies outside two standard deviations, split equally between tails.
      - id: b
        text: "0.05"
        correct: false
        feedback: That counts both tails, not just the upper one.
      - id: c
        text: "0.475"
        correct: false
        feedback: That is roughly the area from the mean to two standard deviations above it.
    solution:
      About 95% lies from 96 to 104 cm. The remaining 5% splits equally, giving about 2.5% above
      104 cm.
  - id: gauss-range-transfer
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A Gaussian model for package masses has mean 500 g and standard deviation 10 g.
      Approximately what percentage lies from 490 to 520 g?
    options:
      - id: a
        text: 81.5%
        correct: true
        feedback:
          From minus one to plus one standard deviation is 68%; the next upper band adds (95-68)/2
          percent.
      - id: b
        text: 95%
        correct: false
        feedback: 95% requires the full range 480–520 g.
      - id: c
        text: 68%
        correct: false
        feedback: 68% describes 490–510 g, not the extra upper band.
    solution:
      The range covers minus one through plus two standard deviations. Add $68+(95-68)/2=81.5$
      percent, using the approximate bell rule.
  - id: gauss-formula-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt:
      Keep the mean fixed and double a Gaussian's standard deviation. What happens to its density
      curve?
    options:
      - id: a
        text: It becomes twice as wide and half as tall at the peak.
        correct: true
        feedback: The area stays 1 while width doubles.
      - id: b
        text: It becomes twice as wide and twice as tall at the peak.
        correct: false
        feedback: Increasing both would increase the total area.
      - id: c
        text: It shifts right and keeps its width and peak height.
        correct: false
        feedback: Changing the mean shifts the curve; changing spread does not.
    solution: The front factor is inversely proportional to standard deviation, so doubling spread
      halves peak height.
  - id: gauss-formula-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why did the worked example divide 102−100 by 2 before using the shape factor?
    options:
      - id: a
        text: To express distance in standard deviations.
        correct: true
        feedback: A 2 cm distance is one standard deviation when spread is 2 cm.
      - id: b
        text: To turn a density into an interval probability.
        correct: false
        feedback: Standardising changes the distance scale, not height into area.
      - id: c
        text: To replace the mean by a larger sensor reading.
        correct: false
        feedback: The mean stays 100 cm; we measure a distance from it.
    solution: The shape depends on relative distance $z=(x-\mu)/\sigma$, so the worked example uses $z=1$.
  - id: gauss-z-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt:
      A Gaussian has mean {{= m}} and standard deviation {{= s}}. A reading is {{= m+k*s}}. Find
      its signed standardised value $z$.
    params:
      m:
        min: 20
        max: 80
        step: 10
      s:
        min: 1
        max: 5
        step: 1
      k:
        min: -3
        max: 3
        step: 1
    answer_expr: k
    tolerance:
      abs: 0.005
    solution:
      "Subtract the mean and divide by spread: $z=({{= m+k*s}}-{{= m}})/{{= s}}={{= k}}$. The
      sign says which side of the mean the reading lies on."
  - id: gauss-density-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt:
      A Gaussian has mean {{= m}} cm and standard deviation {{= s}} cm. Use a calculator to find
      the density at the mean, in per cm. Round to two decimal places; use $\pi\approx3.14159$.
    params:
      m:
        min: 30
        max: 90
        step: 10
      s:
        min: 1
        max: 5
        step: 1
    answer_expr: 1/(s*sqrt(2*3.141592653589793))
    tolerance:
      abs: 0.005
    solution:
      At the mean the exponent is zero, so the shape factor is 1. The peak density is $1/({{=
      s}}\sqrt{2\pi})\approx{{= round(1/(s*sqrt(2*3.141592653589793)),2)}}$ per cm.
  - id: gauss-tall
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A Gaussian density peaks at 3.99 per cm. Is that necessarily an invalid distribution?
    options:
      - id: a
        text: No; a narrow curve can have height above 1 while its area is 1.
        correct: true
        feedback: Height has units per cm; probability is area.
      - id: b
        text: Yes; every density height must lie between 0 and 1.
        correct: false
        feedback: That restriction applies to probability, not density.
      - id: c
        text: No; it means an exact reading has probability 3.99.
        correct: false
        feedback: An exact reading has zero probability in a continuous model.
    solution: A density height above 1 is allowed. Only areas representing probabilities must lie
      between 0 and 1.
  - id: gauss-width-transfer
    dimension: math
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      Two Gaussian models for battery life both have mean 10 hours. Model A has variance 1 hour
      squared and model B variance 4 hours squared. How do their peak heights compare?
    options:
      - id: a
        text: A's peak is twice B's peak.
        correct: true
        feedback: Standard deviations are 1 and 2 hours, so peak heights have ratio 2.
      - id: b
        text: A's peak is four times B's peak.
        correct: false
        feedback: The front factor uses standard deviation, not variance.
      - id: c
        text: The peaks are equal because the means match.
        correct: false
        feedback: Equal means give equal peak locations, not equal heights.
    solution: Take square roots of the variances to get standard deviations 1 and 2. Peak density is
      inversely proportional to standard deviation, making A twice as tall.
  - id: gauss-sums-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    target_seconds: 30
    est_minutes: 2
    prompt: Which situation supports an approximately Gaussian total under the central limit theorem?
    options:
      - id: a
        text: Adding many independent effects with the same distribution and a limited range of sizes.
        correct: true
        feedback: These are the simple conditions taught for the bell-shaped approximation.
      - id: b
        text: Repeating one shared disturbance many times in a sum.
        correct: false
        feedback: The repeated disturbance creates dependence, not independent contributions.
      - id: c
        text: Choosing one measurement from any distribution at all.
        correct: false
        feedback: One arbitrary measurement need not have a bell-shaped distribution.
    solution: The theorem concerns sums or averages of many independent contributions under stated
      conditions; it is not a claim that every individual variable is Gaussian.
  - id: gauss-sums-why
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: Why was a sum of 7 six times as likely as a sum of 2 for two fair independent dice?
    options:
      - id: a
        text: Six ordered pairs give 7, while only one gives 2.
        correct: true
        feedback: Each of the 36 ordered pairs is equally likely.
      - id: b
        text: Each die favours middle faces over extreme faces.
        correct: false
        feedback: A fair die assigns the same chance to every face.
      - id: c
        text: The second die changes its result to balance the first.
        correct: false
        feedback: Independent dice do not adjust to each other.
    solution:
      "The counts of equally likely ordered pairs differ: six give 7 and one gives 2, so their
      probabilities have ratio six."
  - id: gauss-dice-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: Two fair independent dice are rolled. For a target sum of {{= t}} (between 2 and 7), how
      many of the 36 ordered pairs produce that sum?
    params:
      t:
        min: 2
        max: 7
        step: 1
    answer_expr: t-1
    tolerance:
      abs: 0.005
    solution: For sums up to 7, list pairs from $(1,{{= t-1}})$ to $({{= t-1}},1)$. There are ${{=
      t-1}}$ pairs.
  - id: gauss-independence
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A sensor error is the sum of 30 contributions. Which description supports the simple central limit theorem approximation for the total?"
    options:
      - id: a
        text: "The contributions are independent, with the same distribution and a limited range of sizes."
        correct: true
        feedback: "These are the conditions of the simple version: many independent effects with the same distribution and bounded sizes."
      - id: b
        text: "The contributions share a random offset, with the same distribution and a limited range of sizes."
        correct: false
        feedback: "A shared random offset links the contributions, so their changes carry information about each other."
      - id: c
        text: "The contributions are independent, with different distributions and one dominating the total variation."
        correct: false
        feedback: "One dominant contribution can preserve its own shape in the total; many small contributions must combine for the bell argument."
    solution: "The simple central limit theorem approximation uses many independent effects with the same distribution and a limited range of possible sizes. A shared cause breaks independence, while a dominant contribution can keep the total from becoming bell-shaped."
  - id: gauss-count-limit
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      A model predicts the number of customers arriving in a minute, usually 0 or 1. Why might a
      Gaussian with mean 0.5 and standard deviation 1 be a poor choice?
    options:
      - id: a
        text: It assigns area to negative and noninteger counts.
        correct: true
        feedback: Customers are counted in nonnegative whole numbers, so use a model made for counts.
      - id: b
        text: It cannot put its mean between two possible counts.
        correct: false
        feedback: An expected value need not be a possible individual value.
      - id: c
        text: It has no defined standard deviation for small means.
        correct: false
        feedback: A Gaussian can have this mean and spread, but it can also predict negative or fractional counts.
    solution:
      A Gaussian can predict negative or fractional values. Those predictions are unsuitable for
      small nonnegative counts; use a model made for counts.
  - id: gauss-outliers
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A Gaussian noise model predicts that about 0.3% of errors lie beyond three standard deviations. A large dataset has 8% there, even after fitting the mean and standard deviation. Which model feature is most directly contradicted?"
    options:
      - id: a
        text: "The probability it assigns to extreme errors."
        correct: true
        feedback: "The model assigns much less probability to extreme errors than the data show."
      - id: b
        text: "The location it assigns to the central error."
        correct: false
        feedback: "The mismatch concerns errors far from the fitted centre; the centre alone cannot describe tail frequency."
      - id: c
        text: "The measurement units it uses for the errors."
        correct: false
        feedback: "Changing units scales errors and standard deviation together, preserving the fraction beyond three standard deviations."
    solution: "The observed fraction beyond three standard deviations is much larger than the Gaussian prediction. Investigate the extreme errors and consider a model that assigns more probability to the tails."
  - id: gauss-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 5
    prompt: "Explain what the mean controls in a Gaussian sensor curve, what the variance controls, and how to obtain an interval probability from the curve."
    rubric:
      - id: shape
        criterion: Explain that the mean sets the Gaussian's centre.
        weight: 1
        required: true
      - id: width
        criterion: Explain that standard deviation is the square root of variance and sets the width.
        weight: 1
        required: true
      - id: area
        criterion: Explain that interval probability is the area under the curve between the interval's endpoints.
        weight: 1
        required: true
    exemplar: "The mean sets the curve's centre. Standard deviation is the square root of variance and sets its width. The area under the curve between two readings gives the probability of that interval."
    solution: "The mean sets the curve's centre. Standard deviation is the square root of variance and sets its width. The area under the curve between two readings gives the probability of that interval."
  - id: gauss-recall-spread-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: gauss-centre-spread
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what do the mean and standard deviation tell us about a Gaussian, and how is standard deviation related to variance?"
    rubric:
      - id: point1
        criterion: "Explain that the mean gives the centre and standard deviation gives the spread."
        weight: 1
        required: true
      - id: point2
        criterion: "State that standard deviation is the square root of variance."
        weight: 1
        required: true
    exemplar: "The mean locates the Gaussian's centre and standard deviation describes its spread. Standard deviation is the square root of variance."
  - id: gauss-recall-spread-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gauss-centre-spread
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: "Which change moves a Gaussian's centre while leaving its spread the same?"
    options:
      - id: a
        text: "Change standard deviation and keep the mean fixed"
        correct: false
        feedback: "Changing standard deviation changes width around the same centre."
      - id: b
        text: "Change variance and keep the mean fixed"
        correct: false
        feedback: "Variance controls spread through its square root."
      - id: c
        text: "Change the mean and keep standard deviation fixed"
        correct: true
        feedback: "The mean sets the centre, while fixed standard deviation preserves spread."
    solution: "The mean sets the centre, while fixed standard deviation preserves spread."
  - id: gauss-recall-spread-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: gauss-centre-spread
    difficulty: 1
    est_minutes: 0.5
    prompt: "A Gaussian has variance $v$. Write its standard deviation. Type `sqrt(...)` for a square root."
    answer: "sqrt(v)"
    variables: { "v": [0.25, 25] }
    solution: "Standard deviation is the square root of variance: $\\sqrt v$."
  - id: gauss-recall-area-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: gauss-bell-area
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, how does a Gaussian density give an interval's probability, and what is the total area under its curve?"
    rubric:
      - id: point1
        criterion: "Explain that the area under the curve over an interval gives its probability."
        weight: 1
        required: true
      - id: point2
        criterion: "State that the total area under the curve is one."
        weight: 1
        required: true
    exemplar: "An interval's probability is the area under the density over that interval. The whole curve has area one."
  - id: gauss-recall-area-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gauss-bell-area
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: "Which quantity gives the chance that an unrounded Gaussian reading falls in a specified interval?"
    options:
      - id: a
        text: "The distance from the midpoint to the mean"
        correct: false
        feedback: "Distance from the mean measures position relative to the centre."
      - id: b
        text: "The area under the density over that interval"
        correct: true
        feedback: "Area over the interval gives its chance."
      - id: c
        text: "The density height at the interval's midpoint"
        correct: false
        feedback: "Height measures density; interval width also matters."
    solution: "Area over the interval gives its chance."
  - id: gauss-recall-area-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: gauss-bell-area
    difficulty: 1
    est_minutes: 0.5
    prompt: "A small interval has width $w$ and roughly constant density $h$. Write an approximation to its probability."
    answer: "h*w"
    variables: { "h": [0.05, 0.5], "w": [0.01, 0.1] }
    solution: "Approximate the area by height times width: $hw$."
  - id: gauss-recall-density-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: gauss-density-formula
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, how do we standardise a reading, and what does the resulting $z$ measure?"
    rubric:
      - id: point1
        criterion: "State that we subtract the mean and divide by standard deviation."
        weight: 1
        required: true
      - id: point2
        criterion: "Explain that $z$ is the signed distance from the mean in standard deviations, without units."
        weight: 1
        required: true
    exemplar: "Subtract the mean from the reading and divide by standard deviation. The resulting $z$ is the signed distance in standard deviations, without units."
  - id: gauss-recall-density-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gauss-density-formula
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: "If a Gaussian's standard deviation doubles while its mean stays fixed, how do its width and peak change?"
    options:
      - id: a
        text: "It becomes twice as wide and half as high"
        correct: true
        feedback: "The front factor lowers the peak as width increases, preserving area one."
      - id: b
        text: "It becomes twice as wide and twice as high"
        correct: false
        feedback: "Increasing both width and peak would increase total area."
      - id: c
        text: "It becomes half as wide and twice as high"
        correct: false
        feedback: "This describes halving standard deviation."
    solution: "The front factor lowers the peak as width increases, preserving area one."
  - id: gauss-recall-density-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: gauss-density-formula
    difficulty: 1
    est_minutes: 0.5
    prompt: "Write the Gaussian density at reading $x$ for mean $\\mu$ and standard deviation $\\sigma$. Type `mu` for $\\mu$, `sigma` for $\\sigma$, and use `exp(...)`, `sqrt(...)` and `pi`."
    answer: "exp(-(x-mu)^2/(2*sigma^2))/(sigma*sqrt(2*pi))"
    variables: { "x": [-3, 3], "mu": [-2, 2], "sigma": [0.5, 3] }
    solution: "The density is $\\frac{1}{\\sigma\\sqrt{2\\pi}}\\exp(-(x-\\mu)^2/(2\\sigma^2))$."
  - id: gauss-recall-effects-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: gauss-small-effects
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, why can adding many small random effects give a roughly Gaussian total, and what independence condition matters?"
    rubric:
      - id: point1
        criterion: "Explain that middle totals can be reached more ways than extreme totals, making a bell-like shape."
        weight: 1
        required: true
      - id: point2
        criterion: "Explain that the small effects contributing within a reading need to be independent."
        weight: 1
        required: true
    exemplar: "Middle totals can be reached through more combinations than extremes, so adding many small effects can make a bell-like shape. The effects contributing within a reading need to be independent."
  - id: gauss-recall-effects-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: gauss-small-effects
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: "Which observation most directly challenges a Gaussian sensor model with small standard deviation?"
    options:
      - id: a
        text: "Many readings close to the mean"
        correct: false
        feedback: "Concentration near the mean fits a Gaussian."
      - id: b
        text: "Readings on both sides of the mean"
        correct: false
        feedback: "A symmetric bell allows readings on either side of its mean."
      - id: c
        text: "Frequent readings many standard deviations from the mean"
        correct: true
        feedback: "A Gaussian with small standard deviation assigns extremely little chance to readings far from its centre."
    solution: "A Gaussian with small standard deviation assigns extremely little chance to readings far from its centre."
  - id: gauss-recall-effects-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: gauss-small-effects
    difficulty: 1
    est_minutes: 0.5
    prompt: "Two independent random contributions have variances $a$ and $b$. Write the variance of their sum."
    answer: "a+b"
    variables: { "a": [0.5, 5], "b": [0.5, 5] }
    solution: "For independent contributions, variances add: $a+b$."
  - id: gauss-review-mirrored-density
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    target_seconds: 30
    est_minutes: 0.5
    prompt: A Gaussian model for a measured length has mean 30 cm. At what length below 30 cm is its density equal to its density at 37 cm? Give your answer in centimetres.
    answer: 23
    tolerance: { abs: 0.001 }
    solution: The bell has equal heights at equal distances on either side of the mean. Since $37-30=7$, the matching length is $30-7=23$ cm.
  - id: gauss-review-one-tail
    dimension: math
    type: numeric
    role: review
    difficulty: 2
    est_minutes: 1
    prompt: A Gaussian model for filling a bottle has mean 500 mL and standard deviation 4 mL. About what percentage of bottles contain more than 508 mL? Give a percentage number, for example 10 for 10%.
    answer: 2.5
    tolerance: { abs: 0.23 }
    solution: The cutoff is two standard deviations above the mean. About $5\%$ lies outside the central $95\%$, and symmetry puts half of that, $2.5\%$, in the upper tail.
  - id: gauss-review-add-noise
    dimension: math
    type: numeric
    role: review
    difficulty: 2
    est_minutes: 1
    prompt: Two independent measurement errors have standard deviations of 3 mm and 4 mm. What is the standard deviation of their sum, in millimetres?
    answer: 5
    tolerance: { abs: 0.001 }
    solution: The independent errors' variances add to $3^2+4^2=25$ square millimetres. Taking the square root gives 5 mm.
  - id: gauss-review-density-ratio
    dimension: math
    type: numeric
    role: review
    difficulty: 3
    est_minutes: 2
    prompt: A Gaussian model for a measurement has mean 40 and standard deviation 2. What is the ratio of the density at 38 to the density at 44? Give the density at 38 divided by the density at 44, to two decimal places. Round only at the end.
    answer: 4.48
    tolerance: { abs: 0.005 }
    solution: The standardised distances are $-1$ and $2$. The front factor in both densities is the same, so the ratio is $e^{-1/2}/e^{-2}=e^{1.5}\approx4.48$.
