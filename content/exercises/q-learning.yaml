  - id: qlp-epsilon-branch-choice
    dimension: implementation
    type: code_read
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: |
      A robot is in cell `s` and can move left or right. The Q-table entry `Q[(s, a)]` is the stored value for action `a` in cell `s`. The exploration probability is `eps`.

      For this run, `random.random()` returns 0.65, and `random.choice(actions)` would return "left" if called. What action does the code print? Type the action name.
    code: |
      import random

      eps = 0.1
      actions = ["left", "right"]
      Q = {(2, "left"): 1, (2, "right"): 4}
      s = 2
      if random.random() < eps:
          action = random.choice(actions)
      else:
          action = max(actions, key=lambda a: Q[(s, a)])
      print(action)
    accept: ["right", '"right"', "'right'"]
    solution: The draw is above epsilon, so the code chooses the action with the highest stored value in cell 2. Right has the higher value, so it prints right.
  - id: qlp-exploring-target-fix
    dimension: implementation
    type: mc
    role: review
    difficulty: 3
    est_minutes: 2
    prompt: |
      A robot in a warehouse can wait or advance. After taking action `a` in state `s`, it receives reward `r` and reaches a nonterminal state `s2`. Its epsilon-greedy policy has chosen `next_action`, which is to wait in `s2`.

      The Q-table entry `Q[(s, a)]` is the stored value for action `a` in state `s`. In the update target for that entry, `gamma` is the discount factor and `best_next` is the term for the value of future rewards.

      ```python
      next_action = "wait"
      best_next = Q[(s2, next_action)]
      target = r + gamma * best_next
      ```

      Which line should replace the assignment to `best_next` to give a Q-learning target while leaving the robot's next action unchanged?
    options:
      - id: a
        text: '`best_next = max(Q[(s, "wait")], Q[(s, "advance")])`'
        correct: false
        feedback: This searches the state the robot left. The target uses the values available in the state it reached.
      - id: b
        text: '`best_next = max(Q[(s2, "wait")], Q[(s2, "advance")])`'
        correct: true
        feedback: This compares both actions in the state the robot reached.
      - id: c
        text: "`best_next = max(Q[(s2, a)], Q[(s2, next_action)])`"
        correct: false
        feedback: If the previous and planned actions are both wait, this misses the value of advancing.
    solution: The Q-learning target uses the highest value available in the next state. The action the robot will actually execute still comes from its epsilon-greedy choice.
