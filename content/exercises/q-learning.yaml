  - id: ql-recall-update-rule-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: ql-update-rule
    difficulty: 2
    est_minutes: 0.5
    prompt: "The table holds $Q(s,a)=q$. The move earns reward $r$, the episode goes on, and the biggest table value in the new state is $m$. With learning rate $\\eta$ and discount factor $\\gamma$, write the updated $Q(s,a)$. Type `eta` for $\\eta$ and `gamma` for $\\gamma$."
    answer: "q + eta*(r + gamma*m - q)"
    variables: { q: [-5, 5], r: [-5, 10], m: [-5, 10], eta: [0.05, 0.95], gamma: [0.1, 0.95] }
    solution: "$Q(s,a)\\leftarrow q+\\eta\\,(r+\\gamma m-q)$: move a fraction $\\eta$ of the TD error."
