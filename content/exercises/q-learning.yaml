        correct: false
        category: incorrect_reasoning
        feedback: Values can be negative, and picking a worse move on purpose loses reward once learning is done.
    solution: Because Q-learning's target uses the max, its table estimates the values of acting greedily. Once training is over, exploring only costs reward, so the vacuum should act greedily.
  - id: ql-full-run-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: >-
      In Q-learning with a table, which entries change after the agent makes one move from state $s$ with action $a$?
    options:
      - id: a
        text: Only $Q(s,a)$, the entry for the move just made.
        correct: true
        feedback: Each update changes one entry. Other values change only when their own moves are made.
      - id: b
