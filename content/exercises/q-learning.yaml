  - id: ql-recall-q-table-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: ql-q-table
    difficulty: 2
    est_minutes: 0.5
    prompt: "In a corridor with reliable moves, taking $a$ in $s$ earns $r$ and always lands in the same nonterminal state $s'$. Fill in the missing value in $Q^*(s,a)=r+\\gamma\\,\\underline{\\quad\\quad}$. Use symbols or words."
    accept:
      [
        "max_a' Q*(s',a')",
        "max_{a'} Q^*(s',a')",
        "max Q*(s',a')",
        '\max_{a''}Q^*(s'',a'')',
        V*(s'),
        the optimal value of the next state,
        the best action value in the next state,
      ]
    regex: "^\\s*(?:(?:\\\\?max(?:imum)?\\s*(?:_\\s*(?:\\{\\s*a\\s*['’′]\\s*\\}|a\\s*['’′])\\s*|(?:over\\s+)?a\\s*['’′]\\s+)?(?:of\\s+)?q\\s*(?:\\^\\s*(?:\\{\\s*\\*\\s*\\}|\\*)|\\*)\\s*\\(\\s*s\\s*['’′]\\s*,\\s*a\\s*['’′]\\s*\\)|v\\s*(?:\\^\\s*(?:\\{\\s*\\*\\s*\\}|\\*)|\\*)\\s*\\(\\s*s\\s*['’′]\\s*\\)|(?:the\\s+)?(?:largest|highest|maximum|best|optimal)\\s+(?:action\\s+|state\\s+|q[- ]?)?value\\s+(?:of|in|for|from|at)\\s+(?:the\\s+)?(?:next\\s+state|s\\s*['’′])))\\s*$"
    solution: "The missing term is $\\max_{a'} Q^*(s',a')$, also written $V^*(s')$. It is the best action value in the state the move reaches."
