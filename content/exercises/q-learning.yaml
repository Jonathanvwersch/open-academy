  - id: qlp-code-read-update
    dimension: implementation
    type: code_read
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: What does this code print?
    code: |
      Q = {("A", "go"): 2.0, ("B", "go"): 4.0, ("B", "stop"): 6.0}
      gamma, eta = 0.9, 0.5
      s, a, r, s2 = "A", "go", 1.0, "B"
      best_next = max(Q[(s2, "go")], Q[(s2, "stop")])
      Q[(s, a)] += eta * (r + gamma * best_next - Q[(s, a)])
      print(round(Q[(s, a)], 2))
    answer: 4.2
    tolerance:
      abs: 0.001
    common_wrong:
      - answer: 6.4
        category: misunderstood_definition
        feedback: That is the TD target. The code moves only half of the gap toward it.
      - answer: 3.3
        category: incorrect_reasoning
        feedback: "`max` picks B's larger value, $6$, not the value of `go`, $4$."
    solution: The best next value is $6$, so the target is $1+0.9\times6=6.4$. The new value is $2+0.5\times(6.4-2)=4.2$.
