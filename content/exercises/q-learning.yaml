      - id: d
        text: Every entry in the table, by a small amount.
        correct: false
        category: misunderstood_definition
        feedback: A Q-table entry changes only when its own move is made.
    solution: One move gives one reward and one next state, which are used to update only $Q(s,a)$. The next state's values are read to build the target.
  - id: qlp-old-guess-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the worked example, why does $Q(2,\text{right})$ rise only from $1.5$ to $3.625$, when its best value is $8$?
    options:
      - id: a
        text: Its target uses cell 3's guess of $7.5$, which is still too low, and the update moves only halfway.
        correct: true
        feedback: The target is $-1+0.9\times7.5=5.75$, and the update moves halfway to it.
      - id: b
        text: Cell 2 is far from the goal, so its updates are always small.
        correct: false
        category: incorrect_reasoning
        feedback: The size of an update is $\eta$ times the gap, wherever the cell is.
      - id: c
        text: The robot explored on that move, so the update was smaller.
        correct: false
        category: incorrect_reasoning
        feedback: The robot made the greedy move there, and exploring doesn't shrink updates anyway.
    solution: The target $-1+0.9\times7.5=5.75$ is built from cell 3's current guess, $7.5$, which is below its best value, $10$. Moving halfway from $1.5$ to $5.75$ gives $3.625$. As cell 3's value rises, cell 2's targets rise too.
