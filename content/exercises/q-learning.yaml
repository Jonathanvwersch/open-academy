    est_minutes: 2
    prompt: "In a 4-cell corridor, reaching cell 4 ends the episode. Fill in the blank so the update uses the right best next value."
    code: |
      best_next = ____ if s2 == 4 else max(Q[(s2, "left")], Q[(s2, "right")])
      Q[(s, a)] += eta * (r + gamma * best_next - Q[(s, a)])
    accept:
      - "0"
      - "0.0"
      - "0.00"
    solution: After the episode ends nothing more can be earned, so the best next value is `0` and the target is just the reward `r`.
