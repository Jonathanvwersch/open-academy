        weight: 1
        required: true
    exemplar:
      An ablation removes or switches off one part and keeps everything else the same. The rise
      in error shows how much that part helps.
    solution:
      An ablation removes or switches off one part and keeps everything else the same. The rise
      in error shows how much that part helps.
  - id: edp-recall-ablation-contrast
    dimension: conceptual
    type: mc
    role: recall
    difficulty: 1
    est_minutes: 0.5
    target_seconds: 30
    prompt: You remove the age input, retrain with everything else the same and compare validation
      errors. What is this experiment called?
    knowledge_point: ed-ablation
    options:
      - id: a
        text: An ablation.
        correct: true
        feedback: Removing one part while holding other choices fixed is an ablation.
      - id: b
        text: A baseline comparison.
        correct: false
        category: incorrect_reasoning
        feedback:
          A baseline comparison judges a model against a reference; this experiment specifically
          removes a part.
      - id: c
        text: Hyperparameter tuning.
        correct: false
        category: incorrect_reasoning
        feedback: Tuning chooses settings such as the learning rate using validation results.
      - id: d
        text: A seed run.
        correct: false
        category: incorrect_reasoning
        feedback: A seed run changes the random choices while keeping the model’s parts.
    solution: Removing the age input and holding other choices fixed makes this an ablation.
  - id: edp-recall-ablation-formula
    dimension: math
    type: expression
    role: recall
    difficulty: 1
    est_minutes: 0.5
    prompt:
      The full model error is $f$ and the error with one part removed is $a$. Write the rise in
      error from removing the part. Type * for multiplication.
    knowledge_point: ed-ablation
    answer: a-f
    variables:
      f:
        - 100
        - 500
      a:
        - 100
        - 600
    solution: Subtract the full model error from the error without the part. The rise is $a-f$.
  - id: ed-seeds-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    target_seconds: 30
    prompt: What does a random seed do in training?
    options:
      - id: a
        text:
          It fixes the final error, so every run reaches exactly that error regardless of the training
          choices.
        correct: false
        category: incorrect_reasoning
        feedback: The seed fixes random choices such as the starting weights. The final error still depends on the model, its settings and the data.
      - id: b
        text:
          It selects the lowest-error model, so repeated seeds always find a better model than the
          previous run.
        correct: false
        category: incorrect_reasoning
        feedback: A seed does not search results or guarantee improvement.
      - id: c
        text:
          It removes the need for held-out data, so training error alone can judge the final model
          fairly.
        correct: false
        category: incorrect_reasoning
        feedback: Seeds do not replace held-out evaluation.
      - id: d
        text: It fixes the random choices, so the same seed repeats a run and a different seed gives
          different choices.
        correct: true
        feedback: The starting number fixes the random choices used in the run.
    solution: A random seed is a starting number that fixes the run’s random choices. The same seed repeats the run’s random choices, while a different one gives different choices.
  - id: edp-seeds-self-explain
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    target_seconds: 30
    prompt: Why believe the bedrooms gap of 35 but treat the age gap of 5 as unclear?
    lesson_only: true
    options:
      - id: a
        text:
          The bedrooms result comes from the best single seed, while the age result averages all three
          seeds.
        correct: false
        category: incorrect_reasoning
        feedback: Both gaps compare means over the same three seeds.
      - id: b
        text:
          Any positive mean gap proves a part helps, so both the bedrooms and age results are equally
          clear.
        correct: false
        category: incorrect_reasoning
        feedback: A small positive mean gap can come from the run’s random choices.
      - id: c
        text:
          Keeping bedrooms wins every seed, with gap 35 above spreads 20 and 30. Removing age wins
          once, with gap 5 below both spreads.
        correct: true
        feedback:
          The bedrooms result is larger than the spread and consistent; the age result is small and
          changes direction.
      - id: d
        text:
          The 35 is below both spreads, 20 and 30, so it is reliable; the 5 exceeds the spreads and is
          too large.
        correct: false
        category: incorrect_reasoning
        feedback: 35 exceeds 20 and 30; a gap smaller than the spread is harder to distinguish from luck.
    solution:
      The bedrooms gap of 35 exceeds the spreads of 20 and 30 and appears on every seed. The age
      gap of 5 is below the spreads of 20 and 40 and reverses on the second seed.
  - id: edp-spread-template
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 1
    target_seconds: 30
    prompt:
      A model's validation errors on three seeds are {{=b}}, {{=c}} and {{=a}}. What is the spread
      of these results?
    params:
      a:
        min: 300
        max: 340
        step: 10
      b:
        min: 350
        max: 390
        step: 10
      c:
        min: 400
        max: 440
        step: 10
    answer_expr: max(a,b,c)-min(a,b,c)
    solution:
      The largest result is {{=c}} and the smallest is {{=a}}. The spread is {{=c}} minus {{=a}}
      = {{=c-a}}.
    tolerance:
      abs: 0.000001
  - id: edp-gap-template
    dimension: conceptual
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: On the same three seeds, model A has validation errors {{=x-10}}, {{=x}} and {{=x+10}}.
      Model B has errors {{=y+5}}, {{=y-15}} and {{=y+10}}. How much higher is B’s mean error than
      A’s?
    params:
      x:
        min: 300
        max: 340
        step: 10
      y:
        min: 360
        max: 400
        step: 10
    answer_expr: y-x
    solution:
      A’s mean is ({{=x-10}} + {{=x}} + {{=x+10}})/3 = {{=x}}, and B’s is ({{=y+5}} + {{=y-15}}
      + {{=y+10}})/3 = {{=y}}. B’s mean is {{=y-x}} higher.
    tolerance:
      abs: 0.000001
  - id: edp-believe-gap
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      On the same three seeds, A has validation errors 300, 320 and 340; B has 310, 290 and 330.
      What do these results support?
    options:
      - id: a
        text:
          "A clear win for B: its best error is 290, so its mean and spread do not matter for this
          comparison."
        correct: false
        category: incorrect_reasoning
        feedback: Choosing the best seed highlights luck. Compare the means and spreads over shared seeds.
      - id: b
        text:
          "No clear difference: B’s mean is 10 lower, below both spreads of 40, and B wins only two of
          three seeds."
        correct: true
        feedback: The gap is smaller than the spreads, and A wins the first seed.
      - id: c
        text:
          "A clear win for B: its mean is 10 lower, above both spreads of 40, and B wins only two of
          three seeds."
        correct: false
        category: incorrect_reasoning
        feedback: 10 is smaller than 40, so the gap does not clearly exceed the spread.
      - id: d
        text:
          "A clear win for A: its error is lower on the first seed, so the remaining two seeds can be
          ignored."
        correct: false
        category: incorrect_reasoning
        feedback: B wins seeds two and three. One seed does not summarise the repeated comparison.
    solution:
      A and B have means 320 and 310 and spreads 40 each. The gap of 10 is below both spreads,
      and A wins seed 1 while B wins seeds 2 and 3, so there is no clear difference.
  - id: edp-best-seed
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      A team runs five seeds of a new method and reports its lowest validation error, 350, against
      one baseline run scoring 360. How should they judge the method?
    options:
      - id: a
        text: Compare means over the same seeds for both models; picking the best seed can report luck.
        correct: true
        feedback: A best-of-five result is a favourable draw compared with a single baseline run.
      - id: b
        text:
          Report the improvement of 10 as reliable; running five seeds guarantees the lowest one is
          typical.
        correct: false
        category: incorrect_reasoning
        feedback: The lowest of five can be much luckier than a typical run.
      - id: c
        text:
          Run more new-method seeds and keep the lowest; the single baseline run is enough for a fair
          comparison.
        correct: false
        category: incorrect_reasoning
        feedback: Increasing only the new method’s chances of a lucky score keeps the comparison unequal.
      - id: d
        text:
          Choose each model’s seed using test error; this removes luck before reporting validation
          error.
        correct: false
        category: incorrect_reasoning
        feedback: Using test error to choose a seed spends the test set on selection.
    solution: The lowest of five runs can be lucky. Run both models on the same seeds, compare their
      means and check the gap against their spreads.
  - id: edp-final-test
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: After ablations and seed comparisons on validation data, you choose a final model. What
      should you do next?
    options:
      - id: a
        text: Try several seeds on the test set and report the one with the lowest error.
        correct: false
        category: incorrect_reasoning
        feedback: Choosing by test error turns test data into selection data.
      - id: b
        text: Average its validation and test errors and use that average as the test score.
        correct: false
        category: incorrect_reasoning
        feedback: Validation guided choices, so merging it with test error loses the separate final estimate.
      - id: c
        text: Tune the final learning rate on the test set and then report its lowest error.
        correct: false
        category: incorrect_reasoning
        feedback: Test-guided retuning makes the final score too favourable.
      - id: d
        text: Score that chosen model once on the test set and report the result.
        correct: true
        feedback: The test set now provides the final held-out score.
    solution:
      Score the chosen model once on the test set after all choices based on validation data are
      finished.
  - id: edp-robot-seeds
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt:
      "Two robot walking controllers are tested on the same four seeds. Distances walked before
      falling are A: 50, 52, 48, 50 metres; B: 58, 60, 56, 62 metres. Higher is better. What do the
      results support?"
    options:
      - id: a
        text:
          "There is no clear difference: the mean gap is 9 metres, smaller than both spreads of 4 and
          6."
        correct: false
        category: incorrect_reasoning
        feedback: 9 is larger than both 4 and 6, and B wins all four paired seeds.
      - id: b
        text:
          "There is no clear difference: B has a higher mean, but A wins on at least one of the shared
          seeds."
        correct: false
        category: incorrect_reasoning
        feedback: B walks farther on every shared seed, by 8, 8, 8 and 12 metres.
      - id: c
        text:
          "B is clearly better: its mean is 9 metres higher, above both spreads of 4 and 6, and it wins
          every seed."
        correct: true
        feedback: A’s mean is 50 and B’s is 59; the gap exceeds both spreads and B always walks farther.
      - id: d
        text:
          "A is clearly better: its mean is 9 metres lower, below both spreads of 4 and 6, and lower
          distance is preferable."
        correct: false
        category: incorrect_reasoning
        feedback: Higher distance before falling is better in this task.
    solution:
      The means are 50 and 59 metres and the spreads are 4 and 6 metres. B’s gap of 9 exceeds
      both spreads, and B wins all four seeds.
  - id: edp-recall-seeds-say
    dimension: conceptual
    type: explain
    role: recall
    difficulty: 1
    est_minutes: 1
    prompt:
      In one or two sentences, what is a random seed, and when should you believe a gap between
      two models?
    knowledge_point: ed-seeds
    rubric:
      - id: r1
        criterion:
          Explain that a random seed is a number fixing the run’s random choices so the run can be
          repeated.
        weight: 1
        required: true
      - id: r2
        criterion:
          Explain that both models use the same several seeds and that a believable mean gap
          clearly exceeds both spreads with one model winning all or nearly all seeds.
        weight: 1
        required: true
    exemplar: A random seed fixes the random choices so a run can be repeated. Use the same several
      seeds for both models and believe a mean gap only when it clearly exceeds both spreads and one
      model wins all or nearly all seeds.
    solution: A random seed fixes the random choices so a run can be repeated. Use the same several
      seeds for both models and believe a mean gap only when it clearly exceeds both spreads and one
      model wins all or nearly all seeds.
  - id: edp-recall-seeds-contrast
    dimension: conceptual
    type: mc
    role: recall
    difficulty: 1
    est_minutes: 0.5
    target_seconds: 30
    prompt: What does the spread of one model's results across seeds measure?
    knowledge_point: ed-seeds
    options:
      - id: a
        text: How much its validation error differs from its test error.
        correct: false
        category: incorrect_reasoning
        feedback: That compares the validation and test sets. Seed spread compares repeated runs of one model with different seeds.
      - id: b
        text: How much its score changes from random choices alone.
        correct: true
        feedback: The largest minus smallest score measures variation across the run’s random choices.
      - id: c
        text: How much one part helps when it is removed from the model.
        correct: false
        category: incorrect_reasoning
        feedback: An ablation rise measures a removed part’s contribution.
      - id: d
        text: How much its mean score improves on the baseline’s mean score.
        correct: false
        category: incorrect_reasoning
        feedback: That is the gap between two models. Seed spread is the largest minus smallest score across one model's seeds.
    solution: Seed spread measures how much one model’s score varies with its random choices.
  - id: edp-recall-seeds-formula
    dimension: math
    type: expression
    role: recall
    difficulty: 1
    est_minutes: 0.5
    prompt:
      Model A scored $p$ and $q$ on two seeds. Model B scored $r$ and $s$ on the same seeds. Write
      B's mean minus A's mean. Type * for multiplication.
    knowledge_point: ed-seeds
    answer: (r+s)/2-(p+q)/2
    variables:
      p:
        - 300
        - 500
      q:
        - 300
        - 500
      r:
        - 300
        - 500
      s:
        - 300
        - 500
    solution:
      Each mean is the sum of its two scores divided by two. Subtracting A’s mean from B’s gives
      $(r+s)/2-(p+q)/2$.
  - id: ed-explain
    dimension: transfer
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt:
      You add two new parts to a house-price model, and in one run its validation error falls from
      500 to 480. In 2–4 sentences, explain what you would compare it with and how to keep that
      comparison fair, how you would find out what each new part adds, and how you would tell
      whether a gap is more than luck.
    rubric:
      - id: r1
        criterion:
          Compare with the previous best and a simple baseline, trained, tuned and scored the same
          way.
        weight: 1
        required: true
      - id: r2
        criterion:
          Explain that an ablation removes one part at a time, keeps everything else the same and
          measures the rise in validation error.
        weight: 1
        required: true
      - id: r3
        criterion:
          Run several seeds, the same for each model, and believe a mean gap only if it clearly
          exceeds the spread across seeds.
        weight: 1
        required: true
      - id: r4
        criterion:
          State that the final model is scored once on the test set after validation comparisons
          are finished.
        weight: 1
    exemplar:
      I would compare with the previous best and a simple mean predictor, using the same split,
      training length and validation tuning effort. I would remove each new part separately, keep
      everything else fixed and measure its rise in validation error. I would run the same several
      seeds for every model and believe a mean gap only if it clearly exceeds the spreads and one
      model wins nearly every seed. After choosing on validation data, I would score the final model
      once on the test set.
    solution:
      Use matched baselines, one-part ablations and repeated comparisons on the same seeds. A
      single reduction from 500 to 480 cannot separate the new parts from unequal training or luck.
