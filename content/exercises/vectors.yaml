concept: vectors
exercises:
  - id: vecp-add
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Follow arrow $a=(1,2)$, then $b=(3,-1)$, with right first and up second. Which vector joins the original start to the final endpoint?"
    solution: "Add matching coordinates: $(1+3,2+(-1))=(4,1)$. The endpoint is 4 units right and 1 up from the start."
    options:
      - {
          id: a,
          text: "$(4,1)$",
          correct: true,
          feedback: "Add matching entries: one plus three, then two minus one.",
        }
      - {
          id: b,
          text: "$(4,3)$",
          correct: false,
          feedback: "The second arrow goes 1 unit down, not up.",
        }
      - {
          id: c,
          text: "$(3,-2)$",
          correct: false,
          feedback: "Multiplying entries does not combine moves.",
        }
  - id: vecp-add-template
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot travels $({{=a}},{{=b}})$ then $({{=c}},{{=d}})$, in metres east and north. What is the northward component of its combined movement, in metres?"
    solution: "Add the second entries: ${{=b}}+({{=d}})={{=b+d}}$. The first entries affect only the first component."
    params:
      a: { min: -5, max: 5 }
      b: { min: -5, max: 5 }
      c: { min: -5, max: 5 }
      d: { min: -5, max: 5 }
    answer_expr: "b+d"

  - id: vecp-feature
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A house vector is $(120,3,15)$ in the order (area in square metres, bedrooms, age in years). What does it represent?"
    solution: "The three coordinates describe one house. Their meanings come from the stated order: 120 square metres, 3 bedrooms, and 15 years old."
    options:
      - {
          id: a,
          text: "It describes one house, with one coordinate per measurement.",
          correct: true,
          feedback: "Each entry is one feature, in the stated order.",
        }
      - {
          id: b,
          text: "It gives a robot's position, 120 metres east and 3 north.",
          correct: false,
          feedback: "These coordinates are house measurements, not distances from a dock.",
        }
      - {
          id: c,
          text: "It describes three houses, with one measurement each.",
          correct: false,
          feedback: "All three entries describe the same house.",
        }
  - id: vecp-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot records positions in metres east and north of its dock. Why must it distinguish $(2,5)$ from $(5,2)$ when finding a parcel?"
    solution: "The first entry gives the eastward distance and the second the northward distance. Swapping them sends the robot to a different destination."
    options:
      - {
          id: a,
          text: "Swapping entries changes the destination.",
          correct: true,
          feedback: "The entries specify different directions.",
        }
      - {
          id: b,
          text: "Swapping entries changes the number of entries.",
          correct: false,
          feedback: "Both vectors still have two entries.",
        }
      - {
          id: c,
          text: "Swapping entries makes the position invalid.",
          correct: false,
          feedback: "Both are valid positions, but they describe different places.",
        }
  - id: vecp-new-moves
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A warehouse robot travels $(2,-3)$ metres, then $(-1,5)$ metres, in east, north order. What is its combined movement?"
    solution: "The eastward distances total $2+(-1)=1$ and the northward distances total $-3+5=2$. The combined movement is $(1,2)$ metres."
    options:
      - {
          id: a,
          text: "$(1,2)$ metres",
          correct: true,
          feedback: "Adding matching entries gives 1 metre east and 2 north.",
        }
      - {
          id: b,
          text: "$(3,2)$ metres",
          correct: false,
          feedback: "The second journey goes 1 metre west, so subtract one from the eastward total.",
        }
      - {
          id: c,
          text: "$(1,-8)$ metres",
          correct: false,
          feedback: "The second journey goes 5 metres north, so add five to the northward total.",
        }
  - id: vecp-entry
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A house has vector $x=(120,3,15)$ for area in square metres, bedrooms, and age in years. What is $x_2$, the second entry?"
    solution: "The subscript selects an entry by position. The second entry is 3, not the total number of entries or their sum."
    answer: 3

  - id: vecp-why-scale-all
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why must you double both entries of arrow $(1,2)$ to make it twice as long without turning?"
    solution: "Doubling both entries gives $(2,4)$, keeping twice as much upward as rightward distance. Doubling only the first gives $(2,2)$, which points in a different direction."
    options:
      - {
          id: a,
          text: "Doubling both entries preserves the proportions of travel in each direction.",
          correct: true,
          feedback: "Both arrows reach twice as far up as right.",
        }
      - {
          id: b,
          text: "Adding the same number to both entries would also preserve direction.",
          correct: false,
          feedback: "Adding two gives $(3,4)$, which no longer has twice as much upward as rightward distance. Multiplication preserves that proportion; addition does not.",
        }
      - {
          id: c,
          text: "The signs alone determine direction, so doubling only one entry would work too.",
          correct: false,
          feedback: "$(1,2)$ and $(2,2)$ both point right and up, but at different angles. Signs do not tell you the exact direction.",
        }
  - id: vecp-scale-template
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot's planned movement is $x=({{=a}},{{=b}})$ metres east and north. It scales this by $c={{=c}}$. What is the eastward entry of $cx$, in metres?"
    solution: "Multiply the first entry by the scalar: ${{=c}}\\cdot({{=a}})={{=c*a}}$. Scaling applies this same multiplication to every entry."
    params:
      a: { min: -5, max: 5 }
      b: { min: -5, max: 5 }
      c: { min: -3, max: 3 }
    answer_expr: "c*a"

  - id: vecp-negative
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot travels $(2,-3)$ metres east and north. Which instruction retraces this journey by multiplying its vector by $-1$?"
    solution: "Multiplying every entry by $-1$ gives $(-2,3)$. It has the same length and the opposite direction."
    options:
      - {
          id: a,
          text: "It should travel $(-2,3)$ metres.",
          correct: true,
          feedback: "Both signs reverse, so the arrow points back.",
        }
      - {
          id: b,
          text: "It should travel $(-2,-3)$ metres.",
          correct: false,
          feedback: "You must reverse both components, not just the first.",
        }
      - {
          id: c,
          text: "It should travel $(2,3)$ metres.",
          correct: false,
          feedback: "You must reverse both components, not just the second.",
        }
  - id: vecp-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot cancels its planned journey of $(3,4)$ metres east and north by multiplying the vector by zero. What instruction remains?"
    solution: "Both entries become zero, so there is no movement. The zero vector has no direction."
    options:
      - {
          id: a,
          text: "It gets $(0,0)$, meaning no movement and no direction.",
          correct: true,
          feedback: "Every entry becomes zero.",
        }
      - {
          id: b,
          text: "It gets $(3,4)$, keeping the original journey.",
          correct: false,
          feedback: "Multiplying by one preserves a vector; zero does not.",
        }
      - {
          id: c,
          text: "It gets $(0,4)$, meaning 4 metres north.",
          correct: false,
          feedback: "Zero multiplies both entries, not just the first.",
        }
  - id: vecp-subtract
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot's movements are $a=(1,2)$ and $b=(3,-1)$ metres east and north. It travels $a$ three times, then reverses $b$. What is the northward entry of $3a-b$, in metres?"
    solution: "First $3a=(3,6)$. Subtracting the second entry of $b$ gives $6-(-1)=7$, because subtracting a negative adds its positive value."
    answer: 7

  - id: vecp-half
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot's planned journey is $(6,2)$ metres east and north. A parcel is halfway along that direction. Which movement reaches it?"
    solution: "Multiply both entries by $1/2$: $(6/2,2/2)=(3,1)$. A positive scalar preserves the direction."
    options:
      - {
          id: a,
          text: "$(3,1)$ metres",
          correct: true,
          feedback: "Multiply every entry by one half.",
        }
      - {
          id: b,
          text: "$(3,2)$ metres",
          correct: false,
          feedback: "Halving only one entry turns the arrow.",
        }
      - {
          id: c,
          text: "$(-3,-1)$ metres",
          correct: false,
          feedback: "This halves the length but reverses the direction.",
        }
  - id: vecp-norm
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot travels $(3,-4)$ metres east and north. Which calculation gives its straight-line distance from its starting point?"
    solution: "The squared entries are 9 and 16, so their sum is 25 and its square root is 5. Negative entries still contribute positive squares."
    options:
      - {
          id: a,
          text: "$\\sqrt{3^2+(-4)^2}=5$",
          correct: true,
          feedback: "Square both entries, add them, then take the square root.",
        }
      - {
          id: b,
          text: "$3+4=7$",
          correct: false,
          feedback: "Adding the distances measures a route east then south, not the straight line.",
        }
      - {
          id: c,
          text: "$3^2+(-4)^2=25$",
          correct: false,
          feedback: "This is the squared length; take its square root.",
        }
  - id: vecp-norm-template
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot is $(3\\cdot{{=k}},-4\\cdot{{=k}})$ metres east and north of its dock. What is its straight-line distance to the dock, in metres?"
    solution: "The entries are ${{=3*k}}$ and ${{=-4*k}}$, whose squares add to ${{=9*k*k}}+{{=16*k*k}}={{=25*k*k}}$. The square root is ${{=5*k}}$, the straight-line length."
    params:
      k: { min: 1, max: 6 }
    answer_expr: "5*k"

  - id: vecp-distance
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot is at $(1,1)$ and a parcel is at $(4,5)$, in metres east and north of the charging dock. What is the straight-line distance between them, in metres?"
    solution: "Subtract coordinates to get $(4-1,5-1)=(3,4)$. Its length is $\\sqrt{3^2+4^2}=\\sqrt{25}=5$ metres."
    answer: 5

  - id: vecp-why-root
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot is 3 metres east and 4 north of its dock. Why must it take the square root after adding the squared distances to find how far away the dock is?"
    solution: "Pythagoras gives the squared diagonal length. The root recovers the diagonal itself: for $(3,4)$ metres, the squared steps sum to 25 square metres, but the length is 5 metres."
    options:
      - {
          id: a,
          text: "Pythagoras gives squared length, so the root is needed to recover length in metres.",
          correct: true,
          feedback: "The squared steps give square metres, and their square root gives metres.",
        }
      - {
          id: b,
          text: "The root is what makes negative entries contribute positively.",
          correct: false,
          feedback: "Squaring already makes each contribution nonnegative. The root recovers length from squared length.",
        }
      - {
          id: c,
          text: "The root converts the straight-line distance into the route east then north.",
          correct: false,
          feedback: "Travelling east then north covers 7 metres here. Squaring, adding, and taking the square root gives the straight-line distance of 5 metres instead.",
        }
  - id: vecp-units
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A house app compares $(2,5)$ with $(4,1)$, recording room count and kilometres to the town centre. It converts kilometres to metres without adjusting anything else. What happens to its distance comparisons?"
    solution: "Converting kilometres to metres multiplies those coordinate gaps by 1,000 and their squared contributions by 1,000,000. Rescaling features to comparable ranges avoids one unit choice dominating similarity."
    options:
      - {
          id: a,
          text: "Distance to the town centre can have much more influence on the comparison.",
          correct: true,
          feedback: "Its differences become 1,000 times larger before squaring.",
        }
      - {
          id: b,
          text: "The comparisons stay unchanged when the units change.",
          correct: false,
          feedback: "The physical houses stay the same, but the numerical gaps change.",
        }
      - {
          id: c,
          text: "Room count must now have the greatest influence.",
          correct: false,
          feedback: "The room gaps stay unchanged while the other feature grows.",
        }
  - id: vecp-zero-length
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A house model records differences in area, bedroom count and age as $(0,0,0)$. What is the L2 length of this difference vector?"
    solution: "All squared entries are zero, so their sum is zero. Taking the square root still gives zero."
    answer: 0
  - id: vec-check-combo
    dimension: math
    type: text
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "A robot's movements are $a=(1,2)$ and $b=(3,-1)$ metres east and north. Find $3a-b$ to plan three journeys of $a$ followed by the reverse of $b$. Answer as `(east, north)`."
    accept: ["(0,7)", "(0, 7)", "0,7", "0, 7", "[0,7]", "[0, 7]"]
    hints: ["Compute $3a$ first.", "$3a=(3,6)$. Now subtract each matching entry of $b$."]
    solution: "$3a = (3, 6)$, and $(3, 6) - (3, -1) = (0, 7)$."
  - id: dx-math-1
    dimension: math
    type: numeric
    role: diagnostic
    difficulty: 1
    est_minutes: 1
    prompt: "A flying warehouse robot is 3 metres east, 4 north and 12 above its dock. What is the L2 length of its position vector $x=(3,4,12)$, in metres?"
    answer: 13
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 19,
          category: misunderstood_definition,
          feedback: "Adding the distances gives a route along three directions, not the straight line. Square each distance, add, then take the square root.",
        }
      - { answer: 169, category: math_error, feedback: "You forgot the square root." }
    solution: "$\\sqrt{9 + 16 + 144} = \\sqrt{169} = 13$."
  - id: vec-norm-1
    dimension: math
    type: numeric
    role: core
    difficulty: 1
    est_minutes: 2
    prompt: "A flying robot travels $v=(1,-2,2)$ metres in east, north, upward order. What is its straight-line distance from its start, $\\|v\\|_2$, in metres?"
    answer: 3
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 1,
          category: misunderstood_definition,
          feedback: "You summed the signed components. A norm squares them, so signs never cancel.",
        }
      - {
          answer: 5,
          category: misunderstood_definition,
          feedback: "Adding the absolute distances measures a route along the separate directions. For the straight line, square each entry, add, then take the square root.",
        }
      - { answer: 9, category: math_error, feedback: "You forgot the square root." }
    hints: ["Square each component.", "$1 + 4 + 4 = 9$. One step left."]
    solution: "$\\sqrt{1 + 4 + 4} = \\sqrt{9} = 3$."
  - id: vec-distance
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 2
    prompt: "A robot is at $(1,1)$ and its parcel at $(4,5)$, in metres east and north from the dock. What is their Euclidean distance, in metres?"
    answer: 5
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 7,
          category: misunderstood_definition,
          feedback: "Adding $|3|+|4|$ measures a route east then north, not the direct distance.",
        }
      - { answer: 25, category: math_error, feedback: "You forgot the square root." }
    hints: ["Distance is the norm of the difference vector."]
    solution: "The difference is $(3, 4)$, and $\\sqrt{9 + 16} = 5$."
  - id: vec-scale-dominance
    dimension: conceptual
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "You compare houses by Euclidean distance on two raw features: floor area in m² (range 40–300) and number of bedrooms (range 1–5). What happens?"
    options:
      - {
          id: a,
          text: "Area has much more influence on the distance, so bedroom count can barely affect the comparison.",
          correct: true,
        }
      - {
          id: b,
          text: "Both features must contribute equally because the rule treats each coordinate the same.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Each coordinate is treated the same *numerically*, but a 50 m² gap contributes $50^2 = 2500$ while a 2-bedroom gap contributes $4$.",
        }
      - {
          id: c,
          text: "Bedroom count has more influence because it uses whole numbers.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The sizes of the differences matter, not whether the numbers are whole.",
        }
      - {
          id: d,
          text: "Distance cannot be calculated for features with different units.",
          correct: false,
          category: misunderstood_definition,
          feedback: "The calculation still gives a number, but its meaning depends on the units and ranges chosen.",
        }
    hints: ["Compare the size of a typical difference in each feature, then square both."]
    solution: "An area gap of 50 contributes $50^2=2500$, while a gap of two bedrooms contributes $2^2=4$. Convert each feature to a comparable numerical range before using distance to judge similarity."
  - id: vec-review-l1-l2
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "A model compares houses by the length of a difference vector $x\\in\\mathbb{R}^n$. Which expression gives that L2 length?"
    options:
      - { id: a, text: "$\\sqrt{\\sum_i x_i^2}$", correct: true }
      - {
          id: b,
          text: "$\\sum_i |x_i|$",
          correct: false,
          category: recall_failure,
          feedback: "That adds the absolute entries instead of squaring, adding, and taking a square root.",
        }
      - {
          id: c,
          text: "$\\max_i |x_i|$",
          correct: false,
          category: recall_failure,
          feedback: "That selects only the largest absolute entry. L2 length includes every squared entry.",
        }
      - { id: d, text: "$\\sum_i x_i$", correct: false, category: recall_failure }
    solution: "$\\|x\\|_2 = \\sqrt{\\sum_i x_i^2}$."
  - id: vec-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "A house app records area, bedrooms and age as $(120,3,15)$. In 2–4 sentences, explain what this vector represents and why the numerical range of each measurement matters when comparing houses by distance."
    rubric:
      - {
          id: r1,
          criterion: "Each feature becomes one coordinate, so an example is a point (or arrow) in feature space",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Distance sums (squared) differences over coordinates, so features with large numeric ranges dominate",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Explains that features should be rescaled to comparable numerical ranges",
          weight: 1,
        }
    exemplar: "Each measurement is one coordinate in a fixed order, so all three numbers describe the same house. Distance adds squared differences for each coordinate; an area difference of 50 adds 2500, while two bedrooms add only 4. Area can therefore overwhelm the comparison even if bedrooms matter to the buyer. Rescaling the measurements to comparable numerical ranges makes this comparison more useful."
    solution: "Each coordinate records a feature of one house. The units and numerical ranges affect how strongly each feature contributes to distance."
