concept: vectors
exercises:
  - id: vec-points-moves-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is a vector?"
    options:
      - id: a
        text: "An ordered list of numbers, where each position has its own meaning."
        correct: true
        feedback: "The order says what each number means, such as east first and north second."
      - id: b
        text: "A collection of numbers whose order can change without changing its meaning."
        correct: false
        feedback: "Order matters: $(2,5)$ is 2 east and 5 north, while $(5,2)$ is a different place."
      - id: c
        text: "A single number that measures how far something has moved in total."
        correct: false
        feedback: "That single number is a length, which comes later in this lesson. A vector keeps several numbers."
      - id: d
        text: "A list of numbers that must all be measured in exactly the same units."
        correct: false
        feedback: "A feature vector can mix units, such as square metres, bedrooms and years."
    solution: "A vector is an ordered list of numbers. Each position has a fixed meaning, so swapping entries changes the vector."
  - id: vecp-add-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, the robot moves $a=(1,3)$ and then $b=(2,1)$. Why does step 1 add $1+2$ rather than $1+3$?"
    options:
      - id: a
        text: "The 1 and the 2 are both distances east, so their sum is the total east; the 3 is a distance north."
        correct: true
        feedback: "Matching components share a meaning, so only they can be added together."
      - id: b
        text: "The first and last numbers written down are always added, whatever they mean."
        correct: false
        category: incorrect_reasoning
        feedback: "Position in the vector decides what to add, not position on the page: east goes with east."
      - id: c
        text: "Adding $1+3$ would give the same end point, since numbers add in any order."
        correct: false
        category: incorrect_reasoning
        feedback: "$1+3$ mixes an east distance with a north one, giving a wrong east total of 4."
      - id: d
        text: "North components can't be added, so only the east components are combined."
        correct: false
        category: misunderstood_definition
        feedback: "Step 2 adds the north components too: $3+1=4$."
    solution: "Vector addition adds matching components. The 1 and the 2 are both east distances; the 3 is a north distance, so mixing it in would be meaningless."
  - id: vecp-add-template
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot moves $({{=a}},{{=b}})$ and then $({{=c}},{{=d}})$, in metres east and north. What is the north component of its combined move, in metres?"
    solution: "Add the north (second) components: ${{=b}}+({{=d}})={{=b+d}}$. The east components only affect the first component."
    params:
      a: { min: -5, max: 5 }
      b: { min: -5, max: 5 }
      c: { min: -5, max: 5 }
      d: { min: -5, max: 5 }
    answer_expr: "b+d"
  - id: vecp-feature
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A house's feature vector is $(120,3,15)$, in the order area in square metres, bedrooms, age in years. What does it represent?"
    solution: "All three components describe the same house. The order gives their meaning: 120 square metres, 3 bedrooms and 15 years old."
    options:
      - id: a
        text: "One house, with one component for each of its measurements."
        correct: true
        feedback: "Each component is one measurement of that house, in the stated order."
      - id: b
        text: "A robot's position, 120 metres east and 3 metres north."
        correct: false
        feedback: "These components are house measurements, not distances from a dock."
      - id: c
        text: "Three different houses, with one measurement for each house."
        correct: false
        feedback: "All three components belong to the same house."
  - id: vecp-entry
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A house has feature vector $x=(120,3,15)$: area in square metres, bedrooms, age in years. What is $x_2$?"
    solution: "The subscript picks a component by position, so $x_2$ is the second component: 3, the number of bedrooms."
    answer: 3
  - id: vecp-add
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Follow arrow $a=(1,2)$, then arrow $b=(3,-1)$, with east first and north second. Which vector goes straight from the start to the final end point?"
    solution: "Add matching components: $(1+3,\\;2+(-1))=(4,1)$. The end point is 4 units east and 1 north of the start."
    options:
      - id: a
        text: "$(4,1)$"
        correct: true
        feedback: "East: $1+3=4$. North: $2+(-1)=1$."
      - id: b
        text: "$(4,3)$"
        correct: false
        feedback: "The second arrow goes 1 unit south, so the north total is $2-1=1$."
      - id: c
        text: "$(3,-2)$"
        correct: false
        feedback: "Multiplying components does not combine moves; add them instead."
  - id: vecp-new-moves
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A warehouse robot moves $(2,-3)$ metres, then $(-1,5)$ metres, east first and north second. What is its combined move?"
    solution: "East: $2+(-1)=1$. North: $-3+5=2$. The combined move is $(1,2)$ metres."
    options:
      - id: a
        text: "$(1,2)$ metres"
        correct: true
        feedback: "Adding matching components gives 1 metre east and 2 north."
      - id: b
        text: "$(3,2)$ metres"
        correct: false
        feedback: "The second move goes 1 metre west, so the east total is $2-1=1$."
      - id: c
        text: "$(1,-8)$ metres"
        correct: false
        feedback: "The second move goes 5 metres north, so the north total is $-3+5=2$."
  - id: vecp-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot records positions as (metres east, metres north) of its dock. Which statement about the positions $(2,5)$ and $(5,2)$ is true?"
    solution: "The first component is the distance east and the second the distance north. Swapping them gives a different place."
    options:
      - id: a
        text: "They are different places: one is 2 metres east and 5 north, the other 5 east and 2 north."
        correct: true
        feedback: "Each position in the list has its own meaning, so swapping the numbers moves the point."
      - id: b
        text: "They are the same place, because both vectors contain the same two numbers."
        correct: false
        category: misunderstood_definition
        feedback: "A vector is an ordered list. $(2,5)$ is 2 east and 5 north, but $(5,2)$ is 5 east and 2 north."
      - id: c
        text: "They are the same place written in a different order, just as $2+5$ equals $5+2$."
        correct: false
        category: incorrect_reasoning
        feedback: "Order doesn't matter when adding two numbers, but in a vector the order says which number is east and which is north."
      - id: d
        text: "They are the same place, but the robot must use the order its map was drawn in."
        correct: false
        category: misunderstood_definition
        feedback: "With east first and north second, the two vectors mark different points on the map."
  - id: vecp-missing-move
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A robot's first move from its dock is $(2,-1)$ metres east and north. After a second move it is at $(5,2)$. What is the north component of the second move, in metres?"
    solution: "The two moves must add to $(5,2)$, so the second move's north component $n$ satisfies $-1+n=2$, giving $n=3$. The whole second move is $(3,3)$."
    answer: 3
  - id: vec-change-move-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does multiplying a vector by a scalar do?"
    options:
      - id: a
        text: "It multiplies every component of the vector by that same number."
        correct: true
        feedback: "That stretches, shrinks or reverses the arrow along the same line."
      - id: b
        text: "It adds that same number to every component of the vector."
        correct: false
        feedback: "Adding a number usually turns the arrow; scaling multiplies instead."
      - id: c
        text: "It multiplies only the first component of the vector by that number."
        correct: false
        feedback: "Scaling multiplies every component; changing only one usually turns the arrow."
      - id: d
        text: "It turns the vector into a single number, its total length."
        correct: false
        feedback: "The result is still a vector with the same number of components."
    solution: "Scaling multiplies every component by the same number. The arrow stays on its line, changing length and, for a negative scalar, direction."
  - id: vecp-scale-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In step 4 of the worked example, why does checking $b+(a-b)=a$ show what $a-b$ means?"
    options:
      - id: a
        text: "Starting at $b$'s tip and making the move $a-b$ lands on $a$'s tip, so it is the move from $b$ to $a$."
        correct: true
        feedback: "Adding a move to a starting point gives the end point, and here the end point is $a$."
      - id: b
        text: "It shows that $a-b$ equals $a$, so subtracting $b$ leaves the vector $a$ unchanged."
        correct: false
        category: misunderstood_definition
        feedback: "$a-b=(-1,2)$, which is not $a=(1,3)$. The check adds $b$ back on."
      - id: c
        text: "It shows that $a-b$ is just $b$ reversed, the same arrow as $-b$ in step 2."
        correct: false
        category: incorrect_reasoning
        feedback: "$-b=(-2,-1)$, but $a-b=(-1,2)$: subtracting adds $-b$ to $a$, not to the origin."
      - id: d
        text: "It shows that $a-b$ is the move from $a$'s tip to $b$'s tip, read backwards."
        correct: false
        category: incorrect_reasoning
        feedback: "The check starts at $b$ and ends at $a$. The move from $a$ to $b$ is $b-a=(1,-2)$."
    solution: "$b+(a-b)$ means: stand at $b$'s tip and make the move $a-b$. Landing on $a$ shows that $a-b$ is the move from $b$ to $a$."
  - id: vecp-scale-template
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot's planned move is $x=({{=a}},{{=b}})$ metres east and north. It scales the move by $c={{=c}}$. What is the east component of $cx$, in metres?"
    solution: "Multiply the first component by the scalar: ${{=c}}\\cdot({{=a}})={{=c*a}}$. Scaling multiplies every component the same way."
    params:
      a: { min: -5, max: 5 }
      b: { min: -5, max: 5 }
      c: { min: -3, max: 3 }
    answer_expr: "c*a"
  - id: vecp-half
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot's planned move is $(6,2)$ metres east and north. A parcel sits halfway along that move. Which move reaches it?"
    solution: "Multiply both components by $0.5$: $(0.5\\cdot6,\\;0.5\\cdot2)=(3,1)$. A positive scalar keeps the direction."
    options:
      - id: a
        text: "$(3,1)$ metres"
        correct: true
        feedback: "Multiply every component by one half."
      - id: b
        text: "$(3,2)$ metres"
        correct: false
        feedback: "Halving only one component turns the arrow."
      - id: c
        text: "$(-3,-1)$ metres"
        correct: false
        feedback: "This is half as long but reversed; the scalar here is $-0.5$, not $0.5$."
  - id: vecp-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A robot's planned move is $(3,4)$ metres east and north. What is the result of multiplying this vector by the scalar $0$?"
    solution: "Scalar multiplication multiplies every component, so both become zero: $(0,0)$, the zero vector. It is still a vector, with no length and no direction."
    options:
      - id: a
        text: "The vector $(0,0)$, a move of no length."
        correct: true
        feedback: "Every component is multiplied by zero, and the result is still a vector."
      - id: b
        text: "The single number $0$, because the vector disappears."
        correct: false
        category: misunderstood_definition
        feedback: "Multiplying a vector by a scalar gives a vector with the same number of components, here $(0,0)$."
      - id: c
        text: "The vector $(0,4)$, a move 4 metres north."
        correct: false
        category: misapplied_technique
        feedback: "The scalar multiplies every component, not just the first."
      - id: d
        text: "The vector $(3,4)$, because multiplying by zero changes nothing."
        correct: false
        category: misunderstood_definition
        feedback: "Adding zero changes nothing. Multiplying each component by zero makes it zero."
  - id: vecp-why-scale-all
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "You want an arrow twice as long as $(1,2)$ that points the same way. Which arrow is it?"
    solution: "Multiply both components by 2 to get $(2,4)$. It still goes twice as far north as east, so it points the same way and is twice as long."
    options:
      - id: a
        text: "$(2,4)$"
        correct: true
        feedback: "Doubling both components keeps the 1-to-2 balance of east to north, so the direction stays."
      - id: b
        text: "$(2,2)$"
        correct: false
        category: misapplied_technique
        feedback: "Only the first component was doubled. $(2,2)$ goes as far north as east, so it points a different way."
      - id: c
        text: "$(2,3)$"
        correct: false
        category: misunderstood_definition
        feedback: "Adding 1 to each component changes the direction: $(2,3)$ no longer goes twice as far north as east."
      - id: d
        text: "$(1,4)$"
        correct: false
        category: misapplied_technique
        feedback: "Only the second component was doubled, which turns the arrow towards north."
  - id: vecp-negative
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A robot moved $(2,-3)$ metres east and north. Which move takes it straight back to where it started?"
    solution: "Going straight back is the same move reversed, which means multiplying every component by $-1$: $(-2,3)$, the same length in the opposite direction."
    options:
      - id: a
        text: "It should move $(-2,3)$ metres."
        correct: true
        feedback: "Multiplying by $-1$ flips both signs, so the arrow points straight back."
      - id: b
        text: "It should move $(-2,-3)$ metres."
        correct: false
        feedback: "Both components must flip sign, not just the first."
      - id: c
        text: "It should move $(2,3)$ metres."
        correct: false
        feedback: "Both components must flip sign, not just the second."
      - id: d
        text: "It should move $(-3,2)$ metres."
        correct: false
        feedback: "Swapping the components changes which number is east and which is north. Only the signs should change."
  - id: vecp-subtract
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A robot's moves are $a=(1,2)$ and $b=(3,-1)$ metres east and north. It makes move $a$ three times, then move $b$ reversed. What is the north component of $3a-b$, in metres?"
    solution: "First $3a=(3,6)$. Subtract the north component of $b$: $6-(-1)=7$, because subtracting a negative number adds its size."
    answer: 7
  - id: vecp-find-scalar
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A robot's standard move is $(2,1)$ metres east and north. One instruction scales it to $(-6,-3)$. What scalar $c$ was used?"
    solution: "Each component was multiplied by the same number: $2c=-6$ and $1c=-3$, so $c=-3$. The negative sign means the move is reversed and three times as long."
    answer: -3
  - id: vec-length-distance-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is the L2 norm of a vector?"
    options:
      - id: a
        text: "The square root of the sum of its squared components."
        correct: true
        feedback: "That is the vector's straight-line length, from Pythagoras' theorem."
      - id: b
        text: "The sum of its components, keeping each one's sign."
        correct: false
        feedback: "Signs can cancel: $(3,-3)$ sums to 0 but still has a length."
      - id: c
        text: "The sum of its components' sizes, ignoring signs."
        correct: false
        feedback: "That is the route along the grid: 7 for $(3,4)$, not the straight-line 5."
      - id: d
        text: "The largest of its components, ignoring the sign."
        correct: false
        feedback: "For $(3,4)$ that gives 4, but the straight-line length is 5."
    solution: "The L2 norm squares each component, adds the squares and takes the square root. It is the vector's straight-line length."
  - id: vecp-distance-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In step 4 of the worked example, why subtract $p$ from $q$ before measuring a length?"
    options:
      - id: a
        text: "$q-p$ is the move from $p$ to $q$, and the distance is the length of that move."
        correct: true
        feedback: "The distance between two points is how long the arrow joining them is."
      - id: b
        text: "Subtracting makes every component positive, which the square root needs."
        correct: false
        category: incorrect_reasoning
        feedback: "Components can be negative; squaring already handles signs. Subtracting finds the joining move."
      - id: c
        text: "The length of $q$ alone is the distance; subtracting $p$ just makes it simpler."
        correct: false
        category: misunderstood_definition
        feedback: "$\\|q\\|_2=\\sqrt{41}$ is the distance from the origin to $q$, not from $p$ to $q$."
      - id: d
        text: "Subtracting moves both points so $p$ is at the origin, which changes the distance."
        correct: false
        category: incorrect_reasoning
        feedback: "Shifting both points by the same move keeps the gap between them, which is why this works."
    solution: "$q-p=(3,4)$ is the arrow from $p$ to $q$. The distance between the points is the length of that arrow, $\\sqrt{3^2+4^2}=5$."
  - id: vecp-norm-meaning
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "What does the L2 norm of a vector measure?"
    options:
      - id: a
        text: "The straight-line length of its arrow"
        correct: true
        feedback: "Square, add, take the square root: that gives the length of the arrow."
      - id: b
        text: "The sum of its signed components"
        correct: false
        feedback: "Signed components can cancel; the L2 norm measures straight-line length."
      - id: c
        text: "The number of components in its list"
        correct: false
        feedback: "The number of components is $n$ in $\\mathbb{R}^n$, not the arrow's length."
      - id: d
        text: "The direction in which its arrow points"
        correct: false
        feedback: "A norm is a length, not a direction; opposite arrows have the same norm."
    solution: "The L2 norm is the straight-line length of the vector's arrow. It is never negative and says nothing about direction."
  - id: vecp-norm
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A robot moves $(3,-4)$ metres east and north. Which calculation gives its straight-line distance from where it started?"
    solution: "The squares are 9 and 16, which add to 25, whose square root is 5. A negative component still gives a positive square."
    options:
      - id: a
        text: "$\\sqrt{3^2+(-4)^2}=5$"
        correct: true
        feedback: "Square both components, add them, then take the square root."
      - id: b
        text: "$3+4=7$"
        correct: false
        feedback: "7 is the route east then south, not the straight line."
      - id: c
        text: "$3^2+(-4)^2=25$"
        correct: false
        feedback: "This is the squared length; take its square root."
  - id: vecp-norm-template
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A robot is $({{=3*k}},{{=-4*k}})$ metres east and north of its dock. What is its straight-line distance to the dock, in metres?"
    solution: "The squares are ${{=9*k*k}}$ and ${{=16*k*k}}$, which add to ${{=25*k*k}}$. Its square root, ${{=5*k}}$, is the straight-line length."
    params:
      k: { min: 1, max: 6 }
    answer_expr: "5*k"
  - id: vecp-why-root
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A robot is 3 metres east and 4 metres north of its dock. Why must it take the square root after adding the squared distances to find how far away the dock is?"
    solution: "Pythagoras' theorem gives the square of the straight-line length. For $(3,4)$ the squares add to 25 square metres, and the square root gives the length, 5 metres."
    options:
      - id: a
        text: "The squares add up to the squared length, so the root is needed to get back to metres."
        correct: true
        feedback: "The squared distances are in square metres; their square root is in metres."
      - id: b
        text: "The root is the step that makes negative components count as positive amounts."
        correct: false
        feedback: "Squaring already makes each contribution positive. The root turns squared length into length."
      - id: c
        text: "The root turns the straight-line distance into the route east and then north."
        correct: false
        feedback: "The route east then north is 7 metres. Square, add and take the root to get the straight line, 5 metres."
  - id: vecp-distance
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A robot is at $(1,1)$ and a parcel is at $(4,5)$, in metres east and north of the charging dock. What is the straight-line distance between them, in metres?"
    solution: "The move from robot to parcel is $(4-1,\\;5-1)=(3,4)$. Its length is $\\sqrt{3^2+4^2}=\\sqrt{25}=5$ metres."
    answer: 5
  - id: vecp-units
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A house app compares houses $(2,5)$ and $(4,1)$, recording number of rooms and kilometres to the town centre. It switches the second component from kilometres to metres and changes nothing else. What happens to its distance comparisons?"
    solution: "In metres, the town-centre gaps become 1,000 times larger, and their squares 1,000,000 times larger. Rescaling measurements to similar ranges stops one choice of units dominating the comparison."
    options:
      - id: a
        text: "Distance to the town centre can now have much more influence on the comparison."
        correct: true
        feedback: "Its gaps become 1,000 times larger before squaring."
      - id: b
        text: "The comparisons stay exactly the same, because the houses themselves have not changed."
        correct: false
        feedback: "The houses are the same, but the numbers that get squared and added are not."
      - id: c
        text: "Number of rooms must now have the greatest influence on the comparison."
        correct: false
        feedback: "The room gaps stay the same while the other component grows."
  - id: vecp-zero-length
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "Two houses have feature vectors $(12,3,10)$ and $(10,4,12)$, in the order area in tens of square metres, bedrooms, age in years. What is the L2 length of their difference vector?"
    solution: "The difference is $(12-10,\\;3-4,\\;10-12)=(2,-1,-2)$. Its L2 length is $\\sqrt{4+1+4}=\\sqrt9=3$."
    answer: 3
  - id: vec-check-combo
    dimension: math
    type: text
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "A robot's movements are $a=(1,2)$ and $b=(3,-1)$ metres east and north. Find $3a-b$ to plan three journeys of $a$ followed by the reverse of $b$. Answer as `(east, north)`."
    accept: ["(0,7)", "(0, 7)", "0,7", "0, 7", "[0,7]", "[0, 7]"]
    hints: ["Compute $3a$ first.", "$3a=(3,6)$. Now subtract each matching entry of $b$."]
    solution: "$3a = (3, 6)$, and $(3, 6) - (3, -1) = (0, 7)$."
  - id: dx-math-1
    dimension: math
    type: numeric
    role: diagnostic
    difficulty: 1
    est_minutes: 1
    prompt: "A flying warehouse robot is 3 metres east, 4 north and 12 above its dock. What is the L2 length of its position vector $x=(3,4,12)$, in metres?"
    answer: 13
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 19,
          category: misunderstood_definition,
          feedback: "Adding the distances gives a route along three directions, not the straight line. Square each distance, add, then take the square root.",
        }
      - { answer: 169, category: math_error, feedback: "You forgot the square root." }
    solution: "$\\sqrt{9 + 16 + 144} = \\sqrt{169} = 13$."
  - id: vec-norm-1
    dimension: math
    type: numeric
    role: core
    difficulty: 1
    est_minutes: 2
    prompt: "A flying robot travels $v=(1,-2,2)$ metres in east, north, upward order. What is its straight-line distance from its start, $\\|v\\|_2$, in metres?"
    answer: 3
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 1,
          category: misunderstood_definition,
          feedback: "You summed the signed components. A norm squares them, so signs never cancel.",
        }
      - {
          answer: 5,
          category: misunderstood_definition,
          feedback: "Adding the absolute distances measures a route along the separate directions. For the straight line, square each entry, add, then take the square root.",
        }
      - { answer: 9, category: math_error, feedback: "You forgot the square root." }
    hints: ["Square each component.", "$1 + 4 + 4 = 9$. One step left."]
    solution: "$\\sqrt{1 + 4 + 4} = \\sqrt{9} = 3$."
  - id: vec-distance
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 2
    prompt: "A robot is at $(1,1)$ and its parcel at $(4,5)$, in metres east and north from the dock. What is their Euclidean distance, in metres?"
    answer: 5
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 7,
          category: misunderstood_definition,
          feedback: "Adding $|3|+|4|$ measures a route east then north, not the direct distance.",
        }
      - { answer: 25, category: math_error, feedback: "You forgot the square root." }
    hints: ["Distance is the norm of the difference vector."]
    solution: "The difference is $(3, 4)$, and $\\sqrt{9 + 16} = 5$."
  - id: vec-scale-dominance
    dimension: conceptual
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "You compare houses by Euclidean distance on two raw features: floor area in m² (range 40–300) and number of bedrooms (range 1–5). What happens?"
    options:
      - {
          id: a,
          text: "Area has much more influence on the distance, so bedroom count can barely affect the comparison.",
          correct: true,
        }
      - {
          id: b,
          text: "Both features must contribute equally because the rule treats each coordinate the same.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Each coordinate is treated the same *numerically*, but a 50 m² gap contributes $50^2 = 2500$ while a 2-bedroom gap contributes $4$.",
        }
      - {
          id: c,
          text: "Bedroom count has more influence because it uses whole numbers.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The sizes of the differences matter, not whether the numbers are whole.",
        }
      - {
          id: d,
          text: "Distance cannot be calculated for features with different units.",
          correct: false,
          category: misunderstood_definition,
          feedback: "The calculation still gives a number, but its meaning depends on the units and ranges chosen.",
        }
    hints: ["Compare the size of a typical difference in each feature, then square both."]
    solution: "An area gap of 50 contributes $50^2=2500$, while a gap of two bedrooms contributes $2^2=4$. Convert each feature to a comparable numerical range before using distance to judge similarity."
  - id: vec-review-l1-l2
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "A model compares houses by the length of a difference vector $x\\in\\mathbb{R}^n$. Which expression gives that L2 length?"
    options:
      - { id: a, text: "$\\sqrt{\\sum_i x_i^2}$", correct: true }
      - {
          id: b,
          text: "$\\sum_i |x_i|$",
          correct: false,
          category: recall_failure,
          feedback: "That adds the absolute entries instead of squaring, adding, and taking a square root.",
        }
      - {
          id: c,
          text: "$\\max_i |x_i|$",
          correct: false,
          category: recall_failure,
          feedback: "That selects only the largest absolute entry. L2 length includes every squared entry.",
        }
      - {
          id: d,
          text: "$\\sum_i x_i$",
          correct: false,
          category: recall_failure,
          feedback: "Adding signed components can let positive and negative entries cancel, so the sum is not a length. A length should reflect the magnitude of all entries without cancellation.",
        }
    solution: "$\\|x\\|_2 = \\sqrt{\\sum_i x_i^2}$."
  - id: vec-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "A house app records area, bedrooms and age as $(120,3,15)$. In 2–4 sentences, explain what this vector represents and why the numerical range of each measurement matters when comparing houses by distance."
    rubric:
      - {
          id: r1,
          criterion: "Each feature becomes one coordinate, so an example is a point (or arrow) in feature space",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Distance sums (squared) differences over coordinates, so features with large numeric ranges dominate",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Explains that features should be rescaled to comparable numerical ranges",
          weight: 1,
        }
    exemplar: "Each measurement is one coordinate in a fixed order, so all three numbers describe the same house. Distance adds squared differences for each coordinate; an area difference of 50 adds 2500, while two bedrooms add only 4. Area can therefore overwhelm the comparison even if bedrooms matter to the buyer. Rescaling the measurements to comparable numerical ranges makes this comparison more useful."
    solution: "Each coordinate records a feature of one house. The units and numerical ranges affect how strongly each feature contributes to distance."
