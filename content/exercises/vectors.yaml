concept: vectors
exercises:
  - id: vecp-add
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Which move combines $a=(1,2)$ and $b=(3,-1)$?"
    solution: "Add horizontal and vertical moves separately: $(1+3,2+(-1))=(4,1)$. The sum ends where the tip-to-tail arrows end."
    options:
      - {
          id: a,
          text: "$(4,1)$",
          correct: true,
          feedback: "Add matching entries: one plus three, then two minus one.",
        }
      - {
          id: b,
          text: "$(4,3)$",
          correct: false,
          feedback: "The second move goes down one, not up one.",
        }
      - {
          id: c,
          text: "$(3,-2)$",
          correct: false,
          feedback: "Multiplying entries does not combine moves.",
        }
  - id: vecp-add-template
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two moves are $({{=a}},{{=b}})$ and $({{=c}},{{=d}})$. What is the second component of their sum?"
    solution: "Add the second entries: ${{=b}}+({{=d}})={{=b+d}}$. The first entries affect only the first component."
    params:
      a: { min: -5, max: 5 }
      b: { min: -5, max: 5 }
      c: { min: -5, max: 5 }
      d: { min: -5, max: 5 }
    answer_expr: "b+d"

  - id: vecp-feature
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A house vector is $(120,3,15)$ in the order (area in square metres, bedrooms, age in years). What does it represent?"
    solution: "Each measurement becomes a coordinate of one point in three-dimensional space. The coordinate meanings come from the stated feature order."
    options:
      - {
          id: a,
          text: "A point with one coordinate per measurement",
          correct: true,
          feedback: "Each entry is one feature, in the stated order.",
        }
      - {
          id: b,
          text: "A floor position 120 right and 3 up",
          correct: false,
          feedback: "These coordinates are house measurements, not two floor distances.",
        }
      - {
          id: c,
          text: "Three houses with one measurement each",
          correct: false,
          feedback: "All three entries describe the same house.",
        }
  - id: vecp-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why must floor moves keep a fixed (right, up) order instead of treating $(2,5)$ and $(5,2)$ as interchangeable?"
    solution: "The first entry always gives the rightward move and the second the upward move. Swapping them changes the destination."
    options:
      - {
          id: a,
          text: "Swapping entries changes the move direction",
          correct: true,
          feedback: "The entries specify different directions.",
        }
      - {
          id: b,
          text: "Swapping entries changes the number of entries",
          correct: false,
          feedback: "Both vectors still have two entries.",
        }
      - {
          id: c,
          text: "Swapping entries makes the move invalid",
          correct: false,
          feedback: "Both are valid moves, but to different points.",
        }
  - id: vecp-new-moves
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A delivery cart moves $(2,-3)$ metres, then $(-1,5)$ metres. What is its combined move?"
    solution: "The horizontal moves total $2+(-1)=1$ and the vertical moves total $-3+5=2$. The combined move is $(1,2)$ metres."
    options:
      - {
          id: a,
          text: "$(1,2)$ metres",
          correct: true,
          feedback: "Add matching entries to get one right and two up.",
        }
      - {
          id: b,
          text: "$(3,2)$ metres",
          correct: false,
          feedback: "The second horizontal move is negative, so subtract one.",
        }
      - {
          id: c,
          text: "$(1,-8)$ metres",
          correct: false,
          feedback: "The second vertical move is positive five, so add it.",
        }
  - id: vecp-entry
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $x=(120,3,15)$, what is $x_2$, the second entry?"
    solution: "The subscript selects an entry by position. The second entry is 3, not the total number of entries or their sum."
    answer: 3

  - id: vecp-why-scale-all
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why does doubling every entry of $(1,2)$ preserve its direction, while doubling only the first does not?"
    solution: "Doubling both entries gives $(2,4)$, keeping twice as much upward as rightward travel. Doubling only the first gives $(2,2)$, with equal upward and rightward travel: a different direction."
    options:
      - {
          id: a,
          text: "Equal scaling preserves the proportions of travel in each direction",
          correct: true,
          feedback: "Both arrows have twice as much upward as rightward travel.",
        }
      - {
          id: b,
          text: "Changing any entry by the same amount preserves direction",
          correct: false,
          feedback: "Adding two gives $(3,4)$, which no longer has twice as much upward as rightward travel. Equal multiplication, not equal addition, preserves direction.",
        }
      - {
          id: c,
          text: "Direction depends only on the signs, so either change preserves it",
          correct: false,
          feedback: "Signs only tell you the general region. $(1,2)$ and $(2,2)$ both point right and up, but at different angles.",
        }
  - id: vecp-scale-template
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $x=({{=a}},{{=b}})$ and scalar $c={{=c}}$, what is the first entry of $cx$?"
    solution: "Multiply the first entry by the scalar: ${{=c}}\\cdot({{=a}})={{=c*a}}$. Scaling applies this same multiplication to every entry."
    params:
      a: { min: -5, max: 5 }
      b: { min: -5, max: 5 }
      c: { min: -3, max: 3 }
    answer_expr: "c*a"

  - id: vecp-negative
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A move is $(2,-3)$ metres. What does multiplying it by $-1$ do?"
    solution: "Multiplying every entry by $-1$ gives $(-2,3)$. It has the same length and the opposite direction."
    options:
      - {
          id: a,
          text: "Gives $(-2,3)$, reversing the move",
          correct: true,
          feedback: "Both signs reverse, so the arrow points back.",
        }
      - {
          id: b,
          text: "Gives $(-2,-3)$, reversing the move",
          correct: false,
          feedback: "You must reverse both components, not just the first.",
        }
      - {
          id: c,
          text: "Gives $(2,3)$, reversing the move",
          correct: false,
          feedback: "You must reverse both components, not just the second.",
        }
  - id: vecp-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "What happens when you multiply $(3,4)$ by zero?"
    solution: "Both entries become zero, so there is no movement. The zero vector has no direction."
    options:
      - {
          id: a,
          text: "You get $(0,0)$, with no direction",
          correct: true,
          feedback: "Every entry becomes zero.",
        }
      - {
          id: b,
          text: "You get $(3,4)$, with its direction",
          correct: false,
          feedback: "Multiplying by one preserves a vector; zero does not.",
        }
      - {
          id: c,
          text: "You get $(0,4)$, with upward direction",
          correct: false,
          feedback: "Zero multiplies both entries, not just the first.",
        }
  - id: vecp-subtract
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "For $a=(1,2)$ and $b=(3,-1)$, what is the second entry of $3a-b$?"
    solution: "First $3a=(3,6)$. Subtracting the second entry of $b$ gives $6-(-1)=7$, because subtracting a negative adds its positive value."
    answer: 7

  - id: vecp-half
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A cart move is $(6,2)$ metres. Which move goes half as far in the same direction?"
    solution: "Multiply both entries by $1/2$: $(6/2,2/2)=(3,1)$. A positive scalar preserves the direction."
    options:
      - {
          id: a,
          text: "$(3,1)$ metres",
          correct: true,
          feedback: "Multiply every entry by one half.",
        }
      - {
          id: b,
          text: "$(3,2)$ metres",
          correct: false,
          feedback: "Halving only one entry turns the arrow.",
        }
      - {
          id: c,
          text: "$(-3,-1)$ metres",
          correct: false,
          feedback: "This halves the length but reverses the direction.",
        }
  - id: vecp-norm
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Which calculation gives the L2 length of $(3,-4)$?"
    solution: "The squared entries are 9 and 16, so their sum is 25 and its square root is 5. Negative entries still contribute positive squares."
    options:
      - {
          id: a,
          text: "$\\sqrt{3^2+(-4)^2}=5$",
          correct: true,
          feedback: "Square both entries, add them, then take the square root.",
        }
      - {
          id: b,
          text: "$3+4=7$",
          correct: false,
          feedback: "Adding component lengths measures a right-then-down route, not the straight arrow.",
        }
      - {
          id: c,
          text: "$3^2+(-4)^2=25$",
          correct: false,
          feedback: "This is the squared length; take its square root.",
        }
  - id: vecp-norm-template
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "A move is $(3\\cdot{{=k}},-4\\cdot{{=k}})$ metres. What is its L2 length in metres?"
    solution: "The entries are ${{=3*k}}$ and ${{=-4*k}}$, whose squares add to ${{=9*k*k}}+{{=16*k*k}}={{=25*k*k}}$. The square root is ${{=5*k}}$, the straight-line length."
    params:
      k: { min: 1, max: 6 }
    answer_expr: "5*k"

  - id: vecp-distance
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Two floor positions are $(1,1)$ and $(4,5)$ metres. What is their straight-line distance in metres?"
    solution: "Subtract coordinates to get $(4-1,5-1)=(3,4)$. Its length is $\\sqrt{3^2+4^2}=\\sqrt{25}=5$ metres."
    answer: 5

  - id: vecp-why-root
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "Why take the square root after adding squared steps when measuring a floor move's straight-line length?"
    solution: "Pythagoras gives the squared diagonal length. The root recovers the diagonal itself: for $(3,4)$ metres, the squared steps sum to 25 square metres, but the length is 5 metres."
    options:
      - {
          id: a,
          text: "Pythagoras gives squared length; the root restores length in metres",
          correct: true,
          feedback: "The squared steps give square metres, and their square root gives metres.",
        }
      - {
          id: b,
          text: "The root makes negative components contribute positively",
          correct: false,
          feedback: "Squaring already makes each contribution nonnegative. The root recovers length from squared length.",
        }
      - {
          id: c,
          text: "The root converts the shortcut into the right-then-up route",
          correct: false,
          feedback: "The right-then-up route adds absolute steps: 7 metres for $(3,4)$. The square-add-root rule gives the straight shortcut of 5 metres.",
        }
  - id: vecp-units
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "House vectors use (rooms, kilometres to centre). You change kilometres to metres without rescaling. What happens to distance comparisons?"
    solution: "Converting kilometres to metres multiplies those coordinate gaps by 1,000 and their squared contributions by 1,000,000. Rescaling features to comparable ranges avoids one unit choice dominating similarity."
    options:
      - {
          id: a,
          text: "The centre-distance feature can dominate more",
          correct: true,
          feedback: "Its differences become 1,000 times larger before squaring.",
        }
      - {
          id: b,
          text: "The comparisons stay unchanged by the units",
          correct: false,
          feedback: "The physical houses stay the same, but the numerical gaps change.",
        }
      - {
          id: c,
          text: "The room-count feature must now dominate",
          correct: false,
          feedback: "The room gaps stay unchanged while the other feature grows.",
        }
  - id: vecp-zero-length
    dimension: math
    type: numeric
    tolerance: { abs: 0.000001 }
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "What is the L2 norm of $(0,0,0)$?"
    solution: "All squared entries are zero, so their sum is zero. Taking the square root still gives zero."
    answer: 0
  - id: vec-check-combo
    dimension: math
    type: text
    role: check
    difficulty: 1
    est_minutes: 2
    prompt: "With $a = (1, 2)$ and $b = (3, -1)$, compute $3a - b$. Answer as `(x, y)`."
    accept: ["(0,7)", "(0, 7)", "0,7", "0, 7", "[0,7]", "[0, 7]"]
    hints: ["Compute $3a$ first.", "$3a = (3, 6)$. Now subtract $b$ componentwise."]
    solution: "$3a = (3, 6)$, and $(3, 6) - (3, -1) = (0, 7)$."
  - id: dx-math-1
    dimension: math
    type: numeric
    role: diagnostic
    difficulty: 1
    est_minutes: 1
    prompt: "What is the L2 norm $\\|x\\|_2$ of $x = (3, 4, 12)$?"
    answer: 13
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 19,
          category: misunderstood_definition,
          feedback: "That is the L1 norm (sum of absolute values). The L2 norm is the square root of the sum of squares.",
        }
      - { answer: 169, category: math_error, feedback: "You forgot the square root." }
    solution: "$\\sqrt{9 + 16 + 144} = \\sqrt{169} = 13$."
  - id: vec-norm-1
    dimension: math
    type: numeric
    role: core
    difficulty: 1
    est_minutes: 2
    prompt: "Compute $\\|v\\|_2$ for $v = (1, -2, 2)$."
    answer: 3
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 1,
          category: misunderstood_definition,
          feedback: "You summed the signed components. A norm squares them, so signs never cancel.",
        }
      - {
          answer: 5,
          category: misunderstood_definition,
          feedback: "That is the L1 norm $\\sum|v_i|$. The L2 norm is $\\sqrt{\\sum v_i^2}$.",
        }
      - { answer: 9, category: math_error, feedback: "You forgot the square root." }
    hints: ["Square each component.", "$1 + 4 + 4 = 9$. One step left."]
    solution: "$\\sqrt{1 + 4 + 4} = \\sqrt{9} = 3$."
  - id: vec-distance
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 2
    prompt: "What is the Euclidean distance between the points $(1, 1)$ and $(4, 5)$?"
    answer: 5
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 7,
          category: misunderstood_definition,
          feedback: "That is the L1 (Manhattan) distance $|3| + |4|$.",
        }
      - { answer: 25, category: math_error, feedback: "You forgot the square root." }
    hints: ["Distance is the norm of the difference vector."]
    solution: "The difference is $(3, 4)$, and $\\sqrt{9 + 16} = 5$."
  - id: vec-scale-dominance
    dimension: conceptual
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "You compare houses by Euclidean distance on two raw features: floor area in m² (range 40–300) and number of bedrooms (range 1–5). What happens?"
    options:
      - {
          id: a,
          text: "Area dominates the distance, so bedrooms barely affect which houses count as similar",
          correct: true,
        }
      - {
          id: b,
          text: "Both features contribute equally because distance treats each coordinate the same",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Each coordinate is treated the same *numerically*, but a 50 m² gap contributes $50^2 = 2500$ while a 2-bedroom gap contributes $4$.",
        }
      - {
          id: c,
          text: "Bedrooms dominate because they are integers",
          correct: false,
          category: incorrect_reasoning,
        }
      - {
          id: d,
          text: "Distance is undefined for features with different units",
          correct: false,
          category: misunderstood_definition,
          feedback: "It is defined, which is exactly the trap: it silently mixes units.",
        }
    hints: ["Compare the size of a typical difference in each feature, then square both."]
    solution: "Squared differences in area are thousands of times larger than in bedrooms. Standardise each feature (subtract the mean, divide by the standard deviation) so they are comparable."
  - id: vec-review-l1-l2
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "Which expression is the L2 norm of $x \\in \\mathbb{R}^n$?"
    options:
      - { id: a, text: "$\\sqrt{\\sum_i x_i^2}$", correct: true }
      - {
          id: b,
          text: "$\\sum_i |x_i|$",
          correct: false,
          category: recall_failure,
          feedback: "That is the L1 norm.",
        }
      - {
          id: c,
          text: "$\\max_i |x_i|$",
          correct: false,
          category: recall_failure,
          feedback: "That is the L∞ (max) norm.",
        }
      - { id: d, text: "$\\sum_i x_i$", correct: false, category: recall_failure }
    solution: "$\\|x\\|_2 = \\sqrt{\\sum_i x_i^2}$."
  - id: vec-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "In 2–4 sentences: what does it mean to represent a data example as a vector, and why does the scale of each feature matter when you compare examples by distance?"
    rubric:
      - {
          id: r1,
          criterion: "Each feature becomes one coordinate, so an example is a point (or arrow) in feature space",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Distance sums (squared) differences over coordinates, so features with large numeric ranges dominate",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Mentions standardising or normalising features as the remedy",
          weight: 1,
        }
    exemplar: "Each feature is one coordinate, so an example becomes a point in an n-dimensional space and similar examples are nearby points. Euclidean distance adds up squared differences per coordinate, so a feature measured in large units (say area in m²) swamps one in small units (bedrooms). Standardising each feature to zero mean and unit variance puts them on comparable scales."
    solution: "The key ideas are coordinates = features, and distance is sensitive to units/scale."
