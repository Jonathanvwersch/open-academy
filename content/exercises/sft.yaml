concept: sft
exercises:
  - id: lab-post-training-mask-dilution
    dimension: implementation
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: An SFT implementation sets prompt-target losses to zero, then takes the mean over every target position. More prompt tokens are added while the response tokens and their predicted probabilities stay fixed. What happens to the reported loss?
    options:
      - id: a
        text: It falls because the denominator grows.
        correct: true
      - id: b
        text: It stays fixed because the response is unchanged.
        correct: false
        feedback: That would hold if the mean used only the response targets. This code also counts prompt positions in its denominator.
      - id: c
        text: It rises because each prompt adds a positive loss.
        correct: false
        feedback: The code sets those prompt losses to zero, so they increase only the denominator.
    solution: The response losses have the same sum, but the mean divides by more positions. Divide by the number of selected response targets to keep the intended objective.
  - id: sft-pairs-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does supervised fine-tuning do to a pretrained language model?
    options:
      - id: a
        text: It changes weights using prompts paired with desired responses.
        correct: true
        feedback: The desired responses supply the targets for further training from pretrained weights.
      - id: b
        text: It adds role labels while leaving all model weights unchanged.
        correct: false
        feedback: Role labels format messages, but fine-tuning also trains the model's weights.
      - id: c
        text: It trains a new model from random weights on demonstration pairs.
        correct: false
        feedback: SFT starts from pretrained weights. Training from random weights would discard the pretrained model.
    solution: SFT continues training from pretrained weights on prompt–response demonstrations. The supplied answers show the behaviour training should encourage.
  - id: sft-pair-self-explain
    dimension: conceptual
    type: mc
    role: practice
    lesson_only: true
    difficulty: 1
    est_minutes: 1
    prompt: Why is the worked example's new input complete immediately after `<assistant>`, with `the mat<end>` left for the model to generate?
    options:
      - id: a
        text: The model must generate the answer after seeing the request.
        correct: true
      - id: b
        text: The assistant marker supplies the answer through a lookup table.
        correct: false
        feedback: The marker identifies where the response starts. The learned model must predict the response tokens.
      - id: c
        text: The desired response is supplied separately as hidden input at inference.
        correct: false
        feedback: The desired response supplies training targets. At inference the model receives the request and generates its answer.
    solution: The complete pair is available during training, but a later request supplies only the prompt and answer boundary. The model has to produce the response itself.
  - id: sft-role-boundary
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A toy chat template formats a pair as `<user>Continue: the cat sat on the<assistant>mat<end>`. Which text is the desired response, excluding its ending marker?"
    options:
      - id: a
        text: "The text `Continue: the cat sat on the`."
        correct: false
        feedback: That is the request, between the user marker and the assistant marker.
      - id: b
        text: The text `mat` after the assistant marker.
        correct: true
      - id: c
        text: The entire sequence of role markers and words.
        correct: false
        feedback: The formatted sequence contains both the prompt and the response; the role boundary distinguishes them.
    solution: The assistant marker begins the desired response, so the response text is “mat”. The ending marker marks when that response should stop.
  - id: sft-format-versus-training
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: An engineer converts a dataset to a model's expected chat template but never runs training. Which statement describes the result?
    options:
      - id: a
        text: The dataset is formatted, but the model's weights have not learned from it.
        correct: true
      - id: b
        text: The model's weights have learned the answers because roles are now marked.
        correct: false
        feedback: Arranging stored text does not update model weights; training must use those demonstrations.
      - id: c
        text: The model has learned the response format but still needs training on answer content.
        correct: false
        feedback: Formatting stored examples teaches neither format nor content until training uses them to update weights.
    solution: A chat template arranges the text so the model can distinguish message roles. Weight changes require training on the formatted examples.
  - id: sft-behaviour-change
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A model can continue documents but often continues a question with another question. You want direct answers instead. Why can prompt–response demonstrations help?
    options:
      - id: a
        text: They train the model to make direct answers more likely after requests.
        correct: true
      - id: b
        text: They replace next-token prediction with selecting the nearest stored answer.
        correct: false
        feedback: SFT updates next-token probabilities. It does not turn the model into a nearest-example lookup system.
      - id: c
        text: They teach the request format while only prompt tokens contribute training loss.
        correct: false
        feedback: Desired response tokens must supply training targets to encourage the demonstrated answers.
    solution: The demonstrations specify the behaviour desired after a request. The model produces its answers through next-token prediction.
  - id: sft-bad-demonstration
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "An SFT dataset repeatedly pairs “Which animal is in: the cat sat on the mat?” with “dog”. Training loss falls. What should you conclude?"
    options:
      - id: a
        text: The model may be learning the wrong answer; fix the demonstrations and test unseen prompts.
        correct: true
      - id: b
        text: The lower loss shows that pretraining has overridden the incorrect targets.
        correct: false
        feedback: Lower training loss means closer agreement with the supplied targets, including the incorrect answers.
      - id: c
        text: More training on these pairs will teach the model to correct their labels.
        correct: false
        feedback: These targets reward predicting “dog”. More training does not supply evidence that the label should be “cat”.
    solution: A falling training loss shows closer agreement with the demonstrated answers, including incorrect ones. Check the targets and evaluate behaviour on prompts excluded from training.
  - id: sft-new-task
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A team wants a pretrained model to answer maintenance requests with short numbered instructions. Which SFT dataset most directly teaches that behaviour?
    options:
      - id: a
        text: Maintenance requests paired with reviewed, task-specific numbered procedures.
        correct: true
      - id: b
        text: Maintenance requests paired with copied manual chapters covering each machine.
        correct: false
        feedback: Manuals supply useful text, but do not directly demonstrate the requested input–output behaviour.
      - id: c
        text: Numbered maintenance procedures paired with requests to summarise each procedure.
        correct: false
        feedback: Those pairs teach summarisation. The desired deployment behaviour needs requests paired with procedures as responses.
    solution: Prompt–response pairs should demonstrate both the requested task and the desired answer format. Checked numbered answers teach that combination directly.
  - id: sft-mask-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does response-only loss masking do during supervised fine-tuning?
    options:
      - id: a
        text: It scores response targets while keeping the prompt available as context.
        correct: true
        feedback: Response targets contribute loss, while prompt tokens still help predict those responses.
      - id: b
        text: It removes the prompt so response predictions cannot depend on it.
        correct: false
        feedback: The prompt remains in the input; only its own target losses are excluded from the objective.
      - id: c
        text: It scores prompt targets while excluding every desired response target.
        correct: false
        feedback: That reverses the selection; response-only training scores the desired response targets.
    solution: The mask chooses which target-token losses enter the training objective. Excluded prompt targets can still supply context for predicting the response.
  - id: sft-mask-self-explain
    dimension: conceptual
    type: mc
    role: practice
    lesson_only: true
    difficulty: 1
    est_minutes: 2
    prompt: Why does the worked example divide the losses for “sat” and “on” by two, although “the cat sat on” has four tokens?
    options:
      - id: a
        text: Only the two response targets are selected for this mean loss.
        correct: true
      - id: b
        text: Every next-token loss must be divided by two, whatever the response length.
        correct: false
        feedback: The divisor is the number of selected response targets, which can vary between examples.
      - id: c
        text: The prompt has been deleted, so the model sees only two words.
        correct: false
        feedback: The model still uses the prompt to predict the response; excluding its losses does not delete its tokens.
    solution: The four-token sequence has three next-token predictions, and two of their targets belong to the response. The response-only mean divides the two selected losses by two; dividing their sum by all three predictions would also count the excluded prompt prediction in the divisor.
  - id: sft-first-response
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: In the four-token sequence “the cat sat on”, “the cat” is the prompt and “sat on” is the response. With one mask entry under each token in this order, which mask selects only the response prediction losses?
    options:
      - id: a
        text: The mask is `(0, 0, 1, 1)`.
        correct: true
      - id: b
        text: The mask is `(0, 0, 0, 1)`.
        correct: false
        feedback: That drops the first response target “sat”; it counts even though the preceding prompt position predicts it.
      - id: c
        text: The mask is `(0, 1, 1, 0)`.
        correct: false
        feedback: That mask selects “cat” and “sat”. The response targets are “sat” and “on”.
    solution: Positions three and four contain the response tokens, so their mask entries are one. The prompt entries are zero, including the first token, which has no prediction loss here.
  - id: sft-mask-mean-template
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A training sequence has {{=n}} prompt targets, each with cross-entropy loss 1.2, followed by two response targets with losses {{=a/10}} and {{=(a+2)/10}}. What is the response-only mean loss?"
    params:
      n: { min: 2, max: 4, step: 1 }
      a: { min: 2, max: 9, step: 1 }
    answer_expr: (a + 1) / 10
    tolerance: { abs: 0.001 }
    common_wrong:
      - answer_expr: (2*a + 2) / 10
        category: math_error
        feedback: That sums the response losses. Divide by the two response targets to get their mean.
      - answer_expr: (1.2*n + (2*a+2)/10) / (n+2)
        category: misunderstood_definition
        feedback: That includes prompt losses. Select only response-target losses before taking the mean.
    solution: "Select the two response losses and average them: $({{=a/10}}+{{=(a+2)/10}})/2={{=(a+1)/10}}$. The prompt targets supply context but contribute no loss to this mean."
  - id: sft-mask-code
    dimension: implementation
    type: code_complete
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The nonempty list `losses` contains only selected response-target losses. Complete the denominator to compute the response-only mean loss. Enter only the missing Python function name."
    code: |
      loss = sum(losses) / ____(losses)
    accept:
      - len
    solution: "`len(losses)` counts the selected targets. Dividing their summed loss by that count gives a response-only mean."
  - id: sft-shifted-targets
    dimension: implementation
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A toy sequence has prompt “the cat” and response “sat on”. The predictions made after tokens at positions 1, 2 and 3 target “cat”, “sat” and “on”, respectively. Which predictions should enter response-only loss?"
    options:
      - id: a
        text: Positions 2 and 3, whose targets are the response tokens.
        correct: true
      - id: b
        text: Position 3 alone, because its input position is in the response.
        correct: false
        feedback: The prediction made after position 2 targets “sat”, the first response token, so its loss also counts.
      - id: c
        text: Positions 1 and 2, because both input positions are in the prompt.
        correct: false
        feedback: Position 1 targets prompt token “cat”, while position 3 targets response token “on”; the target determines inclusion.
    solution: The predictions made after positions 2 and 3 target “sat” and “on”, so both count. When pairing next-token predictions with their targets, select losses according to the tokens being predicted.
  - id: sft-empty-mask
    dimension: implementation
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A data-processing bug produces a training sequence with every target-mask entry zero. What should a response-only mean-loss calculation do?
    options:
      - id: a
        text: Reject the example because there are no selected targets to average.
        correct: true
      - id: b
        text: Return zero because the model has answered every selected target correctly.
        correct: false
        feedback: No targets were selected, so there is no evidence of a correct answer; the mean would divide by zero.
      - id: c
        text: Score all prompt tokens instead so the mean always has a denominator.
        correct: false
        feedback: That silently changes the objective and conceals the data bug instead of fixing the missing response targets.
    solution: An empty selection has denominator zero, so the mean is undefined. Reject the example and fix the processing or data that removed its response targets.
  - id: sft-context-still-learns
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A model answers robot-maintenance requests using response-only loss. An engineer says this freezes every weight involved in processing the prompt. Is that correct?
    options:
      - id: a
        text: No; response predictions use the prompt, so their losses can change those weights.
        correct: true
      - id: b
        text: Yes; a zero prompt-target mask prevents any weight from processing that prompt.
        correct: false
        feedback: The mask excludes losses at prompt targets; it does not prevent the model from processing the prompt.
      - id: c
        text: Yes; response-only loss trains only the role markers and ignores response words.
        correct: false
        feedback: Response words are the targets being scored, and their predictions depend on weights processing the earlier context.
    solution: Response probabilities depend on weights used to process the prompt, so reducing response loss can update those weights. The mask selects which prediction losses contribute to that update.
  - id: sft-explain-training
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt: "A pretrained model receives chat-formatted prompt-response demonstrations. Explain which tokens count as response-only loss targets, how their loss is averaged, and why the prompt tokens still matter."
    rubric:
      - id: sft-target-mask
        criterion:
          Select response-token targets from the first response token, predicted by the last prompt position,
          through the response ending marker.
        weight: 1
        required: true
      - id: mean
        criterion:
          Average the selected targets' negative log probabilities by dividing their sum by the selected-target
          count.
        weight: 1
        required: true
      - id: sft-prompt-context
        criterion: Keep prompt tokens as context that helps predict the response.
        weight: 1
        required: true
      - id: empty
        criterion: Reject examples with no selected targets to avoid dividing by zero.
        weight: 0.25
        required: false
    exemplar: "Select response targets, including the first response token predicted by the last prompt position and the response ending marker. Divide the sum of their negative log probabilities by the selected-target count. Prompt tokens remain context for predicting the response. Reject examples with no selected targets before taking the mean."
    solution: "Select response targets, including the first response token predicted by the last prompt position and the response ending marker. Divide the sum of their negative log probabilities by the selected-target count. Prompt tokens remain context for predicting the response. Reject examples with no selected targets before taking the mean."
