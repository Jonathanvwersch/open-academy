concept: forward-kinematics
exercises:
  - id: dx-rb-3
    dimension: math
    type: text
    role: diagnostic
    difficulty: 3
    est_minutes: 4
    prompt: "A planar two-link arm has link lengths $l_1 = 2$, $l_2 = 1$. Joint 1 is at the origin with angle $\\theta_1 = 90^\\circ$ from the x-axis; joint 2 has angle $\\theta_2 = -90^\\circ$ **relative to link 1**. Where is the end effector? Answer as `(x, y)`."
    accept: ["(1,2)", "(1, 2)", "1,2", "1, 2", "[1,2]", "[1, 2]"]
    hints: ["The second link's absolute angle is $\\theta_1 + \\theta_2$."]
    solution: "$x = l_1\\cos\\theta_1 + l_2\\cos(\\theta_1+\\theta_2) = 0 + 1 = 1$; $y = l_1\\sin\\theta_1 + l_2\\sin(\\theta_1+\\theta_2) = 2 + 0 = 2$. A common mistake is to treat $\\theta_2$ as an absolute angle, which gives $(0, 1)$."
