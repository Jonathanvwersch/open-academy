concept: mlp-forward-pass
exercises:
  - id: mlp-layer-of-neurons-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does a layer of neurons do?"
    options:
      - {
          id: a,
          text: "It applies one shared weight to every input, giving all neurons the same score.",
          correct: false,
          feedback: "Neurons have their own weights and biases.",
        }
      - {
          id: b,
          text: "It forms a weighted score for each neuron, then applies that neuron's activation.",
          correct: true,
          feedback: "Each neuron has its own weighted score, which its activation transforms before the next layer.",
        }
      - {
          id: c,
          text: "It compares predictions with targets to measure the model's prediction error.",
          correct: false,
          feedback: "That is the role of a loss function.",
        }
      - {
          id: d,
          text: "It updates each weight by subtracting the loss gradient after a training step.",
          correct: false,
          feedback: "That is a gradient-descent update.",
        }
    solution: "A layer computes weighted scores for several neurons and applies an activation function to each."
  - id: mlp-two-layers-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is a forward pass through a neural network?"
    options:
      - {
          id: a,
          text: "Calculating a prediction by passing values through each layer in order.",
          correct: true,
          feedback: "Each layer consumes preceding values and produces the next values toward the prediction.",
        }
      - {
          id: b,
          text: "Propagating loss derivatives backward through the network to calculate each weight's gradient.",
          correct: false,
          feedback: "That is backpropagation.",
        }
      - {
          id: c,
          text: "Updating each layer's weights repeatedly until the final test loss reaches zero.",
          correct: false,
          feedback: "A forward pass calculates values and does not update weights.",
        }
      - {
          id: d,
          text: "Adding every layer's output together to make a single final prediction.",
          correct: false,
          feedback: "Layers pass transformed values onward rather than all adding their outputs.",
        }
    solution: "A forward pass calculates a prediction by passing values through the network's layers in order."
  - id: mlp-shapes-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "A batch of examples, one per row, goes through a layer. What does one row of the layer's output hold?"
    options:
      - {
          id: a,
          text: "That example's outputs from the layer: one value for each neuron.",
          correct: true,
          feedback: "Each example keeps its own row, and each neuron adds one column.",
        }
      - {
          id: b,
          text: "One neuron's outputs: one value for each example in the batch.",
          correct: false,
          feedback: "That describes a column. A row belongs to one example.",
        }
      - {
          id: c,
          text: "One neuron's weights: one value for each input the layer reads.",
          correct: false,
          feedback: "Weights are parameters stored in $W$, not outputs computed for an example.",
        }
      - {
          id: d,
          text: "The average of every example's outputs, one value per neuron.",
          correct: false,
          feedback: "A layer never averages examples together; each example gets its own row.",
        }
    solution: "In batch form each example is a row, so a row of the output holds that example's value from each neuron in the layer."
  - id: mlp-check-forward
    dimension: math
    type: numeric
    role: check
    difficulty: 2
    est_minutes: 3
    prompt: "A two-layer network has ($W_1 = \\begin{pmatrix}1&0\\\\-1&1\\end{pmatrix}$, $b_1 = (0,-2)$, ReLU, $W_2 = (2, 3)$, $b_2 = 1$), compute $\\hat y$ for $x = (1, 4)$."
    answer: 6
    tolerance: { abs: 0.001 }
    hints: ["$W_1 x + b_1 = (1, 3) + (0, -2)$."]
    solution: "$W_1x = (1, 3)$, plus $b_1$ gives $(1, 1)$, ReLU keeps $(1, 1)$, so $\\hat y = 2\\cdot1 + 3\\cdot1 + 1 = 6$."
  - id: dx-dl-3
    dimension: math
    type: numeric
    role: diagnostic
    difficulty: 2
    est_minutes: 2
    prompt: "How many learnable parameters does `Linear(100, 32) → ReLU → Linear(32, 10)` have (weights and biases)?"
    answer: 3562
    tolerance: { abs: 0.5 }
    common_wrong:
      - {
          answer: 3520,
          category: incomplete_explanation,
          feedback: "You counted weights only. Each layer also has one bias per output unit.",
        }
    solution: "$100\\cdot32 + 32 + 32\\cdot10 + 10 = 3200 + 32 + 320 + 10 = 3562$."
  - id: mlp-shapes
    dimension: implementation
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "Each example is an image with 3 color channels and 32 by 32 pixels. If each image is flattened into one long list of numbers before a layer receives it, how many numbers are in the list for one image?"
    options:
      - { id: a, text: "3072", correct: true }
      - {
          id: b,
          text: "1024",
          correct: false,
          category: math_error,
          feedback: "That ignores the 3 colour channels.",
        }
      - {
          id: c,
          text: "16",
          correct: false,
          category: misunderstood_definition,
          feedback: "16 is not a count of the pixels. Multiply the channels by both image sizes: $3\\cdot32\\cdot32$.",
        }
      - {
          id: d,
          text: "96",
          correct: false,
          category: math_error,
          feedback: "96 counts 3 channels times the 32-pixel width, but leaves out the other spatial dimension. Include every pixel in each channel.",
        }
    solution: "$3\\cdot32\\cdot32 = 3072$ features per example."
  - id: mlp-params
    dimension: math
    type: numeric
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "A layer takes 512 inputs and produces 2,048 outputs, with one bias per output. How many adjustable weights and biases does it have?"
    answer: 1050624
    tolerance: { abs: 0.5 }
    common_wrong:
      - { answer: 1048576, category: incomplete_explanation, feedback: "Add the 2048 biases." }
    solution: "$512\\cdot2048 + 2048 = 1{,}050{,}624$."
  - id: mlp-code-read
    dimension: implementation
    type: code_read
    role: review
    difficulty: 2
    est_minutes: 3
    prompt: "What does this print?"
    code: |
      import numpy as np
      X = np.array([[1., -1.], [2., 0.]])
      W1 = np.array([[1., 2.], [0., 1.]])   # shape (in, out)
      h = np.maximum(0, X @ W1)
      print(h.sum())
    answer: 8
    tolerance: { abs: 0.001 }
    hints: ["Compute `X @ W1` one row at a time: row $i$ of `X` dotted with each column of `W1`."]
    solution: "Row 1: $(1\\cdot1 + (-1)\\cdot0,\\ 1\\cdot2 + (-1)\\cdot1) = (1, 1)$. Row 2: $(2, 4)$. ReLU keeps all of them, so the sum is $1 + 1 + 2 + 4 = 8$."
  - id: mlp-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "Using the lesson's 2 → 2 → 1 network or one of your own, explain in 2–4 sentences what a two-layer multilayer perceptron computes from an input $x$, and how the array shapes change when you feed it a batch of $B$ examples."
    rubric:
      - {
          id: r1,
          criterion: "Describes the forward pass in order: first-layer scores W₁x + b₁, an activation applied to each score to give hidden values h, then the output W₂h + b₂",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "States that a batch X of shape B × d_in passes through a layer with d_out neurons to give B × d_out, keeping one row per example",
          weight: 2,
          required: true,
        }
      - {
          id: r3,
          criterion: "Mentions that each row of a weight matrix is one neuron, or that a layer has d_in · d_out + d_out parameters, or that the activation stops the layers collapsing into one",
          weight: 1,
        }
    exemplar: "The first layer multiplies the input by W₁, where each row is one neuron's weights, and adds the bias b₁ to get one score per hidden neuron. An activation such as ReLU is applied to each score to give the hidden values h, and the output layer computes ŷ = W₂h + b₂. For a batch, X has one example per row, shape B × d_in; each layer turns it into B × d_out, so the hidden array is B × (number of hidden neurons) and the output is B × (number of outputs). Each layer has d_in · d_out weights plus d_out biases, whatever the batch size."
  - id: mlpp-layer-values
    dimension: math
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A layer has $W = \\begin{pmatrix}2 & 1\\\\ 0 & -1\\end{pmatrix}$, $b = (-1, 1)$ and ReLU. What are its hidden values $h$ for $x = (1, 3)$?"
    options:
      - { id: a, text: "$(4, 0)$", correct: true }
      - {
          id: b,
          text: "$(4, -2)$",
          correct: false,
          category: incomplete_explanation,
          feedback: "Those are the scores $Wx + b$. ReLU then sets the negative score to 0.",
        }
      - {
          id: c,
          text: "$(5, 0)$",
          correct: false,
          category: math_error,
          feedback: "You left out the bias. $Wx = (5, -3)$, and adding $b = (-1, 1)$ gives $(4, -2)$ before ReLU.",
        }
      - {
          id: d,
          text: "$(1, 0)$",
          correct: false,
          category: misunderstood_definition,
          feedback: "You dotted the columns with $x$. Each neuron is a row: row 1 is $(2, 1)$, so its score is $2 \\cdot 1 + 1 \\cdot 3 - 1 = 4$.",
        }
    solution: "Row 1: $2 \\cdot 1 + 1 \\cdot 3 - 1 = 4$. Row 2: $0 \\cdot 1 + (-1) \\cdot 3 + 1 = -2$. ReLU turns $(4, -2)$ into $h = (4, 0)$."
  - id: mlpp-unit-score-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      A layer has
      $$W = \begin{pmatrix}{{=a}} & {{=c}}\\ {{=w1}} & {{=w2}}\end{pmatrix}, \quad b = ({{=q}}, {{=p}})$$
      and reads the input $x = ({{=x1}}, {{=x2}})$.

      What is the score of neuron 2, before the activation?
    hints:
      - "Neuron 2 uses row 2 of $W$ and the second entry of $b$."
    solution: |
      Row 2 is $({{=w1}}, {{=w2}})$, so the score is ${{=w1}} \cdot {{=x1}} + ({{=w2}}) \cdot {{=x2}} + ({{=p}}) = {{=w1*x1 + w2*x2 + p}}$.
    answer_expr: "w1 * x1 + w2 * x2 + p"
    params:
      a: { min: 1, max: 3 }
      c: { min: -2, max: 2 }
      w1: { min: -2, max: 2 }
      w2: { min: 1, max: 3 }
      q: { min: -2, max: 2 }
      p: { min: -3, max: 3 }
      x1: { min: 1, max: 3 }
      x2: { min: 1, max: 3 }
    constraints: ["p != 0", "w1 != 0", "a * x1 + c * x2 + q != w1 * x1 + w2 * x2 + p"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "w1 * x1 + w2 * x2",
          category: incomplete_explanation,
          feedback: "That's the weighted sum without the bias. Add neuron 2's bias, the second entry of $b$.",
        }
      - {
          answer_expr: "a * x1 + c * x2 + q",
          category: misunderstood_definition,
          feedback: "That's neuron 1's score. Neuron 2 uses row 2 of $W$.",
        }
  - id: mlpp-layer-why-zero
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, why is neuron 2's output $0$ rather than $-1$?"
    options:
      - {
          id: a,
          text: "Its score is $-1$, and ReLU turns every negative score into $0$.",
          correct: true,
          feedback: "ReLU returns $\\max(0,z)$, so $\\max(0,-1)=0$.",
        }
      - {
          id: b,
          text: "Its bias is $0$, so neuron 2 outputs $0$ whatever the input is.",
          correct: false,
          category: misunderstood_definition,
          feedback: "A zero bias adds nothing, but the weighted sum still counts: for $x=(0,1)$ neuron 2 outputs $1$.",
        }
      - {
          id: c,
          text: "Its weight $-1$ on $x_1$ cancels the rest of its score to $0$.",
          correct: false,
          category: math_error,
          feedback: "The score is $-1\\cdot2+1\\cdot1+0=-1$, not $0$. ReLU makes it $0$.",
        }
      - {
          id: d,
          text: "Only the first neuron in a layer passes a value on to the next.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Every neuron in a layer passes its output on; this one just happens to be $0$.",
        }
    solution: "Neuron 2's score is $-1\\cdot2+1\\cdot1+0=-1$. ReLU keeps positive scores and turns negative ones into $0$, so its output is $\\max(0,-1)=0$."
  - id: mlpp-why-matrix
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Why compute a layer's scores as $Wx + b$ instead of writing a separate loop for each neuron's weighted sum?"
    options:
      - {
          id: a,
          text: "Each row calculates one neuron's weighted sum, so a computer can process many neuron calculations together without changing their results",
          correct: true,
        }
      - {
          id: b,
          text: "The matrix product changes the scores so the model becomes nonlinear",
          correct: false,
          category: misunderstood_definition,
          feedback: "Matrix multiplication is still a collection of weighted sums. The activation supplies nonlinearity, not the matrix notation.",
        }
      - {
          id: c,
          text: "A loop cannot represent a neuron with a bias",
          correct: false,
          category: misunderstood_definition,
          feedback: "A loop can add the bias after accumulating the weighted inputs. Both methods perform the same calculation.",
        }
      - {
          id: d,
          text: "One matrix row averages the weights of all neurons into a single score",
          correct: false,
          category: misunderstood_definition,
          feedback: "One row belongs to one neuron. Its dot product with the input gives that neuron's score, not an average across neurons.",
        }
    solution: "For $W = \\begin{pmatrix}1 & 1\\\\ -1 & 1\\end{pmatrix}$ and $x = (2, 1)$, the row dot products are 3 and $-1$, just as two loops would compute. Adding $b = (-1, 0)$ gives $(2, -1)$. Matrix form groups identical operations without changing their meaning."
  - id: mlpp-weight-entry
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A layer has $W = \\begin{pmatrix}1 & 1\\\\ -1 & 1\\end{pmatrix}$ and reads the input $x = (x_1, x_2)$. What does the $-1$ in row 2, column 1 mean?"
    options:
      - {
          id: a,
          text: "Neuron 2's weight on $x_1$: a larger $x_1$ lowers neuron 2's score",
          correct: true,
        }
      - {
          id: b,
          text: "Neuron 1's weight on $x_2$",
          correct: false,
          category: misunderstood_definition,
          feedback: "Rows are neurons and columns are inputs, so row 2, column 1 is neuron 2's weight on input 1.",
        }
      - {
          id: c,
          text: "Neuron 2's bias",
          correct: false,
          category: recall_failure,
          feedback: "Biases are kept separately in the vector $b$, not inside $W$.",
        }
    solution: "Row 2 belongs to neuron 2 and column 1 to the first input, $x_1$. The weight $-1$ means each extra unit of $x_1$ lowers neuron 2's score by 1."
  - id: mlpp-why-activation
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "Why does a hidden layer apply an activation such as ReLU to its scores $W_1 x + b_1$?"
    options:
      - {
          id: a,
          text: "Without it the next layer's weighted sum would collapse the two layers into one",
          correct: true,
        }
      - {
          id: b,
          text: "To make the matrix product possible",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The product works with or without an activation. The activation is about what the network can represent.",
        }
      - {
          id: c,
          text: "To turn the scores into 0 or 1 answers",
          correct: false,
          category: misunderstood_definition,
          feedback: "That's the step rule. ReLU keeps positive scores as they are.",
        }
    solution: "Two weighted sums plus biases in a row multiply out into one. A nonlinear activation between them stops that, so the second layer can build on bent, not straight, pieces."
  - id: mlpp-robot-layer
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: "A robot has 5 distance sensors. Its first layer has 8 neurons, each reading all 5 sensors. What shapes are this layer's weight matrix $W$ and bias $b$?"
    options:
      - { id: a, text: "$W$ is $8 \\times 5$ and $b$ has 8 entries", correct: true }
      - {
          id: b,
          text: "$W$ is $5 \\times 8$ and $b$ has 5 entries",
          correct: false,
          category: misunderstood_definition,
          feedback: "Each neuron is a row with one weight per sensor, and each neuron has its own bias: 8 rows, 5 columns, 8 biases.",
        }
      - {
          id: c,
          text: "$W$ is $8 \\times 5$ and $b$ has 1 entry",
          correct: false,
          category: incomplete_explanation,
          feedback: "Every neuron has its own bias, so there are 8.",
        }
    solution: "One row per neuron (8) and one column per input (5), so $W$ is $8 \\times 5$, with one bias per neuron: 8."
  - id: mlpp-forward-order
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In what order does a two-layer network's forward pass run?"
    options:
      - {
          id: a,
          text: "Compute $W_1 x + b_1$, apply the activation to get $h$, then compute $W_2 h + b_2$",
          correct: true,
        }
      - {
          id: b,
          text: "Apply the activation to $x$, then compute $W_1 x + b_1$, then $W_2 h + b_2$",
          correct: false,
          category: misunderstood_definition,
          feedback: "The activation is applied to each neuron's score, after the weighted sum and bias.",
        }
      - {
          id: c,
          text: "Compute $W_2 W_1 x$ first, then add both biases and apply the activation",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Multiplying $W_2 W_1$ first skips the activation in between, which is exactly what stops the two layers collapsing.",
        }
    solution: "Layer 1's scores $W_1 x + b_1$, then the activation gives $h$, then the output layer gives $\\hat y = W_2 h + b_2$."
  - id: mlpp-forward-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 3
    prompt: |
      A network has
      $$W_1 = \begin{pmatrix}{{=a}} & {{=b}}\\ {{=c}} & {{=d}}\end{pmatrix}, \quad b_1 = ({{=p}}, {{=q}}), \quad \text{ReLU}, \quad W_2 = ({{=u}}, {{=v}}), \quad b_2 = {{=r}}$$

      Compute $\hat y$ for $x = ({{=x1}}, {{=x2}})$.
    hints:
      - "Find $W_1 x + b_1$ row by row, apply ReLU to each entry, then take $W_2 h + b_2$."
    solution: |
      1. Layer 1 scores: ${{=a}} \cdot {{=x1}} + ({{=b}}) \cdot {{=x2}} + ({{=p}}) = {{=a*x1 + b*x2 + p}}$ and ${{=c}} \cdot {{=x1}} + ({{=d}}) \cdot {{=x2}} + ({{=q}}) = {{=c*x1 + d*x2 + q}}$.
      2. ReLU: $h = ({{=a*x1 + b*x2 + p}}, 0)$.
      3. Output: $\hat y = {{=u}} \cdot {{=a*x1 + b*x2 + p}} + {{=v}} \cdot 0 + {{=r}} = {{=u*(a*x1 + b*x2 + p) + r}}$.
    answer_expr: "u * max(0, a * x1 + b * x2 + p) + v * max(0, c * x1 + d * x2 + q) + r"
    params:
      a: { min: 1, max: 3 }
      b: { min: -1, max: 2 }
      c: { min: -2, max: 1 }
      d: { min: -2, max: 1 }
      p: { min: -1, max: 1 }
      q: { min: -3, max: -1 }
      x1: { min: 1, max: 3 }
      x2: { min: 1, max: 3 }
      u: { min: 1, max: 3 }
      v: { min: 1, max: 3 }
      r: { min: 1, max: 3 }
    constraints: ["a * x1 + b * x2 + p > 0", "c * x1 + d * x2 + q < 0"]
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer_expr: "u * (a * x1 + b * x2 + p) + v * (c * x1 + d * x2 + q) + r",
          category: incomplete_explanation,
          feedback: "You skipped ReLU. The second hidden score is negative, so ReLU sets it to 0 before the output layer.",
        }
      - {
          answer_expr: "u * max(0, a * x1 + b * x2 + p) + v * max(0, c * x1 + d * x2 + q)",
          category: incomplete_explanation,
          feedback: "Add the output bias $b_2$ at the end.",
        }
  - id: mlpp-forward-fixed
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Using the lesson's network ($W_1 = \\begin{pmatrix}1 & 1\\\\ -1 & 1\\end{pmatrix}$, $b_1 = (-1, 0)$, ReLU, $W_2 = \\begin{pmatrix}3 & 2\\end{pmatrix}$, $b_2 = 1$), compute $\\hat y$ for $x = (4, 1)$."
    answer: 13
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 7,
          tolerance: { abs: 0.001 },
          category: incomplete_explanation,
          feedback: "You skipped ReLU. The second score is $-3$, so ReLU makes it 0.",
        }
      - {
          answer: 12,
          tolerance: { abs: 0.001 },
          category: incomplete_explanation,
          feedback: "Add the output bias $b_2 = 1$.",
        }
    hints: ["$W_1 x + b_1 = (5, -3) + (-1, 0)$."]
    solution: "$W_1 x = (5, -3)$, plus $b_1$ gives $(4, -3)$. ReLU gives $h = (4, 0)$, so $\\hat y = 3 \\cdot 4 + 2 \\cdot 0 + 1 = 13$."
  - id: mlpp-why-no-sigmoid-output
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: "A network predicts house prices directly in thousands of pounds, including a target of 250. Why leave its output as $W_2 h + b_2$ instead of applying sigmoid?"
    options:
      - {
          id: a,
          text: "Sigmoid would trap predictions between 0 and 1, preventing the model from reaching a target of 250",
          correct: true,
        }
      - {
          id: b,
          text: "Activations cannot be applied to a single output number",
          correct: false,
          category: misunderstood_definition,
          feedback: "Sigmoid accepts a single score. The problem is its output range, not the number of outputs.",
        }
      - {
          id: c,
          text: "Removing the output sigmoid removes every nonlinearity in the network",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The hidden activation is still present. It prevents the two layers collapsing even when the output has no activation.",
        }
      - {
          id: d,
          text: "A large enough output bias can make sigmoid return 250",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The bias changes the score before sigmoid, but sigmoid maps every finite score to a value between 0 and 1.",
        }
    solution: "A direct numerical prediction of 250 cannot come from sigmoid, whose outputs lie between 0 and 1. Leaving the final weighted sum unrestricted allows that target; hidden activations still let the network represent bends. An output intended as a probability would be a different choice."
  - id: mlpp-hidden-meaning
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "What are a network's hidden values $h$?"
    options:
      - {
          id: a,
          text: "Numbers the network computes between its input and output; they aren't in the data",
          correct: true,
        }
      - {
          id: b,
          text: "Inputs the learner can't see",
          correct: false,
          category: misunderstood_definition,
          feedback: "Every input is given. Hidden values are computed from them by the first layer.",
        }
      - {
          id: c,
          text: "The network's final prediction",
          correct: false,
          category: recall_failure,
          feedback: "That's $\\hat y$, from the output layer. $h$ feeds into it.",
        }
    solution: "$h = \\phi(W_1 x + b_1)$ is computed from the input, then read by the output layer. Nobody supplies it; it's 'hidden' between input and output."
  - id: mlpp-robot-forward
    dimension: transfer
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A balancing robot reads one input, its tilt $x$. Hidden neuron 1 has weight 2 and bias $-1$; hidden neuron 2 has weight $-1$ and bias 1; both use ReLU. The output has weights $(1, 2)$ and bias 0. What is the output when $x = 0.25$?"
    answer: 1.5
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 1,
          tolerance: { abs: 0.001 },
          category: incomplete_explanation,
          feedback: "You skipped ReLU. Neuron 1's score is $-0.5$, so ReLU makes it 0.",
        }
    hints: ["Score each hidden neuron, apply ReLU, then combine with the output weights."]
    solution: "Scores: $2 \\cdot 0.25 - 1 = -0.5$ and $-0.25 + 1 = 0.75$. ReLU gives $h = (0, 0.75)$. Output: $1 \\cdot 0 + 2 \\cdot 0.75 + 0 = 1.5$."
  - id: mlpp-forward-why-h
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, why does the output layer use $h=(2,0)$ rather than the scores $(2,-1)$?"
    options:
      - {
          id: a,
          text: "The output layer reads layer 1's outputs, which are its scores after ReLU.",
          correct: true,
          feedback: "Layer 1's output is $\\phi(W_1x+b_1)$, so the next layer reads the activated values.",
        }
      - {
          id: b,
          text: "The negative score is an error in the input, so it is removed first.",
          correct: false,
          category: misunderstood_definition,
          feedback: "Nothing is wrong with the input; a negative score is normal. ReLU is what turns it into $0$.",
        }
      - {
          id: c,
          text: "The output layer can only read numbers that are $0$ or larger.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "An output neuron can read any numbers. Here they are non-negative only because ReLU came first.",
        }
      - {
          id: d,
          text: "Using $(2,-1)$ would give the same prediction, $7$, in any case.",
          correct: false,
          category: math_error,
          feedback: "With $(2,-1)$ the output is $3\\cdot2+2\\cdot(-1)+1=5$, not $7$.",
        }
    solution: "Each layer's output feeds the next layer, and layer 1's output is its scores after ReLU: $h=\\operatorname{ReLU}(2,-1)=(2,0)$. Using the raw scores would skip the activation and give $5$ instead of $7$."
  - id: mlpp-batch-shape
    dimension: implementation
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A batch $X$ has shape $32 \\times 10$: 32 houses with 10 inputs each. It goes through a layer of 16 neurons. What shape is the output?"
    options:
      - { id: a, text: "$32 \\times 16$", correct: true }
      - {
          id: b,
          text: "$16 \\times 10$",
          correct: false,
          category: misunderstood_definition,
          feedback: "That's the shape of the layer's weight matrix $W$, not its output.",
        }
      - {
          id: c,
          text: "$32 \\times 10$",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Each house gets one score per neuron, so the second size becomes 16.",
        }
      - {
          id: d,
          text: "$1 \\times 16$",
          correct: false,
          category: incomplete_explanation,
          feedback: "The batch keeps one row per example, so 32 rows stay 32.",
        }
    solution: "$(32 \\times 10)(10 \\times 16) = 32 \\times 16$: each of the 32 houses gets one score from each of the 16 neurons."
  - id: mlpp-params-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      A two-layer network takes {{=din}} inputs, has a hidden layer of {{=dh}} neurons, and an output layer of {{=dout}} neurons. How many parameters (weights and biases) does it have in total?
    hints:
      - "Each layer has $d_\\text{in} \\cdot d_\\text{out}$ weights plus $d_\\text{out}$ biases. Count both layers."
    solution: |
      Layer 1: ${{=din}} \cdot {{=dh}} + {{=dh}} = {{=din*dh + dh}}$.

      Layer 2: ${{=dh}} \cdot {{=dout}} + {{=dout}} = {{=dh*dout + dout}}$.

      Total: ${{=din*dh + dh + dh*dout + dout}}$.
    answer_expr: "din * dh + dh + dh * dout + dout"
    params:
      din: { min: 2, max: 20 }
      dh: { min: 2, max: 16 }
      dout: { min: 1, max: 5 }
    tolerance: { abs: 0.5 }
    common_wrong:
      - {
          answer_expr: "din * dh + dh * dout",
          category: incomplete_explanation,
          feedback: "You counted weights only. Each neuron in both layers also has a bias.",
        }
      - {
          answer_expr: "din * dh + dh",
          category: incomplete_explanation,
          feedback: "That's layer 1 only. Add the output layer's weights and biases.",
        }
  - id: mlpp-why-shared-weights
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "A house model's batch grows from 8 houses to 32 with no change to its layers. Why does its number of parameters stay the same?"
    options:
      - {
          id: a,
          text: "Every house uses the same weights and biases; only the number of rows of computed values grows",
          correct: true,
        }
      - {
          id: b,
          text: "The number of weights grows fourfold but the number of biases shrinks to compensate",
          correct: false,
          category: misunderstood_definition,
          feedback: "Neither weights nor biases depend on the batch size. Both are reused for every input row.",
        }
      - {
          id: c,
          text: "The batch is averaged into one house before the layer computes anything",
          correct: false,
          category: misunderstood_definition,
          feedback: "Each house keeps its own row of outputs. Batch matrix multiplication does not average the examples together.",
        }
      - {
          id: d,
          text: "Hidden values are parameters, but they are discarded after every batch",
          correct: false,
          category: misunderstood_definition,
          feedback: "Hidden values are computed results, not adjustable weights or biases. More results require more storage, not more model parameters.",
        }
    solution: "A layer with 2 inputs and 2 neurons has $2 \\times 2 + 2 = 6$ parameters whether it sees 8 or 32 houses. Its output grows from $8 \\times 2$ to $32 \\times 2$, but all rows reuse the same 6 parameters."
  - id: mlpp-hidden-array-size
    dimension: implementation
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A batch of 8 images, each flattened to 784 numbers, goes through a hidden layer of 128 neurons, then an output layer of 10. How many numbers are in the hidden array $H$?"
    answer: 1024
    tolerance: { abs: 0.5 }
    common_wrong:
      - {
          answer: 128,
          category: incomplete_explanation,
          feedback: "That's the count for one image. The batch keeps one row per image, so $H$ is $8 \\times 128$.",
        }
      - {
          answer: 6272,
          category: misunderstood_definition,
          feedback: "That's the input array, $8 \\times 784$. The hidden array has one column per hidden neuron.",
        }
    hints: ["$H$ has one row per image and one column per hidden neuron."]
    solution: "$H$ is $8 \\times 128$, which holds $8 \\cdot 128 = 1024$ numbers. The 784 inputs disappear once each neuron has combined them into one score."
  - id: mlpp-why-transpose
    dimension: implementation
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "A layer's weights $W$ are $d_\\text{out} \\times d_\\text{in}$ and the batch $X$ is $B \\times d_\\text{in}$. Why do you compute $XW^\\top$ rather than $XW$?"
    options:
      - {
          id: a,
          text: "$W^\\top$ is $d_\\text{in} \\times d_\\text{out}$, so the inner sizes match and each row of $X$ is dotted with each neuron's weights",
          correct: true,
        }
      - {
          id: b,
          text: "Transposing makes the result $d_\\text{out} \\times B$",
          correct: false,
          category: math_error,
          feedback: "$(B \\times d_\\text{in})(d_\\text{in} \\times d_\\text{out})$ is $B \\times d_\\text{out}$: still one row per example.",
        }
      - {
          id: c,
          text: "It doesn't matter; $XW$ gives the same answer",
          correct: false,
          category: incorrect_reasoning,
          feedback: "$XW$ is $(B \\times d_\\text{in})(d_\\text{out} \\times d_\\text{in})$, so the inner sizes don't match unless they happen to be equal.",
        }
    solution: "Examples are rows of $X$ and neurons are rows of $W$. Transposing $W$ turns its neurons into columns, so $(B \\times d_\\text{in})(d_\\text{in} \\times d_\\text{out})$ dots every example with every neuron, giving $B \\times d_\\text{out}$."
  - id: mlpp-robot-shapes
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: "A robot arm controller processes 20 camera frames at once. Each frame is summarised as 64 numbers, a hidden layer has 32 neurons, and the output layer gives 4 motor commands. What shape is the output array?"
    options:
      - { id: a, text: "$20 \\times 4$", correct: true }
      - {
          id: b,
          text: "$20 \\times 32$",
          correct: false,
          category: incomplete_explanation,
          feedback: "That's the hidden array. The output layer turns each row's 32 hidden values into 4 commands.",
        }
      - {
          id: c,
          text: "$4 \\times 32$",
          correct: false,
          category: misunderstood_definition,
          feedback: "That's the output layer's weight matrix, not its output.",
        }
    solution: "$(20 \\times 64) \\to (20 \\times 32) \\to (20 \\times 4)$: one row of 4 motor commands for each of the 20 frames."
  - id: mlpp-shapes-why-column
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, why is $\\hat Y$ a $3\\times1$ array?"
    options:
      - {
          id: a,
          text: "Each of the 3 rows is one example, and the output layer gives each 1 prediction.",
          correct: true,
          feedback: "Rows count examples and columns count output neurons: 3 examples, 1 output neuron.",
        }
      - {
          id: b,
          text: "The output layer has 3 weights, one for each example in the batch.",
          correct: false,
          category: misunderstood_definition,
          feedback: "The output neuron has 2 weights, one per hidden value; weights don't depend on the batch.",
        }
      - {
          id: c,
          text: "The hidden array has 3 columns, which the output layer adds into one.",
          correct: false,
          category: math_error,
          feedback: "$H$ is $3\\times2$: 3 rows (examples) and 2 columns (hidden neurons).",
        }
      - {
          id: d,
          text: "Multiplying by $W_2^\\top$ always gives the same shape as the input $X$.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "$X$ is $3\\times2$. The product keeps the rows of $H$ and takes the columns of $W_2^\\top$.",
        }
    solution: "$(3\\times2)(2\\times1)=3\\times1$: the 3 rows are the 3 examples, carried through from $X$, and the 1 column is the single output neuron."
