concept: classification-softmax
exercises:
  - id: lab-classifier-shift
    dimension: conceptual
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: A classifier gives logits [1000, 1001, 1002]. A programmer subtracts 1002 from each score before computing softmax. How do the resulting probabilities compare with the exact mathematical probabilities of the original logits?
    options:
      - id: a
        text: They stay the same for all three classes.
        correct: true
        feedback: A common shift cancels between the numerator and denominator.
      - id: b
        text: They become equal for all three classes.
        correct: false
        feedback: The score gaps remain, so the three probabilities differ.
      - id: c
        text: They reverse the order of the three classes.
        correct: false
        feedback: Subtracting a common value preserves the score order.
    solution: Each exponential gains the same factor, which cancels in the ratio. Subtracting the largest score keeps the exponentials within the computer's usable number range, avoiding overflow while preserving the probabilities.
  - id: sm-softmax-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What does softmax output for the robot's cup, ball and box scores?
    options:
      - {
          id: a,
          text: "Positive probabilities with a total of one.",
          correct: true,
          feedback: "Each class gets a share of the same total.",
        }
      - {
          id: b,
          text: "Positive scores with no fixed total.",
          correct: false,
          feedback: "Raising e to each score is only the first move; division fixes the total.",
        }
      - {
          id: c,
          text: "One certain class and two impossible classes.",
          correct: false,
          feedback: "Softmax gives probabilities for every class; a separate choice can mark one class as selected and the others as unselected.",
        }
    solution: Softmax divides positive e-powers by their shared total, so all probabilities are positive and add up to one.
  - id: sm-softmax-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does step 3 of the worked example divide 7.39, 2.72 and 1 by their total 11.11?
    options:
      - {
          id: a,
          text: "To make the largest probability exactly one.",
          correct: false,
          feedback: "The largest numerator is smaller than the total, so its probability stays below one.",
        }
      - {
          id: b,
          text: "To make the three probabilities sum to one.",
          correct: true,
          feedback: "The numerators add to the denominator, giving a total of one.",
        }
      - {
          id: c,
          text: "To make the three probabilities all equal.",
          correct: false,
          feedback: "Dividing by a shared total preserves their different sizes.",
        }
    solution: The sum becomes $(7.39+2.72+1)/11.11=1$, so the positive numbers become a probability distribution.
  - id: sm-softmax-faded
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      A robot gives cup, ball and box scores 2, 1 and 0. Their e-powers are 7.39, 2.72 and 1. What softmax probability
      does ball receive? Give 2 decimal places.
    answer: 0.2448244824482448
    tolerance:
      abs: 0.005
    common_wrong:
      - answer: 2.72
        category: incomplete_explanation
        feedback: This is the e-power; divide it by the total to get a probability.
    solution: The ball gets its share of the total, $2.72/11.11\approx0.24$.
  - id: sm-softmax-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The robot has cup score {{=z1}}, ball score {{=z2}} and box score 0. Use a calculator to find the cup probability with softmax, to 2 decimal places."
    params:
      z1: { min: 0, max: 3 }
      z2: { min: 0, max: 2 }
    answer_expr: exp(z1)/(exp(z1)+exp(z2)+1)
    tolerance: { abs: 0.005 }
    solution: "Raise e to each score and divide by the total: $p_{\\text{cup}}=e^{{=z1}}/(e^{{=z1}}+e^{{=z2}}+1)={{=exp(z1)/(exp(z1)+exp(z2)+1)}}$."
  - id: sm-softmax-confusion
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: The robot's cup score is 2 and its ball score is 1. How do their softmax probabilities compare in this same prediction?
    options:
      - {
          id: a,
          text: "Cup is twice as likely as ball, from the score ratio.",
          correct: false,
          feedback: "Softmax uses e-powers, not the raw ratio 2/1.",
        }
      - {
          id: b,
          text: "Cup is one unit likelier than ball, from the score gap.",
          correct: false,
          feedback: "A score difference is not an additive probability difference.",
        }
      - {
          id: c,
          text: "Cup is e times as likely as ball, from the score gap.",
          correct: true,
          feedback: "Their common denominator cancels, leaving e squared divided by e.",
        }
    solution: Within one prediction, $p_{\text{cup}}/p_{\text{ball}}=e^2/e^1=e\approx2.72$, not 2.
  - id: sm-softmax-shift
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: What happens to the robot's probabilities if scores (2, 1, 0) become (7, 6, 5)?
    options:
      - {
          id: a,
          text: "They stay unchanged because a shared factor cancels.",
          correct: true,
          feedback: "Every e-power and their total are multiplied by e to the fifth power.",
        }
      - {
          id: b,
          text: "They become more equal because all scores are positive.",
          correct: false,
          feedback: "The original e-powers were already positive; the score gaps did not change.",
        }
      - {
          id: c,
          text: "They favour cup more because its score is now larger.",
          correct: false,
          feedback: "All scores rose equally, so cup gained no relative advantage.",
        }
    solution: Adding 5 multiplies every numerator and the denominator by $e^5$, which cancels and leaves all probabilities unchanged.
  - id: sm-softmax-transfer
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A sorter chooses between paper, glass, metal and plastic with scores (2, 0, 0, 0). Use a calculator to find the paper probability to 2 decimal places."
    answer: 0.7112345942275938
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer: 0.8807970779778823,
          category: misunderstood_definition,
          feedback: "That uses only one rival; include all three other classes in the total.",
        }
    solution: All four classes contribute to the total, so $p_{\text{paper}}=e^2/(e^2+1+1+1)\approx0.71$.
  - id: sm-ce-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt:
      A robot gives cup, ball and box probabilities 0.67, 0.24 and 0.09. The object is really a ball. Which
      number goes inside the $-\ln$ for the cross-entropy loss?
    options:
      - id: a
        text: "0.24"
        correct: true
        feedback: Use the probability of the observed ball class.
      - id: b
        text: "0.67"
        correct: false
        feedback: This is the highest probability, but cup is not the true class.
      - id: c
        text: "0.76"
        correct: false
        feedback: This is one minus the ball probability; use the true-class probability itself.
      - id: d
        text: "1"
        correct: false
        feedback: The label says ball is the observed class, so use the model's probability for ball inside the logarithm.
    solution:
      Cross-entropy takes the negative natural log of the true class's probability, so use the ball probability
      0.24.
  - id: sm-ce-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Why does step 2 of the ball worked example put a minus sign before the natural log of 0.245?
    options:
      - {
          id: a,
          text: "Because the ball probability is a negative number.",
          correct: false,
          feedback: "The probability is positive; it is its natural log that is negative.",
        }
      - {
          id: b,
          text: "Because training must always have a negative loss.",
          correct: false,
          feedback: "This loss is nonnegative; gradient descent subtracts slopes, not the loss itself.",
        }
      - {
          id: c,
          text: "Because its log is negative, making the loss positive.",
          correct: true,
          feedback: "The natural log of a probability strictly between zero and one is negative.",
        }
    solution: Since $0<0.245<1$, its natural log is negative; negating it gives a positive surprise that falls as the true-class probability rises.
  - id: sm-ce-faded
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      A robot gives the true class, ball, probability 0.25. Find the natural-log cross-entropy loss to 2 decimal
      places.
    answer: 1.3862943611198906
    tolerance:
      abs: 0.005
    common_wrong:
      - answer: -1.3862943611198906
        category: math_error
        feedback: The log is negative; the loss includes an extra minus sign.
    solution: Taking the negative natural log gives $-\ln(0.25)=\ln4\approx1.39$, a positive loss.
  - id: sm-ce-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "The robot assigns the true class probability ${{=k}}/10$. Use a calculator to compute the natural-log cross-entropy loss to 2 decimal places."
    params:
      k: { min: 1, max: 9 }
    answer_expr: -log(k/10)
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer_expr: log(k/10),
          category: math_error,
          feedback: "Negate the natural log so that a probability below one gives positive loss.",
        }
    solution: "Use the true class's probability: $L=-\\ln({{=k}}/10)={{=-log(k/10)}}$, because loss measures how surprising that label was."
  - id: sm-ce-confusion
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: The true class is ball. If only the cup score rises while ball and box scores stay fixed, what happens to the loss?
    options:
      - {
          id: a,
          text: "It rises because cup takes probability away from ball.",
          correct: true,
          feedback: "The shared softmax denominator grows while the ball numerator stays fixed.",
        }
      - {
          id: b,
          text: "It stays fixed because the ball score did not change.",
          correct: false,
          feedback: "The ball probability depends on other scores through the shared total.",
        }
      - {
          id: c,
          text: "It falls because the model has a higher leading score.",
          correct: false,
          feedback: "More confidence in a wrong class reduces the true-class probability and raises loss.",
        }
    solution: A larger cup score increases the denominator but not the ball numerator, so the ball probability falls and $-\ln p_{\text{ball}}$ rises.
  - id: sm-ce-bits
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      Measured with base-2 logs, a prediction's cross-entropy loss is 3 bits. What is the natural-log loss,
      to 2 decimal places?
    answer: 2.0794415416798357
    tolerance:
      abs: 0.005
    common_wrong:
      - answer: 3
        category: misapplied_technique
        feedback: That is the value in bits; multiply by ln 2 to change units.
    solution: Changing from base-2 logs to natural logs multiplies by $\ln2$, giving $3\ln2\approx2.08$.
  - id: sm-ce-transfer
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A four-class digit reader gives digits 0, 1, 2 and 3 scores (2, 0, 1, 0). The true digit is 2. Use a calculator to find the natural-log cross-entropy loss to 2 decimal places."
    answer: 1.4938117090722385
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer: 0.4938117090722385,
          category: misunderstood_definition,
          feedback: "The loss uses the score of the true digit, which is 1. The score of 2 belongs to digit 0.",
        }
    solution: Digit 2 has probability $e^1/(e^2+1+e^1+1)$. The log rules give its loss as $\ln(e^2+1+e^1+1)-1\approx1.49$.
  - id: sm-grad-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: What is the loss slope against class k's score for softmax with cross-entropy?
    options:
      - {
          id: a,
          text: "Its label minus its predicted probability, $y_k-p_k$.",
          correct: false,
          feedback: "That reverses the slope's sign and hence the descent direction.",
        }
      - {
          id: b,
          text: "Its probability minus its one-hot label, $p_k-y_k$.",
          correct: true,
          feedback: "Use label one for the true class and zero for each other class.",
        }
      - {
          id: c,
          text: "Its score minus its predicted probability, $z_k-p_k$.",
          correct: false,
          feedback: "The subtraction uses the label, not the score.",
        }
    solution: The slope is $p_k-y_k$, negative for the true class and positive for every other class with finite scores.
  - id: sm-grad-reason
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: In step 2 of the worked example, only the biases change. Why does each score change by exactly as much as its bias?
    options:
      - {
          id: a,
          text: "Because the same slope is used for all three classes.",
          correct: false,
          feedback: "Each class has its own slope; the three bias changes differ.",
        }
      - {
          id: b,
          text: "Because a bias change multiplies $w_kx$.",
          correct: false,
          feedback: "A bias is added to $w_kx$, not multiplied into it.",
        }
      - {
          id: c,
          text: "Because the bias is added to $w_kx$, which stays fixed.",
          correct: true,
          feedback: "With weights and input fixed, changing $b_k$ changes $z_k$ by exactly that amount.",
        }
    solution: In $z_k=w_kx+b_k$, holding $w_kx$ fixed means $\Delta z_k=\Delta b_k$ for each class separately, not one shared change for all classes.
  - id: sm-grad-faded
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt:
      A robot gives cup, ball and box probabilities (0.67, 0.24, 0.09). The true object is ball. What is the
      cross-entropy loss slope with respect to the ball score? Give 2 decimal places.
    answer: -0.76
    tolerance:
      abs: 0.005
    common_wrong:
      - answer: 0.24
        category: misunderstood_definition
        feedback: For the true class, subtract its label 1 from its predicted probability.
    solution: The ball label is 1, so its slope is $0.24-1=-0.76$; subtracting this negative slope raises its score.
  - id: sm-grad-template
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      The true object is ball and its probability is ${{=k}}/10$. Its bias is {{=b}}. What is this bias after
      one gradient-descent step with learning rate 0.1? Give 2 decimal places.
    params:
      k:
        min: 2
        max: 8
      b:
        min: -1
        max: 2
    answer_expr: b-0.1*(k/10-1)
    tolerance:
      abs: 0.005
    common_wrong:
      - answer_expr: b+0.1*(k/10-1)
        category: math_error
        feedback: Gradient descent subtracts the scaled slope; adding it lowers the true-class bias.
    solution: "The true-class slope is ${{=k/10}}-1={{=k/10-1}}$, so subtract it times 0.1: ${{=b}}-0.1({{=k/10-1}})={{=b-0.1*(k/10-1)}}$."
  - id: sm-grad-confusion
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: With true class ball and probabilities (0.67, 0.24, 0.09), what does a positive-learning-rate update of only the biases do?
    options:
      - {
          id: a,
          text: "It raises ball and leaves cup and box unchanged.",
          correct: false,
          feedback: "Wrong classes also have nonzero slopes, equal to their probabilities.",
        }
      - {
          id: b,
          text: "It lowers all three scores to reduce the loss.",
          correct: false,
          feedback: "The true class has a negative slope, so subtracting it raises its score.",
        }
      - {
          id: c,
          text: "It raises ball and lowers both cup and box.",
          correct: true,
          feedback: "Ball has negative slope; cup and box have positive slopes.",
        }
    solution: The slopes are $(0.67,-0.76,0.09)$, so subtracting their positive-learning-rate multiples raises ball and lowers the two wrong-class scores.
  - id: sm-grad-sum
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt:
      For a three-class softmax prediction with cross-entropy loss, two loss slopes with respect to the scores
      are 0.50 and -0.70. Find the missing slope to 2 decimal places.
    answer: 0.2
    tolerance:
      abs: 0.005
    common_wrong:
      - answer: -0.2
        category: math_error
        feedback: The known slopes sum to -0.20, so the missing one must cancel that sum.
    solution:
      Both probabilities and the one-hot label sum to one, so the slopes sum to zero; the missing slope is
      $-(0.50-0.70)=0.20$.
  - id: sm-grad-transfer
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 3
    prompt: "A digit reader uses feature $x=3$ and score $z_7=w_7x+b_7$ for digit 7. Its probability for 7 is 0.20, but the true digit is 7. Find the loss slope against $w_7$, not the bias, to 2 decimal places."
    answer: -2.4
    tolerance: { abs: 0.005 }
    common_wrong:
      - {
          answer: -0.8,
          category: misapplied_technique,
          feedback: "That is the score or bias slope; multiply by input 3 for the weight slope.",
        }
    solution: The score slope is $0.20-1=-0.80$, and the weight slope multiplies by the feature, giving $(-0.80)\times3=-2.40$.
  - id: sm-explain-softmax
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 5
    prompt: "A robot gives cup, ball and box scores $(3,1,1)$ for an image whose true class is box. Calculate the softmax probabilities, the cross-entropy loss and the slopes with respect to the three scores. Explain each calculation and round results to two decimal places."
    solution: "Divide $(e^3,e,e)$ by $e^3+2e$ to get probabilities about $(0.79,0.11,0.11)$. Box is true, so the loss is $-\\ln(e/(e^3+2e))\\approx2.24$. Subtracting $(0,0,1)$ from the unrounded probabilities gives slopes about $(0.79,0.11,-0.89)$."
    rubric:
      - id: probabilities
        criterion: Divide each score's exponential by their total to obtain probabilities about $(0.79,0.11,0.11)$.
        weight: 1
        required: true
      - id: loss
        criterion: Take minus the natural log of the true box probability to obtain a loss about $2.24$.
        weight: 1
        required: true
      - id: slopes
        criterion: Subtract the label $(0,0,1)$ from the probabilities to obtain score slopes about $(0.79,0.11,-0.89)$.
        weight: 1
        required: true
    exemplar: "Divide $(e^3,e,e)$ by $e^3+2e$ to get probabilities about $(0.79,0.11,0.11)$. Box is true, so the loss is $-\\ln(e/(e^3+2e))\\approx2.24$. Subtracting $(0,0,1)$ from the unrounded probabilities gives slopes about $(0.79,0.11,-0.89)$."
  - id: sm-recall-softmax-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: sm-softmax
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, how does softmax turn class scores into probabilities?
    rubric:
      - id: first
        criterion: Explain that softmax raises e to the power of each score, making every result positive.
        weight: 1
        required: true
      - id: second
        criterion: Explain that it divides each result by their total, so the probabilities add up to 1.
        weight: 1
        required: true
    exemplar: Softmax raises e to each score and divides each result by the total of those exponentials. The resulting probabilities add up to 1.
  - id: sm-recall-softmax-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: sm-softmax
    difficulty: 1
    est_minutes: 0.5
    prompt: A classifier adds the same number to every class score before applying softmax. What happens to its probabilities?
    options:
      - id: a
        text: They become more evenly spread.
        correct: false
        feedback: Equal scores give equal shares. Adding the same number preserves all score differences.
      - id: b
        text: They stay the same.
        correct: true
        feedback: The shared exponential factor cancels from every probability.
      - id: c
        text: They become more concentrated.
        correct: false
        feedback: Increasing the differences between scores makes the probabilities more concentrated.
    solution: Adding the same number to all scores leaves every softmax probability unchanged.
  - id: sm-recall-softmax-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: sm-softmax
    difficulty: 1
    est_minutes: 0.5
    prompt: For three classes with scores $z_1$, $z_2$ and $z_3$, write the softmax probability of class 1. Type `z1`, `z2`, `z3` for the scores and `exp(...)` for the exponential function.
    answer: exp(z1)/(exp(z1)+exp(z2)+exp(z3))
    variables:
      z1:
        - -3
        - 3
      z2:
        - -3
        - 3
      z3:
        - -3
        - 3
    solution: "Each exponential is divided by the total: $p_1=e^{z_1}/(e^{z_1}+e^{z_2}+e^{z_3})$."
  - id: sm-recall-cross-entropy-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: sm-cross-entropy
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, how does multiclass cross-entropy score one labelled example, and when is the loss large?
    rubric:
      - id: first
        criterion: Explain that it takes minus the natural log of the probability assigned to the true class.
        weight: 1
        required: true
      - id: second
        criterion: Explain that the loss is large when the probability assigned to the true class is near zero.
        weight: 1
        required: true
    exemplar: Multiclass cross-entropy takes minus the natural log of the true class probability. It is large when the model gives that class a probability near zero.
  - id: sm-recall-cross-entropy-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: sm-cross-entropy
    difficulty: 1
    est_minutes: 0.5
    prompt: An object is a ball. A model raises its cup score while holding its ball and box scores fixed. What happens to its cross-entropy loss?
    options:
      - id: a
        text: The loss stays the same.
        correct: false
        feedback: All probabilities share a total, so changing a competing score changes the true class probability.
      - id: b
        text: The loss decreases.
        correct: false
        feedback: A lower loss would need a larger probability for the observed ball.
      - id: c
        text: The loss increases.
        correct: true
        feedback: Cup takes a larger share, reducing the true ball probability and raising its loss.
    solution: The larger cup score reduces the ball's share of the total. Minus the log of the ball probability increases.
  - id: sm-recall-cross-entropy-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: sm-cross-entropy
    difficulty: 1
    est_minutes: 0.5
    prompt: A classifier gives three classes the scores $z_1$, $z_2$ and $z_3$, and the object really is class 1. Write its multiclass cross-entropy loss. Type `z1`, `z2`, `z3` for the scores, `exp(...)` for the exponential function and `ln(...)` for the natural logarithm.
    answer: -log(exp(z1)/(exp(z1)+exp(z2)+exp(z3)))
    variables:
      z1: [-3, 3]
      z2: [-3, 3]
      z3: [-3, 3]
    solution: 'Softmax gives class 1 the probability $p_1=e^{z_1}/(e^{z_1}+e^{z_2}+e^{z_3})$, and the loss is $L=-\ln p_1$, which also equals $\ln(e^{z_1}+e^{z_2}+e^{z_3})-z_1$.'
  - id: sm-recall-gradient-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: sm-gradient
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, how is a multiclass label written in one-hot form, and what is the loss slope against each score?
    rubric:
      - id: first
        criterion: Explain that the label has 1 for the true class and 0 for every other class.
        weight: 1
        required: true
      - id: second
        criterion: Explain that each score slope is its class probability minus its label.
        weight: 1
        required: true
    exemplar: A one-hot label has 1 for the true class and 0 for every other class. Each score slope is that class's probability minus its label.
  - id: sm-recall-gradient-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: sm-gradient
    difficulty: 1
    est_minutes: 0.5
    prompt: A softmax classifier with cross-entropy loss takes one gradient descent step on a labelled example. What happens to the class scores?
    options:
      - id: a
        text: The true class's score goes up and every other score goes down.
        correct: true
        feedback: The true class has slope $p-1$, which is negative, and every other class has slope $p_k$, which is positive.
      - id: b
        text: The true class's score goes up and the other scores stay the same.
        correct: false
