  - id: aip-recall-reuse-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: ai-weight-reuse
    difficulty: 1
    est_minutes: 0.5
    prompt: "A product applies a $d\\times d$ weight matrix to $m$ token rows of width $d$. Each entry takes 2 bytes. Read both inputs once and write the output once. Write the exact arithmetic intensity in FLOPs per byte."
    answer: "m*d/(d+2*m)"
    variables: { m: [1, 512], d: [32, 4096] }
    solution: "The work is $2md^2$ FLOPs and the traffic is $2(d^2+2md)$ bytes. Their ratio simplifies to $md/(d+2m)$."
