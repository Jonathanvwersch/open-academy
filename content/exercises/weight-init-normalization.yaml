  - id: wi-recall-init-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: wi-init-scale
    difficulty: 1
    est_minutes: 0.5
    prompt: "A neuron has $n$ inputs of typical size one and uses ReLU. Write the typical size of its starting weights under He initialization. Type `sqrt(...)` for a square root."
    answer: "sqrt(2/n)"
    variables: { "n": { "values": [2, 32, 512] } }
    solution: "He initialization uses $a=\\sqrt{2/n}$."
  - id: wi-recall-layer-say
    dimension: conceptual
