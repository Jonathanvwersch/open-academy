  - id: wi-recall-batch-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: wi-batch-norm
    difficulty: 1
    est_minutes: 0.5
    prompt: "A trained network with BatchNorm now predicts one example at a time. Which statistics does it use to normalize an output?"
    options:
      - id: a
        text: "The current example’s mean and spread across the layer."
        correct: false
        feedback: "LayerNorm computes statistics across neurons from the current example."
      - id: b
        text: "The last training batch’s mean and spread for each neuron."
        correct: false
        feedback: "During training, BatchNorm uses the current batch. The saved statistics combine information from many batches."
      - id: c
        text: "The running statistics saved for each neuron during training."
        correct: true
        feedback: "BatchNorm saves a running average of each neuron’s mean and squared standard deviation during training."
    solution: "After training, BatchNorm uses the running statistics it saved during training."
  - id: wi-recall-batch-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: wi-batch-norm
    difficulty: 1
    est_minutes: 0.5
    prompt: "A neuron outputs $h$. Its outputs across the training batch have mean $\\mu$ and standard deviation $s>0$. Write its BatchNorm output including learned gain $\\gamma$ and shift $\\beta$. Type `mu`, `gamma` and `beta`."
    answer: "gamma*(h-mu)/s+beta"
    variables: { "h": [-10, 10], "mu": [-5, 5], "s": [0.1, 5], "gamma": [0.5, 2], "beta": [-2, 2] }
    solution: "Subtract the mean, divide by the standard deviation, multiply by the gain and add the shift to get $\\gamma(h-\\mu)/s+\\beta$."
