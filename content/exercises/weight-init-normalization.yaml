  - id: wi-recall-layer-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: wi-layer-norm
    difficulty: 1
    est_minutes: 0.5
    prompt: "For one example, neuron $i$ outputs $h_i$. The layer’s outputs have mean $\\mu$ and standard deviation $s>0$. Write $\\hat h_i$ before LayerNorm applies learned gain and shift. Type `h_i` and `mu`."
    answer: "(h_i-mu)/s"
    variables: { "h_i": [-10, 10], "mu": [-5, 5], "s": [0.1, 5] }
    solution: "Subtract the mean from the neuron’s output and divide by the standard deviation to get $(h_i-\\mu)/s$."
