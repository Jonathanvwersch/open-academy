    solution: "The scale is the largest size in the group divided by 127, so the outlier makes $s$ larger. Every other weight in the group then gets coarser steps."
  - id: qzp-recall-int8-scale-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: qz-int8-scale
    difficulty: 1
    est_minutes: 0.5
    prompt: "A symmetric INT8 group has scale $s$, and no weight is clamped. Write the largest possible error $|x-\\hat x|$ between a weight and its dequantised value."
