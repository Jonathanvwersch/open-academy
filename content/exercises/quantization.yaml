  - id: qzp-recall-int8-scale-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: qz-int8-scale
    difficulty: 1
    est_minutes: 0.5
    prompt: "One weight in a symmetric INT8 group becomes a much larger outlier, and the scale is chosen again. Which of these gets larger?"
    options:
