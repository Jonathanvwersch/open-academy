    type: expression
    role: recall
    knowledge_point: qz-memory-speed
    difficulty: 1
    est_minutes: 0.5
    prompt: "Quantised weights take $D$ bytes. A GPU reads them at bandwidth $W$ bytes per second. Write the estimate of seconds per token for a single request whose decode time is set by weight reads."
