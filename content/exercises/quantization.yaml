        weight: 1
        required: true
    exemplar: "A single-request decode step spends most of its time reading weights, so fewer bytes make that read shorter. The smaller weights also leave more room for the other data requests must store."
  - id: qzp-recall-memory-speed-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: qz-memory-speed
    difficulty: 1
    est_minutes: 0.5
    prompt: "A GPU serves one request at a time and gets a long prompt. The model's weights now take half the space, but the GPU does maths at the old rate. Which part of the request benefits most from the smaller weights?"
    options:
      - id: a
        text: "Prefill for the long prompt"
        correct: false
        feedback: "A compute-bound prefill spends its time on the arithmetic, whose rate has not changed."
      - id: b
        text: "Decode for the reply"
        correct: true
        feedback: "The read is the bottleneck for this decode, so fewer bytes help."
      - id: c
        text: "Prefill and decode equally"
        correct: false
        feedback: "Less weight traffic shortens the read, but the compute-bound prefill is still limited by the maths."
    solution: "Smaller weights shorten the read that limits single-request decode. A compute-bound prefill still has the same arithmetic limit."
  - id: qzp-recall-memory-speed-formula
