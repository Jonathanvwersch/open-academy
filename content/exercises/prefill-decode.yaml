  - id: pd-recall-temperature-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: pd-temperature
    difficulty: 1
    est_minutes: 0.5
    prompt: "For a model with a single highest logit, which rule always picks the token with that logit?"
    options:
      - id: a
        text: "Sample after applying temperature 1."
        correct: false
        feedback: "Temperature 1 gives ordinary softmax, so a lower-scoring token can still be drawn."
      - id: b
        text: "Sample after lowering a positive temperature."
        correct: false
        feedback: "A lower positive temperature concentrates probability on higher scores, but lower-scoring tokens can still be drawn."
      - id: c
        text: "Choose with greedy decoding."
        correct: true
        feedback: "Greedy decoding chooses the highest-scoring token."
    solution: "Greedy decoding chooses the highest-scoring token. Sampling at a positive temperature can select a lower-scoring token."
  - id: pd-recall-temperature-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: pd-temperature
    difficulty: 1
    est_minutes: 0.5
    prompt: "A model has two vocabulary tokens with logits $z_1$ and $z_2$. Write the probability of token 1 at positive temperature $\\tau$. Type `z1`, `z2` and `tau`, and use `exp(...)` for powers of $e$."
    answer: "exp(z1/tau)/(exp(z1/tau)+exp(z2/tau))"
    variables: { z1: [-2, 2], z2: [-2, 2], tau: [0.3, 3] }
    solution: "Divide both logits by $\\tau$, exponentiate, then divide token 1's weight by the sum: $\\frac{e^{z_1/\\tau}}{e^{z_1/\\tau}+e^{z_2/\\tau}}$."
