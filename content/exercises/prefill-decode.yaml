  - id: pd-sample-loop
    dimension: implementation
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: |
      A sampling loop visits tokens A, B and C in that order, with probabilities 0.25, 0.5 and 0.25. The list `distribution` holds those token-probability pairs. Let `u` be the random draw and `total` be the running sum of probabilities. At a boundary between two tokens, the draw belongs to the later token in that order: 0.25 belongs to B and 0.75 belongs to C.

      ```python
      total = 0
      for token, probability in distribution:
          total += probability
          if ...:
              return token
      ```

      Which condition implements the random draw for any `u` from 0 up to, but excluding, 1?
    options:
      - id: a
        text: "`probability > u`"
        correct: false
        feedback: This tests each token's own width and can miss a draw that falls inside its interval.
      - id: b
        text: "`total > u`"
        correct: true
        feedback: If the draw equals the total, the loop moves to the next token.
      - id: c
        text: "`total < u`"
        correct: false
        feedback: This accepts a token whose interval already ended before the draw.
      - id: d
        text: "`total >= u`"
        correct: false
        feedback: At an exact boundary this picks the token whose interval ends there. The next token's interval starts there.
    solution: Return the first token for which the running total exceeds the draw. At 0.25 the loop skips A and returns B, whose total reaches 0.75.
