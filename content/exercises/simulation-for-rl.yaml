  - id: sim-recall-to-real-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: sim-to-real
    difficulty: 3
    est_minutes: 0.5
    prompt: "A simulator picks one of two floor settings with equal chance at every reset. The robot attempts exactly one jump per episode. Success gives an episode total of $9$; otherwise the jump fails and the total is $-10$. Write the expected total reward. Use `a` for the jump's chance of success under the first setting and `b` for its chance under the second setting. Type `*` for multiplication and `/` for division."
    answer: "(9*a - 10*(1-a) + 9*b - 10*(1-b))/2"
    variables: { a: [0, 1], b: [0, 1] }
    solution: "Success and failure are the only outcomes, so their chances add to 1. The overall success chance is $(a+b)/2$ and the failure chance is $1-(a+b)/2$. Weight the totals $9$ and $-10$ by those chances to get $19(a+b)/2-10$."
  - id: sim-loop-stale-state
    dimension: implementation
    type: mc
    role: review
    difficulty: 2
    est_minutes: 1
    prompt: |
      In a corridor simulator `env`, the robot starts in cell 1, the goal is cell 4, and each episode lasts at most five steps. The function `policy` takes a state and returns an action. It chooses right in cell 1 and left in cell 2. The first step moves the robot to cell 2, but this loop chooses right again on the second iteration.

      The variable `state` starts with the cell returned by `env.reset()`. Each call to `env.step(action)` returns the cell after the action (`next_state`), the reward for that step, and two flags: `terminated` for reaching the goal and `truncated` for hitting the time limit. The variable `total` holds the sum of the rewards so far.

      ```python
      state = env.reset()
      total = 0
      while True:
          action = policy(state)
          next_state, reward, terminated, truncated = env.step(action)
          total += reward
          if terminated or truncated:
              break
      ```

      Which line should go after `total += reward` to fix the loop?
    options:
      - id: a
        text: "`next_state = state`"
        correct: false
        feedback: This overwrites the returned state and leaves the policy's input at the start state.
      - id: b
        text: "`state = env.reset()`"
        correct: false
        feedback: This would restart the episode on every iteration and put the robot back at the start.
      - id: c
        text: "`state = next_state`"
        correct: true
        feedback: On the next iteration, the policy reads cell 2 and chooses left.
    solution: Assign the state returned by step to the variable that the policy reads at the top of the loop.
  - id: sim-vector-log-after-finish
    dimension: implementation
    type: mc
    role: review
    difficulty: 3
    est_minutes: 2
    prompt: |
      A vectorised warehouse simulator runs several copies. An episode ends only when the robot reaches its goal. In next-step reset mode, a copy resets on the call after its episode ends. The training code sends one action per copy on each call to `step` and decides which copies produced a transition to save. For each copy it has two true-or-false flags:

      - `terminated_before` tells whether the robot reached its goal on the previous call. It starts as false on the first call.
      - `terminated_now` tells whether the robot reached its goal on the current call.

      Which condition should make the code skip saving a transition for that copy?
    options:
      - id: a
        text: "`terminated_now`"
        correct: false
        feedback: The action that finished the episode still produced a transition to save.
      - id: b
        text: "`terminated_before`"
        correct: true
        feedback: That copy reached the goal on the previous call, so this call only resets it.
      - id: c
        text: "`terminated_before or terminated_now`"
        correct: false
        feedback: This also skips the transition that reaches the goal on the current call. The reset happens on the following call.
    solution: In next-step reset mode, a copy that finished on the previous call only resets on the current one. Its action is ignored, so that copy produces no transition on this call.
