    difficulty: 2
    est_minutes: 0.5
    prompt: "A simulator attempts two moves away from walls on a slippery floor. Each move works with probability $p$ and otherwise slips, leaving the robot in place. The draws are independent. Write the probability of one slip and one success, in either order."
    answer: "2*p*(1-p)"
    variables: { p: [0.05, 0.95] }
