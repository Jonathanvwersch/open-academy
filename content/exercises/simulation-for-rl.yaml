      - answer: "p*(1-p)"
        category: incorrect_reasoning
        feedback: The slip can come first or second, so add the chances of both orders.
    solution: "Slip then success has chance $(1-p)p$, and success then slip has $p(1-p)$, so the total is $2p(1-p)$."
