  - id: pg-recall-score-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: pg-score
    difficulty: 1
    est_minutes: 0.5
    prompt: "A policy has one parameter $\\theta$, and the slope of its score $J$ at $\\theta$ is $g$. With learning rate $\\eta$, write the new parameter after one gradient-ascent step. Type `theta` for $\\theta$ and `eta` for $\\eta$."
    answer: "theta + eta*g"
