    est_minutes: 1
    prompt: In one or two sentences, what does the log-derivative trick say, and why does it let an agent estimate the slope of its score by trying actions?
    rubric:
      - id: trick
        criterion: "State the trick, $\\nabla_\\theta\\pi_\\theta(a)=\\pi_\\theta(a)\\,\\nabla_\\theta\\ln\\pi_\\theta(a)$."
        weight: 1
        required: true
      - id: average
        criterion: "Explain that it weights each term by its own probability, so the slope becomes an expected value, $E\\big[G\\,\\nabla_\\theta\\ln\\pi_\\theta(a)\\big]$, which is estimated by averaging $G\\,\\nabla_\\theta\\ln\\pi_\\theta(a)$ over tries."
        weight: 1
        required: true
      - id: single
