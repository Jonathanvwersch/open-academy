    difficulty: 2
    est_minutes: 0.5
    prompt: "One pull returns $G$, the baseline is $b$, and the pulled action's slope $\\nabla_\\theta\\ln\\pi_\\theta(a)$ is $d$. With learning rate $\\eta$, write the new parameter after one REINFORCE step from $\\theta$. Type `theta` for $\\theta$ and `eta` for $\\eta$."
    answer: "theta + eta*(G - b)*d"
    variables: { theta: [-3, 3], eta: [0.01, 0.5], G: [-10, 15], b: [-5, 12], d: [-1, 1] }
    common_wrong:
      - answer: "theta + eta*(b - G)*d"
        category: math_error
        feedback: The baseline is subtracted from the return, so the factor is $G-b$.
      - answer: "theta - eta*(G - b)*d"
        category: misapplied_technique
        feedback: Subtracting is gradient descent. REINFORCE adds the step to raise the score.
    solution: "$\\theta_{\\text{new}}=\\theta+\\eta\\,(G-b)\\,d$."
