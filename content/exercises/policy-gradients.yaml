        weight: 1
    exemplar: "The trick says $\\nabla_\\theta\\pi_\\theta(a)=\\pi_\\theta(a)\\,\\nabla_\\theta\\ln\\pi_\\theta(a)$. Then every term of the slope is weighted by its action's probability, so the slope is the average of $G\\,\\nabla_\\theta\\ln\\pi_\\theta(a)$ over the actions the policy picks."
  - id: pg-recall-log-trick-contrast
    dimension: conceptual
    type: mc
    role: recall
