concept: pid-control
exercises:
  - id: dx-rb-4
    dimension: conceptual
    type: mc
    role: diagnostic
    difficulty: 3
    est_minutes: 2
    prompt: "A robot joint holding a load against gravity uses a proportional-only controller. It settles, but always slightly below the target angle. Which change most directly removes this steady-state error?"
    options:
      - { id: a, text: "Add an integral term", correct: true }
      - {
          id: b,
          text: "Add a derivative term",
          correct: false,
          category: misapplied_technique,
          feedback: "The derivative term damps motion; at steady state the error is constant, so its derivative is zero and the D term contributes nothing.",
        }
      - {
          id: c,
          text: "Reduce the proportional gain",
          correct: false,
          category: incorrect_reasoning,
          feedback: "A smaller gain needs an even larger error to produce the torque that balances gravity.",
        }
      - { id: d, text: "Sample the sensor faster", correct: false, category: incorrect_reasoning }
    solution: "With P-only control, holding against gravity needs a non-zero torque, which needs a non-zero error. The integral term accumulates that persistent error and supplies the holding torque, driving the error to zero."
