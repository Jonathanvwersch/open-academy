concept: supervised-learning
exercises:
  - id: sl-inputs-targets-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is supervised learning?"
    options:
      - {
          id: a,
          text: "Learning from input examples paired with known targets.",
          correct: true,
          feedback: "Known targets let the model compare predictions with answers and fit its parameters.",
        }
      - {
          id: b,
          text: "Grouping examples by similarity without using known targets.",
          correct: false,
          feedback: "That describes unsupervised clustering.",
        }
      - {
          id: c,
          text: "Learning by trial and error, guided by a reward score.",
          correct: false,
          feedback: "That is reinforcement learning: it learns from rewards, not from known correct answers.",
        }
      - {
          id: d,
          text: "Writing a fixed rule that maps inputs to outputs by hand.",
          correct: false,
          feedback: "Supervised learning fits from examples rather than hand-writing the mapping.",
        }
    solution: "Supervised learning uses example pairs of inputs and known targets to learn a mapping from inputs to targets."
  - id: sl-measuring-error-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does a squared-error loss measure?"
    options:
      - {
          id: a,
          text: "The absolute distance between a prediction and target before any averaging is performed.",
          correct: false,
          feedback: "That is absolute error, not squared error.",
        }
      - {
          id: b,
          text: "The squared difference between a model's prediction and its known target value.",
          correct: true,
          feedback: "Squaring the prediction-minus-target difference makes either sign contribute a positive score.",
        }
      - {
          id: c,
          text: "The largest error among all of the model's predictions on the training examples.",
          correct: false,
          feedback: "That is the single worst miss. Squared error scores each prediction on its own: the square of prediction minus target.",
        }
      - {
          id: d,
          text: "The number of predictions that were too high minus the number that were too low.",
          correct: false,
          feedback: "That counts directions of misses and ignores their size; squared error measures how far each prediction is from its target.",
        }
    solution: "Squared-error loss measures the squared difference between a model prediction and its target."
  - id: sl-training-loss-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is mean squared error?"
    options:
      - {
          id: a,
          text: "The mean of squared prediction errors across examples.",
          correct: true,
          feedback: "Squaring each miss before averaging prevents opposite errors from cancelling.",
        }
      - {
          id: b,
          text: "The square of the average prediction error across the examples.",
          correct: false,
          feedback: "That squares the signed mean error; MSE instead squares each error before averaging.",
        }
      - {
          id: c,
          text: "The largest single squared prediction error among all examples.",
          correct: false,
          feedback: "That is the maximum squared error, not the average across examples.",
        }
      - {
          id: d,
          text: "The average of the absolute prediction errors across the examples.",
          correct: false,
          feedback: "It averages the sizes of errors instead of their squares, so it does not describe MSE.",
        }
    solution: "Mean squared error is the average of the squared prediction errors over the examples."
  - id: sl-new-data-targets-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does regression predict, compared with classification?"
    options:
      - {
          id: a,
          text: "Regression predicts a category, while classification predicts a number.",
          correct: false,
          feedback: "Those prediction types are reversed.",
        }
      - {
          id: b,
          text: "Regression predicts a number, while classification labels a number as a category.",
          correct: false,
          feedback: "Classification predicts a category, not a rounded numeric value.",
        }
      - {
          id: c,
          text: "Regression predicts a number, while classification predicts a category.",
          correct: true,
          feedback: "The target type defines the task: regression predicts numbers and classification predicts categories.",
        }
      - {
          id: d,
          text: "Regression predicts only for training examples, while classification predicts for new inputs.",
          correct: false,
          feedback: "Both task types can make predictions on new inputs.",
        }
    solution: "Regression predicts a number, while classification predicts a category."
  - id: sl-check-target
    dimension: conceptual
    type: mc
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: "An electricity supplier must plan how much power to provide tomorrow. Today its customers use 500 megawatts, a unit of power. It trains a model to predict tomorrow's demand from today's demand, temperature and day of the week. What is the **target**?"
    options:
      - { id: a, text: "Tomorrow's demand in megawatts", correct: true }
      - {
          id: b,
          text: "Today's temperature",
          correct: false,
          category: misunderstood_definition,
          feedback: "That is an input: information available before making the prediction.",
        }
      - {
          id: c,
          text: "The mean squared error",
          correct: false,
          category: misunderstood_definition,
          feedback: "That is the loss.",
        }
      - {
          id: d,
          text: "The model's weights",
          correct: false,
          category: misunderstood_definition,
          feedback: "Weights are adjustable settings learned during training, not the outcome the supplier is asking the model to predict. Separate the desired future quantity from the parameters used to produce it.",
        }
    solution: "The target is what we want to predict: tomorrow's demand. This is a regression problem."
  - id: dx-ml-1
    dimension: conceptual
    type: mc
    role: diagnostic
    difficulty: 1
    est_minutes: 1
    prompt: "A human controls a robot arm and records 100 camera images together with the movement commands sent to the arm. A model learns to predict those commands from each image so that the robot can repeat the task. In supervised learning, what are the recorded movement commands?"
    options:
      - { id: a, text: "The targets (labels)", correct: true }
      - { id: b, text: "The inputs", correct: false, category: misunderstood_definition }
      - {
          id: c,
          text: "The reward",
          correct: false,
          category: misunderstood_definition,
          feedback: "The examples provide the actions to copy, not scores for how well the robot performed. The recorded actions are targets.",
        }
      - { id: d, text: "The model parameters", correct: false, category: misunderstood_definition }
    solution: "The camera images are the inputs. The human's recorded movement commands are the targets that the model learns to predict."
  - id: sl-classify-vs-regress
    dimension: conceptual
    type: mc
    role: core
    difficulty: 1
    est_minutes: 1
    multi: true
    prompt: "Which of these are **classification** problems? (Select all that apply.)"
    options:
      - { id: a, text: "Deciding whether an email is spam", correct: true }
      - {
          id: b,
          text: "Predicting how far a robot gripper moves to the right, in metres",
          correct: false,
          category: misunderstood_definition,
          feedback: "The target is a measured distance rather than a category, so this is regression.",
        }
      - { id: c, text: "Choosing which of 10 objects is in an image", correct: true }
      - {
          id: d,
          text: "Predicting the remaining battery life in minutes",
          correct: false,
          category: misunderstood_definition,
          feedback: "Battery life in minutes is a measured quantity rather than a category label. Classify tasks by the form of the output, not by the fact it is a prediction.",
        }
    solution: "Spam status and object identity are category labels, so predicting them is classification. Position and battery life are numerical measurements, so predicting them is regression."
  - id: sl-review-ingredients
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: A house-price model has average squared loss 200 with one set of settings and 1700 with another, on the same past sales. What does training choose in supervised learning?
    options:
      - id: a
        text: The model parameters that minimise the average loss on the training data
        correct: true
        feedback: Training adjusts the settings, so the setting with average loss 200 beats the one with 1700.
      - id: b
        text: The targets that minimise the average loss on the training data
        correct: false
        category: misunderstood_definition
        feedback: Targets are the observed outcomes in the past sales, not values chosen by training. Training adjusts the model settings to reduce loss against those outcomes.
      - id: c
        text: The loss function that gives the smallest average on the training data
        correct: false
        category: misunderstood_definition
        feedback: The loss is chosen by the engineer before training; training then picks the settings that make it small.
    solution: Training chooses the adjustable model settings that make the average loss on the known examples as small as possible. Here the settings with average loss 200 fit the sales better than those with loss 1700.
  - id: sl-explain-setup
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "A delivery company has records of $5000$ journeys and wants to predict delivery time in minutes. Explain which inputs it could use, what the training target is, and how to score a prediction's error."
    rubric:
      - id: r1
        criterion: Identify inputs available when making a prediction, such as distance and time of day.
        weight: 1
        required: true
      - id: target
        criterion: Identify the recorded delivery time in minutes as the training target.
        weight: 1
        required: true
      - id: r2
        criterion: Choose a loss suited to predicting minutes, such as squared prediction error.
        weight: 1
        required: true
    exemplar: "Use inputs available when predicting, such as distance and time of day. The training target is the recorded delivery time in minutes. Squared prediction error scores how far the predicted minutes are from the recorded minutes."
  - id: slp-predict
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A house has size ${{=size}}$ m² and ${{=bedrooms}}$ bedrooms. The model is $\\hat y=w_1\\times\\text{size}+w_2\\times\\text{bedrooms}+b$, with $w_1={{=w1}}$, $w_2={{=w2}}$, and $b={{=b}}$. What price does it predict, in thousands?"
    hints: ["Substitute each value into the model, then add the three terms."]
    solution: "Substitute the values: ${{=w1}}\\times{{=size}} + {{=w2}}\\times{{=bedrooms}} + {{=b}} = {{=w1 * size + w2 * bedrooms + b}}$ thousand."
    answer_expr: "w1 * size + w2 * bedrooms + b"
    params:
      w1: { min: 1, max: 5 }
      w2: { min: 5, max: 25, step: 5 }
      b: { min: 0, max: 100, step: 10 }
      size: { min: 50, max: 150, step: 10 }
      bedrooms: { min: 1, max: 5 }
    tolerance: { abs: 0.000001 }
    common_wrong:
      - {
          answer_expr: "w1 * size + b",
          category: math_error,
          feedback: "Include the bedroom term too: $w_2\\times\\text{bedrooms}$.",
        }
  - id: slp-why-targets
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "We collect 100 past house sales, recording each house's size, bedroom count and sale price. Why do we need the known prices as well as the house details to train this supervised model?"
    options:
      - {
          id: a,
          text: "They let us measure prediction mistakes and compare parameter settings",
          correct: true,
        }
      - id: b
        text: "The model needs the true sale price as an input when pricing a new house"
        correct: false
        category: misunderstood_definition
        feedback: "The sale price is the answer to predict, not an input available for a new house."
      - id: c
        text: "Each known price is one of the model's adjustable parameters"
        correct: false
        category: misunderstood_definition
        feedback: "Prices are targets in the data. The adjustable parameters are the model's weights and bias."
      - id: d
        text: "Targets can be replaced by the model's own guesses without changing how we judge it"
        correct: false
        category: incorrect_reasoning
        feedback: "Comparing guesses with themselves gives no evidence of whether they match actual sales."
    solution: "Known targets supply the answers against which predictions are checked. Without them, this setup cannot tell which settings fit the observed sales better."
  - id: slp-input-target
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: "A shop received 50 orders today and needs to plan tomorrow's staffing. A model predicts tomorrow's number of orders from today's temperature and whether it is a weekday. What is the target?"
    options:
      - { id: a, text: "Tomorrow's number of orders", correct: true }
      - {
          id: b,
          text: "Today's temperature",
          correct: false,
          category: misunderstood_definition,
          feedback: "Temperature is available to the model before it predicts and helps it form the estimate. Ask which value the model is meant to produce for tomorrow.",
        }
      - {
          id: c,
          text: "Whether it is a weekday",
          correct: false,
          category: misunderstood_definition,
          feedback: "Weekday status is another input that helps make the prediction, not the value being predicted. Look for the answer the staffing plan needs.",
        }
      - {
          id: d,
          text: "The model's adjustable settings",
          correct: false,
          category: misunderstood_definition,
          feedback: "Adjustable settings are learned by the model, not the quantity it returns for staffing. Separate model parameters from the prediction target.",
        }
    solution: "The target is the answer the model is being trained to predict: tomorrow's number of orders. Today's temperature and weekday status are inputs."
  - id: slp-parameters
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A model estimates the price of a 100 m², two-bedroom house using $\\hat y=w_1\\times\\text{size}+w_2\\times\\text{bedrooms}+b$. What does $\\theta$ stand for?"
    options:
      - { id: a, text: "The adjustable numbers $w_1$, $w_2$ and $b$", correct: true }
      - {
          id: b,
          text: "The house's size and bedroom count",
          correct: false,
          category: misunderstood_definition,
          feedback: "Size and bedroom count describe the house and serve as inputs to this model. The symbol $\\theta$ refers to something the training process can adjust.",
        }
      - {
          id: c,
          text: "The price the house actually sold for",
          correct: false,
          category: misunderstood_definition,
          feedback: "The sold price is the observed outcome the model learns to estimate, not a setting it changes. Look for the symbols that control the formula.",
        }
      - {
          id: d,
          text: "The number of past sales",
          correct: false,
          category: misunderstood_definition,
          feedback: "Past sales are examples used to train the model, not its adjustable values. Think about which parts of the formula determine predictions.",
        }
    solution: "$\\theta$ names the model's adjustable parameters. Here those are $w_1$, $w_2$ and $b$."
  - id: slp-squared-error
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A house sold for {{=target}} thousand and the model predicted {{=prediction}} thousand. What is its squared error?"
    hints: ["Subtract the target from the prediction, then square the difference."]
    solution: "The error is ${{=prediction}}-{{=target}}={{=prediction-target}}$. Squaring gives $({{=prediction-target}})^2={{=(prediction-target)^2}}$."
    answer_expr: "(prediction - target)^2"
    params:
      prediction: { min: 10, max: 120, step: 10 }
      target: { min: 0, max: 100, step: 10 }
    constraints: ["prediction != target"]
    tolerance: { abs: 0.000001 }
  - id: slp-error-sum
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Three signed prediction errors are $({{=e1}})$, $({{=e2}})$, and $({{=e3}})$. Their signed sum is 0. What is the sum of their squared errors?"
    hints: ["First add the signed errors. Then square each error and add those squares."]
    solution: "The errors are $({{=e1}})$, $({{=e2}})$, and $({{=e3}})$. Their squares are $({{=e1}})^2={{=e1^2}}$, $({{=e2}})^2={{=e2^2}}$, and $({{=e3}})^2={{=e3^2}}$. Their sum is ${{=e1^2+e2^2+e3^2}}$. Squaring keeps positive and negative errors from cancelling."
    answer_expr: "e1^2 + e2^2 + e3^2"
    params:
      e1: { min: -20, max: 20, step: 5 }
      e2: { min: -20, max: 20, step: 5 }
      e3: { min: -20, max: 20, step: 5 }
    constraints: ["e1 + e2 + e3 == 0", "e1 != 0"]
    tolerance: { abs: 0.000001 }
  - id: slp-why-square
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Why use squared errors instead of simply averaging signed errors?"
    options:
      - {
          id: a,
          text: "Positive and negative errors can cancel, even when every prediction is wrong",
          correct: true,
        }
      - {
          id: b,
          text: "Squaring keeps the sign, so overestimates still cancel underestimates",
          correct: false,
          category: misunderstood_definition,
          feedback: "Both positive and negative errors have non-negative squares, so their squared contributions cannot cancel.",
        }
      - {
          id: c,
          text: "A zero average signed error means every prediction is correct",
          correct: false,
          category: misunderstood_definition,
          feedback: "Errors of +10 and −10 average to zero even though both predictions are wrong.",
        }
      - {
          id: d,
          text: "Averaging signed errors already measures the typical size of a miss",
          correct: false,
          category: misunderstood_definition,
          feedback: "A signed average measures the balance of overestimates and underestimates, not their sizes.",
        }
    solution: "A prediction that is too high has a positive error and one that is too low has a negative error. Their signed sum can be zero by cancellation. Squaring makes each contribution non-negative."
  - id: slp-why-square-not-absolute
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "A pricing mistake of 20 thousand pounds can be much more damaging than one of 10 thousand. Why choose squared rather than absolute errors if we want the larger mistake to count more than twice as much?"
    options:
      - {
          id: a,
          text: "Doubling the error multiplies its squared loss by four, but only doubles its absolute loss",
          correct: true,
        }
      - id: b
        text: "Absolute errors let positive and negative misses cancel"
        correct: false
        category: misunderstood_definition
        feedback: "Absolute errors are non-negative too. Both choices stop cancellation."
      - id: c
        text: "Squaring makes large misses count less than small ones"
        correct: false
        category: incorrect_reasoning
        feedback: "An error of 20 contributes 400, while an error of 10 contributes 100. The larger error therefore counts four times as much."
      - id: d
        text: "Squared error is always the right loss, regardless of the task"
        correct: false
        category: incorrect_reasoning
        feedback: "The choice depends on which mistakes matter. Here we want a very large pricing error to count much more heavily than a small one, which squaring achieves."
    solution: "For errors of 10 and 20, absolute losses are 10 and 20, while squared losses are 100 and 400. The larger mistake is twice as large, but contributes four times as much squared loss."
  - id: slp-why-average
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "The house-price model has total squared error 600 on three sales. Why divide by three to report average loss 200 rather than report only the total?"
    options:
      - {
          id: a,
          text: "The average measures loss per house, so repeating the same dataset does not inflate it",
          correct: true,
        }
      - id: b
        text: "Dividing guarantees zero loss on new houses"
        correct: false
        category: incorrect_reasoning
        feedback: "Division changes the scale of the reported loss, not the predictions on new houses."
      - id: c
        text: "Averaging removes the largest mistakes from the calculation"
        correct: false
        category: misunderstood_definition
        feedback: "Every squared error remains in the sum before division; large mistakes still contribute."
      - id: d
        text: "On the same dataset, averaging selects different best settings from summing"
        correct: false
        category: incorrect_reasoning
        feedback: "Every setting's total is divided by the same positive number, so their ordering stays the same."
    solution: "Repeating all three sales doubles both the total squared error and the number of houses. The average stays 200 for Setting A: it measures loss per house, not dataset size."
  - id: slp-average-mse
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A house-price model predicts {{=p1}} thousand for a house that sold for {{=y1}} thousand, {{=p2}} thousand for one that sold for {{=y2}} thousand, and {{=p3}} thousand for one that sold for {{=y3}} thousand. What is its mean squared error across the three houses?"
    hints: ["Square each prediction error, add the three results, and divide by 3."]
    solution: "The squared errors are $({{=p1-y1}})^2={{=(p1-y1)^2}}$, $({{=p2-y2}})^2={{=(p2-y2)^2}}$, and $({{=p3-y3}})^2={{=(p3-y3)^2}}$. Their sum is ${{=(p1-y1)^2+(p2-y2)^2+(p3-y3)^2}}$. Divide by 3: ${{=(p1-y1)^2+(p2-y2)^2+(p3-y3)^2}}\\div3={{=((p1-y1)^2+(p2-y2)^2+(p3-y3)^2)/3}}$."
    answer_expr: "((p1-y1)^2 + (p2-y2)^2 + (p3-y3)^2) / 3"
    params:
      p1: { min: 0, max: 100, step: 10 }
      y1: { min: 0, max: 100, step: 10 }
      p2: { min: 0, max: 100, step: 10 }
      y2: { min: 0, max: 100, step: 10 }
      p3: { min: 0, max: 100, step: 10 }
      y3: { min: 0, max: 100, step: 10 }
    constraints: ["mod((p1-y1)^2 + (p2-y2)^2 + (p3-y3)^2, 3) == 0"]
    tolerance: { abs: 0.000001 }
  - id: slp-fixed-squared-error
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: Working in hundreds of thousands of pounds, a house-price model predicts 7 for a house that sold for 5. What is its squared error?
    answer: 4
    tolerance:
      abs: 1.0e-06
    solution: The error is 7 − 5 = 2. Squaring it gives 2² = 4.
  - id: slp-argmin
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: We compare settings for a house-price model by their average squared error on past sales. In the training formula, what does $\arg\min_\theta$ ask us to find?
    options:
      - id: a
        text: The value of $\theta$ that makes the average loss as small as possible
        correct: true
        feedback: $\arg\min_\theta$ names the setting that gives the smallest loss.
      - id: b
        text: The smallest value that the average loss can reach for any $\theta$
        correct: false
        category: misunderstood_definition
        feedback: That is $\min_\theta$, the size of the smallest loss. $\arg\min_\theta$ asks for the setting that achieves it.
      - id: c
        text: The value of $\theta$ that makes every house's error exactly zero
        correct: false
        category: misunderstood_definition
        feedback: Usually no setting fits every house exactly; argmin picks the setting with the smallest average loss, even if that loss is above zero.
      - id: d
        text: The smallest of the adjustable numbers $w_1$, $w_2$ and $b$ in $\theta$
        correct: false
        category: misunderstood_definition
        feedback: Argmin compares settings by the loss they give, not by the sizes of the parameters themselves.
    solution: $\arg\min_\theta$ asks for the adjustable settings that make the following average loss as small as possible. It names the settings, not the size of the loss.
  - id: slp-best-setting
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: Four houses are priced by two settings of a model, in thousands of pounds. Setting A's errors are $+10$, $-10$, $+10$ and $-10$. Setting B's errors are $0$, $0$, $0$ and $+30$. Using mean squared error, which setting fits these sales better?
    options:
      - id: a
        text: Setting A, because its mean squared error is 100 against 225
        correct: true
        feedback: A's squared errors are all 100, so its MSE is 100; B's are 0, 0, 0 and 900, so its MSE is 225.
      - id: b
        text: Setting B, because it prices three of the four houses exactly
        correct: false
        category: incorrect_reasoning
        feedback: MSE averages the squared error over every house, so B's one miss of 30 adds 900 and outweighs its three exact prices.
      - id: c
        text: Setting B, because its misses add up to 30 against A's 40
        correct: false
        category: misapplied_technique
        feedback: That compares absolute errors. Squaring makes B's single miss of 30 count as 900, more than A's four misses of 100 each.
      - id: d
        text: They fit equally well, because each setting's largest miss is a multiple of 10
        correct: false
        category: incorrect_reasoning
        feedback: The size of the largest miss does not settle the fit; work out each setting's average squared error.
    solution: Setting A's MSE is $(100+100+100+100)/4=100$. Setting B's is $(0+0+0+900)/4=225$. The smaller MSE, Setting A, fits better, because squaring makes B's one large miss count heavily.
  - id: slp-new-houses
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "We choose a house-price model's settings using 100 past sales. Why test it on 20 other sales that did not help choose those settings?"
    options:
      - {
          id: a,
          text: "To check whether it predicts well for new houses, not only past examples",
          correct: true,
        }
      - {
          id: b,
          text: "Because a small training loss guarantees a small loss on new sales",
          correct: false,
          category: misunderstood_definition,
          feedback: "Fitting known answers does not guarantee good predictions for houses the model has not seen.",
        }
      - {
          id: c,
          text: "Because testing on the training sales gives an independent check",
          correct: false,
          category: misunderstood_definition,
          feedback: "Those sale prices already helped choose the model's settings. Using different sales checks whether it can predict answers that did not help choose those settings.",
        }
      - {
          id: d,
          text: "Because the test sale prices should also be used to adjust the settings before measuring their loss",
          correct: false,
          category: misunderstood_definition,
          feedback: "Then those answers would also influence the model, defeating the purpose of testing on unused sales.",
        }
    solution: "The aim is to price houses the model has not seen. A model can fit past sales well but still predict new houses badly."
  - id: slp-regression-classification
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Which task is regression rather than classification?"
    options:
      - { id: a, text: "Predicting a house's sale price in pounds", correct: true }
      - {
          id: b,
          text: "Predicting whether an email is spam",
          correct: false,
          category: misunderstood_definition,
          feedback: "Spam status is a category label rather than a measured amount. Decide whether each task predicts a number or selects a class.",
        }
      - {
          id: c,
          text: "Predicting which of three labels applies to a photo",
          correct: false,
          category: misunderstood_definition,
          feedback: "Choosing a photo label predicts which category applies; the number of possible labels does not turn it into regression. Focus on the kind of output.",
        }
      - {
          id: d,
          text: "Choosing between the labels yes and no",
          correct: false,
          category: misunderstood_definition,
          feedback: "Choosing yes or no is still selecting a category, even with only two labels. The number of possible labels does not determine regression versus classification.",
        }
    solution: "Regression predicts a number such as a sale price. Classification predicts a category or label."
  - id: slp-target-type-travel
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: A travel app uses a journey's distance, the weather (sunny, rainy or snowy) and the time of day to predict how long the journey will take, rounded to the nearest minute. Is this regression or classification?
    options:
      - id: a
        text: Regression, because the target is an amount of time that can take many values
        correct: true
        feedback: The output is a measured amount, so this is regression, even though the inputs include a category.
      - id: b
        text: Classification, because the weather input is one of three categories
        correct: false
        category: misunderstood_definition
        feedback: The task type depends on the target, not the inputs. Here the target is a journey time.
      - id: c
        text: Classification, because rounding to whole minutes makes each time a category
        correct: false
        category: misunderstood_definition
        feedback: Rounding changes the precision of a number but it is still an amount; 26 minutes is more than 25.
      - id: d
        text: Regression, because the distance and time of day are numbers
        correct: false
        category: incorrect_reasoning
        feedback: Numeric inputs don't make a task regression; it's regression because the target is a number.
    solution: The target is a journey time in minutes, an amount, so this is regression. The task type is decided by the target, whatever the inputs look like.
  - id: slp-target-type-parcel
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: A delivery service uses a parcel's weight in kilograms and its distance in kilometres to predict whether it will arrive on time or late. What kind of prediction task is this?
    options:
      - id: a
        text: Classification, because the target is one of two outcomes, on time or late
        correct: true
        feedback: On time and late are categories, so predicting which one applies is classification.
      - id: b
        text: Regression, because the weight and distance inputs are numbers
        correct: false
        category: misunderstood_definition
        feedback: The task type is decided by the target, not the inputs. Here the target is on time or late.
      - id: c
        text: Regression, because lateness depends on how many kilometres the parcel travels
        correct: false
        category: incorrect_reasoning
        feedback: The inputs can be numbers that the answer depends on, but the output is still a category.
      - id: d
        text: Classification, because the model uses exactly two inputs
        correct: false
        category: incorrect_reasoning
        feedback: The number of inputs doesn't decide the task type; the kind of target does.
    solution: The target is on time or late, which are categories, so this is classification, even though both inputs are numbers.
  - id: slp-low-training-loss
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: A model has average loss 1 on the 100 houses used to choose its settings. A family wants to price a different house. Why does the small training loss alone not show that the model will help them?
    options:
      - id: a
        text: It may have fitted those 100 houses closely and still predict other houses poorly
        correct: true
        feedback: Training loss only measures houses used to choose the settings, so new houses need their own check.
      - id: b
        text: Nothing is missing, because the loss on a new house will also be about 1
        correct: false
        category: incorrect_reasoning
        feedback: A model can fit its training houses far better than new ones, so the training loss can be much lower than the loss on new houses.
      - id: c
        text: The loss will be even smaller on new houses, because 100 houses is plenty of data
        correct: false
        category: incorrect_reasoning
        feedback: Nothing makes the loss on new houses smaller than the training loss; it is usually larger.
      - id: d
        text: A loss of 1 is in squared units, so it says nothing until it is square-rooted
        correct: false
        category: incorrect_reasoning
        feedback: Squared units affect how you read the number, but the real gap is that these houses were used to choose the settings.
    solution: A model can fit its training houses well but still predict new houses badly, so we test it on houses it did not train on.
  - id: slp-recover-prediction
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A house sold for 100 thousand pounds. Its squared prediction error is
      400, and the prediction was higher than the sale price. What was the
      prediction, in thousands of pounds?
    answer: 120
    tolerance:
      abs: 0
    solution: |-
      The prediction is above the target, so take the positive error.

      $$\text{error}=\sqrt{400}=20$$

      $$\text{prediction}=100+20=120$$
  - id: slp-recover-loss
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: A model has mean squared error 10 across two houses. The squared error
      on the first house is 4. What is the squared error on the second house?
    answer: 16
    tolerance:
      abs: 0
    solution: >-
      Multiply the mean by the number of houses to recover the total, then
      subtract the known loss.


      $$\text{total squared error}=2\times10=20$$


      $$\text{second squared error}=20-4=16$$
  - id: slp-target-and-evaluation
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: A model predicts whether a house will sell above its asking price. Which
      pairing gives its task type and a suitable evaluation group?
    options:
      - id: a
        text: Classification; sales not used to choose its settings
        correct: true
      - id: b
        text: Regression; sales not used to choose its settings
        correct: false
        feedback: Above asking or not is a category target, not a numerical price.
      - id: c
        text: Classification; only sales used to choose its settings
        correct: false
        feedback: The task is classification, but evaluation should check sales not used
          to choose settings.
      - id: d
        text: Regression; only sales used to choose its settings
        correct: false
        feedback: The target is a category, and training sales alone do not check
          predictions on new sales.
    solution: Above asking or not is a category, so the task is classification.
      Separate sales check predictions beyond the examples used to choose
      settings.
  - id: slp-why-price-not-input
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, the model gets the size, 100 m², and predicts 350, while the sale price 370 is kept to one side. Why is the sale price not one of the model's inputs?"
    options:
      - {
          id: a,
          text: "For a house on sale today the price is unknown, so it is what the model must predict.",
          correct: true,
          feedback: "Right: an input must be known when you predict, and the price is not.",
        }
      - {
          id: b,
          text: "The price is too large a number for the model to multiply by the weight.",
          correct: false,
          feedback: "Size of the number is not the issue; any known number could be an input. Ask whether the price is known for a house on sale today.",
        }
      - {
          id: c,
          text: "The price only matters for houses bigger than 100 square metres.",
          correct: false,
          feedback: "The price is the answer for every house, whatever its size. The issue is that it is unknown when you need a prediction.",
        }
      - {
          id: d,
          text: "The price is one of the parameters that training changes.",
          correct: false,
          feedback: "The parameters are $w$ and $b$. The price is the target: known for past sales, unknown for new ones.",
        }
    solution: "An input must be available when you make a prediction. A house on sale today has no sale price yet, so the price is the target, used only to check predictions on past sales."
  - id: slp-why-add-signed
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, Setting A's errors $+10$, $-20$ and $+10$ add up to 0. Why does step 2 add the signed errors before step 3 squares them?"
    options:
      - {
          id: a,
          text: "To show that misses in opposite directions cancel, so a signed total can hide real mistakes.",
          correct: true,
          feedback: "Right: the total is 0 while every prediction is wrong, which is why the errors are squared.",
        }
      - {
          id: b,
          text: "To show that Setting A predicts every one of the three houses exactly right.",
          correct: false,
          feedback: "Every prediction misses: 290 against 280, 350 against 370, 410 against 400. The zero total comes from cancelling.",
        }
      - {
          id: c,
          text: "To find the squared error, which is the signed total multiplied by itself.",
          correct: false,
          feedback: "Squaring the total gives $0^2=0$. Squared error squares each error separately: 100, 400 and 100.",
        }
      - {
          id: d,
          text: "To find the prices, which are needed before the predictions can be made.",
          correct: false,
          feedback: "The prices are known from the sales. Step 3 checks whether a signed total is a fair score, and finds it is not.",
        }
    solution: "The signed total of $+10$, $-20$ and $+10$ is 0 even though all three predictions miss. That cancellation is the reason the lesson squares each error instead."
  - id: slp-why-every-house
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, Setting B is closer than Setting A on house 2 (error $+10$ against $-20$), yet training keeps Setting A. Why?"
    options:
      - {
          id: a,
          text: "Training compares the average loss over all the houses, and Setting A's is smaller.",
          correct: true,
          feedback: "Right: 200 against 1700. One house does not decide; the average over all of them does.",
        }
      - {
          id: b,
          text: "Training prefers the setting with the larger weight, and Setting A has $w=3$.",
          correct: false,
          feedback: "The size of $w$ is not a rule. Setting A wins because its average squared error is smaller.",
        }
      - {
          id: c,
          text: "House 2 is ignored because its error was negative rather than positive.",
          correct: false,
          feedback: "Every house counts, and squaring makes the sign irrelevant. Compare the averages: 200 and 1700.",
        }
      - {
          id: d,
          text: "Training keeps whichever setting it tried first and only changes it if it fails.",
          correct: false,
          feedback: "Training keeps the setting with the smallest average loss, whichever was tried first.",
        }
    solution: "Training scores each setting by its average loss over every example: 200 for Setting A and 1700 for Setting B. One house being closer does not outweigh Setting B's error of 70 on house 1."
  - id: slp-why-held-back
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "In the worked example, Setting A averages 200 on the three training sales and 250 on the two held-back sales. Which number tells you more about pricing houses that are for sale now?"
    options:
      - {
          id: a,
          text: "The 250, because those sales played no part in choosing $w$ and $b$.",
          correct: true,
          feedback: "Right: the held-back sales act like new houses, so their score shows how the model does on unseen houses.",
        }
      - {
          id: b,
          text: "The 200, because the training sales are the ones the model fits best.",
          correct: false,
          feedback: "Fitting best is exactly why 200 is optimistic: $w$ and $b$ were chosen to make that number small.",
        }
      - {
          id: c,
          text: "Both equally, because they use the same model and the same loss.",
          correct: false,
          feedback: "Same model and loss, but only the held-back sales were unseen while choosing $w$ and $b$.",
        }
      - {
          id: d,
          text: "Neither, because a house for sale now has no known sale price.",
          correct: false,
          feedback: "True of the new house itself, which is why you score held-back sales: they have known prices but played no part in training.",
        }
    solution: "The training score was made small on purpose, so it flatters the model. The held-back sales were not used to choose $w$ and $b$, so their score of 250 is the fair guide to new houses."
  - id: slp-recall-parts-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: sl-inputs-targets
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, what are the input and target in a supervised prediction problem?
    rubric:
      - id: input
        criterion: Explain that the input is what we know when making a prediction.
        weight: 1
        required: true
      - id: target
        criterion: Explain that the target is the answer we want, known for every example in the dataset.
        weight: 1
        required: true
    exemplar: The input is what we know when making a prediction, such as a house's size. The target is the answer we want, such as its sale price, known for each example in the dataset.
  - id: slp-recall-parts-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: sl-inputs-targets
    difficulty: 1
    est_minutes: 0.5
    prompt: A house model gives a price estimate before the house sells. What is this estimate called?
    options:
      - id: a
        text: The target $y$
        correct: false
        feedback: The target is the known answer used to compare with the estimate.
      - id: b
        text: The parameters $\theta$
        correct: false
        feedback: The parameters are adjustable numbers inside the model, such as its weight and bias.
      - id: c
        text: The prediction $\hat y$
        correct: true
        feedback: The prediction is the guess the model produces from the input.
    solution: The model turns an input into a prediction. The target supplies the answer for comparison.
  - id: slp-recall-parts-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: sl-inputs-targets
    difficulty: 1
    est_minutes: 0.5
    prompt: Write the house model's prediction for size $x$, weight $w$ and bias $b$.
    answer: w*x+b
    variables: { x: [40, 150], w: [1, 5], b: [0, 100] }
    solution: 'The prediction is $\hat y=wx+b$: multiply size by the weight and add the bias.'
  - id: slp-recall-error-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: sl-measuring-error
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, how does squared error score a prediction, and why square the error before adding scores?
    rubric:
      - id: score
        criterion: Explain that squared error is the square of the prediction minus the target.
        weight: 1
        required: true
      - id: cancelling
        criterion: Explain that squaring stops misses that are too high and too low from cancelling.
        weight: 1
        required: true
    exemplar: Squared error squares the prediction minus the target. Squaring makes both high and low misses positive, so they cannot cancel when added.
  - id: slp-recall-error-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: sl-measuring-error
    difficulty: 1
    est_minutes: 0.5
    prompt: Which score becomes four times as large when the size of a miss doubles?
    options:
      - id: a
        text: Squared error
        correct: true
        feedback: Squaring a doubled miss multiplies its score by four.
      - id: b
        text: Absolute error
        correct: false
        feedback: Absolute error drops the sign, so doubling a miss doubles its score.
      - id: c
        text: Signed error
        correct: false
        feedback: Signed error is prediction minus target; doubling a miss doubles its magnitude.
    solution: Squared error grows with the square of the miss, so doubling a miss quadruples the score.
  - id: slp-recall-error-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: sl-measuring-error
    difficulty: 1
    est_minutes: 0.5
    prompt: 'Write the squared-error loss for prediction $\hat y$ and target $y$. Use `yhat` for the prediction and `y` for the target.'
    answer: (yhat-y)^2
    variables: { yhat: [-10, 10], y: [-10, 10] }
    solution: 'Squared error is $L(\hat y,y)=(\hat y-y)^2$.'
  - id: slp-recall-training-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: sl-training-loss
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, how does training score a parameter setting across a dataset, and which setting does it seek?
    rubric:
      - id: average
        criterion: Explain that a setting is scored by averaging its losses over the examples.
        weight: 1
        required: true
      - id: smallest
        criterion: Explain that training seeks the parameters with the smallest average loss.
        weight: 1
        required: true
    exemplar: Each parameter setting gets the average of its losses across the dataset. Training seeks the setting with the smallest average loss.
  - id: slp-recall-training-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: sl-training-loss
    difficulty: 1
    est_minutes: 0.5
    prompt: When training a house model on recorded sales, which numbers can change?
    options:
      - id: a
        text: The sizes of the houses
        correct: false
        feedback: Sizes are fixed inputs in the dataset.
      - id: b
        text: The weight and the bias
        correct: true
        feedback: Training changes the parameters to lower the average loss.
      - id: c
        text: The recorded sale prices
        correct: false
        feedback: Sale prices are fixed targets used to score predictions.
    solution: Training moves the parameters while inputs and targets stay fixed.
  - id: slp-recall-training-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: sl-training-loss
    difficulty: 1
    est_minutes: 0.5
    prompt: 'Fill in the denominator that makes this the average loss over $n$ examples: $\frac{1}{\underline{\quad}}\sum_{i=1}^{n}L(f_\theta(x_i),y_i)$. Give the missing quantity in symbols or words.'
    accept:
      [
        "n",
        "number of examples",
        "the number of examples",
        "example count",
        "dataset size",
        "number of training examples",
        "the number of training examples",
      ]
    regex: '^\s*(?:\$\s*n\s*\$|n|(?:the\s+)?(?:total\s+)?number\s+of\s+(?:training\s+)?examples|(?:training\s+)?example\s+count|(?:training\s+)?dataset\s+size)\s*$'
    solution: "Divide by $n$, the number of examples, to turn the total loss into an average."
  - id: slp-recall-new-data-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: sl-new-data-targets
    difficulty: 1
    est_minutes: 1
    prompt: In one or two sentences, how are held-back examples used, and why do they give a fair guide to performance on new examples?
    rubric:
      - id: held-back
        criterion: Explain that held-back examples are scored and play no part in choosing the parameters.
        weight: 1
        required: true
      - id: new
        criterion: Explain that these examples are new to the model, like the future examples it will predict.
        weight: 1
        required: true
    exemplar: Held-back examples are only scored and play no part in choosing the model's parameters. They are new to the model, like future examples, so their score is a fair guide to its performance.
  - id: slp-recall-new-data-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: sl-new-data-targets
    difficulty: 1
    est_minutes: 0.5
    prompt: A house model has a very small loss on the sales used to choose its weights. Which score best checks its usefulness for future sales?
    options:
      - id: a
        text: Loss on sales kept out of training
        correct: true
        feedback: Held-back sales are new to the model, so they check how it handles new houses.
      - id: b
        text: Loss on the sales used for training
        correct: false
        feedback: The weights were chosen to make this loss small, so it flatters the model.
      - id: c
        text: Loss on the closest training sale
        correct: false
        feedback: A single familiar sale gives even less evidence about performance on new houses.
    solution: Score sales kept back from choosing the weights to check performance on new houses.
  - id: slp-recall-new-data-contrast2
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: sl-new-data-targets
    difficulty: 1
    est_minutes: 0.5
    prompt: A model predicts whether a house will sell above its asking price, giving yes or no. What kind of task is this?
    options:
      - id: a
        text: Regression
        correct: false
        feedback: Regression predicts a number, such as the sale price.
      - id: b
        text: Classification
        correct: true
        feedback: Classification predicts a category from a fixed list, here yes or no.
      - id: c
        text: Reinforcement learning
        correct: false
        feedback: Reinforcement learning improves actions through trial and error with rewards.
    solution: Yes and no are categories, so predicting which one applies is classification.
