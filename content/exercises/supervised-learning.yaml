concept: supervised-learning
exercises:
  - id: sl-inputs-targets-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is supervised learning?"
    options:
      - {
          id: a,
          text: "Learning from input examples paired with known targets.",
          correct: true,
          feedback: "Known targets let the model compare predictions with answers and fit its parameters.",
        }
      - {
          id: b,
          text: "Grouping examples by similarity without using known targets.",
          correct: false,
          feedback: "That describes unsupervised clustering.",
        }
      - {
          id: c,
          text: "Choosing a model by checking its final test-set score repeatedly.",
          correct: false,
          feedback: "Repeated test-set selection leaks information from the test set.",
        }
      - {
          id: d,
          text: "Writing a fixed rule that maps inputs to outputs by hand.",
          correct: false,
          feedback: "Supervised learning fits from examples rather than hand-writing the mapping.",
        }
    solution: "Supervised learning uses example pairs of inputs and known targets to learn a mapping from inputs to targets."
  - id: sl-measuring-error-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does a squared-error loss measure?"
    options:
      - {
          id: a,
          text: "The absolute distance between a prediction and target before any averaging is performed.",
          correct: false,
          feedback: "That is absolute error, not squared error.",
        }
      - {
          id: b,
          text: "The squared difference between a model's prediction and its known target value.",
          correct: true,
          feedback: "Squaring the prediction-minus-target difference makes either sign contribute a positive score.",
        }
      - {
          id: c,
          text: "The number of training examples whose predicted categories differ from their target labels.",
          correct: false,
          feedback: "That is an error count, not squared-error loss.",
        }
      - {
          id: d,
          text: "The gap between average training loss and average test loss for the model.",
          correct: false,
          feedback: "That is a generalization gap.",
        }
    solution: "Squared-error loss measures the squared difference between a model prediction and its target."
  - id: sl-training-loss-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is mean squared error?"
    options:
      - {
          id: a,
          text: "The mean of squared prediction errors across examples.",
          correct: true,
          feedback: "Squaring each miss before averaging prevents opposite errors from cancelling.",
        }
      - {
          id: b,
          text: "The square of the average prediction error across the examples.",
          correct: false,
          feedback: "That squares the signed mean error; MSE instead squares each error before averaging.",
        }
      - {
          id: c,
          text: "The largest single squared prediction error among all examples.",
          correct: false,
          feedback: "That is the maximum squared error, not the average across examples.",
        }
      - {
          id: d,
          text: "The average of the absolute prediction errors across the examples.",
          correct: false,
          feedback: "It averages the sizes of errors instead of their squares, so it does not describe MSE.",
        }
    solution: "Mean squared error is the average of the squared prediction errors over the examples."
  - id: sl-new-data-targets-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What does regression predict, compared with classification?"
    options:
      - {
          id: a,
          text: "Regression predicts a category, while classification predicts a number.",
          correct: false,
          feedback: "Those prediction types are reversed.",
        }
      - {
          id: b,
          text: "Regression predicts a number, while classification labels a number as a category.",
          correct: false,
          feedback: "Classification predicts a category, not a rounded numeric value.",
        }
      - {
          id: c,
          text: "Regression predicts a number, while classification predicts a category.",
          correct: true,
          feedback: "The target type defines the task: regression predicts numbers and classification predicts categories.",
        }
      - {
          id: d,
          text: "Regression predicts only for training examples, while classification predicts for new inputs.",
          correct: false,
          feedback: "Both task types can make predictions on new inputs.",
        }
    solution: "Regression predicts a number, while classification predicts a category."
  - id: sl-check-target
    dimension: conceptual
    type: mc
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: "An electricity supplier must plan how much power to provide tomorrow. Today its customers use 500 megawatts, a unit of power. It trains a model to predict tomorrow's demand from today's demand, temperature and day of the week. What is the **target**?"
    options:
      - { id: a, text: "Tomorrow's demand in megawatts", correct: true }
      - {
          id: b,
          text: "Today's temperature",
          correct: false,
          category: misunderstood_definition,
          feedback: "That is an input: information available before making the prediction.",
        }
      - {
          id: c,
          text: "The mean squared error",
          correct: false,
          category: misunderstood_definition,
          feedback: "That is the loss.",
        }
      - {
          id: d,
          text: "The model's weights",
          correct: false,
          category: misunderstood_definition,
          feedback: "Weights are adjustable settings learned during training, not the outcome the supplier is asking the model to predict. Separate the desired future quantity from the parameters used to produce it.",
        }
    solution: "The target is what we want to predict: tomorrow's demand. This is a regression problem."
  - id: dx-ml-1
    dimension: conceptual
    type: mc
    role: diagnostic
    difficulty: 1
    est_minutes: 1
    prompt: "A human controls a robot arm and records 100 camera images together with the movement commands sent to the arm. A model learns to predict those commands from each image so that the robot can repeat the task. In supervised learning, what are the recorded movement commands?"
    options:
      - { id: a, text: "The targets (labels)", correct: true }
      - { id: b, text: "The inputs", correct: false, category: misunderstood_definition }
      - {
          id: c,
          text: "The reward",
          correct: false,
          category: misunderstood_definition,
          feedback: "The examples provide the actions to copy, not scores for how well the robot performed. The recorded actions are targets.",
        }
      - { id: d, text: "The model parameters", correct: false, category: misunderstood_definition }
    solution: "The camera images are the inputs. The human's recorded movement commands are the targets that the model learns to predict."
  - id: sl-classify-vs-regress
    dimension: conceptual
    type: mc
    role: core
    difficulty: 1
    est_minutes: 1
    multi: true
    prompt: "Which of these are **classification** problems? (Select all that apply.)"
    options:
      - { id: a, text: "Deciding whether an email is spam", correct: true }
      - {
          id: b,
          text: "Predicting how far a robot gripper moves to the right, in metres",
          correct: false,
          category: misunderstood_definition,
          feedback: "The target is a measured distance rather than a category, so this is regression.",
        }
      - { id: c, text: "Choosing which of 10 objects is in an image", correct: true }
      - {
          id: d,
          text: "Predicting the remaining battery life in minutes",
          correct: false,
          category: misunderstood_definition,
          feedback: "Battery life in minutes is a measured quantity rather than a category label. Classify tasks by the form of the output, not by the fact it is a prediction.",
        }
    solution: "Spam status and object identity are category labels, so predicting them is classification. Position and battery life are numerical measurements, so predicting them is regression."
  - id: sl-review-ingredients
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "A house-price model has average squared loss 200 with one set of settings and 2300 with another, on the same past sales. What does training choose in supervised learning?"
    options:
      - {
          id: a,
          text: "The model parameters that minimise the average loss on the training data",
          correct: true,
        }
      - {
          id: b,
          text: "The targets that best fit the inputs",
          correct: false,
          category: misunderstood_definition,
          feedback: "Targets are the observed outcomes in the past sales, not values chosen by the training procedure. Training adjusts the model settings to reduce loss against those outcomes.",
        }
      - {
          id: c,
          text: "The loss function",
          correct: false,
          category: misunderstood_definition,
          feedback: "The loss is chosen by the engineer, not learned.",
        }
    solution: "Training chooses the adjustable model settings that make the average loss on the known examples as small as possible. Here the settings with average loss 200 fit the sales better than those with loss 2300."
  - id: sl-explain-setup
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "A delivery company has records of 5,000 journeys and wants to tell customers how many minutes a delivery will take. Describe this, or another real problem you care about, as a supervised-learning problem. Name the inputs, the targets, a possible prediction rule, a loss measure and where the training examples would come from."
    rubric:
      - {
          id: r1,
          criterion: "Inputs and targets are clearly identified and the target is something observable for training examples",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Loss matches the target type (e.g. squared error for a numeric target)",
          weight: 2,
          required: true,
        }
      - { id: r3, criterion: "Names a plausible model family and data source", weight: 1 }
    exemplar: "A delivery company wants to tell customers how many minutes their orders will take. It has records of 5,000 deliveries. The inputs are distance and time of day, and the target is the recorded delivery time. A model multiplies each input by an adjustable setting and adds the results to predict minutes. Squared error measures how far each predicted time is from the recorded time. The past delivery records provide the training data."
  - id: slp-predict
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A house has size ${{=size}}$ m² and ${{=bedrooms}}$ bedrooms. The model is $\\hat y=w_1\\cdot\\text{size}+w_2\\cdot\\text{bedrooms}+b$, with $w_1={{=w1}}$, $w_2={{=w2}}$, and $b={{=b}}$. What price does it predict, in thousands?"
    hints: ["Substitute each value into the model, then add the three terms."]
    solution: "Substitute the values: ${{=w1}}\\cdot{{=size}} + {{=w2}}\\cdot{{=bedrooms}} + {{=b}} = {{=w1 * size + w2 * bedrooms + b}}$ thousand."
    answer_expr: "w1 * size + w2 * bedrooms + b"
    params:
      w1: { min: 1, max: 5 }
      w2: { min: 5, max: 25, step: 5 }
      b: { min: 0, max: 100, step: 10 }
      size: { min: 50, max: 150, step: 10 }
      bedrooms: { min: 1, max: 5 }
    tolerance: { abs: 0.000001 }
    common_wrong:
      - {
          answer_expr: "w1 * size + b",
          category: math_error,
          feedback: "Include the bedroom term too: $w_2\\cdot\\text{bedrooms}$.",
        }
  - id: slp-why-targets
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "We collect 100 past house sales, recording each house's size, bedroom count and sale price. Why do we need the known prices as well as the house details to train this supervised model?"
    options:
      - {
          id: a,
          text: "They let us measure prediction mistakes and compare parameter settings",
          correct: true,
        }
      - id: b
        text: "The model needs the true sale price as an input when pricing a new house"
        correct: false
        category: misunderstood_definition
        feedback: "The sale price is the answer to predict, not an input available for a new house."
      - id: c
        text: "Each known price is one of the model's adjustable parameters"
        correct: false
        category: misunderstood_definition
        feedback: "Prices are targets in the data. The adjustable parameters are the model's weights and bias."
      - id: d
        text: "Targets can be replaced by the model's own guesses without changing how we judge it"
        correct: false
        category: incorrect_reasoning
        feedback: "Comparing guesses with themselves gives no evidence of whether they match actual sales."
    solution: "Known targets supply the answers against which predictions are checked. Without them, this setup cannot tell which settings fit the observed sales better."
  - id: slp-input-target
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: "A shop received 50 orders today and needs to plan tomorrow's staffing. A model predicts tomorrow's number of orders from today's temperature and whether it is a weekday. What is the target?"
    options:
      - { id: a, text: "Tomorrow's number of orders", correct: true }
      - {
          id: b,
          text: "Today's temperature",
          correct: false,
          category: misunderstood_definition,
          feedback: "Temperature is available to the model before it predicts and helps it form the estimate. Ask which value the model is meant to produce for tomorrow.",
        }
      - {
          id: c,
          text: "Whether it is a weekday",
          correct: false,
          category: misunderstood_definition,
          feedback: "Weekday status is another input that helps make the prediction, not the value being predicted. Look for the answer the staffing plan needs.",
        }
      - {
          id: d,
          text: "The model's adjustable settings",
          correct: false,
          category: misunderstood_definition,
          feedback: "Adjustable settings are learned by the model, not the quantity it returns for staffing. Separate model parameters from the prediction target.",
        }
    solution: "The target is the answer the model is being trained to predict: tomorrow's number of orders. Today's temperature and weekday status are inputs."
  - id: slp-parameters
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A model estimates the price of a 100 m², two-bedroom house using $\\hat y=w_1\\cdot\\text{size}+w_2\\cdot\\text{bedrooms}+b$. What does $\\theta$ stand for?"
    options:
      - { id: a, text: "The adjustable settings $w_1$, $w_2$ and $b$", correct: true }
      - {
          id: b,
          text: "The house's size and bedroom count",
          correct: false,
          category: misunderstood_definition,
          feedback: "Size and bedroom count describe the house and serve as inputs to this model. The symbol $\\theta$ refers to something the training process can adjust.",
        }
      - {
          id: c,
          text: "The price the house actually sold for",
          correct: false,
          category: misunderstood_definition,
          feedback: "The sold price is the observed outcome the model learns to estimate, not a setting it changes. Look for the symbols that control the formula.",
        }
      - {
          id: d,
          text: "The number of past sales",
          correct: false,
          category: misunderstood_definition,
          feedback: "Past sales are examples used to train the model, not its adjustable values. Think about which parts of the formula determine predictions.",
        }
    solution: "$\\theta$ names the model's adjustable parameters. Here those are $w_1$, $w_2$ and $b$."
  - id: slp-squared-error
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A house sold for {{=target}} thousand and the model predicted {{=prediction}} thousand. What is its squared error?"
    hints: ["Subtract the target from the prediction, then square the difference."]
    solution: "The error is ${{=prediction}}-{{=target}}={{=prediction-target}}$. Squaring gives $({{=prediction-target}})^2={{=(prediction-target)^2}}$."
    answer_expr: "(prediction - target)^2"
    params:
      prediction: { min: 10, max: 120, step: 10 }
      target: { min: 0, max: 100, step: 10 }
    constraints: ["prediction != target"]
    tolerance: { abs: 0.000001 }
  - id: slp-error-sum
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Three signed prediction errors are $({{=e1}})$, $({{=e2}})$, and $({{=e3}})$. Their signed sum is 0. What is the sum of their squared errors?"
    hints: ["First add the signed errors. Then square each error and add those squares."]
    solution: "The errors are $({{=e1}})$, $({{=e2}})$, and $({{=e3}})$. Their squares are $({{=e1}})^2={{=e1^2}}$, $({{=e2}})^2={{=e2^2}}$, and $({{=e3}})^2={{=e3^2}}$. Their sum is ${{=e1^2+e2^2+e3^2}}$. Squaring keeps positive and negative errors from cancelling."
    answer_expr: "e1^2 + e2^2 + e3^2"
    params:
      e1: { min: -20, max: 20, step: 5 }
      e2: { min: -20, max: 20, step: 5 }
      e3: { min: -20, max: 20, step: 5 }
    constraints: ["e1 + e2 + e3 == 0", "e1 != 0"]
    tolerance: { abs: 0.000001 }
  - id: slp-why-square
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Why use squared errors instead of simply averaging signed errors?"
    options:
      - {
          id: a,
          text: "Positive and negative errors can cancel, even when every prediction is wrong",
          correct: true,
        }
      - {
          id: b,
          text: "Squaring keeps the sign, so overestimates still cancel underestimates",
          correct: false,
          category: misunderstood_definition,
          feedback: "Both positive and negative errors have non-negative squares, so their squared contributions cannot cancel.",
        }
      - {
          id: c,
          text: "A zero average signed error means every prediction is correct",
          correct: false,
          category: misunderstood_definition,
          feedback: "Errors of +10 and −10 average to zero even though both predictions are wrong.",
        }
      - {
          id: d,
          text: "Averaging signed errors already measures the typical size of a miss",
          correct: false,
          category: misunderstood_definition,
          feedback: "A signed average measures the balance of overestimates and underestimates, not their sizes.",
        }
    solution: "A prediction that is too high has a positive error and one that is too low has a negative error. Their signed sum can be zero by cancellation. Squaring makes each contribution non-negative."
  - id: slp-why-square-not-absolute
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "A pricing mistake of 20 thousand pounds can be much more damaging than one of 10 thousand. Why choose squared rather than absolute errors if we want the larger mistake to count more than twice as much?"
    options:
      - {
          id: a,
          text: "Doubling the error multiplies its squared loss by four, but only doubles its absolute loss",
          correct: true,
        }
      - id: b
        text: "Absolute errors let positive and negative misses cancel"
        correct: false
        category: misunderstood_definition
        feedback: "Absolute errors are non-negative too. Both choices stop cancellation."
      - id: c
        text: "Squaring makes large misses count less than small ones"
        correct: false
        category: incorrect_reasoning
        feedback: "An error of 20 contributes 400, while an error of 10 contributes 100. The larger error therefore counts four times as much."
      - id: d
        text: "Squared error is always the right loss, regardless of the task"
        correct: false
        category: incorrect_reasoning
        feedback: "The choice depends on which mistakes matter. Here we want a very large pricing error to count much more heavily than a small one, which squaring achieves."
    solution: "For errors of 10 and 20, absolute losses are 10 and 20, while squared losses are 100 and 400. The larger mistake is twice as large, but contributes four times as much squared loss."
  - id: slp-why-average
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 1
    prompt: "The house-price model has total squared error 600 on three sales. Why divide by three to report average loss 200 rather than report only the total?"
    options:
      - {
          id: a,
          text: "The average measures loss per house, so repeating the same dataset does not inflate it",
          correct: true,
        }
      - id: b
        text: "Dividing guarantees zero loss on new houses"
        correct: false
        category: incorrect_reasoning
        feedback: "Division changes the scale of the reported loss, not the predictions on new houses."
      - id: c
        text: "Averaging removes the largest mistakes from the calculation"
        correct: false
        category: misunderstood_definition
        feedback: "Every squared error remains in the sum before division; large mistakes still contribute."
      - id: d
        text: "On the same dataset, averaging selects different best settings from summing"
        correct: false
        category: incorrect_reasoning
        feedback: "Every setting's total is divided by the same positive number, so their ordering stays the same."
    solution: "Repeating all three sales doubles both the total squared error and the number of houses. The average stays 200 for Setting A: it measures loss per house, not dataset size."
  - id: slp-average-mse
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "A house-price model predicts {{=p1}} thousand for a house that sold for {{=y1}} thousand, {{=p2}} thousand for one that sold for {{=y2}} thousand, and {{=p3}} thousand for one that sold for {{=y3}} thousand. What is its mean squared error across the three houses?"
    hints: ["Square each prediction error, add the three results, and divide by 3."]
    solution: "The squared errors are $({{=p1-y1}})^2={{=(p1-y1)^2}}$, $({{=p2-y2}})^2={{=(p2-y2)^2}}$, and $({{=p3-y3}})^2={{=(p3-y3)^2}}$. Their sum is ${{=(p1-y1)^2+(p2-y2)^2+(p3-y3)^2}}$. Divide by 3: ${{=(p1-y1)^2+(p2-y2)^2+(p3-y3)^2}}\\div3={{=((p1-y1)^2+(p2-y2)^2+(p3-y3)^2)/3}}$."
    answer_expr: "((p1-y1)^2 + (p2-y2)^2 + (p3-y3)^2) / 3"
    params:
      p1: { min: 0, max: 100, step: 10 }
      y1: { min: 0, max: 100, step: 10 }
      p2: { min: 0, max: 100, step: 10 }
      y2: { min: 0, max: 100, step: 10 }
      p3: { min: 0, max: 100, step: 10 }
      y3: { min: 0, max: 100, step: 10 }
    constraints: ["mod((p1-y1)^2 + (p2-y2)^2 + (p3-y3)^2, 3) == 0"]
    tolerance: { abs: 0.000001 }
  - id: slp-fixed-squared-error
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "A house-price model predicts 7 hundred thousand pounds for a house that sold for 5 hundred thousand. Using the numbers 7 and 5, what is the squared error, (prediction − target)²?"
    answer: 4
    tolerance: { abs: 0.000001 }
    solution: "The error is 7 − 5 = 2. Squaring it gives 2² = 4."
  - id: slp-argmin
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "We compare settings for a house-price model by their average squared error on past sales. In the training formula, what does $\\arg\\min_\\theta$ ask us to find?"
    options:
      - {
          id: a,
          text: "The value of $\\theta$ that makes the following average loss as small as possible",
          correct: true,
        }
      - {
          id: b,
          text: "The largest possible loss",
          correct: false,
          category: misunderstood_definition,
          feedback: "An argmin looks for a setting that makes the objective small; it does not search for the largest loss. Keep track of whether the operation is minimizing or maximizing.",
        }
      - {
          id: c,
          text: "The number of houses in the dataset",
          correct: false,
          category: misunderstood_definition,
          feedback: "The number of houses describes the dataset size, not the value selected by `argmin`. Focus on what appears as the subscript to the optimization operation.",
        }
      - {
          id: d,
          text: "The average of the model's parameters",
          correct: false,
          category: misunderstood_definition,
          feedback: "Averaging parameter values is different from selecting settings according to their loss. Look at which quantity the formula asks to minimize.",
        }
    solution: "$\\arg\\min_\\theta$ asks for the adjustable settings that make the following average loss as small as possible. It names the settings, not the size of the loss."
  - id: slp-best-setting
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Setting A has average squared error 200 and Setting B has average squared error 2300 on the same sales. Which setting fits those sales better?"
    options:
      - { id: a, text: "Setting A, because its average loss is smaller", correct: true }
      - {
          id: b,
          text: "Setting B, because its average loss is larger",
          correct: false,
          category: misunderstood_definition,
          feedback: "A larger squared error means the predictions are farther from the observed values on average, not a better fit. Compare the scores using the same loss on the same sales.",
        }
      - {
          id: c,
          text: "They fit equally well",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The two settings have different average errors, so they do not fit these sales equally under this measure. Use the lower loss to compare fit.",
        }
      - {
          id: d,
          text: "There is not enough information to compare their losses",
          correct: false,
          category: misunderstood_definition,
          feedback: "Both losses use the same metric on the same houses, so they are directly comparable. Check what the smaller score says about the fit.",
        }
    solution: "Both averages use the same squared-error measure on the same sales. The smaller average, 200, means Setting A fits these sales better."
  - id: slp-new-houses
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "We choose a house-price model's settings using 100 past sales. Why test it on 20 other sales that did not help choose those settings?"
    options:
      - {
          id: a,
          text: "To check whether it predicts well for new houses, not only past examples",
          correct: true,
        }
      - {
          id: b,
          text: "Because a small training loss guarantees a small loss on new sales",
          correct: false,
          category: misunderstood_definition,
          feedback: "Fitting known answers does not guarantee good predictions for houses the model has not seen.",
        }
      - {
          id: c,
          text: "Because testing on the training sales gives an independent check",
          correct: false,
          category: misunderstood_definition,
          feedback: "Those sale prices already helped choose the model's settings. Using different sales checks whether it can predict answers that did not help choose those settings.",
        }
      - {
          id: d,
          text: "Because the test sale prices should also be used to adjust the settings before measuring their loss",
          correct: false,
          category: misunderstood_definition,
          feedback: "Then those answers would also influence the model, defeating the purpose of testing on unused sales.",
        }
    solution: "The aim is to price houses the model has not seen. A model can fit past sales well but still predict new houses badly."
  - id: slp-regression-classification
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "Which task is regression rather than classification?"
    options:
      - { id: a, text: "Predicting a house's sale price in pounds", correct: true }
      - {
          id: b,
          text: "Predicting whether an email is spam",
          correct: false,
          category: misunderstood_definition,
          feedback: "Spam status is a category label rather than a measured amount. Decide whether each task predicts a number or selects a class.",
        }
      - {
          id: c,
          text: "Predicting which of three labels applies to a photo",
          correct: false,
          category: misunderstood_definition,
          feedback: "Choosing a photo label predicts which category applies; the number of possible labels does not turn it into regression. Focus on the kind of output.",
        }
      - {
          id: d,
          text: "Choosing between the labels yes and no",
          correct: false,
          category: misunderstood_definition,
          feedback: "Choosing yes or no is still selecting a category, even with only two labels. The number of possible labels does not determine regression versus classification.",
        }
    solution: "Regression predicts a number such as a sale price. Classification predicts a category or label."
