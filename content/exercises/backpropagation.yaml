  - id: bp-recall-reuse-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: bp-why-backprop
    difficulty: 1
    est_minutes: 0.5
    prompt: "Both a weight and a bias affect a prediction, and that prediction feeds the loss. Which slope do the two backward calculations share?"
    options:
      - id: a
        text: "The prediction's slope for the weight."
        correct: false
        feedback: "That is the weight's own local derivative. The bias has a separate local derivative."
      - id: b
        text: "The loss's slope for the prediction."
        correct: true
        feedback: "Both paths go through the prediction, so they use the same loss slope there."
      - id: c
        text: "The prediction's slope for the bias."
        correct: false
        feedback: "That is the bias's own local derivative. The weight has a separate local derivative."
    solution: "Find the loss slope at the shared prediction once. Each parameter then uses its own local derivative to get its loss slope."
  - id: bp-recall-reuse-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: bp-why-backprop
    difficulty: 1
    est_minutes: 0.5
    prompt: "A model predicts $\\hat y=wx+b$ and uses squared error against target $y$. Write the loss's partial derivative with respect to the bias $b$, using $w,x,b,y$."
    answer: "2*(w*x+b-y)"
    variables: { w: [-3, 3], x: [-3, 3], b: [-2, 2], y: [-4, 4] }
    solution: "The prediction's loss slope is $2(\\hat y-y)$. The prediction changes by one per unit of bias, so the bias slope is $2(wx+b-y)$."
  - id: bp-recall-relu-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: bp-by-hand
