    prompt: "In one or two sentences, how does a backward step through ReLU handle the arriving loss slope for a positive saved score, and for a score of zero or less?"
    rubric:
      - id: positive
        criterion: "Explain that a positive saved score gives local derivative 1, so the arriving slope passes through unchanged."
        weight: 1
