    exemplar: "At a positive saved score, ReLU multiplies the arriving slope by 1 and passes it back unchanged. For a negative score, or at zero by convention, it multiplies the slope by 0."
  - id: bp-recall-relu-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: bp-by-hand
    difficulty: 1
    est_minutes: 0.5
    prompt: "A value in a network feeds two later operations. In the backward pass, each route sends a loss-slope contribution back to that value. How do you combine the two?"
    options:
      - id: a
        text: "Multiply the two contributions."
        correct: false
        feedback: "Multiplication combines slopes along a single route. The two arriving contributions come from separate routes."
      - id: b
        text: "Add the two contributions."
        correct: true
        feedback: "The loss can change through both uses of the value, so both effects add."
      - id: c
        text: "Average the two contributions."
        correct: false
        feedback: "Each use makes a full contribution. Averaging would shrink their combined effect."
    solution: "Add the contributions from the two routes to get the loss slope for the shared value."
  - id: bp-recall-relu-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: bp-by-hand
    difficulty: 2
    est_minutes: 0.5
    prompt: "A two-layer network uses the hidden value $h$ to predict $\\hat y=w_2h$, then takes the squared error against target $y$. Write the loss slope for $w_2$ in terms of $w_2,h,y$. Type w2 for the output weight."
    answer: "2*(w2*h-y)*h"
    variables: { w2: [-3, 4], h: [0, 4], y: [-4, 4] }
    solution: "The slope arriving at the prediction is $2(w_2h-y)$. Multiply by its local derivative for the weight, $h$."
