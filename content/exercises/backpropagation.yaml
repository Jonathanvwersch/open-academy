concept: backpropagation
exercises:
  - id: "bp-why-backprop-basics"
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "What does backpropagation calculate?"
    options:
      [
        {
          "id": "a",
          "text": "The loss slope for each parameter, by working backwards through operations.",
          "correct": true,
          "feedback": "Correct: apply the chain rule to loss slopes and add contributions from shared uses.",
        },
        {
          "id": "b",
          "text": "The original inputs for each example, by undoing the forward operations.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "Backward steps pass derivatives, not reconstructed inputs.",
        },
        {
          "id": "c",
          "text": "The next parameter values, by replacing the forward operations.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "Computing slopes and updating parameters are separate tasks.",
        },
      ]
    solution: "It applies the chain rule backwards to calculate parameter derivatives; it does not undo the prediction or update the parameters."
  - id: "bp-reuse-reason"
    lesson_only: true
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why is the slope 6 at the prediction worked out only once?"
    options:
      [
        {
          "id": "a",
          "text": "Both parameters reach the loss only through the prediction.",
          "correct": true,
          "feedback": "Correct: everything after the prediction is shared, so its slope is found once and reused.",
        },
        {
          "id": "b",
          "text": "Both parameters have the same local derivative.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "Their local derivatives are 2 and 1, not equal.",
        },
        {
          "id": "c",
          "text": "Both parameters must end up with the same slope.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "Their final derivatives are 12 and 6.",
        },
      ]
    solution: "The loss depends on both parameters only through the prediction, so its slope 6 is reused and then multiplied by each parameter’s own local derivative, 2 for $w$ and 1 for $b$."
  - id: "bp-reuse-local"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 1
    est_minutes: 3
    prompt: "The model $\\hat y=2w+b$ has target $y=0$. The saved prediction is 3, and the shared slope at the prediction is $2(3-0)=6$. Complete the backward step: what is $\\partial L/\\partial w$?"
    answer: 12
    tolerance: { "abs": 0.001 }
    solution: "Multiply the shared slope 6 by the weight’s local derivative 2, giving 12."
  - id: "bp-reuse-template"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 2
    est_minutes: 3
    prompt: "A model predicts $\\hat y={{= a }}w+b$, with target $y=0$ and loss $L=(\\hat y-0)^2$. At $w={{= w }}$ and $b=1$, what is $\\partial L/\\partial w$?"
    answer_expr: "2 * (a * w + 1) * a"
    tolerance: { "abs": 0.001 }
    params: { "a": { "min": 1, "max": 3, "step": 1 }, "w": { "min": 1, "max": 3, "step": 1 } }
    solution: "The prediction is {{= a * w + 1 }}, so its slope is twice that, {{= 2 * (a * w + 1) }}. The weight’s local derivative is {{= a }}, and the product is {{= 2 * (a * w + 1) * a }}."
  - id: "bp-reuse-branch"
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "Two parameters feed one prediction, which then feeds a squared-error loss. Which plan avoids repeating the shared work?"
    options:
      [
        {
          "id": "a",
          "text": "Find the prediction’s slope once, then multiply it by each parameter’s own local derivative.",
          "correct": true,
          "feedback": "Correct: the shared slope is found once, then each parameter multiplies it by its own local slope.",
        },
        {
          "id": "b",
          "text": "Find the prediction’s slope again for every parameter.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "That works mathematically but repeats the shared work.",
        },
        {
          "id": "c",
          "text": "Find the prediction’s slope once, then give it unchanged to every parameter.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "You still need each parameter’s local multiplier.",
        },
      ]
    solution: "Reuse the slope at the prediction, then multiply by each parameter’s local derivative."
  - id: "bp-reuse-robot"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 3
    prompt: "A robot scores two adjustable settings $u$ and $v$ with the loss $L=z^2$, where $z=3u+v$. At $u=1$ and $v=2$, what is $\\partial L/\\partial v$?"
    answer: 10
    tolerance: { "abs": 0.001 }
    solution: "The saved value is $z=5$, so the shared slope at $z$ is $2\\times5=10$. The local derivative of $z$ for $v$ is 1, leaving 10."
  - id: "bp-by-hand-basics"
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "At one backward step, how do you pass an arriving loss slope through an operation?"
    options:
      [
        {
          "id": "a",
          "text": "Multiply it by the operation’s local derivative.",
          "correct": true,
          "feedback": "The chain rule multiplies the arriving slope by the local derivative.",
        },
        {
          "id": "b",
          "text": "Multiply it by the operation’s saved output.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "Saved values help evaluate the derivative but are not generally the derivative.",
        },
        {
          "id": "c",
          "text": "Add it to the operation’s local derivative.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "The chain rule multiplies slopes along a route.",
        },
      ]
    solution: "The chain rule multiplies the arriving loss slope by the local derivative of the operation."
  - id: "bp-hand-reason"
    lesson_only: true
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "Why does the ReLU step of the worked example multiply by 1 rather than by ReLU’s output 2?"
    options:
      [
        {
          "id": "a",
          "text": "ReLU has local slope 1 where its saved input is positive.",
          "correct": true,
          "feedback": "Correct: the saved score 2 is positive, so ReLU passes the arriving slope unchanged.",
        },
        {
          "id": "b",
          "text": "ReLU always has local slope 1, regardless of its saved input.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "Its slope is 0 at negative inputs.",
        },
        {
          "id": "c",
          "text": "ReLU divides the arriving slope by the saved input 2.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "It passes the slope unchanged here; it does not divide by its input.",
        },
      ]
    solution: "The saved score is positive, placing the operation on ReLU’s slope-1 branch."
  - id: "bp-hand-partial"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 1
    est_minutes: 3
    prompt: "An arriving loss slope is 6 at $h=\\operatorname{ReLU}(z)$. The saved score is $z=-2$. What loss slope reaches $z$?"
    answer: 0
    tolerance: { "abs": 0.001 }
    solution: "The negative score selects local slope 0, so the passed-back slope is $6(0)=0$."
  - id: "bp-hand-template"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 2
    est_minutes: 3
    prompt: "A network computes $z=wx$, $h=\\operatorname{ReLU}(z)$, $\\hat y=3h$ and $L=(\\hat y-y)^2$. At $w=1$, $x={{= x }}$ and target $y={{= t }}$, what is $\\partial L/\\partial w$?"
    answer_expr: "2 * (3 * x - t) * 3 * x"
    tolerance: { "abs": 0.001 }
    params: { "x": { "min": 1, "max": 3, "step": 1 }, "t": { "min": 1, "max": 5, "step": 1 } }
    solution: "The score is positive, so ReLU’s local derivative is 1. Multiply the prediction’s slope, the output weight 3 and the input: $2(3x-y)\\cdot3\\cdot x={{=2*(3*x-t)*3*x}}$."
  - id: "bp-hand-split"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 2
    est_minutes: 3
    prompt: "A saved value feeds two later routes. Those routes send loss-slope contributions 6 and -2 back to it. What loss slope should you use before continuing to earlier operations?"
    answer: 4
    tolerance: { "abs": 0.001 }
    solution: "Add contributions from every use of the value: $6+(-2)=4$. Multiplying would incorrectly treat the routes as consecutive operations."
  - id: "bp-hand-robot"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 3
    prompt: "A robot predicts a distance $\\hat y=2\\operatorname{ReLU}(wx)$ and uses the loss $L=(\\hat y-3)^2$. With fixed sensor input $x=2$ and weight $w=1$, what is $\\partial L/\\partial w$?"
    answer: 8
    tolerance: { "abs": 0.001 }
    solution: "The score is 2 and the prediction is 4. The backward factors are the prediction’s slope $2(4-3)=2$, the output weight 2, ReLU’s local derivative 1 and the input 2, giving 8."
  - id: "bp-arrays-basics"
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "Several examples use the same weight. How do their loss-slope contributions combine?"
    options:
      [
        {
          "id": "a",
          "text": "Add the contributions, with loss scaling already included.",
          "correct": true,
          "feedback": "Correct: each example is a separate use of the weight, so its contributions add.",
        },
        {
          "id": "b",
          "text": "Keep only the contribution from the last example.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "Every use of a shared weight contributes to its derivative.",
        },
        {
          "id": "c",
          "text": "Multiply the contributions, with one factor per example.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "Examples are separate uses, not consecutive chain-rule steps.",
        },
      ]
    solution: "Shared parameters receive the sum of contributions from all examples; averaging, if required by the loss, is included once."
  - id: "bp-array-reason"
    lesson_only: true
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "Why does the worked example use $X^\\top G$ rather than average the entries of $G$ to find the weight slope?"
    options:
      [
        {
          "id": "a",
          "text": "It multiplies each output slope by its input and adds the contributions.",
          "correct": true,
          "feedback": "Correct: each row contributes input times output slope, and the product adds those rows.",
        },
        {
          "id": "b",
          "text": "It ignores the inputs and gives every output slope equal weight.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "The input is each weight’s local multiplier.",
        },
        {
          "id": "c",
          "text": "It divides all output slopes by the number of input rows.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "A transpose swaps axes; it does not divide by the batch size.",
        },
      ]
    solution: "Each row contributes its input times its output loss slope. Matrix multiplication adds exactly those products."
  - id: "bp-array-bias"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 1
    est_minutes: 3
    prompt: "For $\\hat y=wx+b$ on a batch of two examples, the prediction slopes are 2 and 4, already including the MSE’s division. Complete the bias step: what is $\\partial L/\\partial b$?"
    answer: 6
    tolerance: { "abs": 0.001 }
    solution: "The bias has local derivative 1 in each example, so its slope is $2+4=6$."
  - id: "bp-array-template"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 2
    est_minutes: 3
    prompt: "A batch uses $\\hat y=wx+b$ with inputs 1 and 2. The prediction slopes are {{= g }} and {{= q }}, already including the MSE’s division. What is $\\partial L/\\partial w$?"
    answer_expr: "g + 2 * q"
    tolerance: { "abs": 0.001 }
    params: { "g": { "min": -2, "max": 2, "step": 1 }, "q": { "min": 1, "max": 3, "step": 1 } }
    solution: "Add input times prediction slope over the examples: $1({{= g }})+2({{= q }})={{=g+2*q}}$."
  - id: "bp-array-shape"
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "With examples in rows, $X$ has shape $4\\times3$ and $G$ has shape $4\\times2$. What shape do the weight slopes $X^\\top G$ have?"
    options:
      [
        {
          "id": "a",
          "text": "$3\\times2$, one row per input and one column per output.",
          "correct": true,
          "feedback": "Correct: the product has shapes (3×4)(4×2), so the example dimension is summed away.",
        },
        {
          "id": "b",
          "text": "$4\\times2$, one row per example and one column per output.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "The multiplication sums over examples, removing that dimension.",
        },
        {
          "id": "c",
          "text": "$2\\times3$, one row per output and one column per input.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "That is the transpose of the required weight-gradient shape.",
        },
      ]
    solution: "The product has shapes $(3\\times4)(4\\times2)$, so the result is $3\\times2$."
  - id: "bp-array-robot"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 3
    prompt: "A robot uses one shared sensor weight on two examples with inputs 2 and 3. Backpropagation returns the prediction slopes -1 and 2, already including the MSE’s division. What is the weight’s slope?"
    answer: 4
    tolerance: { "abs": 0.001 }
    solution: "Sum the two contributions: $2(-1)+3(2)=4$. Dividing again would count the mean-loss scaling twice."
  - id: "bp-checking-basics"
    dimension: "conceptual"
    type: "mc"
    role: "basics"
    difficulty: 1
    est_minutes: 2
    prompt: "What does a gradient check compare?"
    options:
      [
        {
          "id": "a",
          "text": "A backward derivative with a slope estimated from nearby losses.",
          "correct": true,
          "feedback": "Correct: the estimate comes only from losses at nearby parameter values.",
        },
        {
          "id": "b",
          "text": "A backward derivative with the current parameter value.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "A parameter setting is not a loss slope.",
        },
        {
          "id": "c",
          "text": "A backward derivative with the current prediction error.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "The error omits the local multipliers along the path.",
        },
      ]
    solution: "Finite differences estimate the same loss derivative independently by evaluating nearby parameter values."
  - id: "bp-check-reason"
    lesson_only: true
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 1
    est_minutes: 2
    prompt: "Why does the worked example divide the loss difference by 0.2 rather than 0.1?"
    options:
      [
        {
          "id": "a",
          "text": "The two tested weights, 0.9 and 1.1, are 0.2 apart.",
          "correct": true,
          "feedback": "Correct: a central difference spans from w − ε to w + ε, a distance of 2ε.",
        },
        {
          "id": "b",
          "text": "The squared loss always doubles the chosen nudge size.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "The denominator is the distance between weights, not a derivative rule for squaring.",
        },
        {
          "id": "c",
          "text": "The two losses must be averaged before comparing slopes.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "The numerator subtracts losses; it does not average them.",
        },
      ]
    solution: "A central difference spans two nudges, from $w-\\varepsilon$ to $w+\\varepsilon$, a distance of $2\\varepsilon$."
  - id: "bp-check-gap"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 1
    est_minutes: 3
    prompt: "A gradient check measures $L(w+0.1)=10.24$ and $L(w-0.1)=7.84$. What derivative does the central difference estimate?"
    answer: 12
    tolerance: { "abs": 0.001 }
    common_wrong:
      - {
          answer: 24,
          tolerance: { abs: 0.001 },
          category: math_error,
          feedback: "The two weights are $0.2$ apart, not $0.1$. Divide the loss difference by $2\\varepsilon=0.2$.",
        }
    solution: "The central difference divides the change in loss by the distance between the two weights: $(10.24-7.84)/0.2=2.4/0.2=12$."
  - id: "bp-check-template"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 2
    est_minutes: 3
    prompt: "For $L(w)=(2w+1)^2$, use a central difference at $w={{= w }}$ with nudge 0.1. What derivative does the check estimate?"
    answer_expr: "4 * (2 * w + 1)"
    tolerance: { "abs": 0.001 }
    params: { "w": { "min": 0, "max": 3, "step": 1 } }
    solution: "The central difference of this quadratic equals its derivative $4(2w+1)={{=4*(2*w+1)}}$ in exact arithmetic."
  - id: "bp-check-scaling"
    dimension: "conceptual"
    type: "mc"
    role: "practice"
    difficulty: 2
    est_minutes: 2
    prompt: "On a smooth test case with four examples, finite differences give bias slope 8 but backward code gives 2. Other gradients agree. Which mistake explains this factor?"
    options:
      [
        {
          "id": "a",
          "text": "The bias code averages contributions that already include mean-loss scaling.",
          "correct": true,
          "feedback": "Correct: an extra mean divides by the four examples, turning 8 into 2.",
        },
        {
          "id": "b",
          "text": "The bias code adds contributions that already include mean-loss scaling.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "Adding is correct once the loss scaling is included; it would give 8.",
        },
        {
          "id": "c",
          "text": "The bias code reverses the sign of each contribution before adding.",
          "correct": false,
          "category": "incorrect_reasoning",
          "feedback": "A sign reversal would give -8, not 2.",
        },
      ]
    solution: "An extra division by the four-example batch size turns 8 into 2; check for an extra mean in the bias code."
  - id: "bp-check-robot"
    dimension: "math"
    type: "numeric"
    role: "practice"
    difficulty: 3
    est_minutes: 3
    prompt: "A robot’s calibration loss is $L(w)=(3w-1)^2$. At $w=1$, use nudge 0.1: $L(1.1)=5.29$ and $L(0.9)=2.89$. What central estimate should the backward derivative match?"
    answer: 12
    tolerance: { "abs": 0.001 }
    solution: "The estimate is $(5.29-2.89)/0.2=12$, agreeing with $2(3w-1)\\cdot3$ at $w=1$."
  - id: bp-check-1
    dimension: math
    type: numeric
    role: check
    difficulty: 2
    est_minutes: 2
    prompt: "A house-price network uses size $x = 2$ in hundreds of m² to predict a price in hundreds of thousands of pounds. It calculates $z = w_1 x$, $h = \\mathrm{ReLU}(z)$, $\\hat y = w_2 h$ and $L = (\\hat y - y)^2$, with $w_1 = 2$, $w_2 = 3$ and actual price $y = 4$. What is $\\partial L/\\partial w_2$?"
    answer: 64
    tolerance: { abs: 0.001 }
    hints:
      [
        "Forward pass: $z = 4$, $h = 4$, $\\hat y = 12$.",
        "$\\partial L/\\partial \\hat y = 2(12 - 4) = 16$; then multiply by $h$.",
      ]
    solution: "The forward pass gives $z = 4$, $h = 4$ and $\\hat y = 12$. The loss's derivative for the prediction is $\\partial L/\\partial \\hat y = 16$. Multiplying by the local derivative $h = 4$ gives $\\partial L/\\partial w_2 = 16 \\cdot 4 = 64$."
  - id: bp-faded-1
    dimension: math
    type: numeric
    role: check
    difficulty: 2
    est_minutes: 3
    prompt: "A house-price network uses size $x = 1$ in hundreds of m² and actual price $y = 10$ in hundreds of thousands of pounds. It calculates $z = w_1 x$, $h = \\mathrm{ReLU}(z)$, $\\hat y = w_2 h$ and $L = (\\hat y - y)^2$, with $w_1 = 2$ and $w_2 = 3$. The forward pass gives $\\hat y = 6$, so $\\partial L/\\partial \\hat y = 2(6 - 10) = -8$. What is $\\partial L/\\partial w_1$?"
    answer: -24
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: 24,
          category: math_error,
          feedback: "The prediction $\\hat y = 6$ is below the target 10, so $\\partial L/\\partial \\hat y$ is negative. The remaining factors here are positive, so the weight gradient must also be negative.",
        }
      - {
          answer: -8,
          category: incomplete_explanation,
          feedback: "That is $\\partial L/\\partial \\hat y$. Continue through $w_2$, the ReLU gate and $x$.",
        }
    hints:
      [
        "$\\partial L/\\partial h = -8 \\cdot 3 = -24$.",
        "ReLU is active ($z = 2 > 0$) and $x = 1$.",
      ]
    solution: "Multiplying by $w_2 = 3$ gives $\\partial L/\\partial h = -24$. Since $z = 2$ is positive, ReLU's derivative is 1. The final multiplication by $x = 1$ leaves $\\partial L/\\partial w_1 = -24$."
  - id: dx-dl-4
    dimension: math
    type: numeric
    role: diagnostic
    difficulty: 3
    est_minutes: 4
    prompt: "A robot's network predicts a signed movement $y$ in centimetres, where negative means backwards. The required movement is $t = 1$ cm. The network calculates $y = w_2\\,\\mathrm{ReLU}(w_1 x)$ and squared error $L = (y - t)^2$, with sensor input $x = 2$, $w_1 = 1.5$ and $w_2 = -1$. Compute $\\partial L/\\partial w_1$."
    answer: 16
    tolerance: { abs: 0.001 }
    common_wrong:
      - {
          answer: -16,
          category: math_error,
          feedback: "Check the signs: $\\partial L/\\partial y = -8$ and $w_2 = -1$.",
        }
      - {
          answer: 8,
          category: incomplete_explanation,
          feedback: "You stopped one step early: multiply by $\\partial z/\\partial w_1 = x = 2$.",
        }
    solution: "The forward pass gives $z = 3$, $h = 3$ and $y = -3$. Start the backward pass with $\\partial L/\\partial y = 2(-3 - 1) = -8$. Multiplying by $w_2 = -1$ gives $\\partial L/\\partial h = 8$. ReLU's derivative is 1 because $z > 0$. Finally, multiplying by $x = 2$ gives $\\partial L/\\partial w_1 = 16$."
  - id: bp-shapes
    dimension: implementation
    type: mc
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "A house-price network processes 64 houses, with one row per house and 100 inputs per row in `X`. Its 32-unit layer computes `Z = X @ W`, with `X.shape == (64, 100)` and `W.shape == (100, 32)`. The loss gradient `G = dL/dZ` has shape `(64, 32)`. Which expression gives `dL/dW`?"
    options:
      - { id: a, text: "`X.T @ G`", correct: true }
      - {
          id: b,
          text: "`G @ X.T`",
          correct: false,
          category: implementation_error,
          feedback: "Matrix multiplication requires the inner sizes to match. Here they are 32 and 100, so this product is not defined.",
        }
      - {
          id: c,
          text: "`G.T @ X`",
          correct: false,
          category: implementation_error,
          feedback: "That gives shape (32, 100), the transpose of what you need.",
        }
      - {
          id: d,
          text: "`G @ W.T`",
          correct: false,
          category: misunderstood_definition,
          feedback: "That is `dL/dX`, the gradient passed to the previous layer.",
        }
    hints: ["The gradient must have the same shape as `W`: (100, 32)."]
    solution: "`X.T @ G` has shape (100,64)@(64,32) = (100,32), matching `W`."
  - id: bp-complete-relu
    dimension: implementation
    type: code_complete
    role: core
    difficulty: 2
    est_minutes: 2
    prompt: "A house-price network applies ReLU to each entry of `z1`, its saved input to that operation. For example, an input of -2 gives output 0, while 3 gives output 3. The array `g_h1` contains the loss derivatives for those outputs and has the same shape as `z1`. Complete the backward step that gives the loss derivatives for `z1`."
    code: |
      g_z1 = ____
    accept:
      [
        "g_h1 * (z1 > 0)",
        "(z1 > 0) * g_h1",
        "g_h1 * (z1 > 0).astype(float)",
        "np.where(z1 > 0, g_h1, 0)",
        "np.where(z1 > 0, g_h1, 0.0)",
        "g_h1 * (z1 >= 0)",
      ]
    solution: "`g_z1 = g_h1 * (z1 > 0)`: the gradient passes where the unit was active and is blocked elsewhere."
  - id: bp-debug-bias
    dimension: transfer
    type: debug
    role: transfer
    difficulty: 3
    est_minutes: 4
    prompt: "A house-price network processes a batch of 64 houses. A gradient check estimates the bias gradient for `b1` as about 64 times the value returned by this backward code. The other gradients agree with the check. Which line is wrong, and what is the fix?"
    code: |
      g_y = 2 * (y_hat - y) / len(y)
      dW2 = h1.T @ g_y
      db2 = g_y.sum(axis=0)
      g_h1 = g_y @ W2.T
      g_z1 = g_h1 * (z1 > 0)
      dW1 = X.T @ g_z1
      db1 = g_z1.mean(axis=0)
    buggy_line: 7
    fix_options:
      - {
          id: a,
          text: "`db1 = g_z1.sum(axis=0)`. The bias is shared by every row, so its gradient sums the per-example contributions",
          correct: true,
        }
      - {
          id: b,
          text: "`db1 = g_z1.sum(axis=1)`",
          correct: false,
          feedback: "That adds across the units instead of across the houses. It gives one answer per house, shape `(B,)`, rather than one per bias, shape `(H,)`.",
        }
      - {
          id: c,
          text: "`db1 = g_z1`",
          correct: false,
          feedback: "Shape `(B, H)` does not match `b1`'s shape `(H,)`.",
        }
      - {
          id: d,
          text: "Divide `g_y` by `len(y)` a second time",
          correct: false,
          feedback: "That would make every gradient smaller, not fix `b1`.",
        }
    hints:
      [
        "A gradient off by exactly the batch size points to a mean that should be a sum (or the reverse).",
        "Compare how `db2` is computed.",
      ]
    solution: "Here $B = 64$ is the number of houses. The division by $B$ in the mean loss is already included in `g_y`. Using `.mean` for `db1` divides by 64 a second time. Because the same bias affects every house, add all their contributions with `.sum(axis=0)`, just as the code does for `db2`."
  - id: bp-review-why-cache
    dimension: conceptual
    type: mc
    role: review
    difficulty: 2
    est_minutes: 2
    prompt: "A robot uses the same network to learn from 64 recorded images and, later, to predict a movement without changing its settings. Why does training need to keep more calculated values in memory than prediction alone, also called inference?"
    options:
      - {
          id: a,
          text: "The backward pass needs values saved during the forward pass",
          correct: true,
        }
      - {
          id: b,
          text: "Training keeps every earlier version of the weights to undo bad steps",
          correct: false,
          category: misunderstood_definition,
          feedback: "Training overwrites the weights at each step. The extra memory holds the forward pass's intermediate values for the backward pass.",
        }
      - {
          id: c,
          text: "Gradients take more memory than the parameters they belong to",
          correct: false,
          category: misunderstood_definition,
          feedback: "Each gradient has the same shape as its parameter. The extra memory holds the forward pass's intermediate values.",
        }
      - {
          id: d,
          text: "Prediction throws away the inputs as soon as it reads them",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Both keep the inputs while computing. Training also keeps each layer's intermediate values, because the local derivatives need them.",
        }
    solution: "Local derivative rules use values from the forward pass. For example, a multiplication needs its inputs and ReLU needs to know which inputs were positive. Training saves those values for the batch until the backward pass has used them. Prediction alone does not need that later derivative calculation."
  - id: "bp-explain"
    dimension: "conceptual"
    type: "explain"
    role: "core"
    difficulty: 3
    est_minutes: 5
    prompt: "A network is trained on the mean loss over several examples, and its forward values have been saved. Explain how backpropagation works backward from the loss, how it combines contributions to a shared parameter, and how to check one slope with a two-sided nudge."
    rubric:
      - id: reuse
        criterion: Explain multiplying arriving loss slopes by local derivatives evaluated using saved forward values.
        weight: 1
        required: true
      - id: batch
        criterion: Explain adding contributions to a shared parameter, with mean-loss scaling included once.
        weight: 1
        required: true
      - id: check
        criterion: Compare the backward slope with two-sided loss changes while keeping other parameters and data fixed.
        weight: 1
        required: true
    exemplar: "Work backward from the loss, multiplying arriving slopes by local derivatives evaluated at the saved forward values. Add contributions where paths or examples share a parameter, including the mean-loss scaling once. Check a chosen parameter by holding the others and the data fixed, taking equal positive and negative nudges, and dividing the loss difference by twice the nudge size."
  - id: lab-nn-gradient-check-eps
    dimension: implementation
    type: mc
    role: core
    difficulty: 2
    est_minutes: 3
    prompt: "The verifier compares a backward-pass gradient with central finite differences using a small, nonzero $\\epsilon$. Why use this two-sided estimate instead of making $\\epsilon$ as small as possible?"
    options:
      - {
          id: a,
          text: "The two-sided estimate cancels first-order error, while a moderate step limits both curvature error and rounding noise.",
          correct: true,
          feedback: "The central difference is more accurate than a one-sided difference for a smooth function, but an extremely small step can be lost to floating-point rounding.",
        }
      - {
          id: b,
          text: "A central difference makes the estimate exact, so the size of the step no longer matters.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Finite differences are approximations. Large steps include curvature effects, and tiny steps can be dominated by rounding.",
        }
      - {
          id: c,
          text: "The step must be tiny because a one-sided difference cannot check a neural network.",
          correct: false,
          category: misunderstood_definition,
          feedback: "One-sided differences can estimate derivatives, but central differences use changes on both sides and cancel more of the leading approximation error.",
        }
      - {
          id: d,
          text: "The step should be large enough to average the loss over every training example.",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The step changes one parameter for the numerical estimate; the loss function itself already averages over the batch.",
        }
    solution: "For a smooth loss, comparing equal positive and negative nudges cancels the leading one-sided error. The step must still be moderate: a large step measures curvature over a wider interval, while a tiny step can make the loss change indistinguishable from floating-point rounding."
  - id: lab-nn-zero-initialization
    dimension: conceptual
    type: explain
    role: core
    difficulty: 3
    est_minutes: 4
    prompt: "Suppose every hidden weight and hidden bias in a ReLU network starts at zero. Explain the hidden ReLU outputs and the loss slopes passed back through those ReLUs. Take ReLU's local derivative at $0$ as $0$."
    rubric:
      - {
          id: inactive-relu,
          criterion: "Explain that zero hidden weights and biases give each hidden neuron a score of $0$, so ReLU outputs $0$.",
          weight: 0.4,
          required: true,
        }
      - {
          id: symmetry,
          criterion: "Explain that ReLU's local derivative at $0$ is taken as $0$, so multiplying the arriving loss slope by it passes back $0$.",
          weight: 0.4,
          required: true,
        }
      - {
          id: output-bias,
          criterion: "Mention that the output bias still contributes to the prediction when all hidden outputs are $0$.",
          weight: 0.2,
          required: false,
        }
    exemplar: "Zero hidden weights and biases give every hidden neuron a score of $0$, so its ReLU output is $0$. At exactly $0$, we take ReLU's local derivative as $0$. The backward step multiplies the arriving loss slope by that local derivative, so the slope passed back through each hidden ReLU is $0$. Even when all hidden outputs are $0$, the output bias still contributes to the prediction."
  - id: bp-recall-reuse-say
    dimension: conceptual
    type: explain
    role: recall
    knowledge_point: bp-why-backprop
    difficulty: 1
    est_minutes: 1
    prompt: "In one or two sentences, what does backpropagation find by working backward from the loss, and what can it reuse when two parameters affect the same prediction?"
    rubric:
      - id: goal
        criterion: "State that it finds the loss's partial derivative for every parameter by going backward through the graph."
        weight: 1
