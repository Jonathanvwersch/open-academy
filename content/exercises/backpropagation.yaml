  - id: bp-recall-batch-contrast
    dimension: conceptual
    type: mc
    role: recall
    knowledge_point: bp-arrays
    difficulty: 1
    est_minutes: 0.5
    prompt: "A batch uses mean squared error, and $G$ holds the loss slopes for its predictions. You have summed the examples' contributions to a weight's slope using $G$. What should you do with that sum?"
    options:
      - id: a
        text: "Use it as the weight's loss slope."
        correct: true
        feedback: "The averaging in mean squared error is already included in the entries of G."
      - id: b
        text: "Divide it by the batch size."
        correct: false
        feedback: "That would average a second time, since the entries of G already include the division."
      - id: c
        text: "Multiply it by the batch size."
        correct: false
        feedback: "That would undo the division from the mean squared error and give the slope of the sum."
    solution: "Use the sum directly. The loss's average is already reflected in the prediction slopes."
  - id: bp-recall-batch-formula
    dimension: math
    type: text
    role: recall
    knowledge_point: bp-arrays
    difficulty: 1
    est_minutes: 0.5
    prompt: "For a batch with examples as rows, $G$ holds the loss slope for every score, one neuron per column. The bias slope vector is obtained by taking the ____ of $G$. Name the operation in words or write it as a NumPy expression."
    accept:
      [
        "column sums",
        "the column sums",
        "sum of each column",
        "sum down each column",
        "sum each column",
        "sum over rows",
        "sum across examples",
        "add down each column",
        "add across the rows",
        "G.sum(axis=0)",
        "G.sum(0)",
        "np.sum(G, axis=0)",
        "np.sum(G, 0)",
        "sum(axis=0)",
        "sum along axis 0",
      ]
    regex: '^\s*(?:(?:the\s+)?column[\s-]+sums?|(?:the\s+)?sum(?:s|ming)?\s+(?:(?:of|down|over|across)\s+)?(?:each|the|its)?\s*columns?|(?:sum|add)(?:s|ing)?\s+(?:over|across)\s+(?:(?:all|the|its)\s+)?(?:rows|examples)|add\s+down\s+each\s+column|sum\s+(?:along|over|on)\s+axis\s*0|(?:g\s*\.\s*)?sum\s*\(\s*(?:axis\s*=\s*)?0\s*\)|(?:np|numpy)\s*\.\s*sum\s*\(\s*g\s*,\s*(?:axis\s*=\s*)?0\s*\))\s*[.!]?\s*$'
    solution: "Sum down each column of $G$. Each bias changes every example's score in its own column by the same amount."
  - id: bp-recall-check-say
