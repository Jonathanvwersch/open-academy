  - id: bp-recall-check-formula
    dimension: math
    type: expression
    role: recall
    knowledge_point: bp-checking
    difficulty: 1
    est_minutes: 0.5
    prompt: "To check a weight $w$, take a positive nudge $\\varepsilon$ on either side. Let Lp be $L(w+\\varepsilon)$, Lm be $L(w-\\varepsilon)$ and eps be the nudge size. Write the central-difference estimate using Lp, Lm and eps."
    answer: "(Lp-Lm)/(2*eps)"
    variables: { Lp: [0, 10], Lm: [0, 10], eps: [0.001, 0.2] }
    solution: "Subtract the lower-weight loss from the higher-weight loss and divide by $2\\varepsilon$, the gap between the two weights."
