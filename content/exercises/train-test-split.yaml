concept: train-test-split
exercises:
  - id: tts-why-hold-out-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "Why hold out test data?"
    options:
      - {
          id: a,
          text: "To estimate how well the model does on houses it was never trained on",
          correct: true,
          feedback: "The held-out score estimates how well the model predicts data excluded from fitting and choices.",
        }
      - {
          id: b,
          text: "To provide extra examples for each training update so the model can fit faster.",
          correct: false,
          feedback: "Training examples, not held-out test examples, update the model.",
        }
      - {
          id: c,
          text: "To choose settings and model versions by checking the test score after every training run.",
          correct: false,
          feedback: "The validation set is used to select hyperparameters.",
        }
      - {
          id: d,
          text: "To guarantee accurate predictions on all future houses, even when they differ from training.",
          correct: false,
          feedback: "A test estimate cannot guarantee future performance.",
        }
    solution: "Test data is held out to estimate performance on data not used to fit or select the model."
  - id: tts-three-splits-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What are the roles of training, validation, and test sets?"
    options:
      - {
          id: a,
          text: "The training set fits parameters, validation data chooses settings, and test data estimates final performance.",
          correct: true,
          feedback: "Training changes parameters, validation guides choices, and test data supplies the final estimate.",
        }
      - {
          id: b,
          text: "The training set chooses settings, validation data fits parameters, and test data updates weights.",
          correct: false,
          feedback: "Training fits parameters; validation and test data do not update weights.",
        }
      - {
          id: c,
          text: "The training set estimates final performance, validation data updates weights, and test data chooses settings.",
          correct: false,
          feedback: "The test set estimates final performance and is not used to choose settings.",
        }
      - {
          id: d,
          text: "The training, validation, and test sets all fit parameters, but use different numbers of examples.",
          correct: false,
          feedback: "Only the training set fits model parameters.",
        }
    solution: "Training data fits parameters, validation data chooses settings, and test data estimates final performance."
  - id: tts-hyperparameters-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is a hyperparameter?"
    options:
      - {
          id: a,
          text: "A value learned directly from training examples as part of the model, such as a weight.",
          correct: false,
          feedback: "A learned weight is a model parameter.",
        }
      - {
          id: b,
          text: "A setting you choose before training, such as the learning rate, rather than one the model learns",
          correct: true,
          feedback: "The learning rate is chosen before a fit, while weights are learned from training examples.",
        }
      - {
          id: c,
          text: "A known target supplied alongside each training example for the model to predict.",
          correct: false,
          feedback: "Targets label examples; they are not model settings.",
        }
      - {
          id: d,
          text: "A prediction made by a model before any of its parameters have been fitted.",
          correct: false,
          feedback: "A prediction is an output, not a training setting.",
        }
    solution: "A hyperparameter is a setting chosen outside the fitted model parameters and fixed before fitting."
  - id: tts-leakage-basics
    dimension: conceptual
    type: mc
    role: basics
    difficulty: 1
    est_minutes: 1
    prompt: "What is data leakage?"
    options:
      - {
          id: a,
          text: "When validation or test data shapes the weights, or test data shapes the model choice",
          correct: true,
          feedback: "Held-out data must not fit the weights, and test data must not help choose; choosing by validation error is allowed.",
        }
      - {
          id: b,
          text: "When one training example is left out while the model is fitted.",
          correct: false,
          feedback: "Omitting a training example is not leakage because no held-out information enters fitting.",
        }
      - {
          id: c,
          text: "When the model's training loss is used to update its fitted parameters.",
          correct: false,
          feedback: "Training loss is expected to guide parameter updates.",
        }
      - {
          id: d,
          text: "When the training and test sets contain different numbers of examples.",
          correct: false,
          feedback: "Different split sizes alone do not make held-out information affect training.",
        }
    solution: "Data leakage is held-out information reaching the model beyond its set's job: validation or test data shaping the weights, or test data shaping the model choice. Choosing with validation errors is allowed."
  - id: tts-check-purpose
    dimension: conceptual
    type: mc
    role: check
    difficulty: 1
    est_minutes: 1
    prompt: "An estate agent tries 20 house-price models with different settings chosen before training, called hyperparameters. Which set should supply the prediction errors used to choose a setting?"
    options:
      - { id: a, text: "Validation", correct: true }
      - {
          id: b,
          text: "Test",
          correct: false,
          category: misunderstood_definition,
          feedback: "Choosing based on test data makes the test estimate optimistic. Keep test untouched until the end.",
        }
      - {
          id: c,
          text: "Train",
          correct: false,
          category: misunderstood_definition,
          feedback: "Training loss rewards memorising the training data; it cannot tell you how well the model handles new data.",
        }
    solution: "Compare the settings on validation sales. Training errors can reward remembering known prices, while using test errors to choose would leave no untouched final check."
  - id: dx-ml-3
    dimension: transfer
    type: mc
    role: diagnostic
    difficulty: 2
    est_minutes: 2
    prompt: "An estate agent has 1,000 sales with some house sizes missing. Before splitting, you fill missing sizes with the average size of all 1,000 houses. You then train on 800 sales and test on 200. What is wrong?"
    options:
      - {
          id: a,
          text: "Test sizes helped set the replacement value; calculate it from training sales only",
          correct: true,
        }
      - {
          id: b,
          text: "Nothing is wrong because the replacement value does not use prices",
          correct: false,
          category: misunderstood_definition,
          feedback: "Test information can affect training through house details as well as prices. Here the test sizes help set the value used in training inputs.",
        }
      - {
          id: c,
          text: "Missing training inputs should only be filled after training",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The model needs its prepared inputs during training. Split first, calculate the average from training sales, and use it to fill missing sizes.",
        }
      - {
          id: d,
          text: "Half the sales must be reserved for testing",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Changing the proportions does not stop test sizes affecting the replacement value. Calculate it from training sales only.",
        }
    solution: "Preparing inputs is called preprocessing. Its replacement values must be calculated from training sales only, after splitting. Using all sales allows information about the test houses to shape the training inputs, so the test no longer checks the whole process on genuinely unseen houses."
  - id: tts-episodes
    dimension: transfer
    type: mc
    role: transfer
    difficulty: 2
    est_minutes: 2
    prompt: "You have 60 demonstrations, each a complete recorded attempt in which a person remotely controls a robot to pick up and place an object. Each attempt contains 300 video frames, the individual camera pictures. How should you hold out data to test the robot on new attempts?"
    options:
      - { id: a, text: "Hold out 12 complete demonstrations out of the 60", correct: true }
      - {
          id: b,
          text: "Hold out a random 20% of all frames",
          correct: false,
          category: misapplied_technique,
          feedback: "Neighbouring pictures look almost identical. Splitting them can let the robot train on a picture almost identical to one used in the test.",
        }
      - {
          id: c,
          text: "Hold out the last 20% of pictures from every attempt",
          correct: false,
          category: misapplied_technique,
          feedback: "This still shares scenes and objects with training, and tests a different phase of the task.",
        }
    solution: "Keep each complete demonstration in one set. Neighbouring pictures from the same attempt show nearly the same scene, so splitting them could let the robot train on a picture almost identical to a test picture. To test new objects rather than just new attempts, also keep all demonstrations of each object together."
  - id: tts-review-test-use
    dimension: conceptual
    type: mc
    role: review
    difficulty: 1
    est_minutes: 1
    prompt: "An estate agent has chosen one of three models using validation sales. Why should the 150 test sales be checked only after all model choices are finished?"
    options:
      - {
          id: a,
          text: "Using its results to choose a version can make its error look too low for new houses",
          correct: true,
        }
      - {
          id: b,
          text: "Evaluating many times is computationally expensive",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Even a cheap check can influence the next choice. The problem is using test results to guide decisions, not the cost of calculating them.",
        }
      - {
          id: c,
          text: "The test set is smaller than the training set",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The same problem would occur with a large test set: choosing versions by its results makes it part of model selection.",
        }
    solution: "If you change the model after inspecting test results, those houses influence which version you choose. Their error can then look too low for new houses. Keep them out of every decision so they provide a final check."
  - id: tts-explain
    dimension: conceptual
    type: explain
    role: core
    difficulty: 2
    est_minutes: 4
    prompt: "An estate agent has 1,000 sales and wants to choose among three price models. Explain in 2–4 sentences why the agent needs a validation set and a separate test set, rather than one set for both jobs."
    rubric:
      - {
          id: r1,
          criterion: "Validation is used repeatedly for model/hyperparameter selection",
          weight: 2,
          required: true,
        }
      - {
          id: r2,
          criterion: "Repeated selection makes validation performance optimistic, so an untouched test set is needed for an unbiased final estimate",
          weight: 2,
          required: true,
        }
      - { id: r3, criterion: "Mentions that test should be used once / at the end", weight: 1 }
    exemplar: "Use validation sales to compare the three models and choose one. The winner may happen to suit those houses unusually well, so its validation error can look better than its error on other houses. Reserve separate test sales for checking the final choice without using them to change it."
  - id: ttsp-honest-estimate
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "You trained a price model on 800 house sales and kept 200 similar sales out of training. Which number best estimates how wrong its predictions will be for new houses?"
    options:
      - { id: a, text: "Average squared error on the 200 held-out sales", correct: true }
      - {
          id: b,
          text: "Average squared error on the 800 training sales",
          correct: false,
          category: misunderstood_definition,
          feedback: "The model was fitted to those sales, so their error can look too good for new houses.",
        }
      - {
          id: c,
          text: "Average of the training and held-out errors",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Including training error mixes in examples the model has already seen.",
        }
      - {
          id: d,
          text: "The smaller of the two average errors",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Picking whichever score is lower does not estimate performance on unseen houses.",
        }
    solution: "Use the held-out error because those sales were not used to fit the model. It is a more honest estimate of performance on new houses."
  - id: ttsp-memoriser
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt: "A house-price model has training error 0. What can you conclude about its prices for new houses?"
    options:
      - { id: a, text: "Nothing yet about how it prices unseen houses", correct: true }
      - {
          id: b,
          text: "It is the best model for future house prices",
          correct: false,
          category: incorrect_reasoning,
          feedback: "A zero training error only describes sales the model already saw; compare held-out errors to judge new houses.",
        }
      - {
          id: c,
          text: "It will predict every new house price perfectly",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Fitting known sales perfectly does not show that the model handles unseen houses.",
        }
      - {
          id: d,
          text: "Its held-out error must also be zero",
          correct: false,
          category: misunderstood_definition,
          feedback: "Held-out houses were not used for training, so their error can differ from training error.",
        }
    solution: "A model can memorise its training sales and still do badly on houses it has not seen. Check its error on held-out sales before judging it."
  - id: ttsp-pick-model
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: |
      A delivery company wants to give customers reliable arrival times. Two models predict delivery times in minutes. Their average squared errors are:

      | Model | Training deliveries | Held-out deliveries |
      |---|---:|---:|
      | A | 40 | 110 |
      | B | 55 | 48 |

      Which model is the better choice for new deliveries?
    options:
      - {
          id: a,
          text: "Model A, because its training error is lower",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Training error can reward a model for fitting examples it has already seen; use held-out error to compare performance on new deliveries.",
        }
      - { id: b, text: "Model B, because its held-out error is lower", correct: true }
      - {
          id: c,
          text: "Model A, because the two errors should be added",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Adding training error back in would let examples used for fitting influence the comparison.",
        }
      - {
          id: d,
          text: "Neither, because the two errors differ",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Training and held-out errors can differ; compare held-out errors to choose the model for new deliveries.",
        }
    solution: "Choose Model B because its held-out error is 48, compared with 110 for Model A. These deliveries were not used for training, so the comparison better reflects predictions for new deliveries."
  - id: ttsp-heldout-error
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: |
      Three held-out houses have actual prices {{=y1}}, {{=y2}} and {{=y3}} thousand pounds. Their predicted prices are {{=p1}}, {{=p2}} and {{=p3}} thousand pounds.
      What is the average squared error across these three houses? Round to the nearest 0.01 where needed.
    hints:
      ["Square each prediction minus its actual price, add the three results, then divide by 3."]
    solution: |
      The three squared errors are $({{=p1}}-{{=y1}})^2$, $({{=p2}}-{{=y2}})^2$ and $({{=p3}}-{{=y3}})^2$.
      Add them and divide by 3 because each held-out house contributes equally to the average.
    answer_expr: "((p1-y1)^2 + (p2-y2)^2 + (p3-y3)^2) / 3"
    params:
      p1: { min: 200, max: 250, step: 10 }
      p2: { min: 200, max: 250, step: 10 }
      p3: { min: 200, max: 250, step: 10 }
      y1: { min: 200, max: 250, step: 10 }
      y2: { min: 200, max: 250, step: 10 }
      y3: { min: 200, max: 250, step: 10 }
    constraints: ["p1 != y1"]
    tolerance: { abs: 0.0051 }
  - id: ttsp-why-hold-out
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt:
      Why does keeping 200 of an estate agent's 1,000 sales out of training give a better check on predictions
      for new houses than checking all 1,000 after training on them?
    options:
      - id: a
        text: The model must predict sales whose prices were unavailable during fitting
        correct: true
        feedback: Unseen prices test performance beyond remembering fitted sales.
      - id: b
        text: Fewer training sales make the model simpler, so it predicts new houses better
        correct: false
        feedback: Fewer examples do not guarantee a simpler or more accurate model.
      - id: c
        text: Checking 200 sales gives a less noisy average than checking 1,000 sales
        correct: false
        feedback: A smaller independent sample generally gives a noisier average.
      - id: d
        text: The held-out sales are more recent, so they resemble future houses more closely
        correct: false
        feedback: Holding sales out does not imply that they are more recent.
    solution:
      A model can remember the 800 training prices. The 200 held-out prices did not guide its training, so
      it must make predictions without having learned those answers. This better matches pricing new houses, provided
      the held-out houses resemble the ones it will actually encounter.
  - id: ttsp-robot-heldout
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A robot learns to grasp objects from 60 recorded attempts involving 10 objects. You want to check how well it will grasp objects it has never seen. What should you hold out?"
    options:
      - {
          id: a,
          text: "Several whole objects, keeping all their attempts out of training",
          correct: true,
        }
      - {
          id: b,
          text: "Random attempts, while the same objects stay in training",
          correct: false,
          category: misapplied_technique,
          feedback: "The robot would still see those objects during training, so this does not test new objects.",
        }
      - {
          id: c,
          text: "The last few seconds of every attempt, after training on the rest",
          correct: false,
          category: misapplied_technique,
          feedback: "Every object still appears in training, so this tests the end of familiar attempts, not new objects.",
        }
      - {
          id: d,
          text: "Random robot commands, while their objects stay in training",
          correct: false,
          category: misapplied_technique,
          feedback: "Holding out commands does not keep whole unseen objects separate from training.",
        }
    solution: "Hold out several whole objects and keep every attempt on them out of training. Then the test measures performance on objects the robot has not seen."
  - id: ttsp-which-set-fit
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "An estate agent divides 1,000 sales into training, validation and test sets. Which set supplies the prices used to adjust the model's parameters, its learned numbers?"
    options:
      - { id: a, text: "The training set, because it fits the parameters", correct: true }
      - {
          id: b,
          text: "The validation set, because it fits the parameters",
          correct: false,
          category: misunderstood_definition,
          feedback: "The validation set compares trained versions; the model's parameters are fitted on training examples.",
        }
      - {
          id: c,
          text: "The test set, because it fits the parameters",
          correct: false,
          category: misunderstood_definition,
          feedback: "The test set is kept out of fitting and used only for the final check.",
        }
      - {
          id: d,
          text: "All three sets, because all prices are available",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Using validation or test prices to fit parameters would stop those sets being held out.",
        }
    solution: "The training set is used to fit the model's parameters. Validation and test examples must stay out of that fitting process."
  - id: ttsp-which-set-choose
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt:
      You trained three versions of a house-price model. Which set should you use to choose the version with
      the lowest error?
    options:
      - id: a
        text: The training set, because it contains the most sales
        correct: false
        feedback: More examples do not remove the optimism of evaluating fitted sales.
      - id: b
        text: The validation set, because it was kept out of fitting for this job
        correct: true
        feedback: Validation sales compare versions without reusing fitted examples.
      - id: c
        text: The test set, because it gives the unseen-data score
        correct: false
        feedback: Keep test sales for a final score after selecting a version.
      - id: d
        text: The training and test sets together, because they give a larger sample
        correct: false
        feedback: This reuses fitted examples and spends the final test on model selection.
    solution:
      Use validation error to choose between trained versions. Save the test set for a final estimate after
      the choice is made.
  - id: ttsp-why-separate-test
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 1
    prompt:
      What goes wrong if an estate agent repeatedly chooses among three models using the 150 test sales, then
      reports the lowest test error?
    options:
      - id: a
        text: The reported error comes out too high, since the test set is small
        correct: false
        feedback: A small test set adds uncertainty. Selecting the lowest test error makes the reported score optimistic.
      - id: b
        text: The training error rises, since test sales leak into training
        correct: false
        feedback: Selection uses test results without necessarily changing the fitted parameters.
      - id: c
        text: The reported error looks too low, since selection favours lucky test results
        correct: true
        feedback: Choosing the best test result makes that result optimistic.
      - id: d
        text: Nothing changes, since the test sales never adjusted any weights
        correct: false
        feedback: Model selection also uses information and must stay separate from the final test.
    solution:
      Choosing by test error gives those houses the job of validation data. A model that happens to suit them
      can win, so its score may look better than its error on other houses. Compare versions on validation sales instead,
      then check the final choice on untouched test sales.
  - id: ttsp-split-counts
    dimension: math
    type: numeric
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "You have {{=N}} house sales and use a {{=100-2*validationPct}}/{{=validationPct}}/{{=validationPct}} train/validation/test split. How many sales go in the validation set?"
    hints: ["Multiply the total number of sales by the validation percentage, then divide by 100."]
    solution: "The validation set gets {{=validationPct}}% of {{=N}} sales, so {{=N}} × {{=validationPct}} ÷ 100 = {{=N*validationPct/100}} sales. Those sales are for comparing versions, not fitting them."
    answer_expr: "N * validationPct / 100"
    params:
      N: { min: 400, max: 2000, step: 200 }
      validationPct: { min: 10, max: 15, step: 5 }
    tolerance: { abs: 0.000001 }
  - id: ttsp-swap-after-test
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "An estate agent chooses a house-price model using validation error, tests it once, then tries three more versions on the test sales and reports the lowest test error. What went wrong?"
    options:
      - {
          id: a,
          text: "The test set was used to choose, so its score is now optimistic",
          correct: true,
        }
      - {
          id: b,
          text: "The validation set was used to choose, so it is no longer useful",
          correct: false,
          category: misunderstood_definition,
          feedback: "Validation is the set intended for repeated choices; the mistake was using test results to make more choices.",
        }
      - {
          id: c,
          text: "The model should have been selected using training error",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Training error can reward fitting the examples already seen; validation is used to choose versions.",
        }
      - {
          id: d,
          text: "Nothing went wrong if the lowest test score is reported",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Choosing the lowest test score uses the test set as another validation set and makes the reported result optimistic.",
        }
    solution: "Once you compare versions on test data, the test set has helped make a choice. It is now acting like validation data, so its lowest score is no longer an untouched final estimate."
  - id: ttsp-pick-version
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: |
      An estate agent compares three house-price models to choose one for setting asking prices:

      | Inputs | Validation error | Test error |
      |---|---:|---:|
      | Size | 620 | not run |
      | Size and bedrooms | 460 | 480 |
      | Size, bedrooms and 12 more details | 510 | not run |

      Which version should you select based on these results?
    options:
      - {
          id: a,
          text: "Size, because it uses fewer inputs than the others",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Model simplicity is not the selection rule here; compare validation errors to choose a version.",
        }
      - {
          id: b,
          text: "Size and bedrooms, because it has the lowest validation error",
          correct: true,
        }
      - {
          id: c,
          text: "Size, bedrooms and 12 more details, because more inputs should fit better",
          correct: false,
          category: incorrect_reasoning,
          feedback: "More inputs do not guarantee better performance; this version's validation error is higher.",
        }
      - {
          id: d,
          text: "A new version, because the test error is higher than validation",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The test result is for the already selected version; do not use it to select another version.",
        }
    solution: "Select the size-and-bedrooms version because its validation error, 460, is the lowest. Its test error of 480 is then the final estimate to report."
  - id: ttsp-param-or-hyper-w
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "A price model predicts 370 thousand pounds for a house. During training, it adjusts $w_1$, the number multiplying house size. Is $w_1$ a parameter or a hyperparameter?"
    options:
      - { id: a, text: "A parameter, because training learns its value", correct: true }
      - {
          id: b,
          text: "A hyperparameter, because training learns its value",
          correct: false,
          category: misunderstood_definition,
          feedback: "A hyperparameter is chosen before training; a value adjusted by training is a parameter.",
        }
      - {
          id: c,
          text: "An input, because it describes each house",
          correct: false,
          category: misunderstood_definition,
          feedback: "$w_1$ is an adjustable model value; house size is the input it multiplies.",
        }
      - {
          id: d,
          text: "A target, because it is predicted for each house",
          correct: false,
          category: misunderstood_definition,
          feedback: "The target is the house price; $w_1$ is a value the model learns during training.",
        }
    solution: "$w_1$ is a parameter because training adjusts its value from the training sales. A hyperparameter is a setting chosen before training."
  - id: ttsp-param-or-hyper-inputs
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt: "An engineer compares three price models: one uses size, one uses bedrooms, and one uses both. The inputs are chosen before training each model. What kind of setting is this?"
    options:
      - { id: a, text: "A hyperparameter, because it is chosen before training", correct: true }
      - {
          id: b,
          text: "A parameter, because it is chosen before training",
          correct: false,
          category: misunderstood_definition,
          feedback: "Parameters are learned during training; a setting chosen beforehand is a hyperparameter.",
        }
      - {
          id: c,
          text: "A target, because the model predicts it",
          correct: false,
          category: misunderstood_definition,
          feedback: "The target is the sale price, not the choice of inputs.",
        }
      - {
          id: d,
          text: "A training example, because it comes from sales",
          correct: false,
          category: misunderstood_definition,
          feedback: "This is a model setting, not one of the sales used to fit the model.",
        }
    solution: "Choosing which inputs to include is a hyperparameter decision because the engineer makes it before training. Training then learns parameters for that chosen model."
  - id: ttsp-why-not-train-choose
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "An estate agent tries three house-price models that use different inputs. Why not just choose the input setting with the lowest training error?"
    options:
      - { id: a, text: "It can favour a setting that memorises the training sales", correct: true }
      - {
          id: b,
          text: "Training error has no house prices to compare",
          correct: false,
          category: misunderstood_definition,
          feedback: "Training examples include prices; the problem is that the model has already used them to fit its parameters.",
        }
      - {
          id: c,
          text: "Training error cannot be calculated before a test",
          correct: false,
          category: misunderstood_definition,
          feedback: "Training error can be calculated after fitting; it is not a fair way to choose settings for new-house performance.",
        }
      - {
          id: d,
          text: "Hyperparameters cannot be compared across models",
          correct: false,
          category: incorrect_reasoning,
          feedback: "You can compare settings; use validation error rather than training error to make the choice.",
        }
    solution: "Training error is measured on sales used to fit the parameters, so a setting that memorises them can win. Validation error gives a fairer basis for choosing hyperparameters."
  - id: ttsp-why-best-of-many
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "Why does choosing the best of 20 settings for a house-price model sometimes make its validation error look too good? Here the winning validation error is 410, but its test error is 455."
    options:
      - {
          id: a,
          text: "The winning setting may happen to suit those validation houses unusually well",
          correct: true,
        }
      - {
          id: b,
          text: "The test score proves the model code has a bug",
          correct: false,
          category: incorrect_reasoning,
          feedback: "A higher test error can happen because selecting the best of many validation scores favours a lucky low score.",
        }
      - {
          id: c,
          text: "The test score should be ignored because it is higher",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The untouched test score is the final estimate. Do not discard it just because the error is higher.",
        }
      - {
          id: d,
          text: "The validation score should be reported instead",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The validation score was selected from 20 tries and can be optimistic; report the test result.",
        }
    solution: "Different reserved houses would give somewhat different errors. Comparing 20 settings gives more chances for one to fit the particular validation houses unusually well. Choosing that setting can therefore select a lucky low score as well as a useful model. The separate test houses did not help make that choice, so report their error of 455."
  - id: ttsp-gap-calc
    dimension: math
    type: numeric
    role: practice
    difficulty: 1
    est_minutes: 1
    prompt:
      A chosen house-price model has training error {{=tr}}, validation error {{=v}} used to select it among
      several models, and test error {{=t}} checked once at the end. By how much does the validation error understate
      the error to expect on new houses?
    hints:
      - Use the error measured after model selection as the estimate for new houses.
    solution: The final test supplies the unseen-house estimate. The understatement is ${{=t}}-{{=v}}={{=t-v}}$.
    answer_expr: t - v
    params:
      tr:
        min: 100
        max: 200
        step: 50
      v:
        min: 300
        max: 400
        step: 50
      t:
        min: 350
        max: 500
        step: 25
    constraints:
      - tr < v
      - v < t
      - t <= v + 100
    tolerance:
      abs: 1.0e-06
    common_wrong:
      - answer_expr: t-tr
        category: misunderstood_definition
        feedback: The reported estimate was the validation error, so compare the test error with validation error.
  - id: ttsp-duplicate-leak
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "An exact copy of a house sale appears once in training and once in test. How can this affect the test error?"
    options:
      - {
          id: a,
          text: "It can make test error too low because the model saw a copy",
          correct: true,
        }
      - {
          id: b,
          text: "It must make test error higher because rows repeat",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The model has already seen the duplicate's price in training, so that test prediction can be unusually accurate.",
        }
      - {
          id: c,
          text: "It cannot matter because the copied row is still in test",
          correct: false,
          category: misunderstood_definition,
          feedback: "The training copy gives the model information about a row that appears in test.",
        }
      - {
          id: d,
          text: "It changes training error but leaves test error fair",
          correct: false,
          category: misunderstood_definition,
          feedback: "The duplicate is in test too, so the model's prior exposure can make the test score misleading.",
        }
    solution: "The model has already seen the same sale during training, so it may predict the test copy unusually well. This makes test error too low for genuinely new houses."
  - id: ttsp-fill-average
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Some house sizes are missing. Before splitting, you fill them using the average size of all 1,000 sales. What is the problem and the fix?"
    options:
      - {
          id: a,
          text: "Test sizes shaped the average; compute it from training sales only",
          correct: true,
        }
      - {
          id: b,
          text: "Only house prices can leak; keep using all sizes",
          correct: false,
          category: misunderstood_definition,
          feedback: "Test information can leak through house details as well as prices. Calculate the average used to fill missing sizes from training sales only.",
        }
      - {
          id: c,
          text: "The average is too simple; replace every size with the largest",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Changing the summary does not fix the leakage; the test sales must not help compute it.",
        }
      - {
          id: d,
          text: "Test sizes shaped the average; compute it from test sales only",
          correct: false,
          category: incorrect_reasoning,
          feedback: "That still lets test sales set the fill value; compute the average from training sales only.",
        }
    solution: "The test sales helped set the fill value written into the training data, even though their prices were not used. Split first, then compute the average size from training sales only."
  - id: ttsp-same-house
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A house was sold in both 2019 and 2023. You want to test predictions for houses the model has never seen. How should you split these sales?"
    options:
      - { id: a, text: "Keep both sales of that house in the same set", correct: true }
      - {
          id: b,
          text: "Put each sale in a random set, like other rows",
          correct: false,
          category: misapplied_technique,
          feedback: "Then the model could see one sale of that house in training and the other in test.",
        }
      - {
          id: c,
          text: "Put the newer sale in test and the older one in training",
          correct: false,
          category: misapplied_technique,
          feedback: "The model has seen the same house in training, so this does not test a new house.",
        }
      - {
          id: d,
          text: "Keep the prices together but split the house details",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The related records must stay together; separating their details does not prevent shared house information.",
        }
    solution: "Keep both records for the same house in one set. Otherwise a training sale gives information about a house that also appears in test."
  - id: ttsp-robot-frames
    dimension: transfer
    type: mc
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "A robot learns to pick up parcels from 60 recorded attempts, each containing 300 video frames, the individual camera pictures. Randomly assigning pictures puts neighbours from one attempt in both training and test. What is the risk when testing on new attempts, and how should you split?"
    options:
      - { id: a, text: "Near-duplicate frames leak; hold out whole attempts", correct: true }
      - {
          id: b,
          text: "Frames are independent; hold out random frames as before",
          correct: false,
          category: misapplied_technique,
          feedback: "Neighbouring frames show nearly the same scene, so a random frame split can put near-duplicates in both sets.",
        }
      - {
          id: c,
          text: "The test set is too large; hold out fewer random frames",
          correct: false,
          category: incorrect_reasoning,
          feedback: "The issue is that related frames cross the split, not how many random frames are held out.",
        }
      - {
          id: d,
          text: "Training needs more examples; duplicate the test frames",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Adding test frames to training would make the leakage worse; keep each attempt in one set.",
        }
    solution: "Neighbouring pictures look almost identical, so the model can effectively see test scenes during training. Keep each complete recorded attempt in one set to keep these related pictures together."
  - id: ttsp-why-training-average
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: "Why does filling missing house sizes with the average from training sales only give a fairer test than using all 1,000 sales, including the 150 test sales?"
    options:
      - {
          id: a,
          text: "The test houses cannot influence a replacement value used to prepare the training inputs",
          correct: true,
        }
      - {
          id: b,
          text: "The average from training sales is guaranteed to be closer to every missing size",
          correct: false,
          category: misapplied_technique,
          feedback: "The training average is not guaranteed to be more accurate. It keeps test information out of the preparation used during training.",
        }
      - {
          id: c,
          text: "Using the training average removes duplicate sales automatically",
          correct: false,
          category: misapplied_technique,
          feedback: "Filling missing sizes does not remove duplicate sales. Copies must be removed or kept in the same set separately.",
        }
      - {
          id: d,
          text: "House sizes can only leak when the corresponding prices are also used",
          correct: false,
          category: incorrect_reasoning,
          feedback: "Test inputs can reveal information even without test prices. Here they would affect the average used to fill training inputs.",
        }
    solution: "If all 1,000 sizes set the average, the 150 test houses help determine values used during training. That does not match preparing a model before new houses arrive. Split first and calculate the replacement from training sales only, then use that same value to fill missing sizes in validation and test sales."
  - id: ttsp-dup-error
    dimension: math
    type: numeric
    role: practice
    difficulty: 3
    est_minutes: 2
    prompt: "An estate agent tests a price model on 150 sales. Of these, {{=k}} have identical copies in training and have squared error about 0; the other sales have average squared error {{=e}}. What is the average squared error across all 150 test sales? Round to the nearest 0.001 where needed."
    hints:
      [
        "The duplicate cases contribute about 0; multiply the other cases by their average error, then divide by 150.",
      ]
    solution: "The {{=k}} duplicate cases contribute about 0, so the total squared error is about (150 − {{=k}}) × {{=e}}. Divide by all 150 test sales to get {{=((150-k)*e/150)}}. Including easy copies lowers the reported error without improving predictions for new houses."
    answer_expr: "((150-k)*e)/150"
    params:
      k: { min: 5, max: 25, step: 5 }
      e: { min: 400, max: 600, step: 20 }
    tolerance: { abs: 0.00051 }
    common_wrong:
      - {
          answer_expr: "e",
          category: incorrect_reasoning,
          feedback: "That treats every test sale as having error {{=e}}. The {{=k}} duplicate cases contribute almost zero, lowering the average.",
        }
  - id: ttsp-fixed-error-gap
    dimension: math
    type: numeric
    role: review
    difficulty: 1
    est_minutes: 1
    prompt:
      A house-price model has training error 12, validation error 18 used to choose among five models, and test
      error 20 checked once at the end. An agent reports 18 as the error to expect on new houses. By how much is that
      too low?
    answer: 2
    tolerance:
      abs: 1.0e-06
    solution:
      The untouched test error estimates new-house error after selection. Reporting 18 understates that estimate
      by $20-18=2$.
  - id: ttsp-heldout-procedure
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: You have fitted the house-price model and now want a held-out estimate.
      Which pair of actions keeps that estimate independent of fitting?
    options:
      - id: a
        text: Predict separate sales; compare with their prices without changing weights
        correct: true
      - id: b
        text: Predict separate sales; change weights using their prices before scoring
        correct: false
        feedback: Updating weights from held-out prices makes those sales part of
          fitting.
      - id: c
        text: Predict training sales; compare with their prices without changing weights
        correct: false
        feedback: Those prices already influenced the fitted weights, even without
          another update.
      - id: d
        text: Predict training sales; change weights using their prices before scoring
        correct: false
        feedback: Training sales are not held out, and further fitting does not make
          them independent.
    solution: Use sales excluded from fitting and leave the weights unchanged when
      comparing predictions with their known prices. Both conditions keep the
      check separate from training.
  - id: ttsp-select-input-setting
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 2
    est_minutes: 2
    prompt: Two house-price models use different input choices. The size-only model
      has validation error 80; the size-and-bedrooms model has validation error
      60. Which choice and description are correct?
    options:
      - id: a
        text: Choose size and bedrooms; the input choice is a hyperparameter
        correct: true
      - id: b
        text: Choose size only; the input choice is a hyperparameter
        correct: false
        feedback: The input choice is a hyperparameter, but size and bedrooms has the
          lower validation error.
      - id: c
        text: Choose size and bedrooms; the input choice is a fitted parameter
        correct: false
        feedback: Training fits weights, while the engineer chooses which inputs to
          include.
      - id: d
        text: Choose size only; the input choice is a fitted parameter
        correct: false
        feedback: Size only has higher validation error, and the input choice is made
          outside weight fitting.
    solution: Choose size and bedrooms because its validation error is smaller. The
      input choice is a hyperparameter because it is chosen outside the fitted
      weights.
  - id: ttsp-hold-out-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why does training error rank the memoriser first while test error ranks the line model first?"
    options:
      - id: a
        text: "The memoriser stores the training prices, so only the test houses show how it handles houses it hasn't stored."
        correct: true
        feedback: "Its training error of 0 comes from storing those exact prices, which says nothing about other houses."
      - id: b
        text: "The test houses are more expensive, so every model's squared errors are bound to be larger on them."
        correct: false
        category: incorrect_reasoning
        feedback: "The line model's test errors stay at 20; the memoriser's grow because it can only copy stored prices."
      - id: c
        text: "Test error uses a different loss from training error, so the two rankings are not comparable at all."
        correct: false
        category: misunderstood_definition
        feedback: "Both are the same average squared error; only the houses they are computed on differ."
      - id: d
        text: "Two test houses are too few to average, so the test ranking is a rounding effect and can be ignored."
        correct: false
        category: incorrect_reasoning
        feedback: "Two houses keep the picture small, but the memoriser's misses of 40 are real errors on unseen houses."
    solution: "The memoriser is exact on training houses only because it stored their prices. The test houses were never stored, so they reveal that it prices new houses badly, while the line model stays within 20."
  - id: ttsp-splits-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why is B's test error of 480 reported rather than its validation error of 460?"
    options:
      - id: a
        text: "The 460 helped pick B, so it is likely a lucky low; 480 comes from sales that played no part in any choice."
        correct: true
        feedback: "Picking the lowest of several validation scores favours one that wobbled low, so the untouched test score is fairer."
      - id: b
        text: "The larger of the two numbers should always be reported, because a cautious estimate is safer to give."
        correct: false
        category: incorrect_reasoning
        feedback: "The rule is about which sales were used to choose, not about picking the larger number."
      - id: c
        text: "The test set holds more sales than the validation set, so its average error is more precise."
        correct: false
        category: math_error
        feedback: "Both sets hold 150 sales; the difference is that only the validation set was used to choose."
      - id: d
        text: "The validation sales were used to fit B's weights, so their error is really another training error."
        correct: false
        category: misunderstood_definition
        feedback: "Only the 700 training sales fit the weights; validation sales were used to choose between models."
    solution: "B won because its validation error was lowest, and the lowest of several scores tends to be a little lucky. The 150 test sales played no part in fitting or choosing, so their error of 480 is the fair estimate."
  - id: ttsp-hyper-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why is size and bedrooms chosen even though the model with 14 inputs has the lowest training error, 280?"
    options:
      - id: a
        text: "No validation sale was used to fit any weights, so the lowest validation error, 460, shows which does best on unseen houses."
        correct: true
        feedback: "Validation error compares the settings on houses none of them was fitted to."
      - id: b
        text: "Models with fewer inputs are always better, so the simpler model would be chosen whatever the errors were."
        correct: false
        category: incorrect_reasoning
        feedback: "Size only has fewer inputs still but a higher validation error, 620; the choice follows the validation errors."
      - id: c
        text: "Size and bedrooms had the lowest test error of the three, and the test set decides between settings."
        correct: false
        category: misunderstood_definition
        feedback: "Only the chosen model is scored on the test set, and only after the choice is made."
      - id: d
        text: "A training error of 280 is too low to be correct, so the 14-input model must have a bug in it."
        correct: false
        category: incorrect_reasoning
        feedback: "A low training error is expected when more inputs let the weights fit those particular houses closely."
    solution: "The 14 inputs let the weights fit the training houses closely, which lowers training error without helping on new houses. Validation sales were not used for fitting, so their errors, 620, 460 and 510, pick size and bedrooms."
  - id: ttsp-leakage-self-explain
    lesson_only: true
    dimension: conceptual
    type: mc
    role: practice
    difficulty: 1
    est_minutes: 2
    prompt: "In the worked example, why are the missing sizes filled with 100 rather than 115?"
    options:
      - id: a
        text: "The 115 includes the test house's size, 160, so test information would shape the training inputs."
        correct: true
        feedback: "The training-only average, 100, keeps every test value out of the processing."
      - id: b
        text: "The 100 is closer to the true missing sizes, because training houses are measured more accurately."
        correct: false
        category: incorrect_reasoning
        feedback: "The missing sizes are unknown; the reason is that 115 uses a test house's size."
      - id: c
        text: "The 115 counts the missing sizes as zero, so it is an arithmetic mistake rather than a leak."
        correct: false
        category: math_error
        feedback: "The 115 averages the four known sizes correctly; its problem is that one of them is a test size."
      - id: d
        text: "The test houses should instead be filled with their own average, 160, kept apart from training."
        correct: false
        category: misapplied_technique
        feedback: "Every set uses the value computed from training, so test houses are filled with 100 too."
    solution: "Averaging all known sizes gives 115 only because the test size 160 is included, which lets a test house change the training data. Computing the average from training sizes gives 100, used for every set."
