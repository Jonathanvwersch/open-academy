id: robot-learning
title: Robot Learning
description: "Learning robot behaviour from data: multimodal and generative models, imitation learning, robot policies, foundation and world models, and an end-to-end capstone."
units:
  - title: Multimodal and generative models
    intro: "Models that see and generate: vision transformers, CLIP, vision-language models and self-supervised JEPA, then diffusion and flow matching, which later generate robot actions and video."
    project: generative-toy
    papers:
      - clip
      - i-jepa
      - llava
      - vit
    concepts:
      - vision-encoders
      - image-text-alignment
      - jepa
      - vision-language-models
      - diffusion-models
      - flow-matching
  - title: Imitation learning
    intro: "Teaching a robot by showing it: action representations, learning a policy from demonstrations by state or by camera, why it breaks when the robot drifts off course, how to fix that, and how to measure success honestly."
    project: bc-policy
    papers:
      - act-aloha
      - dagger
      - robomimic
    concepts:
      - demonstrations
      - obs-action-datasets
      - action-representations
      - behavioral-cloning
      - distribution-shift
      - dagger
      - vision-conditioned-policies
      - policy-evaluation
      - statistical-evaluation
      - bc-vs-rl
  - title: Robot policies
    intro: "The policy designs behind today's robot learning: action chunking, diffusion and transformer policies, getting a policy trained in simulation to work on a real robot, and running it fast enough."
    project: chunking-policy
    papers:
      - diffusion-policy
    concepts:
      - action-chunking
      - diffusion-policies
      - transformer-policies
      - sim-to-real
      - robot-inference-latency
  - title: Robot foundation models and world models
    intro: "Large pretrained robot models: vision-language-action models, their action heads and training data across many robots, and world models that predict what happens next, from model-based RL to video world models."
    project: robot-policy-finetune
    papers:
      - dreamerv3
      - dreamzero
      - pi0
      - rt-2
      - v-jepa-2
    concepts:
      - vla-models
      - vla-action-heads
      - robot-foundation-models
      - embodiment-gap
      - world-models
      - video-world-models
      - world-action-models
      - landmark-robot-learning-papers
  - title: End-to-end robot learning and capstone
    intro: "Running a robot-learning project properly from data to deployed policy: data pipelines, failure analysis, system design and judging results critically, in a full capstone."
    project: capstone
    papers:
      - deep-rl-that-matters
      - droid
      - open-x-embodiment
      - simpler-env
      - statistical-precipice
      - troubling-trends
    concepts:
      - data-pipelines-robotics
      - failure-analysis
      - system-design-ml
      - critical-evaluation
