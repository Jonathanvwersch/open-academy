id: robotics
title: Classical Robotics
description: "Frames, transforms, kinematics, motion planning, sensors, control and perception: the foundations every robot-learning system sits on."
subject: robotics
units:
  - title: Robotics foundations
    intro: "How robots describe where things are: coordinate frames, rotations and transforms, then working out where an arm's hand is from its joint angles, and back."
    project: planar-arm
    papers:
      - dexterous-in-hand-manipulation
      - rrt-star
    concepts:
      - coordinate-frames
      - rotation-matrices
      - rigid-transforms
      - homogeneous-transforms
      - robot-joints
      - forward-kinematics
      - inverse-kinematics
      - motion-planning-basics
  - title: Robotics control and perception
    intro: "How a robot senses the world and acts on it: sensors, cameras, feedback control and basic dynamics."
    project: control-sim
    papers:
      - domain-randomization
      - dope-pose-estimation
      - end-to-end-visuomotor-policies
    concepts:
      - robot-state-observation-action
      - sensors
      - camera-geometry
      - pid-control
      - dynamics-basics
      - perception-pipelines
