id: deep-rl-that-matters
title: Deep Reinforcement Learning that Matters
authors: Henderson et al.
year: 2017
est_minutes: 60
source:
  arxiv: 1709.06560v3
concepts:
  - critical-evaluation
  - statistical-evaluation
  - experimental-design
why_this_week: This week you learn to judge research critically. This paper re-ran popular deep reinforcement learning algorithms and showed that random seeds, hyperparameters and even which implementation you use can change results as much as the algorithm does. It is the clearest lesson in why a single training curve proves little.
how_to_read: Read the introduction. Then read each experimental section on hyperparameters, network architecture, reward scale, random seeds, environments and codebases. For each, note the figure that shows the effect. Read the section on reporting and significance testing and the recommendations at the end.
questions:
  - id: claim
    kind: claim
    prompt: What is the paper's main claim about reported results in deep reinforcement learning?
  - id: method
    kind: method
    prompt: Which factors do the authors vary, and how do they test each one's effect?
  - id: evidence
    kind: evidence
    prompt: What is the most convincing piece of evidence? Look at the random-seed experiment.
  - id: limitations
    kind: limitations
    prompt: Their recommendations include running more seeds and using significance tests. What do these still not fix, and what would they cost?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the claim: many deep RL results are hard to reproduce because factors other than the algorithm change outcomes a lot"
      weight: 2
      required: true
    - id: r2
      criterion: "Explains the method: controlled re-runs varying hyperparameters, architecture, reward scale, seeds, environments and implementations"
      weight: 2
      required: true
    - id: r3
      criterion: Describes the evidence, e.g. two groups of runs of the same algorithm differing only in random seeds give significantly different learning curves
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. a few algorithms and continuous-control environments, or more seeds cost a lot of compute
      weight: 1
      required: false
  exemplar: Henderson and colleagues argue that many deep reinforcement learning results cannot be trusted, because factors other than the algorithm change outcomes a great deal. They re-ran popular algorithms on standard simulated control tasks, varying hyperparameters, network sizes, reward scaling, environments, code implementations and random seeds. Even the same algorithm with the same settings, split into two groups of runs differing only in random seed, produced learning curves that looked significantly different. Implementations of the same algorithm from different codebases also gave very different results. They recommend running many seeds, reporting all settings and using proper significance tests, but that costs much more compute and still covers only the tasks tested.
