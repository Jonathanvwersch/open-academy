id: dreamzero
title: "World Action Models are Zero-shot Policies"
authors: Ye et al. (NVIDIA)
year: 2026
est_minutes: 90
source:
  arxiv: 2602.15922v1
concepts:
  - world-action-models
  - video-world-models
  - vla-action-heads
why_this_week: 'This week you meet VLAs, which predict only actions, and video world models, which predict what the camera will see next. DreamZero joins the two. It is the paper that named "world action models": a pretrained video-generation model that predicts the robot''s future video and its actions together. It is a direct challenge to the VLA approach, and it learns from videos of humans and other robots.'
how_to_read: "Read the introduction and section 2.2 to see how DreamZero differs from VLAs and earlier video-model policies. Read section 3.1 closely: how one video diffusion model predicts both future frames and actions. Skim section 3.2 on running a 14B model in real time. Read section 5.1 for the main generalisation results against VLAs, then section 6. Appendix H on failure cases is worth a look for the limitations question."
questions:
  - id: claim
    kind: claim
    prompt: What does the paper claim VLAs struggle with, and why should predicting future video as well as actions help?
  - id: method
    kind: method
    prompt: How does DreamZero turn a pretrained video-generation model into a robot policy? Explain what it predicts at each step and how it outputs actions.
  - id: evidence
    kind: evidence
    prompt: What evidence supports the claim? Look at the unseen tasks and environments compared with VLAs, and the results from video-only demonstrations and a new robot.
  - id: limitations
    kind: limitations
    prompt: DreamZero is a 14B model and was evaluated on the authors' own tasks. What does that mean for cost, speed and how far you can trust the comparison? Use the failure cases too.
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the claim: VLAs generalise poorly to new physical motions and environments, and a model that jointly predicts future video and actions generalises better"
      weight: 2
      required: true
    - id: r2
      criterion: "Explains the method: starts from a pretrained video diffusion model and trains it to predict future video frames and robot actions together, so video acts as a dense signal of how the world changes"
      weight: 2
      required: true
    - id: r3
      criterion: "Describes the evidence: over 2× better generalisation to unseen tasks and environments than state-of-the-art VLAs on real robots, gains from video-only demonstrations, or adapting to a new robot with about 30 minutes of data"
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. a very large model that needs heavy optimisation and compute to run at 7 Hz, evaluation on the authors' own tasks, or the failure cases
      weight: 1
      required: false
  exemplar: "DreamZero tackles the problem that VLAs, built on vision-language models, understand instructions well but struggle with physical motions and environments they have not seen. Its key idea is a world action model: a pretrained video-generation model trained to predict both the robot's future camera video and its actions, so the video teaches it how the world moves. Through model and system optimisations, the 14B model runs in a closed loop at 7 Hz. On real robots it generalised to new tasks and environments over twice as well as state-of-the-art VLAs, improved from short video-only demonstrations of humans or other robots, and adapted to a new robot with 30 minutes of data. A limitation is that the model is very large and needs heavy optimisation to run in real time, and the evaluations use the authors' own tasks."
