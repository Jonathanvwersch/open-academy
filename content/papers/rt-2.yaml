id: rt-2
title: "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control"
authors: Brohan et al. (Google DeepMind)
year: 2023
week: 12
est_minutes: 75
source:
  arxiv: 2307.15818v1
concepts:
  - vla-models
  - vision-language-models
  - action-representations
why_this_week: This week you study vision-language-action models (VLAs). RT-2 is the paper that named them. It fine-tunes a large vision-language model to output robot actions written as text tokens, so knowledge from the web, such as what an object is, carries over into what the robot can do.
how_to_read: Read the introduction and the overview figure. Read the section on representing actions as tokens and on co-fine-tuning with web data. Read the generalisation results compared with RT-1, and the examples of new abilities, such as following instructions about objects never seen in robot data. Skim the chain-of-thought section.
questions:
  - id: claim
    kind: claim
    prompt: What is the main claim about using a vision-language model as a robot policy?
  - id: method
    kind: method
    prompt: How are robot actions turned into tokens, and why does the training mix in web vision-language data alongside robot data?
  - id: evidence
    kind: evidence
    prompt: What evidence supports the claim? Compare RT-2 and RT-1 on familiar and unfamiliar situations, and look at the emergent abilities.
  - id: limitations
    kind: limitations
    prompt: What can RT-2 not learn from web data, and what do its model sizes mean for how fast it can run on a robot?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the claim: a vision-language model fine-tuned to output actions as tokens transfers web knowledge to robot control"
      weight: 2
      required: true
    - id: r2
      criterion: "Explains the method: discretise each action dimension into bins written as tokens, and co-fine-tune on robot trajectories mixed with web vision-language data"
      weight: 2
      required: true
    - id: r3
      criterion: "Describes the evidence: about twice RT-1's success in unseen situations, and new abilities such as following instructions about objects or concepts absent from robot data"
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. it gains no new physical skills beyond those in the robot data, or large models run slowly
      weight: 1
      required: false
  exemplar: RT-2 asks whether a large vision-language model, pretrained on web images and text, can become a robot policy that inherits that web knowledge. Each robot action dimension is discretised into bins and written as tokens, so actions are just another kind of text the model outputs. The model is co-fine-tuned on robot demonstrations mixed with web vision-language data, so it keeps its general knowledge. In unseen situations it succeeded about twice as often as RT-1, and it could follow instructions involving objects and ideas that never appeared in robot data, like moving an object to a picture of a particular celebrity. A limitation is that it learns no new physical motions beyond the robot data, and its large models run slowly.
