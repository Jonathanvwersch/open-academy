id: dreamerv3
title: Mastering Diverse Domains through World Models
authors: Hafner, Pasukonis, Ba and Lillicrap
year: 2023
week: 14
est_minutes: 90
source:
  arxiv: 2301.04104v2
concepts:
  - world-models
  - mdp
  - value-functions
why_this_week: "This week you meet world models: learning a model of what happens next and training the policy inside it, which needs far less real experience. DreamerV3 is the most influential recent example. It uses one fixed set of settings across very different tasks and was the first to collect diamonds in Minecraft from scratch."
how_to_read: Read the introduction and look at the overview figure of the world model and the actor-critic learning in imagination. Read the section on the world model, focusing on what it predicts. Read the section on the techniques that make one set of hyperparameters work everywhere, such as symlog. Read the Minecraft result and the comparison across domains.
questions:
  - id: claim
    kind: claim
    prompt: What is the paper's main claim, and why is a single fixed configuration across domains notable?
  - id: method
    kind: method
    prompt: How does Dreamer learn a policy without acting in the real environment for every update? Describe the world model and training in imagination.
  - id: evidence
    kind: evidence
    prompt: What evidence supports the claim? Look at the number of domains, the baselines and the Minecraft diamond result.
  - id: limitations
    kind: limitations
    prompt: What does a learned world model get wrong, and how might that hurt a policy trained inside it on a real robot?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the claim: one algorithm with fixed hyperparameters learns well across many different domains, by learning a world model"
      weight: 2
      required: true
    - id: r2
      criterion: "Explains the mechanism: learn a model that predicts future latent states, rewards and episode ends, then train an actor and critic on imagined rollouts"
      weight: 2
      required: true
    - id: r3
      criterion: "Describes the evidence: strong results across over 150 tasks and many domains, and collecting diamonds in Minecraft without human data"
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. model errors can be exploited by the policy, or results are mainly in simulation and games
      weight: 1
      required: false
  exemplar: DreamerV3 tackles the problem that reinforcement learning algorithms usually need retuning for every new domain. It learns a world model that compresses observations into a compact latent state and predicts future states, rewards and when episodes end. An actor and critic are then trained on imagined rollouts inside that model, so much less real experience is needed. Techniques like the symlog transform, which squashes very large values, let one fixed set of hyperparameters work everywhere. Across over 150 tasks in many domains it matched or beat specialised methods, and it was the first to collect diamonds in Minecraft from scratch, though its results are in simulation and games rather than on real robots.
