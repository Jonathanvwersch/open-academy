id: rrt-star
title: Sampling-based Algorithms for Optimal Motion Planning
authors: Karaman and Frazzoli
year: 2011
week: 8
est_minutes: 90
source:
  arxiv: 1105.1186v1
concepts:
  - motion-planning-basics
  - coordinate-frames
why_this_week: "This week ends with motion planning: finding a collision-free path for a robot. Sampling-based planners, which build a tree or graph from random robot configurations, are the standard tool. This paper shows the popular RRT planner gets stuck on poor paths and introduces RRT*, which keeps improving its path as it samples more."
how_to_read: This is a long theory paper, so read selectively. Read the introduction and the problem statement. Read the descriptions of RRT and RRT* and their pseudocode, and draw a small example on paper. Read the statements of the main results but skip the proofs. Look at the simulation figures comparing RRT and RRT* trees.
questions:
  - id: claim
    kind: claim
    prompt: What do the authors prove about the paths RRT finds, and what new property do they want instead?
  - id: method
    kind: method
    prompt: What does RRT* do differently from RRT when it adds a new sample? Explain choosing the best parent and rewiring.
  - id: evidence
    kind: evidence
    prompt: What evidence supports the claims, beyond the proofs? Look at the simulation figures.
  - id: limitations
    kind: limitations
    prompt: What does RRT* cost compared with RRT, and what assumptions about the robot and the world does the analysis make?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the problem: RRT finds a path but almost surely converges to a suboptimal one, and the goal is a planner whose path approaches the optimum"
      weight: 2
      required: true
    - id: r2
      criterion: "Explains RRT*: connect each new sample to the nearby node giving the cheapest path, then rewire neighbours through it if that shortens their paths"
      weight: 2
      required: true
    - id: r3
      criterion: "Describes the evidence: proofs of asymptotic optimality plus simulations where RRT* paths keep shortening while RRT paths do not"
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. extra computation per sample, or the analysis assumes simple geometric motion rather than real robot dynamics
      weight: 1
      required: false
  exemplar: "Karaman and Frazzoli study sampling-based motion planners, which find paths by randomly sampling robot configurations. They prove that the popular RRT algorithm finds a path but, with probability one, never converges to the shortest one. RRT* fixes this: when it adds a sample, it connects it to whichever nearby node gives the cheapest path, then rewires nearby nodes through the new one if that shortens their paths. They prove its path cost approaches the optimum as samples grow, at a similar cost per sample to RRT, and simulations show its paths keep improving. A limitation is that the analysis assumes simple geometric motion, while real robots have dynamics that make connecting two configurations much harder."
