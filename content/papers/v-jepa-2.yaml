id: v-jepa-2
title: "V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning"
authors: Assran et al.
year: 2025
week: 14
est_minutes: 90
source:
  arxiv: 2506.09985v1
concepts:
  - jepa
  - video-world-models
why_this_week: "This week you meet video world models. V-JEPA 2 takes the JEPA idea from Week 9 to video at scale, then adds actions to make a world model that predicts in embedding space instead of generating frames. With under 62 hours of unlabelled robot video, it picks and places objects on robot arms in new labs, with no task-specific training or reward."
how_to_read: "Read the introduction and the overview figure. Read the pretraining section on learning from over a million hours of video without actions. Skim the understanding and anticipation results, and skip the video question-answering section. Read the V-JEPA 2-AC section closely, focusing on how actions are added, how planning toward a goal image works, and the robot experiments. Read the limitations."
questions:
  - id: claim
    kind: claim
    prompt: What does the paper claim about combining internet-scale video with a small amount of robot data?
  - id: method
    kind: method
    prompt: "Explain the two stages: what V-JEPA 2 learns from video without actions, and how V-JEPA 2-AC then uses actions and a goal image to plan robot motions."
  - id: evidence
    kind: evidence
    prompt: What evidence supports the planning claim? Look at what robots, labs and tasks were used and what data was collected in those labs.
  - id: limitations
    kind: limitations
    prompt: What are the limits of planning this way, for example task length, needing a goal image, or sensitivity to the camera position?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the claim: self-supervised learning on web-scale video plus a little robot interaction data yields a world model that can plan in the physical world"
      weight: 2
      required: true
    - id: r2
      criterion: "Explains the method: V-JEPA 2 predicts embeddings of hidden parts of videos without actions; V-JEPA 2-AC adds actions using robot video and plans by searching for actions whose predicted embedding reaches the goal image's embedding"
      weight: 2
      required: true
    - id: r3
      criterion: Describes the evidence, e.g. over 1 million hours of pretraining video, under 62 hours of unlabelled DROID robot video, and zero-shot pick-and-place on Franka arms in two labs
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. short tasks only, the need for an image of the goal, or sensitivity to camera placement
      weight: 1
      required: false
  exemplar: "Assran and colleagues ask whether a robot can learn to understand and act in the world mostly by watching video. They first train V-JEPA 2 on over a million hours of internet video to predict the embeddings of hidden parts of each clip, with no actions or labels. They then train V-JEPA 2-AC, which adds actions, on under 62 hours of unlabelled robot video from the DROID dataset. To act, the robot searches for actions whose predicted future embedding comes closest to the embedding of a goal image. Franka arms in two labs picked and placed objects this way without any data collected there and without task-specific training or reward, though planning toward a goal image limits it to short tasks."
