id: vit
title: "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale"
authors: Dosovitskiy et al.
year: 2020
est_minutes: 75
source:
  arxiv: 2010.11929v2
concepts:
  - vision-encoders
  - attention
  - transformer-block
why_this_week: "This week starts with vision encoders. ViT showed that the transformer from Week 5 works on images almost unchanged: cut the image into patches and treat each patch as a token. The vision encoders in CLIP, in vision-language models and in most VLAs are ViTs."
how_to_read: "Read the introduction and the method section with its architecture figure: patches, the linear patch embedding, position embeddings and the class token. Read the results comparing ViT with ResNets at different pretraining dataset sizes. Look at the figures of attention maps and learned position embeddings. Skip the appendices."
questions:
  - id: claim
    kind: claim
    prompt: What is the main claim about using a standard transformer for images?
  - id: method
    kind: method
    prompt: How does ViT turn an image into a sequence of tokens, and how does it produce a classification?
  - id: evidence
    kind: evidence
    prompt: What evidence supports the claim? Look at how ViT compares with ResNets as the pretraining dataset grows.
  - id: limitations
    kind: limitations
    prompt: ViT underperforms comparable ResNets when trained on ImageNet alone. What do the authors say causes this, and what does it imply about data needs?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the claim: a standard transformer applied to sequences of image patches matches or beats CNNs when pretrained on enough data"
      weight: 2
      required: true
    - id: r2
      criterion: "Explains the method: split the image into 16x16 patches, embed each linearly, add position embeddings and a class token, and run a transformer encoder"
      weight: 2
      required: true
    - id: r3
      criterion: "Describes the evidence: ViT beats strong ResNets when pretrained on large datasets (ImageNet-21k, JFT-300M), but not on ImageNet alone"
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. needs very large pretraining data because it lacks CNN built-in assumptions about images, or attention cost with many patches
      weight: 1
      required: false
  exemplar: Dosovitskiy and colleagues ask whether the transformer, unchanged, can replace convolutional networks for images. ViT cuts an image into 16 by 16 pixel patches, flattens and linearly embeds each patch as a token, adds position embeddings and a special class token, and runs a standard transformer encoder. When pretrained on very large datasets like JFT-300M, it matches or beats the best ResNets at lower training cost. Trained on ImageNet alone, though, it does worse than comparable ResNets. The authors attribute this to ViT lacking the built-in assumptions CNNs make about nearby pixels, so it needs much more data to learn them.
