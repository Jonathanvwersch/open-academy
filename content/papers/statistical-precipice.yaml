id: statistical-precipice
title: Deep Reinforcement Learning at the Edge of the Statistical Precipice
authors: Agarwal, Schwarzer, Castro, Courville and Bellemare
year: 2021
est_minutes: 75
source:
  arxiv: 2108.13264v4
concepts:
  - statistical-evaluation
  - critical-evaluation
why_this_week: "This week you learn to evaluate claims statistically. Most deep learning papers report averages over a handful of runs, which can be misleading. This paper shows how often that changes conclusions, and gives practical tools you can use in your own capstone: confidence intervals over tasks and runs, the interquartile mean and performance profiles."
how_to_read: "Read the introduction and the section showing how much results on a standard benchmark vary with only a few runs. Read the recommendations closely: stratified bootstrap confidence intervals, performance profiles, the interquartile mean and the probability of improvement. Read the re-evaluation of earlier published comparisons. Skip the appendices."
questions:
  - id: claim
    kind: claim
    prompt: What problem with how results are usually reported does the paper identify?
  - id: method
    kind: method
    prompt: "Explain two of their recommended tools: what each one measures and why it is better than a mean or median of a few runs."
  - id: evidence
    kind: evidence
    prompt: What evidence shows the problem is real? Look at their re-evaluation of earlier published results.
  - id: limitations
    kind: limitations
    prompt: More careful statistics can't fix a bad benchmark or too few tasks. What else limits how much you can conclude?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the problem: results from only a few runs, reported as single averages, are unreliable and can mislead"
      weight: 2
      required: true
    - id: r2
      criterion: Explains at least one tool correctly, e.g. bootstrap confidence intervals, the interquartile mean, or performance profiles
      weight: 2
      required: true
    - id: r3
      criterion: "Describes the evidence: re-analysis of published comparisons shows some claimed improvements disappear or reverse once uncertainty is accounted for"
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. statistics cannot fix benchmark choice, or more runs still cost compute
      weight: 1
      required: false
  exemplar: Agarwal and colleagues show that deep RL results, usually reported as an average over a few runs, carry so much uncertainty that conclusions can be wrong. On a standard Atari benchmark, they show how widely estimated scores vary from only a few runs. They recommend reporting confidence intervals from bootstrap resampling across runs and tasks, the interquartile mean, which averages the middle half of runs and ignores outliers, and performance profiles showing the share of runs above each score. Re-analysing earlier published comparisons with these tools, they find several claimed improvements are much less clear than reported. A limitation is that careful statistics cannot fix a benchmark that does not measure what you care about.
