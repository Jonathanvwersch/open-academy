id: llava
title: Visual Instruction Tuning
authors: Liu, Li, Wu and Lee
year: 2023
week: 9
est_minutes: 75
source:
  arxiv: 2304.08485v2
concepts:
  - vision-language-models
  - post-training
  - image-text-alignment
why_this_week: "This week you learn how vision-language models are built and post-trained. LLaVA showed a simple, cheap recipe: connect a pretrained CLIP image encoder to a pretrained language model with a small projection, then fine-tune on instruction-following conversations about images. This is the same pattern VLAs follow next week, with robot actions added."
how_to_read: Read the introduction and the section on how the instruction data was generated with a text-only GPT-4. Read the architecture section with its figure and the two-stage training procedure. Read the evaluation results, including the Science QA result. Skim the qualitative examples.
questions:
  - id: claim
    kind: claim
    prompt: What does the paper claim, and why was instruction-following data for images hard to get?
  - id: method
    kind: method
    prompt: Describe the architecture and the two training stages. Which parts are frozen in each stage?
  - id: evidence
    kind: evidence
    prompt: How do the authors evaluate LLaVA, and what results support their claim?
  - id: limitations
    kind: limitations
    prompt: The training data was written by a language model that never saw the images, only captions and boxes. What errors could that introduce, and how reliable is a benchmark scored by GPT-4?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the claim: tuning on machine-generated visual instruction data gives a capable general-purpose vision-language assistant"
      weight: 2
      required: true
    - id: r2
      criterion: "Explains the method: CLIP image features are projected into the language model's token space; stage one trains the projection only, stage two fine-tunes the projection and language model"
      weight: 2
      required: true
    - id: r3
      criterion: Describes the evidence, e.g. results on their GPT-4-scored benchmark and state-of-the-art on Science QA when combined with GPT-4
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. generated data can contain errors because the generator never saw the images, or evaluation relies on GPT-4 as judge
      weight: 1
      required: false
  exemplar: Liu and colleagues want a general vision-language assistant, but instruction-following conversations about images were scarce. They generated about 158,000 examples by giving a text-only GPT-4 the captions and object boxes of images and asking it to write conversations, descriptions and reasoning questions. LLaVA connects a pretrained CLIP image encoder to a pretrained language model with a projection that maps image features into the language model's token space. It first trains only the projection to align the two, then fine-tunes the projection and language model on the instruction data. It does well on their GPT-4-scored benchmark and on Science QA, but the generated data can contain mistakes because GPT-4 never saw the images.
