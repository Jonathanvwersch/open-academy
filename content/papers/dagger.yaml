id: dagger
title: A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning
authors: Ross, Gordon and Bagnell
year: 2010
week: 10
est_minutes: 75
source:
  arxiv: 1011.0686v3
concepts:
  - dagger
  - distribution-shift
  - behavioral-cloning
why_this_week: This week you learn that behavioural cloning breaks when the robot drifts into states the demonstrations never covered. This is the paper that introduced DAgger, the fix you study this week. It also gives the clearest argument for why small imitation errors compound over time.
how_to_read: Read the introduction and the preliminaries that explain why errors compound for plain supervised imitation. Read the description of the DAgger algorithm closely. Read the statement of the main guarantee, but skip the proofs. Read the experiments, especially the racing and Mario games.
questions:
  - id: claim
    kind: claim
    prompt: What does the paper show about plain behavioural cloning when the learner makes small mistakes?
  - id: method
    kind: method
    prompt: Describe the DAgger loop. Whose states are recorded, and whose actions label them?
  - id: evidence
    kind: evidence
    prompt: What experiments support DAgger, and what does it beat?
  - id: limitations
    kind: limitations
    prompt: DAgger needs an expert who can label any state the learner visits. When is that hard with a real robot and a human teleoperator?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the problem: a cloned policy's small mistakes take it to unfamiliar states, so errors compound over the episode"
      weight: 2
      required: true
    - id: r2
      criterion: "Explains DAgger: run the current policy, ask the expert to label the visited states, add them to the dataset, retrain, repeat"
      weight: 2
      required: true
    - id: r3
      criterion: "Describes the evidence: experiments such as the Super Tux Kart racing and Super Mario Bros games where DAgger beats behavioural cloning"
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. needs an expert to label states on demand, which is hard or unsafe on real robots
      weight: 1
      required: false
  exemplar: "Ross and colleagues show that behavioural cloning, training a policy to copy an expert's actions, has a hidden problem: when the policy makes a small mistake it reaches states the expert never visited, so mistakes compound over an episode. DAgger fixes this by repeatedly running the current policy, asking the expert what it should have done in the states it actually visited, adding those labelled states to the dataset and retraining. They prove this keeps errors growing only linearly with episode length rather than quadratically. In experiments on the racing game Super Tux Kart and on Super Mario Bros, DAgger's policies made far fewer failures than behavioural cloning. A limitation is that it needs an expert who can label any state on demand, which is hard with a human teleoperating a real robot."
