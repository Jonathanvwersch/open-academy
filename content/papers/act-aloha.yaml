id: act-aloha
title: Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware
authors: Zhao, Kumar, Levine and Finn
year: 2023
week: 8
est_minutes: 90
source:
  arxiv: 2304.13705v1
concepts:
  - behavioral-cloning
  - demonstrations
  - distribution-shift
why_this_week: This week you see that behavioural cloning drifts because its errors compound. This paper, which introduced ACT (Action Chunking with Transformers) and the ALOHA robot, cuts the problem down by predicting a short sequence of future actions at once instead of one action at a time. With about 50 demonstrations it learns precise two-arm tasks. You will study action chunking itself in Week 11.
how_to_read: "Read the introduction and the ALOHA hardware section for the main idea of cheap teleoperation. Read the ACT method closely: action chunking, temporal ensembling, and the overall architecture figure. You can skim the details of the variational autoencoder for now. Read the task descriptions and the main results table, then the ablations on chunk size."
questions:
  - id: claim
    kind: claim
    prompt: What problem does the paper set out to solve, and what two things does it contribute?
  - id: method
    kind: method
    prompt: What is action chunking, and why should predicting several future actions at once reduce compounding errors? What does temporal ensembling add?
  - id: evidence
    kind: evidence
    prompt: What results show ACT works? Look at success rates against other methods and at the chunk-size ablation.
  - id: limitations
    kind: limitations
    prompt: What did the method still find hard, and what does relying on about 50 demonstrations per task mean for generalising to new objects or scenes?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the problem (precise two-arm manipulation is hard and usually needs expensive robots) and the two contributions: ALOHA hardware and the ACT algorithm"
      weight: 2
      required: true
    - id: r2
      criterion: "Explains action chunking: predict the next k actions at once, so the policy makes fewer decisions per episode and compounding errors shrink; temporal ensembling averages overlapping predictions"
      weight: 2
      required: true
    - id: r3
      criterion: "Describes the evidence: high success on fine tasks from about 50 demonstrations, outperforming earlier methods, plus ablations showing chunking matters"
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. each policy learns one task in one setting, or some tasks still had low success
      weight: 1
      required: false
  exemplar: Zhao and colleagues want robots to do precise two-handed tasks, like inserting a battery, without expensive hardware. They built ALOHA, a low-cost two-arm teleoperation system, and ACT, a transformer policy trained by behavioural cloning on about 50 demonstrations per task. ACT predicts a chunk of the next several actions at once instead of one at a time, which means fewer decisions per episode and so less compounding error, and temporal ensembling averages the overlapping predictions for smooth motion. ACT reached high success rates on several fine-grained tasks where earlier imitation methods mostly failed, and ablations show chunking is what makes the difference. A limitation is that each policy learns one task in one setting, so it does not show generalisation to new objects or scenes.
