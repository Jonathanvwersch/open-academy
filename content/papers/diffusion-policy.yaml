id: diffusion-policy
title: "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion"
authors: Chi et al.
year: 2023
week: 13
est_minutes: 90
source:
  arxiv: 2303.04137v5
concepts:
  - diffusion-policies
  - action-chunking
  - action-representations
why_this_week: "This week you study modern robot policies. Diffusion Policy produces robot actions the way image generators produce images: start from random noise and remove it step by step. This copes with demonstrations that show several valid ways to do a task, where averaging them would fail. It became one of the most common policy types in robot learning."
how_to_read: Read the introduction and the figure on multimodal action distributions. Read the method section on denoising action sequences conditioned on observations, and the parts on predicting action sequences and visual conditioning. Skim the network architecture comparison. Read the simulation benchmark summary and the real robot tasks.
questions:
  - id: claim
    kind: claim
    prompt: What does the paper claim, and what problem with earlier policy representations does it target?
  - id: method
    kind: method
    prompt: How does a diffusion policy produce an action? Explain the denoising steps, what they are conditioned on, and why it predicts a sequence of actions.
  - id: evidence
    kind: evidence
    prompt: What evidence supports the claim? Look at the benchmark comparison and the real robot experiments.
  - id: limitations
    kind: limitations
    prompt: Denoising takes many network evaluations per action. What does that cost in speed, and how does the paper deal with it?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: "States the claim: representing a policy as a conditional denoising diffusion process over action sequences beats earlier policy types"
      weight: 2
      required: true
    - id: r2
      criterion: "Explains the mechanism: start from noise and iteratively denoise an action sequence conditioned on recent observations; this captures multiple valid behaviours instead of averaging them"
      weight: 2
      required: true
    - id: r3
      criterion: "Describes the evidence: large average improvement over prior methods across simulated benchmark tasks, plus real robot tasks"
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. slower inference from many denoising steps, or needing demonstrations for every task
      weight: 1
      required: false
  exemplar: "Chi and colleagues target a problem with earlier imitation policies: when demonstrations show several valid ways to do a task, a policy that predicts a single action tends to average them, which can be invalid. Diffusion Policy starts from random noise and denoises it step by step into a sequence of future actions, conditioned on the robot's recent camera images and state. Because it models the full distribution of actions, it can commit to one of several valid behaviours, and predicting sequences gives smoother, more consistent motion. Across a dozen simulated tasks it beat earlier methods by a large average margin, and it worked on real robot tasks. A limitation is speed: each action needs many network evaluations unless faster sampling methods are used."
