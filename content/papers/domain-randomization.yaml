id: domain-randomization
title: Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World
authors: Tobin et al.
year: 2017
week: 9
est_minutes: 45
source:
  arxiv: 1703.06907v1
concepts:
  - perception-pipelines
  - camera-geometry
  - sensors
why_this_week: This week you meet perception pipelines and camera geometry. Real labelled images are expensive, and simulated ones look fake, so models trained on them often fail on real cameras. This short paper's answer is to randomise the simulation so heavily that the real world looks like just another variation. The idea reappears in nearly every sim-to-real result since.
how_to_read: The paper is short, so read it all. Pay most attention to the list of what is randomised and to the figure of example training images. Read the experiments on object localisation accuracy and the grasping demonstration. Note how the experiments vary the number of training images and which randomisations are used.
questions:
  - id: claim
    kind: claim
    prompt: What is the main claim about training only on simulated images?
  - id: method
    kind: method
    prompt: What exactly is randomised in the simulated images, and why should that help on real camera images?
  - id: evidence
    kind: evidence
    prompt: How accurate is the detector on real images, and which experiments show which randomisations matter?
  - id: limitations
    kind: limitations
    prompt: The objects and scenes are simple. What would you need to see before trusting this on cluttered, real household scenes?
summary:
  prompt: In about five sentences, explain to a classmate what problem this paper tackles, its key idea, the main evidence that it works, and one limitation.
  rubric:
    - id: r1
      criterion: States the claim that a detector trained only on randomised simulated images can locate objects in real images
      weight: 2
      required: true
    - id: r2
      criterion: "Explains the idea: randomise textures, lighting, camera position and distractor objects so the real world is just one more variation"
      weight: 2
      required: true
    - id: r3
      criterion: "Describes the evidence: localisation accuracy of around a few centimetres on real images, ablations over randomisations, and a grasping demo"
      weight: 1
      required: false
    - id: r4
      criterion: Names a real limitation, e.g. simple shapes and scenes, or a single camera setup
      weight: 1
      required: false
  exemplar: "Tobin and colleagues ask whether an object detector can be trained only on simulated images and still work on a real camera. Instead of making the simulator realistic, they randomise it heavily: object textures, lighting, camera position and the number and shape of distractor objects all change in every image. The idea is that if the network has seen huge variety, the real world is just one more variation. Their detector located objects in real images to within a few centimetres and was accurate enough to grasp objects in clutter, and ablations show which randomisations matter most. A limitation is that the objects were simple geometric shapes on a table, so it does not show the method works for complex real scenes."
